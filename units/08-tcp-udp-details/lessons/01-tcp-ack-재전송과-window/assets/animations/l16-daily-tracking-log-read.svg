<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>배송 기록표를 한 줄씩 읽어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">배송 기록표를 한 줄씩 읽어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">표식을 보고 먼저 물을 질문을 골라요</text>
<text x="60" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">번호</text><text x="120" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">방향</text><text x="330" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">내용</text><text x="520" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">표식</text><line x1="40" y1="160" x2="920" y2="160" stroke="#3d4b60" stroke-width="2"/><g><rect x="40" y="174" width="880" height="52" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="62" y="207" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">1</text><text x="120" y="206" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">상자 → 받는 곳</text><text x="330" y="206" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">2번 상자가 먼저 도착</text><rect x="515" y="184" width="150" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="590" y="205.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">순서 뒤바뀜</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="170" width="888" height="60" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">먼저 확인할 질문: 도착 순서와 번호 순서가 어디서 달라졌나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="236" width="880" height="52" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="2"/><text x="62" y="269" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">2</text><text x="120" y="268" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">받는 곳 → 보내는 곳</text><text x="330" y="268" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">“1번 주세요”</text><rect x="515" y="246" width="150" height="31" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="590" y="267.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">같은 소식 반복</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="232" width="888" height="60" rx="8" fill="none" stroke="#c792ea" stroke-width="5"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">먼저 확인할 질문: 받는 사람은 다음에 어떤 상자를 기다리나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="298" width="880" height="52" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="62" y="331" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">3</text><text x="120" y="330" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">상자 → 받는 곳</text><text x="330" y="330" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">1번 상자가 다시 도착</text><rect x="515" y="308" width="150" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="590" y="329.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">다시 배송</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="294" width="888" height="60" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">먼저 확인할 질문: 같은 상자 번호를 다시 보냈나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="360" width="880" height="52" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="62" y="393" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">4</text><text x="120" y="392" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">받는 곳 → 보내는 곳</text><text x="330" y="392" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">“3번 주세요”</text><rect x="515" y="370" width="150" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="590" y="391.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">정상 확인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="356" width="888" height="60" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">먼저 확인할 질문: 어느 상자까지 확인됐나?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">2번 상자가 먼저 왔다면 도착 순서가 어디서 달라졌는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">“1번 주세요”가 반복되면 받는 사람이 기다리는 상자를 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1번 상자가 다시 왔다면 같은 번호를 다시 보낸 거예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">“3번 주세요”로 어디까지 확인됐는지 알 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>