<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>표식 하나, 가능한 이유는 여럿</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">표식 하나, 가능한 이유는 여럿</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">원인을 단정하기 전에 주변 자료를 함께 봐요</text>
<g><rect x="40" y="135" width="280" height="285" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="85" y="154" width="190" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="180" y="178.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">재전송</text><text x="180" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">가능한 이유</text><text x="180" y="260" text-anchor="middle" font-size="16" fill="#e6e8ec">· 데이터가 도중에 사라짐</text><text x="180" y="304" text-anchor="middle" font-size="16" fill="#e6e8ec">· 데이터는 갔고 ACK가 늦음</text><line x1="60" y1="352" x2="300" y2="352" stroke="#3d4b60" stroke-width="2"/><text x="180" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">함께 볼 것</text><text x="180" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">캡처 위치와 지연도 함께 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="135" width="280" height="285" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="385" y="154" width="190" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="178.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">제로 윈도</text><text x="480" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">가능한 이유</text><text x="480" y="260" text-anchor="middle" font-size="16" fill="#e6e8ec">· 수신 프로그램이 늦게 읽음</text><text x="480" y="304" text-anchor="middle" font-size="16" fill="#e6e8ec">· 연결 종료나 인터넷 정지는 아님</text><line x1="360" y1="352" x2="600" y2="352" stroke="#3d4b60" stroke-width="2"/><text x="480" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">함께 볼 것</text><text x="480" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">읽는 속도와 버퍼 상태를 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="135" width="280" height="285" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="685" y="154" width="190" height="35" rx="18" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="780" y="178.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">중복 ACK</text><text x="780" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">가능한 이유</text><text x="780" y="260" text-anchor="middle" font-size="16" fill="#e6e8ec">· 빠진 구간이 있을 수 있음</text><text x="780" y="304" text-anchor="middle" font-size="16" fill="#e6e8ec">· 앞 구간이 차면 이어서 받음</text><line x1="660" y1="352" x2="900" y2="352" stroke="#3d4b60" stroke-width="2"/><text x="780" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">함께 볼 것</text><text x="780" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">순서 번호와 도착 순서를 비교해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="198" y="436" width="564" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">표식 하나만으로 경로 문제인지 애플리케이션 문제인지 단정하지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재전송은 데이터가 사라졌을 때도, ACK가 늦었을 때도 보일 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">제로 윈도는 수신 프로그램이 읽는 속도와 버퍼 상태를 살펴보라는 신호예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중복 ACK는 빠진 구간이 있을 가능성을 알려 주는 단서예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">표식 하나로 원인을 정하지 말고 주변 상황과 함께 살펴요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>