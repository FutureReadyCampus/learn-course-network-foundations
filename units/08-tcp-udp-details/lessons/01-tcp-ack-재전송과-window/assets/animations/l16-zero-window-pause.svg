<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>제로 윈도는 잠시 멈추라는 뜻</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">제로 윈도는 잠시 멈추라는 뜻</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">연결 종료(FIN)와는 달라요</text>
<rect x="76" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="66,282 154,282 162,294 58,294" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">송신 측</text><rect x="816" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="241" width="52" height="32" fill="#3d4b60"/><rect x="845" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="290" width="44" height="5" fill="#6ea8fe"/><text x="850" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">프로그램</text><rect x="420" y="140" width="120" height="260" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480.0" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">수신 버퍼</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="423" y="219.20000000000002" width="114" height="177.79999999999998" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="190" y1="270" x2="394" y2="270" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,270 386,259 386,281" fill="#6ea8fe"/><rect x="434" y="414" width="93" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">윈도 30%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="423" y="143.0" width="114" height="254.0" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><circle cx="300" cy="270" r="16" fill="#ff7b72"/><path d="M293 263 l14 14 M307 263 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="442" y="414" width="77" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480.0" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">윈도 0</text><text x="300" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">잠시 멈춰요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="423" y="282.7" width="114" height="114.3" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="550" y1="270" x2="774" y2="270" stroke="#7ee7c7" stroke-width="5"/><polygon points="790,270 766,259 766,281" fill="#7ee7c7"/><text x="670" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">읽어 가요</text><rect x="434" y="414" width="93" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">윈도 55%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="423" y="282.7" width="114" height="114.3" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="190" y1="270" x2="394" y2="270" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,270 386,259 386,281" fill="#6ea8fe"/><rect x="391" y="414" width="179" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">윈도가 다시 열렸어요</text><rect x="577" y="184" width="227" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="690" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결을 닫은 것이 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수신 버퍼가 많이 차 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">버퍼가 가득 차면 윈도 0을 알려 새 데이터를 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 읽으면 공간이 다시 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">윈도가 열리면 전송이 이어져요</text></g>

