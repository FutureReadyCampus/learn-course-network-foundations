<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>송수신 길 위에 캡처 표식 놓기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">송수신 길 위에 캡처 표식 놓기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">표식마다 살펴볼 곳이 달라요</text>
<rect x="30" y="190" width="164" height="84" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="112.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">송신 프로그램</text><text x="112.0" y="258" text-anchor="middle" font-size="14" fill="#9aa3b2">송신 버퍼</text><rect x="214" y="190" width="164" height="84" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="296.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">송신 TCP</text><text x="296.0" y="258" text-anchor="middle" font-size="14" fill="#9aa3b2">세그먼트·순서 번호</text><rect x="398" y="190" width="164" height="84" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">네트워크 경로</text><text x="480.0" y="258" text-anchor="middle" font-size="14" fill="#9aa3b2">IP 패킷·프레임</text><rect x="582" y="190" width="164" height="84" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="664.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">수신 TCP</text><text x="664.0" y="258" text-anchor="middle" font-size="14" fill="#9aa3b2">ACK·수신 윈도</text><rect x="766" y="190" width="164" height="84" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="848.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">수신 버퍼</text><text x="848.0" y="258" text-anchor="middle" font-size="14" fill="#9aa3b2">프로그램이 읽어요</text><line x1="196" y1="232" x2="226" y2="232" stroke="#9aa3b2" stroke-width="3"/><polygon points="242,232 218,223 218,241" fill="#9aa3b2"/><line x1="380" y1="232" x2="410" y2="232" stroke="#9aa3b2" stroke-width="3"/><polygon points="426,232 402,223 402,241" fill="#9aa3b2"/><line x1="564" y1="232" x2="594" y2="232" stroke="#9aa3b2" stroke-width="3"/><polygon points="610,232 586,223 586,241" fill="#9aa3b2"/><line x1="748" y1="232" x2="778" y2="232" stroke="#9aa3b2" stroke-width="3"/><polygon points="794,232 770,223 770,241" fill="#9aa3b2"/><text x="112" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Unit 4</text><text x="296" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Unit 7</text><text x="480" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Unit 5·6</text><text x="664" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Unit 8</text><text x="848" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Unit 4</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">앞에서 배운 길 위에 캡처 표식을 하나씩 놓아 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="221" y="314" width="150" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="296" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">재전송</text><rect x="405" y="314" width="150" height="32" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">손실 세그먼트</text><line x1="296" y1="276" x2="296" y2="312" stroke="#ffb454" stroke-width="3"/><line x1="480" y1="276" x2="480" y2="312" stroke="#ff7b72" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="589" y="314" width="150" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="664" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">순서 어긋남</text><rect x="589" y="369" width="150" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="664" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">중복 ACK</text><line x1="664" y1="276" x2="664" y2="312" stroke="#6ea8fe" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="773" y="314" width="150" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="848" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">제로 윈도</text><line x1="848" y1="276" x2="848" y2="312" stroke="#7ee7c7" stroke-width="3"/><rect x="265" y="432" width="430" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">표식은 길 위에서 어디를 살펴볼지 짚어 주는 단서예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Unit 4부터 이어 온 송신에서 수신까지의 길이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재전송과 손실 세그먼트는 보낸 뒤 확인 단계에서 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">순서 어긋남과 중복 ACK는 받는 쪽 TCP 근처에서 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">제로 윈도는 수신 버퍼가 가득 찼다고 알릴 때 보여요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>