<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>뒤쪽 상자가 먼저 와도 건너뛰지 않아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">뒤쪽 상자가 먼저 와도 건너뛰지 않아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">빈 구간이 채워져야 순서대로 전달해요</text>
<circle cx="110" cy="230" r="16" fill="#6ea8fe"/><rect x="92" y="250" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">보내는 사람</text><rect x="610" y="130" width="310" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="765" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">받는 사람</text><rect x="650" y="185" width="110" height="50" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><rect x="650" y="255" width="110" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="8 6"/><rect x="650" y="335" width="230" height="50" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="765" y="367" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">담당 직원</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="230,210;230,210;400,210;400,210" keyTimes="0.000;0.025;0.150;1.000" dur="15s" repeatCount="indefinite"/><rect x="-46" y="-20" width="92" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">1번 상자</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.162;0.177;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="400" cy="210" r="16" fill="#ff7b72"/><path d="M393 203 l14 14 M407 203 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="230,280;230,280;705,280;705,280" keyTimes="0.000;0.025;0.212;1.000" dur="15s" repeatCount="indefinite"/><rect x="-46" y="-20" width="92" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="0.0" y="5.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">2번 상자</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="650" y="255" width="110" height="50" rx="8" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">2번 상자</text><text x="820" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">보관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="650" y="185" width="110" height="50" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="705" y="216" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">?</text><rect x="650" y="394" width="230" height="31" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="765" y="415.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">건너뛰어 전달 못 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="610,330;610,330;230,330;230,330" keyTimes="0.000;0.512;0.625;1.000" dur="15s" repeatCount="indefinite"/><rect x="-76" y="-16" width="152" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="5.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">다음은 1번이에요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="610,330;610,330;230,330;230,330" keyTimes="0.000;0.600;0.713;1.000" dur="15s" repeatCount="indefinite"/><rect x="-76" y="-16" width="152" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="5.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">다음은 1번이에요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="400" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">같은 소식이 반복돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="230,210;230,210;705,210;705,210" keyTimes="0.000;0.775;0.925;1.000" dur="15s" repeatCount="indefinite"/><rect x="-46" y="-20" width="92" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">1번 상자</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="650" y="185" width="110" height="50" rx="8" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="705" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">1번 상자</text><rect x="650" y="255" width="110" height="50" rx="8" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">2번 상자</text><circle cx="900" cy="360" r="16" fill="#7ee7c7"/><path d="M892 360 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="400" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">이어지면 한꺼번에 전달해요 (3번을 주세요)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1번이 사라지고 2번이 먼저 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">2번은 보관하지만 1번을 건너뛰어 전달하지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 사람은 “다음은 1번”이라고 같은 소식을 반복해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1번이 도착해 이어지면 한꺼번에 전달해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>