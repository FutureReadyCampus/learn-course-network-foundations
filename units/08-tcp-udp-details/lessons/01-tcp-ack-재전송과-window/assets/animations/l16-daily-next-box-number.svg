<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>다음에 받을 번호를 알려 줘요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">다음에 받을 번호를 알려 줘요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">1·2번까지 연속해서 받았다는 뜻이에요</text>
<rect x="40" y="125" width="190" height="290" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="135" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">보내는 사람</text><rect x="730" y="125" width="190" height="290" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="825" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">받는 사람</text><text x="480" y="150" text-anchor="middle" font-size="17" fill="#9aa3b2">상자 →</text><line x1="235" y1="380" x2="725" y2="380" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="410" text-anchor="middle" font-size="17" fill="#9aa3b2">← 수령 문자</text><rect x="768" y="170" width="100" height="52" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><rect x="768" y="236" width="100" height="52" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><rect x="768" y="302" width="100" height="52" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="818" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">?</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g transform="translate(135,330)"><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">3번</text></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="135,196;135,196;818,196;818,196" keyTimes="0.000;0.025;0.175;1.000" dur="15s" repeatCount="indefinite"/><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">1번</text></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="135,262;135,262;818,262;818,262" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">2번</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><g transform="translate(818,196)"><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">1번</text></g><g transform="translate(818,262)"><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">2번</text></g><circle cx="895" cy="196" r="16" fill="#7ee7c7"/><path d="M887 196 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="895" cy="262" r="16" fill="#7ee7c7"/><path d="M887 262 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="780,380;780,380;200,380;200,380" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-60" y="-18" width="120" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="6.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">3번 주세요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="75" y="362" width="120" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="135" y="386.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">3번 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="135,330;135,330;780,330;780,330" keyTimes="0.000;0.775;0.950;1.000" dur="15s" repeatCount="indefinite"/><rect x="-32" y="-22" width="64" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">3번</text></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보내는 사람이 1번, 2번 상자를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 사람 칸에 1번, 2번이 도착했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 사람이 “3번 주세요”라고 수령 문자를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞은 받았으니 3번 상자가 출발해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>