<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>캡처 표식마다 질문을 골라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">캡처 표식마다 질문을 골라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">표식 하나로 원인을 단정하지 않아요</text>
<text x="210" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">표식</text><text x="560" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">먼저 확인할 질문</text><g><rect x="45" y="158" width="330" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="210" y="181.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">손실 세그먼트</text><line x1="390" y1="175" x2="424" y2="175" stroke="#9aa3b2" stroke-width="3"/><polygon points="440,175 416,166 416,184" fill="#9aa3b2"/><text x="460" y="181" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">어떤 바이트 범위가 아직 확인되지 않았나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.215;1" dur="20s" repeatCount="indefinite"/><rect x="45" y="214" width="330" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="210" y="236.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">재전송</text><line x1="390" y1="230" x2="424" y2="230" stroke="#9aa3b2" stroke-width="3"/><polygon points="440,230 416,221 416,239" fill="#9aa3b2"/><text x="460" y="236" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">같은 순서 번호 범위가 다시 전송됐나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.415;1" dur="20s" repeatCount="indefinite"/><rect x="45" y="268" width="330" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="210" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">순서가 어긋난 데이터</text><line x1="390" y1="285" x2="424" y2="285" stroke="#9aa3b2" stroke-width="3"/><polygon points="440,285 416,276 416,294" fill="#9aa3b2"/><text x="460" y="291" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">도착 순서와 바이트 순서가 어디서 달라졌나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.615;1" dur="20s" repeatCount="indefinite"/><rect x="45" y="324" width="330" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="210" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">중복 ACK</text><line x1="390" y1="340" x2="424" y2="340" stroke="#9aa3b2" stroke-width="3"/><polygon points="440,340 416,331 416,349" fill="#9aa3b2"/><text x="460" y="346" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">수신 측은 다음에 어떤 바이트를 기다리나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.815;1" dur="20s" repeatCount="indefinite"/><rect x="45" y="378" width="330" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="210" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">제로 윈도</text><line x1="390" y1="395" x2="424" y2="395" stroke="#9aa3b2" stroke-width="3"/><polygon points="440,395 416,386 416,404" fill="#9aa3b2"/><text x="460" y="401" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">수신 측이 더 받을 공간이 없다고 알렸나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.815;1" dur="20s" repeatCount="indefinite"/><rect x="296" y="438" width="367" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">표식 하나만으로 원인을 단정하지는 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.185;0.200;1" dur="20s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손실 세그먼트는 확인되지 않은 범위를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.215;0.385;0.400;1" dur="20s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재전송은 같은 번호 범위인지 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.415;0.585;0.600;1" dur="20s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Out of order는 어디서 순서가 달라졌는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.615;0.785;0.800;1" dur="20s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중복 ACK는 수신 측이 기다리는 바이트를 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.815;1" dur="20s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">제로 윈도는 공간이 없다고 알렸는지 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="5"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;169.6;169.6" keyTimes="0;0.200000;1" dur="20s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="217.6" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="217.6" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.200000;0.400000;1" dur="20s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="395.2" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="395.2" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.400000;0.600000;1" dur="20s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="572.8" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="572.8" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.600000;0.800000;1" dur="20s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="5"><rect x="750.4" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="750.4" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6" keyTimes="0;0.800000;1" dur="20s" repeatCount="indefinite"/></rect></g></g></svg>