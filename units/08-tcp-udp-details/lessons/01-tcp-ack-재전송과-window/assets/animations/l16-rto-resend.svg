<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>RTO가 지나면 다시 전송해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">RTO가 지나면 다시 전송해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">타임아웃은 손실 확정이 아니라 기다릴 시간이 지났다는 뜻이에요</text>
<rect x="76" y="196" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="203" width="52" height="30" fill="#3d4b60"/><polygon points="66,242 154,242 162,254 58,254" fill="#6ea8fe"/><text x="110" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">송신 측</text><rect x="816" y="194" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="201" width="52" height="32" fill="#3d4b60"/><rect x="845" y="240" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="250" width="44" height="5" fill="#6ea8fe"/><text x="850" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">수신 측</text><line x1="190" y1="245" x2="770" y2="245" stroke="#3d4b60" stroke-width="3"/><line x1="200" y1="372" x2="760" y2="372" stroke="#3d4b60" stroke-width="2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,245;250,245;480,245;480,245" keyTimes="0.000;0.025;0.150;1.000" dur="16s" repeatCount="indefinite"/><rect x="-52" y="-20" width="104" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">1001~1500</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.175;0.190;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="245" r="16" fill="#ff7b72"/><path d="M473 238 l14 14 M487 238 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="397" y="174" width="166" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">도중에 사라졌어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="110" cy="150" r="16" fill="#ffb454"/><text x="110" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><rect x="396" y="174" width="169" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ACK가 오지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="372" width="134" height="22" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.312;0.328;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="372" width="134" height="22" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.390;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="480" y="372" width="134" height="22" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.438;0.453;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="620" y="372" width="134" height="22" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="358" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">RTO 동안 기다려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="398" y="174" width="164" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">RTO가 만료됐어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,245;250,245;740,245;740,245" keyTimes="0.000;0.537;0.713;1.000" dur="16s" repeatCount="indefinite"/><rect x="-52" y="-20" width="104" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">1001~1500</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 순서 번호 범위를 다시 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="180" r="16" fill="#7ee7c7"/><path d="M842 180 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="480" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">RTO는 RTT 표본 등으로 조정돼요</text><text x="480" y="335" text-anchor="middle" font-size="16" fill="#9aa3b2">(ping 결과와 같은 값은 아니에요)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세그먼트가 도중에 사라졌어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">확인 응답(ACK)이 오지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재전송 타임아웃(RTO)이 만료돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 순서 번호 범위를 다시 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>