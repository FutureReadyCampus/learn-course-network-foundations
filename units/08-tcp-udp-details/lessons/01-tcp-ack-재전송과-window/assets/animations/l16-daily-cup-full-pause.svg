<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>컵이 가득 차면 잠시 멈춰요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">컵이 가득 차면 잠시 멈춰요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">다 마시면 다시 따를 수 있어요</text>
<circle cx="110" cy="235" r="16" fill="#6ea8fe"/><rect x="92" y="255" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">물 따르는 사람</text><circle cx="850" cy="235" r="16" fill="#6ea8fe"/><rect x="832" y="255" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">마시는 사람</text><rect x="420" y="140" width="120" height="260" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480.0" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">컵</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="423" y="219.20000000000002" width="114" height="177.79999999999998" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="190" y1="270" x2="394" y2="270" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,270 386,259 386,281" fill="#6ea8fe"/><rect x="414" y="414" width="132" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">남은 자리 조금</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="423" y="143.0" width="114" height="254.0" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><circle cx="300" cy="270" r="16" fill="#ff7b72"/><path d="M293 263 l14 14 M307 263 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="411" y="414" width="138" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480.0" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">남은 자리 없음</text><text x="300" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">잠시 멈춰요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="423" y="282.7" width="114" height="114.3" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="550" y1="270" x2="774" y2="270" stroke="#7ee7c7" stroke-width="5"/><polygon points="790,270 766,259 766,281" fill="#7ee7c7"/><text x="670" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">마셔요</text><rect x="414" y="414" width="132" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">남은 자리 생김</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="423" y="282.7" width="114" height="114.3" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><line x1="190" y1="270" x2="394" y2="270" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,270 386,259 386,281" fill="#6ea8fe"/><rect x="406" y="414" width="147" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">다시 따라도 돼요</text><rect x="577" y="184" width="227" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="690" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결을 닫은 것이 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">컵에 물이 많이 차 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">컵이 가득 차서 잠시 따르기를 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마시면 자리가 다시 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자리가 생기면 다시 따라요</text></g>

