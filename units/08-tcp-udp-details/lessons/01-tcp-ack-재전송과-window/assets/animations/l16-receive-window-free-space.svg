<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>수신 윈도는 남은 버퍼 공간</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">수신 윈도는 남은 버퍼 공간</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 칸은 설명용 단위예요</text>
<rect x="300" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="352" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="404" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="456" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="508" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="560" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="612" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="664" y="290" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="505" y="388" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">수신 버퍼</text><rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">송신 측</text><rect x="816" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="261" width="52" height="32" fill="#3d4b60"/><rect x="845" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="310" width="44" height="5" fill="#6ea8fe"/><text x="850" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">프로그램</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="352" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="404" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><line x1="456" y1="282" x2="710" y2="282" stroke="#7ee7c7" stroke-width="4"/><line x1="456" y1="282" x2="456" y2="294" stroke="#7ee7c7" stroke-width="4"/><line x1="710" y1="282" x2="710" y2="294" stroke="#7ee7c7" stroke-width="4"/><rect x="536" y="240" width="93" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="583.0" y="262.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">윈도 5칸</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="352" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="404" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="456" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="508" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="560" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><line x1="612" y1="282" x2="710" y2="282" stroke="#7ee7c7" stroke-width="4"/><line x1="612" y1="282" x2="612" y2="294" stroke="#7ee7c7" stroke-width="4"/><line x1="710" y1="282" x2="710" y2="294" stroke="#7ee7c7" stroke-width="4"/><rect x="614" y="240" width="93" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="661.0" y="262.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">윈도 2칸</text><rect x="794" y="184" width="111" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="850" y="205.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">늦게 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="352" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="404" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><line x1="456" y1="282" x2="710" y2="282" stroke="#7ee7c7" stroke-width="4"/><line x1="456" y1="282" x2="456" y2="294" stroke="#7ee7c7" stroke-width="4"/><line x1="710" y1="282" x2="710" y2="294" stroke="#7ee7c7" stroke-width="4"/><rect x="536" y="240" width="93" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="583.0" y="262.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">윈도 5칸</text><line x1="800" y1="320" x2="756" y2="320" stroke="#7ee7c7" stroke-width="5"/><polygon points="740,320 764,309 764,331" fill="#7ee7c7"/><text x="770" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">읽어 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="352" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="404" y="290" width="46" height="60" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><rect x="126" y="423" width="248" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">흐름 제어: 받는 쪽 공간은?</text><rect x="560" y="423" width="260" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="690" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">혼잡 제어: 경로가 감당할까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수신 버퍼에 3칸이 차 있고 윈도는 5칸이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 늦게 읽으면 윈도가 2칸으로 줄어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">읽어 가면 윈도가 다시 늘어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">흐름 제어는 받는 쪽 공간, 혼잡 제어는 경로를 살펴요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>