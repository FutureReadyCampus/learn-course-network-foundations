<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>둘이 같이 일하면 한 대가 빠질 때는?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">둘이 같이 일하면 한 대가 빠질 때는?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">액티브/액티브는 평소엔 빠르지만 여유가 필요해요</text>
<circle cx="70" cy="242" r="16" fill="#6ea8fe"/><rect x="52" y="262" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="70" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="710" y="205" width="170" height="100" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="795" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서버 풀</text><text x="795" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">.11~.13</text><line x1="130" y1="285" x2="345" y2="168" stroke="#3d4b60" stroke-width="3"/><line x1="130" y1="285" x2="345" y2="342" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="168" x2="710" y2="245" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="342" x2="710" y2="270" stroke="#3d4b60" stroke-width="3"/><rect x="345.0" y="138.0" width="170" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="345" y="208" width="170" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="345.0" y="312.0" width="170" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="348" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><rect x="345" y="382" width="170" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="208" width="102" height="18" rx="5" fill="#7ee7c7"/><text x="430" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">60%(가정)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="382" width="102" height="18" rx="5" fill="#7ee7c7"/><text x="430" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">60%(가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="138.0" width="170" height="60" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="430" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><text x="430" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">고장</text><circle cx="520" cy="140" r="16" fill="#ff7b72"/><path d="M513 133 l14 14 M527 133 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="130" width="178" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="382" width="170" height="18" rx="5" fill="#ff7b72"/><text x="430" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">120%(가정) 넘쳐요</text><circle cx="520" cy="314" r="16" fill="#ff7b72"/><path d="M513 307 l14 14 M527 307 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="374" width="178" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="592" y="384" width="300" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="742" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">평소 50% 이하로 써요(가정)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소엔 두 장비가 60%씩 나눠 일해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 A가 고장 났어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남은 장비 B가 두 대 몫을 맡아 넘쳐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소 50% 이하여야 한 대가 빠져도 버텨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>