<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>두 대를 뒀는데 왜 같이 멈췄을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">두 대를 뒀는데 왜 같이 멈췄을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">스위치 하나를 함께 쓰면 새 단일 장애점이 돼요</text>
<rect x="40" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">같은 스위치에 연결</text><rect x="500" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">스위치를 나눔</text><rect x="80.0" y="174.0" width="140" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="280.0" y="174.0" width="140" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><rect x="540.0" y="174.0" width="140" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="740.0" y="174.0" width="140" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><line x1="150" y1="226" x2="220" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="350" y1="226" x2="280" y2="280" stroke="#3d4b60" stroke-width="3"/><rect x="194" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">스위치 1대</text><line x1="610" y1="226" x2="610" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="810" y1="226" x2="810" y2="280" stroke="#3d4b60" stroke-width="3"/><rect x="554" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">스위치 1</text><rect x="754" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">스위치 2</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="194" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="250" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">멈춤</text><rect x="554" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="610" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">멈춤</text><rect x="340" y="438" width="280" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">스위치 펌웨어를 올리는 날</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="194" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="250" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">멈춤</text><rect x="554" y="280" width="112" height="40" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="610" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">멈춤</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="186" y="272" width="128" height="56" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="272" width="128" height="56" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="250" cy="365" r="16" fill="#ff7b72"/><path d="M243 358 l14 14 M257 358 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="155" y="390" width="190" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="410.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">두 대가 함께 끊겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="710" cy="365" r="16" fill="#7ee7c7"/><path d="M702 365 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="615" y="390" width="190" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="410.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">장비 B는 이어 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="342" width="228" height="80" rx="14" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="438" width="440" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">중요한 건 개수가 아니라 따로 고장 나는가예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 두 대를 같은 스위치에 꽂았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치 한 대가 멈췄어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">왼쪽은 둘 다, 오른쪽은 한 대만 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공통 지점을 나눠야 이중화예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>