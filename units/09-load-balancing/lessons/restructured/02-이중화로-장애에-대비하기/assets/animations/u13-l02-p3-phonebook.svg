<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>대표 번호는 책상이 아니라 당직 자리에</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">대표 번호는 책상이 아니라 당직 자리에</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소록이 옛 장비를 가리키면 넘겨받아도 소용없어요</text>
<text x="190" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">이웃 장비</text><rect x="40" y="215" width="300" height="150" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="190" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">이웃 장비의 주소록</text><text x="190" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">203.0.113.10</text><text x="190" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">→ 장비 A</text><rect x="665.0" y="160.0" width="150" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="740" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="665.0" y="330.0" width="150" height="60" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="740" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text><line x1="340" y1="270" x2="665" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="340" y1="310" x2="665" y2="360" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="215" width="300" height="150" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="190" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">이웃 장비의 주소록</text><text x="190" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">203.0.113.10</text><text x="190" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">→ 장비 A</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="360,262;360,262;640,200;640,200" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><circle cx="520" cy="200" r="16" fill="#7ee7c7"/><path d="M512 200 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="665.0" y="160.0" width="150" height="60" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="740" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><circle cx="850" cy="190" r="16" fill="#ff7b72"/><path d="M843 183 l14 14 M857 183 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="740" y="244" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">멈춤</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="154" width="168" height="72" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="665.0" y="330.0" width="150" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="740" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><rect x="650" y="404" width="180" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="740" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">VIP를 넘겨받음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="324" width="168" height="72" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="360,262;360,262;640,200;640,200" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="520" cy="215" r="16" fill="#ff7b72"/><path d="M513 208 l14 14 M527 208 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="520" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">빈 장비로 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="215" width="300" height="150" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="190" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">이웃 장비의 주소록</text><text x="190" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">203.0.113.10</text><text x="190" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">→ 장비 B</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="360,318;360,318;640,352;640,352" keyTimes="0.000;0.775;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><circle cx="520" cy="360" r="16" fill="#7ee7c7"/><path d="M512 360 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="190" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">주소록 갱신을 알려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="310" width="268" height="46" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소록에는 대표 번호가 장비 A로 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 A가 멈춰도 주소록은 그대로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 B가 넘겨받아도 요청은 옛 장비로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소록을 갱신하면 요청이 장비 B로 가요</text></g>

