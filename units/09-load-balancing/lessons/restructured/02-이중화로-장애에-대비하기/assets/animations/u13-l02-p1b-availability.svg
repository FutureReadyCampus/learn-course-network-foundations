<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>99.9%는 얼마나 멈춰도 된다는 뜻일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">99.9%는 얼마나 멈춰도 된다는 뜻일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">빨간 칸이 1년 중 멈춰도 되는 시간이에요 (실제보다 크게 그렸어요)</text>
<text x="80" y="132" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">1년 = 365일 (전체 시간) · 가용성 = 정상 시간 ÷ 전체 시간</text><rect x="80" y="142" width="800" height="30" rx="5" fill="#7ee7c7" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="80" y="212" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">가용성 99.9% → 전체의 0.1%가 멈춰도 돼요</text><rect x="80" y="222" width="800" height="30" rx="5" fill="#7ee7c7" stroke="#3d4b60" stroke-width="2"/><rect x="875" y="222" width="5" height="30" rx="2" fill="#ff7b72"/><line x1="878" y1="252" x2="878" y2="274" stroke="#ff7b72" stroke-width="3"/><rect x="580" y="276" width="300" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="730" y="298.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">멈춰도 되는 시간: 약 8.8시간</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="864" y="214" width="32" height="46" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="80" y="335" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">가용성 99.99% → 전체의 0.01%가 멈춰도 돼요</text><rect x="80" y="345" width="800" height="30" rx="5" fill="#7ee7c7" stroke="#3d4b60" stroke-width="2"/><rect x="875" y="345" width="5" height="30" rx="2" fill="#ff7b72"/><line x1="878" y1="375" x2="878" y2="397" stroke="#ff7b72" stroke-width="3"/><rect x="580" y="398" width="300" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="730" y="421.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">멈춰도 되는 시간: 약 53분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="864" y="337" width="32" height="46" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="441" width="480" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="464.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">숫자가 높을수록 멈춰도 되는 시간이 짧아져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가용성은 정상으로 쓴 시간의 비율이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">99.9%는 1년에 약 8.8시간까지 멈춰도 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">99.99%는 약 53분까지만 멈춰도 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">숫자가 높을수록 멈춤이 짧아져요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>