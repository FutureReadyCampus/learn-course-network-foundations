<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버는 멀쩡한데 왜 멈췄을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버는 멀쩡한데 왜 멈췄을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">손님이 지나는 길에서 한 곳이 막힌 거예요</text>
<circle cx="80" cy="265" r="16" fill="#6ea8fe"/><rect x="62" y="285" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><line x1="130" y1="300" x2="330" y2="300" stroke="#3d4b60" stroke-width="3"/><rect x="330.0" y="268.0" width="160" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="410" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><line x1="490" y1="300" x2="735" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="490" y1="300" x2="735" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="490" y1="300" x2="735" y2="410" stroke="#3d4b60" stroke-width="3"/><rect x="738.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="747.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="807" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="738.0" y="277.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="747.0" y="287.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="807" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="738.0" y="387.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="747.0" y="397.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="807" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="370" y="124" width="220" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서버 3대 모두 정상</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330.0" y="268.0" width="160" height="64" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="410" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">로드 밸런서</text><text x="410" y="358" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">멈춤</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="321" y="259" width="178" height="82" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,300;140,300;300,300;300,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="320" cy="262" r="16" fill="#ff7b72"/><path d="M313 255 l14 14 M327 255 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="705" y="124" width="190" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="145.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서버는 멀쩡해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="198" width="220" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="410" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">단일 장애점 (SPOF)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="194" width="228" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="438" width="320" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">한 곳이 멈추면 전체가 멈춰요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 로드 밸런서를 지나 서버로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로드 밸런서 한 대가 멈췄어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 멀쩡해도 손님은 못 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이런 한 곳을 단일 장애점이라 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>