<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>수리를 5일이나 기다려야 할까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">수리를 5일이나 기다려야 할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버를 VM으로 돌리면 틀에서 바로 만들 수 있어요</text>
<rect x="70" y="255" width="160" height="80" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="150" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">VM 이미지</text><text x="150" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">(미리 만든 틀)</text><rect x="520" y="125" width="400" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="720.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">서버 풀</text><rect x="560.0" y="192.0" width="150" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="569.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="642" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="730.0" y="192.0" width="150" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="739.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="812" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="560.0" y="292.0" width="150" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="569.0" y="302.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="642" y="321" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text><g><rect x="560.0" y="192.0" width="150" height="46" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="569.0" y="202.0" width="6" height="26" rx="3" fill="#ff7b72"/><text x="642" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><circle cx="725" cy="195" r="16" fill="#ff7b72"/><path d="M718 188 l14 14 M732 188 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="575" y="246" width="120" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="635" y="267.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">수리 5일</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="555" y="184" width="162" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="730.0" y="292.0" width="150" height="46" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><rect x="739.0" y="302.0" width="6" height="26" rx="3" fill="#ffb454"/><text x="812" y="321" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="364" width="220" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="150" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">이미지에서 몇 분(가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,295;240,295;500,315;725,315;725,315" keyTimes="0.000;0.275;0.375;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="730.0" y="292.0" width="150" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="739.0" y="302.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="812" y="321" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 4</text><circle cx="895" cy="295" r="16" fill="#7ee7c7"/><path d="M887 295 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="740" y="346" width="130" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="805" y="367.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">/health 통과</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="725" y="284" width="162" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="438" width="380" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">틀로 찍어 내면 기다리는 시간이 줄어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 .11이 고장 나 수리에 5일이 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이미지로 새 서버를 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">준비 확인을 통과하면 풀에 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">VM은 틀로 찍어 내듯 복제해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>