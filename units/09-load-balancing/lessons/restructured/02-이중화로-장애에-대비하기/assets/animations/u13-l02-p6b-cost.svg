<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>클라우드로 늘리면 무엇을 치를까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">클라우드로 늘리면 무엇을 치를까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">넘치는 몫을 빌리는 대신 세 가지 대가를 따져요</text>
<rect x="80" y="130" width="560" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="360" y="159" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">평소 몫: 우리 서버</text><rect x="640" y="130" width="240" height="44" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="760" y="159" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">넘치는 몫: 클라우드</text><rect x="60" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="190.0" y="345" text-anchor="middle" font-size="52" font-weight="700" fill="#9aa3b2">?</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="190.0" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">비용</text><circle cx="190.0" cy="315" r="32" fill="#0f1115" stroke="#ffb454" stroke-width="4"/><text x="190.0" y="326" text-anchor="middle" font-size="32" font-weight="700" fill="#ffb454">₩</text><text x="190.0" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">쓰는 만큼 계속 내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="211" width="268" height="243" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="350" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="480.0" y="345" text-anchor="middle" font-size="52" font-weight="700" fill="#9aa3b2">?</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">시차</text><circle cx="480.0" cy="315" r="32" fill="#0f1115" stroke="#6ea8fe" stroke-width="4"/><line x1="480.0" y1="315" x2="480.0" y2="295" stroke="#6ea8fe" stroke-width="4"/><line x1="480.0" y1="315" x2="495.0" y2="323" stroke="#6ea8fe" stroke-width="4"/><text x="480.0" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버가 늘기까지 몇 분(가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="211" width="268" height="243" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="640" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="770.0" y="345" text-anchor="middle" font-size="52" font-weight="700" fill="#9aa3b2">?</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="215" width="260" height="235" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="770.0" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#ff7b72">데이터 위치</text><rect x="750.0" y="295" width="40" height="32" rx="5" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><path d="M759.0 295 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ff7b72" stroke-width="3"/><text x="770.0" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">고객 예약 정보를 외부 인프라가 처리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="211" width="268" height="243" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소 몫은 우리 서버, 넘치는 몫은 클라우드예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫째, 쓰는 만큼 계속 내는 비용이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘째, 서버가 늘기까지 몇 분이 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">셋째, 고객 예약 정보가 외부 인프라에서 처리돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>