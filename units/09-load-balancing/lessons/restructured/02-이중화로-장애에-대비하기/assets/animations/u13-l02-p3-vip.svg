<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">일하는 장비가 보내는 하트비트가 끊기면 넘겨받아요</text>
<circle cx="70" cy="270" r="16" fill="#6ea8fe"/><rect x="52" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="70" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="720" y="260" width="160" height="80" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="800" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서버 풀</text><text x="800" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">.11~.13</text><rect x="365.0" y="170.0" width="150" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="365.0" y="370.0" width="150" height="60" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="440" y="406" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text><line x1="515" y1="200" x2="720" y2="290" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="400" x2="720" y2="310" stroke="#3d4b60" stroke-width="3"/><line x1="440" y1="232" x2="440" y2="368" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="300" x2="365" y2="200" stroke="#6ea8fe" stroke-width="3"/><rect x="170" y="144" width="200" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="270" y="165.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">203.0.113.10:443</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="500,215;500,215;480,300;480,385;480,385" keyTimes="0.000;0.025;0.125;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" f