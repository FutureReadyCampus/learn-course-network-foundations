<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>신호선만 끊기면 주인이 둘이 돼요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">신호선만 끊기면 주인이 둘이 돼요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">둘 다 멀쩡한데 서로 신호를 못 받는 경우예요</text>
<circle cx="70" cy="242" r="16" fill="#6ea8fe"/><rect x="52" y="262" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="70" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="720" y="250" width="160" height="80" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="800" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서버 풀</text><text x="800" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">.11~.13</text><rect x="365.0" y="160.0" width="150" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="365.0" y="340.0" width="150" height="60" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="440" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text><line x1="130" y1="285" x2="365" y2="190" stroke="#6ea8fe" stroke-width="3"/><rect x="335" y="118" width="210" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="440" y="141.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">203.0.113.10:443</text><line x1="515" y1="190" x2="720" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="370" x2="720" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="440" y1="220" x2="440" y2="340" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="412" y="285" text-anchor="end" font-size="17" font-weight="700" fill="#7ee7c7">하트비트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="440" cy="280" r="16" fill="#ff7b72"/><path d="M433 273 l14 14 M447 273 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="412" y="285" text-anchor="end" font-size="17" font-weight="700" fill="#ff7b72">하트비트 끊김</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="365.0" y="340.0" width="150" height="60" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><line x1="130" y1="285" x2="365" y2="370" stroke="#6ea8fe" stroke-width="3"/><rect x="335" y="416" width="210" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="440" y="438.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">203.0.113.10:443</text><rect x="45" y="434" width="240" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="165" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">접속이 들쭉날쭉해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="361" y="332" width="158" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="365.0" y="340.0" width="150" height="60" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="440" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="490" y1="220" x2="490" y2="340" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="6 6"/><circle cx="490" cy="280" r="16" fill="#7ee7c7"/><path d="M482 280 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="550" y="428" width="300" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">신호 경로를 이중으로 둬요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 A가 VIP를 맡고 신호를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 장비 사이 신호선만 끊겼어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">B도 A가 죽었다 여겨 VIP를 가져가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">신호 경로를 이중으로 두면 막을 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>