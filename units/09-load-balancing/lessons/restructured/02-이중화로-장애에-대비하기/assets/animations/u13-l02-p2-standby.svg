<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>예비 장비는 평소에 쉬게 둘까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">예비 장비는 평소에 쉬게 둘까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">액티브/스탠바이는 한 대만 일하고 한 대는 대기해요</text>
<circle cx="70" cy="242" r="16" fill="#6ea8fe"/><rect x="52" y="262" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="70" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="710" y="232" width="170" height="100" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="795" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서버 풀</text><text x="795" y="304" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">.11~.13</text><line x1="130" y1="285" x2="345" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="130" y1="285" x2="345" y2="370" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="190" x2="710" y2="270" stroke="#3d4b60" stroke-width="3"/><line x1="515" y1="370" x2="710" y2="295" stroke="#3d4b60" stroke-width="3"/><rect x="345.0" y="155.0" width="170" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><text x="430" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">일하는 중</text><rect x="345.0" y="335.0" width="170" height="70" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="430" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text><text x="430" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">대기</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="285" x2="345" y2="190" stroke="#6ea8fe" stroke-width="4"/><line x1="515" y1="190" x2="710" y2="270" stroke="#6ea8fe" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,285;150,285;345,190;515,190;700,270;700,270" keyTimes="0.000;0.025;0.092;0.158;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="155.0" width="170" height="70" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="430" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><text x="430" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">고장</text><circle cx="520" cy="156" r="16" fill="#ff7b72"/><path d="M513 149 l14 14 M527 149 l-14 14" stroke="#0f1115" stroke-width="4"/><line x1="130" y1="285" x2="345" y2="190" stroke="#ff7b72" stroke-width="3" stroke-dasharray="6 6"/><line x1="515" y1="190" x2="710" y2="270" stroke="#ff7b72" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="147" width="178" height="86" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="155.0" width="170" height="70" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="430" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><text x="430" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">고장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="335.0" width="170" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><text x="430" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">일하는 중</text><line x1="130" y1="285" x2="345" y2="370" stroke="#6ea8fe" stroke-width="4"/><line x1="515" y1="370" x2="710" y2="295" stroke="#6ea8fe" stroke-width="4"/><circle cx="540" cy="334" r="16" fill="#7ee7c7"/><path d="M532 334 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="500" y="422" width="280" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="444.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">B가 넘겨받아요 (페일오버)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="327" width="178" height="86" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="335.0" width="170" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><text x="430" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">일하는 중</text><line x1="130" y1="285" x2="345" y2="370" stroke="#6ea8fe" stroke-width="4"/><line x1="515" y1="370" x2="710" y2="295" stroke="#6ea8fe" stroke-width="4"/><circle cx="540" cy="334" r="16" fill="#7ee7c7"/><path d="M532 334 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="280" y="439" width="400" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">안전하지만 성능은 한 대와 같아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소엔 장비 A만 일하고 B는 쉬어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일하던 장비 A가 고장 났어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쉬던 장비 B가 일을 넘겨받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안전하지만 처리 성능은 한 대와 같아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>