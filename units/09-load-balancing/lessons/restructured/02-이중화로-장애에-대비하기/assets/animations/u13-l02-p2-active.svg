<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>예비 장비는 쉬게 둘까, 같이 일하게 할까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">예비 장비는 쉬게 둘까, 같이 일하게 할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 대가 고장 났을 때 남은 장비의 부하가 달라요</text>
<rect x="40" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">액티브/스탠바이</text><rect x="500" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">액티브/액티브</text><rect x="75.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="275.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="350" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">장비 B</text><rect x="535.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 A</text><rect x="735.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">장비 B</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="75" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="75" y="262" width="90" height="18" rx="5" fill="#7ee7c7"/><text x="150" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">60%</text><rect x="535" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="535" y="262" width="90" height="18" rx="5" fill="#7ee7c7"/><text x="610" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">60%</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="275" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="275" y="262" width="4" height="18" rx="5" fill="#9aa3b2"/><text x="350" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">대기</text><rect x="735" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="735" y="262" width="90" height="18" rx="5" fill="#7ee7c7"/><text x="810" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">60%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="75.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="150" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><rect x="535.0" y="187.0" width="150" height="56" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="610" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">장비 A</text><rect x="75" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="75" y="262" width="4" height="18" rx="5" fill="#ff7b72"/><rect x="535" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="535" y="262" width="4" height="18" rx="5" fill="#ff7b72"/><text x="150" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">고장</text><text x="610" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">고장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="67" y="179" width="166" height="72" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="527" y="179" width="166" height="72" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="275" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="275" y="262" width="90" height="18" rx="5" fill="#7ee7c7"/><text x="350" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">60%</text><circle cx="350" cy="355" r="16" fill="#7ee7c7"/><path d="M342 355 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="145" y="382" width="210" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="403.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">남은 한 대가 이어받아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="735" y="262" width="150" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="735" y="262" width="150" height="18" rx="5" fill="#ff7b72"/><text x="810" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">120%(가정)</text><circle cx="810" cy="355" r="16" fill="#ff7b72"/><path d="M803 348 l14 14 M817 348 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="600" y="382" width="220" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="710" y="403.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">한 대가 두 대 몫을 맡아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="267" y="254" width="166" height="34" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="727" y="254" width="166" height="34" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="438" width="480" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">평소 50% 이하로 쓰면 한 대가 빠져도 버텨요(가정)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소엔 A가 일하고, 오른쪽은 둘 다 일해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 A가 고장 났어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">왼쪽은 넘겨받고, 오른쪽은 120%로 넘쳐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 대가 빠져도 버틸 여유를 포함해요</text></g>

