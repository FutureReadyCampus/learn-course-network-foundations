<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>넘겨받았는데 문제가 남았어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">넘겨받았는데 문제가 남았어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">지우가 이웃 장비의 주소록을 살펴봐요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="690" y="130" width="200" height="170" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="790" y1="130" x2="790" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="215" x2="890" y2="215" stroke="#3d4b60" stroke-width="3"/><rect x="70" y="150" width="120" height="80" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="90" y1="180" x2="170" y2="180" stroke="#3d4b60" stroke-width="3"/><line x1="90" y1="200" x2="150" y2="200" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text><text x="140" y="361.0" text-anchor="middle" font-size="16" fill="#9aa3b2">신입 네트워크 관리자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g><rect x="370" y="225" width="100" height="60" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="420" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">옛 장비</text><rect x="590" y="225" width="100" height="60" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><circle cx="640" cy="253" r="16" fill="#7ee7c7"/><path d="M632 253 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="640" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">예비 장비</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="578" y="217" width="124" height="76" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="391.84000000000003" y="324" width="296.32" height="52" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="419.84000000000003,336 435.84000000000003,364 403.84000000000003,364" fill="#ff7b72"/><text x="419.84000000000003" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">!</text><text x="449.84000000000003" y="356" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">이웃 장비가 옛 주소로 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="368" y="320" width="344" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="205" y="111" width="250" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="218" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="192" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="167" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="330" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">넘겨받는 것과 같은 주소로</text><text x="330" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">오는 건 별개의 문제</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="320" y="419" width="320" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">장비가 바뀌어도 같은 주소로?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예비 로드 밸런서가 일을 넘겨받았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데 이웃 장비가 옛 장비의 주소로 계속 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 넘겨받는 것과 주소는 별개라는 걸 알아채요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 주소가 이어지는 방법을 알아봐요</text></g>

