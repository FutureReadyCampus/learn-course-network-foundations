<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>몰리는 시간에만 서버를 늘릴 수 있을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">몰리는 시간에만 서버를 늘릴 수 있을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">넘치는 몫만 클라우드에서 빌려 쓰는 안이에요</text>
