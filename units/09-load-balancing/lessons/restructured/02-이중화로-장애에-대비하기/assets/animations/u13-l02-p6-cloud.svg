eight="18" rx="5" fill="#7ee7c7"/><rect x="510" y="360" width="110" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="510" y="360" width="77" height="18" rx="5" fill="#7ee7c7"/><text x="510" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">70%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="392" y="196" width="240" height="198" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><path d="M230 268 V132 H800 V150" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><rect x="735.0" y="217.0" width="130" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="744.0" y="227.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="807" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">컨테이너</text><rect x="735.0" y="297.0" width="130" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="744.0" y="307.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="807" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">컨테이너</text><circle cx="890" cy="282" r="16" fill="#7ee7c7"/><path d="M882 282 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="800" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">준비 확인 통과 후 붙음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="691" y="208" width="218" height="140" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="245" y="442" width="470" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="463.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">대가: 비용 · 몇 분 시차(가정) · 대화 데이터 위치</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소엔 우리 서버만으로 충분해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">점심에는 우리 서버가 꽉 차요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">넘치는 몫만 클라우드에서 늘려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">비용·시차·데이터 위치가 대가예요</text></g>

