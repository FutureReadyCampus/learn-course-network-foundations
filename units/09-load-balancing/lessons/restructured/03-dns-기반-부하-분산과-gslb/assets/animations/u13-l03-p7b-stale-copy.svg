<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>고친 사진이 왜 예전 그대로일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">고친 사진이 왜 예전 그대로일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 이름이면 에지의 사본이 그대로 남아요</text>
<circle cx="80" cy="270" r="16" fill="#6ea8fe"/><rect x="62" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도쿄 손님</text><rect x="330" y="200" width="270" height="170" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="465" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">도쿄 에지</text><text x="465" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">사본(캐시)</text><rect x="350" y="268" width="44" height="32" rx="4" fill="#6ea8fe"/><path d="M354 296 l13 -15 l9 10 l7 -8 l7 13 z" fill="#0f1115" fill-opacity="0.35"/><text x="405" y="291" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">hero.jpg</text><rect x="710" y="200" width="210" height="170" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="815" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 원본</text><text x="815" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">원본 파일</text><line x1="130" y1="285" x2="325" y2="285" stroke="#3d4b60" stroke-width="3"/><line x1="605" y1="285" x2="705" y2="285" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="730" y="268" width="44" height="32" rx="4" fill="#6ea8fe"/><path d="M734 296 l13 -15 l9 10 l7 -8 l7 13 z" fill="#0f1115" fill-opacity="0.35"/><text x="785" y="291" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">hero.jpg</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="730" y="268" width="44" height="32" rx="4" fill="#7ee7c7"/><path d="M734 296 l13 -15 l9 10 l7 -8 l7 13 z" fill="#0f1115" fill-opacity="0.35"/><text x="785" y="291" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">hero.jpg 새 사진</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="718" y="254" width="198" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="320,285;320,285;150,285;150,285" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="95" y="199" width="190" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="190" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">예전 사진이 보여요</text><circle cx="310" cy="215" r="16" fill="#ff7b72"/><path d="M303 208 l14 14 M317 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="196" width="278" height="178" rx="14" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="730" y="268" width="44" height="32" rx="4" fill="#7ee7c7"/><path d="M734 296 l13 -15 l9 10 l7 -8 l7 13 z" fill="#0f1115" fill-opacity="0.35"/><text x="785" y="291" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">hero-v2.jpg</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="322" width="44" height="32" rx="4" fill="#7ee7c7"/><path d="M354 350 l13 -15 l9 10 l7 -8 l7 13 z" fill="#0f1115" fill-opacity="0.35"/><text x="405" y="345" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">hero-v2.jpg</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="338" y="310" width="208" height="56" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="690,285;690,285;625,285;625,285" keyTimes="0.000;0.775;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="80" cy="235" r="16" fill="#7ee7c7"/><path d="M72 235 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="285" y="413" width="390" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">파일 이름에 버전을 붙이면 새로 받아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 에지가 hero.jpg 사본을 갖고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울 원본에서 사진을 새것으로 고쳤어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">에지는 같은 이름이라 예전 사본을 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 이름 hero-v2.jpg는 에지가 새로 받아 와요</text></g>

