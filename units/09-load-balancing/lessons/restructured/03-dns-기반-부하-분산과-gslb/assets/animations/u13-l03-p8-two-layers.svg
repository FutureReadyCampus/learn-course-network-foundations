<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>지역을 고른 뒤엔 누가 서버를 고를까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">지역을 고른 뒤엔 누가 서버를 고를까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공항 안내와 게이트 배정처럼 두 층이 나눠 맡아요</text>
<circle cx="70" cy="270" r="16" fill="#6ea8fe"/><rect x="52" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="70" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">일본 손님</text><rect x="180.0" y="268.0" width="140" height="64" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="250" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">GSLB</text><text x="250" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">지역 고르기</text><line x1="130" y1="300" x2="180" y2="300" stroke="#3d4b60" stroke-width="3"/><rect x="470" y="130" width="450" height="85" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="695.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 203.0.113.10</text><rect x="470" y="240" width="450" height="200" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="695.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 203.0.113.20</text><rect x="515.0" y="322.0" width="110" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="570" y="346" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">L4</text><text x="570" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">서버 고르기</text><line x1="625" y1="350" x2="750" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="625" y1="350" x2="750" y2="340" stroke="#3d4b60" stroke-width="3"/><line x1="625" y1="350" x2="750" y2="380" stroke="#3d4b60" stroke-width="3"/><rect x="750.0" y="283.0" width="100" height="34" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="759.0" y="293.0" width="6" height="14" rx="3" fill="#7ee7c7"/><text x="807" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 1</text><rect x="750.0" y="323.0" width="100" height="34" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="759.0" y="333.0" width="6" height="14" rx="3" fill="#7ee7c7"/><text x="807" y="346" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 2</text><rect x="750.0" y="363.0" width="100" height="34" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="759.0" y="373.0" width="6" height="14" rx="3" fill="#7ee7c7"/><text x="807" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 3</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="320,300;320,300;400,330;470,350;470,350" keyTimes="0.000;0.025;0.125;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="172" y="262" width="156" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="625,350;625,350;750,340;750,340" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="511" y="318" width="118" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="750.0" y="363.0" width="100" height="34" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><rect x="759.0" y="373.0" width="6" height="14" rx="3" fill="#ff7b72"/><text x="807" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 3</text><circle cx="870" cy="380" r="16" fill="#ff7b72"/><path d="M863 373 l14 14 M877 373 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="615" y="402" width="170" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="700" y="423.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">L4가 알아서 빼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="742" y="357" width="116" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="130" width="450" height="85" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="695.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">서울 203.0.113.10 · 전체 장애</text><circle cx="880" cy="172" r="16" fill="#ff7b72"/><path d="M873 165 l14 14 M887 165 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="462" y="122" width="466" height="101" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="423" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">큰 장애는 GSLB가, 작은 장애는 L4가 맡아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">GSLB가 먼저 가까운 지역을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지역 안에서는 L4가 서버를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 한 대 고장은 L4가 빼면 끝나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사이트 전체 장애는 GSLB가 돌려요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>