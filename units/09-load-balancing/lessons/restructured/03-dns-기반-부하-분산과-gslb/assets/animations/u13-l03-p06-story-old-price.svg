xt-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g transform="translate(480,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="480" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="212" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="252,249 268,265 252,265" fill="#6ea8fe"/><rect x="222" y="279" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="222" y="292" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="222" y="305" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="240" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서울 사이트</text><rect x="692" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="732,249 748,265 732,265" fill="#6ea8fe"/><rect x="702" y="279" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="702" y="292" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="702" y="305" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="720" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">도쿄 사이트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="212" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><polygon points="252,249 268,265 252,265" fill="#7ee7c7"/><rect x="222" y="279" width="36" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><rect x="222" y="292" width="28" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><rect x="222" y="305" width="20" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><text x="240" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">새 요금표</text><rect x="692" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><polygon points="732,249 748,265 732,265" fill="#ffb454"/><rect x="702" y="279" width="36" height="5" rx="2" fill="#ffb454" fill-opacity="0.6"/><rect x="702" y="292" width="28" height="5" rx="2" fill="#ffb454" fill-opacity="0.6"/><rect x="702" y="305" width="20" height="5" rx="2" fill="#ffb454" fill-opacity="0.6"/><text x="720" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">예전 요금표</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="241" width="128" height="148" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="323.51" y="124" width="312.98" height="52" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="351.51,136 367.51,164 335.51,164" fill="#ff7b72"/><text x="351.51" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">!</text><text x="381.51" y="156" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">일본 고객만 예전 요금으로 견적</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="114" width="368" height="72" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="306" y="419" width="348" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">서울과 도쿄가 다른 답을 한다면?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 예약 사이트가 서울과 도쿄에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요금표를 바꿨는데 도쿄만 예전 그대로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 날 일본 고객이 예전 요금으로 견적을 받았다는 티켓이 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 어긋난 이유를 찾아봐요</text></g>

