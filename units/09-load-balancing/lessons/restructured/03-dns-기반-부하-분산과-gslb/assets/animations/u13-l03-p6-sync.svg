<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서울과 도쿄가 다른 답을 한다면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서울과 도쿄가 다른 답을 한다면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">사이트마다 지식 문서 버전이 다르면 생기는 일이에요</text>
<rect x="40" y="125" width="420" height="220" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">서울 사이트</text><rect x="500" y="125" width="420" height="220" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">도쿄 사이트</text><g><rect x="70" y="190" width="360" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="219.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">지식 문서 kb-2026-11-12</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="190" width="360" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="710.0" y="219.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지식 문서 kb-2026-11-11</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="186" width="368" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><circle cx="700" cy="390" r="16" fill="#6ea8fe"/><rect x="682" y="410" width="36" height="46" rx="12" fill="#6ea8fe"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="700,372;700,372;700,335;700,335" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="259" width="200" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="710" y="280.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">예전 단가로 답해요</text><circle cx="860" cy="275" r="16" fill="#ff7b72"/><path d="M853 268 l14 14 M867 268 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="606" y="254" width="208" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="190" width="360" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="219.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">지식 문서 kb-2026-11-12</text><circle cx="895" cy="280" r="16" fill="#7ee7c7"/><path d="M887 280 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="460" y1="213" x2="500" y2="213" stroke="#ffb454" stroke-width="4"/><rect x="155" y="404" width="230" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">서울 원본을 도쿄로 복사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="186" width="368" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="404" width="400" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="270" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">응답에 버전 번호를 남겨 어긋남을 찾아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울은 최신, 도쿄는 하루 전 버전이에요(가정)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일본 고객은 예전 단가로 답을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본 한 벌을 도쿄로 복사해 맞춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">버전 번호를 남기면 어긋난 곳이 보여요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>