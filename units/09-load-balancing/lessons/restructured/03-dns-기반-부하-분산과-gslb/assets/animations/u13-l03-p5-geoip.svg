<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP 주소만 보고 나라를 알 수 있을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP 주소만 보고 나라를 알 수 있을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">IP 위치 정보는 추정값이에요</text>
<g><rect x="360" y="134" width="240" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">어느 나라에서 왔을까?</text></g><rect x="40" y="215" width="230" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="155.0" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">손님 192.0.2.77</text><line x1="270" y1="245" x2="314" y2="245" stroke="#9aa3b2" stroke-width="5"/><polygon points="330,245 306,234 306,256" fill="#9aa3b2"/><rect x="330" y="215" width="230" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="445.0" y="251.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">IP 위치 DB</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="32" y="207" width="246" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="560" y1="245" x2="634" y2="245" stroke="#9aa3b2" stroke-width="5"/><polygon points="650,245 626,234 626,256" fill="#9aa3b2"/><rect x="650" y="215" width="270" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="785.0" y="251.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">추정: 일본 → 도쿄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="642" y="207" width="286" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="345" width="230" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="155.0" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">VPN 쓰는 손님</text><line x1="270" y1="375" x2="314" y2="375" stroke="#9aa3b2" stroke-width="5"/><polygon points="330,375 306,364 306,386" fill="#9aa3b2"/><rect x="330" y="345" width="230" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="445.0" y="381.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">VPN 출구</text><line x1="560" y1="375" x2="634" y2="375" stroke="#9aa3b2" stroke-width="5"/><polygon points="650,375 626,364 626,386" fill="#9aa3b2"/><rect x="650" y="345" width="270" height="60" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="785.0" y="381.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">추정: 출구 위치</text><circle cx="900" cy="345" r="16" fill="#ff7b72"/><path d="M893 338 l14 14 M907 338 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="322" y="337" width="246" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="438" width="500" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">안내용 추정값이에요. 정확해야 하면 다른 근거를 더해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님의 IP로 어느 나라인지 알아내려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 위치 DB가 국가·도시를 추정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">VPN을 쓰면 출구 위치로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가까운 곳 안내에만 쓰고 단정하지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>