<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>리졸버, 캐시, TTL은 무엇일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">리졸버, 캐시, TTL은 무엇일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">안내 데스크가 번호를 메모해 두는 시간이에요</text>
<circle cx="80" cy="220" r="16" fill="#6ea8fe"/><rect x="62" y="240" width="36" height="46" rx="12" fill="#6ea8fe"/><line x1="130" y1="240" x2="229" y2="240" stroke="#9aa3b2" stroke-width="5"/><polygon points="245,240 221,229 221,251" fill="#9aa3b2"/><rect x="250" y="205" width="230" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="365.0" y="246.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">안내 데스크(리졸버)</text><line x1="480" y1="240" x2="679" y2="240" stroke="#9aa3b2" stroke-width="5"/><polygon points="695,240 671,229 671,251" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="205" width="220" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="810.0" y="246.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">번호부(DNS 레코드)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="205" width="220" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="246.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">번호부 고침(도쿄 뺌)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="205" width="220" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="246.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">번호부(새 주소)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="197" width="246" height="86" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="345" width="230" height="64" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="365.0" y="382.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">메모(캐시) 도쿄 .20 · 1시간</text><line x1="365" y1="275" x2="365" y2="345" stroke="#9aa3b2" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="337" width="246" height="80" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="345" width="230" height="64" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="365.0" y="382.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">메모에서 옛 번호를 읽어 줘요</text><line x1="365" y1="275" x2="365" y2="345" stroke="#ff7b72" stroke-width="4"/><circle cx="500" cy="345" r="16" fill="#ff7b72"/><path d="M493 338 l14 14 M507 338 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="337" width="246" height="80" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="345" width="230" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="365.0" y="382.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">1시간 지나 메모를 버려요(TTL)</text><circle cx="500" cy="345" r="16" fill="#7ee7c7"/><path d="M492 345 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="337" width="246" height="80" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 안내 데스크(리졸버)에 이름을 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 데스크가 번호를 메모(캐시)에 적어 둬요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">번호부를 고쳐도 메모가 남아 있으면 옛 번호를 읽어 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메모의 유효 시간(TTL)이 끝나면 새로 찾아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>