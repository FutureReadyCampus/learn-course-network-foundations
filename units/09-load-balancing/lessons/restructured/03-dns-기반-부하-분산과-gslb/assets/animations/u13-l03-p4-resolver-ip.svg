<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>권한 DNS는 누구의 위치를 볼까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">권한 DNS는 누구의 위치를 볼까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">손님 PC가 아니라 물어 온 리졸버를 봐요</text>
<rect x="56" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="271" width="52" height="32" fill="#3d4b60"/><rect x="85" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="68" y="320" width="44" height="5" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님 PC</text><rect x="290" y="262" width="200" height="76" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="390" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">리졸버</text><text x="390" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">서울 쪽에 있어요</text><rect x="700" y="262" width="220" height="76" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="810" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">권한 DNS</text><text x="810" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">위치별로 답해요</text><line x1="140" y1="300" x2="269" y2="300" stroke="#9aa3b2" stroke-width="5"/><polygon points="285,300 261,289 261,311" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="127" y="218" width="170" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="212" y="241.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">주소가 뭐예요?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="274" width="156" height="52" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;270,300;270,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="495" y1="300" x2="679" y2="300" stroke="#9aa3b2" stroke-width="5"/><polygon points="695,300 671,289 671,311" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="505,300;505,300;685,300;685,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><ellipse cx="810" cy="215" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="810" cy="215" r="7" fill="#ffb454"/><rect x="715" y="154" width="190" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="810" y="175.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">리졸버 주소를 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="258" width="228" height="84" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="810" y1="342" x2="810" y2="356" stroke="#ff7b72" stroke-width="4"/><polygon points="810,370 800,350 820,350" fill="#ff7b72"/><rect x="700" y="372" width="220" height="48" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="810.0" y="402.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">서울 203.0.113.10</text><circle cx="675" cy="396" r="16" fill="#ff7b72"/><path d="M668 389 l14 14 M682 389 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="368" width="228" height="56" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="450" y="219" width="290" height="32" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="595" y="240.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">손님 주소 앞부분(ECS)도 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="810" y1="342" x2="810" y2="356" stroke="#7ee7c7" stroke-width="4"/><polygon points="810,370 800,350 820,350" fill="#7ee7c7"/><rect x="700" y="372" width="220" height="48" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="402.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">도쿄 203.0.113.20</text><circle cx="675" cy="396" r="16" fill="#7ee7c7"/><path d="M667 396 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="368" width="228" height="56" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">모든 리졸버가 보내는 건 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님 PC가 설정된 리졸버에게 먼저 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">리졸버가 대신 권한 DNS에 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">리졸버가 서울 쪽이라 서울 주소가 돌아와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ECS를 보내는 리졸버면 손님 쪽 위치도 알아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>