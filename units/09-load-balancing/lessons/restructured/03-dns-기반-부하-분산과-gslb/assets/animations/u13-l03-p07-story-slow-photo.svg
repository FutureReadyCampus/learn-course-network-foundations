" font-weight="700" fill="#e6e8ec">고화질 사진</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="538" y="111" width="245" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="760" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="771" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="782" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="660" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">모든 손님이 같은 사진을</text><text x="660" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">매번 서울에서 내려받는다</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="314" y="419" width="333" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">사진은 더 가까이 둘 수 없을까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일본 고객이 예약 사이트를 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상품 소개 고화질 사진 때문에 첫 화면이 느려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 사진을 매번 서울에서 내려받고 있었다는 걸 알아채요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 파일을 가까이 두는 법을 알아봐요</text></g>

