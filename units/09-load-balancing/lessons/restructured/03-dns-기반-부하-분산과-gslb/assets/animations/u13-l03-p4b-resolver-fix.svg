<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>노트북 한 대만 서울로 가는 이유</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">노트북 한 대만 서울로 가는 이유</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">수동으로 적어 둔 리졸버 때문이에요</text>
<rect x="345" y="124" width="270" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">도쿄 쇼룸 10.20.0.0/24</text><rect x="216" y="181" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="224" y="188" width="52" height="30" fill="#3d4b60"/><polygon points="206,227 294,227 302,239 198,239" fill="#6ea8fe"/><text x="250" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="676" y="179" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="684" y="186" width="52" height="32" fill="#3d4b60"/><rect x="705" y="225" width="10" height="10" fill="#6ea8fe"/><rect x="688" y="235" width="44" height="5" fill="#6ea8fe"/><text x="710" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">다른 PC</text><line x1="250" y1="272" x2="250" y2="298" stroke="#9aa3b2" stroke-width="4"/><polygon points="250,312 240,292 260,292" fill="#9aa3b2"/><line x1="710" y1="272" x2="710" y2="298" stroke="#9aa3b2" stroke-width="4"/><polygon points="710,312 700,292 720,292" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="316" width="260" height="50" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="250.0" y="347.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">공개 DNS (서울 쪽, 수동)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="316" width="260" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="347.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">자동(DHCP) · 도쿄 쪽</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="116" y="312" width="268" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="580" y="316" width="260" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="347.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">도쿄 쪽 리졸버 (DHCP)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="290" cy="292" r="16" fill="#ffb454"/><text x="290" y="299" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><circle cx="750" cy="292" r="16" fill="#ffb454"/><text x="750" y="299" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="116" y="312" width="268" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="312" width="268" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="135" y="408" width="230" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">서울 사이트로 안내</text><circle cx="392" cy="425" r="16" fill="#ff7b72"/><path d="M385 418 l14 14 M399 418 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="131" y="400" width="240" height="50" rx="20" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="135" y="408" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">도쿄 사이트로 안내</text><circle cx="392" cy="425" r="16" fill="#7ee7c7"/><path d="M384 425 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="595" y="408" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">도쿄 사이트로 안내</text><circle cx="852" cy="425" r="16" fill="#7ee7c7"/><path d="M844 425 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북은 수동 설정, 다른 PC는 자동 설정이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각자 설정된 리졸버에게 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북만 서울 쪽 리졸버라 서울로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자동(DHCP)으로 되돌리면 도쿄로 가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>