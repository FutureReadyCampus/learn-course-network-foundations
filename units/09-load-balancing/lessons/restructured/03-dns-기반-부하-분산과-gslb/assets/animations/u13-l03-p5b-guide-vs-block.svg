<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>같은 위치 정보, 쓰임은 다르게</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">같은 위치 정보, 쓰임은 다르게</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">틀렸을 때의 손해에 따라 달라져요</text>
<rect x="40" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">첫 화면을 어디서 줄까?</text><rect x="500" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">약관을 보여 줄까?</text><rect x="70" y="175" width="360" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP 위치 추정: 일본</text><rect x="530" y="175" width="360" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="710.0" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP 위치 추정: 일본</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="171" width="368" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="171" width="368" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="135" y="242" width="230" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="250" y="263.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">실제로는 다른 나라</text><rect x="595" y="242" width="230" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="710" y="263.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">실제로는 다른 나라</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="131" y="237" width="238" height="42" rx="17" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="591" y="237" width="238" height="42" rx="17" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="296" width="360" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="325.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">조금 느릴 뿐이에요</text><circle cx="405" cy="319" r="16" fill="#7ee7c7"/><path d="M397 319 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="530" y="296" width="360" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="710.0" y="325.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">엉뚱한 약관을 봐요</text><circle cx="865" cy="319" r="16" fill="#ff7b72"/><path d="M858 312 l14 14 M872 312 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="292" width="368" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="356" width="360" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="385.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">손님이 직접 고른 국가 설정</text><circle cx="865" cy="379" r="16" fill="#7ee7c7"/><path d="M857 379 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="352" width="368" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="436" width="400" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">틀리면 곤란한 판단엔 다른 근거를 더해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 IP 위치 추정값이 두 곳에 쓰여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">추정이 틀렸다고 해 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫 화면은 조금 느릴 뿐, 약관은 곤란해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">곤란한 판단에는 다른 근거를 더해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>