<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서울과 도쿄가 다른 답을 한다면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서울과 도쿄가 다른 답을 한다면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">사이트마다 지식 문서 버전이 다르면 생기는 일이에요</text>
<rect x="40" y="125" width="340" height="165" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="210.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">서울 사이트</text><rect x="580" y="125" width="340" height="165" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="750.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">도쿄 사이트</text><rect x="60" y="175" width="300" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210.0" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">지식 문서 kb-2026-11-12</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="175" width="300" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="750.0" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지식 문서 kb-2026-11-11</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="171" width="308" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="175" width="300" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="750.0" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">지식 문서 kb-2026-11-12</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="171" width="308" height="54" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><circle cx="210" cy="352" r="16" fill="#6ea8fe"/><rect x="192" y="372" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="210" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한국 손님</text><circle cx="750" cy="352" r="16" fill="#6ea8fe"/><rect x="732" y="372" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="750" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">일본 손님</text><line x1="210" y1="330" x2="210" y2="308" stroke="#9aa3b2" stroke-width="4"/><polygon points="210,294 200,314 220,314" fill="#9aa3b2"/><line x1="750" y1="330" x2="750" y2="308" stroke="#9aa3b2" stroke-width="4"/><polygon points="750,294 740,314 760,314" fill="#9aa3b2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="236" width="300" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210.0" y="261.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">새 단가로 답해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="236" width="300" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="750.0" y="261.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">예전 단가로 답해요</text><circle cx="875" cy="256" r="16" fill="#ff7b72"/><path d="M868 249 l14 14 M882 249 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="232" width="308" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="384" y1="198" x2="560" y2="198" stroke="#ffb454" stroke-width="6"/><polygon points="576,198 552,186 552,210" fill="#ffb454"/><rect x="415" y="144" width="130" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">원본 복사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="236" width="300" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="750.0" y="261.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">새 단가로 답해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="236" width="300" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210.0" y="261.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">새 단가 · kb-2026-11-12</text><rect x="600" y="236" width="300" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="750.0" y="261.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">새 단가 · kb-2026-11-12</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="232" width="308" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="232" width="308" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="440" width="420" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">응답에 버전 번호를 남기면 어긋난 곳이 보여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울은 최신, 도쿄는 하루 전 버전이에요(가정)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일본 손님은 예전 단가로 답을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울 원본을 도쿄로 복사해 맞춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답에 버전 번호를 남겨 두면 확인해요</text></g>

