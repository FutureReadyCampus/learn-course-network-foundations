<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TTL 때문에 예전 주소가 남아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TTL 때문에 예전 주소가 남아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">캐시는 TTL이 끝날 때까지 답을 보관해요</text>
<circle cx="90" cy="280" r="16" fill="#6ea8fe"/><rect x="72" y="300" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="90" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="310" y="245" width="340" height="116" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">리졸버 캐시</text><text x="480" y="310" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">도쿄 203.0.113.20</text><line x1="480" y1="181" x2="480" y2="229" stroke="#9aa3b2" stroke-width="4"/><polygon points="480,243 470,223 490,223" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="125" width="440" height="52" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="157.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">DNS 레코드 · 도쿄 203.0.113.20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="125" width="440" height="52" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="157.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">DNS 레코드 · 도쿄 주소를 뺐어요</text><circle cx="730" cy="151" r="16" fill="#ff7b72"/><path d="M723 144 l14 14 M737 144 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="256" y="121" width="448" height="60" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">TTL 3600초(1시간)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">TTL 미리 짧게</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="241" width="348" height="124" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><line x1="130" y1="305" x2="289" y2="305" stroke="#9aa3b2" stroke-width="5"/><polygon points="305,305 281,294 281,316" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="655" y1="305" x2="719" y2="305" stroke="#9aa3b2" stroke-width="5"/><polygon points="735,305 711,294 711,316" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="655" y1="305" x2="719" y2="305" stroke="#9aa3b2" stroke-width="5"/><polygon points="735,305 711,294 711,316" fill="#9aa3b2"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="740" y="240" width="180" height="130" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="830.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 사이트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="740" y="240" width="180" height="130" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="830.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 사이트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="740" y="240" width="180" height="130" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="830.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">도쿄 사이트</text><text x="830" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">점검 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="655" y1="305" x2="719" y2="305" stroke="#ff7b72" stroke-width="5"/><polygon points="735,305 711,294 711,316" fill="#ff7b72"/><circle cx="695" cy="305" r="16" fill="#ff7b72"/><path d="M688 298 l14 14 M702 298 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="736" y="236" width="188" height="138" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="135,305;135,305;295,305;295,305" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="418" width="460" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="441.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TTL을 미리 낮춘 뒤, 퍼진 다음 주소를 빼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">리졸버 캐시가 도쿄 주소를 TTL 동안 보관해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 DNS 레코드에서 도쿄 주소를 뺐어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">캐시가 예전 주소를 알려 줘서 점검 중인 곳으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">점검 전에 TTL을 미리 낮춰 두면 금방 바뀌어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>