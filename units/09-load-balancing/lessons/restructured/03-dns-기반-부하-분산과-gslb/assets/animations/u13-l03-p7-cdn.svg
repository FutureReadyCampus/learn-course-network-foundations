<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사진과 화면은 더 가까이 둘 수 없을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사진과 화면은 더 가까이 둘 수 없을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누구에게나 같은 정적 파일은 CDN에 맡겨요</text>
<circle cx="80" cy="265" r="16" fill="#6ea8fe"/><rect x="62" y="285" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도쿄 손님</text><rect x="760" y="265" width="140" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="830" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서울 원본</text><text x="830" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">203.0.113.10</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="300" x2="755" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/><rect x="345" y="218" width="190" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="440" y="241.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">사진 3MB(가정)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,300;140,300;750,300;750,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="300" x2="385" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="535" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/><rect x="385" y="265" width="150" height="70" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="460" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">도쿄 에지</text><rect x="400" y="360" width="120" height="31" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="460" y="380.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">사본 저장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="377" y="257" width="166" height="86" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,300;140,300;380,300;535,300;750,300;750,300" keyTimes="0.000;0.275;0.342;0.408;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="380,300;380,300;150,300;150,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="80" cy="215" r="16" fill="#7ee7c7"/><path d="M72 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="175" y="219" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="300" y="240.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">가까운 에지에서 바로 받아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="440" y="211" width="40" height="32" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><path d="M449 211 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ffb454" stroke-width="3"/><rect x="335" y="159" width="250" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="460" y="180.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">개인 응답은 캐시하지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="423" width="380" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">누구에게나 같은 파일만 CDN에 맡겨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 손님이 서울 원본에서 사진을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫 요청 때 도쿄 에지에 사본을 저장해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음부터는 가까운 에지에서 바로 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님마다 다른 답은 캐시하지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>