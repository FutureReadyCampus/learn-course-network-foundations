<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이름 하나로 지역마다 다른 주소를</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이름 하나로 지역마다 다른 주소를</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 → CNAME → 주소 순서로 따라가요</text>
<g><circle cx="105" cy="150" r="16" fill="#6ea8fe"/><rect x="87" y="170" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="180" y="205" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">일본 쪽 손님이 물어요</text></g><rect x="30" y="240" width="250" height="100" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="155" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">손님이 쓰는 이름</text><text x="155" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">bot.hangyeol.example</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="236" width="258" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="280" y1="290" x2="339" y2="290" stroke="#9aa3b2" stroke-width="5"/><polygon points="355,290 331,279 331,301" fill="#9aa3b2"/><rect x="355" y="240" width="250" height="100" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">CNAME (별칭)</text><text x="480" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">jp.bot.gslb.example</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="351" y="236" width="258" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="605" y1="290" x2="664" y2="290" stroke="#9aa3b2" stroke-width="5"/><polygon points="680,290 656,279 656,301" fill="#9aa3b2"/><rect x="680" y="240" width="250" height="100" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="805" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">도쿄 주소</text><text x="805" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">203.0.113.20</text><circle cx="805" cy="375" r="16" fill="#7ee7c7"/><path d="M797 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="676" y="236" width="258" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="423" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">지역은 GSLB가 이름을 풀어 줄 때 정해져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 이름 하나만 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름이 GSLB의 다른 이름을 가리켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 이름을 풀 때 도쿄 주소가 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지역 선택은 이름을 푸는 단계에서 일어나요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>