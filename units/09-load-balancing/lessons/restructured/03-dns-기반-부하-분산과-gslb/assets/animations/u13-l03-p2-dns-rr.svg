<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DNS가 주소를 둘 알려 주면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS가 주소를 둘 알려 주면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">등록만 하면 살아 있는 곳으로 가는 건 아니에요</text>
<rect x="40" y="150" width="440" height="40" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="260.0" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">bot.hangyeol.example</text><g><rect x="40" y="200" width="440" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="260.0" y="229.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 203.0.113.10</text><rect x="40" y="256" width="440" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260.0" y="285.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 203.0.113.20</text></g><rect x="580" y="150" width="340" height="80" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="750.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 사이트</text><rect x="580" y="290" width="340" height="80" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="750.0" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 사이트</text><circle cx="100" cy="365" r="16" fill="#6ea8fe"/><rect x="82" y="385" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="100" y="457" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="580" y="290" width="340" height="80" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="750.0" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">도쿄 사이트 · 점검 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="572" y="282" width="356" height="96" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,390;160,390;400,340;570,330;570,330" keyTimes="0.000;0.525;0.625;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="560" cy="330" r="16" fill="#ff7b72"/><path d="M553 323 l14 14 M567 323 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="175" y="424" width="250" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="300" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">DNS는 점검 중인 줄 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="438" width="340" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">GSLB: 살아 있는 곳만 알려 줘요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름 하나에 서울·도쿄 주소를 둘 다 등록했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 사이트가 점검 중이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS는 몰라서 도쿄 주소를 계속 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상태를 보는 GSLB가 필요해요</text></g>

