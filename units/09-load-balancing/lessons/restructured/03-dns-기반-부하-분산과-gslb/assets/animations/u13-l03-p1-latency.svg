<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>일본 고객에게만 왜 느릴까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">일본 고객에게만 왜 느릴까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버가 한산해도 거리가 멀면 느려져요</text>
<circle cx="80" cy="265" r="16" fill="#6ea8fe"/><rect x="62" y="285" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">일본 고객</text><line x1="130" y1="300" x2="670" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/><rect x="680" y="190" width="240" height="200" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="800.0" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 203.0.113.10</text><g><rect x="710" y="305" width="180" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="710" y="305" width="36" height="18" rx="5" fill="#7ee7c7"/><text x="800" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서버는 한산해요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="698" y="292" width="204" height="46" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,300;140,300;660,300;140,300;140,300" keyTimes="0.000;0.275;0.375;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="218" width="300" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="400" y="241.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">왕복 50ms(가정) × 20~30번</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="241" y="214" width="318" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="400" cy="300" r="16" fill="#ff7b72"/><path d="M393 293 l14 14 M407 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="260" y="348" width="280" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="400" y="371.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">첫 화면 1~1.5초 더(가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="190" width="200" height="200" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="320.0" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 203.0.113.20</text><text x="320" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">가까운 사이트</text><circle cx="320" cy="345" r="16" fill="#7ee7c7"/><path d="M312 345 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><line x1="130" y1="300" x2="220" y2="300" stroke="#6ea8fe" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="212" y="182" width="216" height="216" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="438" width="360" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서버 대수가 아니라 거리가 문제예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일본 고객은 서울 사이트에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">화면 하나에 왕복이 20~30번 쌓여요(가정)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버는 한산한데도 첫 화면이 느려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가까운 곳에 사이트를 두면 줄어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>