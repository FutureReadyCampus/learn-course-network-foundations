<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DNS는 손님 위치를 어떻게 알까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS는 손님 위치를 어떻게 알까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">노트북 한 대만 서울로 안내돼요</text>
<rect x="350" y="134" width="260" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">도쿄 쇼룸 10.20.0.0/24</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="129" width="268" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="216" y="201" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="224" y="208" width="52" height="30" fill="#3d4b60"/><polygon points="206,247 294,247 302,259 198,259" fill="#6ea8fe"/><text x="250" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="676" y="199" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="684" y="206" width="52" height="32" fill="#3d4b60"/><rect x="705" y="245" width="10" height="10" fill="#6ea8fe"/><rect x="688" y="255" width="44" height="5" fill="#6ea8fe"/><text x="710" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">다른 PC</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="330" width="260" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="250.0" y="359.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">공개 DNS (서울 쪽)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,296;250,296;250,324;250,324" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="580" y="330" width="260" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="359.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">도쿄 쪽 리졸버 (DHCP)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="710,296;710,296;710,324;710,324" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="112" y="322" width="276" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="572" y="322" width="276" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="402" width="220" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="423.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">서울 사이트로 안내</text><circle cx="395" cy="418" r="16" fill="#ff7b72"/><path d="M388 411 l14 14 M402 411 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="402" width="220" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="423.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">도쿄 사이트로 안내</text><circle cx="855" cy="418" r="16" fill="#7ee7c7"/><path d="M847 418 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="330" width="260" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="359.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">자동(DHCP) · 도쿄 쪽</text><rect x="140" y="402" width="220" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="423.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">도쿄 사이트로 안내</text><circle cx="395" cy="418" r="16" fill="#7ee7c7"/><path d="M387 418 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="112" y="322" width="276" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="442" width="440" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="464.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">권한 DNS는 손님이 아니라 리졸버의 위치를 봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 쇼룸의 노트북과 PC예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각자 설정된 리졸버에게 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북만 서울 쪽 리졸버라 서울로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수동 값을 지우면 도쿄 쪽 리졸버를 써요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>