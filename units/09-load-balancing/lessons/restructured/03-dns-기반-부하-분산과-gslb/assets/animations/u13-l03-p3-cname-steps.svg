<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이름 하나로 지역마다 다른 주소를</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이름 하나로 지역마다 다른 주소를</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 → CNAME → 주소 순서로 따라가요</text>
<circle cx="155" cy="140" r="16" fill="#6ea8fe"/><rect x="137" y="160" width="36" height="46" rx="12" fill="#6ea8fe"/><rect x="280" y="142" width="240" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="400" y="164.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">일본 쪽 손님이 물어요</text><line x1="155" y1="212" x2="155" y2="230" stroke="#9aa3b2" stroke-width="4"/><polygon points="155,244 145,224 165,224" fill="#9aa3b2"/><rect x="30" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="160.0" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">손님이 쓰는 이름</text><text x="160.0" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">book.company.example</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="246" width="268" height="128" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="480.0" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">다른 이름?</text><text x="480.0" y="336" text-anchor="middle" font-size="32" font-weight="700" fill="#9aa3b2">?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="670" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="800.0" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">주소?</text><text x="800.0" y="336" text-anchor="middle" font-size="32" font-weight="700" fill="#9aa3b2">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="292" y1="310" x2="330" y2="310" stroke="#9aa3b2" stroke-width="5"/><polygon points="346,310 322,299 322,321" fill="#9aa3b2"/><rect x="350" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480.0" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">CNAME (별칭)</text><text x="480.0" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">jp.book.gslb.example</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="246" width="268" height="128" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="612" y1="310" x2="650" y2="310" stroke="#9aa3b2" stroke-width="5"/><polygon points="666,310 642,299 642,321" fill="#9aa3b2"/><rect x="670" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="800.0" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">도쿄 주소</text><text x="800.0" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">203.0.113.20</text><circle cx="800.0" cy="398" r="16" fill="#7ee7c7"/><path d="M792.0 398 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="666" y="246" width="268" height="128" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="670" y="250" width="260" height="120" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="800.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">GSLB가 지역별로 골라요</text><text x="800.0" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">일본 → 도쿄 203.0.113.20</text><text x="800.0" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">한국 → 서울 203.0.113.10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="666" y="246" width="268" height="128" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="612" y1="310" x2="650" y2="310" stroke="#9aa3b2" stroke-width="5"/><polygon points="666,310 642,299 642,321" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="423" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">지역은 이름을 푸는 단계에서 정해져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 이름 하나만 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름이 GSLB의 다른 이름(CNAME)을 가리켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 이름을 풀 때 도쿄 주소가 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 이름도 지역마다 다른 주소가 돌아가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>