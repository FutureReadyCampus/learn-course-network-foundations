;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="635,350;635,350;725,350;725,350" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="511" y="318" width="118" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="750.0" y="373.0" width="100" height="34" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><rect x="759.0" y="383.0" width="6" height="14" rx="3" fill="#ff7b72"/><text x="807" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 3</text><circle cx="878" cy="390" r="16" fill="#ff7b72"/><path d="M871 383 l14 14 M885 383 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="605" y="412" width="190" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="700" y="433.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">L4가 알아서 빼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="742" y="367" width="116" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="500" y="125" width="420" height="95" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">서울 203.0.113.10 · 전체 장애</text><circle cx="880" cy="172" r="16" fill="#ff7b72"/><path d="M873 165 l14 14 M887 165 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="492" y="117" width="436" height="111" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="320" y1="258" x2="500" y2="300" stroke="#ffb454" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="424" width="440" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">큰 장애는 GSLB가, 작은 장애는 L4가 맡아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">GSLB가 손님 위치에 맞는 지역을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지역 안에서는 L4가 서버를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 한 대 고장은 L4가 빼면 끝나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사이트 전체 장애는 GSLB가 도쿄로 돌려요</text></g>

