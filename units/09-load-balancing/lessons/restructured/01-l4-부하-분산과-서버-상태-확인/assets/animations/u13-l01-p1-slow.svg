<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>한결봇은 왜 느려졌을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">한결봇은 왜 느려졌을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">회선과 서버 중 어디가 꽉 찼는지 나눠 봐요</text>
<circle cx="70" cy="270" r="16" fill="#6ea8fe"/><rect x="52" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="150" cy="270" r="16" fill="#6ea8fe"/><rect x="132" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><line x1="200" y1="290" x2="760" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="760.0" y="260.0" width="120" height="60" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="769.0" y="270.0" width="6" height="40" rx="3" fill="#7ee7c7"/><text x="827" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 1대</text><g><rect x="350" y="148" width="260" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">점심시간, 요청이 몰려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="250" width="200" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="330" y="250" width="60" height="18" rx="5" fill="#7ee7c7"/><text x="430" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">회선 사용률 30%(가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="318" y="220" width="224" height="68" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="210,290;210,290;680,290;680,290" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="740" y="365" width="160" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="740" y="365" width="160" height="18" rx="5" fill="#ff7b72"/><text x="820" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">GPU 100%</text><rect x="694" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M694 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="694" y="276" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M694 278 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="694" y="316" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M694 318 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="820" cy="410" r="16" fill="#ff7b72"/><path d="M813 403 l14 14 M827 403 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="728" y="334" width="184" height="68" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="418" width="380" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="441.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">회선이 아니라 서버 한 대의 한계예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">점심시간에 요청이 서버 한 대로 몰려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회선은 30%만 써서 한가해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">GPU는 100%라 요청이 줄 서 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 대의 한계라 여러 대로 나눠야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>