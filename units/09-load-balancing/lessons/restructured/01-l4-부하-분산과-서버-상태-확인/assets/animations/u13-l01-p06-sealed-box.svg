<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>봉인된 상자는 누가 열까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">봉인된 상자는 누가 열까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">겉봉만 보는 L4, 열어서 읽는 L7</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="225" width="220" height="130" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="310" y="266" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M319 266 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><text x="330" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">봉인된 상자 (HTTPS)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="225" width="220" height="130" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="330" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">경로 /api/estimate</text><text x="330" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">쿠키 (손님 번호표)</text></g><line x1="165" y1="290" x2="215" y2="290" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="205" y="174" width="250" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="330" y="195.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">겉봉 203.0.113.10:443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="201" y="168" width="258" height="44" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="210" y="383" width="240" height="34" rx="17" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/><text x="330" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L4는 겉봉만 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="190" y="383" width="280" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="330" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L7이 열쇠로 열어 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="201" y="206" width="258" height="168" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="735.0" y="177.0" width="130" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="744.0" y="187.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="807" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">작은 서버</text><rect x="735.0" y="357.0" width="130" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="744.0" y="367.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="807" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">큰 서버</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="450" y1="290" x2="735" y2="380" stroke="#7ee7c7" stroke-width="4"/><circle cx="770" cy="340" r="16" fill="#7ee7c7"/><path d="M762 340 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="455" y="424" width="330" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="620" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">열린 내용은 이 장비 안에서 평문</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="731" y="353" width="138" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTPS 요청은 봉인한 택배 상자예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4는 겉봉의 주소와 포트만 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L7은 열쇠로 상자를 열어 경로를 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">읽은 뒤 알맞은 서버로 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>