<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도면 질문만 큰 GPU로?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도면 질문만 큰 GPU로?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">겉봉만 보는 L4 vs 내용을 읽는 L7</text>
<rect x="40" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">L4 · IP와 포트만 봐요</text><rect x="500" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">L7 · 경로까지 읽어요</text><rect x="88" y="266" width="44" height="28" rx="5" fill="#ffb454"/><path d="M88 268 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="110" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">도면 요청</text><rect x="190.0" y="252.0" width="130" height="56" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="255" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">로드 밸런서</text><line x1="135" y1="280" x2="190" y2="280" stroke="#3d4b60" stroke-width="3"/><rect x="330.0" y="192.0" width="110" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="339.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="392" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">작은 서버</text><rect x="330.0" y="327.0" width="110" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="339.0" y="337.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="392" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">큰 GPU</text><rect x="548" y="266" width="44" height="28" rx="5" fill="#ffb454"/><path d="M548 268 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="570" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">도면 요청</text><rect x="650.0" y="252.0" width="130" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="715" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><line x1="595" y1="280" x2="650" y2="280" stroke="#3d4b60" stroke-width="3"/><rect x="790.0" y="192.0" width="110" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="799.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="852" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">작은 서버</text><rect x="790.0" y="327.0" width="110" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="799.0" y="337.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="852" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">큰 GPU</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="320" y1="280" x2="385" y2="230" stroke="#ff7b72" stroke-width="4" stroke-dasharray="6 5"/><circle cx="440" cy="262" r="16" fill="#ff7b72"/><path d="M433 255 l14 14 M447 255 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="170" y="380" width="170" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="255" y="400.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">내용은 안 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="324" y="188" width="122" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="780" y1="280" x2="845" y2="340" stroke="#7ee7c7" stroke-width="4"/><circle cx="900" cy="305" r="16" fill="#7ee7c7"/><path d="M892 305 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="600" y="380" width="230" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="715" y="400.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">/api/drawing 보고 구분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="784" y="323" width="122" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="438" width="380" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">경로·쿠키로 나누려면 L7이 필요해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도면 요청과 일반 문의가 섞여 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4는 겉봉만 봐서 가르지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L7은 경로를 읽어 큰 GPU로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경로·쿠키 기준이면 L7을 써요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>