<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>대화 중에 앞말을 잊는다면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">대화 중에 앞말을 잊는다면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청마다 다른 서버가 받을 수 있어요</text>
<circle cx="80" cy="270" r="16" fill="#6ea8fe"/><rect x="62" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><rect x="185.0" y="270.0" width="150" height="60" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><line x1="140" y1="300" x2="185" y2="300" stroke="#3d4b60" stroke-width="3"/><rect x="498.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="498.0" y="277.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="287.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="498.0" y="387.0" width="124" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="507.0" y="397.0" width="6" height="26" rx="3" fill="#9aa3b2"/><text x="567" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서버 .13</text><line x1="335" y1="300" x2="498" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="335" y1="300" x2="498" y2="300" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="25" y="200" width="170" height="30" rx="15" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="220.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">거실은 15평이에요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;260,300;440,200;498,190;498,190" keyTimes="0.000;0.025;0.092;0.158;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g><rect x="630" y="172" width="90" height="36" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="675.0" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">15평</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="622" y="164" width="106" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="15" y="200" width="190" height="30" rx="15" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="220.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">아까 평수로 계산해 줘</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;260,300;440,300;498,300;498,300" keyTimes="0.000;0.275;0.342;0.408;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="635" y="284" width="160" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="715" y="305.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">처음 듣는 이야기</text><circle cx="820" cy="300" r="16" fill="#ff7b72"/><path d="M813 293 l14 14 M827 293 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="494" y="273" width="132" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="790" y="255" width="130" height="90" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="855" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">공유 저장소</text><text x="855" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">15평</text><line x1="720" y1="190" x2="790" y2="280" stroke="#7ee7c7" stroke-width="3"/><line x1="620" y1="300" x2="790" y2="300" stroke="#7ee7c7" stroke-width="3"/><line x1="620" y1="410" x2="790" y2="330" stroke="#7ee7c7" stroke-width="3"/><circle cx="855" cy="235" r="16" fill="#7ee7c7"/><path d="M847 235 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="782" y="247" width="146" height="106" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="438" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">대화 기록은 서버 밖 저장소에 두면 안전해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫 요청은 서버 .11이 받고 기억해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 요청은 다른 서버로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 .12는 앞말을 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유 저장소면 어느 서버든 기억해요</text></g>

