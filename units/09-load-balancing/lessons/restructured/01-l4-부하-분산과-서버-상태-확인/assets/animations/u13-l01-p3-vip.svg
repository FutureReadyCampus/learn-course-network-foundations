<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>손님은 주소 하나만 알면 돼요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">손님은 주소 하나만 알면 돼요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">대표 주소(VIP)는 서버가 아니라 로드 밸런서 것이에요</text>
<circle cx="90" cy="260" r="16" fill="#6ea8fe"/><rect x="72" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="90" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><rect x="350.0" y="268.0" width="160" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="430" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><rect x="728.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="737.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="797" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="728.0" y="277.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="737.0" y="287.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="797" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="728.0" y="387.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="737.0" y="397.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="797" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text><line x1="510" y1="300" x2="725" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="510" y1="300" x2="725" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="510" y1="300" x2="725" y2="410" stroke="#3d4b60" stroke-width="3"/><line x1="150" y1="300" x2="350" y2="300" stroke="#3d4b60" stroke-width="3"/><g><rect x="95" y="210" width="210" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">bot.hangyeol.example</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="91" y="204" width="218" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="209" width="190" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="440" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">203.0.113.10:443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="204" width="198" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;360,300;360,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="500,300;500,300;640,300;725,300;725,300" keyTimes="0.000;0.525;0.625;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="870" cy="300" r="16" fill="#7ee7c7"/><path d="M862 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="723" y="273" width="136" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="438" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서버가 늘어도 손님이 아는 주소는 그대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 이름 하나만 알아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름을 풀면 VIP 주소 하나가 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로드 밸런서가 서버 풀 중 하나로 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 수가 바뀌어도 주소는 그대로예요</text></g>

