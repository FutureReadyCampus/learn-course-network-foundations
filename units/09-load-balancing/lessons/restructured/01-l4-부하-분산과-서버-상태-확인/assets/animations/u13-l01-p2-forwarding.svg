<title>포트 포워딩을 서버 여러 대로?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포트 포워딩을 서버 여러 대로?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">고정 안내판 vs 연결마다 고르는 장비</text>
