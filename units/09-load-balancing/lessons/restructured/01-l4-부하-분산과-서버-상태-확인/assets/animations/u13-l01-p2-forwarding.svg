x="145" y="380" width="210" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="401.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">443 → .12 규칙은 거부</text><circle cx="448" cy="280" r="16" fill="#ff7b72"/><path d="M441 273 l14 14 M455 273 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="302" y="253" width="136" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="515.0" y="233.0" width="170" height="74" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="600" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">로드 밸런서</text><text x="600" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">203.0.113.10:443</text><line x1="685" y1="270" x2="770" y2="210" stroke="#6ea8fe" stroke-width="3"/><line x1="685" y1="270" x2="770" y2="280" stroke="#6ea8fe" stroke-width="3"/><line x1="685" y1="270" x2="770" y2="350" stroke="#6ea8fe" stroke-width="3"/><rect x="773.0" y="187.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="782.0" y="197.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="842" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="773.0" y="257.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="782.0" y="267.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="842" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="773.0" y="327.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="782.0" y="337.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="842" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="511" y="229" width="178" height="82" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="560,270;560,270;650,270;750,280;750,280" keyTimes="0.000;0.525;0.625;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="433" width="360" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L4는 IP·포트만 보고 서버를 골라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포워딩은 포트 하나에 서버 한 대예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 443에 서버를 더 넣으려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로드 밸런서가 연결마다 서버를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4 장비는 IP·포트만 보고 나눠요</text></g>

