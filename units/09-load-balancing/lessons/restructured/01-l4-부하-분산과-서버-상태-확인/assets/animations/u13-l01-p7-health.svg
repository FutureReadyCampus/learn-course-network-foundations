<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>모델을 싣는 서버로 왜 갔을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">모델을 싣는 서버로 왜 갔을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">켜졌다고 일할 준비가 된 건 아니에요</text>
<rect x="65.0" y="258.0" width="170" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="150" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><rect x="498.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="498.0" y="267.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="277.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="498.0" y="367.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="377.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text><line x1="235" y1="290" x2="498" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="235" y1="290" x2="498" y2="290" stroke="#3d4b60" stroke-width="3"/><line x1="235" y1="290" x2="498" y2="390" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="680" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">모델 싣는 중</text></g><g><rect x="70" y="189" width="160" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="150" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">ping 응답 정상</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="184" width="168" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="235,290;235,290;420,290;498,290;498,290" keyTimes="0.000;0.275;0.375;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="640" cy="262" r="16" fill="#ff7b72"/><path d="M633 255 l14 14 M647 255 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="494" y="263" width="132" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="498.0" y="267.0" width="124" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><rect x="507.0" y="277.0" width="6" height="26" rx="3" fill="#9aa3b2"/><text x="567" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서버 .12</text><text x="700" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">풀에서 제외</text><circle cx="790" cy="290" r="16" fill="#7ee7c7"/><path d="M782 290 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="494" y="263" width="132" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="438" width="440" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">준비 완료까지 묻고, 연속 실패로 판단해요(가정)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ping만 보면 .12가 정상으로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 가서 오류가 나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">/health로 물으면 준비 전이라 빼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서비스가 준비됐는지를 확인해요</text></g>

