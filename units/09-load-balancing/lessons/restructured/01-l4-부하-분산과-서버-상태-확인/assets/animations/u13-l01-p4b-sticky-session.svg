<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>같은 손님은 같은 서버로 보내면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">같은 손님은 같은 서버로 보내면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">세션 고정은 간단하지만 대가가 있어요</text>
<circle cx="80" cy="265" r="16" fill="#6ea8fe"/><rect x="62" y="285" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">같은 손님</text><rect x="185.0" y="270.0" width="150" height="60" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><line x1="140" y1="300" x2="185" y2="300" stroke="#3d4b60" stroke-width="3"/><rect x="498.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="507.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="567" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="498.0" y="277.0" width="124" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="507.0" y="287.0" width="6" height="26" rx="3" fill="#9aa3b2"/><text x="567" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서버 .12</text><rect x="498.0" y="387.0" width="124" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="507.0" y="397.0" width="6" height="26" rx="3" fill="#9aa3b2"/><text x="567" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서버 .13</text><line x1="335" y1="300" x2="498" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="335" y1="300" x2="498" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="335" y1="300" x2="498" y2="410" stroke="#3d4b60" stroke-width="3"/><g><rect x="290" y="124" width="380" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="145.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">세션 고정: 같은 손님은 같은 서버로</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="25" y="209" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="125" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">20일로 예약할게요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;260,300;440,200;490,190;490,190" keyTimes="0.000;0.025;0.092;0.158;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="630" y="172" width="90" height="36" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="675.0" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">20일</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="15" y="209" width="220" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="125" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">다음 단계로 넘어가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="335" y1="300" x2="498" y2="190" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;260,300;440,200;490,190;490,190" keyTimes="0.000;0.275;0.342;0.408;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="760" cy="190" r="16" fill="#7ee7c7"/><path d="M752 190 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="498.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="507.0" y="177.0" width="6" height="26" rx="3" fill="#ff7b72"/><text x="567" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">서버 .11</text><circle cx="760" cy="190" r="16" fill="#ff7b72"/><path d="M753 183 l14 14 M767 183 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="595" y="229" width="240" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="715" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">고장 → 기록도 사라져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="494" y="163" width="132" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="442" width="380" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">세션 고정은 꼭 필요한 곳에만 써요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 손님의 첫 요청은 서버 .11로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 요청도 같은 서버 .11로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 서버가 고장 나면 예약이 끊겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기본은 공유 저장소, 고정은 꼭 필요할 때만</text></g>

