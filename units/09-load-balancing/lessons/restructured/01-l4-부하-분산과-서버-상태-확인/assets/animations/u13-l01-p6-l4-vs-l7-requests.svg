<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도면 질문만 큰 GPU로?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도면 질문만 큰 GPU로?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">겉봉만 보는 L4 vs 내용을 읽는 L7</text>
<rect x="40" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="250.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">L4 · IP와 포트만 봐요</text><rect x="500" y="125" width="420" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710.0" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">L7 · 경로까지 읽어요</text><rect x="73" y="236" width="44" height="28" rx="5" fill="#ffb454"/><path d="M73 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="95" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">도면 요청</text><rect x="73" y="331" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M73 333 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="95" y="383" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">일반 문의</text><line x1="120" y1="250" x2="185" y2="285" stroke="#3d4b60" stroke-width="3"/><line x1="120" y1="345" x2="185" y2="305" stroke="#3d4b60" stroke-width="3"/><rect x="184.0" y="267.0" width="112" height="56" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="240" y="301" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">로드 밸런서</text><rect x="335.0" y="192.0" width="110" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="344.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="397" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">작은 서버</text><rect x="335.0" y="352.0" width="110" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="344.0" y="362.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="397" y="381" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">큰 GPU</text><rect x="533" y="236" width="44" height="28" rx="5" fill="#ffb454"/><path d="M533 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="555" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">도면 요청</text><rect x="533" y="331" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M533 333 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="555" y="383" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">일반 문의</text><line x1="580" y1="250" x2="645" y2="285" stroke="#3d4b60" stroke-width="3"/><line x1="580" y1="345" x2="645" y2="305" stroke="#3d4b60" stroke-width="3"/><rect x="644.0" y="267.0" width="112" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="700" y="301" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><rect x="795.0" y="192.0" width="110" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="804.0" y="202.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="857" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">작은 서버</text><rect x="795.0" y="352.0" width="110" height="46" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="804.0" y="362.0" width="6" height="26" rx="3" fill="#c792ea"/><text x="857" y="381" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">큰 GPU</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="296" y1="285" x2="335" y2="222" stroke="#ff7b72" stroke-width="4" stroke-dasharray="6 5"/><circle cx="390" cy="262" r="16" fill="#ff7b72"/><path d="M383 255 l14 14 M397 255 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="75" y="179" width="190" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="170" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">내용은 안 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="188" width="118" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="756" y1="285" x2="795" y2="222" stroke="#7ee7c7" stroke-width="4"/><line x1="756" y1="305" x2="795" y2="368" stroke="#7ee7c7" stroke-width="4"/><circle cx="850" cy="262" r="16" fill="#7ee7c7"/><path d="M842 262 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="850" cy="328" r="16" fill="#7ee7c7"/><path d="M842 328 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="525" y="179" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="650" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">/api/drawing 보고 구분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="791" y="348" width="118" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="442" width="400" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">경로·쿠키로 나누려면 L7이 필요해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도면 요청과 일반 문의가 섞여 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4는 겉봉만 봐서 가르지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L7은 경로를 읽어 큰 GPU로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경로·쿠키 기준이면 L7을 써요</text></g>

