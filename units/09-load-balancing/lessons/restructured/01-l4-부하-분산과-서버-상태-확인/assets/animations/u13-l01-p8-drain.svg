<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버 한 대를 빼도 손님이 모르게</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버 한 대를 빼도 손님이 모르게</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">먼저 빼고, 남은 서버의 여유를 따져요</text>
<rect x="50.0" y="258.0" width="160" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="130" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로드 밸런서</text><rect x="318.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="327.0" y="177.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="387" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .11</text><rect x="318.0" y="267.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="327.0" y="277.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="387" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .12</text><rect x="318.0" y="367.0" width="124" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="327.0" y="377.0" width="6" height="26" rx="3" fill="#7ee7c7"/><text x="387" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 .13</text><line x1="210" y1="290" x2="318" y2="290" stroke="#3d4b60" stroke-width="3"/><line x1="210" y1="290" x2="318" y2="390" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="210" y1="290" x2="318" y2="190" stroke="#3d4b60" stroke-width="3"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="181" width="380" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="470" y="181" width="304" height="18" rx="5" fill="#ff7b72"/><rect x="470" y="281" width="380" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="470" y="281" width="228" height="18" rx="5" fill="#7ee7c7"/><rect x="470" y="381" width="380" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="470" y="381" width="228" height="18" rx="5" fill="#7ee7c7"/><text x="660" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">서버 .11 CPU 80%·오류</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="210" y1="290" x2="318" y2="190" stroke="#ff7b72" stroke-width="3" stroke-dasharray="6 5"/><rect x="165" y="200" width="170" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="250" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">새 연결에서 제외</text><rect x="318.0" y="167.0" width="124" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><rect x="327.0" y="177.0" width="6" height="26" rx="3" fill="#9aa3b2"/><text x="387" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서버 .11</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="314" y="163" width="132" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="281" width="380" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="470" y="281" width="342" height="18" rx="5" fill="#7ee7c7"/><rect x="470" y="381" width="380" height="18" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="470" y="381" width="342" height="18" rx="5" fill="#7ee7c7"/><text x="660" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">나머지 두 대가 90%(가정)</text><circle cx="890" cy="330" r="16" fill="#7ee7c7"/><path d="M882 330 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="458" y="269" width="404" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="438" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">평소 여유가 있어야 한 대를 빼도 버텨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 .11이 계속 느리고 오류가 나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 연결에서 먼저 빼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남은 두 대가 90%씩 맡아요(가정)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빠진 몫을 받을 여유가 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>