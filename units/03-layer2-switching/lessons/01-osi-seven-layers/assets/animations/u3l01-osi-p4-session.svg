<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>세션 계층: 대화를 이어 가요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">세션 계층: 대화를 이어 가요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">시작하고, 이어 가고, 마쳐요</text>
<rect x="40" y="131" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">7 응용</text><rect x="40" y="177" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="203" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">6 표현</text><rect x="40" y="223" width="250" height="38" rx="8" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="3"/><text x="165" y="249" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">5 세션</text><rect x="40" y="269" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="295" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">4 전송</text><rect x="40" y="315" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="341" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">3 네트워크</text><rect x="40" y="361" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="387" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">2 데이터 링크</text><rect x="40" y="407" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">1 물리</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,196;318,196;318,242;318,242" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(318,242)"><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,242;318,242;318,288;318,288" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="318" y1="448" x2="318" y2="138" stroke="#7ee7c7" stroke-width="5"/><polygon points="318,124 309,140 327,140" fill="#7ee7c7"/><text x="318" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee7c7">받는 쪽</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="173" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="265" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="362" y="254" width="175" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="450" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">배송 시작합니다</text><text x="450" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">시작</text><line x1="540" y1="270" x2="534" y2="270" stroke="#9aa3b2" stroke-width="3"/><polygon points="550,270 526,261 526,279" fill="#9aa3b2"/><rect x="552" y="254" width="175" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">지금 이동 중이에요</text><text x="640" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">이어 감</text><line x1="730" y1="270" x2="724" y2="270" stroke="#9aa3b2" stroke-width="3"/><polygon points="740,270 716,261 716,279" fill="#9aa3b2"/><rect x="742" y="254" width="175" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">배송 완료했어요</text><text x="830" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">마침</text><text x="630" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">배송 알림 · 문의처럼 오가는 대화</text><text x="630" y="440" text-anchor="middle" font-size="16" fill="#9aa3b2">택배에 딱 맞는 담당자는 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="370" y="139" width="520" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="630" y="160.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">세션은 통신 대화의 시작·유지·마무리를 다룹니다.</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위 표현 계층에서 데이터가 내려와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배 장면: 배송 알림처럼 대화가 시작되고 이어지고 끝나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">대화 흐름과 함께 아래 전송 계층으로 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽에서도 아래에서 위로 이어져요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>