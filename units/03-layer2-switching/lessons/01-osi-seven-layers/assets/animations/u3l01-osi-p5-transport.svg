<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>전송 계층: 어느 프로그램까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전송 계층: 어느 프로그램까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">끝에 있는 프로그램 사이의 전달이에요</text>
<rect x="40" y="131" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">7 응용</text><rect x="40" y="177" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="203" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">6 표현</text><rect x="40" y="223" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="249" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">5 세션</text><rect x="40" y="269" width="250" height="38" rx="8" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><text x="165" y="295" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">4 전송</text><rect x="40" y="315" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="341" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">3 네트워크</text><rect x="40" y="361" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="387" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">2 데이터 링크</text><rect x="40" y="407" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">1 물리</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,242;318,242;318,288;318,288" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(318,288)"><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,288;318,288;318,334;318,334" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="318" y1="448" x2="318" y2="138" stroke="#7ee7c7" stroke-width="5"/><polygon points="318,124 309,140 327,140" fill="#7ee7c7"/><text x="318" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee7c7">받는 쪽</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="219" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="311" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><polygon points="400,294 440,260 480,294" fill="#9aa3b2"/><rect x="408" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="431" y="314" width="18" height="28" fill="#3d4b60"/><text x="440" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">보내는 사람</text><rect x="492" y="276" width="36" height="28" rx="3" fill="#ffb454"/><rect x="506" y="276" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><line x1="545" y1="336" x2="620" y2="336" stroke="#ffb454" stroke-width="4"/><polygon points="636,336 612,326 612,346" fill="#ffb454"/><rect x="640" y="190" width="250" height="200" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="765" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">받는 컴퓨터</text><rect x="665" y="238" width="200" height="38" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="765.0" y="262.76" text-anchor="middle" font-size="16" font-weight="700" fill="#3d4b60">브라우저</text><rect x="665" y="286" width="200" height="38" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="765.0" y="310.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">게임</text><rect x="665" y="334" width="200" height="38" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="765.0" y="358.76" text-anchor="middle" font-size="16" font-weight="700" fill="#3d4b60">메신저</text><rect x="661" y="282" width="208" height="46" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/><text x="630" y="440" text-anchor="middle" font-size="16" fill="#9aa3b2">장치까지는 3계층, 그 안의 프로그램까지는 4계층이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="370" y="139" width="520" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="630" y="160.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">전송은 끝에 있는 프로그램 사이의 전달입니다.</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위 세션 계층에서 데이터가 내려와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배 장면: 보내는 사람에서 받는 사람 쪽 프로그램까지 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아래 네트워크 계층에 목적지로 보내 달라고 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽에서는 아래에서 올라와 알맞은 프로그램에 전해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>