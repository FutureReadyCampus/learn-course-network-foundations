<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>택배 여정을 일곱 역할로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">택배 여정을 일곱 역할로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">위에서 아래로 내려가고, 받는 쪽에서는 올라와요</text>
<rect x="40" y="131" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">7 응용</text><rect x="40" y="177" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="203" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">6 표현</text><rect x="40" y="223" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="249" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">5 세션</text><rect x="40" y="269" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="295" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">4 전송</text><rect x="40" y="315" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="341" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">3 네트워크</text><rect x="40" y="361" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="387" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">2 데이터 링크</text><rect x="40" y="407" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">1 물리</text><g><line x1="296" y1="150" x2="314" y2="150" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,150 306,141 306,159" fill="#9aa3b2"/><text x="344" y="157" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">무엇을 보낼지 (물건·부탁)</text><line x1="296" y1="196" x2="314" y2="196" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,196 306,187 306,205" fill="#9aa3b2"/><text x="344" y="203" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">알아볼 수 있는 포장</text><line x1="296" y1="242" x2="314" y2="242" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,242 306,233 306,251" fill="#9aa3b2"/><text x="344" y="249" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">배송 중 오가는 안내</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="296" y1="288" x2="314" y2="288" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,288 306,279 306,297" fill="#9aa3b2"/><text x="344" y="295" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">보내는 사람 → 받는 사람</text><line x1="296" y1="334" x2="314" y2="334" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,334 306,325 306,343" fill="#9aa3b2"/><text x="344" y="341" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">목적지 주소와 분류</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="296" y1="380" x2="314" y2="380" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,380 306,371 306,389" fill="#9aa3b2"/><text x="344" y="387" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">가까운 구간 인계</text><line x1="296" y1="426" x2="314" y2="426" stroke="#9aa3b2" stroke-width="3"/><polygon points="330,426 306,417 306,435" fill="#9aa3b2"/><text x="344" y="433" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">실제 이동 수단 (도로·차량)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,114;318,114;318,242;318,242" keyTimes="0.000;0.025;0.225;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,242;318,242;318,374;318,374" keyTimes="0.000;0.275;0.475;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,380;318,380;318,462;318,462" keyTimes="0.000;0.525;0.725;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="318" y1="448" x2="318" y2="138" stroke="#7ee7c7" stroke-width="5"/><polygon points="318,124 309,140 327,140" fill="#7ee7c7"/><rect x="425" y="442" width="430" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="464.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">받는 쪽에서는 아래에서 위로 올라와요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위쪽 세 역할: 무엇을 보낼지, 포장, 안내</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가운데 두 역할: 보내는 사람 → 받는 사람, 주소와 분류</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아래쪽 두 역할: 가까운 구간 인계, 실제 이동 수단</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽에서는 같은 일곱 역할이 아래에서 위로 올라와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>