<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>네트워크 계층: 어느 네트워크로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">네트워크 계층: 어느 네트워크로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소를 보고 경로를 골라요</text>
<rect x="40" y="131" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">7 응용</text><rect x="40" y="177" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="203" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">6 표현</text><rect x="40" y="223" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="249" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">5 세션</text><rect x="40" y="269" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="295" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">4 전송</text><rect x="40" y="315" width="250" height="38" rx="8" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><text x="165" y="341" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">3 네트워크</text><rect x="40" y="361" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="387" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">2 데이터 링크</text><rect x="40" y="407" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa3b2">1 물리</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,288;318,288;318,334;318,334" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(318,334)"><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="318,334;318,334;318,380;318,380" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="#ffb454"/><rect x="-3" y="-12" width="6" height="24" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="318" y1="448" x2="318" y2="138" stroke="#7ee7c7" stroke-width="5"/><polygon points="318,124 309,140 327,140" fill="#7ee7c7"/><text x="318" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee7c7">받는 쪽</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="265" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="357" width="258" height="46" rx="8" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="470" y1="255" x2="640" y2="345" stroke="#3d4b60" stroke-width="3"/><line x1="640" y1="345" x2="810" y2="255" stroke="#3d4b60" stroke-width="3"/><line x1="640" y1="345" x2="810" y2="395" stroke="#3d4b60" stroke-width="3"/><line x1="470" y1="255" x2="640" y2="345" stroke="#ffb454" stroke-width="6"/><line x1="640" y1="345" x2="810" y2="395" stroke="#ffb454" stroke-width="6"/><rect x="442" y="233" width="56" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="612" y="323" width="56" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="782" y="233" width="56" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="782" y="373" width="56" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="470" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">출발</text><text x="810" y="445" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">목적지</text><text x="560" y="455" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">주소를 읽고 지역과 경로를 골라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="370" y="139" width="520" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="630" y="160.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">네트워크는 목적지와 경로를 찾습니다.</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위 전송 계층에서 데이터가 내려와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배 장면: 주소를 읽고 지역과 분류 경로를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 구간 전달을 아래 데이터 링크 계층에 맡겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽에서는 아래에서 올라와 목적지를 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>