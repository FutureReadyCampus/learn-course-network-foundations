<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>응·표·세 / 전·네 / 데·물</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">응·표·세 / 전·네 / 데·물</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">위에서 아래로 한 번 더 읽어 봐요</text>
<rect x="40" y="131" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">7 응용</text><rect x="40" y="177" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="203" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">6 표현</text><rect x="40" y="223" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="249" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">5 세션</text><rect x="40" y="269" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="295" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">4 전송</text><rect x="40" y="315" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="341" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">3 네트워크</text><rect x="40" y="361" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="387" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">2 데이터 링크</text><rect x="40" y="407" width="250" height="38" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#e6e8ec">1 물리</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="32" y="128" width="266" height="136" rx="10" fill="none" stroke="#6ea8fe" stroke-width="4"/><text x="620" y="192.0" text-anchor="middle" font-size="40" font-weight="700" fill="#6ea8fe">응·표·세</text><text x="620" y="232.0" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">프로그램에 가까운 쪽</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="32" y="266" width="266" height="90" rx="10" fill="none" stroke="#ffb454" stroke-width="4"/><text x="620" y="307.0" text-anchor="middle" font-size="40" font-weight="700" fill="#ffb454">전·네</text><text x="620" y="347.0" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">끝에서 끝까지, 목적지까지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="32" y="358" width="266" height="90" rx="10" fill="none" stroke="#7ee7c7" stroke-width="4"/><text x="620" y="399.0" text-anchor="middle" font-size="40" font-weight="700" fill="#7ee7c7">데·물</text><text x="620" y="439.0" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">가까운 구간과 신호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="330" y1="448" x2="330" y2="138" stroke="#7ee7c7" stroke-width="5"/><polygon points="330,124 321,140 339,140" fill="#7ee7c7"/><line x1="350" y1="130" x2="350" y2="432" stroke="#ffb454" stroke-width="5"/><polygon points="350,448 341,432 359,432" fill="#ffb454"/><text x="450" y="300" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">보내는 쪽 ↓</text><text x="450" y="340" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">받는 쪽 ↑</text><rect x="450" y="442" width="380" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="640" y="463.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">택배는 기억을 돕는 장면일 뿐이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위쪽 세 계층: 응용·표현·세션</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가운데 두 계층: 전송·네트워크</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아래쪽 두 계층: 데이터 링크·물리</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보내는 쪽은 위에서 아래로, 받는 쪽은 아래에서 위로예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>