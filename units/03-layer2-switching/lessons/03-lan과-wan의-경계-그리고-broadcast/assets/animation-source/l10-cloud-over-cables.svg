  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.6;0.62;1" dur="10s" repeatCount="indefinite"/><text x="690" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">인터넷</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="520" y1="300" x2="610" y2="240" stroke="#3d4b60" stroke-width="3" ></line><line x1="520" y1="300" x2="610" y2="370" stroke="#3d4b60" stroke-width="3" ></line><line x1="610" y1="240" x2="770" y2="240" stroke="#3d4b60" stroke-width="3" ></line><line x1="610" y1="370" x2="770" y2="370" stroke="#3d4b60" stroke-width="3" ></line><line x1="770" y1="240" x2="770" y2="370" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"></line><line x1="770" y1="240" x2="835" y2="300" stroke="#3d4b60" stroke-width="3" ></line><line x1="770" y1="370" x2="835" y2="300" stroke="#3d4b60" stroke-width="3" ></line><text x="690" y="230" text-anchor="middle" font-size="18" fill="#9aa3b2">광섬유</text><text x="690" y="412" text-anchor="middle" font-size="18" fill="#9aa3b2">해저 케이블</text><text x="782" y="312" text-anchor="start" font-size="18" fill="#9aa3b2">무선</text><rect x="582" y="223" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="610" y="246.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text><rect x="742" y="223" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="770" y="246.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text><rect x="582" y="353" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="610" y="376.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text><rect x="742" y="353" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="770" y="376.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="520" y1="300" x2="610" y2="240" stroke="#6ea8fe" stroke-width="5" ></line><line x1="610" y1="240" x2="770" y2="240" stroke="#6ea8fe" stroke-width="5" ></line><line x1="770" y1="240" x2="835" y2="300" stroke="#6ea8fe" stroke-width="5" ></line></g>
  <circle r="10" fill="#6ea8fe" opacity="0"><animateMotion path="M520,300 L610,240 L770,240 L835,300" keyPoints="0;0;1;1" keyTimes="0;0.84;0.94;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.835;0.84;0.94;0.945;1" dur="10s" repeatCount="indefinite"/></circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="582" y="223" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="610" y="246.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text><rect x="742" y="223" width="56" height="34" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="770" y="246.48" text-anchor="middle" font-size="18" fill="#e6e8ec">R</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="420" y="276" width="100" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="470" y="307.92" text-anchor="middle" font-size="22" fill="#e6e8ec">PC</text><rect x="835" y="276" width="90" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="880" y="307.92" text-anchor="middle" font-size="22" fill="#e6e8ec">서버</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.58;0.6;1" dur="10s" repeatCount="indefinite"/><rect x="545" y="128" width="290" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="690" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">케이블 대신 구름으로</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.78;0.8;1" dur="10s" repeatCount="indefinite"/><rect x="545" y="128" width="290" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="690" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">실제로는 장비와 케이블</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="525" y="128" width="330" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="690" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">그 위의 주소·경로를 보는 관점</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">포인터는 움직이지만 책상 위엔 화살표가 없습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">OS가 위치를 기억해 그려 주는 논리적 대상입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">인터넷은 케이블 대신 구름으로 그리곤 합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">실제로는 광섬유·해저 케이블·무선·라우터가 있습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0"><tspan fill="#6ea8fe" font-weight="700">논리적</tspan>: 그 위의 주소·경로를 따로 보는 관점
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
