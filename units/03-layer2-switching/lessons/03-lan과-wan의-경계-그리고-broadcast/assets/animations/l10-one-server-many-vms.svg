<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">한 대를 여러 대처럼: 가상화</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">가상 = 가짜가 아니라 다른 규칙과 경계</text>

  <line x1="490" y1="130" x2="490" y2="462" stroke="#3d4b60" stroke-width="2" stroke-dasharray="6 6"></line>
  <rect x="40" y="290" width="430" height="172" rx="10" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/>
  <text x="255" y="318" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">실제 서버 1대</text>
  <text x="60" y="350" text-anchor="start" font-size="18" fill="#9aa3b2">CPU 시간</text>
  <rect x="170" y="334" width="280" height="20" rx="4" fill="#3d4b60"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="334" width="90" height="20" rx="3" fill="#7ee7c7"/><rect x="265" y="334" width="90" height="20" rx="3" fill="#6ea8fe"/><rect x="360" y="334" width="90" height="20" rx="3" fill="#ffb454"/></g>
  <text x="60" y="378" text-anchor="start" font-size="18" fill="#9aa3b2">메모리</text>
  <rect x="170" y="362" width="280" height="20" rx="4" fill="#3d4b60"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="362" width="90" height="20" rx="3" fill="#7ee7c7"/><rect x="265" y="362" width="90" height="20" rx="3" fill="#6ea8fe"/><rect x="360" y="362" width="90" height="20" rx="3" fill="#ffb454"/></g>
  <text x="60" y="406" text-anchor="start" font-size="18" fill="#9aa3b2">저장 공간</text>
  <rect x="170" y="390" width="280" height="20" rx="4" fill="#3d4b60"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.5;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="390" width="90" height="20" rx="3" fill="#7ee7c7"/><rect x="265" y="390" width="90" height="20" rx="3" fill="#6ea8fe"/><rect x="360" y="390" width="90" height="20" rx="3" fill="#ffb454"/></g>
  <text x="60" y="434" text-anchor="start" font-size="18" fill="#9aa3b2">네트워크</text>
  <rect x="170" y="418" width="280" height="20" rx="4" fill="#3d4b60"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="418" width="90" height="20" rx="3" fill="#7ee7c7"/><rect x="265" y="418" width="90" height="20" rx="3" fill="#6ea8fe"/><rect x="360" y="418" width="90" height="20" rx="3" fill="#ffb454"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.24;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="232" width="430" height="42" rx="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="255" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">가상화 소프트웨어</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="152" width="120" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"></rect><text x="120" y="187.92" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">VM 1</text><rect x="195" y="152" width="120" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="255" y="187.92" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">VM 2</text><rect x="330" y="152" width="120" height="56" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="390" y="187.92" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">VM 3</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><line x1="570" y1="224" x2="720" y2="306" stroke="#9aa3b2" stroke-width="3" ></line><line x1="670" y1="224" x2="720" y2="306" stroke="#9aa3b2" stroke-width="3" ></line><line x1="770" y1="224" x2="720" y2="306" stroke="#9aa3b2" stroke-width="3" ></line><line x1="870" y1="224" x2="720" y2="306" stroke="#9aa3b2" stroke-width="3" ></line><rect x="518" y="168" width="200" height="68" rx="10" fill="none" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><rect x="722" y="168" width="200" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="618" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">가상 네트워크 A</text><text x="822" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">가상 네트워크 B</text><rect x="525" y="180" width="90" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="570" y="209.2" text-anchor="middle" font-size="20" fill="#e6e8ec">PC 1</text><rect x="625" y="180" width="90" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="670" y="209.2" text-anchor="middle" font-size="20" fill="#e6e8ec">PC 2</text><rect x="725" y="180" width="90" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="770" y="209.2" text-anchor="middle" font-size="20" fill="#e6e8ec">PC 3</text><rect x="825" y="180" width="90" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="870" y="209.2" text-anchor="middle" font-size="20" fill="#e6e8ec">PC 4</text><rect x="620" y="306" width="200" height="48" rx="8" fill="#171a21" stroke="#e6e8ec" stroke-width="3"></rect><text x="720" y="337.92" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">실제 스위치</text><text x="720" y="390" text-anchor="middle" font-size="20" fill="#9aa3b2">구성·정책은 소프트웨어로</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="555" y="414" width="330" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="720" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">실제 장비 위의 다른 규칙·경계</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">실제 서버 한 대에 CPU·메모리·저장·네트워크가 있습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">가상화 소프트웨어가 그 자원을 관리합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">자원을 나눠 주면 여러 대처럼 보이는 VM이 됩니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">네트워크도 실제 스위치 위에서 논리적으로 나눕니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">가상은 가짜가 아니라 다른 규칙·경계로 관리하는 것
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
