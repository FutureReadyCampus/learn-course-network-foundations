<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">MAC은 링크마다, IP는 끝까지</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">L2는 목적지 MAC을, L3는 목적지 IP를 봅니다</text>

  <rect x="40" y="148" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect>
  <text x="170" y="175" text-anchor="middle" font-size="20" fill="#e6e8ec">HTTP</text>
  <rect x="40" y="194" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect>
  <text x="170" y="221" text-anchor="middle" font-size="20" fill="#e6e8ec">TLS</text>
  <rect x="40" y="240" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect>
  <text x="170" y="267" text-anchor="middle" font-size="20" fill="#e6e8ec">TCP·UDP</text>
  <rect x="40" y="286" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60" keyTimes="0;0.353;0.373;0.98;1" dur="18s" repeatCount="indefinite"/></rect>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.333;0.353;0.98;1" dur="18s" repeatCount="indefinite"/><text x="170" y="313" text-anchor="middle" font-size="20" fill="#e6e8ec">IP</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.353;0.373;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><text x="170" y="313" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">IP · 목적지 IP</text></g>
  <rect x="40" y="332" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#6ea8fe;#6ea8fe;#3d4b60" keyTimes="0;0.187;0.207;0.98;1" dur="18s" repeatCount="indefinite"/></rect>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.167;0.187;0.98;1" dur="18s" repeatCount="indefinite"/><text x="170" y="359" text-anchor="middle" font-size="20" fill="#e6e8ec">Ethernet</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.187;0.207;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><text x="170" y="359" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Ethernet · 목적지 MAC</text></g>
  <rect x="40" y="378" width="260" height="40" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect>
  <text x="170" y="405" text-anchor="middle" font-size="20" fill="#9aa3b2">물리 매체(전기·무선)</text>
  <line x1="455" y1="190" x2="580" y2="190" stroke="#3d4b60" stroke-width="3" ></line>
  <line x1="690" y1="190" x2="815" y2="190" stroke="#3d4b60" stroke-width="3" ></line>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.187;0.207;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><line x1="455" y1="190" x2="580" y2="190" stroke="#6ea8fe" stroke-width="5" ></line><line x1="690" y1="190" x2="815" y2="190" stroke="#6ea8fe" stroke-width="5" ></line><text x="518" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">링크 1</text><text x="752" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">링크 2</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.353;0.373;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><path d="M400,166 V140 H870 V166" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="635" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">네트워크 사이: 목적지 IP</text></g>
  <circle r="10" fill="#7ee7c7" opacity="0"><animateMotion path="M400,190 L635,190" keyPoints="0;0;1;1" keyTimes="0;0.53;0.62;1" calcMode="linear" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.525;0.53;0.62;0.625;1" dur="18s" repeatCount="indefinite"/></circle>
  <circle r="10" fill="#7ee7c7" opacity="0"><animateMotion path="M635,190 L870,190" keyPoints="0;0;1;1" keyTimes="0;0.697;0.787;1" calcMode="linear" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.692;0.697;0.787;0.792;1" dur="18s" repeatCount="indefinite"/></circle>
  <rect x="345" y="166" width="110" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="400" y="197.92" text-anchor="middle" font-size="22" fill="#e6e8ec">PC</text>
  <rect x="580" y="166" width="110" height="48" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="635" y="197.92" text-anchor="middle" font-size="22" fill="#e6e8ec">라우터</text>
  <rect x="815" y="166" width="110" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="870" y="197.92" text-anchor="middle" font-size="22" fill="#e6e8ec">서버</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><text x="518" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">링크 1의 프레임</text><rect x="413" y="250" width="210" height="150" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="518" y="278" text-anchor="middle" font-size="18" fill="#9aa3b2">목적지 MAC</text><text x="518" y="305" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">라우터</text><rect x="425" y="318" width="186" height="72" rx="6" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><text x="518" y="344" text-anchor="middle" font-size="18" fill="#9aa3b2">목적지 IP</text><text x="518" y="376" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">서버</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.747;0.767;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><text x="752" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">링크 2의 새 프레임</text><rect x="647" y="250" width="210" height="150" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="752" y="278" text-anchor="middle" font-size="18" fill="#9aa3b2">목적지 MAC</text><text x="752" y="305" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">서버</text><rect x="659" y="318" width="186" height="72" rx="6" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><text x="752" y="344" text-anchor="middle" font-size="18" fill="#9aa3b2">목적지 IP</text><text x="752" y="376" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">서버</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.767;0.787;0.813;0.833;1" dur="18s" repeatCount="indefinite"/><text x="635" y="444" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">프레임은 새로, MAC은 바뀌고, IP는 그대로</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.853;0.873;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><rect x="345" y="414" width="580" height="54" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/><text x="635" y="448" text-anchor="middle" font-size="20" fill="#e6e8ec">‘LAN=물리, WAN=논리’는 외우기 요령일 뿐, 정의 아님</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">계층마다 역할이 다른 규칙이 쌓여 있습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.157;0.167;0.99;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">Ethernet은 같은 링크에서 <tspan fill="#6ea8fe" font-weight="700">목적지 MAC</tspan>을 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">IP는 네트워크 사이에서 <tspan fill="#ffb454" font-weight="700">목적지 IP</tspan>를 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">링크 1: MAC은 라우터, IP는 서버를 가리킵니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">라우터 뒤 새 프레임: MAC은 바뀌고 IP는 그대로
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">LAN·WAN을 물리·논리로 잇는 그림은 정의가 아닙니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.823;0.833;0.98;0.99;1" dur="18s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 6<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.157;0.167;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">6 / 6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.823;0.833;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/></text></g>
</svg>
