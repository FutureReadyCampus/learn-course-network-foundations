<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-09-basic-export-title lesson-09-basic-export-desc" lang="ko"><title id="lesson-09-basic-export-title">L2 스위치는 MAC 주소로 프레임을 전달한다 · 학습 흐름</title><desc id="lesson-09-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-09-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-09-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/></g><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/1" target="_top" aria-label="Access switch · 단말을 네트워크에 연결하기 페이지로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">Access switch · 단말 연결</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/2" target="_top" aria-label="스위치는 출발지 MAC과 포트를 기억한다 페이지로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">출발지 MAC으로 포트 학습</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/3" target="_top" aria-label="목적지 MAC을 알면 그 포트로 보낸다 페이지로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">목적지 MAC을 알고 있으면 전달</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/4" target="_top" aria-label="목적지를 모르면 같은 VLAN 안에 퍼뜨린다 페이지로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">모르면 같은 VLAN 안에 퍼뜨림</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/5" target="_top" aria-label="Link up · 케이블 연결과 통신 상태 페이지로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">Link up · 포트 상태 확인</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/6" target="_top" aria-label="Uplink와 Distribution switch · 스위치를 이어 붙이기 페이지로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">Uplink와 배포 스위치</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/7" target="_top" aria-label="같은 VLAN의 단말 사이에서 L2 경로 따라가기 페이지로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">같은 VLAN의 L2 경로</tspan></text></a><a href="../../../../../../../../m2-network/unit/3/lesson/2/page/8" target="_top" aria-label="L2 스위치 동작 네 단계로 복습하기 페이지로 이동"><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">네 단계로 동작 복습</tspan></text></a></svg>
