  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="515" y="376" width="130" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="580" y="407.92" text-anchor="middle" font-size="22" fill="#e6e8ec">PC</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.49;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="398" y="262" width="44" height="36" rx="4" fill="#7ee7c7"/><text x="420" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">3</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="558" y="262" width="44" height="36" rx="4" fill="#7ee7c7"/><text x="580" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">5</text></g>
