  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="195" y="376" width="130" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="260" y="407.92" text-anchor="middle" font-size="22" fill="#e6e8ec">노트북</text><text x="245" y="352" text-anchor="end" font-size="18" font-weight="700" fill="#7ee7c7">NIC</text></g>
