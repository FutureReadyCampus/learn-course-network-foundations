<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">NIC가 주고받는 L2 프레임</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">프레임은 한 구간을 건너기 위한 포장입니다</text>

  <g><animate attributeName="opacity" values="1;1;0.4;0.4;1" keyTimes="0;0.2;0.22;0.98;1" dur="10s" repeatCount="indefinite"/><rect x="55" y="132" width="250" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="180" y="167.92" text-anchor="middle" font-size="22" fill="#e6e8ec">기판에 끼우는 카드</text><rect x="355" y="132" width="250" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="480" y="167.92" text-anchor="middle" font-size="22" fill="#e6e8ec">USB 유선 어댑터</text><rect x="655" y="132" width="250" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="780" y="167.92" text-anchor="middle" font-size="22" fill="#e6e8ec">무선 NIC</text></g>
  <line x1="210" y1="346" x2="415" y2="346" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"></line>
  <line x1="545" y1="346" x2="735" y2="346" stroke="#3d4b60" stroke-width="3" ></line>
  <rect x="62" y="300" width="116" height="74" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="72" y="310" width="96" height="54" rx="2" fill="#0f1115"/><path d="M44 378 H196 L208 392 H32 Z" fill="#3d4b60"/>
  <text x="120" y="425" text-anchor="middle" font-size="20" fill="#9aa3b2" >노트북</text>
  <rect x="415" y="322" width="130" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="480" y="353.92" text-anchor="middle" font-size="22" fill="#e6e8ec">공유기</text>
  <rect x="735" y="322" width="170" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="820" y="353.92" text-anchor="middle" font-size="22" fill="#e6e8ec">다음 장비</text>
  <text x="312" y="384" text-anchor="middle" font-size="20" fill="#9aa3b2" >구간 1 · Wi-Fi</text>
  <text x="640" y="384" text-anchor="middle" font-size="20" fill="#9aa3b2" >구간 2 · Ethernet</text>
  <g opacity="0"><animateTransform attributeName="transform" type="translate" values="120,0;120,0;480,0;480,0;815,0;815,0" keyTimes="0;0.63;0.75;0.87;0.97;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.82;0.84;1" dur="10s" repeatCount="indefinite"/><rect x="-105" y="236" width="210" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="-99" y="242" width="68" height="44" rx="6" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="-65" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe" >MAC</text><text x="0" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe" >Wi-Fi 프레임</text></g>
  <g opacity="0"><animateTransform attributeName="transform" type="translate" values="120,0;120,0;480,0;480,0;815,0;815,0" keyTimes="0;0.63;0.75;0.87;0.97;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.86;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="-105" y="236" width="210" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="-99" y="242" width="68" height="44" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="-65" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7" >MAC</text><text x="0" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7" >Ethernet 프레임</text></g>
  <g opacity="0"><animateTransform attributeName="transform" type="translate" values="120,0;120,0;480,0;480,0;815,0;815,0" keyTimes="0;0.63;0.75;0.87;0.97;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="-25" y="242" width="124" height="44" rx="6" fill="#ffb454"/><text x="37" y="272" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115" >패킷</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">카드·USB·무선, 모양은 달라도 역할은 같습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">노트북이 보낼 내용인 <tspan fill="#ffb454" font-weight="700">패킷</tspan>을 준비합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">패킷을 감싸고 MAC 주소를 붙이면 <tspan fill="#6ea8fe" font-weight="700">프레임</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">프레임은 같은 링크의 이웃까지 한 구간을 갑니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">다음 구간에서는 <tspan fill="#7ee7c7" font-weight="700">새 프레임</tspan>으로 다시 포장합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
