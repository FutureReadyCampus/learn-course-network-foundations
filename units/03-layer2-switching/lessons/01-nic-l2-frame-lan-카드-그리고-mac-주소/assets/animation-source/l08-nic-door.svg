<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">NIC는 컴퓨터의 문</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">NIC는 바깥과 잇는 문, 인터페이스는 문이 맞닿는 지점</text>

  <rect x="50" y="140" width="380" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="240" y="178" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec" >컴퓨터 (집)</text>
  <rect x="70" y="226" width="140" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="140" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">문서 작성</text>
  <rect x="245" y="226" width="110" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="300" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">계산</text>
  <text x="220" y="380" text-anchor="middle" font-size="20" fill="#9aa3b2" >집 안에서 끝나는 일</text>
  <circle r="10" fill="#7ee7c7" opacity="0"><animateMotion path="M140,288 Q220,350 300,288" keyPoints="0;0;1;1" keyTimes="0;0.02;0.17;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.015;0.02;0.17;0.175;1" dur="10s" repeatCount="indefinite"/></circle>
  <rect x="710" y="250" width="200" height="80" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="810" y="297.92" text-anchor="middle" font-size="22" fill="#e6e8ec">네트워크</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="470" y1="290" x2="710" y2="290" stroke="#3d4b60" stroke-width="4" ></line></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="400" y="225" width="60" height="90" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="430" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454" >NIC</text><rect x="455" y="190" width="210" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="560" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">NIC (LAN 카드)</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><circle cx="462" cy="290" r="10" fill="#7ee7c7"/><rect x="465" y="318" width="240" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="585" y="344" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">인터페이스 (연결 지점)</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.74;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="470" y1="290" x2="710" y2="290" stroke="#ffb454" stroke-width="5" ></line></g>
  <circle r="10" fill="#ffb454" opacity="0"><animateMotion path="M300,288 Q350,300 400,290 L710,290" keyPoints="0;0;1;1" keyTimes="0;0.62;0.73;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.615;0.62;0.73;0.735;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="10" fill="#ffb454" opacity="0"><animateMotion path="M300,288 Q350,300 400,290 L710,290" keyPoints="0;0;1;1" keyTimes="0;0.68;0.79;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.68;0.79;0.795;1" dur="10s" repeatCount="indefinite"/></circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="460" y="365" width="460" height="95" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="690" y="402" text-anchor="middle" font-size="24" fill="#e6e8ec" >노트북 사양: <tspan fill="#6ea8fe" font-weight="700">Realtek</tspan> <tspan fill="#ffb454" font-weight="700">무선 LAN</tspan></text><text x="690" y="442" text-anchor="middle" font-size="20" fill="#e6e8ec" ><tspan fill="#6ea8fe" font-weight="700">Realtek</tspan> = 회사 이름, <tspan fill="#ffb454" font-weight="700">무선 LAN</tspan> = NIC 종류</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">집 안에서 끝나는 일은 문을 지나지 않습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">네트워크와 신호를 주고받는 장치가 NIC입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">NIC가 네트워크와 맞닿는 지점이 인터페이스
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">웹페이지·사진은 이 연결 지점을 거쳐 나갑니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">‘Realtek 무선 LAN’의 Realtek은 <tspan fill="#6ea8fe" font-weight="700">회사 이름</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
