<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">내 컴퓨터에서 연결 지점 찾기</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">항목 이름은 인터페이스, 주소 값은 MAC 주소</text>

  <defs><clipPath id="tWin"><rect x="60" y="160" width="0" height="32"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.02;0.09;0.98;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><clipPath id="tMac"><rect x="60" y="160" width="0" height="32"><animate attributeName="width" values="0;0;200;200" keyTimes="0;0.677;0.747;1" dur="10s" repeatCount="indefinite"/></rect></clipPath></defs>
  <rect x="40" y="120" width="560" height="344" rx="10" fill="#0b0d10" stroke="#3d4b60" stroke-width="2"/>
  <rect x="40" y="120" width="560" height="30" rx="10" fill="#171a21"/>
  <circle cx="62" cy="135" r="6" fill="#3d4b60"/><circle cx="82" cy="135" r="6" fill="#3d4b60"/><circle cx="102" cy="135" r="6" fill="#3d4b60"/>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.667;0.687;0.98;1" dur="10s" repeatCount="indefinite"/><text x="320" y="141" text-anchor="middle" font-size="18" fill="#9aa3b2" >명령 프롬프트 (Windows)</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="320" y="141" text-anchor="middle" font-size="18" fill="#9aa3b2" >터미널 (Mac)</text></g>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.667;0.687;0.98;1" dur="10s" repeatCount="indefinite"/><text x="60" y="182" font-family="Menlo,Consolas,monospace" font-size="22" fill="#e6e8ec" clip-path="url(#tWin)">C:\&gt; ipconfig /all</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="60" y="230" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">무선 LAN 어댑터 Wi-Fi:</text><text x="60" y="274" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">   Physical Address. . : AA-BB-CC-11-22-33</text><text x="60" y="340" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">Ethernet 어댑터 이더넷:</text><text x="60" y="384" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">   Physical Address. . : AA-BB-CC-44-55-66</text></g></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="60" y="182" font-family="Menlo,Consolas,monospace" font-size="22" fill="#e6e8ec" clip-path="url(#tMac)">% ifconfig</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.757;0.777;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="60" y="230" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">en0: flags=8863&lt;UP,...&gt;</text><text x="60" y="274" font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec" xml:space="preserve">    ether aa:bb:cc:11:22:33</text><text x="60" y="318" font-family="Menlo,Consolas,monospace" font-size="20" fill="#9aa3b2" xml:space="preserve">    status: active</text><text x="60" y="362" font-family="Menlo,Consolas,monospace" font-size="20" fill="#9aa3b2" xml:space="preserve">en1: flags=...</text></g></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.187;0.667;0.687;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="204" width="290" height="36" rx="6" fill="#7ee7c7" fill-opacity="0.12" stroke="#7ee7c7" stroke-width="2"/><line x1="342" y1="222" x2="660" y2="222" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="204" width="240" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">인터페이스</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.667;0.687;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="248" width="540" height="36" rx="6" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="2"/><line x1="592" y1="266" x2="660" y2="266" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="248" width="240" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="780" y="274" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">MAC 주소</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.667;0.687;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="314" width="290" height="36" rx="6" fill="#7ee7c7" fill-opacity="0.12" stroke="#7ee7c7" stroke-width="2"/><line x1="342" y1="332" x2="660" y2="332" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="314" width="240" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">두 번째 인터페이스</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.55;0.667;0.687;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="358" width="540" height="36" rx="6" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="2"/><line x1="592" y1="376" x2="660" y2="376" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="358" width="240" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="780" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">또 다른 MAC 주소</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.767;0.787;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="204" width="300" height="36" rx="6" fill="#7ee7c7" fill-opacity="0.12" stroke="#7ee7c7" stroke-width="2"/><line x1="352" y1="222" x2="660" y2="222" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="204" width="240" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">인터페이스 en0</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.787;0.807;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="52" y="248" width="340" height="36" rx="6" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="2"/><line x1="392" y1="266" x2="660" y2="266" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4"></line><rect x="660" y="248" width="240" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="780" y="274" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">ether = MAC 주소</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.853;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="620" y="330" width="300" height="132" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="770" y="366" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec" >전송률 866 Mbps</text><text x="770" y="404" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7" >÷ 8 ≈ 108 MB/s</text><text x="770" y="442" text-anchor="middle" font-size="20" fill="#9aa3b2" >실제 다운로드 속도 아님</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">Windows 명령 프롬프트에 ipconfig /all 입력
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.157;0.167;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">Wi-Fi 같은 어댑터 항목이 <tspan fill="#7ee7c7" font-weight="700">인터페이스</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">Physical Address 값이 <tspan fill="#ffb454" font-weight="700">MAC 주소</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">Wi-Fi와 Ethernet이 함께 보이면 인터페이스 둘
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">Mac은 ifconfig에서 en0과 <tspan fill="#ffb454" font-weight="700">ether</tspan> 값을 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">속도 Mbps ÷ 8은 MB/s 어림값일 뿐입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.823;0.833;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 6<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.157;0.167;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">6 / 6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.823;0.833;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
