<text x="480" y="510" font-size="24"  fill="#e6e8ec" text-anchor="middle" opacity="0">전역 주소는 앞부분에 할당 조직 정보가 있습니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.48;0.5;1" dur="19.6s" repeatCount="indefinite" /></text>
<text x="480" y="510" font-size="24"  fill="#e6e8ec" text-anchor="middle" opacity="0">일반 주소의 나머지 값은 해당 조직이 할당합니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.77;0.79;1" dur="19.6s" repeatCount="indefinite" /></text>
<text x="480" y="510" font-size="24"  fill="#e6e8ec" text-anchor="middle" opacity="0">개인 Wi-Fi 주소는 제품 고유 주소와 다를 수 있습니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="19.6s" repeatCount="indefinite" /></text>
