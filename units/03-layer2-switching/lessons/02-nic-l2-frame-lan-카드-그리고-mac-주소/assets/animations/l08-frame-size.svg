<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">프레임 크기 세는 법</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">MTU 1,500은 프레임 전체가 아니라 데이터 부분입니다</text>

  <rect x="380" y="140" width="200" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">MTU 1,500</text>
  <rect x="230" y="196" width="500" height="56" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="232.0" text-anchor="middle" font-size="20" fill="#e6e8ec" >데이터(payload) 최대 1,500B</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.187;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><rect x="130" y="196" width="100" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="180.0" y="232.0" text-anchor="middle" font-size="20" fill="#e6e8ec" >헤더 14B</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.5;0.52;0.98;1" dur="18s" repeatCount="indefinite"/><rect x="730" y="196" width="100" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="780.0" y="232.0" text-anchor="middle" font-size="20" fill="#e6e8ec" >FCS 4B</text></g></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.5;0.52;1" dur="18s" repeatCount="indefinite"/><path d="M130,270 V282 H830 V270" fill="none" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7" >프레임 1,518바이트 (FCS 포함)</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><path d="M130,270 V282 H730 V270" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="430.0" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe" >1,514바이트 (FCS 빼고 표시)</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><rect x="45" y="380" width="170" height="60" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="130" y="417.92" text-anchor="middle" font-size="22" fill="#e6e8ec">큰 사진 파일</text><line x1="222" y1="410" x2="262" y2="410" stroke="#9aa3b2" stroke-width="3" ></line><polygon points="262,402 274,410 262,418" fill="#9aa3b2"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.687;0.707;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><rect x="287.5" y="388" width="115" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="345" y="417.2" text-anchor="middle" font-size="20" fill="#e6e8ec">프레임 1</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.712;0.732;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><rect x="422.5" y="388" width="115" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="480" y="417.2" text-anchor="middle" font-size="20" fill="#e6e8ec">프레임 2</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.737;0.757;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><rect x="557.5" y="388" width="115" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="615" y="417.2" text-anchor="middle" font-size="20" fill="#e6e8ec">프레임 3</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.762;0.782;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><rect x="692.5" y="388" width="115" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="750" y="417.2" text-anchor="middle" font-size="20" fill="#e6e8ec">프레임 4</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.787;0.807;0.833;0.853;1" dur="18s" repeatCount="indefinite"/><text x="895" y="418" text-anchor="middle" font-size="24" fill="#9aa3b2" >…</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.853;0.97;0.99;1" dur="18s" repeatCount="indefinite"/><text x="130" y="376" text-anchor="start" font-size="22" font-weight="700" fill="#7ee7c7" >Jumbo Frame</text><rect x="130" y="392" width="100" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="180.0" y="425.0" text-anchor="middle" font-size="20" fill="#e6e8ec" >헤더</text><rect x="230" y="392" width="660" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 6"/><text x="560.0" y="425.0" text-anchor="middle" font-size="20" fill="#e6e8ec" >더 큰 데이터 부분 · 크기는 장비·설정마다 다름</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">일반 Ethernet의 데이터 부분은 최대 1,500바이트
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.157;0.167;0.99;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">앞에 <tspan fill="#6ea8fe" font-weight="700">Ethernet 헤더 14바이트</tspan>가 붙습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">뒤의 <tspan fill="#7ee7c7" font-weight="700">FCS 4바이트</tspan>까지 세면 1,518바이트
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">FCS를 빼고 표시하면 1,514바이트가 됩니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">큰 사진은 여러 프레임으로 나뉘어 오갈 수 있습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0"><tspan fill="#7ee7c7" font-weight="700">Jumbo Frame</tspan> 크기는 장비·설정마다 다릅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.823;0.833;0.98;0.99;1" dur="18s" repeatCount="indefinite"/></text>
  </g>

<g aria-label="재생 진행 막대" data-stage-count="6"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;140;140" keyTimes="0;0.167000;1" dur="18s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="188" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="188" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;140;140" keyTimes="0;0.167000;0.333000;1" dur="18s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="336" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="336" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;140;140" keyTimes="0;0.333000;0.500000;1" dur="18s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="484" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;140;140" keyTimes="0;0.500000;0.667000;1" dur="18s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="5"><rect x="632" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="632" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;140;140" keyTimes="0;0.667000;0.833000;1" dur="18s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="6"><rect x="780" y="532" width="140" height="6" rx="3" fill="#394554"/><rect x="780" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;140" keyTimes="0;0.833000;1" dur="18s" repeatCount="indefinite"/></rect></g></g></svg>