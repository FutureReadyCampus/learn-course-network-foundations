<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 190" role="img" aria-labelledby="lesson-20-flow-title lesson-20-flow-desc" lang="ko">
<title id="lesson-20-flow-title">내 컴퓨터 안을 가리키는 IP 주소 · 학습 흐름</title>
<desc id="lesson-20-flow-desc">자기 컴퓨터 안에 접속하는 이유, 같은 컴퓨터 안의 두 프로세스, 127.0.0.1과 localhost, 루프백 통신의 범위를 차례로 살펴봅니다.</desc>
<defs><marker id="lesson-20-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs>
<style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style>
<g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-20-arrow)"><path d="M268 88 H292"/><path d="M546 88 H570"/><path d="M824 88 H848"/></g>
<g text-anchor="middle">
<rect x="18" y="28" width="250" height="120" rx="10"/><text x="143" y="70"><tspan x="143">자기 컴퓨터 안에</tspan><tspan x="143" dy="27">접속하는 이유</tspan></text>
<rect x="296" y="28" width="250" height="120" rx="10"/><text x="421" y="70"><tspan x="421">한 컴퓨터 안의</tspan><tspan x="421" dy="27">두 프로세스</tspan></text>
<rect x="574" y="28" width="250" height="120" rx="10"/><text x="699" y="70"><tspan x="699">127.0.0.1과</tspan><tspan x="699" dy="27">localhost</tspan></text>
<rect x="852" y="28" width="250" height="120" rx="10"/><text x="977" y="70"><tspan x="977">루프백 통신은</tspan><tspan x="977" dy="27">컴퓨터 안에서 끝난다</tspan></text>
</g>
</svg>
