<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DHCP가 네트워크 설정을 채워 준다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DHCP가 네트워크 설정을 채워 준다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">연결하면 IP·마스크·게이트웨이·DNS를 받아 와요</text>
<rect x="50" y="140" width="370" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="235" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">새 노트북</text><text x="70" y="223" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">IP 주소</text><text x="70" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">서브넷 마스크</text><text x="70" y="327" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">기본 게이트웨이</text><text x="70" y="379" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">DNS 서버</text><rect x="620" y="170" width="280" height="220" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="760" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">DHCP 서버</text><rect x="645" y="220" width="230" height="150" rx="10" fill="#0f1115" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="8 6"/><text x="760" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">설정 서랍</text><text x="760" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">192.168.0.100</text><text x="760" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">255.255.255.0</text><text x="760" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">192.168.0.1</text><text x="760" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">8.8.8.8</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="195" width="170" height="42" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="320" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">?</text><rect x="235" y="247" width="170" height="42" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="320" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">?</text><rect x="235" y="299" width="170" height="42" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="320" y="329" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">?</text><rect x="235" y="351" width="170" height="42" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/><text x="320" y="381" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="195" width="170" height="42" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="223" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.100</text><rect x="235" y="247" width="170" height="42" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">255.255.255.0</text><rect x="235" y="299" width="170" height="42" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="327" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.1</text><rect x="235" y="351" width="170" height="42" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="379" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">8.8.8.8</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="158" y="108" width="155" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="235" y="130.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">손으로 직접 입력</text><circle cx="95" cy="124" r="16" fill="#ff7b72"/><path d="M88 117 l14 14 M102 117 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="235" y="436" text-anchor="middle" font-size="20" font-weight="700" fill="#ff7b72">기기·장소를 바꿀 때마다 다시 해야 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="760" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.100</text><text x="760" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">255.255.255.0</text><text x="760" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.1</text><text x="760" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">8.8.8.8</text><line x1="610" y1="285" x2="446" y2="285" stroke="#7ee7c7" stroke-width="7"/><polygon points="430,285 454,272 454,298" fill="#7ee7c7"/><text x="520" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">채워 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="120" cy="436" r="16" fill="#7ee7c7"/><path d="M112 436 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="150" y="443" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">설정 전달 = 자동 · 회선이 동작해야 인터넷</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결했지만 설정 칸이 비어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 입력하면 바꿀 때마다 번거로워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DHCP 서버가 설정 값을 채워 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">‘자동’은 설정 전달이에요, 회선도 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>