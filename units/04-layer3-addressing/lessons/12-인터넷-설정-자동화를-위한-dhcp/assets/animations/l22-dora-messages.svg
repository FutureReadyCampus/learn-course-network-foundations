<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DORA 네 메시지로 주소를 확정한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DORA 네 메시지로 주소를 확정한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Discover · Offer · Request · ACK, 메시지는 UDP로 오가요</text>
<rect x="109" y="132" width="121" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="170" y="156.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">클라이언트</text><rect x="732" y="132" width="117" height="35" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="790" y="156.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">DHCP 서버</text><line x1="170" y1="175" x2="170" y2="462" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"/><line x1="790" y1="175" x2="790" y2="462" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 6"/><g><line x1="178" y1="225" x2="766" y2="225" stroke="#ffb454" stroke-width="5"/><polygon points="782,225 758,214 758,236" fill="#ffb454"/><circle cx="210" cy="201" r="15" fill="#ffb454"/><text x="210" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">D</text><text x="480" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">Discover</text><text x="480" y="249" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">DHCP 서버 있나요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="782" y1="295" x2="194" y2="295" stroke="#6ea8fe" stroke-width="5"/><polygon points="178,295 202,284 202,306" fill="#6ea8fe"/><circle cx="750" cy="271" r="15" fill="#6ea8fe"/><text x="750" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">O</text><text x="480" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Offer</text><text x="480" y="319" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">이 주소를 쓸 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="365" x2="766" y2="365" stroke="#ffb454" stroke-width="5"/><polygon points="782,365 758,354 758,376" fill="#ffb454"/><circle cx="210" cy="341" r="15" fill="#ffb454"/><text x="210" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">R</text><text x="480" y="355" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">Request</text><text x="480" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">이 제안을 사용할게요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="782" y1="435" x2="194" y2="435" stroke="#6ea8fe" stroke-width="5"/><polygon points="178,435 202,424 202,446" fill="#6ea8fe"/><circle cx="750" cy="411" r="15" fill="#6ea8fe"/><text x="750" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">A</text><text x="480" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">ACK</text><text x="480" y="459" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">임대를 시작하세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">DHCP의 ACK는 TCP의 ACK와 다른 메시지예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 DHCP 서버를 찾아요 (Discover)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 주소와 설정을 제안해요 (Offer)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 그 제안을 선택해요 (Request)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 확인하면 임대가 시작돼요 (ACK)</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>