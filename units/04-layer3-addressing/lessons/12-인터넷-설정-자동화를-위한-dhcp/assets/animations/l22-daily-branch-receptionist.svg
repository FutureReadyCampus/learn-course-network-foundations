<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>지점 접수원이 본사에 전달한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">지점 접수원이 본사에 전달한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">다른 건물의 안내센터는 접수원이 이어 줘요</text>
<rect x="40" y="150" width="280" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="180" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">우리 지점</text><rect x="640" y="150" width="280" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="780" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">본사</text><line x1="240" y1="300" x2="440" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="300" x2="720" y2="300" stroke="#3d4b60" stroke-width="3"/><polygon points="140,294 180,260 220,294" fill="#9aa3b2"/><rect x="148" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="171" y="314" width="18" height="28" fill="#3d4b60"/><text x="180" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">새 직원</text><polygon points="740,294 780,260 820,294" fill="#9aa3b2"/><rect x="748" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="771" y="314" width="18" height="28" fill="#3d4b60"/><text x="780" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">본사 안내센터</text><rect x="446" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="440" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="458" y="288" width="44" height="18" fill="#3d4b60"/><text x="480" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">접수원</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><circle cx="180" cy="300" r="50" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.9"/><circle cx="180" cy="300" r="85" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.6"/><circle cx="180" cy="300" r="120" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.35"/><text x="180" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">같은 지점 안에서만 들려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><circle cx="330" cy="300" r="16" fill="#ff7b72"/><path d="M323 293 l14 14 M337 293 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">넘어가지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="381" y="223" width="198" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="246.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">대신 전달하는 접수원</text><rect x="432" y="258" width="96" height="92" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="530" y1="300" x2="704" y2="300" stroke="#7ee7c7" stroke-width="6"/><polygon points="720,300 696,288 696,312" fill="#7ee7c7"/><text x="585" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">본사로 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="381" y="223" width="198" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="246.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">대신 전달하는 접수원</text><line x1="720" y1="300" x2="546" y2="300" stroke="#6ea8fe" stroke-width="6"/><polygon points="530,300 554,288 554,312" fill="#6ea8fe"/><line x1="430" y1="300" x2="266" y2="300" stroke="#6ea8fe" stroke-width="6"/><polygon points="250,300 274,288 274,312" fill="#6ea8fe"/><text x="585" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">응답 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;440,300;440,300" keyTimes="0.000;0.525;0.600;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 직원이 지점 안에서 큰 소리로 불러요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 소리는 지점 밖으로 넘어가지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접수원이 본사 안내센터로 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">본사의 답을 접수원이 가져와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>