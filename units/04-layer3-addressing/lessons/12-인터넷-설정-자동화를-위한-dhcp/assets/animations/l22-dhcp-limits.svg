<title>DHCP가 해결하는 일, 못 하는 일</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DHCP가 해결하는 일, 못 하는 일</text>
