<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주소 풀에서 주소를 임대한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주소 풀에서 주소를 임대한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">범위와 숫자는 구조를 보여 주는 예시예요</text>
<text x="480" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">주소 풀: 192.168.0.100 ~ .200 (예시)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="104" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="146.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.100</text><rect x="200" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="242.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.101</text><rect x="296" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="338.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.102</text><rect x="392" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="434.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.103</text><rect x="488" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="530.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.104</text><rect x="584" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="626.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">…</text><rect x="680" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="722.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.199</text><rect x="776" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="818.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.200</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="104" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="146.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.100</text><rect x="200" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="242.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.101</text><rect x="296" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="338.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.102</text><rect x="392" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="434.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.103</text><rect x="488" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="530.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.104</text><rect x="584" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="626.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">…</text><rect x="680" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="722.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.199</text><rect x="776" y="200" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="818.0" y="235.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">.200</text><rect x="104" y="200" width="84" height="56" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><text x="146.0" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">.100</text><text x="146.0" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">A</text><rect x="200" y="200" width="84" height="56" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><text x="242.0" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">.101</text><text x="242.0" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">B</text><rect x="104" y="268" width="84" height="10" rx="5" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="104" y="268" width="84" height="10" rx="5" fill="#ffb454"/><rect x="200" y="268" width="84" height="10" rx="5" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="200" y="268" width="84" height="10" rx="5" fill="#6ea8fe"/><rect x="104" y="360" width="220" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="214.0" y="393.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">노트북 A → .100</text><rect x="344" y="360" width="220" height="54" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="454.0" y="393.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">노트북 B → .101</text><text x="146.0" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">임대 기간</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="104" y="268" width="84" height="10" rx="5" fill="#0f1115" stroke="#0f1115" stroke-width="1"/><rect x="104" y="268" width="84" height="10" rx="5" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="104" y="268" width="42" height="10" rx="5" fill="#ffb454"/><rect x="200" y="268" width="84" height="10" rx="5" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="200" y="268" width="42" height="10" rx="5" fill="#6ea8fe"/><rect x="348" y="302" width="265" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="324.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">갱신하면 같은 주소를 계속 써요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="200" width="84" height="56" rx="6" fill="none" stroke="#ff7b72" stroke-width="4" stroke-dasharray="8 6"/><circle cx="374" cy="204" r="16" fill="#ff7b72"/><path d="M367 197 l14 14 M381 197 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="620" y="360" width="250" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="745.0" y="393.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">수동 설정한 장치 .102</text><line x1="745" y1="360" x2="338.0" y2="262" stroke="#ff7b72" stroke-width="3" stroke-dasharray="5 4"/><text x="480" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#ff7b72">풀과 고정 주소는 겹치지 않게 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버는 나눠 줄 주소 목록(풀)을 가져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트마다 주소 하나를 일정 기간 임대해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">갱신하면 같은 주소를 계속 쓸 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">풀의 주소를 따로 설정하면 충돌해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>