<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안내서에서 받은 값을 찾아 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안내서에서 받은 값을 찾아 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">여러 안내서 중 지금 쓰는 것부터 골라요</text>
<rect x="40" y="165" width="220" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="150" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">내 집 안내서</text><rect x="40" y="231" width="220" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="150" y="264" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">옛집 안내서</text><rect x="40" y="297" width="220" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="150" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">손님용 안내서</text><rect x="290" y="150" width="630" height="270" rx="10" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="305" y="176" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">입주 안내서 (예시)</text><text x="310" y="220" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">관리사무소 배정: 예</text><text x="310" y="250" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">내 호수: 302호</text><text x="310" y="280" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">우리 동네: 우리 단지</text><text x="310" y="310" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">정문(출구): 정문</text><text x="310" y="340" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">배정한 곳: 관리사무소</text><text x="310" y="370" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">계약 시작 / 만료: …</text><text x="310" y="400" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">안내 전화: 안내 데스크</text><g><rect x="40" y="165" width="220" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="150" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">내 집 안내서</text><rect x="68" y="126" width="163" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="150" y="147.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">쓰는 것부터 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="300" y="224" width="610" height="30" rx="6" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="300" y="254" width="610" height="30" rx="6" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="300" y="284" width="610" height="30" rx="6" fill="none" stroke="#6ea8fe" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="300" y="314" width="610" height="30" rx="6" fill="none" stroke="#ffb454" stroke-width="4"/><rect x="300" y="344" width="610" height="30" rx="6" fill="none" stroke="#ffb454" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="300" y="374" width="610" height="30" rx="6" fill="none" stroke="#c792ea" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="385" y="430" width="430" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="600" y="452.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">스스로 붙인 임시 번호는 관리사무소가 준 게 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내서가 여러 장이면 쓰는 것부터 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호수, 동네, 정문 항목을 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">배정해 준 곳과 계약 기간을 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 전화 항목까지 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>