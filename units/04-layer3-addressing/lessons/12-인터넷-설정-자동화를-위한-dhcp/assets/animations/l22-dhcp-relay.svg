<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>릴레이가 다른 네트워크 서버에 잇는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">릴레이가 다른 네트워크 서버에 잇는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">브로드캐스트는 라우터를 넘지 않으니까요</text>
<rect x="40" y="150" width="280" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="180" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">클라이언트 네트워크</text><rect x="640" y="150" width="280" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="780" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버 네트워크</text><line x1="240" y1="300" x2="440" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="300" x2="720" y2="300" stroke="#3d4b60" stroke-width="3"/><rect x="146" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="154" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="136,312 224,312 232,324 128,324" fill="#6ea8fe"/><text x="180" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">새 PC</text><rect x="746" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="754" y="271" width="52" height="32" fill="#3d4b60"/><rect x="775" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="758" y="320" width="44" height="5" fill="#6ea8fe"/><text x="780" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">DHCP 서버</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="180" cy="300" r="50" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.9"/><circle cx="180" cy="300" r="85" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.6"/><circle cx="180" cy="300" r="120" fill="none" stroke="#ffb454" stroke-width="3" stroke-opacity="0.35"/><text x="180" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">같은 네트워크 안에서만 퍼져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="330" cy="300" r="16" fill="#ff7b72"/><path d="M323 293 l14 14 M337 293 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">넘어가지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="415" y="223" width="130" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="246.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">DHCP 릴레이</text><rect x="432" y="258" width="96" height="92" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="530" y1="300" x2="704" y2="300" stroke="#7ee7c7" stroke-width="6"/><polygon points="720,300 696,288 696,312" fill="#7ee7c7"/><text x="585" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서버로 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="415" y="223" width="130" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="246.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">DHCP 릴레이</text><line x1="720" y1="300" x2="546" y2="300" stroke="#6ea8fe" stroke-width="6"/><polygon points="530,300 554,288 554,312" fill="#6ea8fe"/><line x1="430" y1="300" x2="266" y2="300" stroke="#6ea8fe" stroke-width="6"/><polygon points="250,300 274,288 274,312" fill="#6ea8fe"/><text x="585" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">응답 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;440,300;440,300" keyTimes="0.000;0.525;0.600;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Discover는 같은 네트워크 안에만 퍼져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터는 브로드캐스트를 넘기지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">릴레이가 설정된 DHCP 서버로 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버의 응답을 릴레이가 가져와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>