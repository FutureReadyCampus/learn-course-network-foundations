<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DHCP가 알려 주는 네 가지 설정</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DHCP가 알려 주는 네 가지 설정</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">값마다 맡은 일이 달라요 (예시 값)</text>
<rect x="40" y="150" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="175" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">IP 주소</text><text x="60" y="196" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">내 인터페이스를 구별해요</text><rect x="40" y="218" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="243" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">서브넷 마스크</text><text x="60" y="264" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">같은 네트워크인지 가려요</text><rect x="40" y="286" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="311" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">기본 게이트웨이</text><text x="60" y="332" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">다른 네트워크로 가는 첫 라우터</text><rect x="40" y="354" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="379" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">DNS 서버</text><text x="60" y="400" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">도메인 이름 → IP 주소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="150" width="380" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="60" y="175" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">IP 주소</text><text x="60" y="196" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">내 인터페이스를 구별해요</text><rect x="656" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="664" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="646,282 734,282 742,294 638,294" fill="#6ea8fe"/><text x="690" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="607" y="172" width="166" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="690" y="197.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">192.168.0.100</text><line x1="690" y1="210" x2="690" y2="232" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="218" width="380" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><text x="60" y="243" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">서브넷 마스크</text><text x="60" y="264" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">같은 네트워크인지 가려요</text><ellipse cx="690" cy="280" rx="190" ry="115" fill="none" stroke="#6ea8fe" stroke-width="4" stroke-dasharray="9 7"/><text x="690" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 네트워크</text><rect x="576" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="584" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="566,302 654,302 662,314 558,314" fill="#6ea8fe"/><text x="610" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="730" y="250" width="70" height="46" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="765" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">PC</text><rect x="860" y="380" width="60" height="40" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="890" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">밖</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="286" width="380" height="56" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="4"/><text x="60" y="311" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">기본 게이트웨이</text><text x="60" y="332" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">다른 네트워크로 가는 첫 라우터</text><rect x="506" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="514" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="496,312 584,312 592,324 488,324" fill="#6ea8fe"/><text x="540" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="690" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M675 294 h28 l-7 -7 M705 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="690" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">첫 라우터</text><line x1="590" y1="300" x2="650" y2="300" stroke="#ffb454" stroke-width="4"/><line x1="735" y1="300" x2="784" y2="300" stroke="#ffb454" stroke-width="5"/><polygon points="800,300 776,289 776,311" fill="#ffb454"/><rect x="800" y="230" width="120" height="120" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="860" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">다른 네트워크</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="354" width="380" height="56" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="4"/><text x="60" y="379" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">DNS 서버</text><text x="60" y="400" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">도메인 이름 → IP 주소</text><rect x="506" y="286" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="514" y="293" width="52" height="30" fill="#3d4b60"/><polygon points="496,332 584,332 592,344 488,344" fill="#6ea8fe"/><text x="540" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="780" y="190" width="130" height="56" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="845" y="224" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">DNS 서버</text><line x1="590" y1="232" x2="754" y2="232" stroke="#c792ea" stroke-width="4"/><polygon points="770,232 746,222 746,242" fill="#c792ea"/><text x="690" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">example.com ?</text><line x1="770" y1="292" x2="606" y2="292" stroke="#7ee7c7" stroke-width="4"/><polygon points="590,292 614,282 614,302" fill="#7ee7c7"/><text x="690" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">203.0.113.20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">DHCP는 설정을 전달할 뿐, 운반·이름 변환은 하지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 주소는 내 인터페이스를 구별해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서브넷 마스크는 같은 네트워크를 가려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기본 게이트웨이는 밖으로 나가는 첫 라우터예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS 서버는 이름을 IP 주소로 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>