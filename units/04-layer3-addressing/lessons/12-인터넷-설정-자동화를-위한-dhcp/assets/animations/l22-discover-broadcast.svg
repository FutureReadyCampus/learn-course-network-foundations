<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Discover는 모두에게 방송한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Discover는 모두에게 방송한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버 주소를 모를 때 같은 범위에 퍼뜨려요</text>
<rect x="56" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="46,282 134,282 142,294 38,294" fill="#6ea8fe"/><text x="90" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">새 PC</text><rect x="248" y="264" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="260" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="277" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="294" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="311" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="328" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="300" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="560" cy="280" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M545 274 h28 l-7 -7 M575 286 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="560" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><rect x="166" y="359" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="174" y="366" width="52" height="32" fill="#3d4b60"/><rect x="195" y="405" width="10" height="10" fill="#6ea8fe"/><rect x="178" y="415" width="44" height="5" fill="#6ea8fe"/><text x="200" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 2</text><rect x="366" y="359" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="374" y="366" width="52" height="32" fill="#3d4b60"/><rect x="395" y="405" width="10" height="10" fill="#6ea8fe"/><rect x="378" y="415" width="44" height="5" fill="#6ea8fe"/><text x="400" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">DHCP 서버</text><rect x="690" y="190" width="230" height="190" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="805" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">다른 네트워크</text><rect x="771" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="779" y="281" width="52" height="32" fill="#3d4b60"/><rect x="800" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="783" y="330" width="44" height="5" fill="#6ea8fe"/><text x="805" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 3</text><line x1="150" y1="280" x2="250" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="350" y1="280" x2="520" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="600" y1="280" x2="690" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="272" y1="296" x2="210" y2="350" stroke="#3d4b60" stroke-width="3"/><line x1="328" y1="296" x2="390" y2="350" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="98" y="184" width="165" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="180" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">출발지 IP 0.0.0.0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="83" y="150" width="233" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="171.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">목적지 IP 255.255.255.255</text><rect x="62" y="118" width="277" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="139.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">목적지 MAC FF:FF:FF:FF:FF:FF</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="90,270;90,270;300,280;300,280" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,290;300,290;205,362;205,362" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,290;300,290;398,362;398,362" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,280;300,280;520,280;520,280" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="535" cy="280" r="16" fill="#ff7b72"/><path d="M528 273 l14 14 M542 273 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="640" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">라우터는 다른 네트워크로 넘기지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 IP 주소도 서버 주소도 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적지 IP와 MAC을 모두 브로드캐스트로 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치는 같은 범위의 모든 포트로 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터는 다른 네트워크로 넘기지 않아요</text></g>

