<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안내 카드 네 가지는 서로 다른 일을 한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안내 카드 네 가지는 서로 다른 일을 한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">호수, 동네 경계, 정문, 안내 전화</text>
<rect x="40" y="150" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="175" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">호수</text><text x="60" y="196" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">우리 집을 구별해요</text><rect x="40" y="218" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="243" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">동네(단지) 경계</text><text x="60" y="264" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">같은 동네인지 가려요</text><rect x="40" y="286" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="311" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">정문 (바깥 출구)</text><text x="60" y="332" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">다른 동네로 나가는 첫 문</text><rect x="40" y="354" width="380" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="60" y="379" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">안내 전화</text><text x="60" y="400" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">이름 → 호수를 알려 줘요</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="150" width="380" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="60" y="175" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">호수</text><text x="60" y="196" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">우리 집을 구별해요</text><polygon points="650,264 690,230 730,264" fill="#9aa3b2"/><rect x="658" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="681" y="284" width="18" height="28" fill="#3d4b60"/><text x="690" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="648" y="172" width="84" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="690" y="197.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">302호</text><line x1="690" y1="210" x2="690" y2="232" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="218" width="380" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><text x="60" y="243" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">동네(단지) 경계</text><text x="60" y="264" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">같은 동네인지 가려요</text><ellipse cx="690" cy="280" rx="190" ry="115" fill="none" stroke="#6ea8fe" stroke-width="4" stroke-dasharray="9 7"/><text x="690" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 동네</text><polygon points="570,284 610,250 650,284" fill="#9aa3b2"/><rect x="578" y="284" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="601" y="304" width="18" height="28" fill="#3d4b60"/><text x="610" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="730" y="250" width="70" height="46" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="765" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">이웃</text><rect x="860" y="380" width="60" height="40" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="890" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">밖</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="286" width="380" height="56" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="4"/><text x="60" y="311" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">정문 (바깥 출구)</text><text x="60" y="332" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">다른 동네로 나가는 첫 문</text><polygon points="500,294 540,260 580,294" fill="#9aa3b2"/><rect x="508" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="531" y="314" width="18" height="28" fill="#3d4b60"/><text x="540" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="656" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="650" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="668" y="288" width="44" height="18" fill="#3d4b60"/><text x="690" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">정문</text><line x1="590" y1="300" x2="650" y2="300" stroke="#ffb454" stroke-width="4"/><line x1="735" y1="300" x2="784" y2="300" stroke="#ffb454" stroke-width="5"/><polygon points="800,300 776,289 776,311" fill="#ffb454"/><rect x="800" y="230" width="120" height="120" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="860" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">다른 동네</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="40" y="354" width="380" height="56" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="4"/><text x="60" y="379" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">안내 전화</text><text x="60" y="400" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">이름 → 호수를 알려 줘요</text><polygon points="500,314 540,280 580,314" fill="#9aa3b2"/><rect x="508" y="314" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="531" y="334" width="18" height="28" fill="#3d4b60"/><text x="540" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="780" y="190" width="130" height="56" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="845" y="224" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">안내 전화</text><line x1="590" y1="232" x2="754" y2="232" stroke="#c792ea" stroke-width="4"/><polygon points="770,232 746,222 746,242" fill="#c792ea"/><text x="690" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">홍길동 집?</text><line x1="770" y1="292" x2="606" y2="292" stroke="#7ee7c7" stroke-width="4"/><polygon points="590,292 614,282 614,302" fill="#7ee7c7"/><text x="690" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">3동 302호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">관리사무소는 카드를 줄 뿐, 배달·안내는 하지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호수는 우리 집을 구별해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동네 경계는 같은 동네인지 가려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정문은 다른 동네로 나가는 첫 문이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 전화는 이름을 호수로 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>