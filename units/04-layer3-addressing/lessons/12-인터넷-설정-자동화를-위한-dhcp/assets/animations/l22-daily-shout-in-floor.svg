<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>처음 온 사람은 모두에게 물어본다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">처음 온 사람은 모두에게 물어본다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">안내 데스크 주소를 모르니 층 전체에 외쳐요</text>
<polygon points="50,264 90,230 130,264" fill="#9aa3b2"/><rect x="58" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="81" y="284" width="18" height="28" fill="#3d4b60"/><text x="90" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">새 입주자</text><rect x="266" y="258" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="260" y="250" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="278" y="268" width="44" height="18" fill="#3d4b60"/><text x="300" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">층 방송</text><polygon points="520,270 560,246 600,270" fill="#6ea8fe"/><rect x="524" y="270" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="540" y="286" width="40" height="22" fill="#3d4b60"/><text x="560" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">층 사이 문</text><polygon points="160,389 200,355 240,389" fill="#9aa3b2"/><rect x="168" y="389" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="191" y="409" width="18" height="28" fill="#3d4b60"/><text x="200" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이웃</text><rect x="366" y="378" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="360" y="370" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="378" y="388" width="44" height="18" fill="#3d4b60"/><text x="400" y="440" text-anchor="middle" font-size="17" fill="#9aa3b2">안내 데스크</text><rect x="690" y="190" width="230" height="190" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="805" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">다른 층</text><polygon points="765,304 805,270 845,304" fill="#9aa3b2"/><rect x="773" y="304" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="796" y="324" width="18" height="28" fill="#3d4b60"/><text x="805" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이웃</text><line x1="150" y1="280" x2="250" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="350" y1="280" x2="520" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="600" y1="280" x2="690" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="272" y1="296" x2="210" y2="350" stroke="#3d4b60" stroke-width="3"/><line x1="328" y1="296" x2="390" y2="350" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="95" y="184" width="170" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="180" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">내 호수: 아직 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="129" y="150" width="141" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="171.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">받는 사람: 모두</text><rect x="127" y="118" width="146" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="139.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">방송: 이 층 전체</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="90,270;90,270;300,280;300,280" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,290;300,290;205,362;205,362" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,290;300,290;398,362;398,362" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,280;300,280;520,280;520,280" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><circle cx="535" cy="280" r="16" fill="#ff7b72"/><path d="M528 273 l14 14 M542 273 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="640" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">다른 쪽으로 넘기지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 호수도, 안내 데스크 위치도 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">‘받는 사람: 모두’로 층 방송을 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방송은 같은 층 사람들에게 모두 들려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">층 사이 문은 방송을 넘기지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>