<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 630" role="img" aria-labelledby="lesson-22-flow-title lesson-22-flow-desc" lang="ko">
<title id="lesson-22-flow-title">DHCP로 네트워크 설정을 자동으로 받기 · 학습 흐름</title>
<desc id="lesson-22-flow-desc">DHCP가 필요한 이유, 서버가 주는 설정, 임대 주소 풀, Discover 브로드캐스트, DORA 교환, 릴레이, 기기에서 설정 확인, 핵심 정리 순서로 학습합니다.</desc>
