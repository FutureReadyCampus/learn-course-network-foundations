<style>.learning-flow{background:#0f1115}.learning-flow text{font:500 22px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style>
<g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-22-flow-arrow)"><path d="M268 169 H292"/><path d="M546 169 H570"/><path d="M824 169 H848"/><path d="M977 218 V303 H143 V363"/><path d="M268 413 H292"/><path d="M546 413 H570"/><path d="M824 413 H848"/></g>
<g text-anchor="middle">
<rect x="18" y="118" width="250" height="100" rx="12"/><text x="143" y="158"><tspan x="143">설정이 필요한</tspan><tspan x="143" dy="30">이유</tspan></text>
<rect x="296" y="118" width="250" height="100" rx="12"/><text x="421" y="158"><tspan x="421">DHCP 클라이언트와</tspan><tspan x="421" dy="30">서버</tspan></text>
<rect x="574" y="118" width="250" height="100" rx="12"/><text x="699" y="158"><tspan x="699">주소 풀과</tspan><tspan x="699" dy="30">임대 기간</tspan></text>
<rect x="852" y="118" width="250" height="100" rx="12"/><text x="977" y="158"><tspan x="977">Discover를</tspan><tspan x="977" dy="30">브로드캐스트</tspan></text>
<rect x="18" y="363" width="250" height="100" rx="12"/><text x="143" y="403"><tspan x="143">DORA 네 메시지</tspan><tspan x="143" dy="30">주소 요청·확정</tspan></text>
<rect x="296" y="363" width="250" height="100" rx="12"/><text x="421" y="403"><tspan x="421">다른 네트워크의</tspan><tspan x="421" dy="30">DHCP 릴레이</tspan></text>
<rect x="574" y="363" width="250" height="100" rx="12"/><text x="699" y="403"><tspan x="699">내 기기에서</tspan><tspan x="699" dy="30">설정 확인</tspan></text>
<rect x="852" y="363" width="250" height="100" rx="12"/><text x="977" y="403"><tspan x="977">핵심 정리</tspan><tspan x="977" dy="30">R · A · L</tspan></text>
