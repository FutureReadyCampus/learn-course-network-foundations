<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상자 한도와 물건 한도는 다르다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상자 한도와 물건 한도는 다르다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상자 전체의 한도와 담을 수 있는 물건의 한도는 달라요</text>
<g><line x1="130" y1="190" x2="830" y2="190" stroke="#6ea8fe" stroke-width="4"/><line x1="130" y1="190" x2="130" y2="202" stroke="#6ea8fe" stroke-width="4"/><line x1="830" y1="190" x2="830" y2="202" stroke="#6ea8fe" stroke-width="4"/><rect x="396" y="148" width="167" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="170.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">큰 상자 한도 15kg</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.318;0.333;1" dur="11s" repeatCount="indefinite" begin="2s"/><rect x="130" y="215" width="700" height="64" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="253.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">중간 상자 전체</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.348;1" dur="11s" repeatCount="indefinite" begin="2s"/><rect x="130" y="215" width="110" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="185.0" y="252.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">포장</text><rect x="240" y="215" width="110" height="64" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="295.0" y="252.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">송장</text><rect x="350" y="215" width="480" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="590.0" y="254.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">물건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.682;1" dur="11s" repeatCount="indefinite" begin="2s"/><line x1="350" y1="293" x2="830" y2="293" stroke="#7ee7c7" stroke-width="4"/><line x1="350" y1="293" x2="350" y2="281" stroke="#7ee7c7" stroke-width="4"/><line x1="830" y1="293" x2="830" y2="281" stroke="#7ee7c7" stroke-width="4"/><rect x="482" y="302" width="215" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="590.0" y="325.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">담을 수 있는 물건의 한도</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.682;1" dur="11s" repeatCount="indefinite" begin="2s"/><text x="480" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">물건 한도는 상자 한도보다 작아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.318;0.333;1" dur="11s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 상자 전체에는 한도 15kg이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.348;0.652;0.667;1" dur="11s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포장과 송장이 자리를 차지해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.682;1" dur="11s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 물건 한도는 상자 한도와 같지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="3"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="288" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;288;288" keyTimes="0;0.333000;1" dur="11s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="336" y="532" width="288" height="6" rx="3" fill="#394554"/><rect x="336" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;288;288" keyTimes="0;0.333000;0.667000;1" dur="11s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="632" y="532" width="288" height="6" rx="3" fill="#394554"/><rect x="632" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;288" keyTimes="0;0.667000;1" dur="11s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="291.894" text-anchor="middle" font-size="62.5538" font-weight="750" letter-spacing="-1" fill="#e6e8ec">상자 한도와 물건 한도는 다르다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.030769;0.130769;0.153846;1" dur="13s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.030769;0.130769;0.153846;1" dur="13s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.130769;0.153846;1" dur="13s" repeatCount="indefinite"/></g></svg>