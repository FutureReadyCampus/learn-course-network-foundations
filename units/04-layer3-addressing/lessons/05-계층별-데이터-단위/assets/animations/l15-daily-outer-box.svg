<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>큰 상자는 중간 상자 한도보다 크다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">큰 상자는 중간 상자 한도보다 크다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">송장과 봉인은 한도 밖에 붙어요</text>
<g><rect x="300" y="210" width="360" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="247.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">중간 상자</text><line x1="300" y1="190" x2="660" y2="190" stroke="#6ea8fe" stroke-width="4"/><line x1="300" y1="190" x2="300" y2="202" stroke="#6ea8fe" stroke-width="4"/><line x1="660" y1="190" x2="660" y2="202" stroke="#6ea8fe" stroke-width="4"/><rect x="359" y="148" width="243" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="170.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">한도 15kg (중간 상자 기준)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="190" y="210" width="110" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="245.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">큰 상자 송장</text><rect x="660" y="210" width="100" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">봉인 테이프</text><line x1="190" y1="294" x2="760" y2="294" stroke="#c792ea" stroke-width="4"/><line x1="190" y1="294" x2="190" y2="282" stroke="#c792ea" stroke-width="4"/><line x1="760" y1="294" x2="760" y2="282" stroke="#c792ea" stroke-width="4"/><rect x="414" y="304" width="122" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="475.0" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">큰 상자 전체</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="392" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">큰 상자 전체 ≠ 중간 상자 한도</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="32" y="365" width="156" height="66" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="110" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">이어진 리본</text><text x="110" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">프로그램</text><text x="202" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">→</text><rect x="217" y="365" width="156" height="66" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="295" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">조각 상자</text><text x="295" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">나눠 담기</text><text x="387" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">→</text><rect x="402" y="365" width="156" height="66" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">중간 상자</text><text x="480" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">한도가 있어요</text><text x="572" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">→</text><rect x="587" y="365" width="156" height="66" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="665" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">큰 상자</text><text x="665" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">링크용 포장</text><text x="757" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">→</text><rect x="772" y="365" width="156" height="66" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="850" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">도로</text><text x="850" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">트럭 이동</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한도 15kg은 중간 상자에 적용돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자에는 송장과 봉인이 더 붙어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자 전체를 한도와 같다고 보면 안 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">리본 → 조각 → 중간 상자 → 큰 상자 → 도로</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="290.053" text-anchor="middle" font-size="57.293" font-weight="750" letter-spacing="-1" fill="#e6e8ec">큰 상자는 중간 상자 한도보다 크다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>