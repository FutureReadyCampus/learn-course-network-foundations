<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>같은 책, 보는 곳마다 달라지는 이름</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">같은 책, 보는 곳마다 달라지는 이름</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">겹쳐 포장될수록 바깥 상자의 이름으로 불러요</text>
<g><text x="60" y="184" text-anchor="start" font-size="26" font-weight="700" fill="#ffb454">L4</text><text x="740" y="183" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">작은 상자</text><rect x="560" y="150" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="180.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">책</text><rect x="490" y="150" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="180.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">작은 라벨</text><rect x="485" y="145" width="180" height="60" rx="8" fill="none" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><text x="60" y="259" text-anchor="start" font-size="26" font-weight="700" fill="#6ea8fe">L3</text><text x="740" y="258" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">중간 상자</text><rect x="560" y="225" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="255.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">책</text><rect x="490" y="225" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="255.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">작은 라벨</text><rect x="420" y="225" width="70" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="255.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">중간 라벨</text><rect x="415" y="220" width="250" height="60" rx="8" fill="none" stroke="#6ea8fe" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><text x="60" y="334" text-anchor="start" font-size="26" font-weight="700" fill="#c792ea">L2</text><text x="740" y="333" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">큰 상자</text><rect x="560" y="300" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="330.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">책</text><rect x="490" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">작은 라벨</text><rect x="420" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">중간 라벨</text><rect x="350" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="385.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">큰 라벨</text><rect x="660" y="300" width="60" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="690.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">봉인</text><rect x="345" y="295" width="380" height="60" rx="8" fill="none" stroke="#c792ea" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="60" y="409" text-anchor="start" font-size="26" font-weight="700" fill="#9aa3b2">L1</text><text x="740" y="408" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">도로 위 이동</text><line x1="350" y1="410" x2="720" y2="410" stroke="#9aa3b2" stroke-width="4"/><rect x="440" y="382" width="90" height="30" rx="4" fill="#c792ea"/><rect x="530" y="392" width="34" height="20" rx="3" fill="#9aa3b2"/><circle cx="462" cy="418" r="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><circle cx="512" cy="418" r="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="450" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">트럭은 새 상자가 아니라, 큰 상자를 실어 날라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 상자는 책에 라벨 하나를 더한 단위예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 상자는 작은 상자를 담은 단위예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자는 라벨과 봉인이 붙은 가장 바깥 단위예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도로 위에서는 큰 상자가 그대로 실려 가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>