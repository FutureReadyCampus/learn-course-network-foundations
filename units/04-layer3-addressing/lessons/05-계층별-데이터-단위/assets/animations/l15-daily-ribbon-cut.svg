<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>긴 리본을 한 칸 길이로 잘라 담는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">긴 리본을 한 칸 길이로 잘라 담는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">나머지가 남으면 마지막 조각이 짧아요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.385;0.400;1" dur="19s" repeatCount="indefinite"/><rect x="80" y="150" width="720" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">긴 리본</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.215;0.385;0.400;1" dur="19s" repeatCount="indefinite"/><line x1="240" y1="138" x2="240" y2="206" stroke="#ffb454" stroke-width="3" stroke-dasharray="5 4"/><line x1="400" y1="138" x2="400" y2="206" stroke="#ffb454" stroke-width="3" stroke-dasharray="5 4"/><line x1="560" y1="138" x2="560" y2="206" stroke="#ffb454" stroke-width="3" stroke-dasharray="5 4"/><line x1="720" y1="138" x2="720" y2="206" stroke="#ffb454" stroke-width="3" stroke-dasharray="5 4"/><line x1="80" y1="132" x2="240" y2="132" stroke="#ffb454" stroke-width="4"/><line x1="80" y1="132" x2="80" y2="144" stroke="#ffb454" stroke-width="4"/><line x1="240" y1="132" x2="240" y2="144" stroke="#ffb454" stroke-width="4"/><rect x="112" y="90" width="96" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="160.0" y="111.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">한 칸 길이</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.415;0.585;0.600;1" dur="19s" repeatCount="indefinite"/><rect x="117" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="192.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">1</text><rect x="281" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="356.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">2</text><rect x="445" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="520.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">3</text><rect x="609" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="684.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">4</text><rect x="773" y="262" width="70" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="808.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">5</text><rect x="737" y="320" width="143" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="808" y="341.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">마지막은 짧아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.615;1" dur="19s" repeatCount="indefinite"/><rect x="47" y="262" width="28" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="61.0" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454"></text><rect x="75" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">1</text><rect x="239" y="262" width="28" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="253.0" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454"></text><rect x="267" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="342.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">2</text><rect x="431" y="262" width="28" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="445.0" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454"></text><rect x="459" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="534.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">3</text><rect x="623" y="262" width="28" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="637.0" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454"></text><rect x="651" y="262" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="726.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">4</text><rect x="815" y="262" width="28" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="829.0" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454"></text><rect x="843" y="262" width="70" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="878.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">5</text><rect x="413" y="216" width="133" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="238.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">조각마다 송장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.815;1" dur="19s" repeatCount="indefinite"/><rect x="80" y="376" width="720" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="406" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">다시 이어 붙은 리본</text><polygon points="440,326 428,344 452,344" fill="#6ea8fe"/><line x1="440" y1="344" x2="440" y2="370" stroke="#6ea8fe" stroke-width="4"/><text x="470" y="360" text-anchor="start" font-size="18" font-weight="700" fill="#6ea8fe">받는 쪽에서 이어 붙여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.185;0.200;1" dur="19s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아주 긴 리본을 보낸다고 해 볼게요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.215;0.385;0.400;1" dur="19s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 칸에 담을 길이대로 눈금을 그어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.415;0.585;0.600;1" dur="19s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">눈금대로 자르면 마지막 조각은 더 짧아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.615;0.785;0.800;1" dur="19s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조각마다 송장을 붙여 상자에 담아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.815;1" dur="19s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽에서 다시 이어 붙여요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="5"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;169.6;169.6" keyTimes="0;0.200000;1" dur="19s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="217.6" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="217.6" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.200000;0.400000;1" dur="19s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="395.2" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="395.2" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.400000;0.600000;1" dur="19s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="572.8" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="572.8" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6;169.6" keyTimes="0;0.600000;0.800000;1" dur="19s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="5"><rect x="750.4" y="532" width="169.6" height="6" rx="3" fill="#394554"/><rect x="750.4" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;169.6" keyTimes="0;0.800000;1" dur="19s" repeatCount="indefinite"/></rect></g></g></svg>