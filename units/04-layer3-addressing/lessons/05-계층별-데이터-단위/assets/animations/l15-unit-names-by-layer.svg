<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>계층마다 달라지는 데이터 이름</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">계층마다 달라지는 데이터 이름</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">L4 세그먼트 → L3 패킷 → L2 프레임, L1은 비트와 신호</text>
<g><text x="60" y="184" text-anchor="start" font-size="26" font-weight="700" fill="#ffb454">L4</text><text x="740" y="183" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">세그먼트</text><rect x="560" y="150" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="180.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">데이터</text><rect x="490" y="150" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="180.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP</text><rect x="485" y="145" width="180" height="60" rx="8" fill="none" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="60" y="259" text-anchor="start" font-size="26" font-weight="700" fill="#6ea8fe">L3</text><text x="740" y="258" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">IP 패킷</text><rect x="560" y="225" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="255.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">데이터</text><rect x="490" y="225" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="255.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP</text><rect x="420" y="225" width="70" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="255.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP</text><rect x="415" y="220" width="250" height="60" rx="8" fill="none" stroke="#6ea8fe" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="60" y="334" text-anchor="start" font-size="26" font-weight="700" fill="#c792ea">L2</text><text x="740" y="333" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">프레임</text><rect x="560" y="300" width="100" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="610.0" y="330.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">데이터</text><rect x="490" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="525.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP</text><rect x="420" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP</text><rect x="350" y="300" width="70" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="385.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">프레임</text><rect x="660" y="300" width="60" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="690.0" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">FCS</text><rect x="345" y="295" width="380" height="60" rx="8" fill="none" stroke="#c792ea" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="60" y="409" text-anchor="start" font-size="26" font-weight="700" fill="#9aa3b2">L1</text><text x="740" y="408" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">비트 · 신호</text><rect x="350" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="364" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text><rect x="381" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="395" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="412" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="426" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="443" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="457" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text><rect x="474" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="488" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="505" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="519" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text><rect x="536" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="550" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text><rect x="567" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="581" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="598" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="612" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text><rect x="629" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="643" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="660" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="674" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><rect x="691" y="380" width="28" height="40" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="705" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="450" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">L1은 새 단위가 아니라 프레임을 비트와 신호로 전달해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4(TCP)가 다루는 단위는 세그먼트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L3(IP)가 다루는 단위는 패킷이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L2가 다루는 단위는 프레임이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L1은 프레임을 비트와 신호로 전달해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>