<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>MTU는 패킷 전체, MSS는 TCP 데이터</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">MTU는 패킷 전체, MSS는 TCP 데이터</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">기본 IPv4·TCP 헤더 20B씩, 옵션이 없는 예예요</text>
<g><line x1="130" y1="190" x2="830" y2="190" stroke="#6ea8fe" stroke-width="4"/><line x1="130" y1="190" x2="130" y2="202" stroke="#6ea8fe" stroke-width="4"/><line x1="830" y1="190" x2="830" y2="202" stroke="#6ea8fe" stroke-width="4"/><rect x="329" y="148" width="303" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="170.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">MTU 1,500B (IP 패킷 전체의 상한)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="130" y="215" width="700" height="64" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="253.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">IP 패킷 전체</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="130" y="215" width="110" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="185.0" y="252.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더 20B</text><rect x="240" y="215" width="590" height="64" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="535.0" y="253.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">TCP 세그먼트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="130" y="215" width="110" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="185.0" y="252.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더 20B</text><rect x="240" y="215" width="110" height="64" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="295.0" y="252.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더 20B</text><rect x="350" y="215" width="480" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="590.0" y="254.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">MSS 1,460B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite" begin="2s"/><line x1="350" y1="293" x2="830" y2="293" stroke="#7ee7c7" stroke-width="4"/><line x1="350" y1="293" x2="350" y2="281" stroke="#7ee7c7" stroke-width="4"/><line x1="830" y1="293" x2="830" y2="281" stroke="#7ee7c7" stroke-width="4"/><rect x="442" y="302" width="296" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="590.0" y="325.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">MSS = 1,500 − 20 − 20 = 1,460</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">헤더 옵션이나 IP 버전에 따라 달라질 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MTU 1,500B는 IP 패킷 전체의 상한이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 헤더가 20B를 차지해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP 헤더 20B를 빼면 MSS는 1,460B예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">옵션이나 IP 버전에 따라 달라질 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="288.701" text-anchor="middle" font-size="53.4314" font-weight="750" letter-spacing="-1" fill="#e6e8ec">MTU는 패킷 전체, MSS는 TCP 데이터</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>