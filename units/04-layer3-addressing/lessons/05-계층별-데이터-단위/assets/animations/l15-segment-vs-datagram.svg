t x="530" y="170" width="110" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="585.0" y="198.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">메시지</text><rect x="680" y="170" width="110" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="735.0" y="198.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">메시지</text><rect x="530" y="250" width="140" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="600.0" y="277.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe"></text><rect x="530" y="250" width="30" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="545.0" y="276.32" text-anchor="middle" font-size="12" font-weight="700" fill="#6ea8fe">UDP</text><text x="620" y="279" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">데이터</text><rect x="680" y="250" width="140" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="750.0" y="277.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe"></text><rect x="680" y="250" width="30" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="695.0" y="276.32" text-anchor="middle" font-size="12" font-weight="700" fill="#6ea8fe">UDP</text><text x="770" y="279" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">데이터</text><rect x="630" y="300" width="100" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="680" y="321.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">Datagram</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="125" y="350" width="165" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="207.5" y="377.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea"></text><rect x="125" y="350" width="30" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="140.0" y="376.68" text-anchor="middle" font-size="13" font-weight="700" fill="#c792ea">IP</text><rect x="157" y="352" width="131" height="40" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="1"/><text x="223" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Segment</text><rect x="300" y="350" width="165" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="382.5" y="377.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea"></text><rect x="300" y="350" width="30" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="315.0" y="376.68" text-anchor="middle" font-size="13" font-weight="700" fill="#c792ea">IP</text><rect x="332" y="352" width="131" height="40" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="1"/><text x="398" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Segment</text><rect x="525" y="350" width="165" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="607.5" y="377.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea"></text><rect x="525" y="350" width="30" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="540.0" y="376.68" text-anchor="middle" font-size="13" font-weight="700" fill="#c792ea">IP</text><rect x="557" y="352" width="131" height="40" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="1"/><text x="623" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Datagram</text><rect x="700" y="350" width="165" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="782.5" y="377.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea"></text><rect x="700" y="350" width="30" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="715.0" y="376.68" text-anchor="middle" font-size="13" font-weight="700" fill="#c792ea">IP</text><rect x="732" y="352" width="131" height="40" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="1"/><text x="798" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">Datagram</text><rect x="365" y="402" width="230" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="424.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">IP Packet 안에 담겨 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="456" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">말할 땐 ‘패킷’이라 불러도, 정확히는 이름이 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP는 Stream을 나눈 Segment를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UDP는 메시지 하나가 Datagram이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 IP 패킷의 페이로드로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정확히 말할 땐 이름을 구별해요</text></g>

