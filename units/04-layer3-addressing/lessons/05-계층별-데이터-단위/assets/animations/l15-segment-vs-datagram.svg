<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TCP 세그먼트와 UDP 데이터그램</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TCP 세그먼트와 UDP 데이터그램</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">L4 단위는 다르고, 둘 다 IP 패킷에 담겨요</text>
