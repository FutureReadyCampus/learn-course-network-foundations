<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상자는 그대로, 트럭은 구간마다 바뀐다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상자는 그대로, 트럭은 구간마다 바뀐다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">허브에서 상자를 내려 다음 구간 트럭에 실어요</text>
<polygon points="50,364 90,330 130,364" fill="#9aa3b2"/><rect x="58" y="364" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="81" y="384" width="18" height="28" fill="#3d4b60"/><text x="90" y="436" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서점</text><polygon points="440,360 480,336 520,360" fill="#6ea8fe"/><rect x="444" y="360" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="460" y="376" width="40" height="22" fill="#3d4b60"/><text x="480" y="420" text-anchor="middle" font-size="17" fill="#9aa3b2">물류 허브</text><polygon points="830,364 870,330 910,364" fill="#9aa3b2"/><rect x="838" y="364" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="861" y="384" width="18" height="28" fill="#3d4b60"/><text x="870" y="436" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 집</text><line x1="150" y1="395" x2="440" y2="395" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="395" x2="810" y2="395" stroke="#3d4b60" stroke-width="3"/><text x="295" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">구간 1</text><text x="665" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">구간 2</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">책 조각 A</text><rect x="249" y="154" width="141" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="175.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">내용물: 책 조각</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="195" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="245.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">송장</text><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">책 조각 A</text><rect x="251" y="154" width="138" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="320" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">송장 붙은 상자</text><text x="290" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">서점 → 내 집</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="125" y="200" width="70" height="64" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="160.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">트럭</text><rect x="195" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="245.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">송장</text><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">책 조각 A</text><rect x="405" y="200" width="60" height="64" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="435.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">봉인</text><rect x="222" y="154" width="135" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">트럭 (링크 1)</text><text x="290" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">서점 → 내 집</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="505" y="200" width="70" height="64" rx="6" fill="#171a21" stroke="#4dd0e1" stroke-width="3"/><text x="540.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#4dd0e1">트럭</text><rect x="575" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="625.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">송장</text><rect x="675" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="730.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">책 조각 A</text><rect x="785" y="200" width="60" height="64" rx="6" fill="#171a21" stroke="#4dd0e1" stroke-width="3"/><text x="815.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#4dd0e1">봉인</text><rect x="602" y="154" width="135" height="33" rx="16" fill="#4dd0e1" stroke="#4dd0e1" stroke-width="2"/><text x="670" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">트럭 (링크 2)</text><text x="670" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">서점 → 내 집</text><text x="480" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">상자(주소)는 그대로, 트럭(구간)만 새로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책 조각 하나가 내용물이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장을 붙이면 상자가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자를 구간 1 트럭에 실어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허브가 상자를 구간 2 트럭에 옮겨 실어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>