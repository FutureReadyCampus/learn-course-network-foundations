<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>보내는 쪽과 받는 쪽은 방향이에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">보내는 쪽과 받는 쪽은 방향이에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">고정된 직업이 아니라 지금 따라가는 짐의 방향</text>
<polygon points="70,284 110,250 150,284" fill="#9aa3b2"/><rect x="78" y="284" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="101" y="304" width="18" height="28" fill="#3d4b60"/><text x="110" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 집</text><polygon points="810,284 850,250 890,284" fill="#9aa3b2"/><rect x="818" y="284" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="304" width="18" height="28" fill="#3d4b60"/><text x="850" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서점</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="770" y1="290" x2="208" y2="290" stroke="#6ea8fe" stroke-width="9"/><polygon points="190,290 216,274 216,306" fill="#6ea8fe"/><rect x="807" y="173" width="86" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="850" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">송신 측</text><rect x="67" y="173" width="86" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">수신 측</text><text x="480" y="250" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">서점 → 내 집: 책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="290" x2="752" y2="290" stroke="#6ea8fe" stroke-width="9"/><polygon points="770,290 744,274 744,306" fill="#6ea8fe"/><rect x="67" y="173" width="86" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="110" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">송신 측</text><rect x="807" y="173" width="86" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">수신 측</text><text x="480" y="250" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">내 집 → 서점: 보내는 책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="255" x2="752" y2="255" stroke="#7ee7c7" stroke-width="4"/><polygon points="770,255 744,244 744,266" fill="#7ee7c7"/><text x="480" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">짧은 주문서</text><line x1="770" y1="330" x2="208" y2="330" stroke="#6ea8fe" stroke-width="10"/><polygon points="190,330 216,313 216,347" fill="#6ea8fe"/><text x="480" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">책</text><rect x="35" y="174" width="150" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="110" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">보내기도 받기도</text><rect x="775" y="174" width="150" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="850" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">보내기도 받기도</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="340" x2="770" y2="340" stroke="#3d4b60" stroke-width="3"/><rect x="256" y="298" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="250" y="290" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="268" y="308" width="44" height="18" fill="#3d4b60"/><text x="290" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">접수소</text><polygon points="370,310 410,286 450,310" fill="#6ea8fe"/><rect x="374" y="310" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="390" y="326" width="40" height="22" fill="#3d4b60"/><text x="410" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><polygon points="510,310 550,286 590,310" fill="#6ea8fe"/><rect x="514" y="310" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="530" y="326" width="40" height="22" fill="#3d4b60"/><text x="550" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><rect x="636" y="298" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="630" y="290" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="648" y="308" width="44" height="18" fill="#3d4b60"/><text x="670" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">접수소</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">접수소는 같은 구간 안, 물류센터는 구간 사이</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서점이 책을 보내면 서점이 보내는 쪽이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내가 책을 보내면 내가 보내는 쪽이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주문서는 내 집이, 책은 서점이 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간에는 여러 접수소와 물류센터가 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="290.456" text-anchor="middle" font-size="58.445" font-weight="750" letter-spacing="-1" fill="#e6e8ec">보내는 쪽과 받는 쪽은 방향이에요</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>