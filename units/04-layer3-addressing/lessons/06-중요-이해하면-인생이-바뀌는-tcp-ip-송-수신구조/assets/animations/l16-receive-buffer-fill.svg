<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>수신 버퍼에 도착한 일과 읽는 일</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">수신 버퍼에 도착한 일과 읽는 일</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">도착한 바이트는 프로그램이 읽을 때까지 기다려요</text>
<rect x="330" y="210" width="360" height="80" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><rect x="60" y="215" width="150" height="70" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="135" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">TCP</text><rect x="790" y="215" width="130" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="855" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">브라우저</text><text x="510.0" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">수신 버퍼 64,000B</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="510.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">비어 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="334" y="214" width="8" height="72" rx="6" fill="#6ea8fe" fill-opacity=".75"/><line x1="210" y1="250" x2="308" y2="250" stroke="#c792ea" stroke-width="5"/><polygon points="326,250 300,238 300,262" fill="#c792ea"/><text x="510.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">1,460B 도착 → 62,540B 남음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="334" y="214" width="250" height="72" rx="6" fill="#6ea8fe" fill-opacity=".75"/><line x1="210" y1="250" x2="308" y2="250" stroke="#c792ea" stroke-width="7"/><polygon points="326,250 300,236 300,264" fill="#c792ea"/><line x1="690" y1="250" x2="786" y2="250" stroke="#3d4b60" stroke-width="2"/><text x="510.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">읽는 속도가 느리면 쌓여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="334" y="214" width="120" height="72" rx="6" fill="#6ea8fe" fill-opacity=".75"/><line x1="690" y1="250" x2="768" y2="250" stroke="#7ee7c7" stroke-width="7"/><polygon points="786,250 760,236 760,264" fill="#7ee7c7"/><rect x="790" y="320" width="130" height="54" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="855" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">브라우저 메모리</text><text x="855" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">해석 · 저장</text><line x1="855" y1="290" x2="855" y2="306" stroke="#9aa3b2" stroke-width="5"/><polygon points="855,318 846,302 864,302" fill="#9aa3b2"/><text x="510.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">읽어 가면 여유가 생겨요</text></g><text x="480" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">칸 너비는 단순화한 비율이에요</text>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빈 수신 버퍼 64,000B가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1,460B가 도착하면 62,540B가 남아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 느리게 읽으면 쌓여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">읽어 가면 자리가 생기고, 처리는 따로 남아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="291.433" text-anchor="middle" font-size="61.236" font-weight="750" letter-spacing="-1" fill="#e6e8ec">수신 버퍼에 도착한 일과 읽는 일</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>