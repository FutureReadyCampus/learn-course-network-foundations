<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>세그먼트는 패킷에, 패킷은 프레임에</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">세그먼트는 패킷에, 패킷은 프레임에</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">라우터는 링크마다 새 프레임에 패킷을 담아요</text>
<rect x="56" y="334" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="341" width="52" height="32" fill="#3d4b60"/><rect x="85" y="380" width="10" height="10" fill="#6ea8fe"/><rect x="68" y="390" width="44" height="5" fill="#6ea8fe"/><text x="90" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><circle cx="480" cy="370" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 364 h28 l-7 -7 M495 376 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="420" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><rect x="836" y="336" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="343" width="52" height="30" fill="#3d4b60"/><polygon points="826,382 914,382 922,394 818,394" fill="#6ea8fe"/><text x="870" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><line x1="150" y1="395" x2="440" y2="395" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="395" x2="810" y2="395" stroke="#3d4b60" stroke-width="3"/><text x="295" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">링크 1</text><text x="665" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">링크 2</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">세그먼트 A</text><rect x="227" y="154" width="186" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="320" y="175.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">내용물: TCP 세그먼트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="195" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="245.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">세그먼트 A</text><rect x="277" y="154" width="87" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="320" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">IP 패킷</text><text x="290" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">203.0.113.5 → 198.51.100.10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="125" y="200" width="70" height="64" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="160.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">프레임</text><rect x="195" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="245.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="295" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="350.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">세그먼트 A</text><rect x="405" y="200" width="60" height="64" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="435.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">FCS</text><rect x="214" y="154" width="152" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프레임 (링크 1)</text><text x="290" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">203.0.113.5 → 198.51.100.10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="505" y="200" width="70" height="64" rx="6" fill="#171a21" stroke="#4dd0e1" stroke-width="3"/><text x="540.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#4dd0e1">프레임</text><rect x="575" y="200" width="100" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="625.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="675" y="200" width="110" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="730.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">세그먼트 A</text><rect x="785" y="200" width="60" height="64" rx="6" fill="#171a21" stroke="#4dd0e1" stroke-width="3"/><text x="815.0" y="237.4" text-anchor="middle" font-size="15" font-weight="700" fill="#4dd0e1">FCS</text><rect x="594" y="154" width="152" height="33" rx="16" fill="#4dd0e1" stroke="#4dd0e1" stroke-width="2"/><text x="670" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프레임 (링크 2)</text><text x="670" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">203.0.113.5 → 198.51.100.10</text><text x="480" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">IP 패킷(주소)은 그대로, 프레임만 새로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP 세그먼트 A가 내용물이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 헤더를 붙이면 IP 패킷이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">링크 1용 프레임에 패킷을 실어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터가 링크 2용 새 프레임에 다시 담아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="288.84" text-anchor="middle" font-size="53.8272" font-weight="750" letter-spacing="-1" fill="#e6e8ec">세그먼트는 패킷에, 패킷은 프레임에</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>