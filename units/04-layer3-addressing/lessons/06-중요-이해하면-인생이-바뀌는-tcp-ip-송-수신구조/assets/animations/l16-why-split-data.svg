<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>큰 데이터를 나누는 이유</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">큰 데이터를 나누는 이유</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">기본 IPv4·TCP 헤더 20B씩, 옵션이 없는 예</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="410" y="205" width="150" height="130" rx="10" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><line x1="410" y1="205" x2="410" y2="335" stroke="#ffb454" stroke-width="6"/><line x1="560" y1="205" x2="560" y2="335" stroke="#ffb454" stroke-width="6"/><text x="485" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">한 번에 TCP 데이터 1,460B까지</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">3,000B</text><circle cx="485" cy="270" r="16" fill="#ff7b72"/><path d="M478 263 l14 14 M492 263 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="485" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#ff7b72">한 번에는 안 들어가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">3,000B</text><text x="485" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">1,460 = 1,500 − 20 − 20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">3,000B</text><rect x="590" y="245" width="120" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="650.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">1,460B</text><rect x="722" y="245" width="120" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="782.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">1,460B</text><rect x="854" y="245" width="56" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="882.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">80B</text><line x1="300" y1="275" x2="392" y2="275" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,275 384,263 384,287" fill="#6ea8fe"/><text x="750" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">마지막 조각은 짧아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="130" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="164" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="198" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="232" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="266" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="300" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="334" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="368" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="402" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="436" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="470" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="504" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="538" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="572" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="606" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="640" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="674" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="708" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="742" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="776" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">…</text><text x="480" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">큰 파일은 수많은 작은 조각이 돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">3,000B는 한 번에 보내기에 커요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MTU 1,500B에서 헤더 40B를 빼면 1,460B예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1,460B, 1,460B, 80B 세 세그먼트로 나눠요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 사진은 수많은 세그먼트가 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>