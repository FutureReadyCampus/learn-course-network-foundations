<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>큰 짐은 상자 한도에 맞춰 나눈다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">큰 짐은 상자 한도에 맞춰 나눈다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한도 14.6kg짜리 상자 여러 개에 나눠 담아요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="410" y="205" width="150" height="130" rx="10" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><line x1="410" y1="205" x2="410" y2="335" stroke="#ffb454" stroke-width="6"/><line x1="560" y1="205" x2="560" y2="335" stroke="#ffb454" stroke-width="6"/><text x="485" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">상자 한 개: 14.6kg까지</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">전집 30kg</text><circle cx="485" cy="270" r="16" fill="#ff7b72"/><path d="M478 263 l14 14 M492 263 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="485" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#ff7b72">한 번에는 안 들어가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">전집 30kg</text><text x="485" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">14.6 = 15 − 0.2 − 0.2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="70" y="245" width="230" height="60" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="185.0" y="283.64" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">전집 30kg</text><rect x="590" y="245" width="120" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="650.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">14.6kg</text><rect x="722" y="245" width="120" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="782.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">14.6kg</text><rect x="854" y="245" width="56" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="882.0" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">0.8kg</text><line x1="300" y1="275" x2="392" y2="275" stroke="#6ea8fe" stroke-width="5"/><polygon points="410,275 384,263 384,287" fill="#6ea8fe"/><text x="750" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">마지막 조각은 짧아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="130" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="164" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="198" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="232" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="266" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="300" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="334" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="368" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="402" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="436" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="470" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="504" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="538" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="572" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="606" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="640" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="674" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="708" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><rect x="742" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><rect x="776" y="250" width="28" height="50" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">…</text><text x="480" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">큰 짐은 수많은 상자가 돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전집 30kg은 상자 한 개에 안 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자 한 개에는 물건을 14.6kg까지 담을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">14.6kg, 14.6kg, 0.8kg 세 상자로 나눠요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 짐일수록 상자가 아주 많아져요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="291.433" text-anchor="middle" font-size="61.236" font-weight="750" letter-spacing="-1" fill="#e6e8ec">큰 짐은 상자 한도에 맞춰 나눈다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>