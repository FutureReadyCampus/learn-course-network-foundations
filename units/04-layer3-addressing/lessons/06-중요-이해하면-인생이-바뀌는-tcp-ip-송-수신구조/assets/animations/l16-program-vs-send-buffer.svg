<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프로그램 버퍼와 송신 버퍼는 다르다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프로그램 버퍼와 송신 버퍼는 다르다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">버퍼는 속도가 다른 단계를 이어 주는 메모리 공간</text>
<rect x="40" y="190" width="140" height="120" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="110" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">저장장치</text><text x="110" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">photo.bmp</text><rect x="235" y="190" width="150" height="120" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="310" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">프로그램 버퍼</text><rect x="430" y="215" width="70" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">소켓</text><rect x="545" y="190" width="180" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="635" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">송신 버퍼</text><rect x="775" y="190" width="125" height="120" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="837" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">TCP</text><line x1="180" y1="250" x2="235" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="385" y1="250" x2="430" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="500" y1="250" x2="545" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="725" y1="250" x2="775" y2="250" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="250" y="232" width="120" height="36" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="1"/><text x="310.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">4,096B</text><text x="110" y="340" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">원본은 그대로 남아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="560" y="232" width="150" height="36" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="1"/><text x="635.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">4,096B</text><text x="310" y="340" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">프로그램은 다음 바이트를 읽어요</text><line x1="465" y1="300" x2="465" y2="312" stroke="#0f1115" stroke-width="5"/><polygon points="465,300 456,316 474,316" fill="#0f1115"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="250" y="232" width="120" height="36" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="1"/><text x="310.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">다음 4,096B</text><rect x="560" y="232" width="150" height="36" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="1"/><text x="635.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">4,096B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="250" y="232" width="120" height="36" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="1"/><text x="310.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">다음 4,096B</text><rect x="560" y="232" width="150" height="36" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="1"/><text x="635.0" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">4,096B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="545" y="345" width="115" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="602.5" y="367.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">1,460B</text><rect x="670" y="345" width="115" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="727.5" y="367.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">1,460B</text><rect x="795" y="345" width="92" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="841.0" y="367.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">1,176B</text><text x="480" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">읽는 양 4,096B ≠ MSS 1,460B</text><line x1="640" y1="312" x2="640" y2="328" stroke="#c792ea" stroke-width="5"/><polygon points="640,340 631,324 649,324" fill="#c792ea"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">파일에서 읽은 바이트가 프로그램 버퍼에 놓여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소켓으로 맡기면 커널의 송신 버퍼에 쌓여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램은 다음 바이트를 읽어 같은 일을 반복해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 읽는 양과 MSS는 서로 별개예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="289.195" text-anchor="middle" font-size="54.8428" font-weight="750" letter-spacing="-1" fill="#e6e8ec">프로그램 버퍼와 송신 버퍼는 다르다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>