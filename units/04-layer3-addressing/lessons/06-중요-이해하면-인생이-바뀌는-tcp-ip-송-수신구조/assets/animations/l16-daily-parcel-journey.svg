<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>책 한 권이 오가는 전체 길</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">책 한 권이 오가는 전체 길</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">발송 담당자에서 집주인까지</text>
<rect x="60" y="120" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="225.0" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">발송 담당자</text><rect x="570" y="120" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="735.0" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">집주인 (꺼내 읽기)</text><rect x="60" y="174" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="225.0" y="203" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">접수 창구</text><rect x="570" y="174" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="735.0" y="203" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">도착지 보관함</text><rect x="60" y="228" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="225.0" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">포장 (나눠 담기)</text><rect x="570" y="228" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="735.0" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">포장 풀기</text><rect x="60" y="282" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="225.0" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">송장 붙이기</text><rect x="570" y="282" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="735.0" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">송장 확인</text><rect x="60" y="336" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="225.0" y="365" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">트럭에 싣기</text><rect x="570" y="336" width="330" height="44" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="735.0" y="365" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">도착한 트럭</text><rect x="390" y="394" width="180" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="480" y="426" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">물류센터와 도로</text><line x1="86" y1="380" x2="86" y2="419" stroke="#3d4b60" stroke-width="3"/><line x1="86" y1="419" x2="390" y2="419" stroke="#3d4b60" stroke-width="3"/><line x1="570" y1="419" x2="874" y2="419" stroke="#3d4b60" stroke-width="3"/><line x1="874" y1="419" x2="874" y2="380" stroke="#3d4b60" stroke-width="3"/><line x1="86" y1="164" x2="86" y2="174" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="120" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="225.0" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">발송 담당자</text><rect x="60" y="174" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="225.0" y="203" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">접수 창구</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="228" width="330" height="44" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><text x="225.0" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">포장 (나눠 담기)</text><rect x="60" y="282" width="330" height="44" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><text x="225.0" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">송장 붙이기</text><rect x="60" y="336" width="330" height="44" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><text x="225.0" y="365" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">트럭에 싣기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="390" y="394" width="180" height="50" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="4"/><text x="480" y="426" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">물류센터와 도로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="570" y="120" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="735.0" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">집주인 (꺼내 읽기)</text><rect x="570" y="174" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="735.0" y="203" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">도착지 보관함</text><rect x="570" y="228" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="735.0" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">포장 풀기</text><rect x="570" y="282" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="735.0" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">송장 확인</text><rect x="570" y="336" width="330" height="44" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="735.0" y="365" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">도착한 트럭</text><text x="480" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">보관함에 도착</text><text x="480" y="272" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">≠</text><text x="480" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">꺼내 읽음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="86,142;86,142;86,196;86,196" keyTimes="0.000;0.037;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="86,196;86,196;86,358;86,358" keyTimes="0.000;0.275;0.463;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="86,358;86,358;86,419;480,419;874,419;874,358;874,358" keyTimes="0.000;0.512;0.566;0.619;0.672;0.725;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="874,358;874,358;874,142;874,142" keyTimes="0.000;0.775;0.963;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">발송 담당자가 책을 꺼내 접수 창구에 맡겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포장하고 송장을 붙여 트럭에 실어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">물류센터와 도로가 도착지까지 날라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보관함에 도착해도, 집주인이 꺼내 읽어야 끝나요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>