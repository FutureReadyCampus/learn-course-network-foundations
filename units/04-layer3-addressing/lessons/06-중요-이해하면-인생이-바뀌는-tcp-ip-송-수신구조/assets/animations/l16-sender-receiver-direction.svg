<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>송신 측과 수신 측은 방향이에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">송신 측과 수신 측은 방향이에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">장비에 붙은 직업이 아니라, 지금 따라가는 데이터의 방향</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="816" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="261" width="52" height="32" fill="#3d4b60"/><rect x="845" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="310" width="44" height="5" fill="#6ea8fe"/><text x="850" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><line x1="770" y1="290" x2="208" y2="290" stroke="#6ea8fe" stroke-width="9"/><polygon points="190,290 216,274 216,306" fill="#6ea8fe"/><rect x="807" y="173" width="86" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="850" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">송신 측</text><rect x="67" y="173" width="86" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">수신 측</text><text x="480" y="250" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">서버 → 내 PC: 사진 데이터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="290" x2="752" y2="290" stroke="#6ea8fe" stroke-width="9"/><polygon points="770,290 744,274 744,306" fill="#6ea8fe"/><rect x="67" y="173" width="86" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="110" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">송신 측</text><rect x="807" y="173" width="86" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">수신 측</text><text x="480" y="250" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">내 PC → 서버: 업로드</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="255" x2="752" y2="255" stroke="#7ee7c7" stroke-width="4"/><polygon points="770,255 744,244 744,266" fill="#7ee7c7"/><text x="480" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">짧은 요청</text><line x1="770" y1="330" x2="208" y2="330" stroke="#6ea8fe" stroke-width="10"/><polygon points="190,330 216,313 216,347" fill="#6ea8fe"/><text x="480" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">사진 데이터</text><rect x="35" y="174" width="150" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="110" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">보내기도 받기도</text><rect x="775" y="174" width="150" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="850" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">보내기도 받기도</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><line x1="190" y1="340" x2="770" y2="340" stroke="#3d4b60" stroke-width="3"/><rect x="238" y="304" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="250" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="267" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="284" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="301" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="318" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="290" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="410" cy="320" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M395 314 h28 l-7 -7 M425 326 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="410" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><circle cx="550" cy="320" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M535 314 h28 l-7 -7 M565 326 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="550" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><rect x="618" y="304" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="630" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="647" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="664" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="681" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="698" y="315" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="670" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">스위치는 링크 안, 라우터는 네트워크 사이</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사진을 내려받을 때 서버가 송신 측이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사진을 올릴 때는 PC가 송신 측이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 PC가, 사진은 서버가 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간의 스위치와 라우터가 구간마다 전달해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="291.894" text-anchor="middle" font-size="62.5538" font-weight="750" letter-spacing="-1" fill="#e6e8ec">송신 측과 수신 측은 방향이에요</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>