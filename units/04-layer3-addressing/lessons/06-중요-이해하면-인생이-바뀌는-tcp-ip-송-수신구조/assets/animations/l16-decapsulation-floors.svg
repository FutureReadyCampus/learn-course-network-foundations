<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>바깥 헤더부터 처리해 바이트를 꺼낸다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">바깥 헤더부터 처리해 바이트를 꺼낸다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프레임 → IP 패킷 → TCP 세그먼트 → 소켓의 바이트</text>
<g opacity="0.3"><rect x="40" y="135" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="167" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">소켓</text></g><g opacity="0.3"><rect x="40" y="215" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">TCP 계층</text></g><g opacity="0.3"><rect x="40" y="295" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">IP 계층</text></g><g opacity="0.3"><rect x="40" y="375" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="407" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">링크 계층</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="375" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="407" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">링크 계층</text><rect x="370" y="375" width="110" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="425.0" y="405.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">프레임 헤더</text><rect x="480" y="375" width="110" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="535.0" y="405.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="590" y="375" width="110" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="405.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="700" y="375" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="405.4"