 stroke="#3d4b60" stroke-width="2"/><text x="165" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">IP 계층</text><rect x="480" y="295" width="110" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="535.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="590" y="295" width="110" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="700" y="295" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">사진 일부 바이트</text><rect x="476" y="291" width="118" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><line x1="165" y1="371" x2="165" y2="361" stroke="#7ee7c7" stroke-width="5"/><polygon points="165,349 156,365 174,365" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="295" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">IP 계층</text><rect x="480" y="295" width="110" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="535.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="590" y="295" width="110" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="700" y="295" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="325.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">사진 일부 바이트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="215" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">TCP 계층</text><rect x="590" y="215" width="110" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="700" y="215" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">사진 일부 바이트</text><rect x="586" y="211" width="118" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><line x1="165" y1="291" x2="165" y2="281" stroke="#7ee7c7" stroke-width="5"/><polygon points="165,269 156,285 174,285" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="215" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">TCP 계층</text><rect x="590" y="215" width="110" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="700" y="215" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="245.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">사진 일부 바이트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="135" width="250" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="167" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">소켓</text><rect x="700" y="135" width="120" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="165.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">사진 일부 바이트</text><rect x="696" y="131" width="128" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><line x1="165" y1="211" x2="165" y2="201" stroke="#7ee7c7" stroke-width="5"/><polygon points="165,189 156,205 174,205" fill="#7ee7c7"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">마지막 링크의 프레임 헤더와 FCS를 처리해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">IP 헤더의 목적지를 확인해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">TCP 헤더로 어느 소켓의 데이터인지 가려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">바이트가 소켓에 준비돼요 — 사진으로 해석하는 건 브라우저 몫</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">링크 계층이 프레임을 처리해 패킷을 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 계층이 목적지를 확인해 세그먼트를 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP가 연결 정보로 소켓을 가리고 바이트를 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소켓에 읽을 바이트가 준비돼요</text></g>

