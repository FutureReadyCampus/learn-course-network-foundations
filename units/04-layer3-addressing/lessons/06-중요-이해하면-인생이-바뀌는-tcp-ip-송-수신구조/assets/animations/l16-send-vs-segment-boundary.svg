<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>send 횟수와 세그먼트 수는 다르다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">send 횟수와 세그먼트 수는 다르다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TCP는 송신 버퍼의 바이트를 MSS에 맞춰 나눠요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="170" width="360.0" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="300.0" y="203.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">send ①  2,048B</text><rect x="480.0" y="170" width="360.0" height="54" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="660.0" y="203.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">send ②  2,048B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="170" width="720.0" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="203.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">송신 버퍼의 이어진 바이트 흐름 4,096B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="170" width="720.0" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="132" y="204" text-anchor="start" font-size="19" font-weight="700" fill="#9aa3b2">4,096B</text><line x1="376.640625" y1="150" x2="376.640625" y2="330" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/><line x1="633.28125" y1="150" x2="633.28125" y2="330" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="270" width="256.640625" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="122" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">A  1,460B</text><rect x="378.640625" y="270" width="256.640625" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="390.640625" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">B  1,460B</text><rect x="647.28125" y="270" width="206.71875" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="659.28125" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">C  1,176B</text><text x="480" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">A·B·C는 조각 이름표예요 (실제 순서 번호 아님)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="480.0" y1="150" x2="480.0" y2="345" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="3 4"/><rect x="110" y="270" width="256.640625" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="122" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">A  1,460B</text><rect x="378.640625" y="270" width="256.640625" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="390.640625" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">B  1,460B</text><rect x="647.28125" y="270" width="206.71875" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="659.28125" y="304" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">C  1,176B</text><rect x="106" y="235" width="85" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="148" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">TCP 헤더</text><rect x="374" y="235" width="85" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="416.640625" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">TCP 헤더</text><rect x="643" y="235" width="85" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="685.28125" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">TCP 헤더</text><rect x="431" y="120" width="98" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="140.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">send 경계</text><text x="480" y="400" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">send 횟수 ≠ 세그먼트 수</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 send를 두 번 호출했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송신 버퍼에서는 이어진 바이트 흐름이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MSS 1,460B씩으로 나누면 1,460·1,460·1,176B예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조각마다 TCP 헤더가 붙어 세그먼트가 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>