<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프로세스는 소켓에 맡기고, 커널이 나른다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프로세스는 소켓에 맡기고, 커널이 나른다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버와 PC 모두 같은 구조예요</text>
<rect x="40" y="150" width="350" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="215.0" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">내 PC</text><rect x="570" y="150" width="350" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="745.0" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버</text><rect x="50" y="190" width="90" height="40" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="95" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="160" y="190" width="90" height="40" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="205" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">메신저</text><rect x="270" y="190" width="90" height="40" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="315" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">게임</text><rect x="67" y="252" width="56" height="34" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="95" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">소켓</text><rect x="177" y="252" width="56" height="34" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="205" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">소켓</text><rect x="287" y="252" width="56" height="34" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="315" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">소켓</text><rect x="60" y="318" width="310" height="50" rx="8" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="215.0" y="349" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">커널 · TCP/IP</text><rect x="645" y="190" width="210" height="40" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="750" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">웹 서버 프로세스</text><rect x="722" y="252" width="56" height="34" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="750" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">소켓</text><rect x="590" y="318" width="310" height="50" rx="8" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="745.0" y="349" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">커널 · TCP/IP</text><line x1="370" y1="343" x2="590" y2="343" stroke="#3d4b60" stroke-width="4"/><text x="480" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">네트워크</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="186" width="98" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="156" y="186" width="98" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="266" y="186" width="98" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="641" y="186" width="218" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="351" y="114" width="259" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="136.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프로세스 = 실행 중인 프로그램</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="63" y="248" width="64" height="42" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="173" y="248" width="64" height="42" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="283" y="248" width="64" height="42" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="718" y="248" width="64" height="42" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="376" y="114" width="209" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="136.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">소켓 = 맡기고 받는 접점</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="314" width="318" height="58" rx="10" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="586" y="314" width="318" height="58" rx="10" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="343" y="114" width="275" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="136.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">커널 = TCP/IP 처리와 장치 사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="750,210;750,210;750,269;750,343;480,343;205,343;205,301;205,301" keyTimes="0.000;0.762;0.805;0.847;0.890;0.932;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><rect x="650" y="394" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="750" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">send: 보내 달라고 요청</text><rect x="115" y="394" width="180" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="205" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">recv: 읽어야 받아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신하는 쪽은 실행 중인 프로세스예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로세스는 소켓으로 데이터를 맡기고 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP/IP 처리는 커널이 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소켓에 맡겼다고 상대가 읽은 건 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>