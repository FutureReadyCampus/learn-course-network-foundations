<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">조각이 상자가 되고 트럭에 실리다</text>
<text x="480" y="92" text-anchor="middle" font-size="24" fill="#9aa3b2">내용물 → 상자(패킷) → 트럭(프레임) = 캡슐화</text>

<!-- 층 라벨 배지 -->
<rect x="280" y="112" width="220" height="46" rx="23" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="390" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">L4 · 세그먼트<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="14s" repeatCount="indefinite"/></text>
<text x="390" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454" opacity="0">IP 패킷 (L3)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></text>
<text x="390" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7" opacity="0">프레임 (L2)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.56;0.94;0.97;1" dur="14s" repeatCount="indefinite"/></text>

<!-- 도로와 구간 -->
<line x1="40" y1="431" x2="920" y2="431" stroke="#3d4b60" stroke-width="3"/>
<line x1="720" y1="400" x2="720" y2="470" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 6"/>
<text x="380" y="463" text-anchor="middle" font-size="24" fill="#9aa3b2">구간 1</text>
<text x="830" y="463" text-anchor="middle" font-size="24" fill="#9aa3b2">구간 2</text>

<!-- 화물 전체 -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;260 0;260 0;0 0;0 0" keyTimes="0;0.8;0.94;0.96;0.965;1" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.92;0.96;0.97;1" dur="14s" repeatCount="indefinite"/>
  <!-- 트럭 = 프레임 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-700 0;-700 0;0 0;0 0;-700 0;-700 0" keyTimes="0;0.5;0.65;0.96;0.965;1" dur="14s" repeatCount="indefinite"/>
    <rect x="230" y="370" width="330" height="22" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <rect x="562" y="300" width="98" height="92" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <rect x="600" y="312" width="46" height="34" rx="4" fill="#7ee7c7" opacity="0.35"/>
    <circle cx="290" cy="410" r="18" fill="#0f1115" stroke="#9aa3b2" stroke-width="5"/>
    <circle cx="500" cy="410" r="18" fill="#0f1115" stroke="#9aa3b2" stroke-width="5"/>
    <circle cx="620" cy="410" r="18" fill="#0f1115" stroke="#9aa3b2" stroke-width="5"/>
  </g>
  <!-- 상자 = 패킷 -->
  <rect x="250" y="190" width="280" height="180" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.26;0.96;0.965;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <!-- 내용물 = 세그먼트 -->
  <rect x="305" y="292" width="170" height="56" rx="8" fill="#1d2a40" stroke="#6ea8fe" stroke-width="3"/>
  <text x="390" y="329" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">1번 세그먼트</text>
  <!-- 송장 = IP 헤더 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="-320 -170;-320 -170;0 0;0 0;-320 -170;-320 -170" keyTimes="0;0.26;0.38;0.96;0.965;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.96;0.965;1" dur="14s" repeatCount="indefinite"/>
    <rect x="268" y="202" width="244" height="76" rx="6" fill="#ffb454"/>
    <text x="390" y="233" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">192.168.0.10 →</text>
    <text x="390" y="265" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">203.0.113.5</text>
  </g>
</g>

<!-- 자막 바 -->
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g font-size="26" text-anchor="middle" fill="#e6e8ec">
  <text x="480" y="518">내용물: 1번 세그먼트 (L4)<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="480" y="518" opacity="0">송장(IP 주소)을 붙이면 상자 = IP 패킷<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.5;0.52;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="480" y="518" opacity="0">상자를 트럭에 실으면 = 프레임<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.8;0.82;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="480" y="518" opacity="0" fill="#7ee7c7" font-weight="700">상자는 그대로, 트럭은 구간마다 바뀐다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.95;0.97;1" dur="14s" repeatCount="indefinite"/></text>
</g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.24;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.24;0.52;0.53;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.82;0.83;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.83;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text></g>
</svg>
