<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-16-basic-export-title lesson-16-basic-export-desc" lang="ko"><title id="lesson-16-basic-export-title">파일을 내려받는 동안 양쪽 컴퓨터에서는 무슨 일이 일어날까? · 학습 흐름</title><desc id="lesson-16-basic-export-desc">8개 페이지에서 전체 지도, 송수신 방향, 프로그램, 버퍼, TCP 분할, IP와 링크 전달, 역캡슐화, 수신 버퍼를 따라갑니다.</desc><defs><marker id="lesson-16-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-16-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">파일 하나가 오가는</tspan><tspan x="143.0" dy="25">전체 지도</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">보내는 쪽과 받는 쪽,</tspan><tspan x="421.0" dy="25">큰 데이터를 나누는 이유</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">실제로 데이터를</tspan><tspan x="699.0" dy="25">주고받는 것은 프로그램</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">버퍼는 처리 속도가</tspan><tspan x="977.0" dy="25">다른 단계를 이어 준다</tspan></text><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">TCP는 바이트 흐름을</tspan><tspan x="143.0" dy="25">세그먼트로 나눈다</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">세그먼트는 패킷에,</tspan><tspan x="421.0" dy="25">패킷은 프레임에 담긴다</tspan></text><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">받는 쪽은 포장을 풀어</tspan><tspan x="699.0" dy="25">데이터를 꺼낸다</tspan></text><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">수신 버퍼에 쌓인</tspan><tspan x="977.0" dy="25">데이터를 프로그램이 읽는다</tspan></text></svg>