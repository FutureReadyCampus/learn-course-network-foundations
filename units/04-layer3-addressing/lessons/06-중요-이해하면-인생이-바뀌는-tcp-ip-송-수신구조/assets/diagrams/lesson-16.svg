<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 660" role="group" aria-labelledby="lesson-16-basic-export-title lesson-16-basic-export-desc" lang="ko"><title id="lesson-16-basic-export-title">[※중요] 이해하면 인생이 바뀌는 TCP/IP 송·수신구조 · 학습 흐름</title><desc id="lesson-16-basic-export-desc">강의 설명을 읽는 순서와 각 개념의 제목을 보여 줍니다.</desc><defs><marker id="lesson-16-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-16-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/><path d="M977.0 288 V312.0 H143.0 V332"/><path d="M268 392.0 H292"/><path d="M546 392.0 H570"/><path d="M824 392.0 H848"/><path d="M977.0 448 V472.0 H143.0 V492"/><path d="M268 552.0 H292"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">큰 데이터를 나눠</tspan><tspan x="143.0" dy="25">보내는 문제</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">송신 측과 수신 측의</tspan><tspan x="421.0" dy="25">큰 그림</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">실제 송수신 주체는</tspan><tspan x="699.0" dy="25">프로세스</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="