<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-12-basic-export-title lesson-12-basic-export-desc" lang="ko"><title id="lesson-12-basic-export-title">L3 IP Packet으로 외워라 · 학습 흐름</title><desc id="lesson-12-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-12-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-time{font-size:18px;fill:#9aa3b2}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-12-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/></g><a href="../lesson-12.html#concept-basic-12-01" target="_top" aria-label="Packet이라는 단위 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">Packet이라는 단위</tspan></text><text class="flow-time" x="143.0" y="116" text-anchor="middle">01 · 0:01</text></a><a href="../lesson-12.html#concept-basic-12-02" target="_top" aria-label="L3 IP Packet으로 연결하기 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">L3 IP Packet으로</tspan><tspan x="421.0" dy="25">연결하기</tspan></text><text class="flow-time" x="421.0" y="116" text-anchor="middle">02 · 1:06</text></a><a href="../lesson-12.html#concept-basic-12-03" target="_top" aria-label="MTU와 패킷의 크기 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">MTU와 패킷의 크기</tspan></text><text class="flow-time" x="699.0" y="116" text-anchor="middle">03 · 2:07</text></a><a href="../lesson-12.html#concept-basic-12-04" target="_top" aria-label="Header와 Payload 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">Header와 Payload</tspan></text><text class="flow-time" x="977.0" y="116" text-anchor="middle">04 · 2:49</text></a><a href="../lesson-12.html#concept-basic-12-05" target="_top" aria-label="Wireshark에서 패킷 보기 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">Wireshark에서 패킷</tspan><tspan x="143.0" dy="25">보기</tspan></text><text class="flow-time" x="143.0" y="276" text-anchor="middle">05 · 4:25</text></a><a href="../lesson-12.html#concept-basic-12-06" target="_top" aria-label="캡처와 네트워크 관찰 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">캡처와 네트워크 관찰</tspan></text><text class="flow-time" x="421.0" y="276" text-anchor="middle">06 · 6:25</text></a><a href="../lesson-12.html#concept-basic-12-07" target="_top" aria-label="헤더 속 식별자 정리 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">헤더 속 식별자 정리</tspan></text><text class="flow-time" x="699.0" y="276" text-anchor="middle">07 · 7:27</text></a></svg>
