<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>캡처로 통신을 안전하게 관찰한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">캡처로 통신을 안전하게 관찰한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청이 나갔는지, 응답이 왔는지 확인해요</text>
<rect x="76" y="166" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="173" width="52" height="30" fill="#3d4b60"/><polygon points="66,212 154,212 162,224 58,224" fill="#6ea8fe"/><text x="110" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="816" y="164" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="171" width="52" height="32" fill="#3d4b60"/><rect x="845" y="210" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="220" width="44" height="5" fill="#6ea8fe"/><text x="850" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="170" y1="240" x2="780" y2="240" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="300" width="300" height="130" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">캡처 도구 (Wireshark)</text><line x1="480" y1="252" x2="480" y2="300" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 6"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="350" y="358" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">→ 요청 나감</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="350" y="388" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">← 응답 도착</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="350" y="388" text-anchor="start" font-size="20" font-weight="700" fill="#ff7b72">← 응답 없음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,240;170,240;780,240;780,240" keyTimes="0.000;0.025;0.150;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="780,240;780,240;170,240;170,240" keyTimes="0.000;0.275;0.400;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,240;170,240;780,240;780,240" keyTimes="0.000;0.525;0.625;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.637;0.652;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="130" r="16" fill="#ffb454"/><text x="850" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="290" width="460" height="150" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="290" cy="330" r="16" fill="#7ee7c7"/><path d="M282 330 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="320" y="337" text-anchor="start" font-size="21" font-weight="700" fill="#7ee7c7">내 장비 · 허가받은 네트워크</text><circle cx="290" cy="380" r="16" fill="#ff7b72"/><path d="M283 373 l14 14 M297 373 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="320" y="387" text-anchor="start" font-size="21" font-weight="700" fill="#ff7b72">허가 없는 남의 통신</text><text x="480" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">공개 전에 개인정보 확인</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 실제로 나갔는지 캡처로 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답이 돌아왔는지도 볼 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답이 없으면 문제 위치를 좁혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">본인 장비나 허가받은 네트워크에서만 봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>