<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>송장 붙은 상자 안의 상자</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">송장 붙은 상자 안의 상자</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">송장은 길 안내, 내용물은 실어 나르는 물건</text>
<rect x="130" y="190" width="160" height="130" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="210" y="262" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454">송장</text><rect x="290" y="190" width="540" height="130" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="310" y="218" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">내용물</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="560" y="275" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">내용물 (물건)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="290" y="190" width="540" height="130" rx="8" fill="none" stroke="#6ea8fe" stroke-width="6"/><text x="560" y="362" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">열어 보면…?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="310" y="232" width="100" height="72" rx="6" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><text x="360" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">송장</text><rect x="410" y="232" width="400" height="72" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="610" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">내용물</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="177" y="143" width="86" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="220" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">큰 상자</text><rect x="558" y="333" width="104" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="610" y="356.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">작은 상자</text><line x1="610" y1="334" x2="610" y2="306" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="420" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">작은 상자는 큰 상자의 내용물이기도 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장은 길 안내, 내용물은 물건이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자의 내용물을 열어 보면…</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안에 송장 붙은 작은 상자가 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 덩어리가 안팎에서 역할이 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="297.745" text-anchor="middle" font-size="79.2727" font-weight="750" letter-spacing="-1" fill="#e6e8ec">송장 붙은 상자 안의 상자</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>