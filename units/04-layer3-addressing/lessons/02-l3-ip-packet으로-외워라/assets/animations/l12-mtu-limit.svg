<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>MTU는 한 번에 보낼 크기의 한계다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">MTU는 한 번에 보낼 크기의 한계다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">예: 이더넷에서 IP 패킷은 최대 1,500바이트</text>
<rect x="250" y="160" width="420" height="26" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="320.0" y1="160" x2="320.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="390.0" y1="160" x2="390.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="460.0" y1="160" x2="460.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="530.0" y1="160" x2="530.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="600.0" y1="160" x2="600.0" y2="168" stroke="#ffb454" stroke-width="2"/><text x="460.0" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">한 번에 보낼 수 있는 최대 크기 (MTU)</text><text x="690" y="180" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">1,500 B</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="220" width="120" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><circle cx="394" cy="240" r="16" fill="#7ee7c7"/><path d="M386 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="422" y="247" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">작은 메시지 → 작은 패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="220" width="420" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="670" y="220" width="220" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><circle cx="920" cy="240" r="16" fill="#ff7b72"/><path d="M913 233 l14 14 M927 233 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="250" y="292" text-anchor="start" font-size="20" font-weight="700" fill="#ff7b72">큰 사진 → 한 번에는 너무 커요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="220" width="200" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="350.0" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><circle cx="472" cy="240" r="16" fill="#7ee7c7"/><path d="M464 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="250" y="274" width="200" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="350.0" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">2</text><circle cx="472" cy="294" r="16" fill="#7ee7c7"/><path d="M464 294 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="250" y="328" width="200" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="350.0" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">3</text><circle cx="472" cy="348" r="16" fill="#7ee7c7"/><path d="M464 348 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="510" y="300" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">여러 패킷으로 나눠 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="228" width="300" height="26" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><line x1="300.0" y1="228" x2="300.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="350.0" y1="228" x2="350.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="400.0" y1="228" x2="400.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="450.0" y1="228" x2="450.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="500.0" y1="228" x2="500.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><text x="400.0" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">다른 연결은 MTU가 다를 수 있어요</text><text x="570" y="248" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">?</text><text x="480" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">MTU는 링크가 감당하는 크기 기준이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 메시지는 작은 패킷으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한계보다 큰 데이터는 한 패킷에 못 담아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">여러 패킷으로 나누면 모두 보낼 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결마다 MTU가 다를 수 있어요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text></g>
</svg>
