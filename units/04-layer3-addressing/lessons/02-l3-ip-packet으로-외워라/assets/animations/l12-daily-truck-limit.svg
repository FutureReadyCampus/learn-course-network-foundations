<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상자 크기에는 한계가 있다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상자 크기에는 한계가 있다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 칸에 들어가는 크기를 넘으면 나눠 실어요</text>
<rect x="250" y="160" width="420" height="26" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="320.0" y1="160" x2="320.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="390.0" y1="160" x2="390.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="460.0" y1="160" x2="460.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="530.0" y1="160" x2="530.0" y2="168" stroke="#ffb454" stroke-width="2"/><line x1="600.0" y1="160" x2="600.0" y2="168" stroke="#ffb454" stroke-width="2"/><text x="460.0" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">트럭 한 칸에 실을 수 있는 최대 크기</text><text x="690" y="180" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">한계</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="250" y="220" width="120" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><circle cx="394" cy="240" r="16" fill="#7ee7c7"/><path d="M386 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="422" y="247" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">작은 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="250" y="220" width="420" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="670" y="220" width="220" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><circle cx="920" cy="240" r="16" fill="#ff7b72"/><path d="M913 233 l14 14 M927 233 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="250" y="292" text-anchor="start" font-size="20" font-weight="700" fill="#ff7b72">큰 가구 → 한 칸에 안 들어가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="250" y="220" width="200" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="350.0" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1</text><circle cx="472" cy="240" r="16" fill="#7ee7c7"/><path d="M464 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="250" y="274" width="200" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="350.0" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">2</text><circle cx="472" cy="294" r="16" fill="#7ee7c7"/><path d="M464 294 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="250" y="328" width="200" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="350.0" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">3</text><circle cx="472" cy="348" r="16" fill="#7ee7c7"/><path d="M464 348 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="510" y="300" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">여러 상자로 나눠 실어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="250" y="228" width="300" height="26" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><line x1="300.0" y1="228" x2="300.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="350.0" y1="228" x2="350.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="400.0" y1="228" x2="400.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="450.0" y1="228" x2="450.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><line x1="500.0" y1="228" x2="500.0" y2="236" stroke="#9aa3b2" stroke-width="2"/><text x="400.0" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">다른 길은 한계가 다를 수 있어요</text><text x="570" y="248" text-anchor="start" font-size="20" font-weight="700" fill="#9aa3b2">다른 한계</text><text x="480" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">한계는 길(구간)마다 정해져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 상자는 한 칸에 쉽게 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한계보다 큰 짐은 한 칸에 못 실어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">여러 상자로 나누면 모두 실을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길마다 실을 수 있는 한계가 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="296.13" text-anchor="middle" font-size="74.6575" font-weight="750" letter-spacing="-1" fill="#e6e8ec">상자 크기에는 한계가 있다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>