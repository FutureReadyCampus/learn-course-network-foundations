<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>배송에는 세 가지 ‘어디’가 있다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">배송에는 세 가지 ‘어디’가 있다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">구간 인수자, 최종 건물, 건물 안의 받을 사람</text>
<g transform="translate(0,12)"><polygon points="70,244 110,210 150,244" fill="#9aa3b2"/><rect x="78" y="244" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="101" y="264" width="18" height="28" fill="#3d4b60"/><text x="110" y="316" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><polygon points="440,240 480,216 520,240" fill="#6ea8fe"/><rect x="444" y="240" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="460" y="256" width="40" height="22" fill="#3d4b60"/><text x="480" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><rect x="710" y="170" width="220" height="170" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="820" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">받는 건물</text><rect x="730" y="212" width="180" height="44" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="820" y="241" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">101호 민수</text><rect x="730" y="272" width="180" height="44" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="820" y="301" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">102호 지영</text><line x1="180" y1="250" x2="440" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="250" x2="710" y2="250" stroke="#3d4b60" stroke-width="3"/></g><g opacity="0.4"><rect x="60" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="180" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">이번 구간 인수자</text><text x="180" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">지금 연결된 길에서 받는 사람</text></g><g opacity="0.4"><rect x="360" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#7ee7c7">최종 주소</text><text x="480" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">도착해야 할 건물</text></g><g opacity="0.4"><rect x="660" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="780" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#ffb454">호수</text><text x="780" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">건물 안에서 받을 사람</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="480" cy="344" r="16" fill="#ffb454"/><text x="480" y="351" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="382" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">한 번에 ‘어디’ 하나만 쓰는 게 아니에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="110" y1="160" x2="480" y2="160" stroke="#6ea8fe" stroke-width="4"/><line x1="110" y1="160" x2="110" y2="176" stroke="#6ea8fe" stroke-width="4"/><line x1="480" y1="160" x2="480" y2="176" stroke="#6ea8fe" stroke-width="4"/><rect x="218" y="120" width="155" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="295.0" y="142.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">이번 구간 인수자</text><rect x="60" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="180" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">이번 구간 인수자</text><text x="180" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">지금 연결된 길에서 받는 사람</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="110" y1="160" x2="820" y2="160" stroke="#7ee7c7" stroke-width="4"/><line x1="110" y1="160" x2="110" y2="176" stroke="#7ee7c7" stroke-width="4"/><line x1="820" y1="160" x2="820" y2="176" stroke="#7ee7c7" stroke-width="4"/><rect x="388" y="120" width="155" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="465.0" y="142.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">최종 목적지 건물</text><rect x="360" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#7ee7c7">최종 주소</text><text x="480" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">도착해야 할 건물</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g transform="translate(0,12)"><rect x="726" y="208" width="188" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><line x1="690" y1="235" x2="724" y2="235" stroke="#ffb454" stroke-width="4"/></g><rect x="751" y="358" width="138" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="820" y="380.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">건물 안의 호수</text><rect x="660" y="395" width="240" height="64" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="780" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#ffb454">호수</text><text x="780" y="447" text-anchor="middle" font-size="16" fill="#9aa3b2">건물 안에서 받을 사람</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">‘어디로’라는 정보가 여러 종류예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이번 구간을 넘겨받을 사람을 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길이 바뀌어도 최종 건물은 그대로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">건물에 도착하면 호수로 받을 사람을 찾아요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
