6" height="52" rx="6" fill="#ffb454"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">4</text></g><text x="480" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">작은 단위로 나눠요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g transform="translate(345,300)"><rect x="-38" y="-26" width="76" height="52" rx="6" fill="#ffb454"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">1</text><rect x="-28" y="-59" width="55" height="30" rx="15" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-38.96" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">송장</text></g><g transform="translate(435,300)"><rect x="-38" y="-26" width="76" height="52" rx="6" fill="#ffb454"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">2</text><rect x="-28" y="-59" width="55" height="30" rx="15" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-38.96" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">송장</text></g><g transform="translate(525,300)"><rect x="-38" y="-26" width="76" height="52" rx="6" fill="#ffb454"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">3</text><rect x="-28" y="-59" width="55" height="30" rx="15" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-38.96" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">송장</text></g><g transform="translate(615,300)"><rect x="-38" y="-26" width="76" height="52" rx="6" fill="#ffb454"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">4</text><rect x="-28" y="-59" width="55" height="30" rx="15" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-38.96" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">