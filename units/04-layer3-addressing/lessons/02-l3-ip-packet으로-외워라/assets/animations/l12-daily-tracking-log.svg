<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>배송 기록을 보고 문제를 찾는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">배송 기록을 보고 문제를 찾는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">기록을 보면 어디서 멈췄는지 알 수 있어요</text>
<polygon points="70,194 110,160 150,194" fill="#9aa3b2"/><rect x="78" y="194" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="101" y="214" width="18" height="28" fill="#3d4b60"/><text x="110" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><polygon points="810,194 850,160 890,194" fill="#9aa3b2"/><rect x="818" y="194" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="214" width="18" height="28" fill="#3d4b60"/><text x="850" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">받는 곳</text><line x1="170" y1="240" x2="780" y2="240" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="300" width="300" height="130" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">배송 기록판</text><line x1="480" y1="252" x2="480" y2="300" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 6"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="350" y="358" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">→ 접수됨</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="350" y="388" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">← 수령 확인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="350" y="388" text-anchor="start" font-size="20" font-weight="700" fill="#ff7b72">← 이후 기록 없음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,240;170,240;780,240;780,240" keyTimes="0.000;0.025;0.150;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="780,240;780,240;170,240;170,240" keyTimes="0.000;0.275;0.400;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,240;170,240;780,240;780,240" keyTimes="0.000;0.525;0.625;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.637;0.652;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="850" cy="130" r="16" fill="#ffb454"/><text x="850" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="250" y="290" width="460" height="150" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="290" cy="330" r="16" fill="#7ee7c7"/><path d="M282 330 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="320" y="337" text-anchor="start" font-size="21" font-weight="700" fill="#7ee7c7">내 택배 · 허가받은 기록</text><circle cx="290" cy="380" r="16" fill="#ff7b72"/><path d="M283 373 l14 14 M297 373 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="320" y="387" text-anchor="start" font-size="21" font-weight="700" fill="#ff7b72">남의 택배 정보</text><text x="480" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">함부로 알려 주지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낸 택배가 접수됐는지 기록을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받은 확인이 돌아왔는지도 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록이 끊긴 곳에서 문제를 좁혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 택배나 허가받은 기록만 조회해요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
