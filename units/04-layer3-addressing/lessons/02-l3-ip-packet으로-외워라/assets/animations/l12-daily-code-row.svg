imate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="694.0" y="166" width="112.0" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><text x="858.0" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">안쪽 송장 시작</text><line x1="806.0" y1="236" x2="910.0" y2="236" stroke="#9aa3b2" stroke-width="3"/><text x="480" y="330" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">종류 0800 → 뒤에 안쪽 송장이 이어져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="300" y="310" width="360" height="36" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="318" y="335" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">▸ 바깥 송장</text><rect x="324" y="354" width="360" height="36" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="342" y="379" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">▸ 안쪽 송장</text><rect x="348" y="398" width="360" height="36" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="366" y="423" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">▸ 내용물</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">숫자만 보면 어디가 무슨 칸인지 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정해진 칸대로 나누면 의미가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">종류 칸이 다음에 올 내용을 알려 줘요</text></g>
