<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="50" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">송장 붙은 상자, 헤더와 페이로드</text>

<!-- whole packet label -->
<g stroke="#9aa3b2" stroke-width="2" fill="none">
<path d="M120 130 V118 H435"/><path d="M525 118 H840 V130"/>
</g>
<text x="480" y="127" font-size="28" font-weight="700" fill="#e6e8ec" text-anchor="middle">패킷</text>

<!-- outer box -->
<rect x="120" y="136" width="720" height="170" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>

<!-- outer header -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.26;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<rect x="120" y="136" width="180" height="170" rx="10" fill="#ffb454"/>
<text x="210" y="210" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">받는 곳</text>
<text x="210" y="246" font-size="24" fill="#0f1115" text-anchor="middle">192.168.0.10</text>
</g>

<!-- outer payload: fills blue, then lid rolls up -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.38;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<rect x="303" y="136" width="537" height="170" rx="10" fill="#6ea8fe">
<animate attributeName="height" values="170;170;14;14;170" keyTimes="0;0.5;0.57;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</rect>
<rect x="303" y="136" width="537" height="170" rx="10" fill="none" stroke="#6ea8fe" stroke-width="3"/>
</g>

<!-- inner packet -->
<g opacity="0" transform="translate(0,30)">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.62;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<animateTransform attributeName="transform" type="translate" values="0,30;0,30;0,0;0,0;0,30" keyTimes="0;0.56;0.62;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<rect x="330" y="196" width="480" height="90" rx="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.69;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<rect x="330" y="196" width="120" height="90" rx="8" fill="#ffb454"/>
<text x="390" y="250" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">헤더</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.73;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<rect x="452" y="196" width="358" height="90" rx="8" fill="#6ea8fe"/>
<text x="631" y="250" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">페이로드</text>
</g>
</g>

<!-- "whole packet" label for inner box -->
<text x="570" y="182" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">↓ 이 안의 패킷 통째
<animate attributeName="opacity" values="0;0;1;0.3;1;0.3;1;1;0" keyTimes="0;0.74;0.78;0.83;0.87;0.91;0.94;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>

<!-- name tags under box -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.29;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<line x1="210" y1="306" x2="210" y2="318" stroke="#ffb454" stroke-width="3"/>
<text x="210" y="346" font-size="26" font-weight="700" fill="#ffb454" text-anchor="middle">헤더(송장)</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.3;1;0.3;1;1;0" keyTimes="0;0.36;0.41;0.79;0.83;0.87;0.91;0.94;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
<line x1="570" y1="306" x2="570" y2="318" stroke="#6ea8fe" stroke-width="3"/>
<text x="570" y="346" font-size="26" font-weight="700" fill="#6ea8fe" text-anchor="middle">페이로드(내용물)
<animate attributeName="fill" values="#6ea8fe;#6ea8fe;#7ee7c7;#7ee7c7;#6ea8fe" keyTimes="0;0.77;0.79;0.95;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>
</g>

<!-- conclusion -->
<text x="480" y="400" font-size="28" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">보는 층에 따라 송장도 되고 물건도 된다
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.79;0.95;0.98;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>

<!-- caption bar -->
<rect x="40" y="426" width="880" height="92" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="481">네트워크로 보내는 한 덩어리, 이것이 ‘패킷’이에요
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.21;0.97;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>
<text x="480" y="481" opacity="0">헤더는 길을 알려 주는 송장, 페이로드는 실어 나를 내용물
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.48;0.51;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>
<text x="480" y="481" opacity="0">상자를 열면 송장 붙은 작은 상자가 또 들어 있어요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.54;0.74;0.77;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>
<text x="480" y="481" opacity="0">바깥 상자의 페이로드가 곧 안쪽 패킷 통째예요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.8;0.95;0.97;1" dur="12s" repeatCount="indefinite" begin="2s"/>
</text>
</g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.230000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.230000;0.530000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.530000;0.790000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.790000;1" dur="12s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="298.7" text-anchor="middle" font-size="82" font-weight="750" letter-spacing="-1" fill="#e6e8ec">l12 header payload</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.028571;0.121429;0.142857;1" dur="14s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.028571;0.121429;0.142857;1" dur="14s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.121429;0.142857;1" dur="14s" repeatCount="indefinite"/></g></svg>