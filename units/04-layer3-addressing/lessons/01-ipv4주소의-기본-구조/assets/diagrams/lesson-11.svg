<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-11-basic-export-title lesson-11-basic-export-desc" lang="ko"><title id="lesson-11-basic-export-title">IPv4주소의 기본 구조 · 학습 흐름</title><desc id="lesson-11-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-11-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-11-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/></g><a href="../lesson-11.html#concept-basic-11-01" target="_top" aria-label="L2와 L3의 식별자 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">L2와 L3의 식별자</tspan></text></a><a href="../lesson-11.html#concept-basic-11-02" target="_top" aria-label="IPv4의 32비트 구조 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">IPv4의 32비트 구조</tspan></text></a><a href="../lesson-11.html#concept-basic-11-03" target="_top" aria-label="8비트씩 나눠 읽기 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">8비트씩 나눠 읽기</tspan></text></a><a href="../lesson-11.html#concept-basic-11-04" target="_top" aria-label="Network ID와 Host ID 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">Network ID와 Host ID</tspan></text></a><a href="../lesson-11.html#concept-basic-11-05" target="_top" aria-label="주소를 나누는 이유 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">주소를 나누는 이유</tspan></text></a><a href="../lesson-11.html#concept-basic-11-06" target="_top" aria-label="물류센터로 이해하는 라우터 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">물류센터로 이해하는</tspan><tspan x="421.0" dy="25">라우터</tspan></text></a><a href="../lesson-11.html#concept-basic-11-07" target="_top" aria-label="주소 구조 정리 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">주소 구조 정리</tspan></text></a></svg>
