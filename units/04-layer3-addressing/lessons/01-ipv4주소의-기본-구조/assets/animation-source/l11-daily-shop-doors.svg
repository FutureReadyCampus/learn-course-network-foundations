<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>가게는 하나, 문마다 주소가 있다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">가게는 하나, 문마다 주소가 있다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소는 가게 전체가 아니라 길과 닿은 문에 붙어요</text>
<g><rect x="380" y="190" width="200" height="140" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M370 190 h220 l-14 -30 h-192 z" fill="#ffb454"/><rect x="420" y="230" width="120" height="50" rx="4" fill="#3d4b60" stroke="#3d4b60" stroke-width="2"/><text x="480" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">가게 한 곳</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="10s" repeatCount="indefinite" begin="2s"/><rect x="366" y="260" width="20" height="60" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="356" y="340" text-anchor="end" font-size="17" fill="#9aa3b2">정문</text><line x1="60" y1="280" x2="366" y2="280" stroke="#7ee7c7" stroke-width="4"/><text x="213.0" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">꽃길</text><rect x="105" y="210" width="190" height="42" rx="21" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="200" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">꽃길 <tspan fill="#ffb454">10</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="10s" repeatCount="indefinite" begin="2s"/><rect x="574" y="260" width="20" height="60" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="604" y="340" text-anchor="start" font-size="17" fill="#9aa3b2">뒷문</text><line x1="594" y1="280" x2="900" y2="280" stroke="#7ee7c7" stroke-width="4"/><text x="747.0" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">별길</text><rect x="665" y="210" width="190" height="42" rx="21" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="760" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">별길 <tspan fill="#ffb454">3</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite" begin="2s"/><rect x="206" y="204" width="38" height="46" rx="8" fill="none" stroke="#ffb454" stroke-width="3"/><rect x="90" y="392" width="360" height="60" rx="12" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">가게 = 찾아가는 곳 자체</text><text x="480" y="430" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">≠</text><rect x="510" y="392" width="360" height="60" rx="12" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="690" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#ffb454">‘10’ = 주소 끝의 번지</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님이 찾아가는 가게 한 곳</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정문은 꽃길에 닿아서 ‘꽃길 10’</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">뒷문은 별길에 닿아서 ‘별길 3’</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게와 주소 끝의 번지 ‘10’은 서로 다른 것</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="10s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="290.99" text-anchor="middle" font-size="59.9725" font-weight="750" letter-spacing="-1" fill="#e6e8ec">가게는 하나, 문마다 주소가 있다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033333;0.141667;0.166667;1" dur="12s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.033333;0.141667;0.166667;1" dur="12s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.141667;0.166667;1" dur="12s" repeatCount="indefinite"/></g></svg>