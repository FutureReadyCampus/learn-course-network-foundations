<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>라우터는 목적지 네트워크 쪽으로 전달한다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">라우터는 목적지 네트워크 쪽으로 전달한다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">목적지 IP는 그대로, 프레임의 목적지 MAC은 구간마다 새로</text>
<rect x="690" y="124" width="250" height="156" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="815" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">10.1.2.0/24 네트워크</text><line x1="120" y1="300" x2="815" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="120" y1="270" x2="120" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="330" y1="270" x2="330" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="570" y1="270" x2="570" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="815" y1="270" x2="815" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><rect x="86" y="176" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="94" y="183" width="52" height="30" fill="#3d4b60"/><polygon points="76,222 164,222 172,234 68,234" fill="#6ea8fe"/><text x="120" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.0.10</text><circle cx="330" cy="210" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M315 204 h28 l-7 -7 M345 216 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="330" y="260" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터 1</text><circle cx="570" cy="210" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M555 204 h28 l-7 -7 M585 216 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="570" y="260" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터 2</text><rect x="781" y="174" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="789" y="181" width="52" height="32" fill="#3d4b60"/><rect x="810" y="220" width="10" height="10" fill="#6ea8fe"/><rect x="793" y="230" width="44" height="5" fill="#6ea8fe"/><text x="815" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버 10.1.2.7</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="120,300;120,300;330,300;330,300" keyTimes="0.000;0.037;0.175;1.000" dur="10s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-83" y="24" width="167" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">목적지 IP: 10.1.2.7</text><rect x="-87" y="62" width="175" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 라우터 1</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="330,300;330,300;570,300;570,300" keyTimes="0.000;0.287;0.425;1.000" dur="10s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-83" y="24" width="167" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">목적지 IP: 10.1.2.7</text><rect x="-87" y="62" width="175" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 라우터 2</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="570,300;570,300;815,300;815,300" keyTimes="0.000;0.537;0.675;1.000" dur="10s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-83" y="24" width="167" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">목적지 IP: 10.1.2.7</text><rect x="-73" y="62" width="146" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 서버</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><rect x="793" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M793 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="871" cy="180" r="16" fill="#7ee7c7"/><path d="M863 180 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="30" y="380" width="900" height="88" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="48" y="416" text-anchor="start" font-size="18" font-weight="700" fill="#ffb454">목적지 IP</text><text x="48" y="452" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">목적지 MAC</text><text x="255.0" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">10.1.2.7</text><text x="255.0" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">라우터 1</text><text x="480.0" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">10.1.2.7</text><text x="480.0" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">라우터 2</text><text x="722.5" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">10.1.2.7</text><text x="722.5" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 네트워크로 갈 때는 먼저 기본 게이트웨이(라우터 1)로</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터 1은 목적지 IP와 경로 정보로 다음 방향을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터 2는 목적지 네트워크에 연결 — 서버까지 마지막 전달</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP는 끝까지 서버를 가리키고, MAC은 구간마다 바뀌어요</text></g>

