<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>‘101동 1203호’를 두 단계로 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">‘101동 1203호’를 두 단계로 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">어느 건물인지 먼저, 그 안의 어느 집인지 다음</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><rect x="250" y="140" width="460" height="80" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="194" text-anchor="middle" font-size="40" font-weight="700" fill="#e6e8ec">101동 1203호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><rect x="250" y="140" width="300" height="80" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="400" y="194" text-anchor="middle" font-size="40" font-weight="700" fill="#6ea8fe">101동</text><rect x="560" y="140" width="150" height="80" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="635" y="194" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1203호</text><text x="400" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">동 = 어느 건물</text><text x="635" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">호 = 건물 안의 집</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><rect x="250" y="284" width="460" height="54" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="300" y="320" text-anchor="start" font-size="26" font-weight="700" fill="#e6e8ec">101동 1204호</text><text x="640" y="320" text-anchor="end" font-size="20" font-weight="700" fill="#7ee7c7">같은 동 · 이웃집</text><circle cx="680" cy="311" r="16" fill="#7ee7c7"/><path d="M672 311 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="250" y="354" width="460" height="54" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="300" y="390" text-anchor="start" font-size="26" font-weight="700" fill="#e6e8ec">102동 1203호</text><text x="640" y="390" text-anchor="end" font-size="20" font-weight="700" fill="#ff7b72">다른 동</text><circle cx="680" cy="381" r="16" fill="#ff7b72"/><path d="M673 374 l14 14 M687 374 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><rect x="250" y="140" width="460" height="80" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="194" text-anchor="middle" font-size="40" font-weight="700" fill="#e6e8ec">1011203</text><text x="480" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">구분 표시가 없으면?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><text x="470" y="304" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec"><tspan fill="#6ea8fe">10</tspan><tspan fill="#9aa3b2"> | </tspan><tspan fill="#ffb454">11203</tspan></text><circle cx="530" cy="295" r="16" fill="#ffb454"/><text x="530" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="470" y="360" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec"><tspan fill="#6ea8fe">101</tspan><tspan fill="#9aa3b2"> | </tspan><tspan fill="#ffb454">1203</tspan></text><circle cx="530" cy="351" r="16" fill="#ffb454"/><text x="530" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="470" y="416" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec"><tspan fill="#6ea8fe">1011</tspan><tspan fill="#9aa3b2"> | </tspan><tspan fill="#ffb454">203</tspan></text><circle cx="530" cy="407" r="16" fill="#ffb454"/><text x="530" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아파트 주소 한 줄: 101동 1203호</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞부분은 건물(동), 뒷부분은 집(호)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동이 같으면 같은 건물, 다르면 다른 건물</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">구분 없이 붙여 쓰면 어디서 끊을지 몰라요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
