<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>물류센터를 거쳐 가는 택배</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">물류센터를 거쳐 가는 택배</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">최종 주소는 그대로, 이번 구간 스티커만 바뀌어요</text>
<rect x="690" y="124" width="250" height="156" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="815" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">바다시 3동</text><line x1="120" y1="300" x2="815" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="120" y1="270" x2="120" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="330" y1="270" x2="330" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="570" y1="270" x2="570" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><line x1="815" y1="270" x2="815" y2="300" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><polygon points="80,204 120,170 160,204" fill="#9aa3b2"/><rect x="88" y="204" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="111" y="224" width="18" height="28" fill="#3d4b60"/><text x="120" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">출발</text><polygon points="290,200 330,176 370,200" fill="#6ea8fe"/><rect x="294" y="200" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="310" y="216" width="40" height="22" fill="#3d4b60"/><text x="330" y="260" text-anchor="middle" font-size="17" fill="#9aa3b2">A 물류센터</text><polygon points="530,200 570,176 610,200" fill="#6ea8fe"/><rect x="534" y="200" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="550" y="216" width="40" height="22" fill="#3d4b60"/><text x="570" y="260" text-anchor="middle" font-size="17" fill="#9aa3b2">B 물류센터</text><polygon points="775,204 815,170 855,204" fill="#9aa3b2"/><rect x="783" y="204" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="806" y="224" width="18" height="28" fill="#3d4b60"/><text x="815" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">7번지 집</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="120,300;120,300;330,300;330,300" keyTimes="0.000;0.037;0.175;1.000" dur="10s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-93" y="24" width="186" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">최종: 바다시 3동 7번지</text><rect x="-79" y="62" width="158" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">이번 구간 → A 센터</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="330,300;330,300;570,300;570,300" keyTimes="0.000;0.287;0.425;1.000" dur="10s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-93" y="24" width="186" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">최종: 바다시 3동 7번지</text><rect x="-79" y="62" width="158" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">이번 구간 → B 센터</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="570,300;570,300;815,300;815,300" keyTimes="0.000;0.537;0.675;1.000" dur="10s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-93" y="24" width="186" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="45.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">최종: 바다시 3동 7번지</text><rect x="-86" y="62" width="173" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="83.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">이번 구간 → 7번지 집</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><rect x="797" y="286" width="36" height="28" rx="3" fill="#ffb454"/><rect x="811" y="286" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><circle cx="871" cy="180" r="16" fill="#7ee7c7"/><path d="M863 180 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="30" y="380" width="900" height="88" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="48" y="416" text-anchor="start" font-size="18" font-weight="700" fill="#ffb454">최종 주소</text><text x="48" y="452" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">구간 스티커</text><text x="255.0" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바다시 3동 7번지</text><text x="255.0" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">A 센터</text><text x="480.0" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바다시 3동 7번지</text><text x="480.0" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">B 센터</text><text x="722.5" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바다시 3동 7번지</text><text x="722.5" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">7번지 집</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에는 최종 주소와 ‘이번 구간’ 스티커가 붙어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A 센터는 최종 주소의 동네를 보고 B 센터로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">B 센터는 그 동네 담당 — 7번지 집으로 배달</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">최종 주소는 끝까지 같고, 구간 스티커는 매번 바뀌어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="10s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="10s" repeatCount="indefinite"/></rect></g></g></svg>