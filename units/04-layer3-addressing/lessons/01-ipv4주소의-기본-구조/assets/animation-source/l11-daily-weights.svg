e cx="732.0" cy="195" r="9" fill="none" stroke="#ffb454" stroke-width="4"/><polygon points="713.0,205 751.0,205 761.0,255 703.0,255" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="228.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">128g</text><text x="300.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">64g</text><text x="372.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">32g</text><text x="444.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">16g</text><text x="516.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">8g</text><text x="588.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">4g</text><text x="660.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">2g</text><text x="732.0" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">1g</text><text x="480" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">올린 추: 128 + 64 + … + 1 = 255g</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="10s" repeatCount="indefinite"/><text x="480" y="315" text-anchor="middle" font-size="26" font-weight="700" fill="#9aa3b2">자릿값: 왼쪽부터 절반씩 작아져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="10s" repeatCount="indefinite"/><text x="496" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#ff7b72">256g은 추 여덟 개로 만들 수 없어요</text><circle cx="280.48" cy="372" r="16" fill="#ff7b72"/><path d="M273.48 365 l14 14 M287.48 365 l-14 14" stroke="#0f1115" stroke-width="4"/></g>
