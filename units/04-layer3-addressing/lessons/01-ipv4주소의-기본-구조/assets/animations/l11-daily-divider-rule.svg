<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>칸막이를 어디에 두느냐</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">칸막이를 어디에 두느냐</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">규칙이 동네 번호와 집 번호의 경계를 정해요</text>
