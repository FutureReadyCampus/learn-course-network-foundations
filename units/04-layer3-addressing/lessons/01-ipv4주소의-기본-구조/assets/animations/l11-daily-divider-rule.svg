<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>칸막이를 어디에 두느냐</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">칸막이를 어디에 두느냐</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">규칙이 경계를 정하고, 경계가 집 번호의 개수를 정해요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="54" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="102.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="162" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="210.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">0</text><rect x="270" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="318.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="378" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="426.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">2</text><rect x="486" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="534.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">0</text><rect x="594" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="642.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">3</text><rect x="702" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="750.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text><rect x="810" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="858.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">5</text><line x1="696.0" y1="152" x2="696.0" y2="242" stroke="#e6e8ec" stroke-width="4"/><rect x="628" y="130" width="135" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="696.0" y="151.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">규칙: 앞 6자리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="375.0" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">동네 번호</text><text x="801.0" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">집 번호</text><text x="801.0" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">뒤 2자리 → 100가지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="54" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="102.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="162" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="210.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">0</text><rect x="270" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="318.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="378" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="426.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">2</text><rect x="486" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="534.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">0</text><rect x="594" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="642.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">3</text><rect x="702" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="750.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text><rect x="810" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="858.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">5</text><line x1="480.0" y1="152" x2="480.0" y2="242" stroke="#e6e8ec" stroke-width="4"/><rect x="412" y="130" width="135" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480.0" y="151.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">규칙: 앞 4자리</text><text x="267.0" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">동네 번호</text><text x="693.0" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">집 번호</text><text x="693.0" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">뒤 4자리 → 10,000가지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="54" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="102.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="162" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="210.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">0</text><rect x="270" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="318.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">1</text><rect x="378" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="426.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">2</text><rect x="486" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="534.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">0</text><rect x="594" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="642.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#6ea8fe">3</text><rect x="702" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="750.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text><rect x="810" y="168" width="96" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="858.0" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">5</text><line x1="696.0" y1="152" x2="696.0" y2="242" stroke="#e6e8ec" stroke-width="4"/><rect x="628" y="130" width="135" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="696.0" y="151.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">규칙: 앞 6자리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="75" y="360" width="230" height="64" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="190" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">전체 지도</text><text x="335" y="402" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">→</text><rect x="365" y="360" width="230" height="64" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">동네 먼저</text><text x="625" y="402" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">→</text><rect x="655" y="360" width="230" height="64" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="770" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">그다음 집</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 카드가 ‘앞 6자리는 동네’라고 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남은 2자리로 구별할 집은 100가지</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙이 ‘앞 4자리’면 집 번호는 10,000가지</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">찾을 때는 동네부터, 그다음 집</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
