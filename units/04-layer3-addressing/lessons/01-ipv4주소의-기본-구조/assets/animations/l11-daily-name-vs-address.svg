" stroke-width="3"/><rect x="841" y="294" width="18" height="28" fill="#3d4b60"/><text x="850" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">다른 집</text><rect x="186" y="388" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="180" y="380" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="198" y="398" width="44" height="18" fill="#3d4b60"/><text x="220" y="450" text-anchor="middle" font-size="17" fill="#9aa3b2">경비실</text><rect x="741" y="388" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="735" y="380" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="753" y="398" width="44" height="18" fill="#3d4b60"/><text x="775" y="450" text-anchor="middle" font-size="17" fill="#9aa3b2">경비실</text><polygon points="470,400 510,376 550,400" fill="#6ea8fe"/><rect x="474" y="400" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="490" y="416" width="40" height="22" fill="#3d4b60"/><text x="510" y="460" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,280;110,280;220,410;330,280;330,280" keyTimes="0.000;0.025;0.100;0.175;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-67" y="-50" width="134" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">받는 사람: 민수</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.150;0.165;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="330" cy="205" r="16" fill="#7ee7c7"/><path d="M322 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,280;110,280;220,410;220,410" keyTimes="0.000;0.275;0.350;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-67" y="-50" width="134" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">받는 사람: 지영</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.363;0.378;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><circle cx="220" cy="250" r="16" fill="#ffb454"/><text x="220" y="257" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="220" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">어느 동네로 보내지?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="220,410;220,410;510,410;775,410;775,410" keyTimes="0.000;0.525;0.600;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-95" y="-50" width="191" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">바다시 3동 7번지 · 지영</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="775,410;775,410;700,280;700,280" keyTimes="0.000;0.775;0.875;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-67" y="-50" width="134" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">받는 사람: 지영</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.887;0.902;1" dur="15s" repeatCount="indefinite"/><circle cx="700" cy="205" r="16" fill="#7ee7c7"/><path d="M692 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 단지 이웃에게는 이름만 보고 건넬 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 도시 친구에게 이름만 적으면 길을 못 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동네 주소를 적어야 물류센터가 방향을 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도착한 동네 안에서는 다시 이름으로 찾아요</text></g>

