<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이름만 적은 택배는 어디로 갈까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이름만 적은 택배는 어디로 갈까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름은 누구인지, 주소는 어느 동네로 갈지 알려 줘요</text>
