<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>호스트는 하나, 인터페이스마다 IP</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">호스트는 하나, 인터페이스마다 IP</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">IP 주소는 장치 전체가 아니라 네트워크 인터페이스에 설정돼요</text>
<g><rect x="400" y="180" width="160" height="104" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><rect x="414" y="194" width="132" height="76" rx="4" fill="#3d4b60" stroke="#3d4b60" stroke-width="2"/><polygon points="380,290 580,290 598,316 362,316" fill="#6ea8fe"/><text x="480" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">노트북 한 대</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="366" y="260" width="20" height="40" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="356" y="340" text-anchor="end" font-size="17" fill="#9aa3b2">유선 NIC</text><line x1="60" y1="280" x2="366" y2="280" stroke="#7ee7c7" stroke-width="4"/><text x="213.0" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">유선 LAN</text><rect x="105" y="210" width="190" height="42" rx="21" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="200" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">192.168.0.<tspan fill="#ffb454">10</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="574" y="260" width="20" height="40" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="604" y="340" text-anchor="start" font-size="17" fill="#9aa3b2">Wi-Fi NIC</text><line x1="594" y1="280" x2="900" y2="280" stroke="#7ee7c7" stroke-width="4"/><text x="747.0" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">Wi-Fi 네트워크</text><rect x="665" y="210" width="190" height="42" rx="21" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="760" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">10.0.0.<tspan fill="#ffb454">7</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="237" y="204" width="38" height="46" rx="8" fill="none" stroke="#ffb454" stroke-width="3"/><rect x="90" y="392" width="360" height="60" rx="12" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">호스트(host) = 노트북 장치</text><text x="480" y="430" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">≠</text><rect x="510" y="392" width="360" height="60" rx="12" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="690" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#ffb454">Host ID = 주소 안의 ‘10’</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">데이터를 주고받는 끝단 장치 = 호스트</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">유선 인터페이스에 192.168.0.10</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Wi-Fi 인터페이스에 10.0.0.7</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호스트(장치)와 Host ID(주소의 일부)는 다른 말</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>