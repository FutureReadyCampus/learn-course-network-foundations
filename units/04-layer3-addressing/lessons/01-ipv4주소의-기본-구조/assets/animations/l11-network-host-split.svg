<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="54" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">주소 속의 동네와 번지</text>

<!-- 1) 주소 한 줄: 192.168.0.10 -->
<g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.54;0.95;1" dur="14s" repeatCount="indefinite"/>
<g fill="#e6e8ec" font-size="60" font-weight="700" text-anchor="middle">
<animate attributeName="fill" values="#e6e8ec;#e6e8ec;#6ea8fe;#6ea8fe;#e6e8ec" keyTimes="0;0.2;0.25;0.95;1" dur="14s" repeatCount="indefinite"/>
<rect x="135" y="150" width="150" height="100" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="315" y="150" width="150" height="100" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="495" y="150" width="150" height="100" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="210" y="221">192</text><text x="390" y="221">168</text><text x="570" y="221">0</text>
<text x="300" y="221" fill="#9aa3b2">.</text><text x="480" y="221" fill="#9aa3b2">.</text>
</g>
<rect x="125" y="140" width="530" height="120" rx="14" fill="#6ea8fe" fill-opacity="0.12" stroke="#6ea8fe" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.95;1" dur="14s" repeatCount="indefinite"/></rect>
<g fill="#e6e8ec" font-size="60" font-weight="700" text-anchor="middle">
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;30,0;30,0;0,0" keyTimes="0;0.2;0.25;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="fill" values="#e6e8ec;#e6e8ec;#ffb454;#ffb454;#e6e8ec" keyTimes="0;0.2;0.25;0.95;1" dur="14s" repeatCount="indefinite"/>
<text x="657" y="221" fill="#9aa3b2">.</text>
<rect x="675" y="150" width="150" height="100" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="670" y="140" width="160" height="120" rx="14" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.95;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="750" y="221">10</text>
</g>
</g>

<!-- 2) 이름표: Network ID / Host ID -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.3;0.48;0.52;1" dur="14s" repeatCount="indefinite"/>
<path d="M135 276 v12 h510 v-12" fill="none" stroke="#6ea8fe" stroke-width="3"/>
<text x="390" y="328" font-size="30" font-weight="700" fill="#6ea8fe" text-anchor="middle">Network ID</text>
<text x="390" y="364" font-size="24" fill="#9aa3b2" text-anchor="middle">동네 · 앞 24비트</text>
<path d="M705 276 v12 h150 v-12" fill="none" stroke="#ffb454" stroke-width="3"/>
<text x="780" y="328" font-size="30" font-weight="700" fill="#ffb454" text-anchor="middle">Host ID</text>
<text x="780" y="364" font-size="24" fill="#9aa3b2" text-anchor="middle">번지 · 8비트</text>
</g>

<!-- 3) 파란 부분이 동네 윤곽으로 변함 -->
<rect x="125" y="140" width="530" height="120" rx="14" fill="#6ea8fe" fill-opacity="0.08" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="12 8" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="x" values="125;125;275;275;50;50;125" keyTimes="0;0.5;0.56;0.8;0.84;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="y" values="140;140;95;95;140" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="width" values="530;530;410;410;530" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="height" values="120;120;320;320;120" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="rx" values="14;14;40;40;14" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
</rect>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="225,0;225,0;0,0;0,0" keyTimes="0;0.8;0.84;1" dur="14s" repeatCount="indefinite"/>
<text x="255" y="146" font-size="28" font-weight="700" fill="#6ea8fe" text-anchor="middle">192.168.0 동네</text>
<g fill="#171a21" stroke="#3d4b60" stroke-width="2">
<path d="M95 232 L145 186 L195 232 Z"/><rect x="105" y="232" width="80" height="88"/>
<path d="M205 232 L255 186 L305 232 Z"/><rect x="215" y="232" width="80" height="88"/>
<path d="M315 232 L365 186 L415 232 Z"/><rect x="325" y="232" width="80" height="88"/>
</g>
<g font-size="30" font-weight="700" fill="#ffb454" text-anchor="middle">
<text x="145" y="288">.10</text><text x="255" y="288">.11</text><text x="365" y="288">.12</text>
</g>
<text x="255" y="378" font-size="24" fill="#9aa3b2" text-anchor="middle">앞부분 같음 · 끝 번호만 다름</text>
</g>

<!-- 4) 다른 동네 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.86;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
<text x="480" y="276" font-size="44" font-weight="700" fill="#7ee7c7" text-anchor="middle">≠</text>
<rect x="500" y="95" width="410" height="320" rx="40" fill="#6ea8fe" fill-opacity="0.08" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="12 8"/>
<text x="705" y="146" font-size="28" font-weight="700" fill="#6ea8fe" text-anchor="middle">192.168.<tspan fill="#7ee7c7" text-decoration="underline">1</tspan> 동네</text>
<g fill="#171a21" stroke="#3d4b60" stroke-width="2">
<path d="M545 232 L595 186 L645 232 Z"/><rect x="555" y="232" width="80" height="88"/>
<path d="M655 232 L705 186 L755 232 Z"/><rect x="665" y="232" width="80" height="88"/>
<path d="M765 232 L815 186 L865 232 Z"/><rect x="775" y="232" width="80" height="88"/>
</g>
<g font-size="30" font-weight="700" fill="#ffb454" text-anchor="middle">
<text x="595" y="288">.10</text><text x="705" y="288">.11</text><text x="815" y="288">.12</text>
</g>
<text x="705" y="378" font-size="24" fill="#9aa3b2" text-anchor="middle">번호가 같아도 다른 집</text>
</g>
<text x="480" y="452" font-size="24" fill="#9aa3b2" text-anchor="middle" opacity="0">※ 경계는 기준에 따라 달라짐<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.88;0.95;0.97;1" dur="14s" repeatCount="indefinite"/></text>

<!-- 자막 바 -->
<rect x="40" y="472" width="880" height="54" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" text-anchor="middle" fill="#e6e8ec">
<text x="480" y="508">IP 주소는 한 줄이지만, 안에 동네와 번지가 들어 있어요<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.21;0.97;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="508" opacity="0">앞 세 칸(24비트)은 동네, 마지막 칸(8비트)은 집 번호<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.49;0.51;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="508" opacity="0">같은 동네 집들은 앞부분이 같고, 끝 번호만 달라요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.79;0.81;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="508" opacity="0" font-weight="700" fill="#7ee7c7">IP 주소 = 동네(Network ID) + 번지(Host ID)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.81;0.83;0.95;0.97;1" dur="14s" repeatCount="indefinite"/></text>
</g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.21;0.22;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.22;0.51;0.52;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.52;0.81;0.82;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.81;0.82;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text></g>
</svg>
