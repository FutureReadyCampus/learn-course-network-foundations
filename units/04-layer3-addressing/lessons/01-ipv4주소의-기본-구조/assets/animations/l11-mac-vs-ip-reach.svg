<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>MAC 주소만으로 다른 LAN까지 갈까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">MAC 주소만으로 다른 LAN까지 갈까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">MAC은 이 구간에서 누구인지, IP는 어느 네트워크인지</text>
<rect x="40" y="130" width="360" height="330" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="220" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">우리 LAN</text><rect x="620" y="130" width="300" height="330" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="770" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">다른 네트워크</text><line x1="110" y1="360" x2="220" y2="400" stroke="#3d4b60" stroke-width="3"/><line x1="330" y1="360" x2="220" y2="400" stroke="#3d4b60" stroke-width="3"/><line x1="700" y1="360" x2="775" y2="400" stroke="#3d4b60" stroke-width="3"/><line x1="850" y1="360" x2="775" y2="400" stroke="#3d4b60" stroke-width="3"/><line x1="272" y1="410" x2="482" y2="410" stroke="#3d4b60" stroke-width="3"/><line x1="538" y1="410" x2="723" y2="410" stroke="#3d4b60" stroke-width="3"/><rect x="76" y="246" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="253" width="52" height="30" fill="#3d4b60"/><polygon points="66,292 154,292 162,304 58,304" fill="#6ea8fe"/><text x="110" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="312" y="244" width="36" height="22" fill="#e6e8ec"/><rect x="294" y="264" width="72" height="36" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="308" y="300" width="44" height="4" fill="#6ea8fe"/><text x="330" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">프린터</text><rect x="666" y="244" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="674" y="251" width="52" height="32" fill="#3d4b60"/><rect x="695" y="290" width="10" height="10" fill="#6ea8fe"/><rect x="678" y="300" width="44" height="5" fill="#6ea8fe"/><text x="700" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구 PC</text><rect x="816" y="244" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="251" width="52" height="32" fill="#3d4b60"/><rect x="845" y="290" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="300" width="44" height="5" fill="#6ea8fe"/><text x="850" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">다른 PC</text><rect x="168" y="394" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="180" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="197" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="214" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="231" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="248" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="220" y="450" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><rect x="723" y="394" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="735" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="752" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="769" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="786" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="803" y="405" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="775" y="450" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="510" cy="410" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M495 404 h28 l-7 -7 M525 416 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="510" y="460" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,280;110,280;220,410;330,280;330,280" keyTimes="0.000;0.025;0.100;0.175;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-81" y="-50" width="161" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 프린터</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.150;0.165;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="330" cy="205" r="16" fill="#7ee7c7"/><path d="M322 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,280;110,280;220,410;220,410" keyTimes="0.000;0.275;0.350;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-84" y="-50" width="169" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 친구 PC</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.363;0.378;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="220" cy="250" r="16" fill="#ffb454"/><text x="220" y="257" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="220" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">이 LAN에 없는 MAC</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="220,410;220,410;510,410;775,410;775,410" keyTimes="0.000;0.525;0.600;0.675;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-83" y="-50" width="167" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">목적지 IP: 10.1.2.7</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="775,410;775,410;700,280;700,280" keyTimes="0.000;0.775;0.875;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-84" y="-50" width="169" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-28.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">목적지 MAC: 친구 PC</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.887;0.902;1" dur="16s" repeatCount="indefinite"/><circle cx="700" cy="205" r="16" fill="#7ee7c7"/><path d="M692 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 LAN에서는 목적지 MAC을 보고 스위치가 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 네트워크의 MAC만으로는 갈 방향을 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적지 IP를 보고 라우터가 그 네트워크 쪽으로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도착한 LAN 안에서는 다시 MAC으로 마지막 전달</text></g>

