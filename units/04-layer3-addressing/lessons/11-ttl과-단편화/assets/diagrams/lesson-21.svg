<style>.learning-flow{background:#0f1115}.learning-flow text{font:500 22px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style>
<g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-21-flow-arrow)"><path d="M268 169 H292"/><path d="M546 169 H570"/><path d="M824 169 H848"/><path d="M977 218 V303 H143 V363"/><path d="M268 413 H292"/><path d="M546 413 H570"/><path d="M824 413 H848"/></g>
<g text-anchor="middle">
<rect x="18" y="118" width="250" height="100" rx="12"/><text x="143" y="158"><tspan x="143">경로 지도와</tspan><tspan x="143" dy="30">두 가지 제약</tspan></text>
<rect x="296" y="118" width="250" height="100" rx="12"/><text x="421" y="158"><tspan x="421">라우터·홉과</tspan><tspan x="421" dy="30">다음 경로</tspan></text>
<rect x="574" y="118" width="250" height="100" rx="12"/><text x="699" y="158"><tspan x="699">TTL이 전달을</tspan><tspan x="699" dy="30">제한한다</tspan></text>
<rect x="852" y="118" width="250" height="100" rx="12"/><text x="977" y="158"><tspan x="977">TTL 0과</tspan><tspan x="977" dy="30">ICMP 알림</tspan></text>
<rect x="18" y="363" width="250" height="100" rx="12"/><text x="143" y="403"><tspan x="143">링크마다 다른</tspan><tspan x="143" dy="30">MTU</tspan></text>
<rect x="296" y="363" width="250" height="100" rx="12"/><text x="421" y="403"><tspan x="421">IPv4 패킷의</tspan><tspan x="421" dy="30">단편화</tspan></text>
<rect x="574" y="363" width="250" height="100" rx="12"/><text x="699" y="403"><tspan x="699">목적지에서 IP</tspan><tspan x="699" dy="30">재조립</tspan></text>
<rect x="852" y="363" width="250" height="100" rx="12"/><text x="977" y="403"><tspan x="977">핵심 정리</tspan><tspan x="977" dy="30">R · A · L</tspan></text>
