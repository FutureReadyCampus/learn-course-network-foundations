<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 500" role="group" aria-labelledby="lesson-21-basic-export-title lesson-21-basic-export-desc" lang="ko"><title id="lesson-21-basic-export-title">TTL과 단편화 · 학습 흐름</title><desc id="lesson-21-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-21-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-time{font-size:18px;fill:#9aa3b2}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-21-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/><path d="M977.0 288 V312.0 H143.0 V332"/><path d="M268 392.0 H292"/></g><a href="../lesson-21.html#concept-basic-21-01" target="_top" aria-label="인터넷과 라우터의 관계 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">인터넷과 라우터의</tspan><tspan x="143.0" dy="25">관계</tspan></text><text class="flow-time" x="143.0" y="116" text-anchor="middle">01 · 0:01</text></a><a href="../lesson-21.html#concept-basic-21-02" target="_top" aria-label="Router · 패킷을 다음으로 전달 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">Router · 패킷을</tspan><tspan x="421.0" dy="25">다음으로 전달</tspan></text><text class="flow-time" x="421.0" y="116" text-anchor="middle">02 · 2:48</text></a><a href="../lesson-21.html#concept-basic-21-03" target="_top" aria-label="TTL · 패킷의 이동 횟수 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">TTL · 패킷의 이동</tspan><tspan x="699.0" dy="25">횟수</tspan></text><text class="flow-time" x="699.0" y="116" text-anchor="middle">03 · 3:35</text></a><a href="../lesson-21.html#concept-basic-21-04" target="_top" aria-label="TTL이 소진되면 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">TTL이 소진되면</tspan></text><text class="flow-time" x="977.0" y="116" text-anchor="middle">04 · 5:13</text></a><a href="../lesson-21.html#concept-basic-21-05" target="_top" aria-label="MTU와 단편화의 관계 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">MTU와 단편화의 관계</tspan></text><text class="flow-time" x="143.0" y="276" text-anchor="middle">05 · 6:26</text></a><a href="../lesson-21.html#concept-basic-21-06" target="_top" aria-label="더 작은 링크를 만났을 때 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">더 작은 링크를</tspan><tspan x="421.0" dy="25">만났을 때</tspan></text><text class="flow-time" x="421.0" y="276" text-anchor="middle">06 · 8:41</text></a><a href="../lesson-21.html#concept-basic-21-07" target="_top" aria-label="패킷을 나누어 보내기 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">패킷을 나누어 보내기</tspan></text><text class="flow-time" x="699.0" y="276" text-anchor="middle">07 · 10:05</text></a><a href="../lesson-21.html#concept-basic-21-08" target="_top" aria-label="수신 측에서 다시 조립하기 설명으로 이동"><rect x="852" y="176" width