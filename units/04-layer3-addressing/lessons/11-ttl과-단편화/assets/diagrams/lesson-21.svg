<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 630" role="img" aria-labelledby="lesson-21-flow-title lesson-21-flow-desc" lang="ko">
<title id="lesson-21-flow-title">TTL과 단편화 · 학습 흐름</title>
<desc id="lesson-21-flow-desc">라우터와 홉, TTL과 폐기 안내, 링크별 MTU, IPv4 단편화와 목적지 재조립, 핵심 정리 순서로 학습합니다.</desc>
