="143.0" dy="0">MTU와 단편화의 관계</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">더 작은 링크를</tspan><tspan x="421.0" dy="25">만났을 때</tspan></text><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">패킷을 나누어 보내기</tspan></text><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">수신 측에서 다시</tspan><tspan x="977.0" dy="25">조립하기</tspan></text><rect x="18" y="336" width="250" height="112" rx="10"/><text x="143.0" y="374" text-anchor="middle"><tspan x="143.0" dy="0">처음부터 작은</tspan><tspan x="143.0" dy="25">단위로 보내기</tspan></text><rect x="296" y="336" width="250" height="112" rx="10"/><text x="421.0" y="374" text-anchor="middle"><tspan x="421.0" dy="0">Hop으로 이동을 세기</tspan></text></svg>
