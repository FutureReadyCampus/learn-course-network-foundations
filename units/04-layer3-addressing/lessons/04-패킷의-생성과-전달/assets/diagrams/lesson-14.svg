<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-14-flow-title lesson-14-flow-desc" lang="ko">
  <title id="lesson-14-flow-title">패킷은 어떻게 목적지 프로그램까지 전달될까? · 학습 흐름</title>
  <desc id="lesson-14-flow-desc">8개 페이지에서 패킷에 담기는 정보, IP와 포트, 기본 게이트웨이, 프로그램과 인터페이스의 역할, IP 주소와 포트 읽기, 소켓, 계층별 헤더, 스위치와 라우터의 전달을 차례로 살펴봅니다.</desc>
  <defs>
    <marker id="lesson-14-flow-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .learning-flow{background:#0f1115}
    .learning-flow text{font:500 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}
    .learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}
  </style>
  <g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-14-flow-arrow)">
    <path d="M268 72 H292"/><path d="M546 72 H570"/><path d="M824 72 H848"/>
    <path d="M977 128 V152 H143 V172"/>
    <path d="M268 232 H292"/><path d="M546 232 H570"/><path d="M824 232 H848"/>
  </g>
  <rect x="18" y="16" width="250" height="112" rx="10"/>
  <text x="143" y="54" text-anchor="middle"><tspan x="143" dy="0">데이터와 전달 정보가</tspan><tspan x="143" dy="25">패킷에 담긴다</tspan></text>
  <rect x="296" y="16" width="250" height="112" rx="10"/>
  <text x="421" y="54" text-anchor="middle"><tspan x="421" dy="0">IP 주소와 포트로</tspan><tspan x="421" dy="25">호스트·프로그램 찾기</tspan></text>
  <rect x="574" y="16" width="250" height="112" rx="10"/>
  <text x="699" y="54" text-anchor="middle"><tspan x="699" dy="0">다른 네트워크로 나갈 때</tspan><tspan x="699" dy="25">기본 게이트웨이를 거친다</tspan></text>
  <rect x="852" y="16" width="250" height="112" rx="10"/>
  <text x="977" y="54" text-anchor="middle"><tspan x="977" dy="0">프로그램에서</tspan><tspan x="977" dy="25">네트워크 인터페이스까지</tspan></text>
  <rect x="18" y="176" width="250" height="112" rx="10"/>
  <text x="143" y="214" text-anchor="middle"><tspan x="143" dy="0">IP 주소와 포트 번호</tspan><tspan x="143" dy="25">함께 읽기</tspan></text>
  <rect x="296" y="176" width="250" height="112" rx="10"/>
  <text x="421" y="214" text-anchor="middle"><tspan x="421" dy="0">소켓은 프로그램과</tspan><tspan x="421" dy="25">운영체제를 잇는다</tspan></text>
  <rect x="574" y="176" width="250" height="112" rx="10"/>
  <text x="699" y="214" text-anchor="middle"><tspan x="699" dy="0">포트·IP·MAC 정보는</tspan><tspan x="699" dy="25">각 계층 헤더에 담긴다</tspan></text>
  <rect x="852" y="176" width="250" height="112" rx="10"/>
  <text x="977" y="214" text-anchor="middle"><tspan x="977" dy="0">스위치와 라우터를 거쳐</tspan><tspan x="977" dy="25">목적지에 도착한다</tspan></text>
</svg>
