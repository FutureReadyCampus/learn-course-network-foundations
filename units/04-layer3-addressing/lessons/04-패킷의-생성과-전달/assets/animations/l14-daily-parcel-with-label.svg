<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>책에 송장을 붙여 택배로 보낸다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">책에 송장을 붙여 택배로 보낸다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">내용물은 책, 겉의 송장이 어디로 갈지 알려 줘요</text>
<polygon points="60,374 100,340 140,374" fill="#9aa3b2"/><rect x="68" y="374" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="91" y="394" width="18" height="28" fill="#3d4b60"/><text x="100" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">철수</text><polygon points="440,370 480,346 520,370" fill="#6ea8fe"/><rect x="444" y="370" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="460" y="386" width="40" height="22" fill="#3d4b60"/><text x="480" y="430" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><polygon points="820,374 860,340 900,374" fill="#9aa3b2"/><rect x="828" y="374" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="851" y="394" width="18" height="28" fill="#3d4b60"/><text x="860" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">영희</text><line x1="170" y1="395" x2="440" y2="395" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="395" x2="790" y2="395" stroke="#3d4b60" stroke-width="3"/><g><rect x="500" y="180" width="260" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="630" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="200" y="180" width="150" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="275" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">보내는 곳</text><text x="275" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">철수 집</text><rect x="350" y="180" width="150" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="425" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">받는 곳</text><text x="425" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">영희 집</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="403" y="144" width="153" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">상자(겉)에 송장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="346" y="176" width="158" height="78" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><line x1="480" y1="345" x2="480" y2="300" stroke="#ffb454" stroke-width="3" stroke-dasharray="4 4"/><ellipse cx="480" cy="280" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="280" r="7" fill="#ffb454"/><text x="500" y="318" text-anchor="start" font-size="18" font-weight="700" fill="#ffb454">최종 주소만 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="100,395;100,395;480,395;480,395" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="480,395;480,395;860,395;860,395" keyTimes="0.000;0.775;0.925;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.950;0.965;1" dur="15s" repeatCount="indefinite"/><circle cx="860" cy="320" r="16" fill="#7ee7c7"/><path d="M852 320 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">철수가 영희에게 보낼 책이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">겉에 보내는 곳과 받는 곳을 적은 송장을 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">물류센터는 받는 곳 주소를 보고 방향을 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책은 그대로 영희에게 도착해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>