<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>패킷은 페이로드와 헤더로 이뤄진다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">패킷은 페이로드와 헤더로 이뤄진다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">라우터는 헤더의 목적지 IP를 보고 방향을 정해요</text>
<rect x="66" y="346" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="353" width="52" height="30" fill="#3d4b60"/><polygon points="56,392 144,392 152,404 48,404" fill="#6ea8fe"/><text x="100" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="480" cy="380" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 374 h28 l-7 -7 M495 386 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="430" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><rect x="826" y="344" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="351" width="52" height="32" fill="#3d4b60"/><rect x="855" y="390" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="400" width="44" height="5" fill="#6ea8fe"/><text x="860" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="170" y1="395" x2="440" y2="395" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="395" x2="790" y2="395" stroke="#3d4b60" stroke-width="3"/><g><rect x="500" y="180" width="260" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="630" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">페이로드 (보낼 데이터)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="180" width="150" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="275" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">출발지 IP</text><text x="275" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">192.168.0.10</text><rect x="350" y="180" width="150" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="425" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">목적지 IP</text><text x="425" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">203.0.113.20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="449" y="144" width="61" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">헤더</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="176" width="158" height="78" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><line x1="480" y1="345" x2="480" y2="300" stroke="#ffb454" stroke-width="3" stroke-dasharray="4 4"/><ellipse cx="480" cy="280" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="280" r="7" fill="#ffb454"/><text x="500" y="318" text-anchor="start" font-size="18" font-weight="700" fill="#ffb454">목적지 IP를 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="100,395;100,395;480,395;480,395" keyTimes="0.000;0.525;0.675;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="480,395;480,395;860,395;860,395" keyTimes="0.000;0.775;0.925;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.950;0.965;1" dur="16s" repeatCount="indefinite"/><circle cx="860" cy="320" r="16" fill="#7ee7c7"/><path d="M852 320 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낼 데이터가 페이로드예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출발지·목적지 IP가 든 헤더를 붙이면 IP 패킷이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터는 목적지 IP를 보고 다음 방향을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">페이로드는 그대로 서버에 도착해요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text></g>
</svg>
