<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="46" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">프레임이 도착하기까지</text>
<text x="480" y="90" font-size="24" fill="#9aa3b2" text-anchor="middle">프로세스 → 스위치 → 라우터 → 인터넷 → <tspan fill="#7ee7c7" font-weight="700">프로세스</tspan></text>

<!-- road -->
<line x1="185" y1="305" x2="780" y2="305" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/>

<!-- left host -->
<rect x="20" y="130" width="160" height="260" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="100" y="162" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">보내는 쪽</text>
<rect x="35" y="175" width="130" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/>
<text x="100" y="208" font-size="24" fill="#e6e8ec" text-anchor="middle">프로세스</text>
<rect x="172" y="278" width="16" height="54" rx="3" fill="#7ee7c7"/>
<text x="100" y="372" font-size="24" fill="#9aa3b2" text-anchor="middle">현관(NIC)</text>

<!-- right host -->
<rect x="780" y="130" width="160" height="260" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="860" y="162" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">받는 쪽</text>
<rect x="795" y="175" width="130" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/>
<rect x="795" y="175" width="130" height="50" rx="8" fill="#7ee7c7" fill-opacity="0.25" stroke="#7ee7c7" stroke-width="4" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.87;0.95;0.98;1" dur="16s" repeatCount="indefinite"/>
</rect>
<text x="860" y="208" font-size="24" fill="#e6e8ec" text-anchor="middle">프로세스</text>
<rect x="772" y="278" width="16" height="54" rx="3" fill="#7ee7c7"/>
<text x="860" y="372" font-size="24" fill="#9aa3b2" text-anchor="middle">현관(NIC)</text>

<!-- device names -->
<g font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">
<text x="300" y="262">L2 스위치</text>
<text x="455" y="262">라우터</text>
<text x="630" y="250">인터넷</text>
</g>

<!-- switch icon -->
<rect x="255" y="288" width="90" height="34" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<g fill="#6ea8fe"><rect x="266" y="300" width="10" height="10"/><rect x="284" y="300" width="10" height="10"/><rect x="304" y="300" width="10" height="10"/><rect x="322" y="300" width="10" height="10"/></g>

<!-- router icon -->
<circle cx="455" cy="305" r="24" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<g stroke="#6ea8fe" stroke-width="3" fill="none"><path d="M441 298 h28 l-6 -6 M469 312 h-28 l6 6"/></g>

<!-- cloud -->
<g stroke="#3d4b60" stroke-width="6" fill="#3d4b60">
<circle cx="595" cy="315" r="26"/><circle cx="625" cy="295" r="30"/><circle cx="662" cy="308" r="28"/><circle cx="630" cy="322" r="24"/>
</g>
<g fill="#171a21">
<circle cx="595" cy="315" r="26"/><circle cx="625" cy="295" r="30"/><circle cx="662" cy="308" r="28"/><circle cx="630" cy="322" r="24"/>
</g>

<!-- analogy callouts -->
<g font-size="24" font-weight="700" text-anchor="middle">
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.32;0.34;1" dur="16s" repeatCount="indefinite"/>
<rect x="220" y="185" width="160" height="42" rx="21" fill="#0f1115" stroke="#ffb454" stroke-width="2"/>
<text x="300" y="214" fill="#ffb454">동네 집하장</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.37;0.50;0.52;1" dur="16s" repeatCount="indefinite"/>
<rect x="360" y="185" width="190" height="42" rx="21" fill="#0f1115" stroke="#ffb454" stroke-width="2"/>
<text x="455" y="214" fill="#ffb454">길 찾는 기사님</text>
</g>
</g>

<!-- moving parcel: outer frame wraps inner data -->
<g>
<animateTransform attributeName="transform" type="translate" values="100,255;100,255;195,305;300,305;300,305;455,305;455,305;860,305;860,305;100,255;100,255" keyTimes="0;0.05;0.15;0.26;0.30;0.38;0.44;0.66;0.95;0.955;1" dur="16s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-70;0,-70;0,0;0,0" keyTimes="0;0.76;0.84;0.95;0.955;1" dur="16s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.84;0.88;0.96;1" dur="16s" repeatCount="indefinite"/>
<rect x="-40" y="-19" width="80" height="38" rx="6" fill="#7ee7c7"/>
<text x="0" y="8" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">데이터</text>
</g>
<g>
<animateTransform attributeName="transform" type="scale" values="1;1;1.4;1.4;1;1" keyTimes="0;0.68;0.76;0.95;0.955;1" dur="16s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.68;0.76;0.96;1" dur="16s" repeatCount="indefinite"/>
<rect x="-48" y="-24" width="96" height="48" rx="6" fill="#ffb454" stroke="#0f1115" stroke-width="2"/>
<text x="0" y="9" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">프레임
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.68;0.69;0.96;1" dur="16s" repeatCount="indefinite"/>
</text>
</g>
</g>

<!-- conclusion banner -->
<text x="480" y="428" font-size="30" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">전체 흐름으로 이해하기
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.85;0.88;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
</text>

<!-- caption bar -->
<rect x="40" y="450" width="880" height="70" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="494">① 프로세스의 프레임이 현관(NIC)으로 나가요
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.25;0.97;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="480" y="494" opacity="0">② 스위치(집하장)와 라우터(기사님)를 거쳐요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.49;0.51;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="480" y="494" opacity="0">③ 인터넷을 건너 도착하면 바깥 포장을 벗겨요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.81;0.83;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="480" y="494" opacity="0">④ 데이터가 받는 쪽 프로세스에 전달돼요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
</text>
</g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.5;0.51;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.82;0.83;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.83;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text></g>
</svg>
