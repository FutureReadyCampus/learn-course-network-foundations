<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>접수 창구가 손님과 작업장을 잇는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">접수 창구가 손님과 작업장을 잇는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">창구마다 맡은 손님이 정해져 있어요</text>
<rect x="60" y="200" width="160" height="50" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="140" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">손님 가</text><line x1="220" y1="225" x2="290" y2="225" stroke="#3d4b60" stroke-width="3"/><rect x="290" y="194" width="70" height="62" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="325" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">창구 1</text><line x1="360" y1="225" x2="420" y2="225" stroke="#3d4b60" stroke-width="3"/><rect x="60" y="300" width="160" height="50" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="140" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">손님 나</text><line x1="220" y1="325" x2="290" y2="325" stroke="#3d4b60" stroke-width="3"/><rect x="290" y="294" width="70" height="62" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="325" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">창구 2</text><line x1="360" y1="325" x2="420" y2="325" stroke="#3d4b60" stroke-width="3"/><rect x="420" y="170" width="240" height="200" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="540" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">우체국 안쪽 작업장</text><rect x="450" y="235" width="180" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="540" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">분류·포장</text><line x1="660" y1="270" x2="740" y2="270" stroke="#3d4b60" stroke-width="3"/><rect x="740" y="235" width="150" height="70" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="815" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">트럭 출구</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><path d="M140,200 V150 H815 V235" fill="none" stroke="#ff7b72" stroke-width="4" stroke-dasharray="8 6"/><circle cx="480" cy="150" r="16" fill="#ff7b72"/><path d="M473 143 l14 14 M487 143 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">직접 다루지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,225;140,225;325,225;325,225" keyTimes="0.000;0.275;0.425;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="325,225;325,225;540,260;815,290;815,290" keyTimes="0.000;0.525;0.613;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="815,290;815,290;540,262;325,225;325,225" keyTimes="0.000;0.775;0.863;0.950;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><rect x="286" y="190" width="78" height="70" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><circle cx="325" cy="170" r="16" fill="#7ee7c7"/><path d="M317 170 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님은 트럭을 직접 다루지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님이 자기 창구에 짐을 맡겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작업장이 분류·포장해서 트럭으로 내보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">답이 오면 맞는 창구로 돌려줘요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
