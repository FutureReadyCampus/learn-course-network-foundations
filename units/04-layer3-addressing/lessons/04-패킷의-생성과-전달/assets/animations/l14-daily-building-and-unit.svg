<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>건물 주소로 찾고 호수로 받을 사람 고르기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">건물 주소로 찾고 호수로 받을 사람 고르기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소는 건물까지, 호수는 건물 안의 수신자까지</text>
<polygon points="60,264 100,230 140,264" fill="#9aa3b2"/><rect x="68" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="91" y="284" width="18" height="28" fill="#3d4b60"/><text x="100" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">철수</text><rect x="640" y="150" width="280" height="230" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="780" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">영희네 아파트</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="636" y="146" width="288" height="238" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="670" y="200" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">101호 철수</text><rect x="670" y="262" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">102호 지영</text><rect x="670" y="324" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">103호 영희</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,280;190,280;560,280;560,280" keyTimes="0.000;0.025;0.188;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-46" y="-52" width="91" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">건물 주소</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(560,280)"><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-46" y="-52" width="91" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">건물 주소</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><g transform="translate(560,280)"><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="-35" y="-52" width="70" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">103호</text></g><line x1="590" y1="280" x2="668" y2="347" stroke="#7ee7c7" stroke-width="4"/><rect x="666" y="320" width="228" height="54" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="780" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">호수는 건물 안의 받을 사람 표식이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">건물 주소를 보고 영희네 아파트에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">건물 안에는 여러 가구가 살고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호수를 보고 받을 사람을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호수는 건물 안의 수신자 표식이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>