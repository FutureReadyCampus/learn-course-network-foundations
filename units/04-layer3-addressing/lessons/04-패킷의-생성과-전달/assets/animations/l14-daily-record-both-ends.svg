<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>접수 기록을 양쪽 끝으로 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">접수 기록을 양쪽 끝으로 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소 뒤의 번호가 각 끝에서 누구를 가리키는지 봐요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="80" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="270" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">내 쪽</text><text x="270" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">철수 집 : <tspan fill="#ffb454">번호표 7</tspan></text><rect x="500" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="690" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">받는 쪽</text><text x="690" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">영희 집 : <tspan fill="#7ee7c7">101호</tspan></text><text x="480" y="266" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">→</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="80" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="270" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">내 쪽</text><text x="270" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">철수 집 : <tspan fill="#ffb454">번호표 8</tspan></text><rect x="500" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="690" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">받는 쪽</text><text x="690" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">영희 집 : <tspan fill="#7ee7c7">101호</tspan></text><text x="480" y="266" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">→</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">접수 기록의 한 줄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="76" y="206" width="388" height="98" rx="14" fill="none" stroke="#ffb454" stroke-width="5"/><text x="270" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">내 쪽: 주소 + 임시 번호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="496" y="206" width="388" height="98" rx="14" fill="none" stroke="#7ee7c7" stroke-width="5"/><text x="690" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">받는 쪽: 주소 + 101호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="187" y="144" width="165" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="270" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">새 연결 → 새 번호</text><text x="690" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">받는 쪽은 그대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록 한 줄에 양쪽 끝이 함께 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 쪽은 집 주소와 그때그때 받는 번호표예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받는 쪽은 집 주소와 정해진 호수예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 접수 때는 번호표만 바뀌어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>