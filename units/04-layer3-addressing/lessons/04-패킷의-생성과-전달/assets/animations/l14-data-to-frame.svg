<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>데이터에서 프레임까지 차례로 만든다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">데이터에서 프레임까지 차례로 만든다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TCP를 쓰는 예: 보낼 때는 안쪽부터 감싸요</text>
<g><rect x="570" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="640.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">요청 데이터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="430" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="500.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">포트</text><rect x="430" y="290" width="280" height="36" rx="18" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="570.0" y="315" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">세그먼트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="360.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">IP 주소</text><rect x="290" y="338" width="420" height="36" rx="18" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="500.0" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">IP 패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="220.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">MAC 주소</text><rect x="710" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="780.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">FCS</text><rect x="150" y="386" width="700" height="36" rx="18" fill="#171a21" stroke="#c792ea" stroke-width="2"/><text x="500.0" y="411" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">프레임</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="381" y="143" width="198" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">소켓에서 받은 데이터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="391" y="143" width="218" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="500" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L4: 포트 정보를 더해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="258" y="143" width="204" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="360" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L3: IP 주소를 더해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="143" width="270" height="34" rx="17" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">L2: MAC 주소와 FCS를 더해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 소켓에 넘긴 데이터예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP 헤더(포트)를 더하면 세그먼트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 헤더(IP 주소)를 더하면 IP 패킷이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프레임 헤더와 FCS를 더하면 프레임이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>