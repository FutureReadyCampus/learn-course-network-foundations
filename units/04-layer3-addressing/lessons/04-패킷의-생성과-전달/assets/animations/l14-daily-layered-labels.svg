<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>책에 겹겹이 정보를 붙여 간다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">책에 겹겹이 정보를 붙여 간다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">겉으로 나올수록 더 큰 상자가 돼요</text>
<g><rect x="570" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="640.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="430" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="500.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">호수</text><rect x="430" y="290" width="280" height="36" rx="18" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="570.0" y="315" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">작은 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="290" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="360.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">건물 주소</text><rect x="290" y="338" width="420" height="36" rx="18" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="500.0" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">중간 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="150" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="220.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">구간 라벨</text><rect x="710" y="190" width="140" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="780.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">봉인 테이프</text><rect x="150" y="386" width="700" height="36" rx="18" fill="#171a21" stroke="#c792ea" stroke-width="2"/><text x="500.0" y="411" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">큰 상자</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="437" y="143" width="86" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">보낼 책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="430" y="143" width="139" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="500" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">호수를 적어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="270" y="143" width="180" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="360" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">건물 주소를 붙여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="361" y="143" width="238" height="34" rx="17" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">구간 라벨과 봉인을 더해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에 넣을 책이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 상자에 받을 사람(호수)을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 상자에 건물 주소를 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자에 구간 라벨과 봉인을 붙여요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
