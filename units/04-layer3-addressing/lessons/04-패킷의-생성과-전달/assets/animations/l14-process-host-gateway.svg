<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프로세스에서 기본 게이트웨이까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프로세스에서 기본 게이트웨이까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">데이터를 만드는 쪽부터 네트워크 밖으로 나가는 출구까지</text>
<rect x="50" y="170" width="240" height="180" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="170" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">내 PC (호스트)</text><rect x="90" y="220" width="160" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="252" text-anchor="middle" font-size="21" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="282" y="245" width="16" height="50" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><line x1="298" y1="270" x2="480" y2="270" stroke="#3d4b60" stroke-width="3"/><circle cx="520" cy="265" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M505 259 h28 l-7 -7 M535 271 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="520" y="315" text-anchor="middle" font-size="17" fill="#9aa3b2">기본 게이트웨이</text><line x1="560" y1="270" x2="700" y2="270" stroke="#3d4b60" stroke-width="3"/><rect x="700" y="170" width="220" height="180" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="810" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">다른 네트워크</text><rect x="740" y="240" width="140" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="810" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">영희 서버</text><rect x="330" y="400" width="200" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="430" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">같은 네트워크 장비</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="166" width="248" height="188" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="92" y="134" width="157" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="170" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">프로세스 + 호스트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="237" width="28" height="66" rx="5" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="313" y="216" width="174" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="400" y="237.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">네트워크 인터페이스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="446" y="218" width="148" height="118" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="449" y="186" width="143" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="207.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">기본 게이트웨이</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="298" y1="290" x2="400" y2="398" stroke="#7ee7c7" stroke-width="4" stroke-dasharray="6 4"/><text x="300" y="372" text-anchor="end" font-size="17" font-weight="700" fill="#7ee7c7">같은 곳은 직접</text><line x1="298" y1="262" x2="700" y2="262" stroke="#6ea8fe" stroke-width="4"/><text x="490" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">다른 곳은 게이트웨이를 거쳐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로세스가 데이터를 만들고 받는 호스트 안에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호스트는 인터페이스로 네트워크에 연결돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 네트워크로 갈 때 첫 라우터가 기본 게이트웨이예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 네트워크는 직접, 다른 곳은 게이트웨이를 거쳐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>