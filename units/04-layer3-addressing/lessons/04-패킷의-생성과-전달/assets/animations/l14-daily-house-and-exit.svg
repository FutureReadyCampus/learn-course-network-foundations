<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>집 안의 철수에서 동네 밖으로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">집 안의 철수에서 동네 밖으로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프로세스·호스트·인터페이스·기본 게이트웨이의 역할</text>
<rect x="50" y="170" width="240" height="180" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="170" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">철수네 집 (호스트)</text><rect x="90" y="220" width="160" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="252" text-anchor="middle" font-size="21" font-weight="700" fill="#e6e8ec">철수</text><rect x="282" y="245" width="16" height="50" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><line x1="298" y1="270" x2="480" y2="270" stroke="#3d4b60" stroke-width="3"/><rect x="486" y="253" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="480" y="245" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="498" y="263" width="44" height="18" fill="#3d4b60"/><text x="520" y="315" text-anchor="middle" font-size="17" fill="#9aa3b2">접수창구</text><line x1="560" y1="270" x2="700" y2="270" stroke="#3d4b60" stroke-width="3"/><rect x="700" y="170" width="220" height="180" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="810" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">다른 동네</text><rect x="740" y="240" width="140" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="810" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">영희 집</text><rect x="330" y="400" width="200" height="46" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="430" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">같은 동네 이웃</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="46" y="166" width="248" height="188" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="92" y="134" width="157" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="170" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">프로세스 + 호스트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="276" y="237" width="28" height="66" rx="5" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="314" y="216" width="173" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="400" y="237.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">현관문 = 인터페이스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="446" y="218" width="148" height="118" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="454" y="186" width="132" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="207.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">처음 맡기는 곳</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="298" y1="290" x2="400" y2="398" stroke="#7ee7c7" stroke-width="4" stroke-dasharray="6 4"/><text x="300" y="372" text-anchor="end" font-size="17" font-weight="700" fill="#7ee7c7">같은 곳은 직접</text><line x1="298" y1="262" x2="700" y2="262" stroke="#6ea8fe" stroke-width="4"/><text x="490" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">다른 곳은 출구를 거쳐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">철수는 데이터를 만드는 프로세스예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집과 바깥길이 이어지는 곳이 인터페이스예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 동네로 갈 때 처음 맡기는 곳이 게이트웨이예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 동네는 직접, 다른 동네는 출구를 거쳐요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
