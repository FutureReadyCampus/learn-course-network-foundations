<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP 주소로 호스트, 포트로 프로그램</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP 주소로 호스트, 포트로 프로그램</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 호스트 안의 여러 프로그램 중 받을 쪽을 골라요</text>
<rect x="66" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="56,282 144,282 152,294 48,294" fill="#6ea8fe"/><text x="100" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="640" y="150" width="280" height="230" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="780" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">서버 203.0.113.20</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="636" y="146" width="288" height="238" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="670" y="200" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">웹 서버 :443</text><rect x="670" y="262" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">메신저 :50456</text><rect x="670" y="324" width="220" height="46" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">게임 :50999</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><g><animateTransform attributeName="transform" type="translate" values="190,280;190,280;560,280;560,280" keyTimes="0.000;0.025;0.188;1.000" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-72" y="-52" width="145" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">IP 203.0.113.20</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><g transform="translate(560,280)"><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-72" y="-52" width="145" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">IP 203.0.113.20</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite" begin="2s"/><g transform="translate(560,280)"><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="-44" y="-52" width="89" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="-30.6" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">포트 443</text></g><line x1="590" y1="280" x2="668" y2="223" stroke="#7ee7c7" stroke-width="4"/><rect x="666" y="196" width="228" height="54" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="780" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">숫자 표식일 뿐, 물리 구멍은 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 주소를 보고 서버(호스트)에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 호스트에서 여러 프로그램이 실행 중이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전송 계층 헤더의 포트로 받을 프로그램을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트는 헤더에 적힌 숫자예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="289.39" text-anchor="middle" font-size="55.4003" font-weight="750" letter-spacing="-1" fill="#e6e8ec">IP 주소로 호스트, 포트로 프로그램</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>