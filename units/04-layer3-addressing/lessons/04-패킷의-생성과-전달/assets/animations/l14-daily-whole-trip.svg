<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>접수소와 물류센터를 거쳐 영희에게</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">접수소와 물류센터를 거쳐 영희에게</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">각 곳에서 맡은 정보만 확인해요</text>
<line x1="90" y1="345" x2="640" y2="345" stroke="#3d4b60" stroke-width="3"/><polygon points="50,229 90,195 130,229" fill="#9aa3b2"/><rect x="58" y="229" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="81" y="249" width="18" height="28" fill="#3d4b60"/><text x="90" y="301" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">철수</text><rect x="236" y="228" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="230" y="220" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="248" y="238" width="44" height="18" fill="#3d4b60"/><text x="270" y="290" text-anchor="middle" font-size="17" fill="#9aa3b2">동네 접수소</text><polygon points="410,240 450,216 490,240" fill="#6ea8fe"/><rect x="414" y="240" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="430" y="256" width="40" height="22" fill="#3d4b60"/><text x="450" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><rect x="640" y="150" width="280" height="230" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="780" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">영희네 아파트</text><rect x="670" y="215" width="220" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">103호 영희</text><rect x="670" y="285" width="220" height="46" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="315" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">창구(소켓)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="90,345;90,345;270,345;270,345" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><ellipse cx="270" cy="180" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="270" cy="180" r="7" fill="#ffb454"/><line x1="270" y1="198" x2="270" y2="212" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 4"/><text x="270" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">이번 구간 인수자를 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="270,345;270,345;450,345;450,345" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><ellipse cx="450" cy="180" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="450" cy="180" r="7" fill="#ffb454"/><line x1="450" y1="198" x2="450" y2="212" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="4 4"/><text x="450" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">받는 건물 주소를 봐요</text><text x="360" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">주소는 그대로, 구간 정보만 새로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="450,345;450,345;620,345;620,345" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><rect x="636" y="146" width="288" height="238" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/><text x="780" y="410" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">주소로 호스트를 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="666" y="211" width="228" height="58" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="780" y1="285" x2="780" y2="265" stroke="#7ee7c7" stroke-width="3"/><circle cx="910" cy="240" r="16" fill="#7ee7c7"/><path d="M902 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="780" y="410" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">포트·소켓으로 프로그램에 전달</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동네 접수소가 이번 구간 인수자를 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">물류센터가 건물 주소를 보고 다음 곳을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">건물 주소로 영희네 아파트를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호수에 맞는 창구로 영희에게 전달돼요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
