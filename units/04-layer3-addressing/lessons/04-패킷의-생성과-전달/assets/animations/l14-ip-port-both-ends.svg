<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP 주소:포트 번호를 양쪽 끝으로 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP 주소:포트 번호를 양쪽 끝으로 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">숫자는 설명용 예시예요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="270" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">내 컴퓨터</text><text x="270" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">192.0.2.15 : <tspan fill="#ffb454">51707</tspan></text><rect x="500" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="690" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">원격 호스트</text><text x="690" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">203.0.113.20 : <tspan fill="#7ee7c7">443</tspan></text><text x="480" y="266" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">→</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="270" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">내 컴퓨터</text><text x="270" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">192.0.2.15 : <tspan fill="#ffb454">51722</tspan></text><rect x="500" y="210" width="380" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="690" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">원격 호스트</text><text x="690" y="280" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">203.0.113.20 : <tspan fill="#7ee7c7">443</tspan></text><text x="480" y="266" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">→</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">연결 목록의 한 줄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="76" y="206" width="388" height="98" rx="14" fill="none" stroke="#ffb454" stroke-width="5"/><text x="270" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">내 쪽: 주소 + 임시 포트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="496" y="206" width="388" height="98" rx="14" fill="none" stroke="#7ee7c7" stroke-width="5"/><text x="690" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">서버 쪽: 주소 + 443 (보통 HTTPS)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="168" y="144" width="203" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="270" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">새 연결 → 새 임시 포트</text><text x="690" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">서버 포트는 보통 그대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결 한 줄에 양쪽 끝이 함께 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 쪽은 내 주소와 임시 포트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 쪽은 서버 주소와 보통 443(HTTPS)이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 연결에서는 임시 포트만 바뀔 수 있어요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text></g>
</svg>
