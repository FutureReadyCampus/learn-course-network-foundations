<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>스위치와 라우터를 거쳐 웹 서버까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">스위치와 라우터를 거쳐 웹 서버까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">NAT가 없는 일반적인 예예요</text>
<line x1="90" y1="345" x2="640" y2="345" stroke="#3d4b60" stroke-width="3"/><rect x="56" y="206" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="213" width="52" height="30" fill="#3d4b60"/><polygon points="46,252 134,252 142,264 38,264" fill="#6ea8fe"/><text x="90" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="218" y="234" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="230" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="247" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="264" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="281" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="298" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="270" y="290" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="450" cy="250" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M435 244 h28 l-7 -7 M465 256 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="450" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><rect x="640" y="150" width="280" height="230" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="780" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버 (목적지 호스트)</text><rect x="670" y="215" width="220" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">웹 서버 프로세스</text><rect x="670" y="285" width="220" height="46" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="315" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">수신 소켓</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><g><animateTransform attributeName="transform" type="translate" values="90,345;90,345;270,345;270,345" keyTimes="0.000;0.025;0.200;1.000" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><ellipse cx="270" cy="180" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="270" cy="180" r="7" fill="#ffb454"/><line x1="270" y1="198" x2="270" y2="212" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="4 4"/><text x="270" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">목적지 MAC을 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><g><animateTransform attributeName="transform" type="translate" values="270,345;270,345;450,345;450,345" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><ellipse cx="450" cy="180" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="450" cy="180" r="7" fill="#ffb454"/><line x1="450" y1="198" x2="450" y2="212" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="4 4"/><text x="450" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">목적지 IP를 봐요</text><text x="360" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">IP는 그대로, 프레임은 새로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><g><animateTransform attributeName="transform" type="translate" values="450,345;450,345;620,345;620,345" keyTimes="0.000;0.525;0.675;1.000" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><rect x="636" y="146" width="288" height="238" rx="16" fill="none" stroke="#ffb454" stroke-width="5"/><text x="780" y="410" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">주소로 호스트를 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="666" y="211" width="228" height="58" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="780" y1="285" x2="780" y2="265" stroke="#7ee7c7" stroke-width="3"/><circle cx="910" cy="240" r="16" fill="#7ee7c7"/><path d="M902 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="780" y="410" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">포트·소켓으로 프로그램에 전달</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치가 목적지 MAC을 보고 LAN 안에서 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터가 목적지 IP를 보고 다음 홉을 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 주소로 목적지 호스트를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트와 소켓 정보로 웹 서버 프로세스에 전달돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="289.195" text-anchor="middle" font-size="54.8428" font-weight="750" letter-spacing="-1" fill="#e6e8ec">스위치와 라우터를 거쳐 웹 서버까지</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>