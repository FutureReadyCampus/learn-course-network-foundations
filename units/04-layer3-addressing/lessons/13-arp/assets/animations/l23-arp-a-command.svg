<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>arp -a로 ARP 캐시 확인하기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">arp -a로 ARP 캐시 확인하기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">표시되는 모양은 운영체제마다 달라요 (예시)</text>
<rect x="40" y="165" width="250" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">arp -a (Windows · macOS)</text><rect x="40" y="231" width="250" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">ip neigh (Linux)</text><rect x="320" y="150" width="600" height="250" rx="10" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="340" y="178" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">출력 예시</text><text x="360" y="212" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">IP 주소</text><text x="640" y="212" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">MAC 주소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="360" y="250" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">192.168.0.1</text><text x="640" y="250" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">aa:bb:cc:00:11:22</text><text x="360" y="294" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">192.168.0.30</text><text x="640" y="294" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">aa:bb:cc:44:55:66</text><text x="360" y="338" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">192.168.0.5</text><text x="640" y="338" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">aa:bb:cc:77:88:99</text><rect x="40" y="165" width="250" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="165" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">arp -a (Windows · macOS)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="190" width="560" height="34" rx="6" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="355" y="414" width="249" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP와 MAC이 한 쌍으로 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="226" width="560" height="38" rx="6" fill="none" stroke="#7ee7c7" stroke-width="4"/><rect x="350" y="414" width="260" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">게이트웨이 주소가 있는지 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="620" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">(아직 항목이 없어요)</text><rect x="471" y="314" width="298" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="620" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">게이트웨이에 통신을 한 번 시도해요</text><text x="620" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">→ 다시 확인하면 새 기록이 생겨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">운영체제에 맞는 명령을 실행해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP와 MAC이 한 쌍으로 표시돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게이트웨이 주소가 있는지 찾아봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">항목이 없으면 통신을 시도한 뒤 다시 봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>