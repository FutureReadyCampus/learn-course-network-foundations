<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>외부 사이트는 게이트웨이 MAC이 필요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">외부 사이트는 게이트웨이 MAC이 필요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">목적지 IP는 3.3.3.3 (설명용 예시)</text>
<line x1="150" y1="345" x2="300" y2="345" stroke="#3d4b60" stroke-width="3"/><line x1="380" y1="345" x2="510" y2="345" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="345" x2="810" y2="345" stroke="#3d4b60" stroke-width="3"/><rect x="56" y="296" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="303" width="52" height="30" fill="#3d4b60"/><polygon points="46,342 134,342 142,354 38,354" fill="#6ea8fe"/><text x="90" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="340" cy="330" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M325 324 h28 l-7 -7 M355 336 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="340" y="380" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><ellipse cx="600" cy="330" rx="90" ry="45" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">여러 구간</text><rect x="826" y="294" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="301" width="52" height="32" fill="#3d4b60"/><rect x="855" y="340" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="350" width="44" height="5" fill="#6ea8fe"/><text x="860" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">네이버 3.3.3.3(예시)</text><g><rect x="774" y="218" width="173" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="860" y="241.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">목적지 IP 3.3.3.3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="150" y1="290" x2="284" y2="290" stroke="#ffb454" stroke-width="6"/><polygon points="300,290 276,278 276,302" fill="#ffb454"/><text x="225" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">먼저 게이트웨이로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="90" y1="410" x2="340" y2="410" stroke="#c792ea" stroke-width="4"/><line x1="90" y1="410" x2="90" y2="398" stroke="#c792ea" stroke-width="4"/><line x1="340" y1="410" x2="340" y2="398" stroke="#c792ea" stroke-width="4"/><rect x="86" y="420" width="257" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="215.0" y="442.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">필요한 MAC은 게이트웨이의 것</text><circle cx="860" cy="418" r="16" fill="#ff7b72"/><path d="M853 411 l14 14 M867 411 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="860" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">서버의 MAC이 아니에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="390" y1="290" x2="524" y2="290" stroke="#9aa3b2" stroke-width="4"/><polygon points="540,290 516,280 516,300" fill="#9aa3b2"/><text x="465" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">그다음은 라우팅</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적지 IP는 인터넷 너머 서버예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC는 먼저 게이트웨이로 프레임을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필요한 MAC은 서버가 아니라 게이트웨이의 것</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그다음 경로는 게이트웨이가 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>