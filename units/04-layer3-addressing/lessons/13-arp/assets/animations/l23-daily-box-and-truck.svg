<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상자 주소와 트럭 인수자는 달라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상자 주소와 트럭 인수자는 달라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상자는 끝까지, 인수자는 구간마다 바뀌어요</text>
<g><rect x="290" y="190" width="150" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="365.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">보내는 곳 서울</text><rect x="440" y="190" width="130" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="505.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">받는 곳 부산</text><rect x="570" y="190" width="100" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="620.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">물건</text><rect x="411" y="144" width="138" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">송장 붙은 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="100" y="290" width="95" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="147.5" y="323.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">받는 인수자</text><rect x="195" y="290" width="95" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="242.5" y="323.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">보낸 쪽</text><rect x="290" y="290" width="380" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="324" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">송장 붙은 상자</text><rect x="670" y="290" width="90" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="715.0" y="323.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">봉인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="380" text-anchor="middle" font-size="1" fill="#e6e8ec"></text><rect x="100" y="380" width="330" height="66" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="265" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP 목적지</text><text x="265" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">최종 도착지는 어디?</text><rect x="530" y="380" width="330" height="66" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="2"/><text x="695" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">MAC 목적지</text><text x="695" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">이번 구간에서 누구에게 맡길까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="300" y1="408" x2="624" y2="408" stroke="#ffb454" stroke-width="6"/><polygon points="640,408 616,396 616,420" fill="#ffb454"/><text x="470" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">먼저 접수창구로, 그다음 도착지를 보고 이어서 보내요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에는 보내는 곳과 받는 곳이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이번 구간 인수자와 봉인이 겉에 붙어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">최종 도착지와 이번 구간 인수자는 다른 질문이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 접수창구에 맡기면 이어서 보내 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>