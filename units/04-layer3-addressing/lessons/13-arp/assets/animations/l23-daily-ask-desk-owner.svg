<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>책상 번호는 아는데 이름을 몰라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">책상 번호는 아는데 이름을 몰라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 사무실에 물어보면 알 수 있어요</text>
<circle cx="110" cy="292" r="16" fill="#6ea8fe"/><rect x="92" y="312" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><polygon points="400,294 440,260 480,294" fill="#9aa3b2"/><rect x="408" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="431" y="314" width="18" height="28" fill="#3d4b60"/><text x="440" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">21번 책상</text><rect x="410" y="200" width="61" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="440" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">21번</text><polygon points="600,294 640,260 680,294" fill="#9aa3b2"/><rect x="608" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="631" y="314" width="18" height="28" fill="#3d4b60"/><text x="640" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">30번 책상</text><rect x="610" y="200" width="61" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="640" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">30번</text><polygon points="800,294 840,260 880,294" fill="#9aa3b2"/><rect x="808" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="831" y="314" width="18" height="28" fill="#3d4b60"/><text x="840" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">5번 책상</text><rect x="814" y="200" width="52" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="840" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">5번</text><line x1="160" y1="330" x2="400" y2="330" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="588" y="198" width="103" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="640" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">30번 책상</text><rect x="98" y="228" width="103" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="150" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">담당자: ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="354" y="143" width="253" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">30번 책상 담당자 누구세요?</text><line x1="170" y1="360" x2="384" y2="360" stroke="#6ea8fe" stroke-width="5"/><polygon points="400,360 376,349 376,371" fill="#6ea8fe"/><line x1="170" y1="395" x2="864" y2="395" stroke="#6ea8fe" stroke-width="3"/><polygon points="880,395 856,386 856,404" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="596" y="134" width="88" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">저예요!</text><line x1="600" y1="395" x2="186" y2="395" stroke="#7ee7c7" stroke-width="5"/><polygon points="170,395 194,384 194,406" fill="#7ee7c7"/><rect x="566" y="211" width="148" height="158" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="110" y="405" width="240" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="230.0" y="433.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">인수자: 30번 담당</text><line x1="360" y1="427" x2="554" y2="427" stroke="#7ee7c7" stroke-width="6"/><polygon points="570,427 546,415 546,439" fill="#7ee7c7"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이제 상자를 건넬 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">30번 책상에 보낼 건데 담당자를 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사무실에 ‘30번 책상 담당자 누구세요?’ 하고 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">30번 책상 담당자가 대답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이제 담당자에게 상자를 건네요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>