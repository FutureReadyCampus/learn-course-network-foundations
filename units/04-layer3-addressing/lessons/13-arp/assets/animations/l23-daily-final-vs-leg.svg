<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>최종 주소와 이번 구간 인수자</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">최종 주소와 이번 구간 인수자</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">택배에는 두 가지 정보가 모두 필요해요</text>
<circle cx="100" cy="292" r="16" fill="#6ea8fe"/><rect x="82" y="312" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="100" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="446" y="298" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="440" y="290" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="458" y="308" width="44" height="18" fill="#3d4b60"/><text x="480" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">접수창구</text><polygon points="820,294 860,260 900,294" fill="#9aa3b2"/><rect x="828" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="851" y="314" width="18" height="28" fill="#3d4b60"/><text x="860" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">먼 도시 친구</text><line x1="160" y1="335" x2="440" y2="335" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="335" x2="800" y2="335" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="100" y1="200" x2="860" y2="200" stroke="#6ea8fe" stroke-width="4"/><line x1="100" y1="200" x2="100" y2="212" stroke="#6ea8fe" stroke-width="4"/><line x1="860" y1="200" x2="860" y2="212" stroke="#6ea8fe" stroke-width="4"/><rect x="342" y="158" width="275" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="180.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">최종 주소: 어느 동네의 누구인가</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="100" y1="200" x2="480" y2="200" stroke="#c792ea" stroke-width="4"/><line x1="100" y1="200" x2="100" y2="212" stroke="#c792ea" stroke-width="4"/><line x1="480" y1="200" x2="480" y2="212" stroke="#c792ea" stroke-width="4"/><rect x="213" y="158" width="155" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290.0" y="180.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">이번 구간 인수자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="100" y1="170" x2="860" y2="170" stroke="#6ea8fe" stroke-width="4"/><line x1="100" y1="170" x2="100" y2="182" stroke="#6ea8fe" stroke-width="4"/><line x1="860" y1="170" x2="860" y2="182" stroke="#6ea8fe" stroke-width="4"/><rect x="430" y="128" width="100" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="150.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">최종 주소</text><line x1="100" y1="240" x2="480" y2="240" stroke="#c792ea" stroke-width="4"/><line x1="100" y1="240" x2="100" y2="252" stroke="#c792ea" stroke-width="4"/><line x1="480" y1="240" x2="480" y2="252" stroke="#c792ea" stroke-width="4"/><rect x="213" y="198" width="155" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290.0" y="220.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">이번 구간 인수자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="212" y="374" width="155" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="290" y="398.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">인수자 이름: ?</text><circle cx="150" cy="392" r="16" fill="#ffb454"/><text x="150" y="399" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">주소는 아는데, 이번 구간 인수자는 몰라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">최종 주소는 어느 동네의 누구인지 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이번 구간 인수자는 지금 구간에서 받을 사람이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에는 두 가지가 함께 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데 인수자의 이름을 모를 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>