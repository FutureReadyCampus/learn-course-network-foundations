<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>책상 번호를 방 전체에 묻는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">책상 번호를 방 전체에 묻는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">‘1번 책상 담당자 누구세요?’ 하고 방송해요</text>
<line x1="160" y1="295" x2="280" y2="295" stroke="#3d4b60" stroke-width="3"/><line x1="380" y1="295" x2="590" y2="295" stroke="#3d4b60" stroke-width="3"/><line x1="300" y1="312" x2="220" y2="350" stroke="#3d4b60" stroke-width="3"/><line x1="360" y1="312" x2="430" y2="350" stroke="#3d4b60" stroke-width="3"/><circle cx="100" cy="262" r="16" fill="#6ea8fe"/><rect x="82" y="282" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="100" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="296" y="258" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="290" y="250" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="308" y="268" width="44" height="18" fill="#3d4b60"/><text x="330" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">층 방송</text><rect x="606" y="268" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="600" y="260" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="618" y="278" width="44" height="18" fill="#3d4b60"/><text x="640" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">1번 책상</text><polygon points="160,389 200,355 240,389" fill="#9aa3b2"/><rect x="168" y="389" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="191" y="409" width="18" height="28" fill="#3d4b60"/><text x="200" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">2번 책상</text><polygon points="390,389 430,355 470,389" fill="#9aa3b2"/><rect x="398" y="389" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="421" y="409" width="18" height="28" fill="#3d4b60"/><text x="430" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">3번 책상</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="119" y="154" width="243" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ARP 요청: 1번 책상 담당자?</text><rect x="173" y="122" width="134" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="143.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">받는 사람: 모두</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="100,290;100,290;330,280;330,280" keyTimes="0.000;0.025;0.200;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="330,285;330,285;210,365;210,365" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><g><animateTransform attributeName="transform" type="translate" values="330,285;330,285;430,365;430,365" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><g><animateTransform attributeName="transform" type="translate" values="330,280;330,280;600,280;600,280" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="200" cy="335" r="16" fill="#ff7b72"/><path d="M193 328 l14 14 M207 328 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="430" cy="335" r="16" fill="#ff7b72"/><path d="M423 328 l14 14 M437 328 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">내 번호가 아니라서 대답하지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="581" y="221" width="118" height="128" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><ellipse cx="640" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="640" cy="190" r="7" fill="#ffb454"/><text x="640" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">나를 찾는 요청이다!</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">‘1번 책상 담당자 누구세요?’ 하고 방송해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방송은 같은 층의 모두에게 들려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 책상 담당자는 자기 번호가 아니라 가만히 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1번 책상 담당자는 나를 찾는 걸 알아채요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>