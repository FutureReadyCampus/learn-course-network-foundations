<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>메모장에서 이름 쌍을 찾아본다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">메모장에서 이름 쌍을 찾아본다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">비어 있으면 한 번 말을 걸고 다시 봐요</text>
<rect x="40" y="165" width="250" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">메모장 열기</text><rect x="40" y="231" width="250" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="165" y="264" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">다른 메모장 열기</text><rect x="320" y="150" width="600" height="250" rx="10" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="340" y="178" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">메모장 (예시)</text><text x="360" y="212" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">번호</text><text x="640" y="212" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">이름</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="360" y="250" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">1번</text><text x="640" y="250" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">김철수</text><text x="360" y="294" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">30번</text><text x="640" y="294" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">박영희</text><text x="360" y="338" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">5번</text><text x="640" y="338" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">이민수</text><rect x="40" y="165" width="250" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><text x="165" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">메모장 열기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="350" y="190" width="560" height="34" rx="6" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="348" y="414" width="265" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">번호와 이름이 한 쌍으로 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="350" y="226" width="560" height="38" rx="6" fill="none" stroke="#7ee7c7" stroke-width="4"/><rect x="375" y="414" width="210" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">정문 번호가 있는지 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="620" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">(아직 적힌 게 없어요)</text><rect x="497" y="314" width="247" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="620" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">1번 책상에 말을 한 번 걸어요</text><text x="620" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">→ 다시 보면 새 메모가 생겨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메모장을 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">번호와 이름이 한 쌍씩 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정문 번호가 있는지 살펴봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">없으면 말을 걸어 보고 다시 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>