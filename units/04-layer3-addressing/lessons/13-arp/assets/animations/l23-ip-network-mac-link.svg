<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP는 네트워크, MAC은 이번 링크</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP는 네트워크, MAC은 이번 링크</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">ARP는 IP로 MAC을 찾는 일을 해요</text>
<rect x="66" y="286" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="293" width="52" height="30" fill="#3d4b60"/><polygon points="56,332 144,332 152,344 48,344" fill="#6ea8fe"/><text x="100" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><circle cx="480" cy="320" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 314 h28 l-7 -7 M495 326 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="826" y="284" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="291" width="52" height="32" fill="#3d4b60"/><rect x="855" y="330" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="340" width="44" height="5" fill="#6ea8fe"/><text x="860" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="160" y1="335" x2="440" y2="335" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="335" x2="800" y2="335" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="100" y1="200" x2="860" y2="200" stroke="#6ea8fe" stroke-width="4"/><line x1="100" y1="200" x2="100" y2="212" stroke="#6ea8fe" stroke-width="4"/><line x1="860" y1="200" x2="860" y2="212" stroke="#6ea8fe" stroke-width="4"/><rect x="360" y="158" width="240" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="180.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">IP: 목적지가 있는 네트워크</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="100" y1="200" x2="480" y2="200" stroke="#c792ea" stroke-width="4"/><line x1="100" y1="200" x2="100" y2="212" stroke="#c792ea" stroke-width="4"/><line x1="480" y1="200" x2="480" y2="212" stroke="#c792ea" stroke-width="4"/><rect x="101" y="158" width="378" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290.0" y="180.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">MAC: 이번 링크에서 프레임을 받을 인터페이스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="100" y1="170" x2="860" y2="170" stroke="#6ea8fe" stroke-width="4"/><line x1="100" y1="170" x2="100" y2="182" stroke="#6ea8fe" stroke-width="4"/><line x1="860" y1="170" x2="860" y2="182" stroke="#6ea8fe" stroke-width="4"/><rect x="426" y="128" width="107" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="150.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">IP (최종)</text><line x1="100" y1="240" x2="480" y2="240" stroke="#c792ea" stroke-width="4"/><line x1="100" y1="240" x2="100" y2="252" stroke="#c792ea" stroke-width="4"/><line x1="480" y1="240" x2="480" y2="252" stroke="#c792ea" stroke-width="4"/><rect x="212" y="198" width="156" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="290.0" y="220.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">MAC (이번 링크)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="223" y="374" width="134" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="290" y="398.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">받을 MAC: ?</text><circle cx="150" cy="392" r="16" fill="#ffb454"/><text x="150" y="399" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">IP는 아는데, 이번 링크의 MAC은 몰라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 주소는 목적지가 있는 네트워크를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MAC 주소는 이번 링크의 받을 인터페이스예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프레임을 보내려면 둘 다 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP는 아는데 MAC을 모를 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>