<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>정문 위치는 알아도 경비는 몰라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">정문 위치는 알아도 경비는 몰라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">카드에는 위치만 있고 이름은 없어요</text>
<rect x="60" y="140" width="380" height="170" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">입주 안내 카드</text><text x="80" y="205" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">내 호수</text><text x="420" y="205" text-anchor="end" font-size="18" font-weight="700" fill="#7ee7c7">302호</text><text x="80" y="241" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">정문 위치</text><text x="420" y="241" text-anchor="end" font-size="18" font-weight="700" fill="#7ee7c7">1동 앞</text><text x="80" y="277" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">정문 경비 이름</text><text x="420" y="277" text-anchor="end" font-size="18" font-weight="700" fill="#ffb454">?</text><line x1="170" y1="435" x2="440" y2="435" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="435" x2="790" y2="435" stroke="#3d4b60" stroke-width="3"/><circle cx="110" cy="392" r="16" fill="#6ea8fe"/><rect x="92" y="412" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="484" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="446" y="398" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="440" y="390" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="458" y="408" width="44" height="18" fill="#3d4b60"/><text x="480" y="460" text-anchor="middle" font-size="17" fill="#9aa3b2">정문</text><polygon points="810,394 850,360 890,394" fill="#9aa3b2"/><rect x="818" y="394" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="414" width="18" height="28" fill="#3d4b60"/><text x="850" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바깥 동네</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="71" y="218" width="358" height="36" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="180" y1="380" x2="414" y2="380" stroke="#ffb454" stroke-width="6"/><polygon points="430,380 406,368 406,392" fill="#ffb454"/><text x="305" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">밖으로 나가려면 먼저 정문으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="71" y="254" width="358" height="36" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><circle cx="480" cy="370" r="16" fill="#ffb454"/><text x="480" y="377" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="620" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">카드에는 이름이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="510" y="355" width="180" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="600" y="378.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">따로 알아내야 해요</text><rect x="71" y="254" width="358" height="36" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 카드에 정문 위치가 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">밖으로 나가려면 먼저 정문으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하지만 정문 경비의 이름은 카드에 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름은 따로 물어서 알아내야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>