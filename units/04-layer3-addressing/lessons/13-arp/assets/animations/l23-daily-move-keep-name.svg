<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이사해도 이름은 그대로예요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이사해도 이름은 그대로예요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소는 바뀌고, 이름은 사람에 붙어요</text>
<rect x="40" y="140" width="290" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="185" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">옛 동네</text><rect x="630" y="140" width="290" height="235" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="775" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">새 동네</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="185" cy="272" r="16" fill="#6ea8fe"/><rect x="167" y="292" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="185" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="98" y="188" width="174" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="185" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">주소 서울 3동 12호</text><rect x="132" y="230" width="106" height="31" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="185" y="250.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">이름 김철수</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g opacity=".35"><circle cx="185" cy="272" r="16" fill="#6ea8fe"/><rect x="167" y="292" width="36" height="46" rx="12" fill="#6ea8fe"/></g><circle cx="775" cy="272" r="16" fill="#6ea8fe"/><rect x="757" y="292" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="775" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="693" y="188" width="164" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="775" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">주소 부산 5동 7호</text><rect x="722" y="230" width="106" height="31" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="775" y="250.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">이름 김철수</text><line x1="335" y1="300" x2="569" y2="300" stroke="#ffb454" stroke-width="6"/><polygon points="585,300 561,288 561,312" fill="#ffb454"/><text x="460" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">이사 · 이동</text><text x="480" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">주소는 바뀌었지만 이름은 그대로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><circle cx="775" cy="272" r="16" fill="#6ea8fe"/><rect x="757" y="292" width="36" height="46" rx="12" fill="#6ea8fe"/><rect x="693" y="188" width="164" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="775" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">주소 부산 5동 7호</text><rect x="722" y="230" width="106" height="31" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="775" y="250.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">이름 김철수</text><rect x="110" y="394" width="200" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="210.0" y="420.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">인수자: ?</text><rect x="320" y="394" width="200" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="420.0" y="420.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">출발 MAC</text><rect x="530" y="394" width="220" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="640.0" y="420.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP 패킷</text><text x="430" y="388" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">프레임을 보내려면</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="350" y="442" width="260" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="464.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">인수자는 따로 물어서 알아내요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">옛 동네에서는 주소와 이름이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이사하면 주소는 바뀌지만 이름은 같아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배에는 이번 구간 인수자도 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인수자는 따로 물어서 알아내요</text></g>

