<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>알아낸 이름을 메모해 둔다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">알아낸 이름을 메모해 둔다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">다음에는 다시 묻지 않고 메모를 봐요</text>
<rect x="60" y="140" width="400" height="160" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="260" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">메모장</text><text x="100" y="198" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">번호</text><text x="250" y="198" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">이름</text><circle cx="110" cy="372" r="16" fill="#6ea8fe"/><rect x="92" y="392" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="464" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="816" y="378" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="810" y="370" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="828" y="388" width="44" height="18" fill="#3d4b60"/><text x="850" y="440" text-anchor="middle" font-size="17" fill="#9aa3b2">1번 책상</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="170" y1="345" x2="774" y2="345" stroke="#6ea8fe" stroke-width="4"/><polygon points="790,345 766,335 766,355" fill="#6ea8fe"/><text x="480" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">누구세요?</text><line x1="790" y1="385" x2="186" y2="385" stroke="#7ee7c7" stroke-width="4"/><polygon points="170,385 194,375 194,395" fill="#7ee7c7"/><text x="480" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">저예요!</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="75" y="208" width="370" height="40" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="100" y="235" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">1번</text><text x="250" y="235" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">김철수</text><rect x="192" y="254" width="136" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="260" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">한 줄 적어 둬요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,400;170,400;790,400;790,400" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><circle cx="480" cy="340" r="16" fill="#7ee7c7"/><path d="M472 340 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="480" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">다시 묻지 않아도 돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="75" y="208" width="370" height="40" rx="8" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">잠깐 적어 둔 메모라서, 오래되면 지워질 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음에는 번호를 방송해서 물어봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">알아낸 번호와 이름을 메모장에 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음에는 메모를 보고 바로 건네요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메모는 오래되면 지워질 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>