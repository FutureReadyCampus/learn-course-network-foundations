<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP는 아는데 MAC을 몰라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP는 아는데 MAC을 몰라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 LAN에 ‘이 IP 주인이 누구냐’고 물어요</text>
<rect x="76" y="286" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="293" width="52" height="30" fill="#3d4b60"/><polygon points="66,332 154,332 162,344 58,344" fill="#6ea8fe"/><text x="110" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="406" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="414" y="281" width="52" height="32" fill="#3d4b60"/><rect x="435" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="418" y="330" width="44" height="5" fill="#6ea8fe"/><text x="440" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC</text><rect x="379" y="200" width="122" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="440" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">192.168.0.21</text><rect x="622" y="274" width="36" height="22" fill="#e6e8ec"/><rect x="604" y="294" width="72" height="36" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="618" y="330" width="44" height="4" fill="#6ea8fe"/><text x="640" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">프린터</text><rect x="579" y="200" width="122" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="640" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">192.168.0.30</text><rect x="806" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="814" y="281" width="52" height="32" fill="#3d4b60"/><rect x="835" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="818" y="330" width="44" height="5" fill="#6ea8fe"/><text x="840" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="783" y="200" width="114" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="840" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">192.168.0.5</text><line x1="160" y1="330" x2="400" y2="330" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="572" y="198" width="135" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="640" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">192.168.0.30</text><rect x="108" y="228" width="84" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="150" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">MAC: ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="299" y="143" width="362" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">192.168.0.30을 쓰는 장치는 누구인가요?</text><line x1="170" y1="360" x2="384" y2="360" stroke="#6ea8fe" stroke-width="5"/><polygon points="400,360 376,349 376,371" fill="#6ea8fe"/><line x1="170" y1="395" x2="864" y2="395" stroke="#6ea8fe" stroke-width="3"/><polygon points="880,395 856,386 856,404" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="480" y="134" width="319" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">저예요, MAC은 AA:BB:CC:00:11:22</text><line x1="600" y1="395" x2="186" y2="395" stroke="#7ee7c7" stroke-width="5"/><polygon points="170,395 194,384 194,406" fill="#7ee7c7"/><rect x="566" y="211" width="148" height="158" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="405" width="240" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="230.0" y="433.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">받는 MAC: 프린터</text><line x1="360" y1="427" x2="554" y2="427" stroke="#7ee7c7" stroke-width="6"/><polygon points="570,427 546,415 546,439" fill="#7ee7c7"/><text x="480" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이제 프레임을 보낼 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프린터의 IP는 아는데 MAC은 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 LAN에 그 IP의 주인을 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주인인 프린터가 MAC을 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이제 프린터 MAC으로 프레임을 보낼 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>