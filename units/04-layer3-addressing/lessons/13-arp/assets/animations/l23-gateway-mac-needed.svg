<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>게이트웨이 MAC은 따로 알아내요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">게이트웨이 MAC은 따로 알아내요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">예: PC 192.168.0.100, 게이트웨이 192.168.0.1</text>
<rect x="60" y="140" width="380" height="170" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">DHCP로 받은 설정</text><text x="80" y="205" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">내 IP</text><text x="420" y="205" text-anchor="end" font-size="18" font-weight="700" fill="#7ee7c7">192.168.0.100</text><text x="80" y="241" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">게이트웨이 IP</text><text x="420" y="241" text-anchor="end" font-size="18" font-weight="700" fill="#7ee7c7">192.168.0.1</text><text x="80" y="277" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">게이트웨이 MAC</text><text x="420" y="277" text-anchor="end" font-size="18" font-weight="700" fill="#ffb454">?</text><line x1="170" y1="435" x2="440" y2="435" stroke="#3d4b60" stroke-width="3"/><line x1="520" y1="435" x2="790" y2="435" stroke="#3d4b60" stroke-width="3"/><rect x="76" y="386" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="393" width="52" height="30" fill="#3d4b60"/><polygon points="66,432 154,432 162,444 58,444" fill="#6ea8fe"/><text x="110" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="480" cy="420" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 414 h28 l-7 -7 M495 426 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="470" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><rect x="816" y="384" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="391" width="52" height="32" fill="#3d4b60"/><rect x="845" y="430" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="440" width="44" height="5" fill="#6ea8fe"/><text x="850" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">인터넷</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="71" y="218" width="358" height="36" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="380" x2="414" y2="380" stroke="#ffb454" stroke-width="6"/><polygon points="430,380 406,368 406,392" fill="#ffb454"/><text x="305" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">밖으로 나가려면 먼저 게이트웨이로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="71" y="254" width="358" height="36" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><circle cx="480" cy="370" r="16" fill="#ffb454"/><text x="480" y="377" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="620" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">DHCP는 IP까지만 알려 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="471" y="355" width="258" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="600" y="378.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">별도로 알아내야 해요 → ARP</text><rect x="71" y="254" width="358" height="36" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DHCP가 게이트웨이의 IP를 알려 줬어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷으로 나가려면 먼저 게이트웨이로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 IP에 대응하는 MAC은 모르는 상태예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MAC은 ARP로 따로 알아내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>