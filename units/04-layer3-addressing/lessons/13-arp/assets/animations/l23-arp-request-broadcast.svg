<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ARP Request는 모두에게 묻는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ARP Request는 모두에게 묻는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">목적지 MAC은 브로드캐스트예요</text>
<line x1="160" y1="295" x2="280" y2="295" stroke="#3d4b60" stroke-width="3"/><line x1="380" y1="295" x2="590" y2="295" stroke="#3d4b60" stroke-width="3"/><line x1="300" y1="312" x2="220" y2="350" stroke="#3d4b60" stroke-width="3"/><line x1="360" y1="312" x2="430" y2="350" stroke="#3d4b60" stroke-width="3"/><rect x="66" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="56,302 144,302 152,314 48,314" fill="#6ea8fe"/><text x="100" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><rect x="278" y="264" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="290" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="307" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="324" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="341" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="358" y="275" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="330" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="640" cy="290" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M625 284 h28 l-7 -7 M655 296 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="640" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><rect x="166" y="359" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="174" y="366" width="52" height="32" fill="#3d4b60"/><rect x="195" y="405" width="10" height="10" fill="#6ea8fe"/><rect x="178" y="415" width="44" height="5" fill="#6ea8fe"/><text x="200" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 2</text><rect x="412" y="359" width="36" height="22" fill="#e6e8ec"/><rect x="394" y="379" width="72" height="36" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="408" y="415" width="44" height="4" fill="#6ea8fe"/><text x="430" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">프린터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="103" y="154" width="274" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ARP 요청: 192.168.0.1은 누구?</text><rect x="109" y="122" width="261" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="143.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">목적지 MAC FF:FF:FF:FF:FF:FF</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="100,290;100,290;330,280;330,280" keyTimes="0.000;0.025;0.200;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="330,285;330,285;210,365;210,365" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g><animateTransform attributeName="transform" type="translate" values="330,285;330,285;430,365;430,365" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g><animateTransform attributeName="transform" type="translate" values="330,280;330,280;600,280;600,280" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="200" cy="335" r="16" fill="#ff7b72"/><path d="M193 328 l14 14 M207 328 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="430" cy="335" r="16" fill="#ff7b72"/><path d="M423 328 l14 14 M437 328 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">내 IP가 아니라서 응답하지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="581" y="221" width="118" height="128" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><ellipse cx="640" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="640" cy="190" r="7" fill="#ffb454"/><text x="640" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">나를 찾는 요청이다!</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC가 ‘192.168.0.1 누구?’ 하고 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치가 같은 범위의 모두에게 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주인이 아닌 호스트들은 응답하지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게이트웨이는 자신을 찾는 요청임을 알아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>