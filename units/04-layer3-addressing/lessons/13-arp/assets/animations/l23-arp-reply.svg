<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ARP Reply로 MAC을 알려 준다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ARP Reply로 MAC을 알려 준다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">MAC은 48비트 주소 (예시 AA:BB:CC:00:11:22)</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="850" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M835 294 h28 l-7 -7 M865 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><line x1="170" y1="315" x2="790" y2="315" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="791" y="241" width="118" height="128" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="772" y="174" width="156" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="195.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">내 IP를 찾는 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="800" y1="300" x2="206" y2="300" stroke="#7ee7c7" stroke-width="6"/><polygon points="190,300 214,288 214,312" fill="#7ee7c7"/><rect x="371" y="238" width="217" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">ARP 응답: 내 IP와 MAC</text><text x="480" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">나에게만 보내요 (유니캐스트)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="130" width="360" height="74" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">192.168.0.1 =</text><text x="480" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">AA:BB:CC:00:11:22</text><rect x="435" y="274" width="91" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="295.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">받았어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="400" width="240" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="270.0" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">받는 MAC: 게이트웨이</text><rect x="400" y="400" width="200" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="500.0" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">출발 MAC</text><rect x="610" y="400" width="200" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="710.0" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IP 패킷</text><text x="480" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">이제 받는 MAC을 정할 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게이트웨이가 자신을 찾는 요청을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ARP Reply로 자신의 IP와 MAC을 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC는 192.168.0.1의 MAC을 알게 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이제 프레임의 받는 MAC을 정할 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>