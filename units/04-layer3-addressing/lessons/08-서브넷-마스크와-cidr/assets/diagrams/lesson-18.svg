<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-18-basic-export-title lesson-18-basic-export-desc" lang="ko"><title id="lesson-18-basic-export-title">서브넷 마스크와 CIDR · 학습 흐름</title><desc id="lesson-18-basic-export-desc">IP 주소의 경계를 이해하고, 서브넷 마스크와 CIDR로 네트워크 주소를 계산한 뒤 네트워크를 더 나누는 순서입니다.</desc><defs><marker id="lesson-18-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-18-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="44" text-anchor="middle"><tspan x="143.0" dy="0">IP 주소의 네트워크 부분과</tspan><tspan x="143.0" dy="25">호스트 부분</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="44" text-anchor="middle"><tspan x="421.0" dy="0">서브넷 마스크가</tspan><tspan x="421.0" dy="25">경계선을 보여 준다</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="44" text-anchor="middle"><tspan x="699.0" dy="0">AND 연산으로</tspan><tspan x="699.0" dy="25">네트워크 주소를 구한다</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="44" text-anchor="middle"><tspan x="977.0" dy="0">CIDR은 경계를</tspan><tspan x="977.0" dy="25">/숫자로 적는다</tspan></text><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="204" text-anchor="middle"><tspan x="143.0" dy="0">점 사이에서도</tspan><tspan x="143.0" dy="25">경계가 나뉜다: /25</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="204" text-anchor="middle"><tspan x="421.0" dy="0">서브네팅은 네트워크를</tspan><tspan x="421.0" dy="25">더 작은 단위로 나눈다</tspan></text></svg>
