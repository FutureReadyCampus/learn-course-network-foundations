<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP 헤더에는 전달 정보가 담긴다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP 헤더에는 전달 정보가 담긴다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">패킷은 헤더와 페이로드로 이뤄져요</text>
<rect x="110" y="190" width="740" height="100" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">IP 패킷 하나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="190" width="280" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="250.0" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">IP 헤더 (앞부분)</text><rect x="390" y="190" width="460" height="100" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="620.0" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">페이로드 (뒤에 실린 데이터)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="250" y1="290" x2="250" y2="322" stroke="#ffb454" stroke-width="3"/><line x1="174" y1="322" x2="786" y2="322" stroke="#ffb454" stroke-width="3"/><line x1="174" y1="322" x2="174" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="378" y1="322" x2="378" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="582" y1="322" x2="582" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="786" y1="322" x2="786" y2="345" stroke="#ffb454" stroke-width="3"/><rect x="79" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="174.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">목적지 주소</text><rect x="283" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="378.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">다음에 올 프로토콜</text><rect x="487" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="582.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">전달 범위 제한 (TTL)</text><rect x="691" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="786.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">나눠 보낼 때 참고</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="110" y1="160" x2="850" y2="160" stroke="#6ea8fe" stroke-width="4"/><line x1="110" y1="160" x2="110" y2="172" stroke="#6ea8fe" stroke-width="4"/><line x1="850" y1="160" x2="850" y2="172" stroke="#6ea8fe" stroke-width="4"/><rect x="340" y="117" width="280" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="140.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">IP 패킷 하나 = 헤더 + 페이로드</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 패킷 하나를 떠올려 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞부분은 IP 헤더, 뒤는 페이로드예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더엔 목적지 주소 말고도 담겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더와 페이로드가 모여 패킷 하나예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>