<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>송장에는 받는 곳 말고도 적힌다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">송장에는 받는 곳 말고도 적힌다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상자는 송장과 내용물로 이뤄져요</text>
<rect x="110" y="190" width="740" height="100" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">택배 상자 하나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite" begin="2s"/><rect x="110" y="190" width="280" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="250.0" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">송장 (앞부분)</text><rect x="390" y="190" width="460" height="100" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="620.0" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">내용물 (뒤에 실린 것)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="250" y1="290" x2="250" y2="322" stroke="#ffb454" stroke-width="3"/><line x1="174" y1="322" x2="786" y2="322" stroke="#ffb454" stroke-width="3"/><line x1="174" y1="322" x2="174" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="378" y1="322" x2="378" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="582" y1="322" x2="582" y2="345" stroke="#ffb454" stroke-width="3"/><line x1="786" y1="322" x2="786" y2="345" stroke="#ffb454" stroke-width="3"/><rect x="79" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="174.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">받는 곳</text><rect x="283" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="378.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">내용물 종류</text><rect x="487" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="582.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">더 거칠 수 있는 횟수</text><rect x="691" y="345" width="190" height="54" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="786.0" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">나눠 보낼 때 참고</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><line x1="110" y1="160" x2="850" y2="160" stroke="#6ea8fe" stroke-width="4"/><line x1="110" y1="160" x2="110" y2="172" stroke="#6ea8fe" stroke-width="4"/><line x1="850" y1="160" x2="850" y2="172" stroke="#6ea8fe" stroke-width="4"/><rect x="362" y="117" width="235" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480.0" y="140.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">상자 하나 = 송장 + 내용물</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배 상자 하나를 떠올려 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞쪽엔 송장, 뒤쪽엔 내용물이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장엔 받는 곳 말고도 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장과 내용물이 모여 상자 하나예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="291.894" text-anchor="middle" font-size="62.5538" font-weight="750" letter-spacing="-1" fill="#e6e8ec">송장에는 받는 곳 말고도 적힌다</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.023529;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.100000;0.117647;1" dur="17s" repeatCount="indefinite"/></g></svg>