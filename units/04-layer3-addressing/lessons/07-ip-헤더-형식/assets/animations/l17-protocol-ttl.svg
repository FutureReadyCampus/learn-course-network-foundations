<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Protocol과 TTL의 역할</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Protocol과 TTL의 역할</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Protocol은 다음에 풀 프로토콜, TTL은 전달 범위를 제한해요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="130" width="270" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="205" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">IP 헤더</text><rect x="128" y="182" width="153" height="35" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="205" y="206.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">Protocol = 6</text><line x1="340" y1="180" x2="590" y2="180" stroke="#3d4b60" stroke-width="3"/><polygon points="600,180 580,170 580,190" fill="#3d4b60"/><rect x="600" y="124" width="280" height="42" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="740" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">TCP · 6</text><rect x="600" y="172" width="280" height="42" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="740" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">UDP · 17</text><rect x="600" y="220" width="280" height="42" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="740" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">ICMP · 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="130" width="270" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="205" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">IP 헤더</text><rect x="128" y="182" width="153" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="205" y="206.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">Protocol = 6</text><line x1="340" y1="180" x2="590" y2="180" stroke="#3d4b60" stroke-width="3"/><polygon points="600,180 580,170 580,190