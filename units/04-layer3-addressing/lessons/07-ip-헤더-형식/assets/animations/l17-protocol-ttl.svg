5" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M525 339 h28 l-7 -7 M555 351 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="540" y="395" text-anchor="middle" font-size="17" fill="#9aa3b2">R2</text><circle cx="750" cy="345" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M735 339 h28 l-7 -7 M765 351 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="750" y="395" text-anchor="middle" font-size="17" fill="#9aa3b2">R3</text><text x="120" y="395" text-anchor="middle" font-size="17" fill="#9aa3b2">PC</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.512;0.527;1" dur="16s" repeatCount="indefinite"/><rect x="187" y="279" width="77" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="225" y="302.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TTL 3</text><rect x="203" y="331" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M203 333 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.615;1" dur="16s" repeatCount="indefinite"/><rect x="397" y="279" width="77" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="435" y="302.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TTL 2</text><rect x="413" y="331" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M413 333 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.688;0.703;1" dur="16s" repeatCount="indefinite"/><rect x="607" y="279" width="77" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="645" y="302.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TTL 1</text><rect x="623" y="331" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M623 333 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="712" y="279" width="77" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="750" y="302.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TTL 0</text><circle cx="814" cy="345" r="16" fill="#ff7b72"/><path d="M807 338 l14 14 M821 338 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="750" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7b72">폐기돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도착한 패킷은 Protocol 값을 먼저 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">6이면 TCP로 해석해요 (17 UDP, 1 ICMP)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터를 지날 때마다 TTL이 줄어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TTL이 0이 되면 폐기돼요 (예시 값)</text></g>

