<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>첫 바이트 0x45로 헤더 길이 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">첫 바이트 0x45로 헤더 길이 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">16진수 한 자리는 4비트, 앞은 Version, 뒤는 IHL</text>
<g><rect x="345" y="118" width="110" height="62" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400.0" y="163.4" text-anchor="middle" font-size="40" font-weight="700" fill="#6ea8fe">4</text><rect x="505" y="118" width="110" height="62" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="560.0" y="163.4" text-anchor="middle" font-size="40" font-weight="700" fill="#ffb454">5</text><text x="250" y="160" text-anchor="end" font-size="17" font-weight="700" fill="#9aa3b2">첫 바이트 (16진수)</text><text x="690" y="160" text-anchor="start" font-size="28" font-weight="700" fill="#e6e8ec">= 45</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="325" y="200" width="150" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400.0" y="227.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">0100</text><rect x="485" y="200" width="150" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="560.0" y="227.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">0101</text><line x1="400" y1="180" x2="400" y2="200" stroke="#6ea8fe" stroke-width="3"/><line x1="560" y1="180" x2="560" y2="200" stroke="#ffb454" stroke-width="3"/><text x="400" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">Version = 4</text><text x="560" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">IHL = 5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="130" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="430" y="316" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">← 한 줄 = 4바이트</text><text x="560" y="372" text-anchor="start" font-size="22" font-weight="700" fill="#ffb454">IHL 5 = 4바이트 단위 5개</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="560" y="412" text-anchor="start" font-size="32" font-weight="700" fill="#ffb454">5 × 4 = 20바이트</text><rect x="672" y="428" width="177" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="760" y="450.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">옵션 없는 기본 헤더</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더의 첫 바이트는 16진수 45예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">4비트씩 나누면 Version 4, IHL 5예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IHL은 4바이트 단위가 몇 개인지예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 헤더 길이는 20바이트예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="290.79" text-anchor="middle" font-size="59.4005" font-weight="750" letter-spacing="-1" fill="#e6e8ec">첫 바이트 0x45로 헤더 길이 읽기</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>