<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>두 자리 번호로 송장 길이를 읽는다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">두 자리 번호로 송장 길이를 읽는다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">앞 숫자는 양식 번호, 뒤 숫자는 줄 수예요</text>
<g><rect x="345" y="118" width="110" height="62" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400.0" y="163.4" text-anchor="middle" font-size="40" font-weight="700" fill="#6ea8fe">4</text><rect x="505" y="118" width="110" height="62" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="560.0" y="163.4" text-anchor="middle" font-size="40" font-weight="700" fill="#ffb454">5</text><text x="250" y="160" text-anchor="end" font-size="17" font-weight="700" fill="#9aa3b2">상자에 적힌 두 자리</text><text x="690" y="160" text-anchor="start" font-size="28" font-weight="700" fill="#e6e8ec">= 45</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="325" y="200" width="150" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400.0" y="227.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">앞 숫자</text><rect x="485" y="200" width="150" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="560.0" y="227.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">뒤 숫자</text><line x1="400" y1="180" x2="400" y2="200" stroke="#6ea8fe" stroke-width="3"/><line x1="560" y1="180" x2="560" y2="200" stroke="#ffb454" stroke-width="3"/><text x="400" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">양식 번호 = 4</text><text x="560" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">줄 수 = 5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="130" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="300" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="322" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="344" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="366" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="130" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="200" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="270" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><rect x="340" y="388" width="68" height="20" rx="3" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="430" y="316" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">← 한 줄 = 4칸</text><text x="560" y="372" text-anchor="start" font-size="22" font-weight="700" fill="#ffb454">줄 수 5 = 4칸짜리 줄 5개</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="560" y="412" text-anchor="start" font-size="32" font-weight="700" fill="#ffb454">5 × 4 = 20칸</text><rect x="661" y="428" width="198" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="760" y="450.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">추가 칸 없는 기본 송장</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에 두 자리 번호 45가 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞 숫자 4는 양식, 뒤 숫자 5는 줄 수예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장은 4칸짜리 줄이 다섯 개예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 송장 길이는 20칸이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>