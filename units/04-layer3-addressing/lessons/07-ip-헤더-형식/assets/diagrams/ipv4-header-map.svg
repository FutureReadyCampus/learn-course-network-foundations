<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">IPv4 헤더와 페이로드의 구조</title>
  <desc id="desc">32비트씩 나뉜 IPv4 헤더에서 Version, IHL, Total Length, TTL, Protocol과 주소 필드의 위치를 보여준다. 헤더 뒤에는 페이로드가 오며 옵션과 패딩은 선택 사항이다.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}
    .bg{fill:#0f1115}.field{stroke:#d7e0ed;stroke-width:2}.f1{fill:#236b83}.f2{fill:#65569a}.f3{fill:#9a5a32}.f4{fill:#286d55}.optional{fill:#283344;stroke-dasharray:8 6}.payload{fill:#1d2633;stroke:#7ee7c7;stroke-width:2}.head{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:18px;fill:#c5cedb}.note{font-size:19px;fill:#9aa3b2}
  </style>
  <rect class="bg" width="1120" height="890" rx="20"/>
  <text class="head" x="70" y="66">IPv4 패킷 = 헤더 + 페이로드</text>
  <text class="note" x="1050" y="66" text-anchor="end">각 행은 32비트 (4바이트)</text>
  <text class="small" x="70" y="119">IPv4 헤더</text>
  <g transform="translate(70 140)">
    <g>
      <rect class="field f1" x="0" y="0" width="122.5" height="82"/><text class="label" x="61" y="34" text-anchor="middle">Version</text><text class="small" x="61" y="62" text-anchor="middle">4비트</text>
      <rect class="field f1" x="122.5" y="0" width="122.5" height="82"/><text class="label" x="184" y="34" text-anchor="middle">IHL</text><text class="small" x="184" y="62" text-anchor="middle">4비트</text>
      <rect class="field f2" x="245" y="0" width="245" height="82"/><text class="label" x="367" y="34" text-anchor="middle">DS 필드</text><text class="small" x="367" y="62" text-anchor="middle">DSCP / ECN · 8비트</text>
      <rect class="field f3" x="490" y="0" width="490" height="82"/><text class="label" x="735" y="34" text-anchor="middle">Total Length</text><text class="small" x="735" y="62" text-anchor="middle">16비트</text>
      <rect class="field f2" x="0" y="92" width="490" height="82"/><text class="label" x="245" y="126" text-anchor="middle">Identification</text><text class="small" x="245" y="154" text-anchor="middle">16비트</text>
      <rect class="field f2" x="490" y="92" width="92" height="82"/><text class="label" x="536" y="126" text-anchor="middle">Flags</text><text class="small" x="536" y="154" text-anchor="middle">3비트</text>
      <rect class="field f2" x="582" y="92" width="398" height="82"/><text class="label" x="781" y="126" text-anchor="middle">Fragment Offset</text><text class="small" x="781" y="154" text-anchor="middle">13비트</text>
      <rect class="field f3" x="0" y="184" width="245" height="82"/><text class="label" x="122" y="218" text-anchor="middle">TTL</text><text class="small" x="122" y="246" text-anchor="middle">8비트</text>
      <rect class="field f3" x="245" y="184" width="245" height="82"/><text class="label" x="367" y="218" text-anchor="middle">Protocol</text><text class="small" x="367" y="246" text-anchor="middle">8비트</text>
      <rect class="field f3" x="490" y="184" width="490" height="82"/><text class="label" x="735" y="218" text-anchor="middle">Header Checksum</text><text class="small" x="735" y="246" text-anchor="middle">16비트</text>
      <rect class="field f4" x="0" y="276" width="980" height="70"/><text class="label" x="490" y="319" text-anchor="middle">Source Address · 출발지 IPv4 주소 · 32비트</text>
      <rect class="field f4" x="0" y="356" width="980" height="70"/><text class="label" x="490" y="399" text-anchor="middle">Destination Address · 목적지 IPv4 주소 · 32비트</text>
      <rect class="field optional" x="0" y="436" width="980" height="56" rx="8"/><text class="small" x="490" y="471" text-anchor="middle">Options + Padding · 선택 항목</text>
    </g>
    <path d="M490 503v30" stroke="#7ee7c7" stroke-width="3"/><path d="M481 524l9 10 9-10" fill="none" stroke="#7ee7c7" stroke-width="3"/>
    <rect class="payload" x="0" y="542" width="980" height="92" rx="10"/><text class="label" x="490" y="580" text-anchor="middle">Payload · 페이로드</text><text class="small" x="490" y="610" text-anchor="middle">TCP, UDP, ICMP 등의 데이터가 들어올 수 있다</text>
  </g>
  <text class="note" x="70" y="842">필드 배치를 한눈에 보는 그림이다. 각 필드의 세부 동작을 모두 외우라는 뜻은 아니다.</text>
</svg>
