<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-19-basic-export-title lesson-19-basic-export-desc" lang="ko"><title id="lesson-19-basic-export-title">브로드캐스트 IP 주소는 어디까지 전달될까? · 학습 흐름</title><desc id="lesson-19-basic-export-desc">IP 브로드캐스트 주소를 만들고, 전달 범위와 일반 장치에 배정할 수 있는 주소 수를 차례로 살펴봅니다.</desc><defs><marker id="lesson-19-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-19-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">브로드캐스트는</tspan><tspan x="143.0" dy="25">같은 범위의 모두에게</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">/24 네트워크의</tspan><tspan x="421.0" dy="25">브로드캐스트 주소</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">유니캐스트와</tspan><tspan x="699.0" dy="25">브로드캐스트 범위</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">브로드캐스트가 퍼지는</tspan><tspan x="977.0" dy="25">범위는 관리해야 한다</tspan></text><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">/24에서 배정하지 않는</tspan><tspan x="143.0" dy="25">두 주소</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">실제 PC에 배정할 수</tspan><tspan x="421.0" dy="25">있는 주소 수</tspan></text></svg>
