-anchor="middle">02 · 1:19</text></a><a href="../lesson-13.html#concept-basic-13-03" target="_top" aria-label="Frame 안의 Packet과 Segment 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">Frame 안의 Packet과</tspan><tspan x="699.0" dy="25">Segment</tspan></text><text class="flow-time" x="699.0" y="116" text-anchor="middle">03 · 2:28</text></a><a href="../lesson-13.html#concept-basic-13-04" target="_top" aria-label="Decapsulation · 겉에서부터 꺼내기 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">Decapsulation ·</tspan><tspan x="977.0" dy="25">겉에서부터 꺼내기</tspan></text><text class="flow-time" x="977.0" y="116" text-anchor="middle">04 · 3:08</text></a><a href="../lesson-13.html#concept-basic-13-05" target="_top" aria-label="Header와 Payload의 관계 정리 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">Header와 Payload의</tspan><tspan x="143.0" dy="25">관계 정리</tspan></text><text class="flow-time" x="143.0" y="276" text-anchor="middle">05 · 4:12</text></a></svg>
