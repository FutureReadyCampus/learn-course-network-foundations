<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>헤더를 붙이면 같은 형식의 단위</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">헤더를 붙이면 같은 형식의 단위</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">캡슐화는 다루기 쉽게 할 뿐, 암호화가 아니에요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(240,290)"><rect x="-36" y="-18" width="72" height="36" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">안녕</text></g><text x="240" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">문자</text><g transform="translate(480,290)"><rect x="-50" y="-40" width="100" height="80" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><polygon points="-44,34 -14,-6 8,18 22,2 44,34" fill="#3d4b60"/></g><text x="480" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">사진</text><g transform="translate(720,290)"><rect x="-60" y="-32" width="120" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="-10,-14 18,0 -10,14" fill="#6ea8fe"/></g><text x="720" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">영상</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(240,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-36" y="-18" width="72" height="36" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">안녕</text></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g><g transform="translate(480,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-50" y="-40" width="100" height="80" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><polygon points="-44,34 -14,-6 8,18 22,2 44,34" fill="#3d4b60"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g><g transform="translate(720,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-60" y="-32" width="120" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="-10,-14 18,0 -10,14" fill="#6ea8fe"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g><text x="480" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">같은 형식의 단위</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,290;180,290;260,290;260,290" keyTimes="0.000;0.537;0.662;1.000" dur="16s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-36" y="-18" width="72" height="36" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">안녕</text></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g></g><g><animateTransform attributeName="transform" type="translate" values="420,290;420,290;500,290;500,290" keyTimes="0.000;0.537;0.662;1.000" dur="16s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-50" y="-40" width="100" height="80" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><polygon points="-44,34 -14,-6 8,18 22,2 44,34" fill="#3d4b60"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g></g><g><animateTransform attributeName="transform" type="translate" values="660,290;660,290;740,290;740,290" keyTimes="0.000;0.537;0.662;1.000" dur="16s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-60" y="-32" width="120" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="-10,-14 18,0 -10,14" fill="#6ea8fe"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g></g><line x1="120" y1="380" x2="860" y2="380" stroke="#3d4b60" stroke-width="4"/><text x="480" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">한 덩어리로 다뤄요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><g transform="translate(400,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-50" y="-40" width="100" height="80" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><polygon points="-44,34 -14,-6 8,18 22,2 44,34" fill="#3d4b60"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더</text></g><g transform="translate(640,290)"><rect x="-20" y="-18" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M-11 -18 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><path d="M-34 -42 L34 34" stroke="#ff7b72" stroke-width="6"/></g><text x="400" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">내용은 그대로 보여요</text><text x="640" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">숨기려면 암호화가 따로 필요</text></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">데이터는 종류와 크기가 제각각이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더를 붙이면 같은 형식의 단위가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">단위로 묶어서 한꺼번에 다뤄요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">캡슐화해도 내용이 숨겨지진 않아요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text></g>
