<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>모양이 달라도 상자에 담으면 같은 단위</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">모양이 달라도 상자에 담으면 같은 단위</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">포장은 다루기 쉽게 할 뿐, 내용을 숨기지는 않아요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g transform="translate(240,290)"><rect x="-46" y="-30" width="92" height="60" rx="4" fill="#ffb454"/><rect x="-6" y="-30" width="12" height="60" fill="#0f1115" fill-opacity=".25"/></g><text x="240" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">책</text><g transform="translate(480,290)"><circle cx="0" cy="-4" r="26" fill="#7ee7c7"/><rect x="-3" y="20" width="6" height="22" fill="#7ee7c7"/></g><text x="480" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">꽃</text><g transform="translate(720,290)"><polygon points="0,-34 38,30 -38,30" fill="#6ea8fe"/></g><text x="720" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">텐트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(240,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-46" y="-30" width="92" height="60" rx="4" fill="#ffb454"/><rect x="-6" y="-30" width="12" height="60" fill="#0f1115" fill-opacity=".25"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g><g transform="translate(480,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><circle cx="0" cy="-4" r="26" fill="#7ee7c7"/><rect x="-3" y="20" width="6" height="22" fill="#7ee7c7"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g><g transform="translate(720,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><polygon points="0,-34 38,30 -38,30" fill="#6ea8fe"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g><text x="480" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">같은 크기의 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,290;180,290;260,290;260,290" keyTimes="0.000;0.537;0.662;1.000" dur="15s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><rect x="-46" y="-30" width="92" height="60" rx="4" fill="#ffb454"/><rect x="-6" y="-30" width="12" height="60" fill="#0f1115" fill-opacity=".25"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g></g><g><animateTransform attributeName="transform" type="translate" values="420,290;420,290;500,290;500,290" keyTimes="0.000;0.537;0.662;1.000" dur="15s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><circle cx="0" cy="-4" r="26" fill="#7ee7c7"/><rect x="-3" y="20" width="6" height="22" fill="#7ee7c7"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g></g><g><animateTransform attributeName="transform" type="translate" values="660,290;660,290;740,290;740,290" keyTimes="0.000;0.537;0.662;1.000" dur="15s" repeatCount="indefinite"/><g><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><polygon points="0,-34 38,30 -38,30" fill="#6ea8fe"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g></g><line x1="120" y1="380" x2="860" y2="380" stroke="#3d4b60" stroke-width="4"/><text x="480" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">한 덩어리로 다뤄요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><g transform="translate(400,290)"><rect x="-80" y="-66" width="160" height="132" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g transform="translate(0,12) scale(.8)"><circle cx="0" cy="-4" r="26" fill="#7ee7c7"/><rect x="-3" y="20" width="6" height="22" fill="#7ee7c7"/></g><rect x="-30" y="-82" width="59" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="0" y="-60.24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장</text></g><g transform="translate(640,290)"><rect x="-20" y="-18" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M-11 -18 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><path d="M-34 -42 L34 34" stroke="#ff7b72" stroke-width="6"/></g><text x="400" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">내용은 그대로 보여요</text><text x="640" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">숨기려면 암호화가 따로 필요</text></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">물건은 크기와 모양이 제각각이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자에 담고 송장을 붙이면 같은 단위가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상자 단위로 한꺼번에 옮겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포장했다고 내용물이 숨겨지진 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>