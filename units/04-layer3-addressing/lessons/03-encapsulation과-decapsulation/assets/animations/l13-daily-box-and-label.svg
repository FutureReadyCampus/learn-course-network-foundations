<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상자에 넣고 송장을 붙인다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상자에 넣고 송장을 붙인다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">내용물은 그대로, 겉면 정보로 배달해요</text>
<g><rect x="480" y="250" width="160" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="560" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="340" y="250" width="140" height="80" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="410" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">송장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="326" y="234" width="332" height="112" rx="14" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="440" y="202" width="100" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="490" y="224.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">택배 상자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="410" y1="235" x2="410" y2="213" stroke="#ffb454" stroke-width="3" stroke-dasharray="4 4"/><ellipse cx="410" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="410" cy="190" r="7" fill="#ffb454"/><line x1="670" y1="290" x2="760" y2="290" stroke="#ffb454" stroke-width="4"/><polygon points="760,278 784,290 760,302" fill="#ffb454"/><text x="730" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">다음 방향</text><text x="410" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">내용물은 열지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낼 물건은 책 한 권이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책을 상자에 넣어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">겉면에 받는 곳 송장을 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장만 보고 어디로 보낼지 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>