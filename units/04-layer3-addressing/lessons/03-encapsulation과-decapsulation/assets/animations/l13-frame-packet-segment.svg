<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프레임 안에 패킷, 패킷 안에 세그먼트</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프레임 안에 패킷, 패킷 안에 세그먼트</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">L4 → L3 → L2 순서로 계층마다 헤더를 붙여요</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="180" y="248" width="506" height="144" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="290" y1="248" x2="290" y2="392" stroke="#c792ea" stroke-width="2"/><text x="235" y="327.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프레임 헤더</text><line x1="686" y1="248" x2="686" y2="392" stroke="#c792ea" stroke-width="2"/><rect x="686" y="248" width="100" height="144" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="736" y="327.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">FCS</text><rect x="202" y="232" width="75" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="240" y="253.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">프레임</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="290" y="262" width="384" height="116" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="400" y1="262" x2="400" y2="378" stroke="#6ea8fe" stroke-width="2"/><text x="345" y="327.0" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">IP 헤더</text><rect x="308" y="246" width="83" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="350" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">IP 패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="400" y="276" width="262" height="88" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="510" y1="276" x2="510" y2="364" stroke="#ffb454" stroke-width="2"/><text x="455" y="327.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">TCP 헤더</text><rect x="415" y="260" width="91" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="460" y="281.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">세그먼트</text></g><g><rect x="510" y="290" width="140" height="60" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="580.0" y="329.0" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">‘안녕’ 데이터</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="437" y="197" width="87" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="222.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">데이터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="404" y="197" width="152" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="222.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">세그먼트 완성</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="409" y="197" width="142" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="222.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">IP 패킷 완성</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><rect x="414" y="197" width="132" height="36" rx="18" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="222.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">프레임 완성</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낼 데이터가 가장 안쪽에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L4에서 TCP 헤더를 붙이면 세그먼트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L3에서 IP 헤더를 붙이면 IP 패킷이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite" begin="2s"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">L2에서 헤더와 FCS를 붙이면 프레임이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate begin="2s" attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g><g id="title-intro"><rect x="0" y="0" width="960" height="540" fill="#0f1115"/><g opacity="0"><text x="480" y="288.167" text-anchor="middle" font-size="51.9048" font-weight="750" letter-spacing="-1" fill="#e6e8ec">프레임 안에 패킷, 패킷 안에 세그먼트</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -32;0 -32" keyTimes="0;0.022222;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.094444;0.111111;1" dur="18s" repeatCount="indefinite"/></g></svg>