<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>누가 보느냐에 따라 달라지는 내용물</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">누가 보느냐에 따라 달라지는 내용물</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">중간 상자는 큰 상자 안에서는 내용물이에요</text>
<g><rect x="310" y="220" width="90" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="355" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">송장</text><rect x="400" y="220" width="250" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="525" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">내용물 (작은 상자)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="348" y="144" width="264" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">중간 상자 눈에는 송장 + 내용물</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="180" y="200" width="600" height="110" rx="12" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="180" y="200" width="130" height="110" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="245" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">큰 상자 송장</text><rect x="650" y="200" width="130" height="110" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="715" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">봉인 테이프</text><line x1="310" y1="186" x2="650" y2="186" stroke="#7ee7c7" stroke-width="4"/><line x1="310" y1="186" x2="310" y2="198" stroke="#7ee7c7" stroke-width="4"/><line x1="650" y1="186" x2="650" y2="198" stroke="#7ee7c7" stroke-width="4"/><rect x="375" y="144" width="210" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">큰 상자에는 전부 내용물</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="140" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="215" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">책</text><text x="310" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="330" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="405" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">작은 상자</text><text x="500" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="520" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="595" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">중간 상자</text><text x="690" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="710" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="785" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">큰 상자</text><text x="480" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">보낼 때: 안쪽부터 감싸요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="140" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="215" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">큰 상자</text><text x="310" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="330" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="405" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">중간 상자</text><text x="500" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="520" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="595" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">작은 상자</text><text x="690" y="380" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">→</text><rect x="710" y="350" width="150" height="44" rx="22" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="785" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">책</text><text x="480" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">받을 때: 바깥부터 풀어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 상자는 송장과 내용물로 이뤄져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 상자 눈에는 중간 상자 전체가 내용물이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낼 때는 안쪽 상자부터 감싸요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받을 때는 바깥 상자부터 풀어요</text></g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.240;0.250;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.240;0.250;0.490;0.500;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.490;0.500;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.750;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
