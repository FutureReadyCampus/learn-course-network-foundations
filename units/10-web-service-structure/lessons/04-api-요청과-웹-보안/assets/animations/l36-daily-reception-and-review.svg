<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>접수 안내와 심사실</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">접수 안내와 심사실</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">안내 창구는 편의를, 심사실은 최종 확인을 맡아요</text>
<rect x="40" y="125" width="300" height="190" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">접수 안내 창구</text><rect x="620" y="125" width="300" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="770" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">심사실</text><line x1="345" y1="220" x2="599" y2="220" stroke="#9aa3b2" stroke-width="4"/><polygon points="615,220 591,210 591,230" fill="#9aa3b2"/><text x="480" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">제출</text><g><text x="190" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">빈 칸·글자 수</text><text x="190" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">틀리면 바로 알려 줘요</text><text x="190" y="285" text-anchor="middle" font-size="15" fill="#9aa3b2">사용을 편하게 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="190" y1="315" x2="190" y2="362" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/><line x1="190" y1="362" x2="770" y2="362" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/><line x1="770" y1="362" x2="770" y2="330" stroke="#ffb454" stroke-width="3"/><polygon points="770,316 761,332 779,332" fill="#ffb454"/><text x="480" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">창구를 거치지 않고 직접 낸 서류도 올 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><text x="770" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">길이·범위·필수 항목을</text><text x="770" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">직접 검사해요</text><text x="770" y="285" text-anchor="middle" font-size="15" fill="#9aa3b2">처리를 지키는 경계예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="385" width="400" height="55" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="260" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">양식 칸과 쓴 내용을 분리해요</text><rect x="500" y="385" width="400" height="55" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="2" stroke-dasharray="8 6"/><text x="700" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">받아 적은 말을 지시서에 끼우지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="314" y="398" width="332" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="421.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">보관증 번호도 심사실이 장부와 대조해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 창구는 빈 칸을 바로 알려 줘서 편해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">창구를 거치지 않은 서류도 있어서 심사실이 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양식 칸과 쓴 내용을 섞지 않고 따로 다뤄요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보관증 번호도 심사실이 장부와 대조해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>