<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도서관 창구에서 요청하기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도서관 창구에서 요청하기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 대상으로 어떤 일을 할지 말해요</text>
<rect x="35" y="112" width="150" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">손님</text><rect x="650" y="112" width="190" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="745" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">도서관 창구</text><g><rect x="65" y="178" width="110" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="120" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">조회</text><text x="200" y="202" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">7번 서가의 책</text><line x1="450" y1="195" x2="584" y2="195" stroke="#6ea8fe" stroke-width="4"/><polygon points="600,195 576,185 576,205" fill="#6ea8fe"/><rect x="610" y="179" width="270" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="745" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">읽기(Read): 정보를 보여 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="65" y="254" width="110" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="120" y="276.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">신청</text><text x="200" y="277" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">새 신청서</text><line x1="450" y1="270" x2="584" y2="270" stroke="#ffb454" stroke-width="4"/><polygon points="600,270 576,260 576,280" fill="#ffb454"/><rect x="610" y="254" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="745" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">만들기(Create): 새 처리를 요청해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="330" width="410" height="90" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="265" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서가 번호는 대상, 동작은 따로</text><text x="265" y="395" text-anchor="middle" font-size="15" fill="#9aa3b2">대상은 번호로, 동작은 신청서 종류로</text><rect x="490" y="330" width="410" height="90" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="695" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">서가 번호에 동작 이름을 쓰는 방식</text><text x="695" y="395" text-anchor="middle" font-size="15" fill="#9aa3b2">이런 설계도 볼 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="339" y="436" width="282" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">신청 종류는 도서관 안내문이 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">7번 서가의 책 정보를 보여 달라고 조회해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 신청서를 내서 새 처리를 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">대상은 번호로, 동작은 신청 종류로 나타내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">실제로 어떻게 처리할지는 안내문이 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>