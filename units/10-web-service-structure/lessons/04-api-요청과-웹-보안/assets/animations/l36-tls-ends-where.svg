<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TLS가 어디서 끝나는지 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TLS가 어디서 끝나는지 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">구성에 따라 보호 구간이 달라요</text>
<rect x="20" y="150" width="160" height="66" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="100.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="220" y="150" width="160" height="66" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="300.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">IPS · WAF</text><rect x="440" y="150" width="160" height="66" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="520.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">TLS 처리 장비</text><rect x="720" y="150" width="160" height="66" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="800.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">WAS</text><g><text x="480" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">검사 장비의 종류와 위치는 제품과 구성에 따라 달라요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="146" width="188" height="74" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="60" y="292" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">구성 A</text><line x1="100" y1="300" x2="520" y2="300" stroke="#7ee7c7" stroke-width="10"/><line x1="520" y1="300" x2="800" y2="300" stroke="#ffb454" stroke-width="10"/><text x="310" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">잠김(TLS)</text><text x="660" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">평문일 수 있음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="60" y="372" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">구성 B</text><line x1="100" y1="380" x2="520" y2="380" stroke="#7ee7c7" stroke-width="10"/><line x1="520" y1="380" x2="800" y2="380" stroke="#7ee7c7" stroke-width="10"/><text x="310" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">잠김(TLS)</text><text x="660" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">다시 TLS로 암호화</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="267" y="436" width="426" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">HTTPS 표시만으로 모든 내부 구간을 단정하지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 보안 장비와 TLS 처리 장비를 지날 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비에서 복호화하면 그 뒤 구간은 평문일 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비에서 서버까지 다시 TLS로 암호화하는 구성도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTPS 표시만으로 모든 내부 구간을 단정할 수 없어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>