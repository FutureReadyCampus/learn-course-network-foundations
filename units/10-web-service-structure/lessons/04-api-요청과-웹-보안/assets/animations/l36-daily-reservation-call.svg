<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>식당 예약 전화로 이어 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">식당 예약 전화로 이어 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">로그인 한 번에 지금까지의 흐름이 모두 쓰여요</text>
<rect x="40" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="115.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">손님</text><rect x="220" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="295.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">전화번호부</text><rect x="420" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="495.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">홀</text><rect x="620" y="135" width="140" height="64" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="690.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">주방</text><rect x="790" y="135" width="130" height="64" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="855.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">창고</text><g><line x1="123" y1="245" x2="271" y2="245" stroke="#ffb454" stroke-width="5"/><polygon points="287,245 263,234 263,256" fill="#ffb454"/><text x="205.0" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">주소 찾기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="123" y1="285" x2="471" y2="285" stroke="#6ea8fe" stroke-width="5"/><polygon points="487,285 463,274 463,296" fill="#6ea8fe"/><text x="305.0" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">전화 연결 + 주문</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="503" y1="325" x2="666" y2="325" stroke="#7ee7c7" stroke-width="5"/><polygon points="682,325 658,314 658,336" fill="#7ee7c7"/><text x="592.5" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">주문을 확인해요</text><line x1="698" y1="365" x2="831" y2="365" stroke="#c792ea" stroke-width="5"/><polygon points="847,365 823,354 823,376" fill="#c792ea"/><text x="772.5" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">재료 확인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="840" y1="420" x2="131" y2="420" stroke="#ffb454" stroke-width="5"/><polygon points="115,420 139,409 139,431" fill="#ffb454"/><text x="480" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">완성된 요리 → 손님 식탁에</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="281" y="440" width="398" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="461.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">잠금 가방이 어디서 열리는지에 따라 보호 구간이 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전화번호부에서 식당 번호를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전화를 연결해 주문을 전해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">홀이 받고 주방이 만들며 창고에서 재료를 꺼내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">완성된 요리가 손님 식탁으로 돌아와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>