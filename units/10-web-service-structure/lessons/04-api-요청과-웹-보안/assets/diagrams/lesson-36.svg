<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 660" role="group" aria-labelledby="lesson-36-flow-title lesson-36-flow-desc" lang="ko" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title id="lesson-36-flow-title">로그인 요청 한 건으로 보는 WAS와 API 구조</title>
<desc id="lesson-36-flow-desc">브라우저의 로그인 요청이 보안 장비, 웹 서버, WAS, DB를 지나 응답으로 돌아오는 길과, 이 Lesson의 일곱 페이지가 그 길의 어느 부분을 다루는지 보여 줍니다.</desc>
<rect width="1120" height="660" fill="#0f1115"/>
<defs><marker id="l36-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#7ee7c7" stroke-width="1.8"/></marker><marker id="l36-arr-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#ffb454" stroke-width="1.8"/></marker></defs>
<text x="560" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">로그인 요청 한 건이 지나가는 길</text>
<rect x="40" y="100" width="170" height="86" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="125.0" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">브라우저</text><text x="125.0" y="168" text-anchor="middle" font-size="15" fill="#9aa3b2">화면과 입력</text>
<rect x="250" y="100" width="200" height="86" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="350.0" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">보안 장비 · TLS 처리</text><text x="350.0" y="168" text-anchor="middle" font-size="15" fill="#9aa3b2">IPS·WAF, HTTPS 종료 지점</text>
<rect x="500" y="100" width="190" height="86" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="595.0" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">웹 서버</text><text x="595.0" y="168" text-anchor="middle" font-size="15" fill="#9aa3b2">요청을 접수해요</text>
<rect x="730" y="100" width="170" height="86" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="815.0" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">WAS</text><text x="815.0" y="168" text-anchor="middle" font-size="15" fill="#9aa3b2">로그인 규칙을 실행해요</text>
<rect x="930" y="100" width="150" height="86" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="1005.0" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">DB</text><text x="1005.0" y="168" text-anchor="middle" font-size="15" fill="#9aa3b2">계정 자료</text>
<path d="M214 132 H246" stroke="#7ee7c7" stroke-width="3" fill="none" marker-end="url(#l36-arr)"/>
<path d="M454 132 H496" stroke="#7ee7c7" stroke-width="3" fill="none" marker-end="url(#l36-arr)"/>
<path d="M694 132 H726" stroke="#7ee7c7" stroke-width="3" fill="none" marker-end="url(#l36-arr)"/>
<path d="M904 132 H926" stroke="#7ee7c7" stroke-width="3" fill="none" marker-end="url(#l36-arr)"/>
<path d="M1005 192 V222 H125 V196" stroke="#ffb454" stroke-width="3" fill="none" marker-end="url(#l36-arr-o)"/>
<text x="560" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">응답: HTML 문서 또는 JSON 자료 → 브라우저가 화면으로</text>
<text x="560" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">이 Lesson의 일곱 페이지가 길의 어느 곳을 다루는지</text>
<rect x="40" y="308" width="500" height="64" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><circle cx="74" cy="340" r="20" fill="#7ee7c7"/><text x="74" y="348" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">1</text><text x="110" y="337" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">세 단으로 나눠 느린 곳 찾기</text><text x="110" y="359" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 웹 서버 · WAS · DB</text>
<rect x="580" y="308" width="500" height="64" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><circle cx="614" cy="340" r="20" fill="#ffb454"/><text x="614" y="348" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">2</text><text x="650" y="337" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">WAS 안의 JVM과 Servlet 컨테이너</text><text x="650" y="359" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: WAS</text>
<rect x="40" y="384" width="500" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><circle cx="74" cy="416" r="20" fill="#6ea8fe"/><text x="74" y="424" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">3</text><text x="110" y="413" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">서버는 자료, 브라우저는 화면</text><text x="110" y="435" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 응답 → 브라우저</text>
<rect x="580" y="384" width="500" height="64" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><circle cx="614" cy="416" r="20" fill="#6ea8fe"/><text x="614" y="424" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">4</text><text x="650" y="413" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">API: URI와 메서드로 요청</text><text x="650" y="435" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 브라우저 → 서버</text>
<rect x="40" y="460" width="500" height="64" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><circle cx="74" cy="492" r="20" fill="#ffb454"/><text x="74" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">5</text><text x="110" y="489" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">보안 장비와 HTTPS 보호 구간</text><text x="110" y="511" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 보안 장비 · TLS 처리</text>
<rect x="580" y="460" width="500" height="64" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="2"/><circle cx="614" cy="492" r="20" fill="#c792ea"/><text x="614" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">6</text><text x="650" y="489" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">입력은 브라우저와 서버에서 각각 확인</text><text x="650" y="511" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 브라우저 + WAS</text>
<rect x="310" y="536" width="500" height="64" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><circle cx="344" cy="568" r="20" fill="#9aa3b2"/><text x="344" y="576" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">7</text><text x="380" y="565" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">로그인 요청으로 흐름 연결</text><text x="380" y="587" text-anchor="start" font-size="15" fill="#9aa3b2">다루는 곳: 처음부터 끝까지</text>
<text x="560" y="645" text-anchor="middle" font-size="17" fill="#9aa3b2">식당에 빗대면 웹 서버는 홀, WAS는 주방, DB는 창고예요</text>
</svg>
