<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>WAS가 DB에 묻고 응답을 만들어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">WAS가 DB에 묻고 응답을 만들어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">DB는 계정 같은 자료를 저장하고 조회해요</text>
<rect x="40" y="175" width="150" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="115.0" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="270" y="175" width="150" height="70" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="345.0" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">웹 서버</text><rect x="500" y="175" width="150" height="70" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="575.0" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">WAS</text><rect x="730" y="175" width="150" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="805.0" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">DB</text><rect x="580" y="335" width="350" height="100" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="2"/><text x="598" y="365" text-anchor="start" font-size="14" font-weight="600" fill="#9aa3b2">사용자 ID</text><text x="700" y="365" text-anchor="start" font-size="14" font-weight="600" fill="#9aa3b2">비밀번호 확인값</text><text x="830" y="365" text-anchor="start" font-size="14" font-weight="600" fill="#9aa3b2">계정 상태</text><text x="598" y="400" text-anchor="start" font-size="14" font-weight="600" fill="#e6e8ec">tester</text><text x="700" y="400" text-anchor="start" font-size="14" font-weight="600" fill="#e6e8ec">(원문이 아닌 값)</text><text x="830" y="400" text-anchor="start" font-size="14" font-weight="600" fill="#e6e8ec">사용 중</text><g><line x1="198" y1="195" x2="246" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="262,195 238,184 238,206" fill="#6ea8fe"/><text x="230.0" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#6ea8fe">요청</text><line x1="428" y1="195" x2="476" y2="195" stroke="#7ee7c7" stroke-width="5"/><polygon points="492,195 468,184 468,206" fill="#7ee7c7"/><text x="460.0" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee7c7">넘김</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="658" y1="195" x2="706" y2="195" stroke="#ffb454" stroke-width="5"/><polygon points="722,195 698,184 698,206" fill="#ffb454"/><text x="690.0" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">계정 조회</text><rect x="576" y="331" width="358" height="108" rx="10" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="738" y1="230" x2="658" y2="230" stroke="#c792ea" stroke-width="5"/><polygon points="642,230 666,219 666,241" fill="#c792ea"/><text x="690.0" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#c792ea">결과</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="570" y1="300" x2="136" y2="300" stroke="#ffb454" stroke-width="5"/><polygon points="120,300 144,289 144,311" fill="#ffb454"/><text x="345" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">성공 또는 실패 응답</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로그인 요청이 웹 서버를 거쳐 WAS에 넘어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">WAS가 DB에 계정 정보를 조회해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DB가 계정 정보나 없음을 돌려줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">WAS가 성공 또는 실패 응답을 만들어 돌려보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>