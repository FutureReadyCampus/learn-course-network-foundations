<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>홀, 주방, 창고의 역할</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">홀, 주방, 창고의 역할</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 사람이 겸임할 수도 있고 나눌 수도 있어요</text>
<rect x="40" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="125.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">손님</text><rect x="270" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="355.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">홀</text><text x="355.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">주문을 받아요</text><rect x="500" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="585.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">주방</text><text x="585.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">요리를 만들어요</text><rect x="730" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="815.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">창고</text><text x="815.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">재료를 보관해요</text><g><line x1="210" y1="180" x2="254" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="270,180 246,171 246,189" fill="#9aa3b2"/><line x1="440" y1="180" x2="484" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="500,180 476,171 476,189" fill="#9aa3b2"/><line x1="670" y1="180" x2="714" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="730,180 706,171 706,189" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="278" y="240" width="155" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="355" y="260.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">메뉴판은 바로 줘요</text><rect x="613" y="240" width="174" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="260.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">요리는 주방 → 창고로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="250" y="285" width="470" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="485" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">한 사람이 겸임</text><rect x="270" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="337.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">홀</text><rect x="420" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="487.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">주방</text><rect x="570" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="637.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">창고</text><rect x="297" y="424" width="375" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="485" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">작은 서비스는 한 곳에서 여러 역할을 맡기도 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="150" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">홀 담당</text><text x="250" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">홀</text><rect x="400" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">주방 담당</text><text x="500" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">주방</text><rect x="650" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="750" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">창고 담당</text><text x="750" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">창고</text><rect x="326" y="424" width="319" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="485" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">서비스가 커지면 역할별로 나눌 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님 주문은 홀이 받고 주방과 창고가 도와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메뉴판은 홀이 바로 주고 요리는 주방이 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 가게는 한 사람이 여러 일을 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 가게는 역할마다 담당을 나눠요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>