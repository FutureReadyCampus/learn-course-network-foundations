<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">로그인 요청이 브라우저에서 DB까지 가는 길</title>
  <desc id="desc">브라우저가 네트워크를 통해 웹 서버에 요청하고, 웹 서버가 WAS에 넘긴다. WAS는 DB를 조회하고 결과를 받아 응답을 만든 뒤 브라우저로 돌려보낸다. 요청과 응답의 경로를 보여 주는 논리 구조 예시다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#355070"/></marker>
    <marker id="arrowBack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ad6a22"/></marker>
  </defs>
  <rect width="1120" height="630" fill="#fbfcfe"/>
  <text x="560" y="54" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#17212f">로그인 요청은 서버 안에서 어떻게 처리될까?</text>
  <text x="560" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#536273">실제 배포에서는 여러 역할이 한 장비에 함께 있을 수도 있어요</text>
  <rect x="54" y="164" width="205" height="174" rx="20" fill="#eaf2ff" stroke="#4076ba" stroke-width="3"/>
  <text x="156" y="218" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1f4775">브라우저</text>
  <text x="156" y="257" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#30455f">로그인 입력</text>
  <text x="156" y="287" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#30455f">요청 전송 · 응답 표시</text>
  <rect x="318" y="164" width="174" height="174" rx="20" fill="#edf7f4" stroke="#36947b" stroke-width="3"/>
  <text x="405" y="218" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#236b59">웹 서버</text>
  <text x="405" y="257" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#36594f">요청 받기</text>
  <text x="405" y="287" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#36594f">정적 파일 응답</text>
  <rect x="556" y="164" width="190" height="174" rx="20" fill="#f5eefb" stroke="#8964ad" stroke-width="3"/>
  <text x="651" y="218" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#68458a">WAS</text>
  <text x="651" y="257" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#59466b">로그인 처리</text>
  <text x="651" y="287" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#59466b">응답 만들기</text>
  <rect x="810" y="164" width="245" height="174" rx="20" fill="#fff4e6" stroke="#c98732" stroke-width="3"/>
  <text x="932" y="218" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#895316">데이터베이스</text>
  <text x="932" y="257" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6c542f">계정 자료 저장</text>
  <text x="932" y="287" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6c542f">필요한 정보 조회</text>
  <path d="M260 208 H310 M493 208 H548 M747 208 H802" fill="none" stroke="#355070" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="286" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#355070">요청</text>
  <text x="520" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#355070">처리 요청</text>
  <text x="775" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#355070">조회</text>
  <path d="M810 294 H756 M556 294 H502 M318 294 H267" fill="none" stroke="#ad6a22" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrowBack)"/>
  <text x="932" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ad6a22">조회 결과</text>
  <text x="651" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ad6a22">응답</text>
  <text x="405" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ad6a22">HTTP 응답</text>
  <rect x="145" y="432" width="830" height="115" rx="18" fill="#f1f4f8" stroke="#c8d1dc" stroke-width="2"/>
  <text x="560" y="472" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#27384b">각 역할이 하는 일</text>
  <text x="560" y="510" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#41546b">브라우저는 요청·화면 · 웹 서버는 요청 접수 · WAS는 애플리케이션 처리 · DB는 자료 보관</text>
</svg>
