<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>세션 ID로 로그인 상태 잇기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">세션 ID로 로그인 상태 잇기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">쿠키는 표식, 세션은 서버가 보관하는 상태예요</text>
<rect x="65" y="112" width="170" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="150" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">브라우저</text><rect x="475" y="112" width="170" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="560" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버</text><line x1="150" y1="150" x2="150" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="560" y1="150" x2="560" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="158" y1="195" x2="536" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="552,195 528,184 528,206" fill="#6ea8fe"/><text x="355.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">로그인 요청</text><text x="555" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">자격을 확인해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="568" y1="195" x2="158" y2="195" stroke="#7ee7c7" stroke-width="5"/><polygon points="142,195 166,184 166,206" fill="#7ee7c7"/><text x="355.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Set-Cookie: 세션 ID</text><rect x="650" y="200" width="280" height="140" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="790" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">세션 저장소</text><text x="670" y="268" text-anchor="start" font-size="15" fill="#9aa3b2">세션 ID a1b2c3</text><text x="670" y="296" text-anchor="start" font-size="15" font-weight="600" fill="#e6e8ec">→ 로그인 확인함</text><rect x="40" y="270" width="215" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="147" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">쿠키(보관)</text><text x="147" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">a1b2c3</text><rect x="670" y="350" width="240" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">서버가 세션 생성</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="158" y1="195" x2="536" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="552,195 528,184 528,206" fill="#6ea8fe"/><text x="355.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">Cookie: 세션 ID</text><rect x="650" y="200" width="280" height="140" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="790" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">세션 저장소</text><text x="670" y="268" text-anchor="start" font-size="15" fill="#9aa3b2">세션 ID a1b2c3</text><text x="670" y="296" text-anchor="start" font-size="15" font-weight="600" fill="#e6e8ec">→ 로그인 확인함</text><rect x="40" y="270" width="215" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="147" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">쿠키(보관)</text><text x="147" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">a1b2c3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="568" y1="195" x2="158" y2="195" stroke="#7ee7c7" stroke-width="5"/><polygon points="142,195 166,184 166,206" fill="#7ee7c7"/><text x="355.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">응답</text><rect x="650" y="200" width="280" height="140" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="790" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">세션 저장소</text><text x="670" y="268" text-anchor="start" font-size="15" fill="#9aa3b2">세션 ID a1b2c3</text><text x="670" y="296" text-anchor="start" font-size="15" font-weight="600" fill="#e6e8ec">→ 로그인 확인함</text><rect x="651" y="246" width="278" height="64" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="40" y="270" width="215" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="147" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">쿠키(보관)</text><text x="147" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">a1b2c3</text><rect x="670" y="350" width="240" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="790" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">ID로 세션을 찾아요</text><text x="480" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">쿠키는 브라우저가 보내는 표식, 세션은 서버가 보관하는 상태</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로그인 요청이 오면 서버가 자격을 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 세션을 만들고 ID를 쿠키로 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 다음 요청에 세션 ID를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 ID로 자신이 보관한 세션을 찾아 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>