<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTP는 요청을 자동으로 기억하지 않아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTP는 요청을 자동으로 기억하지 않아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">쿠키는 브라우저가 보내는 표식이에요</text>
<rect x="85" y="112" width="170" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">브라우저</text><rect x="705" y="112" width="170" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버</text><line x1="170" y1="150" x2="170" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="790" y1="150" x2="790" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="195" x2="766" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,195 758,184 758,206" fill="#6ea8fe"/><text x="480.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">POST /login</text><line x1="798" y1="245" x2="178" y2="245" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,245 186,234 186,256" fill="#7ee7c7"/><text x="480.0" y="233" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">로그인 확인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="195" x2="766" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,195 758,184 758,206" fill="#6ea8fe"/><text x="480.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">GET /next</text><circle cx="790" cy="250" r="16" fill="#ffb454"/><text x="790" y="257" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">이전 요청의 내용이 자동으로 붙지 않아요</text><rect x="170" y="360" width="620" height="50" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">TCP 연결이 이어져 있어도 HTTP가 기억하는 것은 아니에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="798" y1="195" x2="178" y2="195" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,195 186,184 186,206" fill="#7ee7c7"/><text x="480.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Set-Cookie: (식별 표식)</text><rect x="60" y="250" width="220" height="50" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">브라우저가 보관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="195" x2="766" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,195 758,184 758,206" fill="#6ea8fe"/><text x="480.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">Cookie: (식별 표식)</text><rect x="500" y="250" width="290" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="645" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">표식으로 요청을 구별해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로그인 요청을 보내고 서버가 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 요청에는 앞의 내용이 자동으로 붙지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 Set-Cookie로 표식을 저장하라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 다음 요청에 Cookie를 실어 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>