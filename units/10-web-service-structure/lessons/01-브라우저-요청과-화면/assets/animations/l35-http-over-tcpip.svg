<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTP 요청과 TCP/IP 전달</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTP 요청과 TCP/IP 전달</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청의 의미와 전달은 서로 다른 층이에요</text>
<rect x="96" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="104" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="86,312 174,312 182,324 78,324" fill="#6ea8fe"/><text x="130" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="796" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="804" y="271" width="52" height="32" fill="#3d4b60"/><rect x="825" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="808" y="320" width="44" height="5" fill="#6ea8fe"/><text x="830" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="330" y="215" width="300" height="170" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">네트워크 (TCP/IP)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(250,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">GET /login</text></g><rect x="168" y="344" width="164" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="250" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">HTTP: 요청의 의미</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(250,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">GET /login</text><rect x="-98" y="-40" width="196" height="80" rx="8" fill="none" stroke="#6ea8fe" stroke-width="3"/></g><rect x="158" y="344" width="183" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">TCP/IP: 데이터 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,300;250,300;480,300;700,300;700,300" keyTimes="0.000;0.525;0.613;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">GET /login</text><rect x="-98" y="-40" width="196" height="80" rx="8" fill="none" stroke="#6ea8fe" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">의미(HTTP)와 전달(TCP/IP)은 서로 다른 층이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g transform="translate(700,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">GET /login</text></g><rect x="603" y="344" width="194" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">서버가 요청으로 읽어요</text><line x1="740" y1="425" x2="216" y2="425" stroke="#7ee7c7" stroke-width="5"/><polygon points="200,425 224,414 224,436" fill="#7ee7c7"/><text x="480" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">응답</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 GET /login 요청을 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP/IP가 그 요청을 데이터로 감싸 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">네트워크가 요청을 서버까지 날라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 요청을 읽고 응답을 돌려보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>