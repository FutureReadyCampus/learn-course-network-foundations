<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이름 찾기, 연결, 요청, 응답</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이름 찾기, 연결, 요청, 응답</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">네 걸음은 서로 다른 일이에요</text>
<rect x="95" y="112" width="150" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">브라우저</text><rect x="405" y="112" width="150" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">DNS</text><rect x="715" y="112" width="150" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">웹 서버</text><line x1="170" y1="150" x2="170" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="480" y1="150" x2="480" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="790" y1="150" x2="790" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g><line x1="178" y1="190" x2="456" y2="190" stroke="#ffb454" stroke-width="5"/><polygon points="472,190 448,179 448,201" fill="#ffb454"/><text x="325.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">shop.example의 IP는?</text><line x1="488" y1="235" x2="178" y2="235" stroke="#ffb454" stroke-width="5"/><polygon points="162,235 186,224 186,246" fill="#ffb454"/><text x="325.0" y="223" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">IP 주소 203.0.113.10 (예시)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="295" x2="766" y2="295" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,295 758,284 758,306" fill="#6ea8fe"/><text x="480.0" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">TCP 연결 준비: IP + 포트 443 (예시)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="350" x2="766" y2="350" stroke="#7ee7c7" stroke-width="5"/><polygon points="782,350 758,339 758,361" fill="#7ee7c7"/><text x="480.0" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">GET /login</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="798" y1="405" x2="178" y2="405" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,405 186,394 186,416" fill="#7ee7c7"/><text x="480.0" y="393" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">응답: 상태 코드 · 헤더 · 본문(HTML)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS가 사이트 이름에 맞는 IP 주소를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버와 요청을 주고받을 TCP 통로를 마련해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 GET /login 요청을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 HTTP 응답으로 HTML을 돌려줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>