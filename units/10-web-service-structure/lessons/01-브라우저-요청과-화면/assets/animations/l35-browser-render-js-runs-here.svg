<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>브라우저가 읽고 그리고 실행해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">브라우저가 읽고 그리고 실행해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">다운로드한 곳과 실행되는 곳은 달라요</text>
<rect x="40" y="140" width="220" height="260" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="150" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버</text><rect x="330" y="140" width="590" height="260" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="625" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">브라우저</text><rect x="65" y="195" width="170" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="150.0" y="223.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">HTML</text><rect x="65" y="257" width="170" height="46" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="150.0" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">CSS</text><rect x="65" y="319" width="170" height="46" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="150.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">JavaScript</text><rect x="350" y="185" width="175" height="50" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="437" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">HTML 읽기</text><rect x="540" y="185" width="175" height="50" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="627" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">CSS 적용</text><rect x="730" y="185" width="175" height="50" rx="8" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="817" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">화면 그리기</text><g><line x1="245" y1="295" x2="319" y2="295" stroke="#9aa3b2" stroke-width="4"/><polygon points="335,295 311,285 311,305" fill="#9aa3b2"/><rect x="254" y="246" width="72" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="290" y="267.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="181" width="183" height="58" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="536" y="181" width="183" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="726" y="181" width="183" height="58" rx="10" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="270" width="290" height="110" rx="10" fill="#171a21" stroke="#e6e8ec" stroke-width="2"/><text x="495" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">상품 목록</text><rect x="430" y="330" width="130" height="36" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="495.0" y="353.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">로그인 버튼</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="326" width="138" height="44" rx="10" fill="none" stroke="#c792ea" stroke-width="5"/><text x="780" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">안내 문구 표시</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="660" y="320" width="245" height="60" rx="10" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="782" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">내려받은 곳이 아니라</text><text x="782" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">브라우저에서 실행돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="335" y1="380" x2="261" y2="380" stroke="#7ee7c7" stroke-width="4"/><polygon points="245,380 269,370 269,390" fill="#7ee7c7"/><rect x="188" y="400" width="203" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="290" y="420.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">그림 같은 자원도 요청해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 HTML, CSS, JavaScript 자원을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 HTML을 읽고 CSS를 적용해 화면을 그려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">JavaScript는 서버가 아니라 브라우저에서 실행돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이미지 같은 외부 자원도 브라우저가 요청해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>