<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>완성품 배달과 밀키트 배달</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">완성품 배달과 밀키트 배달</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누가 마지막 조립을 하는지가 달라요</text>
<g><rect x="25" y="174" width="170" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">완성품 배달</text><rect x="230" y="150" width="140" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="300.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">재료 업체</text><line x1="375" y1="190" x2="479" y2="190" stroke="#6ea8fe" stroke-width="5"/><polygon points="495,190 471,179 471,201" fill="#6ea8fe"/><text x="435" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">완성된 요리</text><rect x="500" y="150" width="150" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="575.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">내 주방</text><line x1="655" y1="190" x2="694" y2="190" stroke="#6ea8fe" stroke-width="5"/><polygon points="710,190 686,179 686,201" fill="#6ea8fe"/><rect x="715" y="150" width="205" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="817.5" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">식탁</text><text x="817.5" y="214" text-anchor="middle" font-size="14" fill="#9aa3b2">그대로 차려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="25" y="304" width="170" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">밀키트 배달</text><rect x="230" y="280" width="140" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="300.0" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">재료 업체</text><line x1="375" y1="320" x2="479" y2="320" stroke="#7ee7c7" stroke-width="5"/><polygon points="495,320 471,309 471,331" fill="#7ee7c7"/><text x="435" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">재료와 조리법</text><rect x="500" y="280" width="150" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="575.0" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">내 주방</text><line x1="655" y1="320" x2="694" y2="320" stroke="#7ee7c7" stroke-width="5"/><polygon points="710,320 686,309 686,331" fill="#7ee7c7"/><rect x="715" y="280" width="205" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="817.5" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">식탁</text><text x="817.5" y="344" text-anchor="middle" font-size="14" fill="#9aa3b2">내 식탁에서 조립해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="372" y="384" width="215" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">두 방식 모두 널리 쓰여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">내 식탁에서 조리법을 바꿔도 업체의 재료 가격은 그대로예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">완성된 요리를 받아 그대로 차릴 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재료와 조리법을 받아 내 식탁에서 조립할 수도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 방법 모두 가게마다 널리 쓰여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 식탁에서 바꿔도 업체의 실제 가격은 그대로예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>