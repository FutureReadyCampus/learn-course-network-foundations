<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>메뉴판의 내용과 모양</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">메뉴판의 내용과 모양</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 내용도 모양 규칙에 따라 달라 보여요</text>
<rect x="40" y="140" width="250" height="250" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="165" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">메뉴판 내용</text><text x="60" y="230" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">불고기 8,000원</text><text x="60" y="275" text-anchor="start" font-size="18" font-weight="600" fill="#e6e8ec">비빔밥 7,000원</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="190" width="260" height="150" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="460" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">모양 규칙 A</text><text x="460" y="280" text-anchor="middle" font-size="17" fill="#e6e8ec">제목: 크게 · 빨강</text><line x1="295" y1="265" x2="319" y2="265" stroke="#9aa3b2" stroke-width="3"/><polygon points="335,265 311,256 311,274" fill="#9aa3b2"/><line x1="595" y1="265" x2="619" y2="265" stroke="#9aa3b2" stroke-width="3"/><polygon points="635,265 611,256 611,274" fill="#9aa3b2"/><rect x="640" y="140" width="280" height="250" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="780" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">완성된 메뉴판</text><text x="780" y="235" text-anchor="middle" font-size="34" font-weight="700" fill="#ff7b72">불고기 8,000원</text><text x="780" y="300" text-anchor="middle" font-size="18" font-weight="500" fill="#e6e8ec">비빔밥 7,000원</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="190" width="260" height="150" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="460" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">모양 규칙 B</text><text x="460" y="280" text-anchor="middle" font-size="17" fill="#e6e8ec">제목: 작게 · 검정</text><line x1="295" y1="265" x2="319" y2="265" stroke="#9aa3b2" stroke-width="3"/><polygon points="335,265 311,256 311,274" fill="#9aa3b2"/><line x1="595" y1="265" x2="619" y2="265" stroke="#9aa3b2" stroke-width="3"/><polygon points="635,265 611,256 611,274" fill="#9aa3b2"/><rect x="640" y="140" width="280" height="250" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="780" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">완성된 메뉴판</text><text x="780" y="235" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">불고기 8,000원</text><text x="780" y="300" text-anchor="middle" font-size="18" font-weight="500" fill="#e6e8ec">비빔밥 7,000원</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="136" width="258" height="258" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="165" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">내용은 그대로예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="305" y="423" width="349" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">모양만으로 없던 내용이 생기지는 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메뉴판에는 음식 이름과 가격이 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모양 규칙 A를 입히면 제목이 크고 빨갛게 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모양 규칙 B로 바꿔도 내용은 그대로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모양만으로 없던 메뉴가 생기지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>