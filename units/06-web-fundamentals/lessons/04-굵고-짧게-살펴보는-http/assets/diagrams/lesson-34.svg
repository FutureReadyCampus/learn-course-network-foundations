<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 500" role="group" aria-labelledby="lesson-34-basic-export-title lesson-34-basic-export-desc" lang="ko"><title id="lesson-34-basic-export-title">굵고 짧게 살펴보는 HTTP · 학습 흐름</title><desc id="lesson-34-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-34-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-34-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/><path d="M977.0 288 V312.0 H143.0 V332"/></g><a href="../lesson-34.html#concept-basic-34-01" target="_top" aria-label="HTTP와 TCP Stream 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">HTTP와 TCP Stream</tspan></text></a><a href="../lesson-34.html#concept-basic-34-02" target="_top" aria-label="HTTP 메시지를 해석하는 규칙 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">HTTP 메시지를</tspan><tspan x="421.0" dy="25">해석하는 규칙</tspan></text></a><a href="../lesson-34.html#concept-basic-34-03" target="_top" aria-label="Request와 Response 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">Request와 Response</tspan></text></a><a href="../lesson-34.html#concept-basic-34-04" target="_top" aria-label="실제 HTTP 트래픽 읽기 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">실제 HTTP 트래픽</tspan><tspan x="977.0" dy="25">읽기</tspan></text></a><a href="../lesson-34.html#concept-basic-34-05" target="_top" aria-label="요청 Header에 담긴 정보 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">요청 Header에 담긴</tspan><tspan x="143.0" dy="25">정보</tspan></text></a><a href="../lesson-34.html#concept-basic-34-06" target="_top" aria-label="응답 Header와 Cookie 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">응답 Header와 Cookie</tspan></text></a><a href="../lesson-34.html#concept-basic-34-07" target="_top" aria-label="HTTP 응답 코드 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">HTTP 응답 코드</tspan></text></a><a href="../lesson-34.html#concept-basic-34-08" target="_top" aria-label="GET·POST 등 Method 설명으로 이동"><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">GET·POST 등 Method</tspan></text></a><a href="../lesson-34.html#concept-basic-34-09" target="_top" aria-label="웹 서비스 구조로 이어가기 설명으로 이동"><rect x="18" y="336" width="250" height="112" rx="10"/><text x="143.0" y="374" text-anchor="middle"><tspan x="143.0" dy="0">웹 서비스 구조로</tspan><tspan x="143.0" dy="25">이어가기</tspan></text></a></svg>
