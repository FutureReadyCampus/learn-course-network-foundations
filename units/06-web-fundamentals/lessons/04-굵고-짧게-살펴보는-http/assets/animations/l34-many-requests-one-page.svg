<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Request와 Response</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Request와 Response</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">페이지 하나에도 요청이 여러 번 생길 수 있어요</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="816" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="261" width="52" height="32" fill="#3d4b60"/><rect x="845" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="310" width="44" height="5" fill="#6ea8fe"/><text x="850" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g><line x1="178" y1="170" x2="766" y2="170" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,170 758,159 758,181" fill="#6ea8fe"/><text x="480.0" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">Request: GET /example-page HTTP/1.1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="798" y1="220" x2="178" y2="220" stroke="#ffb454" stroke-width="5"/><polygon points="162,220 186,209 186,231" fill="#ffb454"/><text x="480.0" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">Response: HTTP/1.1 200 OK + HTML</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">Request는 클라이언트 → 서버, Response는 서버 → 클라이언트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="300" x2="384" y2="300" stroke="#c792ea" stroke-width="3"/><polygon points="400,300 376,291 376,309" fill="#c792ea"/><text x="290" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">GET /logo.png</text><line x1="780" y1="300" x2="576" y2="300" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,300 584,291 584,309" fill="#7ee7c7"/><text x="670" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="345" x2="384" y2="345" stroke="#c792ea" stroke-width="3"/><polygon points="400,345 376,336 376,354" fill="#c792ea"/><text x="290" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">GET /style.css</text><line x1="780" y1="345" x2="576" y2="345" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,345 584,336 584,354" fill="#7ee7c7"/><text x="670" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="390" x2="384" y2="390" stroke="#c792ea" stroke-width="3"/><polygon points="400,390 376,381 376,399" fill="#c792ea"/><text x="290" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">GET /app.js</text><line x1="780" y1="390" x2="576" y2="390" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,390 584,381 584,399" fill="#7ee7c7"/><text x="670" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="438" width="320" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">페이지 하나에도 요청이 여러 번 생겨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 GET /example-page 요청을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 200 OK와 HTML 문서로 응답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이미지, CSS, JavaScript도 각각 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">페이지 하나에도 메시지가 여러 번 오가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>