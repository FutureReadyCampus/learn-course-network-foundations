<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTP Method</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTP Method</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청이 원하는 일을 표준 이름으로 나타내요</text>
<rect x="56" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="46,312 134,312 142,324 38,324" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="836" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="271" width="52" height="32" fill="#3d4b60"/><rect x="865" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="848" y="320" width="44" height="5" fill="#6ea8fe"/><text x="870" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g><rect x="170" y="155" width="170" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="255.0" y="183.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">GET</text><line x1="345" y1="177" x2="774" y2="177" stroke="#6ea8fe" stroke-width="3"/><polygon points="790,177 766,168 766,186" fill="#6ea8fe"/><text x="565" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">자원 조회</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="170" y="225" width="170" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="253.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">POST</text><line x1="345" y1="247" x2="774" y2="247" stroke="#7ee7c7" stroke-width="3"/><polygon points="790,247 766,238 766,256" fill="#7ee7c7"/><text x="565" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">정보 제출 (로그인 양식)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="170" y="295" width="170" height="44" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="255.0" y="323.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">HEAD</text><line x1="345" y1="317" x2="774" y2="317" stroke="#9aa3b2" stroke-width="3"/><polygon points="790,317 766,308 766,326" fill="#9aa3b2"/><text x="565" y="307" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">본문 없이 헤더만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="170" y="365" width="170" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="255.0" y="393.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">PUT · DELETE</text><line x1="345" y1="387" x2="774" y2="387" stroke="#ffb454" stroke-width="3"/><polygon points="790,387 766,378 766,396" fill="#ffb454"/><text x="565" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">만들기·바꾸기 · 삭제</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="166" y="151" width="178" height="52" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="166" y="221" width="178" height="52" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="440" width="398" height="31" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">다른 사람의 서버에 바꾸는 요청을 함부로 보내지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">GET은 자원을 조회할 때 주로 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">POST는 로그인처럼 정보를 제출할 때 흔히 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HEAD, PUT, DELETE도 각자 원하는 일을 나타내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">실제 동작은 서버와 표준 규칙이 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>