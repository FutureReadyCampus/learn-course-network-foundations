<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주문하면 가게가 답해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주문하면 가게가 답해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 번 방문에도 주문은 여러 번일 수 있어요</text>
<circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><polygon points="810,264 850,230 890,264" fill="#9aa3b2"/><rect x="818" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="284" width="18" height="28" fill="#3d4b60"/><text x="850" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한빛분식</text><g><line x1="178" y1="170" x2="766" y2="170" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,170 758,159 758,181" fill="#6ea8fe"/><text x="480.0" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">떡볶이 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="798" y1="220" x2="178" y2="220" stroke="#ffb454" stroke-width="5"/><polygon points="162,220 186,209 186,231" fill="#ffb454"/><text x="480.0" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">주문 완료 + 떡볶이</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">요청은 손님 → 가게, 응답은 가게 → 손님</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="180" y1="300" x2="384" y2="300" stroke="#c792ea" stroke-width="3"/><polygon points="400,300 376,291 376,309" fill="#c792ea"/><text x="290" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">단무지 주세요</text><line x1="780" y1="300" x2="576" y2="300" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,300 584,291 584,309" fill="#7ee7c7"/><text x="670" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="180" y1="345" x2="384" y2="345" stroke="#c792ea" stroke-width="3"/><polygon points="400,345 376,336 376,354" fill="#c792ea"/><text x="290" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">음료 주세요</text><line x1="780" y1="345" x2="576" y2="345" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,345 584,336 584,354" fill="#7ee7c7"/><text x="670" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="180" y1="390" x2="384" y2="390" stroke="#c792ea" stroke-width="3"/><polygon points="400,390 376,381 376,399" fill="#c792ea"/><text x="290" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">수저 주세요</text><line x1="780" y1="390" x2="576" y2="390" stroke="#7ee7c7" stroke-width="3"/><polygon points="560,390 584,381 584,399" fill="#7ee7c7"/><text x="670" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="317" y="438" width="325" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">가게에 한 번 가도 주문은 여러 번이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님이 가게에 떡볶이를 주문해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게가 주문을 처리해 떡볶이를 내줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">단무지, 음료, 수저도 따로따로 부탁해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 번 방문에도 주문과 답이 여러 번 오가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>