<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>부탁의 종류</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">부탁의 종류</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보기, 제출, 바꾸기처럼 원하는 일이 달라요</text>
<circle cx="90" cy="270" r="16" fill="#6ea8fe"/><rect x="72" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="90" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><polygon points="830,264 870,230 910,264" fill="#9aa3b2"/><rect x="838" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="861" y="284" width="18" height="28" fill="#3d4b60"/><text x="870" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한빛분식</text><g><rect x="170" y="155" width="170" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="255.0" y="183.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">보기</text><line x1="345" y1="177" x2="774" y2="177" stroke="#6ea8fe" stroke-width="3"/><polygon points="790,177 766,168 766,186" fill="#6ea8fe"/><text x="565" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">메뉴판 보여 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="225" width="170" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="253.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">제출</text><line x1="345" y1="247" x2="774" y2="247" stroke="#7ee7c7" stroke-width="3"/><polygon points="790,247 766,238 766,256" fill="#7ee7c7"/><text x="565" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">회원 가입서를 내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="295" width="170" height="44" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="255.0" y="323.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">정보만</text><line x1="345" y1="317" x2="774" y2="317" stroke="#9aa3b2" stroke-width="3"/><polygon points="790,317 766,308 766,326" fill="#9aa3b2"/><text x="565" y="307" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">가격만 알려 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="170" y="365" width="170" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="255.0" y="393.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">바꾸기·취소</text><line x1="345" y1="387" x2="774" y2="387" stroke="#ffb454" stroke-width="3"/><polygon points="790,387 766,378 766,396" fill="#ffb454"/><text x="565" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">주문을 바꾸거나 취소해요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="166" y="151" width="178" height="52" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="166" y="221" width="178" height="52" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="337" y="440" width="286" height="31" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">남의 가게 주문을 함부로 바꾸지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메뉴판을 보여 달라는 건 보기 부탁이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회원 가입서를 내는 건 제출 부탁이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가격만 묻기, 주문 바꾸기·취소 부탁도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">부탁할 수 있는 일은 가게가 정해 두어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>