<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>응답 Header</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">응답 Header</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">본문의 형식과 처리 방법을 알려 줘요</text>
<rect x="40" y="130" width="500" height="284" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="56" y="154" text-anchor="start" font-size="15" font-weight="700" fill="#ffb454">응답 (Response)</text><text x="56" y="187" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">HTTP/1.1 200 OK</text><text x="56" y="227" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">Content-Type: text/html; charset=utf-8</text><text x="56" y="267" text-anchor="start" font-size="16" font-weight="700" fill="#7ee7c7">Content-Length: 본문 바이트 수</text><text x="56" y="307" text-anchor="start" font-size="16" font-weight="700" fill="#c792ea">Set-Cookie: ●●●●●●</text><line x1="56" y1="344.0" x2="524" y2="344.0" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><text x="56" y="387" text-anchor="start" font-size="16" font-weight="700" fill="#ffb454">&lt;h1&gt;안녕, 웹!&lt;/h1&gt;</text><rect x="786" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="794" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="776,302 864,302 872,314 768,314" fill="#6ea8fe"/><text x="820" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="202" width="496" height="44" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="42" y="362" width="496" height="44" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/><text x="580" y="230" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">뒤에 올 내용의 종류</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="242" width="496" height="44" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="42" y="362" width="496" height="44" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/><text x="580" y="270" text-anchor="start" font-size="15" font-weight="700" fill="#7ee7c7">본문 크기 (바이트)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="282" width="496" height="44" rx="6" fill="none" stroke="#c792ea" stroke-width="5"/><line x1="550" y1="304" x2="754" y2="304" stroke="#c792ea" stroke-width="3"/><polygon points="770,304 746,295 746,313" fill="#c792ea"/><rect x="636" y="263" width="87" height="30" rx="15" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="680" y="283.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">쿠키 저장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="700" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">헤더를 참고해 HTML로 처리해요</text><circle cx="820" cy="200" r="16" fill="#7ee7c7"/><path d="M812 200 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Content-Type이 본문은 HTML이라고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Content-Length가 본문 크기를 바이트로 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Set-Cookie로 브라우저에 쿠키 저장을 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저는 헤더를 참고해 응답을 처리해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>