<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>URL에서 응답까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">URL에서 응답까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">DNS → TCP → HTTP → 화면 표시로 이어져요</text>
<g><rect x="30" y="190" width="160" height="100" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="110.0" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">URL</text><text x="110.0" y="274" text-anchor="middle" font-size="14" fill="#9aa3b2">어느 자원?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="186" width="168" height="108" rx="12" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g><rect x="214" y="190" width="160" height="100" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="294.0" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">DNS</text><text x="294.0" y="274" text-anchor="middle" font-size="14" fill="#9aa3b2">IP 주소는?</text><line x1="192" y1="240" x2="196" y2="240" stroke="#9aa3b2" stroke-width="3"/><polygon points="212,240 188,231 188,249" fill="#9aa3b2"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="210" y="186" width="168" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="398" y="190" width="160" height="100" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="478.0" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">TCP</text><text x="478.0" y="274" text-anchor="middle" font-size="14" fill="#9aa3b2">연결을 만들어요</text><line x1="376" y1="240" x2="380" y2="240" stroke="#9aa3b2" stroke-width="3"/><polygon points="396,240 372,231 372,249" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="394" y="186" width="168" height="108" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="582" y="190" width="160" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="662.0" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">HTTP</text><text x="662.0" y="274" text-anchor="middle" font-size="14" fill="#9aa3b2">요청·응답 형식</text><line x1="560" y1="240" x2="564" y2="240" stroke="#9aa3b2" stroke-width="3"/><polygon points="580,240 556,231 556,249" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="578" y="186" width="168" height="108" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="766" y="190" width="160" height="100" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="846.0" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">화면</text><text x="846.0" y="274" text-anchor="middle" font-size="14" fill="#9aa3b2">브라우저 표시</text><line x1="744" y1="240" x2="748" y2="240" stroke="#9aa3b2" stroke-width="3"/><polygon points="764,240 740,231 740,249" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="762" y="186" width="168" height="108" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="318" y="324" width="324" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="345.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">www.example.com → 203.0.113.10 (예시)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="328" y="324" width="304" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="345.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">GET /example-page → 200 OK + HTML</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">단계마다 묻는 질문이 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS가 도메인 이름에 맞는 IP 주소를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 그 서버와 TCP 연결을 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTP로 GET 요청을 보내고 200 OK와 HTML을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 문서를 화면에 표시해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>