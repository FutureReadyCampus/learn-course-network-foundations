<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상태 코드</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상태 코드</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">응답 첫 줄의 세 자리 숫자가 처리 결과를 요약해요</text>
<rect x="56" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="46,312 134,312 142,324 38,324" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="836" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="271" width="52" height="32" fill="#3d4b60"/><rect x="865" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="848" y="320" width="44" height="5" fill="#6ea8fe"/><text x="870" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g><text x="480" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">GET /example-page</text><line x1="160" y1="170" x2="784" y2="170" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,170 776,161 776,179" fill="#6ea8fe"/><line x1="800" y1="202" x2="176" y2="202" stroke="#7ee7c7" stroke-width="3"/><polygon points="160,202 184,193 184,211" fill="#7ee7c7"/><rect x="441" y="186" width="78" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="207.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">200 OK</text><text x="720" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">성공</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="480" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">GET /exmaple-page</text><line x1="160" y1="265" x2="784" y2="265" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,265 776,256 776,274" fill="#6ea8fe"/><line x1="800" y1="297" x2="176" y2="297" stroke="#ffb454" stroke-width="3"/><polygon points="160,297 184,288 184,306" fill="#ffb454"/><rect x="412" y="282" width="136" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="302.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">404 Not Found</text><text x="720" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">주소 오타 · 자원 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="480" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">GET /example-page</text><line x1="160" y1="360" x2="784" y2="360" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,360 776,351 776,369" fill="#6ea8fe"/><line x1="800" y1="392" x2="176" y2="392" stroke="#ff7b72" stroke-width="3"/><polygon points="160,392 184,383 184,401" fill="#ff7b72"/><rect x="360" y="376" width="240" height="31" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="397.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">500 Internal Server Error</text><text x="720" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">서버 처리 문제</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="277" y="440" width="405" height="31" rx="16" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">4xx는 요청 쪽, 5xx는 서버 쪽 단서 · 진단서는 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">200 OK는 요청을 성공적으로 처리했다는 뜻이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소 오타로 자원이 없으면 404 Not Found가 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">5xx는 서버가 처리 중 문제를 만났다는 단서예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상태 코드는 단서이지 원인을 다 말하진 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>