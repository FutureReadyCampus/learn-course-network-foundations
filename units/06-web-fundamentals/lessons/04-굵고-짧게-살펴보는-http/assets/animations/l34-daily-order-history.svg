<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내 주문 내역 살펴보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내 주문 내역 살펴보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주문 하나를 누르면 자세한 내용을 볼 수 있어요</text>
<rect x="40" y="130" width="420" height="330" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="60" y="158" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">내 주문 내역</text><rect x="60" y="175" width="380" height="40" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="76" y="201" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">떡볶이</text><text x="420" y="201" text-anchor="end" font-size="16" font-weight="700" fill="#7ee7c7">완료</text><rect x="60" y="225" width="380" height="40" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="76" y="251" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">단무지</text><text x="420" y="251" text-anchor="end" font-size="16" font-weight="700" fill="#7ee7c7">완료</text><rect x="60" y="275" width="380" height="40" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="76" y="301" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">음료</text><text x="420" y="301" text-anchor="end" font-size="16" font-weight="700" fill="#7ee7c7">완료</text><rect x="60" y="325" width="380" height="40" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="76" y="351" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">수저</text><text x="420" y="351" text-anchor="end" font-size="16" font-weight="700" fill="#7ee7c7">완료</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="126" width="428" height="338" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="56" y="171" width="388" height="48" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="500" y="175" width="420" height="180" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="516" y="199" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">자세히 보기</text><text x="516" y="232" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">주문 종류: 포장 주문</text><text x="516" y="266" text-anchor="start" font-size="16" font-weight="700" fill="#7ee7c7">결과: 주문 완료</text><text x="516" y="300" text-anchor="start" font-size="16" font-weight="700" fill="#c792ea">메모: 덜 맵게</text><text x="516" y="334" text-anchor="start" font-size="16" font-weight="700" fill="#ffb454">받은 것: 떡볶이 1인분</text><line x1="445" y1="195" x2="479" y2="195" stroke="#ffb454" stroke-width="3"/><polygon points="495,195 471,186 471,204" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="626" y="404" width="168" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">내 주문 내역만 봐요</text><text x="710" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">남의 주문을 몰래 엿보지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱의 주문 내역에 내가 한 주문이 모여 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그중 떡볶이 주문 하나를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주문 종류, 결과, 메모, 받은 것을 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 주문만 보고, 남의 주문은 엿보지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>