<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTP와 TCP/IP의 역할</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTP와 TCP/IP의 역할</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">HTTP는 메시지 약속, TCP/IP는 데이터 전달이에요</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="816" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="261" width="52" height="32" fill="#3d4b60"/><rect x="845" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="310" width="44" height="5" fill="#6ea8fe"/><text x="850" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="180" y="390" width="600" height="50" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="200" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="270" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="340" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="410" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="480" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="550" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="620" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="690" y="400" width="56" height="30" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="480" y="465" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">TCP/IP: 데이터를 이어진 흐름(stream)으로 옮겨요</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="226" width="118" height="148" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="796" y="226" width="108" height="148" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="200" x2="766" y2="200" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,200 758,189 758,211" fill="#6ea8fe"/><text x="480.0" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">HTTP 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="798" y1="255" x2="178" y2="255" stroke="#ffb454" stroke-width="5"/><polygon points="162,255 186,244 186,266" fill="#ffb454"/><text x="480.0" y="243" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">HTTP 응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="386" width="608" height="58" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="228,415;228,415;718,415;718,415" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-28" y="-15" width="56" height="30" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="195" y1="385" x2="195" y2="445" stroke="#ffb454" stroke-width="5"/><line x1="475" y1="385" x2="475" y2="445" stroke="#ffb454" stroke-width="5"/><line x1="765" y1="385" x2="765" y2="445" stroke="#ffb454" stroke-width="5"/><rect x="301" y="345" width="68" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="335" y="365.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">요청 1</text><rect x="586" y="345" width="68" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="620" y="365.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">요청 2</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저는 클라이언트, 요청을 받는 쪽은 서버예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTP 규칙에 따라 요청하고 응답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP/IP는 데이터를 이어진 흐름으로 옮겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTP 규칙에 맞춰 흐름 속 메시지 경계를 나눠요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>