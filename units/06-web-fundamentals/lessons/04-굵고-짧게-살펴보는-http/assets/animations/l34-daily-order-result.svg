<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주문 결과 한마디</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주문 결과 한마디</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">가게의 첫마디가 주문이 어떻게 됐는지 알려 줘요</text>
<circle cx="90" cy="270" r="16" fill="#6ea8fe"/><rect x="72" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="90" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><polygon points="830,264 870,230 910,264" fill="#9aa3b2"/><rect x="838" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="861" y="284" width="18" height="28" fill="#3d4b60"/><text x="870" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한빛분식</text><g><text x="480" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">떡볶이 주세요</text><line x1="160" y1="170" x2="784" y2="170" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,170 776,161 776,179" fill="#6ea8fe"/><line x1="800" y1="202" x2="176" y2="202" stroke="#7ee7c7" stroke-width="3"/><polygon points="160,202 184,193 184,211" fill="#7ee7c7"/><rect x="434" y="186" width="91" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="207.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">주문 완료</text><text x="720" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">성공</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><text x="480" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">떡볶기 주세요</text><line x1="160" y1="265" x2="784" y2="265" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,265 776,256 776,274" fill="#6ea8fe"/><line x1="800" y1="297" x2="176" y2="297" stroke="#ffb454" stroke-width="3"/><polygon points="160,297 184,288 184,306" fill="#ffb454"/><rect x="403" y="282" width="155" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="302.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">그런 메뉴는 없어요</text><text x="720" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">메뉴 이름 오타</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><text x="480" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">떡볶이 주세요</text><line x1="160" y1="360" x2="784" y2="360" stroke="#6ea8fe" stroke-width="3"/><polygon points="800,360 776,351 776,369" fill="#6ea8fe"/><line x1="800" y1="392" x2="176" y2="392" stroke="#ff7b72" stroke-width="3"/><polygon points="160,392 184,383 184,401" fill="#ff7b72"/><rect x="378" y="376" width="203" height="31" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="397.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">주방 고장으로 못 만들어요</text><text x="720" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">가게 안 문제</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="308" y="440" width="343" height="31" rx="16" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">4xx는 요청 쪽, 5xx는 가게 쪽 단서일 뿐이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">떡볶이를 주문하면 주문 완료라고 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메뉴 이름이 틀리면 그런 메뉴는 없다고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주방이 고장 나면 만들 수 없다고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">답은 단서일 뿐, 원인을 모두 말하지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>