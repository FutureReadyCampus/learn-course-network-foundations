<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTP 메시지의 모양</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTP 메시지의 모양</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">첫 줄, 헤더, 빈 줄, 본문 순서로 읽어요</text>
<rect x="40" y="140" width="380" height="112" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="56" y="164" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">요청 (Request)</text><text x="56" y="197" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">GET /example-page HTTP/1.1</text><text x="56" y="231" text-anchor="start" font-size="16" font-weight="700" fill="#7ee7c7">Host: www.example.com</text><rect x="450" y="140" width="470" height="180" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="466" y="164" text-anchor="start" font-size="15" font-weight="700" fill="#ffb454">응답 (Response)</text><text x="466" y="197" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">HTTP/1.1 200 OK</text><text x="466" y="231" text-anchor="start" font-size="16" font-weight="700" fill="#7ee7c7">Content-Type: text/html; charset=utf-8</text><line x1="466" y1="259.0" x2="904" y2="259.0" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/><text x="466" y="299" text-anchor="start" font-size="16" font-weight="700" fill="#ffb454">&lt;h1&gt;안녕, 웹!&lt;/h1&gt;</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="172" width="376" height="38" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="452" y="172" width="466" height="38" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="87" y="314" width="285" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="230.0" y="335.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">첫 줄(start-line): 요청·결과 요약</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="206" width="376" height="38" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="452" y="206" width="466" height="38" rx="6" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="148" y="314" width="164" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="230.0" y="335.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">헤더: 덧붙이는 정보</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="452" y="240" width="466" height="38" rx="6" fill="none" stroke="#9aa3b2" stroke-width="5"/><rect x="117" y="314" width="227" height="31" rx="16" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/><text x="230.0" y="335.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">빈 줄: 여기서부터 본문이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="452" y="274" width="466" height="38" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="112" y="314" width="237" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="230.0" y="335.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">본문(body): 실제로 주는 내용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">첫 줄 → 헤더 → 빈 줄 → 본문 순서로 읽어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫 줄은 GET 요청, 200 OK 결과를 요약해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Host, Content-Type 같은 헤더가 정보를 더해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빈 줄이 헤더가 끝나고 본문이 시작된다고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">본문에는 실제 HTML 내용이 들어 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>