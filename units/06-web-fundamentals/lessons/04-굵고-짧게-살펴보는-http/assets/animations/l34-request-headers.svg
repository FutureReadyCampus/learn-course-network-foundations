<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>요청 Header</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">요청 Header</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">원하는 형식과 환경을 이름: 값으로 알려요</text>
<rect x="60" y="130" width="470" height="284" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="76" y="154" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">요청 (Request)</text><text x="76" y="187" text-anchor="start" font-size="16" font-weight="700" fill="#9aa3b2">GET /example-page HTTP/1.1</text><text x="76" y="227" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">Accept: text/html</text><text x="76" y="267" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">Accept-Language: ko</text><text x="76" y="307" text-anchor="start" font-size="16" font-weight="700" fill="#6ea8fe">Accept-Encoding: gzip</text><text x="76" y="347" text-anchor="start" font-size="16" font-weight="700" fill="#c792ea">User-Agent: (브라우저 정보)</text><text x="76" y="387" text-anchor="start" font-size="16" font-weight="700" fill="#ff7b72">Cookie: ●●●●●●</text><rect x="786" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="794" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="776,312 864,312 872,324 768,324" fill="#6ea8fe"/><text x="820" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="202" width="466" height="44" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><text x="560" y="230" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">HTML을 받을 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="242" width="466" height="44" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><text x="560" y="270" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">한국어 응답을 원해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="282" width="466" height="44" rx="6" fill="none" stroke="#6ea8fe" stroke-width="5"/><text x="560" y="310" text-anchor="start" font-size="15" font-weight="700" fill="#6ea8fe">gzip 압축을 풀 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="322" width="466" height="44" rx="6" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="62" y="362" width="466" height="44" rx="6" fill="none" stroke="#ff7b72" stroke-width="5"/><text x="560" y="350" text-anchor="start" font-size="15" font-weight="700" fill="#c792ea">보낸 프로그램 정보</text><text x="560" y="390" text-anchor="start" font-size="15" font-weight="700" fill="#ff7b72">민감한 값은 가려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="700" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">헤더는 덧붙인 설명, 경로·본문과 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Accept: text/html은 HTML을 받을 수 있다고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Accept-Language: ko는 한국어를 원한다고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Accept-Encoding: gzip은 압축을 풀 수 있다고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">User-Agent와 Cookie도 담기니 민감한 값은 가려요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>