<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>역할 구분과 장비 수는 달라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">역할 구분과 장비 수는 달라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">웹 서버·WAS·DB는 논리적인 역할이에요</text>
<rect x="40" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="125.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="270" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="355.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">웹 서버</text><text x="355.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">요청 접수·정적 파일</text><rect x="500" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="585.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">WAS</text><text x="585.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">처리·응답 만들기</text><rect x="730" y="140" width="170" height="80" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="815.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">DB</text><text x="815.0" y="204" text-anchor="middle" font-size="14" fill="#9aa3b2">자료 저장·조회</text><g><line x1="210" y1="180" x2="254" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="270,180 246,171 246,189" fill="#9aa3b2"/><line x1="440" y1="180" x2="484" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="500,180 476,171 476,189" fill="#9aa3b2"/><line x1="670" y1="180" x2="714" y2="180" stroke="#9aa3b2" stroke-width="3"/><polygon points="730,180 706,171 706,189" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="261" y="240" width="188" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="355" y="260.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">정적 파일은 바로 보내요</text><rect x="588" y="240" width="223" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="260.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">처리가 필요하면 WAS → DB로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="285" width="470" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="485" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서버 한 대</text><rect x="270" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="337.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">웹 서버</text><rect x="420" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="487.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">WAS</text><rect x="570" y="335" width="135" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="637.5" y="360.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">DB</text><rect x="297" y="424" width="375" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="485" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">작은 서비스는 한 곳에서 여러 역할을 맡기도 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서버 A</text><text x="250" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">웹 서버</text><rect x="400" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">서버 B</text><text x="500" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">WAS</text><rect x="650" y="285" width="200" height="110" rx="14" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="750" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">서버 C</text><text x="750" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ec">DB</text><rect x="326" y="424" width="319" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="485" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">서비스가 커지면 역할별로 나눌 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 서버는 접수, WAS는 처리, DB는 저장을 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정적 파일은 웹 서버가, 처리는 WAS와 DB가 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">작은 서비스는 한 서버에서 여러 역할을 맡을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서비스가 커지면 여러 장비나 가상 서버로 나눌 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>