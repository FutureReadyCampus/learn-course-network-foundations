<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>친구에게 전화하는 네 걸음</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">친구에게 전화하는 네 걸음</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">번호 찾기, 연결, 말 건네기, 대답 듣기예요</text>
<rect x="88" y="260" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="270" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="328" r="3" fill="#6ea8fe"/><text x="110" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="828" y="260" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="270" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="328" r="3" fill="#6ea8fe"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><rect x="320" y="135" width="320" height="100" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">연락처</text><rect x="325" y="189" width="120" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="385" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">친구 이름</text><line x1="450" y1="205" x2="499" y2="205" stroke="#9aa3b2" stroke-width="3"/><polygon points="515,205 491,196 491,214" fill="#9aa3b2"/><rect x="520" y="189" width="110" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="575" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">전화번호</text><line x1="190" y1="300" x2="780" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="316" y="131" width="328" height="108" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="190" y1="300" x2="780" y2="300" stroke="#7ee7c7" stroke-width="6"/><rect x="387" y="328" width="187" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="351.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">대표번호 + 내선 번호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="208" y1="275" x2="736" y2="275" stroke="#6ea8fe" stroke-width="5"/><polygon points="752,275 728,264 728,286" fill="#6ea8fe"/><text x="480.0" y="263" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">“로그인 화면 보여 주세요”</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="768" y1="275" x2="208" y2="275" stroke="#ffb454" stroke-width="5"/><polygon points="192,275 216,264 216,286" fill="#ffb454"/><text x="480.0" y="263" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">“네, 여기 있어요”</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 연락처에서 이름에 맞는 번호를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전화를 걸어 말할 통로를 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통로가 이어지면 필요한 말을 건네요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">친구가 말에 대답해 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>