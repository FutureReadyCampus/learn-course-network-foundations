<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>편지의 내용과 봉투</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">편지의 내용과 봉투</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">내용을 쓰는 일과 나르는 일은 달라요</text>
<circle cx="130" cy="270" r="16" fill="#6ea8fe"/><rect x="112" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="130" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><polygon points="790,274 830,240 870,274" fill="#9aa3b2"/><rect x="798" y="274" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="821" y="294" width="18" height="28" fill="#3d4b60"/><text x="830" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">가게</text><rect x="330" y="215" width="300" height="170" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">우체국</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g transform="translate(250,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">로그인 화면 주세요</text></g><rect x="156" y="344" width="188" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="250" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">내용: 무엇을 원하는지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(250,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">로그인 화면 주세요</text><rect x="-98" y="-40" width="196" height="80" rx="8" fill="none" stroke="#6ea8fe" stroke-width="3"/></g><rect x="164" y="344" width="173" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">봉투: 어디로 나를지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,300;250,300;480,300;700,300;700,300" keyTimes="0.000;0.525;0.613;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">로그인 화면 주세요</text><rect x="-98" y="-40" width="196" height="80" rx="8" fill="none" stroke="#6ea8fe" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">내용과 봉투는 서로 다른 일이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g transform="translate(700,300)"><rect x="-80" y="-24" width="160" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">로그인 화면 주세요</text></g><rect x="600" y="344" width="199" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">받는 쪽이 내용을 읽어요</text><line x1="740" y1="425" x2="216" y2="425" stroke="#7ee7c7" stroke-width="5"/><polygon points="200,425 224,414 224,436" fill="#7ee7c7"/><text x="480" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">답장</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 원하는 내용을 편지에 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 편지를 봉투에 담아 주소를 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">우체국이 봉투를 가게까지 날라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게는 내용을 읽고 답장을 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>