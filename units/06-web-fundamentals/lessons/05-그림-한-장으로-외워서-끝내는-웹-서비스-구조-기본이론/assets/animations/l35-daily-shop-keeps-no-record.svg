<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>기록하지 않는 가게</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">기록하지 않는 가게</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보관증이 있으면 손님을 구별할 수 있어요</text>
<circle cx="110" cy="270" r="16" fill="#6ea8fe"/><rect x="92" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><circle cx="850" cy="270" r="16" fill="#6ea8fe"/><rect x="832" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">가게 직원</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="215" x2="766" y2="215" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,215 758,204 758,226" fill="#6ea8fe"/><text x="480.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">“로그인했어요”</text><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">직원은 손님을 확인하고 기록 없이 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="215" x2="766" y2="215" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,215 758,204 758,226" fill="#6ea8fe"/><text x="480.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">“지난번에 왔어요”</text><circle cx="850" cy="215" r="16" fill="#ffb454"/><text x="850" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">기록이 없어서 알아보지 못해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="798" y1="215" x2="178" y2="215" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,215 186,204 186,226" fill="#7ee7c7"/><text x="480.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">보관증을 건네요</text><rect x="330" y="215" width="300" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">보관증(번호표)</text><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">손님이 지갑에 보관해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="215" x2="766" y2="215" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,215 758,204 758,226" fill="#6ea8fe"/><text x="480.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">“보관증 여기 있어요”</text><rect x="330" y="215" width="300" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">보관증(번호표)</text><text x="480" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">보관증으로 손님을 구별해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님이 처음 방문해 이름을 대요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 방문에서는 직원이 손님을 알아보지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게가 보관증을 건네 손님이 보관해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보관증을 보여 주면 손님을 구별할 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>