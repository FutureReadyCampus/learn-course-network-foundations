<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>조회 창구와 접수 창구</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">조회 창구와 접수 창구</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보기만 하는 일과 내가 낸 서류를 처리하는 일이에요</text>
<rect x="85" y="112" width="170" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">나</text><rect x="705" y="112" width="170" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">우체국</text><line x1="170" y1="150" x2="170" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="790" y1="150" x2="790" y2="450" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g><line x1="178" y1="195" x2="766" y2="195" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,195 758,184 758,206" fill="#6ea8fe"/><text x="480.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">조회 창구: 목록을 보여 주세요</text><line x1="798" y1="240" x2="178" y2="240" stroke="#6ea8fe" stroke-width="5"/><polygon points="162,240 186,229 186,251" fill="#6ea8fe"/><text x="480.0" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">서류를 받아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="305" x2="766" y2="305" stroke="#ffb454" stroke-width="5"/><polygon points="782,305 758,294 758,316" fill="#ffb454"/><text x="480.0" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">접수 창구: 내가 쓴 서류를 낼게요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="560" y="330" width="380" height="56" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="750" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서류를 확인해 처리해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="798" y1="415" x2="178" y2="415" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,415 186,404 186,426" fill="#7ee7c7"/><text x="480.0" y="403" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">결과: 승인 또는 반려</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조회 창구에서는 목록을 보여 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접수 창구에서는 내가 쓴 서류를 내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">우체국이 서류를 확인해 처리해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">결과를 승인이나 반려로 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>