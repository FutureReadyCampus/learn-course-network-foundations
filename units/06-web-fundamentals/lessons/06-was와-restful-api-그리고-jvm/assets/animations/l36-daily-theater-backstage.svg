<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>극장의 배우와 무대 뒤 운영자</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">극장의 배우와 무대 뒤 운영자</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공연장, 연주자, 운영자는 같은 말이 아니에요</text>
<rect x="40" y="120" width="880" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="60" y="150" text-anchor="start" font-size="18" font-weight="700" fill="#9aa3b2">공연장 전체</text><rect x="70" y="170" width="300" height="235" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="220" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">악보와 연주자</text><rect x="100" y="220" width="240" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="220.0" y="247.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">악보(바이트코드)</text><line x1="220" y1="264" x2="220" y2="305" stroke="#9aa3b2" stroke-width="3"/><polygon points="220,312 211,298 229,298" fill="#9aa3b2"/><rect x="100" y="318" width="240" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="220.0" y="355.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">연주자(JVM)</text><rect x="400" y="170" width="490" height="235" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="645" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">무대 뒤 운영자</text><rect x="430" y="220" width="200" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="530.0" y="251.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">배우</text><text x="760" y="252" text-anchor="middle" font-size="15" fill="#9aa3b2">맡은 장면을 연기해요</text><rect x="425" y="320" width="130" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="490.0" y="347.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">무대에 올림</text><rect x="570" y="320" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="645.0" y="347.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">장면마다 연기</text><rect x="735" y="320" width="125" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="797.5" y="347.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">내려옴</text><text x="645" y="395" text-anchor="middle" font-size="15" fill="#9aa3b2">언제 올라오고 내려가는지를 관리해요</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="116" width="888" height="308" rx="14" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="66" y="166" width="308" height="243" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="396" y="166" width="498" height="243" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="115" y="434" width="270" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">공연장 = 전체 환경</text><rect x="405" y="434" width="250" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="530" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">연주자 = 악보를 읽는 쪽</text><rect x="665" y="434" width="250" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="790" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">운영자 = 관리하는 쪽</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공연장 전체가 공연을 올리는 환경이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">악보는 연주자를 거쳐 소리가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">운영자는 배우가 언제 올라올지 관리해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공연장, 연주자, 운영자는 각자 다른 역할이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>