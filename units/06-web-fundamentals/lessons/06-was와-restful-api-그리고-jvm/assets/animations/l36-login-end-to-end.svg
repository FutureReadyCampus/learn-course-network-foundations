<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>로그인 요청 하나로 전체 흐름 잇기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">로그인 요청 하나로 전체 흐름 잇기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">DNS부터 화면까지 한 줄로 이어요</text>
<rect x="40" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="115.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="220" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="295.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">DNS</text><rect x="420" y="135" width="150" height="64" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="495.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">웹 서버</text><rect x="620" y="135" width="140" height="64" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="690.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">WAS</text><rect x="790" y="135" width="130" height="64" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="855.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">DB</text><g><line x1="123" y1="245" x2="271" y2="245" stroke="#ffb454" stroke-width="5"/><polygon points="287,245 263,234 263,256" fill="#ffb454"/><text x="205.0" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">URL → IP 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="123" y1="285" x2="471" y2="285" stroke="#6ea8fe" stroke-width="5"/><polygon points="487,285 463,274 463,296" fill="#6ea8fe"/><text x="305.0" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">TCP/IP 연결 + HTTP 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="503" y1="325" x2="666" y2="325" stroke="#7ee7c7" stroke-width="5"/><polygon points="682,325 658,314 658,336" fill="#7ee7c7"/><text x="592.5" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">입력을 확인해요</text><line x1="698" y1="365" x2="831" y2="365" stroke="#c792ea" stroke-width="5"/><polygon points="847,365 823,354 823,376" fill="#c792ea"/><text x="772.5" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">자료 조회</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="840" y1="420" x2="131" y2="420" stroke="#ffb454" stroke-width="5"/><polygon points="115,420 139,409 139,431" fill="#ffb454"/><text x="480" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">응답: HTML 또는 JSON → 브라우저가 화면으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="289" y="440" width="381" height="31" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="461.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">HTTPS여도 TLS 처리 지점에 따라 보호 구간이 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS로 서버의 IP 주소를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP/IP로 연결해 HTTP 요청을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 서버가 받고 WAS가 검증해 DB에서 자료를 조회해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답을 받은 브라우저가 화면을 만들어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>