<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주문이 늦으면 어디서 늦었는지 봐요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주문이 늦으면 어디서 늦었는지 봐요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">일을 나누면 늦어진 곳을 따로 볼 수 있어요</text>
<rect x="40" y="130" width="170" height="64" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="125.0" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">손님</text><rect x="270" y="130" width="170" height="64" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="355.0" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">홀</text><rect x="500" y="130" width="170" height="64" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="585.0" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">주방</text><rect x="730" y="130" width="170" height="64" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="815.0" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">창고</text><line x1="210" y1="162" x2="254" y2="162" stroke="#9aa3b2" stroke-width="3"/><polygon points="270,162 246,153 246,171" fill="#9aa3b2"/><line x1="440" y1="162" x2="484" y2="162" stroke="#9aa3b2" stroke-width="3"/><polygon points="500,162 476,153 476,171" fill="#9aa3b2"/><line x1="670" y1="162" x2="714" y2="162" stroke="#9aa3b2" stroke-width="3"/><polygon points="730,162 706,153 706,171" fill="#9aa3b2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">요청은 이 순서로 들어가고 결과는 되돌아와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="80" y="285" width="26.666666666666668" height="46" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="106.66666666666667" y="285" width="106.66666666666667" height="46" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="213.33333333333334" y="285" width="666.6666666666666" height="46" rx="4" fill="#c792ea" stroke="#c792ea" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="70" y="406" width="16" height="16" rx="3" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="1"/><text x="94" y="420" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">전달 0.1</text><rect x="330" y="406" width="16" height="16" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="1"/><text x="354" y="420" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">조리 0.4</text><rect x="590" y="406" width="16" height="16" rx="3" fill="#c792ea" stroke="#c792ea" stroke-width="1"/><text x="614" y="420" text-anchor="start" font-size="16" font-weight="600" fill="#e6e8ec">재료 기다림 2.5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="80" y1="345" x2="880" y2="345" stroke="#e6e8ec" stroke-width="4"/><line x1="80" y1="345" x2="80" y2="333" stroke="#e6e8ec" stroke-width="4"/><line x1="880" y1="345" x2="880" y2="333" stroke="#e6e8ec" stroke-width="4"/><rect x="340" y="354" width="280" height="33" rx="16" fill="#e6e8ec" stroke="#e6e8ec" stroke-width="2"/><text x="480.0" y="377.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">음식이 나오기까지 (설명용 가정)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="209.33333333333334" y="281" width="674.6666666666666" height="54" rx="6" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="450" y="238" width="193" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="546.6666666666666" y="261.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">이 예에서 가장 길어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="288" y="440" width="385" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">시간 기록표는 단서를 줘요 · 원인은 함께 확인해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님 주문은 홀, 주방, 창고를 차례로 거쳐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">구간마다 걸린 시간을 나눠 적어 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 예에서는 창고에서 재료를 기다린 시간이 가장 길어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록표는 단서일 뿐 원인은 함께 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>