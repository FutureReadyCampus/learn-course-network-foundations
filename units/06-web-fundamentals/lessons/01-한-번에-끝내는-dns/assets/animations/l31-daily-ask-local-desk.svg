<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>동네 안내소에 물어봐요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">동네 안내소에 물어봐요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경비실은 질문을 전해 주기만 할 수도 있어요</text>
<circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="306" y="268" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="300" y="260" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="318" y="278" width="44" height="18" fill="#3d4b60"/><text x="340" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">경비실</text><rect x="470" y="245" width="180" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="560.0" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">동네 안내소</text><rect x="780" y="245" width="150" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="855.0" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">다른 안내소</text><g><line x1="118" y1="200" x2="316" y2="200" stroke="#6ea8fe" stroke-width="5"/><polygon points="332,200 308,189 308,211" fill="#6ea8fe"/><text x="225.0" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">한빛학교는 어디?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="348" y1="200" x2="446" y2="200" stroke="#9aa3b2" stroke-width="5"/><polygon points="462,200 438,189 438,211" fill="#9aa3b2"/><text x="405.0" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">전달</text><text x="340" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">전해 주기만 하기도 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="658" y1="270" x2="756" y2="270" stroke="#c792ea" stroke-width="5"/><polygon points="772,270 748,259 748,281" fill="#c792ea"/><text x="715.0" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">물어요</text><line x1="788" y1="315" x2="658" y2="315" stroke="#c792ea" stroke-width="5"/><polygon points="642,315 666,304 666,326" fill="#c792ea"/><text x="715.0" y="303" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">답</text><text x="560" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">알면 바로, 모르면 찾아와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="568" y1="420" x2="118" y2="420" stroke="#7ee7c7" stroke-width="5"/><polygon points="102,420 126,409 126,431" fill="#7ee7c7"/><text x="335.0" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">본관 3층이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 한빛학교가 어디인지 물어보기 시작해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경비실이 질문을 안내소에 전해 주기도 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동네 안내소가 모르면 다른 안내소에 물어봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내소가 찾은 답을 나에게 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>