<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>루트부터 담당 DNS 서버까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">루트부터 담당 DNS 서버까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">앞 단계는 다음에 물을 서버를 알려 줘요</text>
<rect x="40" y="200" width="200" height="100" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="140.0" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">지정된 DNS 서버</text><text x="140.0" y="284" text-anchor="middle" font-size="14" fill="#9aa3b2">답을 모르면 따라가요</text><rect x="640" y="130" width="280" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="780.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">루트 DNS 서버</text><g><line x1="250" y1="154" x2="614" y2="154" stroke="#6ea8fe" stroke-width="4"/><polygon points="630,154 606,144 606,164" fill="#6ea8fe"/><line x1="630" y1="186" x2="266" y2="186" stroke="#6ea8fe" stroke-width="4"/><polygon points="250,186 274,176 274,196" fill="#6ea8fe"/><rect x="352" y="171" width="176" height="30" rx="15" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="440" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">.com 서버에 물어보세요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="126" width="288" height="88" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><rect x="640" y="240" width="280" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="780.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">.com 서버</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="250" y1="264" x2="614" y2="264" stroke="#6ea8fe" stroke-width="4"/><polygon points="630,264 606,254 606,274" fill="#6ea8fe"/><line x1="630" y1="296" x2="266" y2="296" stroke="#7ee7c7" stroke-width="4"/><polygon points="250,296 274,286 274,306" fill="#7ee7c7"/><rect x="323" y="281" width="234" height="30" rx="15" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="440" y="301.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">example.com 담당에 물어보세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="236" width="288" height="88" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><rect x="640" y="350" width="280" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="780.0" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">example.com 담당</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="250" y1="374" x2="614" y2="374" stroke="#6ea8fe" stroke-width="4"/><polygon points="630,374 606,364 606,384" fill="#6ea8fe"/><line x1="630" y1="406" x2="266" y2="406" stroke="#ffb454" stroke-width="4"/><polygon points="250,406 274,396 274,416" fill="#ffb454"/><rect x="290" y="391" width="299" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="440" y="411.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">www.example.com = 203.0.113.10 (예시)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="346" width="288" height="88" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="346" width="288" height="88" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><circle cx="140" cy="335" r="16" fill="#7ee7c7"/><path d="M132 335 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="140" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">담당이 최종 답을 줘요</text><text x="140" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">앞 단계는 방향만 알려 줘요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">루트 DNS 서버는 .com을 맡은 서버를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">.com 서버는 example.com 담당 서버를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">example.com 담당 DNS 서버가 최종 답을 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞 단계는 방향을, 담당 서버는 답을 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>