<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>친구 이름과 교실 위치</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">친구 이름과 교실 위치</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름만 알아서는 찾아갈 수 없어요</text>
<circle cx="130" cy="270" r="16" fill="#6ea8fe"/><rect x="112" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="130" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="360" y="150" width="240" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">안내 데스크</text><text x="480.0" y="214" text-anchor="middle" font-size="14" fill="#9aa3b2">위치를 알려 줘요</text><polygon points="790,284 830,250 870,284" fill="#9aa3b2"/><rect x="798" y="284" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="821" y="304" width="18" height="28" fill="#3d4b60"/><text x="830" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">3층 2반 교실</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="59" y="184" width="141" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="130" y="205.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">친구 이름: 민수</text><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">이름만 알아서는 찾아갈 수 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="183" y1="175" x2="331" y2="175" stroke="#6ea8fe" stroke-width="5"/><polygon points="347,175 323,164 323,186" fill="#6ea8fe"/><text x="265.0" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">민수 교실은?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="363" y1="215" x2="183" y2="215" stroke="#7ee7c7" stroke-width="5"/><polygon points="167,215 191,204 191,226" fill="#7ee7c7"/><text x="265.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">3층 2반</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="190" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;770,300;770,300" keyTimes="0.000;0.775;0.912;1.000" dur="15s" repeatCount="indefinite"/><rect x="-21" y="-16" width="43" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="0" y="5.3999999999999995" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">나</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">위치를 알아야 찾아갈 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 친구 이름만 알고 교실 위치는 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 데스크에 친구 교실이 어디인지 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내 데스크가 3층 2반이라는 위치를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위치를 알았으니 그 교실로 찾아가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>