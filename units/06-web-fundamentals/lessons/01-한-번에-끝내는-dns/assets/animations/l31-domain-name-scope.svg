<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도메인 이름은 오른쪽이 큰 범위</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도메인 이름은 오른쪽이 큰 범위</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">범위마다 다른 DNS 서버가 나누어 맡아요</text>
<rect x="580" y="118" width="100" height="34" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="630.0" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">com</text><rect x="420" y="118" width="130" height="34" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="485.0" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">example</text><rect x="300" y="118" width="90" height="34" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="345.0" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">www</text><text x="405" y="142" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">.</text><text x="565" y="142" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">.</text><text x="790" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">← 오른쪽이 큰 범위</text><g><rect x="80" y="180" width="800" height="230" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="100" y="209" text-anchor="start" font-size="18" font-weight="700" fill="#6ea8fe">com</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="114" width="108" height="42" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="225" width="560" height="160" rx="12" fill="none" stroke="#7ee7c7" stroke-width="3"/><text x="220" y="254" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">example.com</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="416" y="114" width="138" height="42" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="270" width="320" height="90" rx="12" fill="none" stroke="#ffb454" stroke-width="3"/><text x="480" y="322" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">www.example.com</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="114" width="98" height="42" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="702" y="188" width="116" height="30" rx="15" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="760" y="208.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">com 담당 서버</text><rect x="570" y="233" width="179" height="30" rx="15" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="660" y="253.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">example.com 담당 서버</text><text x="480" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한 곳에 몰지 않고 범위마다 나누어 맡아요 (분산)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가장 오른쪽 com이 가장 큰 범위예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 안에 example이라는 도메인이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">www는 example.com 안에서 쓰는 이름이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">범위마다 다른 DNS 서버가 나누어 맡아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>