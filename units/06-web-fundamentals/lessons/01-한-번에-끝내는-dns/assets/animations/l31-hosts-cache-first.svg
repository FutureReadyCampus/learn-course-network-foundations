<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>hosts 파일과 DNS 캐시 먼저</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">hosts 파일과 DNS 캐시 먼저</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">컴퓨터 안에 답이 없을 때 DNS 서버에 물어요</text>
<rect x="40" y="140" width="560" height="290" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="120" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">내 컴퓨터</text><rect x="86" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="94" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="76,312 164,312 172,324 68,324" fill="#6ea8fe"/><rect x="220" y="185" width="340" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="390.0" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">hosts 파일</text><text x="390.0" y="259" text-anchor="middle" font-size="14" fill="#9aa3b2">직접 적은 이름과 주소</text><rect x="220" y="305" width="340" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="390.0" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">DNS 캐시</text><text x="390.0" y="379" text-anchor="middle" font-size="14" fill="#9aa3b2">최근 조회한 답</text><rect x="700" y="240" width="220" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="810.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">지정된 DNS 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="216" y="181" width="348" height="98" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/><circle cx="530" cy="215" r="16" fill="#ff7b72"/><path d="M523 208 l14 14 M537 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="530" cy="215" r="16" fill="#ff7b72"/><path d="M523 208 l14 14 M537 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="216" y="301" width="348" height="98" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/><circle cx="530" cy="335" r="16" fill="#ff7b72"/><path d="M523 328 l14 14 M537 328 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="530" cy="335" r="16" fill="#ff7b72"/><path d="M523 328 l14 14 M537 328 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="608" y1="268" x2="676" y2="268" stroke="#ffb454" stroke-width="5"/><polygon points="692,268 668,257 668,279" fill="#ffb454"/><text x="650.0" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">질문</text><rect x="696" y="236" width="228" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="708" y1="308" x2="608" y2="308" stroke="#7ee7c7" stroke-width="5"/><polygon points="592,308 616,297 616,319" fill="#7ee7c7"/><text x="650.0" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">답</text><circle cx="530" cy="335" r="16" fill="#7ee7c7"/><path d="M522 335 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="321" y="440" width="318" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">hosts는 직접 적은 값, 캐시는 조회 결과</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 hosts 파일에 직접 적은 주소가 있는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS 캐시에 최근 조회한 답이 있는지도 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 없으면 지정된 DNS 서버에 물어봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받은 답은 DNS 캐시에 잠시 기억해 두어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>