<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안내가 막히거나 틀리면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안내가 막히거나 틀리면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">위치 알아내기와 찾아가기를 나누어 봐요</text>
<circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="330" y="140" width="240" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="450.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">주 안내소</text><rect x="330" y="330" width="240" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="450.0" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">보조 안내소</text><polygon points="780,164 820,130 860,164" fill="#9aa3b2"/><rect x="788" y="164" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="811" y="184" width="18" height="28" fill="#3d4b60"/><text x="820" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한빛학교</text><polygon points="780,309 820,275 860,309" fill="#ff7b72"/><rect x="788" y="309" width="64" height="48" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="811" y="329" width="18" height="28" fill="#3d4b60"/><text x="820" y="381" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">엉뚱한 건물</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="180" x2="306" y2="180" stroke="#6ea8fe" stroke-width="5"/><polygon points="322,180 298,169 298,191" fill="#6ea8fe"/><text x="250.0" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">질문</text><circle cx="600" cy="180" r="16" fill="#ff7b72"/><path d="M593 173 l14 14 M607 173 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="450" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">응답 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="355" x2="306" y2="355" stroke="#6ea8fe" stroke-width="5"/><polygon points="322,355 298,344 298,366" fill="#6ea8fe"/><text x="250.0" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">다시 질문</text><line x1="338" y1="392" x2="178" y2="392" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,392 186,381 186,403" fill="#7ee7c7"/><text x="250.0" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">위치</text><circle cx="600" cy="370" r="16" fill="#7ee7c7"/><path d="M592 370 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="300" x2="746" y2="300" stroke="#ff7b72" stroke-width="5"/><polygon points="762,300 738,289 738,311" fill="#ff7b72"/><text x="470.0" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">가짜 답을 믿고 엉뚱한 곳으로</text><rect x="764" y="258" width="112" height="80" rx="10" fill="none" stroke="#ff7b72" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="300" y="125" width="300" height="300" rx="14" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><rect x="680" y="125" width="260" height="300" rx="14" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><rect x="380" y="432" width="140" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="450" y="453.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">① 위치 알아내기</text><rect x="757" y="432" width="106" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="810" y="453.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">② 찾아가기</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주 안내소가 대답하지 않으면 위치를 알 수 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보조 안내소가 대신 알려 줄 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가짜 안내는 그럴듯한 엉뚱한 위치를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위치 알아내기와 찾아가기를 나누어 살펴봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>