<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DNS 캐시와 TTL</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS 캐시와 TTL</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TTL 동안만 답을 기억해요</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="310" y="160" width="310" height="250" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="465" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">지정된 DNS 서버</text><rect x="740" y="245" width="190" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="835.0" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">담당 DNS 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">DNS 캐시</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">example.com → 203.0.113.10</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">TTL 남은 시간 300초</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">DNS 캐시</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">example.com → 203.0.113.10</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">TTL 남은 시간 120초</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#ff7b72" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">DNS 캐시</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">example.com → 203.0.113.10</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">TTL 0초: 만료</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">DNS 캐시</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">example.com → 203.0.113.10</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">새 답: TTL 300초</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="748" y1="250" x2="628" y2="250" stroke="#c792ea" stroke-width="5"/><polygon points="612,250 636,239 636,261" fill="#c792ea"/><text x="680.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">답 · TTL 300초</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="173" y1="210" x2="286" y2="210" stroke="#6ea8fe" stroke-width="5"/><polygon points="302,210 278,199 278,221" fill="#6ea8fe"/><text x="237.5" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">같은 질문</text><line x1="318" y1="250" x2="173" y2="250" stroke="#7ee7c7" stroke-width="5"/><polygon points="157,250 181,239 181,261" fill="#7ee7c7"/><text x="237.5" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">캐시에서 바로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="465" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">오래된 답을 계속 쓰지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="628" y1="210" x2="716" y2="210" stroke="#ffb454" stroke-width="5"/><polygon points="732,210 708,199 708,221" fill="#ffb454"/><text x="680.0" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">다시 물어요</text><line x1="748" y1="250" x2="628" y2="250" stroke="#c792ea" stroke-width="5"/><polygon points="612,250 636,239 636,261" fill="#c792ea"/><text x="680.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">새 답</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">담당 서버의 답을 TTL 300초와 함께 캐시에 넣어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 이름을 다시 물으면 캐시에서 바로 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TTL이 다 지나면 그 답은 더 쓰지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다시 조회해 새 답을 받고 TTL을 새로 세요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>