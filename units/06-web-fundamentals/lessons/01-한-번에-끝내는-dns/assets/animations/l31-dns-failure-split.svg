<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DNS 문제와 연결 문제 구분</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS 문제와 연결 문제 구분</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 조회가 막히면 이름으로 접속하기 어려워요</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="330" y="140" width="240" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="450.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">주 DNS 서버</text><rect x="330" y="330" width="240" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="450.0" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">보조 DNS 서버</text><rect x="786" y="144" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="794" y="151" width="52" height="32" fill="#3d4b60"/><rect x="815" y="190" width="10" height="10" fill="#6ea8fe"/><rect x="798" y="200" width="44" height="5" fill="#6ea8fe"/><text x="820" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">진짜 서버</text><rect x="786" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="794" y="281" width="52" height="32" fill="#3d4b60"/><rect x="815" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="798" y="330" width="44" height="5" fill="#6ea8fe"/><text x="820" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">엉뚱한 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="180" x2="306" y2="180" stroke="#6ea8fe" stroke-width="5"/><polygon points="322,180 298,169 298,191" fill="#6ea8fe"/><text x="250.0" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">이름 질의</text><circle cx="600" cy="180" r="16" fill="#ff7b72"/><path d="M593 173 l14 14 M607 173 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="450" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">응답 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="355" x2="306" y2="355" stroke="#6ea8fe" stroke-width="5"/><polygon points="322,355 298,344 298,366" fill="#6ea8fe"/><text x="250.0" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">다시 질의</text><line x1="338" y1="392" x2="178" y2="392" stroke="#7ee7c7" stroke-width="5"/><polygon points="162,392 186,381 186,403" fill="#7ee7c7"/><text x="250.0" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">주소</text><circle cx="600" cy="370" r="16" fill="#7ee7c7"/><path d="M592 370 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="300" x2="746" y2="300" stroke="#ff7b72" stroke-width="5"/><polygon points="762,300 738,289 738,311" fill="#ff7b72"/><text x="470.0" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">변조된 답을 믿고 엉뚱한 주소로</text><rect x="764" y="258" width="112" height="80" rx="10" fill="none" stroke="#ff7b72" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="125" width="300" height="300" rx="14" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><rect x="680" y="125" width="260" height="300" rx="14" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><rect x="385" y="432" width="130" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="450" y="453.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">① 이름 → 주소</text><rect x="747" y="432" width="125" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="810" y="453.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">② 주소로 연결</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주 DNS 서버가 응답하지 않으면 이름 조회가 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보조 DNS 서버가 대신 응답을 도울 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS 변조는 정상처럼 보이는 가짜 답을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름 조회와 그 뒤의 연결을 나누어 살펴봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>