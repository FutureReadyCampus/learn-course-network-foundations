<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>메모에 유효 시간을 적어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">메모에 유효 시간을 적어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">시간이 지나면 다시 물어봐요</text>
<circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="310" y="160" width="310" height="250" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="465" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">동네 안내소</text><rect x="740" y="245" width="190" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="835.0" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">한빛학교 교무실</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">메모</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">한빛학교 2반 → 본관 3층</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">남은 시간 5분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">메모</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">한빛학교 2반 → 본관 3층</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">남은 시간 2분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#ff7b72" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">메모</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">한빛학교 2반 → 본관 3층</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">0분: 시간 지남</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="330" y="240" width="270" height="120" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="465" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">메모</text><text x="465" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">한빛학교 2반 → 본관 3층</text><text x="465" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">새로 적음: 5분</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="748" y1="250" x2="628" y2="250" stroke="#c792ea" stroke-width="5"/><polygon points="612,250 636,239 636,261" fill="#c792ea"/><text x="680.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">답 · 5분 유효</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="173" y1="210" x2="286" y2="210" stroke="#6ea8fe" stroke-width="5"/><polygon points="302,210 278,199 278,221" fill="#6ea8fe"/><text x="237.5" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">같은 질문</text><line x1="318" y1="250" x2="173" y2="250" stroke="#7ee7c7" stroke-width="5"/><polygon points="157,250 181,239 181,261" fill="#7ee7c7"/><text x="237.5" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">메모 보고 바로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="465" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">오래된 답을 계속 쓰지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="628" y1="210" x2="716" y2="210" stroke="#ffb454" stroke-width="5"/><polygon points="732,210 708,199 708,221" fill="#ffb454"/><text x="680.0" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">다시 물어요</text><line x1="748" y1="250" x2="628" y2="250" stroke="#c792ea" stroke-width="5"/><polygon points="612,250 636,239 636,261" fill="#c792ea"/><text x="680.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#c792ea">새 답</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">교무실의 답을 5분 동안 쓸 수 있다고 메모해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 질문이 오면 메모를 보고 바로 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">5분이 지나면 그 메모는 더 쓰지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다시 물어서 새 답을 받고 시간을 새로 세요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>