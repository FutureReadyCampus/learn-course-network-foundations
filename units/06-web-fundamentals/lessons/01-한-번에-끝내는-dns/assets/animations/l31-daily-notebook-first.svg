<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>먼저 내 수첩부터 봐요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">먼저 내 수첩부터 봐요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 적은 것과 전에 들은 답을 확인해요</text>
<rect x="40" y="140" width="560" height="290" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="120" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">나</text><circle cx="120" cy="270" r="16" fill="#6ea8fe"/><rect x="102" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><rect x="220" y="185" width="340" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="390.0" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">내 수첩</text><text x="390.0" y="259" text-anchor="middle" font-size="14" fill="#9aa3b2">직접 적어 둔 위치</text><rect x="220" y="305" width="340" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="390.0" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">최근 메모</text><text x="390.0" y="379" text-anchor="middle" font-size="14" fill="#9aa3b2">전에 들은 답</text><rect x="700" y="240" width="220" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="810.0" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">동네 안내소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="216" y="181" width="348" height="98" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/><circle cx="530" cy="215" r="16" fill="#ff7b72"/><path d="M523 208 l14 14 M537 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><circle cx="530" cy="215" r="16" fill="#ff7b72"/><path d="M523 208 l14 14 M537 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="216" y="301" width="348" height="98" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/><circle cx="530" cy="335" r="16" fill="#ff7b72"/><path d="M523 328 l14 14 M537 328 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="530" cy="335" r="16" fill="#ff7b72"/><path d="M523 328 l14 14 M537 328 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="608" y1="268" x2="676" y2="268" stroke="#ffb454" stroke-width="5"/><polygon points="692,268 668,257 668,279" fill="#ffb454"/><text x="650.0" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">질문</text><rect x="696" y="236" width="228" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="708" y1="308" x2="608" y2="308" stroke="#7ee7c7" stroke-width="5"/><polygon points="592,308 616,297 616,319" fill="#7ee7c7"/><text x="650.0" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">답</text><circle cx="530" cy="335" r="16" fill="#7ee7c7"/><path d="M522 335 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="319" y="440" width="322" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">수첩은 직접 적은 것, 메모는 전에 들은 답</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 내 수첩에 직접 적어 둔 위치가 있는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">최근에 들은 답을 적은 메모가 있는지도 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 없으면 동네 안내소에 물어봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">들은 답은 메모에 잠시 남겨 두어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>