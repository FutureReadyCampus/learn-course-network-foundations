<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>DNS는 이름을 IP 주소로 바꿔요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS는 이름을 IP 주소로 바꿔요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">데이터를 보내려면 IP 주소가 필요해요</text>
<rect x="96" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="104" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="86,312 174,312 182,324 78,324" fill="#6ea8fe"/><text x="130" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="360" y="150" width="240" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">DNS</text><text x="480.0" y="214" text-anchor="middle" font-size="14" fill="#9aa3b2">이름 → IP 주소</text><rect x="796" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="804" y="271" width="52" height="32" fill="#3d4b60"/><rect x="825" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="808" y="320" width="44" height="5" fill="#6ea8fe"/><text x="830" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">example.com 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="184" width="129" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="130" y="205.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">example.com</text><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">이름만으로는 데이터를 보낼 수 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="183" y1="175" x2="331" y2="175" stroke="#6ea8fe" stroke-width="5"/><polygon points="347,175 323,164 323,186" fill="#6ea8fe"/><text x="265.0" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">IP 주소는?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="363" y1="215" x2="183" y2="215" stroke="#7ee7c7" stroke-width="5"/><polygon points="167,215 191,204 191,226" fill="#7ee7c7"/><text x="265.0" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">203.0.113.10 (예시)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="190" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;770,300;770,300" keyTimes="0.000;0.775;0.912;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">한 이름이 여러 주소를 쓰거나 주소를 바꿀 수도 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저에 example.com이라는 이름을 입력해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">컴퓨터가 DNS에 이 이름의 IP 주소를 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DNS가 IP 주소 203.0.113.10(예시)을 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">컴퓨터가 그 IP 주소로 데이터를 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>