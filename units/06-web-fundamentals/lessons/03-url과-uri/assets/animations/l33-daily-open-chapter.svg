<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>빌린 책에서 3장을 펼쳐요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">빌린 책에서 3장을 펼쳐요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">책 속 위치는 책을 받은 뒤 내가 찾아요</text>
<rect x="166" y="140" width="69" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">빌리기</text><rect x="239" y="140" width="28" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="253.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">→</text><rect x="271" y="140" width="100" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="321.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">한빛도서관</text><rect x="376" y="140" width="83" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="417.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">8번 창구</text><rect x="463" y="140" width="146" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="536.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="613" y="140" width="120" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="673.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?검색어=공룡</text><rect x="737" y="140" width="57" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="765.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#3장</text><circle cx="860" cy="260" r="16" fill="#6ea8fe"/><rect x="842" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="860" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사서</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="733" y="136" width="65" height="48" rx="8" fill="none" stroke="#e6e8ec" stroke-width="5"/><text x="480" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec"># 뒤는 책 안의 위치예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="408" y1="260" x2="776" y2="260" stroke="#6ea8fe" stroke-width="5"/><polygon points="792,260 768,249 768,271" fill="#6ea8fe"/><text x="600.0" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">공룡책 빌려 주세요</text><text x="600" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">3장은 말하지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="210" width="300" height="250" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="210" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">공룡책</text><rect x="90" y="260" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="289.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">1장</text><rect x="90" y="322" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="351.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">2장</text><rect x="90" y="384" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="413.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">3장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,360;800,360;400,360;400,360" keyTimes="0.000;0.525;0.650;1.000" dur="15s" repeatCount="indefinite"/><rect x="-25.0" y="-30" width="50" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="0" y="-4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe"></text><line x1="-11.0" y1="16" x2="11.0" y2="16" stroke="#3d4b60" stroke-width="4"/><line x1="-11.0" y1="32" x2="11.0" y2="32" stroke="#3d4b60" stroke-width="4"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="86" y="380" width="248" height="56" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="380" y1="330" x2="336" y2="400" stroke="#7ee7c7" stroke-width="4"/><polygon points="336,400 338,384 350,392" fill="#7ee7c7"/><text x="560" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">내가 3장을 펼쳐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지의 #3장은 책 안에서 펼칠 위치예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사서에게는 공룡책만 빌려 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사서가 공룡책을 건네줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책을 받은 뒤 내가 3장을 펼쳐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>