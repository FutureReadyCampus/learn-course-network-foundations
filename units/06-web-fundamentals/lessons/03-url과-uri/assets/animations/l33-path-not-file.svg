<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>URL 경로와 실제 파일</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">URL 경로와 실제 파일</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경로는 요청 주소이고, 결과는 서버가 정해요</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="500" y="130" width="420" height="330" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="710" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버</text><rect x="530" y="185" width="360" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="710.0" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">저장된 파일</text><text x="710.0" y="269" text-anchor="middle" font-size="14" fill="#9aa3b2">images/logo.png</text><rect x="530" y="320" width="360" height="110" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="710.0" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">요청 처리 프로그램</text><text x="710.0" y="414" text-anchor="middle" font-size="14" fill="#9aa3b2">HTML 또는 JSON을 만들어요</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="220" x2="501" y2="220" stroke="#6ea8fe" stroke-width="5"/><polygon points="517,220 493,209 493,231" fill="#6ea8fe"/><text x="347.5" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">/images/logo.png</text><rect x="526" y="181" width="368" height="108" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="520,255;520,255;180,255;180,255" keyTimes="0.000;0.275;0.412;1.000" dur="16s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="340" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">파일을 그대로 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="220" x2="501" y2="220" stroke="#ffb454" stroke-width="5"/><polygon points="517,220 493,209 493,231" fill="#ffb454"/><text x="347.5" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">/products/17</text><rect x="526" y="316" width="368" height="118" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><text x="710" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">products/17 파일은 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="520,360;520,360;270,360;270,360" keyTimes="0.000;0.775;0.900;1.000" dur="16s" repeatCount="indefinite"/><rect x="-35.0" y="-40" width="70" height="80" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0" y="-14" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">JSON</text><line x1="-21.0" y1="6" x2="21.0" y2="6" stroke="#3d4b60" stroke-width="4"/><line x1="-21.0" y1="22" x2="21.0" y2="22" stroke="#3d4b60" stroke-width="4"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="300" y="455" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">경로만 보고 파일이 있다고 단정하지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 /images/logo.png를 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 저장된 이미지 파일을 그대로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">/products/17은 같은 이름의 파일이 없을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 처리해 HTML이나 JSON 응답을 만들어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>