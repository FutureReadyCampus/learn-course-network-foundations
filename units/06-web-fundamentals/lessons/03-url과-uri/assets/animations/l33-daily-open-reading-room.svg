<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>공개된 열람실 안에서 찾아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">공개된 열람실 안에서 찾아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">건물 전체가 아니라 공개 구역 안에서 찾아요</text>
<rect x="40" y="130" width="600" height="330" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="70" y="160" text-anchor="start" font-size="17" font-weight="700" fill="#9aa3b2">도서관 건물 전체</text><rect x="60" y="190" width="190" height="110" rx="10" fill="#0f1115" stroke="#ff7b72" stroke-width="3"/><text x="155" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">직원실</text><text x="155" y="260" text-anchor="middle" font-size="14" fill="#9aa3b2">공개 안 해요</text><rect x="280" y="180" width="340" height="260" rx="12" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="450" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">열람실 (공개 구역)</text><rect x="310" y="240" width="280" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="450.0" y="270.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="310" y="320" width="280" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="450.0" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">안내 책자 (기본)</text><circle cx="830" cy="260" r="16" fill="#6ea8fe"/><rect x="812" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="830" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="126" width="608" height="338" rx="16" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="276" y="176" width="348" height="268" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><circle cx="250" cy="195" r="16" fill="#ff7b72"/><path d="M243 188 l14 14 M257 188 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="778" y1="240" x2="628" y2="240" stroke="#c792ea" stroke-width="5"/><polygon points="612,240 636,229 636,251" fill="#c792ea"/><text x="695.0" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="306" y="236" width="288" height="58" rx="8" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="778" y1="330" x2="628" y2="330" stroke="#6ea8fe" stroke-width="5"/><polygon points="612,330 636,319 636,341" fill="#6ea8fe"/><text x="695.0" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">그냥 왔어요</text><rect x="306" y="316" width="288" height="58" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/><text x="800" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">무엇을 줄지는 도서관이 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도서관 건물에는 여러 공간이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님에게는 열람실만 공개하고 직원실은 닫혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지의 위치는 열람실 안에서 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그냥 오면 도서관이 정한 안내 책자를 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>