<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Scheme, Host, Port</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Scheme, Host, Port</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청 방식, 서버 이름, 서비스 번호를 구분해요</text>
<rect x="70" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="105.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">https</text><rect x="144" y="140" width="41" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="164.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">://</text><rect x="188" y="140" width="142" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="259.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">www.test.co.kr</text><rect x="334" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="369.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:8080</text><rect x="408" y="140" width="171" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="493.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">/data/index.html</text><rect x="583" y="140" width="214" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="690.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?search_keyword=Test</text><rect x="801" y="140" width="89" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="845.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#result</text><g><rect x="40" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="175.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">scheme: https</text><text x="175.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">요청 방식 (프로토콜)</text><line x1="105.0" y1="186" x2="175" y2="244" stroke="#6ea8fe" stroke-width="3"/><polygon points="175,244 159,240 168,229" fill="#6ea8fe"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="136" width="78" height="48" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">host: www.test.co.kr</text><text x="480.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">요청을 보낼 서버 이름</text><line x1="259.0" y1="186" x2="480" y2="244" stroke="#7ee7c7" stroke-width="3"/><polygon points="480,244 464,247 468,234" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="184" y="136" width="150" height="48" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="650" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="785.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">port: 8080</text><text x="785.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">서비스 연결점 번호</text><line x1="369.0" y1="186" x2="785" y2="244" stroke="#ffb454" stroke-width="3"/><polygon points="785,244 770,249 772,235" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="136" width="78" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="394" width="475" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">HTTPS 기본 포트 443이면 생략:  https://www.test.co.kr/</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">https는 어떤 방식으로 요청할지 알려 주는 scheme이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">www.test.co.kr은 요청을 보낼 서버의 host예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">8080은 그 서버에서 연결할 서비스의 port예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기본 포트(HTTP 80, HTTPS 443)는 흔히 생략해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>