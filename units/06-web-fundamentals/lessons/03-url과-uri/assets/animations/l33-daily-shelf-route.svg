<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>지금 자리에서, 또는 입구에서</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">지금 자리에서, 또는 입구에서</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">길은 지금 위치나 입구를 기준으로 적어요</text>
<line x1="480" y1="190" x2="250" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="480" y1="190" x2="710" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="250" y1="300" x2="250" y2="350" stroke="#3d4b60" stroke-width="3"/><line x1="710" y1="300" x2="710" y2="350" stroke="#3d4b60" stroke-width="3"/><rect x="370" y="140" width="220" height="50" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="171.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">도서관 입구</text><rect x="160" y="250" width="180" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="250.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">과학 서가</text><rect x="620" y="250" width="180" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">사진 서가</text><rect x="160" y="350" width="180" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">공룡책</text><rect x="620" y="350" width="180" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">지도책</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="156" y="346" width="188" height="58" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="204" y="414" width="91" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="435.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">지금 위치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="300" y1="250" x2="405" y2="196" stroke="#ffb454" stroke-width="4"/><polygon points="405,196 395,209 389,196" fill="#ffb454"/><rect x="234" y="190" width="133" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="300" y="210.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">../ 한 단계 위로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="560" y1="196" x2="690" y2="246" stroke="#ffb454" stroke-width="4"/><polygon points="690,246 674,247 679,234" fill="#ffb454"/><line x1="710" y1="300" x2="710" y2="346" stroke="#ffb454" stroke-width="4"/><polygon points="710,346 703,332 717,332" fill="#ffb454"/><circle cx="820" cy="375" r="16" fill="#7ee7c7"/><path d="M812 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="326" y="440" width="307" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">../사진 서가/지도책 : 지금 위치에서 출발</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="366" y="136" width="228" height="58" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="560" y1="196" x2="690" y2="246" stroke="#7ee7c7" stroke-width="5"/><polygon points="690,246 674,247 679,234" fill="#7ee7c7"/><line x1="710" y1="300" x2="710" y2="346" stroke="#7ee7c7" stroke-width="5"/><polygon points="710,346 703,332 717,332" fill="#7ee7c7"/><circle cx="820" cy="375" r="16" fill="#7ee7c7"/><path d="M812 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="348" y="440" width="264" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="460.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">/사진 서가/지도책 : 입구에서 출발</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 지금 과학 서가의 공룡책 앞에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">../는 한 단계 위로 나간다는 약속이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거기서 사진 서가의 지도책으로 찾아가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">입구에서부터 적으면 어디서든 같은 길이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>