<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주소를 부분으로 나누어 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주소를 부분으로 나누어 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">구분 기호를 따라 다섯 부분으로 나눠요</text>
<rect x="49" y="200" width="73" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="85.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">https</text><rect x="126" y="200" width="43" height="44" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="147.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">://</text><rect x="173" y="200" width="150" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="248.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">www.test.co.kr</text><rect x="326" y="200" width="73" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="362.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">:8080</text><rect x="403" y="200" width="180" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="493.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">/data/index.html</text><rect x="587" y="200" width="226" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="700.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">?search_keyword=Test</text><rect x="817" y="200" width="93" height="44" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="863.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">#result</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">한 덩어리로 보면 읽기 어려워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="124,256 116,270 132,270" fill="#ffb454"/><polygon points="324,256 316,270 332,270" fill="#ffb454"/><polygon points="401,256 393,270 409,270" fill="#ffb454"/><polygon points="585,256 577,270 593,270" fill="#ffb454"/><polygon points="815,256 807,270 823,270" fill="#ffb454"/><text x="480" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">구분 기호  : / ? #  를 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="85.5" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">scheme</text><text x="248.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">host</text><text x="362.5" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">port</text><text x="493.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">path</text><text x="700.0" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">query</text><text x="863.5" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">fragment</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="173" y1="190" x2="399" y2="190" stroke="#7ee7c7" stroke-width="4"/><line x1="173" y1="190" x2="173" y2="202" stroke="#7ee7c7" stroke-width="4"/><line x1="399" y1="190" x2="399" y2="202" stroke="#7ee7c7" stroke-width="4"/><rect x="232" y="148" width="109" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="286.0" y="169.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">authority</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="322" y="196" width="81" height="52" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="813" y="196" width="101" height="52" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="320" y="378" width="321" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">port와 fragment는 생략될 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예시 주소 한 줄을 통째로 보면 어려워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">콜론, 슬래시, 물음표, 샵 기호를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">scheme, authority, path, query, fragment로 나눠요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">port와 fragment는 생략될 수도 있어요</text></g>

