<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Query: 물음표 뒤의 조건</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Query: 물음표 뒤의 조건</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름=값 쌍으로 서버에 조건을 전달해요</text>
<rect x="70" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="105.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">https</text><rect x="144" y="140" width="41" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="164.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">://</text><rect x="188" y="140" width="142" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="259.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">www.test.co.kr</text><rect x="334" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="369.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:8080</text><rect x="408" y="140" width="171" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="493.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">/data/index.html</text><rect x="583" y="140" width="214" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="690.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?search_keyword=Test</text><rect x="801" y="140" width="89" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="845.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#result</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="579" y="136" width="222" height="48" rx="8" fill="none" stroke="#ff7b72" stroke-width="5"/><text x="480" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">? 뒤가 query예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="242" y="230" width="40" height="50" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="262.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">?</text><rect x="286" y="230" width="181" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="376.5" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">search_keyword</text><rect x="471" y="230" width="40" height="50" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="491.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">=</text><rect x="515" y="230" width="73" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="551.5" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">Test</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="376.4" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">이름 (매개변수)</text><text x="551.6" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">값</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="230" width="130" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="661.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">&amp;page=2</text><text x="661.2" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">&amp; 로 이어 붙여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="350" width="360" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="380" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">서버가 받은 조건</text><text x="480.0" y="424" text-anchor="middle" font-size="14" fill="#9aa3b2">search_keyword = Test, page = 2</text><text x="820" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">path와는</text><text x="820" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">다른 부분이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">? 뒤의 search_keyword=Test가 query예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">search_keyword는 매개변수, Test는 값이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">&amp;로 이어 page=2 같은 조건을 더 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버는 path와 따로 이 조건들을 받아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>