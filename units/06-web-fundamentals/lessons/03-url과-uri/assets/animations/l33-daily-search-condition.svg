<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>물음표 뒤에 조건을 적어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">물음표 뒤에 조건을 적어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름=값 모양으로 원하는 조건을 알려요</text>
<rect x="166" y="140" width="69" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">빌리기</text><rect x="239" y="140" width="28" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="253.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">→</text><rect x="271" y="140" width="100" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="321.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">한빛도서관</text><rect x="376" y="140" width="83" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="417.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">8번 창구</text><rect x="463" y="140" width="146" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="536.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="613" y="140" width="120" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="673.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?검색어=공룡</text><rect x="737" y="140" width="57" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="765.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#3장</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="609" y="136" width="128" height="48" rx="8" fill="none" stroke="#ff7b72" stroke-width="5"/><text x="480" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">? 뒤가 조건이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="295" y="230" width="40" height="50" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="315.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">?</text><rect x="339" y="230" width="83" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="380.5" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">검색어</text><rect x="426" y="230" width="40" height="50" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="446.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">=</text><rect x="470" y="230" width="65" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="502.5" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">공룡</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><text x="380.35999999999996" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">이름 (매개변수)</text><text x="502.46" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">값</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="543" y="230" width="130" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="608.0" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">&amp;쪽=2</text><text x="608.1" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">&amp; 로 이어 붙여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="300" y="350" width="360" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="380" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">사서가 받은 조건</text><text x="480.0" y="424" text-anchor="middle" font-size="14" fill="#9aa3b2">검색어 = 공룡, 쪽 = 2</text><text x="820" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">서가 위치와는</text><text x="820" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">다른 부분이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지의 ? 뒤에는 찾을 조건을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">검색어는 이름, 공룡은 그 값이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조건을 더 붙이려면 &amp;로 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사서는 서가 위치와 따로 조건을 받아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>