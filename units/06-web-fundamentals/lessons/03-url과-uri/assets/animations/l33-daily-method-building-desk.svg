<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>방법, 건물, 창구</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">방법, 건물, 창구</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">어떻게, 어느 곳, 어느 창구를 나눠 봐요</text>
<rect x="166" y="140" width="69" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">빌리기</text><rect x="239" y="140" width="28" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="253.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">→</text><rect x="271" y="140" width="100" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="321.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">한빛도서관</text><rect x="376" y="140" width="83" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="417.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">8번 창구</text><rect x="463" y="140" width="146" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="536.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="613" y="140" width="120" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="673.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?검색어=공룡</text><rect x="737" y="140" width="57" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="765.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#3장</text><g><rect x="40" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="175.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">방법: 빌리기</text><text x="175.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">어떻게 요청할지</text><line x1="200.5" y1="186" x2="175" y2="244" stroke="#6ea8fe" stroke-width="3"/><polygon points="175,244 174,228 187,234" fill="#6ea8fe"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="162" y="136" width="77" height="48" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="345" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">건물: 한빛도서관</text><text x="480.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">어느 곳에 갈지</text><line x1="321.0" y1="186" x2="480" y2="244" stroke="#7ee7c7" stroke-width="3"/><polygon points="480,244 464,246 469,233" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="267" y="136" width="108" height="48" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="650" y="250" width="270" height="100" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="785.0" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">창구: 8번</text><text x="785.0" y="334" text-anchor="middle" font-size="14" fill="#9aa3b2">어느 창구에서 볼지</text><line x1="417.5" y1="186" x2="785" y2="244" stroke="#ffb454" stroke-width="3"/><polygon points="785,244 770,249 772,235" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="372" y="136" width="91" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="334" y="394" width="292" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">늘 쓰는 기본 창구면 번호를 안 적어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">맨 앞 칸은 빌리기라는 요청 방법이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한빛도서관은 찾아갈 건물 이름이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">8번 창구는 그 건물에서 볼 창구 번호예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기본 창구라면 번호를 빼고 적기도 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>