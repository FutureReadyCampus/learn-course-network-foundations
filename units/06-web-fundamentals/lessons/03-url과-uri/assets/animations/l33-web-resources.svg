<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>웹 자원의 여러 모습</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">웹 자원의 여러 모습</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">문서, 디자인, 코드, 사진, 데이터가 모두 자원이에요</text>
<g><rect x="55" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="130.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">HTML</text><text x="130.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">문서</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="310.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">CSS</text><text x="310.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">디자인 파일</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="415" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="490.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">JavaScript</text><text x="490.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">동작 코드</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="595" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">JPG</text><text x="670.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">사진</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="775" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="850.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">JSON</text><text x="850.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">API 데이터</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="51" y="156" width="158" height="98" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="231" y="156" width="158" height="98" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="411" y="156" width="158" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="591" y="156" width="158" height="98" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="771" y="156" width="158" height="98" rx="12" fill="none" stroke="#ff7b72" stroke-width="5"/><text x="850" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">저장된 파일이 아니라</text><text x="850" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">그때 만들어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="255" x2="420.0" y2="330" stroke="#6ea8fe" stroke-width="3"/><polygon points="420.0,330 404,333 408,320" fill="#6ea8fe"/><line x1="310" y1="255" x2="450.0" y2="330" stroke="#c792ea" stroke-width="3"/><polygon points="450.0,330 434,329 441,317" fill="#c792ea"/><line x1="490" y1="255" x2="480.0" y2="330" stroke="#ffb454" stroke-width="3"/><polygon points="480.0,330 475,315 489,317" fill="#ffb454"/><line x1="670" y1="255" x2="510.0" y2="330" stroke="#7ee7c7" stroke-width="3"/><polygon points="510.0,330 520,318 526,330" fill="#7ee7c7"/><line x1="850" y1="255" x2="540.0" y2="330" stroke="#ff7b72" stroke-width="3"/><polygon points="540.0,330 552,320 556,333" fill="#ff7b72"/><rect x="446" y="341" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="454" y="348" width="52" height="30" fill="#3d4b60"/><polygon points="436,387 524,387 532,399 428,399" fill="#6ea8fe"/><text x="480" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저가 모아 화면을 만들어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹페이지의 HTML 문서는 자원이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">CSS, JavaScript, JPG 사진도 각각 자원이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">API가 그때 만들어 주는 JSON 데이터도 자원이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저는 자원을 각각 요청해 화면을 만들어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>