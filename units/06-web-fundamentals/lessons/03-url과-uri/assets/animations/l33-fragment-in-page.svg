<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Fragment: 문서 안의 위치</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Fragment: 문서 안의 위치</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2"># 뒤는 문서 안에서 보여 줄 위치를 가리켜요</text>
<rect x="70" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="105.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">https</text><rect x="144" y="140" width="41" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="164.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">://</text><rect x="188" y="140" width="142" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="259.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">www.test.co.kr</text><rect x="334" y="140" width="70" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="369.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:8080</text><rect x="408" y="140" width="171" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="493.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">/data/index.html</text><rect x="583" y="140" width="214" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="690.0" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">?search_keyword=Test</text><rect x="801" y="140" width="89" height="40" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="845.5" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">#result</text><rect x="826" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="261" width="52" height="32" fill="#3d4b60"/><rect x="855" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="310" width="44" height="5" fill="#6ea8fe"/><text x="860" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="797" y="136" width="97" height="48" rx="8" fill="none" stroke="#e6e8ec" stroke-width="5"/><text x="480" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec"># 뒤는 문서 안의 위치예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="408" y1="260" x2="776" y2="260" stroke="#6ea8fe" stroke-width="5"/><polygon points="792,260 768,249 768,271" fill="#6ea8fe"/><text x="600.0" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">/data/index.html?search_keyword=Test</text><text x="600" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">#result는 보통 보내지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="210" width="300" height="250" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="210" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">받은 문서 (index.html)</text><rect x="90" y="260" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="289.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">intro</text><rect x="90" y="322" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="351.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">list</text><rect x="90" y="384" width="240" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="210.0" y="413.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">result</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,360;800,360;400,360;400,360" keyTimes="0.000;0.525;0.650;1.000" dur="16s" repeatCount="indefinite"/><rect x="-25.0" y="-30" width="50" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="0" y="-4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe"></text><line x1="-11.0" y1="16" x2="11.0" y2="16" stroke="#3d4b60" stroke-width="4"/><line x1="-11.0" y1="32" x2="11.0" y2="32" stroke="#3d4b60" stroke-width="4"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="380" width="248" height="56" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/><line x1="380" y1="330" x2="336" y2="400" stroke="#7ee7c7" stroke-width="4"/><polygon points="336,400 338,384 350,392" fill="#7ee7c7"/><text x="560" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">브라우저가 result 위치로 이동</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">#result는 문서 안에서 보여 줄 위치예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버에는 path와 query로 문서를 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 index.html 문서를 돌려줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 문서 안의 result 위치로 이동해요</text></g>

