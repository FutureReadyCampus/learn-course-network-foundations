<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도서관에서 받을 수 있는 것</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도서관에서 받을 수 있는 것</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">책뿐 아니라 사진, 지도, 목록도 받아요</text>
<g><rect x="55" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="130.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">책</text><text x="130.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">읽을 글</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="235" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="310.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">사진집</text><text x="310.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">사진</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="415" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="490.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">지도</text><text x="490.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">길 그림</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="595" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">DVD</text><text x="670.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">영상</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="775" y="160" width="150" height="90" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="850.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">대출 목록</text><text x="850.0" y="234" text-anchor="middle" font-size="14" fill="#9aa3b2">그때 뽑아 줘요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="51" y="156" width="158" height="98" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="231" y="156" width="158" height="98" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="411" y="156" width="158" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="591" y="156" width="158" height="98" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="771" y="156" width="158" height="98" rx="12" fill="none" stroke="#ff7b72" stroke-width="5"/><text x="850" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">저장 파일이 아니라</text><text x="850" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">그때 만들어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="130" y1="255" x2="420.0" y2="330" stroke="#6ea8fe" stroke-width="3"/><polygon points="420.0,330 404,333 408,320" fill="#6ea8fe"/><line x1="310" y1="255" x2="450.0" y2="330" stroke="#c792ea" stroke-width="3"/><polygon points="450.0,330 434,329 441,317" fill="#c792ea"/><line x1="490" y1="255" x2="480.0" y2="330" stroke="#ffb454" stroke-width="3"/><polygon points="480.0,330 475,315 489,317" fill="#ffb454"/><line x1="670" y1="255" x2="510.0" y2="330" stroke="#7ee7c7" stroke-width="3"/><polygon points="510.0,330 520,318 526,330" fill="#7ee7c7"/><line x1="850" y1="255" x2="540.0" y2="330" stroke="#ff7b72" stroke-width="3"/><polygon points="540.0,330 552,320 556,333" fill="#ff7b72"/><circle cx="480" cy="345" r="16" fill="#6ea8fe"/><rect x="462" y="365" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="480" y="437" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">필요한 것을 모아 숙제해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도서관에서 책을 빌려 볼 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사진집, 지도, DVD도 따로따로 받을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">대출 목록은 사서가 그때 뽑아 만들어 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필요한 것을 각각 받아 모아서 써요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>