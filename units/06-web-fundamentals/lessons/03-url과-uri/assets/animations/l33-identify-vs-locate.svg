<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>식별과 위치 지정</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">식별과 위치 지정</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">어떤 자원인지와 어디서 가져올지는 다른 질문이에요</text>
<rect x="415.0" y="220" width="130" height="130" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">자원</text><line x1="429.0" y1="266" x2="531.0" y2="266" stroke="#3d4b60" stroke-width="4"/><line x1="429.0" y1="282" x2="531.0" y2="282" stroke="#3d4b60" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="210" width="290" height="110" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="185.0" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">식별: 어떤 자원인가?</text><text x="185.0" y="304" text-anchor="middle" font-size="14" fill="#9aa3b2">URI라는 넓은 개념</text><line x1="335" y1="265" x2="389" y2="265" stroke="#c792ea" stroke-width="4"/><polygon points="405,265 381,255 381,275" fill="#c792ea"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="630" y="210" width="290" height="110" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="775.0" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">위치: 어디서 어떻게?</text><text x="775.0" y="304" text-anchor="middle" font-size="14" fill="#9aa3b2">접근 위치와 방법 = URL</text><line x1="625" y1="265" x2="571" y2="265" stroke="#7ee7c7" stroke-width="4"/><polygon points="555,265 579,255 579,275" fill="#7ee7c7"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="406" y="196" width="148" height="188" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="206" width="298" height="118" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="206" width="298" height="118" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="404" width="329" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">자원은 대상 · URI는 식별 · URL은 위치</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹에서 다루는 자원 하나가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">URI는 어떤 자원인지 식별하는 넓은 개념이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">URL은 어디서 어떻게 가져올지 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사람 비유는 이해를 돕는 그림일 뿐이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>