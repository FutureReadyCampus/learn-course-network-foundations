<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도서관 쪽지를 칸으로 나눠요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도서관 쪽지를 칸으로 나눠요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">방법, 건물, 창구, 서가, 조건, 위치로 읽어요</text>
<rect x="152" y="200" width="72" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="188.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">빌리기</text><rect x="228" y="200" width="29" height="44" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="242.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">→</text><rect x="261" y="200" width="105" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="313.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">한빛도서관</text><rect x="370" y="200" width="87" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="413.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">8번 창구</text><rect x="461" y="200" width="154" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="538.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">과학 서가/공룡책</text><rect x="619" y="200" width="126" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="682.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">?검색어=공룡</text><rect x="749" y="200" width="59" height="44" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="778.5" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">#3장</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">한 덩어리로 보면 읽기 어려워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><polygon points="226,256 218,270 234,270" fill="#ffb454"/><polygon points="368,256 360,270 376,270" fill="#ffb454"/><polygon points="459,256 451,270 467,270" fill="#ffb454"/><polygon points="617,256 609,270 625,270" fill="#ffb454"/><polygon points="747,256 739,270 755,270" fill="#ffb454"/><text x="480" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">칸을 나누는 표시를 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><text x="188.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">방법</text><text x="313.5" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">건물</text><text x="413.5" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">창구</text><text x="538.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">서가와 책</text><text x="682.0" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">조건</text><text x="778.5" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">책 속 위치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="261" y1="190" x2="457" y2="190" stroke="#7ee7c7" stroke-width="4"/><line x1="261" y1="190" x2="261" y2="202" stroke="#7ee7c7" stroke-width="4"/><line x1="457" y1="190" x2="457" y2="202" stroke="#7ee7c7" stroke-width="4"/><rect x="321" y="148" width="77" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="359.0" y="169.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">어느 곳</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="366" y="196" width="95" height="52" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="745" y="196" width="67" height="52" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="315" y="378" width="330" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">창구 번호와 책 속 위치는 빠질 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지 한 줄을 통째로 보면 읽기 어려워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">칸을 나누는 표시를 먼저 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">칸마다 방법, 건물, 창구, 서가가 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">창구 번호나 책 속 위치는 빠질 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>