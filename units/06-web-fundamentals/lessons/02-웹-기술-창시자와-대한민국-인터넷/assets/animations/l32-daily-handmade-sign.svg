<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안내판을 직접 만들어 길을 이어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안내판을 직접 만들어 길을 이어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">필요한 장비가 없으면 직접 만들기도 해요</text>
<rect x="50" y="180" width="250" height="190" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="175" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">마을 A</text><rect x="660" y="180" width="250" height="190" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="785" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">마을 B</text><polygon points="135,294 175,260 215,294" fill="#9aa3b2"/><rect x="143" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="166" y="314" width="18" height="28" fill="#3d4b60"/><polygon points="745,294 785,260 825,294" fill="#9aa3b2"/><rect x="753" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="776" y="314" width="18" height="28" fill="#3d4b60"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="480" cy="275" r="16" fill="#ffb454"/><text x="480" y="282" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">어떻게 이을까요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="400" y="220" width="160" height="90" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">안내판</text><text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#9aa3b2">구하기 어려워요</text><circle cx="560" cy="220" r="16" fill="#ff7b72"/><path d="M553 213 l14 14 M567 213 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="300" y1="275" x2="660" y2="275" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="390" y="220" width="180" height="110" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">직접 만든 안내판</text><text x="480.0" y="314" text-anchor="middle" font-size="14" fill="#9aa3b2">길을 골라 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,345;240,345;480,345;720,345;720,345" keyTimes="0.000;0.525;0.613;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="323" y="414" width="314" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">길이 생긴 것 ≠ 모두가 버스를 타는 것</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">멀리 떨어진 두 마을 사이에 길을 이으려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">갈림길 안내판을 구하기 어려웠어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내판을 직접 만들어 세우고 짐을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길이 생긴 것과 모두가 버스를 타는 건 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>