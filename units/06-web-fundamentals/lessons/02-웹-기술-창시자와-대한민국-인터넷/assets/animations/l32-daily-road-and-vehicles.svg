<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도로와 그 위를 달리는 차</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도로와 그 위를 달리는 차</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">도로는 기반이고, 차마다 하는 일이 달라요</text>
<rect x="80" y="380" width="800" height="60" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="418" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">도로: 모두가 다니는 기반</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="76" y="376" width="808" height="68" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="110" y="230" width="200" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="210.0" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">도서관 버스</text><text x="210.0" y="314" text-anchor="middle" font-size="14" fill="#9aa3b2">책을 빌려 읽어요</text><line x1="210" y1="330" x2="210" y2="380" stroke="#6ea8fe" stroke-width="4" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="380" y="230" width="200" height="100" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">우편차</text><text x="480.0" y="314" text-anchor="middle" font-size="14" fill="#9aa3b2">편지를 날라요</text><line x1="480" y1="330" x2="480" y2="380" stroke="#ffb454" stroke-width="4" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="650" y="230" width="200" height="100" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="750.0" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">놀이 버스</text><text x="750.0" y="314" text-anchor="middle" font-size="14" fill="#9aa3b2">함께 놀러 가요</text><line x1="750" y1="330" x2="750" y2="380" stroke="#c792ea" stroke-width="4" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="106" y="226" width="208" height="108" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="130,410;130,410;840,410;840,410" keyTimes="0.000;0.275;0.412;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="110" y1="205" x2="850" y2="205" stroke="#9aa3b2" stroke-width="4"/><line x1="110" y1="205" x2="110" y2="217" stroke="#9aa3b2" stroke-width="4"/><line x1="850" y1="205" x2="850" y2="217" stroke="#9aa3b2" stroke-width="4"/><rect x="329" y="162" width="302" height="33" rx="16" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/><text x="480.0" y="185.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">도로는 기반, 버스는 그 위의 한 가지</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도로는 여러 차가 함께 다니는 기반이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도서관 버스는 도로를 달려 책을 빌려줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">우편차와 놀이 버스도 같은 도로를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도로와 도서관 버스는 같은 것이 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>