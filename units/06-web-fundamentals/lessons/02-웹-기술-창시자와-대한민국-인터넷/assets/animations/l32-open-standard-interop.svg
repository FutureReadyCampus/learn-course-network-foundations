<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>공개 표준과 상호운용성</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">공개 표준과 상호운용성</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">브라우저와 서버의 회사가 달라도 웹을 함께 써요</text>
<rect x="60" y="150" width="180" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="150.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">A사 브라우저</text><rect x="60" y="260" width="180" height="70" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="150.0" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">B사 브라우저</text><rect x="60" y="370" width="180" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="150.0" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">C사 브라우저</text><rect x="700" y="250" width="220" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">웹 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="240" y1="185" x2="700" y2="280" stroke="#ff7b72" stroke-width="4" stroke-dasharray="8 6"/><circle cx="470" cy="232" r="16" fill="#ff7b72"/><path d="M463 225 l14 14 M477 225 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="470" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">회사 전용 비밀 규칙</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="361" y="134" width="217" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="470" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">공개 표준: HTML · HTTP</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="246" width="228" height="98" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="240" y1="185" x2="700" y2="295" stroke="#7ee7c7" stroke-width="4"/><line x1="240" y1="295" x2="700" y2="295" stroke="#7ee7c7" stroke-width="4"/><line x1="240" y1="405" x2="700" y2="295" stroke="#7ee7c7" stroke-width="4"/><circle cx="270" cy="185" r="16" fill="#7ee7c7"/><path d="M262 185 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="270" cy="295" r="16" fill="#7ee7c7"/><path d="M262 295 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="270" cy="405" r="16" fill="#7ee7c7"/><path d="M262 405 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">상호운용성: 회사가 달라도 함께 동작해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 전용 비밀 규칙은 상대가 알아듣지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTML과 HTTP 같은 공개 표준을 함께 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">표준을 따르면 어느 회사 브라우저든 웹을 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서로 다른 프로그램이 함께 동작해요: 상호운용성</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>