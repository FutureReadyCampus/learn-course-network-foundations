<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>편지 내용, 약속, 그리고 길</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">편지 내용, 약속, 그리고 길</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 쓰는지와 어떻게 주고받는지는 달라요</text>
<circle cx="110" cy="270" r="16" fill="#6ea8fe"/><rect x="92" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><polygon points="810,274 850,240 890,274" fill="#9aa3b2"/><rect x="818" y="274" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="294" width="18" height="28" fill="#3d4b60"/><text x="850" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도서관</text><rect x="60" y="390" width="840" height="60" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">편지가 다니는 길</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="178" y1="330" x2="766" y2="330" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,330 758,319 758,341" fill="#6ea8fe"/><text x="480.0" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">편지 보내 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="390" y="130" width="180" height="150" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">편지 내용</text><text x="410" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">제목</text><text x="410" y="218" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">문단</text><text x="410" y="246" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">다른 글 안내</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="386" y="126" width="188" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="820,412;820,412;150,412;150,412" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">약속대로 답장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="649" y="188" width="61" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="680" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">내용</text><rect x="413" y="314" width="133" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">주고받는 약속</text><rect x="56" y="386" width="848" height="68" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="779" y="364" width="43" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">길</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 도서관에 소개 편지를 보내 달라고 부탁해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도서관이 제목과 문단을 갖춘 편지를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">약속대로 답장이 길을 따라 나에게 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용, 주고받는 약속, 길은 각자 다른 일이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>