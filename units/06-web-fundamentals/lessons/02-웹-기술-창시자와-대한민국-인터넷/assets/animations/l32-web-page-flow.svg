<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>문서·규칙·연결로 나누어 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">문서·규칙·연결로 나누어 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">HTML은 문서, HTTP는 규칙, 인터넷은 연결이에요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="816" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="271" width="52" height="32" fill="#3d4b60"/><rect x="845" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="320" width="44" height="5" fill="#6ea8fe"/><text x="850" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="60" y="390" width="840" height="60" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">인터넷 · TCP/IP</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="180" x2="766" y2="180" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,180 758,169 758,191" fill="#6ea8fe"/><text x="480.0" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">HTTP 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="798" y1="240" x2="178" y2="240" stroke="#ffb454" stroke-width="5"/><polygon points="162,240 186,229 186,251" fill="#ffb454"/><text x="480.0" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">HTTP 응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="200.0" y="260" width="120" height="110" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="260" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">HTML 문서</text><line x1="214.0" y1="306" x2="306.0" y2="306" stroke="#3d4b60" stroke-width="4"/><line x1="214.0" y1="322" x2="306.0" y2="322" stroke="#3d4b60" stroke-width="4"/><text x="260" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">링크</text><line x1="246.28" y1="358" x2="273.72" y2="358" stroke="#6ea8fe" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="820,412;820,412;150,412;150,412" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="386" width="848" height="68" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="201" y="336" width="118" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><line x1="338" y1="300" x2="766" y2="300" stroke="#7ee7c7" stroke-width="5"/><polygon points="782,300 758,289 758,311" fill="#7ee7c7"/><text x="560.0" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">다시 요청</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 HTTP 규칙으로 서버에 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 HTML 문서를 HTTP 응답으로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">데이터는 인터넷과 TCP/IP를 통해 오가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">링크를 누르면 다른 문서를 다시 요청해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>