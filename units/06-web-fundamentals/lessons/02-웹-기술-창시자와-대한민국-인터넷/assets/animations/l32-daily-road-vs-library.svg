<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>길을 놓은 사람, 도서관을 만든 사람</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">길을 놓은 사람, 도서관을 만든 사람</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">둘 다 마을에 도움이 됐지만 하는 일이 달라요</text>
<rect x="50" y="160" width="420" height="280" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="260" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">길을 놓은 사람</text><rect x="490" y="160" width="420" height="280" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="700" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">이동 도서관을 만든 사람</text><g><polygon points="110,294 150,260 190,294" fill="#9aa3b2"/><rect x="118" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="141" y="314" width="18" height="28" fill="#3d4b60"/><polygon points="330,294 370,260 410,294" fill="#9aa3b2"/><rect x="338" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="361" y="314" width="18" height="28" fill="#3d4b60"/><line x1="195" y1="320" x2="325" y2="320" stroke="#7ee7c7" stroke-width="6"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="46" y="156" width="428" height="288" rx="14" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="555.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="600" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">책 1</text><line x1="569.0" y1="276" x2="631.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="569.0" y1="292" x2="631.0" y2="292" stroke="#3d4b60" stroke-width="4"/><rect x="675.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="720" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">책 2</text><line x1="689.0" y1="276" x2="751.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="689.0" y1="292" x2="751.0" y2="292" stroke="#3d4b60" stroke-width="4"/><rect x="795.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="840" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">책 3</text><line x1="809.0" y1="276" x2="871.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="809.0" y1="292" x2="871.0" y2="292" stroke="#3d4b60" stroke-width="4"/><line x1="645" y1="290" x2="659" y2="290" stroke="#7ee7c7" stroke-width="3"/><polygon points="675,290 651,281 651,299" fill="#7ee7c7"/><line x1="765" y1="290" x2="779" y2="290" stroke="#7ee7c7" stroke-width="3"/><polygon points="795,290 771,281 771,299" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="486" y="156" width="428" height="288" rx="14" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="394" y="394" width="171" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서로 다른 일이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="422" y="124" width="116" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">마을 공로상</text><rect x="350" y="394" width="260" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">함께 언급되지만 역할은 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 사람은 마을과 마을을 잇는 길을 놓았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 사람은 길 위를 다니는 이동 도서관을 만들었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길 놓기와 도서관 만들기는 서로 다른 일이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 상을 받았지만 맡은 역할은 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>