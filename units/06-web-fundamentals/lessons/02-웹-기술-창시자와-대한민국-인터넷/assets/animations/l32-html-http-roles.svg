<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTML, HTTP, 인터넷의 역할</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTML, HTTP, 인터넷의 역할</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">문서 구조와 주고받는 규칙, 전달 기반을 나눠요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">브라우저</text><rect x="816" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="271" width="52" height="32" fill="#3d4b60"/><rect x="845" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="320" width="44" height="5" fill="#6ea8fe"/><text x="850" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="60" y="390" width="840" height="60" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="480" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">인터넷 (TCP/IP)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="178" y1="330" x2="766" y2="330" stroke="#6ea8fe" stroke-width="5"/><polygon points="782,330 758,319 758,341" fill="#6ea8fe"/><text x="480.0" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">HTTP 요청: GET /index.html</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="390" y="130" width="180" height="150" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">HTML 문서</text><text x="410" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">&lt;h1&gt; 제목</text><text x="410" y="218" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">&lt;p&gt; 문단</text><text x="410" y="246" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">&lt;a&gt; 링크</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="386" y="126" width="188" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="820,412;820,412;150,412;150,412" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">HTTP 응답</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="646" y="188" width="69" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="680" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">HTML</text><rect x="380" y="314" width="199" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">HTTP: 요청·응답 규칙</text><rect x="56" y="386" width="848" height="68" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="754" y="364" width="91" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">전달 기반</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 HTTP 규칙으로 웹페이지를 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버에는 HTML로 구조를 표시한 문서가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTP 응답이 인터넷(TCP/IP)을 따라 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTML은 문서, HTTP는 약속, 인터넷은 길이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>