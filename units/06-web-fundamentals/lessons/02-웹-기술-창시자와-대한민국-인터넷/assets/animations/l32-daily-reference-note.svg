<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>참고한 책을 바로 찾고 싶어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">참고한 책을 바로 찾고 싶어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">책과 책을 이어 두면 찾기와 나누기가 쉬워요</text>
<circle cx="110" cy="270" r="16" fill="#6ea8fe"/><rect x="92" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="230.0" y="180" width="140" height="140" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="300" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">보고서</text><line x1="244.0" y1="226" x2="356.0" y2="226" stroke="#3d4b60" stroke-width="4"/><line x1="244.0" y1="242" x2="356.0" y2="242" stroke="#3d4b60" stroke-width="4"/><text x="300" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">참고: 책 B</text><line x1="266.82" y1="308" x2="333.18" y2="308" stroke="#6ea8fe" stroke-width="2"/><rect x="565.0" y="140" width="110" height="120" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="620" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">책 C</text><line x1="579.0" y1="186" x2="661.0" y2="186" stroke="#3d4b60" stroke-width="4"/><line x1="579.0" y1="202" x2="661.0" y2="202" stroke="#3d4b60" stroke-width="4"/><rect x="765.0" y="140" width="110" height="120" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="820" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">책 D</text><line x1="779.0" y1="186" x2="861.0" y2="186" stroke="#3d4b60" stroke-width="4"/><line x1="779.0" y1="202" x2="861.0" y2="202" stroke="#3d4b60" stroke-width="4"/><rect x="665.0" y="300" width="110" height="120" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="720" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">책 B</text><line x1="679.0" y1="346" x2="761.0" y2="346" stroke="#3d4b60" stroke-width="4"/><line x1="679.0" y1="362" x2="761.0" y2="362" stroke="#3d4b60" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="226" y="176" width="148" height="148" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><polyline points="370,250 565,200 765,200 720,300" fill="none" stroke="#ffb454" stroke-width="4" stroke-dasharray="8 6"/><circle cx="620" cy="120" r="16" fill="#ffb454"/><text x="620" y="127" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><circle cx="820" cy="120" r="16" fill="#ffb454"/><text x="820" y="127" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="470" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">이리저리 찾아다녀요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="370" y1="300" x2="662" y2="355" stroke="#7ee7c7" stroke-width="5"/><circle cx="720" cy="290" r="16" fill="#7ee7c7"/><path d="M712 290 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="374" y="434" width="192" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="470" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">책 B로 바로 가는 쪽지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="174" y="379" width="251" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="300" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">누구나 쪽지를 따라 바로 찾아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보고서를 읽다가 참고한 책 B가 궁금해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책장 여기저기를 다니며 책 B를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보고서에 책 B로 바로 가는 쪽지를 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지를 따라가면 누구나 바로 찾을 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>