<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>아이디어에서 상까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">아이디어에서 상까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">생각, 만들기, 고치기가 이어져야 해요</text>
<g><rect x="40" y="180" width="200" height="100" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="140.0" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">아이디어</text><text x="140.0" y="264" text-anchor="middle" font-size="14" fill="#9aa3b2">나눔함을 떠올려요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="176" width="208" height="108" rx="12" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="265" y="180" width="200" height="100" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="365.0" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">직접 만들기</text><text x="365.0" y="264" text-anchor="middle" font-size="14" fill="#9aa3b2">상자를 만들어 시험</text><line x1="243" y1="230" x2="247" y2="230" stroke="#9aa3b2" stroke-width="3"/><polygon points="263,230 239,221 239,239" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="261" y="176" width="208" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="490" y="180" width="200" height="100" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="590.0" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">함께 고치기</text><text x="590.0" y="264" text-anchor="middle" font-size="14" fill="#9aa3b2">친구들이 쓰며 고쳐요</text><line x1="468" y1="230" x2="472" y2="230" stroke="#9aa3b2" stroke-width="3"/><polygon points="488,230 464,221 464,239" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="486" y="176" width="208" height="108" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="715" y="180" width="200" height="100" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="815.0" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">상 받기</text><text x="815.0" y="264" text-anchor="middle" font-size="14" fill="#9aa3b2">기여를 인정해요</text><line x1="693" y1="230" x2="697" y2="230" stroke="#9aa3b2" stroke-width="3"/><polygon points="713,230 689,221 689,239" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="711" y="176" width="208" height="108" rx="12" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><circle cx="540" cy="330" r="16" fill="#6ea8fe"/><rect x="522" y="350" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="590" cy="330" r="16" fill="#6ea8fe"/><rect x="572" y="350" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="640" cy="330" r="16" fill="#6ea8fe"/><rect x="622" y="350" width="36" height="46" rx="12" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><circle cx="790" cy="355" r="26" fill="#ffb454"/><polygon points="775,378 790,410 805,378" fill="#ff7b72"/><text x="480" y="455" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">상은 기여를 인정해요. 혼자 다 만들었다는 뜻은 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">책 나눔함을 만들자는 아이디어를 떠올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 상자를 만들어 시험해 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">친구들이 함께 쓰며 오래 고쳐 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">학교가 이 기여를 인정해 상을 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>