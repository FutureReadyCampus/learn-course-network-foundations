<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>전길남과 팀 버너스리</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전길남과 팀 버너스리</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">연결 기반과 웹 서비스, 서로 다른 기여예요</text>
<rect x="50" y="160" width="420" height="280" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="260" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">전길남 · 국내 연결 기반</text><rect x="490" y="160" width="420" height="280" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="700" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">팀 버너스리 · 웹 문서 서비스</text><g><rect x="116" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="124" y="271" width="52" height="32" fill="#3d4b60"/><rect x="145" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="128" y="320" width="44" height="5" fill="#6ea8fe"/><text x="150" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서울</text><rect x="336" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="344" y="271" width="52" height="32" fill="#3d4b60"/><rect x="365" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="348" y="320" width="44" height="5" fill="#6ea8fe"/><text x="370" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">구미</text><line x1="190" y1="290" x2="330" y2="290" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="156" width="428" height="288" rx="14" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="555.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="600" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">문서</text><line x1="569.0" y1="276" x2="631.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="569.0" y1="292" x2="631.0" y2="292" stroke="#3d4b60" stroke-width="4"/><rect x="675.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="720" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">문서</text><line x1="689.0" y1="276" x2="751.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="689.0" y1="292" x2="751.0" y2="292" stroke="#3d4b60" stroke-width="4"/><rect x="795.0" y="230" width="90" height="110" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="840" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">문서</text><line x1="809.0" y1="276" x2="871.0" y2="276" stroke="#3d4b60" stroke-width="4"/><line x1="809.0" y1="292" x2="871.0" y2="292" stroke="#3d4b60" stroke-width="4"/><line x1="645" y1="290" x2="659" y2="290" stroke="#7ee7c7" stroke-width="3"/><polygon points="675,290 651,281 651,299" fill="#7ee7c7"/><line x1="765" y1="290" x2="779" y2="290" stroke="#7ee7c7" stroke-width="3"/><polygon points="795,290 771,281 771,299" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="486" y="156" width="428" height="288" rx="14" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="372" y="394" width="215" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결 기반 ≠ 문서 서비스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="394" y="124" width="171" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">인터넷 명예의 전당</text><rect x="350" y="394" width="260" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">함께 언급되지만 역할은 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전길남은 국내 컴퓨터 네트워크 연결에 기여했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">팀 버너스리는 문서를 잇는 웹을 만들었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결 기반과 문서 서비스는 서로 다른 일이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 인터넷 명예의 전당에 올랐지만 역할은 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>