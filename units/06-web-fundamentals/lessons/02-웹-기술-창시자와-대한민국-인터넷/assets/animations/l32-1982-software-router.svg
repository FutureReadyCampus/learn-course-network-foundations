<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>1982년 서울대–구미 연구망</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">1982년 서울대–구미 연구망</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">라우터 기능을 소프트웨어로 구현해 연결했어요</text>
<rect x="50" y="180" width="250" height="190" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="175" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">서울대학교</text><rect x="660" y="180" width="250" height="190" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="785" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">구미 전자기술연구소</text><rect x="141" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="149" y="271" width="52" height="32" fill="#3d4b60"/><rect x="170" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="153" y="320" width="44" height="5" fill="#6ea8fe"/><rect x="751" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="759" y="271" width="52" height="32" fill="#3d4b60"/><rect x="780" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="763" y="320" width="44" height="5" fill="#6ea8fe"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="275" r="16" fill="#ffb454"/><text x="480" y="282" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">어떻게 이을까요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="220" width="160" height="90" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">라우터 장비</text><text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#9aa3b2">구하기 어려워요</text><circle cx="560" cy="220" r="16" fill="#ff7b72"/><path d="M553 213 l14 14 M567 213 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="300" y1="275" x2="660" y2="275" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="390" y="220" width="180" height="110" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">소프트웨어 라우터</text><text x="480.0" y="314" text-anchor="middle" font-size="14" fill="#9aa3b2">길을 골라 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,345;240,345;480,345;720,345;720,345" keyTimes="0.000;0.525;0.613;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="414" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">초기 연구망 ≠ 누구나 쓰는 대중 인터넷 서비스</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1982년 서울대와 구미 연구소를 이으려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">당시에는 라우터 장비를 구하기 어려웠어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터 기능을 소프트웨어로 직접 만들어 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">초기 연구망은 대중 인터넷 서비스와 구분해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>