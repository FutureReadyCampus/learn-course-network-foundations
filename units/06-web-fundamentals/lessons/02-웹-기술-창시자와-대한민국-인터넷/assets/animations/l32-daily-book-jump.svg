<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>표시를 따라 다른 책으로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">표시를 따라 다른 책으로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">책 속 표시를 따라 바로 건너갈 수 있어요</text>
<rect x="125.0" y="180" width="150" height="160" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">과학책</text><line x1="139.0" y1="226" x2="261.0" y2="226" stroke="#3d4b60" stroke-width="4"/><line x1="139.0" y1="242" x2="261.0" y2="242" stroke="#3d4b60" stroke-width="4"/><text x="200" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">→ 사전 보기</text><line x1="161.5" y1="328" x2="238.5" y2="328" stroke="#6ea8fe" stroke-width="2"/><rect x="405.0" y="180" width="150" height="160" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">용어 사전</text><line x1="419.0" y1="226" x2="541.0" y2="226" stroke="#3d4b60" stroke-width="4"/><line x1="419.0" y1="242" x2="541.0" y2="242" stroke="#3d4b60" stroke-width="4"/><text x="480" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">→ 도감 보기</text><line x1="441.5" y1="328" x2="518.5" y2="328" stroke="#6ea8fe" stroke-width="2"/><rect x="685.0" y="180" width="150" height="160" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="760" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">동물 도감</text><line x1="699.0" y1="226" x2="821.0" y2="226" stroke="#3d4b60" stroke-width="4"/><line x1="699.0" y1="242" x2="821.0" y2="242" stroke="#3d4b60" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="200" y1="250" x2="200" y2="300" stroke="#ffb454" stroke-width="4"/><polygon points="200,312 192,298 208,298" fill="#ffb454"/><text x="200" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">앞에서 뒤로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="255" y1="324" x2="384" y2="324" stroke="#7ee7c7" stroke-width="4"/><polygon points="400,324 376,314 376,334" fill="#7ee7c7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="126" y="304" width="148" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="535" y1="324" x2="664" y2="324" stroke="#c792ea" stroke-width="4"/><polygon points="680,324 656,314 656,334" fill="#c792ea"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="406" y="304" width="148" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="125" y1="165" x2="835" y2="165" stroke="#c792ea" stroke-width="4"/><line x1="125" y1="165" x2="125" y2="177" stroke="#c792ea" stroke-width="4"/><line x1="835" y1="165" x2="835" y2="177" stroke="#c792ea" stroke-width="4"/><rect x="373" y="123" width="215" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480.0" y="144.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">책들이 표시로 이어진 묶음</text><rect x="126" y="304" width="148" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="406" y="304" width="148" height="34" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><text x="480" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">표시 하나는 건너갈 지점이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">종이책은 보통 앞에서 뒤로 차례대로 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">과학책 속 표시를 따라 사전으로 건너가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사전 속 표시를 따라 도감으로 또 건너가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이어진 책 묶음과 표시 하나를 구분해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>