<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT의 동작은 한 가지가 아니에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT의 동작은 한 가지가 아니에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">두 질문으로 나눠서 봐요</text>
<circle cx="480" cy="260" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 254 h28 l-7 -7 M495 266 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g><rect x="130" y="150" width="300" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="280.0" y="192.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">① 바깥 주소·포트는?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="150" width="300" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="680.0" y="192.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">② 들여보낼 조건은?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="280" y="255" text-anchor="middle" font-size="16" fill="#9aa3b2">새 통신마다 포트를 다르게?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="680" y="255" text-anchor="middle" font-size="16" fill="#9aa3b2">먼저 말 건 상대만 허용?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="382" width="380" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">이름 외우기 X · 두 질문으로 구분</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT의 동작에는 두 질문이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫째, 바깥에 어떤 주소·포트로 보일까?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘째, 바깥 패킷은 어떤 조건에 들여보낼까?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">유형 이름보다 이 두 질문을 기억해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>