<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안쪽(LAN)과 바깥쪽(WAN)</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안쪽(LAN)과 바깥쪽(WAN)</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 공유기, 서로 다른 두 네트워크예요</text>
<g><rect x="40" y="150" width="320" height="250" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="200.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">LAN · 공유기 안쪽</text><rect x="88" y="250" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="260" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="318" r="3" fill="#6ea8fe"/><rect x="216" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="224" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="206,302 294,302 302,314 198,314" fill="#6ea8fe"/></g><circle cx="480" cy="290" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 284 h28 l-7 -7 M495 296 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="150" width="320" height="250" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="760.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">WAN · 공유기 바깥쪽</text><text x="760" y="290" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">ISP 연결</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="115" y="414" width="170" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="200" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">사설 주소 사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="675" y="414" width="170" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="760" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ISP가 준 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="423" width="300" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">이 주소는 어느 쪽 주소일까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">LAN은 공유기 안쪽의 집 네트워크예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">WAN은 인터넷 회사 쪽 연결이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안쪽은 사설, 바깥쪽은 ISP가 준 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그림을 볼 때 어느 쪽 주소인지 먼저 물어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>