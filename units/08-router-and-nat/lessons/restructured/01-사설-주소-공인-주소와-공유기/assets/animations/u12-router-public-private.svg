<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사설 IP와 공인 IP</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사설 IP와 공인 IP</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">아파트 호수와 도로명 주소 같아요</text>
<g><polygon points="160,264 200,230 240,264" fill="#9aa3b2"/><rect x="168" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="191" y="284" width="18" height="28" fill="#3d4b60"/><text x="200" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">우리 집</text><rect x="85" y="364" width="230" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">노트북 192.168.0.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><polygon points="720,264 760,230 800,264" fill="#9aa3b2"/><rect x="728" y="264" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="751" y="284" width="18" height="28" fill="#3d4b60"/><text x="760" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">옆 동네 집</text><rect x="645" y="364" width="230" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="760" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">노트북 192.168.0.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="480" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">같은 번호!</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="173" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">각자 자기 집 안에서만 의미가 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><ellipse cx="480" cy="200" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="300" y="423" width="360" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">인터넷에서는 공인 IP로 구분해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">우리 집 노트북은 192.168.0.25예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">옆 동네 집도 같은 번호를 써도 괜찮아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사설 주소는 집 안에서만 통해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷에서는 공인 주소가 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>