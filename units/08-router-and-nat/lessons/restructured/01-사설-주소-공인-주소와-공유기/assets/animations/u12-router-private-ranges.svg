<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사설 IPv4는 세 범위</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사설 IPv4는 세 범위</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공유기 화면에서 자주 보여요</text>
<g><rect x="150" y="140" width="330" height="64" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="315.0" y="180.64" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">10.0.0.0/8</text><rect x="500" y="140" width="310" height="64" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="655.0" y="179.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">예 10.4.2.8</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="230" width="330" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="315.0" y="270.64" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">172.16.0.0/12</text><rect x="500" y="230" width="310" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="655.0" y="269.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">예 172.20.1.9</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="320" width="330" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="315.0" y="360.64" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">192.168.0.0/16</text><rect x="500" y="320" width="310" height="64" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="655.0" y="359.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">예 192.168.0.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="413" width="400" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">172로 시작해도 16~31만 사설이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사설 주소 첫째 범위는 10.x.x.x예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘째는 172.16 ~ 172.31이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">셋째는 192.168.x.x예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫 숫자만 보고 판단하지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>