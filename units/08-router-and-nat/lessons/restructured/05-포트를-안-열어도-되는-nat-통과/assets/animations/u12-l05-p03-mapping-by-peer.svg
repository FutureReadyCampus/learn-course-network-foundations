<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상대가 바뀌면 바깥 포트도 바뀔까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상대가 바뀌면 바깥 포트도 바뀔까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">소개한 주소가 협력사에도 맞는지 물어요</text>
<g><rect x="40" y="135" width="270" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="175.0" y="162.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">박 팀장 PC 192.168.0.20:3000</text><line x1="310" y1="157" x2="340" y2="157" stroke="#9aa3b2" stroke-width="3"/><rect x="340" y="135" width="250" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="465.0" y="162.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">STUN 203.0.113.60:3478</text><line x1="590" y1="157" x2="620" y2="157" stroke="#9aa3b2" stroke-width="3"/><rect x="620" y="135" width="300" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="770.0" y="162.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">서버가 본 주소 192.0.2.123:40001</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="131" width="888" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="215" width="390" height="190" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="255" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">상대와 무관한 매핑</text><rect x="510" y="215" width="390" height="190" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">상대마다 달라지는 매핑</text><rect x="85" y="265" width="340" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="292.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">서버 → 192.0.2.123:40001</text><rect x="535" y="265" width="340" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="705.0" y="292.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">서버 → 192.0.2.123:40001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="81" y="261" width="348" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="261" width="348" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="325" width="340" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="352.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">협력사 → 192.0.2.123:40001</text><rect x="535" y="325" width="340" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="705.0" y="352.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">협력사 → 192.0.2.123:40017</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="321" width="348" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="870" cy="247" r="16" fill="#ff7b72"/><path d="M863 240 l14 14 M877 240 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="300" y="434" width="360" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">소개한 주소가 협력사에는 안 맞아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">STUN 서버가 본 바깥 주소를 협력사에 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버와 통신할 때는 두 방식 모두 :40001이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">협력사와 통신하면 오른쪽만 :40017로 달라져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소개한 주소가 협력사에는 안 맞아요</text></g>

