<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT에게 꼭 따로 물어야 할 두 가지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT에게 꼭 따로 물어야 할 두 가지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 하나로 연결 가능성을 판단하지 않아요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="180" y="118" width="600" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지우 메모: Port Restricted라서 안 될 거야</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="180" y="118" width="600" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">새 메모: 매핑과 필터링을 따로 확인한다</text><circle cx="810" cy="140" r="16" fill="#7ee7c7"/><path d="M802 140 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="114" width="608" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><line x1="127" y1="310" x2="175" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="625" y1="310" x2="806" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><rect x="41" y="276" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="49" y="283" width="52" height="30" fill="#3d4b60"/><polygon points="31,322 119,322 127,334 23,334" fill="#6ea8fe"/><text x="75" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">안쪽 PC</text><rect x="816" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="281" width="52" height="32" fill="#3d4b60"/><rect x="845" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="330" width="44" height="5" fill="#6ea8fe"/><text x="850" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바깥 상대</text><rect x="175" y="228" width="450" height="150" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="400" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">공유기의 변환표</text><rect x="190" y="264" width="205" height="32" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="292.5" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Internal</text><rect x="405" y="264" width="205" height="32" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="507.5" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">External</text><rect x="190" y="304" width="205" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="292.5" y="331.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">192.168.0.20:3000</text><rect x="405" y="304" width="205" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="507.5" y="331.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">192.0.2.123:40001</text><rect x="652" y="262" width="20" height="96" rx="5" fill="#7ee7c7" fill-opacity="0.35" stroke="#7ee7c7" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="182" width="320" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="204.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">그런데 회의는 잘 되고 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="190" y="182" width="420" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="400" y="203.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">① 매핑: 바깥에 어떤 주소·포트로 보이나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="401" y="300" width="213" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,310;800,310;700,310;700,310" keyTimes="0.000;0.512;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="515" y="396" width="370" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="417.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">② 필터링: 누가 보낸 패킷까지 받나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="648" y="258" width="28" height="104" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우의 메모는 이름만 보고 안 될 거라 판단했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫째 질문은 매핑: 바깥에 어떻게 보이나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘째 질문은 필터링: 누가 보낸 패킷을 받나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 두 질문을 따로 확인한다고 고쳐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>