<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포트를 안 열었는데 화상회의는?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포트를 안 열었는데 화상회의는?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">둘 다 바깥으로 먼저 연결하면 막히지 않아요</text>
<rect x="56" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="46,302 134,302 142,314 38,314" fill="#6ea8fe"/><text x="90" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><circle cx="250" cy="290" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M235 284 h28 l-7 -7 M265 296 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="446" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="456" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="480" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">화상회의 서버</text><circle cx="710" cy="290" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M695 284 h28 l-7 -7 M725 296 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="710" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="836" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="826,302 914,302 922,314 818,314" fill="#6ea8fe"/><text x="870" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">협력사</text><line x1="140" y1="290" x2="222" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="278" y1="290" x2="435" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="525" y1="290" x2="682" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="738" y1="290" x2="820" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="158" width="400" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="181.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">양쪽 모두 공유기 뒤 · 열린 포트 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,290;140,290;440,290;440,290" keyTimes="0.000;0.263;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="820,290;820,290;520,290;520,290" keyTimes="0.000;0.263;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="432" y="241" width="96" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="215" r="16" fill="#7ee7c7"/><path d="M472 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="290" y="384" width="380" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버를 거치니 포트를 열 일이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="189" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="130" y1="395" x2="830" y2="395" stroke="#ffb454" stroke-width="4" stroke-dasharray="10 8"/><rect x="260" y="428" width="440" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">일부 앱은 서버 없이 직접(P2P)도 시도해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양쪽 모두 공유기 뒤에 있고 포트는 안 열었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 서비스 서버로 먼저 연결해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">영상과 음성이 서버를 거쳐 오가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일부 앱은 서버 없이 직접(P2P)도 시도해요</text></g>

