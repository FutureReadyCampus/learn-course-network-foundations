<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Full Cone, Symmetric은 어떻게 읽을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Full Cone, Symmetric은 어떻게 읽을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">옛 이름을 매핑과 필터링으로 풀어요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="135" width="840" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="163.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">제품 설명서: “Full Cone 지원, P2P에 최적”</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="131" width="848" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="205" width="224" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="197.0" y="228.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">옛 이름</text><rect x="315" y="205" width="254" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="442.0" y="228.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">매핑</text><rect x="575" y="205" width="294" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="722.0" y="228.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">필터링</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="249" width="224" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="197.0" y="274.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Full Cone</text><rect x="315" y="249" width="254" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="274.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">상대와 무관</text><rect x="575" y="249" width="294" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="722.0" y="274.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">누구든 받음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="295" width="224" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="197.0" y="320.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Restricted Cone</text><rect x="315" y="295" width="254" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="320.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">상대와 무관</text><rect x="575" y="295" width="294" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="722.0" y="320.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">같은 IP만 받음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="341" width="224" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="197.0" y="366.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Port Restricted Cone</text><rect x="315" y="341" width="254" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="366.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">상대와 무관</text><rect x="575" y="341" width="294" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="722.0" y="366.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">같은 IP·포트만 받음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="387" width="224" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="197.0" y="412.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">Symmetric</text><rect x="315" y="387" width="254" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="442.0" y="412.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">상대에 따라 달라짐</text><rect x="575" y="387" width="294" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="722.0" y="412.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">상대와 연관된 조건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="81" y="245" width="792" height="140" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="81" y="383" width="792" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="438" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">이름 말고 매핑과 필터링을 따로 읽어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">제품 설명서에 Full Cone 문구가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Cone 세 가지는 매핑이 같고 필터링이 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Symmetric은 매핑이 상대에 따라 달라져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름 대신 매핑·필터링을 나눠 읽어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>