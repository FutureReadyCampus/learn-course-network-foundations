<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>직접 못 만나면 누가 대신 전해 줄까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">직접 못 만나면 누가 대신 전해 줄까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TURN 서버가 교환원처럼 데이터를 중계해요</text>
<rect x="446" y="165" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="456" y="175" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="199" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="223" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="480" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">TURN 서버</text><rect x="405" y="284" width="150" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="305.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">203.0.113.60</text><rect x="76" y="336" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="343" width="52" height="30" fill="#3d4b60"/><polygon points="66,382 154,382 162,394 58,394" fill="#6ea8fe"/><text x="110" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><rect x="816" y="334" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="341" width="52" height="32" fill="#3d4b60"/><rect x="845" y="380" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="390" width="44" height="5" fill="#6ea8fe"/><text x="850" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><line x1="170" y1="370" x2="790" y2="370" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,370;170,370;440,370;440,370" keyTimes="0.000;0.013;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="790,370;790,370;520,370;520,370" keyTimes="0.000;0.013;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="370" r="16" fill="#ff7b72"/><path d="M473 363 l14 14 M487 363 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="280" y="429" width="400" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="450.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">UDP 차단 · 상대별 매핑 · 통신사 NAT</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="344" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="370" r="16" fill="#ff7b72"/><path d="M473 363 l14 14 M487 363 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="170" y1="350" x2="446" y2="215" stroke="#7ee7c7" stroke-width="5"/><line x1="790" y1="350" x2="514" y2="215" stroke="#7ee7c7" stroke-width="5"/><circle cx="570" cy="205" r="16" fill="#7ee7c7"/><path d="M562 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="544" y="179" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,350;170,350;446,215;446,215" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="514,215;514,215;790,350;790,350" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="428" width="460" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">중계는 확실하지만 서버 비용과 지연이 들어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 두 PC가 직접 연결을 시도해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UDP 차단이나 상대별 매핑이면 직접이 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양쪽이 TURN 서버로 연결해 대신 전달받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중계는 확실하지만 서버 비용과 지연이 들어요</text></g>

