<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버 경유, 직접, 중계, 길은 셋이에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버 경유, 직접, 중계, 길은 셋이에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">어느 길이든 공유기에 포트를 열 일은 없어요</text>
<rect x="30" y="148" width="300" height="84" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="180" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서비스 서버 경유</text><text x="180" y="212" text-anchor="middle" font-size="16" fill="#9aa3b2">서버 부담 · 서비스에 의존</text><g><line x1="442" y1="190" x2="826" y2="190" stroke="#7ee7c7" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="446,190;446,190;625,190;820,190;820,190" keyTimes="0.000;0.013;0.125;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="30" y="258" width="300" height="84" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="180" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">P2P 직접(홀 펀칭)</text><text x="180" y="322" text-anchor="middle" font-size="16" fill="#9aa3b2">성공이 보장되지 않아요</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="442" y1="300" x2="826" y2="300" stroke="#ffb454" stroke-width="4" stroke-dasharray="8 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="446,300;446,300;820,300;820,300" keyTimes="0.000;0.263;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="30" y="368" width="300" height="84" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="180" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">TURN 중계</text><text x="180" y="432" text-anchor="middle" font-size="16" fill="#9aa3b2">서버 비용 · 지연</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="442" y1="410" x2="826" y2="410" stroke="#6ea8fe" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="446,410;446,410;625,410;820,410;820,410" keyTimes="0.000;0.512;0.625;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g><rect x="591" y="150" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="601" y="160" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="601" y="184" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="601" y="208" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="625" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec"></text></g><g><rect x="356" y="156" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="364" y="163" width="52" height="30" fill="#3d4b60"/><polygon points="346,202 434,202 442,214 338,214" fill="#6ea8fe"/><rect x="826" y="154" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="161" width="52" height="32" fill="#3d4b60"/><rect x="855" y="200" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="210" width="44" height="5" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect