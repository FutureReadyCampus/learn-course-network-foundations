<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안내 데스크 장부로 보는 홀 펀칭</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안내 데스크 장부로 보는 홀 펀칭</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">양쪽이 먼저 보내면 양쪽 장부에 기록이 생겨요</text>
<rect x="56" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="46,262 134,262 142,274 38,274" fill="#6ea8fe"/><text x="90" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><circle cx="250" cy="250" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M235 244 h28 l-7 -7 M265 256 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">박 팀장 쪽 데스크</text><circle cx="710" cy="250" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M695 244 h28 l-7 -7 M725 256 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="710" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">지우 쪽 데스크</text><rect x="836" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="826,262 914,262 922,274 818,274" fill="#6ea8fe"/><text x="870" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우</text><line x1="140" y1="250" x2="222" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="278" y1="250" x2="682" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="738" y1="250" x2="820" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="133" width="320" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">먼저 연락한 손님만 들여요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="125" width="328" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="365" width="260" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="393.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">장부: 지우 쪽으로 보냄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="116" y="361" width="268" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="280,250;280,250;650,250;650,250" keyTimes="0.000;0.263;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="595" y="158" width="230" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="710" y="181.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">첫 연락은 돌려보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="580" y="365" width="260" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="393.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">장부: 박 팀장 쪽으로 보냄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="361" width="268" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="280" y1="250" x2="680" y2="250" stroke="#ffb454" stroke-width="6" stroke-dasharray="12 8"/><rect x="330" y="158" width="300" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">그 뒤의 연락은 통과해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="226" width="408" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 데스크는 먼저 연락한 손님만 들여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 먼저 보내면 박 팀장 장부에만 기록이 남아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우도 먼저 보내면 지우 장부에도 기록이 남아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양쪽 장부에 기록이 있어 그 뒤의 연락은 통과해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>