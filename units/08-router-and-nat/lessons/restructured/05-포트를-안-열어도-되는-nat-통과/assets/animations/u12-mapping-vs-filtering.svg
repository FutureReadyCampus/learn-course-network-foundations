<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>매핑과 필터링은 다른 질문</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">매핑과 필터링은 다른 질문</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">나가는 문 번호 정하기 vs 손님 확인하기</text>
<rect x="40" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">매핑 · 어떤 바깥 주소로?</text><rect x="500" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">필터링 · 누구 걸 받나?</text><g><rect x="70" y="200" width="360" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="227.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">안쪽 192.168.0.10:3000</text></g><g><rect x="530" y="200" width="360" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="227.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">바깥 203.0.113.8:42000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="300" width="360" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="327.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">→ 바깥 203.0.113.8:42000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="296" width="368" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,252;250,252;250,292;250,292" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="300" width="360" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="327.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">15.15.15.15:5555에서 옴</text><circle cx="870" cy="370" r="16" fill="#7ee7c7"/><path d="M862 370 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="296" width="368" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="432" width="260" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">두 질문은 따로 봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT에는 두 가지 질문이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">매핑: 안쪽 통신을 바깥 주소·포트에 짝지어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필터링: 들어온 패킷의 보낸 사람을 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 이름으로 뭉뚱그리지 말고 따로 봐요</text></g>

