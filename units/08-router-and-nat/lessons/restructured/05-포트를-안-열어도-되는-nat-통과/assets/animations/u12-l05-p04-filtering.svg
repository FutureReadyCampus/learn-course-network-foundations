<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>누가 보낸 패킷까지 받아 줄까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">누가 보낸 패킷까지 받아 줄까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">필터링은 받는 상대의 범위를 정해요</text>
<rect x="140" y="215" width="234" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="257.0" y="238.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">필터링 방식</text><rect x="380" y="215" width="214" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="487.0" y="238.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">203.0.113.15:7777</text><rect x="600" y="215" width="214" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="707.0" y="238.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">203.0.113.99:40000</text><g><rect x="40" y="135" width="430" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="162.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">지우 PC가 203.0.113.15:5555로 먼저 보냈어요</text><rect x="490" y="135" width="430" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="705.0" y="162.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">바깥 매핑 198.51.100.25:42000</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="486" y="131" width="438" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="259" width="234" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="257.0" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">누구든 받음(EIF)</text><rect x="380" y="259" width="214" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">받음</text><rect x="600" y="259" width="214" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="707.0" y="285.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">받음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="255" width="682" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="309" width="234" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="257.0" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">같은 IP만(ADF)</text><rect x="380" y="309" width="214" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">받음</text><rect x="600" y="309" width="214" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="707.0" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">받지 않음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="305" width="682" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="359" width="234" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="257.0" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">같은 IP·포트만(APDF)</text><rect x="380" y="359" width="214" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="487.0" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">받지 않음</text><rect x="600" y="359" width="214" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="707.0" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">받지 않음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="355" width="682" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="434" width="360" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">포트까지 보면 받는 범위가 좁아져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC가 협력사 서버로 먼저 UDP를 보냈어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">누구든 받는 방식은 두 패킷을 모두 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 IP만 받는 방식은 포트가 달라도 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 IP·포트만 받는 방식은 둘 다 막아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>