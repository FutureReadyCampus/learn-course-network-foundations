2" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M239 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><rect x="190" y="227" width="120" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="250" y="248.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">포트 닫힘</text><rect x="690" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M699 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><rect x="650" y="227" width="120" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="710" y="248.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">포트 닫힘</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="442" y="278" width="76" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="245" r="16" fill="#7ee7c7"/><path d="M472 245 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="219" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="418" width="500" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="441.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">먼저 나간 통신은 행이 생겨 포트가 필요 없어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양쪽 모두 공유기 뒤에 있고 포트는 안 열었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 서비스 서버로 먼저 연결해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">영상과 음성이 서버를 거쳐 오가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 나간 통신에는 행이 자동으로 생겨요</text></g>

