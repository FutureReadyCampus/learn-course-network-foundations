<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>직접이 안 되면 중계로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">직접이 안 되면 중계로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 전화가 안 되면 교환원을 거쳐요</text>
<text x="480" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">직접 (홀 펀칭)</text><rect x="76" y="166" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="173" width="52" height="30" fill="#3d4b60"/><polygon points="66,212 154,212 162,224 58,224" fill="#6ea8fe"/><text x="110" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">A</text><rect x="816" y="166" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="173" width="52" height="30" fill="#3d4b60"/><polygon points="806,212 894,212 902,224 798,224" fill="#6ea8fe"/><text x="850" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">B</text><line x1="170" y1="200" x2="790" y2="200" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,200;190,200;450,200;450,200" keyTimes="0.000;0.025;0.200;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="200" r="16" fill="#ff7b72"/><path d="M473 193 l14 14 M487 193 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="436" y="166" width="88" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="480" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">중계 (TURN)</text><rect x="76" y="311" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="318" width="52" height="30" fill="#3d4b60"/><polygon points="66,357 154,357 162,369 58,369" fill="#6ea8fe"/><text x="110" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">A</text><rect x="816" y="311" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="318" width="52" height="30" fill="#3d4b60"/><polygon points="806,357 894,357 902,369 798,369" fill="#6ea8fe"/><text x="850" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">B</text><rect x="446" y="305" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="456" y="315" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="339" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="363" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="480" y="407" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="170" y1="345" x2="440" y2="345" stroke="#7ee7c7" stroke-width="4"/><line x1="520" y1="345" x2="790" y2="345" stroke="#7ee7c7" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,345;190,345;430,345;530,345;770,345;770,345" keyTimes="0.000;0.512;0.583;0.654;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="285" r="16" fill="#7ee7c7"/><path d="M842 285 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="438" width="400" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">STUN은 주소 확인 · TURN은 데이터 중계</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A가 B에게 직접 보내 보지만…</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT·방화벽 조건이 안 맞으면 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그럴 땐 TURN 서버가 대신 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중계는 비용이 들지만 연결을 이어 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>