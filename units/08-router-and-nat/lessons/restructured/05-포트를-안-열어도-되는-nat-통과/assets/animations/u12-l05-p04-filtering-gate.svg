 fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="247.0" y="444.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">같은 IP·포트만 받음(APDF)</text><rect x="400" y="418" width="244" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><circle cx="434" cy="438" r="16" fill="#ff7b72"/><path d="M427 431 l14 14 M441 431 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="466" y="445" text-anchor="start" font-size="17" font-weight="700" fill="#ff7b72">받지 않음</text><rect x="650" y="418" width="244" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><circle cx="684" cy="438" r="16" fill="#ff7b72"/><path d="M677 431 l14 14 M691 431 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="716" y="445" text-anchor="start" font-size="17" font-weight="700" fill="#ff7b72">받지 않음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="96" y="414" width="802" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
