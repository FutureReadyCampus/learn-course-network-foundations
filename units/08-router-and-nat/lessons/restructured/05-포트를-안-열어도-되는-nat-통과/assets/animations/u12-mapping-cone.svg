<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>옛 Cone 이름 풀어 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">옛 Cone 이름 풀어 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 하나에 두 기준이 묶여 있어요</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="130" width="260" height="36" rx="6" fill="#0f1115" stroke="#6ea8fe" stroke-width="3"/><text x="460.0" y="153.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">매핑</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="130" width="260" height="36" rx="6" fill="#0f1115" stroke="#c792ea" stroke-width="3"/><text x="740.0" y="153.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">필터링</text></g><g><rect x="90" y="176" width="220" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="200.0" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">Full Cone</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="176" width="260" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="460.0" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">목적지 독립</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="176" width="260" height="48" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="740.0" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">누구든 허용</text></g><g><rect x="90" y="234" width="220" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="200.0" y="264.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">Restricted Cone</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="234" width="260" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="460.0" y="264.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">목적지 독립</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="234" width="260" height="48" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="740.0" y="264.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">같은 IP</text></g><g><rect x="90" y="292" width="220" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="200.0" y="322.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">Port Restricted</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="292" width="260" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="460.0" y="322.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">목적지 독립</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="292" width="260" height="48" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="740.0" y="322.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">같은 IP·포트</text></g><g><rect x="90" y="350" width="220" height="48" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="200.0" y="380.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">Symmetric</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="350" width="260" height="48" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="460.0" y="380.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">목적지마다 다름</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="350" width="260" height="48" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="740.0" y="380.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">상대와 연관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="126" width="268" height="274" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="606" y="126" width="268" height="274" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="415" width="340" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="438.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">이름보다 두 기준을 따로 확인</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예전 자료엔 Cone 이름이 네 가지 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">매핑 칸: Symmetric만 목적지마다 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필터링 칸: 받는 상대가 점점 좁아져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">실제 장비는 두 기준을 따로 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>