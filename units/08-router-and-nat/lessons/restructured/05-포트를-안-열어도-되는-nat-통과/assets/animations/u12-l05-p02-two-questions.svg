<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT에게 꼭 따로 물어야 할 두 가지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT에게 꼭 따로 물어야 할 두 가지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름 하나로 연결 가능성을 판단하지 않아요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="135" width="520" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="163.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지우 메모: Port Restricted라서 안 될 거야</text><rect x="340" y="189" width="280" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">그런데 회의는 잘 되고 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="135" width="520" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="163.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">새 메모: 매핑과 필터링을 따로 확인한다</text><circle cx="780" cy="157" r="16" fill="#7ee7c7"/><path d="M772 157 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="216" y="131" width="528" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="245" width="390" height="200" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="255" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">① 매핑</text><rect x="85" y="300" width="340" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="255.0" y="330.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">바깥에 어떤 주소·포트로 보이나?</text><rect x="140" y="369" width="230" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="255" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">변환표의 External 칸</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="241" width="398" height="208" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="510" y="245" width="390" height="200" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="705" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">② 필터링</text><rect x="535" y="300" width="340" height="48" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="705.0" y="330.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">누가 보낸 패킷까지 받나?</text><rect x="590" y="369" width="230" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="705" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">들여보내기 전의 조건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="241" width="398" height="208" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우의 메모는 이름만 보고 안 될 거라 판단했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">첫째 질문은 매핑: 바깥에 어떻게 보이나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘째 질문은 필터링: 누가 보낸 패킷을 받나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 두 질문을 따로 확인한다고 고쳐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>