<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>매핑은 상대에 따라 달라질 수 있어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">매핑은 상대에 따라 달라질 수 있어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">단골 창구 번호 vs 손님마다 새 창구</text>
<rect x="40" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">목적지 독립 매핑 (EIM)</text><rect x="500" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">목적지 종속 매핑</text><g><rect x="70" y="200" width="360" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="250.0" y="225.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">상대 15.15.15.15:5555 → :42000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="260" width="360" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="285.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">상대 9.9.9.9:40000 (새 상대)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="256" width="368" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g><rect x="530" y="200" width="360" height="40" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="710.0" y="225.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">상대 15.15.15.15:5555 → :42000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="260" width="360" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="710.0" y="285.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">상대 9.9.9.9:40000 (새 상대)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="256" width="368" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,330;250,330;250,360;250,360" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="710,330;710,330;710,360;710,360" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="320" width="360" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="348.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">:42000 그대로 재사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="316" width="368" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="320" width="360" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="710.0" y="348.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">다른 바깥 포트 배정</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="316" width="368" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="432" width="320" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">같은 바깥 주소를 계속 쓰나?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A는 15.15.15.15와 통신하며 :42000을 받았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 A가 이번엔 9.9.9.9와 통신해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">왼쪽은 :42000을 다시 쓰고, 오른쪽은 새 포트를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">매핑은 상대가 바뀌어도 같은지 물어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>