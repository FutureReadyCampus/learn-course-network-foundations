<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버 없이 직접 주고받으면 어떨까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버 없이 직접 주고받으면 어떨까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">소개 서버는 주소만 알려 주고, 첫 패킷은 막힐 수 있어요</text>
<line x1="90" y1="335" x2="90" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="90" y1="300" x2="870" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="870" y1="300" x2="870" y2="335" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="452" y1="215" x2="266" y2="329" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><line x1="508" y1="215" x2="694" y2="329" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="440,215;440,215;276,321;276,321" keyTimes="0.000;0.263;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="520,215;520,215;684,321;684,321" keyTimes="0.000;0.263;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,300;110,300;650,300;650,300" keyTimes="0.000;0.512;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="56" y="331" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="338" width="52" height="30" fill="#3d4b60"/><polygon points="46,377 134,377 142,389 38,389" fill="#6ea8fe"/><text x="90" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><circle cx="250" cy="365" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M235 359 h28 l-7 -7 M265 371 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="415" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><circle cx="710" cy="365" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M695 359 h28 l-7 -7 M725 371 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="710" y="415" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="836" y="331" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="844" y="338" width="52" height="30" fill="#3d4b60"/><polygon points="826,377 914,377 922,389 818,389" fill="#6ea8fe"/><text x="870" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">협력사</text><rect x="446" y="135" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="456" y="145" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="169" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="456" y="193" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="480" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec"></text><text x="528" y="182" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">소개 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="424" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">P2P: 서버 없이 직접 주고받기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="424" width="440" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">소개 서버는 상대의 바깥 주소만 알려 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="690" cy="300" r="16" fill="#ff7b72"/><path d="M683 293 l14 14 M697 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="280" y="424" width="400" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">상대 공유기에 맞는 행이 없어 막혀요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="664" y="274" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="284" width="360" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="290" y="305.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">① 내 공유기가 바깥에 어떻게 보이나</text><rect x="510" y="284" width="320" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="670" y="305.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">② 상대의 첫 패킷을 받아 주나</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">P2P는 두 기기가 서버 없이 직접 주고받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소개 서버는 상대의 바깥 주소만 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 보낸 패킷은 맞는 행이 없어 막힐 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 통신에는 두 가지가 맞아야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>