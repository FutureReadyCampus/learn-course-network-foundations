<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주소는 맞게 전달됐는데</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주소는 맞게 전달됐는데</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">협력사 담당자의 패킷이 오지 않아요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="640" y="130" width="220" height="180" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="750" y1="130" x2="750" y2="310" stroke="#3d4b60" stroke-width="3"/><rect x="120" y="300" width="260" height="110" fill="#12151c" stroke="#1d2431" stroke-width="2"/><rect x="120" y="270" width="260" height="40" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="520" y1="410" x2="520" y2="250" stroke="#3d4b60" stroke-width="3"/><polygon points="495,250 545,250 535,215 505,215" fill="#12151c" stroke="#1d2431" stroke-width="2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text><text x="140" y="361.0" text-anchor="middle" font-size="16" fill="#9aa3b2">팀장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(140,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="140" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g><rect x="286" y="249" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="294" y="256" width="52" height="32" fill="#3d4b60"/><rect x="315" y="295" width="10" height="10" fill="#6ea8fe"/><rect x="298" y="305" width="44" height="5" fill="#6ea8fe"/><text x="320" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">집 PC</text></g><g><circle cx="520" cy="285" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M505 279 h28 l-7 -7 M535 291 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="520" y="335" text-anchor="middle" font-size="17" fill="#9aa3b2">집 공유기</text></g><g><line x1="358" y1="285" x2="490" y2="285" stroke="#3d4b60" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="427" y="368" width="186" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="520" y="391.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">192.0.2.123:40001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="363" width="288" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g><g transform="translate(820,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#8f98a8"/><circle r="24" fill="#8f98a8"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="820" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">직원</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="573.6" y="134" width="252.8" height="52" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="601.6,146 617.6,174 585.6,174" fill="#ff7b72"/><text x="601.6" y="171" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">!</text><text x="631.6" y="166" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">패킷이 도착하지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="295" y="419" width="369" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">상대가 바뀌면 바깥 포트도 바뀔까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 집 PC에서 화상회의 앱을 켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱이 바깥 주소를 협력사 담당자에게 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데 협력사가 보낸 패킷이 도착하지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 왜 안 되는지 알아봐요</text></g>

