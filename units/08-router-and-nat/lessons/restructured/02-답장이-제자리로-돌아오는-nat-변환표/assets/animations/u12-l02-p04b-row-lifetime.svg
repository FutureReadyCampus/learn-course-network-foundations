<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>변환표의 줄은 언제까지 남을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">변환표의 줄은 언제까지 남을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">자동으로 생긴 줄은 통신이 끊기면 사라져요</text>
<rect x="76" y="196" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="203" width="52" height="30" fill="#3d4b60"/><polygon points="66,242 154,242 162,254 58,254" fill="#6ea8fe"/><text x="110" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><circle cx="480" cy="230" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 224 h28 l-7 -7 M495 236 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="280" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="816" y="190" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="200" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="224" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="248" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI API</text><line x1="170" y1="230" x2="450" y2="230" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="230" x2="800" y2="230" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><text x="480" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">공유기 변환표</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,230;190,230;430,230;430,230" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="375" width="480" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="403.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">192.168.10.41:3000 ↔ 198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="236" y="371" width="488" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="375" width="480" height="44" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="403" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">줄 없음</text><rect x="295" y="436" width="370" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결이 끝났거나 유휴 시간이 지났어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="236" y="371" width="488" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="375" width="420" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">자동 행: 통신하면 만들어져요</text><rect x="500" y="375" width="420" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">고정 규칙: 관리자가 직접 적어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="371" width="888" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC가 통신을 시작해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 줄을 자동으로 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">끝나거나 한동안 조용하면 줄이 사라져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자동 행과 사람이 적은 고정 규칙은 구별해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>