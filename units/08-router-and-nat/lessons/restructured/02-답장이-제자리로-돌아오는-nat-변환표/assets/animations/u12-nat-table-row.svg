<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT Table에 남기는 기록</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT Table에 남기는 기록</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">택배 대장 한 줄을 읽어 봐요</text>
<rect x="60" y="160" width="114" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="117.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">프로토콜</text><rect x="180" y="160" width="254" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="307.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">내부(Local)</text><rect x="440" y="160" width="234" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="557.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">상대(Remote)</text><rect x="680" y="160" width="214" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="787.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">바깥(External)</text><g><rect x="60" y="204" width="114" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="117.0" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">TCP</text><rect x="180" y="204" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="307.0" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.0.10:3000</text><rect x="440" y="204" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="557.0" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><rect x="680" y="204" width="214" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="787.0" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="200" width="262" height="50" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="227" y="274" width="160" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="307" y="295.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">이 내부 통신이</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="676" y="200" width="222" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="672" y="274" width="230" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="787" y="295.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">바깥에선 이렇게 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="314" width="480" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">자동으로 생긴 행은 시간이 지나면 사라질 수 있어요</text><rect x="290" y="374" width="380" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="396.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">포트 포워딩 같은 고정 규칙과는 달라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">변환표 한 줄에 통신 한 개가 적혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">왼쪽은 집 안에서 시작한 통신이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">오른쪽은 바깥에서 보이는 주소·포트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자동 기록은 유휴 시간이 지나면 지워질 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>