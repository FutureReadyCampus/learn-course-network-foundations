<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">동시에 물어도 답이 안 섞여요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">두 PC가 같은 저장소에 요청을 보냈어요</text>
