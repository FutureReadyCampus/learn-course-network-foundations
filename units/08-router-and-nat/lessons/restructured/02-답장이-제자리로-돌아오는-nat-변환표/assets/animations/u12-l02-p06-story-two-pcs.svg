000000004" fill="#9aa3b2"/></g><text x="100" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><rect x="216" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="224" y="261" width="52" height="32" fill="#3d4b60"/><rect x="245" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="228" y="310" width="44" height="5" fill="#6ea8fe"/><text x="250" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><rect x="356" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="364" y="261" width="52" height="32" fill="#3d4b60"/><rect x="385" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="368" y="310" width="44" height="5" fill="#6ea8fe"/><text x="390" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">동료 PC</text><rect x="816" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><line x1="440" y1="290" x2="800" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="250" y="395" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.41</text><text x="390" y="395" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.43</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="255" width="220" height="28" rx="5" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="580" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">출발지 198.51.100.25</text><rect x="470" y="289" width="220" height="28" rx="5" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="580" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">출발지 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="456" y="241" width="248" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="154" y="111" width="233" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="168" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="144" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="121" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="270" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">둘 다 출발지가 똑같은데</text><text x="270" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">답은 어떻게 안 섞일까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="150.7" y="108.0" width="238.6" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="331" y="419" width="298" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">두 응답은 어떻게 구별될까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC와 동료 PC가 같은 저장소에 동시에 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">저장소가 보는 출발지는 둘 다 똑같아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데도 응답은 서로 섞이지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 구별하는 방법을 알아봐요</text></g>

