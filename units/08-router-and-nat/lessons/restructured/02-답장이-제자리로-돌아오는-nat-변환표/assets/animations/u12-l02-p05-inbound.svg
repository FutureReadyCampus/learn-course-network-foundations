<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">돌아온 답장은 어느 PC로 갈까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">나갈 때 적은 줄을 거꾸로 읽어요</text>
<rect x="76" y="304" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="311" width="52" height="32" fill="#3d4b60"/><rect x="105" y="350" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="360" width="44" height="5" fill="#6ea8fe"/><text x="110" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><circle cx="480" cy="340" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 334 h28 l-7 -7 M495 346 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="390" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="816" y="300" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="310" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="334" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="358" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI API</text><line x1="170" y1="340" x2="450" y2="340" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="340" x2="800" y2="340" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><text x="770" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">공유기 바깥쪽</text><rect x="620" y="155" width="300" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="634" y="185" text-anchor="start" font-size="15" fill="#e6e8ec">출발 203.0.113.80:443</text><text x="634" y="215" text-anchor="start" font-size="15" fill="#e6e8ec">도착 198.51.100.25:53001</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="790,340;790,340;520,340;520,340" keyTimes="0.000;0.025;0.225;1.000"