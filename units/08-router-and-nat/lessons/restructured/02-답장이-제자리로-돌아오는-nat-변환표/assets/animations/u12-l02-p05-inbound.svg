unt="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="430,340;430,340;190,340;190,340" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="110" cy="275" r="16" fill="#7ee7c7"/><path d="M102 275 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="250" width="340" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="276.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">대장에 53001번 줄이 없어요</text><rect x="300" y="424" width="360" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">기록이 없으면 보낼 곳도 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="246" width="348" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
