<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>다른 PC의 연결도 구분하기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">다른 PC의 연결도 구분하기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 경비실 주소, 다른 대장 번호예요</text>
<rect x="146" y="126" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="154" y="133" width="52" height="30" fill="#3d4b60"/><polygon points="136,172 224,172 232,184 128,184" fill="#6ea8fe"/><text x="180" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC ①</text><rect x="386" y="126" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="394" y="133" width="52" height="30" fill="#3d4b60"/><polygon points="376,172 464,172 472,184 368,184" fill="#6ea8fe"/><text x="420" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC ②</text><rect x="726" y="120" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="736" y="130" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="736" y="154" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="736" y="178" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="760" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="110" y="250" width="254" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="237.0" y="273.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">내부(Local)</text><rect x="370" y="250" width="234" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="487.0" y="273.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">상대(Remote)</text><rect x="610" y="250" width="234" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="727.0" y="273.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">바깥(External)</text><g><rect x="110" y="294" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="237.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.0.10:3000</text><rect x="370" y="294" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><rect x="610" y="294" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="727.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="344" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="237.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.0.11:4000</text><rect x="370" y="344" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><rect x="610" y="344" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="727.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53002</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="606" y="290" width="242" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="606" y="340" width="242" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="403" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">바깥 IP 하나 + 포트로 나눠 쓰기 = NAPT</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC ①의 통신은 53001로 기록돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC ②의 통신은 53002로 따로 기록돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 IP는 같고 포트가 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 응답을 올바른 PC에 돌려줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>