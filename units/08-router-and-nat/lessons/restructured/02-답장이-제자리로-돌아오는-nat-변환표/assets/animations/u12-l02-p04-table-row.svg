<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">변환표 한 줄에는 무엇이 적힐까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Local · Remote · External 세 칸이에요</text>
<rect x="55" y="200" width="104" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="107.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">프로토콜</text><rect x="165" y="200" width="244" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="287.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">Local</text><rect x="415" y="200" width="224" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="527.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">Remote</text><rect x="645" y="200" width="254" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="772.0" y="223.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">External</text><g><rect x="55" y="244" width="104" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="107.0" y="270.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">TCP</text><rect x="165" y="244" width="244" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="287.0" y="270.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.10.41:3000</text><rect x="415" y="244" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="527.0" y="270.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><rect x="645" y="244" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="772.0" y="270.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53001</text><rect x="370" y="134" width="220" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">공유기 NAT 세션 목록</text></g><g opacity="1"><animate attributeName="opacity" values="1;