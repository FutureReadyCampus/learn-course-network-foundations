oke-width="3"/><text x="237.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.0.10:3000</text><rect x="370" y="294" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><rect x="610" y="294" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="727.0" y="320.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="344" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="237.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.0.10:3000</text><rect x="370" y="344" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="487.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.81:443</text><rect x="610" y="344" width="234" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="727.0" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">198.51.100.25:53003</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="366" y="340" width="242" height="50" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="606" y="340" width="242" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="404" width="460" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">옛 Symmetric 예시일 뿐, 모든 NAT가 이렇진 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC ①이 첫 번째 서버와 통신해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 PC가 다른 서버에도 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 예시에서는 상대가 바뀌면 바깥 포트도 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">실제 장비마다 동작은 달라요</text></g>

