000000004" fill="#9aa3b2"/></g><text x="120" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><rect x="246" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="254" y="261" width="52" height="32" fill="#3d4b60"/><rect x="275" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="258" y="310" width="44" height="5" fill="#6ea8fe"/><text x="280" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><rect x="826" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><line x1="330" y1="290" x2="800" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="430.0" y="211" width="300" height="68" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="580" y="237" text-anchor="middle" font-size="16" fill="#9aa3b2">공유기 안쪽 출발지</text><text x="580" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.41:3000</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="430.0" y="301" width="300" height="68" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="580" y="327" text-anchor="middle" font-size="16" fill="#9aa3b2">공유기 바깥쪽 출발지</text><text x="580" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="424" y="296" width="312" height="80" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="111" width="268" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="158" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="146" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="133" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="270" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">같은 요청인데 숫자가 다르다</text><text x="270" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도대체 어디가 바뀐 걸까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="133.06" y="108.0" width="273.88" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="367" y="419" width="227" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">바뀐 곳은 어디일까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC가 클라우드 저장소로 요청을 보냈어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 바깥쪽에서는 출발지 숫자가 달라져 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 같은 요청인데 왜 다른지 궁금해해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 무엇이 바뀌었는지 찾아봐요</text></g>

