<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>답장이 공유기에 도착했어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">답장이 공유기에 도착했어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">목적지가 지우 PC의 주소가 아니에요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="690" y="130" width="200" height="170" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="790" y1="130" x2="790" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="215" x2="890" y2="215" stroke="#3d4b60" stroke-width="3"/><rect x="70" y="150" width="120" height="80" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="90" y1="180" x2="170" y2="180" stroke="#3d4b60" stroke-width="3"/><line x1="90" y1="200" x2="150" y2="200" stroke="#3d4b60" stroke-width="3"/><rect x="86" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="96" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="96" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="96" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="120" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><circle cx="610" cy="290" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M595 284 h28 l-7 -7 M625 296 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="610" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="170" y1="290" x2="570" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(850,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="850" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(850,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="850" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="215.0" y="201" width="330" height="68" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="380" y="227" text-anchor="middle" font-size="16" fill="#9aa3b2">저장소가 보낸 응답의 목적지</text><text x="380" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">198.51.100.25:53001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="209" y="195" width="342" height="82" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="111" width="250" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="772" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="798" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="823" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="660" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">공유기는 이 응답을 어떻게</text><text x="660" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC로 돌려보낼까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531.88" y="108.0" width="256.24" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="350" y="419" width="260" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">응답은 어느 PC로 갈까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라우드 저장소가 응답을 보낼 차례예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답의 목적지는 지우 PC가 아니라 바깥 주소와 포트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 공유기가 어떻게 돌려보낼지 궁금해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 돌아오는 길을 따라가 봐요</text></g>

