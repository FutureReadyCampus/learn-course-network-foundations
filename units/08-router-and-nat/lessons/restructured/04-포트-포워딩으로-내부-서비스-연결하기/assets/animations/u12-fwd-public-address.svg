<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>바깥에서 접속할 주소</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">바깥에서 접속할 주소</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">건물 대표 주소로 보내면 경비실이 호수로 넘겨요</text>
<rect x="30" y="150" width="560" height="270" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="310.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">집 안</text><rect x="106" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="116" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="116" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="116" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="140" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><circle cx="590" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M575 294 h28 l-7 -7 M605 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="590" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><circle cx="850" cy="270" r="16" fill="#6ea8fe"/><rect x="832" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><rect x="50" y="194" width="180" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="140" y="215.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">192.168.0.12:80</text><rect x="515" y="364" width="150" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="590" y="385.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">공인 3.3.3.3</text><line x1="620" y1="300" x2="800" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="170" y1="300" x2="560" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="630" y="130" width="270" height="74" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="644" y="157" text-anchor="start" font-size="14" font-weight="700" fill="#9aa3b2">출발지</text><text x="710" y="157" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">친구</text><text x="644" y="187" text-anchor="start" font-size="14" font-weight="700" fill="#9aa3b2">목적지</text><text x="710" y="187" text-anchor="start" font-size="15" font-weight="700" fill="#ffb454">3.3.3.3:80</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="126" width="278" height="82" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="810,300;810,300;630,300;630,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="410" y="220" width="220" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="520.0" y="247.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:80 → 192.168.0.12:80</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="406" y="216" width="228" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="380" width="270" height="74" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="74" y="407" text-anchor="start" font-size="14" font-weight="700" fill="#9aa3b2">출발지</text><text x="140" y="407" text-anchor="start" font-size="15" font-weight="700" fill="#e6e8ec">친구</text><text x="74" y="437" text-anchor="start" font-size="14" font-weight="700" fill="#9aa3b2">목적지</text><text x="140" y="437" text-anchor="start" font-size="15" font-weight="700" fill="#ffb454">192.168.0.12:80</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="376" width="278" height="82" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="550,300;550,300;200,300;200,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="140" cy="235" r="16" fill="#7ee7c7"/><path d="M132 235 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="438" width="240" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="720" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">공유기는 전달만 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">친구는 공유기의 공인 주소 3.3.3.3:80으로 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기에 외부 80 → 내부 192.168.0.12:80 규칙이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적지를 바꿔 안쪽 웹 서버로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 서버는 공유기가 아니라 안쪽 PC예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>