<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>여러 서비스와 Port를 열기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">여러 서비스와 Port를 열기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">집마다 경비실에 따로 부탁해요</text>
<rect x="20" y="150" width="380" height="270" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="210.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">집 1</text><rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 1</text><circle cx="400" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M385 294 h28 l-7 -7 M415 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="400" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기 1</text><rect x="560" y="150" width="380" height="270" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="750.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">집 2</text><rect x="816" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="806,312 894,312 902,324 798,324" fill="#6ea8fe"/><text x="850" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 2</text><circle cx="560" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M545 294 h28 l-7 -7 M575 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="560" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기 2</text><line x1="430" y1="300" x2="530" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="170" y1="300" x2="370" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="590" y1="300" x2="790" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><text x="110" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">:30000</text><text x="850" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">:40000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="185" y="365" width="180" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="275.0" y="392.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:30000 → PC 1</text><rect x="595" y="365" width="180" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="685.0" y="392.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:40000 → PC 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="181" y="361" width="188" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="591" y="361" width="188" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;800,300;800,300" keyTimes="0.000;0.512;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="400" r="16" fill="#7ee7c7"/><path d="M842 400 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="826" y="376" width="48" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="438" width="280" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프로그램마다 규칙을 따로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">P2P 프로그램이 PC 1은 30000, PC 2는 40000을 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각 공유기에 자기 PC로 가는 규칙을 넣어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그러면 양쪽 NAT를 넘어 직접 통신할 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트마다, 공유기마다 규칙이 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>