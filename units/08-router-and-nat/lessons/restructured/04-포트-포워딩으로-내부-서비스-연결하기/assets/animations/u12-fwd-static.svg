<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>정적 매핑을 직접 추가</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">정적 매핑을 직접 추가</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경비실에 '이 택배는 12호로' 미리 적어 둬요</text>
<rect x="40" y="140" width="420" height="280" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">동적 매핑</text><rect x="500" y="140" width="420" height="280" rx="16" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">정적 매핑</text><rect x="232" y="228" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="240" y1="240" x2="260" y2="240" stroke="#ffb454" stroke-width="2"/><line x1="240" y1="250" x2="260" y2="250" stroke="#ffb454" stroke-width="2"/><line x1="240" y1="260" x2="260" y2="260" stroke="#ffb454" stroke-width="2"/><text x="250" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Outbound가 자동으로</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="600" cy="240" r="16" fill="#6ea8fe"/><rect x="582" y="260" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="600" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">관리자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="660" y="215" width="240" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="780.0" y="242.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">:80 → 192.168.0.12:80</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="211" width="248" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="900,300;900,300;690,300;690,300" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="780" cy="360" r="16" fill="#7ee7c7"/><path d="M772 360 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="780" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">외부 :80 → 서버로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="756" y="336" width="48" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="438" width="380" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">포트 포워딩 = 직접 넣은 정적 매핑</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동적 매핑은 나갈 때 자동으로 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">관리자가 규칙을 한 줄 직접 넣어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥에서 :80으로 오면 내부 서버로 전달돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 넣는 매핑을 포트 포워딩이라 불러요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>