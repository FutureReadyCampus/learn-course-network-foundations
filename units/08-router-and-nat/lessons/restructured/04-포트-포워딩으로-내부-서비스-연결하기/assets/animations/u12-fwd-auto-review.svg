<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>자동 매핑은 안에서 시작할 때만</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">자동 매핑은 안에서 시작할 때만</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">나갈 때 적은 대장만 있으면 답장은 와요</text>
<rect x="76" y="171" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="178" width="52" height="30" fill="#3d4b60"/><polygon points="66,217 154,217 162,229 58,229" fill="#6ea8fe"/><text x="110" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><circle cx="480" cy="205" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 199 h28 l-7 -7 M495 211 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="255" text-anchor="middle" font-size="17" fill="#9aa3b2"></text><rect x="816" y="153" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="163" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="187" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="211" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="170" y1="205" x2="450" y2="205" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="510" y1="205" x2="800" y2="205" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="76" y="323" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="86" y="333" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="86" y="357" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="86" y="381" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="110" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><circle cx="480" cy="375" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 369 h28 l-7 -7 M495 381 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="425" text-anchor="middle" font-size="17" fill="#9aa3b2"></text><circle cx="850" cy="345" r="16" fill="#6ea8fe"/><rect x="832" y="365" width="36" height="46" rx="12" fill="#6ea8fe"/><line x1="160" y1="375" x2="450" y2="375" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="510" y1="375" x2="820" y2="375" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><text x="300" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">안 → 밖</text><text x="660" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">밖 → 안</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,205;190,205;790,205;790,205" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="542" y="143" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="550" y1="155" x2="570" y2="155" stroke="#ffb454" stroke-width="2"/><line x1="550" y1="165" x2="570" y2="165" stroke="#ffb454" stroke-width="2"/><line x1="550" y1="175" x2="570" y2="175" stroke="#ffb454" stroke-width="2"/><circle cx="850" cy="120" r="16" fill="#7ee7c7"/><path d="M842 120 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="534" y="135" width="52" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,375;800,375;545,375;545,375" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="320" r="16" fill="#ff7b72"/><path d="M473 313 l14 14 M487 313 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="456" y="296" width="48" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="438" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">밖에서 먼저 오면 매핑을 직접 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 PC가 먼저 바깥 서버에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나갈 때 NAT Table에 자동으로 기록돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥에서 먼저 오면 기록이 없어 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">반대 방향은 대응 관계를 직접 넣어야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>