<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사무실에서만 열리는 그룹웨어</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사무실에서만 열리는 그룹웨어</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 주소도 어느 쪽에서 쓰느냐에 달려요</text>
<rect x="40" y="130" width="320" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="200.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실 안쪽 (LAN)</text><rect x="600" y="130" width="320" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="760.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">공유기 바깥 (WAN)</text><rect x="61" y="229" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="69" y="236" width="52" height="32" fill="#3d4b60"/><rect x="90" y="275" width="10" height="10" fill="#6ea8fe"/><rect x="73" y="285" width="44" height="5" fill="#6ea8fe"/><text x="95" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><rect x="251" y="225" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="261" y="235" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="261" y="259" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="261" y="283" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="285" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><circle cx="480" cy="265" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 259 h28 l-7 -7 M495 271 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="315" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="726" y="231" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="734" y="238" width="52" height="30" fill="#3d4b60"/><polygon points="716,277 804,277 812,289 708,289" fill="#6ea8fe"/><text x="760" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><line x1="360" y1="265" x2="450" y2="265" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="265" x2="600" y2="265" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="95" y="369" width="210" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="200" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.10.50:8080</text><circle cx="285" cy="190" r="16" fill="#7ee7c7"/><path d="M277 190 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="91" y="365" width="218" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,265;160,265;215,265;215,265" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="625" y="369" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="760" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">192.168.10.50:8080 입력</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="621" y="365" width="278" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="670,265;670,265;545,265;545,265" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="195" r="16" fill="#ff7b72"/><path d="M473 188 l14 14 M487 188 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="675" y="184" width="170" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="760" y="205.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">화면이 안 떠요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="169" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="440" width="480" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">192.168.10.50은 공유기 안쪽에서만 쓰는 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="126" width="328" height="303" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사무실 안에서는 그룹웨어 서버가 잘 열려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고객사의 박 팀장이 같은 주소를 입력해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 바깥에서는 그 주소로 갈 길이 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 주소는 공유기 안쪽에서만 뜻이 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>