<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사설 주소와 공인 주소</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사설 주소와 공인 주소</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">아파트 동·호수와 도로명 주소 같아요</text>
<rect x="60" y="125" width="390" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="255" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">사설 주소</text><rect x="510" y="125" width="390" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">공인 주소</text><rect x="221" y="205" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="231" y="215" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="231" y="239" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="231" y="263" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="255" y="307" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><circle cx="705" cy="245" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M690 239 h28 l-7 -7 M720 251 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="705" y="295" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g><rect x="160" y="329" width="190" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="255" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.10.50</text><rect x="610" y="329" width="190" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="369" width="230" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="255" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">사무실 안에서만 통해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="363" width="238" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="705" cy="190" r="16" fill="#7ee7c7"/><path d="M697 190 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="600" y="369" width="210" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="705" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">인터넷에서 전달돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="363" width="218" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="436" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">박 팀장은 198.51.100.25로 가야 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AI 서버는 사설 주소, 공유기 바깥은 공인 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사설 주소는 한 네트워크 안에서만 뜻이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공인 주소는 인터넷에서 길 안내를 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장은 바깥 주소로 가야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>