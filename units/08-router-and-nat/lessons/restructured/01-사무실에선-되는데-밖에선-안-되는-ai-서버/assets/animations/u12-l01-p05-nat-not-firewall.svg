<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT 뒤라서 안전할까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT 뒤라서 안전할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">막힌 것과 막은 것은 달라요</text>
<rect x="40" y="125" width="200" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="140.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실</text><rect x="106" y="230" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="116" y="240" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="116" y="264" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="116" y="288" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="140" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><circle cx="480" cy="270" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 264 h28 l-7 -7 M495 276 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><circle cx="850" cy="230" r="16" fill="#6ea8fe"/><rect x="832" y="250" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">낯선 요청</text><line x1="240" y1="270" x2="450" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="270" x2="800" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="462" y="183" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="470" y1="195" x2="490" y2="195" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="205" x2="490" y2="205" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="215" x2="490" y2="215" stroke="#ffb454" stroke-width="2"/><rect x="340" y="384" width="280" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">NAT 뒤라서 안전한 걸까?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="446" y="176" width="68" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="462" y="183" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="470" y1="195" x2="490" y2="195" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="205" x2="490" y2="205" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="215" x2="490" y2="215" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,265;800,265;540,270;540,270" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="540" cy="205" r="16" fill="#ff7b72"/><path d="M533 198 l14 14 M547 198 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="315" y="384" width="330" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">기록이 없어 전달할 곳을 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="514" y="179" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="540" cy="205" r="16" fill="#ff7b72"/><path d="M533 198 l14 14 M547 198 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="405" y="225" width="150" height="118" rx="14" fill="none" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><rect x="300" y="384" width="360" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">허용·차단은 방화벽 규칙이 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사가 NAT 뒤 AI 서버는 안전하냐고 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥의 낯선 요청이 먼저 공유기에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록이 없어 갈 곳을 몰라서 못 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">막는 규칙은 방화벽이 따로 맡아요</text></g>

