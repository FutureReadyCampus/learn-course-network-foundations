;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="14" y="330" width="233" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="165" y1="262" x2="258" y2="262" stroke="#6ea8fe" stroke-width="6"/><line x1="402" y1="252" x2="532" y2="212" stroke="#6ea8fe" stroke-width="6"/><circle cx="612" cy="180" r="16" fill="#7ee7c7"/><path d="M604 180 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="18" y="334" width="225" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="130" y="355.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">받는 주소 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="14" y="330" width="233" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사에는 사설 주소와 공인 주소가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 회사에도 같은 사설 주소가 있을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷은 사설 주소로는 길을 안내하지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공인 주소로 보내야 공유기까지 전달돼요</text></g>

