<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이 주소, 사설일까 공인일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이 주소, 사설일까 공인일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">첫 숫자가 아니라 범위표에 대 봐요</text>
<rect x="76" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="66,282 154,282 162,294 58,294" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><ellipse cx="850" cy="270" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">IP 확인</text><g><rect x="35" y="324" width="150" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="345.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">172.20.4.31</text><rect x="775" y="324" width="150" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="850" y="345.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">192.0.2.77</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="150" width="224" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="442.0" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">범위</text><rect x="560" y="150" width="124" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="622.0" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">구분</text><rect x="330" y="194" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">10.0.0.0/8</text><rect x="560" y="194" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="622.0" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text><rect x="330" y="244" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="270.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">172.16.0.0/12</text><rect x="560" y="244" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="622.0" y="270.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text><rect x="330" y="294" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="320.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.0/16</text><rect x="560" y="294" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="622.0" y="320.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="240" width="362" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="725" cy="265" r="16" fill="#7ee7c7"/><path d="M717 265 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="699" y="239" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="384" width="260" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">172.20.4.31은 사설 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="404" width="460" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">확인 사이트는 NAT 뒤의 바깥 주소를 보여 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="398" width="468" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장 노트북 설정과 IP 확인 사이트가 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">172.20.4.31을 사설 범위표에 대 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">172.16~172.31 안이라 사설 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">설정은 안쪽 주소, 확인 사이트는 바깥 주소예요</text></g>

