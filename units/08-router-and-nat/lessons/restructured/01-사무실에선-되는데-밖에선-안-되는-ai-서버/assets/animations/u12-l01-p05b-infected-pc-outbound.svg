<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT는 안에서 나가는 것도 막을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT는 안에서 나가는 것도 막을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">먼저 나가는 통신은 NAT가 그대로 내보내요</text>
<rect x="40" y="125" width="200" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="140.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실</text><circle cx="480" cy="270" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 264 h28 l-7 -7 M495 276 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="240" y1="270" x2="450" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="270" x2="800" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="106" y="219" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="114" y="226" width="52" height="32" fill="#3d4b60"/><rect x="135" y="265" width="10" height="10" fill="#6ea8fe"/><rect x="118" y="275" width="44" height="5" fill="#6ea8fe"/><text x="140" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">감염된 PC</text><rect x="816" y="230" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="240" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="264" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="288" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="329" width="120" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="140" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">거래처 자료 파일</text><rect x="122" y="171" width="36" height="28" rx="3" fill="#ffb454"/><rect x="136" y="171" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="114" y="167" width="52" height="38" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="480" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">변환 기록</text><rect x="462" y="183" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="470" y1="195" x2="490" y2="195" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="205" x2="490" y2="205" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="215" x2="490" y2="215" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="446" y="176" width="68" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,265;190,265;400,270;400,270" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="540,270;540,270;780,270;780,270" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="195" r="16" fill="#ff7b72"/><path d="M843 188 l14 14 M857 188 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="315" y="384" width="330" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">NAT는 이 전송을 막지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="824" y="169" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="595" y="250" width="130" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="660.0" y="275.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">방화벽 규칙</text><circle cx="660" cy="215" r="16" fill="#ff7b72"/><path d="M653 208 l14 14 M667 208 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="280" y="384" width="400" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">예: 이 외부 서버로 나가는 통신 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="591" y="246" width="138" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">감염된 PC가 밖으로 거래처 자료 파일을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT는 평소처럼 기록하고 내보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">파일이 외부 서버에 그대로 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">막으려면 방화벽 규칙을 따로 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>