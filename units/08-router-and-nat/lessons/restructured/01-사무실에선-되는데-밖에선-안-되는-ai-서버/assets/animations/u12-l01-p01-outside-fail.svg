<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사무실에서만 열리는 AI 서버</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사무실에서만 열리는 AI 서버</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 주소도 어느 쪽에서 쓰느냐에 달려요</text>
<rect x="40" y="130" width="320" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="200.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실 LAN</text><rect x="76" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="241" width="52" height="32" fill="#3d4b60"/><rect x="105" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="290" width="44" height="5" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><rect x="226" y="230" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="236" y="240" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="236" y="264" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="236" y="288" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="260" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><circle cx="480" cy="270" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 264 h28 l-7 -7 M495 276 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="806" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="814" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="796,282 884,282 892,294 788,294" fill="#6ea8fe"/><text x="840" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><line x1="300" y1="270" x2="450" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="270" x2="790" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="150" y="370" width="200" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="390.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">192.168.10.50:8080</text><circle cx="260" cy="200" r="16" fill="#7ee7c7"/><path d="M252 200 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="151" y="363" width="198" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,270;150,270;215,270;215,270" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="690" y="370" width="240" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="810" y="390.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">192.168.10.50:8080 입력</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="363" width="248" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="790,270;790,270;540,270;540,270" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="200" r="16" fill="#ff7b72"/><path d="M473 193 l14 14 M487 193 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="270" y="434" width="420" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">바깥에서는 이 사설 주소로 갈 길이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="174" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="200" r="16" fill="#ff7b72"/><path d="M473 193 l14 14 M487 193 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="434" width="380" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">사설 주소는 안쪽에서만 뜻이 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사무실 안에서는 AI 서버가 잘 열려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고객사의 박 팀장이 같은 주소를 입력해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 바깥에서는 그 주소로 갈 길이 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 주소는 안쪽에서만 뜻이 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>