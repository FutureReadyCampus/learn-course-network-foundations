<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이 주소, 사설일까 공인일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이 주소, 사설일까 공인일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">첫 숫자가 아니라 범위표에 대 봐요</text>
<rect x="76" y="336" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="343" width="52" height="30" fill="#3d4b60"/><polygon points="66,382 154,382 162,394 58,394" fill="#6ea8fe"/><text x="110" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><circle cx="480" cy="370" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 364 h28 l-7 -7 M495 376 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="420" text-anchor="middle" font-size="17" fill="#9aa3b2">고객사 공유기</text><ellipse cx="830" cy="370" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="830" y="377" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">내 IP 확인</text><line x1="170" y1="370" x2="450" y2="370" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="370" x2="760" y2="370" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="10" y="436" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="110" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">설정 172.20.4.31</text><rect x="730" y="436" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="830" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">사이트 192.0.2.77</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="118" width="224" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="412.0" y="141.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">범위</text><rect x="530" y="118" width="124" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="592.0" y="141.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">구분</text><rect x="300" y="162" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="412.0" y="188.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">10.0.0.0/8</text><rect x="530" y="162" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="592.0" y="188.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text><rect x="300" y="212" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="412.0" y="238.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">172.16.0.0/12</text><rect x="530" y="212" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="592.0" y="238.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text><rect x="300" y="262" width="224" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="412.0" y="288.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.0/16</text><rect x="530" y="262" width="124" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="592.0" y="288.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사설</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="208" width="362" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="688" cy="233" r="16" fill="#7ee7c7"/><path d="M680 233 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="662" y="207" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="10" y="436" width="200" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">안쪽 172.20.4.31</text><rect x="730" y="436" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="830" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">바깥 192.0.2.77</text><rect x="345" y="289" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="310.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">공유기가 바꿔 단 바깥 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="726" y="432" width="208" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장 노트북 설정과 내 IP 확인 사이트의 주소가 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">172.20.4.31을 사설 범위표에 대 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">172.16~172.31 안이라 사설 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">설정은 안쪽 주소, 사이트는 바깥 주소예요</text></g>

