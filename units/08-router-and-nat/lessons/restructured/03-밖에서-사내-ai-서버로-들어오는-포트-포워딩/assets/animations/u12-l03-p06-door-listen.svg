<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버가 기다리는 주소는 어느 문일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버가 기다리는 주소는 어느 문일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버 방에는 안쪽 문과 복도 쪽 문이 있어요</text>
<circle cx="120" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M105 294 h28 l-7 -7 M135 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="120" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="170" y1="300" x2="330" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="330" y="140" width="560" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><rect x="756" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="766" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="790" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버 프로그램</text><rect x="360" y="170" width="250" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="485.0" y="203.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">복도 쪽 문 192.168.10.50</text><rect x="360" y="340" width="250" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="485.0" y="373.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">안쪽 문 127.0.0.1</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="340" width="250" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="485.0" y="373.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">안쪽 문 127.0.0.1</text><line x1="610" y1="368" x2="756" y2="310" stroke="#7ee7c7" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="336" width="258" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;340,255;340,255" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="335" cy="255" r="16" fill="#ff7b72"/><path d="M328 248 l14 14 M342 248 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="355" y="259" width="250" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="280.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">복도 쪽 문이 닫혀 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="170" width="250" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="485.0" y="203.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">복도 쪽 문 192.168.10.50</text><line x1="610" y1="198" x2="756" y2="270" stroke="#7ee7c7" stroke-width="4"/><circle cx="335" cy="255" r="16" fill="#7ee7c7"/><path d="M327 255 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="166" width="258" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그룹웨어 서버 방에는 문이 둘 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방이 안쪽 문에서만 받도록 설정돼 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복도에서 온 손님은 들어오지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복도 쪽 문까지 열면 들어와요</text></g>

