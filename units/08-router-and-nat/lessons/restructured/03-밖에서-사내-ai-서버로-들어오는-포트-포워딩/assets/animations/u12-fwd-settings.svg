<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>공유기의 포트 포워딩 설정</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">공유기의 포트 포워딩 설정</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">관리 화면에 규칙 한 줄을 적어요</text>
<rect x="60" y="130" width="840" height="175" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="60" y="130" width="840" height="40" rx="12" fill="#3d4b60"/><text x="480" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">포트 포워딩 설정</text><rect x="80" y="190" width="142" height="38" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="151.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">규칙 이름</text><rect x="230" y="190" width="122" height="38" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="291.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">외부 포트</text><rect x="360" y="190" width="192" height="38" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="456.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">내부 IP</text><rect x="560" y="190" width="122" height="38" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="621.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">내부 포트</text><rect x="690" y="190" width="152" height="38" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="766.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">원격지 IP</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">아직 규칙이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="240" width="142" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="151.0" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">웹 서버</text><rect x="230" y="240" width="122" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="291.0" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">80</text><rect x="360" y="240" width="192" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="456.0" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.0.12</text><rect x="560" y="240" width="122" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="621.0" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">80</text><rect x="690" y="240" width="152" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="766.0" y="267.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">제한 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="76" y="236" width="810" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="620" cy="350" r="16" fill="#6ea8fe"/><rect x="602" y="370" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="710" cy="350" r="16" fill="#6ea8fe"/><rect x="692" y="370" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="800" cy="350" r="16" fill="#6ea8fe"/><rect x="782" y="370" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="646" cy="342" r="16" fill="#7ee7c7"/><path d="M638 342 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="736" cy="342" r="16" fill="#7ee7c7"/><path d="M728 342 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="826" cy="342" r="16" fill="#7ee7c7"/><path d="M818 342 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="236" width="160" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="170" y="359" width="260" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="300" y="380.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">원격지 제한 없음 = 누구나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="444" width="320" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="466.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">Rule은 방화벽 규칙과 같은 뜻</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 관리 화면에 포트 포워딩 메뉴가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">외부 80번을 192.168.0.12의 80번으로 연결해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원격지를 비워 두면 어느 바깥 주소든 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 한 줄을 Rule(규칙)이라고 불러요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>