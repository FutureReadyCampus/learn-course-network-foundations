<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사무실에서 공인 주소로 시험하면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사무실에서 공인 주소로 시험하면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">안쪽에서 바깥 주소로 가면 되돌아와야 해요</text>
<rect x="40" y="125" width="300" height="335" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="190.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실 LAN</text><rect x="76" y="174" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="181" width="52" height="32" fill="#3d4b60"/><rect x="105" y="220" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="230" width="44" height="5" fill="#6ea8fe"/><text x="110" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><rect x="226" y="310" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="236" y="320" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="236" y="344" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="236" y="368" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="260" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><circle cx="480" cy="280" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 274 h28 l-7 -7 M495 286 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="828" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="308" r="3" fill="#6ea8fe"/><text x="850" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">휴대폰 데이터</text><line x1="510" y1="280" x2="800" y2="280" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,210;150,210;445,275;445,275" keyTimes="0.000;0.013;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="385" y="150" width="270" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="170.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">목적지 198.51.100.25:8080</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="381" y="143" width="278" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><path d="M455 305 Q 390 390 300 372" fill="none" stroke="#ffb454" stroke-width="5" stroke-dasharray="10 6"/><polygon points="292,370 312,358 312,382" fill="#ffb454"/><rect x="410" y="424" width="340" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="580" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">헤어핀 NAT: 안쪽으로 다시 돌려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="215" r="16" fill="#ff7b72"/><path d="M473 208 l14 14 M487 208 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="430" y="424" width="300" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="580" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">장비에 따라 안 될 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="189" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="810,280;810,280;520,280;300,345;300,345" keyTimes="0.000;0.762;0.875;0.988;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="260" cy="280" r="16" fill="#7ee7c7"/><path d="M252 280 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="410" y="424" width="340" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="580" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">시험은 사무실 밖 회선에서 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 사무실 PC에서 198.51.100.25:8080을 입력해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 안쪽으로 되돌려 보내야 해요(헤어핀)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비와 설정에 따라 지원하지 않을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">시험은 휴대폰 데이터 같은 바깥 회선에서 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>