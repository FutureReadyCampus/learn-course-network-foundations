<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>그룹웨어 서버 주소가 바뀌면 규칙은?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">그룹웨어 서버 주소가 바뀌면 규칙은?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">규칙의 내부 IP가 옛 주소를 가리키면 안 닿아요</text>
<circle cx="250" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M235 294 h28 l-7 -7 M265 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="696" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="706" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="706" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="706" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="730" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><rect x="60" y="200" width="380" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="250.0" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">외부 8080 → 192.168.10.50:8080</text><line x1="290" y1="300" x2="690" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="290" y1="300" x2="690" y2="300" stroke="#7ee7c7" stroke-width="5"/><rect x="630" y="378" width="200" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="730" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">192.168.10.50</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="630" y="378" width="200" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="730" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">192.168.10.57</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="373" width="208" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="290" y1="300" x2="690" y2="300" stroke="#ff7b72" stroke-width="5" stroke-dasharray="10 6"/><circle cx="490" cy="300" r="16" fill="#ff7b72"/><path d="M483 293 l14 14 M497 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="85" y="379" width="330" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">규칙은 옛 주소 .50을 가리켜요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="196" width="388" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="460" y="150" width="460" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="690.0" y="179.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">DHCP 예약: MAC 주소 → 192.168.10.50</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="456" y="146" width="468" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="290" y1="300" x2="690" y2="300" stroke="#7ee7c7" stroke-width="5"/><circle cx="490" cy="300" r="16" fill="#7ee7c7"/><path d="M482 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="630" y="378" width="200" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="730" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">192.168.10.50</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙이 그룹웨어 서버 주소 192.168.10.50을 가리켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재부팅하자 그룹웨어 서버 주소가 .57로 바뀌었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙은 옛 주소 .50을 그대로 가리켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DHCP 예약으로 .50을 계속 받게 묶어요</text></g>

