<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서비스가 둘이면 규칙도 둘일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서비스가 둘이면 규칙도 둘일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">외부 포트 하나는 안쪽 한 곳으로만 가요</text>
<text x="210" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">바깥: 외부 포트</text><text x="650" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">안쪽: 보낼 곳</text><rect x="90" y="165" width="240" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="210.0" y="207.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">외부 TCP 8080</text><text x="380" y="212" text-anchor="middle" font-size="32" font-weight="700" fill="#9aa3b2">→</text><rect x="430" y="165" width="440" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="650.0" y="206.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">AI 서버 192.168.10.50:8080</text><rect x="90" y="275" width="240" height="70" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="380" y="322" text-anchor="middle" font-size="32" font-weight="700" fill="#9aa3b2">→</text><rect x="430" y="275" width="440" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="650.0" y="316.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">도면 NAS 192.168.10.30:5001</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="210" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">아직 없음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="408" width="380" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">NAS도 열어 달라는 요청이 왔어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="275" width="240" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="210.0" y="317.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">외부 TCP 8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="271" width="248" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="165" width="240" height="70" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="210.0" y="207.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ff7b72">외부 TCP 8080</text><rect x="90" y="275" width="240" height="70" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="210.0" y="317.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ff7b72">외부 TCP 8080</text><circle cx="380" cy="255" r="16" fill="#ff7b72"/><path d="M373 248 l14 14 M387 248 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="290" y="408" width="380" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">같은 외부 포트는 한 곳으로만 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="161" width="248" height="188" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="165" width="240" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210.0" y="207.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">외부 TCP 8080</text><rect x="90" y="275" width="240" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210.0" y="317.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">외부 TCP 5001</text><circle cx="380" cy="255" r="16" fill="#7ee7c7"/><path d="M372 255 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="290" y="408" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서비스마다 외부 포트를 나눠요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="271" width="248" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AI 서버 외에 도면 NAS도 밖에서 열어 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAS 규칙도 같은 외부 8080으로 적어 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 외부 8080이 두 줄이면 충돌해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAS는 외부 5001처럼 포트를 따로 나눠요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>