<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>WAN 주소로 앞단을 알아낼 수 있을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">WAN 주소로 앞단을 알아낼 수 있을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">WAN 주소가 규칙이 인터넷에 닿는지 알려 줘요</text>
<ellipse cx="95" cy="240" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="95" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><circle cx="570" cy="240" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M555 234 h28 l-7 -7 M585 246 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="570" y="290" text-anchor="middle" font-size="17" fill="#9aa3b2">우리 공유기</text><rect x="806" y="200" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="816" y="210" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="816" y="234" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="816" y="258" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="840" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><line x1="165" y1="240" x2="235" y2="240" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="385" y1="240" x2="540" y2="240" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="600" y1="240" x2="800" y2="240" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="195" width="150" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="310" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">앞단은?</text><text x="570" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">WAN 주소</text><rect x="470" y="345" width="200" height="42" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="570.0" y="372.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">WAN ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="195" width="150" height="90" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="310" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">통신사 NAT</text><text x="570" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">WAN 주소</text><rect x="470" y="345" width="200" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="570.0" y="372.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">100.66.7.9</text><circle cx="460" cy="240" r="16" fill="#ff7b72"/><path d="M453 233 l14 14 M467 233 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="290" y="416" width="380" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="437.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">통신사 NAT에는 우리 규칙이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="231" y="191" width="158" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="235" y="195" width="150" height="90" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="310" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">앞단 공유기</text><text x="570" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">WAN 주소</text><rect x="470" y="345" width="200" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="570.0" y="372.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">192.168.x.x</text><circle cx="460" cy="240" r="16" fill="#ff7b72"/><path d="M453 233 l14 14 M467 233 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="290" y="416" width="380" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="437.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">앞단 공유기에는 우리 규칙이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="231" y="191" width="158" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="165" y1="240" x2="540" y2="240" stroke="#7ee7c7" stroke-width="5"/><text x="570" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">WAN 주소</text><rect x="470" y="345" width="200" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="570.0" y="372.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">198.51.100.25</text><circle cx="340" cy="240" r="16" fill="#7ee7c7"/><path d="M332 240 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="310" y="416" width="340" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="437.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">공인 주소: NAT가 더 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="466" y="341" width="208" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 WAN 주소를 보면 앞단에 무엇이 있는지 알아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">100.64.0.0/10 안이면 통신사 NAT(CGNAT)가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">192.168.x.x 사설 주소면 앞단 공유기(이중 NAT)예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공인 주소면 NAT가 더 없어서 규칙이 닿아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>