<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>규칙을 적으면 바로 들어올 수 있을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">규칙을 적으면 바로 들어올 수 있을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소를 바꿔 주는 것과 들여보내는 것은 달라요</text>
<rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><circle cx="380" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M365 294 h28 l-7 -7 M395 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="380" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="786" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="796" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="796" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="796" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="820" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">GPU PC</text><text x="613" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">방화벽</text><line x1="150" y1="300" x2="350" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="410" y1="300" x2="596" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="630" y1="300" x2="780" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="215" width="26" height="170" rx="4" fill="#9aa3b2" stroke="#9aa3b2" stroke-width="2"/></g><g><rect x="205" y="155" width="350" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="380.0" y="184.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">외부 8080 → 192.168.10.50:8080</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;325,300;325,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="201" y="151" width="358" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="428" width="440" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">목적지가 192.168.10.50:8080로 바뀌어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="256" y="423" width="448" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="430,300;430,300;575,300;575,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="215" width="26" height="170" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><circle cx="613" cy="300" r="16" fill="#ff7b72"/><path d="M606 293 l14 14 M620 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="315" y="428" width="330" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">방화벽이 막으면 닿지 못해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="211" width="34" height="178" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="215" width="26" height="60" rx="4" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><rect x="600" y="325" width="26" height="60" rx="4" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><circle cx="613" cy="300" r="16" fill="#7ee7c7"/><path d="M605 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="260" y="428" width="440" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">변환 규칙 ≠ 허용, 방화벽은 따로 열어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="271" width="34" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="650,300;650,300;755,300;755,300" keyTimes="0.000;0.775;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기에 8080 변환 규칙을 적어 두었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기는 목적지만 GPU PC 주소로 바꿔 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽이 8080을 막으면 요청은 닿지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽에서 허용을 따로 열어야 들어가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>