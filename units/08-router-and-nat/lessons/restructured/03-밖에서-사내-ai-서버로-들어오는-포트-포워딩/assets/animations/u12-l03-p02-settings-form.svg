<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포트 포워딩 설정 화면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포트 포워딩 설정 화면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">칸마다 바깥 값인지 안쪽 값인지 물어요</text>
<rect x="170" y="135" width="220" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="280.0" y="164.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">외부 포트 · 바깥</text><rect x="400" y="135" width="390" height="46" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><rect x="170" y="193" width="220" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="280.0" y="222.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">프로토콜 · 공통</text><rect x="400" y="193" width="390" height="46" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><rect x="170" y="251" width="220" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="280.0" y="280.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">내부 IP · 안쪽</text><rect x="400" y="251" width="390" height="46" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><rect x="170" y="309" width="220" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="280.0" y="338.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">내부 포트 · 안쪽</text><rect x="400" y="309" width="390" height="46" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><rect x="170" y="367" width="220" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="280.0" y="396.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">원격지 · 바깥</text><rect x="400" y="367" width="390" height="46" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="135" width="390" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="595.0" y="164.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="193" width="390" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="595.0" y="222.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">TCP</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="251" width="390" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="595.0" y="280.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">192.168.10.50</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="309" width="390" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="595.0" y="338.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="367" width="390" height="46" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="595.0" y="396.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">비워 둠 = 누구나 들어와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="396" y="131" width="398" height="112" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="396" y="247" width="398" height="112" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="396" y="363" width="398" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="436" width="380" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">저장해도 방화벽 허용은 따로 확인해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 설정 화면에는 다섯 칸이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 칸: 외부 포트 8080, 프로토콜 TCP</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안쪽 칸: 내부 IP와 내부 포트를 채워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원격지를 비우면 누구나 들어와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>