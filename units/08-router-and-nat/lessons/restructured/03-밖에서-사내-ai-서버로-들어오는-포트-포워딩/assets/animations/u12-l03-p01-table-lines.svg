<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>변환표에 줄을 미리 적어 두면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">변환표에 줄을 미리 적어 두면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">자동으로 생기는 줄과 사람이 적는 줄</text>
<rect x="60" y="120" width="840" height="250" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><rect x="92" y="138" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="100" y1="150" x2="120" y2="150" stroke="#ffb454" stroke-width="2"/><line x1="100" y1="160" x2="120" y2="160" stroke="#ffb454" stroke-width="2"/><line x1="100" y1="170" x2="120" y2="170" stroke="#ffb454" stroke-width="2"/><text x="250" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">공유기 변환표</text><rect x="90" y="195" width="450" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="315.0" y="229.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">192.168.10.41:3000 → 53001</text><rect x="615" y="206" width="250" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="740" y="229.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">동적 매핑 (자동)</text><rect x="90" y="280" width="450" height="56" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="315" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">아직 적은 줄이 없어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="404" width="400" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">바깥 8080 요청을 보낼 줄이 아직 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="280" width="450" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="315.0" y="314.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">외부 8080 → 192.168.10.50:8080</text><rect x="615" y="292" width="250" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="740" y="314.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">정적 매핑 (직접 적음)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="276" width="458" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="575" cy="308" r="16" fill="#7ee7c7"/><path d="M567 308 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="200" y="404" width="560" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">바깥 8080 요청이 오면 이 줄을 보고 그룹웨어 서버로 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="276" width="458" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="280" width="450" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="315.0" y="314.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">외부 8080 → 192.168.10.50:8080</text><rect x="615" y="292" width="250" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="740" y="314.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">정적 매핑 = 포트 포워딩</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="611" y="284" width="258" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">변환표에는 나갈 때 자동으로 생긴 줄만 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 바깥 8080을 그룹웨어 서버로 보내는 줄을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 8080 요청이 오면 이 줄을 보고 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 적은 줄이 정적 매핑, 포트 포워딩이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>