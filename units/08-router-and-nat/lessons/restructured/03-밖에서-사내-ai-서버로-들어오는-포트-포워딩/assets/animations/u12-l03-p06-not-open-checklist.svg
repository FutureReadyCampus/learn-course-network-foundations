<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포워딩했는데 왜 밖에서 안 열릴까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포워딩했는데 왜 밖에서 안 열릴까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">가까운 곳부터 하나씩 지워 가요</text>
<rect x="90" y="135" width="500" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340.0" y="168.84" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">① AI 서버가 기다리는 주소</text><rect x="90" y="205" width="500" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340.0" y="238.84" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">② GPU PC 방화벽 8080/TCP</text><rect x="90" y="275" width="500" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340.0" y="308.84" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">③ 규칙의 내부 IP·포트·TCP</text><rect x="90" y="345" width="500" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340.0" y="378.84" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">④ 공유기 WAN 198.51.100.25</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="424" width="380" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">규칙은 넣었는데 휴대폰으로도 안 열려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="135" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="168.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">① AI 서버가 기다리는 주소</text><circle cx="620" cy="162" r="16" fill="#7ee7c7"/><path d="M612 162 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="90" y="205" width="500" height="54" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="340.0" y="238.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7b72">② GPU PC 방화벽 8080/TCP</text><circle cx="620" cy="232" r="16" fill="#ff7b72"/><path d="M613 225 l14 14 M627 225 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="695" y="216" width="190" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="790" y="237.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">8080 연결이 막혀요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="201" width="588" height="62" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="135" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="168.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">① AI 서버가 기다리는 주소</text><circle cx="620" cy="162" r="16" fill="#7ee7c7"/><path d="M612 162 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="205" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="238.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">② GPU PC 방화벽 8080/TCP</text><circle cx="620" cy="232" r="16" fill="#7ee7c7"/><path d="M612 232 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="695" y="216" width="190" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="237.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">지우가 8080 허용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="201" width="588" height="62" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="205" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="238.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">② GPU PC 방화벽 8080/TCP</text><circle cx="620" cy="232" r="16" fill="#7ee7c7"/><path d="M612 232 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="275" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="308.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">③ 규칙의 내부 IP·포트·TCP</text><circle cx="620" cy="302" r="16" fill="#7ee7c7"/><path d="M612 302 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="90" y="345" width="500" height="54" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="378.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">④ 공유기 WAN 198.51.100.25</text><circle cx="620" cy="372" r="16" fill="#7ee7c7"/><path d="M612 372 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="685" y="356" width="210" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="377.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">공인 주소라 CGNAT 아님</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="271" width="588" height="132" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙을 넣었는데 휴대폰 데이터로도 안 열려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 주소는 맞고 GPU PC 방화벽이 8080을 막고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 8080을 허용하자 막힌 곳이 풀려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 값과 WAN 주소도 맞아서 CGNAT는 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>