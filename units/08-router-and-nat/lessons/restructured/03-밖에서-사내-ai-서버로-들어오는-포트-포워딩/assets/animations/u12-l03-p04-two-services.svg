efinite"/><line x1="300" y1="365" x2="452" y2="315" stroke="#7ee7c7" stroke-width="6"/><rect x="321" y="330" width="110" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="376" y="350.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">외부 5001</text><rect x="550" y="414" width="300" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="700" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서비스마다 외부 포트를 나눠요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="317" y="323" width="118" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
