<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>변환표에 줄을 미리 적어 두면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">변환표에 줄을 미리 적어 두면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">자동으로 생기는 줄과 사람이 적는 줄</text>
<rect x="50" y="125" width="400" height="285" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="250" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">동적 매핑 (자동 행)</text><rect x="232" y="193" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="240" y1="205" x2="260" y2="205" stroke="#ffb454" stroke-width="2"/><line x1="240" y1="215" x2="260" y2="215" stroke="#ffb454" stroke-width="2"/><line x1="240" y1="225" x2="260" y2="225" stroke="#ffb454" stroke-width="2"/><rect x="510" y="125" width="400" height="285" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="710" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">정적 매핑 (포트 포워딩)</text><rect x="692" y="193" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="700" y1="205" x2="720" y2="205" stroke="#ffb454" stroke-width="2"/><line x1="700" y1="215" x2="720" y2="215" stroke="#ffb454" stroke-width="2"/><line x1="700" y1="225" x2="720" y2="225" stroke="#ffb454" stroke-width="2"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="436" width="380" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">바깥 8080 → GPU PC로 보내라는 한 줄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="75" y="265" width="350" height="42" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="250.0" y="291.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">192.168.10.41:3000 → 53001</text><rect x="125" y="329" width="250" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="250" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">공유기가 나갈 때 자동으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="71" y="261" width="358" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="265" width="350" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="710.0" y="291.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">외부 TCP 8080 → 192.168.10.50:8080</text><rect x="595" y="329" width="230" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="710" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">관리자가 미리 적어 둬요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="261" width="358" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="436" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">포트 포워딩 = 직접 적는 정적 매핑</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 8080 요청을 GPU PC로 보내는 줄을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동적 매핑은 안쪽에서 나갈 때 공유기가 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정적 매핑은 관리자가 미리 적어 둬요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트 포워딩은 직접 적는 정적 매핑이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>