<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">박 팀장은 어떤 주소로 접속할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">바깥 주소로 오면 공유기가 목적지를 바꿔 줘요</text>
