<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>UPnP와 NAT를 함께 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">UPnP와 NAT를 함께 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 포워딩, 입력하는 주체가 달라요</text>
<rect x="140" y="160" width="134" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="207.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2"></text><rect x="280" y="160" width="254" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="407.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">누가 입력하나</text><rect x="540" y="160" width="274" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="677.0" y="183.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">결과</text><g><rect x="140" y="204" width="134" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="207.0" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">수동</text><rect x="280" y="204" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="407.0" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">사용자가 직접</text><rect x="540" y="204" width="274" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="677.0" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">번거로워요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="200" width="682" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="254" width="134" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="207.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">UPnP</text><rect x="280" y="254" width="254" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="407.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">프로그램이 요청</text><rect x="540" y="254" width="274" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="677.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">자동으로 열려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="250" width="682" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="344" width="330" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="366.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">공유기 지원 + 기능 켜짐이 전제</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="307" y="339" width="346" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="413" width="340" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">입력 부담을 줄여 P2P를 도와요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수동 설정은 사용자가 직접 입력해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP는 프로그램이 대신 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">단, 공유기가 지원하고 켜져 있어야 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사람의 설정 부담을 줄이는 게 핵심이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>