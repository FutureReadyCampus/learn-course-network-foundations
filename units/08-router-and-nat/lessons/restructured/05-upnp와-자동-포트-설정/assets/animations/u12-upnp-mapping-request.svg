<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">찾고 → 요청하고 → 들어와요</text>
<rect x="40" y="150" width="280" height="270" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="180.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">우리 집</text><rect x="146" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="154" y="271" width="52" height="32" fill="#3d4b60"/><rect x="175" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="158" y="320" width="44" height="5" fill="#6ea8fe"/><text x="180" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 192.168.0.10</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="250" y1="300" x2="450" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><circle cx="820" cy="270" r="16" fill="#6ea8fe"/><rect x="802" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="820" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바깥 상대</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,300;250,300;440,300;440,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="295" y="190" width="190" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="390" y="210.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">설정 도우미 있나요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="390" y="190" width="180" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="210.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">6881번 열어 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="560" y="380" width="184" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="652.0" y="403.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">바깥 포트</text><rect x="750" y="380" width="174" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="837.0" y="403.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">안쪽 대상</text><rect x="560" y="424" width="184" height="42" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="652.0" y="449.68" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">198.51.100.25:6881</text><rect x="750" y="424" width="174" height="42" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="837.0" y="449.68" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">192.168.0.10:6881</text><rect x="462" y="358" width="36" height="44" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="470" y1="370" x2="490" y2="370" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="380" x2="490" y2="380" stroke="#ffb454" stroke-width="2"/><line x1="470" y1="390" x2="490" y2="390" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="556" y="420" width="372" height="50" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="770,300;770,300;520,300;440,300;250,300;250,300" keyTimes="0.000;0.512;0.588;0.662;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="180" cy="225" r="16" fill="#7ee7c7"/><path d="M172 225 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="146" y="201" width="68" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="144" width="300" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">프로그램이 포워딩을 자동으로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Torrent가 자동 설정 서비스를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기에게 6881번 매핑을 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 상대의 연결이 PC까지 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필요한 포트 포워딩을 자동으로 협의해요</text></g>

