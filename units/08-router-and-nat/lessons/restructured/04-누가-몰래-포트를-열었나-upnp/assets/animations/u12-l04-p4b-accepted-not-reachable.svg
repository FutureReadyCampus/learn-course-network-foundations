<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>요청이 성공해도 닿는다는 보장은 없다</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">요청이 성공해도 닿는다는 보장은 없다</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">줄이 생긴 것과 길이 열린 것은 별개예요</text>
<rect x="76" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="241" width="52" height="32" fill="#3d4b60"/><rect x="105" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="290" width="44" height="5" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.37</text><circle cx="480" cy="270" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 264 h28 l-7 -7 M495 276 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="816" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="806,282 894,282 902,294 798,294" fill="#6ea8fe"/><text x="850" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">협력사 PC</text><line x1="170" y1="270" x2="450" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="270" x2="800" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="310" y="140" width="340" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="167.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">TCP 6881 → 192.168.10.37:6881</text><rect x="415" y="196" width="130" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="217.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">요청 성공</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="136" width="348" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,270;800,270;560,270;560,270" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="650" cy="270" r="16" fill="#ff7b72"/><path d="M643 263 l14 14 M657 263 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="15" y="379" width="240" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="135" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">프로그램이 기다리지 않음</text><rect x="400" y="379" width="160" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">방화벽이 막음</text><rect x="645" y="379" width="230" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="760" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">통신사 NAT가 한 겹 더</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="4" y="368" width="892" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="440" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">요청 성공과 길이 열린 것은 별개예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기에 줄이 생겨 요청은 성공했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">협력사 PC가 6881번으로 연결을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신사 NAT·방화벽·프로그램 중 한 곳이 막을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청 성공과 길이 열린 것은 별개예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>