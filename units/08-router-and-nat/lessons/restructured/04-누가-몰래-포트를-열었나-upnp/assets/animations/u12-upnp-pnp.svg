<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>UPnP라는 기능</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">UPnP라는 기능</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Universal Plug and Play · 꽂으면 바로</text>
<rect x="346" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="354" y="271" width="52" height="32" fill="#3d4b60"/><rect x="375" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="358" y="320" width="44" height="5" fill="#6ea8fe"/><text x="380" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="586" y="260" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="591" y="304" width="18" height="16" fill="#9aa3b2"/><rect x="525" y="184" width="150" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="600" y="205.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">USB 저장장치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="600,290;600,290;440,290;440,290" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-14" y="-30" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="-9" y="14" width="18" height="16" fill="#9aa3b2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="260" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="431" y="304" width="18" height="16" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="380" cy="205" r="16" fill="#7ee7c7"/><path d="M372 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="275" y="394" width="210" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="380" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">설정 없이 바로 사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="389" width="198" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="590" y="283" width="260" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="720" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">UPnP = 네트워크판 PnP</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">USB 저장장치를 쓰고 싶어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC에 꽂기만 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복잡한 설정 없이 바로 쓸 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP는 이 생각을 네트워크로 넓힌 거예요</text></g>

