<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>매번 설정해야 하는 불편</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">매번 설정해야 하는 불편</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">택배마다 경비실에 직접 가서 적는 셈이에요</text>
<circle cx="110" cy="250" r="16" fill="#6ea8fe"/><rect x="92" y="270" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="236" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="244" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="226,302 314,302 322,314 218,314" fill="#6ea8fe"/><text x="270" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">게임</text><g><rect x="210" y="174" width="120" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">방 입장!</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="400" y="260" width="150" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="475.0" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">메뉴 찾기</text><rect x="570" y="260" width="150" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="645.0" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">포트 입력</text><rect x="740" y="260" width="150" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="815.0" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">재시작</text><text x="560" y="291" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">→</text><text x="730" y="291" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">→</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="396" y="256" width="498" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="645" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">방마다 또? 공유기마다 또?</text><circle cx="840" cy="355" r="16" fill="#ff7b72"/><path d="M833 348 l14 14 M847 348 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="816" y="331" width="48" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="433" width="340" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">자동으로 요청하는 방법 → UPnP</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게임 방에 들어갈 때마다 포트가 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">제조사 화면을 찾아 입력하고 재시작해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">매번 이렇게 하기는 너무 번거로워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 Lesson의 UPnP가 이 일을 자동화해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>