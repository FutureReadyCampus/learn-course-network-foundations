<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내가 연 적 없는 포트가 열려 있다?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내가 연 적 없는 포트가 열려 있다?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">수동 포워딩 목록이 비어도 UPnP 목록은 따로 있어요</text>
<rect x="40" y="125" width="270" height="300" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="175" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">포트 포워딩 목록</text><rect x="330" y="125" width="590" height="300" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="625" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">공유기 UPnP 목록</text><g><rect x="70" y="240" width="210" height="54" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="175.0" y="274.2" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">비어 있음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="236" width="218" height="62" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="180" width="184" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="442.0" y="203.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">외부 포트</text><rect x="540" y="180" width="294" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="687.0" y="203.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">안쪽 대상</text><rect x="350" y="224" width="184" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">TCP 6881</text><rect x="540" y="224" width="294" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="687.0" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.10.37:6881</text><rect x="350" y="274" width="184" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="300.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">UDP 27015</text><rect x="540" y="274" width="294" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="687.0" y="300.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.10.44:27015</text><rect x="350" y="324" width="184" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="442.0" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">UDP 50001</text><rect x="540" y="324" width="294" height="42" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="687.0" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">192.168.10.38:50001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="220" width="492" height="150" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="495" y="379" width="260" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="625" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">지우의 기억: 만든 적 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="491" y="373" width="268" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="440" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">수동 목록과 UPnP 목록을 따로 봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">시연용 8080 규칙을 지워 수동 목록은 비었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP 목록에는 모르는 줄이 세 개 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우의 기억에는 만든 적 없는 줄이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수동 목록과 UPnP 목록을 따로 점검해요</text></g>

