<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>UPnP, 켜 둘까 꺼 둘까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">UPnP, 켜 둘까 꺼 둘까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">정답 대신 대가를 비교해요</text>
<rect x="50" y="125" width="400" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">UPnP 켜 둠</text><circle cx="250" cy="215" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M235 209 h28 l-7 -7 M265 221 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="250" y="265" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="510" y="125" width="400" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><text x="710" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">UPnP 끔</text><circle cx="710" cy="215" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M695 209 h28 l-7 -7 M725 221 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="710" y="265" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="75" y="290" width="350" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="318.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">프로그램이 알아서 연결해요</text><rect x="75" y="345" width="350" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="250.0" y="373.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">열린 줄은 목록을 봐야 알아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="71" y="286" width="358" height="107" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="290" width="350" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="710.0" y="318.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">일부 P2P·게임은 불편해요</text><rect x="535" y="345" width="350" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="710.0" y="373.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">신청받아 사람이 열고 기록해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="286" width="358" height="107" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="440" width="400" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">한결디자인: 끄고 신청·기록으로 열기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="121" width="408" height="298" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">켜면 편하고 끄면 통제할 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">켠 쪽은 편하지만 목록을 열어 봐야 알아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">끈 쪽은 일부 프로그램이 불편하지만 통제돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한결디자인은 끄고 신청과 기록으로 가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>