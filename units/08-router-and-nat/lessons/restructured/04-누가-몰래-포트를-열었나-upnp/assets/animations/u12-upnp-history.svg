<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Plug and Play의 배경</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Plug and Play의 배경</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">사람이 하던 설정을 기계가 대신해요</text>
<rect x="60" y="140" width="400" height="290" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="260" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">예전</text><rect x="500" y="140" width="400" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">PnP 이후</text><rect x="242" y="204" width="36" height="22" fill="#e6e8ec"/><rect x="224" y="224" width="72" height="36" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="238" y="260" width="44" height="4" fill="#6ea8fe"/><rect x="682" y="204" width="36" height="22" fill="#e6e8ec"/><rect x="664" y="224" width="72" height="36" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="678" y="260" width="44" height="4" fill="#6ea8fe"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="160" y="304" width="200" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="260" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">드라이버 설치·설정</text><circle cx="260" cy="385" r="16" fill="#ff7b72"/><path d="M253 378 l14 14 M267 378 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="152" y="299" width="216" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="304" width="180" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">자동 인식·준비</text><circle cx="700" cy="385" r="16" fill="#7ee7c7"/><path d="M692 385 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="602" y="299" width="196" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="438" width="320" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">UPnP도 연결·설정을 자동으로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예전과 지금, 프린터 연결을 비교해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예전엔 사람이 직접 설치하고 설정했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PnP는 인식과 준비를 자동으로 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP도 같은 생각으로 자동화해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>