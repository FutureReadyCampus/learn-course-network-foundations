<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>꽂기만 하면 되는 편리함, 네트워크로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">꽂기만 하면 되는 편리함, 네트워크로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">PnP의 발상을 공유기까지 넓힌 것이 UPnP예요</text>
<rect x="50" y="125" width="400" height="290" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="250" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">PnP</text><rect x="306" y="214" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="314" y="221" width="52" height="32" fill="#3d4b60"/><rect x="335" y="260" width="10" height="10" fill="#6ea8fe"/><rect x="318" y="270" width="44" height="5" fill="#6ea8fe"/><text x="340" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC</text><rect x="510" y="125" width="400" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">UPnP</text><rect x="566" y="214" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="574" y="221" width="52" height="32" fill="#3d4b60"/><rect x="595" y="260" width="10" height="10" fill="#6ea8fe"/><rect x="578" y="270" width="44" height="5" fill="#6ea8fe"/><text x="600" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.37</text><circle cx="820" cy="250" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M805 244 h28 l-7 -7 M835 256 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="820" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="220" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="141" y="264" width="18" height="16" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,250;150,250;265,250;265,250" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-14" y="-30" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="-9" y="14" width="18" height="16" fill="#9aa3b2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="251" y="220" width="28" height="44" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="256" y="264" width="18" height="16" fill="#9aa3b2"/><rect x="140" y="339" width="220" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="360.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">설정 없이 바로 사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="339" width="220" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="360.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">설정 없이 바로 사용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="333" width="228" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="660,250;660,250;780,250;780,250" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="335" width="350" height="42" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="710.0" y="361.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">6881 → 192.168.10.37:6881</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="331" width="358" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="440" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">편해진 만큼 설정이 눈에서 멀어져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PnP는 장치를 꽂으면 알아서 준비해 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">USB를 꽂으면 설정 없이 바로 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP는 프로그램이 공유기에 줄을 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">편해진 만큼 설정이 눈에서 멀어져요</text></g>

