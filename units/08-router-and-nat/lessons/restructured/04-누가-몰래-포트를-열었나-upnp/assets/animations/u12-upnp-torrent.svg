<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Torrent와 P2P</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Torrent와 P2P</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공유기가 알아서 문을 열어 주는 이야기예요</text>
<rect x="40" y="150" width="280" height="270" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="180.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">우리 집</text><rect x="146" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="154" y="271" width="52" height="32" fill="#3d4b60"/><rect x="175" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="158" y="320" width="44" height="5" fill="#6ea8fe"/><text x="180" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC 192.168.0.10</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="250" y1="300" x2="450" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><circle cx="820" cy="270" r="16" fill="#6ea8fe"/><rect x="802" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="820" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바깥 상대</text><g><rect x="405" y="184" width="150" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">UPnP 실행 중</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="396" y="179" width="168" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="770,300;770,300;520,300;520,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="440,300;440,300;250,300;250,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="180" cy="225" r="16" fill="#7ee7c7"/><path d="M172 225 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="146" y="201" width="68" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="433" width="300" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">수동 설정 없이도 P2P 연결</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기의 UPnP 기능이 켜져 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 상대가 Torrent에게 연결을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기를 지나 PC까지 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP 덕분에 직접 설정하지 않아도 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>