<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>줄에도 기한이 있어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">줄에도 기한이 있어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">대장에 적은 줄은 기한 안에 갱신하고 끝나면 지워요</text>
<rect x="96" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="104" y="241" width="52" height="32" fill="#3d4b60"/><rect x="125" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="108" y="290" width="44" height="5" fill="#6ea8fe"/><text x="130" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.37</text><circle cx="480" cy="270" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 264 h28 l-7 -7 M495 276 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="190" y1="270" x2="450" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><text x="790" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">공유기 대장</text><rect x="630" y="170" width="320" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="178" width="300" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="790.0" y="203.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">TCP 6881 → .37  기한 1시간</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="174" width="308" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="384" width="300" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">줄과 기한을 함께 적어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="384" width="300" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">기한 전에 "연장해 주세요"</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="376" width="308" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="384" width="300" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">"제 줄을 지워 주세요"</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="376" width="308" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="178" width="300" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="790.0" y="203.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">TCP 6881 → .37  (주인 없음)</text><rect x="330" y="384" width="300" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">삭제 못 하고 꺼졌어요</text><circle cx="130" cy="340" r="16" fill="#ff7b72"/><path d="M123 333 l14 14 M137 333 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="174" width="308" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">줄을 적을 때 유지 시간(기한)도 같이 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램이 기한 전에 갱신해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">끝날 때는 줄을 지워 달라고 말해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">갑자기 꺼지면 줄이 대장에 남아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>