<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT가 가로막는 접속</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT가 가로막는 접속</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 설정할까, 프로그램이 대신할까</text>
<rect x="60" y="140" width="400" height="290" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="260" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">수동 포트 포워딩</text><rect x="500" y="140" width="400" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">UPnP 자동 설정</text><circle cx="170" cy="215" r="16" fill="#6ea8fe"/><rect x="152" y="235" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="170" y="307" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사용자</text><circle cx="360" cy="260" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M345 254 h28 l-7 -7 M375 266 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="360" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><circle cx="800" cy="260" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M785 254 h28 l-7 -7 M815 266 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="800" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="566" y="224" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="574" y="231" width="52" height="32" fill="#3d4b60"/><rect x="595" y="270" width="10" height="10" fill="#6ea8fe"/><rect x="578" y="280" width="44" height="5" fill="#6ea8fe"/><text x="600" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">Torrent</text><g><rect x="155" y="344" width="210" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="260" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">설정 화면 직접 입력</text><circle cx="260" cy="405" r="16" fill="#ff7b72"/><path d="M253 398 l14 14 M267 398 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="147" y="339" width="226" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="650,260;650,260;760,260;760,260" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="600" y="344" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="700" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">SSDP로 서비스 찾기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="592" y="339" width="216" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="700" cy="405" r="16" fill="#7ee7c7"/><path d="M692 405 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="672" y="377" width="56" height="56" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="305" y="438" width="350" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프로그램이 공유기와 대신 설정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사용자에게 포워딩 설정을 맡기기는 어려워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UPnP 프로그램은 SSDP로 공유기를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사람이 손대지 않아도 설정이 끝나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 자동화가 UPnP의 역할이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>