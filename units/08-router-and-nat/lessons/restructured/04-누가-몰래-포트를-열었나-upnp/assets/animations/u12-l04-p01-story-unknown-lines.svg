" y="258" width="104" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">TCP 6881</text><rect x="423" y="298" width="115" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="321.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">UDP 27015</text><rect x="423" y="338" width="115" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="361.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">UDP 50001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="196" width="268" height="188" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="762.66,187.0 782.66,187.0 832,203" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="603.34" y="113.0" width="193.32" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="765" y1="187" x2="781" y2="187" stroke="#171a21" stroke-width="5"/><text x="700" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사람이 안 열었는데</text><text x="700" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">포트가 열렸다고요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="598.34" y="108.0" width="203.32" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="256" y="419" width="447" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">지우가 만든 적 없는 줄은 누가 만들었을까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 공유기 화면의 모든 목록을 훑어봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">'UPnP' 메뉴에 만든 적 없는 줄이 세 개 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">곁에서 본 서 이사가 놀라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 줄의 정체를 알아봐요</text></g>

