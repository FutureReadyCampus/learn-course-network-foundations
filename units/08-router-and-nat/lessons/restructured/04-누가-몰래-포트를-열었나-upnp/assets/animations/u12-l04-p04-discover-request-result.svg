<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프로그램은 공유기에 어떻게 부탁할까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프로그램은 공유기에 어떻게 부탁할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">발견 → 요청 → 결과, 세 걸음이에요</text>
<rect x="266" y="249" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="274" y="256" width="52" height="32" fill="#3d4b60"/><rect x="295" y="295" width="10" height="10" fill="#6ea8fe"/><rect x="278" y="305" width="44" height="5" fill="#6ea8fe"/><text x="300" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.37</text><circle cx="670" cy="285" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M655 279 h28 l-7 -7 M685 291 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="670" y="335" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><line x1="360" y1="285" x2="640" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><text x="670" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">공유기 변환표</text><rect x="500" y="152" width="340" height="44" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="380,285;380,285;590,285;590,285" keyTimes="0.000;0.013;0.113;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="590,285;590,285;380,285;380,285" keyTimes="0.000;0.125;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="209" width="270" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">① 설정 받아 줄 장치 있나요?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="201" width="278" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="380,285;380,285;590,285;590,285" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="209" width="270" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">② 6881번 열어 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="201" width="278" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="500" y="152" width="340" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="179.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">TCP 6881 → 192.168.10.37:6881</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="496" y="148" width="348" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="424" width="380" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">사람이 입력하지 않아도 줄이 생겨요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">① 발견: 설정을 받아 줄 장치를 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">② 요청: 6881번을 열어 달라고 부탁해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">③ 결과: 공유기 변환표에 줄이 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사람이 입력하지 않아도 줄이 생겨요</text></g>

