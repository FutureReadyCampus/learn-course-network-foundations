<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>비밀번호도 없이 포트를 열어 준다고?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">비밀번호도 없이 포트를 열어 준다고?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 LAN 안이면 믿어 버리는 방식이에요</text>
<rect x="40" y="125" width="300" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="190.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실 LAN</text><rect x="156" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="164" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="146,262 234,262 242,274 138,274" fill="#ff7b72"/><text x="190" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.38</text><circle cx="480" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 249 h28 l-7 -7 M495 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><circle cx="850" cy="195" r="16" fill="#6ea8fe"/><rect x="832" y="215" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">공격자</text><line x1="340" y1="252" x2="450" y2="254" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="255" x2="800" y2="235" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="370" y="150" width="220" height="42" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="176.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">관리자 로그인 기록: 없음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="366" y="146" width="228" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,250;250,250;440,255;440,255" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="75" y="330" width="230" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="190" y="350.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">UPnP 요청: 50001 열어 줘</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="71" y="323" width="238" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="365" y="370" width="270" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="500.0" y="396.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">UDP 50001 → 192.168.10.38:50001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="361" y="366" width="278" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="810,235;810,235;520,255;250,250;250,250" keyTimes="0.000;0.525;0.631;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="436" width="340" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">같은 LAN이면 신분을 묻지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 UPnP 줄을 만든 관리자 로그인을 찾아봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">감염된 PC가 UPnP로 포트를 열어 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기는 줄을 만들고 바깥에서 들어올 길이 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 LAN이면 신분을 묻지 않아요</text></g>

