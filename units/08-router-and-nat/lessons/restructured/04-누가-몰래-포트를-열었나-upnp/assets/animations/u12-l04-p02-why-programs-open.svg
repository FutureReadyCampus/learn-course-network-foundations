<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프로그램은 왜 포트를 열고 싶어 할까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프로그램은 왜 포트를 열고 싶어 할까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">바깥에서 먼저 오는 연결을 받고 싶어서예요</text>
<rect x="40" y="125" width="300" height="250" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="190.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">사무실 LAN</text><rect x="156" y="209" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="164" y="216" width="52" height="32" fill="#3d4b60"/><rect x="185" y="255" width="10" height="10" fill="#6ea8fe"/><rect x="168" y="265" width="44" height="5" fill="#6ea8fe"/><text x="190" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.10.37</text><circle cx="480" cy="260" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 254 h28 l-7 -7 M495 266 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="816" y="226" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="233" width="52" height="30" fill="#3d4b60"/><polygon points="806,272 894,272 902,284 798,284" fill="#6ea8fe"/><text x="850" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">협력사 PC</text><line x1="340" y1="255" x2="450" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="510" y1="260" x2="800" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="90" y="319" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="190" y="340.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">P2P 전송 프로그램</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="313" width="208" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,260;800,260;540,260;540,260" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="195" r="16" fill="#ff7b72"/><path d="M473 188 l14 14 M487 188 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="454" y="169" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="385" width="130" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="395.0" y="411.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">메뉴 찾기</text><rect x="470" y="385" width="130" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="535.0" y="411.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">포트 입력</text><rect x="610" y="385" width="130" height="42" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="675.0" y="411.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">재시작</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="381" width="418" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="436" width="360" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">프로그램이 대신 부탁하자 → UPnP</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">P2P 전송 프로그램이 협력사의 연결을 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥에서 먼저 온 연결은 줄이 없어 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사용자가 직접 설정하기에는 번거로워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 프로그램이 대신 부탁하는 UPnP가 나왔어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>