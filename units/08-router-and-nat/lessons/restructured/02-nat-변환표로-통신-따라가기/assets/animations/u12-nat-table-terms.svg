<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Local · Remote · External</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Local · Remote · External</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">변환표 세 칸을 정리해요</text>
<g><rect x="60" y="170" width="260" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190.0" y="202.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">Local</text><rect x="60" y="230" width="260" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190.0" y="258.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">192.168.0.10:3000</text><text x="190" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">누가 시작했나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="170" width="260" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="202.92" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">Remote</text><rect x="350" y="230" width="260" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="258.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text><text x="480" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">누구와 통신하나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="170" width="260" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="770.0" y="202.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">External</text><rect x="640" y="230" width="260" height="46" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="770.0" y="258.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">198.51.100.25:53001</text><text x="770" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">바깥에선 어떻게 보이나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><path d="M190 330 C190 400 770 400 770 330" fill="none" stroke="#ffb454" stroke-width="4" stroke-dasharray="8 6"/><rect x="300" y="408" width="360" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">매핑은 Local ↔ External을 잇는 일</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Local은 집 안에서 시작한 통신이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Remote는 통신 상대 서버예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">External은 바깥에서 보이는 통신이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT 매핑은 Local과 External을 이어요</text></g>

