<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>웹 서버가 보는 접속 주체</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">웹 서버가 보는 접속 주체</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">편지를 받은 쪽은 경비실 주소만 봐요</text>
<polygon points="100,284 140,250 180,284" fill="#9aa3b2"/><rect x="108" y="284" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="131" y="304" width="18" height="28" fill="#3d4b60"/><text x="140" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">집 안</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="786" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="796" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="796" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="796" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="820" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="510" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="650" y="174" width="260" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="780" y="195.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">198.51.100.25:53001에서 왔네</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="384" width="220" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="140" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">192.168.0.10은 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="645" y="394" width="270" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="780" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">사용자 구별은 로그인·쿠키로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="434" width="400" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">바뀐 건 출발 포트 · 서버 포트 443은 그대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버는 바깥에서 보이는 주소·포트를 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집 안 노트북의 사설 주소는 알지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사용자는 로그인이나 쿠키로 구별해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 바꾼 것은 서버 포트가 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>