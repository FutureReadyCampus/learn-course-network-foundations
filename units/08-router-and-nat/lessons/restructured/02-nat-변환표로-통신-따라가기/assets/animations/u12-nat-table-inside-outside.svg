<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내부 사설망과 외부 공인망</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내부 사설망과 외부 공인망</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경계는 공유기 하나예요</text>
<g><rect x="40" y="160" width="300" height="230" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="190.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">내부 사설망</text><rect x="156" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="164" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="146,302 234,302 242,314 138,314" fill="#6ea8fe"/><text x="190" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">192.168.0.10</text></g><circle cx="480" cy="280" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 274 h28 l-7 -7 M495 286 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="395" y="190" width="170" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="210.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">안쪽 192.168.0.1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="385" y="354" width="190" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="375.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">바깥 198.51.100.25</text><rect x="640" y="160" width="280" height="230" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="780.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">외부 공인망</text><rect x="746" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="756" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="756" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="756" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="780" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="414" width="440" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">Local = 노트북의 주소·포트 (공유기 주소 X)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북은 집 안 사설 주소를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기의 안쪽 주소는 기본 게이트웨이예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 주소는 ISP가 배정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Local은 통신을 시작한 기기의 값이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>