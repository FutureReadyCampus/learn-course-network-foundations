<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>필터링은 받을 상대를 정해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">필터링은 받을 상대를 정해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">손님 확인을 얼마나 꼼꼼히 하나의 차이예요</text>
<g><rect x="290" y="134" width="380" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">A가 먼저 15.15.15.15:5555로 보냈어요</text></g><rect x="60" y="190" width="260" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="190.0" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">EIF · 누구든</text><rect x="350" y="190" width="260" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">ADF · 같은 IP</text><rect x="640" y="190" width="260" height="50" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="770.0" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">APDF · 같은 IP·포트</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="270" width="300" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="298.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">15.15.15.15:7777 도착</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="266" width="308" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="480,330;480,330;480,360;480,360" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="190" cy="380" r="16" fill="#7ee7c7"/><path d="M182 380 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="480" cy="380" r="16" fill="#7ee7c7"/><path d="M472 380 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="770" cy="380" r="16" fill="#ff7b72"/><path d="M763 373 l14 14 M777 373 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="186" width="268" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="428" width="380" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="451.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">누구든 → 같은 IP → 같은 IP·포트</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A는 15.15.15.15:5555와 먼저 통신했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 IP지만 다른 포트 7777에서 패킷이 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트까지 보는 APDF만 막을 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">비교가 자세할수록 받는 범위가 좁아져요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>