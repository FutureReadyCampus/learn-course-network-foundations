<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>NAT 뒤의 피어끼리 만나기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">NAT 뒤의 피어끼리 만나기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">모르는 사람이 경비실에 찾아온 상황이에요</text>
<rect x="46" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="54" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="36,312 124,312 132,324 28,324" fill="#6ea8fe"/><text x="80" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">A</text><circle cx="230" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M215 294 h28 l-7 -7 M245 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="230" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">A의 공유기</text><circle cx="730" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M715 294 h28 l-7 -7 M745 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="730" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">B의 공유기</text><rect x="846" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="854" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="836,312 924,312 932,324 828,324" fill="#6ea8fe"/><text x="880" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">B</text><line x1="130" y1="300" x2="200" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="260" y1="300" x2="700" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="760" y1="300" x2="830" y2="300" stroke="#3d4b60" stroke-width="4"/><g><rect x="330" y="173" width="300" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">A ↔ B 직접 주고받고 싶어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="700,300;700,300;275,300;275,300" keyTimes="0.000;0.275;0.463;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="266" width="68" height="68" rx="30" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="230" cy="240" r="16" fill="#ff7b72"/><path d="M223 233 l14 14 M237 233 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="155" y="378" width="150" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="230" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">어느 기기로?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="390" y="403" width="340" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="560" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">매핑 + 허용 조건이 둘 다 맞아야</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A와 B는 각자 공유기 뒤에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">B가 먼저 A의 공유기로 패킷을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A의 공유기는 어느 기기로 보낼지 몰라 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 통신엔 매핑과 허용 조건이 모두 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>