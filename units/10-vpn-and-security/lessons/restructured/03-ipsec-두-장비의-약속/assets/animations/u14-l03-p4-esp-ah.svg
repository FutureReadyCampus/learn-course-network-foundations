<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ESP와 AH는 뭘 지켜 줄까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ESP와 AH는 뭘 지켜 줄까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보호 방식을 고르는 기준이에요</text>
<rect x="100" y="217" width="800" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="130" y="253" text-anchor="start" font-size="22" font-weight="700" fill="#e6e8ec">기밀성</text><rect x="100" y="287" width="800" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="130" y="323" text-anchor="start" font-size="22" font-weight="700" fill="#e6e8ec">무결성</text><rect x="100" y="357" width="800" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="130" y="393" text-anchor="start" font-size="22" font-weight="700" fill="#e6e8ec">인증</text><rect x="470" y="152" width="120" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="530" y="177.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">ESP</text><text x="530" y="206" text-anchor="middle" font-size="15" fill="#9aa3b2">불투명 봉투 + 밀봉</text><rect x="700" y="152" width="120" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="760" y="177.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">AH</text><text x="760" y="206" text-anchor="middle" font-size="15" fill="#9aa3b2">투명 봉투 + 밀봉</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="530" cy="245" r="16" fill="#7ee7c7"/><path d="M522 245 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="530" cy="315" r="16" fill="#7ee7c7"/><path d="M522 315 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="530" cy="385" r="16" fill="#7ee7c7"/><path d="M522 385 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="461" y="211" width="138" height="208" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="760" cy="245" r="16" fill="#ff7b72"/><path d="M753 238 l14 14 M767 238 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="760" cy="315" r="16" fill="#7ee7c7"/><path d="M752 315 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="760" cy="385" r="16" fill="#7ee7c7"/><path d="M752 385 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="691" y="211" width="138" height="208" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="322" y="436" width="317" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="459.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">비밀 자료는 양쪽 모두 ESP로 맞춰요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보호 세 가지를 ESP와 AH가 어디까지 지킬까요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ESP는 암호화로 세 가지를 모두 켤 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AH는 무결성·인증만 주고 내용은 그대로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도면 같은 비밀 자료는 ESP를 골라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>