<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>집 공유기를 만나도 지나갈까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">집 공유기를 만나도 지나갈까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">NAT 통과(NAT-T)가 필요한 이유예요</text>
<rect x="30" y="140" width="360" height="250" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="210.0" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">박 팀장 집</text><rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 노트북</text><text x="110" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.0.20</text><circle cx="290" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M275 294 h28 l-7 -7 M305 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="290" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기(NAT)</text><text x="290" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">공인 192.0.2.123</text><ellipse cx="550" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="550" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="796" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="790" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="808" y="288" width="44" height="18" fill="#3d4b60"/><text x="830" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><text x="830" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25</text><line x1="150" y1="300" x2="250" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="330" y1="300" x2="480" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="620" y1="300" x2="790" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;240,300;240,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="485" y="194" width="150" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="560" y="216.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">ESP 패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="290" cy="228" r="16" fill="#ff7b72"/><path d="M283 221 l14 14 M297 221 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="440" y="194" width="240" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="560" y="216.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">ESP에는 포트 번호가 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="261" y="199" width="58" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="439" y="194" width="242" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="560" y="216.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">UDP 4500으로 한 번 더 포장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="186" width="268" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="340,300;340,300;780,300;780,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="830" cy="228" r="16" fill="#7ee7c7"/><path d="M822 228 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="254" y="430" width="451" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="453.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">대가: 헤더 한 겹, 그리고 UDP 500·4500을 열어야 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집 공유기(NAT)가 끼면 연결이 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ESP에는 포트가 없어 NAT가 구분하지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT-T가 ESP를 UDP 4500으로 한 번 더 감싸요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포장만큼 커지고 UDP 500·4500이 열려 있어야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>