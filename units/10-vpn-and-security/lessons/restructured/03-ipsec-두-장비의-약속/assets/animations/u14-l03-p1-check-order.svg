<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>터널이 안 뜰 때 확인 순서</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">터널이 안 뜰 때 확인 순서</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">막히는 증상과 의심할 곳을 한 줄로 묶었어요</text>
<rect x="320" y="138" width="610" height="66" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="350" cy="171.0" r="15" fill="#3d4b60"/><text x="350" y="177.0" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">1</text><text x="382" y="166" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">협상 시작(IKE)</text><text x="382" y="191" text-anchor="start" font-size="15" fill="#9aa3b2">시작도 못 하고 '협상 실패' · 의심: 두 SG 사이 UDP 500</text><rect x="320" y="214" width="610" height="66" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="350" cy="247.0" r="15" fill="#3d4b60"/><text x="350" y="253.0" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">2</text><text x="382" y="242" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">NAT 통과(NAT-T)</text><text x="382" y="267" text-anchor="start" font-size="15" fill="#9aa3b2">공유기 뒤에서 '연결 중'만 반복 · 의심: NAT-T 설정, UDP 4500</text><rect x="320" y="290" width="610" height="66" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="350" cy="323.0" r="15" fill="#3d4b60"/><text x="350" y="329.0" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">3</text><text x="382" y="318" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">협상 내용(암호 방식·수명·ESP 또는 AH)</text><text x="382" y="343" text-anchor="start" font-size="15" fill="#9aa3b2">협상 실패 메시지 · 의심: 양쪽 제안에 공통 조건이 있는가</text><rect x="320" y="366" width="610" height="66" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><circle cx="350" cy="399.0" r="15" fill="#3d4b60"/><text x="350" y="405.0" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">4</text><text x="382" y="394" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">상대 확인</text><text x="382" y="419" text-anchor="start" font-size="15" fill="#9aa3b2">인증 실패 메시지 · 의심: 사전 공유 키·인증서가 같은가</text><rect x="36" y="238" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="30" y="230" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="48" y="248" width="44" height="18" fill="#3d4b60"/><text x="70" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="236" y="238" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="230" y="230" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="248" y="248" width="44" height="18" fill="#3d4b60"/><text x="270" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><line x1="112" y1="260" x2="228" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="260" r="16" fill="#ff7b72"/><path d="M163 253 l14 14 M177 253 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="75" y="174" width="190" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="170" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">터널이 안 서요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="138" width="610" height="66" rx="8" fill="none" stroke="#7ee7c7" stroke-width="3"/><circle cx="350" cy="171.0" r="15" fill="#7ee7c7"/><text x="350" y="177.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="134" width="618" height="74" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="260" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M155 254 h28 l-7 -7 M185 266 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="170" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기(NAT)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="214" width="610" height="66" rx="8" fill="none" stroke="#7ee7c7" stroke-width="3"/><circle cx="350" cy="247.0" r="15" fill="#7ee7c7"/><text x="350" y="253.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="210" width="618" height="74" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="290" width="610" height="66" rx="8" fill="none" stroke="#7ee7c7" stroke-width="3"/><circle cx="350" cy="323.0" r="15" fill="#7ee7c7"/><text x="350" y="329.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">3</text><rect x="320" y="366" width="610" height="66" rx="8" fill="none" stroke="#7ee7c7" stroke-width="3"/><circle cx="350" cy="399.0" r="15" fill="#7ee7c7"/><text x="350" y="405.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="286" width="618" height="74" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="362" width="618" height="74" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="65" y="358" width="210" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">앞에서부터 순서대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널이 안 서면 확인할 조각이 네 개예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 두 SG가 협상을 시작하는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 끼면 2번이 3·4번보다 먼저 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나머지도 앞에서부터 순서대로 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>