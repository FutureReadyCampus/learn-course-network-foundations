<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IKE는 협상 회의, SA는 합의서</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IKE는 협상 회의, SA는 합의서</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">처음 만난 두 회사가 계약서를 쓰는 것과 같아요</text>
<rect x="116" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="110" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="128" y="288" width="44" height="18" fill="#3d4b60"/><text x="150" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="776" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="770" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="788" y="288" width="44" height="18" fill="#3d4b60"/><text x="810" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><line x1="200" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="183" width="240" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">협상 회의 = IKE</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="176" width="248" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="183" width="240" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">UDP 500으로 제안</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="176" width="248" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="230,280;230,280;730,280;730,280" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="730,320;730,320;230,320;230,320" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="183" width="240" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">합의서 = SA</text><rect x="40" y="400" width="220" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150.0" y="434.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">합의서 한 부</text><rect x="700" y="400" width="220" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="434.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">합의서 한 부</text><circle cx="480" cy="300" r="16" fill="#7ee7c7"/><path d="M472 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="176" width="248" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="183" width="240" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">기간 끝 = 새 회의</text><rect x="40" y="400" width="220" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150.0" y="434.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">새 열쇠로 다시</text><rect x="700" y="400" width="220" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810.0" y="434.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">새 열쇠로 다시</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="176" width="248" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 SG가 협상 회의를 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서로 제안을 주고받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">합의 결과를 합의서(SA)로 한 부씩 가져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기간이 끝나면 새 회의로 새 열쇠를 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>