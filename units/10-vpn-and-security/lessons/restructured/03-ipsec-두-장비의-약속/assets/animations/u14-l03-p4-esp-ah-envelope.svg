<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ESP와 AH는 뭘 지켜 줄까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ESP와 AH는 뭘 지켜 줄까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">봉투로 떠올리면 쉬워요</text>
<rect x="40" y="254" width="880" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="60" y="287" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">기밀성</text><text x="150" y="286" text-anchor="start" font-size="16" fill="#9aa3b2">내용을 못 읽게 가려요</text><rect x="40" y="314" width="880" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="60" y="347" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">무결성</text><text x="150" y="346" text-anchor="start" font-size="16" fill="#9aa3b2">내용이 안 바뀌었는지 확인해요</text><rect x="40" y="374" width="880" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><text x="60" y="407" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">인증</text><text x="150" y="406" text-anchor="start" font-size="16" fill="#9aa3b2">상대가 맞는지 확인해요</text><rect x="548" y="132" width="84" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M548 132 L590 162 L632 132" fill="none" stroke="#7ee7c7" stroke-width="3"/><circle cx="590" cy="162" r="8" fill="#7ee7c7"/><rect x="485" y="206" width="210" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="590" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ESP · 암호화 + 밀봉</text><rect x="768" y="132" width="84" height="56" rx="6" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="802" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">견적서</text><circle cx="839" cy="179" r="7" fill="#6ea8fe"/><rect x="705" y="206" width="210" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="810" y="228.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">AH · 밀봉만</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="590" cy="279" r="16" fill="#7ee7c7"/><path d="M582 279 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="590" cy="339" r="16" fill="#7ee7c7"/><path d="M582 339 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="590" cy="399" r="16" fill="#7ee7c7"/><path d="M582 399 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="541" y="246" width="98" height="186" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="810" cy="279" r="16" fill="#ff7b72"/><path d="M803 272 l14 14 M817 272 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="810" cy="339" r="16" fill="#7ee7c7"/><path d="M802 339 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="810" cy="399" r="16" fill="#7ee7c7"/><path d="M802 399 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="761" y="246" width="98" height="186" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="322" y="439" width="317" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">비밀 자료는 양쪽 모두 ESP로 맞춰요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보호 세 가지를 ESP와 AH가 어디까지 지킬까요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ESP는 암호화로 세 가지를 모두 켤 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AH는 무결성·인증만 주고 내용은 그대로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거래처 자료 같은 비밀 자료는 ESP를 골라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>