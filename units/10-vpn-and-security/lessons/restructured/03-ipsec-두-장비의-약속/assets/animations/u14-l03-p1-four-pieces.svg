<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IPsec의 네 조각</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IPsec의 네 조각</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">막혔을 때 앞에서부터 확인해요</text>
<rect x="46" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="40" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="58" y="288" width="44" height="18" fill="#3d4b60"/><text x="80" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="296" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="290" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="308" y="288" width="44" height="18" fill="#3d4b60"/><text x="330" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><line x1="125" y1="300" x2="285" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><circle cx="205" cy="300" r="16" fill="#ff7b72"/><path d="M198 293 l14 14 M212 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="110" y="208" width="190" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="205" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">터널이 안 서요</text><rect x="420" y="150" width="500" height="52" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="670.0" y="182.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">① IKE 협상 시작 · UDP 500</text><rect x="420" y="224" width="500" height="52" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="670.0" y="256.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">② NAT-T · UDP 4500</text><rect x="420" y="298" width="500" height="52" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="670.0" y="330.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">③ 협상 내용 · 암호·수명·ESP/AH</text><rect x="420" y="372" width="500" height="52" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="670.0" y="404.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">④ 상대 확인 · 사전 공유 키·인증서</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="420" y="150" width="500" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="182.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">① IKE 협상 시작 · UDP 500</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="416" y="146" width="508" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="420" y="224" width="500" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="256.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">② NAT-T · UDP 4500</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="416" y="220" width="508" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="420" y="298" width="500" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="330.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">③ 협상 내용 · 암호·수명·ESP/AH</text><rect x="420" y="372" width="500" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="670.0" y="404.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">④ 상대 확인 · 사전 공유 키·인증서</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="100" y="364" width="210" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="205" y="386.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">앞에서부터 순서대로</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널이 안 서면 확인할 조각이 네 개예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 두 SG가 협상을 시작하는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 있으면 NAT-T를 바로 다음에 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">협상 내용과 상대 확인까지 차례로 따라가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>