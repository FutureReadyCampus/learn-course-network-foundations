<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>인증서는 장비의 신분증</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">인증서는 장비의 신분증</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경비실 명단과 맞춰 보는 방식이에요</text>
<rect x="76" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="70" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="88" y="288" width="44" height="18" fill="#3d4b60"/><text x="110" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="816" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="810" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="828" y="288" width="44" height="18" fill="#3d4b60"/><text x="850" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><line x1="160" y1="300" x2="800" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="375" y="173" width="210" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">당신이 누구죠?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="371" y="165" width="218" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="150" width="290" height="190" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">이름: 도쿄 지사 SG</text><text x="480" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">그 장비의 공개 키</text><circle cx="400" cy="300" r="20" fill="none" stroke="#c792ea" stroke-width="3"/><text x="535" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">발급 기관 도장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="146" width="298" height="198" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="150" width="460" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">경비실 명단(신뢰 목록)과 맞춰요</text><text x="500" y="250" text-anchor="middle" font-size="18" fill="#e6e8ec">도장 기관이 명단에 있다</text><circle cx="285" cy="244" r="16" fill="#7ee7c7"/><path d="M277 244 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="500" y="305" text-anchor="middle" font-size="18" fill="#e6e8ec">이름이 상대가 말한 이름과 같다</text><circle cx="285" cy="299" r="16" fill="#7ee7c7"/><path d="M277 299 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="146" width="468" height="198" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="460" y="186" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M469 186 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="280" y="343" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="366.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">통과하면 협상을 이어 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="335" width="408" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울 SG가 "누구세요?" 하고 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 SG가 신분증(인증서)을 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울 SG가 명단과 이름을 맞춰 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통과하면 협상을 이어 가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>