<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>브라우저로 붙는 SSL VPN</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">브라우저로 붙는 SSL VPN</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">호텔 와이파이에서 IPsec이 안 될 때예요</text>
<rect x="86" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="94" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="76,312 164,312 172,324 68,324" fill="#6ea8fe"/><text x="120" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서 이사 노트북</text><text x="120" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">호텔 192.0.2.150</text><rect x="330" y="220" width="130" height="160" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="395" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">호텔</text><text x="395" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">와이파이</text><rect x="786" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="780" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="798" y="288" width="44" height="18" fill="#3d4b60"/><text x="820" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 SG</text><text x="820" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25</text><line x1="180" y1="300" x2="330" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="460" y1="300" x2="780" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="375" y="174" width="210" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">웹 위주로만 열려 있어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="166" width="298" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;310,300;310,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="395" cy="200" r="16" fill="#ff7b72"/><path d="M388 193 l14 14 M402 193 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="365" y="144" width="230" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">IPsec: UDP 500·4500</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="366" y="171" width="58" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;770,300;770,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="365" y="144" width="230" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">SSL VPN: TCP 443</text><circle cx="820" cy="228" r="16" fill="#7ee7c7"/><path d="M812 228 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="361" y="136" width="238" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="294" y="430" width="372" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="453.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">웹이 열려 있으면 SSL VPN은 대개 통과해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출장지 호텔 와이파이는 웹 위주로만 열려 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IPsec이 쓰는 UDP 500·4500은 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS 위의 SSL VPN은 443번 포트로 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">환경에 따라 IPsec과 SSL VPN을 나눠 써요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>