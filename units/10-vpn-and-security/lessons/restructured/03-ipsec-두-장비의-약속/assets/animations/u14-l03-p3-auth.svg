<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상대가 진짜 본사 SG일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상대가 진짜 본사 SG일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누가 본사 SG인 척하면 어쩌죠?</text>
<rect x="40" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">사전 공유 키 (PSK)</text><text x="250" y="192" text-anchor="middle" font-size="16" fill="#9aa3b2">미리 정한 암구호</text><rect x="500" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#c792ea">인증서</text><text x="710" y="192" text-anchor="middle" font-size="16" fill="#9aa3b2">기관이 보증한 신분증</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="235" width="175" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="157.5" y="264.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">도쿄 SG: 비밀값 A</text><rect x="255" y="235" width="175" height="48" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="342.5" y="264.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">서울 SG: 비밀값 A</text><circle cx="250" cy="320" r="16" fill="#7ee7c7"/><path d="M242 320 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="125" y="359" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="380.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">같은 값이면 상대를 믿어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="227" width="376" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="540" y="235" width="340" height="48" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="264.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">CA가 '본사 SG가 맞다'고 보증</text><circle cx="710" cy="320" r="16" fill="#7ee7c7"/><path d="M702 320 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="585" y="359" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="380.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">인증서를 서로 보여 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="532" y="227" width="356" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="323" y="440" width="314" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="463.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">상대 확인과 암호화는 다른 일이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 진짜 본사 SG인지 확인하는 방법이 둘이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PSK는 양쪽에 미리 넣은 같은 비밀값을 믿어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인증서는 기관이 보증한 증명서를 믿어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인증은 상대를, 암호화는 내용을 다뤄요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>