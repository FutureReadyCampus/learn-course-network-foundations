epeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;232,300;232,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="494" y="178" width="253" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="620" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">AH 패킷 · 출발 192.168.0.20</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="489.63" y="174.5" width="260.74" height="41" rx="16.5" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="178" width="340" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="640" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">공유기가 출발을 192.0.2.123으로 바꿔요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="465.94" y="174.5" width="348.12" height="41" rx="16.5" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="738" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M738 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="830" cy="228" r="16" fill="#ff7b72"/><path d="M823 221 l14 14 M837 221 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="801" y="199" width="58" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="451" y="178" width="317" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="610" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">AH: 주소가 바뀌면 변조로 보고 버려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="447.33000000000004" y="174.5" width="325.34" height="41" rx="16.5" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="502" y="178" width="276" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">그래서 NAT 뒤에서는 ESP를 써요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="497.9" y="174.5" width="284.2" height="41" rx="16.5" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집 노트북의 AH 패킷이 공유기를 만나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 패킷의 출발 주소를 바꿔요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AH는 바뀐 주소를 변조로 보고 버려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAT 뒤에서는 ESP를 써야 해요</text></g>

