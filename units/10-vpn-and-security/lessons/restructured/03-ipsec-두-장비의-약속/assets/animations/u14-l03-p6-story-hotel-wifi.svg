" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="150" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(150,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="150" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="344" width="188" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="150" y="366.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">출장지 호텔 와이파이</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="305.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="4"/><circle cx="400" cy="267" r="16" fill="#ff7b72"/><path d="M393 260 l14 14 M407 260 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="400" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">IPsec VPN 안 됨</text><rect x="392" y="341" width="16" height="14" fill="#3d4b60"/><rect x="364" y="355" width="72" height="7" rx="3" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="291" y="225" width="218" height="120" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="545.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><circle cx="640" cy="267" r="16" fill="#7ee7c7"/><path d="M632 267 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="640" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">웹사이트는 열려요</text><rect x="632" y="341" width="16" height="14" fill="#3d4b60"/><rect x="604" y="355" width="72" height="7" rx="3" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="225" width="218" height="120" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="319" y="419" width="323" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">웹만 열린 곳에서 붙는 VPN은?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사가 출장지 호텔에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">호텔 와이파이에서 IPsec VPN을 쓰지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데 웹사이트는 잘 열려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 브라우저로 붙는 SSL VPN을 알아봐요</text></g>

