eTransform attributeName="transform" type="translate" values="260,262;260,262;700,262;700,262" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="700,306;700,306;260,306;260,306" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="70" y="365" width="260" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="200.0" y="396.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">SA: 알고리즘·키·수명</text><rect x="630" y="365" width="260" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="760.0" y="396.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">SA: 알고리즘·키·수명</text><circle cx="480" cy="280" r="16" fill="#7ee7c7"/><path d="M472 280 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="62" y="357" width="276" height="68" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="622" y="357" width="276" height="68" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="282" y="430" width="396" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="453.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">공통 조건 하나를 찾는 일이라 없으면 실패해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 만난 두 SG가 약속을 정해야 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IKE로 암호 방식과 키, 수명을 제안해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">합의 결과를 SA 메모로 각자 기억해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공통으로 허용하는 조건이 없으면 협상이 실패해요</text></g>

