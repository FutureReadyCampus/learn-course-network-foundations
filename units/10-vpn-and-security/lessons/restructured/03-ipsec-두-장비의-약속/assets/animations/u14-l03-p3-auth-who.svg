<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>상대가 진짜 본사 SG일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">상대가 진짜 본사 SG일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누가 본사 SG인 척하면 어쩌죠?</text>
<rect x="86" y="128" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="80" y="120" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="98" y="138" width="44" height="18" fill="#3d4b60"/><text x="120" y="190" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="806" y="128" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="800" y="120" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="818" y="138" width="44" height="18" fill="#3d4b60"/><text x="840" y="190" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 SG라는 장비</text><line x1="165" y1="150" x2="795" y2="150" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><circle cx="480" cy="150" r="16" fill="#ffb454"/><text x="480" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><rect x="40" y="225" width="420" height="200" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">사전 공유 키 (PSK)</text><text x="250" y="280" text-anchor="middle" font-size="16" fill="#9aa3b2">미리 정한 암구호</text><rect x="500" y="225" width="420" height="200" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">인증서</text><text x="710" y="280" text-anchor="middle" font-size="16" fill="#9aa3b2">기관이 보증한 신분증</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="52" y="298" width="194" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="149.0" y="326.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">도쿄 SG: 비밀값 A</text><rect x="254" y="298" width="194" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="351.0" y="326.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">서울 SG: 비밀값 A</text><rect x="125" y="376" width="250" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="398.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">같은 값이면 상대를 믿어요</text><circle cx="412" cy="392" r="16" fill="#7ee7c7"/><path d="M404 392 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="48" y="294" width="404" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="512" y="298" width="396" height="46" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="710.0" y="326.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">CA가 '본사 SG가 맞다'고 보증</text><rect x="585" y="376" width="250" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="398.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">인증서를 서로 보여 줘요</text><circle cx="872" cy="392" r="16" fill="#7ee7c7"/><path d="M864 392 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="508" y="294" width="404" height="54" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="323" y="439" width="314" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">상대 확인과 암호화는 다른 일이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 진짜 본사 SG인지 확인하는 방법이 둘이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PSK는 양쪽에 미리 넣은 같은 비밀값을 믿어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인증서는 기관이 보증한 증명서를 믿어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인증은 상대를, 암호화는 내용을 다뤄요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>