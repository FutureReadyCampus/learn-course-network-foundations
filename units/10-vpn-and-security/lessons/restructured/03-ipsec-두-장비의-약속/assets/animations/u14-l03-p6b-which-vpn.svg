<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>누구에게 어떤 VPN을 쓸까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">누구에게 어떤 VPN을 쓸까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">대상에 따라 나눠 쓰는 구성이 흔해요</text>
<rect x="40" y="124" width="880" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="40" y="222" width="880" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><rect x="40" y="320" width="880" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="1"/><g><g transform="translate(100,170) scale(0.75)"><polygon points="-40,-6 0,-40 40,-6" fill="#9aa3b2"/><rect x="-32" y="-6" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="-9" y="14" width="18" height="28" fill="#3d4b60"/></g><text x="170" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">지사끼리</text><text x="170" y="192" text-anchor="start" font-size="16" fill="#9aa3b2">도쿄 지사 ↔ 서울 본사</text><rect x="485" y="152" width="90" height="34" rx="17" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="530" y="175.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">IPsec</text><text x="700" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">망 전체 연결</text><text x="700" y="192" text-anchor="start" font-size="16" fill="#9aa3b2">IP 계층에서 통째로 이어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="120" width="888" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="234" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="241" width="52" height="30" fill="#3d4b60"/><polygon points="56,280 144,280 152,292 48,292" fill="#6ea8fe"/><text x="170" y="262" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">출장·재택 한 명</text><text x="170" y="290" text-anchor="start" font-size="16" fill="#9aa3b2">서 이사 노트북</text><rect x="455" y="250" width="149" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="530" y="273.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">SSL/TLS VPN</text><text x="700" y="262" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">필요한 앱 몇 개</text><text x="700" y="290" text-anchor="start" font-size="16" fill="#9aa3b2">앱별로 좁게 열어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="218" width="888" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="66" y="332" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="339" width="52" height="30" fill="#3d4b60"/><polygon points="56,378 144,378 152,390 48,390" fill="#6ea8fe"/><text x="170" y="360" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">외주 작업자</text><text x="170" y="388" text-anchor="start" font-size="16" fill="#9aa3b2">그룹웨어 웹 한 곳, 2주만</text><rect x="423" y="348" width="213" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="530" y="371.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">SSL/TLS VPN 웹 포털</text><text x="700" y="360" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">웹 한 곳만</text><text x="700" y="388" text-anchor="start" font-size="16" fill="#9aa3b2">클라이언트 설치가 거의 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="316" width="888" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="433" width="279" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">연결 대상과 환경을 보고 골라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지사끼리 망 전체를 이을 때는 IPsec이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출장·재택은 필요한 앱만 SSL/TLS VPN으로 붙어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 한 곳만 열어 줄 때는 웹 포털이 가벼워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정답은 없고 연결 대상과 환경을 보고 골라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>