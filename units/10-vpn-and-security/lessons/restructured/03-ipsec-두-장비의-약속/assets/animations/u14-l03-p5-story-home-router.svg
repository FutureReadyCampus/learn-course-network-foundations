ddle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(150,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="150" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="128" y="344" width="45" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="150" y="366.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">집</text></g><rect x="335.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><circle cx="410" cy="267" r="6" fill="#6ea8fe" fill-opacity="1"/><circle cx="430" cy="267" r="6" fill="#6ea8fe" fill-opacity="0.6"/><circle cx="450" cy="267" r="6" fill="#6ea8fe" fill-opacity="0.3"/><text x="430" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">VPN 연결 중</text><rect x="422" y="341" width="16" height="14" fill="#3d4b60"/><rect x="394" y="355" width="72" height="7" rx="3" fill="#3d4b60"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="660" cy="285" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M645 279 h28 l-7 -7 M675 291 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="660" y="335" text-anchor="middle" font-size="17" fill="#9aa3b2">집 공유기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="606" y="241" width="108" height="108" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="476.13" y="169" width="147.74" height="52" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="504.13,181 520.13,209 488.13,209" fill="#ff7b72"/><text x="504.13" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">!</text><text x="534.13" y="201" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">시간 초과</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="471" y="163" width="158" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="306" y="419" width="348" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">공유기가 끼면 무슨 일이 생길까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 집에서 VPN을 켰어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결이 한참 멈췄다가 시간 초과가 나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 장비 사이에 집 공유기가 끼어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 공유기(NAT)의 영향을 알아봐요</text></g>

