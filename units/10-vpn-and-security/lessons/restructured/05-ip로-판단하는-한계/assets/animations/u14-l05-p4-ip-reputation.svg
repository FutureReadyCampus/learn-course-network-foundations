<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>IP 주소에도 평판이 있다?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">IP 주소에도 평판이 있다?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 대의 문제를 출구 전체가 떠안아요</text>
<rect x="30" y="125" width="370" height="300" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="215.0" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">한결디자인 본사</text><rect x="66" y="189" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="196" width="52" height="32" fill="#3d4b60"/><rect x="95" y="235" width="10" height="10" fill="#6ea8fe"/><rect x="78" y="245" width="44" height="5" fill="#6ea8fe"/><text x="100" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">PC</text><rect x="66" y="309" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="316" width="52" height="32" fill="#3d4b60"/><rect x="95" y="355" width="10" height="10" fill="#6ea8fe"/><rect x="78" y="365" width="44" height="5" fill="#6ea8fe"/><text x="100" y="395" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">감염 PC</text><circle cx="300" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M285 294 h28 l-7 -7 M315 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="300" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">NAT 출구</text><rect x="766" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="776" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="800" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="150" y1="235" x2="262" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="150" y1="340" x2="262" y2="318" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="360" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g><rect x="231" y="214" width="138" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="235.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">198.51.100.25</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="226.8" y="210.0" width="146.39999999999998" height="40" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="58" y="303" width="84" height="66" rx="8" fill="none" stroke="#ff7b72" stroke-width="3"/><rect x="212" y="379" width="96" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="260" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">스팸 발송</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="54" y="299" width="92" height="74" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,340;150,340;262,318;310,300;740,300;740,300" keyTimes="0.000;0.275;0.342;0.408;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="752" y="179" width="96" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="800" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">평판 하락</text><circle cx="800" cy="238" r="16" fill="#ff7b72"/><path d="M793 231 l14 14 M807 231 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="748.24" y="175.0" width="103.52" height="40" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="523" y="414" width="194" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="620" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">정상 메일도 스팸함으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="334" y="436" width="292" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">출구 뒤 장비 점검과 차단 해제 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330.08000000000004" y="431.5" width="299.84" height="41" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모든 PC가 같은 공인 주소 하나로 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">감염된 PC가 스팸을 같은 출구로 내보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출구 주소의 평판이 깎여 정상 메일도 의심받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평판은 힌트예요. 내부 장비를 점검해요</text></g>

