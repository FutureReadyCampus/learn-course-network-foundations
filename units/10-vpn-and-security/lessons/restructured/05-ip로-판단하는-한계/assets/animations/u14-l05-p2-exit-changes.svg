<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>VPN을 켜면 왜 출구가 바뀔까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">VPN을 켜면 왜 출구가 바뀔까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 사람, 같은 노트북인데 출발지가 달라져요</text>
<rect x="40" y="120" width="420" height="300" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="250" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">VPN 끔</text><rect x="500" y="120" width="420" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">전체 터널 켬</text><rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="366" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="376" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="376" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="376" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="400" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="160" y1="300" x2="360" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="526" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="534" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="516,312 604,312 612,324 508,324" fill="#6ea8fe"/><text x="560" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="676" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="670" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="688" y="288" width="44" height="18" fill="#3d4b60"/><text x="710" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">SG</text><rect x="826" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="620" y1="300" x2="668" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="752" y1="300" x2="820" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="44" y="258" width="112" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="504" y="258" width="112" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="165,300;165,300;350,300;350,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="625,300;625,300;710,300;815,300;815,300" keyTimes="0.000;0.275;0.375;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="666" y="266" width="88" height="56" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="184" y="199" width="171" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">출발지 192.0.2.150</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="650" y="199" width="190" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="745" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">출발지 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="645.88" y="195.0" width="198.24" height="40" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="303" y="431" width="355" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="454.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서비스가 보는 것은 마지막 출구 하나예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="298.56" y="427.0" width="362.88" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출장지에서 VPN을 끄거나 켠 두 경우를 비교해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전체 터널은 모든 트래픽을 SG로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서비스에 보이는 출발지 IP가 서로 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP는 마지막 출구를 말해 줄 뿐이에요</text></g>

