2" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="470.0" y="376.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">평소와 다른 행동</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="196" width="348" height="204" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="200" width="340" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="470.0" y="231.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">추가 인증을 못 해요</text><circle cx="614" cy="226.0" r="16" fill="#ff7b72"/><path d="M607 219.0 l14 14 M621 219.0 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="300" y="272" width="340" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="470.0" y="303.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">관리 안 되는 기기</text><circle cx="614" cy="298.0" r="16" fill="#ff7b72"/><path d="M607 291.0 l14 14 M621 291.0 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="300" y="344" width="340" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="470.0" y="375.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">낯선 시간대 · 낯선 양</text><circle cx="614" cy="370.0" r="16" fill="#ff7b72"/><path d="M607 363.0 l14 14 M621 363.0 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="196" width="348" height="204" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="272" width="340" height="52" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="470.0" y="304.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">기기 통제 → Unit 15 NAC</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="268" width="348" height="60" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="284" y="436" width="392" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">신호를 더할수록 안전하지만 불편·오탐도 늘어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280.1" y="431.5" width="399.79999999999995" height="41" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 공격자가 같은 VPN 주소로 다시 시도해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 말고 계정·기기·행동 신호를 더 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">신호마다 확인하면 공격자가 걸러져요</text></g>
