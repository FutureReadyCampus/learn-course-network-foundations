<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>여러 번 거친 접속은 왜 추적이 어려울까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">여러 번 거친 접속은 왜 추적이 어려울까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">기록이 흩어져 있어 한 곳만 끊겨도 멈춰요</text>
<line x1="150" y1="300" x2="230" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="370" y1="300" x2="512" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="568" y1="300" x2="756" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="175,300;175,300;775,300;775,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><circle cx="90" cy="250" r="16" fill="#6ea8fe"/><rect x="72" y="270" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="90" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">공격자</text><ellipse cx="300" cy="300" rx="70" ry="42" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="300" y="307" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">해외 VPN 업체</text><circle cx="540" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M525 294 h28 l-7 -7 M555 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="540" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">감염된 가정 공유기</text><rect x="756" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="766" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="790" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">한결디자인</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="375" width="200" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="300.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">해외 업체 기록</text><rect x="440" y="375" width="200" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="540.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">가정집 기록</text><rect x="690" y="375" width="200" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="790.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">우리 회사 기록</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="371" width="698" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="770" y1="235" x2="340" y2="235" stroke="#ffb454" stroke-width="5"/><polygon points="324,235 344,224 344,246" fill="#ffb454"/><circle cx="866" cy="397" r="16" fill="#7ee7c7"/><path d="M858 397 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><circle cx="616" cy="397" r="16" fill="#7ee7c7"/><path d="M608 397 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="375" width="200" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="300.0" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">기록 없음</text><circle cx="376" cy="397" r="16" fill="#ff7b72"/><path d="M369 390 l14 14 M383 390 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="371" width="208" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="273" y="439" width="413" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">한 구간의 기록이 없으면 역추적이 거기서 멈춰요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="269.4" y="435.0" width="421.2" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공격은 중계 지점 세 곳을 거쳐 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">구간마다 기록이 다른 조직에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거슬러 올라가다 기록 없는 곳에서 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 각 구간의 기록 보존이 중요해요</text></g>

