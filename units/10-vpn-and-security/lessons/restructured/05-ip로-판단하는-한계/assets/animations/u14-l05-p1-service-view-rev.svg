<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서비스는 내가 어디 있다고 볼까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서비스는 내가 어디 있다고 볼까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버가 기본으로 보는 것은 출발지 IP예요</text>
<rect x="40" y="130" width="200" height="270" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="140.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">출장지</text><line x1="200" y1="300" x2="380" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="520" y1="300" x2="796" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,300;200,300;780,300;780,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="106" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="114" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="96,312 184,312 192,324 88,324" fill="#6ea8fe"/><text x="140" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><ellipse cx="450" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="450" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="796" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 클라우드 저장소</text><rect x="80" y="199" width="119" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="140" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">192.0.2.150</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="76.4" y="195.0" width="127.2" height="40" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="746" y="189" width="167" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">203.0.113.80:443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="640" cy="400" r="16" fill="#7ee7c7"/><path d="M632 400 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="666" y="384" width="171" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="751.52" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">출발지 192.0.2.150</text><circle cx="640" cy="442" r="16" fill="#ff7b72"/><path d="M633 435 l14 14 M647 435 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="666" y="426" width="163" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="747.52" y="447.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">실제 위치는 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="614" y="378" width="231.03999999999996" height="86" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="690" y="128" width="250" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="815.0" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">위치 데이터베이스와 대조</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="731" y="199" width="198" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="830" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">'현지 접속'이라고 짐작</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="727.04" y="195.0" width="205.92" height="40" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="318" y="432" width="324" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">IP는 출구일 뿐 위치의 사실은 아니에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="314.1" y="427.5" width="331.79999999999995" height="41" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 출장지에서 외부 클라우드 저장소에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버에는 출발지 IP만 확실히 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 위치 데이터베이스와 맞춰 짐작해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서비스가 말하는 위치는 추정치예요</text></g>

