<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내 공유기가 남의 중계소라면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내 공유기가 남의 중계소라면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이 IP에서 왔다는 말은 누가 했다는 말이 아니에요</text>
