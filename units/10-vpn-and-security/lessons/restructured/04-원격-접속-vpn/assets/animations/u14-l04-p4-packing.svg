<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>집에서 나간 패킷의 포장</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">집에서 나간 패킷의 포장</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">안쪽과 바깥 헤더를 따로 읽어요</text>
<rect x="76" y="296" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="303" width="52" height="30" fill="#3d4b60"/><polygon points="66,342 154,342 162,354 58,354" fill="#6ea8fe"/><text x="110" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><circle cx="470" cy="330" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M455 324 h28 l-7 -7 M485 336 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="470" y="380" text-anchor="middle" font-size="17" fill="#9aa3b2">집 공유기</text><rect x="796" y="308" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="790" y="300" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="808" y="318" width="44" height="18" fill="#3d4b60"/><text x="830" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">SG</text><line x1="165" y1="330" x2="415" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="525" y1="330" x2="770" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="230" y="166" width="500" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="200.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">안쪽  10.10.99.23 → 192.168.10.50</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="226" y="162" width="508" height="64" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="128" width="560" height="112" rx="10" fill="none" stroke="#9aa3b2" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="124" width="568" height="120" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">바깥  192.168.0.20 → 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="480" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">바깥  192.0.2.123 → 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="206" y="130" width="548" height="36" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="389" y="394" width="162" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="470" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">NAT-T: UDP 4500</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="318" y="428" width="324" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="451.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">집이든 호텔이든 터널 출구는 같은 SG</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="314.22" y="424.0" width="331.55999999999995" height="42" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본 패킷은 안쪽 주소만 가지고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북의 VPN 클라이언트가 한 겹 포장해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기가 바깥 출발지를 공인 주소로 바꿔요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 출발지가 바뀌어도 목적지는 SG예요</text></g>

