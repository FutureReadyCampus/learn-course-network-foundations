ight="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="820" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="385.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><circle cx="480" cy="267" r="16" fill="#7ee7c7"/><path d="M472 267 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="480" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">VPN을 켠 노트북</text><rect x="472" y="341" width="16" height="14" fill="#3d4b60"/><rect x="444" y="355" width="72" height="7" rx="3" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="232" width="200" height="112" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><rect x="398" y="245" width="164" height="34" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="480" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">192.168.0.20</text><rect x="398" y="291" width="164" height="34" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><text x="480" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">10.10.99.23</text><text x="480" y="224" text-anchor="middle" font-size="16" fill="#9aa3b2">네트워크 화면</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="394" y="287" width="172" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0