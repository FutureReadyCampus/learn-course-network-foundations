<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>요구를 세 가지로 쪼개기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">요구를 세 가지로 쪼개기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 덩어리 요청을 따로 따져 봐요</text>
<rect x="304" y="158" width="352" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">쇼룸도 박 팀장도 사내 AI 쓰게 해 주세요</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="146" width="468" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="480" y1="200" x2="190" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="480" y1="200" x2="480" y2="250" stroke="#3d4b60" stroke-width="3"/><line x1="480" y1="200" x2="770" y2="250" stroke="#3d4b60" stroke-width="3"/><rect x="60" y="250" width="260" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190.0" y="285.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">닿을 것</text><rect x="350" y="250" width="260" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480.0" y="285.2" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">노출 금지</text><rect x="640" y="250" width="260" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="770.0" y="285.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">내용 보호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="236" width="878" height="84" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="340" width="260" height="56" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="190.0" y="374.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지사 업무가 멈춰요</text><rect x="350" y="340" width="260" height="56" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="374.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">누구나 두드릴 수 있어요</text><rect x="640" y="340" width="260" height="56" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="770.0" y="374.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">도면·개인정보가 새요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="326" width="878" height="84" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="430" width="379" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="453.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">이 셋을 모두 채울 방법: 전용 회선 또는 VPN</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">월요일에 한 덩어리 요청이 들어왔어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청을 세 가지 요구로 쪼개요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하나라도 못 지키면 이런 문제가 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 요구를 모두 채우는 방법을 찾아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>