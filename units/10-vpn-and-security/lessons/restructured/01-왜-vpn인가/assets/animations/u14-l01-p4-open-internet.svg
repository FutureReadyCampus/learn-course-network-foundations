<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>인터넷을 그냥 쓰면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">인터넷을 그냥 쓰면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공용망에서 걱정할 세 가지예요</text>
<rect x="76" y="164" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="171" width="52" height="32" fill="#3d4b60"/><rect x="105" y="210" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="220" width="44" height="5" fill="#6ea8fe"/><text x="110" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서울 본사</text><ellipse cx="480" cy="200" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="816" y="164" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="171" width="52" height="32" fill="#3d4b60"/><rect x="845" y="210" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="220" width="44" height="5" fill="#6ea8fe"/><text x="850" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도쿄 쇼룸</text><line x1="160" y1="200" x2="410" y2="200" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="550" y1="200" x2="800" y2="200" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,200;190,200;780,200;780,200" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="383" y="124" width="194" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="145.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">견적서가 그대로 흘러요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="300" width="260" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="190.0" y="332.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7b72">엿보기</text><rect x="350" y="300" width="260" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="480.0" y="332.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7b72">바꿔치기</text><rect x="640" y="300" width="260" height="52" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="770.0" y="332.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7b72">남인 척하기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="286" width="878" height="80" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="372" width="260" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="190.0" y="404.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">기밀성 · 암호화</text><rect x="350" y="372" width="260" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="404.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">무결성</text><rect x="640" y="372" width="260" height="52" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="770.0" y="404.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">인증</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="358" width="878" height="80" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="440" width="320" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">세 걱정은 서로 달라서 따로 점검해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">견적서가 공용 인터넷 길을 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간에서 걱정할 일이 세 가지 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">걱정마다 지키는 성질이 따로 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하나가 해결돼도 나머지는 남아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>