<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>전용 회선</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전용 회선</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">우리 몫의 길을 빌리는 방법이에요</text>
<polygon points="70,250 110,226 150,250" fill="#6ea8fe"/><rect x="74" y="250" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="90" y="266" width="40" height="22" fill="#3d4b60"/><text x="110" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 본사</text><polygon points="810,250 850,226 890,250" fill="#6ea8fe"/><rect x="814" y="250" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="830" y="266" width="40" height="22" fill="#3d4b60"/><text x="850" y="310" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 쇼룸</text><line x1="150" y1="260" x2="810" y2="260" stroke="#7ee7c7" stroke-width="10"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="158" width="279" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">통신 사업자에게 빌린 전용 회선</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="146" width="468" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="322" cy="315" r="16" fill="#7ee7c7"/><path d="M314 315 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="350" y="298" width="260" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="321.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">남과 섞이지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="291" width="278" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="150" y1="285" x2="445" y2="385" stroke="#ffb454" stroke-width="6"/><polygon points="440,390 480,366 520,390" fill="#6ea8fe"/><rect x="444" y="390" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="460" y="406" width="40" height="22" fill="#3d4b60"/><text x="480" y="450" text-anchor="middle" font-size="17" fill="#9aa3b2">현장 사무소</text><rect x="610" y="384" width="300" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="760" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">지점마다 회선·요금 추가</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="421" y="358" width="118" height="108" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="158" width="309" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">안전하지만 비싸고 늘리기 어려워요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서울과 도쿄를 전용 회선으로 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길이 우리 몫이라 남과 섞이지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">현장 사무소가 늘면 회선도 하나 더 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안전한 대신 비용과 확장이 부담이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>