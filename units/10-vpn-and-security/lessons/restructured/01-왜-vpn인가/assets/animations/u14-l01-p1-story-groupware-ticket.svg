-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="700" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(700,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="700" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="422" y="134" width="116" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">월요일 아침</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="452" y="264" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="492,264 508,280 492,280" fill="#6ea8fe"/><rect x="462" y="294" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="307" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="320" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="480" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">도쿄 지사 6명 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="398" y="254" width="164" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="690,187.0 710,187.0 700,195" fill="#171a21" stroke="#e07b54" stroke-width="3" stroke-linejoin="round"/><rect x="560.96" y="113.0" width="278.08000000000004" height="74" rx="16" fill="#171a21" stroke="#e07b54" stroke-width="3"/><line x1="692" y1="187" x2="708" y2="187" stroke="#171a21" stroke-width="5"/><text x="700" y="143.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지사도, 저도 사내 그룹웨어에서</text><text x="700" y="169.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">전자결재 올릴 수 있죠?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="555.96" y="108.0" width="288.08000000000004" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="295" y="419" width="369" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">집에서는 왜 그룹웨어가 안 보일까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">월요일 아침, 지우의 티켓함이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 지사 직원 여섯 명의 새 요청이 올라왔어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장도 주 2일 재택을 시작하며 거들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 그룹웨어가 안 열리는 이유를 알아봐요</text></g>

