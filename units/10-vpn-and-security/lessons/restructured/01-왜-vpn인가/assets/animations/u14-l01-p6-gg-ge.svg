<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>지사용과 재택용 VPN</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">지사용과 재택용 VPN</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">게이트웨이(G)와 단말(E)의 조합이에요</text>
<rect x="40" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">G-to-G · 사이트 간</text><text x="250" y="188" text-anchor="middle" font-size="15" fill="#9aa3b2">쇼룸의 PC 여러 대</text><rect x="500" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">G-to-E · 원격 접속</text><text x="710" y="188" text-anchor="middle" font-size="15" fill="#9aa3b2">노트북 한 대</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="61" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="69" y="261" width="52" height="32" fill="#3d4b60"/><rect x="90" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="73" y="310" width="44" height="5" fill="#6ea8fe"/><text x="95" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">쇼룸 PC</text><rect x="161" y="268" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="155" y="260" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="173" y="278" width="44" height="18" fill="#3d4b60"/><text x="195" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="240" y="264" width="110" height="52" rx="26" fill="none" stroke="#c792ea" stroke-width="4"/><rect x="356" y="268" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="350" y="260" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="368" y="278" width="44" height="18" fill="#3d4b60"/><text x="390" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 SG</text><rect x="185" y="368" width="130" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="391.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">망 ↔ 망</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="42" y="232" width="413" height="168" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="566" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="574" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="556,302 644,302 652,314 548,314" fill="#6ea8fe"/><text x="600" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 노트북</text><rect x="515" y="210" width="170" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="600" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">VPN 클라이언트</text><rect x="680" y="264" width="155" height="52" rx="26" fill="none" stroke="#6ea8fe" stroke-width="4"/><rect x="841" y="268" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="835" y="260" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="853" y="278" width="44" height="18" fill="#3d4b60"/><text x="875" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 SG</text><rect x="675" y="368" width="130" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="740" y="391.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">기기 ↔ 망</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="508" y="202" width="404" height="198" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="317" y="440" width="326" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">지사는 G-to-G, 재택은 G-to-E예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결할 대상의 규모가 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지사는 두 SG가 망과 망을 한 번에 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재택은 노트북 하나를 본사 SG에 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 VPN이지만 잇는 방식이 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>