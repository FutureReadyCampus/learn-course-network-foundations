<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>사설망의 경계</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">사설망의 경계</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">집 노트북이 사내 AI에 닿지 못해요</text>
<rect x="30" y="150" width="270" height="260" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="165.0" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">박 팀장 집</text><rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><text x="110" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.0.20</text><ellipse cx="450" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="450" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="600" y="150" width="330" height="260" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="765.0" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 본사</text><text x="765.0" y="200" text-anchor="middle" font-size="15" fill="#9aa3b2">사설망 192.168.10.0/24</text><rect x="616" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="610" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="628" y="288" width="44" height="18" fill="#3d4b60"/><text x="650" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 경계</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><text x="850" y="384" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><line x1="150" y1="300" x2="380" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="520" y1="300" x2="610" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="690" y1="300" x2="816" y2="300" stroke="#3d4b60" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="214" width="150" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="160" y="235.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">AI 주소 열기</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="76" y="208" width="168" height="44" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;600,300;600,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="650" cy="232" r="16" fill="#ff7b72"/><path d="M643 225 l14 14 M657 225 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="621" y="203" width="58" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="305" y="430" width="349" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="453.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">문제는 서버가 아니라 사설망의 경계예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집 노트북으로 사내 AI 주소를 열어 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 인터넷을 지나 본사 경계에 닿아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사설 주소라서 경계에서 막혀 응답이 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">문제는 서버가 아니라 사설망의 경계예요</text></g>

