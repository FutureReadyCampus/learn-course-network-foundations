<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>VPN은 전용 회선만큼 안전할까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">VPN은 전용 회선만큼 안전할까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">금고를 방에 둘까, 로비에서 잠글까</text>
<rect x="40" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">전용 회선 · 물리적 보호</text><rect x="500" y="130" width="420" height="290" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">VPN · 논리적 보호</text><rect x="90" y="205" width="320" height="125" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="8 6"/><text x="250" y="228" text-anchor="middle" font-size="16" fill="#9aa3b2">독립된 방</text><rect x="230" y="268" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M239 268 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="550" y="205" width="320" height="125" rx="10" fill="#0f1115" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="710" y="228" text-anchor="middle" font-size="16" fill="#9aa3b2">사람 많은 로비</text><rect x="690" y="268" width="40" height="32" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M699 268 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#6ea8fe" stroke-width="3"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="100" cy="375" r="16" fill="#7ee7c7"/><path d="M92 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="145" y="358" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="260" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">남과 섞이지 않는 길</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="121" y="351" width="278" height="48" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="755" cy="282" r="16" fill="#ff7b72"/><path d="M748 275 l14 14 M762 275 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="560" y="350" width="300" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="710" y="370.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">암호 키·계정·장비 설정이 지탱</text><rect x="580" y="390" width="260" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="710" y="410.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">키가 새면 한 번에 무너져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="556" y="341" width="308" height="88" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="311" y="440" width="337" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="463.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">같다가 아니라 비용 대비 위험을 따져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전용 회선과 VPN은 보호 방식이 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전용 회선은 길 자체가 남과 분리돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">VPN은 키와 계정 관리에 보호가 달려 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같다고 답하지 말고 위험을 따져 답해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>