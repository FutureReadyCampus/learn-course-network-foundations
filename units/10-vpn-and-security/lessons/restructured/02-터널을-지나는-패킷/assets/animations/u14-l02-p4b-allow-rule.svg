values="572,190;572,190;790,190;790,190" keyTimes="0.000;0.775;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="66" y="168" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="60" y="160" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="78" y="178" width="44" height="18" fill="#3d4b60"/><text x="100" y="230" text-anchor="middle" font-size="17" fill="#9aa3b2"></text><rect x="406" y="168" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="400" y="160" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="418" y="178" width="44" height="18" fill="#3d4b60"/><text x="440" y="230" text-anchor="middle" font-size="17" fill="#9aa3b2"></text><rect x="604" y="150" width="32" height="80" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><line x1="604" y1="176" x2="636" y2="176" stroke="#9aa3b2" stroke-width="2"/><line x1="604" y1="204" x2="636" y2="204" stroke="#9aa3b2" stroke-width="2"/><rect x="816" y="150" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="160" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="184" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="208" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="100" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">도쿄 SG</text><text x="440" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서울 SG</text><text x="620" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">방화벽</text><text x="850" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버</text><text x="850" y="270" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.50</text><rect x="120" y="296" width="720" height="148" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">본사 방화벽 규칙</text><rect x="140" y="332" width="680" height="46" rx="8" fill="#0f1115" stroke="#ff7b72" stroke-width="3"/><text x="480" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">인터넷에서 직접 오는 접속 → 차단</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="132" y="324" width="696" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="665" cy="190" r="16" fill="#ff7b72"/><path d="M658 183 l14 14 M672 183 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="800" y="112" width="100" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="850" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">응답 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="596" y="146" width="48" height="88" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="140" y="388" width="680" height="46" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="418" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">터널에서 나온 10.20.0.0/24 → 허용</text><rect x="803" y="112" width="95" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">응답해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="604" y="150" width="32" height="80" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><line x1="604" y1="176" x2="636" y2="176" stroke="#7ee7c7" stroke-width="2"/><line x1="604" y1="204" x2="636" y2="204" stroke="#7ee7c7" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="132" y="380" width="696" height="62" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널은 연결됨, 풀린 패킷이 본사에 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">본사 규칙은 직접 오는 접속을 막아 둬요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허용 규칙이 없으면 서버는 응답하지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널에서 나온 주소를 허용하면 응답해요</text></g>

