<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>지사 PC의 질문은 어디로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">지사 PC의 질문은 어디로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">PC는 평소처럼 출구에 맡기기만 해요</text>
<rect x="30" y="140" width="300" height="280" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="180.0" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">도쿄 쇼룸</text><text x="180.0" y="190" text-anchor="middle" font-size="15" fill="#9aa3b2">10.20.0.0/24</text><rect x="630" y="140" width="300" height="280" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="780.0" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서울 본사</text><text x="780.0" y="190" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.0/24</text><ellipse cx="480" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="66" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="271" width="52" height="32" fill="#3d4b60"/><rect x="95" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="78" y="320" width="44" height="5" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">쇼룸 PC</text><text x="100" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">10.20.0.15</text><rect x="246" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="240" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="258" y="288" width="44" height="18" fill="#3d4b60"/><text x="280" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="646" y="278" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="640" y="270" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="658" y="288" width="44" height="18" fill="#3d4b60"/><text x="680" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><text x="850" y="384" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><line x1="140" y1="300" x2="240" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="320" y1="300" x2="410" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="550" y1="300" x2="640" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><line x1="720" y1="300" x2="816" y2="300" stroke="#3d4b60" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="160,300;160,300;230,300;230,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="100" y="220" width="180" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="190" y="240.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">목적지 192.168.10.50</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="150" width="270" height="92" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">도쿄 SG 규칙</text><text x="480" y="197" text-anchor="middle" font-size="15" fill="#e6e8ec">192.168.10.0/24 → 터널</text><text x="480" y="220" text-anchor="middle" font-size="15" fill="#9aa3b2">나머지 → 일반 경로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="336" y="141" width="288" height="110" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="274" width="320" height="52" rx="26" fill="none" stroke="#c792ea" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="330,300;330,300;630,300;630,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="680" cy="232" r="16" fill="#7ee7c7"/><path d="M672 232 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="651" y="203" width="58" height="58" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="254" y="430" width="453" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="453.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">다른 목적지(203.0.113.80)는 터널 밖 일반 경로로 가요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쇼룸 PC가 패킷을 기본 게이트웨이로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 SG가 목적지를 규칙에 대 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">본사 목적지는 터널로 포장해 서울 SG로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널 규칙에 없는 목적지는 일반 경로예요</text></g>

