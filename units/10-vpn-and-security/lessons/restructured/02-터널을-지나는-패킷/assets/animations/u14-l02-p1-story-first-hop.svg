late(800,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="800" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="174.0,197.0 194.0,197.0 168,203" fill="#171a21" stroke="#e07b54" stroke-width="3" stroke-linejoin="round"/><rect x="160.0" y="123.0" width="300" height="74" rx="16" fill="#171a21" stroke="#e07b54" stroke-width="3"/><line x1="176" y1="197" x2="192" y2="197" stroke="#171a21" stroke-width="5"/><text x="310" y="153.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지사 PC에서 본사 그룹웨어가</text><text x="310" y="179.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">열리는지 봐 주실 수 있어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="171.08" y="118.0" width="277.84" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="385.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><circle cx="480" cy="267" r="16" fill="#7ee7c7"/><path d="M472 267 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="480" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">그룹웨어</text><rect x="472" y="341" width="16" height="14" fill="#3d4b60"/><rect x="444" y="355" width="72" height="7" rx="3" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="225" width="208" height="120" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="480" y="111" width="320" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="774" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="780" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="786" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="640" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버 주소는 사설 주소인데</text><text x="640" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">요청은 어떻게 서울까지?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="317" y="419" width="326" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">요청은 가장 먼저 어디로 갈까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 지사에 SG를 설치한 첫날이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 그룹웨어가 열리는지 봐 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">화면은 뜨는데 지우는 신기해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 요청의 첫 걸음을 따라가 봐요</text></g>

