ct x="60" y="384" width="380" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="250.0" y="411.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">패킷 크기 · 시간</text><circle cx="445" cy="300" r="16" fill="#7ee7c7"/><path d="M437 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="32" y="282" width="436" height="166" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="500" y="290" width="420" height="150" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="2"/><text x="710" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">가려진 것</text><rect x="520" y="330" width="380" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="710.0" y="356.68" text-anchor="middle" font-size="13" font-weight="700" fill="#ff7b72">안쪽 주소 10.20.0.15 · 192.168.10.50</text><rect x="520" y="384" width="380" height="44" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="710.0" y="411.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">AI 질문 내용</text><circle cx="905" cy="300" r="16" fill="#ff7b72"/><path d="M898 293 l14 14 M912 293 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="492" y="282" width="436" height="166" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="246" width="298" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="268.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">내용은 가려져도 통신 사실은 보여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신사는 터널 구간의 패킷을 볼 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 헤더가 적힌 정보는 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">암호화된 안쪽은 보이지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신이 있다는 사실까지 숨겨지진 않아요</text></g>

