<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>터널 밖에서는 무엇이 보일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">터널 밖에서는 무엇이 보일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">L3 터널링은 바깥 헤더만 읽혀요</text>
<rect x="140" y="156" width="680" height="68" rx="34" fill="none" stroke="#c792ea" stroke-width="4"/><line x1="130" y1="190" x2="140" y2="190" stroke="#3d4b60" stroke-width="4"/><ellipse cx="440" cy="133" rx="26" ry="15" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/><circle cx="440" cy="133" r="7" fill="#e6e8ec"/><text x="480" y="140" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">통신사(ISP)</text><g><g><animateTransform attributeName="transform" type="translate" values="190,190;190,190;770,190;770,190" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-28" y="-18" width="56" height="36" rx="6" fill="#c792ea"/><rect x="-17" y="-9" width="34" height="18" rx="3" fill="#6ea8fe"/><path d="M-17 -8 l17 9 l17 -9" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="56" y="168" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="50" y="160" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="68" y="178" width="44" height="18" fill="#3d4b60"/><text x="90" y="230" text-anchor="middle" font-size="17" fill="#9aa3b2">도쿄 SG</text><rect x="836" y="168" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="830" y="160" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="848" y="178" width="44" height="18" fill="#3d4b60"/><text x="870" y="230" text-anchor="middle" font-size="17" fill="#9aa3b2">서울 SG</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="258" width="430" height="160" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">통신사에게 보이는 것</text><rect x="60" y="300" width="390" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="328.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">두 SG 주소 198.51.100.20 → 198.51.100.25</text><rect x="60" y="356" width="390" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="255.0" y="384.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">패킷 크기 · 오간 시간</text><circle cx="448" cy="262" r="16" fill="#7ee7c7"/><path d="M440 262 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="32" y="250" width="446" height="176" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="490" y="258" width="430" height="160" rx="14" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="705" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">통신사에게 가려진 것</text><rect x="510" y="300" width="390" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="705.0" y="328.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">안쪽 주소 10.20.0.15 · 192.168.10.50</text><rect x="510" y="356" width="390" height="46" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="705.0" y="384.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">AI에 묻는 질문 내용</text><circle cx="898" cy="262" r="16" fill="#ff7b72"/><path d="M891 255 l14 14 M905 255 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="482" y="250" width="446" height="176" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="434" width="298" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">내용은 가려져도 통신 사실은 보여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신사는 터널 구간의 패킷을 볼 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 헤더에 적힌 정보는 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">암호화된 안쪽은 보이지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통신이 있다는 사실까지 숨겨지진 않아요</text></g>

