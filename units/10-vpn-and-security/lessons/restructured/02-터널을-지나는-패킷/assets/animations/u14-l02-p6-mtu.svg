<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포장 한 겹의 대가</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포장 한 겹의 대가</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">짧은 질문은 되는데 큰 파일만 멈춰요</text>
<line x1="700" y1="190" x2="700" y2="440" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6"/><text x="700" y="180" text-anchor="middle" font-size="16" fill="#9aa3b2">회선 한계 MTU 1,500바이트</text><rect x="100" y="220" width="600" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400.0" y="256.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">큰 도면 파일 조각 (한계까지 꽉 참)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="760" cy="250" r="16" fill="#7ee7c7"/><path d="M752 250 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="92" y="212" width="616" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="220" width="100" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="750.0" y="255.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">+ 헤더</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="692" y="212" width="116" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="250" r="16" fill="#ff7b72"/><path d="M843 243 l14 14 M857 243 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="345" y="308" width="270" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="331.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">한계 초과: 쪼개지거나 버려져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="100" y="380" width="500" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="350.0" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">SG가 미리 줄인 원본</text><rect x="600" y="380" width="100" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="650.0" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">헤더</text><circle cx="760" cy="410" r="16" fill="#7ee7c7"/><path d="M752 410 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="358" y="328" width="243" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="351.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">크기 기준을 헤더만큼 줄여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="92" y="372" width="616" height="76" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">큰 파일 조각은 한계까지 꽉 차 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">터널이 바깥 IP·IPsec 헤더를 더 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한계를 넘으면 쪼개지거나 버려져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SG에서 미리 작게 만들면 한계 안에 들어가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>