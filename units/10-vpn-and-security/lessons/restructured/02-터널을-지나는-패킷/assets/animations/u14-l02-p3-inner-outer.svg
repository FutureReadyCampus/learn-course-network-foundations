<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안쪽 IP와 바깥 IP</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안쪽 IP와 바깥 IP</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소 네 개를 두 쌍으로 나눠 봐요</text>
<rect x="60" y="140" width="740" height="232" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><rect x="80" y="256" width="700" height="100" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="96" y="274" width="480" height="64" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="336.0" y="312.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">안쪽 IP 헤더 · 10.20.0.15 → 192.168.10.50</text><rect x="590" y="274" width="176" height="64" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="678.0" y="312.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">데이터</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="160" width="700" height="44" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="430.0" y="188.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">바깥 IP 헤더 · 198.51.100.20 → 198.51.100.25</text><rect x="80" y="212" width="700" height="36" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="430.0" y="235.4" text-anchor="middle" font-size="15" font-weight="700" fill="#9aa3b2">IPsec 헤더</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="72" y="152" width="716" height="104" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><ellipse cx="870" cy="182" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="870" cy="182" r="7" fill="#ffb454"/><text x="870" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e6e8ec">라우터가 읽어요</text><circle cx="870" cy="250" r="16" fill="#7ee7c7"/><path d="M862 250 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="811" y="146" width="118" height="126" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="850" y="296" width="40" height="32" rx="5" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><path d="M859 296 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ff7b72" stroke-width="3"/><text x="870" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#e6e8ec">라우터엔 안 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="403" width="368" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="430" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">누가 누구에게 = 안쪽 · 어느 터널로 = 바깥</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본 패킷에는 안쪽 IP가 들어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 SG가 바깥 IP 헤더를 씌워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷 라우터는 바깥 IP만 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안쪽은 실제 통신, 바깥은 터널 양 끝이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>