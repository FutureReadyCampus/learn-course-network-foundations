<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>안쪽 IP와 바깥 IP</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">안쪽 IP와 바깥 IP</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주소 네 개를 두 쌍으로 나눠 봐요</text>
<rect x="40" y="266" width="600" height="150" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="56" y="282" width="390" height="118" rx="6" fill="#0f1115" stroke="#6ea8fe" stroke-width="3"/><text x="76" y="323" text-anchor="start" font-size="17" font-weight="700" fill="#6ea8fe">안쪽 IP 헤더</text><text x="76" y="354" text-anchor="start" font-size="16" fill="#e6e8ec">10.20.0.15 → 192.168.10.50</text><rect x="458" y="282" width="166" height="118" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="541" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">데이터</text><circle cx="805" cy="262" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M790 256 h28 l-7 -7 M820 268 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="805" y="312" text-anchor="middle" font-size="17" fill="#9aa3b2">인터넷 라우터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="340" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">쇼룸 PC가 만든 원본 패킷</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="48" y="274" width="588" height="138" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="150" width="600" height="64" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="60" y="177" text-anchor="start" font-size="17" font-weight="700" fill="#c792ea">바깥 IP 헤더</text><text x="60" y="202" text-anchor="start" font-size="16" fill="#e6e8ec">198.51.100.20 → 198.51.100.25</text><rect x="40" y="220" width="600" height="38" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">암호화 헤더</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="32" y="142" width="616" height="124" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="776" y1="248" x2="662" y2="196" stroke="#7ee7c7" stroke-width="4"/><circle cx="650" cy="190" r="16" fill="#7ee7c7"/><path d="M642 190 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="734" y="166" width="143" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="805" y="187.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">라우터가 읽어요</text><line x1="776" y1="280" x2="662" y2="334" stroke="#ff7b72" stroke-width="4" stroke-dasharray="8 6"/><circle cx="650" cy="340" r="16" fill="#ff7b72"/><path d="M643 333 l14 14 M657 333 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="723" y="356" width="163" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="805" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">라우터는 못 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="156" width="298" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="346" width="298" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="749" y="166" width="111" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="805" y="187.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">어느 터널로</text><rect x="742" y="356" width="127" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="805" y="377.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">누가 누구에게</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="156" width="238" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="346" width="238" height="52" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본 패킷에는 안쪽 IP 한 쌍이 들어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도쿄 SG가 바깥 IP 헤더를 한 겹 씌워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷 라우터는 바깥 IP 헤더만 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥은 터널 양 끝, 안쪽은 실제 통신이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>