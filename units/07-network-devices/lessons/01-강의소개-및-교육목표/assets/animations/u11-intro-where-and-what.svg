<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이제 장비의 이름보다 위치와 역할이 보여요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이제 장비의 이름보다 위치와 역할이 보여요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">심화편은 이 질문들을 하나씩 풀어 가요</text>
<rect x="58" y="260" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="65" y="270" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="80" cy="328" r="3" fill="#6ea8fe"/><text x="80" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><rect x="846" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="856" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="856" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="856" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="880" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 서비스</text><line x1="130" y1="300" x2="835" y2="300" stroke="#3d4b60" stroke-width="5"/><circle cx="290" cy="300" r="16" fill="#171a21" stroke="#9aa3b2" stroke-width="4"/><g><rect x="216" y="190" width="148" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="290" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Unit 11</text><text x="290" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">중간 장치의 위치</text><line x1="290" y1="280" x2="290" y2="284" stroke="#6ea8fe" stroke-width="3"/><circle cx="290" cy="300" r="16" fill="#6ea8fe"/></g><circle cx="450" cy="300" r="16" fill="#171a21" stroke="#9aa3b2" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="190" width="148" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="450" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">Unit 12</text><text x="450" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">공유기 안팎의 접속</text><line x1="450" y1="280" x2="450" y2="284" stroke="#7ee7c7" stroke-width="3"/><circle cx="450" cy="300" r="16" fill="#7ee7c7"/></g><circle cx="610" cy="300" r="16" fill="#171a21" stroke="#9aa3b2" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="536" y="190" width="148" height="90" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="610" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">Unit 13</text><text x="610" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">요청 나누기</text><line x1="610" y1="280" x2="610" y2="284" stroke="#ffb454" stroke-width="3"/><circle cx="610" cy="300" r="16" fill="#ffb454"/></g><circle cx="770" cy="300" r="16" fill="#171a21" stroke="#9aa3b2" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="190" width="148" height="90" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="770" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">Unit 14</text><text x="770" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6e8ec">원격 접속·보안</text><line x1="770" y1="280" x2="770" y2="284" stroke="#c792ea" stroke-width="3"/><circle cx="770" cy="300" r="16" fill="#c792ea"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="383" width="420" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">이름보다 위치와 역할이 보여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 장치는 길 위 어디에 있을까?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기 안팎의 접속은 어떻게 이어질까?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">여러 서버에 요청을 어떻게 나눌까?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원격 접속은 어떻게 허용하고 막을까?</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>