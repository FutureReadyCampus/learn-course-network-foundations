<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>“안 열려”만으로는 알 수 없어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">“안 열려”만으로는 알 수 없어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">기본편의 지식이 다시 쓰이는 순간이에요</text>
<rect x="78" y="210" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="85" y="220" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="100" cy="278" r="3" fill="#6ea8fe"/><text x="100" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><line x1="170" y1="250" x2="560" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="586" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="594" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="576,262 664,262 672,274 568,274" fill="#6ea8fe"/><text x="620" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="750" y="205" width="170" height="90" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="835.0" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서버 프로그램</text><g><rect x="85" y="133" width="130" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="150" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">안 열려!</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="188" width="220" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="390" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">길 위에서 막혔나?</text><rect x="710" y="150" width="210" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="815" y="170.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">도착했는데 못 받았나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="340" width="170" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="195.0" y="369.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">IP 주소</text><rect x="300" y="340" width="170" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="385.0" y="369.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">포트</text><rect x="490" y="340" width="170" height="46" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="575.0" y="369.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">패킷</text><rect x="680" y="340" width="170" height="46" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="765.0" y="369.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">소켓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="130" y="423" width="700" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">중간 장치를 만나면: 무엇을 보고 어디로 넘길까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">친구가 “안 열려”라고 했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 말만으로는 어디가 문제인지 알 수 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기본편에서 배운 IP·포트·패킷·소켓이 단서가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중간 장치를 만나면 이 질문을 떠올려요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>