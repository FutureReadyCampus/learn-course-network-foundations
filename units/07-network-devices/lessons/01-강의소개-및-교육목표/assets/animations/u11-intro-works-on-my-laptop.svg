<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내 컴퓨터에서는 잘 되는데</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내 컴퓨터에서는 잘 되는데</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">동아리 신청 사이트 이야기가 시작돼요</text>
<rect x="86" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="94" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="76,312 164,312 172,324 68,324" fill="#6ea8fe"/><text x="120" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="338" y="260" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="345" y="270" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="360" cy="328" r="3" fill="#6ea8fe"/><text x="360" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">같은 와이파이 친구</text><polygon points="800,274 840,240 880,274" fill="#9aa3b2"/><rect x="808" y="274" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="831" y="294" width="18" height="28" fill="#3d4b60"/><text x="840" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구 집</text><path d="M226 245 A14 14 0 0 1 254 245" fill="none" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round"/><path d="M214 245 A26 26 0 0 1 266 245" fill="none" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round"/><path d="M202 245 A38 38 0 0 1 278 245" fill="none" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="158" width="330" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">신청도 되고 목록도 잘 나와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="265" y="158" width="190" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="360" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">친구도 열려요</text><circle cx="425" cy="285" r="16" fill="#7ee7c7"/><path d="M417 285 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="360,300;360,300;720,300;720,300" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-40" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="-15" y="-30" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="0" cy="28" r="3" fill="#6ea8fe"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="645" y="158" width="230" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="760" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">나는 안 열리는데?</text><circle cx="780" cy="345" r="16" fill="#ff7b72"/><path d="M773 338 l14 14 M787 338 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="50" y="423" width="220" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="160" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">사람이 몰리면?</text><rect x="370" y="423" width="220" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서버를 늘리면?</text><rect x="690" y="423" width="220" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="800" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">관리 화면은?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">동아리 행사 신청 사이트를 내 컴퓨터에서 만들었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 와이파이의 친구에게도 잘 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그런데 친구가 집에 돌아가자…</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">“나는 안 열리는데?” 다음 질문들이 기다려요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>