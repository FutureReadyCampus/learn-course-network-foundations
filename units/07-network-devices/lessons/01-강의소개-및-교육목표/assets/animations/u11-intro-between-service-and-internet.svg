<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서비스와 인터넷 사이에는 무엇이 있을까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서비스와 인터넷 사이에는 무엇이 있을까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">집 안과 집 밖은 길이 달라요</text>
<rect x="40" y="135" width="330" height="250" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="205" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">집 안(내부 네트워크)</text><rect x="590" y="135" width="330" height="250" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="755" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="76" y="246" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="253" width="52" height="30" fill="#3d4b60"/><polygon points="66,292 154,292 162,304 58,304" fill="#6ea8fe"/><text x="110" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 서버</text><rect x="278" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="285" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="300" cy="308" r="3" fill="#6ea8fe"/><text x="300" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">안쪽 친구</text><circle cx="480" cy="280" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 274 h28 l-7 -7 M495 286 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기</text><rect x="778" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="785" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="800" cy="308" r="3" fill="#6ea8fe"/><text x="800" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바깥 친구</text><g><line x1="180" y1="280" x2="255" y2="280" stroke="#7ee7c7" stroke-width="5"/><rect x="95" y="208" width="220" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="205" y="231.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">같은 와이파이는 OK</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="760" y1="280" x2="540" y2="280" stroke="#ffb454" stroke-width="5" stroke-dasharray="8 6"/><circle cx="520" cy="280" r="16" fill="#ff7b72"/><path d="M513 273 l14 14 M527 273 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="605" y="208" width="290" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="750" y="231.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">사설 IP만으로는 못 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="226" width="108" height="108" rx="14" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="350" y="405" width="260" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="428.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">경계에서 만나는 장치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">공유기가 있다는 사실만으로 원인을 정하지는 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 와이파이 안에서는 잘 연결돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집 밖에서는 내 컴퓨터의 사설 주소를 찾을 수 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안과 밖의 경계에는 공유기가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접속 실패에는 다른 원인도 있을 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>