<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>어디서든 관리하되, 아무에게나 열지는 않기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">어디서든 관리하되, 아무에게나 열지는 않기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Unit 14에서 만나요</text>
<rect x="700" y="190" width="210" height="190" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="805" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">관리 화면</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="785" y="276" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M794 276 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="785" y="276" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M794 276 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="80" cy="260" r="16" fill="#6ea8fe"/><rect x="62" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><circle cx="170" cy="260" r="16" fill="#6ea8fe"/><rect x="152" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><line x1="220" y1="300" x2="674" y2="300" stroke="#ff7b72" stroke-width="4"/><polygon points="690,300 666,290 666,310" fill="#ff7b72"/><text x="450" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">아무나 열 수 있다면?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="110" cy="260" r="16" fill="#6ea8fe"/><rect x="92" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">운영자</text><line x1="180" y1="300" x2="690" y2="300" stroke="#7ee7c7" stroke-width="8" stroke-dasharray="14 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="430" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">운영자만 암호화 터널로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="225" width="70" height="150" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="415" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">방화벽</text><circle cx="260" cy="260" r="16" fill="#6ea8fe"/><rect x="242" y="280" width="36" height="46" rx="12" fill="#6ea8fe"/><line x1="300" y1="395" x2="370" y2="395" stroke="#ff7b72" stroke-width="4"/><circle cx="375" cy="395" r="16" fill="#ff7b72"/><path d="M368 388 l14 14 M382 388 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="423" width="560" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">VPN으로 연결돼도 모든 권한이 생기는 건 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">관리 화면을 아무에게나 열어 두면 위험해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허용된 운영자만 터널(VPN)로 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽·IPS가 통신을 허용할지 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결됐다고 모든 자원에 접근할 권한이 생기지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>