<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>밖으로 나가는 길, 밖에서 들어오는 길</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">밖으로 나가는 길, 밖에서 들어오는 길</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Unit 12에서 더 자세히 만나요</text>
<line x1="190" y1="300" x2="420" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="540" y1="300" x2="800" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">공유기 (NAT)</text><rect x="816" y="240" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="250" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="274" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="298" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 사이트</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="285" x2="384" y2="285" stroke="#7ee7c7" stroke-width="5"/><polygon points="400,285 376,274 376,296" fill="#7ee7c7"/><line x1="420" y1="330" x2="196" y2="330" stroke="#ffb454" stroke-width="5"/><polygon points="180,330 204,319 204,341" fill="#ffb454"/><text x="300" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">안에서 먼저 → 응답이 돌아와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="204" width="330" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="226.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">주소와 포트를 바꿔 이어 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="780" y1="285" x2="556" y2="285" stroke="#ff7b72" stroke-width="5"/><polygon points="540,285 564,274 564,296" fill="#ff7b72"/><circle cx="480" cy="230" r="16" fill="#ffb454"/><text x="480" y="237" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><rect x="290" y="173" width="380" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">밖에서 먼저 오면 어느 컴퓨터로?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="423" width="560" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">포트 포워딩은 길 안내 규칙 하나일 뿐이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안에서 먼저 시작한 접속은 응답이 돌아와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공유기는 주소와 포트를 바꿔 내부와 이어 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">밖에서 먼저 들어오는 접속은 기준이 더 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트 포워딩 하나로 모든 문제가 풀리지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>