1" stroke="#6ea8fe" stroke-width="3"/><text x="740" y="391.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><text x="320" y="152" text-anchor="middle" font-size="16" fill="#9aa3b2">PC의 신뢰 목록</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="175" width="288" height="80" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="345" width="288" height="80" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="580" y="173" width="320" height="84" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="740" y="199" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">프록시의 인증서</text><text x="740" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">files.example</text><text x="740" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">회사 CA 서명</text><line x1="575" y1="215" x2="484" y2="215" stroke="#3d4b60" stroke-width="4"/><polygon points="466,215 486,206 486,224" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="169" width="328" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="580" y="343" width="320" height="84" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="740" y="369" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">프록시의 인증서</text><text x="740" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">files.example</text><text x="740" y="415" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">회사 CA 서명</text><line x1="575" y1="385" x2="484" y2="385" stroke="#3d4b60" stroke-width="4"/><polygon points="466,385 486,376 486,394" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="339" width="328" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="520" cy="215" r="16" fill="#7ee7c7"/><path d="M512 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="580" y="260" width="320" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="740" y="283.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">회사 CA를 믿어서 연결돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="520" cy="385" r="16" fill="#ff7b72"/><path d="M513 378 l14 14 M527 378 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="575" y="430" width="330" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="740" y="453.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">믿는 CA가 아니라서 경고가 떠요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="256" width="328" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="571" y="426" width="338" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="302" width="440" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="324.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">인증서 경고는 무시하고 진행하면 안 돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="256" y="297" width="448" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC마다 믿는 CA 목록이 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 회사 CA 서명 인증서를 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 CA를 믿는 PC만 연결돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경고가 떠도 무시하지 않아요</text></g>

