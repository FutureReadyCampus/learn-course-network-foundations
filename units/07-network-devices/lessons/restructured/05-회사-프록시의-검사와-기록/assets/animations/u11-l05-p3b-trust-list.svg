<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>회사 CA를 믿는 PC만 열려요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">회사 CA를 믿는 PC만 열려요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프록시가 내민 인증서를 PC가 받아들일까요?</text>
