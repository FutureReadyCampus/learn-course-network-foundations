<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프록시만 밖으로 나가게 하기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프록시만 밖으로 나가게 하기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">방화벽 규칙으로 직접 가는 길을 막아요</text>
<rect x="45.0" y="180.0" width="170" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="130" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">사내 PC</text><text x="130" y="272.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.0/24</text><rect x="45.0" y="350.0" width="170" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="130" y="391.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><text x="130" y="442.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.5</text><rect x="445" y="165" width="70" height="270" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">방화벽</text><ellipse cx="850" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">외부 웹</text><line x1="215" y1="215" x2="445" y2="215" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="215" y1="385" x2="445" y2="385" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="515" y1="215" x2="790" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="515" y1="385" x2="790" y2="315" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="118" width="420" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">프록시 설정을 지워도 직접 나갈 수 있어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="171" width="188" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="225,215;225,215;780,285;780,285" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="164" width="380" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="720" y="186.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">② 사내 PC → 외부 TCP 80·443 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="540" y="404" width="360" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="720" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">① 프록시 → 외부 TCP 80·443 허용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="536" y="159" width="368" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="536" y="399" width="368" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="215" r="16" fill="#ff7b72"/><path d="M473 208 l14 14 M487 208 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="398" y="201" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M398 203 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="225,385;225,385;780,315;780,315" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="235" r="16" fill="#7ee7c7"/><path d="M842 235 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="441" y="161" width="78" height="278" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="118" width="340" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">좁은 허용 규칙을 위에 두어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="110" width="348" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC는 프록시를 거치지 않고도 나갈 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽에 규칙 두 줄을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC의 직접 연결은 막히고 프록시만 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙은 위에서부터 처음 맞는 것을 써요</text></g>

