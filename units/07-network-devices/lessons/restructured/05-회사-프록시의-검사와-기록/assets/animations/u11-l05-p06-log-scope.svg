<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>AI 대화, 어디까지 남길까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">AI 대화, 어디까지 남길까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보호와 감시는 수집 범위가 갈라요</text>
<rect x="85.0" y="145.0" width="130" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="150" y="176.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">직원 PC</text><rect x="415.0" y="145.0" width="130" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="176.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="745.0" y="145.0" width="130" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="810" y="176.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">외부 AI</text><line x1="215" y1="170" x2="415" y2="170" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="545" y1="170" x2="745" y2="170" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="230" y="218" width="500" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="241.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">목표: 고객 정보가 외부 AI로 나가는 것 막기</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="226" y="214" width="508" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="280" width="410" height="125" rx="12" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="265" y="325" text-anchor="middle" font-size="22" font-weight="700" fill="#ff7b72">대화 전문을 1년 보관</text><text x="265" y="365" text-anchor="middle" font-size="17" fill="#e6e8ec">점심 메뉴 · 건강 상담 · 개인 메일까지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="276" width="418" height="133" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="440" cy="300" r="16" fill="#ff7b72"/><path d="M433 293 l14 14 M447 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="490" y="280" width="410" height="125" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="695" y="325" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">차단 사건만 기록</text><text x="695" y="365" text-anchor="middle" font-size="17" fill="#e6e8ec">시각 · PC · 규칙 이름</text><circle cx="870" cy="300" r="16" fill="#7ee7c7"/><path d="M862 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="486" y="276" width="418" height="133" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="428" width="380" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="451.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">목표에서 거꾸로 정한 만큼만 남겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="422" width="388" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모든 요청이 모이는 프록시는 감시 도구도 될 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">대화 전문을 쌓아 두자는 의견이 나와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">차단 사건만 남기면 목표에 충분해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">수집 범위는 목적이 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>