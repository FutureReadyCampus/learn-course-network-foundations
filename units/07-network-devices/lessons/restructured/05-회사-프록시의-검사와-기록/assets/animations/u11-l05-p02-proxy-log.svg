 x="290" y="441.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">누가 · 언제 · 어디로 · 얼마나</text><rect x="500" y="418" width="380" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="690" y="441.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">올린 내용은 암호문이라 안 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="496" y="414" width="388" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="180" y="418" width="600" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="441.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">PC 주소일 뿐 사람은 아니에요 · 목적과 보관 기간부터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="412" width="608" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
