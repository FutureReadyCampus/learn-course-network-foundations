<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>방화벽 규칙은 위에서부터 읽어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">방화벽 규칙은 위에서부터 읽어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프록시의 요청이 어느 규칙에 먼저 걸릴까요?</text>
<text x="250" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#ff7b72">차단 규칙을 위에 둔 경우</text><text x="710" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">허용 규칙을 위에 둔 경우</text><rect x="50" y="275" width="400" height="50" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="66" y="306" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">① 사내 PC 192.168.10.0/24 → 차단</text><rect x="50" y="340" width="400" height="50" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="66" y="371" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">② 프록시 192.168.10.5 → 허용</text><rect x="510" y="275" width="400" height="50" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="526" y="306" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">① 프록시 192.168.10.5 → 허용</text><rect x="510" y="340" width="400" height="50" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="526" y="371" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">② 사내 PC 192.168.10.0/24 → 차단</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="185" y="118" width="590" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="141.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">프록시 192.168.10.5도 192.168.10.0/24 안에 있어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="181" y="114" width="598" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,205;180,205;180,232;180,232" keyTimes="0.000;0.275;0.425;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="236" x2="180" y2="252" stroke="#3d4b60" stroke-width="4"/><polygon points="180,262 172,248 188,248" fill="#3d4b60"/><text x="212" y="238" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">프록시의 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="640,205;640,205;640,232;640,232" keyTimes="0.000;0.275;0.425;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="640" y1="236" x2="640" y2="252" stroke="#3d4b60" stroke-width="4"/><polygon points="640,262 632,248 648,248" fill="#3d4b60"/><text x="672" y="238" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">프록시의 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="271" width="408" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="271" width="408" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="426" cy="300" r="16" fill="#ff7b72"/><path d="M419 293 l14 14 M433 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="120" y="408" width="260" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="250" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">프록시도 못 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="886" cy="300" r="16" fill="#7ee7c7"/><path d="M878 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="580" y="408" width="260" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="710" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">프록시는 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="116" y="404" width="268" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="404" width="268" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="118" width="340" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="141.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">좁은 허용 규칙을 위에 두어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="114" width="348" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시 주소도 PC 대역 안에 들어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 위에서부터 규칙과 비교돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 맞는 규칙에서 결과가 정해져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">좁은 허용 규칙을 위에 두어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>