<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>암호화된 AI 대화 열어 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">암호화된 AI 대화 열어 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TLS 검사는 연결을 둘로 나눠요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="110" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.42</text><rect x="405.0" y="260.0" width="150" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><text x="850" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">ai-chat.example</text><line x1="165" y1="300" x2="405" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="555" y1="300" x2="810" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="251" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M289 251 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><rect x="670" y="251" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M679 251 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><rect x="280" y="173" width="400" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">TLS는 PC와 AI 서비스가 직접 맺어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="401" y="256" width="158" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="251" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M289 251 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="670" y="251" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M679 251 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><text x="300" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">TLS ①</text><text x="690" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">TLS ②</text><text x="300" y="350" text-anchor="middle" font-size="15" fill="#7ee7c7">회사 CA 서명 인증서</text><text x="690" y="350" text-anchor="middle" font-size="15" fill="#7ee7c7">공인 CA 인증서 확인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="401" y="256" width="158" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="173" width="320" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프록시 안에서만 평문이에요</text><rect x="578" y="286" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M578 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="690" cy="300" r="16" fill="#ff7b72"/><path d="M683 293 l14 14 M697 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="250" y="404" width="460" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">휴대전화 번호 형식이 여러 개 → 업로드 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="399" width="468" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="35" y="404" width="150" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">회사 CA 설치</text><rect x="430" y="174" width="300" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="580" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">키 관리 · 경고 무시 금지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="399" width="168" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지금은 프록시도 암호문을 읽지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결을 둘로 나눠 TLS를 따로 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 평문을 검사해 규칙대로 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC에 회사 CA가 있어야 하고 키를 지켜요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>