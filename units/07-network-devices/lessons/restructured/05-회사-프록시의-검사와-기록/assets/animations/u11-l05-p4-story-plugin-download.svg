ke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="850" y="349.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="52.0" y="199" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="178" y="208" width="193" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="275" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">처음 보는 외부 사이트</text><rect x="247" y="264" width="56" height="72" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="287,264 303,280 287,280" fill="#ff7b72"/><rect x="257" y="294" width="36" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="257" y="307" width="28" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="257" y="320" width="20" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><text x="275" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">AI 자동 배치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="146" y="196" width="258" height="203" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="131.5,202.0 151.5,202.0 108,208" fill="#171a21" stroke="#8f98a8" stroke-width="3" stroke-linejoin="round"/><rect x="117.5" y="128.0" width="135.0" height="74" rx="16" fill="#171a21" stroke="#8f98a8" stroke-width="3"/><line x1="134" y1="202" x2="150" y2="202" stroke="#171a21" stroke-width="5"/><text x="185" y="158.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이거 괜찮은</text><text x="185" y="184.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">파일이에요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="108.5" y="119.0" width="153.0" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="794.88,202.0 814.88,202.0 850,208" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="571.12" y="128.0" width="257.76" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="797" y1="202" x2="813" y2="202" stroke="#171a21" stroke-width="5"/><text x="700" y="157.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">묻지 않아도 들어오는 파일을</text><text x="700" y="183.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">회사가 먼저 걸러 줄 수 없어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="309" y="419" width="341" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">받은 파일에 악성코드가 있다면?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">디자인팀 직원이 지우를 찾아와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 보는 사이트에서 'AI 자동 배치' 설치 파일을 받았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직원은 괜찮은지 묻고, 서 이사는 먼저 걸러 주길 바라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 파일을 걸러 주는 법을 알아봐요</text></g>

