<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>받은 파일, 괜찮은 걸까요?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">받은 파일, 괜찮은 걸까요?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">설치하기 전에 지우에게 물어 온 직원</text>
