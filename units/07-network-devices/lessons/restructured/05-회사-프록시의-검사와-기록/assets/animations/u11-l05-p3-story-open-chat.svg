nimate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="266" y="249" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="274" y="256" width="52" height="32" fill="#3d4b60"/><rect x="295" y="295" width="10" height="10" fill="#6ea8fe"/><rect x="278" y="305" width="44" height="5" fill="#6ea8fe"/><text x="300" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><line x1="350" y1="275" x2="590" y2="275" stroke="#6ea8fe" stroke-width="6"/><rect x="446" y="248" width="56" height="54" rx="8" fill="#0f1115"/><rect x="454" y="254" width="40" height="32" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M463 254 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="474" y="325" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">암호</text><rect x="590" y="240" width="150" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="665.0" y="281.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">외부 저장소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="231" width="508" height="113" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="144.06,202.0 164.06,202.0 118,208" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="130.06" y="128.0" width="263.88" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="146" y1="202" x2="162" y2="202" stroke="#171a21" stroke-width="5"/><text x="262" y="158.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">고객 연락처 파일이 올라가는</text><text x="262" y="184.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">순간 막을 수는 없어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="121.06" y="119.0" width="281.88" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="126" width="180" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="776" cy="205" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="801" cy="208" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="826" cy="210" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="700" y="158.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이 암호를 열려면</text><text x="700" y="184.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">무엇이 필요할까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="309" y="419" width="341" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">암호화된 업로드를 열어 보려면?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록만으로는 부족하다고 서 이사가 말해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용은 박 팀장 PC와 저장소만 푸는 암호 속에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사는 올리는 순간 막기를, 지우는 암호 열기를 떠올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 암호를 열 조건을 알아봐요</text></g>

