"323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">AI 플러그인</text><rect x="472" y="341" width="16" height="14" fill="#3d4b60"/><rect x="444" y="355" width="72" height="7" rx="3" fill="#3d4b60"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="225" width="208" height="120" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="158,187.0 178,187.0 168,203" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="130.0" y="113.0" width="340" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="160" y1="187" x2="176" y2="187" stroke="#171a21" stroke-width="5"/><text x="300" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">이 플러그인이 어디로 뭘</text><text x="300" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">보내는지 알 수 있어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="519" y="111" width="203" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="711" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="741" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="770" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="620" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">어느 주소로 가나?</text><text x="620" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">어떤 요청을 보냈나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="335" y="419" width="290" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">패킷을 볼까, 대화를 볼까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이번 주에 새로 깔린 AI 플러그인이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사가 어디로 뭘 보내는지 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 이 한 문장에 질문이 두 개 있다는 걸 알아채요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 어느 쪽을 볼지 정해 봐요</text></g>

