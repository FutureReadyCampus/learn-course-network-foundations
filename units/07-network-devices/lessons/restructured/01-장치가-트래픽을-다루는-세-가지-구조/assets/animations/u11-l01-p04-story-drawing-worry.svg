<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>자료가 저장소로 올라가면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">자료가 저장소로 올라가면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 올렸는지를 봐야 하는 요청이에요</text>
