gon points="352,249 368,265 352,265" fill="#6ea8fe"/><rect x="322" y="279" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="322" y="292" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="322" y="305" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="340" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">거래처 자료</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="241" width="118" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="180.06,187.0 200.06,187.0 190,203" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="166.06" y="113.0" width="267.88" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="182" y1="187" x2="198" y2="187" stroke="#171a21" stroke-width="5"/><text x="300" y="143.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">거래처 자료가 개인 클라우드에</text><text x="300" y="169.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">올라가는지 봐 주실 수 있어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="312" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="352,249 368,265 352,265" fill="#6ea8fe"/><rect x="322" y="279" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="322" y="292" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="322" y="305" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="340" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">자료 파일 하나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="458" y="241" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 243 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="512" y="241" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M512 243 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="566" y="241" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M566 243 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="620" y="241" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M620 243 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="458" y="281" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 283 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="512" y="281" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M512 283 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="566" y="281" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M566 283 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="620" y="281" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M620 283 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="567" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">수천 개의 패킷 조각</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="450" y="229" width="228" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="619" y="111" width="162" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="763" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="782" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="800" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="700" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">조각을 모아</text><text x="700" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">조립해야 하나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="342" y="419" width="277" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">대신 접속해 주는 장치는?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사의 세 번째 티켓은 자료 업로드 확인이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거래처 자료가 개인 저장소에 올라가는지 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">파일 하나는 수천 개의 패킷으로 쪼개져 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 더 알맞은 구조를 찾아봐요</text></g>

