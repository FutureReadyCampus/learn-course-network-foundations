<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>장치를 구조로 나눠 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">장치를 구조로 나눠 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">위치와 처리 단위, 두 가지 질문이에요</text>
<rect x="330" y="120" width="250" height="40" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="455.0" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">어디에 있나?</text><rect x="600" y="120" width="250" height="40" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="725.0" y="146.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">무엇을 보나?</text><g><rect x="90" y="180" width="220" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="200.0" y="217.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">Inline</text><rect x="330" y="180" width="250" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="455.0" y="217.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">경로 안</text><rect x="600" y="180" width="250" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="725.0" y="217.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="260" width="220" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="200.0" y="297.92" text-anchor="middle" font-size="22" font-weight="700" fill="#c792ea">Out of path</text><rect x="330" y="260" width="250" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="455.0" y="297.2" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">경로 밖 (복사본)</text><rect x="600" y="260" width="250" height="60" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="725.0" y="297.2" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">패킷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="340" width="220" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200.0" y="377.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">Proxy</text><rect x="330" y="340" width="250" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="377.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">중간 대리</text><rect x="600" y="340" width="250" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="725.0" y="377.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">소켓 Stream</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="422" width="440" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">이름보다 위치와 단위를 먼저 물어봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Inline은 경로 안에서 패킷을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Out of path는 복사본 패킷을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Proxy는 소켓의 Stream을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 질문이면 대부분 구분돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>