<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>패킷을 볼까, 대화를 볼까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">패킷을 볼까, 대화를 볼까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">송장만 읽을지, 편지까지 읽을지 정해요</text>
<rect x="300" y="128" width="360" height="228" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="312" y="140" width="336" height="100" rx="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="480" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">송장 · 패킷 헤더</text><text x="480" y="198" text-anchor="middle" font-size="17" fill="#e6e8ec">보내는 곳 192.168.10.42</text><text x="480" y="224" text-anchor="middle" font-size="17" fill="#e6e8ec">받는 곳 203.0.113.80:443</text><rect x="312" y="248" width="336" height="100" rx="8" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="480" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">편지 · HTTP 내용</text><text x="480" y="306" text-anchor="middle" font-size="17" fill="#e6e8ec">요청한 URL</text><text x="480" y="332" text-anchor="middle" font-size="17" fill="#e6e8ec">올린 본문</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="292" y="393" width="375" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">서 이사: 이 플러그인이 어디로, 뭘 보내요?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="124" width="368" height="236" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="312" y="140" width="336" height="100" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">송장 · 패킷 헤더</text><text x="480" y="198" text-anchor="middle" font-size="17" fill="#e6e8ec">보내는 곳 192.168.10.42</text><text x="480" y="224" text-anchor="middle" font-size="17" fill="#e6e8ec">받는 곳 203.0.113.80:443</text><rect x="40" y="150" width="200" height="76" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="140" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">패킷을 보는 장치</text><text x="140" y="208" text-anchor="middle" font-size="16" fill="#9aa3b2">Inline · Out of path</text><line x1="240" y1="188" x2="284" y2="188" stroke="#6ea8fe" stroke-width="4"/><polygon points="300,188 276,178 276,198" fill="#6ea8fe"/><circle cx="270" cy="150" r="16" fill="#7ee7c7"/><path d="M262 150 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="140" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">어느 주소·포트로 가나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="308" y="136" width="344" height="108" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="312" y="248" width="336" height="100" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">편지 · HTTP 내용</text><text x="480" y="306" text-anchor="middle" font-size="17" fill="#e6e8ec">요청한 URL</text><text x="480" y="332" text-anchor="middle" font-size="17" fill="#e6e8ec">올린 본문</text><rect x="720" y="252" width="200" height="76" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="820" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">Proxy</text><text x="820" y="310" text-anchor="middle" font-size="16" fill="#9aa3b2">소켓 Stream</text><line x1="720" y1="290" x2="676" y2="290" stroke="#7ee7c7" stroke-width="4"/><polygon points="660,290 684,280 684,300" fill="#7ee7c7"/><circle cx="690" cy="252" r="16" fill="#7ee7c7"/><path d="M682 252 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="820" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">어떤 URL·본문을 보냈나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="308" y="244" width="344" height="108" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="329" y="393" width="302" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">알고 싶은 층에 맞는 장치를 골라요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">플러그인의 요청은 송장과 편지로 이뤄져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소와 포트는 송장만 봐도 알 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">URL과 본문은 편지를 열어야 알 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">알고 싶은 층에 맞춰 장치를 골라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>