<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>봉인된 봉투를 프록시가 읽으려면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">봉인된 봉투를 프록시가 읽으려면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">신분증과 명단 설정이 있어야 해요</text>
<rect x="76" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="66,262 154,262 162,274 58,274" fill="#6ea8fe"/><text x="110" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><rect x="405.0" y="210.0" width="150" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="256.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><text x="480" y="312.0" text-anchor="middle" font-size="15" fill="#9aa3b2">심부름꾼</text><rect x="816" y="210" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="220" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="244" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="268" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">저장소 서비스</text><line x1="165" y1="250" x2="405" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="555" y1="250" x2="800" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="130" width="130" height="60" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="315" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">봉인 봉투</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="126" width="138" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="610" y="118" width="230" height="84" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="725" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">신분증(인증서)</text><text x="725" y="183" text-anchor="middle" font-size="16" fill="#e6e8ec">도장: 발급 기관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="606" y="114" width="238" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="330" width="300" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">경비 명단에 회사 도장 추가</text><text x="480" y="392" text-anchor="middle" font-size="16" fill="#9aa3b2">(회사 CA 설치)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="326" width="308" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="405" y="130" width="150" height="60" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">뜯어 보고 재봉인</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="401" y="126" width="158" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTPS 요청은 봉인된 봉투(암호문)로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대 회사는 도장 찍힌 신분증(인증서)을 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 경비 명단에 회사 도장을 올려 둬요(CA 설치)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 뜯어 보고 다시 봉인해요(TLS 검사)</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>