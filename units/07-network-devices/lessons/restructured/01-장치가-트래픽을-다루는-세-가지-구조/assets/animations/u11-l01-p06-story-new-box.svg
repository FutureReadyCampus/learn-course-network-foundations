<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>새 보안 장비는 어느 구조일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">새 보안 장비는 어느 구조일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서 이사가 설명서를 건넸어요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="690" y="130" width="200" height="170" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="790" y1="130" x2="790" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="215" x2="890" y2="215" stroke="#3d4b60" stroke-width="3"/><rect x="70" y="150" width="120" height="80" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="90" y1="180" x2="170" y2="180" stroke="#3d4b60" stroke-width="3"/><line x1="90" y1="200" x2="150" y2="200" stroke="#3d4b60" stroke-width="3"/><g><g transform="translate(160,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="160" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(810,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="810" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(810,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-4" r="4.5" fill="#0f1115"/><circle cx="11" cy="-4" r="4.5" fill="#0f1115"/><ellipse cx="3" cy="12" rx="4" ry="5.5" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="810" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="302" y="234" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="342,234 358,250 342,250" fill="#6ea8fe"/><rect x="312" y="264" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="312" y="277" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="312" y="290" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="330" y="332" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">설명서</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="272" y="222" width="116" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="403" y="198" width="155" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">외부 사이트 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="430" y="248" width="100" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="271.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">접속 기록</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="430" y="298" width="100" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="480" y="321.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">웹 필터링</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="386" y="186" width="188" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="518" y="111" width="203" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="713" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="746" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="778" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="620" y="142.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">이 상자는 Inline?</text><text x="620" y="168.76" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">Out of path·Proxy?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="314" y="419" width="333" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">한 상자에 세 구조가 다 있다면?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 달 뒤 회사가 새 보안 장비를 검토해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">설명서에 세 기능이 한 줄에 나란히 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 잠깐 헷갈려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 한 상자를 기능별로 나눠 봐요</text></g>

