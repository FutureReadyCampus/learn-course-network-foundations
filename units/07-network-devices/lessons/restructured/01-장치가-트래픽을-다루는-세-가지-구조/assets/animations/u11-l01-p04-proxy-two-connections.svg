<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>대신 접속해 주는 프록시</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">대신 접속해 주는 프록시</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">양쪽과 따로 연결을 맺는 대리인이에요</text>
<rect x="66" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="271" width="52" height="32" fill="#3d4b60"/><rect x="95" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="78" y="320" width="44" height="5" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="100" y="372" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="405.0" y="260.0" width="150" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">프록시</text><text x="480" y="364.0" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.5:8080</text><rect x="826" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI 서비스</text><text x="860" y="384" text-anchor="middle" font-size="16" fill="#9aa3b2">203.0.113.80:443</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="84" y="195" width="32" height="40" rx="3" fill="#ffb454"/><rect x="91" y="205" width="18" height="3" fill="#0f1115"/><rect x="91" y="213" width="18" height="3" fill="#0f1115"/><text x="128" y="221" text-anchor="start" font-size="16" font-weight="700" fill="#e6e8ec">고객 도면</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="307" y="143" width="345" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">서 이사: 도면을 AI에 올리면 어떡하죠?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="191" width="40" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="170" y1="300" x2="405" y2="300" stroke="#7ee7c7" stroke-width="5"/><rect x="248" y="246" width="83" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="290" y="268.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결 ①</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="243" y="242" width="94" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="555" y1="300" x2="810" y2="300" stroke="#7ee7c7" stroke-width="5"/><rect x="638" y="246" width="83" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="680" y="268.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결 ②</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="633" y="242" width="94" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="266" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="302" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="338" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="374" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="410" y="396" width="30" height="26" rx="4" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="496" y="396" width="200" height="26" rx="4" fill="#c792ea"/><line x1="448" y1="409" x2="470" y2="409" stroke="#9aa3b2" stroke-width="3"/><polygon points="486,409 462,400 462,418" fill="#9aa3b2"/><text x="463" y="456" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">조각난 패킷을 이어 붙인 Stream을 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="226" y="392" width="474" height="34" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,300;200,300;380,300;380,300" keyTimes="0.000;0.275;0.425;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="590,300;590,300;770,300;770,300" keyTimes="0.000;0.525;0.675;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고객 도면 파일을 AI에 올리려는 상황이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 PC와 프록시 사이에 연결 ①을 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 서비스와 연결 ②를 따로 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시는 이어진 Stream으로 내용을 읽어요</text></g>

