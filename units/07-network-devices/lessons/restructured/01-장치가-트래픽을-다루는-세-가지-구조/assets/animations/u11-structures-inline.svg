<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Inline · 통과와 차단</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Inline · 통과와 차단</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">검문소처럼 길 위에서 직접 걸러요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="454" y="250" width="52" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">검문</text><line x1="170" y1="300" x2="454" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="506" y1="300" x2="800" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="350" y="198" width="260" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">길 한가운데 놓인 필터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;770,300;770,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="370" y="413" width="220" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">허용 → 통과(Bypass)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;440,300;440,300" keyTimes="0.000;0.525;0.650;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="365" r="16" fill="#ff7b72"/><path d="M473 358 l14 14 M487 358 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="360" y="413" width="240" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">차단 규칙 → 버림(Drop)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="413" width="420" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">라우터·방화벽이 대표적인 Inline이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Inline 장치는 패킷이 지나는 길 위에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허용된 패킷은 그대로 통과해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">차단 규칙에 맞으면 버려져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통과시키고 막는 일이 핵심이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>