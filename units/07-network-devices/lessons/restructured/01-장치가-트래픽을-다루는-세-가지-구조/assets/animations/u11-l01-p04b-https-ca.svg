<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTPS는 설정이 있어야 읽혀요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTPS는 설정이 있어야 읽혀요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프록시가 암호문을 읽는 조건이에요</text>
<line x1="170" y1="300" x2="405" y2="300" stroke="#7ee7c7" stroke-width="5"/><line x1="555" y1="300" x2="810" y2="300" stroke="#7ee7c7" stroke-width="5"/><rect x="270" y="246" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M279 246 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/><rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="100" y="372" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="405.0" y="260.0" width="150" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">프록시</text><text x="480" y="364.0" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.5:8080</text><rect x="826" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI 서비스</text><text x="860" y="384" text-anchor="middle" font-size="16" fill="#9aa3b2">203.0.113.80:443</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="358" y="148" width="243" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">AI 서비스는 HTTPS를 써요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="266" y="232" width="48" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="340.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">7#</text><rect x="371" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="396.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">q9</text><rect x="427" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="452.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">$k</text><rect x="483" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="508.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">Zx</text><rect x="539" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="564.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">@2</text><rect x="595" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="620.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">m!</text><circle cx="700" cy="402" r="16" fill="#ff7b72"/><path d="M693 395 l14 14 M707 395 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">프록시가 읽은 바이트는 암호문이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="35" y="198" width="131" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="100" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">회사 CA 설치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="194" width="148" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="409" y="198" width="142" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TLS 검사 설정</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="386" y="194" width="188" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="340.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">P</text><rect x="371" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="396.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">O</text><rect x="427" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="452.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">S</text><rect x="483" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="508.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">T</text><rect x="539" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="564.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea"></text><rect x="595" y="385" width="50" height="34" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="620.0" y="408.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">/</text><circle cx="700" cy="402" r="16" fill="#7ee7c7"/><path d="M692 402 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="480" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">프록시가 내용을 읽을 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="311" y="381" width="338" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="349" y="148" width="261" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">두 설정이 모두 있어야 읽혀요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTPS라 프록시를 지나는 바이트는 암호문이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC에 회사 CA를 깔아도 아직 읽을 수 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시에 TLS 검사 설정을 켜면 읽혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">중계하는 연결에서 두 설정이 있을 때만 읽어요</text></g>

