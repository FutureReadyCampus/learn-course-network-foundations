<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>여러 구조가 한 장치에</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">여러 구조가 한 장치에</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">하나만 고집해서 분류하지 않아요</text>
<rect x="300" y="150" width="360" height="190" rx="18" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">보안 장비 한 대</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="215" width="150" height="50" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="405.0" y="247.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">Inline</text><text x="405" y="295" text-anchor="middle" font-size="15" fill="#9aa3b2">경로 안에서 통과·차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="500" y="215" width="130" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="565.0" y="247.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Proxy</text><text x="565" y="295" text-anchor="middle" font-size="15" fill="#9aa3b2">내용을 대신 중계</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="285" y="368" width="190" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="380" y="391.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">경로 안에 있나?</text><rect x="485" y="368" width="190" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="580" y="391.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">패킷? Stream?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="265" y="424" width="430" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">다음 Lesson: Inline이 패킷을 전달하는 방법</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장치 하나가 여러 구조를 함께 가질 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경로 안에서 패킷을 통과·차단하고</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시 기능으로 내용도 중계해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 이름 대신 두 질문으로 봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>