<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>한 상자 안의 세 구조</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">한 상자 안의 세 구조</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">구조는 상자가 아니라 기능마다 따져요</text>
<rect x="50" y="115" width="860" height="335" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="80" y="150" text-anchor="start" font-size="20" font-weight="700" fill="#e6e8ec">새 보안 장비 한 대</text><text x="205" y="200" text-anchor="middle" font-size="17" fill="#9aa3b2">기능</text><text x="495" y="200" text-anchor="middle" font-size="17" fill="#9aa3b2">어떤 구조?</text><text x="775" y="200" text-anchor="middle" font-size="17" fill="#9aa3b2">무엇을 보나?</text><rect x="80" y="215" width="250" height="56" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/><text x="205.0" y="249.84" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">외부 사이트 차단</text><rect x="360" y="215" width="270" height="56" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="495" y="251" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">?</text><rect x="80" y="293" width="250" height="56" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/><text x="205.0" y="327.84" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">접속 기록</text><rect x="360" y="293" width="270" height="56" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="495" y="329" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">?</text><rect x="80" y="371" width="250" height="56" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/><text x="205.0" y="405.84" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8ec">웹 필터링</text><rect x="360" y="371" width="270" height="56" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="495" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">?</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="215" width="270" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="495.0" y="249.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">Inline</text><rect x="360" y="293" width="270" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="495.0" y="327.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">관찰 (Out of path 식)</text><rect x="360" y="371" width="270" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="495.0" y="405.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">Proxy</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="211" width="278" height="220" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="660" y="215" width="230" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="775.0" y="249.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">패킷 헤더</text><rect x="660" y="293" width="230" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="775.0" y="327.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">패킷</text><rect x="660" y="371" width="230" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="775.0" y="405.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">소켓 Stream (HTTP)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="211" width="238" height="220" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="50" y="165" width="860" height="285" rx="16" fill="#0f1115" fill-opacity="0.6"/><rect x="50" y="115" width="860" height="335" rx="16" fill="none" stroke="#ff7b72" stroke-width="4"/><rect x="303" y="133" width="355" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">상자가 멈추면 세 기능이 한꺼번에 멈춰요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">설명서에 기능 세 가지가 한 줄에 적혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기능마다 붙는 자리가 달라 구조도 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">구조에 따라 보는 단위도 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다만 한 상자가 멈추면 기능이 모두 멈춰요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>