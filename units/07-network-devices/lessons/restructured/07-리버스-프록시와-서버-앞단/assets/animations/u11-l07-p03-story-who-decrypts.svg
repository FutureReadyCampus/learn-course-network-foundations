<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>암호는 그룹웨어 서버가 풀까요?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">암호는 그룹웨어 서버가 풀까요?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TLS를 푸는 일을 누가 맡을지 고민해요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="690" y="130" width="200" height="170" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="790" y1="130" x2="790" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="215" x2="890" y2="215" stroke="#3d4b60" stroke-width="3"/><rect x="70" y="150" width="120" height="80" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="90" y1="180" x2="170" y2="180" stroke="#3d4b60" stroke-width="3"/><line x1="90" y1="200" x2="150" y2="200" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(170,240) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="170" y="354.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><g transform="translate(170,240) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="170" y="354.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="122" y="204" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="486" y="222" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="496" y="232" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="496" y="256" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="496" y="280" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="520" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="520" y="348" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.50:8080</text><rect x="500" y="260" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M509 260 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="604" y="220" width="32" height="40" rx="3" fill="#6ea8fe"/><rect x="611" y="230" width="18" height="3" fill="#0f1115"/><rect x="611" y="238" width="18" height="3" fill="#0f1115"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="408" y="378" width="224" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">서버가 TLS를 직접 풀어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="594" y="214" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="756" y="222" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="766" y="232" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="256" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="766" y="280" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="790" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서버 (늘림)</text><rect x="770" y="260" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M779 260 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="869" y="220" width="32" height="40" rx="3" fill="#6ea8fe"/><rect x="876" y="230" width="18" height="3" fill="#0f1115"/><rect x="876" y="238" width="18" height="3" fill="#0f1115"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="724" y="196" width="198" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="129" width="208" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="215" cy="208" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="198" cy="210" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="181" cy="211" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="300" y="161.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버를 늘릴 때마다</text><text x="300" y="187.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">인증서를 설치·갱신?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="186.94" y="120.0" width="226.12" height="96" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="331" y="419" width="298" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">암호는 어디서 풀어야 할까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청 내용을 검사하려면 TLS를 풀어야 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가장 단순한 답은 그룹웨어 서버가 직접 푸는 거예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 늘면 서버마다 인증서가 따라가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 더 나은 자리를 찾아봐요</text></g>

