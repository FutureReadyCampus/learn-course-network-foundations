000000004" fill="#9aa3b2"/></g><text x="330" y="354.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(780,240) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="780" y="354.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(780,240) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="780" y="354.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="429" y="378" width="252" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="555" y="401.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">티켓 5: 외근 중에도 전자결재</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="282" y="204" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="521" y="222" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="7 5"/><rect x="531" y="232" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="531" y="256" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="531" y="280" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="555" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="555" y="348" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.50:8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="471" y="214" width="168" height="150" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="770,205.0 790,205.0 780,212" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="619.18" y="131.0" width="251.64000000000001" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="772" y1="205" x2="788" y2="205" stroke="#171a21" stroke-width="5"/><text x="745" y="161.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">밖에서도 열어 주려면</text><text x="745" y="187.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">인터넷에 내놔야 하잖아요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="610.18" y="122.0" width="269.64" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="234" y="129" width="192" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="330" cy="208" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="330" cy="210" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="330" cy="211" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="330" y="161.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">아직 띄우기 전이니</text><text x="330" y="187.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">설계도부터 그리자</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="225.04000000000002" y="120.0" width="209.92" height="96" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="281" y="419" width="398" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">서버 앞에 무엇을 어떤 순서로 세울까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 외근 중에도 전자결재를 열게 해 달라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우와 서 이사가 사내 그룹웨어 서버 계획을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사는 공격이 걱정, 지우는 설계도부터 그려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 서버 앞 경비를 알아봐요</text></g>

