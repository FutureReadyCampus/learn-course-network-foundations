<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>밖에 열면 공격받지 않아요?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">밖에 열면 공격받지 않아요?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">외근 중에도 쓸 사내 그룹웨어를 밖에 열어 줘야 해요</text>
