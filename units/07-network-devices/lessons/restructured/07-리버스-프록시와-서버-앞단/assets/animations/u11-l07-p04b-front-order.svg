<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>앞단 장치는 순서가 중요해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">앞단 장치는 순서가 중요해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">장치마다 볼 수 있는 것이 달라요</text>
<line x1="122" y1="300" x2="170" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="300" y1="300" x2="340" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="470" y1="300" x2="510" y2="300" stroke="#3d4b60" stroke-width="4"/><line x1="640" y1="300" x2="765" y2="300" stroke="#3d4b60" stroke-width="4"/><rect x="36" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="44" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="26,312 114,312 122,324 18,324" fill="#6ea8fe"/><text x="70" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외근 직원</text><g><rect x="170.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="235" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">IPS</text></g><g><text x="235" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">①</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="166.0" y="261" width="138" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="314" y="384" width="333" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보는 것: 출발지 대역 · 포트 · 연결 빈도</text><rect x="347" y="432" width="266" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">못 보는 것: TLS 안의 요청 내용</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="340.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#5b677a" stroke-width="3"/><text x="405" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#5b677a">TLS 종단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="340.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="405" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">TLS 종단</text></g><g><text x="405" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">②</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="336.0" y="261" width="138" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="287" y="384" width="386" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보는 것: TLS 연결 · 인증서로 서비스 신분 증명</text><rect x="323" y="432" width="314" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">못 보는 것: 공격인지는 따지지 않아요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="510.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#5b677a" stroke-width="3"/><text x="575" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#5b677a">WAF</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="510.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="575" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">WAF</text></g><g><text x="575" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">③</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="506.0" y="261" width="138" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="297" y="384" width="366" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보는 것: 풀린 요청의 경로 · 매개변수 · 본문</text><rect x="329" y="432" width="302" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">못 보는 것: 규칙에 없는 새로운 공격</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="766" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#5b677a" stroke-width="3"/><rect x="776" y="270" width="48" height="16" rx="3" fill="#5b677a" fill-opacity="0.45"/><rect x="776" y="294" width="48" height="16" rx="3" fill="#5b677a" fill-opacity="0.45"/><rect x="776" y="318" width="48" height="16" rx="3" fill="#5b677a" fill-opacity="0.45"/><text x="800" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="766" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="776" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="800" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text></g><g><text x="800" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">④</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="762" y="256" width="76" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="384" width="269" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보는 것: 실제 결재·게시판 처리</text><rect x="291" y="432" width="379" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="454.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">못 보는 것: 앞단이 알려 주지 않은 접속자 정보</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">맨 앞 IPS는 대역·포트·연결 빈도를 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS 종단 프록시가 연결을 받아 암호를 풀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">풀린 뒤에야 WAF가 요청 내용을 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그룹웨어 서버는 걸러진 요청의 결재·게시판 일을 처리해요</text></g>

