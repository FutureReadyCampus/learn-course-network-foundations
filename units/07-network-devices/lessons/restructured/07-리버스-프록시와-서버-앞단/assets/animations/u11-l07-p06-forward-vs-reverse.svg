<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>누구 편에 서 있느냐가 달라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">누구 편에 서 있느냐가 달라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">포워드와 리버스는 같은 모양이에요</text>
<rect x="66" y="171" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="178" width="52" height="30" fill="#3d4b60"/><polygon points="56,217 144,217 152,229 48,229" fill="#6ea8fe"/><text x="100" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직원 PC</text><text x="100" y="277" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.41</text><rect x="380.0" y="170.0" width="200" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="211.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">회사 프록시</text><text x="480" y="262.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.5:8080</text><rect x="816" y="165" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="175" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="199" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="223" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 클라우드 저장소</text><text x="850" y="287" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80:443</text><rect x="66" y="346" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="353" width="52" height="30" fill="#3d4b60"/><polygon points="56,392 144,392 152,404 48,404" fill="#6ea8fe"/><text x="100" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외근 직원</text><text x="100" y="452" text-anchor="middle" font-size="15" fill="#9aa3b2">192.0.2.77</text><rect x="360.0" y="345.0" width="240" height="70" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="386.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">앞단 리버스 프록시</text><text x="480" y="437.0" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25:443</text><rect x="816" y="340" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="350" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="374" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="398" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="442" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사내 그룹웨어 서버</text><text x="850" y="462" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><line x1="155" y1="205" x2="380" y2="205" stroke="#6ea8fe" stroke-width="4"/><line x1="580" y1="205" x2="810" y2="205" stroke="#6ea8fe" stroke-width="4"/><line x1="155" y1="380" x2="360" y2="380" stroke="#7ee7c7" stroke-width="4"/><line x1="600" y1="380" x2="810" y2="380" stroke="#7ee7c7" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="301" width="260" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="324.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">둘 다 연결이 두 개예요</text></g><text x="268" y="191" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">①</text><text x="695" y="191" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">②</text><text x="258" y="366" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">①</text><text x="705" y="366" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">②</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="133" width="360" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">직원 편 · 안쪽 연결을 받아 바깥으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="166" width="208" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="301" width="360" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="324.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서버 편 · 바깥 연결을 받아 안쪽으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="341" width="248" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="301" width="340" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="324.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">누구 편에서 어느 쪽 연결을 받나?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="295" width="348" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 프록시 모두 연결을 두 개 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포워드는 직원 편에서 안쪽 연결을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">리버스는 서버 편에서 바깥 연결을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이름보다 누구 편인지 확인하면 돼요</text></g>

