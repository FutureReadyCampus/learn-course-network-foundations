<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TLS는 안내 데스크에서 끝나요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TLS는 안내 데스크에서 끝나요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">신분증 확인은 앞단이, 일 처리는 서버가 해요</text>
<rect x="76" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="66,282 154,282 162,294 58,294" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외근 직원 PC</text><rect x="375.0" y="255.0" width="210" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="296.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">앞단(안내 데스크)</text><rect x="816" y="230" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="240" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="264" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="288" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><line x1="165" y1="270" x2="375" y2="290" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="585" y1="290" x2="800" y2="270" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="383" width="300" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">안내 데스크에 닿았어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="381" width="308" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="120" width="300" height="120" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">서비스 주소: gw.company.example</text><circle cx="400" cy="205" r="16" fill="none" stroke="#c792ea" stroke-width="3"/><text x="540" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">발급 기관 도장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="116" width="308" height="128" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="120" width="360" height="110" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="500" y="165" text-anchor="middle" font-size="17" fill="#e6e8ec">도장 기관이 명단에 있다</text><circle cx="335" cy="159" r="16" fill="#7ee7c7"/><path d="M327 159 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="500" y="205" text-anchor="middle" font-size="17" fill="#e6e8ec">이름이 주소와 같다</text><circle cx="335" cy="199" r="16" fill="#7ee7c7"/><path d="M327 199 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="116" width="368" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="490" y="394" width="340" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="660" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">봉투를 뜯어 읽을 수 있는 글로 전해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="486" y="385" width="348" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직원이 안내 데스크(앞단)에 닿아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞단이 서비스 신분증(인증서)을 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직원이 도장과 이름을 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞단이 봉투를 뜯어 서버로 전해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>