<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>앞단 한 대에 기대면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">앞단 한 대에 기대면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한곳에 모은 기능은 한곳이 약점이 돼요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">고객</text><text x="110" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.0.2.77</text><rect x="385.0" y="260.0" width="190" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">앞단 (한 대)</text><text x="480" y="362.0" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25:443</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="850" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><line x1="165" y1="300" x2="385" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="575" y1="300" x2="810" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,300;170,300;380,300;380,300" keyTimes="0.000;0.013;0.113;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="580,300;580,300;790,300;790,300" keyTimes="0.000;0.138;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="173" width="400" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">모든 시연 요청이 앞단 한 대를 지나요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="381" y="256" width="198" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="385.0" y="260.0" width="190" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">재시작 · 과부하</text><text x="480" y="362.0" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25:443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="173" width="240" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">앞단이 멈췄어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="381" y="256" width="198" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="225" r="16" fill="#ff7b72"/><path d="M473 218 l14 14 M487 218 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="850" cy="235" r="16" fill="#7ee7c7"/><path d="M842 235 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="278" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M278 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="280" y="158" width="400" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">고객에게는 서비스 전체가 멈춰 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="806" y="201" width="88" height="70" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="355.0" y="382.0" width="250" height="56" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">앞단 한 대 더 (이중화)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="158" width="520" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="181.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">한 대가 멈춰도 이어받아요 · 비용과 설정이 늘어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="374" width="268" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고객 요청은 모두 앞단 한 대를 지나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞단이 재시작하거나 과부하에 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AI 서버는 멀쩡해도 서비스가 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞단도 이중화해 단일 장애점을 줄여요</text></g>

