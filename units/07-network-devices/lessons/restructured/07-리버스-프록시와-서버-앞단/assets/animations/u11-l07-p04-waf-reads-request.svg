<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>WAF는 풀린 요청의 내용을 봐요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">WAF는 풀린 요청의 내용을 봐요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 해 달라는 요청인지 읽어요</text>
<line x1="150" y1="300" x2="225" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="355" y1="300" x2="455" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="585" y1="300" x2="816" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 요청</text><text x="100" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.0.2.77</text><rect x="225.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="290" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">TLS 종료</text><rect x="455.0" y="260.0" width="130" height="80" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="520" y="307.92" text-anchor="middle" font-size="22" font-weight="700" fill="#c792ea">WAF</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="850" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="158" width="400" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">TLS가 풀린 뒤에 WAF가 요청을 읽어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="451" y="256" width="138" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;790,300;790,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="158" width="300" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">/approval?doc=1042</text><circle cx="850" cy="225" r="16" fill="#7ee7c7"/><path d="M842 225 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="451" y="256" width="138" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;420,300;420,300" keyTimes="0.000;0.525;0.650;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="158" width="340" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">doc=1042' OR '1'='1</text><circle cx="520" cy="365" r="16" fill="#ff7b72"/><path d="M513 358 l14 14 M527 358 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="451" y="256" width="138" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="158" width="420" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">정상은 막는 오탐 · 공격은 놓치는 미탐</text><rect x="350" y="413" width="260" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">규칙은 계속 손봐야 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="266" y="152" width="428" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS가 풀린 뒤에 WAF가 놓여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정상 요청은 읽어 보고 그룹웨어 서버로 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SQL 삽입 같은 공격 요청은 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙이 안 맞으면 오탐과 미탐이 생겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>