<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>다음 이야기: 앞단은 아직 종이 위</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">다음 이야기: 앞단은 아직 종이 위</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">공인 주소로 온 연결이 사무실 안까지 닿으려면</text>
<rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">고객사</text><text x="100" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.0.2.77</text><rect x="400" y="175" width="530" height="280" rx="14" fill="none" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="665" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">본사 사무실</text><line x1="165" y1="300" x2="400" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="400" y1="300" x2="495" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="625" y1="300" x2="806" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="495" y="278" width="130" height="64" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="560" y="316" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">앞단</text><text x="560" y="366" text-anchor="middle" font-size="16" fill="#9aa3b2">설계도</text><rect x="806" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="816" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="816" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="816" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="840" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="840" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.50:8080</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="270" y="123" width="420" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">설계도는 완성, 앞단은 아직 종이 위예요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="491" y="274" width="138" height="72" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="282" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">→ 192.168.10.50:8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;345,300;345,300" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="400" cy="300" r="16" fill="#ff7b72"/><path d="M393 293 l14 14 M407 293 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="280" y="123" width="400" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">고객사에서는 사내 서버에 닿지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="271" width="48" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="282" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">공인 주소 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;370,300;370,300" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="447" cy="300" r="16" fill="#ffb454"/><text x="447" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><rect x="240" y="123" width="480" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">공인 주소로 온 연결은 안으로 어떻게 닿을까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="271" width="44" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="370" y="123" width="220" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">Unit 12에서 따져요</text><rect x="470" y="404" width="420" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="680" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">시연 기간에는 고객사 주소에만 임시로 열어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="466" y="399" width="428" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앞단은 아직 설계도 위에만 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고객사에서는 사설 주소 서버에 닿지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공인 주소로 온 연결이 안으로 닿는 길이 남았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 길은 Unit 12에서 따져요</text></g>

