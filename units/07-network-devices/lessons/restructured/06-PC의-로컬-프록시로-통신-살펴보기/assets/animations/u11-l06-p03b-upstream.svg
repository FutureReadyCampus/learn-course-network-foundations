<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>도구 뒤에 회사 프록시 잇기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">도구 뒤에 회사 프록시 잇기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 외부 연결이 막힌 사무실 PC에서는요</text>
<rect x="30" y="140" width="370" height="250" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="215.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">지우 PC</text><rect x="60.0" y="245.0" width="80" height="60" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="100" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">앱</text><rect x="220.0" y="245.0" width="140" height="60" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="290" y="281.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프록시 도구</text><text x="290" y="327.0" text-anchor="middle" font-size="15" fill="#9aa3b2">127.0.0.1:8080</text><line x1="140" y1="275" x2="220" y2="275" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="816" y="235" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="245" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="269" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="293" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI API</text><text x="850" y="357" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80:443</text><rect x="515.0" y="342.0" width="170" height="60" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="600" y="378.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">회사 프록시</text><text x="600" y="424.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.5:8080</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="158" y="261" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M158 263 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="216" y="241" width="148" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="490" y="178" width="260" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="620" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">요청은 도구에 먼저 와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="360" y1="275" x2="812" y2="275" stroke="#ff7b72" stroke-width="4" stroke-dasharray="10 8"/><circle cx="585" cy="275" r="16" fill="#ff7b72"/><path d="M578 268 l14 14 M592 268 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="465" y="178" width="310" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="620" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">바로 나가는 길은 막혀 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="330" y1="305" x2="515" y2="367" stroke="#6ea8fe" stroke-width="4"/><line x1="685" y1="367" x2="816" y2="307" stroke="#6ea8fe" stroke-width="4"/><circle cx="850" cy="205" r="16" fill="#7ee7c7"/><path d="M842 205 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="430" y="178" width="340" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="600" y="201.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">상위 프록시 칸에 회사 프록시를 적어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="511" y="338" width="178" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="365,317;365,317;470,352;470,352" keyTimes="0.000;0.512;0.613;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="720,352;720,352;765,331;765,331" keyTimes="0.000;0.637;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="441" width="380" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="464.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">프록시 뒤에 프록시를 한 번 더 이어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="437" width="388" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱의 요청은 도구에 먼저 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구가 바로 밖으로 나가려 하면 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구의 상위 프록시 칸에 회사 프록시를 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사무실에서는 프록시 뒤에 프록시가 와요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>