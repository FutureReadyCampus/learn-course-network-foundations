mes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(840,235) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="840" y="349.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="82" y="199" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="596,205.0 616,205.0 606,208" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="434.18" y="131.0" width="251.64000000000001" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="598" y1="205" x2="614" y2="205" stroke="#171a21" stroke-width="5"/><text x="560" y="161.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">그 프로그램이 뭘 밖으로</text><text x="560" y="187.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">보내는지 확인해 주실래요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="393" y="127" width="334" height="86" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values=