<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>봐도 되는 통신은 어디까지?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">봐도 되는 통신은 어디까지?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">도구가 보여 줄 수 있어도 봐도 되는 것은 아니에요</text>
<rect x="50" y="125" width="400" height="285" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="250" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">지우의 테스트 PC</text><rect x="510" y="125" width="400" height="285" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 6"/><text x="710" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">박 팀장 PC</text><rect x="140" y="236" width="80" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="149" y="244" width="62" height="40" rx="3" fill="#3d4b60" stroke="#3d4b60" stroke-width="0"/><rect x="174" y="292" width="12" height="10" rx="0" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><rect x="152" y="302" width="56" height="6" rx="2" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><rect x="280" y="212" width="80" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="296" y="230" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="296" y="246" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="296" y="262" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="296" y="278" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="296" y="294" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><text x="320" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">가짜 견적서</text><rect x="600" y="236" width="80" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="609" y="244" width="62" height="40" rx="3" fill="#3d4b60" stroke="#3d4b60" stroke-width="0"/><rect x="634" y="292" width="12" height="10" rx="0" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><rect x="612" y="302" width="56" height="6" rx="2" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><rect x="740" y="212" width="80" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="756" y="230" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="756" y="246" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="756" y="262" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="756" y="278" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="756" y="294" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><text x="780" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">실제 작업 파일</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><ellipse cx="180" cy="205" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="180" cy="205" r="7" fill="#ffb454"/><text x="230" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">도구</text><rect x="105" y="358" width="250" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="230" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">내 통신 · 가짜 데이터</text><circle cx="385" cy="375" r="16" fill="#7ee7c7"/><path d="M377 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="101" y="354" width="258" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><ellipse cx="640" cy="205" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="640" cy="205" r="7" fill="#ffb454"/><text x="690" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">도구</text><rect x="565" y="358" width="250" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="690" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">몰래 설치 · 승인 없음</text><circle cx="845" cy="375" r="16" fill="#ff7b72"/><path d="M838 368 l14 14 M852 368 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="561" y="354" width="258" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="434" width="380" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="457.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">내 통신이거나 승인된 범위만 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="430" width="388" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">테스트용 PC와 다른 사람의 PC가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 PC에서 가짜 데이터를 보는 것은 괜찮아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남의 PC에 몰래 도구를 깔면 안 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">봐도 되는 통신은 내 것이거나 승인된 것뿐이에요</text></g>

