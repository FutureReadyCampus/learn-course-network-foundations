<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>요청 본문 4MB의 정체</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">요청 본문 4MB의 정체</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">파일을 글자로 바꾸면 크기가 약 4/3배가 돼요</text>
<rect x="90" y="215" width="80" height="100" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="106" y="233" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="106" y="249" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="106" y="265" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="106" y="281" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="106" y="297" width="48" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><text x="130" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">가짜 견적서</text><text x="130" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">3MB</text><rect x="816" y="225" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="235" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="259" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="283" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="144" width="280" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">가짜 견적서 하나를 올려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="265" x2="325" y2="265" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="202" y="209" width="100" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="252" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">base64</text><rect x="330" y="210" width="300" height="110" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">요청 본문</text><text x="480" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">파일 이름</text><text x="480" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">+ 긴 base64 글자</text><text x="480" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">약 4MB (3MB의 4/3배)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="206" width="308" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="376" width="320" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="398.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">되돌리면 원본 파일과 같아요</text><circle cx="300" cy="392" r="16" fill="#7ee7c7"/><path d="M292 392 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="371" width="328" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="630" y1="265" x2="812" y2="265" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="680,265;680,265;780,265;780,265" keyTimes="0.000;0.775;0.975;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="435" width="500" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">견적서 파일 전체가 외부 클라우드 저장소로 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="226" y="431" width="508" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 가짜 견적서 3MB를 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청 본문에는 base64 글자로 바뀌어 들어가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">base64를 되돌리면 원본 파일과 같아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 견적서 파일 전체가 클라우드 저장소로 가요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>