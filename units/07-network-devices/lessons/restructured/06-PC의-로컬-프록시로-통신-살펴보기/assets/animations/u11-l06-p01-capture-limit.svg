Name="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="570,230;570,230;800,230;800,230" keyTimes="0.000;0.138;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="58" y="188" width="104" height="72" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><ellipse cx="295" cy="160" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="295" cy="160" r="7" fill="#ffb454"/><line x1="295" y1="178" x2="295" y2="222" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><text x="295" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">패킷 캡처 도구</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="258" y="132" width="74" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="150" y="350" width="190" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="245.0" y="381.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">IP 헤더</text><circle cx="316" cy="375" r="16" fill="#7ee7c7"/><path d="M308 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="350" y="350" width="190" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="445.0" y="381.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">TCP 헤더</text><circle cx="516" cy="375" r="16" fill="#7ee7c7"/><path d="M508 375 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="550" y="350" width="260" height="50" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="680.0" y="381.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">Payload (HTTPS)</text><circle cx="786" cy="375" r="16" fill="#ff7b72"/><path d="M779 368 l14 14 M793 368 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="346" width="268" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="423" width="320" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">잡는 것과 읽는 것은 달라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="417" width="328" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">플러그인 요청이 회사 프록시를 거쳐 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 PC에서 패킷을 캡처해 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더는 읽히지만 내용은 암호문이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 보려면 중계 지점이 필요해요</text></g>

