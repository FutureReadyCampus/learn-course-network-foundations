<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>127.0.0.1:8080은 어디로 갈까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">127.0.0.1:8080은 어디로 갈까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">먼저 이 PC의 8080번 포트에 들르라는 뜻이에요</text>
<rect x="40" y="130" width="620" height="300" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="350.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">지우 PC</text><rect x="135.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="55" y="199" width="290" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">프록시 칸: 127.0.0.1:8080</text><rect x="430" y="232" width="160" height="150" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="510" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">8080번 포트</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="445.0" y="297.0" width="130" height="56" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="510" y="331.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프록시 도구</text><text x="510" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">켜져 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="445" y="292" width="130" height="66" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="2" stroke-dasharray="8 6"/><text x="510" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">비어 있어요</text><text x="510" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">꺼져 있어요</text></g><ellipse cx="830" cy="300" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="830" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><line x1="660" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="265" y1="300" x2="430" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,300;300,300;395,300;395,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,300;300,300;395,300;395,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="263" y="334" width="150" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="338" y="355.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">밖으로 안 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="228" width="168" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="590" cy="232" r="16" fill="#7ee7c7"/><path d="M582 232 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="228" width="168" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="590" cy="232" r="16" fill="#ff7b72"/><path d="M583 225 l14 14 M597 225 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="438" width="400" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">도구가 켜졌는지, 포트가 같은지 먼저 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="434" width="408" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저 프록시 칸에 127.0.0.1:8080을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결은 PC 밖으로 나가지 않고 8080번 포트로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구가 꺼져 있으면 8080번 포트가 비어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모든 사이트가 안 열리면 도구와 포트부터 봐요</text></g>

