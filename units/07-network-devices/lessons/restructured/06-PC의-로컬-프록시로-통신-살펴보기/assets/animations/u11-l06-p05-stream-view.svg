<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>조각 대신 요청 한 건으로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">조각 대신 요청 한 건으로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프록시는 이어 붙은 Stream을 읽어요</text>
<rect x="148" y="176" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M148 178 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="170" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">조각 ①</text><rect x="303" y="176" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M303 178 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="325" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">조각 ②</text><rect x="458" y="176" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 178 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="480" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">조각 ③</text><rect x="613" y="176" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M613 178 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="635" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">조각 ④</text><rect x="768" y="176" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M768 178 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="790" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">조각 ⑤</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="126" width="380" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="148.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">요청 한 건이 조각 여러 개로 나뉘어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="268" width="390" height="160" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><ellipse cx="125" cy="297" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="125" cy="297" r="7" fill="#ffb454"/><text x="280" y="303" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">캡처 도구가 보는 것</text><rect x="90" y="322" width="330" height="30" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="255.0" y="342.76" text-anchor="middle" font-size="16" font-weight="700" fill="#3d4b60">조각 ①</text><rect x="90" y="358" width="330" height="30" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="255.0" y="378.76" text-anchor="middle" font-size="16" font-weight="700" fill="#3d4b60">조각 ②</text><rect x="90" y="394" width="330" height="26" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="255.0" y="412.76" text-anchor="middle" font-size="16" font-weight="700" fill="#3d4b60">… 수천 줄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="264" width="398" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="510" y="268" width="390" height="160" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="705" y="303" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">프록시가 보는 것</text><rect x="540" y="328" width="250" height="70" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="665.0" y="370.92" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">요청 1건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="264" width="398" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="840" cy="363" r="16" fill="#7ee7c7"/><path d="M832 363 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="820" y="345" width="40" height="32" rx="5" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><path d="M829 345 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ff7b72" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="440" width="400" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="462.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">이어 붙여도 TLS 암호문이면 못 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="435" width="408" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청 한 건이 패킷 조각으로 나뉘어 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">캡처 도구는 조각을 그대로 찍어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시는 이어 붙인 Stream을 요청 한 건으로 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이어 붙이는 것과 암호를 푸는 것은 달라요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>