<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>우회 · 회사 · 로컬, 같은 모양일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">우회 · 회사 · 로컬, 같은 모양일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">프록시 세 개를 나란히 비교해요</text>
<rect x="105.0" y="135.0" width="150" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="180" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">클라이언트</text><rect x="405.0" y="135.0" width="150" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="705.0" y="135.0" width="150" height="50" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="780" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">서버</text><line x1="255" y1="160" x2="405" y2="160" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="555" y1="160" x2="705" y2="160" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="198" width="500" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">뼈대는 하나: 연결 둘, 그 사이에서 Stream 전달</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="96" y="126" width="768" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="300" y="247" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">어디에 있나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="680" y="247" text-anchor="start" font-size="15" font-weight="700" fill="#9aa3b2">누가 관리하나</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="255" width="840" height="52" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="80" y="288" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">무료 우회 프록시</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="300" y="287" text-anchor="start" font-size="17" fill="#e6e8ec">회사 밖 인터넷</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="680" y="287" text-anchor="start" font-size="17" font-weight="700" fill="#ff7b72">모르는 외부 운영자</text><circle cx="880" cy="281" r="16" fill="#ff7b72"/><path d="M873 274 l14 14 M887 274 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="315" width="840" height="52" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="80" y="348" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">회사 프록시</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="300" y="347" text-anchor="start" font-size="17" fill="#e6e8ec">사내 서버실 192.168.10.5:8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="680" y="347" text-anchor="start" font-size="17" font-weight="700" fill="#7ee7c7">회사 IT·보안 담당</text><circle cx="880" cy="341" r="16" fill="#7ee7c7"/><path d="M872 341 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="375" width="840" height="52" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="80" y="408" text-anchor="start" font-size="19" font-weight="700" fill="#e6e8ec">로컬 프록시</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="300" y="407" text-anchor="start" font-size="17" fill="#e6e8ec">분석하는 PC 안 127.0.0.1:8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="680" y="407" text-anchor="start" font-size="17" font-weight="700" fill="#7ee7c7">그 PC를 쓰는 사람</text><circle cx="880" cy="401" r="16" fill="#7ee7c7"/><path d="M872 401 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="224" width="388" height="214" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="666" y="224" width="243" height="214" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="160" y="438" width="640" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">어디에 · 누가 · TLS는 누가 · 무엇을 기록, 네 가지만 물어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="156" y="432" width="648" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 프록시 모두 뼈대는 같아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">놓인 자리가 서로 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">누가 관리하느냐가 성격을 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 프록시를 만나면 네 가지를 물어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>