<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내 PC 안에 중계소 세우기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내 PC 안에 중계소 세우기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">도구가 통역사처럼 요청을 받아 적고 전달해요</text>
<rect x="40" y="135" width="560" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="320.0" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">지우 PC</text><rect x="55.0" y="250.0" width="150" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="130" y="291.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">AI 플러그인</text><rect x="816" y="245" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="255" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="279" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="303" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="205" y1="285" x2="810" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="615" y="198" width="230" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="730" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">요청이 바로 나가요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="245,285;245,285;770,285;770,285" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="345.0" y="250.0" width="150" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="420" y="291.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로컬 프록시</text><line x1="205" y1="285" x2="345" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="495" y1="285" x2="810" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="246" width="158" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="250,285;250,285;305,285;305,285" keyTimes="0.000;0.263;0.362;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="535,285;535,285;770,285;770,285" keyTimes="0.000;0.388;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="80" y="365" width="440" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="290" y="394" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">요청 한 건씩 URL · 헤더 · 본문이 남아요</text><circle cx="494" cy="387" r="16" fill="#7ee7c7"/><path d="M486 387 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="76" y="361" width="448" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="435" width="360" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="458.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">PC 안에 프록시가 하나 더 생겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="431" width="368" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">플러그인은 AI 서비스와 바로 이야기해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC 안에 로컬 프록시를 먼저 거치게 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 한 건씩 목록으로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시 하나가 더 생기는 구조예요</text></g>

