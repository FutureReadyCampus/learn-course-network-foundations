<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTPS를 여는 방법: 연결 둘</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTPS를 여는 방법: 연결 둘</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">도구가 앱과 저장소 서비스를 따로 상대해요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="165" y1="290" x2="816" y2="290" stroke="#c792ea" stroke-width="8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="165" y1="290" x2="385" y2="290" stroke="#6ea8fe" stroke-width="5"/><line x1="575" y1="290" x2="816" y2="290" stroke="#7ee7c7" stroke-width="5"/></g><rect x="55.0" y="255.0" width="110" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="110" y="296.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">앱</text><rect x="385.0" y="255.0" width="190" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="296.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프록시 도구</text><rect x="816" y="250" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="260" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="284" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="308" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="460" y="186" width="40" height="32" rx="5" fill="#171a21" stroke="#c792ea" stroke-width="3"/><path d="M469 186 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#c792ea" stroke-width="3"/><rect x="330" y="358" width="300" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">암호문을 그대로 흘려보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="255" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M264 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#6ea8fe" stroke-width="3"/><rect x="220" y="229" width="110" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="275" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">연결 ①</text><rect x="675" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M684 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="640" y="229" width="110" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="695" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">연결 ②</text><rect x="315" y="358" width="330" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="381.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">TLS를 두 연결에서 따로 맺어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="381" y="251" width="198" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="255" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M264 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#6ea8fe" stroke-width="3"/><rect x="220" y="229" width="110" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="275" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">연결 ①</text><rect x="675" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M684 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="640" y="229" width="110" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="695" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">연결 ②</text><rect x="300" y="350" width="360" height="46" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="465" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">도구 안에서만 평문이 보여요</text><circle cx="633" cy="373" r="16" fill="#7ee7c7"/><path d="M625 373 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="346" width="368" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="428" width="400" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="451.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">내용을 보려면 TLS를 따로 맺어야 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="424" width="408" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음엔 도구가 암호문을 그대로 전달하는 관이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구가 연결 ①②에서 TLS를 따로 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그러면 도구 안에서만 평문이 드러나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 보려면 TLS를 두 연결에서 따로 맺어요</text></g>

