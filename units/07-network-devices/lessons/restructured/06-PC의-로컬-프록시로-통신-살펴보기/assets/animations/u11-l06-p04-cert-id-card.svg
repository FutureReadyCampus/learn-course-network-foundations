<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>인증서는 신분증이에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">인증서는 신분증이에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">회사 출입 경비가 신분증을 확인하듯이 해요</text>
<rect x="76" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="66,262 154,262 162,274 58,274" fill="#6ea8fe"/><text x="110" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC의 앱</text><rect x="816" y="210" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="220" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="244" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="268" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">저장소 서비스</text><line x1="165" y1="250" x2="800" y2="250" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="225" y="173" width="210" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="330" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">당신이 누구죠?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="221" y="165" width="218" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="150" width="290" height="190" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서비스 주소: files.example</text><text x="480" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">그 서비스의 공개 키</text><circle cx="400" cy="300" r="20" fill="none" stroke="#c792ea" stroke-width="3"/><text x="535" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">발급 기관 도장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="146" width="298" height="198" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="150" width="460" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">경비실 명단(신뢰 목록)과 맞춰 봐요</text><text x="500" y="250" text-anchor="middle" font-size="18" fill="#e6e8ec">도장 찍은 기관이 명단에 있다</text><circle cx="285" cy="244" r="16" fill="#7ee7c7"/><path d="M277 244 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="500" y="305" text-anchor="middle" font-size="18" fill="#e6e8ec">이름이 찾아간 주소와 같다</text><circle cx="285" cy="299" r="16" fill="#7ee7c7"/><path d="M277 299 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="246" y="146" width="468" height="198" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="460" y="186" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M469 186 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="280" y="343" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="366.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">통과하면 암호 대화를 시작해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="335" width="408" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱이 서버에게 "당신이 누구죠?" 하고 물어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 신분증(인증서)을 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱이 명단에서 도장과 이름을 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통과하면 그때부터 암호로 말해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>