<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내 PC 안에 중계소 세우기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내 PC 안에 중계소 세우기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">로컬 프록시는 프록시 하나가 더 생기는 거예요</text>
<rect x="40" y="135" width="520" height="290" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="300.0" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">지우 PC 192.168.10.41</text><rect x="65.0" y="250.0" width="150" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="140" y="291.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">AI 플러그인</text><rect x="816" y="245" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="255" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="279" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="303" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 AI API</text><text x="850" y="367" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80:443</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="215" y1="285" x2="810" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="600" y="204" width="220" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="710" y="226.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">요청이 바로 나가요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="220,285;220,285;790,285;790,285" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350.0" y="250.0" width="160" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="430" y="291.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">로컬 프록시</text><text x="430" y="342.0" text-anchor="middle" font-size="15" fill="#9aa3b2">127.0.0.1:8080</text><line x1="215" y1="285" x2="350" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="510" y1="285" x2="810" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="246" width="168" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="220,285;220,285;345,285;345,285" keyTimes="0.000;0.263;0.362;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="515,285;515,285;790,285;790,285" keyTimes="0.000;0.388;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="85" y="375" width="430" height="42" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="280" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">요청 한 건씩 URL · 헤더 · 본문 목록</text><circle cx="490" cy="396" r="16" fill="#7ee7c7"/><path d="M482 396 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="81" y="371" width="438" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="434" width="480" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">내 PC · 승인된 범위만, 가짜 평면도로 실험해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="231" y="427" width="498" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">플러그인은 AI 서비스와 바로 이야기해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC 안에 로컬 프록시를 먼저 세워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 한 건씩 목록으로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 통신이거나 승인된 범위만 봐요</text></g>

