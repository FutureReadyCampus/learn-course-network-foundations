<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>경고는 TLS가 일하는 증거</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">경고는 TLS가 일하는 증거</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">신뢰는 PC 주인이 직접 준 것에서 나와요</text>
<rect x="40" y="130" width="880" height="295" rx="16" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="480.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">지우 PC</text><rect x="115.0" y="225.0" width="110" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="170" y="266.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">앱</text><rect x="675.0" y="225.0" width="190" height="70" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="770" y="266.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">프록시 도구</text><line x1="225" y1="260" x2="675" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="440" y="236" width="60" height="48" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><rect x="450" y="246" width="40" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="450" y="256" width="26" height="5" rx="2" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><circle cx="486" cy="270" r="8" fill="#ffb454"/><text x="470" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">도구가 서명한 인증서</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="330" r="16" fill="#ff7b72"/><path d="M163 323 l14 14 M177 323 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="70" y="369" width="200" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="170" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">모르는 발급자예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="111" y="221" width="118" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="330" r="16" fill="#7ee7c7"/><path d="M162 330 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="60" y="369" width="220" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">인증서를 받아들여요</text><rect x="330" y="335" width="300" height="70" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">PC의 신뢰 목록</text><text x="480" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">도구의 루트 인증서</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="331" width="308" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="440" width="380" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="463.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">분석이 끝나면 신뢰 목록에서 지워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="436" width="388" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구가 자기 루트 인증서로 서명한 인증서를 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">앱은 모르는 발급자라며 경고를 띄워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC 주인이 루트 인증서를 신뢰 목록에 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">분석이 끝나면 신뢰 목록에서 지워요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>