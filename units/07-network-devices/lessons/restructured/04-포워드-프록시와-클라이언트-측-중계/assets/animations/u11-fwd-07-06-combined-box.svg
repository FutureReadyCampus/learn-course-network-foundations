<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>보호 기능을 함께 두기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">보호 기능을 함께 두기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">한 장비 안에 여러 기능이 들어가요</text>
<rect x="280" y="140" width="400" height="230" rx="18" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">보안 장비 한 대</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="210" width="160" height="56" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="390.0" y="245.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">IPS</text><text x="390" y="296" text-anchor="middle" font-size="15" fill="#9aa3b2">경로에서 패킷 검사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="490" y="210" width="160" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="570.0" y="245.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">Proxy</text><text x="570" y="296" text-anchor="middle" font-size="15" fill="#9aa3b2">연결을 받아 중계</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="413" width="360" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">한 상자여도 처리 경로는 따로 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="320" width="320" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="341.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">데이터가 어디로 들어와 나가나?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">물리적으로는 한 장비예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">어떤 기능은 패킷을 경로에서 검사하고</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">어떤 기능은 연결을 받아 중계해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경로를 도식으로 그려 보면 정확해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>