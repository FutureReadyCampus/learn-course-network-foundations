<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>우회에 따른 속도와 비용</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">우회에 따른 속도와 비용</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">편리하지만 거치는 길이 늘어요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="170" y1="300" x2="800" y2="300" stroke="#9aa3b2" stroke-width="5" stroke-dasharray="10 8"/><rect x="405" y="238" width="150" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">한 번에 도착</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="425" y="260" width="110" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Proxy</text><line x1="170" y1="300" x2="425" y2="300" stroke="#6ea8fe" stroke-width="5"/><line x1="535" y1="300" x2="800" y2="300" stroke="#7ee7c7" stroke-width="5"/><rect x="250" y="238" width="100" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">① 이동</text><rect x="620" y="238" width="100" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="670" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">② 이동</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="393" width="330" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">경로가 늘어 느려질 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="225" r="16" fill="#ff7b72"/><path d="M473 218 l14 14 M487 218 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="330" y="393" width="300" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">Proxy 장애 → 접속에 영향</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="225" r="16" fill="#7ee7c7"/><path d="M472 225 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="320" y="393" width="320" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">가깝고 캐시하면 도움이 돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 가면 한 번에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Proxy를 거치면 단계가 늘어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Proxy가 멈추면 모두 영향을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">잘 두면 오히려 도움이 될 수도 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>