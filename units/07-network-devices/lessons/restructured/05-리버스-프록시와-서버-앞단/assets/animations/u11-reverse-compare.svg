<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Reverse Proxy로 서버 보호</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Reverse Proxy로 서버 보호</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">대신하는 방향이 달라요</text>
<rect x="330" y="120" width="250" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="455.0" y="144.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">누구를 대신하나?</text><rect x="600" y="120" width="250" height="36" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/><text x="725.0" y="144.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">어디로 전달하나?</text><g><rect x="90" y="168" width="220" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="200.0" y="205.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Forward Proxy</text><rect x="330" y="168" width="250" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="455.0" y="204.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">내 컴퓨터 대신 →</text><rect x="600" y="168" width="250" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="725.0" y="204.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">외부 서버</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="244" width="220" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="200.0" y="281.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">Reverse Proxy</text><rect x="330" y="244" width="250" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="455.0" y="280.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">서버 대신 ←</text><rect x="600" y="244" width="250" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="725.0" y="280.84" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">외부 요청 받기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="333" width="440" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="356.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서버 앞 Reverse Proxy: 외부 → 내부 서버</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="110" y="395" width="250" height="46" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="235.0" y="424.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">경로 안에서 처리</text><rect x="380" y="395" width="250" height="46" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="505.0" y="424.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">복사본 관찰</text><rect x="650" y="395" width="250" height="46" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="775.0" y="424.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">연결 대신 중계</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Forward는 내 요청을 밖으로 대신 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Reverse는 서버 앞에서 요청을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">누굴 대신하는지 보면 헷갈리지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Unit의 세 가지 구조를 구별해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>