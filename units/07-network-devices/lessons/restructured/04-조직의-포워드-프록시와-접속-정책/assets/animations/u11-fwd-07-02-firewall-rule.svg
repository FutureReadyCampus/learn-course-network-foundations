<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Proxy를 통한 외부 접속</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Proxy를 통한 외부 접속</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 연결은 막고 Proxy만 열어요</text>
<text x="250" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">누가 시작한 연결?</text><text x="560" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">방화벽 정책</text><g><rect x="100" y="170" width="300" height="60" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="250.0" y="207.2" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">공용 PC → 외부 사이트</text><rect x="420" y="170" width="280" height="60" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="560.0" y="207.92" text-anchor="middle" font-size="22" font-weight="700" fill="#ff7b72">차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="100" y="250" width="300" height="60" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/><text x="250.0" y="287.2" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">Proxy → 외부 사이트</text><rect x="420" y="250" width="280" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="560.0" y="287.92" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">허용 (필요한 곳만)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="353" width="380" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="376.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">접속이 한곳으로 모여 정책이 쉬워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="353" width="500" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="376.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">Proxy 서버가 병목·위험 지점이 될 수도 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공용 PC의 직접 외부 연결은 차단해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Proxy가 시작한 연결만 허용해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접속이 한곳으로 모여 관리하기 쉬워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Proxy 자체의 보안·용량도 챙겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>