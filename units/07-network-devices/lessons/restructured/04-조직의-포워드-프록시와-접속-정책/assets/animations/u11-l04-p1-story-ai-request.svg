 x="257" y="267" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="257" y="280" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="275" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">센서 보고서</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="720.0" y="199" width="190" height="112" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><circle cx="815" cy="237" r="16" fill="#7ee7c7"/><path d="M807 237 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="807" y="311" width="16" height="14" fill="#3d4b60"/><rect x="779" y="325" width="72" height="7" rx="3" fill="#3d4b60"/><rect x="761" y="344" width="109" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="815" y="366.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">박 팀장 PC</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="761" y="344" width="109" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="815" y="366.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">박 팀장 PC</text><rect x="690.0" y="200" width="250" height="110" rx="10" fill="#171a21" stroke="#e07b54" stroke-width="3"/><rect x="690.0" y="200" width="250" height="30" rx="10" fill="#e07b54" fill-opacity="0.35"/><text x="704.0" y="221" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">프록시</text><rect x="704.0" y="246" width="222" height="44" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="815" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">처음 보는 서버 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="19