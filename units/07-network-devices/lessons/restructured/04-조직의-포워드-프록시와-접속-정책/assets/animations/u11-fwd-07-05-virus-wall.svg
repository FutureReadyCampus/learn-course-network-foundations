<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Virus Wall과 내부 보호</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Virus Wall과 내부 보호</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">웹 통신을 중계하며 파일을 걸러요</text>
<rect x="76" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="86" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="86" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="86" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="110" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 서버</text><rect x="816" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="271" width="52" height="32" fill="#3d4b60"/><rect x="845" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="320" width="44" height="5" fill="#6ea8fe"/><text x="850" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내부 PC</text><rect x="450" y="160" width="60" height="280" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text transform="rotate(-90 480 300)" x="480" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">Virus Wall</text><g><rect x="190" y="224" width="40" height="52" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="210" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">PDF</text><rect x="190" y="324" width="40" height="52" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="210" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">PDF</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="210,250;210,250;780,250;780,250" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-20" y="-26" width="40" height="52" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee7c7">PDF</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="430" cy="350" r="16" fill="#ff7b72"/><path d="M423 343 l14 14 M437 343 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="360" y="324" width="40" height="52" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="380" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b72">PDF</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="113" width="320" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="136.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">위험한 파일은 안에 못 들어가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="114" width="560" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="136.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">IPS는 패킷, Proxy는 Stream — 기능은 겹칠 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">밖에서 파일 두 개가 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안전한 파일은 안으로 전달돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위험한 파일은 벽에서 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IPS와 Proxy는 역할이 겹칠 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>