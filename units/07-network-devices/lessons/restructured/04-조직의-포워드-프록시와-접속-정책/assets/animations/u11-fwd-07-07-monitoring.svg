<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>내부 사용자의 통신 감시</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">내부 사용자의 통신 감시</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">점검과 감시는 한 끗 차이예요</text>
<rect x="76" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="271" width="52" height="32" fill="#3d4b60"/><rect x="105" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="320" width="44" height="5" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">공용 PC</text><rect x="425" y="260" width="110" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">내부 Proxy</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 사이트</text><line x1="170" y1="300" x2="425" y2="300" stroke="#6ea8fe" stroke-width="5"/><line x1="535" y1="300" x2="800" y2="300" stroke="#7ee7c7" stroke-width="5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><ellipse cx="480" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="190" r="7" fill="#ffb454"/><rect x="395" y="128" width="170" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="151.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">정책 위반 점검</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="250" cy="215" r="16" fill="#ffb454"/><text x="250" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><rect x="165" y="158" width="170" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="250" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">개인 검색까지?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="275" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="330" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">목적</text><rect x="425" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">범위</text><rect x="575" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="630" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">알리는 방식</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모든 요청이 내부 Proxy로 모여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">운영자는 접속 흐름을 점검할 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하지만 개인 검색까지 남으면 사생활 문제예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적·범위·안내를 함께 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>