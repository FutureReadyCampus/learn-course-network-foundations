한 구간</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="161" y="166" width="653" height="38" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="175,185;175,185;790,185;790,185" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="165" y1="360" x2="810" y2="360" stroke="#6ea8fe" stroke-width="4"/><rect x="405.0" y="325.0" width="150" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="366.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="235" y="294" width="120" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="295" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">구간 ①</text><rect x="605" y="294" width="120" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="665" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">구간 ②</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="401" y="321" width="158" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="345" y="250" width="270" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="272.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">읽고 · 확인하고 · 기록해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="341" y="245" width="278" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="228" y="346" width="44" height="28" rx="5" fill="#c792ea"/><path d="M228 348 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="283" y="346" width="44" height="28" rx="5" fill="#c792ea"/><path d="M283 348 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="338" y="346" width="44" height="28" rx="5" fill="#c792ea"/><path d="M338 348 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="280" y="431" width="400" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="454.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">사람이 몰리면 대기 시간이 더해져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="216" y="336" width="183" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 가면 한 구간만 지나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시를 거치면 구간이 둘로 늘어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 요청을 읽고 확인하고 기록해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사람이 몰리면 모든 요청이 더 기다려요</text></g>

