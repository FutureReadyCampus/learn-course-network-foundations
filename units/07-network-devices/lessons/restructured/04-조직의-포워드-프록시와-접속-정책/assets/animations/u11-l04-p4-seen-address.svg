<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>AI 서비스에 보이는 주소는?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">AI 서비스에 보이는 주소는?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">접속 방법마다 AI 서비스가 보는 주소를 비교해요</text>
<rect x="56" y="296" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="303" width="52" height="30" fill="#3d4b60"/><polygon points="46,342 134,342 142,354 38,354" fill="#6ea8fe"/><text x="90" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="90" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="405.0" y="295.0" width="130" height="70" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="470" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">경계 장비</text><text x="470" y="387.0" text-anchor="middle" font-size="16" fill="#9aa3b2">공인 주소 198.51.100.25</text><rect x="836" y="290" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="846" y="300" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="846" y="324" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="846" y="348" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="870" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><line x1="145" y1="330" x2="405" y2="330" stroke="#6ea8fe" stroke-width="4"/><line x1="535" y1="330" x2="835" y2="330" stroke="#6ea8fe" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="200.0" y="295.0" width="120" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260" y="336.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><text x="260" y="387.0" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="291" width="128" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="610.0" y="295.0" width="140" height="70" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="680" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">해외 프록시</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="150" width="240" height="70" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="820" y="176" text-anchor="middle" font-size="16" fill="#9aa3b2">AI 서비스에 보이는 주소</text><text x="820" y="206" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">198.51.100.25</text><line x1="870" y1="220" x2="870" y2="288" stroke="#7ee7c7" stroke-width="3"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="146" width="248" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="150" width="240" height="70" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="820" y="176" text-anchor="middle" font-size="16" fill="#9aa3b2">AI 서비스에 보이는 주소</text><text x="820" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">해외 프록시 서버의 주소</text><line x1="870" y1="220" x2="870" y2="288" stroke="#ffb454" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="255" y="433" width="450" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">주소가 바뀌어도 로그인하면 누구인지 알아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="251" y="427" width="458" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 접속하면 본사 공인 주소가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 프록시를 거쳐도 같은 주소가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">해외 프록시를 거치면 그 서버 주소가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소가 바뀐다고 신원이 숨는 건 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>