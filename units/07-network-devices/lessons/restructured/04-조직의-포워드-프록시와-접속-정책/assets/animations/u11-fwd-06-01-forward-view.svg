<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Proxy를 사용하는 관점</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Proxy를 사용하는 관점</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직접 나갈까, 한 곳을 거칠까?</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 컴퓨터</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="170" y1="300" x2="800" y2="300" stroke="#9aa3b2" stroke-width="5" stroke-dasharray="10 8"/><rect x="415" y="238" width="130" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="261.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">직접 연결</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="425" y="260" width="110" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Proxy</text><line x1="170" y1="300" x2="425" y2="300" stroke="#6ea8fe" stroke-width="5"/><line x1="535" y1="300" x2="800" y2="300" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="360" y="198" width="240" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">한 중계 서버를 거쳐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="198" width="200" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">요청을 대신 전달</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="205" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="260" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">캐시</text><rect x="335" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="390" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">접근 정책</text><rect x="465" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="520" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">기록</text><rect x="595" y="393" width="110" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="650" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">내용 검사</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음엔 컴퓨터마다 직접 인터넷으로 나갈 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 중계 서버를 거치게 할 수도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 고른 중계자가 대신 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">캐시·정책·기록은 그 위에 얹는 기능이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>