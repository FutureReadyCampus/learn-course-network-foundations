<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>프록시에는 연결이 두 개예요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">프록시에는 연결이 두 개예요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">박 팀장 PC가 프록시를 거쳐 클라우드 저장소에 접속해요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="110" y="372" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="415.0" y="265.0" width="130" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><text x="480" y="357.0" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.5</text><rect x="826" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><text x="860" y="384" text-anchor="middle" font-size="16" fill="#9aa3b2">203.0.113.80</text><line x1="165" y1="300" x2="415" y2="300" stroke="#6ea8fe" stroke-width="4"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="545" y1="300" x2="815" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="545" y1="300" x2="815" y2="300" stroke="#7ee7c7" stroke-width="4"/></g><g><rect x="195" y="228" width="190" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="290" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">① PC ↔ 프록시</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="161" y="281" width="258" height="38" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="565" y="228" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="680" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">② 프록시 ↔ 저장소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="541" y="281" width="278" height="38" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="290" y="340" text-anchor="middle" font-size="16" fill="#9aa3b2">프록시의 서버 측 소켓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="680" y="340" text-anchor="middle" font-size="16" fill="#9aa3b2">프록시의 클라이언트 측 소켓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="290" y="340" text-anchor="middle" font-size="16" fill="#9aa3b2">도착지 192.168.10.5:8080</text><text x="680" y="340" text-anchor="middle" font-size="16" fill="#9aa3b2">도착지 203.0.113.80:443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,300;180,300;385,300;385,300" keyTimes="0.000;0.512;0.600;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="575,300;575,300;790,300;790,300" keyTimes="0.000;0.637;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="411" y="258" width="138" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="412" width="320" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="437.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">두 연결은 서로 독립이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC가 프록시와 연결을 하나 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시가 클라우드 저장소와 따로 연결을 맺어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한쪽에서 받은 흐름을 다른 쪽에 이어 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">출발지와 도착지가 다른 독립된 연결 둘이에요</text></g>

