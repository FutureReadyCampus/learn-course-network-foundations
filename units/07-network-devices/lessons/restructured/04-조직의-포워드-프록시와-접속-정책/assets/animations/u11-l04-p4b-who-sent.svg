<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>어느 PC가 보냈는지는?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">어느 PC가 보냈는지는?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">직원 모두가 같은 회사 프록시를 거쳐 나가요</text>
<rect x="41" y="166" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="49" y="173" width="52" height="30" fill="#3d4b60"/><polygon points="31,212 119,212 127,224 23,224" fill="#6ea8fe"/><text x="130" y="198" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">지우 PC</text><text x="130" y="220" text-anchor="start" font-size="16" fill="#9aa3b2">192.168.10.41</text><line x1="265" y1="200" x2="375" y2="315" stroke="#6ea8fe" stroke-width="3"/><rect x="41" y="271" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="49" y="278" width="52" height="30" fill="#3d4b60"/><polygon points="31,317 119,317 127,329 23,329" fill="#6ea8fe"/><text x="130" y="303" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="130" y="325" text-anchor="start" font-size="16" fill="#9aa3b2">192.168.10.42</text><line x1="265" y1="305" x2="375" y2="315" stroke="#6ea8fe" stroke-width="3"/><rect x="41" y="376" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="49" y="383" width="52" height="30" fill="#3d4b60"/><polygon points="31,422 119,422 127,434 23,434" fill="#6ea8fe"/><text x="130" y="416" text-anchor="start" font-size="17" font-weight="700" fill="#e6e8ec">다른 직원 PC</text><line x1="265" y1="410" x2="375" y2="315" stroke="#6ea8fe" stroke-width="3"/><rect x="375.0" y="280.0" width="130" height="70" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="440" y="321.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="560.0" y="280.0" width="120" height="70" rx="12" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="620" y="321.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">경계 장비</text><rect x="826" y="275" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="285" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="309" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="333" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="377" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><line x1="505" y1="315" x2="560" y2="315" stroke="#6ea8fe" stroke-width="4"/><line x1="680" y1="315" x2="825" y2="315" stroke="#6ea8fe" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="680" y="120" width="250" height="118" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="694" y="146" text-anchor="start" font-size="17" font-weight="700" fill="#ffb454">AI 서비스 기록</text><text x="694" y="176" text-anchor="start" font-size="17" fill="#ffb454">198.51.100.25</text><text x="694" y="202" text-anchor="start" font-size="17" fill="#ffb454">198.51.100.25</text><text x="694" y="228" text-anchor="start" font-size="17" fill="#ffb454">198.51.100.25</text><line x1="860" y1="238" x2="860" y2="272" stroke="#ffb454" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="676" y="116" width="258" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="120" width="250" height="118" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="344" y="146" text-anchor="start" font-size="17" font-weight="700" fill="#7ee7c7">회사 프록시 기록</text><text x="344" y="176" text-anchor="start" font-size="17" fill="#e6e8ec">192.168.10.41</text><text x="344" y="202" text-anchor="start" font-size="17" fill="#e6e8ec">192.168.10.42</text><text x="344" y="228" text-anchor="start" font-size="17" fill="#e6e8ec">다른 직원 PC</text><line x1="440" y1="238" x2="440" y2="278" stroke="#7ee7c7" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="116" width="258" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="375" y="433" width="450" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="600" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">어느 PC인지는 회사 프록시 기록에서 찾아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직원 PC 여러 대가 회사 프록시를 거쳐 AI 서비스를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">AI 서비스 기록에는 모두 같은 주소로 남아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 프록시 기록에는 PC별로 구분돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래서 어느 PC인지는 회사 기록에서 찾아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>