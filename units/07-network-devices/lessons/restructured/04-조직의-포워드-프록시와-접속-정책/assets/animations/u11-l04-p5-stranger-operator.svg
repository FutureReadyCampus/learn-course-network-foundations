<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>낯선 운영자는 무엇을 볼까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">낯선 운영자는 무엇을 볼까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무료 우회 프록시를 거치는 접속을 따라가 봐요</text>
<rect x="66" y="306" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="313" width="52" height="30" fill="#3d4b60"/><polygon points="56,352 144,352 152,364 48,364" fill="#6ea8fe"/><text x="100" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><rect x="385.0" y="305.0" width="190" height="70" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">무료 우회 프록시</text><text x="480" y="397.0" text-anchor="middle" font-size="16" fill="#9aa3b2">운영자를 알 수 없어요</text><rect x="826" y="300" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="310" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="334" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="358" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><line x1="155" y1="340" x2="385" y2="340" stroke="#6ea8fe" stroke-width="4"/><line x1="575" y1="340" x2="825" y2="340" stroke="#6ea8fe" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="118" width="360" height="150" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="314" y="144" text-anchor="start" font-size="17" font-weight="700" fill="#ffb454">운영자가 보는 것</text><text x="314" y="174" text-anchor="start" font-size="17" fill="#e6e8ec">출발지 주소 198.51.100.25</text><text x="314" y="200" text-anchor="start" font-size="17" fill="#e6e8ec">접속 시각</text><text x="314" y="226" text-anchor="start" font-size="17" fill="#e6e8ec">목적지</text><text x="314" y="252" text-anchor="start" font-size="17" fill="#e6e8ec">데이터 양</text><line x1="480" y1="268" x2="480" y2="303" stroke="#ffb454" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="114" width="368" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="460" y="181" width="40" height="32" rx="5" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><path d="M469 181 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#7ee7c7" stroke-width="3"/><rect x="290" y="228" width="380" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="251.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">경고 없는 HTTPS 내용은 못 읽어요</text><line x1="480" y1="268" x2="480" y2="303" stroke="#7ee7c7" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="286" y="146" width="388" height="133" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="125" width="240" height="82" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="150" y="156" text-anchor="middle" font-size="17" fill="#9aa3b2">회사 프록시 기록</text><text x="150" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#ff7b72">이 접속은 없어요</text><circle cx="235" cy="150" r="16" fill="#ff7b72"/><path d="M228 143 l14 14 M242 143 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="121" width="248" height="90" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="423" width="400" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">업무 자료가 회사 기록 밖으로 나가요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 무료 우회 프록시를 거쳐 개인 클라우드 사이트를 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">운영자는 연결 정보를 거의 언제나 알아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경고 없이 연결된 HTTPS의 내용은 읽지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하지만 회사 기록에는 남지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>