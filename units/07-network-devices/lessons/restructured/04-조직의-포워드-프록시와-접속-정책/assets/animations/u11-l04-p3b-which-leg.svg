<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>어느 구간이 문제일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">어느 구간이 문제일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">끊긴 구간에 따라 오류의 모양이 달라요</text>
<text x="260" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">① 구간이 끊기면</text><text x="720" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#7ee7c7">② 구간이 끊기면</text><rect x="66" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="74" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="56,282 144,282 152,294 48,294" fill="#9aa3b2"/><rect x="210.0" y="232.0" width="100" height="56" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260" y="266.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="386" y="220" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="396" y="230" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="396" y="254" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="396" y="278" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="420" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><line x1="152" y1="260" x2="210" y2="260" stroke="#6ea8fe" stroke-width="4"/><line x1="310" y1="260" x2="385" y2="260" stroke="#7ee7c7" stroke-width="4"/><rect x="526" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="534" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="516,282 604,282 612,294 508,294" fill="#9aa3b2"/><rect x="670.0" y="232.0" width="100" height="56" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="720" y="266.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">프록시</text><rect x="846" y="220" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="856" y="230" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="856" y="254" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="856" y="278" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="880" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><line x1="612" y1="260" x2="670" y2="260" stroke="#6ea8fe" stroke-width="4"/><line x1="770" y1="260" x2="845" y2="260" stroke="#7ee7c7" stroke-width="4"/><text x="181" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">①</text><text x="641" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">①</text><text x="347" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">②</text><text x="807" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">②</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="181" cy="260" r="16" fill="#ff7b72"/><path d="M174 253 l14 14 M188 253 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="148" y="232" width="66" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="380" width="400" height="60" rx="10" fill="#171a21" stroke="#ff7b72" stroke-width="2"/><text x="260" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">브라우저가 프록시에 닿지 못해요</text><text x="260" y="430" text-anchor="middle" font-size="16" fill="#9aa3b2">"프록시 서버에 연결할 수 없다"</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="807" cy="260" r="16" fill="#ff7b72"/><path d="M800 253 l14 14 M814 253 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="766" y="232" width="83" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="520" y="380" width="400" height="60" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/><text x="720" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">프록시가 504 오류를 만들어 돌려줘요</text><text x="720" y="430" text-anchor="middle" font-size="16" fill="#9aa3b2">"다음 서버 응답을 기다리다 시간 초과"</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="220" y="382" width="520" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">프록시 기록에 요청이 있으면 ①은 정상이에요</text><rect x="330" y="428" width="300" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="451.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">그다음 ② 구간을 확인해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시 앞뒤로 연결 두 개가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">① 구간이 끊기면 프록시에 닿지 못해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">② 구간이 끊기면 프록시가 504를 돌려줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프록시 기록에 요청이 있으면 ②를 의심해요</text></g>

