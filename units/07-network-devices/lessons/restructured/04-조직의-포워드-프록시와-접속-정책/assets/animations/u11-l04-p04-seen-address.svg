<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>AI 서비스에는 누구 주소가 보일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">AI 서비스에는 누구 주소가 보일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">접속 방법마다 찍히는 주소를 비교해요</text>
<text x="250" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">접속 방법</text><text x="740" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">AI 서비스에 보이는 주소</text><g><rect x="60" y="160" width="840" height="65" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="85" y="201" text-anchor="start" font-size="21" font-weight="700" fill="#e6e8ec">직접 접속 (회사 경계 NAT를 거쳐요)</text><text x="560" y="203" text-anchor="middle" font-size="28" fill="#9aa3b2">→</text><rect x="615" y="176" width="250" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="740" y="199.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">198.51.100.25</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="156" width="848" height="73" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="245" width="840" height="65" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="85" y="286" text-anchor="start" font-size="21" font-weight="700" fill="#e6e8ec">회사 프록시 192.168.10.5 경유</text><text x="560" y="288" text-anchor="middle" font-size="28" fill="#9aa3b2">→</text><rect x="615" y="260" width="250" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="740" y="284.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="241" width="848" height="73" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="330" width="840" height="65" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="85" y="371" text-anchor="start" font-size="21" font-weight="700" fill="#e6e8ec">해외 우회 프록시 경유</text><text x="560" y="373" text-anchor="middle" font-size="28" fill="#9aa3b2">→</text><rect x="615" y="346" width="250" height="35" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="740" y="369.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">해외 프록시 서버 주소</text><circle cx="884" cy="363" r="16" fill="#ff7b72"/><path d="M877 356 l14 14 M891 356 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="326" width="848" height="73" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="423" width="560" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">주소가 바뀌어도 로그인하면 서비스는 사용자를 알아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="417" width="568" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직접 접속하면 본사 공인 주소가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 프록시를 거쳐도 같은 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">해외 프록시를 거치면 그 서버 주소예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소가 바뀐다고 신원이 숨는 건 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>