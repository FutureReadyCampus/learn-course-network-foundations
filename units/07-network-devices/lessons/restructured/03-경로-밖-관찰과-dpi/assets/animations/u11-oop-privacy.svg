<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>망중립과 사생활의 문제</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">망중립과 사생활의 문제</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">할 수 있다고 모두 해도 되는 건 아니에요</text>
<rect x="370" y="220" width="220" height="90" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="272.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">이용자의 통신</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><ellipse cx="480" cy="165" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="165" r="7" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="343" width="400" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="366.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">열어 보면 악성 단서를 찾을 수 있지만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="550" y="146" width="40" height="32" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><path d="M559 146 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ffb454" stroke-width="3"/><rect x="315" y="343" width="330" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="366.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">사적인 내용까지 보일 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="130" y="384" width="120" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="190" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">수집 목적</text><rect x="305" y="384" width="130" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="370" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">데이터 범위</text><rect x="510" y="384" width="120" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="570" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보관 기간</text><rect x="690" y="384" width="120" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="750" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">접근 권한</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">운영자는 접속을 자세히 보고 싶어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 검사하면 도움이 될 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하지만 이용자의 사생활이 담겨 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목적·범위·기간·권한을 함께 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>