<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>송장과 내용물, DPI</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">송장과 내용물, DPI</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">센서는 복사본의 어디까지 읽을까요</text>
<rect x="300" y="190" width="220" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="410.0" y="242" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">송장</text><text x="410.0" y="274" text-anchor="middle" font-size="17" fill="#9aa3b2">IP·TCP 헤더</text><rect x="530" y="190" width="260" height="120" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="660.0" y="242" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">내용물</text><text x="660.0" y="274" text-anchor="middle" font-size="17" fill="#9aa3b2">Payload (HTTP 요청 등)</text></g><ellipse cx="150" cy="250" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="150" cy="250" r="7" fill="#ffb454"/><text x="150" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서</text><line x1="190" y1="250" x2="296" y2="250" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="395" y="143" width="300" height="34" rx="17" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="545" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">패킷 하나 = 송장 + 내용물</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="186" width="228" height="128" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="295" y="334" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="410" y="356.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">얕은 검사: 송장까지만</text><circle cx="520" cy="186" r="16" fill="#7ee7c7"/><path d="M512 186 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="292" y="182" width="506" height="136" rx="14" fill="none" stroke="#c792ea" stroke-width="5"/><rect x="400" y="334" width="290" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="545" y="356.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">DPI: Payload 안까지 분석</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="640.0" y="226" width="40" height="32" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><path d="M649.0 226 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ffb454" stroke-width="3"/><text x="660.0" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">암호화된 Payload</text><circle cx="784" cy="196" r="16" fill="#ff7b72"/><path d="M777 189 l14 14 M791 189 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="380" y="334" width="330" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="545" y="356.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">TLS 암호는 열쇠 없이 못 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="526" y="186" width="268" height="128" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">패킷은 송장(헤더)과 내용물(Payload)로 이뤄져 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소·포트만 보는 얕은 검사는 송장까지 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">DPI는 송장을 넘어 Payload 안까지 분석해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS로 암호화된 Payload는 센서가 읽지 못해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>