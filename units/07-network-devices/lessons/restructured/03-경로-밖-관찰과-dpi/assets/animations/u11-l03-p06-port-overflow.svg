 stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="600,262;600,262;600,345;600,345" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="680,262;680,262;680,345;680,345" keyTimes="0.000;0.575;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><circle cx="100" cy="250" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M85 244 h28 l-7 -7 M115 256 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="100" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><text x="100" y="322" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.1</text><rect x="348" y="234" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="360" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="377" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="394" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="411" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="428" y="245" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="400" y="290" text-anchor="middle" font-size="17" fill="#9aa3b2">코어 스위치</text><ellipse cx="830" cy="250" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="830" cy="250" r="7" fill="#ffb454"/><text x="255" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">보내기 1Gbps</text><text x="255" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">받기 1Gbps</text><text x="610" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">관찰용 포트 1Gbps</text><text x="830" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="470" y="154" width="280" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="610" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">양방향을 합쳐 최대 2Gbps</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="466" y="234" width="288" height="32" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="640" cy="380" r="16" fill="#ff7b72"/><path d="M633 373 l14 14 M647 373 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="460" y="414" width="300" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="610" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">넘친 만큼 스위치에서 버려져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="466" y="234" width="288" height="32" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="770" y="330" width="16" height="26" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><rect x="792" y="330" width="16" height="26" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><rect x="814" y="330" width="16" height="26" rx="3" fill="#171a21" stroke="#ff7b72" stroke-width="2"/><rect x="836" y="330" width="16" height="26" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><rect x="858" y="330" width="16" height="26" rx="3" fill="#171a21" stroke="#ff7b72" stroke-width="2"/><rect x="880" y="330" width="16" height="26" rx="3" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">센서 기록에 빈틈</text><circle cx="150" cy="222" r="16" fill="#7ee7c7"/><path d="M142 222 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="240" y="424" width="380" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="430" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">원본은 그대로, 비는 건 센서 기록뿐</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="766" y="326" width="134" height="34" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회선의 보내기·받기 통신이 스위치를 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양방향 복사를 합치면 최대 2Gbps가 한 포트로 몰려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1Gbps 포트가 넘치면 스위치가 그만큼 버려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본 통신은 그대로이고 센서 기록만 비어요</text></g>

