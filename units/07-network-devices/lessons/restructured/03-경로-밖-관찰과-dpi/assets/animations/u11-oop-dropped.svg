<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>놓치지 않고 수집하는 문제</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">놓치지 않고 수집하는 문제</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">복사본이 전부라고 보장되지는 않아요</text>
<g><rect x="128" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M128 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="183" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M183 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="238" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M238 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="293" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M293 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="348" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M348 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="403" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M403 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="190" y="218" width="220" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="241.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">신청이 한꺼번에 몰려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="620" y="250" width="170" height="100" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="705" y="308" text-anchor="middle" font-size="22" font-weight="700" fill="#c792ea">센서</text><line x1="530" y1="300" x2="596" y2="300" stroke="#9aa3b2" stroke-width="4"/><polygon points="610,300 594,291 594,309" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="205" cy="360" r="16" fill="#ff7b72"/><path d="M198 353 l14 14 M212 353 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="315" cy="360" r="16" fill="#ff7b72"/><path d="M308 353 l14 14 M322 353 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="425" cy="360" r="16" fill="#ff7b72"/><path d="M418 353 l14 14 M432 353 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="160" y="394" width="280" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="300" y="416.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">못 받은 패킷은 기록에 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="414" width="560" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">미러링 설정뿐 아니라 포트 속도·드롭 카운터도 점검해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">짧은 시간에 패킷이 몰려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서가 그 속도로 받아야 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">못 따라가면 일부가 누락돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">켰는지만 말고 드롭 여부도 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>