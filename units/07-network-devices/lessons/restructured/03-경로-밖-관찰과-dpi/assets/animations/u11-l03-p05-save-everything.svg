<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>다 저장하면 생기는 일</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">다 저장하면 생기는 일</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">볼 수 있다고 모두 저장해도 되는 건 아니에요</text>
<line x1="155" y1="190" x2="790" y2="190" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="66" y="156" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="163" width="52" height="30" fill="#3d4b60"/><polygon points="56,202 144,202 152,214 48,214" fill="#6ea8fe"/><text x="100" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직원 PC</text><ellipse cx="860" cy="190" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="860" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="235" y="174" width="130" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">업무 통신</text><rect x="435" y="174" width="130" height="33" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="500" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">사적 통신</text><text x="500" y="232" text-anchor="middle" font-size="15" fill="#9aa3b2">병원 예약 · 은행 알림</text><circle cx="400" cy="190" r="12" fill="#c792ea"/><line x1="400" y1="202" x2="400" y2="300" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><ellipse cx="400" cy="325" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="400" cy="325" r="7" fill="#ffb454"/><text x="400" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="556" y="264" width="338" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="556" y="264" width="338" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="560" y="268" width="330" height="150" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="725" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">센서 저장소</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="430" y1="325" x2="556" y2="325" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 6"/><rect x="630" y="329" width="190" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="725" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">업무 통신</text><rect x="630" y="374" width="190" height="32" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="725" y="395.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">사적 통신</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="900" cy="268" r="16" fill="#ff7b72"/><path d="M893 261 l14 14 M907 261 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="320" y="439" width="320" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">사생활·통신 비밀을 건드려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="430" y1="325" x2="556" y2="325" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="6 6"/><rect x="600" y="344" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="725" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">주소·SNI·시각·전송량</text><circle cx="900" cy="268" r="16" fill="#7ee7c7"/><path d="M892 268 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="280" y="439" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">무엇을 위해, 어디까지 볼지 먼저 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회선에는 업무 통신과 사적인 통신이 함께 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복사본이 오니 통째로 저장하면 어떨까요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사적인 내용까지 모이면 사생활을 건드려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필요한 것만 남기도록 범위를 좁혀요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>