<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>경로 밖에서 끊어 보기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">경로 밖에서 끊어 보기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">복사본만 받는 센서가 끼어드는 방법이에요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="152" y1="225" x2="816" y2="225" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="152" y1="225" x2="816" y2="225" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="152" y1="225" x2="816" y2="225" stroke="#ff7b72" stroke-width="5" stroke-dasharray="10 10"/></g><line x1="480" y1="237" x2="480" y2="366" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="470,335;470,335;230,270;230,270" keyTimes="0.000;0.275;0.362;1.000" dur="16s" repeatCount="indefinite"/><rect x="-30" y="-15" width="60" height="30" rx="6" fill="#c792ea"/><text x="0" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">RST</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="780,225;780,225;215,225;215,225" keyTimes="0.000;0.275;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="66" y="191" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="198" width="52" height="30" fill="#3d4b60"/><polygon points="56,237 144,237 152,249 48,249" fill="#6ea8fe"/><text x="100" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="100" y="297" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="816" y="185" width="68" height="80" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="826" y="195" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><rect x="826" y="219" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><rect x="826" y="243" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><text x="850" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">피싱 사이트</text><circle cx="480" cy="225" r="12" fill="#c792ea"/><ellipse cx="480" cy="395" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="395" r="7" fill="#ffb454"/><text x="480" y="445" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="133" width="330" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">RST = 연결을 끊으라는 신호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="133" width="300" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">서버인 척 보낸 가짜 RST</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="194" y="250" width="72" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="560" cy="395" r="16" fill="#7ee7c7"/><path d="M552 395 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="310" y="133" width="340" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">가짜가 먼저 오면 연결이 끊겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="450" y="376" width="60" height="38" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="193" y="211" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M193 213 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="560" cy="395" r="16" fill="#ff7b72"/><path d="M553 388 l14 14 M567 388 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="320" y="133" width="320" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">진짜 응답이 먼저면 실패해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="186" y="196" width="60" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서가 가짜 RST로 연결을 끊어 보려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서가 서버인 척 RST를 보내고, 진짜 응답도 달려와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가짜 RST가 먼저 오면 연결이 끊겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">진짜 응답이 먼저 오면 실패해요. 이길 보장이 없어요</text></g>

