<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>미러링을 켰는데 기록이 비어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">미러링을 켰는데 기록이 비어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">금요일 오후 센서 기록에서 이상한 점을 봤어요</text>
