"indefinite"/><rect x="546" y="111" width="227" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="764" cy="193" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="795" cy="198" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="826" cy="204" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="660" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">미러링은 분명히 켰는데</text><text x="660" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">무엇이 빠진 걸까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="331" y="419" width="298" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">기록이 비는 곳은 어디일까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">금요일 오후, 디자인팀이 결과물을 한꺼번에 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 센서 기록에서 이상한 점을 찾았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">미러링은 켜져 있는데 무엇이 빠졌을까요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 빠진 곳을 찾아봐요</text></g>

