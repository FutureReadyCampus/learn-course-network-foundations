<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>자물쇠 상자는 열쇠 없이 못 열어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">자물쇠 상자는 열쇠 없이 못 열어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">택배 상자에 자물쇠를 달아 보내는 일이 암호화예요</text>
<rect x="76" y="166" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="173" width="52" height="30" fill="#3d4b60"/><polygon points="66,212 154,212 162,224 58,224" fill="#6ea8fe"/><text x="110" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직원 PC</text><rect x="816" y="160" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="170" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="194" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="218" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">저장소 서비스</text><line x1="165" y1="200" x2="800" y2="200" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="462" y="186" width="36" height="28" rx="3" fill="#ffb454"/><rect x="476" y="186" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><rect x="460" y="218" width="40" height="32" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><path d="M469 218 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ffb454" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="123" width="330" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">상자에 자물쇠를 달아 보내요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="311" y="115" width="338" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="110" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">열쇠</text><text x="850" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">열쇠</text><rect x="310" y="283" width="340" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="306.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">열쇠는 PC와 서비스만 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="306" y="275" width="348" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><ellipse cx="480" cy="340" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="340" r="7" fill="#ffb454"/><text x="480" y="385" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서(복사본만 받음)</text><line x1="480" y1="240" x2="480" y2="318" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><text x="250" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">겉 송장은 읽혀요</text><circle cx="380" cy="340" r="16" fill="#7ee7c7"/><path d="M372 340 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="710" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">안의 내용은 못 읽어요</text><circle cx="850" cy="340" r="16" fill="#ff7b72"/><path d="M843 333 l14 14 M857 333 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="156" y="314" width="768" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="403" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">열쇠가 없어서 파일 내용은 못 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="276" y="395" width="408" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">PC가 상자에 자물쇠를 달아 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">열쇠는 PC와 서비스만 가지고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서는 복사본의 겉 송장만 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">열쇠가 없으니 안은 볼 수 없어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>