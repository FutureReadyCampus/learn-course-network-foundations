<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Mirroring · 패킷을 복사하기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Mirroring · 패킷을 복사하기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">스위치 포트 미러링의 모습이에요</text>
<rect x="76" y="226" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="233" width="52" height="30" fill="#3d4b60"/><polygon points="66,272 154,272 162,284 58,284" fill="#6ea8fe"/><text x="110" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사용자</text><rect x="816" y="220" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="230" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="254" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="278" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="428" y="244" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="440" y="255" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="457" y="255" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="474" y="255" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="491" y="255" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="508" y="255" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="480" y="300" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><line x1="170" y1="260" x2="440" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="520" y1="260" x2="800" y2="260" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><g><animateTransform attributeName="transform" type="translate" values="190,260;190,260;770,260;770,260" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="480" y1="300" x2="480" y2="370" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><rect x="446" y="361" width="68" height="44" rx="4" fill="#171a21" stroke="#c792ea" stroke-width="3"/><rect x="454" y="368" width="52" height="30" fill="#3d4b60"/><polygon points="436,407 524,407 532,419 428,419" fill="#c792ea"/><text x="480" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">분석 장치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="143" width="200" height="34" rx="17" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">미러 포트로 복사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="143" width="400" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">많이 복사할수록 포트 용량이 필요해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치가 사용자와 서버 사이 패킷을 전달해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">관찰용 포트에 분석 장치를 연결해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본은 목적지로, 같은 내용은 복사본으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복사도 공짜가 아니에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>