<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>회사 센서와 망중립성</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">회사 센서와 망중립성</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">두 이야기는 서로 다른 논의예요</text>
<rect x="40" y="125" width="430" height="290" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="255" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">회사 업무망</text><rect x="490" y="125" width="430" height="290" rx="16" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="705" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">통신사업자 회선</text><rect x="91" y="226" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="99" y="233" width="52" height="30" fill="#3d4b60"/><polygon points="81,272 169,272 177,284 73,284" fill="#6ea8fe"/><text x="125" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직원 PC</text><line x1="180" y1="255" x2="310" y2="255" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><ellipse cx="360" cy="255" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="360" cy="255" r="7" fill="#ffb454"/><text x="360" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">회사 센서</text><polygon points="540,254 580,220 620,254" fill="#9aa3b2"/><rect x="548" y="254" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="571" y="274" width="18" height="28" fill="#3d4b60"/><text x="580" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">통신사업자</text><line x1="640" y1="255" x2="790" y2="255" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="816" y="215" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="225" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="249" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="273" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="230" y="434" width="500" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">DPI 같은 내용 검사 기술은 두 논의에 모두 나와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="125" y="364" width="260" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="255" y="386.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">사내 규정과 동의의 문제</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="121" width="438" height="298" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="555" y="364" width="300" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="705" y="386.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">특정 서비스 차별 = 망중립성</text><circle cx="790" cy="215" r="16" fill="#ff7b72"/><path d="M783 208 l14 14 M797 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="486" y="121" width="438" height="298" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="433" width="360" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="456.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서로 다른 논의라서 구별해서 따져요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 깊이 보는 기술은 두 논의에 모두 등장해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회사 업무망에서 직원 통신을 보는 일은 사내 규정과 동의의 문제예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사업자가 특정 서비스만 차별하는 일은 망중립성이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헷갈리기 쉬우니 두 논의를 구별해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>