 height="190" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="302" y="254" width="56" height="72" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="342,254 358,270 342,270" fill="#ff7b72"/><rect x="312" y="284" width="36" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="312" y="297" width="28" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="312" y="310" width="20" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><text x="330" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">즉시 막기</text><rect x="452" y="254" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="492,254 508,270 492,270" fill="#6ea8fe"/><rect x="462" y="284" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="297" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="310" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="480" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">AI 사용 통계</text><rect x="602" y="254" width="56" height="72" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><polygon points="642,254 658,270 642,270" fill="#7ee7c7"/><rect x="612" y="284" width="36" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><rect x="612" y="297" width="28" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><rect x="612" y="310" width="20" height="5" rx="2" fill="#7ee7c7" fill-opacity="0.6"/><text x="630" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">사고 증거</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="266" y="236" width="428" height="138" rx="10" fill="none" stroke="#ffb454" s