<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>센서 안에서 기록이 비는 곳</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">센서 안에서 기록이 비는 곳</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">어느 단계든 느리면 빈틈이 생겨요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="40,275;40,275;930,275;930,275" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="56" y="230" width="170" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="141" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">NIC</text><text x="141" y="346" text-anchor="middle" font-size="16" fill="#9aa3b2">받기</text><rect x="282" y="230" width="170" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="367" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">메모리 버퍼</text><text x="367" y="346" text-anchor="middle" font-size="16" fill="#9aa3b2">잠시 담기</text><rect x="508" y="230" width="170" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="593" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">캡처·CPU</text><text x="593" y="346" text-anchor="middle" font-size="16" fill="#9aa3b2">분석</text><rect x="734" y="230" width="170" height="90" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="819" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">디스크</text><text x="819" y="346" text-anchor="middle" font-size="16" fill="#9aa3b2">기록</text><line x1="228" y1="275" x2="268" y2="275" stroke="#9aa3b2" stroke-width="4"/><polygon points="280,275 266,283 266,267" fill="#9aa3b2"/><line x1="454" y1="275" x2="494" y2="275" stroke="#9aa3b2" stroke-width="4"/><polygon points="506,275 492,283 492,267" fill="#9aa3b2"/><line x1="680" y1="275" x2="720" y2="275" stroke="#9aa3b2" stroke-width="4"/><polygon points="732,275 718,283 718,267" fill="#9aa3b2"/><text x="480" y="165" text-anchor="middle" font-size="18" fill="#9aa3b2">센서(192.168.10.250) 안에서 패킷이 지나가는 길</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="278" y="226" width="178" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="442" cy="230" r="16" fill="#ff7b72"/><path d="M435 223 l14 14 M449 223 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="232" y="369" width="270" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="367" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">순간적으로 몰리면 버퍼가 넘쳐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="504" y="226" width="178" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="668" cy="230" r="16" fill="#ff7b72"/><path d="M661 223 l14 14 M675 223 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="458" y="369" width="270" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="593" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">분석이 밀리면 패킷을 버려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="730" y="226" width="178" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="894" cy="230" r="16" fill="#ff7b72"/><path d="M887 223 l14 14 M901 223 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="635" y="369" width="270" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="770" y="390.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">쓰기가 못 따라오면 기록이 끊겨요</text><rect x="310" y="423" width="340" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">1Gbps ≈ 초당 약 125MB가 쌓여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서 안에서 패킷은 네 단계를 차례로 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">버퍼 단계가 넘치면 패킷이 버려져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">분석이 밀리는 단계에서도 패킷이 버려져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">디스크 쓰기가 느려도 기록이 끊겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>