<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>봤는데 왜 못 막았을까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">봤는데 왜 못 막았을까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">센서는 읽기만 하고 막는 일은 경로 안이 해요</text>
<line x1="152" y1="225" x2="238" y2="225" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="342" y1="225" x2="492" y2="225" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="548" y1="225" x2="816" y2="225" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="290" y1="282" x2="290" y2="374" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,225;170,225;455,225;455,225" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="290,225;290,225;750,225;750,225" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="290,300;290,300;290,350;290,350" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="66" y="191" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="198" width="52" height="30" fill="#3d4b60"/><polygon points="56,237 144,237 152,249 48,249" fill="#6ea8fe"/><text x="100" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="100" y="297" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="238" y="209" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="250" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="267" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="284" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="301" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="318" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="290" y="265" text-anchor="middle" font-size="17" fill="#9aa3b2">코어 스위치</text><circle cx="520" cy="225" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M505 219 h28 l-7 -7 M535 231 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="520" y="275" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><text x="520" y="297" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.1</text><rect x="816" y="185" width="68" height="80" rx="8" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><rect x="826" y="195" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><rect x="826" y="219" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><rect x="826" y="243" width="48" height="16" rx="3" fill="#ff7b72" fill-opacity="0.45"/><text x="850" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">피싱 사이트</text><ellipse cx="290" cy="400" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="290" cy="400" r="7" fill="#ffb454"/><text x="290" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서 192.168.10.250</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="372" width="60" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="728" y="211" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M728 213 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="375" y="384" width="190" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="470" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">위험 주소 경보!</text><rect x="675" y="144" width="190" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="770" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">원본은 이미 도착</text><circle cx="890" cy="160" r="16" fill="#ff7b72"/><path d="M883 153 l14 14 M897 153 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="362" y="376" width="216" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="335" y1="400" x2="520" y2="400" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="6 6"/><line x1="520" y1="400" x2="520" y2="316" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="6 6"/><rect x="370" y="144" width="300" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">차단 규칙에 위험 주소 추가</text><rect x="418" y="211" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M418 213 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="440" cy="266" r="16" fill="#ff7b72"/><path d="M433 259 l14 14 M447 259 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="488" y="193" width="64" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장 PC가 피싱 사이트에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본은 사이트로 곧장 가고, 복사본은 센서로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서가 경보를 울릴 때는 원본이 이미 도착했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음부터 막으려면 경로 안 차단 규칙에 넣어요</text></g>

