<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>복사 지점에 따라 보이는 주소</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">복사 지점에 따라 보이는 주소</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 통신도 어디서 복사하느냐에 따라 달라요</text>
<line x1="152" y1="160" x2="224" y2="214" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="152" y1="300" x2="224" y2="240" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="322" y1="225" x2="492" y2="225" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="548" y1="225" x2="730" y2="225" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="66" y="116" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="123" width="52" height="30" fill="#3d4b60"/><polygon points="56,162 144,162 152,174 48,174" fill="#6ea8fe"/><text x="100" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><text x="100" y="222" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.41</text><rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 PC</text><text x="100" y="372" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.42</text><rect x="218" y="209" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="230" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="247" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="264" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="281" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="298" y="220" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="270" y="265" text-anchor="middle" font-size="17" fill="#9aa3b2">코어 스위치</text><circle cx="520" cy="225" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M505 219 h28 l-7 -7 M535 231 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="520" y="275" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><text x="520" y="297" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.1</text><ellipse cx="800" cy="225" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="800" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="435" y="144" width="170" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="520" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">주소 변환(NAT)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="400" cy="225" r="12" fill="#c792ea"/><line x1="400" y1="237" x2="400" y2="334" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><rect x="285" y="334" width="230" height="84" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="400.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">게이트웨이 안쪽 복사</text><text x="400.0" y="386" text-anchor="middle" font-size="16" fill="#e6e8ec">출발지 192.168.10.41</text><text x="400.0" y="411" text-anchor="middle" font-size="16" fill="#e6e8ec">출발지 192.168.10.42</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="330" width="238" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="515" cy="334" r="16" fill="#7ee7c7"/><path d="M507 334 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="650" cy="225" r="12" fill="#c792ea"/><line x1="650" y1="237" x2="650" y2="334" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><rect x="535" y="334" width="230" height="84" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="650.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">게이트웨이 바깥 복사</text><text x="650.0" y="386" text-anchor="middle" font-size="16" fill="#e6e8ec">출발지 198.51.100.25</text><text x="650.0" y="411" text-anchor="middle" font-size="16" fill="#e6e8ec">출발지 198.51.100.25</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="330" width="238" height="92" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="765" cy="334" r="16" fill="#ff7b72"/><path d="M758 327 l14 14 M772 327 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="435" width="400" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="458.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">알고 싶은 것에 맞춰 복사 지점을 정해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 PC의 통신이 코어 스위치와 게이트웨이를 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안쪽에서 복사하면 PC마다 주소가 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥에서 복사하면 모두 본사 공인 주소로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">무엇을 알고 싶은지에 맞춰 복사 지점을 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>