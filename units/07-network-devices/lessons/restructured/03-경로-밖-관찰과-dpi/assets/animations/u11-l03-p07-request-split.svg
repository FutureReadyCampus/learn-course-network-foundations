<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>요청마다 알맞은 자리</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">요청마다 알맞은 자리</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">막을지 지켜볼지는 요청이 정해요</text>
<rect x="590" y="140" width="320" height="120" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="750" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">Inline · 경로 안</text><text x="750" y="206" text-anchor="middle" font-size="16" fill="#e6e8ec">게이트웨이 192.168.10.1</text><text x="750" y="232" text-anchor="middle" font-size="16" fill="#9aa3b2">차단 규칙으로 바로 막아요</text><rect x="590" y="300" width="320" height="120" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="750" y="336" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">Out of path · 경로 밖</text><text x="750" y="366" text-anchor="middle" font-size="16" fill="#e6e8ec">센서 192.168.10.250</text><text x="750" y="392" text-anchor="middle" font-size="16" fill="#9aa3b2">복사본을 모아 분석해요</text><rect x="50" y="164.0" width="380" height="52" rx="26" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="240.0" y="197" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">① 랜섬웨어 주소 즉시 차단</text><rect x="50" y="264.0" width="380" height="52" rx="26" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="240.0" y="297" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">② AI 서비스 사용 통계</text><rect x="50" y="364.0" width="380" height="52" rx="26" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="240.0" y="397" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">③ 사고 증거 찾기</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="435" y1="190" x2="573" y2="199" stroke="#6ea8fe" stroke-width="4"/><polygon points="585,200 570,207 572,191" fill="#6ea8fe"/><circle cx="910" cy="140" r="16" fill="#7ee7c7"/><path d="M902 140 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="160" width="388" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="435" y1="290" x2="574" y2="341" stroke="#c792ea" stroke-width="4"/><polygon points="585,345 569,348 575,333" fill="#c792ea"/><circle cx="910" cy="300" r="16" fill="#7ee7c7"/><path d="M902 300 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="260" width="388" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="435" y1="390" x2="573" y2="385" stroke="#c792ea" stroke-width="4"/><polygon points="585,385 571,393 571,377" fill="#c792ea"/><rect x="620" y="434" width="260" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="750" y="456.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">누락이 없게 여유를 둬요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="360" width="388" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사의 요청 세 가지를 어디서 처리할까요?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본을 즉시 막아야 하니 경로 안에서 처리해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통계는 원본에 손댈 필요가 없어 센서가 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">증거도 센서로 하되 누락이 없게 여유를 둬요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>