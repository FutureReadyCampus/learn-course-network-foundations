<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>HTTPS에서 센서가 보는 것</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">HTTPS에서 센서가 보는 것</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보이는 것과 안 보이는 것을 나눠 봐요</text>
<line x1="150" y1="165" x2="800" y2="165" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="480" y1="177" x2="480" y2="205" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><rect x="56" y="131" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="138" width="52" height="30" fill="#3d4b60"/><polygon points="46,177 134,177 142,189 38,189" fill="#6ea8fe"/><text x="90" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><text x="90" y="237" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.41</text><rect x="816" y="125" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="135" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="159" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="183" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="227" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">외부 클라우드 저장소</text><text x="850" y="247" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80:443</text><circle cx="480" cy="165" r="12" fill="#c792ea"/><ellipse cx="480" cy="222" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="222" r="7" fill="#ffb454"/><text x="540" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서</text><rect x="50" y="284" width="860" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="70" y="316" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">주소·포트·시각·전송량</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="309" r="16" fill="#ffb454"/><text x="850" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="350" y="315" text-anchor="start" font-size="17" fill="#9aa3b2">누가 언제 어디로 얼마나</text><rect x="655" y="292" width="230" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="770" y="315.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">보인다</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="280" width="868" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="50" y="342" width="860" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="70" y="374" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">SNI (서버 이름)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="367" r="16" fill="#ffb454"/><text x="850" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="350" y="373" text-anchor="start" font-size="17" fill="#9aa3b2">어느 서비스 쪽인지 단서</text><rect x="655" y="350" width="230" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="770" y="373.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">평문일 때만 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="338" width="868" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="50" y="400" width="860" height="50" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="70" y="432" text-anchor="start" font-size="18" font-weight="700" fill="#e6e8ec">올린 파일 내용 (Payload)</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><circle cx="850" cy="425" r="16" fill="#ffb454"/><text x="850" y="432" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="350" y="431" text-anchor="start" font-size="17" fill="#9aa3b2">알 수 없다</text><rect x="655" y="408" width="230" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="770" y="431.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">TLS면 안 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="396" width="868" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC의 HTTPS 통신 복사본을 센서가 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주소·포트·시각·전송량은 헤더에서 그대로 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 이름(SNI)은 평문으로 보낼 때만 단서가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS로 암호화된 파일 내용은 읽을 수 없어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>