<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>저장과 분석의 부하</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">저장과 분석의 부하</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">빠른 포트 하나로 끝나지 않아요</text>
<g><rect x="70" y="210" width="200" height="100" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="170.0" y="268.64" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">받기</text><text x="170" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">네트워크 카드</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="210" width="200" height="100" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480.0" y="268.64" text-anchor="middle" font-size="24" font-weight="700" fill="#c792ea">분석</text><text x="480" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">CPU·메모리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="690" y="210" width="200" height="100" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="790.0" y="268.64" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">저장</text><text x="790" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">디스크 쓰기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="275" y1="260" x2="361" y2="260" stroke="#9aa3b2" stroke-width="4"/><polygon points="375,260 359,251 359,269" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="585" y1="260" x2="671" y2="260" stroke="#9aa3b2" stroke-width="4"/><polygon points="685,260 669,251 669,269" fill="#9aa3b2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="206" width="208" height="108" rx="10" fill="none" stroke="#ff7b72" stroke-width="5"/><rect x="290" y="413" width="380" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">1Gbps ≈ 초당 약 125MB씩 쌓여요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">센서는 먼저 복사본을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">CPU가 읽어서 분석해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록하면 디스크 쓰기 성능이 필요해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">어느 단계든 느리면 누락이 생겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>