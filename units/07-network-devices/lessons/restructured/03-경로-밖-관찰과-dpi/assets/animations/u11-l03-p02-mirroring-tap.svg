font-size="18" font-weight="700" fill="#e6e8ec">지우 PC</text><text x="100" y="302" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.41</text><rect x="238" y="214" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="250" y="225" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="267" y="225" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="284" y="225" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="301" y="225" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="318" y="225" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="290" y="270" text-anchor="middle" font-size="17" fill="#9aa3b2">코어 스위치</text><circle cx="660" cy="230" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M645 224 h28 l-7 -7 M675 236 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="660" y="280" text-anchor="middle" font-size="17" fill="#9aa3b2">게이트웨이</text><text x="660" y="302" text-anchor="middle" font-size="16" fill="#9aa3b2">192.168.10.1</text><ellipse cx="850" cy="230" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><ellipse cx="400" cy="400" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="400" cy="400" r="7" fill="#ffb454"/><text x="400" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">센서 192.168.10.250</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="290" y1="282" x2="290" y2="400" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><line x1="290" y1="400" x2="372" y2="400" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="125" y="148" width="330" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="290" y="171.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">게이트웨이 쪽 포트를 복사 대상으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="234" y="210" width="112" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="470" cy="400" r="16" fill="#7ee7c7"/><path d="M462 400 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="340" y="148" width="280" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="171.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">원본도 복사본도 도착해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="368" y="374" width="64" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="475" y1="250" x2="475" y2="322" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><line x1="400" y1="322" x2="570" y2="322" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><line x1="400" y1="322" x2="400" y2="372" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><line x1="570" y1="322" x2="570" y2="374" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 6"/><rect x="437" y="210" width="76" height="40" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="475" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">TAP</text><rect x="495" y="376" width="150" height="48" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="570" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">다른 장비</text><rect x="370" y="148" width="220" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="171.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">복사 전용 장비 TAP</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="433" y="206" width="84" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우 PC의 통신이 코어 스위치로 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치에서 게이트웨이 쪽 포트를 복사 대상으로 정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원본은 게이트웨이로, 복사본은 센서로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TAP은 회선에 끼워 복사본을 여러 곳에 나눠 줘요</text></g>

