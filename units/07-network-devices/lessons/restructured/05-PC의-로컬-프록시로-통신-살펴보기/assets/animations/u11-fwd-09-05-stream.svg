<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Stream 수준의 해석</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Stream 수준의 해석</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">조각난 패킷을 하나의 요청으로 봐요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="238" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M238 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="260" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">① GE</text><rect x="458" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="480" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">② T /lo</text><rect x="678" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M678 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="700" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">③ gin</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="240" y="183" width="480" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">TCP는 데이터를 여러 조각으로 나눠 보낼 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="238" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M238 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="260" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">①</text><rect x="458" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="480" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">②</text><rect x="678" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M678 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="700" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">③</text><line x1="480" y1="315" x2="480" y2="350" stroke="#6ea8fe" stroke-width="4"/><rect x="330" y="350" width="300" height="50" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480.0" y="382.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">GET /login</text><rect x="340" y="423" width="280" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">Proxy는 요청 단위로 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="183" width="290" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="206.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">Stream 처리 ≠ 암호 해제</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">패킷은 조각으로 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조각을 이어야 요청 전체가 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소켓에서는 이어진 흐름으로 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS 내용은 별도 설정이 있어야 보여요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>