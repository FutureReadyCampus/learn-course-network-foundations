<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Fiddler와 Proxy 활용 정리</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Fiddler와 Proxy 활용 정리</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">목적은 달라도 중계 원리는 같아요</text>
<g><rect x="60" y="170" width="260" height="80" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190.0" y="217.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">우회</text><text x="190" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">외부 Proxy</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="170" width="260" height="80" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="217.92" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">정책·검사</text><text x="480" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">내부 Proxy</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="170" width="260" height="80" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="770.0" y="217.92" text-anchor="middle" font-size="22" font-weight="700" fill="#c792ea">분석</text><text x="770" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">로컬 Proxy</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="333" width="560" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="356.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">요청을 받고 → 다른 연결로 전달 → 응답을 되돌려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="403" width="320" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">다음: 서버 앞의 Reverse Proxy</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">외부 출구로 연결하는 우회 사례</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">조직이 관리하는 정책·검사 지점</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 PC 안의 로컬 분석 도구</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공통 원리는 대신 전달하는 중계예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>