<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Loopback에 Proxy 설정</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Loopback에 Proxy 설정</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">127.0.0.1은 내 컴퓨터를 가리켜요</text>
<rect x="100" y="170" width="560" height="200" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="8 6"/><text x="380" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">내 PC (127.0.0.1)</text><rect x="140" y="250" width="170" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="225.0" y="292.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">브라우저</text><rect x="450" y="250" width="170" height="70" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="535.0" y="291.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">분석 도구 :8080</text><g><rect x="690" y="215" width="220" height="80" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="800" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Proxy 설정</text><text x="800" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">127.0.0.1:8080</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="310" y1="300" x2="450" y2="300" stroke="#6ea8fe" stroke-width="5"/><rect x="295" y="329" width="170" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="380" y="350.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">밖으로 안 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="444" y="244" width="182" height="82" rx="10" fill="none" stroke="#ffb454" stroke-width="4"/><rect x="435" y="384" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="535" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">8080 = 이 프로그램</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="380" cy="285" r="16" fill="#ff7b72"/><path d="M373 278 l14 14 M387 278 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="270" y="413" width="420" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">도구가 꺼져 있거나 포트가 다르면 실패</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저에 127.0.0.1:8080을 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결은 같은 PC 안에서만 오가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트 8080이 어느 프로그램인지 가려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도구가 꺼져 있으면 연결할 수 없어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>