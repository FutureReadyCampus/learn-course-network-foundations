<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>길목 장치가 멈추면?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">길목 장치가 멈추면?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">단일 장애점이 만드는 일이에요</text>
<rect x="76" y="194" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="201" width="52" height="32" fill="#3d4b60"/><rect x="105" y="240" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="250" width="44" height="5" fill="#6ea8fe"/><rect x="76" y="304" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="311" width="52" height="32" fill="#3d4b60"/><rect x="105" y="350" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="360" width="44" height="5" fill="#6ea8fe"/><text x="110" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">사무실 PC 40대</text><rect x="385.0" y="225.0" width="190" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="271.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">본사 게이트웨이</text><text x="480" y="327.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.1</text><ellipse cx="850" cy="265" rx="70" ry="42" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">인터넷</text><line x1="150" y1="230" x2="385" y2="255" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="150" y1="340" x2="385" y2="285" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="575" y1="265" x2="780" y2="265" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="170,235;170,235;350,252;350,252" keyTimes="0.000;0.013;0.125;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="610,265;610,265;770,265;770,265" keyTimes="0.000;0.125;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="158" width="360" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">평소엔 모든 통신이 여기를 지나요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="216" width="208" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="385.0" y="225.0" width="190" height="80" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="271.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">재부팅 중</text><text x="480" y="327.0" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="158" width="380" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">토요일 보안 업데이트 → 재부팅</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="216" width="208" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="700" cy="265" r="16" fill="#ff7b72"/><path d="M693 258 l14 14 M707 258 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="278" y="236" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M278 238 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="310" y="158" width="340" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">사무실 전체 인터넷이 끊겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="672" y="237" width="56" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="365.0" y="377.0" width="230" height="56" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="411.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">두 번째 장치 (이중화)</text><line x1="480" y1="338" x2="480" y2="377" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="158" width="360" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="181.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">이중화도 Bypass도 대가가 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="356" y="369" width="248" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게이트웨이 하나가 모든 통신을 맡아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">업데이트하려고 재부팅을 걸었어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">재부팅하는 몇 분 동안 인터넷이 끊겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장치를 두 대 두거나 Bypass를 두어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>