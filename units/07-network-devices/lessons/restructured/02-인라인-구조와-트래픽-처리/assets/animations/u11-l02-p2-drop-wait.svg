<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>통과시킬까, 버릴까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">통과시킬까, 버릴까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">Drop하면 보낸 쪽은 아무 소식도 못 받아요</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><text x="110" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><text x="110" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.42</text><circle cx="480" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 294 h28 l-7 -7 M495 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">출구 장치</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><text x="850" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80</text><line x1="165" y1="300" x2="445" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="515" y1="300" x2="805" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;410,300;410,300" keyTimes="0.000;0.037;0.212;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="54" y="258" width="112" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="215" y="178" width="230" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="330" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">허용한 패킷은 통과</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="211.0" y="174.0" width="238" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="525" y="178" width="210" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="630" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">차단 대상은 Drop</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="248" r="16" fill="#ff7b72"/><path d="M473 241 l14 14 M487 241 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="450" y="270" width="60" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="355" y="178" width="250" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">규칙에 걸려 Drop돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="351.0" y="174.0" width="258" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="35" y="165" width="150" height="48" rx="24" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="110" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">연결 중…</text><circle cx="60" cy="189" r="9" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="14 14"><animateTransform attributeName="transform" type="rotate" from="0 60 189" to="360 60 189" dur="1.5s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="31" y="161" width="158" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="178" width="300" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">응답이 없어 한참 기다려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326.0" y="174.0" width="308" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="90" y="423" width="320" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="250" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">조용히 Drop하면 한참 기다려요</text><rect x="535" y="423" width="330" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="700" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">거부 응답을 주면 바로 실패해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="86" y="419" width="328" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="419" width="338" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청이 출구 장치의 규칙을 만나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">차단 대상이라 이 자리에서 Drop돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북은 응답을 못 받고 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Drop은 조용히, 거부 응답은 바로 실패해요</text></g>

