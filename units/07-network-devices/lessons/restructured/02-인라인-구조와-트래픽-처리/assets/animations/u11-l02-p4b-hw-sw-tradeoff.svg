<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>하드웨어와 소프트웨어 구현</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">하드웨어와 소프트웨어 구현</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">두 방식은 장점과 대가가 달라요</text>
<text x="490" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">처리 속도</text><text x="760" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">바꾸기 쉬움</text><rect x="40" y="180" width="310" height="70" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="195.0" y="221.84" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb454">전용 하드웨어·가속기</text><text x="195" y="273" text-anchor="middle" font-size="16" fill="#9aa3b2">반복 작업을 전용 하드웨어가 처리</text><rect x="380" y="199" width="220" height="32" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><rect x="650" y="199" width="220" height="32" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><rect x="40" y="300" width="310" height="70" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="195.0" y="341.84" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">범용 컴퓨터 + 소프트웨어</text><text x="195" y="393" text-anchor="middle" font-size="16" fill="#9aa3b2">프로그램으로 처리</text><rect x="380" y="319" width="220" height="32" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><rect x="650" y="319" width="220" height="32" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="199" width="210" height="32" rx="6" fill="#7ee7c7" fill-opacity="0.85" stroke="#7ee7c7" stroke-width="2"/><text x="485.0" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">빠름</text><rect x="380" y="319" width="90" height="32" rx="6" fill="#ffb454" fill-opacity="0.85" stroke="#ffb454" stroke-width="2"/><text x="478" y="341" text-anchor="start" font-size="16" font-weight="700" fill="#ffb454">느릴 수 있음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="650" y="199" width="80" height="32" rx="6" fill="#ffb454" fill-opacity="0.85" stroke="#ffb454" stroke-width="2"/><text x="738" y="221" text-anchor="start" font-size="16" font-weight="700" fill="#ffb454">바꾸기 어려움</text><rect x="650" y="319" width="210" height="32" rx="6" fill="#7ee7c7" fill-opacity="0.85" stroke="#7ee7c7" stroke-width="2"/><text x="755.0" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">바꾸기 쉬움</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="376" y="116" width="228" height="258" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="646" y="116" width="228" height="258" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="295" y="423" width="370" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 일을 하는 두 가지 구현이에요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="291.0" y="419.0" width="378" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="305" y="423" width="350" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">전용 하드웨어는 빠르게 처리해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="301.0" y="419.0" width="358" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="325" y="423" width="310" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">소프트웨어는 바꾸기 쉬워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="321.0" y="419.0" width="318" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="265" y="423" width="430" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">하나를 얻으면 하나를 내주는 절충이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="261.0" y="419.0" width="438" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 일을 하는 두 가지 구현이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전용 하드웨어는 정해진 작업이 빨라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소프트웨어는 기능을 바꾸기 쉬워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">어느 쪽이든 대가가 있는 절충이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>