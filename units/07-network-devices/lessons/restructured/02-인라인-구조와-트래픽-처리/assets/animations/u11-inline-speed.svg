<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>처리 속도와 전체 성능</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">처리 속도와 전체 성능</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">길목이 좁으면 전체가 느려져요</text>
<rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="430" y="260" width="100" height="80" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">장치</text><line x1="530" y1="300" x2="800" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g><rect x="98" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M98 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="148" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M148 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="198" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M198 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="248" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M248 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="298" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M298 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><line x1="160" y1="300" x2="425" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="355" y="198" width="250" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">요청이 갑자기 늘었어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="225" y="383" width="150" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="300" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">줄이 길어져요</text><circle cx="255" cy="335" r="16" fill="#ff7b72"/><path d="M248 328 l14 14 M262 328 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="520" y="383" width="280" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="660" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">서버만 키워도 소용없어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">평소엔 패킷이 술술 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">행사 신청으로 요청이 몰렸어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장치가 처리 못 하면 줄이 길어져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">길목 장치의 속도가 전체 성능을 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>