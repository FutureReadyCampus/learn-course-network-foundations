<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>인터페이스로 방향을 읽기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">인터페이스로 방향을 읽기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 대화도 요청과 응답의 방향이 달라요</text>
<rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><text x="100" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.42</text><rect x="826" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="836" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="836" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="860" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><text x="860" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80</text><line x1="160" y1="300" x2="380" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="580" y1="300" x2="815" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,300;190,300;770,300;770,300" keyTimes="0.000;0.270;0.480;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="770,300;770,300;190,300;190,300" keyTimes="0.000;0.520;0.730;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="380" y="245" width="200" height="110" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">본사 게이트웨이</text><g><rect x="380" y="245" width="200" height="110" rx="14" fill="none" stroke="#6ea8fe" stroke-width="3"/></g><circle cx="380" cy="300" r="22" fill="#6ea8fe"/><text x="380" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">A</text><circle cx="580" cy="300" r="22" fill="#ffb454"/><text x="580" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">B</text><text x="380" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">A · 사내 쪽</text><text x="580" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">B · 인터넷 쪽</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="354" y="274" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="554" y="274" width="52" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="178" width="330" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">문마다 인터페이스 이름이 있어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="311.0" y="174.0" width="338" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="285" y="178" width="390" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">Outbound · A로 들어와 B로 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="281.0" y="174.0" width="398" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="178" width="380" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">Inbound · B로 들어와 A로 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="286.0" y="174.0" width="388" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="178" width="300" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="201.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">A→B처럼 풀어 적어 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="326.0" y="174.0" width="308" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">게이트웨이의 두 문은 인터페이스 A와 B예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 A로 들어와 B로 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답은 B로 들어와 A로 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방향은 장치 기준이라 A→B로 풀어 읽어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>