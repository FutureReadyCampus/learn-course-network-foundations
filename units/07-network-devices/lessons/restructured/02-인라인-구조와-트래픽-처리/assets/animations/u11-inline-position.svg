<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>망 구성에서 위치 찾기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">망 구성에서 위치 찾기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">길목이 어디인지 지도에서 확인해요</text>
<line x1="150" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="40" y="270" width="140" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="110.0" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">내 컴퓨터</text><rect x="260" y="270" width="140" height="60" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="330.0" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">공유기</text><rect x="480" y="270" width="140" height="60" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="550.0" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">라우터</text><rect x="700" y="270" width="140" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="770.0" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">서버 네트워크</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,250;150,250;770,250;770,250" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="198" width="140" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="330" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">여기도 길목</text><rect x="480" y="198" width="140" height="34" rx="17" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="550" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">여기도 길목</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="474" y="264" width="152" height="72" rx="10" fill="none" stroke="#ffb454" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="410" y="383" width="280" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="550" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">검사 장치를 놓을 자리는?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="431" width="460" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="454.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">패킷이 반드시 지나는 곳이 Inline 자리예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">데이터는 여러 장치를 차례로 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">어느 장치나 길목이 될 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">검사 장치를 놓을 자리를 골라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지도에서 지나는 곳을 찾는 일이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>