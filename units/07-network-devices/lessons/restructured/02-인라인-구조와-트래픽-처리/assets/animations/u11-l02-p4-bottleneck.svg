<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>회선을 늘려도 느린 이유</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">회선을 늘려도 느린 이유</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">수치는 설명을 위한 가정이에요</text>
<rect x="56" y="264" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="271" width="52" height="32" fill="#3d4b60"/><rect x="85" y="310" width="10" height="10" fill="#6ea8fe"/><rect x="68" y="320" width="44" height="5" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사내 PC</text><rect x="836" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="846" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="846" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="846" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="870" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라우드 저장소</text><line x1="150" y1="300" x2="300" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="264.0" width="430" height="72" rx="8" fill="#6ea8fe" fill-opacity="0.3" stroke="#6ea8fe" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="235.0" width="430" height="130" rx="8" fill="#6ea8fe" fill-opacity="0.3" stroke="#6ea8fe" stroke-width="3"/></g><rect x="300" y="210" width="40" height="72" fill="#ffb454"/><rect x="300" y="318" width="40" height="72" fill="#ffb454"/><text x="320" y="418" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">방화벽</text><text x="320" y="442" text-anchor="middle" font-size="17" fill="#ffb454">처리량 150Mbps</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="565" y="244" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">회선 300Mbps</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><text x="565" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">회선 1Gbps</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="48" y="254" width="84" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="148" width="290" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">오후마다 업로드가 느려요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="331.0" y="144.0" width="298" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="231" width="438" height="138" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="148" width="290" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">회선을 1Gbps로 올렸어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="331.0" y="144.0" width="298" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="128" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M128 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="173" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M173 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="218" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M218 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="498" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M498 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="320" cy="300" r="16" fill="#ff7b72"/><path d="M313 293 l14 14 M327 293 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296" y="206" width="48" height="188" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="148" width="290" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">업로드 속도는 그대로예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="331.0" y="144.0" width="298" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="295" y="148" width="370" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="171.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">가장 좁은 구간이 전체 상한이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="291.0" y="144.0" width="378" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회선은 300Mbps, 방화벽 처리량은 150Mbps예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회선만 1Gbps로 넓혔어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽 앞에 패킷이 몰려 그대로 느려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가장 좁은 구간이 속도를 정해요</text></g>

