<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>소프트웨어·하드웨어의 구현</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">소프트웨어·하드웨어의 구현</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상자든 컴퓨터든 역할은 같아요</text>
<g><rect x="110" y="190" width="320" height="90" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="270.0" y="242.92" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">전용 장비 상자</text><text x="270" y="310" text-anchor="middle" font-size="16" fill="#9aa3b2">하드웨어로 만든 장치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="190" width="320" height="90" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="690.0" y="242.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">범용 컴퓨터 + 소프트웨어</text><text x="690" y="310" text-anchor="middle" font-size="16" fill="#9aa3b2">NIC 여러 개에 라우팅 프로그램</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="270" y1="330" x2="270" y2="375" stroke="#6ea8fe" stroke-width="4"/><line x1="690" y1="330" x2="690" y2="375" stroke="#ffb454" stroke-width="4"/><line x1="270" y1="375" x2="690" y2="375" stroke="#7ee7c7" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="398" width="260" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="421.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">둘 다 패킷을 전달해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="280" y="133" width="400" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="156.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">역할은 상자 모양으로 정해지지 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전용 장비 상자가 먼저 떠올라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">일반 컴퓨터에 소프트웨어를 올려도 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">둘 다 패킷을 받아 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모양보다 하는 일이 장치를 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>