<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>들어온 패킷을 넘겨 보내기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">들어온 패킷을 넘겨 보내기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">A로 들어와 B로, 응답은 반대로</text>
<rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="170" y1="280" x2="380" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="580" y1="280" x2="790" y2="280" stroke="#3d4b60" stroke-width="3"/><line x1="170" y1="325" x2="380" y2="325" stroke="#3d4b60" stroke-width="3"/><line x1="580" y1="325" x2="790" y2="325" stroke="#3d4b60" stroke-width="3"/><rect x="380" y="245" width="200" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">분류장</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="190,280;190,280;770,280;770,280" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="395" y="198" width="170" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">요청: A → B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="770,325;770,325;190,325;190,325" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="395" y="383" width="170" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">응답: B → A</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="431" width="440" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="454.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">택배 분류장처럼 들어온 쪽의 반대로 보내요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 A로 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허용되면 B쪽으로 넘겨 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답은 반대 방향으로 돌아와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">분류장에서 상자를 넘기는 모습이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>