<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>필터링과 고성능 구현</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">필터링과 고성능 구현</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 볼지에 따라 속도가 달라요</text>
<rect x="458" y="136" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M458 138 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><g><rect x="180" y="220" width="280" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="320.0" y="257.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">주소·포트만 보기</text><rect x="500" y="220" width="280" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="640.0" y="257.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">빠르고 가벼워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="180" y="310" width="280" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="320.0" y="347.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">내용까지 보기</text><rect x="500" y="310" width="280" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="640.0" y="347.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">더 많이 걸려요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="370" y="134" width="220" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">헤더: 주소 · 포트</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="403" width="280" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">규칙이 단순할수록 빨라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="403" width="300" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="426.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">그래서 전용 하드웨어도 써요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">패킷 겉의 헤더에는 주소와 포트가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더만 보는 규칙은 가벼워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용까지 보면 더 오래 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">고성능이 필요하면 구현을 달리해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>