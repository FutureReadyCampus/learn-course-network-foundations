<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>직원 부스와 하이패스 차로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">직원 부스와 하이패스 차로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 차를 보내는 두 가지 방법이에요</text>
<line x1="110" y1="205" x2="320" y2="205" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="110" y1="385" x2="320" y2="385" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><rect x="120" y="188" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="190" y="188" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="250" y="188" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="120" y="368" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="190" y="368" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="250" y="368" width="60" height="34" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><g><rect x="330" y="150" width="200" height="110" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="430" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직원 부스</text><text x="430" y="230" text-anchor="middle" font-size="17" fill="#e6e8ec">차를 한 대씩 세워요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="146" width="208" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="188" width="330" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="700" y="211.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">느리지만 지시를 바꾸기 쉬워요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="180" width="338" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="330" width="200" height="110" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="430" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">하이패스 차로</text><text x="430" y="410" text-anchor="middle" font-size="17" fill="#e6e8ec">세우지 않고 읽어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="326" y="326" width="208" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="535" y="368" width="330" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="700" y="391.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">빠르지만 바꾸려면 공사해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="360" width="338" height="50" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소프트웨어 검사는 직원 부스예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">직원 부스는 느리지만 바꾸기 쉬워요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가속기는 하이패스 전용 차로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빠르지만 바꾸려면 공사가 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>