<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Interface와 안쪽·바깥쪽</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Interface와 안쪽·바깥쪽</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">포트마다 이름을 붙여 방향을 나눠요</text>
<text x="110" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">내부망</text><rect x="76" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="66,312 154,312 162,324 58,324" fill="#6ea8fe"/><line x1="170" y1="300" x2="380" y2="300" stroke="#3d4b60" stroke-width="4"/><rect x="380" y="245" width="200" height="110" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="308" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">장치</text><line x1="580" y1="300" x2="790" y2="300" stroke="#3d4b60" stroke-width="4"/><text x="850" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">인터넷</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="358" y="282" width="44" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="380" y="307.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">A</text><rect x="558" y="282" width="44" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="580" y="307.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="290" y="199" width="180" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="380" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">안쪽 인터페이스</text><rect x="485" y="199" width="190" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="580" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">바깥쪽 인터페이스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,300;200,300;760,300;760,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="393" width="260" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">A로 들어와 B로 나가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="315" y="393" width="330" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">포트 하나하나가 인터페이스예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내부망과 인터넷 사이에 장치를 놓아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각 포트를 인터페이스라고 불러요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나가는 요청은 A로 들어와 B로 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">A·B로 방향과 안팎을 구분해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>