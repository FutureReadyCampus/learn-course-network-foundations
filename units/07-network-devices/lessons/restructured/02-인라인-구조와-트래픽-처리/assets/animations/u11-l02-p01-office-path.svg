<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>AI 요청이 지나는 길목</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">AI 요청이 지나는 길목</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">집과 달리 회사에는 장치가 여러 개예요</text>
<rect x="66" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="56,312 144,312 152,324 48,324" fill="#6ea8fe"/><text x="100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><text x="100" y="372" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.42</text><rect x="218" y="284" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="230" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="247" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="264" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="281" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="298" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="270" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">스위치</text><circle cx="450" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M435 294 h28 l-7 -7 M465 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="450" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">본사 게이트웨이</text><text x="450" y="374" text-anchor="middle" font-size="15" fill="#9aa3b2">192.168.10.1</text><text x="450" y="392" text-anchor="middle" font-size="15" fill="#9aa3b2">198.51.100.25</text><circle cx="640" cy="300" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M625 294 h28 l-7 -7 M655 306 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="640" y="350" text-anchor="middle" font-size="17" fill="#9aa3b2">ISP 라우터</text><rect x="816" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="826" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="826" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="850" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">AI 서비스</text><text x="850" y="382" text-anchor="middle" font-size="15" fill="#9aa3b2">203.0.113.80</text><line x1="150" y1="300" x2="215" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="325" y1="300" x2="420" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="480" y1="300" x2="610" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><line x1="670" y1="300" x2="810" y2="300" stroke="#3d4b60" stroke-width="4" stroke-dasharray="10 8"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="173" width="260" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">박 팀장 노트북의 요청</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="51" y="241" width="100" height="83" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;380,300;380,300" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="173" width="300" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">지나가는 장치는 모두 Inline</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="210" y="264" width="120" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="358" y="286" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M358 288 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="450" cy="235" r="16" fill="#ff7b72"/><path d="M443 228 l14 14 M457 228 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="350" y="173" width="260" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="196.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">이 목적지만 안 열려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="408" y="248" width="84" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="423" width="320" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">의심할 곳은 출구 장치부터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="312" y="417" width="336" height="46" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장 노트북의 요청이 출발해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치와 게이트웨이를 차례로 지나요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 사이트는 열리고 이 서비스만 막혀요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">원인은 경로 위 출구 장치에서 찾아요</text></g>

