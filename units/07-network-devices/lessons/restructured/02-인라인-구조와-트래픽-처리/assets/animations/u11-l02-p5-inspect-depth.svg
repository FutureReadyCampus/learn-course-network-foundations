<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>주소만 볼까, 내용까지 볼까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">주소만 볼까, 내용까지 볼까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">무엇을 읽느냐가 정확도와 속도를 정해요</text>
<rect x="140" y="190" width="340" height="180" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="141.5" y="191.5" width="337" height="58" rx="11" fill="#6ea8fe" fill-opacity="0.25"/><text x="310.0" y="227" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">헤더 · 주소와 포트</text><text x="310.0" y="318" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">내용</text><line x1="180" y1="278" x2="440" y2="278" stroke="#3d4b60" stroke-width="4"/><line x1="180" y1="298" x2="390" y2="298" stroke="#3d4b60" stroke-width="4"/><text x="700" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">처리 속도</text><rect x="560" y="250" width="280" height="30" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><ellipse cx="80" cy="219" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="80" cy="219" r="7" fill="#ffb454"/><rect x="560" y="250" width="260" height="30" rx="6" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="690" y="271" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">빠름</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><ellipse cx="80" cy="310" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="80" cy="310" r="7" fill="#ffb454"/><rect x="560" y="250" width="90" height="30" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="660" y="271" text-anchor="start" font-size="17" font-weight="700" fill="#ffb454">느림</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="186" width="348" height="70" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="136" y="248" width="348" height="126" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="310" y="413" width="340" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">패킷에는 헤더와 내용이 있어요</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="306.0" y="409.0" width="348" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="413" width="300" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">주소와 포트만 보면 빨라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="326.0" y="409.0" width="308" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="300" y="413" width="360" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">내용까지 보면 정확하지만 느려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="296.0" y="409.0" width="368" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="305" y="413" width="350" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">막을 기준에 필요한 깊이만 봐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="301.0" y="409.0" width="358" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">패킷은 헤더와 내용으로 이뤄져 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더의 주소와 포트만 읽으면 빨라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용까지 읽으면 더 오래 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기준에 필요한 만큼만 깊이 봐요</text></g>

