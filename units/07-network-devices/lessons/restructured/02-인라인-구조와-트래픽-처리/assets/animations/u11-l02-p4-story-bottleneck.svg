oke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="130" y="349.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">직원</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(830,235) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="830" y="349.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(830,235) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="830" y="349.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="82" y="199" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><rect x="235.0" y="234" width="190" height="112" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="4"/><circle cx="310" cy="272" r="6" fill="#6ea8fe" fill-opacity="1"/><circle cx="330" cy="272" r="6" fill="#6ea8fe" fill-opacity="0.6"/><circle cx="350" cy="272" r="6" fill="#6ea8fe" fill-opacity="0.3"/><text x="330" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">업로드 중</text><rect x="322" y="346" width="16" height="14" fill="#3d4b60"/><rect x="294" y="360" width="72" height="7" rx="3" fill="#3d4b60"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="475" y="237" width="270" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="610" y="262.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">회선 300Mbps → 1Gbps</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="471" y="229" width="278" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="111" width="167" height="78" rx="39" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="7 5"/><circle cx="784" cy="193" r="8" fill="#171a21" stroke="#c792ea" stroke-width="2.5"/><circle cx="800" cy="198" r="6" fill="#171a21" stroke="#c792ea" stroke-width="2.5"/><circle cx="816" cy="204" r="4" fill="#171a21" stroke="#c792ea" stroke-width="2.5"/><text x="720" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">돈을 들였는데</text><text x="720" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">왜 안 빨라지지?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="632.28" y="107.0" width="175.44" height="86" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="295" y="419" width="369" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">회선을 늘렸는데 왜 그대로 느릴까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">오후마다 디자이너들의 업로드가 느려져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사가 회선 계약을 올렸어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그래도 체감 속도는 그대로예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 느린 이유를 따져 봐요</text></g>

