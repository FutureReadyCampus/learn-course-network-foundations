tCount="indefinite"/><g transform="translate(750,245) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="750" y="359.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(750,245) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#e07b54"/><polygon points="0,32 8,32 11,62 4,70 -3,62" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#e07b54"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-14 -9 L-4 -14 M18 -9 L8 -14" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M-4 15 Q3 10 10 15" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><path d="M26 -16 q-6 9 0 13 q6 -4 0 -13z" fill="#9fd8ff"/></g><text x="750" y="359.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">박 팀장</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="162" y="209" width="96" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="202,207.0 222,207.0 212,218" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="134.51999999999998" y="133.0" width="210.96" height="74" rx="16" fill="#171a21" stroke="#c792