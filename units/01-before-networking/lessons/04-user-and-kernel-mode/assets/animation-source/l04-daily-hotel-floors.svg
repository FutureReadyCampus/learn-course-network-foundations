<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">호텔로 보는 컴퓨터</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">설비, 직원, 객실이 층을 나눠 맡아요</text>
<rect x="150" y="122" width="580" height="340" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><line x1="150" y1="235" x2="730" y2="235" stroke="#3d4b60" stroke-width="3" ></line><line x1="150" y1="348" x2="730" y2="348" stroke="#3d4b60" stroke-width="3" ></line><text x="170" y="401" font-size="24" font-weight="700" fill="#e6e8ec">기계 설비</text><text x="170" y="431" font-size="20" font-weight="700" fill="#7ee7c7">하드웨어</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="170" y="287" font-size="24" font-weight="700" fill="#e6e8ec">설비실·프런트</text><text x="170" y="317" font-size="20" font-weight="700" fill="#ffb454">Kernel mode</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="170" y="174" font-size="24" font-weight="700" fill="#e6e8ec">객실</text><text x="170" y="204" font-size="20" font-weight="700" fill="#6ea8fe">User mode</text></g><rect x="380" y="372" width="120" height="66" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60;#3d4b60" keyTimes="0;0.3;0.31;0.97;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="440" y="413" text-anchor="middle" font-size="20" fill="#e6e8ec">보일러</text><g><path d="M535 387 C549 401 545 419 535 419 C525 419 521 401 535 387 Z" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><path d="M535 387 C549 401 545 419 535 419 C525 419 521 401 535 387 Z" fill="#ffb454"/></g><rect x="625" y="392" width="90" height="70" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.8;0.81;0.97;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="670" y="434" text-anchor="middle" font-size="20" fill="#e6e8ec">출입구</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="630" y="354" width="80" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="670" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">NIC</text></g><circle cx="845" cy="410" r="40" fill="#0f1115" stroke="#6ea8fe" stroke-width="3"/><ellipse cx="845" cy="410" rx="16" ry="40" fill="none" stroke="#6ea8fe" stroke-width="2"/><line x1="805" y1="410" x2="885" y2="410" stroke="#6ea8fe" stroke-width="2" ></line><text x="845" y="350" text-anchor="middle" font-size="20" fill="#9aa3b2">바깥 세상</text><circle r="10" fill="#7ee7c7" opacity="0"><animateMotion path="M715 427 L805 410" keyPoints="0;0;1;1" keyTimes="0;0.84;0.9;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.835;0.84;0.9;0.905;1" dur="10s" repeatCount="indefinite"/></circle><circle r="10" fill="#7ee7c7" opacity="0"><animateMotion path="M715 427 L805 410" keyPoints="0;0;1;1" keyTimes="0;0.91;0.97;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.905;0.91;0.97;0.975;1" dur="10s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><circle cx="450" cy="262" r="12" fill="#ffb454"/><rect x="432" y="278" width="36" height="42" rx="14" fill="#ffb454"/><text x="482" y="298" font-size="20" fill="#e6e8ec">직원</text></g><circle r="10" fill="#ffb454" opacity="0"><animateMotion path="M450 320 L440 372" keyPoints="0;0;1;1" keyTimes="0;0.24;0.3;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.235;0.24;0.3;0.305;1" dur="10s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,22;0,22;0,0;0,0" keyTimes="0;0.61;0.65;0.69;0.72;1" dur="10s" repeatCount="indefinite"/><circle cx="420" cy="147" r="12" fill="#6ea8fe"/><rect x="402" y="163" width="36" height="42" rx="14" fill="#6ea8fe"/></g><text x="445" y="182" font-size="22" fill="#e6e8ec">Chrome</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><circle cx="600" cy="147" r="12" fill="#6ea8fe"/><rect x="582" y="163" width="36" height="42" rx="14" fill="#6ea8fe"/><text x="625" y="182" font-size="22" fill="#e6e8ec">메모장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.67;0.8;0.82;1" dur="10s" repeatCount="indefinite"/><line x1="464" y1="212" x2="496" y2="244" stroke="#ffb454" stroke-width="5" ></line><line x1="464" y1="244" x2="496" y2="212" stroke="#ffb454" stroke-width="5" ></line></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.8;0.82;1" dur="10s" repeatCount="indefinite"/><line x1="432" y1="208" x2="440" y2="252" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="5 5"></line></g><circle r="10" fill="#6ea8fe" opacity="0"><animateMotion path="M420 205 C430 240 440 250 450 262" keyPoints="0;0;1;1" keyTimes="0;0.73;0.78;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.725;0.73;0.78;0.785;1" dur="10s" repeatCount="indefinite"/></circle>
  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">만질 수 있는 기계 설비 = 하드웨어
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">직원이 켜야 보일러가 돌아가요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">손님이 머무는 객실 = User mode 앱
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">손님은 설비실 대신 직원에게 부탁해요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">바깥 세상과 이어진 출입구 = NIC
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
