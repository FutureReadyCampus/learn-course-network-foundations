<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">프런트 창구로 부탁하기</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">손님은 정해진 창구로만 요청해요</text>
<rect x="40" y="125" width="380" height="340" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="540" y="125" width="380" height="340" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="70" y="164" font-size="24" font-weight="700" fill="#e6e8ec">객실</text><text x="70" y="194" font-size="20" font-weight="700" fill="#6ea8fe">User mode</text><text x="570" y="164" font-size="24" font-weight="700" fill="#e6e8ec">설비 구역</text><text x="570" y="194" font-size="20" font-weight="700" fill="#ffb454">Kernel mode</text><rect x="470" y="125" width="20" height="135" fill="#3d4b60"/><rect x="470" y="320" width="20" height="145" fill="#3d4b60"/><rect x="458" y="260" width="44" height="60" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.4;0.41;0.97;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="480" y="250" text-anchor="middle" font-size="20" fill="#e6e8ec">창구</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="422" y="188" width="116" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">시스템 콜</text></g><rect x="466" y="380" width="28" height="22" rx="3" fill="#9aa3b2"/><path d="M472 380 V372 a8 8 0 0 1 16 0 V380" fill="none" stroke="#9aa3b2" stroke-width="4"/><rect x="790" y="250" width="100" height="160" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="3"/><line x1="790" y1="330" x2="890" y2="330" stroke="#3d4b60" stroke-width="3" ></line><rect x="805" y="290" width="70" height="16" rx="6" fill="#7ee7c7"/><rect x="805" y="308" width="70" height="16" rx="6" fill="#7ee7c7"/><rect x="805" y="370" width="70" height="16" rx="6" fill="#7ee7c7"/><rect x="805" y="388" width="70" height="16" rx="6" fill="#7ee7c7"/><text x="840" y="240" text-anchor="middle" font-size="20" fill="#9aa3b2">수건</text><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;215,30;215,30;0,0;0,0" keyTimes="0;0.22;0.27;0.405;0.43;1" dur="10s" repeatCount="indefinite"/><circle cx="220" cy="312" r="12" fill="#6ea8fe"/><rect x="202" y="328" width="36" height="42" rx="14" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.4;0.42;1" dur="10s" repeatCount="indefinite"/><line x1="464" y1="329" x2="496" y2="361" stroke="#ffb454" stroke-width="5" ></line><line x1="464" y1="361" x2="496" y2="329" stroke="#ffb454" stroke-width="5" ></line></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.44;0.98;1" dur="10s" repeatCount="indefinite"/><rect x="175" y="240" width="100" height="40" rx="12" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="225" y="268" text-anchor="middle" font-size="20" fill="#e6e8ec">수건?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="160" y="395" width="120" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="220" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">Chrome</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.58;0.6;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;255,30;255,30;380,-10;380,-10" keyTimes="0;0.45;0.5;0.52;0.56;1" dur="10s" repeatCount="indefinite"/><rect x="170" y="245" width="110" height="34" rx="6" fill="#e6e8ec"/><text x="225" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">수건 2장</text></g><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;110,0;110,0;0,0;0,0" keyTimes="0;0.61;0.65;0.67;0.71;1" dur="10s" repeatCount="indefinite"/><circle cx="660" cy="312" r="12" fill="#ffb454"/><rect x="642" y="328" width="36" height="42" rx="14" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="615" y="395" width="90" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="660" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">커널</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.69;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="760,0;760,0;660,0;480,-20;275,40;275,40" keyTimes="0;0.67;0.71;0.73;0.77;1" dur="10s" repeatCount="indefinite"/><rect x="-35" y="300" width="70" height="16" rx="6" fill="#7ee7c7"/></g>
  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">객실 손님에게 수건이 필요해졌어요
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">설비 구역은 잠겨 있어 손님이 못 들어가요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">정해진 창구로 '수건 2장'을 부탁해요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">직원이 대신 꺼내 창구로 건네줘요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">앱도 시스템 콜로 커널에 부탁해요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
