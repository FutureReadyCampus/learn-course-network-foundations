<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">엘리베이터와 507호 손님</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">장치 안의 펌웨어, 수화기를 드는 프로세스</text>
<rect x="40" y="125" width="420" height="340" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="500" y="125" width="420" height="340" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="250" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">엘리베이터</text><text x="710" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">507호 객실</text><rect x="80" y="175" width="120" height="280" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="3"/><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-185;0,-185;0,0;0,0" keyTimes="0;0.05;0.13;0.985;0.995;1" dur="10s" repeatCount="indefinite"/><rect x="90" y="370" width="100" height="80" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="115" y="395" width="50" height="30" rx="3" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.167;0.177;0.97;0.99;1" dur="10s" repeatCount="indefinite"/></rect><line x1="125" y1="389" x2="125" y2="395" stroke="#3d4b60" stroke-width="3" ></line><line x1="125" y1="425" x2="125" y2="431" stroke="#3d4b60" stroke-width="3" ></line><line x1="140" y1="389" x2="140" y2="395" stroke="#3d4b60" stroke-width="3" ></line><line x1="140" y1="425" x2="140" y2="431" stroke="#3d4b60" stroke-width="3" ></line><line x1="155" y1="389" x2="155" y2="395" stroke="#3d4b60" stroke-width="3" ></line><line x1="155" y1="425" x2="155" y2="431" stroke="#3d4b60" stroke-width="3" ></line></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.187;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="85" y="300" width="110" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="140" y="326" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">펌웨어</text></g><rect x="212" y="385" width="30" height="44" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><circle cx="227" cy="407" r="9" fill="#9aa3b2"><animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2;#9aa3b2" keyTimes="0;0.02;0.03;0.13;0.14;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="275" cy="392" r="12" fill="#6ea8fe"/><rect x="257" y="408" width="36" height="42" rx="14" fill="#6ea8fe"/><rect x="320" y="193" width="120" height="64" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="380" y="232.92" text-anchor="middle" font-size="22" fill="#e6e8ec">관리실</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="320" y="268" width="120" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="380" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">드라이버</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="380" y1="304" x2="195" y2="318" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 6"></line><text x="345" y="350" text-anchor="middle" font-size="20" fill="#e6e8ec">L2는 둘이 나눠 맡아요</text></g><rect x="530" y="250" width="80" height="205" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="3"/><rect x="545" y="268" width="50" height="28" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="570" y="289" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">507</text><line x1="700" y1="385" x2="890" y2="385" stroke="#3d4b60" stroke-width="5" ></line><line x1="720" y1="385" x2="720" y2="455" stroke="#3d4b60" stroke-width="4" ></line><line x1="870" y1="385" x2="870" y2="455" stroke="#3d4b60" stroke-width="4" ></line><rect x="760" y="352" width="60" height="33" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-50;0,-50;-80,-40;-80,-40;0,0;0,0" keyTimes="0;0.52;0.56;0.677;0.717;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="750" y="334" width="80" height="18" rx="9" fill="#e6e8ec"><animate attributeName="fill" values="#e6e8ec;#e6e8ec;#ffb454;#ffb454;#e6e8ec;#e6e8ec" keyTimes="0;0.52;0.53;0.97;0.99;1" dur="10s" repeatCount="indefinite"/></rect></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.667;0.687;1" dur="10s" repeatCount="indefinite"/><text x="850" y="300" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.677;0.697;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><circle cx="660" cy="312" r="12" fill="#6ea8fe"/><rect x="642" y="328" width="36" height="42" rx="14" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.697;0.717;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="575" y="180" width="190" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="670" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">손님 = 프로세스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.853;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="795" y="285" width="90" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="840" y="311" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">소켓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.853;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="730" y="248" text-anchor="middle" font-size="20" fill="#e6e8ec">주인: <tspan fill="#6ea8fe" font-weight="700">4321번 Chrome</tspan></text></g>
  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">버튼만 누르면 엘리베이터가 알아서 움직여요
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.157;0.167;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">안에 든 제어 보드 = 장치 속 펌웨어
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">L2의 일은 드라이버와 펌웨어에 나뉘어요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">507호에서 수화기가 들렸어요. 누가?
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">객실이 아니라 그 안의 손님이 들었어요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">소켓을 열고 닫는 주체는 프로세스예요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.823;0.833;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 6<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.157;0.167;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.157;0.167;0.323;0.333;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.323;0.333;0.49;0.5;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.657;0.667;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.657;0.667;0.823;0.833;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">6 / 6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.823;0.833;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
