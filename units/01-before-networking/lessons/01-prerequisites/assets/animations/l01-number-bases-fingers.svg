<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">손가락으로 감 잡는 진법</title><desc id="desc">열 손가락은 10진수, 두 손가락은 2진수, 네 손가락씩 두 묶음은 16진수의 모형입니다.</desc><rect width="960" height="540" rx="24" fill="#0f1115"/><style>text{font-family:system-ui,sans-serif;fill:#e6e8ec} .muted{fill:#aab3c2} .teal{fill:#7ee7c7} .blue{fill:#6ea8fe} .amber{fill:#ffb454} .box{fill:#1b2029;stroke:#485366;stroke-width:2}</style><text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700">진법은 한 자리에서 몇 가지를 세는지</text><text x="160" y="115" text-anchor="middle" class="amber" font-size="25">10진수 · 손가락 10개</text><text x="480" y="115" text-anchor="middle" class="teal" font-size="25">2진수 · 손가락 2개</text><text x="790" y="115" text-anchor="middle" class="blue" font-size="25">16진수 · 네 개씩 두 묶음</text><g fill="#ffb454"><circle cx="75" cy="180" r="7"/><circle cx="95" cy="180" r="7"/><circle cx="115" cy="180" r="7"/><circle cx="135" cy="180" r="7"/><circle cx="155" cy="180" r="7"/><circle cx="175" cy="180" r="7"/><circle cx="195" cy="180" r="7"/><circle cx="215" cy="180" r="7"/><circle cx="235" cy="180" r="7"/><circle cx="255" cy="180" r="7"/></g><text x="160" y="230" text-anchor="middle" font-size="23">0–9, 열 개를 세면 한 묶음</text><g fill="#7ee7c7"><circle cx="440" cy="196" r="16"><animate attributeName="cy" values="196;196;164;164;196" keyTimes="0;0.49;0.51;0.99;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><animate attributeName="fill" values="#3d4654;#3d4654;#7ee7c7;#7ee7c7;#3d4654" keyTimes="0;0.49;0.51;0.99;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle><circle cx="520" cy="196" r="16"><animate attributeName="cy" values="196;196;164;164;196;196;164;164;196" keyTimes="0;0.24;0.26;0.49;0.51;0.74;0.76;0.99;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><animate attributeName="fill" values="#3d4654;#3d4654;#7ee7c7;#7ee7c7;#3d4654;#3d4654;#7ee7c7;#7ee7c7;#3d4654" keyTimes="0;0.24;0.26;0.49;0.51;0.74;0.76;0.99;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle></g><text x="480" y="230" text-anchor="middle" font-size="22">00 → 01 → 10 → 11</text><text x="480" y="266" text-anchor="middle" font-size="18" class="muted">손가락 접힘 = 0 · 펴짐 = 1</text><g fill="#6ea8fe"><circle cx="690" cy="180" r="7"/><circle cx="714" cy="180" r="7"/><circle cx="738" cy="180" r="7"/><circle cx="762" cy="180" r="7"/><circle cx="790" cy="180" r="7"/><circle cx="814" cy="180" r="7"/><circle cx="838" cy="180" r="7"/><circle cx="862" cy="180" r="7"/></g><text x="740" y="230" text-anchor="middle" font-size="21">4비트</text><text x="840" y="230" text-anchor="middle" font-size="21">4비트</text><rect x="80" y="300" width="800" height="104" rx="16" class="box"/><text x="480" y="345" text-anchor="middle" font-size="26">1011 0010 = B2</text><text x="480" y="382" text-anchor="middle" class="muted" font-size="20">네 자리씩 두 묶음 · 각 묶음은 16가지 · 전체는 8비트</text><rect x="80" y="440" width="800" height="12" rx="6" fill="#222a35"/><rect x="80" y="440" width="800" height="12" rx="6" fill="#7ee7c7"><animate attributeName="opacity" values=".35;1;.35" dur="8s" repeatCount="indefinite"/></rect></svg>