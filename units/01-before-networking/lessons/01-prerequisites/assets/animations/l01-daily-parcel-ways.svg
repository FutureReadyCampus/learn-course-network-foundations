  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">주소를 보고 찾아가 전달한다, 이것이 개념입니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">어느 회사는 트럭으로 옮깁니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">어느 회사는 드론으로 옮깁니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">어느 회사는 지하철로 옮깁니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">방법은 바뀌어도 하려는 일은 그대로입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
