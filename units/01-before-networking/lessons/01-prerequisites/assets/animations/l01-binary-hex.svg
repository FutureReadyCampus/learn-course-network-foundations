<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 (항상 보임) -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">4비트씩 끊으면 16진수 한 글자</text>

  <!-- 이름표: 8비트 → 4비트 / 4비트 -->
  <text x="480" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">8비트
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.95;1" dur="14s" repeatCount="indefinite"/>
  </text>
  <g font-size="24" font-weight="700" fill="#9aa3b2" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.5;0.53;1" dur="14s" repeatCount="indefinite"/>
    <text x="300" y="106">4비트</text><text x="660" y="106">4비트</text>
  </g>

  <!-- 가운데 자르는 선 -->
  <line x1="480" y1="90" x2="480" y2="90" stroke="#ffb454" stroke-width="4" stroke-linecap="round">
    <animate attributeName="y2" values="90;90;200;200;90" keyTimes="0;0.2;0.26;0.95;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.76;0.78;0.95;1" dur="14s" repeatCount="indefinite"/>
  </line>

  <!-- 왼쪽 묶음 1011 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-40 0;-40 0;0 0" keyTimes="0;0.2;0.26;0.95;1" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(340 154)"><g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0.2;0.2;1" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.56;0.95;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(-340 -154)">
        <g fill="#171a21" stroke="#7ee7c7" stroke-width="3">
          <rect x="205" y="122" width="60" height="64" rx="8"/><rect x="275" y="122" width="60" height="64" rx="8"/>
          <rect x="345" y="122" width="60" height="64" rx="8"/><rect x="415" y="122" width="60" height="64" rx="8"/>
        </g>
        <g font-size="36" font-weight="700" fill="#e6e8ec" text-anchor="middle">
          <text x="235" y="167">1</text><text x="305" y="167">0</text><text x="375" y="167">1</text><text x="445" y="167">1</text>
        </g>
      </g>
    </g></g>
  </g>

  <!-- 오른쪽 묶음 0010 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;40 0;40 0;0 0" keyTimes="0;0.2;0.26;0.95;1" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(620 154)"><g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0.2;0.2;1" keyTimes="0;0.53;0.59;0.95;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.53;0.59;0.95;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(-620 -154)">
        <g fill="#171a21" stroke="#7ee7c7" stroke-width="3">
          <rect x="485" y="122" width="60" height="64" rx="8"/><rect x="555" y="122" width="60" height="64" rx="8"/>
          <rect x="625" y="122" width="60" height="64" rx="8"/><rect x="695" y="122" width="60" height="64" rx="8"/>
        </g>
        <g font-size="36" font-weight="700" fill="#e6e8ec" text-anchor="middle">
          <text x="515" y="167">0</text><text x="585" y="167">0</text><text x="655" y="167">1</text><text x="725" y="167">0</text>
        </g>
      </g>
    </g></g>
  </g>

  <!-- 16가지 표 두 개 (0~9, A~F) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.76;0.79;1" dur="14s" repeatCount="indefinite"/>
    <g font-size="24" font-weight="700" fill="#6ea8fe" text-anchor="middle">
      <text x="300" y="234">16가지</text><text x="660" y="234">16가지</text>
    </g>
    <!-- 강조 칸: 왼쪽 B, 오른쪽 2 -->
    <g fill="#ffb454" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.62;0.65;0.95;1" dur="14s" repeatCount="indefinite"/>
      <rect x="267" y="284" width="32" height="34" rx="4"/>
      <rect x="593" y="248" width="32" height="34" rx="4"/>
    </g>
    <g fill="none" stroke="#3d4b60" stroke-width="2">
      <rect x="165" y="248" width="270" height="70" rx="4"/><rect x="525" y="248" width="270" height="70" rx="4"/>
    </g>
    <g font-size="24" fill="#e6e8ec" text-anchor="middle">
      <text x="181" y="274">0</text><text x="215" y="274">1</text><text x="249" y="274">2</text><text x="283" y="274">3</text><text x="317" y="274">4</text><text x="351" y="274">5</text><text x="385" y="274">6</text><text x="419" y="274">7</text>
      <text x="181" y="310">8</text><text x="215" y="310">9</text><text x="249" y="310">A</text><text x="283" y="310">B</text><text x="317" y="310">C</text><text x="351" y="310">D</text><text x="385" y="310">E</text><text x="419" y="310">F</text>
      <text x="541" y="274">0</text><text x="575" y="274">1</text><text x="609" y="274">2</text><text x="643" y="274">3</text><text x="677" y="274">4</text><text x="711" y="274">5</text><text x="745" y="274">6</text><text x="779" y="274">7</text>
      <text x="541" y="310">8</text><text x="575" y="310">9</text><text x="609" y="310">A</text><text x="643" y="310">B</text><text x="677" y="310">C</text><text x="711" y="310">D</text><text x="745" y="310">E</text><text x="779" y="310">F</text>
    </g>
  </g>

  <!-- 왼쪽 결과 글자: 11 → B -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.57;0.95;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;140 0;140 0;0 0" keyTimes="0;0.78;0.83;0.95;1" dur="14s" repeatCount="indefinite"/>
    <rect x="260" y="118" width="80" height="72" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <text x="300" y="168" text-anchor="middle" font-size="40" font-weight="700" fill="#9aa3b2">11
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.63;0.65;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="173" text-anchor="middle" font-size="56" font-weight="700" fill="#7ee7c7" opacity="0">B
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.66;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 오른쪽 결과 글자: 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.61;0.95;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-140 0;-140 0;0 0" keyTimes="0;0.78;0.83;0.95;1" dur="14s" repeatCount="indefinite"/>
    <rect x="620" y="118" width="80" height="72" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <text x="660" y="173" text-anchor="middle" font-size="56" font-weight="700" fill="#7ee7c7">2</text>
  </g>

  <!-- 결론 -->
  <g text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.81;0.85;0.95;1" dur="14s" repeatCount="indefinite"/>
    <text x="480" y="262" font-size="34" font-weight="700" fill="#ffb454">= 10진수 178</text>
    <text x="480" y="310" font-size="24" fill="#9aa3b2">B(11) × 16 + 2 = 178</text>
  </g>

  <!-- 자막 바 -->
  <rect x="80" y="440" width="800" height="68" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="28" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="484">0과 1 여덟 칸, 이것이 8비트입니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.22;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="484" opacity="0">4칸씩 끊으면 한 묶음은 16가지 중 하나
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.5;0.52;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="484" opacity="0">1011은 11이라 B, 0010은 2
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="484" opacity="0" fill="#7ee7c7" font-weight="700">2진수 여덟 자리가 16진수 두 글자 B2로
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.8;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.21;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.5;0.51;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.78;0.79;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text></g>
</svg>
