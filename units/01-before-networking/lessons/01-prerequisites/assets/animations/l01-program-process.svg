<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">파일로 있는 프로그램과 실행 중인 프로세스</title><desc id="desc">실행 파일 notepad.exe를 실행하면 메모리에 프로세스가 생겨 PID를 받습니다.</desc><rect width="960" height="540" rx="24" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 3<animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 3<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 3<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text></g><style>text{font-family:system-ui,sans-serif;fill:#e6e8ec} .muted{fill:#aab3c2} .teal{fill:#7ee7c7} .blue{fill:#6ea8fe} .amber{fill:#ffb454} .box{fill:#1b2029;stroke:#485366;stroke-width:2}</style><text x="480" y="62" text-anchor="middle" font-size="34" font-weight="700">프로그램 파일을 실행하면 프로세스가 생긴다</text><rect x="70" y="155" width="300" height="210" rx="18" class="box"/><text x="220" y="210" text-anchor="middle" class="amber" font-size="25">저장 장치 · 파일</text><text x="220" y="280" text-anchor="middle" font-size="28">notepad.exe</text><text x="220" y="325" text-anchor="middle" class="muted" font-size="20">저장되어 있는 프로그램</text><path d="M390 260h150" stroke="#7ee7c7" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7ee7c7"/></marker></defs><rect x="585" y="155" width="300" height="210" rx="18" class="box"/><text x="735" y="210" text-anchor="middle" class="teal" font-size="25">메모리 · 실행 중</text><text x="735" y="270" text-anchor="middle" font-size="25">메모장 프로세스</text><text x="735" y="320" text-anchor="middle" class="blue" font-size="23">PID 4820</text><text x="480" y="425" text-anchor="middle" class="muted" font-size="21">창을 닫으면 프로세스는 끝나도 실행 파일은 남아 있다</text><circle cx="520" cy="260" r="9" fill="#ffb454"><animate attributeName="cx" values="390;550;390" dur="14s" repeatCount="indefinite"/></circle></svg>