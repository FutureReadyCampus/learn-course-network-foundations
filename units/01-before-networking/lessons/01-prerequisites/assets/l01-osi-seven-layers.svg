<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">통신 일을 일곱 역할로 나눈 OSI 모델</title><desc id="desc">OSI는 네트워크 통신을 일곱 역할로 나누어 설명하는 참조 모델입니다.</desc><rect width="960" height="540" rx="24" fill="#0f1115"/><style>text{font-family:system-ui,sans-serif;fill:#e6e8ec} .muted{fill:#aab3c2} .teal{fill:#7ee7c7} .blue{fill:#6ea8fe} .amber{fill:#ffb454} .box{fill:#1b2029;stroke:#485366;stroke-width:2}</style><text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700">OSI는 통신을 설명하는 일곱 역할의 지도</text><text x="170" y="110" text-anchor="middle" class="teal" font-size="24">내 컴퓨터</text><text x="790" y="110" text-anchor="middle" class="blue" font-size="24">상대 컴퓨터</text><rect x="95" y="135" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="162" text-anchor="middle" font-size="19">응용 · 앱이 만드는 요청</text><rect x="565" y="135" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="162" text-anchor="middle" font-size="19">응용 · 앱이 만드는 요청</text><rect x="95" y="183" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="210" text-anchor="middle" font-size="19">표현 · 데이터 모양</text><rect x="565" y="183" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="210" text-anchor="middle" font-size="19">표현 · 데이터 모양</text><rect x="95" y="231" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="258" text-anchor="middle" font-size="19">세션 · 대화 관리</text><rect x="565" y="231" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="258" text-anchor="middle" font-size="19">세션 · 대화 관리</text><rect x="95" y="279" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="306" text-anchor="middle" font-size="19">전송 · 끝과 끝 전달</text><rect x="565" y="279" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="306" text-anchor="middle" font-size="19">전송 · 끝과 끝 전달</text><rect x="95" y="327" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="354" text-anchor="middle" font-size="19">네트워크 · 길 찾기</text><rect x="565" y="327" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="354" text-anchor="middle" font-size="19">네트워크 · 길 찾기</text><rect x="95" y="375" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="402" text-anchor="middle" font-size="19">데이터 링크 · 이웃 전달</text><rect x="565" y="375" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="402" text-anchor="middle" font-size="19">데이터 링크 · 이웃 전달</text><rect x="95" y="423" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="245" y="450" text-anchor="middle" font-size="19">물리 · 전기·빛 신호</text><rect x="565" y="423" width="300" height="38" rx="8" fill="#1b2029" stroke="#485366"/><text x="715" y="450" text-anchor="middle" font-size="19">물리 · 전기·빛 신호</text><path d="M405 180h145" stroke="#7ee7c7" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-40" dur="16s" repeatCount="indefinite"/></path><text x="480" y="515" text-anchor="middle" class="muted" font-size="20">일곱 프로그램이나 장비가 아니라, 통신 역할을 나눈 설명 모형</text></svg>