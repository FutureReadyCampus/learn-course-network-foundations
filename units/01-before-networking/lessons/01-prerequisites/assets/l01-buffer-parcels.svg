<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">택배가 잠시 머무는 분류장 버퍼</title><desc id="desc">불규칙하게 도착하는 상자를 선반 버퍼에 잠시 쌓아 일정한 속도로 내보냅니다.</desc><rect width="960" height="540" rx="24" fill="#0f1115"/><style>text{font-family:system-ui,sans-serif;fill:#e6e8ec} .muted{fill:#aab3c2} .teal{fill:#7ee7c7} .blue{fill:#6ea8fe} .amber{fill:#ffb454} .box{fill:#1b2029;stroke:#485366;stroke-width:2}</style><text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700">버퍼는 잠시 쌓아 두는 선반</text><text x="150" y="128" text-anchor="middle" class="amber" font-size="24">들쑥날쑥 도착</text><text x="480" y="128" text-anchor="middle" class="teal" font-size="24">임시 선반 · 버퍼</text><text x="805" y="128" text-anchor="middle" class="blue" font-size="24">일정하게 전달</text><rect x="315" y="170" width="330" height="230" rx="15" class="box"/><path d="M340 280h280M340 355h280" stroke="#7ee7c7" stroke-width="5"/><rect x="355" y="218" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="420" y="218" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="485" y="218" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="550" y="218" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="355" y="293" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="420" y="293" width="48" height="42" rx="6" fill="#ffb454"><animate attributeName="opacity" values=".4;1;.4" dur="14s" repeatCount="indefinite" begin="2s"/></rect><rect x="485" y="2