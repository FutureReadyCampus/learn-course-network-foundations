<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">한 칸씩 오르는 학교 과정</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">앞 과정이 다음 과정의 전제예요</text>
<rect x="100" y="400" width="190" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="195" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">1 초등학교</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="290" y="340" width="190" height="120" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="385" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">2 중학교</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="480" y="280" width="190" height="180" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="575" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">3 고등학교</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><rect x="670" y="220" width="190" height="240" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.6;0.61;0.66;0.67;1" dur="15s" repeatCount="indefinite"/></rect><text x="765" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec">4 대학교</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><path d="M637 302 L645 310 L660 293" fill="none" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69;0.71;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><path d="M447 362 L455 370 L470 353" fill="none" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.76;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><path d="M257 422 L265 430 L280 413" fill="none" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g><animateTransform attributeName="transform" type="translate" values="195,400;195,400;195,340;385,340;385,340;385,280;575,280;575,280;575,220;765,220;765,220;195,400;195,400" keyTimes="0;0.22;0.24;0.26;0.32;0.34;0.36;0.44;0.46;0.48;0.97;0.98;1" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-38" width="44" height="36" rx="14" fill="#6ea8fe" fill-opacity="0.85"/><circle cx="0" cy="-58" r="16" fill="#6ea8fe"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><polygon points="-24,-75 0,-84 24,-75 0,-66" fill="#ffb454"/><line x1="18" y1="-75" x2="22" y2="-60" stroke="#ffb454" stroke-width="3"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.81;0.83;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><circle cx="140" cy="170" r="22" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="140" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">1</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.835;0.855;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><line x1="162" y1="170" x2="218" y2="170" stroke="#7ee7c7" stroke-width="4" ></line></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.835;0.855;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><circle cx="240" cy="170" r="22" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="240" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">2</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.86;0.88;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><line x1="262" y1="170" x2="318" y2="170" stroke="#7ee7c7" stroke-width="4" ></line></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.86;0.88;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><circle cx="340" cy="170" r="22" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="340" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">3</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.885;0.905;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><line x1="362" y1="170" x2="418" y2="170" stroke="#7ee7c7" stroke-width="4" ></line></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.885;0.905;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><circle cx="440" cy="170" r="22" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/><text x="440" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.92;0.97;0.99;1" dur="15s" repeatCount="indefinite"/><text x="290" y="236" text-anchor="middle" font-size="22" fill="#e6e8ec"><tspan fill="#7ee7c7" font-weight="700">직렬</tspan>: 한 줄로 이어진 전제</text></g>
  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">초등학교(1)부터 시작해요
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">앞 과정을 마쳐야 다음 칸에 올라요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">대학교(4)는 고등학교(3) 위에 서요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">대학을 마쳤다면 고·중·초도 거쳤겠죠
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">한 줄로 이어진 전제가 계층 구조예요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text></g>
</svg>
