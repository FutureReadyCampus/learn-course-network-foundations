<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc" lang="ko"><title id="title">수신 버퍼를 읽으면 더 받을 공간이 늘어난다</title><desc id="desc">한 칸이 1000바이트인 8칸 버퍼에 처음에는 읽기 대기 데이터가 6칸, 빈 공간이 2칸이다. 브라우저가 2000바이트를 읽으면 데이터 4칸과 빈 공간 4칸이 된다.</desc>
