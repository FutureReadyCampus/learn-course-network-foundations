<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ACK는 받은 범위를 알려 줘요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ACK는 받은 범위를 알려 줘요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">확인되지 않은 데이터는 다시 보낼 수 있어요</text>
<rect x="76" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="261" width="52" height="32" fill="#3d4b60"/><rect x="105" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="310" width="44" height="5" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="816" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="806,302 894,302 902,314 798,314" fill="#6ea8fe"/><text x="850" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><line x1="180" y1="305" x2="780" y2="305" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;800,305;800,305" keyTimes="0.000;0.025;0.163;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="778" y="291" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M778 293 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,250;800,250;220,250;220,250" keyTimes="0.000;0.287;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-89" y="-16" width="179" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="6.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ACK: 여기까지 받음</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.438;0.453;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="250" cy="250" r="16" fill="#7ee7c7"/><path d="M242 250 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">받은 범위를 알려 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;480,305;480,305" keyTimes="0.000;0.525;0.637;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.690;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="480" cy="305" r="16" fill="#ff7b72"/><path d="M473 298 l14 14 M487 298 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="110" cy="195" r="16" fill="#ffb454"/><text x="110" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">확인이 오지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;800,305;800,305" keyTimes="0.000;0.775;0.925;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.925;0.940;1" dur="16s" repeatCount="indefinite"/><rect x="778" y="291" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M778 293 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><circle cx="850" cy="215" r="16" fill="#7ee7c7"/><path d="M842 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">확인되지 않은 데이터를 다시 보내요 (재전송)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 TCP가 데이터를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">받은 범위를 ACK로 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 데이터는 확인이 오지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">확인되지 않은 데이터를 재전송해요</text></g>

