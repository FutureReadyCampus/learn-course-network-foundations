<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>벨에 대답해도 서류가 전달됐을까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">벨에 대답해도 서류가 전달됐을까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">건물에 사람이 있다는 것과 담당자가 받았다는 것은 달라요</text>
<rect x="520" y="122" width="400" height="232" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="720" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">회사 건물</text><rect x="550" y="166" width="340" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="720.0" y="200.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">안내데스크 (벨에 대답)</text><rect x="550" y="256" width="340" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="720.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">담당 직원</text><circle cx="110" cy="227" r="16" fill="#6ea8fe"/><rect x="92" y="247" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="319" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><line x1="190" y1="255" x2="520" y2="255" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,194;200,194;545,194;545,194" keyTimes="0.000;0.025;0.175;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="546" y="162" width="348" height="64" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="545,194;545,194;200,194;200,194" keyTimes="0.000;0.275;0.425;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="870" cy="194" r="16" fill="#7ee7c7"/><path d="M862 194 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="206" y="314" width="188" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">건물에 사람은 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="546" y="252" width="348" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><circle cx="870" cy="284" r="16" fill="#ffb454"/><text x="870" y="291" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">서류가 담당 직원에게 갔는지는 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="200" y1="284" x2="524" y2="284" stroke="#7ee7c7" stroke-width="6"/><polygon points="540,284 516,272 516,296" fill="#7ee7c7"/><rect x="546" y="252" width="348" height="64" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="240" y="313" width="120" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="300" y="336.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">등기 · 엽서</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">프로그램에 전달하는 일을 맡아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내데스크 벨을 눌러 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안내데스크가 대답했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">담당 직원이 서류를 받았는지는 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">담당 직원에게 전달하는 방법이 따로 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>