<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>받았다는 소식이 돌아와요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">받았다는 소식이 돌아와요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">소식이 없으면 같은 물건을 다시 보내요</text>
<circle cx="110" cy="255" r="16" fill="#6ea8fe"/><rect x="92" y="275" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">판매자</text><polygon points="810,294 850,260 890,294" fill="#9aa3b2"/><rect x="818" y="294" width="64" height="48" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><rect x="841" y="314" width="18" height="28" fill="#3d4b60"/><text x="850" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 집</text><line x1="180" y1="305" x2="780" y2="305" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;800,305;800,305" keyTimes="0.000;0.025;0.163;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="782" y="291" width="36" height="28" rx="3" fill="#ffb454"/><rect x="796" y="291" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="800,250;800,250;220,250;220,250" keyTimes="0.000;0.287;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-50" y="-16" width="100" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="6.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">수령 문자</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.438;0.453;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><circle cx="250" cy="250" r="16" fill="#7ee7c7"/><path d="M242 250 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">받았다는 소식이 돌아와요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;480,305;480,305" keyTimes="0.000;0.525;0.637;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.690;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="480" cy="305" r="16" fill="#ff7b72"/><path d="M473 298 l14 14 M487 298 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="110" cy="195" r="16" fill="#ffb454"/><text x="110" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">소식이 오지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;800,305;800,305" keyTimes="0.000;0.775;0.925;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.925;0.940;1" dur="15s" repeatCount="indefinite"/><rect x="782" y="291" width="36" height="28" rx="3" fill="#ffb454"/><rect x="796" y="291" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/><circle cx="850" cy="215" r="16" fill="#7ee7c7"/><path d="M842 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">같은 물건을 다시 보내요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">판매자가 택배를 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">집에서 받았다는 문자가 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다음 택배는 소식이 오지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소식이 없어서 같은 물건을 다시 보내요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>