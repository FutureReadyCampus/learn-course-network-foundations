<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>Listen은 연결을 기다리는 상태예요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">Listen은 연결을 기다리는 상태예요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">접속하려면 IP 주소와 포트 번호를 알아야 해요</text>
<rect x="520" y="120" width="410" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="725" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버 컴퓨터</text><rect x="560" y="170" width="330" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="725" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">80번 소켓: Listen</text><rect x="560" y="280" width="330" height="76" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="725" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">8080번: 대기 소켓 없음</text><rect x="76" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="66,282 154,282 162,294 58,294" fill="#6ea8fe"/><text x="110" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="556" y="166" width="338" height="84" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,208;200,208;545,208;545,208" keyTimes="0.000;0.275;0.425;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.438;0.453;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="905" cy="208" r="16" fill="#7ee7c7"/><path d="M897 208 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="223" y="324" width="155" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="300" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">연결을 받아 줘요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,318;200,318;545,318;545,318" keyTimes="0.000;0.525;0.675;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.688;0.703;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="905" cy="318" r="16" fill="#ff7b72"/><path d="M898 311 l14 14 M912 311 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="214" y="324" width="171" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="300" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">받을 소켓이 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">연결을 받으려면 먼저 기다리는 상태여야 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 프로그램이 80번에서 Listen해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결 요청이 오면 연결을 받아 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기다리는 소켓이 없는 포트는 받을 수 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 Listen 상태여야 연결을 받아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>