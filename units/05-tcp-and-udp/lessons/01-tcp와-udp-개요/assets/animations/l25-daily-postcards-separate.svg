<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>엽서는 따로따로 가요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">엽서는 따로따로 가요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">보낸 뒤 확인해 주는 사람은 없어요</text>
<circle cx="110" cy="255" r="16" fill="#6ea8fe"/><rect x="92" y="275" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><circle cx="850" cy="255" r="16" fill="#6ea8fe"/><rect x="832" y="275" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><line x1="180" y1="305" x2="780" y2="305" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;480,305;480,305" keyTimes="0.000;0.025;0.175;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="0" y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">A</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.188;0.203;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><circle cx="480" cy="305" r="16" fill="#ff7b72"/><path d="M473 298 l14 14 M487 298 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,305;200,305;760,305;760,305" keyTimes="0.000;0.275;0.425;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/><text x="0" y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">B</text></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">연결 절차 없이 바로 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">각각 따로 보낸 별개의 메시지예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="714" y="198" width="152" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">받은 것: B 한 통</text><circle cx="110" cy="215" r="16" fill="#ffb454"/><text x="110" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">A는 잘 갔는지 알려 주지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="357" y="182" width="247" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="206.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">확인 · 재전송 · 윈도 없음</text><text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">필요하면 프로그램이 직접 마련해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">엽서 A를 그냥 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">엽서 B를 따로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">B만 도착해도 A가 갔는지는 알려 주지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">필요하면 보내는 사람이 직접 확인해야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>