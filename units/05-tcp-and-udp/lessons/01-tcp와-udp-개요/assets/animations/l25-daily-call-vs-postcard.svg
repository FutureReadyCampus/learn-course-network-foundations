<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>연결 있는 전화, 연결 없는 엽서</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">연결 있는 전화, 연결 없는 엽서</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TCP와 UDP의 차이를 일상에서 비교해요</text>
<rect x="30" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="250" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">전화 통화</text><rect x="490" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="710" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">엽서</text><rect x="88" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="308" r="3" fill="#6ea8fe"/><text x="110" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="368" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="375" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="390" cy="308" r="3" fill="#6ea8fe"/><text x="390" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><rect x="548" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="555" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="570" cy="308" r="3" fill="#6ea8fe"/><text x="570" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="828" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="308" r="3" fill="#6ea8fe"/><text x="850" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="157" y="182" width="187" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="250" y="206.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">연결: 서로 통화 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="72" y="184" width="77" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="205.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">기억 중</text><rect x="352" y="184" width="77" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="390" y="205.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">기억 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="390,395;390,395;110,395;110,395" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-38" y="-16" width="75" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="0" y="5.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">들려요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="600,240;600,240;820,240;820,240" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="710" y="360" text-anchor="middle" font-size="17" fill="#9aa3b2">돌아오는 대답은 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="250" y="460" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">연결을 서로 기억해요</text><text x="710" y="460" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">연결이 없어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전화는 서로 연결된 약속이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 연결하고, 양쪽이 그 사실을 기억해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통화는 ‘들려요’가 돌아오고 엽서는 그냥 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전화는 연결을 기억하고, 엽서에는 연결이 없어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>