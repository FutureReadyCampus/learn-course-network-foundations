<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>3000번 번호표에서 80번 창구로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">3000번 번호표에서 80번 창구로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">건물 주소와 창구 번호로 받는 곳을 구분해요</text>
<rect x="30" y="125" width="270" height="230" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="165" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">A동 12호</text><circle cx="120" cy="215" r="16" fill="#6ea8fe"/><rect x="102" y="235" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="120" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">나</text><rect x="660" y="125" width="270" height="230" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="795" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">B동 20호</text><rect x="690" y="186" width="210" height="80" rx="8" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><text x="795" y="238" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454">80번 창구</text><text x="795" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">대기 중</text><line x1="300" y1="245" x2="660" y2="245" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="300" y1="245" x2="660" y2="245" stroke="#7ee7c7" stroke-width="6"/></g><rect x="366" y="223" width="68" height="40" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="360" y="215" width="80" height="10" rx="3" fill="#7ee7c7"/><rect x="378" y="233" width="44" height="18" fill="#3d4b60"/><text x="400" y="285" text-anchor="middle" font-size="17" fill="#9aa3b2">경비실</text><polygon points="520,235 560,211 600,235" fill="#6ea8fe"/><rect x="524" y="235" width="72" height="38" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="540" y="251" width="40" height="22" fill="#3d4b60"/><text x="560" y="295" text-anchor="middle" font-size="17" fill="#9aa3b2">물류센터</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="686" y="182" width="218" height="88" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="699" y="314" width="192" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="795" y="335.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">80번 창구가 열려 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="153" y="214" width="124" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="215" y="236.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">번호표 3000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,245;240,245;680,245;680,245" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="150" y="380" width="660" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="480" y="420" text-anchor="middle" font-size="21" font-weight="700" fill="#e6e8ec">A동 12호 번호표 3000 → B동 20호 80번 창구</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="686" y="182" width="218" height="88" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="357" y="143" width="246" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">동·호수 + 번호 = 하나의 길</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">B동 20호는 80번 창구를 열고 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 번호표 3000을 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 요청은 경비실과 물류센터를 지나 80번으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양 끝의 주소와 번호가 하나의 길을 만들어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>