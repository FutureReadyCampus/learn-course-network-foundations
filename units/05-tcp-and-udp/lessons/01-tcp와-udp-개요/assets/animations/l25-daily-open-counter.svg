<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>문을 연 창구만 손님을 받아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">문을 연 창구만 손님을 받아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서버는 창구를 열고 기다려요</text>
<rect x="520" y="120" width="410" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="725" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">가게</text><rect x="560" y="170" width="330" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="725" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">80번 창구: 영업 중</text><rect x="560" y="280" width="330" height="76" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="725" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">81번 창구: 닫힘</text><circle cx="110" cy="242" r="16" fill="#6ea8fe"/><rect x="92" y="262" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="110" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">손님</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="556" y="166" width="338" height="84" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,208;200,208;545,208;545,208" keyTimes="0.000;0.275;0.425;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.438;0.453;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="905" cy="208" r="16" fill="#7ee7c7"/><path d="M897 208 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="233" y="324" width="133" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="300" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">손님을 받아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,318;200,318;545,318;545,318" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.688;0.703;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="905" cy="318" r="16" fill="#ff7b72"/><path d="M898 311 l14 14 M912 311 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="214" y="324" width="171" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="300" y="346.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">받을 창구가 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">연결을 받으려면 먼저 기다리는 상태여야 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">80번 창구는 열려 있고 손님을 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">손님이 오면 80번 창구가 받아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">닫힌 창구에는 받을 사람이 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">창구를 먼저 열어 두고 기다려야 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>