<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>보관함에 남은 자리를 알려 줘요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">보관함에 남은 자리를 알려 줘요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">주인이 꺼내 가면 자리가 늘어나요</text>
<rect x="272" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="324" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="376" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="428" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="480" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="532" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="584" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="636" y="280" width="46" height="60" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="477" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">보관함</text><circle cx="100" cy="250" r="16" fill="#6ea8fe"/><rect x="82" y="270" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="100" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">판매자</text><circle cx="850" cy="250" r="16" fill="#6ea8fe"/><rect x="832" y="270" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="850" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">주인</text><g><rect x="272" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><rect x="324" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><rect x="376" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><rect x="428" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="480" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/><rect x="532" y="280" width="46" height="60" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="3"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="272" y1="372" x2="578" y2="372" stroke="#ffb454" stroke-width="4"/><line x1="272" y1="372" x2="272" y2="360" stroke="#ffb454" stroke-width="4"/><line x1="578" y1="372" x2="578" y2="360" stroke="#ffb454" stroke-width="4"/><rect x="348" y="382" width="153" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="425.0" y="404.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">아직 안 꺼낸 6칸</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="584" y1="372" x2="682" y2="372" stroke="#7ee7c7" stroke-width="4"/><line x1="584" y1="372" x2="584" y2="360" stroke="#7ee7c7" stroke-width="4"/><line x1="682" y1="372" x2="682" y2="360" stroke="#7ee7c7" stroke-width="4"/><rect x="567" y="382" width="132" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="633.0" y="404.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">남은 자리 2칸</text><circle cx="150" cy="190" r="16" fill="#ffb454"/><text x="150" y="197" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="150" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">더 보내도 될까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="800" y1="310" x2="756" y2="310" stroke="#7ee7c7" stroke-width="6"/><polygon points="740,310 764,298 764,322" fill="#7ee7c7"/><text x="770" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">꺼내 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="480" y1="372" x2="682" y2="372" stroke="#7ee7c7" stroke-width="4"/><line x1="480" y1="372" x2="480" y2="360" stroke="#7ee7c7" stroke-width="4"/><line x1="682" y1="372" x2="682" y2="360" stroke="#7ee7c7" stroke-width="4"/><rect x="515" y="382" width="132" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="581.0" y="404.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">남은 자리 4칸</text><line x1="160" y1="310" x2="246" y2="310" stroke="#7ee7c7" stroke-width="6"/><polygon points="262,310 238,298 238,322" fill="#7ee7c7"/><text x="480" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">여유가 늘어난 만큼 알려 줘요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">택배가 보관함에 6칸 들어 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남은 자리는 2칸이라 조심해야 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">주인이 2칸을 꺼내 갔어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">남은 자리 4칸을 판매자에게 알려 줘요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>