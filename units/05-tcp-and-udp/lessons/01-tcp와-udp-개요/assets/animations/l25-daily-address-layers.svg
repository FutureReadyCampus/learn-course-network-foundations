<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>겹겹이 붙는 주소</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">겹겹이 붙는 주소</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">같은 내용도 겹마다 이름이 달라져요</text>
<text x="30" y="150" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">보낼 내용</text><line x1="20" y1="167" x2="940" y2="167" stroke="#3d4b60" stroke-width="2"/><text x="30" y="201" text-anchor="start" font-size="20" font-weight="700" fill="#7ee7c7">받을 담당자</text><text x="30" y="231" text-anchor="start" font-size="18" fill="#9aa3b2">30번 책상</text><line x1="20" y1="257" x2="940" y2="257" stroke="#3d4b60" stroke-width="2"/><text x="30" y="291" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">받을 건물</text><text x="30" y="321" text-anchor="start" font-size="18" fill="#9aa3b2">서울 3동 12호</text><line x1="20" y1="347" x2="940" y2="347" stroke="#3d4b60" stroke-width="2"/><text x="30" y="381" text-anchor="start" font-size="20" font-weight="700" fill="#c792ea">이번 구간 인수자</text><text x="30" y="411" text-anchor="start" font-size="18" fill="#9aa3b2">택배 기사</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g transform="translate(380,120)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">내용</text></g><rect x="795" y="127" width="130" height="30" rx="15" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="860" y="147.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">내용만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g transform="translate(380,193)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">책상</text></g><g transform="translate(478,193)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">내용</text></g><rect x="795" y="200" width="130" height="30" rx="15" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="860" y="220.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">책상 번호를 붙인 것</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g transform="translate(380,283)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">건물</text></g><g transform="translate(478,283)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">책상</text></g><g transform="translate(576,283)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">내용</text></g><rect x="795" y="290" width="130" height="30" rx="15" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="860" y="310.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">건물 주소를 붙인 것</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g transform="translate(380,373)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">구간</text></g><g transform="translate(478,373)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">건물</text></g><g transform="translate(576,373)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">책상</text></g><g transform="translate(674,373)"><rect x="0" y="0" width="90" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="45" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">내용</text></g><rect x="795" y="380" width="130" height="30" rx="15" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="860" y="400.04" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1115">구간 인수자를 붙인 것</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">보낼 내용을 먼저 준비해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 받을 담당자의 책상 번호를 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 위에 받을 건물 주소를 붙여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마지막으로 이번 구간 인수자를 붙여요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>