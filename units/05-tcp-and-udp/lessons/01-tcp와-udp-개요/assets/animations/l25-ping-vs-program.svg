<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ping 응답과 프로그램 전달은 달라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ping 응답과 프로그램 전달은 달라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">TCP와 UDP는 프로그램 사이의 전달을 맡아요</text>
<rect x="520" y="122" width="400" height="232" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><text x="720" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">서버 컴퓨터</text><rect x="550" y="166" width="340" height="56" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="720.0" y="200.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">ping 응답 (ICMP)</text><rect x="550" y="256" width="340" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="720.0" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">웹 서버 프로그램</text><rect x="76" y="221" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="228" width="52" height="30" fill="#3d4b60"/><polygon points="66,267 154,267 162,279 58,279" fill="#6ea8fe"/><text x="110" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">내 PC</text><line x1="190" y1="255" x2="520" y2="255" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="200,194;200,194;545,194;545,194" keyTimes="0.000;0.025;0.175;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="162" width="348" height="64" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="545,194;545,194;200,194;200,194" keyTimes="0.000;0.275;0.425;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="870" cy="194" r="16" fill="#7ee7c7"/><path d="M862 194 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><rect x="171" y="314" width="259" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="336.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버가 응답했어요 · 왕복 시간</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="252" width="348" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/><circle cx="870" cy="284" r="16" fill="#ffb454"/><text x="870" y="291" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">?</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">프로그램이 요청을 받았는지는 몰라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="200" y1="284" x2="524" y2="284" stroke="#7ee7c7" stroke-width="6"/><polygon points="540,284 516,272 516,296" fill="#7ee7c7"/><rect x="546" y="252" width="348" height="64" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="243" y="313" width="114" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="300" y="336.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">TCP · UDP</text><text x="480" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">프로그램에 전달하는 일을 맡아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ping 요청을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 ping에 응답했어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 서버 프로그램이 받았는지는 몰라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">프로그램 전달은 TCP와 UDP가 맡아요</text></g>

