<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 330" role="group" aria-labelledby="lesson-25-basic-export-title lesson-25-basic-export-desc" lang="ko"><title id="lesson-25-basic-export-title">TCP와 UDP 개요 · 학습 흐름</title><desc id="lesson-25-basic-export-desc">강의 설명을 읽는 순서와 각 개념의 제목을 보여 줍니다.</desc><defs><marker id="lesson-25-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 17px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-25-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">TCP와 UDP는 프로그램</tspan><tspan x="143.0" dy="25">사이에서 어떤 일을 할까?</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">포트와 소켓으로</tspan><tspan x="421.0" dy="25">클라이언트와 서버를</tspan><tspan x="421.0" dy="25">연결한다</tspan></text><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">Listen · 연결을</tspan><tspan x="699.0" dy="25">기다리기</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">TCP 연결은 양쪽이</tspan><tspan x="977.0" dy="25">통신 상태를 관리하는</tspan><tspan x="977.0" dy="25">약속이다</tspan></text><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">TCP/IP 계층과</tspan><tspan x="143.0" dy="25">데이터 단위</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">보냈다는 것과</tspan><tspan x="421.0" dy="25">받았다는 것은 같을까?</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">도착했는데 프로그램이</tspan><tspan x="699.0" dy="25">아직 읽지 않았다면?</tspan></text><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">UDP의 사용 방식 정리</tspan></text></svg>
