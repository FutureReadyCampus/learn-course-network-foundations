<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-29-basic-export-title lesson-29-basic-export-desc" lang="ko"><title id="lesson-29-basic-export-title">TCP &#x27;연결&#x27;이라는 착각 · 학습 흐름</title><desc id="lesson-29-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-29-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-29-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/></g><a href="../lesson-29.html#concept-basic-29-01" target="_top" aria-label="케이블을 뽑으면 TCP는 끊길까 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">케이블을 뽑으면</tspan><tspan x="143.0" dy="25">TCP는 끊길까</tspan></text></a><a href="../lesson-29.html#concept-basic-29-02" target="_top" aria-label="물리 연결과 논리 연결 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">물리 연결과 논리</tspan><tspan x="421.0" dy="25">연결</tspan></text></a><a href="../lesson-29.html#concept-basic-29-03" target="_top" aria-label="끊어진 시간의 영향 설명으로 이동"><rect x="574" y="1