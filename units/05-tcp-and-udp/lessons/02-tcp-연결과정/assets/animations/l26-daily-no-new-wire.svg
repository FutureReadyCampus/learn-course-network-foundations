<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>통화 중은 새 전선이 아니에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">통화 중은 새 전선이 아니에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">양쪽이 통화 상태를 기록해 둔 거예요</text>
<line x1="170" y1="262" x2="790" y2="262" stroke="#3d4b60" stroke-width="3"/><rect x="88" y="215" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="225" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="283" r="3" fill="#6ea8fe"/><text x="110" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="828" y="215" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="225" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="283" r="3" fill="#6ea8fe"/><text x="850" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">친구</text><circle cx="330" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M315 249 h28 l-7 -7 M345 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="330" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">기지국</text><circle cx="480" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 249 h28 l-7 -7 M495 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">기지국</text><circle cx="630" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M615 249 h28 l-7 -7 M645 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="630" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">기지국</text><g><rect x="68" y="154" width="83" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">통화 중</text><rect x="808" y="154" width="83" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">통화 중</text><rect x="30" y="350" width="210" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="135" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">기록하는 것</text><text x="135" y="406" text-anchor="middle" font-size="15" fill="#9aa3b2">상대 번호 · 통화 상태</text><rect x="720" y="350" width="210" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="825" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">기록하는 것</text><text x="825" y="406" text-anchor="middle" font-size="15" fill="#9aa3b2">상대 번호 · 통화 상태</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="150" y1="205" x2="810" y2="205" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 8"/><circle cx="480" cy="205" r="16" fill="#ff7b72"/><path d="M473 198 l14 14 M487 198 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">새 전용선은 깔리지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,262;180,262;780,262;780,262" keyTimes="0.000;0.525;0.713;1.000" dur="15s" repeatCount="indefinite"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#ffb454"/><rect x="-4" y="-14" width="8" height="28" fill="#0f1115" fill-opacity="0.25"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="405" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">이미 있는 통신망으로 이야기가 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="364" y="438" width="231" height="35" rx="18" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="462.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">연결됨 ≠ 용건이 처리됨</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">두 전화기는 서로 통화 중이라고 기록해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통화한다고 새 전용선이 깔리지는 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">목소리는 이미 있는 통신망을 지나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">통화 중이라는 것이 용건 처리를 뜻하지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>