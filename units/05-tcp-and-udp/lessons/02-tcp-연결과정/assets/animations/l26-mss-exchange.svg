<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>MSS는 한 세그먼트의 데이터 크기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">MSS는 한 세그먼트의 데이터 크기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">연결을 시작할 때 서로 알려 줘요</text>
<rect x="66" y="181" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="188" width="52" height="30" fill="#3d4b60"/><polygon points="56,227 144,227 152,239 48,239" fill="#6ea8fe"/><text x="100" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="826" y="179" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="834" y="186" width="52" height="32" fill="#3d4b60"/><rect x="855" y="225" width="10" height="10" fill="#6ea8fe"/><rect x="838" y="235" width="44" height="5" fill="#6ea8fe"/><text x="860" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g><line x1="180" y1="170" x2="764" y2="170" stroke="#6ea8fe" stroke-width="5"/><polygon points="780,170 756,159 756,181" fill="#6ea8fe"/><rect x="402" y="128" width="156" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="150.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">SYN · MSS 1460</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="780" y1="235" x2="196" y2="235" stroke="#7ee7c7" stroke-width="5"/><polygon points="180,235 204,224 204,246" fill="#7ee7c7"/><rect x="382" y="246" width="196" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="268.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">SYN+ACK · MSS 1400</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><text x="140" y="340" text-anchor="start" font-size="17" font-weight="700" fill="#7ee7c7">클라 → 서버</text><rect x="300" y="320" width="80" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="340.0" y="345.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">≤1400</text><rect x="392" y="320" width="80" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="432.0" y="345.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">≤1400</text><rect x="484" y="320" width="80" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="524.0" y="345.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">≤1400</text><text x="140" y="400" text-anchor="start" font-size="17" font-weight="700" fill="#6ea8fe">서버 → 클라</text><rect x="300" y="380" width="80" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="340.0" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">≤1460</text><rect x="392" y="380" width="80" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="432.0" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">≤1460</text><rect x="484" y="380" width="80" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="524.0" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">≤1460</text><rect x="576" y="380" width="80" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="616.0" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">≤1460</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="291" y="439" width="378" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">방향마다 한 번에 보내는 크기가 달라도 돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 SYN에 MSS 1460을 담아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 SYN+ACK에 MSS 1400을 담아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각자 상대가 알린 MSS 이하로 나눠 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방향마다 MSS가 달라도 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>