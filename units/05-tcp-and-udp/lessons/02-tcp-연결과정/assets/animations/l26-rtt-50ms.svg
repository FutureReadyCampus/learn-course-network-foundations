<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>RTT는 왕복 시간이에요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">RTT는 왕복 시간이에요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">연결 준비에도 네트워크 지연이 들어가요</text>
<rect x="96" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="104" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="86,302 174,302 182,314 78,314" fill="#6ea8fe"/><text x="130" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="796" y="254" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="804" y="261" width="52" height="32" fill="#3d4b60"/><rect x="825" y="300" width="10" height="10" fill="#6ea8fe"/><rect x="808" y="310" width="44" height="5" fill="#6ea8fe"/><text x="830" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">웹 서버</text><line x1="200" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g><rect x="723" y="174" width="214" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="830" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">192.168.0.20 · 포트 80</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="776" y="216" width="108" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="230" y1="245" x2="724" y2="245" stroke="#6ea8fe" stroke-width="5"/><polygon points="740,245 716,234 716,256" fill="#6ea8fe"/><rect x="413" y="198" width="135" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">가는 데 25ms</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,245;240,245;730,245;730,245" keyTimes="0.000;0.275;0.450;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="730" y1="320" x2="256" y2="320" stroke="#7ee7c7" stroke-width="5"/><polygon points="240,320 264,309 264,331" fill="#7ee7c7"/><rect x="413" y="333" width="135" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="356.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">오는 데 25ms</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="730,320;730,320;240,320;240,320" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="230" y1="392" x2="740" y2="392" stroke="#ffb454" stroke-width="4"/><line x1="230" y1="392" x2="230" y2="380" stroke="#ffb454" stroke-width="4"/><line x1="740" y1="392" x2="740" y2="380" stroke="#ffb454" stroke-width="4"/><rect x="377" y="400" width="216" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="485.0" y="424.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">왕복 시간 RTT = 50ms</text><text x="480" y="464" text-anchor="middle" font-size="16" fill="#9aa3b2">서버가 처리하는 시간은 0으로 둔 단순한 예시예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북이 192.168.0.20의 포트 80으로 연결을 요청해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">메시지가 서버로 가는 데 25ms가 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답이 돌아오는 데 25ms가 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가고 오는 전체가 RTT 50ms예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>