<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>연결 요청도 세그먼트예요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">연결 요청도 세그먼트예요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">SYN 세그먼트에는 Payload가 없어요</text>
<text x="480" y="175" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">TCP 세그먼트</text><rect x="57" y="200" width="230" height="130" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="172.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">IP 헤더</text><rect x="312" y="200" width="330" height="130" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="477.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">TCP 헤더</text><rect x="667" y="200" width="230" height="130" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="782.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">Payload</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="308" y="196" width="338" height="138" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="403" y="268" width="148" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="477" y="291.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">SYN 표시 켜짐</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="379" y="342" width="197" height="35" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="477" y="366.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">초기 순서번호 1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="782" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">비어 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="663" y="196" width="238" height="138" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="338" y="398" width="284" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="421.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">파일 내용 없이 연결 준비만 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP 헤더, TCP 헤더, Payload로 이루어져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP 헤더의 SYN 표시를 켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">초기 순서번호 1000을 함께 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Payload는 비어 있고 연결 준비만 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>