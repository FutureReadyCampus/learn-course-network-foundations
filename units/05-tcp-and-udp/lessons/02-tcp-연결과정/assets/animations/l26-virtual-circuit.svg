<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TCP 연결은 논리적인 관계예요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TCP 연결은 논리적인 관계예요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">양 끝이 상태를 기록해 둔 가상 회선이에요</text>
<line x1="170" y1="262" x2="790" y2="262" stroke="#3d4b60" stroke-width="3"/><rect x="76" y="221" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="228" width="52" height="30" fill="#3d4b60"/><polygon points="66,267 154,267 162,279 58,279" fill="#6ea8fe"/><text x="110" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="816" y="219" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="226" width="52" height="32" fill="#3d4b60"/><rect x="845" y="265" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="275" width="44" height="5" fill="#6ea8fe"/><text x="850" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><circle cx="330" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M315 249 h28 l-7 -7 M345 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="330" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><circle cx="480" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M465 249 h28 l-7 -7 M495 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><circle cx="630" cy="255" r="28" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M615 249 h28 l-7 -7 M645 261 h-28 l7 7" fill="none" stroke="#6ea8fe" stroke-width="3"/><text x="630" y="305" text-anchor="middle" font-size="17" fill="#9aa3b2">라우터</text><g><rect x="40" y="154" width="140" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="110" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ESTABLISHED</text><rect x="780" y="154" width="140" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="850" y="176.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">ESTABLISHED</text><rect x="30" y="350" width="210" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="135" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">기록하는 것</text><text x="135" y="406" text-anchor="middle" font-size="15" fill="#9aa3b2">상대 주소·포트</text><rect x="720" y="350" width="210" height="76" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="825" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">기록하는 것</text><text x="825" y="406" text-anchor="middle" font-size="15" fill="#9aa3b2">순서번호·MSS</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="150" y1="205" x2="810" y2="205" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 8"/><circle cx="480" cy="205" r="16" fill="#ff7b72"/><path d="M473 198 l14 14 M487 198 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="480" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">새 케이블이나 전용선은 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="180,262;180,262;780,262;780,262" keyTimes="0.000;0.525;0.713;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="405" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">데이터는 이미 있는 네트워크로 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="328" y="438" width="304" height="35" rx="18" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="462.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">연결 수립 ≠ 앱 데이터 처리 성공</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양 끝의 TCP가 연결 상태를 기록해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 케이블이나 전용선은 생기지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">데이터는 기존 IP 패킷과 프레임으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">연결 수립이 앱의 처리 성공을 뜻하지는 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>