<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>용건 없는 첫 마디</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">용건 없는 첫 마디</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">“여보세요?”에는 용건이 들어 있지 않아요</text>
<text x="480" y="175" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">쪽지 한 장</text><rect x="57" y="200" width="230" height="130" rx="10" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="172.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">받는 곳 · 보내는 곳</text><rect x="312" y="200" width="330" height="130" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="477.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">말머리</text><rect x="667" y="200" width="230" height="130" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="782.0" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">용건</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="308" y="196" width="338" height="138" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="395" y="268" width="164" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="477" y="291.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">연결을 시작해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="385" y="342" width="184" height="35" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="477" y="366.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">내 시작 번호 1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="782" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">비어 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="663" y="196" width="238" height="138" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="358" y="398" width="244" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="421.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">용건 없이 연결 준비만 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">쪽지에는 받는 곳, 말머리, 용건 칸이 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">말머리에서 ‘연결을 시작해요’를 켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 시작 번호 1000을 함께 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">용건 칸은 비어 있고 연결 준비만 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>