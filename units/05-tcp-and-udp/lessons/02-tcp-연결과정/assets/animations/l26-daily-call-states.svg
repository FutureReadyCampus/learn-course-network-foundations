<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>전화 상태가 바뀌어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전화 상태가 바뀌어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">벨 기다림 → 거는 중·벨 울림 → 통화 중</text>
<rect x="40" y="125" width="260" height="270" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="170" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">나 (거는 쪽)</text><rect x="660" y="125" width="260" height="270" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="790" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">가게 (받는 쪽)</text><rect x="148" y="215" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="155" y="225" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="170" cy="283" r="3" fill="#6ea8fe"/><rect x="768" y="215" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="775" y="225" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="790" cy="283" r="3" fill="#6ea8fe"/><line x1="300" y1="215" x2="660" y2="215" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="300" y1="255" x2="660" y2="255" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="680" y="327" width="220" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="790" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">벨 기다림</text><rect x="60" y="327" width="220" height="36" rx="18" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="170" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">아직 아무것도 없음</text><text x="790" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">(( 대기 ))</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="327" width="220" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="170" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">거는 중</text><rect x="680" y="327" width="220" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="790" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">벨 울림</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="327" width="220" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">통화 중</text><rect x="680" y="327" width="220" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="790" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">벨 울림</text><rect x="430" y="198" width="100" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">← 들려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="60" y="327" width="220" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">통화 중</text><rect x="680" y="327" width="220" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="352.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">통화 중</text><rect x="406" y="198" width="148" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="221.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">네, 들립니다 →</text><text x="480" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">받는 쪽은 마지막 대답이 닿은 뒤에 통화 중이 돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게는 벨을 열어 두고 전화를 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거는 쪽은 거는 중, 받는 쪽은 벨이 울려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">“들려요”를 받은 거는 쪽이 먼저 통화 중이 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마지막 대답이 닿으면 받는 쪽도 통화 중이에요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>