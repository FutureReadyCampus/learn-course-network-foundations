<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>여보세요, 네 들려요, 네</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">여보세요, 네 들려요, 네</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">전화는 세 마디로 서로 들리는지 확인해요</text>
<rect x="100" y="123" width="200" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">나 (클라이언트)</text><rect x="660" y="123" width="200" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="760" y="146.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">가게 (서버)</text><line x1="200" y1="165" x2="200" y2="455" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><line x1="760" y1="165" x2="760" y2="455" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><line x1="208" y1="210" x2="736" y2="210" stroke="#7ee7c7" stroke-width="5"/><polygon points="752,210 728,199 728,221" fill="#7ee7c7"/><rect x="408" y="165" width="145" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“여보세요?”</text><text x="480" y="240" text-anchor="middle" font-size="16" fill="#9aa3b2">연결을 시작하고 싶어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><g opacity=".4"><line x1="208" y1="210" x2="736" y2="210" stroke="#7ee7c7" stroke-width="5"/><polygon points="752,210 728,199 728,221" fill="#7ee7c7"/><rect x="408" y="165" width="145" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“여보세요?”</text><text x="480" y="240" text-anchor="middle" font-size="16" fill="#9aa3b2">연결을 시작하고 싶어요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><line x1="752" y1="300" x2="224" y2="300" stroke="#6ea8fe" stroke-width="5"/><polygon points="208,300 232,289 232,311" fill="#6ea8fe"/><rect x="330" y="255" width="301" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="278.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“네, 들려요. 그쪽도 들리나요?”</text><text x="480" y="330" text-anchor="middle" font-size="16" fill="#9aa3b2">요청을 확인하고 나도 부르는 거예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><g opacity=".4"><line x1="752" y1="300" x2="224" y2="300" stroke="#6ea8fe" stroke-width="5"/><polygon points="208,300 232,289 232,311" fill="#6ea8fe"/><rect x="330" y="255" width="301" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="278.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“네, 들려요. 그쪽도 들리나요?”</text><text x="480" y="330" text-anchor="middle" font-size="16" fill="#9aa3b2">요청을 확인하고 나도 부르는 거예요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><line x1="208" y1="390" x2="736" y2="390" stroke="#ffb454" stroke-width="5"/><polygon points="752,390 728,379 728,401" fill="#ffb454"/><rect x="396" y="345" width="168" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="368.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“네, 들립니다”</text><text x="480" y="420" text-anchor="middle" font-size="16" fill="#9aa3b2">내 말이 들렸다는 확인이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g opacity=".4"><line x1="208" y1="390" x2="736" y2="390" stroke="#ffb454" stroke-width="5"/><polygon points="752,390 728,379 728,401" fill="#ffb454"/><rect x="396" y="345" width="168" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="368.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“네, 들립니다”</text><text x="480" y="420" text-anchor="middle" font-size="16" fill="#9aa3b2">내 말이 들렸다는 확인이에요</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="331" y="428" width="299" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="451.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">세 마디로 서로 들린다는 확인 끝</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 걸어 온 쪽이 “여보세요?” 하고 불러요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 “들려요, 그쪽도 들리나요?” 하고 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 쪽이 “네, 들립니다” 하고 확인해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 마디가 오가야 서로 들린다고 알아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>