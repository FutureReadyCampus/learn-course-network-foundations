<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>여보세요, 번호를 서로 알려 줘요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">여보세요, 번호를 서로 알려 줘요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">예시 번호 1000과 4000으로 세 마디를 따라가요</text>
<rect x="215" y="112" width="190" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="310" y="133.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">나 (클라이언트)</text><rect x="575" y="112" width="190" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="670" y="133.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">가게 (서버)</text><line x1="330" y1="150" x2="330" y2="460" stroke="#3d4b60" stroke-width="3"/><line x1="650" y1="150" x2="650" y2="460" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="30" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="50" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="50" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><rect x="700" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="720" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="720" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="260" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><text x="260" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><text x="930" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><text x="930" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="30" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="50" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="50" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="260" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">1000</text><text x="260" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><rect x="700" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="720" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="720" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="930" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><text x="930" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="30" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="50" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="50" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="260" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">1000</text><text x="260" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#9aa3b2">?</text><rect x="700" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="720" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="720" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="930" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">4000</text><text x="930" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#7ee7c7">1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="30" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="50" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="50" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="260" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">1000</text><text x="260" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#7ee7c7">4000</text><rect x="700" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="720" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="720" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="930" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">4000</text><text x="930" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#7ee7c7">1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="30" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="50" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="50" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="260" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">1000</text><text x="260" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#7ee7c7">4000</text><rect x="700" y="150" width="250" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="720" y="190" text-anchor="start" font-size="18" fill="#9aa3b2">내 번호</text><text x="720" y="255" text-anchor="start" font-size="18" fill="#9aa3b2">상대 번호</text><text x="930" y="190" text-anchor="end" font-size="26" font-weight="700" fill="#6ea8fe">4000</text><text x="930" y="255" text-anchor="end" font-size="26" font-weight="700" fill="#7ee7c7">1000</text></g><g><line x1="338" y1="185" x2="626" y2="185" stroke="#6ea8fe" stroke-width="5"/><polygon points="642,185 618,174 618,196" fill="#6ea8fe"/><text x="485" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">“여보세요, 내 번호는 1000”</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="642" y1="270" x2="354" y2="270" stroke="#7ee7c7" stroke-width="5"/><polygon points="338,270 362,259 362,281" fill="#7ee7c7"/><text x="485" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">“들려요, 다음은 1001”</text><text x="485" y="300" text-anchor="middle" font-size="16" fill="#9aa3b2">내 번호는 4000이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="338" y1="355" x2="626" y2="355" stroke="#ffb454" stroke-width="5"/><polygon points="642,355 618,344 618,366" fill="#ffb454"/><text x="485" y="337" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">“4000 잘 들었어요”</text><text x="485" y="385" text-anchor="middle" font-size="16" fill="#9aa3b2">다음은 4001이에요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="328" y="423" width="314" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="485" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">서로의 시작 번호를 알고 확인했어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 쪽이 “여보세요, 내 번호는 1000”이라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 “들려요, 다음은 1001. 내 번호는 4000”이라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 쪽이 “4000 잘 들었어요, 다음은 4001”이라고 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 번 오가면 양쪽이 서로의 번호를 알고 확인했어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>