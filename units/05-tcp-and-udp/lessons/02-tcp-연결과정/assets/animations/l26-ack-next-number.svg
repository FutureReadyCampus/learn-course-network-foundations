<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>ACK 번호는 다음 순서번호</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">ACK 번호는 다음 순서번호</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">SYN 1000 다음에는 ACK 1001이 와요</text>
<text x="480" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#9aa3b2">순서번호</text><rect x="130" y="270" width="110" height="64" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="185.0" y="309.92" text-anchor="middle" font-size="22" font-weight="700" fill="#3d4b60">999</text><rect x="260" y="270" width="110" height="64" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="315.0" y="309.92" text-anchor="middle" font-size="22" font-weight="700" fill="#3d4b60">1000</text><rect x="390" y="270" width="110" height="64" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="445.0" y="309.92" text-anchor="middle" font-size="22" font-weight="700" fill="#3d4b60">1001</text><rect x="520" y="270" width="110" height="64" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="575.0" y="309.92" text-anchor="middle" font-size="22" font-weight="700" fill="#3d4b60">1002</text><rect x="650" y="270" width="110" height="64" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="705.0" y="309.92" text-anchor="middle" font-size="22" font-weight="700" fill="#3d4b60">1003</text><g><rect x="256" y="266" width="118" height="72" rx="10" fill="none" stroke="#6ea8fe" stroke-width="5"/><rect x="260" y="208" width="109" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="315.0" y="231.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">SYN 1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="270" width="110" height="64" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3"/><text x="315.0" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">1000</text><line x1="260" y1="362" x2="370" y2="362" stroke="#ffb454" stroke-width="4"/><line x1="260" y1="362" x2="260" y2="350" stroke="#ffb454" stroke-width="4"/><line x1="370" y1="362" x2="370" y2="350" stroke="#ffb454" stroke-width="4"/><rect x="228" y="372" width="174" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="315.0" y="394.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">SYN이 한 자리 차지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="386" y="266" width="118" height="72" rx="10" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="445.0" y1="340" x2="445.0" y2="366" stroke="#7ee7c7" stroke-width="4"/><rect x="390" y="373" width="109" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="445.0" y="396.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">ACK 1001</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">ACK 번호 = 다음에 받고 싶은 번호</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 SYN 1000을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SYN도 순서번호의 한 자리를 차지해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 다음에 받고 싶은 1001을 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">ACK 번호는 방금 받은 번호가 아니라 다음 번호예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>