<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>말을 건네고 대답이 오기까지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">말을 건네고 대답이 오기까지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">걸어 온 쪽이 대답을 들을 때까지가 왕복 시간이에요</text>
<rect x="108" y="250" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="115" y="260" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="130" cy="318" r="3" fill="#6ea8fe"/><text x="130" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="808" y="250" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="815" y="260" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="830" cy="318" r="3" fill="#6ea8fe"/><text x="830" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">가게</text><line x1="200" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6"/><g><rect x="732" y="174" width="196" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="830" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">가게 번호 + 내선 80번</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="776" y="216" width="108" height="98" rx="12" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="230" y1="245" x2="724" y2="245" stroke="#6ea8fe" stroke-width="5"/><polygon points="740,245 716,234 716,256" fill="#6ea8fe"/><rect x="413" y="198" width="135" height="34" rx="17" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="221.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">가는 데 25ms</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,245;240,245;730,245;730,245" keyTimes="0.000;0.275;0.450;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="730" y1="320" x2="256" y2="320" stroke="#7ee7c7" stroke-width="5"/><polygon points="240,320 264,309 264,331" fill="#7ee7c7"/><rect x="413" y="333" width="135" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="356.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">오는 데 25ms</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="730,320;730,320;240,320;240,320" keyTimes="0.000;0.525;0.700;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="230" y1="392" x2="740" y2="392" stroke="#ffb454" stroke-width="4"/><line x1="230" y1="392" x2="230" y2="380" stroke="#ffb454" stroke-width="4"/><line x1="740" y1="392" x2="740" y2="380" stroke="#ffb454" stroke-width="4"/><rect x="377" y="400" width="216" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="485.0" y="424.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">왕복 시간 RTT = 50ms</text><text x="480" y="464" text-anchor="middle" font-size="16" fill="#9aa3b2">서버가 처리하는 시간은 0으로 둔 단순한 예시예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가게 번호와 내선 80번으로 걸어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내 목소리가 가게로 가는 데 25ms가 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">대답이 돌아오는 데 25ms가 걸려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">가서 돌아오는 전체가 왕복 시간(RTT) 50ms예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>