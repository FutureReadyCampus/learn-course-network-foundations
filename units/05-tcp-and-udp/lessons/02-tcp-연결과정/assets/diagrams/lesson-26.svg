<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-26-basic-export-title lesson-26-basic-export-desc" lang="ko"><title id="lesson-26-basic-export-title">TCP 연결과정 · 학습 흐름</title><desc id="lesson-26-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-26-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-26-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/></g><a href="../lesson-26.html#concept-basic-26-01" target="_top" aria-label="3-way handshake의 의미 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">3-way handshake의</tspan><tspan x="143.0" dy="25">의미</tspan></text></a><a href="../lesson-26.html#concept-basic-26-02" target="_top" aria-label="연결 요청과 RTT 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">연결 요청과 RTT</tspan></text></a><a href="../lesson-26.html#concept-basic-26-03" target="_top" aria-label="연결 제어용 Segment 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">연결 제어용 Segment</tspan></text></a><a href="../lesson-26.html#concept-basic-26-04" target="_top" aria-label="처음 사용할 순서번호 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">처음 사용할 순서번호</tspan></text></a><a href="../lesson-26.html#concept-basic-26-05" target="_top" aria-label="SYN과 ACK의 교환 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">SYN과 ACK의 교환</tspan></text></a><a href="../lesson-26.html#concept-basic-26-06" target="_top" aria-label="MSS 등 통신 조건 교환 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">MSS 등 통신 조건</tspan><tspan x="421.0" dy="25">교환</tspan></text></a><a href="../lesson-26.html#concept-basic-26-07" target="_top" aria-label="연결 과정의 상태 변화 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">연결 과정의 상태</tspan><tspan x="699.0" dy="25">변화</tspan></text></a><a href="../lesson-26.html#concept-basic-26-08" target="_top" aria-label="연결의 의미 정리 설명으로 이동"><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">연결의 의미 정리</tspan></text></a></svg>
