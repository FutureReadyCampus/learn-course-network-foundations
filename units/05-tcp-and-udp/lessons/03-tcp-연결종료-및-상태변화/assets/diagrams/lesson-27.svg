<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 500" role="group" aria-labelledby="lesson-27-basic-export-title lesson-27-basic-export-desc" lang="ko"><title id="lesson-27-basic-export-title">TCP 연결종료 및 상태변화 · 학습 흐름</title><desc id="lesson-27-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-27-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-27-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/><path d="M977.0 288 V312.0 H143.0 V332"/></g><a href="../lesson-27.html#concept-basic-27-01" target="_top" aria-label="FIN · 연결을 끝내자는 요청 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">FIN · 연결을</tspan><tspan x="143.0" dy="25">끝내자는 요청</tspan></text></a><a href="../lesson-27.html#concept-basic-27-02" target="_top" aria-label="FIN_WAIT 상태 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">FIN_WAIT 상태</tspan></text></a><a href="../lesson-27.html#concept-basic-27-03" target="_top" aria-label="CLOSE_WAIT와 종료 지연 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">CLOSE_WAIT와 종료</tspan><tspan x="699.0" dy="25">지연</tspan></text></a><a href="../lesson-27.html#concept-basic-27-04" target="_top" aria-label="TIME_WAIT 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">TIME_WAIT</tspan></text></a><a href="../lesson-27.html#concept-basic-27-05" target="_top" aria-label="소켓 자원의 회수 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">소켓 자원의 회수</tspan></text></a><a href="../lesson-27.html#concept-basic-27-06" target="_top" aria-label="어느 쪽이 먼저 닫을까 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">어느 쪽이 먼저</tspan><tspan x="421.0" dy="25">닫을까</tspan></text></a><a href="../lesson-27.html#concept-basic-27-07" target="_top" aria-label="TCP 상태도 따라가기 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">TCP 상태도 따라가기</tspan></text></a><a href="../lesson-27.html#concept-basic-27-08" target="_top" aria-label="종료 과정의 상태 이동 설명으로 이동"><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">종료 과정의 상태</tspan><tspan x="977.0" dy="25">이동</tspan></text></a><a href="../lesson-27.html#concept-basic-27-09" target="_top" aria-label="TIME_WAIT가 남는 쪽 정리 설명으로 이동"><rect x="18" y="336" width="250" height="112" rx="10"/><text x="143.0" y="374" text-anchor="middle"><tspan x="143.0" dy="0">TIME_WAIT가 남는 쪽</tspan><tspan x="143.0" dy="25">정리</tspan></text></a></svg>
