<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>FIN은 한 방향의 송신 끝</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">FIN은 한 방향의 송신 끝</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">반대 방향은 계속 보낼 수 있어요</text>
<rect x="76" y="216" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="223" width="52" height="30" fill="#3d4b60"/><polygon points="66,262 154,262 162,274 58,274" fill="#6ea8fe"/><text x="110" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="816" y="214" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="221" width="52" height="32" fill="#3d4b60"/><rect x="845" y="260" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="270" width="44" height="5" fill="#6ea8fe"/><text x="850" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="190" y1="215" x2="770" y2="215" stroke="#3d4b60" stroke-width="3"/><line x1="190" y1="300" x2="770" y2="300" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><line x1="200" y1="215" x2="744" y2="215" stroke="#6ea8fe" stroke-width="5"/><polygon points="760,215 736,204 736,226" fill="#6ea8fe"/><text x="480" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">클라이언트 → 서버 데이터</text></g><g><line x1="760" y1="300" x2="216" y2="300" stroke="#7ee7c7" stroke-width="5"/><polygon points="200,300 224,289 224,311" fill="#7ee7c7"/><text x="480" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서버 → 클라이언트 데이터</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="210,215;210,215;750,215;750,215" keyTimes="0.000;0.025;0.200;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="750,300;750,300;210,300;210,300" keyTimes="0.000;0.025;0.200;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="335" y="174" width="289" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">FIN: 내가 보낼 데이터는 여기까지</text><rect x="762" y="195" width="14" height="40" rx="3" fill="#ffb454" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="750,300;750,300;210,300;210,300" keyTimes="0.000;0.525;0.700;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="364" y="318" width="232" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="341.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버는 아직 보낼 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="259" y="412" width="441" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">한쪽 방향만 먼저 닫을 수 있어요 (half-close)</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">양방향으로 데이터를 주고받고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 FIN으로 자기 방향의 송신이 끝났다고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버는 아직 보낼 데이터가 있으면 계속 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한쪽 방향만 먼저 닫는 것을 half-close라고 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>