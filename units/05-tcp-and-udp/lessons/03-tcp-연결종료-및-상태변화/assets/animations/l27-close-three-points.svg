<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>연결 종료에서 기억할 세 가지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">연결 종료에서 기억할 세 가지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">클라이언트·서버가 아니라 누가 먼저인지가 중요해요</text>
<rect x="40" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g><rect x="40" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="180" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#6ea8fe">1</text><text x="180" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">한쪽이 FIN으로 끝내요</text><text x="180" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">자기 방향의 송신 끝</text></g><rect x="340" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#7ee7c7">2</text><text x="480" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">상대도 남은 송신 뒤 FIN</text><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">남은 데이터를 보낸 뒤</text></g><rect x="640" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="780" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#ffb454">3</text><text x="780" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">먼저 FIN 쪽이 TIME_WAIT</text><text x="780" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">마지막 확인에 대비해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="412" width="398" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">먼저 FIN을 보낸 쪽이 TIME_WAIT를 거쳐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한쪽이 FIN으로 자기 송신을 끝내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 남은 송신을 마치고 자기 FIN을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 FIN을 보낸 쪽이 TIME_WAIT에서 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 먼저 FIN을 보냈다면 서버가 TIME_WAIT예요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>