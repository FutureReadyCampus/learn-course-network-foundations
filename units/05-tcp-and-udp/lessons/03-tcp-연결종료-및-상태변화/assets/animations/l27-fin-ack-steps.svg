<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>FIN과 ACK 네 단계</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">FIN과 ACK 네 단계</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">클라이언트가 먼저 끝내는 흔한 예예요</text>
<rect x="225" y="112" width="150" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">클라이언트</text><rect x="585" y="112" width="150" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="660" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">서버</text><line x1="300" y1="150" x2="300" y2="440" stroke="#3d4b60" stroke-width="3"/><line x1="660" y1="150" x2="660" y2="440" stroke="#3d4b60" stroke-width="3"/><g><line x1="308" y1="190" x2="636" y2="190" stroke="#ffb454" stroke-width="5"/><polygon points="652,190 628,179 628,201" fill="#ffb454"/><text x="480" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">① FIN</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="179" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="130" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">FIN_WAIT_1</text><rect x="730" y="179" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="830" y="200.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">ESTABLISHED</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="652" y1="255" x2="324" y2="255" stroke="#6ea8fe" stroke-width="5"/><polygon points="308,255 332,244 332,266" fill="#6ea8fe"/><text x="480" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">② ACK</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="244" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="130" y="265.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">FIN_WAIT_2</text><rect x="730" y="244" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="830" y="265.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">CLOSE_WAIT</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="652" y1="320" x2="324" y2="320" stroke="#ffb454" stroke-width="5"/><polygon points="308,320 332,309 332,331" fill="#ffb454"/><text x="480" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">③ FIN</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="309" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="130" y="330.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">TIME_WAIT</text><rect x="730" y="309" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="830" y="330.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">LAST_ACK</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="308" y1="385" x2="636" y2="385" stroke="#6ea8fe" stroke-width="5"/><polygon points="652,385 628,374 628,396" fill="#6ea8fe"/><text x="480" y="371" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">④ ACK</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="30" y="374" width="200" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="130" y="395.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">TIME_WAIT</text><rect x="730" y="374" width="200" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="395.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">CLOSED</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="455" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">클라이언트는 TIME_WAIT 대기 후 CLOSED로 정리돼요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 FIN을 보내고 FIN_WAIT_1이 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 ACK를 보내고 CLOSE_WAIT가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버도 FIN을 보내고 LAST_ACK가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마지막 ACK를 받은 서버는 CLOSED가 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>