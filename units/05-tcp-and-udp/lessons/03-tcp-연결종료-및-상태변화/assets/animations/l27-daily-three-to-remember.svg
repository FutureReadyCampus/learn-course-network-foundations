<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>끊는 일에서 기억할 세 가지</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">끊는 일에서 기억할 세 가지</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누가 먼저인지는 정해져 있지 않아요</text>
<rect x="40" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g><rect x="40" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="180" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#6ea8fe">1</text><text x="180" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">한쪽이 먼저 끝내요</text><text x="180" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">“저는 다 했어요”</text></g><rect x="340" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="340" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#7ee7c7">2</text><text x="480" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">상대도 마치고 끝내요</text><text x="480" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">남은 말을 마치고 알려요</text></g><rect x="640" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="640" y="150" width="280" height="220" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="780" y="215" text-anchor="middle" font-size="46" font-weight="700" fill="#ffb454">3</text><text x="780" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">먼저 끝낸 쪽이 기다려요</text><text x="780" y="320" text-anchor="middle" font-size="17" fill="#9aa3b2">잠깐 더 들고 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="303" y="412" width="354" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="436.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">먼저 끊은 쪽이 마지막에 잠깐 기다려요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한쪽이 먼저 자기 이야기를 마쳐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대도 남은 이야기를 마치고 끝내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 끝낸 쪽은 마지막에 잠깐 기다려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">“누가 먼저 끊었나”가 기다리는 쪽을 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>