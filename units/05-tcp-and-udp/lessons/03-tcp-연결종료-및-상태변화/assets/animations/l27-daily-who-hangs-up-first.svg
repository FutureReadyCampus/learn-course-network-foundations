<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>누가 먼저 끊어도 괜찮아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">누가 먼저 끊어도 괜찮아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">먼저 끊은 쪽이 마지막에 잠깐 기다려요</text>
<rect x="30" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="250" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">내가 먼저 끊으면</text><rect x="490" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="710" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">상대가 먼저 끊으면</text><rect x="78" y="230" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="85" y="240" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="100" cy="298" r="3" fill="#6ea8fe"/><text x="100" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="368" y="230" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="375" y="240" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="390" cy="298" r="3" fill="#6ea8fe"/><text x="390" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">상대</text><rect x="538" y="230" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="545" y="240" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="560" cy="298" r="3" fill="#6ea8fe"/><text x="560" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="828" y="230" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="240" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="298" r="3" fill="#6ea8fe"/><text x="850" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">상대</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="150" y1="215" x2="314" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="330,215 306,204 306,226" fill="#ffb454"/><text x="240" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">FIN</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><polygon points="86,185 114,185 100,205" fill="#ffb454"/><polygon points="86,225 114,225 100,205" fill="#ffb454" fill-opacity="0.45"/><rect x="65" y="364" width="150" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="140" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">잠깐 더 들고 있음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="800" y1="215" x2="636" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="620,215 644,204 644,226" fill="#ffb454"/><text x="710" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">FIN</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><polygon points="836,185 864,185 850,205" fill="#ffb454"/><polygon points="836,225 864,225 850,205" fill="#ffb454" fill-opacity="0.45"/><rect x="765" y="364" width="150" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="840" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">잠깐 더 들고 있음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="319" y="438" width="323" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">먼저 끊은 쪽이 잠깐 더 들고 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내가 먼저 끊을 수도, 상대가 먼저 끊을 수도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내가 먼저 끊으면 내가 잠깐 더 들고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 먼저 끊으면 상대가 잠깐 더 들고 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 끊은 쪽이 마지막에 기다려요</text></g>

