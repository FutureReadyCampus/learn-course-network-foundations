<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>끊을 때도 두 쌍의 인사</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">끊을 때도 두 쌍의 인사</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">각자 끝났다고 말하고 상대가 알겠다고 답해요</text>
<rect x="175" y="112" width="130" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">나</text><rect x="655" y="112" width="130" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="720" y="134.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">상대</text><line x1="300" y1="150" x2="300" y2="450" stroke="#3d4b60" stroke-width="3"/><line x1="660" y1="150" x2="660" y2="450" stroke="#3d4b60" stroke-width="3"/><g><line x1="308" y1="190" x2="636" y2="190" stroke="#ffb454" stroke-width="5"/><polygon points="652,190 628,179 628,201" fill="#ffb454"/><text x="480" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">“저는 다 했어요”</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="10" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="145" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">끝났다고 알림 · 확인 기다림</text><rect x="680" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="815" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">통화 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><line x1="652" y1="250" x2="324" y2="250" stroke="#6ea8fe" stroke-width="5"/><polygon points="308,250 332,239 332,261" fill="#6ea8fe"/><text x="480" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">“알겠어요”</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="10" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="145" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">상대가 끝나길 기다림</text><rect x="680" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="815" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">알겠다고 했어요 · 정리 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><line x1="652" y1="310" x2="324" y2="310" stroke="#ffb454" stroke-width="5"/><polygon points="308,310 332,299 332,321" fill="#ffb454"/><text x="480" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">“저도 이제 끝났어요”</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="10" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="145" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">상대가 끝나길 기다림</text><rect x="680" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="815" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">알겠다고 했어요 · 정리 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="308" y1="370" x2="636" y2="370" stroke="#6ea8fe" stroke-width="5"/><polygon points="652,370 628,359 628,381" fill="#6ea8fe"/><text x="480" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">“알겠어요”</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="10" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="145" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">잠깐 더 들고 있음</text><rect x="680" y="404" width="270" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="815" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">끝!</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내가 먼저 “저는 할 말 다 했어요” 하고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 “알겠어요” 하고 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대도 마저 말한 뒤 “저도 끝났어요” 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내가 “알겠어요” 하면 두 쌍이 끝나요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>