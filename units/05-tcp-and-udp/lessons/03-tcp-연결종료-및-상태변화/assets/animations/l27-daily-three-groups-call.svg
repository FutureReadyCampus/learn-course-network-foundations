<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>전화 상태는 세 무리로 읽어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전화 상태는 세 무리로 읽어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름이 많아도 큰 흐름으로 묶어요</text>
<rect x="40" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="180" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">연결 전 · 기다림</text><g><rect x="40" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="180" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">연결 전 · 기다림</text><rect x="53" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="115" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">전화 내려놓음</text><rect x="183" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="245" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">벨 기다림</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="36" y="136" width="288" height="278" rx="14" fill="none" stroke="#9aa3b2" stroke-width="5"/></g><rect x="340" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="480" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">시작 · 통화</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="340" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#6ea8fe">시작 · 통화</text><rect x="353" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="415" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">거는 중</text><rect x="483" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="545" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">벨 울림</text><rect x="353" y="265" width="124" height="30" rx="15" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="415" y="285.04" text-anchor="middle" font-size="14" font-weight="700" fill="#6ea8fe">통화 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="336" y="136" width="288" height="278" rx="14" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><rect x="640" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="780" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#9aa3b2">끊는 중</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="640" y="140" width="280" height="270" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="780" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#ffb454">끊는 중</text><rect x="653" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="715" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">끝났다고 알림</text><rect x="783" y="217" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="845" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">상대 기다림</text><rect x="653" y="265" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="715" y="285.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">정리 중</text><rect x="783" y="265" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="845" y="285.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">마지막 확인</text><rect x="653" y="313" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="715" y="333.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">잠깐 더 들고 있음</text><rect x="783" y="313" width="124" height="30" rx="15" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="845" y="333.04" text-anchor="middle" font-size="14" font-weight="700" fill="#ffb454">동시에 끊음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="636" y="136" width="288" height="278" rx="14" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="336" y="430" width="287" height="35" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="454.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">이름 전체보다 역할을 기억해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 통화가 없거나 벨을 기다리는 무리예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">거는 중, 벨 울림, 통화 중이 이어지는 무리예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">끊으면서 정리하는 무리예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하나하나 외우기보다 어느 무리인지 읽어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>