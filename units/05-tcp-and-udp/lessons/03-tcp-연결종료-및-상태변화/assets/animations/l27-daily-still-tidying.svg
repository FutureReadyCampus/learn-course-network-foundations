<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>끝났다는 말을 듣고도 정리가 남아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">끝났다는 말을 듣고도 정리가 남아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상대의 말을 들은 뒤 내 쪽 정리를 마쳐야 해요</text>
<rect x="88" y="190" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="200" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="258" r="3" fill="#6ea8fe"/><text x="110" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">상대</text><rect x="828" y="190" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="200" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="258" r="3" fill="#6ea8fe"/><text x="850" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><line x1="190" y1="215" x2="770" y2="215" stroke="#3d4b60" stroke-width="3"/><line x1="190" y1="290" x2="770" y2="290" stroke="#3d4b60" stroke-width="3"/><g><line x1="200" y1="215" x2="744" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="760,215 736,204 736,226" fill="#ffb454"/><text x="480" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">“저는 끝났어요”</text></g><g><line x1="760" y1="290" x2="216" y2="290" stroke="#6ea8fe" stroke-width="5"/><polygon points="200,290 224,279 224,301" fill="#6ea8fe"/><text x="480" y="325" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">“알겠어요”</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">상대는 끝냈고 나는 정리 중</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="320" y="408" width="320" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">남은 이야기와 정리를 마칠 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">내 끝도 알리고 확인 기다림</text><line x1="760" y1="252" x2="216" y2="252" stroke="#7ee7c7" stroke-width="4"/><polygon points="200,252 224,242 224,262" fill="#7ee7c7"/><text x="480" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">“저도 끝났어요”</text><rect x="343" y="408" width="274" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">“저도 끝났어요” 하고 알려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">통화 끝</text><line x1="200" y1="252" x2="744" y2="252" stroke="#6ea8fe" stroke-width="4"/><polygon points="760,252 736,242 736,262" fill="#6ea8fe"/><text x="480" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">“알겠어요”</text><rect x="361" y="408" width="238" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">마지막 확인이 오면 끝나요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 “저는 끝났어요” 해서 “알겠어요” 하고 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나는 아직 남은 이야기와 정리가 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정리가 끝나면 나도 “끝났어요” 하고 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 확인해 주면 통화가 끝나요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>