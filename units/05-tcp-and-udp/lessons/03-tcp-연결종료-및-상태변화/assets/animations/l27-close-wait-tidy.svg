<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>CLOSE_WAIT는 정리 중인 상태</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">CLOSE_WAIT는 정리 중인 상태</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상대의 FIN을 확인하고 내 정리를 기다려요</text>
<rect x="76" y="196" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="203" width="52" height="30" fill="#3d4b60"/><polygon points="66,242 154,242 162,254 58,254" fill="#6ea8fe"/><text x="110" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="816" y="194" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="201" width="52" height="32" fill="#3d4b60"/><rect x="845" y="240" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="250" width="44" height="5" fill="#6ea8fe"/><text x="850" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><line x1="190" y1="215" x2="770" y2="215" stroke="#3d4b60" stroke-width="3"/><line x1="190" y1="290" x2="770" y2="290" stroke="#3d4b60" stroke-width="3"/><g><line x1="200" y1="215" x2="744" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="760,215 736,204 736,226" fill="#ffb454"/><text x="480" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">FIN</text></g><g><line x1="760" y1="290" x2="216" y2="290" stroke="#6ea8fe" stroke-width="5"/><polygon points="200,290 224,279 224,301" fill="#6ea8fe"/><text x="480" y="325" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">ACK</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">CLOSE_WAIT</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="309" y="408" width="343" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">남은 응답과 정리 작업을 마칠 수 있어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">LAST_ACK</text><line x1="760" y1="252" x2="216" y2="252" stroke="#7ee7c7" stroke-width="4"/><polygon points="200,252 224,242 224,262" fill="#7ee7c7"/><text x="480" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">FIN</text><rect x="324" y="408" width="311" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">소켓을 닫으면 서버도 FIN을 보내요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="675" y="344" width="250" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="365.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">CLOSED</text><line x1="200" y1="252" x2="744" y2="252" stroke="#6ea8fe" stroke-width="4"/><polygon points="760,252 736,242 736,262" fill="#6ea8fe"/><text x="480" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">ACK</text><rect x="313" y="408" width="334" height="34" rx="17" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="431.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">마지막 ACK가 오면 종료 절차가 끝나요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 FIN을 ACK로 확인하고 CLOSE_WAIT가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 프로그램이 남은 응답과 정리를 마칠 수 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">소켓을 닫으면 서버도 FIN을 보내고 LAST_ACK가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마지막 ACK가 오면 서버의 종료 절차가 끝나요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>