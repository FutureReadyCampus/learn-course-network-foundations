<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>끊은 뒤에도 잠깐 수화기를 들고 있어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">끊은 뒤에도 잠깐 수화기를 들고 있어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">마지막 확인이 사라질 수도 있어서예요</text>
<rect x="88" y="200" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="95" y="210" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="110" cy="268" r="3" fill="#6ea8fe"/><text x="110" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">나</text><rect x="828" y="200" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="835" y="210" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="850" cy="268" r="3" fill="#6ea8fe"/><text x="850" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">상대</text><line x1="190" y1="250" x2="770" y2="250" stroke="#3d4b60" stroke-width="3"/><rect x="15" y="314" width="190" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="110" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">잠깐 더 들고 있음</text><g><polygon points="96,165 124,165 110,185" fill="#ffb454"/><polygon points="96,205 124,205 110,185" fill="#ffb454" fill-opacity="0.45"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="210,250;210,250;480,250;480,250" keyTimes="0.000;0.025;0.150;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.175;0.190;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><circle cx="480" cy="250" r="16" fill="#ff7b72"/><path d="M473 243 l14 14 M487 243 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="361" y="184" width="238" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">마지막 “네”가 사라졌어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="750,250;750,250;210,250;210,250" keyTimes="0.000;0.275;0.425;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="333" y="184" width="293" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">상대가 “끝났어요”를 다시 말해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="210,250;210,250;750,250;750,250" keyTimes="0.000;0.525;0.675;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="337" y="184" width="287" height="33" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="206.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">아직 들고 있어서 다시 “네” 해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.690;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><circle cx="850" cy="180" r="16" fill="#7ee7c7"/><path d="M842 180 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><line x1="190" y1="385" x2="770" y2="385" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="750,385;750,385;330,385;330,385" keyTimes="0.000;0.775;0.912;1.000" dur="15s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#9aa3b2"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><circle cx="300" cy="385" r="16" fill="#ff7b72"/><path d="M293 378 l14 14 M307 378 l-14 14" stroke="#0f1115" stroke-width="4"/><rect x="396" y="404" width="168" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">이전 통화의 늦은 말</text><rect x="309" y="439" width="343" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">같은 번호의 새 통화에 섞이지 않게 해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">마지막 “네”가 도중에 사라졌어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상대가 “끝났어요”를 다시 말해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 들고 있어서 다시 “네” 하고 답해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">늦게 온 이전 통화의 말이 새 통화에 섞이지 않게 해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>