<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>먼저 닫는 쪽은 정해져 있지 않아요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">먼저 닫는 쪽은 정해져 있지 않아요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">클라이언트와 서버의 고정된 역할이 아니에요</text>
<rect x="30" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="250" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">클라이언트가 먼저 FIN</text><rect x="490" y="125" width="440" height="300" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="710" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">서버가 먼저 FIN</text><rect x="66" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="56,282 144,282 152,294 48,294" fill="#6ea8fe"/><text x="100" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="356" y="236" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="364" y="243" width="52" height="30" fill="#3d4b60"/><polygon points="346,282 434,282 442,294 338,294" fill="#6ea8fe"/><text x="390" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><rect x="526" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="534" y="241" width="52" height="32" fill="#3d4b60"/><rect x="555" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="538" y="290" width="44" height="5" fill="#6ea8fe"/><text x="560" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">클라이언트</text><rect x="816" y="234" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="824" y="241" width="52" height="32" fill="#3d4b60"/><rect x="845" y="280" width="10" height="10" fill="#6ea8fe"/><rect x="828" y="290" width="44" height="5" fill="#6ea8fe"/><text x="850" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">서버</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="150" y1="215" x2="314" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="330,215 306,204 306,226" fill="#ffb454"/><text x="240" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">FIN</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><polygon points="86,185 114,185 100,205" fill="#ffb454"/><polygon points="86,225 114,225 100,205" fill="#ffb454" fill-opacity="0.45"/><rect x="65" y="364" width="150" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="140" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">TIME_WAIT</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="800" y1="215" x2="636" y2="215" stroke="#ffb454" stroke-width="5"/><polygon points="620,215 644,204 644,226" fill="#ffb454"/><text x="710" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">FIN</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><polygon points="836,185 864,185 850,205" fill="#ffb454"/><polygon points="836,225 864,225 850,205" fill="#ffb454" fill-opacity="0.45"/><rect x="765" y="364" width="150" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="840" y="385.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">TIME_WAIT</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="281" y="438" width="398" height="35" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="462.84" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1115">먼저 FIN을 보낸 쪽이 TIME_WAIT를 거쳐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 먼저 닫을 수도 서버가 먼저 닫을 수도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">클라이언트가 먼저 FIN을 보내면 클라이언트가 TIME_WAIT예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버가 먼저 FIN을 보내면 서버가 TIME_WAIT예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">먼저 FIN을 보낸 쪽이 TIME_WAIT를 거쳐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>