1.0" dy="25">Acknowledgement</tspan></text><text class="flow-time" x="421.0" y="116" text-anchor="middle">02 · 1:56</text></a><a href="../lesson-28.html#concept-basic-28-03" target="_top" aria-label="제어 플래그 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">제어 플래그</tspan></text><text class="flow-time" x="699.0" y="116" text-anchor="middle">03 · 2:53</text></a><a href="../lesson-28.html#concept-basic-28-04" target="_top" aria-label="대표적인 TCP 장애 유형 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">대표적인 TCP 장애</tspan><tspan x="977.0" dy="25">유형</tspan></text><text class="flow-time" x="977.0" y="116" text-anchor="middle">04 · 3:57</text></a><a href="../lesson-28.html#concept-basic-28-05" target="_top" aria-label="Window · 수신 버퍼의 여유 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">Window · 수신</tspan><tspan x="143.0" dy="25">버퍼의 여유</tspan></text><text class="flow-time" x="143.0" y="276" text-anchor="middle">05 · 4:54</text></a><a href="../lesson-28.html#concept-basic-28-06" target="_top" aria-label="간결한 UDP Header 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">간결한 UDP Header</tspan></text><text class="flow-time" x="421.0" y="276" text-anchor="middle">06 · 6:12</text></a><a href="../lesson-28.html#concept-basic-28-07" target="_top" aria-label="게임 서버와 UDP 설명으로 이동"><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">게임 서버와 UDP</tspan></text><text class="flow-time" x="699.0" y="276" text-anchor="middle">07 · 6:40</text></a><a href="../lesson-28.html#concept-basic-28-08" target="_top" aria-label="HTTP/3 등 확장되는 활용 설명으로 이동"><rect x="852" y="176" width="250" height="112" rx="10"/>