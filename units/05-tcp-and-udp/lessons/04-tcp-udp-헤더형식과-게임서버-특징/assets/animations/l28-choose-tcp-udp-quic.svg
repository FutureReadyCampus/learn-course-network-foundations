<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>TCP와 UDP는 상황에 맞춰 골라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">TCP와 UDP는 상황에 맞춰 골라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">HTTP/3는 UDP 위에서 QUIC을 사용해요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="135" width="400" height="160" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="240" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">TCP</text><text x="240" y="205" text-anchor="middle" font-size="16" fill="#e6e8ec">순서 있는 바이트 흐름</text><text x="240" y="235" text-anchor="middle" font-size="16" fill="#e6e8ec">확인과 재전송</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="520" y="135" width="400" height="160" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="720" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">UDP</text><text x="720" y="205" text-anchor="middle" font-size="16" fill="#e6e8ec">데이터그램을 보내요</text><text x="720" y="235" text-anchor="middle" font-size="16" fill="#e6e8ec">도착·순서 보장은 앱이 정해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="75" y="334" width="330" height="32" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="355.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">빠짐없이 전달이 중요하면</text><rect x="530" y="334" width="380" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="720" y="355.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">최신 상태를 제때 처리가 중요하면</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="250" y="150" width="460" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="184.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">HTTP/3</text><rect x="250" y="220" width="460" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="480.0" y="254.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">QUIC (연결·암호화·흐름·혼잡 제어)</text><rect x="250" y="290" width="460" height="56" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="480.0" y="324.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">UDP</text><rect x="250" y="360" width="460" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="480.0" y="394.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">IP</text><text x="480" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">UDP를 쓴다고 신뢰성이나 혼잡 제어가 전혀 없다는 뜻은 아니에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP는 순서 있는 바이트 흐름과 확인·재전송을 제공해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UDP는 데이터그램을 보내는 기본 기능에 집중해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빠짐없는 전달과 최신 상태 처리 중 무엇이 중요한지가 기준이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">HTTP/3는 UDP 위의 QUIC에서 필요한 기능을 제공해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>