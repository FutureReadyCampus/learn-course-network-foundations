<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>위치 갱신 3번이 사라졌을 때</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">위치 갱신 3번이 사라졌을 때</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">순서를 지키는 방식과 최신을 택하는 방식을 비교해요</text>
<rect x="13" y="124" width="190" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="108" y="145.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">기다림 방식 (TCP처럼)</text><rect x="13" y="274" width="190" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="108" y="295.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">최신 우선 (앱이 선택)</text><line x1="200" y1="190" x2="680" y2="190" stroke="#3d4b60" stroke-width="3"/><line x1="200" y1="340" x2="680" y2="340" stroke="#3d4b60" stroke-width="3"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g transform="translate(260,190)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">3</text></g><g transform="translate(340,190)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">4</text></g><g transform="translate(420,190)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">5</text></g><g transform="translate(260,340)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">3</text></g><g transform="translate(340,340)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">4</text></g><g transform="translate(420,340)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">5</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(380,190)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">4</text></g><g transform="translate(460,190)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">5</text></g><g transform="translate(380,340)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">4</text></g><g transform="translate(460,340)"><rect x="-22" y="-20" width="44" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="0.0" y="6.4799999999999995" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">5</text></g><circle cx="560" cy="190" r="16" fill="#ff7b72"/><path d="M553 183 l14 14 M567 183 l-14 14" stroke="#0f1115" stroke-width="4"/><circle cx="560" cy="340" r="16" fill="#ff7b72"/><path d="M553 333 l14 14 M567 333 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="560" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">3번이 늦거나 사라졌어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="700" y="145" width="220" height="90" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="810" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">앱 화면</text><text x="810" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">3번 기다리는 중</text><text x="430" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">4, 5번도 앱에 전달되기 전에 기다릴 수 있어요</text><rect x="700" y="295" width="220" height="90" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">앱 화면</text><text x="810" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">5번을 바로 반영</text><text x="430" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">앱이 번호를 보고 낡은 값은 버려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="169" y="424" width="622" height="31" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">UDP가 스스로 고르는 것은 아니에요 · 중요한 행동은 확인받게 규칙을 따로 둘 수도 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위치 갱신 3, 4, 5번을 차례로 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">3번이 늦거나 사라졌어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">순서 있는 흐름은 3번을 기다릴 수 있고 앱이 최신 5번을 고를 수도 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UDP가 스스로 고르는 것이 아니라 앱이 규칙을 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>