<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>헤더 칸은 질문에 답해요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">헤더 칸은 질문에 답해요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">칸마다 어떤 질문에 답하는지만 알면 돼요</text>
<rect x="50" y="135" width="360" height="250" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><text x="230" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">헤더 (안내 정보)</text><rect x="70" y="185" width="320" height="40" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="230.0" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">포트 번호</text><rect x="70" y="235" width="320" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="230.0" y="260.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">순서 번호 · ACK</text><rect x="70" y="285" width="320" height="40" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="230.0" y="310.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">Window</text><rect x="70" y="335" width="320" height="40" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="230.0" y="360.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">Checksum</text><rect x="50" y="400" width="360" height="58" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="230" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">내용: 사진이나 웹 문서</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="46" y="131" width="368" height="258" rx="12" fill="none" stroke="#9aa3b2" stroke-width="5"/><text x="690" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">내용 앞에 붙는 안내예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="395" y1="205" x2="474" y2="205" stroke="#6ea8fe" stroke-width="4"/><polygon points="490,205 466,195 466,215" fill="#6ea8fe"/><text x="500" y="212" text-anchor="start" font-size="18" font-weight="700" fill="#6ea8fe">어느 프로그램으로?</text><rect x="66" y="181" width="328" height="48" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="395" y1="255" x2="474" y2="255" stroke="#7ee7c7" stroke-width="4"/><polygon points="490,255 466,245 466,265" fill="#7ee7c7"/><text x="500" y="262" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">바이트 흐름이 어디까지?</text><rect x="66" y="231" width="328" height="48" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="395" y1="305" x2="474" y2="305" stroke="#ffb454" stroke-width="4"/><polygon points="490,305 466,295 466,315" fill="#ffb454"/><text x="500" y="312" text-anchor="start" font-size="18" font-weight="700" fill="#ffb454">얼마나 더 받을 수 있나?</text><rect x="66" y="281" width="328" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="395" y1="355" x2="474" y2="355" stroke="#c792ea" stroke-width="4"/><polygon points="490,355 466,345 466,365" fill="#c792ea"/><text x="500" y="362" text-anchor="start" font-size="18" font-weight="700" fill="#c792ea">전송 중 손상됐나?</text><rect x="66" y="331" width="328" height="48" rx="8" fill="none" stroke="#c792ea" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="490" y="384" width="400" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="690" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">외울 표가 아니라 찾아 읽는 지도예요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더는 내용 앞에 붙는 안내 정보예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">포트 번호는 받을 프로그램을 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">순서 번호·ACK와 Window는 흐름과 수신 여유를 알려 줘요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Checksum은 전송 중 손상을 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>