<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>같은 물건에 붙는 송장 길이</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">같은 물건에 붙는 송장 길이</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">짧은 송장과 상세 송장은 해 주는 일이 달라요</text>
<text x="80" y="205" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">UDP</text><text x="80" y="295" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">TCP</text><g><rect x="290" y="180" width="400" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="490.0" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">같은 물건</text><rect x="530" y="270" width="400" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="730.0" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">같은 물건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="15s" repeatCount="indefinite"/><rect x="130" y="180" width="160" height="46" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><text x="210.0" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">짧은 송장</text><text x="480" y="260" text-anchor="middle" font-size="16" fill="#9aa3b2">보낸 호수 · 받는 호수 · 크기 · 파손 점검</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="130" y="270" width="400" height="46" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><text x="330.0" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">상세 송장 (추가 칸이 붙으면 더 길어요)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="210" y="409" width="540" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="430.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">송장 길이만으로 좋고 나쁨을 정하지 않아요 · 필요한 서비스를 함께 봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 크기의 물건을 보낸다고 해 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">짧은 송장은 꼭 필요한 칸만 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">상세 송장은 확인과 순서 칸이 더해져 더 길어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">송장이 길고 짧음만으로 좋고 나쁨을 정하지 않아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="15s" repeatCount="indefinite"/></rect></g></g></svg>