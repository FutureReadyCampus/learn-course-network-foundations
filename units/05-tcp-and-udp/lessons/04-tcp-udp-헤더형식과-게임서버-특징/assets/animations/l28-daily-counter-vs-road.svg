<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>받는 쪽 자리와 도로의 붐빔은 달라요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">받는 쪽 자리와 도로의 붐빔은 달라요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">둘 다 보내는 양을 조절하지만 살피는 곳이 달라요</text>
<rect x="78" y="240" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="85" y="250" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="100" cy="308" r="3" fill="#6ea8fe"/><text x="100" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">주방</text><rect x="740" y="190" width="180" height="190" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="830" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">서빙대</text><rect x="760" y="245" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="796" y="245" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="832" y="245" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="868" y="245" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="760" y="295" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="796" y="295" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="832" y="295" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="868" y="295" width="30" height="40" rx="4" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="200" y="255" width="520" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="460" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">좁은 도로</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="15s" repeatCount="indefinite"/><rect x="230" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="294" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="358" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="422" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="486" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="550" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="614" y="265" width="44" height="30" rx="5" fill="#ffb454" stroke="#ffb454" stroke-width="0"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><rect x="736" y="186" width="188" height="198" rx="12" fill="none" stroke="#7ee7c7" stroke-width="5"/><rect x="720" y="134" width="220" height="32" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">받는 쪽 자리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="196" y="251" width="528" height="58" rx="8" fill="none" stroke="#ffb454" stroke-width="5"/><rect x="340" y="199" width="240" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="460" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">도로의 붐빔</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="720" y="134" width="220" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="830" y="155.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">받는 쪽을 보호</text><rect x="340" y="200" width="240" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="460" y="220.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">함께 쓰는 길을 보호</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="261" y="429" width="438" height="32" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="450.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">접시 하나가 늦었다고 곧 길이 막혔다고 단정하지는 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서빙대의 빈자리는 받는 쪽의 여유예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">도로가 붐비는지는 길의 상태예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">하나는 받는 쪽을, 하나는 함께 쓰는 길을 보호해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접시 하나가 늦었다고 길이 막혔다고 단정하지 않아요</text></g>

