 points="390,300 366,289 366,311" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><rect x="406" y="400.875" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="367.75" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="334.625" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="301.5" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="268.375" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="235.25" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="202.125" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="330" y="116" width="300" height="33" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="138.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">빈자리가 줄어요</text><line x1="190" y1="300" x2="374" y2="300" stroke="#6ea8fe" stroke-width="3"/><polygon points="390,300 366,291 366,309" fill="#6ea8fe"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><rect x="406" y="400.875" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="367.75" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="334.625" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="301.5" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="268.375" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="235.25" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="202.125" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="406" y="169.0" width="148" height="25.125" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="0"/><rect x="330" y="116" width="300" height="33" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="138.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">빈자리 없음</text><circle cx="300" cy="300" r="16" fill="#ff7b72"/><path d="M293 293 l14 14 M307 293 l-14 14" stroke="#0f1115" stroke-width="4"/><text x="290" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">새 접시를 멈춰요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><rect x="406" y="400.875" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="367.75" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="334.625" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="406" y="301.5" width="148" height="25.125" rx="4" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><rect x="330" y="116" width="300" height="33" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="138.12" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1115">자리가 나면 알려요</text><line x1="570" y1="300" x2="754" y2="300" stroke="#7ee7c7" stroke-width="5"/><polygon points="770,300 746,289 746,311" fill="#7ee7c7"/><line x1="190" y1="300" x2="374" y2="300" stroke="#6ea8fe" stroke-width="5"/><polygon points="390,300 366,289 366,311" fill="#6ea8fe"/><text x="670" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">서빙해요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서빙대에 빈자리가 많으면 접시를 계속 내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">빈자리가 줄면 알리는 여유도 작아져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자리가 없으면 새 접시 내기를 멈춰요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="15s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자리가 나면 알리고 다시 내기 시작해요</text></g>

