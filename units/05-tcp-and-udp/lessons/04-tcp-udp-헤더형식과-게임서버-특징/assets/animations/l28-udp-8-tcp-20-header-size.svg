<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>UDP 헤더 8바이트, TCP 헤더 20바이트 이상</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">UDP 헤더 8바이트, TCP 헤더 20바이트 이상</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">헤더가 짧다고 항상 더 빠르거나 좋은 것은 아니에요</text>
<text x="80" y="205" text-anchor="start" font-size="20" font-weight="700" fill="#ffb454">UDP</text><text x="80" y="295" text-anchor="start" font-size="20" font-weight="700" fill="#6ea8fe">TCP</text><g><rect x="290" y="180" width="400" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="490.0" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">같은 크기의 데이터</text><rect x="530" y="270" width="400" height="46" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="730.0" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">같은 크기의 데이터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="130" y="180" width="160" height="46" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="0"/><text x="210.0" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">8바이트</text><text x="480" y="260" text-anchor="middle" font-size="16" fill="#9aa3b2">출발지 포트 · 목적지 포트 · 길이 · Checksum</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="130" y="270" width="400" height="46" rx="6" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="0"/><text x="330.0" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">최소 20바이트 (옵션이 붙으면 더 길어요)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="200" y="409" width="561" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="430.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">헤더 길이만 보고 빠르기를 판단하지 않아요 · 필요한 전달 기능을 함께 봐요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 크기의 데이터를 보낸다고 가정해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UDP 헤더는 네 칸, 8바이트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TCP 헤더는 옵션이 없어도 최소 20바이트예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">헤더 길이만이 아니라 필요한 전달 기능을 봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>