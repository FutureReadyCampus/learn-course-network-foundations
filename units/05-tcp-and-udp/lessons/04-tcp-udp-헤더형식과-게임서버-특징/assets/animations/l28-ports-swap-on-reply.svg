<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>응답에서는 출발지와 목적지 포트가 바뀌어요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">응답에서는 출발지와 목적지 포트가 바뀌어요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">예시 포트 51514와 443이에요</text>
<rect x="40" y="150" width="300" height="210" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190" y="182" text-anchor="middle" font-size="19" font-weight="700" fill="#6ea8fe">클라이언트</text><rect x="110" y="220" width="160" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="190.0" y="248.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">포트 51514</text><rect x="620" y="150" width="300" height="210" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="770" y="182" text-anchor="middle" font-size="19" font-weight="700" fill="#7ee7c7">웹 서버</text><rect x="690" y="220" width="160" height="44" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="770.0" y="248.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">포트 443</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="190" y="310" text-anchor="middle" font-size="16" fill="#9aa3b2">IP 주소 = 컴퓨터</text><text x="190" y="335" text-anchor="middle" font-size="16" fill="#9aa3b2">포트 = 프로그램</text><text x="770" y="310" text-anchor="middle" font-size="16" fill="#9aa3b2">IP 주소 = 컴퓨터</text><text x="770" y="335" text-anchor="middle" font-size="16" fill="#9aa3b2">포트 = 프로그램</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="345" y1="220" x2="599" y2="220" stroke="#6ea8fe" stroke-width="5"/><polygon points="615,220 591,209 591,231" fill="#6ea8fe"/><rect x="345" y="170" width="270" height="31" rx="16" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="190.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">출발 51514 → 도착 443</text><rect x="106" y="216" width="168" height="52" rx="8" fill="none" stroke="#6ea8fe" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><line x1="615" y1="290" x2="361" y2="290" stroke="#7ee7c7" stroke-width="5"/><polygon points="345,290 369,279 369,301" fill="#7ee7c7"/><rect x="345" y="310" width="270" height="31" rx="16" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="330.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1115">출발 443 → 도착 51514</text><rect x="686" y="216" width="168" height="52" rx="8" fill="none" stroke="#7ee7c7" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="196" y="414" width="568" height="32" rx="16" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">80은 HTTP, 443은 HTTPS의 흔한 기본 포트 · 다른 번호도 설정할 수 있어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IP는 컴퓨터를, 포트는 그 안의 프로그램을 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">요청은 출발지 51514에서 목적지 443으로 가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">응답에서는 443이 출발지, 51514가 목적지가 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">80과 443은 흔한 기본 포트이고 다른 번호도 설정할 수 있어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>