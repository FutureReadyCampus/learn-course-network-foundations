<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>순서 번호, ACK, 제어 플래그</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">순서 번호, ACK, 제어 플래그</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">숫자는 설명을 위한 예시예요</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="175" width="600" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="120" y="165" text-anchor="start" font-size="17" font-weight="700" fill="#6ea8fe">1000</text><text x="720" y="165" text-anchor="end" font-size="17" font-weight="700" fill="#6ea8fe">1099</text><text x="420" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">100바이트 데이터</text><text x="420" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">순서 번호 = 시작 위치 1000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="735" y="175" width="105" height="56" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="787" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">1100</text><line x1="787" y1="236" x2="787" y2="292" stroke="#ffb454" stroke-width="3"/><polygon points="787,236 778,252 796,252" fill="#ffb454"/><rect x="280" y="303" width="440" height="34" rx="17" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="500" y="326.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">ACK 1100 = 다음에 기대하는 위치</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3b2">제어 플래그</text><rect x="80" y="300" width="170" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="165.0" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">SYN</text><text x="165" y="365" text-anchor="middle" font-size="15" fill="#9aa3b2">연결 시작</text><rect x="270" y="300" width="170" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="355.0" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">FIN</text><text x="355" y="365" text-anchor="middle" font-size="15" fill="#9aa3b2">정상 마침</text><rect x="460" y="300" width="170" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="545.0" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">ACK</text><text x="545" y="365" text-anchor="middle" font-size="15" fill="#9aa3b2">확인 번호 유효</text><rect x="650" y="300" width="170" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="735.0" y="326.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">RST</text><text x="735" y="365" text-anchor="middle" font-size="15" fill="#9aa3b2">연결 초기화</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="120" y="175" width="720" height="56" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><rect x="120" y="175" width="220" height="56" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="230" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">헤더</text><text x="590" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">데이터</text><line x1="340" y1="160" x2="340" y2="245" stroke="#ffb454" stroke-width="4"/><text x="340" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">Data Offset: 헤더가 끝나는 곳</text><rect x="130" y="294" width="700" height="32" rx="16" fill="#c792ea" stroke="#c792ea" stroke-width="2"/><text x="480" y="315.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">Checksum: 손상 점검 · 도착이나 의미를 보장하지는 않아요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">1000번부터 100바이트는 1000~1099를 차지해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모두 받았다는 ACK는 다음 위치 1100을 가리켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SYN, FIN, ACK, RST는 통신 상태를 알려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Data Offset은 헤더의 끝을, Checksum은 손상 점검을 맡아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>