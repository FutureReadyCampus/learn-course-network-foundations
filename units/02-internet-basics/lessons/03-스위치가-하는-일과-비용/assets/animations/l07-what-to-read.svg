<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">무엇을 보고 출구를 고를까?</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">전달 목적은 같아도 판단에 쓰는 주소는 계층마다 다릅니다</text>

  <line x1="100" y1="250" x2="820" y2="250" stroke="#3d4b60" stroke-width="3" ></line>
  <line x1="300" y1="250" x2="300" y2="400" stroke="#3d4b60" stroke-width="3" ></line>
  <text x="670" y="236" text-anchor="middle" font-size="20" fill="#9aa3b2">인터넷</text>
  <line x1="300" y1="274" x2="300" y2="376" stroke="#6ea8fe" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></line>
  <line x1="520" y1="250" x2="760" y2="250" stroke="#ffb454" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></line>
  <circle r="10" fill="#6ea8fe" opacity="0"><animateMotion path="M100,250 L300,250 L300,400" keyPoints="0;0;1;1" keyTimes="0;0.28;0.4;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.275;0.28;0.4;0.405;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="10" fill="#ffb454" opacity="0"><animateMotion path="M100,250 L520,250 L820,250" keyPoints="0;0;1;1" keyTimes="0;0.52;0.68;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.515;0.52;0.68;0.685;1" dur="12s" repeatCount="indefinite"/></circle>
  <rect x="40" y="226" width="120" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="100" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">노트북</text>
  <rect x="230" y="226" width="140" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="300" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">L2 스위치</text>
  <rect x="240" y="376" width="120" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="300" y="407.92" text-anchor="middle" font-size="22" fill="#e6e8ec">프린터</text>
  <rect x="460" y="226" width="120" height="48" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"></rect><text x="520" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">라우터</text>
  <rect x="760" y="226" width="120" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="820" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">웹 서버</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="205" y="176" width="190" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="300" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">목적지 MAC 확인</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="430" y="176" width="180" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="520" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">목적지 IP 확인</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="440" y="320" width="480" height="142" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><g font-size="20" text-anchor="middle"><g font-weight="700" fill="#9aa3b2"><text x="515" y="352">판단 정보</text><text x="690" y="352">다음 출구</text><text x="870" y="352">계층</text></g><text x="515" y="394" fill="#6ea8fe" font-weight="700">목적지 MAC</text><text x="690" y="394" fill="#e6e8ec">프린터 쪽 포트</text><text x="870" y="394" fill="#e6e8ec">L2</text><text x="515" y="438" fill="#ffb454" font-weight="700">목적지 IP</text><text x="690" y="438" fill="#e6e8ec">바깥 네트워크 쪽</text><text x="870" y="438" fill="#e6e8ec">L3</text></g></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">노트북이 프린터와 웹 서버로 데이터를 보냅니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">같은 LAN의 프린터: L2 스위치가 <tspan fill="#6ea8fe" font-weight="700">목적지 MAC</tspan>을 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">다른 네트워크의 서버: 라우터가 <tspan fill="#ffb454" font-weight="700">목적지 IP</tspan>를 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">무엇을 보고 → 어느 출구로 → 몇 계층인지 묶어 기억합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
