<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">경로를 비교하는 값, Metric</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">Metric은 돈이 아니라 라우팅 방식이 정한 비교 점수</text>

  <line x1="180" y1="260" x2="470" y2="165" stroke="#3d4b60" stroke-width="3" ></line><line x1="470" y1="165" x2="740" y2="260" stroke="#3d4b60" stroke-width="3" ></line>
  <g><animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.52;0.55;0.98;1" dur="10s" repeatCount="indefinite"/><line x1="180" y1="260" x2="470" y2="325" stroke="#3d4b60" stroke-width="3" ></line><line x1="470" y1="325" x2="740" y2="260" stroke="#3d4b60" stroke-width="3" ></line><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="395" y="307" width="150" height="36" rx="18" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="470" y="333" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3b2">Metric 50</text></g></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="180" y1="260" x2="470" y2="165" stroke="#ffb454" stroke-width="5" ></line><line x1="470" y1="165" x2="740" y2="260" stroke="#ffb454" stroke-width="5" ></line></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="395" y="147" width="150" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="470" y="173" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">Metric 10</text></g>
  <circle r="10" fill="#ffb454" opacity="0"><animateMotion path="M180,260 L470,165 L740,260" keyPoints="0;0;1;1" keyTimes="0;0.55;0.7;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.545;0.55;0.7;0.705;1" dur="10s" repeatCount="indefinite"/></circle>
  <rect x="60" y="236" width="120" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="120" y="267.92" text-anchor="middle" font-size="22" fill="#e6e8ec">라우터</text>
  <rect x="740" y="236" width="160" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="820" y="267.92" text-anchor="middle" font-size="22" fill="#e6e8ec">목적지 B망</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><text x="820" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">10 &lt; 50</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><line x1="150" y1="284" x2="550" y2="425" stroke="#3d4b60" stroke-width="3" ></line><rect x="550" y="401" width="200" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="650" y="432.92" text-anchor="middle" font-size="22" fill="#e6e8ec">다른 목적지 C망</text><rect x="225" y="315" width="130" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="290" y="341" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">Metric 5</text><text x="60" y="446" font-size="20" fill="#ffb454">목적지가 달라 비교하지 않음</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">라우터에서 목적지 B망으로 가는 길이 두 개 있습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">각 경로에 비교용 값, Metric이 붙습니다: 10과 50
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">같은 목적지 후보끼리 비교하면 10이 더 낮은 비용입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">목적지가 다른 경로의 숫자와는 비교하지 않습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
