  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">노트북이 패킷을 먼저 집 공유기로 보냅니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite" begin="2s"/></text>
    <text x="480" y="518" opacity="0">공유기가 다음 구간인 라우터1로 넘깁니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite" begin="2s"/></text>
    <text x="480" y="518" opacity="0">라우터1은 갈림길에서 라우터2 쪽을 고릅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite" begin="2s"/></text>
    <text x="480" y="518" opacity="0">구간을 하나씩 지나 웹 서버에 도착합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite" begin="2s"/></text>
    <text x="480" y="518" opacity="0">응답도 한 구간씩 돌아오며, 지나는 장비가 다를 수 있습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite" begin="2s"/></text>
  </g>

