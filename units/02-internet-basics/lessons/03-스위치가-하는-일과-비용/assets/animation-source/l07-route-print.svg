<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">route print로 표 읽기</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">목적지 범위 찾기 → 후보 찾기 → Metric 비교</text>

  <defs><clipPath id="rpType"><rect x="75" y="160" width="0" height="30"><animate attributeName="width" values="0;0;330;330;0" keyTimes="0;0.02;0.12;0.98;1" dur="10s" repeatCount="indefinite"/></rect></clipPath></defs>
  <rect x="50" y="118" width="860" height="350" rx="10" fill="#0b0d10" stroke="#3d4b60" stroke-width="2"/>
  <rect x="50" y="118" width="860" height="30" rx="10" fill="#171a21"/>
  <circle cx="72" cy="133" r="6" fill="#3d4b60"/><circle cx="92" cy="133" r="6" fill="#3d4b60"/><circle cx="112" cy="133" r="6" fill="#3d4b60"/>
  <text x="480" y="139" text-anchor="middle" font-size="16" fill="#9aa3b2">명령 프롬프트</text>
  <text x="75" y="182" font-family="Menlo,Consolas,monospace" font-size="22" fill="#e6e8ec" clip-path="url(#rpType)">C:\&gt; route print</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g font-family="Menlo,Consolas,monospace" font-size="18" fill="#9aa3b2"><text x="75" y="228">Network Destination</text><text x="305" y="228">Netmask</text><text x="455" y="228">Gateway</text><text x="610" y="228">Interface</text><text x="800" y="228">Metric</text></g><g font-size="18" fill="#6ea8fe"><text x="75" y="254">목적지</text><text x="305" y="254">마스크</text><text x="455" y="254">다음 라우터</text><text x="610" y="254">내 연결</text><text x="800" y="254">비교 값</text></g><line x1="65" y1="266" x2="895" y2="266" stroke="#3d4b60" stroke-width="3" ></line><g font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec"><text x="75" y="300">0.0.0.0</text><text x="305" y="300">0.0.0.0</text><text x="455" y="300">192.168.0.1</text><text x="610" y="300">192.168.0.10</text><text x="800" y="300">35</text></g><g font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec"><text x="75" y="340">0.0.0.0</text><text x="305" y="340">0.0.0.0</text><text x="455" y="340">10.0.0.1</text><text x="610" y="340">10.0.0.20</text><text x="800" y="340">291</text></g><g font-family="Menlo,Consolas,monospace" font-size="20" fill="#e6e8ec"><animate attributeName="opacity" values="1;1;0.35;0.35;1;1" keyTimes="0;0.4;0.42;0.8;0.82;1" dur="10s" repeatCount="indefinite"/><text x="75" y="380">127.0.0.0</text><text x="305" y="380">255.0.0.0</text><text x="455" y="380">On-link</text><text x="610" y="380">127.0.0.1</text><text x="800" y="380">331</text></g></g>
  <rect x="62" y="275" width="836" height="36" rx="6" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.78;0.8;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="62" y="315" width="836" height="36" rx="6" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.78;0.8;1" dur="10s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.78;0.8;1" dur="10s" repeatCount="indefinite"/><rect x="790" y="275" width="60" height="36" rx="6" fill="none" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="434" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">같은 목적지 0.0.0.0 후보: 35 &lt; 291</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><rect x="790" y="355" width="60" height="36" rx="6" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 4"/><text x="480" y="434" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">127.0.0.0 행의 331은 목적지가 달라 비교하지 않음</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">명령 프롬프트에 route print를 입력합니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.2;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">목적지, 마스크, 게이트웨이, 인터페이스, Metric 열이 나옵니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">먼저 보내려는 목적지와 맞는 행을 찾습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">같은 목적지 후보끼리 Metric을 비교합니다: 35가 더 낮습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">목적지가 다른 행의 331은 직접 비교하지 않습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.39;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.59;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
