<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
  <defs>
    <clipPath id="urlClip">
      <rect x="100" y="200" width="0" height="36">
        <animate attributeName="width" values="0;0;190;190;0" keyTimes="0;0.2;0.28;0.95;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">요청하는 쪽, 답하는 쪽</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">클라이언트 = 요청하는 쪽 · 서버 = 답하는 쪽</text>

  <!-- 네트워크 -->
  <line x1="322" y1="345" x2="688" y2="345" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="505" y="382" text-anchor="middle" font-size="24" fill="#9aa3b2">네트워크</text>

  <!-- 클라이언트 PC -->
  <rect x="80" y="180" width="230" height="160" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="92" y="192" width="206" height="136" rx="4" fill="#0f1115"/>
  <rect x="100" y="200" width="190" height="36" rx="6" fill="#171a21" stroke="#3d4b60"/>
  <text x="110" y="227" font-size="24" fill="#e6e8ec" clip-path="url(#urlClip)">naver.com</text>
  <rect x="180" y="340" width="30" height="20" fill="#3d4b60"/>
  <rect x="140" y="360" width="110" height="10" rx="4" fill="#3d4b60"/>
  <!-- PC 화면에 뜨는 페이지 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.8;0.95;1" dur="10s" repeatCount="indefinite"/>
    <rect x="100" y="244" width="190" height="20" rx="3" fill="#6ea8fe"/>
    <rect x="100" y="272" width="150" height="10" rx="3" fill="#9aa3b2"/>
    <rect x="100" y="290" width="180" height="10" rx="3" fill="#9aa3b2"/>
    <rect x="100" y="308" width="120" height="10" rx="3" fill="#9aa3b2"/>
  </g>
  <text x="195" y="420" text-anchor="middle" font-size="28" font-weight="700" fill="#7ee7c7">클라이언트</text>
  <text x="195" y="452" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.0.10</text>

  <!-- 웹 서버 -->
  <rect x="700" y="180" width="160" height="190" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <g fill="#0f1115" stroke="#3d4b60">
    <rect x="715" y="195" width="130" height="46" rx="6"/>
    <rect x="715" y="253" width="130" height="46" rx="6"/>
    <rect x="715" y="311" width="130" height="46" rx="6"/>
  </g>
  <g stroke="#3d4b60" stroke-width="4">
    <line x1="727" y1="218" x2="795" y2="218"/>
    <line x1="727" y1="276" x2="795" y2="276"/>
    <line x1="727" y1="334" x2="795" y2="334"/>
  </g>
  <g fill="#7ee7c7">
    <animate attributeName="fill" values="#7ee7c7;#7ee7c7;#ffb454;#7ee7c7;#ffb454;#7ee7c7;#7ee7c7" keyTimes="0;0.5;0.53;0.56;0.59;0.62;1" dur="10s" repeatCount="indefinite"/>
    <circle cx="828" cy="218" r="6"/>
    <circle cx="828" cy="276" r="6"/>
    <circle cx="828" cy="334" r="6"/>
  </g>
  <text x="780" y="420" text-anchor="middle" font-size="28" font-weight="700" fill="#6ea8fe">서버</text>
  <text x="780" y="452" text-anchor="middle" font-size="24" fill="#9aa3b2">203.0.113.5</text>

  <!-- 요청 편지 + 말풍선 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="410,300;410,300;600,300;600,300" keyTimes="0;0.3;0.46;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.3;0.46;0.5;1" dur="10s" repeatCount="indefinite"/>
    <rect x="-95" y="-90" width="190" height="48" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
    <polygon points="-10,-42 10,-42 0,-30" fill="#ffb454"/>
    <text x="0" y="-57" text-anchor="middle" font-size="24" fill="#e6e8ec">화면 보여 주세요</text>
    <rect x="-35" y="-23" width="70" height="46" rx="4" fill="#ffb454"/>
    <polyline points="-35,-23 0,4 35,-23" fill="none" stroke="#0f1115" stroke-width="3"/>
  </g>

  <!-- 응답 웹 페이지 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="630,300;630,300;380,300;380,300" keyTimes="0;0.6;0.76;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.56;0.76;0.8;1" dur="10s" repeatCount="indefinite"/>
    <text x="0" y="-48" text-anchor="middle" font-size="24" fill="#6ea8fe">웹 페이지</text>
    <rect x="-30" y="-38" width="60" height="76" rx="4" fill="#e6e8ec"/>
    <rect x="-22" y="-30" width="44" height="12" rx="2" fill="#6ea8fe"/>
    <rect x="-22" y="-10" width="36" height="6" rx="2" fill="#9aa3b2"/>
    <rect x="-22" y="2" width="44" height="6" rx="2" fill="#9aa3b2"/>
    <rect x="-22" y="14" width="28" height="6" rx="2" fill="#9aa3b2"/>
  </g>

  <!-- 둘 다 엔드포인트 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.3;1;0.3;1;1;0;0" keyTimes="0;0.77;0.8;0.84;0.87;0.89;0.91;0.95;0.98;1" dur="10s" repeatCount="indefinite"/>
    <rect x="340" y="118" width="280" height="42" rx="21" fill="#7ee7c7"/>
    <text x="480" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1115">둘 다 엔드포인트</text>
    <rect x="70" y="170" width="250" height="210" rx="14" fill="none" stroke="#7ee7c7" stroke-width="3"/>
    <rect x="690" y="170" width="180" height="210" rx="14" fill="none" stroke="#7ee7c7" stroke-width="3"/>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518">왼쪽 PC는 클라이언트, 오른쪽은 서버입니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.2;0.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">클라이언트가 '화면 보여 주세요' 하고 요청합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.48;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">서버는 웹 페이지를 만들어 답합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.5;0.78;0.8;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">둘 다 네트워크를 쓰는 <tspan fill="#7ee7c7" font-weight="700">엔드포인트</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.18;0.19;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.19;0.48;0.49;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.78;0.79;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
