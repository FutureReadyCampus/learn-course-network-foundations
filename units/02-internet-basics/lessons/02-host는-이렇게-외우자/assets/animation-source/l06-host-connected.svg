<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">모양이 달라도 모두 호스트</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">호스트 = 네트워크에 연결되어 통신하는 컴퓨터</text>

  <!-- 기기 테두리: 호스트 단계에서 민트색 -->
  <g fill="#171a21" stroke="#3d4b60" stroke-width="3">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60" keyTimes="0;0.5;0.53;0.97;1" dur="10s" repeatCount="indefinite"/>
    <!-- 스마트폰 -->
    <rect x="118" y="170" width="64" height="116" rx="10"/>
    <!-- 태블릿 -->
    <rect x="300" y="180" width="140" height="104" rx="10"/>
    <!-- 웹 서버 -->
    <rect x="530" y="165" width="120" height="125" rx="8"/>
    <!-- 워크스테이션 모니터 -->
    <rect x="740" y="170" width="140" height="92" rx="8"/>
  </g>
  <!-- 기기 안쪽 -->
  <g fill="#0f1115" stroke="#3d4b60">
    <rect x="126" y="184" width="48" height="82" rx="3"/>
    <rect x="310" y="190" width="120" height="84" rx="3"/>
    <rect x="542" y="176" width="96" height="32" rx="5"/>
    <rect x="542" y="214" width="96" height="32" rx="5"/>
    <rect x="542" y="252" width="96" height="32" rx="5"/>
    <rect x="750" y="180" width="120" height="72" rx="3"/>
  </g>
  <circle cx="150" cy="276" r="4" fill="#3d4b60"/>
  <g stroke="#3d4b60" stroke-width="4">
    <line x1="552" y1="192" x2="604" y2="192"/>
    <line x1="552" y1="230" x2="604" y2="230"/>
    <line x1="552" y1="268" x2="604" y2="268"/>
  </g>
  <g fill="#7ee7c7">
    <circle cx="622" cy="192" r="5"/>
    <circle cx="622" cy="230" r="5"/>
    <circle cx="622" cy="268" r="5"/>
  </g>
  <rect x="798" y="262" width="24" height="14" fill="#3d4b60"/>
  <rect x="770" y="276" width="80" height="8" rx="4" fill="#3d4b60"/>

  <!-- 기기 이름 -->
  <g font-size="24" fill="#e6e8ec" text-anchor="middle">
    <text x="150" y="324">스마트폰</text>
    <text x="370" y="324">태블릿</text>
    <text x="590" y="324">웹 서버</text>
    <text x="810" y="324">워크스테이션</text>
  </g>

  <!-- 네트워크 연결선 -->
  <g stroke="#6ea8fe" stroke-width="3" stroke-dasharray="52" stroke-dashoffset="52">
    <animate attributeName="stroke-dashoffset" values="52;52;0;0;52" keyTimes="0;0.25;0.29;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="150" y1="338" x2="150" y2="390"/>
    <line x1="370" y1="338" x2="370" y2="390"/>
    <line x1="590" y1="338" x2="590" y2="390"/>
    <line x1="810" y1="338" x2="810" y2="390"/>
  </g>
  <rect x="90" y="390" width="780" height="36" rx="18" fill="#171a21" stroke="#3d4b60" stroke-width="3">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#6ea8fe;#6ea8fe;#3d4b60" keyTimes="0;0.25;0.29;0.97;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="460" text-anchor="middle" font-size="24" fill="#9aa3b2">네트워크</text>

  <!-- 주고받는 데이터 -->
  <circle r="9" fill="#ffb454" opacity="0">
    <animateMotion path="M150,340 V408 H590 V340" keyPoints="0;0;1;1" keyTimes="0;0.3;0.44;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.44;0.45;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="9" fill="#6ea8fe" opacity="0">
    <animateMotion path="M810,340 V408 H370 V340" keyPoints="0;0;1;1" keyTimes="0;0.3;0.44;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.44;0.45;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- 호스트 꼬리표 -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0.4;1;0.4;1;1;0" keyTimes="0;0.5;0.52;0.78;0.81;0.84;0.87;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="94" y="118" width="112" height="34" rx="17" fill="#7ee7c7"/>
      <text x="150" y="143" fill="#0f1115">호스트</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0.4;1;0.4;1;1;0" keyTimes="0;0.53;0.55;0.78;0.81;0.84;0.87;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="314" y="118" width="112" height="34" rx="17" fill="#7ee7c7"/>
      <text x="370" y="143" fill="#0f1115">호스트</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0.4;1;0.4;1;1;0" keyTimes="0;0.56;0.58;0.78;0.81;0.84;0.87;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="534" y="118" width="112" height="34" rx="17" fill="#7ee7c7"/>
      <text x="590" y="143" fill="#0f1115">호스트</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0.4;1;0.4;1;1;0" keyTimes="0;0.59;0.61;0.78;0.81;0.84;0.87;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="754" y="118" width="112" height="34" rx="17" fill="#7ee7c7"/>
      <text x="810" y="143" fill="#0f1115">호스트</text>
    </g>
  </g>

  <!-- 가장 작은 기기와 고성능 기기 비교 -->
  <g fill="none" stroke="#ffb454" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.79;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="98" y="160" width="104" height="176" rx="14"/>
    <rect x="726" y="160" width="168" height="176" rx="14"/>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518">스마트폰, 태블릿, 웹 서버, 워크스테이션은 모양이 다릅니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">네 기기 모두 네트워크에 연결되어 데이터를 주고받습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">그래서 넷 모두 <tspan fill="#7ee7c7" font-weight="700">호스트</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">작은 스마트폰도, 고성능 워크스테이션도 같은 <tspan fill="#7ee7c7" font-weight="700">호스트</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
