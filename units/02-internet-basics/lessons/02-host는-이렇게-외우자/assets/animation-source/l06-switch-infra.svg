<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">네트워크를 이루는 쪽, Switch</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">Switch = 연결을 만드는 인프라 · L2 스위치는 Host에 넣지 않음</text>

  <!-- 단말: PC 셋, 프린터 -->
  <rect x="70" y="330" width="80" height="52" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="78" y="338" width="64" height="36" rx="2" fill="#0f1115"/><rect x="102" y="382" width="16" height="10" fill="#3d4b60"/><rect x="82" y="392" width="56" height="6" rx="3" fill="#3d4b60"/><rect x="210" y="330" width="80" height="52" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="218" y="338" width="64" height="36" rx="2" fill="#0f1115"/><rect x="242" y="382" width="16" height="10" fill="#3d4b60"/><rect x="222" y="392" width="56" height="6" rx="3" fill="#3d4b60"/><rect x="380" y="330" width="80" height="52" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="388" y="338" width="64" height="36" rx="2" fill="#0f1115"/><rect x="412" y="382" width="16" height="10" fill="#3d4b60"/><rect x="392" y="392" width="56" height="6" rx="3" fill="#3d4b60"/>
  <rect x="532" y="328" width="56" height="22" fill="#e6e8ec"/>
  <rect x="515" y="344" width="90" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <line x1="532" y1="376" x2="588" y2="376" stroke="#3d4b60" stroke-width="4"/>
  <g font-size="22" fill="#e6e8ec" text-anchor="middle">
    <text x="110" y="430">PC</text><text x="250" y="430">PC</text><text x="420" y="430">PC</text><text x="560" y="430">프린터</text>
  </g>

  <!-- L2 스위치 -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.97;0.99;1" dur="10s" repeatCount="indefinite"/>
    <g stroke="#6ea8fe" stroke-width="3">
      <line x1="180" y1="272" x2="110" y2="328"/><line x1="180" y1="272" x2="250" y2="328"/>
      <line x1="490" y1="272" x2="420" y2="328"/><line x1="490" y1="272" x2="560" y2="328"/>
    </g>
    <rect x="105" y="228" width="150" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="180" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">L2 스위치</text>
    <rect x="415" y="228" width="150" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="490" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">L2 스위치</text>
  </g>

  <!-- 라우터와 인터넷 -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.97;0.99;1" dur="10s" repeatCount="indefinite"/>
    <g stroke="#6ea8fe" stroke-width="3">
      <line x1="345" y1="172" x2="180" y2="228"/><line x1="345" y1="172" x2="490" y2="228"/>
      <line x1="420" y1="150" x2="700" y2="150"/>
    </g>
    <rect x="270" y="128" width="150" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="345" y="157.92" text-anchor="middle" font-size="22" fill="#e6e8ec">라우터</text>
    <rect x="700" y="124" width="180" height="52" rx="26" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
    <text x="790" y="158" text-anchor="middle" font-size="24" fill="#9aa3b2">인터넷</text>
  </g>
  <circle r="9" fill="#ffb454" opacity="0"><animateMotion path="M110,328 L180,272 L345,172 L345,150 L700,150" keyPoints="0;0;1;1" keyTimes="0;0.55;0.7;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.55;0.7;0.71;1" dur="10s" repeatCount="indefinite"/></circle>

  <!-- 역할 묶음 -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.97;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="90" y="114" width="495" height="172" rx="16" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="55" y="318" width="565" height="128" rx="16" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="645" y="198" width="260" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="775" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">인프라 쪽 · Switch</text>
    <rect x="645" y="364" width="260" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="775" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">단말 쪽 · 이용</text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">직원 PC와 프린터는 네트워크를 쓰는 쪽입니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">자리마다 놓인 L2 스위치가 기기들을 이어 줍니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">스위치 연결은 라우터로 모여 바깥 네트워크와 이어집니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">스위치와 라우터는 묶어서 <tspan fill="#6ea8fe" font-weight="700">인프라 쪽</tspan> 역할로 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
