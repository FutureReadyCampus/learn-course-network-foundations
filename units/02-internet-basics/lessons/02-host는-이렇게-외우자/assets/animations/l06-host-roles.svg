<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Host, Endpoint, Client와 Server</title>
  <desc id="description">노트북과 웹 서버는 통신의 끝 장치인 Host이며, 노트북은 요청을 보내는 Client, 서버는 응답을 제공하는 Server입니다. 가운데 라우터는 두 네트워크 사이에서 패킷을 전달합니다.</desc>
  <rect width="960" height="540" fill="#0f1115"/>
  <text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">한 기기, 여러 기준의 이름</text>

  <!-- Host는 통신의 양 끝 장치이며, 가운데 라우터와 구분됩니다. -->
  <rect x="65" y="82" width="275" height="278" rx="20" fill="none" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="620" y="82" width="275" height="278" rx="20" fill="none" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="100" y="96" width="205" height="38" rx="19" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
  <text x="202" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#7ee7c7">Host · 끝 장치</text>
  <rect x="655" y="96" width="205" height="38" rx="19" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
  <text x="757" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#7ee7c7">Host · 끝 장치</text>

  <!-- 노트북 -->
  <rect x="145" y="190" width="115" height="78" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/>
  <rect x="155" y="200" width="95" height="58" rx="3" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <path d="M132 274 H273 L286 289 H119 Z" fill="#3d4b60"/>
  <text x="202" y="324" text-anchor="middle" font-size="25" fill="#e6e8ec">노트북</text>
  <rect x="94" y="338" width="216" height="40" rx="20" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
  <text x="202" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">Endpoint · Client</text>

  <!-- 가운데 네트워크 라우터 -->
  <line x1="286" y1="240" x2="405" y2="240" stroke="#3d4b60" stroke-width="6"/>
  <line x1="555" y1="240" x2="674" y2="240" stroke="#3d4b60" stroke-width="6"/>
  <rect x="405" y="192" width="150" height="96" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
  <path d="M435 238 H525 M450 222 L435 238 L450 254 M510 222 L525 238 L510 254" fill="none" stroke="#6ea8fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="324" text-anchor="middle" font-size="25" fill="#e6e8ec">라우터</text>
  <text x="480" y="356" text-anchor="middle" font-size="20" fill="#9aa3b2">다음 네트워크로 전달</text>

  <!-- 웹 서버 -->
  <rect x="714" y="188" width="92" height="110" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/>
  <line x1="727" y1="219" x2="793" y2="219" stroke="#3d4b60" stroke-width="4"/>
  <line x1="727" y1="248" x2="793" y2="248" stroke="#3d4b60" stroke-width="4"/>
  <circle cx="790" cy="204" r="4" fill="#7ee7c7"/>
  <circle cx="790" cy="233" r="4" fill="#7ee7c7"/>
  <circle cx="790" cy="262" r="4" fill="#7ee7c7"/>
  <text x="757" y="324" text-anchor="middle" font-size="25" fill="#e6e8ec">웹 서버</text>
  <rect x="649" y="338" width="216" height="40" rx="20" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
  <text x="757" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">Endpoint · Server</text>

  <!-- 요청/응답 흐름 -->
  <circle r="8" fill="#ffb454">
    <animateMotion path="M286,240 L405,240 L555,240 L674,240" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect x="40" y="425" width="880" height="82" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="458">노트북과 웹 서버는 통신의 끝 장치, Host입니다
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="458" opacity="0">이 통신에서 노트북과 서버는 각각 한쪽 Endpoint입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="458" opacity="0">노트북은 Client, 웹 서버는 Server 역할입니다
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="480" y="458" opacity="0">라우터와 L2 스위치는 통신을 잇는 중간 장비입니다
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
  </g>
  <text x="480" y="490" text-anchor="middle" font-size="22" fill="#9aa3b2">Host는 장치, Endpoint는 통신의 끝, Client/Server는 요청·응답 역할입니다</text>
  <g aria-label="재생 단계">
    <rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">1 / 4<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    <text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.24;0.26;0.48;0.50;0.72;0.74;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
  </g>
</svg>
