<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">탭은 복사, 애그리게이션은 모으기</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">둘 다 네트워크를 구성·관리하는 인프라 쪽 장비</text>

  <line x1="480" y1="130" x2="480" y2="462" stroke="#3d4b60" stroke-width="2"/>

  <!-- 왼쪽: 탭 -->
  <g><animate attributeName="opacity" values="1;1;0.35;0.35;1;1" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    <text x="240" y="165" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">탭 스위치</text>
    <g stroke="#3d4b60" stroke-width="3"><line x1="120" y1="250" x2="195" y2="250"/><line x1="285" y1="250" x2="330" y2="250"/></g>
    <rect x="40" y="228" width="80" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="80" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">PC</text>
    <rect x="195" y="230" width="90" height="40" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="240" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">탭</text>
    <rect x="330" y="228" width="110" height="44" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="385" y="257.92" text-anchor="middle" font-size="22" fill="#e6e8ec">라우터</text>
    <text x="240" y="214" text-anchor="middle" font-size="20" fill="#9aa3b2">원래 흐름</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
      <line x1="240" y1="270" x2="240" y2="350" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="252" y="318" font-size="20" fill="#ffb454">복사본</text>
    </g>
    <rect x="165" y="350" width="150" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60" keyTimes="0;0.45;0.48;0.97;1" dur="12s" repeatCount="indefinite"/></rect><text x="240" y="381.92" text-anchor="middle" font-size="22" fill="#e6e8ec">분석 장비</text>
    <circle r="9" fill="#6ea8fe" opacity="0"><animateMotion path="M120,250 H330" keyPoints="0;0;1;1" keyTimes="0;0.04;0.2;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.04;0.2;0.21;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#6ea8fe" opacity="0"><animateMotion path="M120,250 H330" keyPoints="0;0;1;1" keyTimes="0;0.28;0.44;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.44;0.45;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#ffb454" opacity="0"><animateMotion path="M240,250 V350" keyPoints="0;0;1;1" keyTimes="0;0.37;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.45;0.46;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 오른쪽: 애그리게이션 -->
  <g><animate attributeName="opacity" values="0.35;0.35;1;1;0.35" keyTimes="0;0.47;0.5;0.97;1" dur="12s" repeatCount="indefinite"/>
    <text x="720" y="165" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">애그리게이션 스위치</text>
    <g stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#6ea8fe;#6ea8fe;#3d4b60" keyTimes="0;0.5;0.53;0.97;1" dur="12s" repeatCount="indefinite"/>
      <line x1="580" y1="376" x2="720" y2="324"/><line x1="720" y1="376" x2="720" y2="324"/><line x1="860" y1="376" x2="720" y2="324"/>
      <line x1="720" y1="280" x2="720" y2="236"/>
    </g>
    <rect x="640" y="196" width="160" height="40" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="720" y="223.92" text-anchor="middle" font-size="22" fill="#e6e8ec">상위 장비</text>
    <rect x="620" y="280" width="200" height="44" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"></rect><text x="720" y="309.92" text-anchor="middle" font-size="22" fill="#e6e8ec">애그리게이션</text>
    <rect x="530" y="376" width="100" height="40" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="580" y="403.92" text-anchor="middle" font-size="22" fill="#e6e8ec">1층</text><rect x="670" y="376" width="100" height="40" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="720" y="403.92" text-anchor="middle" font-size="22" fill="#e6e8ec">2층</text><rect x="810" y="376" width="100" height="40" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="860" y="403.92" text-anchor="middle" font-size="22" fill="#e6e8ec">3층</text>
    <circle r="9" fill="#6ea8fe" opacity="0"><animateMotion path="M580,376 L720,324" keyPoints="0;0;1;1" keyTimes="0;0.53;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.62;0.63;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#6ea8fe" opacity="0"><animateMotion path="M720,376 V324" keyPoints="0;0;1;1" keyTimes="0;0.53;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.62;0.63;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#6ea8fe" opacity="0"><animateMotion path="M860,376 L720,324" keyPoints="0;0;1;1" keyTimes="0;0.53;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.62;0.63;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#6ea8fe" opacity="0"><animateMotion path="M720,280 V236" keyPoints="0;0;1;1" keyTimes="0;0.63;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.63;0.7;0.71;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="135" y="424" width="210" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">관찰용 흐름 복사</text>
    <rect x="615" y="424" width="210" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="720" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">여러 연결 모으기</text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">원래 흐름은 탭을 지나 그대로 라우터로 갑니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">탭은 흐름의 복사본을 보안·분석 장비로 보냅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">애그리게이션 스위치는 여러 층의 연결을 모아 위로 잇습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">관찰용 복사와 연결 모으기, 둘 다 <tspan fill="#6ea8fe" font-weight="700">인프라 쪽</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
