<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">다음 길을 고르는 라우터</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">라우터 = 목적지 IP를 보고 네트워크 사이 경로를 고르는 장비</text>

  <rect x="52" y="225" width="116" height="74" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="62" y="235" width="96" height="54" rx="2" fill="#0f1115"/><path d="M34 303 H186 L198 317 H22 Z" fill="#3d4b60"/>
  <text x="110" y="356" text-anchor="middle" font-size="24" fill="#e6e8ec">노트북</text>
  <g stroke="#3d4b60" stroke-width="3">
    <line x1="168" y1="270" x2="350" y2="270"/>
    <line x1="490" y1="270" x2="690" y2="175"/><line x1="490" y1="270" x2="690" y2="270"/><line x1="490" y1="270" x2="690" y2="365"/>
  </g>
  <line x1="490" y1="270" x2="690" y2="270" stroke="#ffb454" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.55;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></line>
  <rect x="350" y="247" width="140" height="46" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"><animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#ffb454;#ffb454;#6ea8fe;#6ea8fe" keyTimes="0;0.3;0.33;0.5;0.53;1" dur="12s" repeatCount="indefinite"/></rect><text x="420" y="278.64" text-anchor="middle" font-size="24" fill="#e6e8ec">라우터</text>
  <rect x="690" y="150" width="230" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="805" y="182.92" text-anchor="middle" font-size="22" fill="#e6e8ec">A망 · 10.0.0.x</text>
  <rect x="690" y="245" width="230" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60" keyTimes="0;0.62;0.65;0.97;1" dur="12s" repeatCount="indefinite"/></rect><text x="805" y="277.92" text-anchor="middle" font-size="22" fill="#e6e8ec">B망 · 203.0.113.x</text>
  <rect x="690" y="340" width="230" height="50" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"></rect><text x="805" y="372.92" text-anchor="middle" font-size="22" fill="#e6e8ec">C망 · 172.16.0.x</text>

  <!-- 라우팅 정보 -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="290" y="322" width="260" height="140" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="420" y="348" text-anchor="middle" font-size="20" font-weight="700" fill="#9aa3b2">라우팅 정보</text>
    <rect x="302" y="392" width="236" height="30" rx="6" fill="#ffb454" fill-opacity="0.2" stroke="#ffb454" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.39;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
    <g font-size="20" fill="#e6e8ec" text-anchor="middle">
      <text x="420" y="380">10.0.0.x → A망</text>
      <text x="420" y="414">203.0.113.x → B망</text>
      <text x="420" y="448">172.16.0.x → C망</text>
    </g>
  </g>

  <!-- 패킷 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="110,205;110,205;420,205;420,205;690,270;690,270" keyTimes="0;0.04;0.18;0.52;0.66;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.04;0.66;0.68;1" dur="12s" repeatCount="indefinite"/>
    <rect x="-75" y="-18" width="150" height="36" rx="8" fill="#ffb454"/>
    <text x="0" y="7" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1115">203.0.113.5</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="355" y="196" width="130" height="36" rx="18" fill="#7ee7c7" stroke="#7ee7c7" stroke-width="2"/><text x="420" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">L3 장비</text></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">노트북이 보낸 패킷에는 목적지 IP가 적혀 있습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">라우터는 목적지 IP를 라우팅 정보와 맞춰 봅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">203.0.113.x는 B망 쪽이니, 그 연결로 내보냅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">IP는 L3 정보라서 라우터는 대표적인 <tspan fill="#7ee7c7" font-weight="700">L3 장비</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
