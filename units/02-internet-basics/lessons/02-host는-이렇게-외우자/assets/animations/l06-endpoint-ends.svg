<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">선의 끝에 있는 엔드포인트</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">엔드포인트 = 네트워크를 이용하거나 서비스를 제공하는 끝단</text>

  <!-- 연결선 -->
  <g stroke="#3d4b60" stroke-width="3">
    <line x1="228" y1="275" x2="410" y2="275"/><line x1="550" y1="275" x2="730" y2="275"/>
  </g>
  <rect x="112" y="210" width="116" height="74" rx="6" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="122" y="220" width="96" height="54" rx="2" fill="#0f1115"/><path d="M94 288 H246 L258 302 H82 Z" fill="#3d4b60"/>
  <!-- 프린터 -->
  <rect x="760" y="212" width="60" height="30" fill="#e6e8ec"/>
  <rect x="730" y="236" width="120" height="60" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <line x1="755" y1="284" x2="825" y2="284" stroke="#3d4b60" stroke-width="4"/>
  <circle cx="830" cy="254" r="5" fill="#7ee7c7"/>
  <rect x="760" y="290" width="60" height="0" fill="#e6e8ec">
    <animate attributeName="height" values="0;0;44;44;0" keyTimes="0;0.4;0.47;0.97;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- 스위치: 마지막 단계에서 흐려짐 -->
  <g>
    <animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="410" y="252" width="140" height="46" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <g fill="#0f1115" stroke="#3d4b60"><rect x="428" y="268" width="16" height="14"/><rect x="456" y="268" width="16" height="14"/><rect x="484" y="268" width="16" height="14"/><rect x="512" y="268" width="16" height="14"/></g>
    <text x="480" y="372" text-anchor="middle" font-size="24" fill="#e6e8ec">스위치</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="405" y="150" width="150" height="36" rx="18" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">중간 전달</text></g>
  </g>
  <g font-size="24" fill="#e6e8ec" text-anchor="middle">
    <text x="170" y="372">노트북</text><text x="790" y="372">프린터</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.49;1" dur="12s" repeatCount="indefinite"/>
    <text x="320" y="252" text-anchor="middle" font-size="22" fill="#ffb454">인쇄 요청</text>
  </g>
  <circle r="9" fill="#ffb454" opacity="0"><animateMotion path="M228,275 H730" keyPoints="0;0;1;1" keyTimes="0;0.28;0.4;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.4;0.41;1" dur="12s" repeatCount="indefinite"/></circle>

  <!-- 양 끝 엔드포인트 -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="95" y="150" width="150" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="170" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">엔드포인트</text>
    <rect x="715" y="150" width="150" height="36" rx="18" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="790" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">엔드포인트</text>
  </g>
  <g fill="none" stroke="#ffb454" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0.3;1;0.3;1;1;0" keyTimes="0;0.5;0.53;0.78;0.81;0.84;0.87;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="70" y="196" width="200" height="196" rx="14"/>
    <rect x="690" y="196" width="200" height="196" rx="14"/>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">노트북과 프린터 사이에 스위치가 있습니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">노트북이 인쇄를 요청하고, 프린터가 종이로 출력합니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">선의 양쪽 끝, 노트북과 프린터가 <tspan fill="#ffb454" font-weight="700">엔드포인트</tspan>입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">중간 스위치는 전달만 하고, 실제 일은 양 끝에서 일어납니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="12s" repeatCount="indefinite"/></rect></g></g></svg>