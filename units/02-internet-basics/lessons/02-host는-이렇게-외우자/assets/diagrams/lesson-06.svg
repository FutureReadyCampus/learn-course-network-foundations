<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 478" role="group" aria-labelledby="lesson-06-basic-export-title lesson-06-basic-export-desc" lang="ko"><title id="lesson-06-basic-export-title">Host는 이렇게 외우자 (인쇄용 강의자료 PDF 포함) · 학습 흐름</title><desc id="lesson-06-basic-export-desc">Host의 역할별 분류. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-06-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-06-basic-export-arrow)"><path d="M560 120 V142 H280 V172"/><path d="M560 142 H840 V172"/><path d="M280 272 V304 H115 V330"/><path d="M280 304 H325 V330"/><path d="M280 304 H535 V330"/><path d="M840 272 V304 H745 V330"/><path d="M840 304 H980 V330"/></g><rect x="430" y="20" width="260" height="100" rx="10"/><text x="560.0" y="56" text-anchor="middle"><tspan x="560.0" dy="0">Host</tspan><tspan x="560.0" dy="27">네트워크에 연결된 컴퓨터</tspan></text><rect x="135" y="172" width="290" height="100" rx="10"/><text x="280.0" y="208" text-anchor="middle"><tspan x="280.0" dy="0">End point</tspan><tspan x="280.0" dy="27">네트워크를 이용하는 쪽</tspan></text><rect x="695" y="172" width="290" height="100" rx="10"/><text x="840.0" y="208" text-anchor="middle"><tspan x="840.0" dy="0">Switch</tspan><tspan x="840.0" dy="27">네트워크를 이루는 쪽</tspan></text><rect x="20" y="330" width="190" height="92" rx="10"/><text x="115.0" y="366" text-anchor="middle"><tspan x="115.0" dy="0">Client</tspan></text><rect x="230" y="330" width="190" height="92" rx="10"/><text x="325.0" y="366" text-anchor="middle"><tspan x="325.0" dy="0">Server</tspan></text><rect x="440" y="330" width="190" height="92" rx="10"/><text x="535.0" y="366" text-anchor="middle"><tspan x="535.0" dy="0">Peer</tspan></text><rect x="650" y="330" width="190" height="92" rx="10"/><text x="745.0" y="366" text-anchor="middle"><tspan x="745.0" dy="0">Router</tspan></text><rect x="860" y="330" width="240" height="92" rx="10"/><text x="980.0" y="366" text-anchor="middle"><tspan x="980.0" dy="0">보안·관리 스위치</tspan></text><text class="flow-note" x="560" y="461" text-anchor="middle">강의의 역할 구분 · L2 스위치에 대한 예외는 Switch 설명에서 확인</text></svg>
