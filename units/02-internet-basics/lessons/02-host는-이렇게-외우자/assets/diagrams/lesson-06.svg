<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 478" role="img" aria-labelledby="lesson-06-host-title lesson-06-host-desc" lang="ko">
  <title id="lesson-06-host-title">Host는 통신의 끝 장치</title>
  <desc id="lesson-06-host-desc">노트북과 웹 서버는 통신의 끝에서 데이터를 주고받는 Host입니다. 가운데 라우터는 패킷을 다음 네트워크로 전달하는 중간 장비입니다. 스위치와 라우터는 Host와 구분되는 인프라 장비입니다.</desc>
  <defs>
    <marker id="lesson-06-host-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#6ea8fe" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    .learning-flow{background:#0f1115;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif}
    .learning-flow text{fill:#e6e8ec;font-size:22px}
    .learning-flow .title{font-size:30px;font-weight:700}
    .learning-flow .label{font-size:20px;font-weight:700}
    .learning-flow .note{font-size:18px;fill:#9aa3b2}
    .learning-flow .host{fill:#171a21;stroke:#7ee7c7;stroke-width:2.5;stroke-dasharray:9 7}
    .learning-flow .device{fill:#171a21;stroke:#9aa3b2;stroke-width:3}
    .learning-flow .middle{fill:#171a21;stroke:#6ea8fe;stroke-width:3}
  </style>
  <text class="title" x="560" y="50" text-anchor="middle">Host는 통신의 끝 장치</text>

  <rect class="host" x="52" y="92" width="300" height="260" rx="18"/>
  <rect class="host" x="768" y="92" width="300" height="260" rx="18"/>
  <text class="label" x="202" y="126" text-anchor="middle" fill="#7ee7c7">Host · 끝 장치</text>
  <text class="label" x="918" y="126" text-anchor="middle" fill="#7ee7c7">Host · 끝 장치</text>

  <!-- 노트북 -->
  <rect class="device" x="135" y="174" width="134" height="88" rx="8"/>
  <rect x="146" y="185" width="112" height="66" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <path d="M120 270 H284 L297 285 H107 Z" fill="#3d4b60"/>
  <text x="202" y="320" text-anchor="middle">노트북</text>

  <!-- 라우터: Host 범위 밖의 중간 장비 -->
  <line x1="297" y1="230" x2="438" y2="230" stroke="#6ea8fe" stroke-width="4" marker-end="url(#lesson-06-host-arrow)"/>
  <line x1="682" y1="230" x2="823" y2="230" stroke="#6ea8fe" stroke-width="4" marker-end="url(#lesson-06-host-arrow)"/>
  <rect class="middle" x="438" y="174" width="244" height="112" rx="16"/>
  <text class="label" x="560" y="220" text-anchor="middle">라우터</text>
  <text class="note" x="560" y="252" text-anchor="middle">다음 네트워크로 전달</text>
  <text class="note" x="560" y="320" text-anchor="middle">중간 인프라 장비</text>

  <!-- 웹 서버 -->
  <rect class="device" x="864" y="168" width="108" height="120" rx="8"/>
  <line x1="879" y1="202" x2="957" y2="202" stroke="#3d4b60" stroke-width="4"/>
  <line x1="879" y1="230" x2="957" y2="230" stroke="#3d4b60" stroke-width="4"/>
  <line x1="879" y1="258" x2="957" y2="258" stroke="#3d4b60" stroke-width="4"/>
  <circle cx="952" cy="187" r="4" fill="#7ee7c7"/>
  <circle cx="952" cy="215" r="4" fill="#7ee7c7"/>
  <circle cx="952" cy="243" r="4" fill="#7ee7c7"/>
  <text x="918" y="320" text-anchor="middle">웹 서버</text>

  <rect x="120" y="384" width="880" height="56" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text class="label" x="560" y="419" text-anchor="middle">스위치와 라우터는 통신을 이어 주는 중간 인프라 장비입니다</text>
</svg>
