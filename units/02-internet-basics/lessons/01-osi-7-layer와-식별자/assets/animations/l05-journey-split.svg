<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">같은 여정, 두 가지 나눔</text>
  <text x="480" y="100" text-anchor="middle" font-size="24" fill="#9aa3b2">자세히 나누든 크게 묶든, 상자가 가는 길은 같습니다</text>

  <text x="80" y="176" font-size="20" fill="#9aa3b2">자세히 나눈 안내</text>
  <text x="80" y="370" font-size="20" fill="#9aa3b2">크게 묶은 안내</text>
  <line x1="80" y1="290" x2="880" y2="290" stroke="#3d4b60" stroke-width="10" stroke-linecap="round"></line>
  <circle cx="80" cy="290" r="10" fill="#7ee7c7"/><circle cx="880" cy="290" r="10" fill="#7ee7c7"/>
  <text x="80" y="336" font-size="22" fill="#e6e8ec">보내는 곳</text>
  <text x="880" y="336" text-anchor="end" font-size="22" fill="#e6e8ec">받는 곳</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="84" y="188" width="152" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="160" y="219" text-anchor="middle" font-size="20" fill="#e6e8ec">접수</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.806;0.826;1" dur="12s" repeatCount="indefinite"/><rect x="84" y="188" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="244" y="188" width="152" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="320" y="219" text-anchor="middle" font-size="20" fill="#e6e8ec">분류</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.806;0.826;0.842;0.862;1" dur="12s" repeatCount="indefinite"/><rect x="244" y="188" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="404" y="188" width="152" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="219" text-anchor="middle" font-size="20" fill="#e6e8ec">장거리 이동</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.842;0.862;0.878;0.898;1" dur="12s" repeatCount="indefinite"/><rect x="404" y="188" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.39;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="564" y="188" width="152" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="640" y="219" text-anchor="middle" font-size="20" fill="#e6e8ec">가까운 지역</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.878;0.898;0.914;0.934;1" dur="12s" repeatCount="indefinite"/><rect x="564" y="188" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.43;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="724" y="188" width="152" height="48" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="800" y="219" text-anchor="middle" font-size="20" fill="#e6e8ec">마지막 전달</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.914;0.934;0.95;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="724" y="188" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="84" y="380" width="152" height="48" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="160" y="411" text-anchor="middle" font-size="22" fill="#e6e8ec">보내기</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.806;0.826;1" dur="12s" repeatCount="indefinite"/><rect x="84" y="380" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="244" y="380" width="472" height="48" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="411" text-anchor="middle" font-size="22" fill="#e6e8ec">이동하기</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.806;0.826;0.914;0.934;1" dur="12s" repeatCount="indefinite"/><rect x="244" y="380" width="472" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><rect x="724" y="380" width="152" height="48" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="800" y="411" text-anchor="middle" font-size="22" fill="#e6e8ec">받기</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.914;0.934;0.95;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="724" y="380" width="152" height="48" rx="8" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3"/></g>
  <g opacity="0"><animateTransform attributeName="transform" type="translate" values="80,290;80,290;880,290;880,290;80,290;80,290;880,290;880,290" keyTimes="0;0.03;0.21;0.22;0.23;0.77;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0;1;1;0;0" keyTimes="0;0.02;0.22;0.23;0.75;0.76;0.96;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="-24" y="-18" width="48" height="36" rx="4" fill="#ffb454"/><rect x="-5" y="-18" width="10" height="36" fill="#0f1115" fill-opacity="0.25"/></g>

  <!-- 자막 바 -->
  <rect x="0" y="478" width="960" height="62" fill="#171a21"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="518" opacity="1">상자가 보내는 곳에서 받는 곳까지 갑니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">자세히 보면 다섯 단계로 나눠 안내할 수 있습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">크게 묶으면 보내기·이동하기·받기 세 덩어리입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="480" y="518" opacity="0">나누는 방법이 달라도 상자가 가는 길은 같습니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
