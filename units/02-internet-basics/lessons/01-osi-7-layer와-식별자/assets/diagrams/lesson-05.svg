<svg xmlns="http://www.w3.org/2000/svg" class="learning-flow" viewBox="0 0 1120 500" role="group" aria-labelledby="lesson-05-basic-export-title lesson-05-basic-export-desc" lang="ko"><title id="lesson-05-basic-export-title">OSI 7 layer와 식별자 (강의자료 PDF 포함) · 학습 흐름</title><desc id="lesson-05-basic-export-desc">강의 설명을 읽는 순서와 각 개념의 제목을 보여 줍니다.</desc><defs><marker id="lesson-05-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-05-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/><path d="M546 232.0 H570"/><path d="M824 232.0 H848"/><path d="M977.0 288 V312.0 H143.0 V332"/></g><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">OSI 계층을 훑어보기</tspan></text><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">계층을 실제</tspan><tspan x="421.0" dy="25">구성요소에 연결하기</tspan></text><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">식별자는 무엇을</tspan><tspan x="699.0" dy="25">구별할까</tspan></text><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">MAC 주소 ·</tspan><tspan x="977.0" dy="25">인터페이스</tspan></text><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">IP 주소 · 호스트</tspan></text><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">포트 번호 · 관점에</tspan><tspan x="421.0" dy="25">따른 의미</tspan></text><rect x="574" y="176" width="250" height="112" rx="10"/><text x="699.0" y="214" text-anchor="middle"><tspan x="699.0" dy="0">내 컴퓨터의 식별자</tspan><tspan x="699.0" dy="25">확인</tspan></text><rect x="852" y="176" width="250" height="112" rx="10"/><text x="977.0" y="214" text-anchor="middle"><tspan x="977.0" dy="0">DoD 분류와 계층 묶기</tspan></text><rect x="18" y="336" width="250" height="112" rx="10"/><text x="143.0" y="374" text-anchor="middle"><tspan x="143.0" dy="0">세 가지 식별자 정리</tspan></text></svg>
