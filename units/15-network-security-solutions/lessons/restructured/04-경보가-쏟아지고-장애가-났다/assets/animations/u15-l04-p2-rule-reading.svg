<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이 경보는 어떤 규칙이 울렸을까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이 경보는 어떤 규칙이 울렸을까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">누가 어디로 → 무엇을 → 무엇을 하나</text>
<g><rect x="401" y="143" width="158" height="34" rx="17" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="480" y="166.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">NIDS 규칙 한 줄</text></g><rect x="60" y="215" width="104" height="60" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="112.0" y="252.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">alert</text><rect x="170" y="215" width="334" height="60" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="337.0" y="252.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">tcp any any -&gt; any 80</text><rect x="510" y="215" width="404" height="60" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="712.0" y="251.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">(content:"테스트"; sid:1000001;)</text><g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="166" y="211" width="342" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="232" y="304" width="215" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="340" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">① 누가 어디로: TCP 80번</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="211" width="412" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="624" y="304" width="181" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="715" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">② 찾는 것: '테스트'</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="211" width="112" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="44" y="304" width="141" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="115" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">③ 동작: 경보만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="331" y="368" width="298" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="391.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">정상 요청에도 울려서 오탐이 많아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="327.0" y="364.5" width="306" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="338" y="419" width="285" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="440.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">443 통신은 이 규칙의 범위 밖이에요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 한 줄을 세 덩어리로 나눠 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">괄호 안에서 무엇을 찾는지 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">맨 앞 동작으로 찾으면 무엇을 하는지 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">단순한 규칙은 읽기 쉽지만 오탐이 많아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>