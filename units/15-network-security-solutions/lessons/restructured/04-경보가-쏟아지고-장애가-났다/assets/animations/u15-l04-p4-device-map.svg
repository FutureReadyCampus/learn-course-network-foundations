troke-width="3"/><text x="360" y="290.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">TLS 종료</text><text x="360" y="335" text-anchor="middle" font-size="14" fill="#9aa3b2">대신 연결</text><rect x="457.0" y="257.0" width="96" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="505" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">WAF</text><text x="505" y="335" text-anchor="middle" font-size="14" fill="#9aa3b2">대신 연결</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="304" y="249" width="257" height="108" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="240,285;240,285;480,285;480,285" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="602.0" y="257.0" width="96" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="650" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">IPS</text><text x="650" y="335" text-anchor="middle" font-size="14" fill="#9aa3b2">경로 안</text><rect x="796" y="245" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="255" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="279" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="303" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="347" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">서버 풀</text><text x="830" y="365" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.20.11–.13</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="594" y="237" width="292" height="138" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="530,285;530,285;790,285;790,285" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="830" cy="195" r="16" fill="#7ee7c7"/><path d="M822 195 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><ellipse cx="430" cy="410" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="430" cy="410" r="7" fill="#ffb454"/><text x="430" y="442" text-anchor="middle" font-size="15" fill="#9aa3b2">NIDS</text><line x1="430" y1="395" x2="430" y2="297" stroke="#c792ea" stroke-width="2" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="386.0" y="381.0" width="88" height="78" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="574" y="404" width="231" height="31" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="690" y="425.4" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">경로 밖: 복사본을 보고 경보만</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">해외 고객이 공개 주소로 요청을 보내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">TLS를 끝내고 WAF가 풀린 요청을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서버 구역 입구에서 IPS가 보고 서버 풀에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NIDS는 옆에서 복사본만 보고 경보를 내요</text></g>

