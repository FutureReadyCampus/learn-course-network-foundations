<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>한 장의 지도에 요청 하나를</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">한 장의 지도에 요청 하나를</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">경로 안·대신 연결·경로 밖으로 읽어요</text>
