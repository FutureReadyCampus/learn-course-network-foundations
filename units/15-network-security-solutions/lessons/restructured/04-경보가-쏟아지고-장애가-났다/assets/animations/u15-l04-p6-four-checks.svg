<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이제 안전하다고 답할 수 있을까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이제 안전하다고 답할 수 있을까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">네 가지 질문에 답할 수 있는 칸과 빈 칸</text>
<rect x="40" y="112" width="880" height="40" rx="20" fill="#171a21" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec">서 이사 · 우리 회사, 이제 안전하다고 답할 수 있어요?</text><g><rect x="40" y="176" width="208" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="144" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">① 누가 들어오나</text><text x="144" y="225" text-anchor="middle" font-size="16" fill="#9aa3b2">NAC</text><rect x="264" y="176" width="208" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="368" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">② 무엇을 통과시키나</text><text x="368" y="225" text-anchor="middle" font-size="16" fill="#9aa3b2">방화벽</text><rect x="488" y="176" width="208" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="592" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">③ 무엇이 공격인가</text><text x="592" y="225" text-anchor="middle" font-size="16" fill="#9aa3b2">IPS·NIDS</text><rect x="712" y="176" width="208" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="816" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">④ 무슨 일이 있었나</text><text x="816" y="225" text-anchor="middle" font-size="16" fill="#9aa3b2">SIEM</text></g><rect x="40" y="246" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="144" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="40" y="332" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="144" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="264" y="246" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="368" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="264" y="332" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="368" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="488" y="246" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="592" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="488" y="332" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="592" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="712" y="246" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="816" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><rect x="712" y="332" width="208" height="76" rx="8" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/><text x="816" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#3d4b60">?</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="246" width="208" height="76" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="144" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">✓ 답할 수 있는 것</text><text x="144" y="290" text-anchor="middle" font-size="16" fill="#e6e8ec">미등록 기기를</text><text x="144" y="311" text-anchor="middle" font-size="16" fill="#e6e8ec">찾아내요</text><rect x="264" y="246" width="208" height="76" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="368" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">✓ 답할 수 있는 것</text><text x="368" y="290" text-anchor="middle" font-size="16" fill="#e6e8ec">서버 구역으로 나누고</text><text x="368" y="311" text-anchor="middle" font-size="16" fill="#e6e8ec">기본은 차단</text><rect x="488" y="246" width="208" height="76" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="592" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">✓ 답할 수 있는 것</text><text x="592" y="290" text-anchor="middle" font-size="16" fill="#e6e8ec">알려진 공격은</text><text x="592" y="311" text-anchor="middle" font-size="16" fill="#e6e8ec">IPS·NIDS가 봐요</text><rect x="712" y="246" width="208" height="76" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="816" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">✓ 답할 수 있는 것</text><text x="816" y="290" text-anchor="middle" font-size="16" fill="#e6e8ec">시각 맞춘 로그를</text><text x="816" y="311" text-anchor="middle" font-size="16" fill="#e6e8ec">이어 거슬러 가요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="242" width="888" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="332" width="208" height="76" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="144" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">△ 아직 비어 있는 것</text><text x="144" y="376" text-anchor="middle" font-size="16" fill="#e6e8ec">인증 못 하는 기기의</text><text x="144" y="397" text-anchor="middle" font-size="16" fill="#e6e8ec">예외 목록 관리</text><rect x="264" y="332" width="208" height="76" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="368" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">△ 아직 비어 있는 것</text><text x="368" y="376" text-anchor="middle" font-size="16" fill="#e6e8ec">규칙이 늘면 생기는</text><text x="368" y="397" text-anchor="middle" font-size="16" fill="#e6e8ec">충돌 점검</text><rect x="488" y="332" width="208" height="76" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="592" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">△ 아직 비어 있는 것</text><text x="592" y="376" text-anchor="middle" font-size="16" fill="#e6e8ec">처음 보는 공격,</text><text x="592" y="397" text-anchor="middle" font-size="16" fill="#e6e8ec">오탐·미탐 균형</text><rect x="712" y="332" width="208" height="76" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="816" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#c792ea">△ 아직 비어 있는 것</text><text x="816" y="376" text-anchor="middle" font-size="16" fill="#e6e8ec">로그 보관 기간,</text><text x="816" y="397" text-anchor="middle" font-size="16" fill="#e6e8ec">계정 기록 연결</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="328" width="888" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="214" y="430" width="533" height="36" rx="18" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="455.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">안전하다는 말 대신, 네 가지를 이렇게 점검한다고 답해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="209.5" y="426.0" width="541" height="44" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사의 질문을 네 가지 점검으로 쪼개요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">각 점검에서 지금 답할 수 있는 것을 짚어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 비어 있는 것도 함께 말해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">'안전하다' 대신 네 가지 점검으로 답해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>