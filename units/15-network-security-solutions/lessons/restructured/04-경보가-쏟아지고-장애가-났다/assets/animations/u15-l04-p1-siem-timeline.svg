<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>흩어진 로그를 이으면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">흩어진 로그를 이으면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">NAC·방화벽·IPS 기록을 한 줄로</text>
<g><rect x="60" y="130" width="260" height="84" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="190" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">NAC · 02:41</text><text x="190" y="192" text-anchor="middle" font-size="15" fill="#e6e8ec">미등록 기기 접속</text><rect x="350" y="130" width="260" height="84" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">방화벽 · 02:45</text><text x="480" y="192" text-anchor="middle" font-size="15" fill="#e6e8ec">서버 22번 접속 거부 반복</text><rect x="640" y="130" width="260" height="84" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="770" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">IPS · 02:49</text><text x="770" y="192" text-anchor="middle" font-size="15" fill="#e6e8ec">관리 화면 공격 패턴 경보</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="190" y1="214" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="480" y1="214" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="770" y1="214" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><rect x="415.0" y="307.0" width="130" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="342.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">SIEM</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="406.0" y="298.0" width="148" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="108" y="320" width="184" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="200" y="340.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">시각을 맞춰 시간순으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="104.0" y="315.5" width="192" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="395" width="440" height="46" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="424.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">8분 안에 같은 출발지 3건 → 한 사건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="256" y="391" width="448" height="54" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="708" y="320" width="184" height="31" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="340.4" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">회의실 포트까지 역추적</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="684" y="320" width="233" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="800" y="340.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">시계가 틀리면 순서가 뒤집혀요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="679.5" y="315.5" width="241" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 장비에 로그가 따로 남아 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SIEM이 로그를 모아 시간순으로 엮어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 출발지의 세 기록이 한 사건이 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 시각이 맞아야 순서가 맞아요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>