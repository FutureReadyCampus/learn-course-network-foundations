<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>세 기록장을 한 책상에서 이으면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">세 기록장을 한 책상에서 이으면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">상관 분석은 시간순으로 이어 붙이는 일이라 시계가 맞아야 해요</text>
<rect x="84" y="131" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="149" x2="124" y2="149" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="163" x2="124" y2="163" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="177" x2="124" y2="177" stroke="#6ea8fe" stroke-width="3"/><text x="110" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">NAC 명부 02:41</text><rect x="84" y="256" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="274" x2="124" y2="274" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="288" x2="124" y2="288" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="302" x2="124" y2="302" stroke="#6ea8fe" stroke-width="3"/><text x="110" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽 일지 02:45</text><rect x="84" y="381" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="399" x2="124" y2="399" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="413" x2="124" y2="413" stroke="#6ea8fe" stroke-width="3"/><line x1="96" y1="427" x2="124" y2="427" stroke="#6ea8fe" stroke-width="3"/><text x="110" y="471" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">IPS 일지 02:49</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="425.0" y="258.0" width="130" height="64" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="490" y="296.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">SIEM</text><line x1="150" y1="165" x2="425" y2="290" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><line x1="150" y1="290" x2="425" y2="290" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><line x1="150" y1="415" x2="425" y2="290" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="421" y="254" width="138" height="72" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="708" y="174" width="205" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="810" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">같은 주소를 시간순으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="690" y="225" width="240" height="130" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="810" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">한 사건</text><text x="810" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">02:41~02:49, 8분</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="686" y="221" width="248" height="138" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="422" y="423" width="277" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="560" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">방화벽 시계 10분 빠름: 02:55</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="417.5" y="419.0" width="285" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="905" cy="245" r="16" fill="#ff7b72"/><path d="M898 238 l14 14 M912 238 l-14 14" stroke="#0f1115" stroke-width="4"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기록장 세 권이 따로 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">총괄 담당 SIEM이 한 책상에 모아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 주소의 줄을 시간순으로 이어 한 사건으로 읽어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">시계가 어긋나면 순서가 뒤집혀 사건이 틀어져요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>