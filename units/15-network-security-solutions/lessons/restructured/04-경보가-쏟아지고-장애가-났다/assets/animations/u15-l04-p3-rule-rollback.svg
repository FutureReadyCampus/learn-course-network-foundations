<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>규칙 하나 바꿨는데 장애가</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">규칙 하나 바꿨는데 장애가</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">장치 위치로 의심 대상을 줄여요</text>
<rect x="36" y="286" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="44" y="293" width="52" height="30" fill="#3d4b60"/><polygon points="26,332 114,332 122,344 18,344" fill="#6ea8fe"/><text x="70" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><line x1="125" y1="320" x2="175" y2="320" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="178" y="286" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="178" y1="309" x2="262" y2="309" stroke="#ffb454" stroke-width="2"/><line x1="178" y1="332" x2="262" y2="332" stroke="#ffb454" stroke-width="2"/><line x1="206" y1="286" x2="206" y2="309" stroke="#ffb454" stroke-width="2"/><line x1="234" y1="309" x2="234" y2="332" stroke="#ffb454" stroke-width="2"/><line x1="206" y1="332" x2="206" y2="354" stroke="#ffb454" stroke-width="2"/><text x="220" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽</text><line x1="262" y1="320" x2="330" y2="320" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="332.0" y="292.0" width="96" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="380" y="327.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">IPS</text><line x1="428" y1="320" x2="520" y2="320" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="521" y="280" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="531" y="290" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="531" y="314" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="531" y="338" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="555" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">예약·문의 사이트</text><text x="555" y="400" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.20.11–.13</text><ellipse cx="380" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="380" cy="190" r="7" fill="#ffb454"/><text x="380" y="232" text-anchor="middle" font-size="16" fill="#9aa3b2">NIDS</text><line x1="380" y1="244" x2="380" y2="290" stroke="#c792ea" stroke-width="2" stroke-dasharray="6 5"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="474" cy="320" r="16" fill="#ff7b72"/><path d="M467 313 l14 14 M481 313 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="249" y="413" width="162" height="34" rx="17" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="330" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">첨부 업로드 실패</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="640" y="140" width="290" height="104" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="785" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">변경 기록 한 줄</text><text x="785" y="197" text-anchor="middle" font-size="16" fill="#e6e8ec">누가·언제·IPS 규칙 갱신</text><text x="785" y="222" text-anchor="middle" font-size="16" fill="#9aa3b2">→ 최근 바뀐 것부터 확인</text><line x1="640" y1="236" x2="428" y2="296" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="636" y="136" width="298" height="112" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="48" y="174" width="245" height="32" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="170" y="195.76" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">경로 밖: 복사본만 봐서 후순위</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="43.5" y="170.0" width="253" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="474" cy="320" r="16" fill="#7ee7c7"/><path d="M466 320 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="321.0" y="278.0" width="118" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="252" y="413" width="256" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="380" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">규칙을 되돌리니 업로드 성공</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="248.0" y="409.0" width="264" height="42" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 갱신 뒤 큰 첨부 파일 업로드가 실패해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">변경 기록에서 최근 바뀐 것을 짚어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경로 밖 NIDS는 끊기 어려워 후순위예요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">IPS 규칙을 되돌리면 업로드가 돼요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>