<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>규칙 하나 바꿨는데 장애가</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">규칙 하나 바꿨는데 장애가</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">장치 위치로 의심 대상을 줄여요</text>
<rect x="46" y="276" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="54" y="283" width="52" height="30" fill="#3d4b60"/><polygon points="36,322 124,322 132,334 28,334" fill="#6ea8fe"/><text x="80" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><line x1="135" y1="310" x2="210" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="208" y="276" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="208" y1="299" x2="292" y2="299" stroke="#ffb454" stroke-width="2"/><line x1="208" y1="322" x2="292" y2="322" stroke="#ffb454" stroke-width="2"/><line x1="236" y1="276" x2="236" y2="299" stroke="#ffb454" stroke-width="2"/><line x1="264" y1="299" x2="264" y2="322" stroke="#ffb454" stroke-width="2"/><line x1="236" y1="322" x2="236" y2="344" stroke="#ffb454" stroke-width="2"/><text x="250" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽</text><line x1="295" y1="310" x2="385" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="385.0" y="282.0" width="90" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="430" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">IPS</text><line x1="475" y1="310" x2="590" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="606" y="270" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="616" y="280" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="616" y="304" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="616" y="328" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="640" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">한결봇</text><text x="640" y="390" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.20.11–.13</text><ellipse cx=