<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>이제 안전하다고 답할 수 있을까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">이제 안전하다고 답할 수 있을까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">서 이사가 첫날의 질문을 다시 물어요</text>
<rect x="0" y="410" width="960" height="68" fill="#141922"/><line x1="0" y1="410" x2="960" y2="410" stroke="#1d2431" stroke-width="2"/><rect x="690" y="130" width="200" height="170" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="790" y1="130" x2="790" y2="300" stroke="#3d4b60" stroke-width="3"/><line x1="690" y1="215" x2="890" y2="215" stroke="#3d4b60" stroke-width="3"/><rect x="70" y="150" width="120" height="80" fill="#12151c" stroke="#1d2431" stroke-width="2"/><line x1="90" y1="180" x2="170" y2="180" stroke="#3d4b60" stroke-width="3"/><line x1="90" y1="200" x2="150" y2="200" stroke="#3d4b60" stroke-width="3"/><g><g transform="translate(150,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#c792ea"/><polygon points="-12,30 12,30 0,50" fill="#e6e8ec"/><polygon points="-3,46 3,46 5,70 0,76 -5,70" fill="#0f1115" fill-opacity="0.75"/><circle r="24" fill="#c792ea"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="150" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">서 이사</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g transform="translate(810,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="810" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(810,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="810" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><polygon points="205.48000000000002,187.0 225.48000000000002,187.0 160,203" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-linejoin="round"/><rect x="191.48000000000002" y="113.0" width="257.03999999999996" height="74" rx="16" fill="#171a21" stroke="#c792ea" stroke-width="3"/><line x1="207" y1="187" x2="223" y2="187" stroke="#171a21" stroke-width="5"/><text x="320" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">우리 회사, 이제 안전하다고</text><text x="320" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">답할 수 있어요?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="186.48000000000002" y="108.0" width="267.03999999999996" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="452" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="492,249 508,265 492,265" fill="#6ea8fe"/><rect x="462" y="279" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="292" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="305" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="480" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">네 질문 표</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><polygon points="727.39,187.0 747.39,187.0 800,203" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-linejoin="round"/><rect x="498.61" y="113.0" width="262.78" height="74" rx="16" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="729" y1="187" x2="745" y2="187" stroke="#171a21" stroke-width="5"/><text x="630" y="143.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">안전하다는 말은 못 드려요.</text><text x="630" y="169.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">어디가 비었는지는 말씀드려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="486.94" y="108.0" width="286.12" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="356" y="419" width="248" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">무엇을 근거로 답할까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">점검 보고를 마친 지우 앞에 서 이사가 서 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">서 이사가 첫날의 질문을 다시 꺼내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 "네"도 "아니요"도 하지 않아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 답할 수 있는 칸을 알아봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>