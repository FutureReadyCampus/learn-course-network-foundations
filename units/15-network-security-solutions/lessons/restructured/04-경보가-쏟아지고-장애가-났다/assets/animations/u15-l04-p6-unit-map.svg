<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>장치 지도로 점검을 되짚기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">장치 지도로 점검을 되짚기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">이름이 아니라 위치와 역할로 읽어요</text>
<ellipse cx="70" cy="305" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="70" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">인터넷</text><line x1="138" y1="305" x2="207" y2="305" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g><rect x="110" y="130" width="240" height="90" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="230.0" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사내 LAN · NAC ①</text><text x="230" y="200" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.10.0/24</text><line x1="230" y1="220" x2="230" y2="268" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="208" y="271" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="208" y1="294" x2="292" y2="294" stroke="#ffb454" stroke-width="2"/><line x1="208" y1="317" x2="292" y2="317" stroke="#ffb454" stroke-width="2"/><line x1="236" y1="271" x2="236" y2="294" stroke="#ffb454" stroke-width="2"/><line x1="264" y1="294" x2="264" y2="317" stroke="#ffb454" stroke-width="2"/><line x1="236" y1="317" x2="236" y2="339" stroke="#ffb454" stroke-width="2"/><text x="250" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽 ②</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="440" y="150" width="470" height="270" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 6"/><text x="675.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">서버 구역 192.168.40.0/24</text><line x1="292" y1="305" x2="500" y2="305" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="492.0" y="277.0" width="96" height="56" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="540" y="311.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">IPS ③</text><line x1="588" y1="305" x2="750" y2="305" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="766" y="265" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="776" y="275" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="299" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="323" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="800" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="800" y="385" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.40.50:8080</text><ellipse cx="390" cy="190" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="390" cy="190" r="7" fill="#ffb454"/><text x="390" y="224" text-anchor="middle" font-size="15" fill="#9aa3b2">NIDS ③</text><line x1="390" y1="236" x2="390" y2="298" stroke="#c792ea" stroke-width="2" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="436" y="146" width="478" height="278" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="95.0" y="418.0" width="110" height="44" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="150" y="446.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">SIEM ④</text><line x1="150" y1="418" x2="150" y2="232" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="190" y1="418" x2="235" y2="341" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="205" y1="440" x2="540" y2="440" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="540" y1="440" x2="540" y2="335" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="81.0" y="406.0" width="138" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="536" y="110" width="307" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="690" y="130.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">'다 막았다'가 아니라 '네 가지 점검'으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="532.5" y="105.5" width="315" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">① NAC와 ② 방화벽이 바깥과 사내 사이를 지켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">③ IPS·NIDS가 서버 구역의 내용을 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">④ SIEM이 모든 장치의 로그를 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안전하다는 말 대신 네 가지 점검으로 답해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>