<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>흩어진 로그를 이으면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">흩어진 로그를 이으면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">NAC·방화벽·IPS 기록을 한 줄로</text>
<g><rect x="40" y="124" width="280" height="112" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="180" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">NAC · 02:41</text><text x="180" y="188" text-anchor="middle" font-size="16" fill="#e6e8ec">회의실 포트에 미등록 기기 접속</text><text x="180" y="214" text-anchor="middle" font-size="16" fill="#e6e8ec">DHCP가 192.168.10.77 부여</text><rect x="340" y="124" width="280" height="112" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">방화벽 · 02:45</text><text x="480" y="188" text-anchor="middle" font-size="16" fill="#e6e8ec">192.168.10.77 → AI 서버 22번</text><text x="480" y="214" text-anchor="middle" font-size="16" fill="#e6e8ec">접속 거부 반복</text><rect x="640" y="124" width="280" height="112" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="780" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">IPS · 02:49</text><text x="780" y="188" text-anchor="middle" font-size="16" fill="#e6e8ec">192.168.10.77에서 온</text><text x="780" y="214" text-anchor="middle" font-size="16" fill="#e6e8ec">관리 화면 공격 패턴 경보</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="180" y1="236" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="480" y1="236" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><line x1="780" y1="236" x2="480" y2="307" stroke="#7ee7c7" stroke-width="2" stroke-dasharray="6 5"/><rect x="405.0" y="307.0" width="150" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="342.92" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">SIEM</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="396.0" y="298.0" width="168" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="93" y="319" width="194" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="190" y="340.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">시각을 맞춰 시간순으로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="89.0" y="315.0" width="202" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="190" y="392" width="580" height="50" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480.0" y="423.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">같은 출발지 192.168.10.77 · 8분 안에 3건 → 한 사건</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="186" y="388" width="588" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="703" y="319" width="194" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="800" y="340.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">회의실 포트까지 역추적</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="667" y="319" width="246" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="790" y="340.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">시계가 틀리면 순서가 뒤집혀요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="663.0" y="315.0" width="254" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">세 장비에 로그가 따로 남아 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">SIEM이 로그를 모아 시간순으로 엮어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">같은 출발지의 세 기록이 한 사건이 돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비 시각이 맞아야 순서가 맞아요</text></g>

