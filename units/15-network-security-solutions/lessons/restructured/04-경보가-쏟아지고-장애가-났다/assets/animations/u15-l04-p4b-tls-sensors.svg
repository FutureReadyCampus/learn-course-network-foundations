xt x="590" y="254" text-anchor="middle" font-size="16" fill="#9aa3b2">WAF 뒤 센서</text><line x1="590" y1="266" x2="590" y2="324" stroke="#c792ea" stroke-width="2" stroke-dasharray="6 5"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="124" y="319" width="32" height="22" rx="4" fill="#6ea8fe"/><path d="M124 320 l16 10 l16 -10" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="120" y="366" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M129 366 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="228" y="319" width="32" height="22" rx="4" fill="#6ea8fe"/><path d="M228 320 l16 10 l16 -10" fill="none" stroke="#0f1115" stroke-width="2"/><rect x="224" y="366" width="40" height="32" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><path d="M233 366 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#9aa3b2" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="529" y="319" width="32" height="22" rx="4" fill="#ff7b72"/><path d="M529 320 l16 10 l16 -10" fill="none" stroke="#0f1115" stroke-width="2"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="423" width="260" height="34" rx="17" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="446.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 공격 문자열, 센서 두 곳</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="95" y="118" width="210" height="64" rx="10" fill="#171a21" 