<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>다섯 Unit을 한 줄로 되짚기</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">다섯 Unit을 한 줄로 되짚기</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">생각법 다섯 가지와 다음 Module</text>
<g><line x1="60" y1="184" x2="900" y2="184" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="6 5"/><rect x="24" y="124" width="168" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="108" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Unit 11</text><text x="108" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">쪼개기</text><text x="108" y="208" text-anchor="middle" font-size="16" fill="#e6e8ec">집과 회사 경로를</text><text x="108" y="230" text-anchor="middle" font-size="16" fill="#e6e8ec">나눠 규칙 찾기</text><rect x="210" y="124" width="168" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="294" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Unit 12</text><text x="294" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">같은 모양 찾기</text><text x="294" y="208" text-anchor="middle" font-size="16" fill="#e6e8ec">UPnP 매핑은</text><text x="294" y="230" text-anchor="middle" font-size="16" fill="#e6e8ec">포트 포워딩 한 줄</text><rect x="396" y="124" width="168" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="480" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Unit 13</text><text x="480" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">대가 따지기</text><text x="480" y="208" text-anchor="middle" font-size="16" fill="#e6e8ec">이중화의 비용과</text><text x="480" y="230" text-anchor="middle" font-size="16" fill="#e6e8ec">여유 견주기</text><rect x="582" y="124" width="168" height="120" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="666" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Unit 14</text><text x="666" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">순서대로 확인하기</text><text x="666" y="208" text-anchor="middle" font-size="16" fill="#e6e8ec">VPN 구간을 가까운</text><text x="666" y="230" text-anchor="middle" font-size="16" fill="#e6e8ec">곳부터 확인</text><rect x="768" y="124" width="168" height="120" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="852" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">Unit 15</text><text x="852" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">필요한 것만 남기기</text><text x="852" y="208" text-anchor="middle" font-size="16" fill="#e6e8ec">장비 열 개를</text><text x="852" y="230" text-anchor="middle" font-size="16" fill="#e6e8ec">한 장의 지도로</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="392" y="264" width="177" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="286.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">아직 손으로 하는 일</text><rect x="35" y="306" width="210" height="60" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="140" y="330" text-anchor="middle" font-size="16" fill="#e6e8ec">장부와 규칙표를</text><text x="140" y="352" text-anchor="middle" font-size="16" fill="#e6e8ec">직접 고치기</text><rect x="265" y="306" width="210" height="60" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="370" y="330" text-anchor="middle" font-size="16" fill="#e6e8ec">아침마다 로그를</text><text x="370" y="352" text-anchor="middle" font-size="16" fill="#e6e8ec">이어 보기</text><rect x="495" y="306" width="210" height="60" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="600" y="330" text-anchor="middle" font-size="16" fill="#e6e8ec">의심 기기 포트를</text><text x="600" y="352" text-anchor="middle" font-size="16" fill="#e6e8ec">직접 내리기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="258" width="688" height="114" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="140" y1="368" x2="140" y2="386" stroke="#7ee7c7" stroke-width="4"/><polygon points="140,398 131,384 149,384" fill="#7ee7c7"/><rect x="35" y="400" width="210" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="140" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Module 3</text><text x="140" y="446" text-anchor="middle" font-size="16" fill="#e6e8ec">접근통제 자동화</text><line x1="370" y1="368" x2="370" y2="386" stroke="#7ee7c7" stroke-width="4"/><polygon points="370,398 361,384 379,384" fill="#7ee7c7"/><rect x="265" y="400" width="210" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="370" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Module 4</text><text x="370" y="446" text-anchor="middle" font-size="16" fill="#e6e8ec">이상탐지 자동화</text><line x1="600" y1="368" x2="600" y2="386" stroke="#7ee7c7" stroke-width="4"/><polygon points="600,398 591,384 609,384" fill="#7ee7c7"/><rect x="495" y="400" width="210" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="600" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">Module 5</text><text x="600" y="446" text-anchor="middle" font-size="16" fill="#e6e8ec">자동대응</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="26" y="368" width="688" height="96" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="735" y="306" width="190" height="150" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/><circle cx="830" cy="320" r="16" fill="#6ea8fe"/><rect x="812" y="340" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="830" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">정책과 승인 범위는</text><text x="830" y="442" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">계속 사람이 정해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="731" y="302" width="198" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">다섯 Unit에서 쓴 생각법을 되짚어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">아직 손으로 하는 일이 남아 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Module 3·4·5가 이 일들을 자동화로 이어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">정책과 승인 범위는 계속 사람이 정해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>