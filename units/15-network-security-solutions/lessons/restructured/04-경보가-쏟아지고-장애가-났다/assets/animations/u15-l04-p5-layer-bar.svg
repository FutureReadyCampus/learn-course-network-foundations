<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>장치마다 보는 층</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">장치마다 보는 층</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">요청의 정보가 어느 층에 있나</text>
<text x="144" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee7c7">L2</text><rect x="40" y="168" width="208" height="62" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="144.0" y="205.48" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">MAC 주소</text><line x1="144" y1="230" x2="144" y2="292" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="6 5"/><rect x="40" y="296" width="208" height="66" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="144" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">NAC·스위치</text><text x="368" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">L3</text><rect x="264" y="168" width="208" height="62" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="368.0" y="205.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">IP 주소</text><line x1="368" y1="230" x2="368" y2="292" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="6 5"/><rect x="264" y="296" width="208" height="66" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="368" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">라우터·패킷 필터</text><text x="592" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#6ea8fe">L4</text><rect x="488" y="168" width="208" height="62" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="592.0" y="205.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">포트·TCP 상태</text><line x1="592" y1="230" x2="592" y2="292" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="6 5"/><rect x="488" y="296" width="208" height="66" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="592" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">NAT·상태 추적</text><text x="592" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">방화벽</text><text x="816" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#c792ea">소켓 위</text><rect x="712" y="168" width="208" height="62" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="816.0" y="205.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">URL·헤더·내용</text><line x1="816" y1="230" x2="816" y2="292" stroke="#c792ea" stroke-width="3" stroke-dasharray="6 5"/><rect x="712" y="296" width="208" height="66" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="816" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">WAF·Proxy형</text><text x="816" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#c792ea">방화벽</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="32" y="130" width="224" height="240" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="393" width="177" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="144" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">MAC을 막아 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="704" y="130" width="224" height="240" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="728" y="393" width="177" height="34" rx="17" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="816" y="416.48" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">URL을 막아 주세요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><line x1="70" y1="404" x2="880" y2="404" stroke="#3d4b60" stroke-width="4"/><polygon points="900,404 876,392 876,416" fill="#3d4b60"/><text x="70" y="440" text-anchor="start" font-size="18" font-weight="700" fill="#7ee7c7">빠르지만 내용을 몰라요</text><text x="890" y="440" text-anchor="end" font-size="18" font-weight="700" fill="#c792ea">깊게 보지만 느려요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="388" width="848" height="70" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장치마다 보는 식별자가 층별로 달라요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">MAC을 막아 달라는 요청은 L2 장치 몫이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">URL을 막아 달라는 요청은 소켓 위 장치 몫이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">위층일수록 깊게 보지만 느려요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>