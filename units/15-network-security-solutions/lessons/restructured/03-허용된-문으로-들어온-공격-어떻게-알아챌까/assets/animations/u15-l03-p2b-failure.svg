y" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="576.0" y="278.0" width="248" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="324" y="436" width="312" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">고장 났을 때 통과·차단 설정을 확인해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="320.0" y="432.0" width="320" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
