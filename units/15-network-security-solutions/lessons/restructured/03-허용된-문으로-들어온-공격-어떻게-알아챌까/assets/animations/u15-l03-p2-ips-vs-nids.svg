<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>막을까, 알리기만 할까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">막을까, 알리기만 할까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">IPS는 Inline, NIDS는 Out of path</text>
<g><rect x="176" y="134" width="129" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="240" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">IPS: 경로 안</text></g><g><rect x="650" y="134" width="139" height="33" rx="16" fill="#0f1115" stroke="#c792ea" stroke-width="2"/><text x="720" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">NIDS: 경로 밖</text></g><line x1="480" y1="130" x2="480" y2="440" stroke="#3d4b60" stroke-width="2" stroke-dasharray="5 5"/><rect x="30.0" y="284.0" width="100" height="52" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="80" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">인터넷</text><line x1="130" y1="310" x2="195" y2="310" stroke="#3d4b60" stroke-width="3"/><rect x="195.0" y="282.0" width="90" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="240" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">IPS</text><line x1="285" y1="310" x2="340" y2="310" stroke="#3d4b60" stroke-width="3"/><rect x="346" y="270" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="356" y="280" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="356" y="304" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="356" y="328" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="380" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">서버 구역</text><rect x="500.0" y="284.0" width="100" height="52" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="550" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">인터넷</text><line x1="600" y1="310" x2="648" y2="310" stroke="#3d4b60" stroke-width="3"/><rect x="648" y="294" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="660" y="305" wi