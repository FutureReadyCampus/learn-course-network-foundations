<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>봉투는 어디서 뜯길까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">봉투는 어디서 뜯길까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">센서가 내용을 보려면 봉투가 뜯긴 뒤여야 해요</text>
<text x="110" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">바깥에서 온 편지</text><line x1="150" y1="330" x2="400" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="415.0" y="298.0" width="110" height="64" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="470" y="336.48" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">접수실</text><line x1="525" y1="330" x2="800" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="790.0" y="302.0" width="120" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="850" y="335.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">받는 사람</text><rect x="230.0" y="144.0" width="140" height="52" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="300" y="175.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">복도 검사원</text><rect x="580.0" y="144.0" width="140" height="52" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="650" y="175.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">안쪽 검사원</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="110,270;110,270;260,270;380,270;380,270" keyTimes="0.000;0.013;0.125;0.237;1.000" dur="16s" repeatCount="indefinite"/><rect x="-34" y="-24" width="68" height="48" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><path d="M-34 -24 L0 4 L34 -24" fill="none" stroke="#6ea8fe" stroke-width="3"/></g></g></g><g><text x="250" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">봉인된 봉투(TLS 암호문)</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="91" y="426" width="318" height="36" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><ellipse cx="300" cy="232" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="300" cy="232" r="7" fill="#ffb454"/><line x1="300" y1="196" x2="300" y2="250" stroke="#ffb454" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="221.0" y="136.0" width="158" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="236" y="259" width="127" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="300" y="280.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">겉면만 보여요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="444" y="186" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="456" y1="204" x2="484" y2="204" stroke="#6ea8fe" stroke-width="3"/><line x1="456" y1="218" x2="484" y2="218" stroke="#6ea8fe" stroke-width="3"/><line x1="456" y1="232" x2="484" y2="232" stroke="#6ea8fe" stroke-width="3"/><line x1="470" y1="260" x2="470" y2="292" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="406.0" y="289.0" width="128" height="82" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="364" y="414" width="211" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="470" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">봉투를 뜯어요(TLS 종료)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><ellipse cx="650" cy="232" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="650" cy="232" r="7" fill="#ffb454"/><line x1="650" y1="196" x2="650" y2="250" stroke="#ffb454" stroke-width="2"/><rect x="624" y="261" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="636" y1="279" x2="664" y2="279" stroke="#6ea8fe" stroke-width="3"/><line x1="636" y1="293" x2="664" y2="293" stroke="#6ea8fe" stroke-width="3"/><line x1="636" y1="307" x2="664" y2="307" stroke="#6ea8fe" stroke-width="3"/><circle cx="700" cy="232" r="16" fill="#7ee7c7"/><path d="M692 232 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="571.0" y="136.0" width="158" height="68" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="550" y="414" width="199" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="650" y="435.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">편지 속 문구까지 읽어요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">바깥 편지는 봉인된 봉투로 와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">복도 검사원은 봉투 겉만 봐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접수실이 봉투를 뜯어 편지를 꺼내요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">안쪽 검사원은 편지 내용을 읽어요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>