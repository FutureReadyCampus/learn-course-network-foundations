xt-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(200,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="200" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g><rect x="452" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="492,249 508,265 492,265" fill="#ff7b72"/><rect x="462" y="279" width="36" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="462" y="292" width="28" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="462" y="305" width="20" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><text x="480" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">알려진 공격 요청</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="592" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="632,249 648,265 632,265" fill="#ff7b72"/><rect x="602" y="279" width="36" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="602" y="292" width="28" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="602" y="305" width="20" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="732" y="249" width="56" height="72" rx="4" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><polygon points="772,249 788,265 772,265" fill="#ff7b72"/><rect x="742" y="279" width="36" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="742" y="292" width="28" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><rect x="742" y="305" width="20" height="5" rx="2" fill="#ff7b72" fill-opacity="0.6"/><text x="690" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">비슷한 문자열이 반복</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="231" width="228" height="108" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="415" y="111" width="210" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="399" cy="192" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="330" cy="196" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="261" cy="200" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="520" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사건 현장에서 지문을</text><text x="520" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">대조하는 수사관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="412.22" y="108.0" width="215.56" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="320" y="419" width="320" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">공격의 지문은 어떻게 찾을까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 알려진 공격 요청을 떠올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">알려진 공격 요청에는 비슷한 문자열이 반복돼요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비가 어떻게 알아볼지 지우는 수사관을 떠올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 공격의 지문을 찾아봐요</text></g>

