<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>정상 요청이 공격으로</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">정상 요청이 공격으로</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">오탐을 줄이는 방법</text>
<circle cx="80" cy="270" r="16" fill="#6ea8fe"/><rect x="62" y="290" width="36" height="46" rx="12" fill="#6ea8fe"/><text x="80" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장</text><line x1="130" y1="300" x2="360" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="375.0" y="272.0" width="90" height="56" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="420" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">IPS</text><line x1="465" y1="300" x2="760" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="776" y="260" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="786" y="270" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="786" y="294" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="786" y="318" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="810" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="810" y="380" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.40.50:8080</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="140,300;140,300;360,300;360,300" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-26" y="-34" width="52" height="68" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="-16" x2="14" y2="-16" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="-2" x2="14" y2="-2" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="12" x2="14" y2="12" stroke="#ffb454" stroke-width="3"/></g></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="199" width="147" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">교육 자료 업로드</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><circle cx="420" cy="225" r="16" fill="#ff7b72"/><path d="M413 218 l14 14 M427 218 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="391.0" y="196.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="288" y="384" width="265" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="420" y="405.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">정상 요청을 공격으로 판단 = 오탐</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="470,300;470,300;760,300;760,300" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-26" y="-34" width="52" height="68" rx="5" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="-16" x2="14" y2="-16" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="-2" x2="14" y2="-2" stroke="#ffb454" stroke-width="3"/><line x1="-14" y1="12" x2="14" y2="12" stroke="#ffb454" stroke-width="3"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="810" cy="215" r="16" fill="#7ee7c7"/><path d="M802 215 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="346" y="209" width="147" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="420" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">경보만 내는 기간</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="342.5" y="205.0" width="155" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="362" y="404" width="237" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">예외는 이 계정·서버만 좁게</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="357.5" y="399.5" width="245" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 교육 자료를 AI에 올려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">자료 속 공격 예시 문자열에 IPS가 울려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">새 규칙은 경보만 내는 기간부터 거쳐요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">예외는 좁게 두고 목록을 다시 확인해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>