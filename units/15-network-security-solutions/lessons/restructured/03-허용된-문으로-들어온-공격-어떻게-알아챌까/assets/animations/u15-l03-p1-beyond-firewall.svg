x="285.5" y="355.0" width="189" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="570" y="268" width="38" height="44" rx="4" fill="#6ea8fe"/><rect x="608" y="268" width="62" height="44" rx="4" fill="#ff7b72"/><text x="589" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1115">헤더</text><text x="639" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1115">내용</text><rect x="505" y="209" width="230" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="620" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">내용 속 공격이 그대로 도착</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="501" y="205" width="238" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="60" y="400" width="400" height="52" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="260.0" y="432.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">방화벽: 헤더를 보고 허용을 정해요</text><rect x="500" y="400" width="400" height="52" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="700.0" y="432.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">IPS·NIDS: 내용을 보고 공격을 찾아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="56" y="396" width="848" height="60" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">허용된 443 요청이 방화벽 앞에 도착해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽은 헤더만 보고 그대로 통과시켜요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">공격은 헤더가 아니라 Payload 안에 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 보는 장치가 따로 필요해요</text></g>

