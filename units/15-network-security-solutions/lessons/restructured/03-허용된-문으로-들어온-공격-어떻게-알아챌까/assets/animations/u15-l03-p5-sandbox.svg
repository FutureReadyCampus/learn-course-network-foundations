<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>처음 보는 악성 파일</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">처음 보는 악성 파일</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">격리된 곳에서 먼저 실행해 봐요</text>
<rect x="64" y="266" width="52" height="68" rx="5" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><line x1="76" y1="284" x2="104" y2="284" stroke="#9aa3b2" stroke-width="3"/><line x1="76" y1="298" x2="104" y2="298" stroke="#9aa3b2" stroke-width="3"/><line x1="76" y1="312" x2="104" y2="312" stroke="#9aa3b2" stroke-width="3"/><text x="90" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">첨부 파일</text><line x1="135" y1="300" x2="275" y2="300" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="275.0" y="270.0" width="110" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="330" y="306.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">보안 장비</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="148" y="210" width="184" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="240" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">시그니처에 걸리지 않음</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="144.0" y="205.5" width="192" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="520" y="150" width="250" height="240" rx="14" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="645.0" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">샌드박스(유리 방)</text><rect x="619" y="256" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="631" y1="274" x2="659" y2="274" stroke="#6ea8fe" stroke-width="3"/><line x1="631" y1="288" x2="659" y2="288" stroke="#6ea8fe" stroke-width="3"/><line x1="631" y1="302" x2="659" y2="302" stroke="#6ea8fe" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="516" y="146" width="258" height="248" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="390,300;390,300;500,290;500,290" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="252" y="370" width="155" height="31" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="330" y="390.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">결과까지 전달 보류</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="248.5" y="365.5" width="163" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="700" y1="290" x2="840" y2="290" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5"/><ellipse cx="880" cy="290" rx="55" ry="40" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="880" y="297" text-anchor="middle" font-size="18" font-weight="700" fill="#ff7b72">낯선 주소</text><circle cx="520" cy="150" r="16" fill="#ff7b72"/><path d="M513 143 l14 14 M527 143 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="816.0" y="241.0" width="128" height="98" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="548" y="409" width="193" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="645" y="430.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">이상 행동 → 차단·경보</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="544.5" y="405.0" width="201" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="339" y="424" width="282" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">시간이 걸리고 얌전한 파일은 놓쳐요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="335.0" y="420.0" width="290" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">처음 나온 첨부 파일은 대조할 지문이 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">장비가 복사본을 샌드박스로 보내고 전달을 보류해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">격리된 방에서 낯선 주소로 접속하려 해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">분석이 느리고 얌전한 파일은 놓칠 수 있어요</text></g>

