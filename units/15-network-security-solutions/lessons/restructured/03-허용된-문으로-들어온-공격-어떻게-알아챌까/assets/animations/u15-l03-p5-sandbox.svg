></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="206.5" y="390.0" width="187" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="410" y="130" width="230" height="135" rx="14" fill="#171a21" stroke="#c792ea" stroke-width="3" stroke-dasharray="8 6"/><text x="525.0" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">샌드박스(유리 방)</text><rect x="499" y="188" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="511" y1="206" x2="539" y2="206" stroke="#6ea8fe" stroke-width="3"/><line x1="511" y1="220" x2="539" y2="220" stroke="#6ea8fe" stroke-width="3"/><line x1="511" y1="234" x2="539" y2="234" stroke="#6ea8fe" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="406.0" y="125.5" width="238" height="143" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="300,294;300,294;300,215;440,215;440,215" keyTimes="0.000;0.275;0.369;0.463;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="506" y="3