<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>남들이 이미 아는 악성일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">남들이 이미 아는 악성일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">평판은 외부 정보를 빌려요</text>
<rect x="64" y="196" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="214" x2="104" y2="214" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="228" x2="104" y2="228" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="242" x2="104" y2="242" stroke="#6ea8fe" stroke-width="3"/><text x="90" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">파일 요약값</text><ellipse cx="430" cy="300" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="430" y="307" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">평판 정보</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="135,235;135,235;365,290;365,290" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="182" y="150" width="135" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="170.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">알려졌는지 조회</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="178.5" y="145.5" width="143" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><line x1="490" y1="280" x2="690" y2="205" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5"/><rect x="710" y="189" width="180" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="800" y="210.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">알려진 악성 → 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="706" y="184" width="188" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="490" y1="320" x2="690" y2="385" stroke="#c792ea" stroke-width="3" stroke-dasharray="7 5"/><rect x="700" y="360" width="200" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="800.0" y="394.48" text-anchor="middle" font-size="18" font-weight="700" fill="#c792ea">샌드박스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="696" y="356" width="208" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="530" y="305" width="101" height="30" rx="15" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="580" y="325.04" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa3b2">모르는 파일</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><ellipse cx="90" cy="390" rx="68" ry="40" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="90" y="397" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">접속 주소</text><line x1="160" y1="380" x2="360" y2="320" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="7 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="207" y="424" width="246" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="330" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">주소엔 샌드박스를 쓰지 않아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="203.0" y="420.0" width="254" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">파일 요약값이 이미 알려졌는지 조회해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">알려진 악성이면 바로 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모르는 파일은 샌드박스로 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접속 주소는 주소 평판과 다른 신호로 봐요</text></g>

