<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>남들이 이미 아는 악성일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">남들이 이미 아는 악성일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">평판은 외부 정보를 빌려요</text>
<rect x="64" y="156" width="52" height="68" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="174" x2="104" y2="174" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="188" x2="104" y2="188" stroke="#6ea8fe" stroke-width="3"/><line x1="76" y1="202" x2="104" y2="202" stroke="#6ea8fe" stroke-width="3"/><text x="90" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">파일 요약값</text><ellipse cx="400" cy="285" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="400" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">평판 정보</text><line x1="140" y1="215" x2="335" y2="262" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,212;150,212;330,258;330,258" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="175" y="134" width="150" height="33" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="250" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#6ea8fe">알려졌는지 조회</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="171.0" y="129.5" width="158" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="465" y1="265" x2="625" y2="178" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5"/><rect x="630" y="150" width="270" height="56" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="765.0" y="184.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">알려진 악성 → 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="146" width="278" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><line x1="468" y1="285" x2="625" y2="286" stroke="#c792ea" stroke-width="3" stroke-dasharray="7 5"/><rect x="630" y="258" width="270" height="56" rx="6" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="765.0" y="292.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">모르는 파일 → 샌드박스</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="254" width="278" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><ellipse cx="90" cy="390" rx="68" ry="40" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="90" y="397" text-anchor="middle" font-size="18" font-weight="700" fill="#7ee7c7">접속 주소</text><line x1="150" y1="375" x2="340" y2="315" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="7 5"/><line x1="465" y1="310" x2="625" y2="403" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="7 5"/><rect x="630" y="375" width="270" height="56" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="765.0" y="409.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">이상 행위·로그와 함께</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="626" y="371" width="278" height="64" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="295" y="434" width="210" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="400" y="455.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">샌드박스는 파일에만 써요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="291.0" y="430.0" width="218" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">파일 요약값이 이미 알려졌는지 조회해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">알려진 악성이면 바로 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">모르는 파일은 샌드박스로 넘겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">접속 주소는 평판을 보고, 모르면 다른 신호도 봐요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>