<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>서버인 척하면 신분증에서 걸려요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">서버인 척하면 신분증에서 걸려요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">https는 진짜 서버의 인증서(신분증)를 확인해요</text>
<rect x="76" y="346" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="353" width="52" height="30" fill="#3d4b60"/><polygon points="66,392 154,392 162,404 58,404" fill="#6ea8fe"/><text x="110" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 브라우저</text><line x1="170" y1="380" x2="765" y2="380" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="796" y="340" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="350" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="374" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="398" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="442" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">https 사내 위키</text><ellipse cx="230" cy="200" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="230" cy="200" r="7" fill="#ffb454"/><text x="230" y="238" text-anchor="middle" font-size="16" fill="#9aa3b2">Probe</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,380;150,380;700,380;700,380" keyTimes="0.000;0.025;0.225;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="304" width="200" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="480" y="325.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">https로 사내 위키 열기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="340" y="150" width="290" height="110" rx="12" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="485" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">직접 만든 신분증</text><text x="485" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">도장: 처음 보는 기관</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="336" y="146" width="298" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="398" y="284" width="163" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="305.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">서버인 척 응답해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="375" y="294" width="210" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="316.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">경비실 명단에 없는 도장</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="371.0" y="289.5" width="218" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="655" cy="205" r="16" fill="#ff7b72"/><path d="M648 198 l14 14 M662 198 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="626.0" y="176.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="358" y="413" width="244" height="34" rx="17" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="480" y="436.48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1115">인증서 경고 또는 연결 실패</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 https로 사내 위키를 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">끼어든 응답이 직접 만든 신분증을 내밀어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">브라우저가 명단에서 도장을 못 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경고가 뜨거나 연결이 끊겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>