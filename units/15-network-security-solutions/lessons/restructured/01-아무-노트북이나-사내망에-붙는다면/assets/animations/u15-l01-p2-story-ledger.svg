xt-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(150,225) scale(1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="150" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="452" y="214" width="56" height="72" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><polygon points="492,214 508,230 492,230" fill="#6ea8fe"/><rect x="462" y="244" width="36" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="257" width="28" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><rect x="462" y="270" width="20" height="5" rx="2" fill="#6ea8fe" fill-opacity="0.6"/><text x="480" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">엑셀 장부</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="330" y="160" width="300" height="170" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="480" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">IP·MAC 장부</text><text x="480" y="226" text-anchor="middle" font-size="16" fill="#e6e8ec">지우 PC  192.168.10.41</text><text x="480" y="260" text-anchor="middle" font-size="16" fill="#e6e8ec">박 팀장 PC  192.168.10.42</text><text x="480" y="306" text-anchor="middle" font-size="16" fill="#9aa3b2">사무실 PC 40여 대</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="318" y="148" width="324" height="194" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="776" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#e07b54" stroke-width="3"/><rect x="784" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="766,302 854,302 862,314 758,314" fill="#e07b54"/><text x="810" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">회의실 노트북</text><text x="810" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">장부에 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="736" y="201" width="148" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="299" y="419" width="363" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">회사 기기인지 무엇으로 알아볼까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우는 먼저 엑셀 장부를 만들어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사무실 PC의 IP·MAC을 한 줄씩 적어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회의실 노트북은 장부에 없어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 알아보는 기준을 찾아봐요</text></g>

