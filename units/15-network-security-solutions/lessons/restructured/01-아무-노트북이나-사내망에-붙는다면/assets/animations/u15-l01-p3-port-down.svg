<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포트를 내리면 끝일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포트를 내리면 끝일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">확실하지만 대가가 있는 차단</text>
<rect x="76" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="66,302 154,302 162,314 58,314" fill="#6ea8fe"/><text x="110" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><line x1="170" y1="290" x2="365" y2="290" stroke="#3d4b60" stroke-width="4"/><rect x="368" y="274" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="380" y="285" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="397" y="285" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="414" y="285" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="431" y="285" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="448" y="285" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="420" y="330" text-anchor="middle" font-size="17" fill="#9aa3b2">2층 스위치</text><rect x="375.0" y="150.0" width="90" height="50" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="420" y="181.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">NAC</text><line x1="420" y1="200" x2="420" y2="272" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="222" width="140" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="420" y="242.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">이 포트를 내려라</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="346.0" y="217.5" width="148" height="39" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="300" cy="290" r="16" fill="#ff7b72"/><path d="M293 283 l14 14 M307 283 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="271.0" y="261.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="88" y="174" width="144" height="31" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="160" y="195.4" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">케이블 연결 안 됨</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="76" y="374" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="381" width="52" height="32" fill="#3d4b60"/><rect x="105" y="420" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="430" width="44" height="5" fill="#6ea8fe"/><text x="110" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">정상 PC</text><line x1="170" y1="410" x2="215" y2="410" stroke="#3d4b60" stroke-width="4"/><line x1="215" y1="410" x2="215" y2="290" stroke="#3d4b60" stroke-width="4"/><circle cx="215" cy="350" r="16" fill="#ff7b72"/><path d="M208 343 l14 14 M222 343 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="502" y="394" width="256" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="630" y="415.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">같은 포트 뒤 기기도 함께 끊겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="498.0" y="390.0" width="264" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Probe가 장부에 없는 노트북을 찾았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAC가 스위치에 포트를 내리라고 지시해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">링크가 끊겨 노트북에는 이유도 안 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 포트 뒤 정상 기기까지 함께 끊겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>