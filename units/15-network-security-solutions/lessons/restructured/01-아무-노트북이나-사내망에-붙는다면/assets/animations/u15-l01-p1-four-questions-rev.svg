<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>보안 점검, 무엇부터?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">보안 점검, 무엇부터?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">회의실에서 발견한 첫 번째 구멍</text>
<rect x="86" y="296" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="94" y="303" width="52" height="30" fill="#3d4b60"/><polygon points="76,342 164,342 172,354 68,354" fill="#6ea8fe"/><text x="120" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 노트북</text><line x1="180" y1="330" x2="345" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="348" y="314" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="360" y="325" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="377" y="325" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="394" y="325" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="411" y="325" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="428" y="325" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="400" y="370" text-anchor="middle" font-size="17" fill="#9aa3b2">회의실 스위치</text><line x1="455" y1="330" x2="755" y2="330" stroke="#3d4b60" stroke-width="4" stroke-dasharray="8 6"/><rect x="766" y="290" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="776" y="300" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="324" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="776" y="348" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="800" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="800" y="410" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.10.50</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,330;150,330;285,330;285,330" keyTimes="0.000;0.275;0.475;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="160" y="239" width="199" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="260" y="260.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">확인 없이 주소를 받아요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="156.5" y="235.0" width="207" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="430,330;430,330;750,330;750,330" keyTimes="0.000;0.525;0.725;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="705" y="229" width="190" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="800" y="250.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">관리 화면까지 열려요</text><circle cx="800" cy="205" r="16" fill="#ff7b72"/><path d="M793 198 l14 14 M807 198 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="40" y="135" width="230" height="76" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="155" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">① 누가 들어오나</text><text x="155" y="197" text-anchor="middle" font-size="22" font-weight="700" fill="#ffb454">NAC</text><rect x="300" y="149" width="185" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="392" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">② 방화벽</text><rect x="500" y="149" width="185" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="592" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">③ IPS·NIDS</text><rect x="700" y="149" width="185" height="48" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="792" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">④ 로그</text><line x1="140" y1="211" x2="122" y2="286" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="131" width="238" height="84" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">회의실 랜 포트에 개인 노트북이 꽂혀 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">확인 없이 주소를 받고 사내망에 붙어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그룹웨어 서버 관리 화면까지 열리는 구멍이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">점검을 네 질문으로 쪼개고 ①부터 봐요</text></g>

