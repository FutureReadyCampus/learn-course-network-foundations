<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>포트를 내리면 끝일까?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">포트를 내리면 끝일까?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">확실하지만 대가가 있는 차단</text>
<rect x="76" y="181" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="188" width="52" height="30" fill="#3d4b60"/><polygon points="66,227 154,227 162,239 58,239" fill="#6ea8fe"/><text x="110" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">노트북</text><rect x="76" y="349" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="84" y="356" width="52" height="32" fill="#3d4b60"/><rect x="105" y="395" width="10" height="10" fill="#6ea8fe"/><rect x="88" y="405" width="44" height="5" fill="#6ea8fe"/><text x="110" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">정상 PC</text><line x1="170" y1="215" x2="230" y2="215" stroke="#3d4b60" stroke-width="4"/><line x1="170" y1="385" x2="230" y2="385" stroke="#3d4b60" stroke-width="4"/><line x1="230" y1="215" x2="230" y2="385" stroke="#3d4b60" stroke-width="4"/><line x1="230" y1="300" x2="248" y2="300" stroke="#3d4b60" stroke-width="4"/><rect x="248" y="284" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="260" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="277" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="294" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="311" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="328" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="300" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2"></text><text x="300" y="345" text-anchor="middle" font-size="16" fill="#9aa3b2">소형 스위치</text><line x1="352" y1="300" x2="568" y2="300" stroke="#3d4b60" stroke-width="4"/><rect x="568" y="284" width="104" height="32" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="580" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="597" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="614" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="631" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><rect x="648" y="295" width="11" height="10" fill="#7ee7c7" fill-opacity="0.7"/><text x="620" y="340" text-anchor="middle" font-size="17" fill="#9aa3b2">2층 스위치</text><rect x="575.0" y="135.0" width="90" height="50" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="620" y="166.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">NAC</text><line x1="620" y1="185" x2="620" y2="282" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="820" cy="160" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="820" cy="160" r="7" fill="#ffb454"/><text x="820" y="200" text-anchor="middle" font-size="16" fill="#9aa3b2">Probe</text><line x1="794" y1="160" x2="665" y2="160" stroke="#c792ea" stroke-width="2" stroke-dasharray="6 5"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="36" y="129" width="147" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="110" y="150.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">장부에 없는 기기</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="32.5" y="125.0" width="155" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="221" width="147" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="620" y="242.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">이 포트를 내려라</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="542.5" y="217.0" width="155" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><circle cx="460" cy="300" r="16" fill="#ff7b72"/><path d="M453 293 l14 14 M467 293 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="431.0" y="271.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="34" y="129" width="152" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="110" y="150.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">케이블 연결 안 됨</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="54" y="302" width="111" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="110" y="323.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">함께 끊겨요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="50.5" y="298.0" width="119" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">Probe가 장부에 없는 노트북을 찾았어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">NAC가 스위치에 포트를 내리라고 지시해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">링크가 끊겨 노트북에는 이유도 안 보여요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">한 포트 뒤 정상 기기까지 함께 끊겨요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>