.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-3" r="3" fill="#0f1115"/><circle cx="11" cy="-3" r="3" fill="#0f1115"/><path d="M-5 10 Q3 16 11 10" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/></g><text x="820" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="430" y="174" width="100" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="196.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">포트 차단</text><rect x="422" y="224" width="116" height="33" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="480" y="246.12" text-anchor="middle" font-size="17" font-weight="700" fill="#9aa3b2">안내 페이지</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="380" y="170" width="200" height="160" rx="10" fill="#171a21" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">사내망</text><rect x="446" y="228" width="68" height="44" rx="4" fill="#171a21" stroke="#e07b54" stroke-width="3"/><rect x="454" y="235" width="52" height="30" fill="#3d4b60"/><polygon points="436,274 524,274 532,286 428,286" fill="#e07b54"/><rect x="403" y="328" width="155" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="351.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">이미 들어온 기기</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><r