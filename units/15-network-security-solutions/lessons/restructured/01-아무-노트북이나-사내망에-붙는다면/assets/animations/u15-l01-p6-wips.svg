<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>몰래 켠 와이파이</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">몰래 켠 와이파이</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">NAC가 못 보는 무선 샛길</text>
<rect x="40" y="150" width="330" height="270" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 6"/><text x="205.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사내망</text><rect x="171" y="274" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="179" y="281" width="52" height="32" fill="#3d4b60"/><rect x="200" y="320" width="10" height="10" fill="#6ea8fe"/><rect x="183" y="330" width="44" height="5" fill="#6ea8fe"/><text x="205" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사내 PC</text><ellipse cx="830" cy="230" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="830" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">인터넷</text><rect x="578" y="300" width="44" height="76" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="585" y="310" width="30" height="50" rx="2" fill="#3d4b60"/><circle cx="600" cy="368" r="3" fill="#6ea8fe"/><text x="600" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">핫스팟 폰</text><line x1="655" y1="310" x2="770" y2="250" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><line x1="245" y1="300" x2="580" y2="335" stroke="#ff7b72" stroke-width="4" stroke-dasharray="8 6"/><rect x="375" y="284" width="70" height="32" rx="16" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="410" y="305.76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">샛길</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="371" y="279" width="78" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><ellipse cx="480" cy="175" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="480" cy="175" r="7" fill="#ffb454"/><text x="480" y="212" text-anchor="middle" font-size="15" fill="#9aa3b2">WIPS 센서</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="421.0" y="153.0" width="118" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="648" y="159" width="184" height="32" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="740" y="180.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">허가 목록에 없는 연결</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="350" y="438" width="260" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="461.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">경보는 사람이 확인할 후보예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="346.0" y="434.5" width="268" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사내 PC가 랜에 꽂힌 채 핫스팟도 써요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사내망과 바깥을 잇는 샛길이 생겨요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">천장 WIPS 센서가 전파로 허가 밖 연결을 찾아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">경보를 보고 사람이 확인해 막아요</text></g>

