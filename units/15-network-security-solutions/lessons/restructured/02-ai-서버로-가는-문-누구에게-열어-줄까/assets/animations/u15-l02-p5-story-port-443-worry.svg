text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><g transform="translate(810,225) scale(-1.0,1.0)"><path d="M-30 90 V52 Q-30 30 -8 30 H8 Q30 30 30 52 V90 Z" fill="#6ea8fe"/><rect x="4" y="52" width="16" height="20" rx="3" fill="#0f1115" fill-opacity="0.8"/><circle r="24" fill="#6ea8fe"/><circle cx="-7" cy="-6" r="3" fill="#0f1115"/><circle cx="11" cy="-6" r="3" fill="#0f1115"/><path d="M-3 12 H9" fill="none" stroke="#0f1115" stroke-width="2.6" stroke-linecap="round"/><circle cx="34" cy="-4" r="3.2" fill="#9aa3b2"/><circle cx="43" cy="-7" r="2.8000000000000003" fill="#9aa3b2"/><circle cx="52" cy="-10" r="2.4000000000000004" fill="#9aa3b2"/></g><text x="810" y="339.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">지우</text></g><g><rect x="205.0" y="229" width="190" height="112" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="4"/><circle cx="300" cy="267" r="16" fill="#7ee7c7"/><path d="M292 267 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4"/><text x="300" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">점검 중인 PC</text><rect x="292" y="341" width="16" height="14" fill="#3d4b60"/><rect x="264" y="355" width="72" height="7" rx="3" fill="#3d4b60"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="529" y="218" width="61" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="560" y="241.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">허용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="472" y="268" width="177" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="560" y="291.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">처음 보는 해외 주소</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="511" y="318" width="97" height="33" rx="16" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="560" y="341.12" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">포트 443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="446" y="201" width="228" height="168" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="527" y="111" width="185" height="78" rx="39" fill="#171a21" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="7 5"/><circle cx="704" cy="191" r="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="736" cy="194" r="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><circle cx="769" cy="198" r="4" fill="#171a21" stroke="#6ea8fe" stroke-width="2.5"/><text x="620" y="143.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">포트가 맞는데 왜</text><text x="620" y="169.48" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">안심할 수 없을까?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="402" text-anchor="middle" font-size="16" fill="#9aa3b2">이 Page에서 알아볼 것</text><rect x="333" y="419" width="295" height="38" rx="19" fill="#ffb454" stroke="#ffb454" stroke-width="2"/><text x="480" y="445.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">443이면 모두 웹 요청일까?</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">지우가 PC의 프로그램이 보내는 통신을 점검해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹이 아닌 통신이 443 포트로 계속 나가요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로그에는 허용, 목적지, 포트만 남아 있어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 Page에서 포트만으로 알 수 있는 것을 알아봐요</text></g>

