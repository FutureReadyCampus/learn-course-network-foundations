<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>443으로 나가는 통신</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">443으로 나가는 통신</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">처음 보는 해외 주소로 가고 있어요</text>
