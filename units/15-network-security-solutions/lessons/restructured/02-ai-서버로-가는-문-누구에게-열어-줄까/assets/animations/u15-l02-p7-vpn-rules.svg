<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>VPN으로 들어와도 규칙이 필요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">VPN으로 들어와도 규칙이 필요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">터널을 지난 통신도 같은 규칙 대상</text>
<rect x="56" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="46,312 134,312 142,324 38,324" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 집</text><line x1="150" y1="292" x2="390" y2="292" stroke="#3d4b60" stroke-width="3"/><line x1="150" y1="308" x2="390" y2="308" stroke="#3d4b60" stroke-width="3"/><g><rect x="204" y="220" width="132" height="31" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="240.4" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8fe">10.10.99.0/24</text></g><rect x="408" y="266" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="408" y1="289" x2="492" y2="289" stroke="#ffb454" stroke-width="2"/><line x1="408" y1="312" x2="492" y2="312" stroke="#ffb454" stroke-width="2"/><line x1="436" y1="266" x2="436" y2="289" stroke="#ffb454" stroke-width="2"/><line x1="464" y1="289" x2="464" y2="312" stroke="#ffb454" stroke-width="2"/><line x1="436" y1="312" x2="436" y2="334" stroke="#ffb454" stroke-width="2"/><text x="450" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽</text><rect x="796" y="160" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="170" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="194" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="218" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="830" y="280" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.40.50:8080</text><rect x="765.0" y="362.0" width="130" height="56" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="830" y="395.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">나머지 사내</text><line x1="495" y1="290" x2="790" y2="210" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><line x1="495" y1="310" x2="765" y2="385" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;450,300;520,280;780,215;780,215" keyTimes="0.000;0.258;0.336;0.414;0.492;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="119" width="188" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="140.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">10 허용: 8080 하나만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="542.0" y="115.0" width="196" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,300;150,300;450,300;520,320;700,360;700,360" keyTimes="0.000;0.507;0.586;0.664;0.742;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="450" cy="230" r="16" fill="#ff7b72"/><path d="M443 223 l14 14 M457 223 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="491" y="429" width="218" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="600" y="450.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">20 차단: 192.168.0.0/16</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="487.0" y="425.0" width="226" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="308" y="134" width="344" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="480" y="156.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">VPN은 길만 이어요, 허용은 규칙이 정해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="304.0" y="129.5" width="352" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 VPN으로 본사에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 10이 AI 서버의 8080 하나만 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나머지 사내 주소는 규칙 20이 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">VPN이어도 방화벽 규칙이 필요해요</text></g>

