<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>한 대에 다 넣으면</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">한 대에 다 넣으면</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">UTM의 편의와 대가</text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="75.0" y="223.0" width="150" height="64" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/><text x="150" y="262.2" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">방화벽</text><rect x="295.0" y="223.0" width="150" height="64" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="370" y="262.2" text-anchor="middle" font-size="20" font-weight="700" fill="#7ee7c7">VPN</text><rect x="515.0" y="223.0" width="150" height="64" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="590" y="262.2" text-anchor="middle" font-size="20" font-weight="700" fill="#c792ea">IPS</text><rect x="735.0" y="223.0" width="150" height="64" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="810" y="262.2" text-anchor="middle" font-size="20" font-weight="700" fill="#6ea8fe">웹 필터</text></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><rect x="365" y="364" width="230" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="386.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">장비 4대는 비용·관리 부담</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="260" y="190" width="440" height="150" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="4"/><text x="480" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb454">UTM 한 대</text><rect x="280" y="250" width="95" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="327.5" y="283.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">방화벽</text><rect x="385" y="250" width="95" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="432.5" y="283.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">VPN</text><rect x="490" y="250" width="95" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="537.5" y="283.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">IPS</text><rect x="595" y="250" width="95" height="56" rx="6" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="642.5" y="283.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">웹 필터</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="256" y="186" width="448" height="158" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="366" y="384" width="227" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="406.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">저렴하고 한 화면으로 관리</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="320" y="385" width="320" height="26" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/><rect x="320" y="385" width="150" height="26" rx="6" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="290" y="405" text-anchor="end" font-size="16" font-weight="700" fill="#9aa3b2">성능</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="381" width="328" height="34" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="357" y="436" width="246" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="457.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">기능을 켤수록 성능이 떨어져요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><circle cx="700" cy="190" r="16" fill="#ff7b72"/><path d="M693 183 l14 14 M707 183 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="671.0" y="161.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="364" y="404" width="232" height="33" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="480" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ff7b72">한 대가 멈추면 모두 멈춰요</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽·VPN·IPS·웹 필터를 따로 사면 부담이에요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">UTM 한 대에 기능을 합치면 값이 싸요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">기능을 켤수록 처리 성능이 떨어져요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">그 한 대가 멈추면 모든 기능이 멈춰요</text></g>

