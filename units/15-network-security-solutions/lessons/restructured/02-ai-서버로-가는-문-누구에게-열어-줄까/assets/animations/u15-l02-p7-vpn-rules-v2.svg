<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>VPN으로 들어와도 규칙이 필요</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">VPN으로 들어와도 규칙이 필요</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">터널을 지난 통신도 같은 규칙 대상</text>
<line x1="150" y1="282" x2="390" y2="282" stroke="#3d4b60" stroke-width="3"/><line x1="150" y1="298" x2="390" y2="298" stroke="#3d4b60" stroke-width="3"/><line x1="495" y1="280" x2="790" y2="200" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><line x1="495" y1="300" x2="765" y2="390" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,290;150,290;450,290;520,270;780,205;780,205" keyTimes="0.000;0.258;0.336;0.414;0.492;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#7ee7c7"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,290;150,290;404,290;404,290" keyTimes="0.000;0.507;0.742;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ff7b72"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="56" y="256" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="263" width="52" height="30" fill="#3d4b60"/><polygon points="46,302 134,302 142,314 38,314" fill="#6ea8fe"/><text x="90" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 집</text><rect x="408" y="256" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="408" y1="279" x2="492" y2="279" stroke="#ffb454" stroke-width="2"/><line x1="408" y1="302" x2="492" y2="302" stroke="#ffb454" stroke-width="2"/><line x1="436" y1="256" x2="436" y2="279" stroke="#ffb454" stroke-width="2"/><line x1="464" y1="279" x2="464" y2="302" stroke="#ffb454" stroke-width="2"/><line x1="436" y1="302" x2="436" y2="324" stroke="#ffb454" stroke-width="2"/><text x="450" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽</text><rect x="796" y="150" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="160" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="184" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="208" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="830" y="270" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.40.50:8080</text><rect x="765.0" y="367.0" width="130" height="56" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="830" y="400.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">나머지 사내</text><g><rect x="201" y="209" width="138" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="270" y="230.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">10.10.99.0/24</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="546" y="134" width="188" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">10 허용: 8080 하나만</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="542.0" y="130.0" width="196" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><circle cx="450" cy="215" r="16" fill="#ff7b72"/><path d="M443 208 l14 14 M457 208 l-14 14" stroke="#0f1115" stroke-width="4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="421.0" y="186.0" width="58" height="58" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="531" y="424" width="218" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="640" y="445.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">20 차단: 192.168.0.0/16</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="527.0" y="420.0" width="226" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="88" y="404" width="344" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="260" y="426.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">VPN은 길만 이어요, 허용은 규칙이 정해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="84.0" y="399.5" width="352" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">박 팀장이 VPN으로 본사에 접속해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">규칙 10이 그룹웨어 서버의 8080 하나만 열어요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">나머지 사내 주소는 규칙 20이 막아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">VPN이어도 방화벽 규칙이 필요해요</text></g>

<g aria-label="재생 진행 막대" data-stage-count="4"><g class="progress-segment" data-stage="1"><rect x="40" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="40" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;214;214" keyTimes="0;0.250000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="2"><rect x="262" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="262" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.250000;0.500000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="3"><rect x="484" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="484" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214;214" keyTimes="0;0.500000;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g><g class="progress-segment" data-stage="4"><rect x="706" y="532" width="214" height="6" rx="3" fill="#394554"/><rect x="706" y="532" width="0" height="6" rx="3" fill="#ff3434"><animate attributeName="width" values="0;0;214" keyTimes="0;0.750000;1" dur="16s" repeatCount="indefinite"/></rect></g></g></svg>