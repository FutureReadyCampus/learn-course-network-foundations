 y="276" width="74" height="40" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><text x="721.0" y="301.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">허용</text><rect x="110" y="322" width="58" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="139.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">30</text><rect x="174" y="322" width="184" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="266.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">모두</text><rect x="364" y="322" width="184" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="456.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">192.168.40.0/24</text><rect x="554" y="322" width="124" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="616.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">모두</text><rect x="684" y="322" width="74" height="40" rx="6" fill="#171a21" stroke="#ff7b72" stroke-width="3"/><text x="721.0" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">차단</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="106" y="226" width="656" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="789" y="234" width="142" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="860" y="255.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">포트가 달라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="106" y="272" width="656" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="789" y="280" width="142" height="32" rx="16" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/><text x="860" y="301.76" text-anchor="middle" font-size="16" font-weight="700" fill="#9aa3b2">출발지가 달라요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="106" y="318" width="656" height="48" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="789" y="326" width="142" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="860" y="347.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">맞아요: 차단</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="298" y="402" width="364" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="424.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">처음 맞는 줄에서 멈춰요. 순서가 곧 의미예요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="294.0" y="397.5" width="372" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
