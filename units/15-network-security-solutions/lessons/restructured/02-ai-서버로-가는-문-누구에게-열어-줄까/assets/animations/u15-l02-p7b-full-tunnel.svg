definite"/><g><animateTransform attributeName="transform" type="translate" values="360,308;360,308;445,310;620,390;800,405;800,405" keyTimes="0.000;0.512;0.588;0.662;0.738;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#c792ea"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><rect x="56" y="266" width="68" height="44" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="64" y="273" width="52" height="30" fill="#3d4b60"/><polygon points="46,312 134,312 142,324 38,324" fill="#6ea8fe"/><text x="90" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">박 팀장 집</text><rect x="358" y="266" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="358" y1="289" x2="442" y2="289" stroke="#ffb454" stroke-width="2"/><line x1="358" y1="312" x2="442" y2="312" stroke="#ffb454" stroke-width="2"/><line x1="386" y1="266" x2="386" y2="289" stroke="#ffb454" stroke-width="2"/><line x1="414" y1="289" x2="414" y2="312" stroke="#ffb454" stroke-width="2"/><line x1="386" y1="312" x2="386" y2="334" stroke="#ffb454" stroke-width="2"/><text x="400" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">방화벽</text><rect x="796" y="150" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="806" y="160" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="184" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="806" y="208" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="830" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">그룹웨어 서버</text><text x="830" y="270" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.40.50:8080</text><ellipse cx="850" cy="410" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="850" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">인터넷</text><g><rect x="166" y="214" width="177" height="32" rx="16" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="255" y="235.76" text-anchor="middle" font-size="16" font-weight="700" fill="#6ea8fe">전체 터널: 모든 통신</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.265;1" dur="16s" repeatCount="indefinite"/><rect x="551" y="134" width="178" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="640" y="155.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">사내 쪽: 규칙 10·20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="547.0" y="130.0" width="186" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="555.0" y="362.0" width="130" height="56" rx="8" fill="#171a21" stroke="#c792ea" stroke-width="3"/><text x="620" y="396.12" text-anchor="middle" font-size="17" font-weight="700" fill="#c792ea">인터넷 정책</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="546.0" y="353.0" width="148" height="74" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="134" y="414" width="253" height="33" rx="16" fill="#0f1115" stroke="#ffb454" stroke-width="2"/><text x="260" y="436.12" text-anchor="middle" font-size="17" font-weight="700" fill="#ffb454">표의 두 줄은 사내 쪽만 정해요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="129.5" y="409.5" width="261" height="41" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">전체 터널이면 모든 통신이 본사로 들어와요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">사내 쪽 통신은 규칙 10·20이 가려요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">인터넷 쪽 통신은 별도 인터넷 정책이 다뤄요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">이 표의 규칙은 사내 쪽만 정해요</text></g>

