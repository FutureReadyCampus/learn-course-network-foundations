<title>전체 터널이면 인터넷 쪽은?</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">전체 터널이면 인터넷 쪽은?</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">사내 쪽은 규칙 표, 인터넷 쪽은 별도 정책</text>
