.750;1" dur="16s" repeatCount="indefinite"/><rect x="656" y="121" width="278" height="343" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="442" y="144" width="147" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="515" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">방화벽 기록 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="437.5" y="140.0" width="155" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="426" y="144" width="179" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="515" y="165.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">모든 접속이 기록돼요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="421.5" y="140.0" width="187" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g>
