<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<title>443이면 모두 웹 요청일까</title>
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">443이면 모두 웹 요청일까</text>
<text x="480" y="98" text-anchor="middle" font-size="22" fill="#9aa3b2">포트 번호는 관례일 뿐이에요</text>
<rect x="66" y="284" width="68" height="46" rx="4" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><rect x="74" y="291" width="52" height="32" fill="#3d4b60"/><rect x="95" y="330" width="10" height="10" fill="#6ea8fe"/><rect x="78" y="340" width="44" height="5" fill="#6ea8fe"/><text x="100" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#e6e8ec">사내 PC</text><line x1="150" y1="320" x2="285" y2="320" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><rect x="288" y="286" width="84" height="68" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/><line x1="288" y1="309" x2="372" y2="309" stroke="#ffb454" stroke-width="2"/><line x1="288" y1="332" x2="372" y2="332" stroke="#ffb454" stroke-width="2"/><line x1="316" y1="286" x2="316" y2="309" stroke="#ffb454" stroke-width="2"/><line x1="344" y1="309" x2="344" y2="332" stroke="#ffb454" stroke-width="2"/><line x1="316" y1="332" x2="316" y2="354" stroke="#ffb454" stroke-width="2"/><text x="330" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">패킷 필터</text><line x1="375" y1="320" x2="760" y2="320" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><ellipse cx="830" cy="320" rx="68" ry="40" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="830" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">해외 주소</text><g><rect x="282" y="208" width="97" height="33" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="330" y="231.12" text-anchor="middle" font-size="17" font-weight="700" fill="#7ee7c7">443 허용</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="150,320;150,320;330,320;770,320;770,320" keyTimes="0.000;0.263;0.375;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#ffb454"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="180" y="395" width="300" height="48" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/><text x="330" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8ec">허용 · 목적지 IP · 443</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="176" y="391" width="308" height="56" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatCount="indefinite"/><rect x="566" y="404" width="168" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="650" y="425.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">웹인지 알 수 없어요</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="520" y="285" width="110" height="70" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/><text x="575" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#6ea8fe">Proxy형</text><ellipse cx="575" cy="262" rx="26" ry="15" fill="#0f1115" stroke="#ffb454" stroke-width="3"/><circle cx="575" cy="262" r="7" fill="#ffb454"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="511.0" y="246.0" width="128" height="118" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><rect x="491" y="199" width="168" height="32" rx="16" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="575" y="220.76" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee7c7">서비스·요청을 해석</text></g>
<rect x="0" y="478" width="960" height="62" fill="#171a21"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.250;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">방화벽이 443번 포트를 허용해 둬요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">웹이 아닌 통신도 443으로 통과해요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.515;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">로그에는 허용, IP, 포트만 남아요</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.765;1" dur="16s" repeatCount="indefinite"/><text x="480" y="518" text-anchor="middle" font-size="24" fill="#e6e8ec">내용을 이해해야 하면 Proxy형이 맡아요</text></g>

