250" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="316" y="325" width="68" height="80" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/><rect x="326" y="335" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="326" y="359" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><rect x="326" y="383" width="48" height="16" rx="3" fill="#7ee7c7" fill-opacity="0.45"/><text x="350" y="427" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e8ec">AI 서버</text><text x="350" y="445" text-anchor="middle" font-size="14" fill="#9aa3b2">192.168.10.50</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="120,335;120,335;200,265;230,255;260,265;340,325;340,325" keyTimes="0.000;0.263;0.319;0.375;0.431;0.487;1.000" dur="16s" repeatCount="indefinite"/><rect x="-22" y="-14" width="44" height="28" rx="5" fill="#6ea8fe"/><path d="M-22 -12 l22 14 l22 -14" fill="none" stroke="#0f1115" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.735;0.750;1" dur="16s" repeatCount="indefinite"/><rect x="576" y="164" width="147" height="32" rx="16" fill="#0f1115" stroke="#ff7b72" stroke-width="2"/><text x="650" y="185.76" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">방화벽 기록 없음</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.265;0.485;0.500;1" dur="16s" repeatCount="indefinite"/><rect x="572.5" y="160.0" width="155" height="40" rx="10" fill="none" stroke="#ffb454" stroke-width="5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.515;1" dur="16s" repeatC