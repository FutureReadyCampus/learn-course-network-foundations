<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>access_control 에서 터미널을 열어 Unit 4 파일을 확인하고 받은 파일 두 개를 옮긴다</title>
<desc>가운데는 access_control 폴더에 있어야 할 파일이고, 왼쪽의 받은 파일 두 개를 이 폴더로 끌어다 놓습니다. 오른쪽은 터미널 확인 순서로, Unit 4 파일 정상이 나오지 않으면 완성본이나 unit03_recovery 로 채웁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">시작하기 · 폴더와 확인 순서</text>
<text x="24" y="60" font-size="15" fill="#666660" text-anchor="start">pwd 결과: …/security-agent-toolkit/access_control</text>
<rect x="24" y="120" width="166" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="107" y="156.3" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">다운로드 폴더</text>
<text x="107" y="180.3" font-size="15" fill="#292929" text-anchor="middle">Unit 5 안내</text>
<text x="107" y="204.3" font-size="15" fill="#292929" text-anchor="middle">Unit 5 보고서</text>
<line x1="190" y1="175" x2="268" y2="175" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<text x="229" y="166" font-size="14" fill="#666660" text-anchor="middle">끌어다 놓기</text>
<rect x="270" y="76" width="240" height="300" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="117.8" font-size="15" fill="#292929" text-anchor="start" font-weight="700">access_control</text>
<text x="284" y="150.8" font-size="15" fill="#292929" text-anchor="start">rbac.py</text>
<text x="284" y="183.8" font-size="15" fill="#292929" text-anchor="start">exception_policy.py</text>
<text x="284" y="216.8" font-size="15" fill="#292929" text-anchor="start">config_loader.py</text>
<text x="284" y="249.8" font-size="15" fill="#292929" text-anchor="start">req_create.py</text>
<text x="284" y="282.8" font-size="15" fill="#292929" text-anchor="start">req_review.py</text>
<text x="284" y="315.8" font-size="15" fill="#292929" text-anchor="start">req_grant.py</text>
<text x="284" y="348.8" font-size="15" fill="#292929" text-anchor="start">+ 받은 파일 두 개</text>
<rect x="530" y="76" width="170" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="615" y="107.3" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">[터미널] 확인</text>
<text x="615" y="131.3" font-size="15" fill="#292929" text-anchor="middle">pwd · ls</text>
<text x="615" y="155.3" font-size="15" fill="#292929" text-anchor="middle">python -c "…"</text>
<line x1="615" y1="176" x2="615" y2="200" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="530" y="202" width="170" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="225.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마지막 줄</text>
<text x="615" y="247.8" font-size="15" fill="#292929" text-anchor="middle">Unit 4 파일 정상</text>
<line x1="615" y1="262" x2="615" y2="286" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<text x="626" y="280" font-size="14" fill="#666660" text-anchor="start">아니면</text>
<rect x="530" y="288" width="170" height="88" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="615" y="314.8" font-size="15" fill="#292929" text-anchor="middle">Unit 4 완성본</text>
<text x="615" y="336.8" font-size="15" fill="#292929" text-anchor="middle">세 파일 만들기 ·</text>
<text x="615" y="358.8" font-size="15" fill="#292929" text-anchor="middle">unit03_recovery</text>
</svg>
