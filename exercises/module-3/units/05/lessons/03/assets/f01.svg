<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>여섯 건을 접수해 처리·점검한 뒤 requests.json 에 저장하고 다시 읽어 확인한다</title>
<desc>INBOX 여섯 건을 create_request 로 접수하고, approve · reject · grant_request 로 처리합니다. count_by_status 와 check_sla_breach 로 점검한 뒤 save_requests 로 requests.json 에 저장하고, load_json 으로 다시 읽어 건수와 첫 요청서의 상태를 확인합니다.</desc>
<defs><marker id="a-f01-0503" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="18" fill="#292929" font-weight="700">요청서를 접수부터 저장까지 처리하는 순서</text>
<rect x="100" y="50" width="520" height="37" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="73" font-size="14" fill="#292929" text-anchor="middle">INBOX 여섯 건 접수 (create_request)</text>
<line x1="360" y1="87" x2="360" y2="111" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0503)"/>
<rect x="100" y="113" width="520" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="136" font-size="14" fill="#292929" text-anchor="middle">승인 · 반려 · 부여</text>
<text x="360" y="155" font-size="14" fill="#292929" text-anchor="middle">(approve / reject / grant_request)</text>
<line x1="360" y1="169" x2="360" y2="193" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0503)"/>
<rect x="100" y="195" width="520" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="218" font-size="14" fill="#292929" text-anchor="middle">점검: 상태별 건수 (count_by_status)</text>
<text x="360" y="237" font-size="14" fill="#292929" text-anchor="middle">+ SLA 초과 (check_sla_breach)</text>
<line x1="360" y1="251" x2="360" y2="275" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0503)"/>
<rect x="100" y="277" width="520" height="37" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="300" font-size="14" fill="#292929" text-anchor="middle">저장: requests.json (save_requests)</text>
<line x1="360" y1="314" x2="360" y2="338" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0503)"/>
<rect x="100" y="340" width="520" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="363" font-size="14" fill="#292929" text-anchor="middle">다시 읽어서 건수와 첫 요청서의 상태를</text>
<text x="360" y="382" font-size="14" fill="#292929" text-anchor="middle">확인한다 (load_json)</text>
</svg>
