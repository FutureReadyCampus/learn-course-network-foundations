<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>Unit 5 마무리: 실습 4-1부터 깃허브 올리기까지 확인할 여섯 가지</title>
<desc>Unit 4와 Unit 5에서 요청 접수, 승인·반려, 예외 권한 부여, 처리 기한 점검, 이력 저장과 상태별 건수, 깃허브 올리기를 했습니다. 오늘 만든 requests.json 은 Unit 6의 과다권한 탐지에서 자료로 씁니다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">이번 Unit 마무리</text>
<rect x="20" y="50" width="110" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="74.62" font-size="15" fill="#292929" text-anchor="middle">실습 4-1</text>
<rect x="140" y="50" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="74.62" font-size="15" fill="#292929">요청을 요청서로 접수하고, 접수 못 할 요청을 걸러 냈다</text>
<rect x="20" y="100" width="110" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="124.62" font-size="15" fill="#292929" text-anchor="middle">실습 4-2</text>
<rect x="140" y="100" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="124.62" font-size="15" fill="#292929">승인 · 반려가 검토 중인 요청서에만 되게 했다</text>
<rect x="20" y="150" width="110" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="174.62" font-size="15" fill="#292929" text-anchor="middle">실습 4-3</text>
<rect x="140" y="150" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="174.62" font-size="15" fill="#292929">승인된 요청서를 정책으로 확인하고 예외 권한을 부여했다</text>
<rect x="20" y="200" width="110" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="75" y="224.62" font-size="15" fill="#292929" text-anchor="middle">실습 5-1</text>
<rect x="140" y="200" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="224.62" font-size="15" fill="#292929">처리 기한을 초과한 요청서를 시간 계산으로 찾았다</text>
<rect x="20" y="250" width="110" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="75" y="274.62" font-size="15" fill="#292929" text-anchor="middle">실습 5-2</text>
<rect x="140" y="250" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="274.62" font-size="15" fill="#292929">requests.json 으로 저장하고 상태별 건수를 셌다</text>
<rect x="20" y="300" width="110" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="75" y="324.62" font-size="15" fill="#292929" text-anchor="middle">마무리</text>
<rect x="140" y="300" width="560" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="324.62" font-size="15" fill="#292929">오늘 만든 파일과 보고서를 깃허브에 올렸다</text>
<rect x="20" y="356" width="680" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="384.62" font-size="15" fill="#292929" text-anchor="middle">다음 Unit 6 · requests.json 으로 「누가 어떤 권한을 요청해 받았나」를 본다</text>
</g>
</svg>
