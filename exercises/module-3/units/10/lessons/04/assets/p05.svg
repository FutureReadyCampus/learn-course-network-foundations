<text x="535" y="294.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">회수</text>
<text x="535" y="317" font-size="15" fill="#292929" text-anchor="middle">계획 → 승인 → 실행 → 이력</text>
