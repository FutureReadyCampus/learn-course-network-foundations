<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 10-3 정리: 네 단계 틀과 데이터 파일·규칙 파일의 구분</title>
<desc>상황이 생기면 확인, 원인, 고치기, 다시 확인 순서로 본다. 데이터는 users.json, exceptions.json, exclude_list.json 에, 규칙은 conditions.json 과 alert.json 에 있다. 새 권한은 요청·승인·부여, 회수는 계획·승인·실행·이력으로 처리한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 10-3 정리</text>
<rect x="20" y="66" width="140" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="90" y="96.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">확인</text>
