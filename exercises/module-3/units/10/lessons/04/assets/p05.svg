<text x="450" y="96.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">고치기</text>
<rect x="560" y="66" width="140" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="630" y="96.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다시 확인</text>
<line x1="162" y1="91" x2="196" y2="91" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="342" y1="91" x2="376" y2="91" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="522" y1="91" x2="556" y2="91" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="140" width="330" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="175.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">데이터 파일</text>
<text x="185" y="196.5" font-size="14" fill="#292929" text-anchor="middle">users.json · exceptions.json</text>
<text x="185" y="216.8" font-size="14" fill="#292929" text-anchor="middle">exclude_list.json</text>
<rect x="370" y="140" width="330" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="185.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">규칙 파일</text>
<text x="535" y="206.6" font-size="14" fill="#292929" text-anchor="middle">conditions.json · alert.json</text>
<rect x="20" y="260" width="330" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="294.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">새 권한</text>
<text x="185" y="317" font-size="15" fill="#292929" text-anchor="middle">요청 → 승인 → 부여</text>
