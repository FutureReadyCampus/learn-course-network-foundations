<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>실습 7-2 정리: 키를 만들고 제외해도 되는지 판단해 두 리스트로 나눠 리턴한다</title><desc>exclude_key 로 「사용자:권한」을 만들고 exclude_map 에 제외 이유를 담는다. can_exclude 는 리스트에 있고 퇴사가 아닐 때만 참이며, split_by_exclude 가 to_revoke 와 excluded 를 함께 리턴한다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 7-2 정리</text>
<rect x="20" y="52" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="76.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「사용자:권한」</text>
<rect x="214" y="52" width="486" height="38" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="457" y="76.25" font-size="15" fill="#292929" text-anchor="middle">return f"{user}:{permission}"</text>
<rect x="20" y="98" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="122.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">제외 이유 담기</text>
<rect x="214" y="98" width="486" height="38" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="457" y="122.25" font-size="15" fill="#292929" text-anchor="middle">exclude_map[item_key] = item["reason"]</text>
<rect x="20" y="144" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="168.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">리스트에 있나</text>
<rect x="214" y="144" width="486" height="38" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="457" y="168.25" font-size="15" fill="#292929" text-anchor="middle">in_exclude_list = key in exclude_map</text>
<rect x="20" y="190" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="214.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">퇴사가 있나</text>
<rect x="214" y="190" width="486" height="38" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="457" y="214.25" font-size="15" fill="#292929" text-anchor="middle">is_resigned = "퇴사한 계정" in finding["reasons"]</text>
<rect x="20" y="236" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="260.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">제외해도 되나</text>
<rect x="214" y="236" width="486" height="38" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="457" y="260.25" font-size="15" fill="#292929" text-anchor="middle">return in_exclude_list and not is_resigned</text>
<rect x="20" y="282" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="306.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">제외된 후보</text>
<rect x="214" y="282" width="486" height="38" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="457" y="306.25" font-size="15" fill="#292929" text-anchor="middle">excluded.append(make_excluded(finding, reason))</text>
<rect x="20" y="328" width="180" height="38" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="352.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">둘로 나눠 리턴</text>
<rect x="214" y="328" width="486" height="38" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="457" y="352.25" font-size="15" fill="#292929" text-anchor="middle">return to_revoke, excluded</text>
</g>
</svg>
