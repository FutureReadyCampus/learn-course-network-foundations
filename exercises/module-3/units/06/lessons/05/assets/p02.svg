<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>실습 6-1 정답: 역할 9건과 예외 5건을 이어 붙여 현황 14건을 만든다</title><desc>사용자마다 역할로 받은 권한 9건을 모으고 예외 5건에 expires 키를 붙여 더하면 현황은 14건이다. tester 는 역할 intern 이 역할 파일에 없어 권한이 없다. access_list = 를 빼면 5건만 나온다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 6-1 정답 · 현황 14건</text>
<rect x="20" y="60" width="220" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="130" y="82.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">역할로 받은 권한</text>
<text x="130" y="103.25" font-size="14" fill="#666660" text-anchor="middle">USERS × ROLES</text>
<text x="130" y="124.25" font-size="15" fill="#292929" text-anchor="middle">9건</text>
<rect x="20" y="156" width="220" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="130" y="178.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외로 받은 권한</text>
<text x="130" y="199.25" font-size="14" fill="#666660" text-anchor="middle">EXCEPTIONS + expires 키</text>
<text x="130" y="220.25" font-size="15" fill="#292929" text-anchor="middle">5건</text>
<rect x="300" y="100" width="170" height="92" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="385" y="140.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">access_list</text>
<text x="385" y="161.75" font-size="15" fill="#292929" text-anchor="middle">현황 14건</text>
<line x1="244" y1="98" x2="296" y2="130" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="244" y1="194" x2="296" y2="162" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="510" y="60" width="190" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="605" y="82.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">tester 0건</text>
<text x="605" y="103.25" font-size="14" fill="#666660" text-anchor="middle">역할 intern 이</text>
<text x="605" y="124.25" font-size="14" fill="#666660" text-anchor="middle">역할 파일에 없음</text>
<rect x="510" y="156" width="190" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="605" y="178.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">사용자별</text>
<text x="605" y="199.25" font-size="14" fill="#666660" text-anchor="middle">3건씩 4명</text>
<text x="605" y="220.25" font-size="14" fill="#666660" text-anchor="middle">batch-night 2건</text>
<rect x="20" y="262" width="680" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="360" y="292.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">자주 틀리는 곳: access_list = access_list + role_list 에서 앞을 빼먹음</text>
<text x="360" y="313.75" font-size="14" fill="#666660" text-anchor="middle">이은 리스트가 버려져 오류 없이 「부여돼 있는 권한 5 건」만 나온다</text>
</g>
</svg>
