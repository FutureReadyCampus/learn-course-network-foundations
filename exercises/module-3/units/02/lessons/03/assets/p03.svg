<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>입사, 이동, 퇴사가 users.json 의 사용자 항목을 어떻게 바꾸는지 보여 주는 전후 표</title><desc>입사는 사용자 항목을 새로 만들고, 이동은 role 값을 sales 에서 finance 로 바꾸며 둘 다 assign_role 을 씁니다. 퇴사는 revoke_access 로 employed 만 false 로 바꾸고 항목은 남겨 둡니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">1.1 입사 · 이동 · 퇴사와 사용자 파일</text><text x="60" y="64" font-size="14" text-anchor="middle" fill="#666660">인사 변경</text><text x="215" y="64" font-size="14" text-anchor="middle" fill="#666660">바꾸기 전</text><text x="460" y="64" font-size="14" text-anchor="middle" fill="#666660">바꾼 뒤</text><text x="645" y="64" font-size="14" text-anchor="middle" fill="#666660">함수</text><rect x="15" y="78" width="90" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="60" y="123.25" font-weight="700">입사</tspan></text><rect x="115" y="78" width="200" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="215" y="122.9">(항목 없음)</tspan></text><line x1="320" y1="118" x2="344" y2="118" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><rect x="350" y="78" width="220" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="460" y="113.1">&quot;minsu&quot;: {&quot;role&quot;: &quot;sales&quot;,</tspan><tspan x="460" dy="19.6">&quot;employed&quot;: true}</tspan></text><rect x="585" y="78" width="120" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" f