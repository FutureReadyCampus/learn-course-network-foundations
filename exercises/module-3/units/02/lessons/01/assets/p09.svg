<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>앞 사람 도커 컨테이너를 찾아 지워 포트를 비우는 다섯 단계</title><desc>앞 사람 컨테이너가 8081 같은 포트를 차지하면 내 서버가 막힙니다. Docker Desktop 을 켜고 docker ps, docker ps -a 로 확인한 뒤 docker rm -f 로 지우고 제목 줄만 남는지 봅니다.</desc><defs><marker id="a-p09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">8장 · 앞 사람이 켜 둔 도커 컨테이너를 지웁니다</text><rect x="60" y="55" width="260" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="190" y="85.1" font-weight="700">앞 사람 컨테이너</tspan><tspan x="190" dy="19.6">closed-web-8081 · 포트 8081</tspan></text><line x1="326" y1="90" x2="394" y2="90" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p09)"/><text x="360" y="78" font-size="14" text-anchor="middle" fill="#666660">차지</text><rect x="400" y="55" width="260" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="530" y="85.1" font-weight="700">내가 같은 포트로 서버를 켜면</tspan><tspan x="530" dy="19.6">막힙니다</tspan></text><rect x="15" y="155" width="120.4" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="75.2" y="200.3" font-weight="700">1. 켜기</tspan><tspan x="75.2" dy="19.6">Docker</tspan><tspan x="75.2" dy="19.6">Desktop</tspan></text><line x1="138.4" y1="215" x2="154.4" y2="215" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p09)"/><rect x="157.4" y="155" width="120.4" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="217.6" y="200.3" font-weight="700">2. 켜진 것</tspan><tspan x="217.6" dy="19.6">docker ps</tspan><tspan x="217.6" dy="19.6">STATUS: Up</tspan></text><line x1="280.8" y1="215" x2="296.8" y2="215" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p09)"/><rect x="299.8" y="155" width="120.4" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="200.3" font-weight="700">3. 모두</tspan><tspan x="360" dy="19.6">docker ps -a</tspan><tspan x="360" dy="19.6">Exited 포함</tspan></text><line x1="423.2" y1="215" x2="439.2" y2="215" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p09)"/><rect x="442.2" y="155" width="120.4" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="502.4" y="200.3" font-weight="700">4. 지우기</tspan><tspan x="502.4" dy="19.6">docker rm -f</tspan><tspan x="502.4" dy="19.6">NAMES 이름</tspan></text><line x1="565.6" y1="215" x2="581.6" y2="215" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p09)"/><rect x="584.6" y="155" width="120.4" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="644.8" y="200.3" font-weight="700">5. 확인</tspan><tspan x="644.8" dy="19.6">docker ps -a</tspan><tspan x="644.8" dy="19.6">제목 줄만</tspan></text><rect x="15" y="300" width="690" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="325.1">이미지(nginx 같은 원본)는 지우지 않아도 됩니다</tspan><tspan x="360" dy="19.6">Docker Desktop 이 이 PC 에 없으면 이 장은 건너뜁니다</tspan></text></g></svg>
