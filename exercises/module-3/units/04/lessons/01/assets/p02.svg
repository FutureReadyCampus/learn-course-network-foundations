<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>터미널에서 Unit 3 파일을 확인하고, 결과가 다르면 unit03_recovery 파일을 넣습니다</title>
<desc>pwd, ls, python -c 한 줄로 앞 Unit 파일이 정상인지 확인합니다. 마지막 두 줄이 「이전 파일 정상 5」와 (False, '퇴사한 계정') 이면 Unit 4 파일 두 개를 두고, 다르면 복구 파일을 넣고 다시 칩니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">Unit 3 파일 확인하기</text>
<rect x="24" y="56" width="300" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="80.9" font-size="16" text-anchor="middle" font-weight="700">1. pwd</text>
<text x="174" y="101.9" font-size="15" text-anchor="middle">…/access_control 로 끝나는지</text>
<rect x="24" y="140" width="300" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="164.9" font-size="16" text-anchor="middle" font-weight="700">2. ls · ls config</text>
<text x="174" y="185.9" font-size="15" text-anchor="middle">Unit 3까지 만든 파일 보기</text>
<rect x="24" y="224" width="300" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="174" y="248.9" font-size="16" text-anchor="middle" font-weight="700">3. python -c "…"</text>
<text x="174" y="269.9" font-size="15" text-anchor="middle">evaluate_access 를 dami 로</text>
<path d="M174,116 L174,138" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<path d="M174,200 L174,222" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="360" y="140" width="336" height="104" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="528" y="176.4" font-size="16" text-anchor="middle" font-weight="700">마지막 두 줄이 이렇게 나왔나?</text>
<text x="528" y="197.4" font-size="15" text-anchor="middle">이전 파일 정상 5</text>
<text x="528" y="218.4" font-size="15" text-anchor="middle">(False, '퇴사한 계정')</text>
<path d="M324,254 L342,254 L342,192 L358,192" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="360" y="280" width="160" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="440" y="312.4" font-size="16" text-anchor="middle" font-weight="700">예</text>
<text x="440" y="333.4" font-size="15" text-anchor="middle">Unit 4 파일</text>
<text x="440" y="354.4" font-size="15" text-anchor="middle">두 개 두기</text>
<rect x="536" y="280" width="160" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="616" y="312.4" font-size="16" text-anchor="middle" font-weight="700">아니오</text>
<text x="616" y="333.4" font-size="15" text-anchor="middle">unit03_recovery</text>
<text x="616" y="354.4" font-size="15" text-anchor="middle">넣고 다시</text>
<path d="M440,244 L440,278" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<path d="M616,244 L616,278" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="24" y="316" width="300" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="351.4" font-size="15" text-anchor="middle">맥북은 python 대신 python3</text>
</g>
</svg>
