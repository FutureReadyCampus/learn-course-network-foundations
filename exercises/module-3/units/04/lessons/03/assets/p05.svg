<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 4-2를 실행하면 본인 승인 한 줄과 처리 여섯 줄, 요청서 리스트 네 줄이 나온다</title>
<desc>req_review.py 와 exercise4-2_run.py 를 만들어 실행합니다. 단계 1은 본인 승인 시험이 False, 처리 여섯 건은 앞 네 건이 True, 뒤 두 건이 False 이고, 단계 2는 요청서 네 줄입니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 4-2 · 파일 두 개와 실행 결과</text>
