<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img"><title>test_policy.py 는 assert 를 차례로 검사하고, 하나라도 거짓이면 그 자리에서 멈춥니다</title><desc>python test_policy.py 를 실행하면 1번 테스트부터 assert 를 차례로 검사합니다. 거짓이 나오면 AssertionError: 설명 을 내고 그 자리에서 멈추고, 참이면 다음 테스트로 갑니다. 3번 테스트는 assert 가 둘, 4번 테스트는 하나이며, 모두 참이면 「테스트 4개 모두 통과」를 출력합니다.</desc><defs><marker id="a-f01-0303" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="28" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">테스트 파일을 실행하면</text><rect x="40" y="46" width="320" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="73.2" font-weight="700">python test_policy.py 실행</tspan></text><path d="M200,90 V116" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><rect x="40" y="120" width="320" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="147.2" font-weight="700">1번 테스트의 assert</tspan></text><rect x="470" y="115.0" width="230" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="585.0" y="137.5" font-weight="700">AssertionError: 설명</tspan><tspan x="585.0" y="156.4">(그 자리에서 멈춘다)</tspan></text><path d="M360,142.0 H466" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="392" y="134.0" font-size="14" text-anchor="start" fill="#292929">거짓</text><path d="M200,164 V206" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="210" y="192" font-size="14" text-anchor="start" fill="#292929">참</text><rect x="40" y="210" width="320" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="237.2" font-weight="700">2번 테스트의 assert</tspan></text><rect x="470" y="205.0" width="230" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="585.0" y="227.5" font-weight="700">AssertionError: 설명</tspan><tspan x="585.0" y="246.4">(그 자리에서 멈춘다)</tspan></text><path d="M360,232.0 H466" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="392" y="224.0" font-size="14" text-anchor="start" fill="#292929">거짓</text><path d="M200,254 V296" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="210" y="282" font-size="14" text-anchor="start" fill="#292929">참</text><rect x="40" y="300" width="320" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5" stroke-dasharray="6 4"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="200.0" y="327.4" font-weight="700">3번 · 4번 테스트의 assert</tspan><tspan x="200.0" y="346.3">(3번은 assert 가 둘, 4번은 하나)</tspan></text><rect x="470" y="305.0" width="230" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="585.0" y="327.4" font-weight="700">AssertionError: 설명</tspan><tspan x="585.0" y="346.3">(그 자리에서 멈춘다)</tspan></text><path d="M360,332.0 H466" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="392" y="324.0" font-size="14" text-anchor="start" fill="#292929">거짓</text><path d="M200,364 V406" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0303)"/><text x="210" y="390" font-size="14" text-anchor="start" fill="#292929">모두 참</text><rect x="40" y="410" width="320" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="438.2" font-weight="700">print("테스트 4개 모두 통과")</tspan></text></g></svg>
