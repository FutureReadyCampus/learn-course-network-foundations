<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 5-1 보고서 체크리스트: (가) 출력과 번호 (나) 조치 기준 (다) 상태를 안 볼 때</title>
<desc>(가)에는 출력 전체, 4시간을 초과한 요청 번호, 지난 시간을 씁니다. (나)에는 누구에게 어떤 조치를 할지와 알림·에스컬레이션을 나누는 기준을, (다)에는 상태를 보지 않을 때 생기는 문제와 곤란한 점을 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">실습 5-1 보고서에 채울 칸</text>
<rect x="20" y="52" width="110" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="96.62" font-size="15" fill="#292929" text-anchor="middle">(가)</text>
<rect x="140" y="52" width="560" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="86.12" font-size="15" fill="#292929">① 출력 전체 (코드 상자에)</text>
<text x="152" y="107.12" font-size="15" fill="#292929">② 4시간을 초과한 요청 번호  ③ 접수 뒤 지난 시간</text>
<rect x="20" y="150" width="110" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="194.62" font-size="15" fill="#292929" text-anchor="middle">(나)</text>
<rect x="140" y="150" width="560" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="184.12" font-size="15" fill="#292929">[핵심 질문] ① 누구에게 어떤 조치를 할지</text>
<text x="152" y="205.12" font-size="15" fill="#292929">② 알림만 보낼지, 윗사람에게 넘길지 나누는 기준</text>
<rect x="20" y="248" width="110" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="292.62" font-size="15" fill="#292929" text-anchor="middle">(다)</text>
<rect x="140" y="248" width="560" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="282.12" font-size="15" fill="#292929">[핵심 질문] ① 상태를 안 보면 리스트에 생기는 문제</text>
<text x="152" y="303.12" font-size="15" fill="#292929">② 그 리스트를 받은 사람이 곤란한 점</text>
</g>
</svg>
