<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<title>정답은 한 예이므로 내 답과 핵심이 같은지 비교한다</title>
<desc>정답 코드와 설명은 여러 답 가운데 한 예입니다. 내 답을 정답 예와 나란히 놓고 핵심이 같은지 봅니다. 핵심이 같으면 표현이 달라도 맞습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">정답을 보는 방법</text>
<rect x="20" y="60" width="220" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130" y="85.128" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">내 답</text>
<text x="130" y="105.512" font-size="14" fill="#666660" text-anchor="middle">코드 · 출력 · 설명</text>
<rect x="20" y="160" width="220" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="185.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">정답</text>
<text x="130" y="205.512" font-size="14" fill="#666660" text-anchor="middle">한 예</text>
<rect x="290" y="110" width="180" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="380" y="144.62" font-size="15" fill="#292929" text-anchor="middle">핵심이 같은가?</text>
<rect x="520" y="110" width="180" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="135.128" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">같으면 맞음</text>
<text x="610" y="155.512" font-size="14" fill="#666660" text-anchor="middle">표현은 달라도 된다</text>
<polyline points="240,90 286,130" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="240,190 286,150" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="470,140 516,140" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
</g>
</svg>
