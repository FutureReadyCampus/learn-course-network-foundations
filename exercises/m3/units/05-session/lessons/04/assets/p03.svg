<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>실습 5-2 정답: 상태별 건수 granted 1 · rejected 1 · approved 2 · reviewing 2</title>
<desc>상태별 건수는 granted 1, rejected 1, approved 2, reviewing 2 입니다. save_requests 는 6을 돌려주고 다시 읽은 요청서도 6건입니다. SLA 초과는 5번만 남는데, 1번은 부여까지 끝났기 때문입니다.</desc>
