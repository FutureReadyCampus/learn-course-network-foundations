<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>정답 마무리: git status 로 16줄을 확인한 뒤 add·commit·push 한다</title>
<desc>cd .. 로 security-agent-toolkit 에 간 뒤 git status 를 칩니다. 한 예로 Untracked files 아래 16줄은 .py 10개, config/sla.json, requests.json, .md 4개입니다. .env 나 .venv 가 보이면 올리지 않습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">정답 마무리</text>
<rect x="13" y="52" width="110" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="68" y="80.312" font-size="14" fill="#292929" text-anchor="middle">cd ..</text>
<rect x="149" y="52" width="130" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="214" y="80.312" font-size="14" fill="#292929" text-anchor="middle">git status</text>
<polyline points="126,76 145,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="305" y="52" width="120" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="365" y="80.312" font-size="14" fill="#292929" text-anchor="middle">git add .</text>
<polyline points="282,76 301,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="451" y="52" width="120" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="511" y="80.312" font-size="14" fill="#292929" text-anchor="middle">git commit</text>
<polyline points="428,76 447,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="597" y="52" width="110" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="652" y="80.312" font-size="14" fill="#292929" text-anchor="middle">git push</text>
<polyline points="574,76 593,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="20" y="140" font-size="15" fill="#666660">한 예 · Untracked files 아래 16줄 (__pycache__ 가 안 보일 때)</text>
<rect x="20" y="154" width="150" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="95" y="180.428" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">.py 파일</text>
<text x="95" y="201.82" font-size="15" fill="#292929" text-anchor="middle">10줄</text>
<rect x="176.67" y="154" width="180" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="266.67" y="180.428" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">config/sla.json</text>
<text x="266.67" y="201.82" font-size="15" fill="#292929" text-anchor="middle">1줄</text>
<rect x="363.34" y="154" width="180" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="453.34" y="180.428" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">requests.json</text>
<text x="453.34" y="201.82" font-size="15" fill="#292929" text-anchor="middle">1줄</text>
<rect x="550.01" y="154" width="150" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="625.01" y="180.428" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">.md 파일</text>
<text x="625.01" y="201.82" font-size="15" fill="#292929" text-anchor="middle">4줄</text>
<rect x="20" y="244" width="680" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="269.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.env · .venv 가 보이면 git add . 하지 않는다</text>
<text x="360" y="289.512" font-size="14" fill="#666660" text-anchor="middle">.gitignore 에 한 줄 적고 git status 를 다시 친다 · 줄 수는 학생마다 다를 수 있다</text>
</g>
</svg>
