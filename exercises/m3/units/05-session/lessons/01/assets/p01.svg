<text x="356" y="121.1" font-size="15" fill="#292929" text-anchor="middle">승인 · 반려</text>
<line x1="456" y1="106" x2="486" y2="106" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
