<text x="184" y="206.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 5-1</text>
<text x="184" y="229.6" font-size="15" fill="#292929" text-anchor="middle">접수한 지 정해진 시간</text>
