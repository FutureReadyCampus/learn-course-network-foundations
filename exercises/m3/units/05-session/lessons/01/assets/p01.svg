<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Unit 4의 접수·승인·부여 흐름을 Unit 5에서 처리 기한으로 점검하고 파일로 저장한다</title>
<desc>위는 Unit 4에서 만든 req_create.py, req_review.py, req_grant.py 흐름입니다. 아래는 이번 Unit 의 실습 5-1 SLA 점검과 실습 5-2 requests.json 저장 · 상태별 건수 · 깃허브 올리기입니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">Unit 5 목표: 기한 점검과 기록 저장</text>
