<polyline points="145,190 145,209" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="292" width="250" height="58" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="145" y="316.128" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">단계 3: 저장</text>
