<polyline points="270,81 320,81" fill="none" stroke="#666660" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="20" y="132" width="250" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="145" y="155.428" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">단계 1: 처리</text>
<text x="145" y="176.82" font-size="15" fill="#292929" text-anchor="middle">승인 · 반려 · 부여</text>
<rect x="320" y="132" width="380" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="332" y="155.12" font-size="15" fill="#292929">1 · 3 · 4번 승인, 2번 반려</text>
<text x="332" y="176.12" font-size="15" fill="#292929">그다음 요청서마다 부여를 시도</text>
<polyline points="270,161 320,161" fill="none" stroke="#666660" stroke-width="1.5" stroke-dasharray="5 4"/>
<polyline points="145,110 145,129" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="212" width="250" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="145" y="236.128" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">단계 2: 점검</text>
<text x="145" y="256.512" font-size="14" fill="#292929" text-anchor="middle">count_by_status + SLA</text>
<rect x="320" y="212" width="380" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="332" y="235.12" font-size="15" fill="#292929">상태별 건수 딕셔너리</text>
