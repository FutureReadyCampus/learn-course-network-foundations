<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>만료 정각 18:00 은 거부가 정책이라 6번 실패는 제안이 정책과 다르다는 뜻입니다</title>
<desc>seoyeon 의 예외 1번은 18:00 에 끝나고 코드는 now &lt; expires 로 정각을 거부합니다. 3-1, 3-2 테스트는 통과하고 6번 제안만 실패하므로 코드를 고칠 일이 아니라 정책으로 정할 일입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">실습 3-2 정답 · 6번 실패 읽기</text>
<text x="24" y="70" font-size="15" fill="#666660">예외 1번 · seoyeon 정산 조회 · 만료 18:00</text>
<rect x="60" y="84" width="400" height="40" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<rect x="460" y="84" width="236" height="40" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="260" y="109" font-size="15" text-anchor="middle">유효: now &lt; expires</text>
<text x="578" y="109" font-size="15" text-anchor="middle">만료 · 거부</text>
<text x="410" y="148" font-size="14" text-anchor="middle">17:59</text>
<text x="464" y="148" font-size="14" text-anchor="middle">18:00</text>
<line x1="410" y1="124" x2="410" y2="132" stroke="#666660" stroke-width="1.5"/>
<line x1="460" y1="124" x2="460" y2="132" stroke="#666660" stroke-width="1.5"/>
<rect x="24" y="168" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="129" y="194.9" font-size="15" text-anchor="middle">3-1 · 17:59</text>
<text x="129" y="215.9" font-size="15" text-anchor="middle">허용 → 통과</text>
<rect x="252" y="168" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="357" y="194.9" font-size="15" text-anchor="middle">3-2 · 18:00</text>
<text x="357" y="215.9" font-size="15" text-anchor="middle">거부 → 통과</text>
<rect x="480" y="168" width="216" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="588" y="194.9" font-size="15" text-anchor="middle">6번 제안 · 18:00</text>
<text x="588" y="215.9" font-size="15" text-anchor="middle">허용? → 실패</text>
<rect x="24" y="252" width="672" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="277.2" font-size="14" text-anchor="middle">test_policy_extra.py line 19 에서 멈춤</text>
<text x="360" y="296.8" font-size="14" text-anchor="middle">AssertionError: 6. 만료 정각에도 허용되어야 한다(팀원 제안)</text>
<rect x="24" y="328" width="672" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="351.2" font-size="14" text-anchor="middle">코드는 정한 정책대로 → 제안을 받아들일지 정책으로 정할 일</text>
<text x="360" y="370.8" font-size="14" text-anchor="middle">&lt; 를 &lt;= 로 고치면 3번 테스트가 깨집니다</text>
</g>
</svg>
