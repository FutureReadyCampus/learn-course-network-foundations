<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>git status 의 Untracked 줄을 세고 .env 가 없을 때만 올립니다</title>
<desc>정답 마무리의 명령 순서와 Untracked files 줄 수 예시입니다. 한 예로 16줄은 .py 열 개, config JSON 두 개, 보고서와 안내 문서 네 개이며 학생마다 다를 수 있습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">정답 마무리 · 올리기 전 확인</text>
<rect x="24" y="52" width="150" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="99" y="79" font-size="14" text-anchor="middle">cd .. · pwd</text>
<rect x="198" y="52" width="150" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="273" y="79" font-size="14" text-anchor="middle">git status</text>
<path d="M174,74 L196,74" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="372" y="52" width="150" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="447" y="79" font-size="14" text-anchor="middle">git add . · commit</text>
<path d="M348,74 L370,74" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="546" y="52" width="150" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="621" y="79" font-size="14" text-anchor="middle">git push</text>
<path d="M522,74 L544,74" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="24" y="134" font-size="16" font-weight="700">Untracked files: 16줄 (한 예)</text>
<rect x="24" y="146" width="420" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="234" y="177.4" font-size="15" text-anchor="middle">.py 파일 10</text>
<rect x="444" y="146" width="84" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="486" y="177" font-size="14" text-anchor="middle">JSON 2</text>
<rect x="528" y="146" width="168" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="612" y="177" font-size="14" text-anchor="middle">보고서 2 · 안내 2</text>
<rect x="24" y="226" width="324" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="186" y="252.9" font-size="15" text-anchor="middle">.env · .venv 없음</text>
<text x="186" y="273.9" font-size="15" text-anchor="middle">→ 그대로 올림</text>
<rect x="372" y="226" width="324" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="534" y="253.2" font-size="14" text-anchor="middle">.env 가 보이면 .gitignore 에</text>
<text x="534" y="272.8" font-size="14" text-anchor="middle">적고 git status 다시</text>
<text x="24" y="330" font-size="15" fill="#666660">줄 수와 이름은 학생마다 다를 수 있습니다</text>
</g>
</svg>
