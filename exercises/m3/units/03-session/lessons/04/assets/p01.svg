<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>설명하는 답은 한 예이고 핵심이 같으면 맞습니다</title>
<desc>내가 쓴 답과 정답 예를 비교해 핵심이 같은지 보는 순서입니다. 코드는 줄 수가 달라도 주석이 말한 일을 하면 맞고, 다르면 왜와 자주 틀리는 곳을 읽습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">정답을 읽는 법</text>
<rect x="24" y="64" width="190" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="119" y="101.4" font-size="16" text-anchor="middle" font-weight="700">내가 쓴 답</text>
<rect x="24" y="156" width="190" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="193.4" font-size="16" text-anchor="middle" font-weight="700">정답 (한 예)</text>
<rect x="260" y="92" width="210" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="126.4" font-size="16" text-anchor="middle" font-weight="700">핵심이 같은가?</text>
<text x="365" y="147.4" font-size="15" text-anchor="middle">코드: 주석이 말한</text>
<text x="365" y="168.4" font-size="15" text-anchor="middle">일을 하는가</text>
<path d="M214,96 L258,124" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<path d="M214,188 L258,160" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="516" y="64" width="180" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="606" y="90.9" font-size="16" text-anchor="middle" font-weight="700">같으면 맞음</text>
<text x="606" y="111.9" font-size="15" text-anchor="middle">줄 수는 달라도 됨</text>
<rect x="516" y="156" width="180" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="606" y="182.9" font-size="16" text-anchor="middle" font-weight="700">다르면</text>
<text x="606" y="203.9" font-size="15" text-anchor="middle">왜 · 자주 틀리는 곳</text>
<path d="M470,124 L514,96" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<path d="M470,160 L514,188" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<text x="24" y="262" font-size="15" fill="#666660">정답마다 결과 · 왜 · 자주 틀리는 곳 · 관제에서는 순서로 적혀 있습니다</text>
</g>
</svg>
