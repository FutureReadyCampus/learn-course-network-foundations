<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 3-1은 파일 세 개를 만들고 exercise3-1_broken.py 로 세 경로를 시험합니다</title>
<desc>config_loader.py 의 load_json 본문은 직접 쓰고, 깨진 users_broken.json 과 시험 파일은 그대로 붙여 넣습니다. 실행하면 결과 다섯 줄 가운데 경고 두 줄이 나오고, 그 뒤 보고서를 채웁니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">실습 3-1 · 만들 파일과 실행</text>
<rect x="24" y="56" width="310" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="179" y="80.9" font-size="16" text-anchor="middle" font-weight="700">config_loader.py</text>
<text x="179" y="101.9" font-size="15" text-anchor="middle">load_json 본문을 직접 씀</text>
<rect x="24" y="132" width="310" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="179" y="156.9" font-size="16" text-anchor="middle" font-weight="700">config/users_broken.json</text>
<text x="179" y="177.9" font-size="15" text-anchor="middle">그대로 (일부러 깨진 파일)</text>
<rect x="24" y="208" width="310" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="179" y="232.9" font-size="16" text-anchor="middle" font-weight="700">exercise3-1_broken.py</text>
<text x="179" y="253.9" font-size="15" text-anchor="middle">그대로 붙여 넣기</text>
<rect x="384" y="132" width="312" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="156.9" font-size="15" text-anchor="middle">python exercise3-1_broken.py</text>
<text x="540" y="177.9" font-size="15" text-anchor="middle">위치: …/access_control</text>
<rect x="384" y="224" width="312" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="248.9" font-size="16" text-anchor="middle" font-weight="700">결과 다섯 줄</text>
<text x="540" y="269.9" font-size="15" text-anchor="middle">경고 두 줄은 어느 경로?</text>
<rect x="384" y="316" width="312" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="345.4" font-size="15" text-anchor="middle">보고서 (가)~(다) 채우기</text>
<line x1="334" y1="86" x2="358" y2="86" stroke="#666660" stroke-width="1.6"/>
<line x1="334" y1="162" x2="358" y2="162" stroke="#666660" stroke-width="1.6"/>
<line x1="334" y1="238" x2="358" y2="238" stroke="#666660" stroke-width="1.6"/>
<line x1="358" y1="86" x2="358" y2="238" stroke="#666660" stroke-width="1.6"/>
<path d="M358,162 L382,162" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<path d="M540,192 L540,222" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<path d="M540,284 L540,314" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<rect x="24" y="300" width="310" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="179" y="326.9" font-size="15" text-anchor="middle">채우기 전에 실행하면</text>
<text x="179" y="347.9" font-size="15" text-anchor="middle">TypeError (None 을 리턴)</text>
</g>
</svg>
