<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img"><title>load_json 은 설정 파일이 없거나 깨지면 경고를 내고 빈 설정 {} 을 돌려줘 모든 요청을 막습니다</title><desc>설정 파일을 load_json 으로 읽어 성공하면 읽은 내용으로 평소대로 판정합니다. 파일이 없거나(FileNotFoundError) JSON 이 깨지면(json.JSONDecodeError) 경고를 출력하고, 멈추지 않고 기본값 default 를 리턴합니다. 오늘은 default 가 {} 이므로 사용자가 한 명도 없어 모든 요청이 「등록되지 않은 사용자」로 거부됩니다.</desc><defs><marker id="a-f01-0302" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="28" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">1.1 안전하게 읽고, 실패하면 빈 설정</text><rect x="20" y="50" width="110" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="75.0" y="80.2" font-weight="700">설정 파일</tspan></text><path d="M130,75 H166" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="170" y="50" width="130" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="235.0" y="80.2" font-weight="700">load_json</tspan></text><path d="M300,75 H376" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><text x="338" y="68" font-size="14" text-anchor="middle" fill="#292929">성공</text><rect x="380" y="50" width="120" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="440.0" y="80.2" font-weight="700">읽은 내용</tspan></text><path d="M500,75 H536" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="540" y="50" width="160" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="620.0" y="80.2" font-weight="700">평소대로 판정</tspan></text><path d="M235,100 V130 H185 V156" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><path d="M235,130 H535 V156" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="20" y="160" width="330" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="185.0" y="191.0" font-weight="700">파일이 없음</tspan><tspan x="185.0" y="209.9">(FileNotFoundError)</tspan><tspan x="185.0" y="228.8">「[경고] 설정 파일 없음: 경로」 출력</tspan></text><rect x="370" y="160" width="330" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="535.0" y="191.0" font-weight="700">JSON 이 깨짐</tspan><tspan x="535.0" y="209.9">(json.JSONDecodeError)</tspan><tspan x="535.0" y="228.8">「[경고] 설정 파일 깨짐: 경로」 출력</tspan></text><path d="M185,250 V286" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><path d="M535,250 V286" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="110" y="290" width="500" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360.0" y="317.4">두 경우 모두 프로그램은 멈추지 않고</tspan><tspan x="360.0" y="336.3">기본값 default 를 리턴한다 (오늘은 default 가 {})</tspan></text><path d="M360,354 V386" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="270" y="390" width="180" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" y="418.2" font-weight="700">빈 설정 {}</tspan></text><path d="M360,436 V452 H160 V466" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="40" y="470" width="240" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="160.0" y="505.2" font-weight="700">사용자가 한 명도 없음</tspan></text><path d="M280,500 H366" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0302)"/><rect x="370" y="470" width="330" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="535.0" y="495.1">모든 요청이</tspan><tspan x="535.0" y="515.4">「등록되지 않은 사용자」로 거부</tspan></text></g></svg>
