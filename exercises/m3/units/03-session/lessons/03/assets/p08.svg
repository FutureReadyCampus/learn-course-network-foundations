<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>마무리 정리: git status 로 확인하고, add·commit·push 로 올리고, 브라우저로 봅니다</title>
<desc>깃허브에 올리는 세 단계를 요약합니다. 올리기 전 확인, 올리기, 올린 뒤 확인입니다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">마무리 정리</text>
<rect x="24" y="72" width="200" height="130" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="124" y="121.4" font-size="16" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="124" y="142.4" font-size="15" text-anchor="middle">git status</text>
<text x="124" y="163.4" font-size="15" text-anchor="middle">(.env · .venv 면 멈춤)</text>
<rect x="260" y="72" width="200" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="121.4" font-size="16" text-anchor="middle" font-weight="700">올리기</text>
<text x="360" y="142.4" font-size="15" text-anchor="middle">git add .</text>
<text x="360" y="163.4" font-size="15" text-anchor="middle">→ commit → push</text>
<path d="M224,137 L258,137" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/>
<rect x="496" y="72" width="200" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596" y="121.4" font-size="16" text-anchor="middle" font-weight="700">올린 뒤</text>
<text x="596" y="142.4" font-size="15" text-anchor="middle">브라우저에서</text>
<text x="596" y="163.4" font-size="15" text-anchor="middle">파일이 모두 있는지</text>
<path d="M460,137 L494,137" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/>
<text x="24" y="250" font-size="15" fill="#666660">비밀 키 파일(.env)이 섞이지 않았는지 올리기 전에 봅니다</text>
</g>
</svg>
