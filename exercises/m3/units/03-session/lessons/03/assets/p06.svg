<text x="360" y="308.9" font-size="16" text-anchor="middle" font-weight="700">실패하면 AssertionError: 설명 + 줄 번호</text>
<text x="360" y="329.9" font-size="15" text-anchor="middle">→ 코드가 틀렸나, 기대가 정책과 다른가를 먼저 판단</text>
