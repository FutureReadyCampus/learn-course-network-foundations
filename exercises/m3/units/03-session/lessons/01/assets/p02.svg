<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>access_control 폴더에 Unit 2 파일이 있는지 보고 Unit 3 파일 두 개를 옮깁니다</title>
<desc>Unit 2에서 만든 파이썬 파일 일곱 개와 config 폴더의 JSON 세 개가 있어야 합니다. 다운로드 폴더의 Unit 3 안내 파일과 보고서를 access_control 폴더로 끌어다 놓습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">폴더 준비 · access_control</text>
<rect x="24" y="56" width="360" height="332" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="84" font-size="15" font-weight="700">access_control/</text>
<text x="68" y="112" font-size="15">rbac.py</text>
<text x="68" y="140" font-size="15">role_admin.py</text>
<text x="68" y="168" font-size="15">exception_policy.py</text>
<text x="68" y="196" font-size="15">policy.py</text>
<text x="68" y="224" font-size="15">exercise2-1_run.py</text>
<text x="68" y="252" font-size="15">exercise2-2_run.py</text>
<text x="68" y="280" font-size="15">exercise2-3_run.py</text>
<text x="68" y="308" font-size="15" font-weight="700">config/</text>
<text x="92" y="336" font-size="15">users.json · roles.json</text>
<text x="92" y="364" font-size="15">exceptions.json</text>
<rect x="470" y="70" width="226" height="108" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="583" y="108.4" font-size="16" text-anchor="middle" font-weight="700">다운로드 폴더</text>
<text x="583" y="129.4" font-size="15" text-anchor="middle">Unit 3 안내 파일</text>
<text x="583" y="150.4" font-size="15" text-anchor="middle">Unit 3 보고서</text>
<path d="M468,124 L386,124" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<text x="427" y="112" font-size="14" text-anchor="middle" fill="#666660">끌어다</text>
<text x="427" y="146" font-size="14" text-anchor="middle" fill="#666660">놓기</text>
<rect x="470" y="214" width="226" height="130" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="583" y="252.9" font-size="16" text-anchor="middle" font-weight="700">터미널 위치 확인</text>
<text x="583" y="273.9" font-size="15" text-anchor="middle">pwd 결과가</text>
<text x="583" y="294.9" font-size="15" text-anchor="middle">…/access_control</text>
<text x="583" y="315.9" font-size="15" text-anchor="middle">로 끝나야 함</text>
<text x="470" y="372" font-size="14" fill="#666660">파일이 없으면 Unit 2 정답으로</text>
</g>
</svg>
