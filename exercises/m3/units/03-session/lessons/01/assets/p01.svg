<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>Unit 3은 Unit 2의 정책을 고장과 테스트에 대비해 믿을 수 있게 만듭니다</title>
<desc>Unit 2에서 만든 역할 부여·회수, 예외, evaluate_access 위에 두 실습을 더합니다. 실습 3-1은 설정이 고장 나도 모두 거부하게 하고, 실습 3-2는 테스트로 정책을 확인한 뒤 깃허브에 올립니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">Unit 3 목표 · 믿을 수 있는 정책</text>
<rect x="24" y="64" width="210" height="200" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="129" y="127.4" font-size="16" text-anchor="middle" font-weight="700">Unit 2 에서 만든 것</text>
<text x="129" y="148.4" font-size="15" text-anchor="middle">역할 부여 · 회수</text>
<text x="129" y="169.4" font-size="15" text-anchor="middle">기간이 정해진 예외</text>
<text x="129" y="190.4" font-size="15" text-anchor="middle">evaluate_access</text>
<text x="129" y="211.4" font-size="15" text-anchor="middle">(policy.py)</text>
<rect x="280" y="64" width="416" height="88" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="488" y="102.9" font-size="16" text-anchor="middle" font-weight="700">실습 3-1 · 설정이 고장 나도</text>
<text x="488" y="123.9" font-size="15" text-anchor="middle">멈추지 않고 빈 설정 → 모두 거부</text>
<rect x="280" y="176" width="416" height="88" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="488" y="214.9" font-size="16" text-anchor="middle" font-weight="700">실습 3-2 · 테스트 케이스로</text>
<text x="488" y="235.9" font-size="15" text-anchor="middle">정책대로 움직이는지 자동 확인</text>
<rect x="280" y="288" width="416" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="488" y="317.4" font-size="15" text-anchor="middle">실습 3-2 마지막: 깃허브에 올리기</text>
<path d="M234,120 L278,108" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<path d="M234,208 L278,220" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<path d="M488,264 L488,286" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
</g>
