<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 6-2 실행: 현황을 만들고 find_stale 로 거른 뒤 걸린 권한과 이유별 건수를 본다</title>
<desc>build_access_list 로 현황을 만들고 find_stale 에 지금 시각 NOW 와 함께 넘깁니다. 단계 1은 걸린 권한을 출처와 이유로, 단계 2는 이유별 건수를 출력합니다. expires 는 없을 수도 있어 entry.get 으로 꺼냅니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">exercise6-2_run.py 의 흐름</text>
<rect x="20" y="52" width="210" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125" y="92.128" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">build_access_list()</text>
<text x="125" y="112.512" font-size="14" fill="#666660" text-anchor="middle">현황 만들기 (실습 6-1)</text>
<rect x="260" y="52" width="220" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="370" y="82.328" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">find_stale</text>
<text x="370" y="102.712" font-size="14" fill="#292929" text-anchor="middle">(access_list, NOW)</text>
<text x="370" y="122.312" font-size="14" fill="#292929" text-anchor="middle">NOW = 2026-10-29 10:00</text>
<polyline points="233,97 256,97" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="510" y="52" width="190" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605" y="92.128" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">stale</text>
<text x="605" y="112.512" font-size="14" fill="#666660" text-anchor="middle">걸린 권한 + reason</text>
<polyline points="483,97 506,97" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="182" width="330" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="208.428" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">단계 1 · 판정</text>
<text x="185" y="229.82" font-size="15" fill="#292929" text-anchor="middle">사용자 권한 &lt;- 출처 | 이유</text>
<rect x="370" y="182" width="330" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="208.428" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">단계 2 · 점검</text>
<text x="535" y="229.82" font-size="15" fill="#292929" text-anchor="middle">이유별 건수 딕셔너리</text>
<polyline points="595,142 595,162 185,162 185,179" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="620,142 620,179" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="278" width="680" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="300.628" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">주의 · expires 는 entry.get("expires") 로 꺼낸다</text>
<text x="360" y="322.02" font-size="15" fill="#292929" text-anchor="middle">역할로 받은 권한에는 expires 키가 없어 None 이 된다</text>
<text x="360" y="342.012" font-size="14" fill="#666660" text-anchor="middle">entry["expires"] 로 꺼내면 KeyError</text>
