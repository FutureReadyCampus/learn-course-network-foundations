<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>보고서는 질문마다 쓸 내용을 보고 답: 뒤에 쓰고, 출력은 코드 상자에 붙인다</title><desc>문제를 풀 때마다 그 문제 제목 아래 질문에 답한다. 출력과 코드는 빈 코드 상자에, 이유는 화면의 값을 근거로 쓰고, 모르면 「모름 — 막힌 곳: …」 이라고 쓴다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">보고서 쓰는 방법</text>
<rect x="20" y="56" width="40" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="40" y="84.6" font-size="16" fill="#292929" text-anchor="middle">1</text>
<rect x="70" y="56" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="84.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">문제를 풀 때마다</text>
<rect x="280" y="56" width="420" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="84.25" font-size="15" fill="#292929" text-anchor="middle">그 문제 제목 아래 질문에 답한다</text>
<rect x="20" y="114" width="40" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="40" y="142.6" font-size="16" fill="#292929" text-anchor="middle">2</text>
<rect x="70" y="114" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="142.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">쓸 내용: 을 본다</text>
<rect x="280" y="114" width="420" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="142.25" font-size="15" fill="#292929" text-anchor="middle">그대로 답: 뒤에 쓴다</text>
<rect x="20" y="172" width="40" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="40" y="200.6" font-size="16" fill="#292929" text-anchor="middle">3</text>
<rect x="70" y="172" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="200.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">출력 · 코드</text>
<rect x="280" y="172" width="420" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="200.25" font-size="15" fill="#292929" text-anchor="middle">답: 아래 빈 코드 상자에 붙여 넣는다</text>
<rect x="20" y="230" width="40" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="40" y="258.6" font-size="16" fill="#292929" text-anchor="middle">4</text>
<rect x="70" y="230" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="258.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「왜」 질문</text>
<rect x="280" y="230" width="420" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="258.25" font-size="15" fill="#292929" text-anchor="middle">화면에서 본 값이나 배운 내용으로 이유까지</text>
<rect x="20" y="288" width="40" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="40" y="316.6" font-size="16" fill="#292929" text-anchor="middle">5</text>
<rect x="70" y="288" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="316.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">못 찾았으면</text>
<rect x="280" y="288" width="420" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="316.25" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」 이라고 쓴다</text>
</g>
</svg>
