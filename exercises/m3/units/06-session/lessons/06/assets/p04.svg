<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" role="img"><title>실습 6-3 보고서: 후보 건수와 일 수, 90일 경계, 이력 없는 권한의 위험을 채운다</title><desc>보고서 실습 6-3 칸에서 채울 항목이다. (가) 출력과 후보 건수, 후보별 안 쓴 일 수, (나) 90일 경계 기준이 합리적인지, (다) 사용 이력이 없는 권한을 바로 지울 때의 위험과 확인할 것을 쓴다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 6-3 · 90일 넘게 안 쓴 권한 찾기</text>
<rect x="20" y="52" width="680" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="75.25" font-size="15" fill="#292929" font-weight="700">(가) 출력 전체와 후보</text>
<rect x="40" y="98" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="113" font-size="15" fill="#292929">① 출력 전체(코드 상자에 붙여 넣기)</text>
<rect x="40" y="128" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="143" font-size="15" fill="#292929">② 후보 건수</text>
<rect x="40" y="158" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="173" font-size="15" fill="#292929">③ 후보별 안 쓴 일 수(이력이 없으면 「이력 없음」)</text>
<rect x="20" y="194" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="217.25" font-size="15" fill="#292929" font-weight="700">(나) [핵심 질문] 90일과 91일, 하루 차이 기준</text>
<rect x="40" y="240" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="255" font-size="15" fill="#292929">① 합리적인지와 이유</text>
<rect x="40" y="270" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="285" font-size="15" fill="#292929">② 추가로 확인할 것</text>
<rect x="20" y="306" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="329.25" font-size="15" fill="#292929" font-weight="700">(다) [핵심 질문] 이력 없는 권한을 바로 지우면</text>
<rect x="40" y="352" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="367" font-size="15" fill="#292929">① 위험한 경우의 예</text>
<rect x="40" y="382" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="397" font-size="15" fill="#292929">② 지우기 전에 확인할 것</text>
</g>
</svg>
