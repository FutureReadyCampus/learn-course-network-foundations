<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>실습 6-3 정답: 7건 중 90일을 넘었거나 이력이 없는 3건이 후보다</title><desc>규칙에 안 걸린 권한 7건의 안 쓴 일 수를 막대로 그렸다. 90일 선을 넘은 seoyeon SALES:CHANGE(120일), junho SALES:QUERY(91일)와 이력이 없는 gaeun ACCOUNT:CHANGE 가 후보다. 90일째인 junho SETTLE:QUERY 는 아니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 6-3 정답 · 후보 3건</text>
<text x="220" y="82" font-size="14" fill="#292929" text-anchor="end">seoyeon SALES:QUERY</text>
<rect x="230" y="68" width="6" height="20" rx="4" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="244" y="83" font-size="14" fill="#292929">2일</text>
<text x="220" y="122" font-size="14" fill="#292929" text-anchor="end">seoyeon SALES:CHANGE</text>
<rect x="230" y="108" width="360" height="20" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="598" y="123" font-size="14" fill="#292929" font-weight="700">120일</text>
<text x="220" y="162" font-size="14" fill="#292929" text-anchor="end">junho SALES:QUERY</text>
<rect x="230" y="148" width="273" height="20" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="511" y="163" font-size="14" fill="#292929" font-weight="700">91일</text>
<text x="220" y="202" font-size="14" fill="#292929" text-anchor="end">junho SETTLE:QUERY</text>
<rect x="230" y="188" width="270" height="20" rx="4" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="508" y="203" font-size="14" fill="#292929">90일</text>
<text x="220" y="242" font-size="14" fill="#292929" text-anchor="end">gaeun ACCOUNT:QUERY</text>
<rect x="230" y="228" width="27" height="20" rx="4" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="265" y="243" font-size="14" fill="#292929">9일</text>
<text x="220" y="282" font-size="14" fill="#292929" text-anchor="end">gaeun ACCOUNT:CHANGE</text>
<rect x="230" y="266" width="180" height="24" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="320" y="282.9" font-size="14" fill="#292929" text-anchor="middle">사용 이력 없음</text>
<text x="220" y="322" font-size="14" fill="#292929" text-anchor="end">batch-night SETTLE:QUERY</text>
<rect x="230" y="308" width="3" height="20" rx="4" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="241" y="323" font-size="14" fill="#292929">0일</text>
<line x1="500.0" y1="52" x2="500.0" y2="340" stroke="#9a6200" stroke-width="2" stroke-dasharray="6 4"/>
<text x="500" y="354" font-size="14" fill="#9a6200" text-anchor="middle">90일 기준 (넘어야 후보)</text>
<text x="20" y="386" font-size="15" fill="#292929" font-weight="700">후보: seoyeon SALES:CHANGE · junho SALES:QUERY · gaeun ACCOUNT:CHANGE</text>
</g>
