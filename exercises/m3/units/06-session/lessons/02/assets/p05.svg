<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img">
<title>build_access_list: 사용자마다 역할 권한을 잇고, 예외마다 한 건을 더해 리턴한다</title>
<desc>먼저 USERS 의 사용자마다 role_entries 로 역할 권한 리스트를 얻어 access_list 에 이어 붙입니다. 다음으로 EXCEPTIONS 의 예외마다 source 와 expires 를 적은 한 건을 추가합니다. 실행하면 현황과 사용자별 권한 개수가 나옵니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">실습 6-1 · build_access_list 의 흐름</text>
<rect x="20" y="52" width="150" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="95" y="83.128" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">사용자마다</text>
<text x="95" y="103.512" font-size="14" fill="#292929" text-anchor="middle">USERS.items()</text>
<rect x="200" y="52" width="230" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="315" y="82.512" font-size="14" fill="#292929" text-anchor="middle">role_entries(user, info)</text>
<text x="315" y="102.112" font-size="14" fill="#666660" text-anchor="middle">미리 채운 함수</text>
<polyline points="173,88 196,88" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="460" y="52" width="240" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="580" y="82.512" font-size="14" fill="#292929" text-anchor="middle">access_list =</text>
<text x="580" y="102.112" font-size="14" fill="#292929" text-anchor="middle">access_list + role_list</text>
<polyline points="433,88 456,88" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="160" width="150" height="88" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="95" y="199.128" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">예외마다</text>
<text x="95" y="219.512" font-size="14" fill="#292929" text-anchor="middle">EXCEPTIONS</text>
<rect x="200" y="160" width="230" height="88" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="315" y="187.928" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">entry 만들기</text>
<text x="315" y="209.32" font-size="15" fill="#292929" text-anchor="middle">source: 「예외 N번」</text>
<text x="315" y="230.32" font-size="15" fill="#292929" text-anchor="middle">+ expires (만료 시각)</text>
<polyline points="173,204 196,204" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="460" y="160" width="240" height="88" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="580" y="208.312" font-size="14" fill="#292929" text-anchor="middle">access_list.append(entry)</text>
<polyline points="433,204 456,204" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="580,124 580,150 95,150 95,157" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<text x="572" y="144" font-size="14" fill="#666660" text-anchor="end">사용자를 모두 꺼낸 뒤</text>
<rect x="210" y="276" width="300" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="297.128" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">access_list 리턴</text>
<text x="360" y="317.512" font-size="14" fill="#666660" text-anchor="middle">역할로 받은 권한 + 예외로 받은 권한</text>
<polyline points="580,248 580,302 514,302" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="360" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="388.62" font-size="15" fill="#292929" text-anchor="middle">단계 1 · 현황을 한 줄씩 출력</text>
<rect x="370" y="360" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="388.62" font-size="15" fill="#292929" text-anchor="middle">단계 2 · 사용자별 권한 개수</text>
<polyline points="300,328 185,357" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
