<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>목표: mark_approvals 로 계획 8건마다 승인 상태 세 가지 중 하나를 적습니다</title>
<desc>계획 8건, 민감한 권한 파일, 보안 책임자의 결정(decisions)을 받아 계획마다 approval 키를 적습니다. 값은 승인 불필요, 승인됨, 승인 대기입니다. 실제로 지우는 일은 실습 8-3에서 합니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">목표 — 계획 8건에 승인 상태 적기</text>
<rect x="20" y="60" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="93.2" font-size="15" fill="#292929" text-anchor="middle">계획 8건 (실습 8-1)</text>
<rect x="20" y="130" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="163.2" font-size="15" fill="#292929" text-anchor="middle">config/sensitive.json</text>
<rect x="20" y="200" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="233.2" font-size="15" fill="#292929" text-anchor="middle">decisions (사람의 결정)</text>
<path d="M220 88 L268 130" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<path d="M220 158 L268 158" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<path d="M220 228 L268 186" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="270" y="105" width="190" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="365" y="144.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">mark_approvals</text>
<text x="365" y="165.2" font-size="15" fill="#292929" text-anchor="middle">계획마다</text>
<text x="365" y="186.2" font-size="15" fill="#292929" text-anchor="middle">approval 적기</text>
<path d="M460 140 L508 88" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<path d="M460 160 L508 158" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<path d="M460 180 L508 228" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="510" y="60" width="190" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="605" y="93.2" font-size="15" fill="#292929" text-anchor="middle">승인 불필요</text>
<rect x="510" y="130" width="190" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605" y="163.2" font-size="15" fill="#292929" text-anchor="middle">승인됨</text>
<rect x="510" y="200" width="190" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="605" y="233.2" font-size="15" fill="#292929" text-anchor="middle">승인 대기</text>
<text x="20" y="296" font-size="15" fill="#666660" text-anchor="start">실제로 지우는 일은 실습 8-3에서 합니다</text>
</g>
</svg>
