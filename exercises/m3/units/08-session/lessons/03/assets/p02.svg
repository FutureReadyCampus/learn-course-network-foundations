<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>민감한 권한이거나 영향이 2건 이상이면 보안 책임자의 승인을 받습니다</title>
<desc>승인이 필요한 경우는 두 가지입니다. 데이터를 바꾸는 쓰기 권한(CHANGE)과, 한 번에 권한이 2개 이상 사라지는 회수입니다. 그 밖의 일반 권한 한 건은 바로 회수합니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">왜 승인이 필요한가 — 승인을 받는 두 경우</text>
<rect x="20" y="60" width="330" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185" y="89.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">① 민감한 권한</text>
<text x="185" y="110.2" font-size="15" fill="#292929" text-anchor="middle">데이터를 바꾸는 쓰기 권한</text>
<text x="185" y="131.2" font-size="15" fill="#292929" text-anchor="middle">예: SALES:CHANGE</text>
<rect x="370" y="60" width="330" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="89.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">② 영향 2건 이상</text>
<text x="535" y="110.2" font-size="15" fill="#292929" text-anchor="middle">한 번에 권한이 2개 이상 사라짐</text>
<text x="535" y="131.2" font-size="15" fill="#292929" text-anchor="middle">예: dami 역할 해제</text>
<path d="M185 150 L185 188" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<path d="M535 150 L535 188" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="20" y="190" width="680" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="225.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">둘 중 하나라도 해당 → 보안 책임자의 승인을 받고 회수</text>
<rect x="20" y="272" width="680" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="303.2" font-size="15" fill="#292929" text-anchor="middle">그 밖의 일반 권한 한 건(조회 등)은 승인 없이 바로 회수</text>
</g>
</svg>
