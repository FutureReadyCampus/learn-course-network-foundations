<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 8-3: revoke.py 의 세 함수를 채우고 실행하면 세 단계와 이력 파일이 나옵니다</title>
<desc>revoke.py 에서 remove_exception, apply_plan, execute_revocation 을 채우고 save_log 는 미리 채워져 있습니다. exercise8-3_run.py 를 실행하면 실행 결과, 전후 판정, 이력 저장이 출력되고 revocation_log.json 이 생깁니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 8-3 — 파일 두 개와 직접 쓰는 세 함수</text>
<rect x="20" y="60" width="280" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
