<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>Module 3 다섯 단계 중 Unit 1은 ① 정하기의 시작이고 실습 세 개를 한다</title>
<desc>Module 3 접근통제 자동화는 정하기, 주기, 점검, 거두기, 보고 다섯 단계로 이어진다. Unit 1은 첫 단계인 정하기에서 실습 1-1부터 1-3까지를 한다.</desc>
