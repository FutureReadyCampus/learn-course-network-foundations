<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>단계 1은 기록마다 판정해 건수와 쓴 권한을 모으고 단계 2는 쓰이지 않은 권한을 찾는다</title>
<desc>단계 1은 LOG 를 하나씩 check_permission 으로 판정해 허용이면 allowed·counts·used 를, 거부면 denied·counts 를 늘리고 거부 줄을 출력한다. 단계 2는 ROLES 의 권한 중 used.get(role, []) 에 없는 것을 쓰이지 않음으로 출력한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">exercise1-3_audit.py · 단계 1 과 단계 2</text>
<rect x="20" y="52" width="330" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="79.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 1 · for … in LOG: (15건)</text>
<rect x="20" y="116" width="330" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="143.2" font-size="15" fill="#292929" text-anchor="middle">check_permission 으로 판정</text>
<polyline points="185,97 185,115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="190" width="160" height="124" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="100" y="217.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">허용</text>
<text x="100" y="236.9" font-size="14" fill="#292929" text-anchor="middle">allowed + 1</text>
<text x="100" y="256.9" font-size="14" fill="#292929" text-anchor="middle">counts + 1</text>
<text x="100" y="276.9" font-size="14" fill="#292929" text-anchor="middle">used[role]</text>
<text x="100" y="296.9" font-size="14" fill="#292929" text-anchor="middle">.append(…)</text>
<rect x="190" y="190" width="160" height="124" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="270" y="227.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">거부</text>
<text x="270" y="246.9" font-size="14" fill="#292929" text-anchor="middle">denied + 1</text>
<text x="270" y="266.9" font-size="14" fill="#292929" text-anchor="middle">[거부] 출력</text>
<text x="270" y="286.9" font-size="14" fill="#292929" text-anchor="middle">counts + 1</text>
<polyline points="150,161 100,189" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="220,161 270,189" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="338" width="330" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="366.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">허용 7 · 거부 8</text>
<polyline points="100,315 100,337" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="270,315 270,337" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="20" y="412" font-size="14" fill="#666660">거부된 기록은 used 에 모으지 않는다</text>
<rect x="390" y="52" width="310" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="545" y="79.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 2 · ROLES.items() 반복</text>
