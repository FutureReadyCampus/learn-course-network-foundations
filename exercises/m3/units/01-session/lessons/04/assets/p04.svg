<rect x="390" y="284" width="310" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="545" y="312.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">쓰이지 않음 7줄</text>
<rect x="390" y="350" width="310" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="545" y="377.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">줄일 것 · 남길 것 나누기</text>
<text x="545" y="396.9" font-size="14" fill="#292929" text-anchor="middle">auditor 는 빼고 고른다</text>
<polyline points="545,97 545,115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
