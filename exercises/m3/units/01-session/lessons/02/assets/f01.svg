<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>seoyeon 의 정산 조회 요청은 인증은 통과하지만 인가에서 거부된다</title>
<desc>seoyeon 이 정산 내역(SETTLE)을 조회(QUERY)하려는 요청이 먼저 인증을 거친다. 비밀번호가 맞아 seoyeon 으로 확인되지만, 인가 단계에서 영업 역할에는 SETTLE 조회 권한이 없어 거부된다.</desc>
<defs><marker id="a-f01-u1l2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">인증을 통과해도 인가에서 막힌다</text>
<rect x="40" y="50" width="640" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="77.2" font-size="15" fill="#292929" text-anchor="middle">요청: seoyeon 이 정산 내역(SETTLE)을 조회(QUERY)하려 함</text>
<polyline points="190,94 190,128" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u1l2)"/>
<rect x="60" y="130" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="190.0" y="157.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">인증: 누구인가?</text>
<polyline points="320,152 388,152" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u1l2)"/>
<rect x="390" y="130" width="290" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="535.0" y="157.2" font-size="15" fill="#292929" text-anchor="middle">seoyeon 맞음 (비밀번호 통과)</text>
<polyline points="190,174 190,218" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u1l2)"/>
<rect x="60" y="220" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="190.0" y="247.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">인가: 이 일을 해도 되나?</text>
<polyline points="320,242 388,242" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u1l2)"/>
<rect x="390" y="214" width="290" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535.0" y="236.4" font-size="15" fill="#292929" text-anchor="middle">영업 역할에는</text>
<text x="535.0" y="258.1" font-size="15" fill="#292929" text-anchor="middle">SETTLE 조회 권한이 없음</text>
<polyline points="535,270 535,308" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u1l2)"/>
<rect x="465" y="310" width="140" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="535.0" y="337.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">거부</text>
</g>
</svg>
