<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>앞 사람 흔적을 폴더, 저장소 주인, git 이름, 로그인 네 곳에서 확인하는 표</title><desc>ls 로 폴더를, git remote -v 로 저장소 주인을, git config 로 커밋 이름을, 자격 증명 관리자로 깃허브 로그인을 확인합니다. 폴더가 없으면 4장은 건너뜁니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">2장 · 앞 사람의 흔적을 확인합니다</text><rect x="15" y="58" width="690" height="44" rx="2" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="85.25" font-weight="700">확인할 것</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="155" y="85.25" font-weight="700">명령 · 창</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="425" y="85.25" font-weight="700">이렇게 보면 됩니다</tspan></text><rect x="15" y="102" width="690" height="44" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="129.25">폴더</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="155" y="129.25">ls</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="425" y="129.25">security-agent-toolkit 이 있나</tspan></text><rect x="15" y="146" width="690" height="44" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="173.25">저장소 주인</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="155" y="173.25">git remote -v</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="425" y="173.25">github.com/ 바로 뒤 아이디</tspan></text><rect x="15" y="190" width="690" height="44" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="217.25">커밋 이름</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="155" y="217.25">git config --global user.name</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="425" y="217.25">앞 사람 이름이 나오나</tspan></text><rect x="15" y="234" width="690" height="44" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="261.25">깃허브 로그인</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="155" y="261.25">자격 증명 관리자</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="425" y="261.25">git:https://github.com 항목</tspan></text><text x="360" y="300" font-size="15" text-anchor="middle" fill="#666660">비슷한 폴더도 둘 다 없으면 → 4장을 건너뜁니다</text></g></svg>
