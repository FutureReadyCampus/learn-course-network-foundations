<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>판정 결과를 역할로 허용, 예외로 허용, 거부 세 갈래로 세는 방법</title><desc>이유가 역할 권한이면 역할로 허용, 그 밖의 허용은 예외로 허용으로 세고 예외 번호별 건수도 셉니다. 권한 없음으로 거부됐는데 같은 사람과 권한의 예외가 있으면 만료 뒤 시도로 봅니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">3.2 허용 방식별로 세기</text><rect x="235" y="48" width="250" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="75.25">evaluate_access 결과</tspan></text><line x1="300" y1="94" x2="125" y2="138" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><line x1="360" y1="94" x2="360" y2="138" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><line x1="420" y1="94" x2="595" y2="138" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="15" y="142" width="220" height="135" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="125" y="194.8" font-weight="700">① 역할로 허용</tspan><tspan x="125" dy="19.6">이유 = &quot;역할 권한&quot;</tspan><tspan x="125" dy="19.6">counts 에 +1</tspan></text><rect x="250" y="142" width="220" height="135" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="185" font-weight="700">② 예외로 허용</tspan><tspan x="360" dy="19.6">그 밖의 허용</tspan><tspan x="360" dy="19.6">이유 = &quot;예외 N번&quot;</tspan><tspan x="360" dy="19.6">used[&quot;예외 N번&quot;] 도 +1</tspan></text><rect x="485" y="142" width="220" height="135" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="595" y="185" font-weight="700">③ 거부</tspan><tspan x="595" dy="19.6">counts 에 +1</tspan><tspan x="595" dy="19.6">권한 없음 + 같은 예외 있음</tspan><tspan x="595" dy="19.6">→ [만료 뒤 시도]</tspan></text><rect x="15" y="295" width="690" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="323.1" font-weight="700">세는 모양 (Unit 1 실습 1-3)</tspan><tspan x="360" dy="19.6">old_count = counts.get(키, 0) → counts[키] = old_count + 1</tspan></text></g></svg>
