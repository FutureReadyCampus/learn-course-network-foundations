<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img"><title>evaluate_access 는 역할 판정을 먼저 하고, 「권한 없음」일 때만 예외를 찾아 판정합니다</title><desc>evaluate_access 는 check_permission 으로 역할 판정을 합니다. 허용이면 역할 권한으로, 없는 사용자 · 퇴사 · 역할이 없음이면 그 이유 그대로 끝납니다. 「권한 없음」일 때만 find_exception 으로 지금 유효한 예외를 찾아 있으면 예외 N번으로 허용, 없으면 권한 없음으로 거부합니다.</desc><defs><marker id="a-f01-0205" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="30" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">3.1 판정 순서</text><rect x="20" y="50" width="440" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="240.0" y="80.2" font-weight="700">evaluate_access(사용자, 자원, 행위, 지금 시각)</tspan></text><path d="M170,100 V146" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><rect x="20" y="150" width="320" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="180.0" y="177.1" font-weight="700">[역할 판정]</tspan><tspan x="180.0" y="197.4">check_permission 으로 판정</tspan></text><rect x="500" y="128" width="200" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="600.0" y="156.2" font-weight="700">허용: 역할 권한</tspan></text><path d="M340,170 H356 V151 H496" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><text x="366" y="144" font-size="14" text-anchor="start" fill="#292929">허용</text><rect x="500" y="192" width="200" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="600.0" y="216.9" font-weight="700">거부: 그 이유 그대로</tspan><tspan x="600.0" y="237.1">없는 사용자 · 퇴사 ·</tspan><tspan x="600.0" y="257.4">역할이 없음</tspan><tspan x="600.0" y="277.6">(골격의 3번)</tspan></text><path d="M340,196 H356 V242 H496" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><text x="366" y="264" font-size="14" text-anchor="start" fill="#292929">거부</text><text x="366" y="282" font-size="14" text-anchor="start" fill="#292929">(그 밖의 이유)</text><path d="M170,214 V316" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><text x="180" y="262" font-size="14" text-anchor="start" fill="#292929" font-weight="700">거부(권한 없음)</text><text x="180" y="281" font-size="14" text-anchor="start" fill="#292929">일 때만 아래로</text><rect x="20" y="320" width="320" height="84" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="180.0" y="347.0" font-weight="700">[예외 판정]</tspan><tspan x="180.0" y="367.2">find_exception 으로</tspan><tspan x="180.0" y="387.5">지금 유효한 예외 찾기</tspan></text><rect x="500" y="318" width="200" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="600.0" y="346.2" font-weight="700">허용: 예외 N번</tspan></text><path d="M340,350 H356 V341 H496" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><text x="366" y="334" font-size="14" text-anchor="start" fill="#292929">있음</text><rect x="500" y="392" width="200" height="46" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="600.0" y="420.2" font-weight="700">거부: 권한 없음</tspan></text><path d="M340,376 H356 V415 H496" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0205)"/><text x="366" y="432" font-size="14" text-anchor="start" fill="#292929">없음</text></g></svg>
