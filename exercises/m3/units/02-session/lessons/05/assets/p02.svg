<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>판정이 두 곳에 흩어졌을 때와 한 함수에 모았을 때의 비교</title><desc>역할 판정과 예외 판정이 따로 있으면 정산 포털이 어느 결과를 믿을지 모릅니다. 한 함수에 모으면 규칙이 한 곳에 있고, 예외는 역할 권한이 없을 때만 보며 사람이 거부 대상이면 열지 않습니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">왜 판정을 한 함수에 모으는가</text><rect x="15" y="55" width="330" height="130" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="180" y="93.75" font-weight="700">지금: 판정이 두 곳</tspan><tspan x="180" dy="21">역할로 허용되나?</tspan><tspan x="180" dy="21">예외로 허용되나?</tspan><tspan x="180" dy="21">→ 포털이 무엇을 믿을지 모름</tspan></text><rect x="375" y="55" width="330" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="540" y="104.25" font-weight="700">바꾼 뒤: 한 함수</tspan><tspan x="540" dy="21">evaluate_access 하나가</tspan><tspan x="540" dy="21">허용 · 거부와 이유를 함께</tspan></text><rect x="15" y="205" width="690" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="234.25" font-weight="700">순서 규칙</tspan><tspan x="360" dy="21">예외는 역할 권한이 없을 때만 봅니다</tspan><tspan x="360" dy="21">없는 사용자 · 퇴사자 · 역할 없음 → 예외가 있어도 거부</tspan></text><text x="360" y="330" font-size="15" text-anchor="middle" fill="#666660">불러 쓰는 곳: Unit 4 의 req_create.py · req_review.py · req_grant.py</text></g></svg>
