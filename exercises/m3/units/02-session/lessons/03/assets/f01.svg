<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img">
<title>assign_role 은 역할을 확인해 부여하고, revoke_access 는 사용자를 확인해 회수한다</title>
<desc>assign_role 은 role 이 ROLES 에 없으면 사용자 항목을 바꾸지 않고 (False, "없는 역할")을 리턴하고, 있으면 users[name] 을 새 역할·재직 중으로 바꾼 뒤 (True, "부여")를 리턴한다. revoke_access 는 name 이 users 에 없으면 (False, "없는 사용자"), 있으면 employed 를 False 로 바꾸고 (True, "회수")를 리턴한다.</desc>
<defs><marker id="a-f01-u2l3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<rect x="20" y="20" width="380" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="45.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">assign_role(users, name, role)</text>
<polyline points="210,60 210,83" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<rect x="20" y="85" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="210.0" y="110.2" font-size="15" fill="#292929" text-anchor="middle">role 이 ROLES 에 있나?</text>
<polyline points="400,105 458,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<text x="429" y="97" font-size="14" fill="#666660" text-anchor="middle">없음</text>
<rect x="460" y="77" width="240" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580.0" y="99.8" font-size="14" fill="#292929" text-anchor="middle">(False, "없는 역할")</text>
<text x="580.0" y="120.0" font-size="14" fill="#292929" text-anchor="middle">사용자 항목은 바꾸지 않는다</text>
<polyline points="210,125 210,150" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<text x="222" y="142" font-size="14" fill="#666660" text-anchor="start">있음</text>
<rect x="20" y="152" width="380" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="181.8" font-size="14" fill="#292929" text-anchor="middle">users[name] = {"role": role,</text>
<text x="210.0" y="202.1" font-size="14" fill="#292929" text-anchor="middle">"employed": True}</text>
<polyline points="210,222 210,245" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<rect x="130" y="247" width="160" height="38" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="210.0" y="271.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(True, "부여")</text>
<line x1="20" y1="306" x2="700" y2="306" stroke="#dededb" stroke-width="1.5"/>
<rect x="20" y="326" width="380" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="351.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">revoke_access(users, name)</text>
<polyline points="210,366 210,389" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<rect x="20" y="391" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="210.0" y="416.2" font-size="15" fill="#292929" text-anchor="middle">name 이 users 에 있나?</text>
<polyline points="400,411 458,411" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<text x="429" y="403" font-size="14" fill="#666660" text-anchor="middle">없음</text>
<rect x="460" y="391" width="240" height="40" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580.0" y="415.9" font-size="14" fill="#292929" text-anchor="middle">(False, "없는 사용자")</text>
<polyline points="210,431 210,456" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<text x="222" y="448" font-size="14" fill="#666660" text-anchor="start">있음</text>
<rect x="20" y="458" width="380" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="486.9" font-size="14" fill="#292929" text-anchor="middle">users[name]["employed"] = False</text>
<polyline points="210,506 210,529" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01-u2l3)"/>
<rect x="130" y="531" width="160" height="38" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="210.0" y="555.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(True, "회수")</text>
</g>
</svg>
