<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>실습 2-1 에서 쓴 코드와 말을 네 칸으로 정리한 요점 지도</title><desc>입사와 이동은 assign_role, 퇴사는 employed 를 False 로 바꾸고 항목은 남깁니다. in 으로 있는지 묻고, 함수에 넘긴 USERS 가 check_permission 이 읽는 것과 같은 딕셔너리입니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">실습 2-1 정리</text><rect x="15" y="55" width="335" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="182.5" y="100.3" font-weight="700">입사 · 이동</tspan><tspan x="182.5" dy="19.6">assign_role(users, name, role)</tspan><tspan x="182.5" dy="19.6">없는 역할 → (False, &quot;없는 역할&quot;)</tspan></text><rect x="370" y="55" width="335" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="537.5" y="100.3" font-weight="700">퇴사</tspan><tspan x="537.5" dy="19.6">users[name][&quot;employed&quot;] = False</tspan><tspan x="537.5" dy="19.6">사용자 항목은 삭제하지 않음</tspan></text><rect x="15" y="190" width="335" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="182.5" y="235.3" font-weight="700">있는지 묻기</tspan><tspan x="182.5" dy="19.6">name in users</tspan><tspan x="182.5" dy="19.6">role not in ROLES</tspan></text><rect x="370" y="190" width="335" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="537.5" y="235.3" font-weight="700">바뀐 사용자로 판정</tspan><tspan x="537.5" dy="19.6">함수에 넘긴 USERS 는</tspan><tspan x="537.5" dy="19.6">check_permission 이 읽는 USERS</tspan></text></g></svg>
