<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>Unit 9에서는 조건 판정, 판정 서버, 깃허브 올리기를 했고 Unit 10은 로그로 보고한다</title>
<desc>실습 9-1에서 업무 시간과 접속 위치 조건을 확인했고, 실습 9-2에서 판정 서버를 만들어 응답과 로그를 대조했으며, 마무리에서 깃허브에 올렸다. Unit 10은 server_log.jsonl 로 점검 체크리스트와 주간 보고서를 만든다.</desc>
<defs><marker id="a-p09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Unit 9 마무리 · 확인 체크리스트</text>
<rect x="20" y="52" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="70" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="58" y="82" font-size="15" fill="#292929">기본 판정 뒤에 업무 시간과 접속 위치 조건을 확인했다</text>
<text x="684" y="82" font-size="15" fill="#2f6fd0" text-anchor="end" font-weight="700">실습 9-1</text>
<rect x="20" y="110" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="128" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="58" y="140" font-size="15" fill="#292929">판정 서버를 만들고 응답과 서버 로그를 대조했다</text>
<text x="684" y="140" font-size="15" fill="#2f6fd0" text-anchor="end" font-weight="700">실습 9-2</text>
<rect x="20" y="168" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="186" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="58" y="198" font-size="15" fill="#292929">이번 Unit에서 만든 파일과 보고서를 깃허브에 올렸다</text>
<text x="684" y="198" font-size="15" fill="#2f6fd0" text-anchor="end" font-weight="700">마무리</text>
<rect x="20" y="236" width="250" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="145" y="276.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">server_log.jsonl</text>
<text x="145" y="299.7" font-size="15" fill="#292929" text-anchor="middle">Unit 9 서버가 남긴 로그</text>
<polyline points="271,282 329,282" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p09)"/>
<rect x="330" y="236" width="370" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="515" y="265.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다음: Unit 10</text>
<text x="515" y="288.8" font-size="15" fill="#292929" text-anchor="middle">점검 체크리스트 · 주간 보고서</text>
<text x="515" y="310.6" font-size="15" fill="#292929" text-anchor="middle">Module 3 마무리</text>
</g>
