<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>설명하는 답은 정답의 한 예와 핵심이 같으면 맞다</title>
<desc>정답 Page의 설명은 한 예이므로 표현이 달라도 된다. 내 답의 핵심이 정답 예의 핵심과 같은지 비교하고, 출력은 정답의 출력과 같은지 줄 단위로 맞춰 본다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답을 보는 방법</text>
<rect x="20" y="60" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="99.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">내 답</text>
<text x="120" y="122.7" font-size="15" fill="#292929" text-anchor="middle">보고서에 쓴 설명</text>
<rect x="20" y="170" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="209.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">정답의 한 예</text>
<text x="120" y="232.7" font-size="15" fill="#292929" text-anchor="middle">이 Page의 설명</text>
<polyline points="221,105 279,150" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="221,215 279,170" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="280" y="120" width="180" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="370" y="165.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">핵심이 같나?</text>
<polyline points="461,140 519,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="461,180 519,215" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="520" y="60" width="180" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="99.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">같다</text>
<text x="610" y="122.7" font-size="15" fill="#292929" text-anchor="middle">표현이 달라도 맞음</text>
<rect x="520" y="170" width="180" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="610" y="209.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다르다</text>
<text x="610" y="232.7" font-size="15" fill="#292929" text-anchor="middle">왜 · 관제에서는 읽기</text>
<text x="20" y="296" font-size="15" fill="#666660">출력은 정답의 출력과 줄마다 맞춰 보고, 「자주 틀리는 곳」에서 실수를 찾습니다.</text>
</g>
</svg>
