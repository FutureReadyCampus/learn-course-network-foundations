<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>정답 마무리: git status 로 .env 가 없는지 본 뒤 add, commit, push 한다</title>
<desc>cd .. 로 security-agent-toolkit 에 가서 git status 를 친다. 한 예로 Untracked files 가 열아홉 줄이고 .env · .venv 는 없다. 그 뒤 git add, git commit, git push 로 올린다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 마무리 · 올리기 전 확인</text>
<rect x="20" y="56" width="200" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="95.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">cd .. · pwd</text>
<text x="120" y="118.7" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<polyline points="221,101 259,101" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="260" y="56" width="200" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="95.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.env · .venv</text>
<text x="360" y="118.7" font-size="15" fill="#292929" text-anchor="middle">없는지 확인</text>
<polyline points="461,101 499,101" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="500" y="56" width="200" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="95.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">git add .</text>
<text x="600" y="118.7" font-size="15" fill="#292929" text-anchor="middle">commit · push</text>
<text x="20" y="186" font-size="16" fill="#292929" font-weight="700">Untracked files: 한 예 (Unit 7까지 올렸고 __pycache__ 가 없을 때)</text>
<rect x="20" y="204" width="140" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="230.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.py</text>
<text x="90" y="253.7" font-size="15" fill="#292929" text-anchor="middle">11개</text>
<rect x="173" y="204" width="140" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="243" y="230.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.json</text>
<text x="243" y="253.7" font-size="15" fill="#292929" text-anchor="middle">3개</text>
<rect x="326" y="204" width="200" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="426" y="230.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">server_log.jsonl</text>
<text x="426" y="253.7" font-size="15" fill="#292929" text-anchor="middle">1개</text>
<rect x="539" y="204" width="140" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="609" y="230.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.md</text>
<text x="609" y="253.7" font-size="15" fill="#292929" text-anchor="middle">4개</text>
<text x="20" y="304" font-size="15" fill="#292929">합계 19줄 · 줄 수와 이름은 학생마다 다를 수 있습니다.</text>
<text x="20" y="332" font-size="15" fill="#666660">server_log.jsonl 도 함께 올라가야 Unit 10이 같은 로그에서 시작합니다.</text>
</g>
</svg>
