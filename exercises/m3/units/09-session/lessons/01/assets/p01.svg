<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Unit 9는 Unit 2의 판정 함수에 조건을 더하고, 그 판정을 서버로 만든다</title>
<desc>Unit 2의 evaluate_access 와 Unit 3의 load_json 을 가져다 쓴다. 실습 9-1은 conditional.py 로 시간과 접속 위치 조건을 확인하고, 실습 9-2는 access_server.py 서버로 요청을 받아 로그를 남긴 뒤 깃허브에 올린다.</desc>
