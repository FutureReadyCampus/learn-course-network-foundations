<text x="164" y="145" font-size="15" fill="#292929">조건 때문에 거부된 요청의 건수와 번호</text>
<rect x="20" y="166" width="96" height="106" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
