<text x="140" y="190" font-size="15" fill="#292929" font-weight="700">5번 요청: 이유를 하나만 vs 모두 알려 주기</text>
<rect x="142" y="201" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="213" font-size="15" fill="#292929">정상 사용자에게 나은 쪽과 이유</text>
