<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" role="img">
<title>실습 9-1 보고서에는 허용 · 거부 건수와 조건으로 요청마다 막는 이유를 쓴다</title>
<desc>실습 9-1 보고서의 (가) (나) (다) 세 칸에 채울 내용을 체크리스트로 보여 준다. (나)는 정상 사용자, 계정을 가로챈 사람, 관제 담당자로 나누어 답한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 9-1 보고서 · 채울 칸</text>
<rect x="20" y="50" width="96" height="106" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="68" y="109" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="126" y="50" width="574" height="106" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="74" font-size="15" fill="#292929" font-weight="700">실행한 출력</text>
