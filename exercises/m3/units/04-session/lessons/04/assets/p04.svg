<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>요청서의 user·permission·until·reason 이 예외의 키로 옮겨지고, 예외 번호는 요청서에 다시 적힌다</title>
<desc>왼쪽 요청서의 키가 오른쪽 예외의 키로 옮겨집니다. until 은 이름이 바뀌어 expires 가 되고, id 는 len(EXCEPTIONS) + 1 로 새로 정합니다. 만든 예외의 id 는 요청서의 exception_id 에 적습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">요청서가 예외가 되는 방법</text>
<text x="40" y="66" font-size="16" fill="#666660" text-anchor="start" font-weight="700">요청서 (request)</text>
<text x="440" y="66" font-size="16" fill="#666660" text-anchor="start" font-weight="700">예외 (EXCEPTIONS 에 추가)</text>
<rect x="40" y="80" width="220" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="150" y="104.6" font-size="15" fill="#292929" text-anchor="middle">(없음 · 새 번호)</text>
<line x1="260" y1="100" x2="438" y2="100" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="440" y="80" width="260" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="104.6" font-size="15" fill="#292929" text-anchor="middle">id = len(EXCEPTIONS) + 1</text>
<rect x="40" y="132" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="150" y="156.6" font-size="15" fill="#292929" text-anchor="middle">user</text>
<line x1="260" y1="152" x2="438" y2="152" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="440" y="132" width="260" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="156.6" font-size="15" fill="#292929" text-anchor="middle">user</text>
<rect x="40" y="184" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="150" y="208.6" font-size="15" fill="#292929" text-anchor="middle">permission</text>
<line x1="260" y1="204" x2="438" y2="204" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="440" y="184" width="260" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="208.6" font-size="15" fill="#292929" text-anchor="middle">permission</text>
<rect x="40" y="236" width="220" height="40" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="150" y="260.6" font-size="15" fill="#292929" text-anchor="middle">until</text>
<line x1="260" y1="256" x2="438" y2="256" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="349" y="249" font-size="14" fill="#666660" text-anchor="middle">이름이 바뀜</text>
<rect x="440" y="236" width="260" height="40" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="570" y="260.6" font-size="15" fill="#292929" text-anchor="middle">expires</text>
<rect x="40" y="288" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="150" y="312.6" font-size="15" fill="#292929" text-anchor="middle">reason</text>
<line x1="260" y1="308" x2="438" y2="308" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="440" y="288" width="260" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="312.6" font-size="15" fill="#292929" text-anchor="middle">reason</text>
<rect x="40" y="348" width="380" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="230" y="376.4" font-size="14" fill="#292929" text-anchor="middle">request["exception_id"] = exception["id"]</text>
<text x="440" y="368" font-size="15" fill="#292929" text-anchor="start">예외 id 를 요청서에 다시 적음</text>
<text x="440" y="390" font-size="14" fill="#666660" text-anchor="start">예외가 다섯 건이면 새 번호는 6</text>
</svg>
