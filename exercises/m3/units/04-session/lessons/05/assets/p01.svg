<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>정답은 한 예이므로 내 답의 핵심이 같으면 맞은 것으로 본다</title>
<desc>내 답을 정답 예와 비교할 때 표현이 아니라 핵심이 같은지를 봅니다. 핵심이 같으면 맞습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">정답을 보는 방법</text>
<rect x="30" y="70" width="160" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="99.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">내 답</text>
<text x="110" y="120.1" font-size="15" fill="#292929" text-anchor="middle">보고서에 쓴 것</text>
<line x1="190" y1="105" x2="228" y2="105" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="230" y="70" width="180" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="99.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">정답 (한 예)</text>
<text x="320" y="120.1" font-size="15" fill="#292929" text-anchor="middle">이 문서의 답</text>
<line x1="410" y1="105" x2="518" y2="105" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<text x="464" y="94" font-size="14" fill="#666660" text-anchor="middle">핵심이 같으면</text>
<rect x="520" y="70" width="180" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="99.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">맞음</text>
<text x="610" y="120.1" font-size="15" fill="#292929" text-anchor="middle">표현이 달라도 됨</text>
<rect x="30" y="180" width="670" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="214.6" font-size="15" fill="#292929" text-anchor="middle">코드도 주석이 말한 일을 하면 줄 수가 달라도 맞습니다</text>
</svg>
