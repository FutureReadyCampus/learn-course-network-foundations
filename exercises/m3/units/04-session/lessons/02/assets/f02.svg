<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img"><title>create_request 는 사용자 · 이유 · 만료 시각을 차례로 검사하고, 모두 통과하면 요청서를 추가합니다</title><desc>create_request 는 user 가 USERS 에 있는지, reason 이 빈 문자열인지, until 이 received_at 보다 늦은지를 차례로 검사합니다. 하나라도 걸리면 (False, 이유) 를 리턴하고, 모두 통과하면 요청서 딕셔너리를 만들어 REQUESTS 에 추가한 뒤 (True, 요청서) 를 리턴합니다. 이때 status 는 "reviewing" 입니다.</desc><defs><marker id="a-f02-0402" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="28" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">1.2 접수할 수 없는 요청 걸러 내기</text><rect x="40" y="46" width="620" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="350.0" y="72.9" font-weight="700">create_request(user, resource, action, until, reason, received_at)</tspan></text><path d="M200,90 V120" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><rect x="40" y="124" width="320" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="154.2" font-weight="700">user 가 USERS 에 있나?</tspan></text><rect x="480" y="122" width="220" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="590.0" y="144.5">(False,</tspan><tspan x="590.0" y="163.4">"등록되지 않은 사용자")</tspan></text><path d="M360,149 H476" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="372" y="141" font-size="14" text-anchor="start" fill="#292929">없음</text><path d="M200,174 V226" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="210" y="207" font-size="14" text-anchor="start" fill="#292929">있음</text><rect x="40" y="230" width="320" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="260.2" font-weight="700">reason 이 빈 문자열인가?</tspan></text><rect x="480" y="228" width="220" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="590.0" y="250.5">(False,</tspan><tspan x="590.0" y="269.4">"이유가 없음")</tspan></text><path d="M360,255 H476" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="372" y="247" font-size="14" text-anchor="start" fill="#292929">빈 문자열</text><path d="M200,280 V332" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="210" y="313" font-size="14" text-anchor="start" fill="#292929">아님</text><rect x="40" y="336" width="320" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="366.2" font-weight="700">until 이 received_at 보다 늦은가?</tspan></text><rect x="480" y="334" width="220" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="590.0" y="356.4">(False,</tspan><tspan x="590.0" y="375.3">"만료 시각이 이미 지났음")</tspan></text><path d="M360,361 H476" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="372" y="353" font-size="14" text-anchor="start" fill="#292929">늦지 않음</text><path d="M200,386 V442" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><text x="210" y="416" font-size="14" text-anchor="start" fill="#292929">늦음</text><rect x="40" y="446" width="320" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="200.0" y="471.1">요청서 딕셔너리를 만들어</tspan><tspan x="200.0" y="491.4">REQUESTS 에 추가한다</tspan></text><path d="M200,506 V532" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f02-0402)"/><rect x="40" y="536" width="320" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="200.0" y="558.4" font-weight="700">(True, 요청서)</tspan><tspan x="200.0" y="577.3">status 는 "reviewing"</tspan></text></g></svg>
