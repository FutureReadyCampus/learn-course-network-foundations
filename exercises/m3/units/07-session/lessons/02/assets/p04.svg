<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>generate_report 는 식별 키로 두 점검의 이유를 모아 이유가 있는 권한만 후보로 담는다</title><desc>make_stale_reason 은 식별 키에서 걸린 이유로 가는 딕셔너리를, make_unused_keys 는 식별 키 리스트를 만든다. 현황의 권한마다 collect_reasons 로 이유를 모으고, 하나라도 있으면 복사해 findings 에 넣는다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 7-1 · 다섯 함수가 이어지는 길</text>
<rect x="20" y="56" width="210" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="125" y="82.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">make_stale_reason</text>
<text x="125" y="103.75" font-size="14" fill="#666660" text-anchor="middle">식별 키 → 걸린 이유</text>
<rect x="255" y="56" width="210" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="360" y="82.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">entry_key</text>
<text x="360" y="103.75" font-size="14" fill="#666660" text-anchor="middle">user:permission:source</text>
<rect x="490" y="56" width="210" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="595" y="82.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">make_unused_keys</text>
<text x="595" y="103.75" font-size="14" fill="#666660" text-anchor="middle">식별 키 리스트</text>
<line x1="255" y1="88" x2="234" y2="88" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="465" y1="88" x2="486" y2="88" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="140" y="150" width="440" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="176.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">현황의 권한 한 건 → key = entry_key(entry)</text>
<text x="360" y="197.75" font-size="15" fill="#292929" text-anchor="middle">reasons = collect_reasons(key, …)</text>
<line x1="125" y1="122" x2="200" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="595" y1="122" x2="520" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="236" width="330" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="185" y="269.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">key in stale_reason ?</text>
<text x="185" y="290.75" font-size="14" fill="#666660" text-anchor="middle">→ stale_reason[key] 추가</text>
<rect x="370" y="236" width="330" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="535" y="269.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">key in unused_keys ?</text>
<text x="535" y="290.75" font-size="14" fill="#666660" text-anchor="middle">→ "90일 넘게 안 씀(이력 없음 포함)"</text>
<line x1="300" y1="216" x2="200" y2="232" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="420" y1="216" x2="520" y2="232" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="140" y="336" width="240" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="260" y="360.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">len(reasons) &gt; 0 ?</text>
<text x="260" y="381.75" font-size="14" fill="#666660" text-anchor="middle">복사 + reasons 키</text>
<line x1="384" y1="366" x2="426" y2="366" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<text x="405" y="356" font-size="14" fill="#666660" text-anchor="middle">있다</text>
<rect x="430" y="336" width="270" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="565" y="371.25" font-size="15" fill="#292929" text-anchor="middle">findings 에 추가</text>
<line x1="185" y1="316" x2="220" y2="332" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="535" y1="316" x2="330" y2="332" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
</g>
</svg>
