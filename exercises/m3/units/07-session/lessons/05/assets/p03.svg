<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 7-2 보고서 (가)~(다)와 깃허브 올리기 마무리 칸을 채웁니다</title>
<desc>실습 7-2 보고서에서 채울 칸을 질문별로 정리했습니다. (나)와 (다)는 핵심 질문입니다. 마지막 칸은 git status 의 Untracked files 줄 수와 .env · .venv 유무입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 7-2 보고서와 마무리 — 채울 칸 체크리스트</text>
<rect x="20" y="60" width="100" height="72" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="101.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="130" y="60" width="570" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="90.8" font-size="15" fill="#292929" text-anchor="start">① 출력 전체   ② 회수 대상 · 회수 제외 건수</text>
<text x="142" y="111.8" font-size="15" fill="#292929" text-anchor="start">③ 회수 제외된 후보와 제외한 이유</text>
<rect x="20" y="144" width="100" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70" y="174.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="70" y="195.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="144" width="570" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="174.8" font-size="15" fill="#292929" text-anchor="start">① dami SALES:QUERY 를 제외하지 않게 만든 이유</text>
<text x="142" y="195.8" font-size="15" fill="#292929" text-anchor="start">② 제외했다면 생길 수 있는 위험</text>
<rect x="20" y="228" width="100" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70" y="258.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="70" y="279.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="228" width="570" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="258.8" font-size="15" fill="#292929" text-anchor="start">① 다시 확인하지 않은 권한에 생기는 문제</text>
<text x="142" y="279.8" font-size="15" fill="#292929" text-anchor="start">② 리스트에 추가할 때 확인하는 사람과 이유</text>
<rect x="20" y="312" width="100" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="70" y="342.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마무리</text>
<text x="70" y="363.8" font-size="15" fill="#292929" text-anchor="middle">(가)</text>
<rect x="130" y="312" width="570" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="342.8" font-size="15" fill="#292929" text-anchor="start">① Untracked files: 아래 줄 수</text>
<text x="142" y="363.8" font-size="15" fill="#292929" text-anchor="start">② .env · .venv 가 있었는지</text>
</g>
