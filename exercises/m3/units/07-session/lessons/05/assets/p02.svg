<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img">
<title>실습 7-1 보고서는 (가) 출력과 건수, (나) 이유 둘, (다) 담는 방법 비교를 채웁니다</title>
<desc>실습 7-1 보고서에서 채울 칸을 질문별로 정리했습니다. (나)와 (다)는 핵심 질문입니다. 각 칸의 번호는 보고서의 쓸 내용 번호와 같습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 7-1 보고서 — 채울 칸 체크리스트</text>
<rect x="20" y="60" width="100" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="105.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="130" y="60" width="570" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="94.8" font-size="15" fill="#292929" text-anchor="start">① 출력 전체(코드 상자)   ② 후보 건수</text>
<text x="142" y="115.8" font-size="15" fill="#292929" text-anchor="start">③ 이유가 둘인 후보 건수   ④ 후보가 아닌 권한</text>
<rect x="20" y="156" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70" y="190.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="70" y="211.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="156" width="570" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="190.8" font-size="15" fill="#292929" text-anchor="start">① 고른 후보와 두 이유   ② 처리 순서에 주는 도움</text>
<text x="142" y="211.8" font-size="15" fill="#292929" text-anchor="start">③ reasons 리스트로 담는 장점</text>
<rect x="20" y="252" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70" y="286.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="70" y="307.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="252" width="570" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="142" y="286.8" font-size="15" fill="#292929" text-anchor="start">① 후보만 담기와 전부 담기 중 어느 쪽이 나은지</text>
<text x="142" y="307.8" font-size="15" fill="#292929" text-anchor="start">② 그 이유</text>
</g>
</svg>
