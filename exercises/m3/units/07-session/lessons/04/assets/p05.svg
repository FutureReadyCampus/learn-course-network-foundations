<rect x="40" y="162" width="280" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="180" y="184.8" font-size="15" fill="#292929" text-anchor="middle">report_exclude.py</text>
