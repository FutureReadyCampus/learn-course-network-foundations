<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" role="img">
<title>상황은 확인, 원인, 고치기, 다시 확인의 네 단계로 푼다</title>
<desc>먼저 로그나 점검 결과로 확인한다. 원인은 사람의 일, 데이터 문제, 규칙 문제 중 하나로 가린다. 고치기는 새로 넣기, 값 바꾸기, 지우기 중 하나이고, 끝으로 다시 실행해 출력을 본다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
