<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 10-3 정답: 원인 세 종류와 데이터·규칙 수정 상황 구분</title>
<desc>원인은 데이터 문제, 규칙 문제, 사람의 일로 나눈다. 데이터를 고친 상황은 1·2·3·5·6, 규칙을 고친 상황은 7과 8 케이스 B, 4는 요청 절차를 새로 만든 상황이다. 규칙을 잘못 풀면 해당 요청이 한꺼번에 영향을 받아 더 위험하다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 10-3 정답 · 원인 세 종류와 (가)</text>
<rect x="20" y="66" width="214" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="127" y="101.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">데이터 문제</text>
<text x="127" y="122.6" font-size="14" fill="#292929" text-anchor="middle">파일 내용이 없거나 틀림</text>
<rect x="253" y="66" width="214" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="101.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">규칙 문제</text>
<text x="360" y="122.6" font-size="14" fill="#292929" text-anchor="middle">기준이 비었거나 안 맞음</text>
<rect x="486" y="66" width="214" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="593" y="101.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">사람의 일</text>
<text x="593" y="122.6" font-size="14" fill="#292929" text-anchor="middle">입사 · 퇴사 · 부서 이동</text>
<text x="20" y="182" font-size="15" fill="#292929" font-weight="700">(가) 무엇을 고쳤나</text>
<rect x="20" y="196" width="214" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="127" y="230.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">데이터를 고침</text>
<text x="127" y="253" font-size="15" fill="#292929" text-anchor="middle">상황 1 · 2 · 3 · 5 · 6</text>
<rect x="253" y="196" width="214" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="230.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">규칙을 고침</text>
<text x="360" y="253" font-size="15" fill="#292929" text-anchor="middle">상황 7 · 8(케이스 B)</text>
<rect x="486" y="196" width="214" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="593" y="230.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">절차를 새로 만듦</text>
<text x="593" y="253" font-size="15" fill="#292929" text-anchor="middle">상황 4</text>
<rect x="20" y="296" width="680" height="66" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="324.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">규칙 쪽 실수가 더 위험</text>
<text x="360" y="345.6" font-size="14" fill="#292929" text-anchor="middle">데이터는 한 사람에서 끝나지만, 규칙은 해당 요청 모두에 영향</text>
</g>
</svg>
