<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답의 설명은 한 예이고, 핵심이 같으면 맞은 답이다</title>
<desc>내 답을 정답에 적힌 한 예와 비교한다. 표현이 달라도 핵심이 같으면 맞다. 핵심이 다르면 정답의 왜와 자주 틀리는 곳을 다시 읽는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답을 보는 방법</text>
<rect x="20" y="90" width="150" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="124.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">내 답</text>
<text x="95" y="147" font-size="15" fill="#292929" text-anchor="middle">보고서에 쓴 것</text>
<rect x="210" y="90" width="170" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="295" y="124.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">정답의 한 예</text>
<text x="295" y="147" font-size="15" fill="#292929" text-anchor="middle">와 비교</text>
<rect x="420" y="90" width="120" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="480" y="124.2" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">핵심이</text>
<text x="480" y="147.4" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">같은가?</text>
<line x1="172" y1="130" x2="206" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="382" y1="130" x2="416" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="590" y="70" width="110" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="645" y="103.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">맞음</text>
<rect x="590" y="150" width="110" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="645" y="183.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다시 읽기</text>
<path d="M542,115 L566,115 L566,98 L586,98" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<path d="M542,145 L566,145 L566,178 L586,178" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="570" y="88" font-size="14" fill="#666660" text-anchor="end">예</text>
<text x="570" y="200" font-size="14" fill="#666660" text-anchor="end">아니오</text>
<rect x="20" y="220" width="680" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="253.4" font-size="15" fill="#292929" text-anchor="middle">표현이 달라도 핵심이 같으면 맞습니다 · 다르면 「왜」 · 「자주 틀리는 곳」을 봅니다</text>
</g>
</svg>
