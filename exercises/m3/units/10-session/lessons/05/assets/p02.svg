<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 10-1 정답: 퇴사자·부서 점검은 실패, 만료 예외 점검은 통과</title>
<desc>사용자 6명과 예외 4개를 점검하면 퇴사자 계정 점검은 dami, 부서와 역할 점검은 junho 로 실패하고 만료 예외 점검은 통과한다. 예외 3번은 dami 의 것이라 퇴사자 점검과 함께 읽어야 한다. 부등호를 &gt;= 로 쓰면 예외 네 개가 모두 걸린다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 10-1 정답 · 점검 결과</text>
<text x="20" y="56" font-size="14" fill="#666660">단계 1: 점검 대상 - 사용자 6 명 · 예외 4 개</text>
<rect x="20" y="74" width="230" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="104" font-size="15" fill="#292929" font-weight="700">퇴사자 계정 점검</text>
<rect x="260" y="74" width="100" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="310" y="103.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실패</text>
<rect x="370" y="74" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="386" y="104" font-size="15" fill="#292929">['dami']</text>
<rect x="20" y="132" width="230" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="162" font-size="15" fill="#292929" font-weight="700">만료 예외 점검</text>
<rect x="260" y="132" width="100" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="310" y="161.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">통과</text>
<rect x="370" y="132" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="386" y="162" font-size="15" fill="#292929">[]</text>
<rect x="20" y="190" width="230" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="220" font-size="15" fill="#292929" font-weight="700">부서와 역할 점검</text>
<rect x="260" y="190" width="100" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="310" y="219.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실패</text>
<rect x="370" y="190" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="386" y="220" font-size="15" fill="#292929">['junho']</text>
<rect x="20" y="258" width="330" height="124" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="305.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(나) 통과 ≠ 문제 없음</text>
<text x="185" y="326.5" font-size="14" fill="#292929" text-anchor="middle">예외 3번은 퇴사한 dami 의 것</text>
<text x="185" y="346.8" font-size="14" fill="#292929" text-anchor="middle">퇴사자 계정 점검과 함께 읽기</text>
<rect x="370" y="258" width="330" height="124" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="295.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">자주 틀리는 곳</text>
<text x="535" y="316.3" font-size="14" fill="#292929" text-anchor="middle">&lt;= 대신 &gt;= 로 쓰면</text>
<text x="535" y="336.6" font-size="14" fill="#292929" text-anchor="middle">만료 예외 점검 | 실패</text>
<text x="535" y="356.9" font-size="14" fill="#292929" text-anchor="middle">[3, 6, 7, 8]</text>
</g>
</svg>
