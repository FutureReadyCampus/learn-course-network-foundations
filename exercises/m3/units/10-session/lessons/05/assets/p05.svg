<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>앞 실습 파일이 없거나 안 될 때 완성본 두 개로 만들어 이어 간다</title>
<desc>실습 10-1 의 checklist.py 와 실습 10-2 의 log_summary.py 완성본이 있다. 파일이 없거나 잘 안 될 때 이 코드로 만들면 exercise10-2-2_run.py 를 실행할 수 있다. 데이터 파일 세 개는 시작하기 6번의 내용이다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">앞 실습 파일 완성본 · 언제 쓰나</text>
<rect x="20" y="80" width="180" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="110" y="114" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">내 파일이</text>
<text x="110" y="136.1" font-size="15" fill="#292929" text-anchor="middle">없거나</text>
<text x="110" y="157.9" font-size="15" fill="#292929" text-anchor="middle">잘 안 될 때</text>
<rect x="250" y="70" width="200" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="350" y="93.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">checklist.py</text>
<text x="350" y="114.6" font-size="14" fill="#292929" text-anchor="middle">실습 10-1 완성본</text>
<rect x="250" y="136" width="200" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="350" y="159.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">log_summary.py</text>
<text x="350" y="180.6" font-size="14" fill="#292929" text-anchor="middle">실습 10-2 완성본</text>
<rect x="500" y="90" width="200" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="124.2" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">exercise10-2-2</text>
<text x="600" y="147.4" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">_run.py 실행</text>
<line x1="202" y1="115" x2="246" y2="100" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="202" y1="145" x2="246" y2="160" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="452" y1="100" x2="496" y2="120" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="452" y1="162" x2="496" y2="142" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="222" width="680" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="255.4" font-size="15" fill="#292929" text-anchor="middle">데이터 파일 세 개는 「시작하기」 6번의 내용으로 만듭니다</text>
</g>
</svg>
