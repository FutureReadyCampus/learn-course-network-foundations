<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>점검 한 가지는 문제 대상을 리스트로 모으고, 비면 통과, 있으면 실패다</title>
<desc>점검 체크리스트의 점검 하나는 문제가 있는 사용자나 예외를 리스트로 모은다. 리스트가 비어 있으면 통과, 하나라도 있으면 실패다. 이 과정을 주기마다 같은 기준으로 반복한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">점검 체크리스트 · 리스트로 통과와 실패를 가른다</text>
<rect x="20" y="110" width="140" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="144.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">점검 한 가지</text>
<text x="90" y="167" font-size="15" fill="#292929" text-anchor="middle">미리 정해 둔 것</text>
<rect x="200" y="100" width="200" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="300" y="134" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">문제 대상 모으기</text>
<text x="300" y="156.1" font-size="15" fill="#292929" text-anchor="middle">사용자 이름이나</text>
<text x="300" y="177.9" font-size="15" fill="#292929" text-anchor="middle">예외 번호를 리스트로</text>
<rect x="440" y="110" width="120" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="500" y="144.2" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">리스트가</text>
<text x="500" y="167.4" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">비었나?</text>
<rect x="610" y="70" width="90" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="655" y="105.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">통과</text>
<rect x="610" y="170" width="90" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="655" y="205.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실패</text>
<line x1="162" y1="150" x2="196" y2="150" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="402" y1="150" x2="436" y2="150" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<path d="M562,135 L585,135 L585,100 L606,100" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<path d="M562,165 L585,165 L585,200 L606,200" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="588" y="90" font-size="14" fill="#666660" text-anchor="end">빔</text>
<text x="590" y="222" font-size="14" fill="#666660" text-anchor="end">있음</text>
<path d="M655,232 L655,290 L90,290 L90,194" fill="none" stroke="#666660" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-p03)"/>
<text x="372" y="316" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">주기마다 같은 기준으로 반복</text>
</g>
</svg>
