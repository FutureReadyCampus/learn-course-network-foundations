<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>week_state.json 의 세 부분이 세 점검 함수로 들어가 이름이나 번호가 모인다</title>
<desc>users 는 check_employed 와 check_dept 로, role_dept 는 check_dept 로, exceptions 는 check_expired 로 들어간다. 퇴사자와 부서가 다른 사용자는 이름을, 만료된 예외는 번호를 모은다. 점검 시각은 2026-11-02 10:00 으로 고정한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">week_state.json 의 세 부분과 세 가지 점검</text>
<text x="20" y="56" font-size="14" fill="#666660">점검하는 시각은 2026-11-02 10:00 으로 고정</text>
<rect x="20" y="70" width="220" height="305" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="94" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">config/week_state.json</text>
<rect x="34" y="108" width="192" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="141.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">users</text>
<text x="130" y="162.6" font-size="14" fill="#292929" text-anchor="middle">부서 · 역할 · 재직 여부</text>
<rect x="34" y="196" width="192" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="229.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">role_dept</text>
<text x="130" y="250.6" font-size="14" fill="#292929" text-anchor="middle">역할 → 속해야 할 부서</text>
<rect x="34" y="284" width="192" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="317.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">exceptions</text>
<text x="130" y="338.6" font-size="14" fill="#292929" text-anchor="middle">id · 사용자 · 만료 시각</text>
<rect x="290" y="100" width="190" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="385" y="135.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">check_employed</text>
<text x="385" y="156.6" font-size="14" fill="#292929" text-anchor="middle">employed 가 false</text>
<rect x="290" y="190" width="190" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="385" y="225.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">check_dept</text>
<text x="385" y="246.6" font-size="14" fill="#292929" text-anchor="middle">부서 != 역할의 부서</text>
<rect x="290" y="280" width="190" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="385" y="315.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">check_expired</text>
<text x="385" y="336.6" font-size="14" fill="#292929" text-anchor="middle">만료 시각 &lt;= 지금</text>
<rect x="530" y="110" width="170" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="145.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">사용자 이름</text>
<line x1="482" y1="140" x2="526" y2="140" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="530" y="200" width="170" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="235.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">사용자 이름</text>
<line x1="482" y1="230" x2="526" y2="230" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="530" y="290" width="170" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="325.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">예외 번호(id)</text>
<line x1="482" y1="320" x2="526" y2="320" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="228" y1="140" x2="286" y2="140" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="228" y1="152" x2="286" y2="222" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="228" y1="234" x2="286" y2="234" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="228" y1="322" x2="286" y2="322" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
</g>
</svg>
