<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>Module 3 이 끝나면 access_control 바로 아래 파일과 config 안 JSON 만 있다</title>
<desc>security-agent-toolkit 아래 access_control 폴더에서 작업한다. config 안에는 JSON 설정 파일 11개만 두고, 코드·실행 파일·안내와 보고서·생기는 파일 76개는 access_control 바로 아래에 둔다. 하위 폴더는 만들지 않고 터미널은 항상 access_control 에서 실행한다.</desc>
