<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img">
<title>로그 한 줄은 여섯 키를 가진 요청이고, 다섯 함수가 차례로 집계한다</title>
<desc>로그 한 줄에는 time, user, permission, network, allowed, reason 이 있다. read_log 가 요청 리스트를 만들고, deny_rate 는 거부율을, filter_denied 는 거부된 요청만 모은다. 거부 요청을 count_by 로 사유별·사용자별로 세고, find_heavy_users 가 기준 이상 사용자를 찾는다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
