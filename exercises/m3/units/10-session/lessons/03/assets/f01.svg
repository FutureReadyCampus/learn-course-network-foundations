<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img">
<title>요청 로그를 읽어 거부 요청을 세고, 거부율로 경고를 정하는 함수 흐름</title>
<desc>week_log.jsonl 을 read_log 가 요청 리스트로 만든 뒤 두 갈래로 나뉩니다. 한 갈래는 filter_denied 로 거부된 요청만 모아 count_by 로 사유별·사용자별 횟수를 세고, 사용자별 횟수에서 find_heavy_users 가 기준 이상인 사용자를 찾습니다. 다른 갈래는 deny_rate 로 거부율을 구해 경고 기준 이상이면 경고합니다.</desc>
<defs><marker id="a-f01-m3u10l03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#292929" text-anchor="middle">
<g fill="none" stroke="#666660" stroke-width="1.5">
<path d="M360 144V168M190 168H605M55 246V382"/>
<path d="M360 64V96" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M190 168V186" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M605 168V186" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M55 312H76" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M55 382H76" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M300 312H321" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M300 382H321" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M400 404V426" marker-end="url(#a-f01-m3u10l03)"/>
<path d="M605 246V286" marker-end="url(#a-f01-m3u10l03)"/>
</g>
<rect x="190" y="20" width="340" height="44" rx="8" fill="#f1f1ef" stroke="#dededb"/>
<text x="360" y="47">week_log.jsonl (한 줄이 요청 한 개)</text>
<rect x="130" y="100" width="460" height="44" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="360" y="127"><tspan font-weight="700">read_log</tspan>: JSON 한 줄씩 읽어 요청 리스트로 만든다</text>
<rect x="40" y="190" width="300" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e"/>
<text x="190" y="213" font-weight="700">filter_denied</text><text x="190" y="235">거부된 요청만 모은다</text>
<rect x="80" y="290" width="220" height="44" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="190" y="317" font-size="14">count_by(denied, "reason")</text>
<rect x="80" y="360" width="220" height="44" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="190" y="387" font-size="14">count_by(denied, "user")</text>
<rect x="325" y="290" width="150" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="400" y="317" font-size="14">거부 사유별 횟수</text>
<rect x="325" y="360" width="150" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="400" y="387" font-size="14">사용자별 거부 횟수</text>
<rect x="300" y="430" width="200" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="400" y="453" font-weight="700" font-size="14">find_heavy_users</text><text x="400" y="475" font-size="14">기준 횟수 이상인 사용자</text>
<rect x="510" y="190" width="190" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="605" y="213" font-weight="700">deny_rate</text><text x="605" y="235">거부 수 / 전체 수</text>
<rect x="510" y="290" width="190" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200"/>
<text x="605" y="313">거부율 &gt;= 경고 기준</text><text x="605" y="335">이면 경고</text>
</g>
</svg>
