<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>판정 서버 JSON 로그와 SaaS CSV 로그를 normalize_json_csv.py 로 공통 이벤트로 바꾼다</title>
<desc>판정 서버 로그는 시각에 T 가 있고 ip 가 없으며, SaaS 로그는 사용자가 메일 주소입니다. normalize_json_csv.py 가 둘을 같은 키의 공통 이벤트로 바꿉니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">목표: JSON · CSV 로그 → 공통 이벤트</text>
<rect x="24" y="60" width="220" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="88.9" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">판정 서버 (JSON)</text>
<text x="134" y="109.6" font-size="14" text-anchor="middle" fill="#292929">server_log.jsonl</text>
<text x="134" y="129.9" font-size="14" text-anchor="middle" fill="#292929">2026-11-02T09:40</text>
<text x="134" y="150.2" font-size="14" text-anchor="middle" fill="#292929">allowed: true · ip 없음</text>
<rect x="24" y="196" width="220" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="224.9" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SaaS (CSV)</text>
<text x="134" y="245.6" font-size="14" text-anchor="middle" fill="#292929">saas_events.csv</text>
<text x="134" y="265.9" font-size="14" text-anchor="middle" fill="#292929">seoyeon@a-corp.example</text>
<text x="134" y="286.2" font-size="14" text-anchor="middle" fill="#292929">outcome: success</text>
<line x1="246" y1="115" x2="262" y2="170" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="246" y1="251" x2="262" y2="196" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="266" y="140" width="206" height="86" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="369" y="177.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">프로그램</text>
<text x="369" y="197.9" font-size="14" text-anchor="middle" fill="#292929">normalize_json_csv.py</text>
<line x1="474" y1="183" x2="486" y2="183" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="490" y="60" width="206" height="246" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="593" y="136.6" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">공통 이벤트</text>
<text x="593" y="157.3" font-size="14" text-anchor="middle" fill="#292929">time</text>
<text x="593" y="177.6" font-size="14" text-anchor="middle" fill="#292929">2026-11-02 09:40:00</text>
<text x="593" y="197.9" font-size="14" text-anchor="middle" fill="#292929">user: seoyeon</text>
<text x="593" y="218.2" font-size="14" text-anchor="middle" fill="#292929">ip: None</text>
<text x="593" y="238.5" font-size="14" text-anchor="middle" fill="#292929">result: 성공 · 실패</text>
</g>
</svg>
