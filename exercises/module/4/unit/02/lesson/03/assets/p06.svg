<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-2 정리: 묶기·세기·정렬, 시각에서 시 꺼내기, CSV 저장, null 주의</title>
<desc>groupby 로 묶고 size 로 세고 sort_values 로 큰 값부터 정렬합니다. to_datetime 과 dt.hour 로 hour 열을 만들고 to_csv 로 저장합니다. null 인 행은 groupby 에서 빠집니다.</desc>
<defs><marker id="a-0303-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 2-2 정리</text>
<rect x="24" y="66" width="204.0" height="82" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="126.0" y="101.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">groupby("user")</text>
<text x="126.0" y="122.8" font-size="15" fill="#666660" text-anchor="middle">같은 값끼리 묶기</text>
<line x1="231.0" y1="107.0" x2="255.0" y2="107.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p06)"/>
<rect x="258.0" y="66" width="204.0" height="82" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="101.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">.size()</text>
<text x="360.0" y="122.8" font-size="15" fill="#666660" text-anchor="middle">그룹마다 행 수</text>
<line x1="465.0" y1="107.0" x2="489.0" y2="107.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p06)"/>
<rect x="492.0" y="66" width="204.0" height="82" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="594.0" y="101.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">sort_values</text>
<text x="594.0" y="122.8" font-size="15" fill="#666660" text-anchor="middle">ascending=False</text>
<rect x="24" y="172" width="204.0" height="82" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="126.0" y="207.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">pd.to_datetime</text>
<text x="126.0" y="228.8" font-size="15" fill="#666660" text-anchor="middle">문자열 → 시각 값</text>
<line x1="231.0" y1="213.0" x2="255.0" y2="213.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p06)"/>
<rect x="258.0" y="172" width="204.0" height="82" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="207.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">.dt.hour</text>
<text x="360.0" y="228.8" font-size="15" fill="#666660" text-anchor="middle">「시」만 꺼내기</text>
<line x1="465.0" y1="213.0" x2="489.0" y2="213.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p06)"/>
<rect x="492.0" y="172" width="204.0" height="82" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="594.0" y="207.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">events["hour"]</text>
<text x="594.0" y="228.8" font-size="15" fill="#666660" text-anchor="middle">새 열로 붙이기</text>
<rect x="24" y="280" width="324" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="186.0" y="307.2" font-size="15" fill="#292929" text-anchor="middle">to_csv(path, index=False)</text>
<rect x="372" y="280" width="324" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="534.0" y="307.2" font-size="15" fill="#292929" text-anchor="middle">null 인 행은 groupby 에서 빠짐</text>
</svg>
