<text x="341.0" y="180.2" font-size="15" fill="#666660" text-anchor="middle">같은 키로</text>
<text x="341.0" y="201.2" font-size="15" fill="#666660" text-anchor="middle">맞추기</text>
<line x1="419" y1="175" x2="452" y2="175" stroke="#666660" stroke-width="2" marker-end="url(#a-0302-p03)"/>
<rect x="456" y="72" width="240" height="202" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
