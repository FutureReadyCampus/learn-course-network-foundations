<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>web·server·saas 세 로그를 같은 키 여섯 개로 맞춘 정규화 이벤트</title>
<desc>웹 서버, 권한 판정 서버, SaaS 로그 한 줄을 정규화해 time, source, user, ip, action, result 여섯 키로 맞춥니다. 원래 로그에 없는 값은 채우지 않고 null 로 둡니다.</desc>
<defs><marker id="a-0302-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
