<rect x="24" y="216" width="200" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="124.0" y="239.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">saas</text>
<text x="124.0" y="260.8" font-size="15" fill="#666660" text-anchor="middle">SaaS 서비스</text>
<line x1="227" y1="245" x2="262" y2="175" stroke="#666660" stroke-width="2" marker-end="url(#a-0302-p03)"/>
<rect x="266" y="120" width="150" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
