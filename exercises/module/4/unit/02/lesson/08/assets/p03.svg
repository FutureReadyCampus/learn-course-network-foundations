<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>보고서 실습 2-1 에 채울 칸 (가)(나)(다)</title>
<desc>(가)에는 출력 전체와 행·열 수, 성공·실패 개수, 소스별 실패 개수를 씁니다. (나)와 (다)는 핵심 질문으로 전체 이벤트 수와 비어 있는 user 를 근거로 이유를 씁니다.</desc>
<defs><marker id="a-0305-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">보고서 · 실습 2-1 에 채울 칸</text>
<rect x="24" y="64" width="120" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84.0" y="107.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="156" y="64" width="540" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="168" y="96.8" font-size="15" fill="#292929" text-anchor="start" font-weight="700">출력 전체 (코드 상자에 붙여 넣기)</text>
<text x="168" y="117.8" font-size="15" fill="#666660" text-anchor="start">행 수 · 열 수, 성공 · 실패 개수, 소스별 실패 개수</text>
<rect x="24" y="156" width="120" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="84.0" y="188.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="84.0" y="209.8" font-size="15" fill="#666660" text-anchor="middle">핵심 질문</text>
<rect x="156" y="156" width="540" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="168" y="188.8" font-size="15" fill="#292929" text-anchor="start" font-weight="700">web 이 가장 문제가 큰 소스라고 말할 수 있나?</text>
<text x="168" y="209.8" font-size="15" fill="#666660" text-anchor="start">단계 4 의 소스별 전체 이벤트 수를 근거로 이유</text>
<rect x="24" y="248" width="120" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="84.0" y="280.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="84.0" y="301.8" font-size="15" fill="#666660" text-anchor="middle">핵심 질문</text>
<rect x="156" y="248" width="540" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="168" y="280.8" font-size="15" fill="#292929" text-anchor="start" font-weight="700">user 가 빈 web 실패 13개는 어떻게 되나?</text>
<text x="168" y="301.8" font-size="15" fill="#666660" text-anchor="start">사용자 대신 볼 열과 그 이유</text>
</svg>
