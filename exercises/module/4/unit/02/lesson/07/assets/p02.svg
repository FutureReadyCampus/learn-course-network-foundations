<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-1 정답: 실패 개수는 web 13이 가장 많지만 비율은 server 60%가 가장 높다</title>
<desc>표는 57행 6열, 성공 34개, 실패 23개입니다. 실패 개수는 web 13, server 9, saas 1이지만 전체 대비 비율은 web 약 46%, server 60%, saas 약 7%라서 비율로는 server 가 가장 높습니다.</desc>
<defs><marker id="a-0304-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 2-1 정답: 개수와 비율은 다르게 보입니다</text>
<rect x="24" y="58" width="672" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="84.2" font-size="15" fill="#292929" text-anchor="middle">(57, 6) · 성공 34 · 실패 23</text>
<text x="24" y="134" font-size="16" fill="#292929" text-anchor="start" font-weight="700">실패 개수</text>
<text x="380" y="134" font-size="16" fill="#292929" text-anchor="start" font-weight="700">실패 비율 (실패 ÷ 전체)</text>
<text x="24" y="173" font-size="15" fill="#292929" text-anchor="start">web</text>
<rect x="96" y="152" width="221" height="30" rx="3" fill="#f8e8e3" stroke="#e0442e"/>
<text x="325" y="173" font-size="15" fill="#292929" text-anchor="start" font-weight="700">13</text>
<text x="380" y="173" font-size="15" fill="#292929" text-anchor="start">web</text>
<rect x="450" y="152" width="115.0" height="30" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="573.0" y="173" font-size="14" fill="#292929" text-anchor="start" font-weight="700">13/28 ≈ 46%</text>
<text x="24" y="223" font-size="15" fill="#292929" text-anchor="start">server</text>
<rect x="96" y="202" width="153" height="30" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="257" y="223" font-size="15" fill="#292929" text-anchor="start" font-weight="700">9</text>
<text x="380" y="223" font-size="15" fill="#292929" text-anchor="start">server</text>
<rect x="450" y="202" width="150.0" height="30" rx="3" fill="#f8e8e3" stroke="#e0442e"/>
<text x="608.0" y="223" font-size="14" fill="#292929" text-anchor="start" font-weight="700">9/15 = 60%</text>
<text x="24" y="273" font-size="15" fill="#292929" text-anchor="start">saas</text>
<rect x="96" y="252" width="17" height="30" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="121" y="273" font-size="15" fill="#292929" text-anchor="start" font-weight="700">1</text>
<text x="380" y="273" font-size="15" fill="#292929" text-anchor="start">saas</text>
<rect x="450" y="252" width="17.5" height="30" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="475.5" y="273" font-size="14" fill="#292929" text-anchor="start" font-weight="700">1/14 ≈ 7%</text>
<line x1="360" y1="120" x2="360" y2="300" stroke="#dededb" stroke-width="1.5"/>
<text x="24" y="340" font-size="14" fill="#666660" text-anchor="start">개수는 전체 규모의 영향을 받으므로 소스끼리 비교할 때는 비율도 함께 봅니다</text>
<text x="24" y="368" font-size="14" fill="#666660" text-anchor="start">web 실패 13개는 user 가 비어 있음 → 같은 대상의 반복은 ip 열로 봅니다</text>
</svg>
