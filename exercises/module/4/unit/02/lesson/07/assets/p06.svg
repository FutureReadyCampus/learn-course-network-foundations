<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>유형별 이벤트 수는 5 · 3 · 15 · 34 이고, 기타 실패 15개에는 다른 일이 섞여 있다</title>
<desc>비정상 로그인 5, 비인가 접근 3, 기타 실패 15, 정상 34로 합계 57입니다. 기타 실패 15개는 server 9, web 5, saas 1로 나뉩니다. 기타 실패를 맨 위로 옮기면 기타 실패 23, 나머지 두 유형은 0입니다.</desc>
