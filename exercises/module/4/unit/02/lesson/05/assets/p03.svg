<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>지난 7일 하루 최다 실패: 평균 2.4, 최댓값 4, 알림 기준은 4+1=5번 이상</title>
<desc>7일 숫자는 2, 3, 1, 4, 2, 3, 2입니다. 평균은 17÷7로 약 2.4, 최댓값은 10/29의 4입니다. 알림 기준은 최댓값보다 1 큰 5번 이상이라 지난 7일에는 알림이 나지 않습니다.</desc>
<defs><marker id="a-0402-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">1.1 평소 기준(7일)과 알림 기준</text>
<text x="24" y="56" font-size="15" fill="#666660" text-anchor="start">알림 기준 = 최댓값 + 1 (고정)</text>
<rect x="70" y="282" width="42" height="80" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="91" y="304" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2</text>
<text x="91" y="384" font-size="14" fill="#666660" text-anchor="middle">10/26</text>
<rect x="136" y="242" width="42" height="120" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="157" y="264" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3</text>
<text x="157" y="384" font-size="14" fill="#666660" text-anchor="middle">10/27</text>
<rect x="202" y="322" width="42" height="40" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="223" y="344" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1</text>
<text x="223" y="384" font-size="14" fill="#666660" text-anchor="middle">10/28</text>
<rect x="268" y="202" width="42" height="160" rx="3" fill="#fbf0dc" stroke="#9a6200"/>
<text x="289" y="224" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4</text>
<text x="289" y="384" font-size="14" fill="#666660" text-anchor="middle">10/29</text>
<rect x="334" y="282" width="42" height="80" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="355" y="304" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2</text>
<text x="355" y="384" font-size="14" fill="#666660" text-anchor="middle">10/30</text>
<rect x="400" y="242" width="42" height="120" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="421" y="264" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3</text>
<text x="421" y="384" font-size="14" fill="#666660" text-anchor="middle">10/31</text>
<rect x="466" y="282" width="42" height="80" rx="3" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="487" y="304" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2</text>
<text x="487" y="384" font-size="14" fill="#666660" text-anchor="middle">11/1</text>
<line x1="56" y1="362" x2="530" y2="362" stroke="#666660" stroke-width="1.5"/>
<line x1="56" y1="266.0" x2="530" y2="266.0" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="56" y1="162" x2="530" y2="162" stroke="#e0442e" stroke-width="2"/>
<text x="544" y="271.0" font-size="15" fill="#2f6fd0" text-anchor="start" font-weight="700">평균 2.4</text>
<text x="544" y="207" font-size="15" fill="#9a6200" text-anchor="start" font-weight="700">최댓값 4</text>
<text x="544" y="167" font-size="15" fill="#e0442e" text-anchor="start" font-weight="700">알림 기준 5 이상</text>
<text x="24" y="410" font-size="14" fill="#666660" text-anchor="start">5번은 지난 7일에 한 번도 없던 횟수 → 평소에는 알림이 나지 않음</text>
</svg>
