<title>실습 2-3 정답: 소스별 28·15·14개, 빈 값 수, gaeun 의 시간순 이벤트</title>
<desc>저장된 이벤트는 web 28, server 15, saas 14 로 57개이고 user 가 빈 것은 웹 28개, ip 가 빈 것은 판정 서버 15개입니다. gaeun 은 판정 서버 실패와 SaaS 로그인이 번갈아 나옵니다.</desc>
