<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>응용 2-1 정리: read_csv → 열 꺼내기 → mean·max → maximum + 1</title>
<desc>pd.read_csv 로 표를 읽고 failed_logins 열을 꺼냅니다. mean 으로 평균, max 로 최댓값을 구하고 최댓값에 1을 더해 알림 기준을 정합니다.</desc>
