<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>마무리: git status 로 .env 를 확인하고 add·commit·push 로 깃허브에 올리기</title>
<desc>오늘 만든 파일을 ls 로 확인하고 cd .. 와 pwd 로 network-study-notes 으로 옮깁니다. git status 에 .env 나 .venv 가 보이면 .gitignore 에 적고 다시 봅니다. 보고서를 채운 뒤 올리고 브라우저에서 확인합니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">마무리: 확인하고 깃허브에 올리기</text>
<rect x="24" y="66" width="145.5" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96.75" y="95.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">ls</text>
<text x="96.75" y="116.8" font-size="15" fill="#666660" text-anchor="middle">파일 확인</text>
<line x1="172.5" y1="101.0" x2="196.5" y2="101.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="199.5" y="66" width="145.5" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="272.25" y="95.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">cd ..</text>
<text x="272.25" y="116.8" font-size="15" fill="#666660" text-anchor="middle">한 단계 위로</text>
<line x1="348.0" y1="101.0" x2="372.0" y2="101.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="375.0" y="66" width="145.5" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447.75" y="95.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">pwd</text>
<text x="447.75" y="116.8" font-size="15" fill="#666660" text-anchor="middle">위치 확인</text>
<line x1="523.5" y1="101.0" x2="547.5" y2="101.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="550.5" y="66" width="145.5" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="623.25" y="95.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">git status</text>
<text x="623.25" y="116.8" font-size="15" fill="#666660" text-anchor="middle">올릴 파일 보기</text>
<line x1="623.25" y1="139" x2="623.25" y2="163" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<polygon points="623.25,166.0 703.25,212 623.25,258.0 543.25,212" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="623.25" y="207.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">.env · .venv</text>
<text x="623.25" y="226.7" font-size="14" fill="#292929" text-anchor="middle">보이나요?</text>
<line x1="542.25" y1="212" x2="485" y2="212" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<text x="516" y="203" font-size="15" fill="#e0442e" text-anchor="middle" font-weight="700">예</text>
<rect x="250" y="183" width="232" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="366.0" y="207.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">.gitignore 에 한 줄 적기</text>
<text x="366.0" y="226.7" font-size="14" fill="#666660" text-anchor="middle">저장 후 git status 다시</text>
<path d="M366,183 L366,154 L583.25,154" fill="none" stroke="#666660" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="583.25" y1="154" x2="583.25" y2="139" stroke="#666660" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-p06)"/>
<line x1="623.25" y1="259" x2="623.25" y2="287" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<text x="633.25" y="274" font-size="15" fill="#1f7a4a" text-anchor="start" font-weight="700">아니오</text>
<rect x="24" y="290" width="201" height="66" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="124.5" y="317.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">브라우저 확인</text>
<text x="124.5" y="338.8" font-size="15" fill="#666660" text-anchor="middle">anomaly_detection</text>
<rect x="259" y="290" width="201" height="66" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="359.5" y="317.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">git add .</text>
<text x="359.5" y="338.8" font-size="15" fill="#666660" text-anchor="middle">commit → push</text>
<line x1="256" y1="323" x2="228" y2="323" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="494" y="290" width="201" height="66" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="594.5" y="317.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">보고서 채우기</text>
<text x="594.5" y="338.8" font-size="15" fill="#666660" text-anchor="middle">올리기 전에</text>
<line x1="491" y1="323" x2="463" y2="323" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<text x="24" y="392" font-size="14" fill="#666660" text-anchor="start">push 가 rejected 면: git pull --no-rebase 로 받아 온 뒤 git push 다시</text>
</svg>
