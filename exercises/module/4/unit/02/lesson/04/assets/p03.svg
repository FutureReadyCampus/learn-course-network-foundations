<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>sort(key=get_time)가 time 값으로 정렬하고 json.dump 가 리스트를 파일로 쓴다</title>
<desc>정렬 전 server, web, saas 순서인 이벤트를 sort(key=get_time)가 time 이 이른 순서인 web, saas, server 로 바꿉니다. json.dump 는 ensure_ascii=False 와 indent=2 로 한글 그대로 파일에 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정렬하기 · 저장하기</text>
<text x="24" y="70" font-size="15" text-anchor="start" fill="#666660">정렬 전</text>
<text x="426" y="70" font-size="15" text-anchor="start" fill="#666660">정렬 후</text>
<rect x="24" y="80" width="270" height="40" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="159" y="104.3" font-size="15" text-anchor="middle" fill="#292929">server  ·  11:00:00</text>
<rect x="426" y="80" width="270" height="40" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="561" y="104.3" font-size="15" text-anchor="middle" fill="#292929">web  ·  09:12:03</text>
<rect x="24" y="130" width="270" height="40" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="159" y="154.3" font-size="15" text-anchor="middle" fill="#292929">web  ·  09:12:03</text>
<rect x="426" y="130" width="270" height="40" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="561" y="154.3" font-size="15" text-anchor="middle" fill="#292929">saas  ·  10:12:55</text>
<rect x="24" y="180" width="270" height="40" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="159" y="204.3" font-size="15" text-anchor="middle" fill="#292929">saas  ·  10:12:55</text>
<rect x="426" y="180" width="270" height="40" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="561" y="204.3" font-size="15" text-anchor="middle" fill="#292929">server  ·  11:00:00</text>
<line x1="298" y1="150" x2="420" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="360" y="138" font-size="14" text-anchor="middle" fill="#292929">sort(key=get_time)</text>
<text x="360" y="172" font-size="14" text-anchor="middle" fill="#666660">이른 시각이 앞</text>
<rect x="24" y="250" width="400" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="224" y="279.1" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">json.dump(events, 파일, …)</text>
<text x="224" y="299.8" font-size="14" text-anchor="middle" fill="#292929">ensure_ascii=False → 한글 그대로</text>
<text x="224" y="320.1" font-size="14" text-anchor="middle" fill="#292929">indent=2 → 보기 좋게 들여쓰기</text>
<rect x="440" y="250" width="256" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="568" y="279.1" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">주의</text>
<text x="568" y="299.8" font-size="14" text-anchor="middle" fill="#292929">events = events.sort(…)</text>
<text x="568" y="320.1" font-size="14" text-anchor="middle" fill="#292929">→ events 가 None</text>
<text x="24" y="372" font-size="15" text-anchor="start" fill="#666660">get_time 뒤에는 괄호를 붙이지 않습니다(함수 자체를 전달).</text>
<text x="24" y="400" font-size="15" text-anchor="start" fill="#666660">sort 는 리스트 자체를 바꾸고 아무것도 리턴하지 않습니다.</text>
</g>
</svg>
