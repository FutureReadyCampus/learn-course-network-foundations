<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>오류가 나면 증상을 보고 위치와 파일 이름을 확인한 뒤 고친다</title>
<desc>No module named pandas 는 가상환경과 설치를 다시 하고, FileNotFoundError 와 ValueError 는 위치, 파일 이름, JSON 괄호와 쉼표를 확인합니다. 그래도 안 되면 AI 에게 묻고 정답을 보거나 모름이라고 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<rect x="24" y="54" width="672" height="40" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="78.3" font-size="15" text-anchor="middle" fill="#292929">먼저: pwd 가 anomaly_detection 으로 끝나는지 · ls 로 파일 이름 확인</text>
<text x="149" y="124" font-size="15" text-anchor="middle" fill="#666660" font-weight="700">증상</text>
<text x="390" y="124" font-size="15" text-anchor="middle" fill="#666660" font-weight="700">확인</text>
<text x="601" y="124" font-size="15" text-anchor="middle" fill="#666660" font-weight="700">고치기</text>
<rect x="24" y="136" width="250" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="149" y="172.1" font-size="14" text-anchor="middle" fill="#292929">No module named 'pandas'</text>
<line x1="276" y1="168" x2="296" y2="168" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="300" y="136" width="180" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="390" y="161.9" font-size="14" text-anchor="middle" fill="#292929">설치 안 됨</text>
<text x="390" y="182.2" font-size="14" text-anchor="middle" fill="#292929">가상환경 꺼짐</text>
<line x1="482" y1="168" x2="502" y2="168" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="506" y="136" width="190" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601" y="161.9" font-size="14" text-anchor="middle" fill="#292929">2 · 3번을</text>
<text x="601" y="182.2" font-size="14" text-anchor="middle" fill="#292929">같은 터미널에서 다시</text>
<rect x="24" y="220" width="250" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="149" y="245.9" font-size="14" text-anchor="middle" fill="#292929">FileNotFoundError</text>
<text x="149" y="266.2" font-size="14" text-anchor="middle" fill="#292929">ValueError</text>
<line x1="276" y1="252" x2="296" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="300" y="220" width="180" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="390" y="245.9" font-size="14" text-anchor="middle" fill="#292929">위치 · 파일 이름</text>
<text x="390" y="266.2" font-size="14" text-anchor="middle" fill="#292929">JSON 의 [ ] · 쉼표</text>
<line x1="482" y1="252" x2="502" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="506" y="220" width="190" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601" y="245.9" font-size="14" text-anchor="middle" fill="#292929">고쳐서</text>
<text x="601" y="266.2" font-size="14" text-anchor="middle" fill="#292929">다시 붙여 넣기</text>
<rect x="24" y="312" width="672" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="341.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">그래도 막히면</text>
<text x="360" y="361.9" font-size="14" text-anchor="middle" fill="#292929">오류 전체와 명령을 AI 에게 (.env · API 키는 지움) → 정답 → 「모름 — 막힌 곳: …」</text>
</g>
</svg>
