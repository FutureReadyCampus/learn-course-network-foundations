<text x="394" y="201.8" font-size="15" fill="#666660">열 이름 1줄 + 이벤트 14개</text>
<rect x="380" y="240" width="316" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="538.0" y="270.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">30 · 15 · 15 가 나와야 함</text>
