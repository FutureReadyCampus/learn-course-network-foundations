<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>40분을 고르기 5분, 쓰기 25분, 점검·올리기 10분으로 나누고 글감 하나를 고른다</title>
<desc>글쓰기 40분의 시간 배분 막대입니다. 아래에는 실습 2-1 ~ 2-3 글감 세 가지와, 응용 2-1 · 2-2를 했을 때 고를 수 있는 선택 글감 두 가지가 있습니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="40" y="34" font-size="18" font-weight="700" fill="#292929">Unit 2 글쓰기 40분</text>
<rect x="40" y="52" width="80" height="56" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="80" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">고르기</text>
<text x="80" y="98" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<rect x="120" y="52" width="400" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="320" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">쓰기</text>
<text x="320" y="98" font-size="14" fill="#292929" text-anchor="middle">25분 · 글 틀에 내 답을 풀어 쓰기</text>
<rect x="520" y="52" width="160" height="56" rx="6" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="600" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">점검 · 올리기</text>
<text x="600" y="98" font-size="14" fill="#292929" text-anchor="middle">10분</text>
<text x="40" y="146" font-size="16" font-weight="700" fill="#292929">글감 하나 고르기 (실습 2-1 ~ 2-3)</text>
<rect x="40" y="160" width="200" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="56" y="186" font-size="15" font-weight="700" fill="#e0442e">1. 개수와 비율</text>
<text x="56" y="210" font-size="14" fill="#292929">실패가 가장 많은 소스가</text>
<text x="56" y="230" font-size="14" fill="#292929">가장 문제가 큰 소스인가</text>
<text x="56" y="252" font-size="14" fill="#666660">events_basic.py</text>
<rect x="260" y="160" width="200" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="276" y="186" font-size="15" font-weight="700" fill="#e0442e">2. 비어 있는 값</text>
<text x="276" y="210" font-size="14" fill="#292929">user 가 빈 실패는</text>
<text x="276" y="230" font-size="14" fill="#292929">어떻게 세어지나</text>
<text x="276" y="252" font-size="14" fill="#666660">events_time.py</text>
<rect x="480" y="160" width="200" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="496" y="186" font-size="15" font-weight="700" fill="#e0442e">3. 알림과 공격</text>
<text x="496" y="210" font-size="14" fill="#292929">알림 대상이면 공격인가</text>
<text x="496" y="230" font-size="14" fill="#292929">「알림 없음」의 뜻</text>
<text x="496" y="252" font-size="14" fill="#666660">login_detection.py</text>
<rect x="40" y="282" width="640" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-dasharray="6 4"/>
<text x="56" y="307" font-size="15" font-weight="700" fill="#9a6200">선택 글감 · 응용 2-1 · 2-2를 했다면</text>
<text x="56" y="331" font-size="14" fill="#292929">평균이 아니라 최댓값 + 1 로 정한 이유 · 「기타 실패」에 섞인 일들</text>
<text x="40" y="378" font-size="15" fill="#666660">세 문장만 써도, 막힌 이야기를 써도 한 편의 글입니다.</text>
</g>
</svg>
