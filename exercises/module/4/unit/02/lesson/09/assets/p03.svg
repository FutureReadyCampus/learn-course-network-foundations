<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>막히면 고른 글감에 맞는 코드 한 줄이나 출력 두세 줄을 붙이고 그 뜻을 쓴다</title>
<desc>글감 1은 실습 2-1 단계 3 · 4 를 나란히, 글감 2는 사용자별 합과 실패 23개를, 글감 3은 단계 3 출력과 203.0.113.50 의 행들을 붙입니다. 붙인 줄 아래에 무엇을 보았는지 한 문장으로 쓰고, AI 도우미 프롬프트는 Module 3 Unit 1 시작하기 레슨에 있습니다.</desc>
<defs><marker id="a-p03-u2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="30" font-size="16" font-weight="700" fill="#292929">고른 글감</text>
<text x="250" y="30" font-size="16" font-weight="700" fill="#292929">글에 붙일 것</text>
<rect x="30" y="44" width="180" height="64" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="70" font-size="15" font-weight="700" fill="#292929">1. 개수와 비율</text>
<text x="44" y="94" font-size="14" fill="#292929">실습 2-1 단계 3 · 4</text>
<line x1="214" y1="76" x2="244" y2="76" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u2w)"/>
<rect x="250" y="44" width="440" height="64" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="70" font-size="14" fill="#292929">실패의 소스별 개수 + 전체의 소스별 개수</text>
<text x="264" y="94" font-size="14" fill="#292929">소스마다 실패 ÷ 전체 를 한 줄씩</text>
<rect x="30" y="122" width="180" height="64" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="148" font-size="15" font-weight="700" fill="#292929">2. 비어 있는 값</text>
<text x="44" y="172" font-size="14" fill="#292929">실습 2-2 단계 1</text>
<line x1="214" y1="154" x2="244" y2="154" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u2w)"/>
<rect x="250" y="122" width="440" height="64" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="148" font-size="14" fill="#292929">사용자별 합 10 과 실패 23 비교</text>
<text x="264" y="172" font-size="14" fill="#292929">모자란 13 은 어느 소스인지</text>
<rect x="30" y="200" width="180" height="64" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="226" font-size="15" font-weight="700" fill="#292929">3. 알림과 공격</text>
<text x="44" y="250" font-size="14" fill="#292929">실습 2-3 단계 3</text>
<line x1="214" y1="232" x2="244" y2="232" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u2w)"/>
<rect x="250" y="200" width="440" height="64" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="226" font-size="14" fill="#292929">단계 3 출력 + 3.1 표의 9 ~ 17번 행</text>
<text x="264" y="250" font-size="14" fill="#292929">시각 간격 · 성공 · /admin · 더 필요한 정보</text>
<rect x="30" y="284" width="660" height="48" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="44" y="314" font-size="15" fill="#292929">붙인 줄 아래에 「이 줄에서 무엇을 보았는지」 한 문장 쓰기</text>
<rect x="30" y="348" width="400" height="56" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="44" y="372" font-size="14" fill="#292929">그래도 막히면 AI 도우미 프롬프트 세 가지</text>
<text x="44" y="394" font-size="14" fill="#666660">Module 3 Unit 1 「쓰기 질문과 AI 도우미」</text>
<rect x="446" y="348" width="244" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="460" y="372" font-size="14" font-weight="700" fill="#e0442e">붙여 넣기 전에</text>
<text x="460" y="394" font-size="14" fill="#292929">비밀키 · 개인정보 빼기</text>
</g>
</svg>
