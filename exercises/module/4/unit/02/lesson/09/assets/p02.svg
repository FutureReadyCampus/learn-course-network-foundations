<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>글 틀을 골라 _posts/ 에 m4-u2 글을 만들면 첫 화면 Module 4의 2번 칸이 채워진다</title>
<desc>기본 글 틀 post-short(세 문장 글)를 고르고(긴 글 post-practice 는 응용), VS Code 에서 _posts/ 폴더에 새 글로 만들고 머리말을 module: 4, unit: 2로 적습니다. 코드는 옮기지 않고 글에 anomaly_detection/login_detection.py 처럼 위치만 적고, 공개 전 점검 뒤 push 하면 1~2분 뒤 첫 화면 「나의 진행」의 Module 4 · 2번 칸을 확인합니다.</desc>
