<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>report_u6.md 의 실습 6-2에 채울 (가)~(다) 칸 체크리스트</title><desc>보고서 파일 report_u6.md 의 실습 6-2 세 질문에 무엇을 쓰는지 정리했습니다. (가)는 규칙마다 해당한 사용자, (나)와 (다)는 핵심 질문입니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">report_u6.md · 실습 6-2에 채울 칸</text><rect x="20" y="52" width="120" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="80" y="103.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(가)</text><rect x="160" y="52" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="172" y="92.8" font-size="15" text-anchor="start" fill="#292929">□ 출력 전체(코드 상자)  □ 업무 시간 밖 로그인</text><text x="172" y="113.8" font-size="15" text-anchor="start" fill="#292929">□ 평소와 다른 IP  □ 대량 다운로드 사용자</text><rect x="20" y="158" width="120" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="80" y="209.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(나) 핵심</text><rect x="160" y="158" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="172" y="198.8" font-size="15" text-anchor="start" fill="#292929">□ jiwoo: 계정 도용을 확정할 수 있는지</text><text x="172" y="219.8" font-size="15" text-anchor="start" fill="#292929">□ 샘플 로그에서 더 확인할 정보 한 가지</text><rect x="20" y="264" width="120" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="80" y="315.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(다) 핵심</text><rect x="160" y="264" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><t