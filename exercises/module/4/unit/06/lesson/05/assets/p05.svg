<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>정답 마무리: 파일이 모두 보이고 보고서에 빈 답이 없으면 된다</title><desc>ls 결과에 이번 Unit 파일과 config 폴더, 안내와 보고서 두 파일이 보이는지 확인합니다. 보고서의 답: 칸이 비지 않았는지 보고, 못 적은 칸은 모름 — 막힌 곳으로 적습니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답 마무리: 두 가지만 확인</text><rect x="20" y="62" width="330" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="185" y="105.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">① ls 결과</text><text x="185" y="126.8" font-size="15" text-anchor="middle" fill="#666660">이번 Unit 파일들</text><text x="185" y="147.8" font-size="15" text-anchor="middle" fill="#666660">config 폴더</text><text x="185" y="168.8" font-size="15" text-anchor="middle" fill="#666660">안내 · 보고서 두 파일</text><rect x="370" y="62" width="330" height="140" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="535" y="105.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">② 보고서</text><text x="535" y="126.8" font-size="15" text-anchor="middle" fill="#666660">빈 답: 이 없는가</text><text x="535" y="147.8" font-size="15" text-anchor="middle" fill="#666660">못 적은 칸은</text><text x="535" y="168.8" font-size="15" text-anchor="middle" fill="#666660">모름 — 막힌 곳: …</text><rect x="20" y="222" width="680" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360" y="251.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">둘 다 되면 Unit 6 완료</text></svg>
