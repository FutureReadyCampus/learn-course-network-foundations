<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>SaaS 로그에서 세 가지 이상 사용을 각각 찾아 해당 사용자를 알린다</title>
<desc>SaaS 는 회사 밖에서도 로그인할 수 있어 성공만으로는 본인인지 알 수 없다. 업무 시간 밖 로그인, 평소와 다른 IP, 파일 5번 이상 내려받기를 각각 찾는다. 평소 기록이 없는 사용자는 IP 확인에서 뺀다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰 · SaaS 이상 사용 세 가지</text>
<rect x="30" y="100" width="190" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="125" y="144.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">SaaS 로그</text>
<text x="125" y="165.2" font-size="15" fill="#292929" text-anchor="middle">회사 밖에서도</text>
<text x="125" y="186.2" font-size="15" fill="#292929" text-anchor="middle">로그인 가능</text>
<rect x="280" y="55" width="260" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="410" y="89.2" font-size="15" fill="#292929" text-anchor="middle">① 업무 시간 밖 로그인</text>
<line x1="220" y1="160" x2="278" y2="84" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="580" y="55" width="110" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="635" y="88.9" font-size="14" fill="#292929" text-anchor="middle">어느 사용자?</text>
<line x1="540" y1="84" x2="578" y2="84" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="280" y="130" width="260" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="410" y="164.2" font-size="15" fill="#292929" text-anchor="middle">② 평소와 다른 IP 로 로그인</text>
<line x1="220" y1="160" x2="278" y2="159" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="580" y="130" width="110" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="635" y="163.9" font-size="14" fill="#292929" text-anchor="middle">어느 사용자?</text>
<line x1="540" y1="159" x2="578" y2="159" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="280" y="205" width="260" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="410" y="239.2" font-size="15" fill="#292929" text-anchor="middle">③ 파일 5번 이상 내려받기</text>
<line x1="220" y1="160" x2="278" y2="234" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="580" y="205" width="110" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="635" y="238.9" font-size="14" fill="#292929" text-anchor="middle">어느 사용자?</text>
<line x1="540" y1="234" x2="578" y2="234" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="30" y="300" font-size="15" fill="#666660">평소 기록이 없는 사용자는 IP 를 비교할 수 없어 ②에서만 뺍니다.</text>
</g>
</svg>
