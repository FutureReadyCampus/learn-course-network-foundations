<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>보고서 실습 10-1: (가) 출력과 개수 · (나) 금지 두 가지 · (다) 요약과 표 비교</title>
<desc>(가)는 출력 전체를 코드 상자에 붙이고 요약한 대상 수와 실패 대상 수를 적습니다. (나)는 지시문이 하지 말라고 한 두 가지와 위험한 이유, (다)는 요약 하나를 점수 기록 표와 비교한 결과를 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 실습 10-1 · 채울 칸</text>
<rect x="20" y="50" width="214" height="260" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="34" y="78" font-size="16" fill="#292929" font-weight="700">(가) 출력</text>
<rect x="34" y="119" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="56" y="132" font-size="15" fill="#292929">출력 전체</text>
<text x="56" y="154" font-size="15" fill="#292929">(코드 상자)</text>
<rect x="34" y="181" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="56" y="194" font-size="15" fill="#292929">요약한 대상 수</text>
<rect x="34" y="221" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="56" y="234" font-size="15" fill="#292929">요약 실패</text>
<text x="56" y="256" font-size="15" fill="#292929">대상 수</text>
<rect x="253" y="50" width="214" height="260" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="267" y="78" font-size="16" fill="#292929" font-weight="700">(나) 지시문</text>
<text x="267" y="100" font-size="14" fill="#292929">[핵심 질문]</text>
<rect x="267" y="119" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="289" y="132" font-size="15" fill="#292929">하지 말라고 한</text>
<text x="289" y="154" font-size="15" fill="#292929">것 두 가지</text>
<rect x="267" y="181" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="289" y="194" font-size="15" fill="#292929">각각 하면</text>
<text x="289" y="216" font-size="15" fill="#292929">위험한 이유</text>
<rect x="486" y="50" width="214" height="260" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="500" y="78" font-size="16" fill="#292929" font-weight="700">(다) 요약 비교</text>
<text x="500" y="100" font-size="14" fill="#292929">[핵심 질문]</text>
<rect x="500" y="119" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="522" y="132" font-size="15" fill="#292929">고른 요약의 대상</text>
<rect x="500" y="159" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="522" y="172" font-size="15" fill="#292929">표에 없는 내용이</text>
<text x="522" y="194" font-size="15" fill="#292929">들어 있는지</text>
<rect x="500" y="221" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="522" y="234" font-size="15" fill="#292929">있으면 고칠 방법</text>
<text x="522" y="256" font-size="15" fill="#292929">없으면 규칙 확인</text>
