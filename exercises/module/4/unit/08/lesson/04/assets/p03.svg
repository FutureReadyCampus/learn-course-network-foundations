<text x="20" y="346" font-size="15" fill="#292929" font-weight="700">놓친 문제: 2개(P4 · P5) → 1개(P5)</text>
<text x="20" y="376" font-size="15" fill="#666660">A8 은 real 이 True 라서 오탐은 실습 8-2의 2개(A2 · A3) 그대로입니다.</text>
