<rect x="430" y="54" width="270" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="565.0" y="81.0" font-size="14" fill="#292929" text-anchor="middle">A1 서버 반복 거절</text>
<rect x="20" y="108" width="60" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
