<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>진짜 문제 5개 중 P1 ~ P3 은 기존 알림, P4 는 A8 이 찾고 P5 는 찾는 알림이 없습니다</title>
<desc>P1 은 A1, P2 는 A6, P3 은 A7 이 찾습니다. 이번 실습에서 합치는 A8 이 P4 를 찾아 놓친 문제가 2개에서 1개로 줄어듭니다. P5 는 이번 실습의 규칙으로는 찾을 수 없고, A8 은 진짜 문제라 오탐은 2개 그대로입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">3.1 진짜 문제 5개를 어느 규칙이 찾는가</text>
<rect x="20" y="54" width="60" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
