<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>탐지 규칙 8개의 점수와 high 60 · mid 35 등급 기준</title><desc>access_detection · saas_detection · malicious_detection · correlation 이 찾는 규칙 8개에 정해 둔 점수입니다. 합계가 60 이상이면 high, 35 이상이면 mid, 그 밖은 low이고 high부터 먼저 검사합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">1.1 규칙마다 점수와 등급 기준</text><rect x="20" y="50" width="440" height="30" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="32" y="71" font-size="15" text-anchor="start" fill="#292929">퇴사한 계정</text><text x="270" y="71" font-size="15" text-anchor="end" fill="#292929" font-weight="700">60</text><text x="448" y="71" font-size="14" text-anchor="end" fill="#666660">access_detection</text><rect x="20" y="86" width="440" height="30" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="32" y="107" font-size="15" text-anchor="start" fill="#292929">권한 없음</text><text x="270" y="107" font-size="15" text-anchor="end" fill="#292929" font-weight="700">20</text><text x="448" y="107" font-size="14" text-anchor="end" fill="#666660">access_detection</text><rect x="20" y="122" width="440" height="30" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="32" y="143" font-size="15" text-anchor="start" fill="#292929">규칙은 허용인데 서버가 거절</text><text x="270" y="143" font-size="15" text-anchor="end" fill="#292929" font-weight="700">10</text><text x="448" y="143" font-size="14" text-anchor="end" fill="#666660">access_detection</text><rect x="20" y="158" width="440" height="30" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="32" y="179" font-size="15" text-anchor="start" fill="#292929">업무 시간 밖 로그인</text><text x="270" y="179" font-size="15" text-anchor="end" fill="#292929" font-weight="700">15</text><text x="448" y="179" font-size="14" text-anchor="end" fill="#666660">saas_detection</text><rect x="20" y="194" width="440" height="30" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="32" y="215" font-size="15" text-anchor="start" fill="#292929">평소와 다른 IP</text><text x="270" y="215" font-size="15" text-anchor="end" fill="#292929" font-weight="700">20</text><text x="448" y="215" font-size="14" text-anchor="end" fill="#666660">saas_detection</text><rect x="20" y="230" width="440" height="30" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="32" y="251" font-size="15" text-anchor="start" fill="#292929">대량 다운로드</text><text x="270" y="251" font-size="15" text-anchor="end" fill="#292929" font-weight="700">25</text><text x="448" y="251" font-size="14" text-anchor="end" fill="#666660">saas_detection</text><rect x="20" y="266" width="440" height="30" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="32" y="287" font-size="15" text-anchor="start" fill="#292929">경로 스캔 (대상이 IP)</text><text x="270" y="287" font-size="15" text-anchor="end" fill="#292929" font-weight="700">30</text><text x="448" y="287" font-size="14" text-anchor="end" fill="#666660">malicious_detection</text><rect x="20" y="302" width="440" height="30" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="32" y="323" font-size="15" text-anchor="start" fill="#292929">여러 로그 연결</text><text x="270" y="323" font-size="15" text-anchor="end" fill="#292929" font-weight="700">30</text><text x="448" y="323" font-size="14" text-anchor="end" fill="#666660">correlation</text><rect x="490" y="50" width="210" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="595" y="89.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">high</text><text x="595" y="110.8" font-size="15" text-anchor="middle" fill="#292929">60 이상</text><rect x="490" y="152" width="210" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="595" y="191.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">mid</text><text x="595" y="212.8" font-size="15" text-anchor="middle" fill="#292929">35 이상 60 미만</text><rect x="490" y="254" width="210" height="82" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="595" y="289.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">low</text><text x="595" y="310.8" font-size="15" text-anchor="middle" fill="#292929">35 미만</text><line x1="595" y1="142" x2="595" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><line x1="595" y1="244" x2="595" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><text x="20" y="370" font-size="15" text-anchor="start" fill="#666660">높은 기준(high)부터 먼저 검사 · 등급은 확인할 순서를 정하는 기준</text><text x="20" y="400" font-size="15" text-anchor="start" fill="#666660">이 숫자들은 이번 실습에서 고정한 값이고, 현업에서는 조직이 정한다</text></svg>
