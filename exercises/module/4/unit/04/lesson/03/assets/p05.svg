<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>실습 4-1 정리: map, sum, if 등급, 기록 딕셔너리의 네 줄</title><desc>실습 4-1의 네 가지 일을 순서대로 이었습니다. 1 · 2는 직접 쓰는 ① · ②이고 3 · 4는 미리 채운 줄입니다. 규칙마다 점수를 채우고, 대상마다 더하고, 기준으로 등급을 정한 뒤, 대상·점수·등급·이유를 딕셔너리로 만듭니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-1 정리: 네 줄의 흐름</text><rect x="20" y="52" width="200" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="82.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">1. 규칙마다 점수 채우기</text><rect x="244" y="52" width="456" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="472" y="82.9" font-size="14" text-anchor="middle" fill="#292929">points = findings_table["rule"].map(WEIGHTS)</text><line x1="222" y1="78" x2="240" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="122" width="200" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="152.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">2. 대상마다 점수 더하기</text><rect x="244" y="122" width="456" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="472" y="152.9" font-size="14" text-anchor="middle" fill="#292929">totals = grouped["points"].sum()</text><line x1="222" y1="148" x2="240" y2="148" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="120" y1="105" x2="120" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="192" width="200" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="222.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">3. 등급 정하기</text><rect x="244" y="192" width="456" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="472" y="222.9" font-size="14" text-anchor="middle" fill="#292929">if score &gt;= HIGH_LIMIT: → return "high"</text><line x1="222" y1="218" x2="240" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="120" y1="175" x2="120" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="262" width="200" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="292.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">4. 기록 만들기</text><rect x="244" y="262" width="456" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="472" y="292.9" font-size="14" text-anchor="middle" fill="#292929">record = {"entity": entity, "score": int(score), …}</text><line x1="222" y1="288" x2="240" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="120" y1="245" x2="120" y2="260" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/></svg>
