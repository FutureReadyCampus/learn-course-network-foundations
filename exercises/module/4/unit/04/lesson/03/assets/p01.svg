<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>이벤트 57개에서 로그인 실패를 주소별로 세어 5번 이상인 주소를 알린다</title>
<desc>샘플 이벤트 57개에서 POST /login 실패만 골라 IP 주소별로 셉니다. 알림 기준 5번 이상인 주소만 담당자에게 알립니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">로그인 실패가 많은 주소를 찾아 담당자에게 알린다</text>
<rect x="20" y="72" width="140" height="96" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90.0" y="115" font-size="15" text-anchor="middle" fill="#292929"><tspan x="90.0" dy="0" font-weight="700">샘플 이벤트</tspan><tspan x="90.0" dy="20">57개</tspan></text>
<rect x="200" y="72" width="140" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="270.0" y="115" font-size="15" text-anchor="middle" fill="#292929"><tspan x="270.0" dy="0" font-weight="700">POST /login</tspan><tspan x="270.0" dy="20">실패만 세기</tspan></text>
<rect x="380" y="72" width="140" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="450.0" y="115" font-size="15" text-anchor="middle" fill="#292929"><tspan x="450.0" dy="0" font-weight="700">IP 주소별</tspan><tspan x="450.0" dy="20">실패 횟수</tspan></text>
<rect x="560" y="72" width="140" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="630.0" y="115" font-size="15" text-anchor="middle" fill="#292929"><tspan x="630.0" dy="0" font-weight="700">5번 이상인</tspan><tspan x="630.0" dy="20">주소만 알림</tspan></text>
<polyline points="163,120.0 196,120.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="343,120.0 376,120.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="523,120.0 556,120.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="200" width="680" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="241" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0">로그인에 연달아 실패 = 비밀번호를 맞혀 보는 대표적인 모습</tspan><tspan x="360.0" dy="20">기준 이상인 주소만 보여 주면 담당자가 먼저 볼 곳이 정해진다</tspan></text>
</g>
</svg>
