<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>예외를 IP 하나로만 걸면 진짜 문제 A6 까지 빠지고, 규칙까지 정하면 A4 · A5 만 빠집니다</title>
<desc>같은 IP 203.0.113.80 에서 온 알림은 A3 · A4 · A5 · A6 입니다. IP 만 보고 빼면 진짜 문제인 A6 까지 지워집니다. SaaS 평소와 다른 IP 규칙의 알림만 빼면 오탐 A4 · A5 만 빠지고 나머지는 남습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">왜 예외를 한 규칙에만 거는가</text>
<text x="20" y="70" font-size="15" fill="#292929" font-weight="700">IP 만 보고 빼면: 네 개 모두 빠짐</text>
<rect x="20" y="80" width="160" height="70" rx="8" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="100.0" y="110.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A3</text>
<text x="100.0" y="129.8" font-size="14" fill="#292929" text-anchor="middle">업무 시간 밖</text>
<rect x="192" y="80" width="160" height="70" rx="8" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="272.0" y="110.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A4</text>
<text x="272.0" y="129.8" font-size="14" fill="#292929" text-anchor="middle">평소와 다른 IP</text>
<rect x="364" y="80" width="160" height="70" rx="8" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="444.0" y="110.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A5</text>
<text x="444.0" y="129.8" font-size="14" fill="#292929" text-anchor="middle">평소와 다른 IP</text>
<rect x="536" y="80" width="160" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="616.0" y="110.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A6</text>
<text x="616.0" y="129.8" font-size="14" fill="#292929" text-anchor="middle">대량 다운로드</text>
<text x="20" y="180" font-size="15" fill="#666660">A6 은 진짜 문제(real True)인데 지워집니다.</text>
<text x="20" y="226" font-size="15" fill="#292929" font-weight="700">IP 규칙 + 믿는 IP 로 빼면: A4 · A5 만 빠짐</text>
<rect x="20" y="236" width="160" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="100.0" y="266.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A3</text>
<text x="100.0" y="285.8" font-size="14" fill="#292929" text-anchor="middle">업무 시간 밖</text>
<rect x="192" y="236" width="160" height="70" rx="8" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="272.0" y="266.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A4</text>
<text x="272.0" y="285.8" font-size="14" fill="#292929" text-anchor="middle">평소와 다른 IP</text>
<rect x="364" y="236" width="160" height="70" rx="8" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="444.0" y="266.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A5</text>
<text x="444.0" y="285.8" font-size="14" fill="#292929" text-anchor="middle">평소와 다른 IP</text>
<rect x="536" y="236" width="160" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="616.0" y="266.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">A6</text>
<text x="616.0" y="285.8" font-size="14" fill="#292929" text-anchor="middle">대량 다운로드</text>
<text x="20" y="336" font-size="15" fill="#666660">흰 상자는 남는 알림, 회색 상자는 빠지는 알림입니다.</text>
<text x="20" y="364" font-size="15" fill="#666660">같은 IP 라도 다른 규칙의 알림은 그대로 둡니다.</text>
</g>
</svg>
