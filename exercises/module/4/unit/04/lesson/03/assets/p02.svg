<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>같은 규칙은 대상마다 한 번만 더하고, 합계로 등급을 정해 규칙 이름과 함께 남긴다</title><desc>seoyeon의 예처럼 대상마다 탐지된 규칙의 점수를 더합니다. 같은 규칙이 여러 이벤트에서 나와도 점수는 한 번만 더하고, 합계의 등급과 규칙 이름을 함께 저장합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">왜 점수를 더하고 이유를 남기는가</text><rect x="20" y="56" width="230" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="135" y="91.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">평소와 다른 IP · 20</text><rect x="20" y="130" width="230" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="135" y="165.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">대량 다운로드 · 25</text><rect x="20" y="204" width="230" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="135" y="229.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">같은 규칙 또 탐지</text><text x="135" y="248.7" font-size="14" text-anchor="middle" fill="#666660">→ 다시 더하지 않음</text><rect x="300" y="90" width="180" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="390" y="119.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">seoyeon</text><text x="390" y="140.8" font-size="15" text-anchor="middle" fill="#292929">합계 45</text><line x1="252" y1="86" x2="296" y2="116" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="252" y1="160" x2="296" y2="134" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="520" y="70" width="180" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="610" y="98.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">저장</text><text x="610" y="119.8" font-size="15" text-anchor="middle" fill="#666660">점수 · 등급</text><text x="610" y="140.8" font-size="15" text-anchor="middle" fill="#666660">+ 규칙 이름</text><text x="610" y="161.8" font-size="15" text-anchor="middle" fill="#666660">(이유)</text><line x1="482" y1="125" x2="516" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><text x="20" y="312" font-size="15" text-anchor="start" fill="#666660">규칙 이름을 함께 저장하면 담당자가 점수가 나온 근거를 확인할 수 있다</text></svg>
