<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>risk_scores.py로 규칙을 모아 점수를 더하고 등급·이유 기록을 JSON 파일로 저장한다</title><desc>collect_findings가 탐지된 규칙을 모으면 score_findings(직접 쓰는 ① · ②)가 점수를 더하고 미리 채운 make_grade 가 등급을 정합니다. 미리 채운 make_records 가 기록을 만들고 save_records가 unit05_risk_scores.json에 저장합니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-1: risk_scores.py 의 흐름</text><rect x="20" y="52" width="206.667" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="123.333" y="87.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">collect_findings</text><text x="123.333" y="106.7" font-size="14" text-anchor="middle" fill="#292929">미리 채움 · 8건</text><rect x="256.667" y="52" width="206.667" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="87.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">score_findings</text><text x="360" y="106.7" font-size="14" text-anchor="middle" fill="#292929">직접 쓰기 ① · ②</text><line x1="229.667" y1="92" x2="252.667" y2="92" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="493.333" y="52" width="206.667" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="596.667" y="87.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">make_grade</text><text x="596.667" y="106.7" font-size="14" text-anchor="middle" fill="#292929">미리 채움</text><line x1="466.333" y1="92" x2="489.333" y2="92" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="176" width="206.667" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="123.333" y="211.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">make_records</text><text x="123.333" y="230.7" font-size="14" text-anchor="middle" fill="#292929">미리 채움</text><rect x="256.667" y="176" width="206.667" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360" y="211.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">save_records</text><text x="360" y="230.7" font-size="14" text-anchor="middle" fill="#292929">미리 채움</text><line x1="229.667" y1="216" x2="252.667" y2="216" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="493.333" y="176" width="206.667" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="596.667" y="211.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">unit05_risk</text><text x="596.667" y="230.7" font-size="14" text-anchor="middle" fill="#292929">_scores.json</text><line x1="466.333" y1="216" x2="489.333" y2="216" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="586" y1="134" x2="130" y2="172" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><text x="20" y="296" font-size="15" text-anchor="start" fill="#666660">① map(WEIGHTS) 로 점수 → ② groupby("entity") 의 sum() 으로 대상별 합계</text><text x="20" y="326" font-size="15" text-anchor="start" fill="#666660">if score &gt;= HIGH_LIMIT: return "high" → mid → low</text><text x="20" y="356" font-size="15" text-anchor="start" fill="#666660">record 의 int(score) 는 판다스 숫자를 파이썬 정수로 바꿔 둔다</text><text x="20" y="386" font-size="15" text-anchor="start" fill="#666660">출력: 단계 1 규칙 수 · 단계 2 대상별 점수 · 단계 3 저장 건수 · 단계 4 기록</text></svg>
