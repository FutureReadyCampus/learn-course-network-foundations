<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>응용 4-3: 예외 적용, 합치기, 평가, 한 문장 순서로 단계 1 ~ 5 가 나옵니다</title>
<desc>apply_exception 으로 믿는 IP 예외를 다시 적용하고, merge_alerts 가 pd.concat 으로 로그인 규칙 알림을 합칩니다. evaluate 는 dropna 로 문제 번호만 남겨 isin 과 ~ 로 놓친 문제를 구하고, make_summary 가 세 숫자를 한 문장으로 만듭니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
