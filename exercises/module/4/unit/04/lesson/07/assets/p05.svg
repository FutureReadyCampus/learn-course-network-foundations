<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>도전 4-3 정리: concat 으로 합치고, dropna · isin · ~ 로 놓친 문제를 고릅니다</title>
<desc>pd.concat 에는 두 표를 대괄호 리스트로 전달합니다. problem 열의 빈 값을 dropna 로 지워 문제 번호만 남기고, problems 의 id 가 그 안에 있는지 isin 으로 구한 뒤 ~ 로 뒤집어 놓친 문제를 고릅니다. 숫자는 str() 로 바꿔 문장에 이어 붙입니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 4-3 정리</text>
<rect x="20" y="56" width="680" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="87.0" font-size="14" fill="#292929" text-anchor="middle">pd.concat([alerts, login_alerts])  →  all_alerts</text>
<rect x="20" y="140" width="190" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115.0" y="171.0" font-size="14" fill="#292929" text-anchor="middle">["problem"].dropna()</text>
<polyline points="210,166 226,166" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="230" y="140" width="150" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="305.0" y="171.0" font-size="14" fill="#292929" text-anchor="middle">isin(caught_ids)</text>
<polyline points="380,166 396,166" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="400" y="140" width="100" height="52" rx="8" fill="#f8e8e3" stroke="#dededb" stroke-width="1.5"/>
<text x="450.0" y="171.0" font-size="14" fill="#292929" text-anchor="middle">~is_caught</text>
<polyline points="500,166 516,166" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="520" y="140" width="180" height="52" rx="8" fill="#f8e8e3" stroke="#dededb" stroke-width="1.5"/>
<text x="610.0" y="171.0" font-size="14" fill="#292929" text-anchor="middle">problems[is_missed]</text>
<polyline points="360,108 360,120 110,120 110,136" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="224" width="680" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="255.0" font-size="14" fill="#292929" text-anchor="middle">"알림 " + str(alert_count) + "개 중 …"</text>
<text x="20" y="310" font-size="15" fill="#666660">두 괄호를 잊지 않습니다: concat 의 [ ] 와 dropna 의 ( )</text>
</g>
</svg>
