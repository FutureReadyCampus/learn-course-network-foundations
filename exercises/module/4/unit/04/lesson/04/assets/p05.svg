<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img">
<title>실습 4-3 정리: if 규칙 두 개, to_dict 한 줄, 유형별 세기 한 줄</title>
<desc>비정상 로그인과 비인가 접근은 and 로 이은 if 규칙으로 정합니다. 표는 to_dict("records") 로 리스트로 바꾸고, 유형별 개수는 get(type_name, 0) + 1 로 셉니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-3 정리</text>
<rect x="20" y="56" width="330" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="185.0" y="91" font-size="15" text-anchor="middle" fill="#292929"><tspan x="185.0" dy="0" font-weight="700">비정상 로그인</tspan><tspan x="185.0" dy="20">if result == "실패" and</tspan><tspan x="185.0" dy="20">action == "POST /login":</tspan></text>
<rect x="370" y="56" width="330" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="535.0" y="91" font-size="15" text-anchor="middle" fill="#292929"><tspan x="535.0" dy="0" font-weight="700">비인가 접근</tspan><tspan x="535.0" dy="20">if result == "실패" and</tspan><tspan x="535.0" dy="20">"/admin" in action:</tspan></text>
<rect x="20" y="174" width="330" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185.0" y="209" font-size="15" text-anchor="middle" fill="#292929"><tspan x="185.0" dy="0" font-weight="700">표를 리스트로</tspan><tspan x="185.0" dy="20">event_list =</tspan><tspan x="185.0" dy="20">events.to_dict("records")</tspan></text>
<rect x="370" y="174" width="330" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="535.0" y="209" font-size="15" text-anchor="middle" fill="#292929"><tspan x="535.0" dy="0" font-weight="700">유형별 세기 (미리 채움)</tspan><tspan x="535.0" dy="20">type_event_counts.get(</tspan><tspan x="535.0" dy="20">type_name, 0) + 1</tspan></text>
<text x="20" y="312" font-size="15" text-anchor="start" fill="#292929" font-weight="700">좁은 조건(로그인 실패, 관리자 경로)을 위에, 넓은 조건(모든 실패)을 아래에</text>
<text x="20" y="338" font-size="14" text-anchor="start" fill="#666660">and 는 이벤트 한 건의 값을 잇고, &amp; 는 표의 열끼리 잇는다</text>
</g>
</svg>
