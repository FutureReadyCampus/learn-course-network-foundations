<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>마무리: 파일을 확인하고 .env 가 없는지 본 뒤 깃허브에 올린다</title><desc>anomaly_detection 폴더에서 오늘 만든 파일을 ls 로 확인하고, network-study-notes 으로 옮겨 git status 를 봅니다. .env 나 .venv 가 보이면 멈추고 .gitignore 에 적습니다. 보고서 마무리 칸을 채운 뒤 add, commit, push 하고 브라우저에서 확인합니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">이번 Unit 마무리 · 깃허브에 올리기</text><rect x="20" y="60" width="214" height="96" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="127.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">① ls 로 파일 확인</text><text x="127.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">오늘 만든 파일</text><line x1="236" y1="108" x2="249" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="253" y="60" width="214" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="360.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">② cd .. · pwd</text><text x="360.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">network-study-notes</text><line x1="469" y1="108" x2="482" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="486" y="60" width="214" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="593.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ git status</text><text x="593.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">.env · .venv 보이면 멈춤</text><rect x="20" y="190" width="214" height="96" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="127.0" y="233.