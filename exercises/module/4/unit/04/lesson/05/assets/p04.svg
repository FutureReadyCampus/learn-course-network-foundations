<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>correlation.py의 세 함수로 웹 이벤트에 사용자를 붙이고 합쳐 연결된 사건을 찾는다</title><desc>웹 실패 표와 IP → 사용자 딕셔너리로 attach_user_to_web(1번)이 user 열을 붙이고, build_timeline(2·3번)이 세 로그를 합쳐 정렬하며, find_chains(4·5번)가 연결된 사건과 연결되지 않은 사용자를 나눕니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">도전 4-1: correlation.py 의 흐름</text><rect x="20" y="52" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="81.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 실패 표</text><text x="120" y="102.8" font-size="15" text-anchor="middle" fill="#666660">+ ip_user 딕셔너리</text><rect x="20" y="140" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="169.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">server_part</text><text x="120" y="190.8" font-size="15" text-anchor="middle" fill="#292929">saas_part</text><rect x="260" y="52" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="82.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">attach_user_to_web</text><text x="360" y="101.7" font-size="14" text-anchor="middle" fill="#666660">직접 쓰기 1번</text><rect x="260" y="140" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="170.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">build_timeline</text><text x="360" y="189.7" font-size="14" text-anchor="middle" fill="#666660">직접 쓰기 2 · 3번</text><rect x="500" y="140" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="600" y="170.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">find_chains</text><text x="600" y="189.7" font-size="14" text-anchor="middle" fill="#666660">직접 쓰기 4 · 5번</text><line x1="222" y1="87" x2="256" y2="87" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="222" y1="175" x2="256" y2="175" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="360" y1="124" x2="360" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="462" y1="175" x2="496" y2="175" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="500" y="236" width="200" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="600" y="261.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">chains</text><text x="600" y="280.7" font-size="14" text-anchor="middle" fill="#666660">2종류 이상 · 60분 이내</text><rect x="260" y="236" width="200" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="360" y="261.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">not_chained</text><text x="360" y="280.7" font-size="14" text-anchor="middle" fill="#666660">2종류 이상 · 60분 초과</text><line x1="600" y1="212" x2="600" y2="232" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="560" y1="212" x2="400" y2="232" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="236" width="200" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="120" y="270.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">challenge4-1_run.py</text><text x="20" y="330" font-size="15" text-anchor="start" fill="#666660">출력: 단계 1 사용자를 아는 웹 이벤트 수 · 단계 2 합친 수와 gaeun 의 흐름</text><text x="20" y="358" font-size="15" text-anchor="start" fill="#666660">단계 3 연결된 사건 · 단계 4 60분을 넘어 연결되지 않은 사용자</text><text x="20" y="388" font-size="15" text-anchor="start" fill="#666660">4번 이유 모양: 서로 다른 로그 2종류 · 30분 안 (숫자는 사용자마다 다르다)</text></svg>
