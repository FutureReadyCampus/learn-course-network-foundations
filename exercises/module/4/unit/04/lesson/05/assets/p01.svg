<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답은 한 예이고, 내 답의 핵심이 같으면 맞다</title>
<desc>내 답과 정답의 예를 비교해 핵심이 같은지 봅니다. 표현이 달라도 핵심이 같으면 맞습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답 보는 법</text>
<rect x="20" y="62" width="170" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="105.0" y="103" font-size="16" text-anchor="middle" fill="#292929"><tspan x="105.0" dy="0" font-weight="700">내 답</tspan></text>
<rect x="20" y="160" width="170" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="105.0" y="201" font-size="16" text-anchor="middle" fill="#292929"><tspan x="105.0" dy="0" font-weight="700">정답의 예</tspan></text>
<rect x="250" y="106" width="200" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="350.0" y="152" font-size="16" text-anchor="middle" fill="#292929"><tspan x="350.0" dy="0" font-weight="700">핵심이 같은가?</tspan></text>
<rect x="510" y="106" width="190" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605.0" y="141" font-size="15" text-anchor="middle" fill="#292929"><tspan x="605.0" dy="0" font-weight="700">맞음</tspan><tspan x="605.0" dy="20">표현은 달라도 된다</tspan></text>
<polyline points="193,97 246,130" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="193,195 246,162" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="453,146 506,146" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="20" y="274" font-size="14" text-anchor="start" fill="#666660">정답마다: 터미널 입력 → 채운 코드 → 결과 → 왜 → 자주 틀리는 곳 → 관제에서는</text>
</g>
</svg>
