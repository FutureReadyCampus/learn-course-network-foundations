<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>도전 4-1 정리: map, concat, sort_values, 이유 문장 연결의 네 줄</title><desc>도전 4-1에서 직접 쓴 네 가지 일을 순서대로 이었습니다. IP로 사용자를 채우고, 세 표를 잇고, 두 열로 정렬한 뒤, 숫자를 str로 바꿔 이유 문장을 만듭니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">도전 4-1 정리: 네 줄의 흐름</text><rect x="20" y="52" width="190" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="115" y="82.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">1. IP 로 사용자 채우기</text><rect x="240" y="52" width="460" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="470" y="82.9" font-size="14" text-anchor="middle" fill="#292929">users = web_part["ip"].map(ip_user)</text><line x1="212" y1="78" x2="236" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="122" width="190" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="115" y="152.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">2. 표 위아래로 잇기</text><rect x="240" y="122" width="460" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="470" y="152.9" font-size="14" text-anchor="middle" fill="#292929">pd.concat([server_part, saas_part, web_part])</text><line x1="212" y1="148" x2="236" y2="148" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="115" y1="105" x2="115" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="192" width="190" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="115" y="222.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">3. 열 두 개로 정렬</text><rect x="240" y="192" width="460" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="470" y="222.9" font-size="14" text-anchor="middle" fill="#292929">timeline.sort_values(["user", "time"])</text><line x1="212" y1="218" x2="236" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="115" y1="175" x2="115" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="262" width="190" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="115" y="292.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">4. 이유 문장 만들기</text><rect x="240" y="262" width="460" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="470" y="292.9" font-size="14" text-anchor="middle" fill="#292929">"서로 다른 로그 " + str(source_count) + "종류 · " …</text><line x1="212" y1="288" x2="236" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="115" y1="245" x2="115" y2="260" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/></svg>
