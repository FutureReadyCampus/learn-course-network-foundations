<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>오늘의 계획: 제공 파일을 받고 점수 매기기와 오탐 줄이기 두 실습을 한다</title><desc>약 2시간 40분은 시작 15분, 핵심 실습 약 110분, 세 문장 글쓰기 20분, 마무리 15분입니다. 남는 20분은 밀린 사람을 위한 여유입니다. 제공 파일 세 개로 실습 4-1의 위험 점수 파일을 만들고, 알림 파일로 실습 4-2에서 오탐을 4개에서 2개로 줄입니다. 응용은 선택입니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오늘의 계획 (약 2시간 40분): 점수 매기기와 오탐 줄이기</text><rect x="20" y="52" width="130" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="85.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">시작</text><text x="85.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">15분</text><rect x="160" y="52" width="290" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="305.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">핵심 실습</text><text x="305.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">약 110분</text><rect x="460" y="52" width="140" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="530.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">글쓰기</text><text x="530.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">20분</text><rect x="610" y="52" width="90" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="655.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">마무리</text><text x="655.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">15분</text><rect x="20" y="132" width="210" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="125.0" y="162.5" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">제공 파일 3개</text><text x="125.0" y="182.1" font-size="14" text-anchor="middle" fill="#666660">saas_detection.py</text><text x="125.0" y="201.7" font-size="14" text-anchor="middle" fill="#666660">malicious_detection.py</text><text x="125.0" y="221.3" font-size="14" text-anchor="middle" fill="#666660">correlation.py</text><rect x="255" y="132" width="210" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="171.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 4-1</text><text x="360.0" y="192.2" font-size="15" text-anchor="middle" fill="#666660">risk_scores.py</text><text x="360.0" y="213.2" font-size="15" text-anchor="middle" fill="#666660">규칙마다 점수 더하기</text><rect x="490" y="132" width="210" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="595.0" y="172.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">저장</text><text x="595.0" y="191.9" font-size="14" text-anchor="middle" fill="#666660">unit05_risk_scores.json</text><text x="595.0" y="211.5" font-size="14" text-anchor="middle" fill="#666660">점수 · 등급 · 이유 5건</text><line x1="232" y1="187" x2="251" y2="187" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><line x1="467" y1="187" x2="486" y2="187" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="262" width="210" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="125.0" y="294.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">알림 파일</text><text x="125.0" y="315.8" font-size="15" text-anchor="middle" fill="#666660">review_alerts.json</text><rect x="255" y="262" width="210" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="294.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 4-2</text><text x="360.0" y="315.8" font-size="15" text-anchor="middle" fill="#666660">tuning.py 예외 규칙</text><rect x="490" y="262" width="210" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="595.0" y="294.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">오탐 4 → 2</text><text x="595.0" y="315.8" font-size="15" text-anchor="middle" fill="#666660">진짜 문제는 그대로</text><line x1="232" y1="300" x2="251" y2="300" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><line x1="467" y1="300" x2="486" y2="300" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><text x="20" y="372" font-size="15" text-anchor="start" fill="#666660">응용 4-1 ~ 4-3 은 선택 · 핵심 실습과 글쓰기를 먼저 마친다</text></svg>
