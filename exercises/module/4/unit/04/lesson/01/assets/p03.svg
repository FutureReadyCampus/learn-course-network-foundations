<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>review_alerts.json 에 알림 7개를 붙여 넣고 확인 명령으로 7을 본다</title><desc>anomaly_detection 폴더에 review_alerts.json 을 만들어 알림 7개를 붙여 넣습니다. 알림마다 규칙, 사용자, IP, 진짜 문제였는지(real)가 있습니다. 확인 명령이 7을 출력하면 정상이고, problems.json 과 login_alerts.json 은 응용 레슨에서 만듭니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">알림 파일 만들기</text><rect x="20" y="56" width="220" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="130.0" y="100.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">anomaly_detection/</text><text x="130.0" y="121.2" font-size="15" text-anchor="middle" fill="#666660">review_alerts.json</text><text x="130.0" y="142.2" font-size="15" text-anchor="middle" fill="#666660">New File · 붙여 넣기</text><rect x="270" y="56" width="430" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="485.0" y="91.5" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">알림 7개 (A1 ~ A7)</text><text x="485.0" y="111.1" font-size="14" text-anchor="middle" fill="#666660">rule · user · ip</text><text x="485.0" y="130.7" font-size="14" text-anchor="middle" fill="#666660">real: 조사해 보니 진짜 문제였나</text><text x="485.0" y="150.3" font-size="14" text-anchor="middle" fill="#666660">problem · memo</text><line x1="242" y1="116" x2="266" y2="116" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="200" width="330" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="185.0" y="234.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">확인 명령</text><text x="185.0" y="255.8" font-size="15" text-anchor="middle" fill="#666660">len(pd.read_json(…)) → 7</text><rect x="370" y="200" width="330" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="535.0" y="234.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">응용에서 만드는 파일</text><text x="535.0" y="255.8" font-size="15" text-anchor="middle" fill="#666660">problems.json · login_alerts.json</text><text x="20" y="320" font-size="15" text-anchor="start" fill="#666660">같은 이름의 파일이 이미 있으면 이 내용으로 덮어쓴다</text></svg>
