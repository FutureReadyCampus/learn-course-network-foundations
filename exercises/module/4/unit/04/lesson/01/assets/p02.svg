<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>anomaly_detection 폴더에 Unit 3 파일이 있는지 보고 확인 명령으로 57을 본다</title><desc>anomaly_detection 폴더에 Unit 3에서 만든 이벤트 파일, rbac.py, config, access_detection.py 가 있는지 pwd와 ls로 봅니다. 여러 줄 확인 명령에서 Unit 3 파일 정상 57 이 나오면 됩니다. 고정 입력과 알림 파일, 기술 기록은 뒤에서 준비합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">폴더 열고 이전 파일 확인하기</text><rect x="20" y="52" width="340" height="330" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="36" y="80" font-size="16" text-anchor="start" fill="#292929" font-weight="700">network-study-notes/</text><text x="52" y="110" font-size="16" text-anchor="start" fill="#292929" font-weight="700">anomaly_detection/</text><text x="72" y="142" font-size="15" text-anchor="start" fill="#292929">normalized_events.json</text><text x="72" y="174" font-size="15" text-anchor="start" fill="#292929">rbac.py · config/</text><text x="72" y="206" font-size="15" text-anchor="start" fill="#292929">access_detection.py</text><text x="72" y="238" font-size="15" text-anchor="start" fill="#9a6200" font-weight="700">제공 파일 3개 (제공 파일 레슨)</text><text x="72" y="270" font-size="15" text-anchor="start" fill="#9a6200" font-weight="700">review_alerts.json (다음 페이지)</text><text x="72" y="302" font-size="15" text-anchor="start" fill="#9a6200" font-weight="700">report_u4.md (보고서 쓰기)</text><text x="36" y="370" font-size="14" text-anchor="start" fill="#666660">주황색 파일은 뒤에서 복사해 만든다</text><rect x="390" y="52" width="310" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="545.0" y="82.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">① 위치 확인</text><text x="545.0" y="103.2" font-size="15" text-anchor="middle" fill="#666660">cd anomaly_detection</text><text x="545.0" y="124.2" font-size="15" text-anchor="middle" fill="#666660">pwd · ls</text><rect x="390" y="166" width="310" height="92" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="545.0" y="197.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">② Unit 3 파일 확인</text><text x="545.0" y="216.9" font-size="14" text-anchor="middle" fill="#666660">python -c &quot;from access_detection …&quot;</text><text x="545.0" y="236.5" font-size="14" text-anchor="middle" fill="#666660">Unit 3 파일 정상 57</text><rect x="390" y="280" width="310" height="102" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="545.0" y="316.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ 안 나오면</text><text x="545.0" y="335.9" font-size="14" text-anchor="middle" fill="#666660">access_detection 없음 → 예비 코드</text><text x="545.0" y="355.5" font-size="14" text-anchor="middle" fill="#666660">rbac · 이벤트 없음 → Unit 3 시작하기</text><line x1="545" y1="146" x2="545" y2="162" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="545" y1="260" x2="545" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/></svg>
