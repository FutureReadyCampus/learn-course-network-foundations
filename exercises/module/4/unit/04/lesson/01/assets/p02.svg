<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>anomaly_detection 폴더에 샘플 파일 두 개를 New File 로 만들고 57과 8 확인</title>
<desc>security-agent-toolkit 아래 anomaly_detection 폴더에 normalized_events.json 과 baseline_logins.csv 를 New File 로 만들어 붙여 넣습니다. 실습 결과 기록 report_u4.md 는 「실습 결과 기록 준비」 레슨에서 만듭니다. 확인 명령에서 57과 8이 나오면 됩니다.</desc>
