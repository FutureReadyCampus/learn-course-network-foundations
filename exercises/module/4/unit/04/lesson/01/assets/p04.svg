<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>오류가 나면 위치와 파일 이름을 먼저 보고, 메시지에 맞게 고친다</title><desc>먼저 pwd 와 ls 로 위치와 파일 이름을 봅니다. pandas 가 없으면 python -m pip install pandas 로 설치하고, access_detection 을 못 찾으면 위험 점수 입력 준비 레슨의 예비 코드로 만들며, 파일 오류는 위치와 JSON 쉼표를 봅니다. 그래도 막히면 AI 에게 묻거나 실습 아래 정답을 펼쳐 봅니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text><rect x="20" y="50" width="680" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360.0" y="78.2" font-size="15" text-anchor="middle" fill="#292929">먼저: pwd 가 anomaly_detection 으로 끝나나 · ls 의 파일 이름이 같은가</text><rect x="20" y="112" width="220" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="130.0" y="141.9" font-size="14" text-anchor="middle" fill="#292929">No module &#x27;pandas&#x27;</text><rect x="262" y="112" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362.0" y="141.9" font-size="14" text-anchor="middle" fill="#292929">판다스가 설치 안 됨</text><rect x="484" y="112" width="216" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592.0" y="141.9" font-size="14" text-anchor="middle" fill="#292929">python -m pip install pandas</text><line x1="242" y1="137" x2="258" y2="137" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="464" y1="137" x2="480" y2="137" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="176" width="220" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="130.0" y="205.9" font-size="14" text-anchor="middle" fill="#292929">access_detection 없음</text><rect x="262" y="176" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362.0" y="205.9" font-size="14" text-anchor="middle" fill="#292929">Unit 3 실습 3-2 파일 없음</text><rect x="484" y="176" width="216" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592.0" y="205.9" font-size="14" text-anchor="middle" fill="#292929">제공 파일의 예비 코드</text><line x1="242" y1="201" x2="258" y2="201" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="464" y1="201" x2="480" y2="201" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="240" width="220" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="130.0" y="269.9" font-size="14" text-anchor="middle" fill="#292929">FileNotFoundError</text><rect x="262" y="240" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362.0" y="269.9" font-size="14" text-anchor="middle" fill="#292929">위치 · JSON 쉼표 · 괄호</text><rect x="484" y="240" width="216" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592.0" y="269.9" font-size="14" text-anchor="middle" fill="#292929">폴더 안에 다시 만들기</text><line x1="242" y1="265" x2="258" y2="265" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="464" y1="265" x2="480" y2="265" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="304" width="220" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="130.0" y="333.9" font-size="14" text-anchor="middle" fill="#292929">그 밖의 오류</text><rect x="262" y="304" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362.0" y="333.9" font-size="14" text-anchor="middle" fill="#292929">오류 전체 + 친 명령</text><rect x="484" y="304" width="216" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592.0" y="333.9" font-size="14" text-anchor="middle" fill="#292929">AI 에게 묻기 · 정답 보기</text><line x1="242" y1="329" x2="258" y2="329" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="464" y1="329" x2="480" y2="329" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><text x="20" y="386" font-size="15" text-anchor="start" fill="#666660">실행은 VS Code 의 ▶ 단추가 아니라 터미널에서 한다</text></svg>
