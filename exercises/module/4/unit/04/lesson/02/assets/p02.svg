<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>saas_detection.py 의 세 함수가 SaaS 이벤트에서 세 가지 이상 사용을 찾는다</title><desc>SaaS 이벤트에서 로그인만 골라 업무 시간 밖 로그인과 평소와 다른 IP 를 찾고, 다운로드를 세어 대량 다운로드 사용자를 찾습니다. 오늘 데이터에서는 jiwoo, jiwoo와 seoyeon, seoyeon 이 나옵니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">saas_detection.py: SaaS 이상 사용 세 가지</text><rect x="20" y="120" width="170" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="105.0" y="150.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">SaaS 이벤트</text><text x="105.0" y="169.9" font-size="14" text-anchor="middle" fill="#666660">pick_saas</text><text x="105.0" y="189.5" font-size="14" text-anchor="middle" fill="#666660">pick_logins</text><rect x="220" y="56" width="270" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="355.0" y="86.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">find_off_hours_logins</text><text x="355.0" y="105.7" font-size="14" text-anchor="middle" fill="#666660">8시 ~ 20시대 밖</text><rect x="520" y="56" width="180" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="610.0" y="96.2" font-size="15" text-anchor="middle" fill="#292929">jiwoo 02:14</text><line x1="192" y1="165" x2="216" y2="91" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="492" y1="91" x2="516" y2="91" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="220" y="146" width="270" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="355.0" y="176.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">find_new_ip_users</text><text x="355.0" y="195.7" font-size="14" text-anchor="middle" fill="#666660">평소 IP 와 다름</text><rect x="520" y="146" width="180" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="610.0" y="186.2" font-size="15" text-anchor="middle" fill="#292929">jiwoo · seoyeon</text><line x1="192" y1="165" x2="216" y2="181" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="492" y1="181" x2="516" y2="181" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="220" y="236" width="270" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="355.0" y="266.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">find_bulk_download_users</text><text x="355.0" y="285.7" font-size="14" text-anchor="middle" fill="#666660">5번 이상 다운로드</text><rect x="520" y="236" width="180" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="610.0" y="276.2" font-size="15" text-anchor="middle" fill="#292929">seoyeon</text><line x1="192" y1="165" x2="216" y2="271" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="492" y1="271" x2="516" y2="271" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><text x="20" y="340" font-size="14" text-anchor="start" fill="#666660">~is_business_hour: 업무 시간 안이 아닌 행을 True 로 뒤집는다</text></svg>
