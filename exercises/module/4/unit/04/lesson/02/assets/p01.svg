<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>탐지됨만 있던 결과에 규칙별 점수를 더해 등급과 이유를 파일로 남긴다</title><desc>탐지 결과가 모두 탐지됨이면 어느 대상부터 볼지 정할 수 없습니다. 규칙마다 점수를 주고 대상마다 더해 high·mid·low로 나누고, 탐지된 규칙 이름을 이유로 함께 저장합니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">목표: 「탐지됨」 → 점수 · 등급 · 이유</text><rect x="20" y="60" width="152" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="96" y="100.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">지금</text><text x="96" y="119.9" font-size="14" text-anchor="middle" fill="#292929">모두 「탐지됨」</text><text x="96" y="139.5" font-size="14" text-anchor="middle" fill="#292929">순서를 못 정함</text><rect x="196" y="60" width="152" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="272" y="110.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">규칙마다 점수</text><text x="272" y="129.7" font-size="14" text-anchor="middle" fill="#292929">대상마다 더하기</text><line x1="175" y1="115" x2="192" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="372" y="60" width="152" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="448" y="110.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">high · mid · low</text><text x="448" y="129.7" font-size="14" text-anchor="middle" fill="#292929">+ 탐지된 규칙 이름</text><line x1="351" y1="115" x2="368" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="548" y="60" width="152" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="624" y="110.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">unit05_risk</text><text x="624" y="129.7" font-size="14" text-anchor="middle" fill="#292929">_scores.json</text><line x1="527" y1="115" x2="544" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><text x="20" y="218" font-size="15" text-anchor="start" fill="#666660">대상 = 사용자 또는 IP</text><text x="20" y="250" font-size="15" text-anchor="start" fill="#666660">퇴사한 계정의 반복 시도와 파일을 한 번 더 내려받은 것은 같은 무게가 아니다</text><text x="20" y="282" font-size="15" text-anchor="start" fill="#666660">이유가 없으면 담당자가 점수의 근거를 확인하기 어렵다</text></svg>
