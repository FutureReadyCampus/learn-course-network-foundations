<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>제공 파일 세 개와 Unit 3 파일을 실습 4-1의 risk_scores.py 가 불러 쓴다</title><desc>saas_detection.py, malicious_detection.py, correlation.py 를 복사해 만들고, Unit 3 실습 3-2의 access_detection.py 가 없으면 예비 코드로 만듭니다. 실습 4-1의 risk_scores.py 가 이 파일들을 불러 씁니다. 확인 명령이 제공 파일 정상 1 을 출력하면 됩니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">제공 파일 쓰는 법</text><rect x="20" y="52" width="300" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="170.0" y="76.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">access_detection.py</text><text x="170.0" y="95.7" font-size="14" text-anchor="middle" fill="#666660">Unit 3 · 없으면 예비 코드</text><line x1="322" y1="81" x2="446" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="122" width="300" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="170.0" y="146.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">saas_detection.py</text><text x="170.0" y="165.7" font-size="14" text-anchor="middle" fill="#666660">SaaS 세 규칙</text><line x1="322" y1="151" x2="446" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="192" width="300" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="170.0" y="216.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">malicious_detection.py</text><text x="170.0" y="235.7" font-size="14" text-anchor="middle" fill="#666660">경로 스캔</text><line x1="322" y1="221" x2="446" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="262" width="300" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="170.0" y="286.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">correlation.py</text><text x="170.0" y="305.7" font-size="14" text-anchor="middle" fill="#666660">로그 연결</text><line x1="322" y1="291" x2="446" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="450" y="110" width="250" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="575.0" y="144.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 4-1</text><text x="575.0" y="165.2" font-size="15" text-anchor="middle" fill="#666660">risk_scores.py</text><text x="575.0" y="186.2" font-size="15" text-anchor="middle" fill="#666660">규칙을 모아 점수 매기기</text><rect x="20" y="330" width="680" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360.0" y="354.9" font-size="14" text-anchor="middle" fill="#292929">확인: python -c &quot;…&quot; → 제공 파일 정상 1 (연결된 사건 gaeun)</text></svg>
