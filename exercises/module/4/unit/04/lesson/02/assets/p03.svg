<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>웹 실패 이벤트에서 스캐너 경로를 요청한 IP 를 세어 198.51.100.90 을 찾는다</title><desc>웹 서버 로그의 실패 이벤트만 고른 뒤, 요청에 /.env, /wp-login, /phpmyadmin 이 들어 있는지 봅니다. 그 행의 IP 를 세면 198.51.100.90 이 3번으로 나와 경로 스캔으로 봅니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">malicious_detection.py: 경로 스캔 IP 찾기</text><rect x="20" y="70" width="200" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120.0" y="110.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">pick_web_failures</text><text x="120.0" y="129.9" font-size="14" text-anchor="middle" fill="#666660">source 가 web</text><text x="120.0" y="149.5" font-size="14" text-anchor="middle" fill="#666660">result 가 실패</text><rect x="250" y="70" width="220" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="110.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">스캐너 경로인가</text><text x="360.0" y="129.9" font-size="14" text-anchor="middle" fill="#666660">/.env · /wp-login</text><text x="360.0" y="149.5" font-size="14" text-anchor="middle" fill="#666660">/phpmyadmin</text><rect x="500" y="70" width="200" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="600.0" y="110.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">IP 별로 세기</text><text x="600.0" y="129.9" font-size="14" text-anchor="middle" fill="#666660">198.51.100.90</text><text x="600.0" y="149.5" font-size="14" text-anchor="middle" fill="#666660">3번 → 경로 스캔</text><line x1="222" y1="125" x2="246" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><line x1="472" y1="125" x2="496" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><text x="20" y="230" font-size="15" text-anchor="start" fill="#666660">find_scan_ips 가 스캔 IP 리스트와 IP 별 횟수를 돌려준다</text><text x="20" y="262" font-size="15" text-anchor="start" fill="#666660">explain_scan 은 오늘 쓰지 않지만 Unit 3 과 같은 파일이라 둔다</text></svg>
