<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>IP 로 사용자를 채우고 세 로그를 합친 뒤 두 조건이 맞는 사용자만 연결한다</title><desc>SaaS 성공 로그인으로 IP 와 사용자를 짝지어 웹 이벤트에 사용자를 채웁니다. 서버, SaaS, 웹 이벤트를 합쳐 사용자와 시각 순으로 놓고, 서로 다른 로그 2종류 이상이면서 60분 이내인 사용자만 사건으로 연결합니다. 오늘은 gaeun 한 명입니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">correlation.py: 세 로그를 한 사용자로 연결</text><rect x="20" y="60" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="125.0" y="95.5" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">① 사용자 채우기</text><text x="125.0" y="115.1" font-size="14" text-anchor="middle" fill="#666660">SaaS 성공 로그인</text><text x="125.0" y="134.7" font-size="14" text-anchor="middle" fill="#666660">IP → 사용자</text><text x="125.0" y="154.3" font-size="14" text-anchor="middle" fill="#666660">웹 이벤트에 user</text><rect x="255" y="60" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="95.5" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">② 합치고 정렬</text><text x="360.0" y="115.1" font-size="14" text-anchor="middle" fill="#666660">서버 · SaaS · 웹</text><text x="360.0" y="134.7" font-size="14" text-anchor="middle" fill="#666660">concat</text><text x="360.0" y="154.3" font-size="14" text-anchor="middle" fill="#666660">user · time 순</text><rect x="490" y="60" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="595.0" y="105.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ 두 조건 모두</text><text x="595.0" y="124.9" font-size="14" text-anchor="middle" fill="#666660">로그 2종류 이상</text><text x="595.0" y="144.5" font-size="14" text-anchor="middle" fill="#666660">60분 이내</text><line x1="232" y1="120" x2="251" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="467" y1="120" x2="486" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="210" width="680" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360.0" y="234.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">결과: find_chains_in_events</text><text x="360.0" y="255.8" font-size="15" text-anchor="middle" fill="#666660">gaeun · 서로 다른 로그 3종류 · 41분 안</text><text x="20" y="312" font-size="15" text-anchor="start" fill="#666660">실습 4-1 은 find_chains_in_events 하나만 불러 쓴다</text></svg>
