<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>Unit 3 파일 정상 57 이 안 나올 때만 access_detection.py 예비 코드를 만든다</title><desc>시작하기의 확인에서 Unit 3 파일 정상 57 이 나왔으면 이 페이지는 건너뜁니다. 나오지 않았으면 Unit 3 실습 3-2 완성본으로 access_detection.py 를 만들고, rbac.py 나 이벤트 파일이 없으면 Unit 3 시작하기에서 먼저 만든 뒤 다시 확인합니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">Unit 3 파일이 없을 때 access_detection.py</text><rect x="20" y="60" width="260" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="150.0" y="94.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">확인 명령 결과</text><text x="150.0" y="115.8" font-size="15" text-anchor="middle" fill="#666660">Unit 3 파일 정상 57 ?</text><rect x="330" y="60" width="370" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="515.0" y="95.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">예 → 이 페이지는 건너뛴다</text><text x="515.0" y="114.7" font-size="14" text-anchor="middle" fill="#666660">Unit 3 에서 만든 파일을 그대로 쓴다</text><line x1="282" y1="100" x2="326" y2="100" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="170" width="260" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="150.0" y="204.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">아니오</text><text x="150.0" y="225.8" font-size="15" text-anchor="middle" fill="#666660">ImportError · No module</text><rect x="330" y="170" width="370" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="515.0" y="205.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">access_detection.py 만들기</text><text x="515.0" y="224.7" font-size="14" text-anchor="middle" fill="#666660">Unit 3 실습 3-2 완성본 붙여 넣기</text><line x1="150" y1="142" x2="150" y2="166" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="282" y1="210" x2="326" y2="210" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="330" y="270" width="370" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="515.0" y="302.9" font-size="14" text-anchor="middle" fill="#292929">rbac.py · 데이터 없으면 Unit 3 시작하기</text><line x1="515" y1="252" x2="515" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><text x="20" y="300" font-size="15" text-anchor="start" fill="#666660">다 만든 뒤 확인 명령을 다시 친다</text></svg>
