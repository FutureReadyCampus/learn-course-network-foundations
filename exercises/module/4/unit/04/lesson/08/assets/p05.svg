<text x="360.0" y="196.8" font-size="14" fill="#292929" text-anchor="middle">P4 203.0.113.50 로그인 실패 뒤 관리자 화면 · P5 seoyeon 정산 조회</text>
<text x="20" y="248" font-size="16" fill="#292929" font-weight="700">자주 틀리는 곳</text>
