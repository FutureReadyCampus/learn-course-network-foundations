<text x="540.0" y="99.0" font-size="14" fill="#292929" text-anchor="middle">평소와 다른 IP 2 · 서버 반복 거절 1</text>
<text x="540.0" y="118.6" font-size="14" fill="#292929" text-anchor="middle">업무 시간 밖 로그인 1</text>
<rect x="20" y="150" width="680" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
