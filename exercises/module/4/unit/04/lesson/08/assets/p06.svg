<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>응용 4-3 정답: 남은 5개에 A8 을 합쳐 6개, 오탐 2개 · 놓친 문제 1개</title>
<desc>예외 규칙으로 2개가 빠져 5개가 남고, A8 을 합쳐 6개가 됩니다. 오탐은 2개 그대로이고 놓친 문제는 P5 하나입니다. 한 문장 요약은 알림 6개 중 오탐 2개 · 놓친 문제 1개 입니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">응용 4-3 정답</text>
<rect x="20" y="56" width="156" height="74" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="98.0" y="88.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 1</text>
<text x="98.0" y="107.8" font-size="14" fill="#292929" text-anchor="middle">빠진 2 · 남은 5</text>
