<text x="270.0" y="88.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 2</text>
<text x="270.0" y="107.8" font-size="14" fill="#292929" text-anchor="middle">합친 뒤 6</text>
<polyline points="348,93 360,93" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="364" y="56" width="156" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="442.0" y="88.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 3</text>
<text x="442.0" y="107.8" font-size="14" fill="#292929" text-anchor="middle">오탐 2</text>
<polyline points="520,93 532,93" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="536" y="56" width="156" height="74" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="614.0" y="88.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 4</text>
<text x="614.0" y="107.8" font-size="14" fill="#292929" text-anchor="middle">미탐 1 · P5</text>
<rect x="20" y="146" width="680" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="179.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">단계 5 · 알림 6개 중 오탐 2개 · 놓친 문제 1개</text>
<text x="20" y="236" font-size="16" fill="#292929" font-weight="700">자주 틀리는 곳</text>
<rect x="20" y="250" width="180" height="40" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="110.0" y="275.0" font-size="14" fill="#292929" text-anchor="middle">pd.concat(a, b)</text>
<text x="216" y="276" font-size="14" fill="#666660">TypeError · takes 1 positional</text>
<polyline points="510,270 526,270" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="530" y="250" width="170" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
