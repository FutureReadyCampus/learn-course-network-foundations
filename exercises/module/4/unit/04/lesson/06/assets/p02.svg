<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 307" role="img">
<title>실습 4-1 실습 결과 기록: (가) · (나) · (다) 에 채울 칸 체크리스트</title>
<desc>실습 4-1 실습 결과 기록의 (가)는 출력 전체와 평균·최댓값·알림 기준, (나)는 평균 대신 최댓값보다 1 큰 숫자를 쓰는 이유, (다)는 12번인 날이 섞였을 때 생기는 문제를 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-1 실습 결과 기록: 채울 칸</text>
<rect x="20" y="52" width="214" height="241" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="20" y="52" width="214" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="127.0" y="79" font-size="15" text-anchor="middle" fill="#292929"><tspan x="127.0" dy="0" font-weight="700">(가) 출력과 값</tspan></text>
<rect x="32" y="110" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="54" y="122" font-size="14" text-anchor="start" fill="#292929"><tspan x="54" dy="0">출력 전체 (코드 상자)</tspan></text>
<rect x="32" y="143" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="54" y="155" font-size="14" text-anchor="start" fill="#292929"><tspan x="54" dy="0">하루 평균</tspan></text>
<rect x="32" y="176" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="54" y="188" font-size="14" text-anchor="start" fill="#292929"><tspan x="54" dy="0">하루 최댓값</tspan></text>
<rect x="32" y="209" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="54" y="221" font-size="14" text-anchor="start" fill="#292929"><tspan x="54" dy="0">알림 기준</tspan></text>
<rect x="253" y="52" width="214" height="241" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="253" y="52" width="214" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="79" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">(나) 핵심 질문</tspan></text>
<rect x="265" y="110" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="287" y="122" font-size="14" text-anchor="start" fill="#292929"><tspan x="287" dy="0">평균(2.4번) 이상인 날의</tspan><tspan x="287" dy="19">수</tspan></text>
<rect x="265" y="162" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="287" y="174" font-size="14" text-anchor="start" fill="#292929"><tspan x="287" dy="0">평균이 기준이면 알림이</tspan><tspan x="287" dy="19">났을 날의 수와 그날이</tspan><tspan x="287" dy="19">평소와 달랐는지</tspan></text>
<rect x="265" y="233" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="287" y="245" font-size="14" text-anchor="start" fill="#292929"><tspan x="287" dy="0">최댓값보다 1 큰 숫자를</tspan><tspan x="287" dy="19">쓰는 이유</tspan></text>
<rect x="486" y="52" width="214" height="241" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="486" y="52" width="214" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="593.0" y="79" font-size="15" text-anchor="middle" fill="#292929"><tspan x="593.0" dy="0" font-weight="700">(다) 핵심 질문</tspan></text>
<rect x="498" y="110" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="520" y="122" font-size="14" text-anchor="start" fill="#292929"><tspan x="520" dy="0">12번인 날이 섞였을 때의</tspan><tspan x="520" dy="19">최댓값과 알림 기준</tspan></text>
<rect x="498" y="162" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="520" y="174" font-size="14" text-anchor="start" fill="#292929"><tspan x="520" dy="0">바뀐 알림 기준 때문에</tspan><tspan x="520" dy="19">생기는 문제</tspan></text>
</g>
</svg>
