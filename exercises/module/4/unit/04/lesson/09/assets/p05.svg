<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>도전 4-1 보고서 칸: 출력 전체, gaeun 이 연결된 까닭, seoyeon 이 빠진 까닭</title>
<desc>(가)에는 출력 전체와 연결된 사용자 · 이유를 씁니다. (나)는 gaeun 이벤트 5개의 로그와 연결된 까닭, 공격 확정 여부를 씁니다. (다)는 seoyeon 이 두 조건 중 무엇을 못 넘었는지와 놓칠 수 있는 것을 씁니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 4-1 보고서 칸</text>
<text x="700" y="32" font-size="15" fill="#666660" text-anchor="end">채울 것 체크리스트</text>
<rect x="20" y="56" width="680" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="68" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="72" y="84" font-size="15" fill="#292929" font-weight="700">(가)</text>
<text x="120" y="84" font-size="15" fill="#292929">출력 전체 붙여 넣기 · 연결된 사용자 · 이유</text>
<rect x="20" y="108" width="680" height="44" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="120" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="72" y="136" font-size="15" fill="#292929" font-weight="700">(나)</text>
<text x="120" y="136" font-size="15" fill="#292929">gaeun 이벤트 5개의 source · 연결된 까닭</text>
<rect x="20" y="160" width="680" height="44" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="172" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="120" y="188" font-size="15" fill="#292929">공격이라고 확정할 수 있는지와 그 근거</text>
<rect x="20" y="212" width="680" height="44" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="224" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="72" y="240" font-size="15" fill="#292929" font-weight="700">(다)</text>
<text x="120" y="240" font-size="15" fill="#292929">단계 4 의 두 숫자로 두 조건 비교</text>
<rect x="20" y="264" width="680" height="44" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="276" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="120" y="292" font-size="15" fill="#292929">연결하지 않아 놓칠 수 있는 것 (도전 3-2)</text>
<text x="20" y="328" font-size="15" fill="#666660">호박색 칸은 [핵심 질문] 입니다. 값을 근거로 이유까지 씁니다.</text>
</g>
</svg>
