<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>도전 4-2 보고서 칸: 오탐 · 미탐 수, A2 가 오탐인 이유, P5 를 놓친 이유</title><desc>도전 4-2 보고서의 세 칸에 채울 내용을 체크리스트로 보여 줍니다. 출력과 알림 7 · 오탐 4 · 미탐 2를 적고, A2가 오탐인 이유와 P5에 알림이 나지 않은 이유와 필요한 규칙을 씁니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">도전 4-2 · 채울 칸</text><rect x="20" y="56" width="680" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="34" y="85.8" font-size="15" text-anchor="start" fill="#292929" font-weight="700">(가) 출력 전체</text><text x="34" y="106.8" font-size="15" text-anchor="start" fill="#666660">알림 수 · 오탐 수 · 미탐 수</text><rect x="20" y="140" width="680" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="34" y="169.8" font-size="15" text-anchor="start" fill="#292929" font-weight="700">(나) [핵심 질문] A2(gaeun)</text><text x="34" y="190.8" font-size="15" text-anchor="start" fill="#666660">오탐인 이유 · 그래도 한 번은 확인해야 했던 이유</text><rect x="20" y="224" width="680" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="34" y="253.8" font-size="15" text-anchor="start" fill="#292929" font-weight="700">(다) [핵심 질문] P5(seoyeon 정산 조회)</text><text x="34" y="274.8" font-size="15" text-anchor="start" fill="#666660">알림이 나지 않은 이유 · 찾으려면 필요한 규칙</text></svg>
