<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>보고서 쓰는 법: 질문을 읽고 쓸 내용대로 답: 뒤에 씁니다</title>
<desc>문제를 풀 때마다 그 문제 제목 아래 질문에 답합니다. 쓸 내용에 적힌 것을 답: 뒤에 쓰고, 출력과 코드는 빈 코드 상자에 붙여 넣습니다. 핵심 질문은 근거와 이유까지 쓰고, 모르면 모름 — 막힌 곳을 적습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 쓰는 법</text>
<rect x="20" y="60" width="150" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 질문</text>
<text x="95.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">(가) (나) (다)</text>
<rect x="190" y="60" width="160" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="270.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 쓸 내용:</text>
<text x="270.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">무엇을 쓰는지</text>
<rect x="370" y="60" width="150" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="445.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ 답:</text>
<text x="445.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">그 뒤에 씁니다</text>
<rect x="540" y="60" width="160" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="620.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">출력 · 코드</text>
<text x="620.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">빈 코드 상자에</text>
<polyline points="170,105 186,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<polyline points="350,105 366,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<polyline points="520,105 536,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="20" y="180" width="330" height="130" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185.0" y="219.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">[핵심 질문]</text>
<text x="185.0" y="240.6" font-size="15" fill="#292929" text-anchor="middle">내 화면에서 본 값이나</text>
<text x="185.0" y="261.6" font-size="15" fill="#292929" text-anchor="middle">배운 내용을 근거로</text>
<text x="185.0" y="282.6" font-size="15" fill="#292929" text-anchor="middle">이유까지 씁니다</text>
<rect x="370" y="180" width="330" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535.0" y="219.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">답을 못 찾으면</text>
<text x="535.0" y="240.6" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
<text x="535.0" y="261.6" font-size="15" fill="#292929" text-anchor="middle">핵심 질문이 아니어도</text>
<text x="535.0" y="282.6" font-size="15" fill="#292929" text-anchor="middle">같은 말을 씁니다</text>
</g>
</svg>
