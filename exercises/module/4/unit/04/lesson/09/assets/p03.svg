<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 4-1 보고서 칸: 등급별 대상, seoyeon 점수와 이유, low 인 IP</title>
<desc>(가)에는 출력 전체와 high · mid · low 대상을 씁니다. (나)는 seoyeon 점수를 이룬 규칙과 이유를 저장하는 까닭, (다)는 198.51.100.90 이 low 인 이유와 무시해도 되는지를 씁니다.</desc>
