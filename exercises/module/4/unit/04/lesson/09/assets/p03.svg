<rect x="36" y="217" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="72" y="233" font-size="15" fill="#292929" font-weight="700">(다)</text>
<text x="140" y="233" font-size="15" fill="#292929">198.51.100.90 이 low 인 이유 (점수와 기준)</text>
<rect x="20" y="256" width="680" height="42" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="267" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="140" y="283" font-size="15" fill="#292929">무시해도 되는지 (요청 3개의 result 로)</text>
