<rect x="20" y="106" width="680" height="42" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="117" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
