<text x="516" y="160.45" font-size="15" text-anchor="start" fill="#292929">P5(seoyeon, 권한 없는</text>
<text x="516" y="182.2" font-size="15" text-anchor="start" fill="#292929">정산 조회 시도)를 찾을</text>
