<text x="596" y="94.72" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">(다) [핵심 질문] 남은 P5</text>
<rect x="484" y="134.4" width="224" height="85.25" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
