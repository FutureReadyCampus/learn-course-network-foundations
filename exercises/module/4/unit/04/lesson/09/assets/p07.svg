<rect x="22.0" y="198.65" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="44" y="210.2" font-size="15" text-anchor="start" fill="#292929">한 문장 요약</text>
<rect x="248" y="54" width="224" height="70.4" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="83.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">(나) [핵심 질문] 합친</text>
<text x="360" y="106.32" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">결과</text>
<rect x="248" y="134.4" width="224" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="258.0" y="148.9" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="280" y="160.45" font-size="15" text-anchor="start" fill="#292929">놓친 문제가 줄어든 개수</text>
<rect x="248" y="184.15" width="224" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="258.0" y="198.65" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="280" y="210.2" font-size="15" text-anchor="start" fill="#292929">P4 가 잡힌 이유</text>
<rect x="248" y="233.9" width="224" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="258.0" y="248.4" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="280" y="259.95" font-size="15" text-anchor="start" fill="#292929">오탐이 늘지 않은 이유</text>
