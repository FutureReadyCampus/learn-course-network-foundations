<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>글감마다 붙일 출력 한두 줄을 골라 그 줄에서 본 것을 쓴다</title><desc>이유 저장 글감은 seoyeon 45점 줄을, low 등급 글감은 198.51.100.90 30점 줄과 요청 3개를, 예외 규칙 글감은 is_ip_rule &amp; is_trusted 줄과 빠진 진짜 문제 수를 붙입니다. 막혔다면 오류 줄과 의심한 코드를 씁니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">막힐 때 힌트: 붙일 줄 고르기</text><rect x="20" y="52" width="220" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="130.0" y="85.9" font-size="14" text-anchor="middle" fill="#292929">글감 1 · 이유 저장</text><rect x="260" y="52" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="480.0" y="85.9" font-size="14" text-anchor="middle" fill="#292929">mid seoyeon 45 [&#x27;평소와 다른 IP&#x27;, …]</text><line x1="242" y1="81" x2="256" y2="81" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="122" width="220" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="130.0" y="155.9" font-size="14" text-anchor="middle" fill="#292929">글감 2 · low 등급</text><rect x="260" y="122" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="480.0" y="155.9" font-size="14" text-anchor="middle" fill="#292929">low 198.51.100.90 30 [&#x27;경로 스캔&#x27;]</text><line x1="242" y1="151" x2="256" y2="151" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="192" width="220" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="130.0" y="225.9" font-size="14" text-anchor="middle" fill="#292929">글감 3 · 예외 규칙</text><rect x="260" y="192" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="480.0" y="225.9" font-size="14" text-anchor="middle" fill="#292929">is_ip_rule &amp; is_trusted → 빠진 진짜 문제 0</text><line x1="242" y1="221" x2="256" y2="221" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="262" width="220" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="130.0" y="295.9" font-size="14" text-anchor="middle" fill="#292929">막힌 이야기</text><rect x="260" y="262" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="480.0" y="295.9" font-size="14" text-anchor="middle" fill="#292929">AttributeError … &#x27;sort_values&#x27;</text><line x1="242" y1="291" x2="256" y2="291" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><text x="20" y="345" font-size="15" text-anchor="start" fill="#666660">두세 줄만 붙이고 「이 줄에서 무엇을 보았는지」 한 문장을 쓴다</text></svg>
