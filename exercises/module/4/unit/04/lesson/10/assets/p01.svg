<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>글쓰기 20분: 글감 하나를 고르고 10분 동안 세 문장을 쓰고 5분 점검해 올린다</title><desc>20분을 고르기 5분, post-short 글 틀로 세 문장 쓰기 10분, 점검과 올리기 5분으로 나눕니다. 핵심 글감은 이유 저장, low 등급, 예외 규칙 세 가지이고, 응용을 했다면 로그 연결과 오탐 글감을 고를 수 있습니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오늘 쓸 글 고르기</text><rect x="20" y="52" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="75.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">고르기</text><text x="75.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">5분</text><rect x="140" y="52" width="400" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="340.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">세 문장 쓰기 (post-short)</text><text x="340.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">10분</text><rect x="550" y="52" width="150" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="625.0" y="74.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">점검 · 올리기</text><text x="625.0" y="95.8" font-size="15" text-anchor="middle" fill="#666660">5분</text><rect x="20" y="130" width="440" height="200" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="240.0" y="175.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">핵심 글감 (실습 4-1 · 4-2)</text><text x="240.0" y="215.2" font-size="15" text-anchor="middle" fill="#666660">① 점수와 함께 이유를 저장한 까닭</text><text x="240.0" y="255.2" font-size="15" text-anchor="middle" fill="#666660">② low 인 스캔 IP 를 무시해도 되나</text><text x="240.0" y="295.2" font-size="15" text-anchor="middle" fill="#666660">③ 예외를 한 규칙에만 건 까닭</text><rect x="480" y="130" width="220" height="200" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="590.0" y="195.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">선택 글감 (응용)</text><text x="590.0" y="235.2" font-size="15" text-anchor="middle" fill="#666660">로그 연결 기준</text><text x="590.0" y="275.2" font-size="15" text-anchor="middle" fill="#666660">설정 오류 알림</text></svg>
