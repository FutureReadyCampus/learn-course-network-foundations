<text x="120" y="161.77" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">web1 · 8080</text>
<text x="120" y="183.9" font-size="15" text-anchor="middle" fill="#292929">누구나 접속. 그대로 둔다</text>
<text x="120" y="205.65" font-size="15" text-anchor="middle" fill="#292929">(끊기면 안 됨)</text>
<line x1="120" y1="228" x2="120" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="12" y="254" width="216" height="45.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="282.05" font-size="15" text-anchor="middle" fill="#292929">up -d 출력: Running</text>
<line x1="360" y1="98" x2="360" y2="128" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="252" y="130" width="216" height="96" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="161.77" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">web2 · 8081</text>
<text x="360" y="183.9" font-size="15" text-anchor="middle" fill="#292929">내 PC 에서만. 포트 줄을</text>
<text x="360" y="205.65" font-size="15" text-anchor="middle" fill="#292929">바꾼다</text>
<line x1="360" y1="228" x2="360" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="252" y="254" width="216" height="45.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="282.05" font-size="15" text-anchor="middle" fill="#292929">up -d 출력: Recreated</text>
<line x1="360" y1="98" x2="600" y2="128" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
