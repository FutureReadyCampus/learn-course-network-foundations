<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 313" role="img">
<title>compose.secure.yaml 로 web1 은 모두에게, web2 · web3 은 내 PC 에만 연다</title>
<desc>새 컴포즈 파일 하나가 서버 세 대의 접속 범위를 정한다. web1 은 그대로 두어 끊기지 않고, web2 는 내 PC 에서만 접속하게 바꾸고, web3 은 새로 켜서 로그를 내 logs 폴더에 남긴다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 5-2가 만드는 것</text>
<rect x="210" y="52" width="300" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="79.52" font-size="16" text-anchor="middle" fill="#292929">compose.secure.yaml</text>
