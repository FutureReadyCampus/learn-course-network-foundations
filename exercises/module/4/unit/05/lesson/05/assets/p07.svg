<text x="117" y="104.05" font-size="15" text-anchor="middle" fill="#292929">내 PC 에서만 접속하게</text>
<rect x="248" y="78" width="460" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="478" y="104.05" font-size="15" text-anchor="middle" fill="#292929">"127.0.0.1:8081:80"</text>
<line x1="225" y1="98.875" x2="245" y2="98.875" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<rect x="12" y="129.75" width="210" height="41.75" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="117" y="155.8" font-size="15" text-anchor="middle" fill="#292929">다른 컴포즈 파일로 적용</text>
<rect x="248" y="129.75" width="460" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="478" y="155.8" font-size="15" text-anchor="middle" fill="#292929">docker compose -f compose.secure.yaml up -d</text>
<line x1="225" y1="150.625" x2="245" y2="150.625" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<rect x="12" y="181.5" width="210" height="41.75" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="117" y="207.55" font-size="15" text-anchor="middle" fill="#292929">접속 범위 읽기</text>
<rect x="248" y="181.5" width="460" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="478" y="207.55" font-size="15" text-anchor="middle" fill="#292929">-f compose.secure.yaml ps 의 PORTS</text>
<line x1="225" y1="202.375" x2="245" y2="202.375" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<rect x="12" y="233.25" width="210" height="41.75" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="117" y="259.3" font-size="15" text-anchor="middle" fill="#292929">로그를 내 폴더에 연결</text>
