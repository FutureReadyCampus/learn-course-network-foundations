<text x="478" y="259.3" font-size="15" text-anchor="middle" fill="#292929">volumes: - ./logs:/var/log/nginx</text>
<line x1="225" y1="254.125" x2="245" y2="254.125" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<rect x="12" y="285" width="210" height="63.5" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="117" y="321.925" font-size="15" text-anchor="middle" fill="#292929">찾고 세기 · 저장</text>
<rect x="248" y="285" width="460" height="63.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="478" y="311.05" font-size="15" text-anchor="middle" fill="#292929">grep " 404 " logs/access.log | wc -l · … &gt;</text>
<text x="478" y="332.8" font-size="15" text-anchor="middle" fill="#292929">logs/web_404.log</text>
<line x1="225" y1="316.75" x2="245" y2="316.75" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
