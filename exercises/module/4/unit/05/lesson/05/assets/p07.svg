<rect x="248" y="358.5" width="460" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="478" y="384.55" font-size="15" text-anchor="middle" fill="#292929">docker compose -f compose.secure.yaml down</text>
