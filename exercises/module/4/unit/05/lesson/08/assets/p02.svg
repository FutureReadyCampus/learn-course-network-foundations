<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img">
<title>질문마다 쓸 내용을 답: 뒤에, 출력은 코드 상자에, 모르면 막힌 곳을 쓴다</title>
<desc>보고서 쓰는 법 다섯 가지입니다. 쓸 내용을 답: 뒤에 쓰고, 출력과 코드는 빈 코드 상자에 붙이며, 「왜」 질문은 근거와 이유까지 씁니다. [핵심 질문]은 꼭 알아야 할 질문이고, 답을 못 찾으면 「모름 — 막힌 곳: …」이라고 씁니다.</desc>
<defs><marker id="a-l08-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">보고서 쓰는 법</text>
<rect x="24" y="52" width="150" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="99" y="82" font-size="15" text-anchor="middle" font-weight="700">질문마다</text>
<rect x="186" y="52" width="510" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="202" y="82" font-size="15">쓸 내용: 에 적힌 것을 답: 뒤에 씁니다</text>
<rect x="24" y="112" width="150" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="99" y="142" font-size="15" text-anchor="middle" font-weight="700">출력 · 코드</text>
<rect x="186" y="112" width="510" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="202" y="142" font-size="15">답: 아래 빈 코드 상자에 붙이고, 설명은 답: 뒤에</text>
<rect x="24" y="172" width="150" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="99" y="202" font-size="15" text-anchor="middle" font-weight="700">「왜」 질문</text>
<rect x="186" y="172" width="510" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="202" y="202" font-size="15">한 단어로 끝내지 않고, 내 화면에서 본 값이나 배운 내용으로 이유까지</text>
<rect x="24" y="232" width="150" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="99" y="262" font-size="15" text-anchor="middle" font-weight="700">[핵심 질문]</text>
<rect x="186" y="232" width="510" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="202" y="262" font-size="15">이 실습에서 꼭 알아야 할 질문입니다</text>
<rect x="24" y="292" width="150" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="99" y="322" font-size="15" text-anchor="middle" font-weight="700">못 찾았으면</text>
<rect x="186" y="292" width="510" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="202" y="322" font-size="15">「모름 — 막힌 곳: …」 이라고 씁니다 (핵심 질문이 아니어도 같음)</text>
<text x="24" y="370" font-size="14" fill="#666660">글쓰기는 다음 레슨 「오늘의 글 쓰기」에서 합니다.</text>
</g>
</svg>
