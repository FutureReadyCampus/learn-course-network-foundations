<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img">
<title>report_u5.md 를 틀에서 만들고 핵심 칸은 모두, 도전 칸은 한 경우만 채운다</title>
<desc>anomaly_detection 폴더에 report_u5.md 를 새로 만들고 틀을 붙여 넣은 뒤 이름을 바꿔 저장합니다. 실습 5-1, 실습 5-2(상황 1·2·3·4·7·8 중 4개 이상과 질문), 마무리는 모두 채우고, 도전 5-1~5-3 은 했을 때만 채웁니다.</desc>
<defs><marker id="a-l08-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">보고서 파일 만들기 · report_u5.md</text>
<rect x="24" y="52" width="200" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="124" y="78" font-size="15" text-anchor="middle" font-weight="700">1. New File</text>
<text x="124" y="100" font-size="14" text-anchor="middle" fill="#666660">anomaly_detection 안</text>
<line x1="228" y1="82" x2="256" y2="82" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l08-p01)"/>
<rect x="260" y="52" width="200" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="78" font-size="15" text-anchor="middle" font-weight="700">2. 틀 복사 · 붙여 넣기</text>
<text x="360" y="100" font-size="14" text-anchor="middle" fill="#666660">이름 바꾸고 Ctrl + S</text>
<line x1="464" y1="82" x2="492" y2="82" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l08-p01)"/>
<rect x="496" y="52" width="200" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="596" y="78" font-size="15" text-anchor="middle" font-weight="700">3. 실습마다 채우기</text>
<text x="596" y="100" font-size="14" text-anchor="middle" fill="#666660">같은 번호 답: 뒤에</text>
<rect x="24" y="136" width="420" height="214" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="44" y="166" font-size="16" font-weight="700">핵심 실습 · 모두 채움</text>
<text x="44" y="198" font-size="15">## 실습 5-1 · (가) (나) (다)</text>
<text x="44" y="228" font-size="15">## 실습 5-2</text>
<text x="64" y="254" font-size="14">상황 1 · 2 · 3 · 4 · 7 · 8 중 4개 이상</text>
<text x="64" y="278" font-size="14" fill="#666660">상황 5 · 6 은 예시라 이미 적혀 있음</text>
<text x="64" y="302" font-size="14">### 질문 · (가) (나) (다)</text>
<text x="44" y="334" font-size="15">## 마무리 · (가)</text>
<rect x="476" y="136" width="220" height="214" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="586" y="166" font-size="16" text-anchor="middle" font-weight="700">도전 · 선택</text>
<text x="586" y="200" font-size="15" text-anchor="middle">## 도전 5-1</text>
<text x="586" y="228" font-size="15" text-anchor="middle">## 도전 5-2</text>
<text x="586" y="256" font-size="15" text-anchor="middle">## 도전 5-3</text>
<text x="586" y="300" font-size="14" text-anchor="middle" fill="#666660">도전을 했을 때만</text>
<text x="586" y="322" font-size="14" text-anchor="middle" fill="#666660">채우고, 아니면 비워 둠</text>
