<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>보고서 도전 5-3: (가) 출력과 보고서 값 · (나) 코드가 정한 이유 · (다) 대체 문장</title>
<desc>(가)는 출력 전체와 event_count · finding_count · records · summaries 건수를 적습니다. (나)는 점수와 등급을 코드가 정한 이유를 단계 5 와 단계 3 근거로, (다)는 실패해도 멈추지 않게 한 이유와 처리 방법을 씁니다.</desc>
