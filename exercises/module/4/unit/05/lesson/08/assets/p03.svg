<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" role="img">
<title>실습 5-2 는 상황 3개를 네 칸으로 정리하고 질문 둘과 마무리에 답한다</title>
<desc>상황 1·2·3·4·7·8 중 3개를 원인, 고칠 파일, 어떻게 고치나요, 고친 뒤 확인 칸으로 씁니다. 상황 5·6 은 예시입니다. 질문 (가)(나)와 마무리 (가)의 .env · .venv 확인도 채웁니다. (다)는 응용입니다.</desc>
