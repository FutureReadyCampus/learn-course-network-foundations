<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img">
<title>응용 5-1 의 (가)~(라) 답에 들어갈 칸: 명령 기록, 컴포즈 장점, 재현, 포트 바꾸기</title>
<desc>(가)는 docker images 부터 curl 까지 친 명령과 결과, 서비스 이름 두 개와 포트를 씁니다. (나)는 컴포즈가 나은 점 두 가지, (다)는 두 팀의 재현 차이와 버전을 적는 이유, (라)는 바꿀 포트 줄과 서버 안이 80 인 이유, curl 주소 차이를 씁니다.</desc>
<defs><marker id="a-l08-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">응용 5-1 · 컴포즈로 서버 두 대 한 번에 켜기</text>
<text x="24" y="56" font-size="14" fill="#666660">칸 체크리스트 · 답: 뒤에 이것들이 다 있으면 됩니다</text>
<rect x="24" y="72" width="96" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="72" y="102" font-size="17" text-anchor="middle" font-weight="700">(가)</text>
<rect x="132" y="72" width="564" height="120" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="148" y="85" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="98" font-size="15">명령과 결과를 친 순서대로 (코드 상자)</text>
<rect x="148" y="109" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="122" font-size="15">서비스 이름 두 개</text>
<rect x="148" y="133" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="146" font-size="15">각 서비스의 포트</text>
<text x="172" y="170" font-size="14" fill="#9a6200">docker images › run › ps › stop › compose up -d › compose ps › curl 두 개</text>
<rect x="24" y="204" width="96" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="72" y="234" font-size="17" text-anchor="middle" font-weight="700">(나)</text>
<text x="72" y="256" font-size="14" text-anchor="middle" fill="#b3301d">핵심 질문</text>
<rect x="132" y="204" width="564" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="148" y="217" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="230" font-size="15">docker run 과 비교해 컴포즈가 더 나은 점 두 가지</text>
<rect x="24" y="280" width="96" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="72" y="310" font-size="17" text-anchor="middle" font-weight="700">(다)</text>
<text x="72" y="332" font-size="14" text-anchor="middle" fill="#b3301d">핵심 질문</text>
<rect x="132" y="280" width="564" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="148" y="293" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="306" font-size="15">명령을 잊은 팀과 compose.yaml 을 올린 팀의 차이</text>
<rect x="148" y="317" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="330" font-size="15">nginx:1.28 처럼 버전을 적는 것이 재현에 중요한 이유</text>
<rect x="24" y="364" width="96" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="72" y="394" font-size="17" text-anchor="middle" font-weight="700">(라)</text>
<text x="72" y="416" font-size="14" text-anchor="middle" fill="#b3301d">핵심 질문</text>
<rect x="132" y="364" width="564" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="148" y="377" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="390" font-size="15">8081 이 막혔을 때 바꿀 줄과 바꾼 모양</text>
<rect x="148" y="401" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="414" font-size="15">서버 안은 그대로 80 인 이유</text>
<rect x="148" y="425" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="172" y="438" font-size="15">curl 주소의 달라지는 점</text>
<text x="24" y="486" font-size="14" fill="#666660">선택입니다. 응용을 했을 때만 채웁니다.</text>
</g>
</svg>
