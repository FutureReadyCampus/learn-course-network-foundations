<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img">
<title>요약 실패 시 조사 순서 글을 올리고 전체 글 목록에서 열기</title>
<desc>_posts 폴더에 글을 만들고 제목과 날짜를 적습니다. 요약 실패 시 조사 순서에서 확인한 내용을 저장해 올린 뒤, 전체 글 목록에서 제목을 눌러 본문을 확인합니다.</desc>
<defs><marker id="a-l09-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">VS Code 에서 글 한 편 쓰기</text>
<rect x="24" y="52" width="180" height="128" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="114" y="80" font-size="15" text-anchor="middle" font-weight="700">1. 글 틀 고르기</text>
<text x="40" y="110" font-size="14">post-short.md (기본)</text>
<text x="40" y="134" font-size="14">post-stuck.md (막힘)</text>
<text x="40" y="158" font-size="14">코드와 확인한 출력</text>
<line x1="208" y1="116" x2="246" y2="116" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p02)"/>
<rect x="252" y="52" width="444" height="128" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="268" y="78" font-size="15" font-weight="700">2. _posts/2026-11-20-keep-alert-order-without-ai.md</text>
<rect x="268" y="92" width="412" height="74" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="284" y="120" font-size="15" font-family="Menlo, Consolas, monospace">title: 내 글 제목</text>
<text x="284" y="150" font-size="15" font-family="Menlo, Consolas, monospace">date: 2026-11-20</text>
<text x="420" y="120" font-size="14" fill="#2f6fd0">내 제목과 작성일을 적습니다</text>
<text x="420" y="150" font-size="14" fill="#666660">title · date 도 바꾸기</text>
<rect x="24" y="200" width="180" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="114" y="228" font-size="15" text-anchor="middle" font-weight="700">코드는 그대로</text>
<text x="114" y="252" font-size="14" text-anchor="middle">옮기지 않음</text>
<line x1="208" y1="235" x2="246" y2="235" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p02)"/>
<rect x="252" y="200" width="444" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="268" y="228" font-size="15" font-weight="700">3. anomaly_detection/event_summary.py</text>
<text x="268" y="252" font-size="14">relative_url 로 코드 링크 넣고 실행 근거 붙이기</text>
<line x1="474" y1="274" x2="474" y2="296" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p02)"/>
<text x="486" y="292" font-size="14" fill="#666660">점검 뒤 push · 1~2분 뒤</text>
<rect x="24" y="302" width="672" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="328" font-size="15" font-weight="700">4. 첫 화면 「전체 글」</text>
<text x="680" y="328" font-size="14" text-anchor="end" fill="#666660">안 보이면 Actions 탭부터</text>
<text x="40" y="360" font-size="14" fill="#2f6fd0">요약 실패 시 조사 순서 · 제목을 눌러 본문 확인</text>
