<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img">
<title>20분을 고르기 5분, 쓰기 10분, 점검·올리기 5분으로 나누고 글감 하나로 세 문장 글을 쓴다</title>
<desc>글쓰기 20분은 고르기 5분, post-short 글 틀로 세 문장 쓰기 10분, 점검·올리기 5분입니다. 핵심 실습 글감 세 가지와 AI 요약이 실패해도 조사 순서를 확인하는 방법이라는 제목 예시가 있습니다.</desc>
<defs><marker id="a-l09-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">글쓰기 20분 · 오늘 쓸 글 고르기</text>
<rect x="24" y="50" width="84" height="40" rx="6" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="66.0" y="76" font-size="16" text-anchor="middle" font-weight="700">5분</text>
<text x="66.0" y="112" font-size="14" text-anchor="middle" fill="#666660">고르기</text>
<rect x="108" y="50" width="336" height="40" rx="6" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="276.0" y="76" font-size="16" text-anchor="middle" font-weight="700">10분</text>
<text x="276.0" y="112" font-size="14" text-anchor="middle" fill="#666660">쓰기 · post-short 글 틀로 세 문장</text>
<rect x="444" y="50" width="252" height="40" rx="6" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="570.0" y="76" font-size="16" text-anchor="middle" font-weight="700">5분</text>
<text x="570.0" y="112" font-size="14" text-anchor="middle" fill="#666660">점검 · 올리기</text>
<text x="24" y="150" font-size="16" font-weight="700">오늘의 글감 · 핵심 실습</text>
<text x="696" y="150" font-size="14" text-anchor="end" fill="#666660">report_u5.md 에서 가장 오래 고민한 답을 고르면 쉽습니다</text>
<rect x="24" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="40" y="188" font-size="15" font-weight="700">1 · 지시문</text>
<text x="40" y="214" font-size="14">하지 말라고 한 것 두 가지</text>
<text x="40" y="238" font-size="14">담당자에게 왜 위험한가</text>
<rect x="252" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="268" y="188" font-size="15" font-weight="700">2 · 대체 문장</text>
<text x="268" y="214" font-size="14">실패해도 끝까지 돈 것이</text>
<text x="268" y="238" font-size="14">왜 중요한가</text>
<rect x="480" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="496" y="188" font-size="15" font-weight="700">3 · 내가 쓴 상황 나누기</text>
<text x="496" y="214" font-size="14">데이터 · 규칙 · 운영 설정</text>
<text x="496" y="238" font-size="14">어느 쪽 실수가 더 위험한가</text>
<rect x="24" y="282" width="672" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="40" y="309" font-size="15" font-weight="700" fill="#9a6200">공개 제목 예시</text>
<text x="40" y="334" font-size="14">AI 요약이 실패해도 조사 순서를 확인하는 방법</text>
<text x="24" y="382" font-size="14" fill="#666660">세 문장이면 충분합니다. 막혔다면 어디까지 확인했는지 씁니다.</text>
</g>
</svg>
