<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img">
<title>40분을 고르기 5분, 쓰기 25분, 점검·올리기 10분으로 나누고 글감 하나를 고른다</title>
<desc>마지막 40분은 고르기 5분, 쓰기 25분, 점검·올리기 10분입니다. 실습 5-1·5-2 글감 세 가지와 도전 5-1~5-3 선택 글감, Module 4 돌아보기 중 하나를 고릅니다.</desc>
<defs><marker id="a-l09-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">마지막 40분 · 오늘 쓸 글 고르기</text>
<rect x="24" y="50" width="84" height="40" rx="6" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="66.0" y="76" font-size="16" text-anchor="middle" font-weight="700">5분</text>
<text x="66.0" y="112" font-size="14" text-anchor="middle" fill="#666660">고르기</text>
<rect x="108" y="50" width="420" height="40" rx="6" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="318.0" y="76" font-size="16" text-anchor="middle" font-weight="700">25분</text>
<text x="318.0" y="112" font-size="14" text-anchor="middle" fill="#666660">쓰기 · 글 틀에 내 답을 글로 풀기</text>
<rect x="528" y="50" width="168" height="40" rx="6" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="612.0" y="76" font-size="16" text-anchor="middle" font-weight="700">10분</text>
<text x="612.0" y="112" font-size="14" text-anchor="middle" fill="#666660">점검 · 올리기</text>
<text x="24" y="150" font-size="16" font-weight="700">글감 질문 · 실습 5-1 · 5-2</text>
<text x="696" y="150" font-size="14" text-anchor="end" fill="#666660">report_u5.md 에서 가장 오래 고민한 답을 고르면 쉽습니다</text>
<rect x="24" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="40" y="188" font-size="15" font-weight="700">1 · 지시문</text>
<text x="40" y="214" font-size="14">하지 말라고 한 것 두 가지</text>
<text x="40" y="238" font-size="14">담당자에게 왜 위험한가</text>
<rect x="252" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="268" y="188" font-size="15" font-weight="700">2 · 요약과 표 비교</text>
<text x="268" y="214" font-size="14">표에 없는 내용이 섞였나</text>
<text x="268" y="238" font-size="14">키가 없으면 대체 문장 이야기</text>
<rect x="480" y="162" width="216" height="98" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="496" y="188" font-size="15" font-weight="700">3 · 상황 8개 나누기</text>
<text x="496" y="214" font-size="14">데이터 · 규칙 · 운영 설정</text>
<text x="496" y="238" font-size="14">어느 쪽 실수가 더 위험한가</text>
<text x="24" y="290" font-size="16" font-weight="700">선택 글감 · 도전 5-1 ~ 5-3을 했다면</text>
<rect x="24" y="302" width="216" height="98" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="40" y="328" font-size="15" font-weight="700">도전 5-1</text>
<text x="40" y="354" font-size="14">docker run 과 compose.yaml</text>
<text x="40" y="378" font-size="14">같은 구성 다시 켜기</text>
<rect x="252" y="302" width="216" height="98" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="268" y="328" font-size="15" font-weight="700">도전 5-2</text>
<text x="268" y="354" font-size="14">"8081:80" 과</text>
<text x="268" y="378" font-size="14">"127.0.0.1:8081:80"</text>
<rect x="480" y="302" width="216" height="98" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="496" y="328" font-size="15" font-weight="700">도전 5-3</text>
<text x="496" y="354" font-size="14">pipeline.py 가 멈추지 않는</text>
<text x="496" y="378" font-size="14">이유 · 대체 문장 읽기</text>
<rect x="24" y="416" width="672" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="444" font-size="15">Module 4 돌아보기 (선택) · 다섯 Unit 중 가장 오래 고민한 로직 하나</text>
<text x="24" y="488" font-size="14" fill="#666660">세 문장만 써도 한 편의 글입니다. 막힌 이야기도 좋은 글이 됩니다.</text>
</g>
</svg>
