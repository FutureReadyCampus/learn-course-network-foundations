<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img">
<title>글이 막히면 고른 글감에 맞는 힌트 하나를 따라 코드나 출력을 붙이고 풀어 쓴다</title>
<desc>글감 1은 PROMPT_RULES 두 문장, 글감 2는 [사실] 줄과 요약 비교, 글감 3은 세 줄에 상황 번호 붙이기, 응용 글감은 web2 포트 줄 비교가 출발점입니다. 실행 결과는 두세 줄만 붙이고, AI 도우미에는 비밀키·토큰·개인정보를 넣지 않습니다.</desc>
<defs><marker id="a-l09-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">막힐 때 힌트 · 고른 글감에 맞는 것 하나</text>
<rect x="24" y="50" width="176" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="112" y="84" font-size="15" text-anchor="middle" font-weight="700">글감 1 · 지시문</text>
<line x1="204" y1="78" x2="226" y2="78" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p03)"/>
<rect x="232" y="50" width="464" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="248" y="74" font-size="15">PROMPT_RULES 두 문장을 붙이고</text>
<text x="248" y="96" font-size="14" fill="#666660">「지어내지 말고」 · 「단정하지 마세요」를 하나씩 풀어 쓰기</text>
<rect x="24" y="116" width="176" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="112" y="150" font-size="15" text-anchor="middle" font-weight="700">글감 2 · 요약과 표</text>
<line x1="204" y1="144" x2="226" y2="144" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p03)"/>
<rect x="232" y="116" width="464" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="248" y="140" font-size="15">[사실] 줄과 요약 한 줄을 위아래로</text>
<text x="248" y="162" font-size="14" fill="#666660">요약에만 있는 말이 남는지 보기</text>
<rect x="24" y="182" width="176" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="112" y="216" font-size="15" text-anchor="middle" font-weight="700">글감 3 · 원인 나누기</text>
<line x1="204" y1="210" x2="226" y2="210" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p03)"/>
<rect x="232" y="182" width="464" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="248" y="206" font-size="15">데이터 · 규칙 · 운영 설정 세 줄에</text>
<text x="248" y="228" font-size="14" fill="#666660">내가 쓴 상황 번호를 하나씩 붙이기</text>
<rect x="24" y="248" width="176" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="112" y="282" font-size="15" text-anchor="middle" font-weight="700">응용 글감</text>
<line x1="204" y1="276" x2="226" y2="276" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p03)"/>
<rect x="232" y="248" width="464" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="248" y="272" font-size="15">web2 포트 줄 두 개를 나란히</text>
<text x="248" y="294" font-size="14" fill="#666660">PORTS 의 0.0.0.0: 과 127.0.0.1: 비교</text>
<rect x="24" y="314" width="176" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="112" y="348" font-size="15" text-anchor="middle" font-weight="700">실행 결과 붙이기</text>
<line x1="204" y1="342" x2="226" y2="342" stroke="#666660" stroke-width="1.8" marker-end="url(#a-l09-p03)"/>
<rect x="232" y="314" width="464" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="248" y="338" font-size="15">내 말과 연결되는 두세 줄만</text>
<text x="248" y="360" font-size="14" fill="#666660">그 아래 「무엇을 보았는지」 한 문장</text>
<rect x="24" y="384" width="672" height="46" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="40" y="413" font-size="15">AI 도우미에 붙여 넣는 코드와 글에는 비밀키 · 토큰 · 개인정보를 넣지 않습니다</text>
</g>
</svg>
