<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>점수와 등급은 코드가 정하고, AI 는 그 값을 문장으로 풀어 쓰기만 한다</title>
<desc>점수 파일에는 대상 · 점수 · 등급 · 규칙 이름이 있지만 규칙 이름만 나열돼 있습니다. 점수와 등급은 risk_scores.py 가 정해 같은 입력이면 같은 결과가 나옵니다. AI(call_llm)는 그 값을 설명 문장으로만 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">일을 둘로 나눕니다</text>
<rect x="20" y="60" width="200" height="150" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="108.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">점수 파일</text>
<text x="120" y="129.1" font-size="15" fill="#292929" text-anchor="middle">대상 · 점수 · 등급</text>
<text x="120" y="150.1" font-size="15" fill="#292929" text-anchor="middle">규칙 이름</text>
<text x="120" y="171.1" font-size="15" fill="#666660" text-anchor="middle">(이름만 나열)</text>
<rect x="260" y="60" width="200" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="98.3" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">코드</text>
<text x="360" y="118.3" font-size="14" fill="#292929" text-anchor="middle">risk_scores.py</text>
<text x="360" y="138.9" font-size="15" fill="#292929" text-anchor="middle">점수 · 등급을 정함</text>
<text x="360" y="159.9" font-size="15" fill="#666660" text-anchor="middle">같은 입력이면</text>
<text x="360" y="180.9" font-size="15" fill="#666660" text-anchor="middle">항상 같은 결과</text>
<rect x="500" y="60" width="200" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="98.3" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">AI</text>
<text x="600" y="118.3" font-size="14" fill="#292929" text-anchor="middle">call_llm</text>
<text x="600" y="138.9" font-size="15" fill="#292929" text-anchor="middle">설명 문장을 씀</text>
<text x="600" y="159.9" font-size="15" fill="#666660" text-anchor="middle">문장은 달라도</text>
<text x="600" y="180.9" font-size="15" fill="#666660" text-anchor="middle">순서는 그대로</text>
<polyline points="220,135 256,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="460,135 496,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="478" y="125" font-size="14" fill="#666660" text-anchor="middle">값</text>
<rect x="20" y="235" width="680" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="264.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">이번 실습의 질문</text>
<text x="360" y="285.1" font-size="15" fill="#292929" text-anchor="middle">AI 가 지어내지 않고 점수 파일의 사실만으로 요약하게 하려면 무엇을 보내야 하나?</text>
</g>
</svg>
