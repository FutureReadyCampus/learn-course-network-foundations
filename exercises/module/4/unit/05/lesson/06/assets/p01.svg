<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>도전 5-3 목표: 명령 한 번으로 읽기부터 점수 저장, 요약, 보고서 저장까지</title>
<desc>python challenge5-3_run.py 한 번이 run_pipeline 을 실행합니다. 이벤트 읽기, 연결 · 탐지 · 점수, AI 요약, 보고서 저장이 차례로 이어지고 점수 파일과 보고서 파일이 남습니다. AI 가 응답하지 않아도 보고서는 나옵니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
