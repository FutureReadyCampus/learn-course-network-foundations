<text x="272" y="186.1" font-size="15" fill="#292929" text-anchor="middle">연결 · 탐지 · 점수</text>
<polyline points="348,171 368,171" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
