<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 403" role="img">
<title>anomaly_detection 에 llm_client.py 를 복사하고 점수 파일 5건을 만든다</title>
<desc>왼쪽은 폴더 배치이고 오른쪽은 준비 순서다. agent_core 의 llm_client.py 를 복사해 키가 읽히면 True, New File 로 만들어 붙여 넣은 점수 파일을 읽으면 5 가 나와야 한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">폴더 배치와 준비 순서</text>
<rect x="12" y="52" width="330" height="320" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="28" y="86" font-size="15" text-anchor="start" fill="#292929" font-weight="700">security-agent-toolkit/</text>
<text x="46" y="123" font-size="15" text-anchor="start" fill="#292929">.env</text>
<text x="330" y="123" font-size="14" text-anchor="end" fill="#666660">API 키</text>
<text x="46" y="160" font-size="15" text-anchor="start" fill="#292929">agent_core/llm_client.py</text>
<text x="330" y="160" font-size="14" text-anchor="end" fill="#666660">원본</text>
<text x="46" y="197" font-size="15" text-anchor="start" fill="#292929" font-weight="700">anomaly_detection/</text>
<text x="64" y="234" font-size="15" text-anchor="start" fill="#292929">llm_client.py</text>
<text x="330" y="234" font-size="14" text-anchor="end" fill="#666660">cp 로 복사</text>
<text x="64" y="271" font-size="15" text-anchor="start" fill="#292929">unit05_risk_scores.json</text>
<text x="330" y="271" font-size="14" text-anchor="end" fill="#666660">5건</text>
<text x="64" y="308" font-size="15" text-anchor="start" fill="#292929">Unit 3 · 7 파일</text>
<text x="330" y="308" font-size="14" text-anchor="end" fill="#666660">없으면 만들기</text>
<text x="64" y="345" font-size="15" text-anchor="start" fill="#292929">report_u5.md</text>
<text x="330" y="345" font-size="14" text-anchor="end" fill="#666660">보고서 쓰기에서</text>
<rect x="366" y="52" width="342" height="62.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="78.12" font-size="16" text-anchor="start" fill="#292929" font-weight="700">2. 위치와 파일</text>
<text x="375" y="100.25" font-size="15" text-anchor="start" fill="#292929">cd anomaly_detection → pwd → ls</text>
<line x1="537" y1="115.95" x2="537" y2="127.95" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="366" y="128.95" width="342" height="84.7" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="155.07" font-size="16" text-anchor="start" fill="#292929" font-weight="700">3. 키 파일 복사</text>
<text x="375" y="177.2" font-size="15" text-anchor="start" fill="#292929">cp ../agent_core/llm_client.py . →</text>
<text x="375" y="198.95" font-size="15" text-anchor="start" fill="#292929">read_api_key 가 True</text>
<line x1="537" y1="214.65" x2="537" y2="226.65" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="366" y="227.65" width="342" height="84.7" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="253.77" font-size="16" text-anchor="start" fill="#292929" font-weight="700">5. 점수 파일</text>
<text x="375" y="275.9" font-size="15" text-anchor="start" fill="#292929">New File 로 unit05_risk_scores.json</text>
<text x="375" y="297.65" font-size="15" text-anchor="start" fill="#292929">붙여 넣기 (덮어쓰기)</text>
<line x1="537" y1="313.35" x2="537" y2="325.35" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="366" y="326.35" width="342" height="62.95" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="375" y="352.47" font-size="16" text-anchor="start" fill="#292929" font-weight="700">6. 확인</text>
<text x="375" y="374.6" font-size="15" text-anchor="start" fill="#292929">5 가 나오고 import 두 줄에 오류 없음</text>
</g>
</svg>
