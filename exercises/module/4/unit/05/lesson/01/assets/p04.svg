<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 397" role="img">
<title>Unit 5 시작 오류는 오류 문구로 원인을 찾아 파일, .env, 패키지, 대기로 고친다</title>
<desc>자주 나는 오류 네 가지를 증상, 뜻, 고치기 세 칸으로 정리했다. 먼저 pwd 와 ls 로 위치와 파일 이름을 확인한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면</text>
<text x="124" y="64" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">증상</text>
<text x="360" y="64" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">뜻</text>
<text x="589" y="64" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">고치기</text>
<rect x="12" y="78" width="224" height="85.25" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="124" y="104.05" font-size="15" text-anchor="middle" fill="#292929">No module named</text>
<text x="124" y="125.8" font-size="15" text-anchor="middle" fill="#292929">'llm_client' (correlation</text>
<text x="124" y="147.55" font-size="15" text-anchor="middle" fill="#292929">등)</text>
<rect x="262" y="78" width="196" height="85.25" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="104.05" font-size="15" text-anchor="middle" fill="#292929">그 파일이</text>
<text x="360" y="125.8" font-size="15" text-anchor="middle" fill="#292929">anomaly_detection</text>
<text x="360" y="147.55" font-size="15" text-anchor="middle" fill="#292929">바로 아래에 없다</text>
<line x1="239" y1="120.625" x2="259" y2="120.625" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="484" y="78" width="210" height="85.25" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="589" y="114.925" font-size="15" text-anchor="middle" fill="#292929">복구 파일 모음으로 그</text>
<text x="589" y="136.675" font-size="15" text-anchor="middle" fill="#292929">파일을 만든다</text>
<line x1="461" y1="120.625" x2="481" y2="120.625" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="173.25" width="224" height="63.5" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="124" y="199.3" font-size="15" text-anchor="middle" fill="#292929">TypeError: … not</text>
<text x="124" y="221.05" font-size="15" text-anchor="middle" fill="#292929">NoneType</text>
<rect x="262" y="173.25" width="196" height="63.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="199.3" font-size="15" text-anchor="middle" fill="#292929">llm_client.py 가 .env 를</text>
<text x="360" y="221.05" font-size="15" text-anchor="middle" fill="#292929">못 찾았다</text>
<line x1="239" y1="205" x2="259" y2="205" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="484" y="173.25" width="210" height="63.5" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="589" y="210.175" font-size="15" text-anchor="middle" fill="#292929">.env 와 API 키 다시 받기</text>
<line x1="461" y1="205" x2="481" y2="205" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="246.75" width="224" height="63.5" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="124" y="272.8" font-size="15" text-anchor="middle" fill="#292929">No module named</text>
<text x="124" y="294.55" font-size="15" text-anchor="middle" fill="#292929">'requests'</text>
<rect x="262" y="246.75" width="196" height="63.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="272.8" font-size="15" text-anchor="middle" fill="#292929">새 PC 가상환경에</text>
<text x="360" y="294.55" font-size="15" text-anchor="middle" fill="#292929">requests 가 없다</text>
<line x1="239" y1="278.5" x2="259" y2="278.5" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="484" y="246.75" width="210" height="63.5" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="589" y="272.8" font-size="15" text-anchor="middle" fill="#292929">가상환경을 켜고 python</text>
<text x="589" y="294.55" font-size="15" text-anchor="middle" fill="#292929">-m pip install requests</text>
<line x1="461" y1="278.5" x2="481" y2="278.5" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="320.25" width="224" height="63.5" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="124" y="357.175" font-size="15" text-anchor="middle" fill="#292929">상태 코드 429</text>
<rect x="262" y="320.25" width="196" height="63.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="357.175" font-size="15" text-anchor="middle" fill="#292929">1분에 15번을 넘었다</text>
<line x1="239" y1="352" x2="259" y2="352" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="484" y="320.25" width="210" height="63.5" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="589" y="346.3" font-size="15" text-anchor="middle" fill="#292929">1분 뒤 다시. 요약 실패</text>
<text x="589" y="368.05" font-size="15" text-anchor="middle" fill="#292929">문구는 정상</text>
<line x1="461" y1="352" x2="481" y2="352" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
