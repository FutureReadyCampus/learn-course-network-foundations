<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>도전 5-3 정답: 이벤트 57 → 규칙 8 → 기록 5 → 요약 3 → 보고서</title>
<desc>이벤트 57개에서 탐지된 규칙 8건, 점수 기록 5건, 요약 3건(실패 0건)이 나오고 보고서에 저장됩니다. 로그 종류마다 web 28 · server 15 · saas 14 입니다. 429 로 요약이 모두 실패해도 보고서와 확인할 순서는 그대로 나옵니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 5-3 정답</text>
<rect x="20" y="50" width="120" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="80" y="76.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">이벤트</text>
<text x="80" y="96.8" font-size="14" fill="#292929" text-anchor="middle">57개</text>
<polyline points="140,82 156,82" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="160" y="50" width="120" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="220" y="76.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">탐지된 규칙</text>
<text x="220" y="96.8" font-size="14" fill="#292929" text-anchor="middle">8건</text>
<polyline points="280,82 296,82" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="300" y="50" width="120" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="76.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">점수 기록</text>
<text x="360" y="96.8" font-size="14" fill="#292929" text-anchor="middle">5건</text>
<polyline points="420,82 436,82" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="440" y="50" width="120" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="500" y="76.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">AI 요약</text>
<text x="500" y="96.8" font-size="14" fill="#292929" text-anchor="middle">3건 · 실패 0</text>
<polyline points="560,82 576,82" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="580" y="50" width="120" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="640" y="76.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">보고서</text>
<text x="640" y="96.8" font-size="14" fill="#292929" text-anchor="middle">저장</text>
<rect x="20" y="130" width="330" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="166.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">source_event_counts</text>
<text x="185" y="187.1" font-size="15" fill="#292929" text-anchor="middle">web 28 · server 15 · saas 14</text>
<rect x="370" y="130" width="330" height="84" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="157" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">AI 가 429 로 모두 실패해도</text>
<text x="535" y="177" font-size="14" fill="#292929" text-anchor="middle">요약 3건 = 대체 문장</text>
<text x="535" y="196.6" font-size="14" fill="#292929" text-anchor="middle">보고서 · 단계 5 순서는 그대로</text>
<text x="20" y="248" font-size="16" fill="#292929" font-weight="700">자주 틀리는 곳</text>
<rect x="20" y="262" width="214" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="127" y="292.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2번 순서 바꿈</text>
<text x="127" y="312.2" font-size="14" fill="#292929" text-anchor="middle">collect_findings</text>
<text x="127" y="331.8" font-size="14" fill="#292929" text-anchor="middle">(chains, events)</text>
<text x="127" y="351.4" font-size="14" fill="#292929" text-anchor="middle">→ TypeError</text>
<rect x="253" y="262" width="214" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="302" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1번을 빠뜨림</text>
<text x="360" y="322" font-size="14" fill="#292929" text-anchor="middle">chains 가 없음</text>
<text x="360" y="341.6" font-size="14" fill="#292929" text-anchor="middle">→ NameError</text>
<rect x="486" y="262" width="214" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="593" y="302" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">6번 괄호를 뺌</text>
<text x="593" y="322" font-size="14" fill="#292929" text-anchor="middle">.to_dict</text>
<text x="593" y="341.6" font-size="14" fill="#292929" text-anchor="middle">→ not JSON serializable</text>
<text x="20" y="410" font-size="15" fill="#666660">함수에 전달하는 순서는 정의한 순서: 이벤트 표, 연결된 사건</text>
</g>
</svg>
