<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 377" role="img">
<title>응용 5-2 정답: web2 바뀜 · web3 새로, 127.0.0.1 은 내 PC 만, 바뀐 서버만 다시</title>
<desc>(가) (나) (다) 정답의 핵심을 카드로 모았다. 아래는 -f 를 빼거나 127.0.0.1: 을 빼는 자주 틀리는 곳이다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 5-2 정답 요점</text>
<rect x="12" y="52" width="224" height="134.2" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="124" y="91.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">(가) 서비스</text>
<text x="124" y="114.125" font-size="15" text-anchor="middle" fill="#292929">범위가 바뀐 기존 서비스</text>
<text x="124" y="135.875" font-size="15" text-anchor="middle" fill="#292929">web2, 새로 생긴 서비스</text>
<text x="124" y="157.625" font-size="15" text-anchor="middle" fill="#292929">web3</text>
<rect x="248" y="52" width="224" height="134.2" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="91.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">(나) 접속 범위</text>
<text x="360" y="114.125" font-size="15" text-anchor="middle" fill="#292929">"8081:80" 은 다른 PC 도,</text>
<text x="360" y="135.875" font-size="15" text-anchor="middle" fill="#292929">"127.0.0.1:8081:80" 은 내</text>
<text x="360" y="157.625" font-size="15" text-anchor="middle" fill="#292929">PC 만</text>
<rect x="484" y="52" width="224" height="134.2" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="596" y="81.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">(다) up -d 출력</text>
<text x="596" y="103.25" font-size="15" text-anchor="middle" fill="#292929">web1 Running, web2</text>
<text x="596" y="125" font-size="15" text-anchor="middle" fill="#292929">Recreated, web3</text>
<text x="596" y="146.75" font-size="15" text-anchor="middle" fill="#292929">Created. web1 은 안</text>
<text x="596" y="168.5" font-size="15" text-anchor="middle" fill="#292929">끊긴다</text>
<rect x="12" y="202.2" width="696" height="90.7" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="24" y="231.32" font-size="16" text-anchor="start" fill="#292929" font-weight="700">자주 틀리는 곳 1</text>
<text x="24" y="253.45" font-size="15" text-anchor="start" fill="#292929">-f compose.secure.yaml 을 빼면 compose.yaml 이 그대로 적용되어 PORTS 가 둘 다 0.0.0.0:</text>
<text x="24" y="275.2" font-size="15" text-anchor="start" fill="#292929">로 남는다</text>
<rect x="12" y="294.2" width="696" height="68.95" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="24" y="323.32" font-size="16" text-anchor="start" fill="#292929" font-weight="700">자주 틀리는 곳 2</text>
<text x="24" y="345.45" font-size="15" text-anchor="start" fill="#292929">web2 에서 127.0.0.1: 을 빼면 오류 없이 다시 모두에게 열린다. 오류가 없어도 PORTS 로 확인한다</text>
</g>
</svg>
