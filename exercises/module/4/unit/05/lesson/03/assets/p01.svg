<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>실습 5-2 목표: 상황 8개마다 원인과 해결을 내 말로 정리해 Module 4 총정리로 쓴다</title>
<desc>새로 배우는 것 없이 Module 4에서 만든 파일과 함수를 상황별로 되짚습니다. 상황마다 원인 · 고칠 파일 · 어떻게 · 확인 · 먼저 할 일을 정리하고, 그 글을 보고서 실습 5-2 칸에 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-2 · 무엇을 하나</text>
<rect x="20" y="60" width="200" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="103.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">상황 8개</text>
<text x="120" y="124.1" font-size="15" fill="#292929" text-anchor="middle">Module 4 파일과</text>
<text x="120" y="145.1" font-size="15" fill="#292929" text-anchor="middle">함수를 되짚기</text>
<text x="120" y="166.1" font-size="15" fill="#666660" text-anchor="middle">코드는 읽기만</text>
<rect x="250" y="60" width="220" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="92.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">상황마다 정리</text>
<text x="360" y="113.6" font-size="15" fill="#292929" text-anchor="middle">원인 · 고칠 파일</text>
<text x="360" y="134.6" font-size="15" fill="#292929" text-anchor="middle">어떻게 고치나요</text>
<text x="360" y="155.6" font-size="15" fill="#292929" text-anchor="middle">고친 뒤 확인</text>
<text x="360" y="176.6" font-size="15" fill="#666660" text-anchor="middle">먼저 할 일(선택)</text>
<rect x="500" y="60" width="200" height="140" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="113.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">보고서</text>
<text x="600" y="134.6" font-size="15" fill="#292929" text-anchor="middle">실습 5-2 칸</text>
<text x="600" y="155.6" font-size="15" fill="#292929" text-anchor="middle">= Module 4 총정리</text>
<polyline points="220,130 246,130" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="470,130 496,130" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="226" width="680" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="255.6" font-size="15" fill="#292929" text-anchor="middle">코드를 실행하지 않고 읽고 글로 씁니다 · 새로 배우는 것은 없습니다</text>
</g>
</svg>
