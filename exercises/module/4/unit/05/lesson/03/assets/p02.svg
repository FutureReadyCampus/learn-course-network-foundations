<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>SIEM 의 마지막 단계인 알림에서 모양이 다른 두 규칙 결과를 같은 키로 담는다</title>
<desc>SIEM 은 수집, 정규화, 탐지, 알림 네 단계로 일한다. 로그인 실패 규칙은 주소와 횟수를, 트래픽 급증 규칙은 분과 요청 수를 낸다. 알림은 같은 키 다섯 개로 담아야 한 파일에 모을 수 있다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">SIEM 네 단계 중 마지막 · 알림</text>
<rect x="30" y="55" width="135" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="97.5" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">수집</text>
<rect x="205" y="55" width="135" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="272.5" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">정규화</text>
<line x1="165" y1="82" x2="203" y2="82" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="55" width="135" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="447.5" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">탐지</text>
<line x1="340" y1="82" x2="378" y2="82" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="555" y="55" width="135" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="622.5" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림</text>
<line x1="515" y1="82" x2="553" y2="82" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="30" y="150" width="260" height="74" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="160" y="182.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">로그인 실패 규칙</text>
<text x="160" y="201.7" font-size="14" fill="#292929" text-anchor="middle">주소와 횟수 · 203.0.113.50 이 5번</text>
<rect x="30" y="245" width="260" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="160" y="277.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">트래픽 급증 규칙</text>
<text x="160" y="296.7" font-size="14" fill="#292929" text-anchor="middle">분과 요청 수 · 09:12 에 9개</text>
<rect x="360" y="165" width="330" height="140" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="525" y="208.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">같은 키 다섯 개</text>
<text x="525" y="229.8" font-size="15" fill="#292929" text-anchor="middle">type · target · count</text>
<text x="525" y="250.8" font-size="15" fill="#292929" text-anchor="middle">note · status</text>
<text x="525" y="271.8" font-size="15" fill="#292929" text-anchor="middle">→ 한 파일에 모을 수 있음</text>
<line x1="290" y1="187" x2="358" y2="215" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="290" y1="282" x2="358" y2="255" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
