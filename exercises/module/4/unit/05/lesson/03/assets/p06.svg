<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>이번 Unit 마무리: 오늘 한 일 체크와 anomaly_detection 폴더의 파일 배치</title>
<desc>왼쪽은 실습 5-1 · 5-2와 보고서를 끝냈는지 확인하는 목록입니다. 오른쪽은 pwd · ls 로 볼 파일입니다. config/ 안에는 JSON 설정 파일만 두고, 그 밖의 파일은 모두 anomaly_detection/ 바로 아래에 둡니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">1. 오늘 한 일 확인</text>
<g fill="#ffffff" stroke="#dededb" stroke-width="1.5">
<rect x="20" y="48" width="320" height="66" rx="8"/><rect x="20" y="124" width="320" height="66" rx="8"/>
<rect x="20" y="200" width="320" height="66" rx="8"/>
</g>
<rect x="20" y="276" width="320" height="66" rx="8" fill="#ffffff" stroke="#666660" stroke-width="1.5" stroke-dasharray="6 4"/>
<g fill="#ffffff" stroke="#1f7a4a" stroke-width="2">
<rect x="34" y="64" width="16" height="16" rx="3"/><rect x="34" y="140" width="16" height="16" rx="3"/>
<rect x="34" y="216" width="16" height="16" rx="3"/><rect x="34" y="292" width="16" height="16" rx="3"/>
</g>
<text font-size="15" fill="#292929">
<tspan x="62" y="78" font-weight="700">실습 5-1</tspan><tspan x="62" y="100" font-size="14" fill="#666660">대상 3명 AI 요약 · 실패하면 대체 문장</tspan>
<tspan x="62" y="154" font-weight="700">실습 5-2 · Module 4 총정리</tspan><tspan x="62" y="176" font-size="14" fill="#666660">상황 8개 중 4개 이상 원인과 해결</tspan>
<tspan x="62" y="230" font-weight="700">report_u5.md</tspan><tspan x="62" y="252" font-size="14" fill="#666660">5-1 · 5-2 칸에 비어 있는 답: 없음</tspan>
<tspan x="62" y="306" font-weight="700">도전 5-1 ~ 5-3 (선택)</tspan><tspan x="62" y="328" font-size="14" fill="#666660">했다면 그 파일도 있음</tspan>
</text>
<text x="370" y="32" font-size="19" fill="#292929" font-weight="700">2. 파일 확인 (pwd · ls)</text>
<rect x="370" y="48" width="330" height="294" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text font-size="15" fill="#292929">
<tspan x="386" y="76" font-weight="700">anomaly_detection/</tspan>
<tspan x="406" y="102" fill="#2f6fd0" font-weight="700">config/</tspan>
<tspan x="430" y="126" fill="#666660">users.json · roles.json</tspan>
<tspan x="406" y="156">llm_client.py</tspan>
<tspan x="406" y="180">unit05_risk_scores.json</tspan>
<tspan x="406" y="204">event_summary.py</tspan>
<tspan x="406" y="228">exercise5-1_run.py</tspan>
<tspan x="406" y="252">report_u5.md</tspan>
<tspan x="406" y="280" fill="#666660">(앞 Unit의 파일들)</tspan>
<tspan x="406" y="308" fill="#666660">(도전을 했다면 그 파일들)</tspan>
