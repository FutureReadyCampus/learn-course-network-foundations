<text x="20" y="378" font-size="16" fill="#292929" font-weight="700">파일 두는 규칙</text>
<rect x="20" y="390" width="330" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="36" y="416" font-size="15" fill="#292929"><tspan font-weight="700">config/</tspan> 안에는 JSON 설정 파일만</text>
<rect x="366" y="390" width="334" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="382" y="416" font-size="15" fill="#292929">그 밖은 모두 <tspan font-weight="700">anomaly_detection/</tspan> 바로 아래</text>
</g>
</svg>
