<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<title>마무리 정리: git status 로 확인하고, add·commit·push 로 올리고, 브라우저로 확인</title>
<desc>git status 에서 .env · .venv 가 보이면 멈춥니다. git add . 다음 git commit -m 과 git push 로 올리고, 브라우저에서 anomaly_detection 폴더와 파일이 있는지 확인합니다.</desc>
<defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">마무리 정리</text>
<rect x="20" y="60" width="210" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="125" y="94.5" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="125" y="115.5" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<text x="125" y="135.5" font-size="14" fill="#666660" text-anchor="middle">.env · .venv 보이면</text>
<text x="125" y="155.1" font-size="14" fill="#666660" text-anchor="middle">멈춤</text>
<rect x="255" y="60" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="93.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올리기</text>
<text x="360" y="114.1" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<text x="360" y="135.1" font-size="15" fill="#292929" text-anchor="middle">git commit -m "…"</text>
<text x="360" y="156.1" font-size="15" fill="#292929" text-anchor="middle">git push</text>
<rect x="490" y="60" width="210" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="94.5" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올린 뒤</text>
<text x="595" y="115.5" font-size="15" fill="#292929" text-anchor="middle">브라우저에서</text>
<text x="595" y="135.5" font-size="14" fill="#292929" text-anchor="middle">anomaly_detection</text>
<text x="595" y="155.1" font-size="14" fill="#292929" text-anchor="middle">폴더와 파일 확인</text>
<polyline points="230,120 251,120" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<polyline points="465,120 486,120" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<text x="20" y="222" font-size="15" fill="#666660">__pycache__ 폴더는 깃허브에 없어도 됩니다</text>
</g>
</svg>
