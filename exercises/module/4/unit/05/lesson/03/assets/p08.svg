<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>이번 Unit 마무리: 실습 5-1·10-2·10-3·마무리 네 가지를 했고 다음은 Module 5</title>
<desc>사실만 보내 요약 받기(실습 5-1), pipeline.py 한 번으로 보고서까지(도전 5-3), 상황 8개 정리(실습 5-2), 깃허브에 올리기(마무리)를 확인합니다. 다음 Unit은 high 대상을 만났을 때 할 일을 프로그램이 대신하는 Module 5 입니다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 Unit 마무리</text>
<rect x="20" y="52" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<polyline points="36,75 43,82 56,67" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="72" y="81" font-size="15" fill="#292929" font-weight="700">실습 5-1</text>
<text x="170" y="81" font-size="15" fill="#292929">점수 파일의 사실만 보내 3명 요약 · 실패하면 대체 문장</text>
<rect x="20" y="108" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<polyline points="36,131 43,138 56,123" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="72" y="137" font-size="15" fill="#292929" font-weight="700">도전 5-3</text>
<text x="170" y="137" font-size="15" fill="#292929">pipeline.py 한 번으로 읽기부터 보고서 저장까지</text>
<rect x="20" y="164" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<polyline points="36,187 43,194 56,179" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="72" y="193" font-size="15" fill="#292929" font-weight="700">실습 5-2</text>
<text x="170" y="193" font-size="15" fill="#292929">상황 8개의 원인과 고치는 방법 · Module 4 총정리</text>
<rect x="20" y="220" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<polyline points="36,243 43,250 56,235" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="72" y="249" font-size="15" fill="#292929" font-weight="700">마무리</text>
<text x="170" y="249" font-size="15" fill="#292929">Module 4 작업과 보고서를 깃허브에 올림</text>
<polyline points="360,276 360,296" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="20" y="300" width="680" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="325.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">다음 Unit · Module 5 (자동 대응)</text>
<text x="360" y="346.6" font-size="15" fill="#292929" text-anchor="middle">등급이 high 인 대상을 만나면 사람이 하던 일을 프로그램이 대신</text>
<text x="360" y="367.6" font-size="15" fill="#666660" text-anchor="middle">새 폴더 soar_response · 실습 5-2 「먼저 할 일」이 참고 자료</text>
