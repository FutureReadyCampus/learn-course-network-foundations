<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 5-2 정답: 알림 2건을 저장하고 str(minute) 를 빼면 TypeError 가 난다</title>
<desc>정답 출력은 비정상 로그인 1건과 트래픽 급증 1건, 모두 2건이다. 두 알림은 같은 주소와 같은 09:12 라서 한 사건으로 조사한다. target 에 시각 값을 그대로 두면 JSON 저장에서 TypeError 가 난다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-2 정답 · alerts.json 알림 2건</text>
<rect x="30" y="52" width="320" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="190" y="87.5" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">비정상 로그인</text>
<text x="190" y="107.1" font-size="14" fill="#292929" text-anchor="middle">target: 203.0.113.50</text>
<text x="190" y="126.7" font-size="14" fill="#292929" text-anchor="middle">count: 5</text>
<text x="190" y="146.3" font-size="14" fill="#292929" text-anchor="middle">status: 확인 필요</text>
<rect x="370" y="52" width="320" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="530" y="87.5" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">트래픽 급증</text>
<text x="530" y="107.1" font-size="14" fill="#292929" text-anchor="middle">target: 2026-11-02 09:12:00</text>
<text x="530" y="126.7" font-size="14" fill="#292929" text-anchor="middle">count: 9</text>
<text x="530" y="146.3" font-size="14" fill="#292929" text-anchor="middle">status: 확인 필요</text>
<rect x="30" y="195" width="660" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="225.2" font-size="15" fill="#292929" text-anchor="middle">같은 주소 · 같은 09:12 → 두 건을 한 사건으로 통합해 조사</text>
<line x1="190" y1="172" x2="190" y2="193" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="530" y1="172" x2="530" y2="193" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="30" y="282" font-size="16" fill="#292929" font-weight="700">자주 틀리는 곳</text>
<rect x="30" y="300" width="190" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125" y="330.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">target = minute</text>
<text x="125" y="349.7" font-size="14" fill="#292929" text-anchor="middle">시각 값 그대로</text>
<rect x="260" y="300" width="200" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="330.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">TypeError</text>
<text x="360" y="349.7" font-size="14" fill="#292929" text-anchor="middle">JSON 에 쓸 수 없음</text>
<rect x="500" y="300" width="190" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="330.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">target = str(minute)</text>
<text x="595" y="349.7" font-size="14" fill="#292929" text-anchor="middle">문자열로 고치기</text>
<line x1="220" y1="335" x2="258" y2="335" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="460" y1="335" x2="498" y2="335" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
</g>
</svg>
