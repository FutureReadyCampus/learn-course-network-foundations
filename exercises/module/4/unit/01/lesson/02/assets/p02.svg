<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img">
<title>로그 한 줄을 값으로 나눠야 401 인 줄을 코드로 셀 수 있다</title>
<desc>왼쪽은 나누기 전의 긴 문자열이라 사람이 한 줄씩 읽어야 합니다. 오른쪽은 접속자 주소 · 방법 · 경로 · 상태 코드로 나눈 뒤라 코드가 세고 비교합니다. 아래는 찾고 싶은 평소와 다른 접속의 예입니다.</desc>
<defs><marker id="a-m4u01l02-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l02-p04-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#b32a17" font-weight="700">나누기 전</text>
<text x="386" y="34" font-size="19" fill="#1f7a4a" font-weight="700">나눈 뒤</text>
<rect x="24" y="52" width="310" height="150" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="179.0" y="100.8" font-size="15" fill="#292929" text-anchor="middle">한 줄 = 긴 문자열 하나</text>
<text x="179.0" y="121.8" font-size="15" fill="#292929" text-anchor="middle">"POST /login HTTP/1.1" 401 …</text>
<text x="179.0" y="142.8" font-size="15" fill="#292929" text-anchor="middle">「401 인 줄은 몇 개?」</text>
<text x="179.0" y="163.8" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">→ 사람이 한 줄씩 읽음</text>
<line x1="334" y1="127" x2="380" y2="127" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p04)"/>
<rect x="386" y="52" width="310" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="541.0" y="100.8" font-size="15" fill="#292929" text-anchor="middle">ip: 203.0.113.50</text>
<text x="541.0" y="121.8" font-size="15" fill="#292929" text-anchor="middle">method: POST · path: /login</text>
<text x="541.0" y="142.8" font-size="15" fill="#292929" text-anchor="middle">status: 401</text>
<text x="541.0" y="163.8" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">→ 코드가 세고 비교</text>
<text x="24" y="250" font-size="17" fill="#292929" font-weight="700">찾고 싶은 것: 평소와 다른 접속</text>
<rect x="24" y="266" width="212" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="130.0" y="295.2" font-size="15" fill="#292929" text-anchor="middle">로그인 연속 실패</text>
<rect x="254" y="266" width="212" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="295.2" font-size="15" fill="#292929" text-anchor="middle">관리자 페이지 반복</text>
<rect x="484" y="266" width="212" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="590.0" y="295.2" font-size="15" fill="#292929" text-anchor="middle">짧은 시간 요청 몰림</text>
</g>
</svg>
