<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>report_u1.md 틀은 핵심 실습 칸을 모두 채우고, 응용 칸은 한 것만 채운다</title>
<desc>anomaly_detection 폴더에 New File 로 report_u1.md 를 만들고 틀을 붙여 넣습니다. 칸은 실습 1-1, 실습 1-2, 마무리 순서이고 모두 채웁니다. 그 아래 응용 1-1 ~ 1-3 칸은 선택이라 내가 한 응용만 채웁니다.</desc>
