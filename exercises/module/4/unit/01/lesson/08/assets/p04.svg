<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 1-2 기술 기록: 실행 출력과 시각 정렬 근거</title>
<desc>실습 1-2 기술 기록에서 (가) · (나)는 핵심, (다)는 선택 질문입니다. 실행 결과와 판단 근거를 report_u1.md 에 적습니다.</desc>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">실습 1-2 · 실행 결과와 판단 근거</text>
<rect x="24" y="50" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65" y="81.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<text x="65" y="102.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="50" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="80.8" font-size="15" fill="#292929" font-weight="700">출력 전체 · 이벤트 수 · 읽기 실패 줄 수</text>
<text x="132" y="101.8" font-size="15" fill="#666660">쓸 내용: 출력 · 이벤트 수와 실패한 줄 수 · 성공 / 실패 개수</text>
<rect x="24" y="134" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65" y="165.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="65" y="186.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="134" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="164.8" font-size="15" fill="#292929" font-weight="700">시각 문자열 그대로 정렬하면 12월 1일과 11월 2일 중 앞은?</text>
<text x="132" y="185.8" font-size="15" fill="#666660">쓸 내용: 어느 쪽이 앞인지 · 공통 모양으로 바꾸면 달라지는 점</text>
<rect x="24" y="218" width="82" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="65" y="249.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="65" y="270.2" font-size="14" fill="#9a6200" text-anchor="middle">응용</text>
<rect x="118" y="218" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="248.8" font-size="15" fill="#292929" font-weight="700">이벤트에 원래 로그 줄 raw 를 남기는 이유</text>
<text x="132" y="269.8" font-size="15" fill="#666660">쓸 내용: raw 를 남기는 이유 · 정규화하면 사라지는 정보의 예</text>
<rect x="24" y="314" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65" y="345.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">기록 확인</text>
<text x="65" y="366.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="314" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="344.8" font-size="15" fill="#292929" font-weight="700">실습 1-1 · 1-2의 출력과 답을 기록했는지</text>
<text x="132" y="365.8" font-size="15" fill="#666660">쓸 내용: 각 실습의 결과와 이유를 적었는지</text>
<line x1="24" y1="302" x2="696" y2="302" stroke="#dededb" stroke-width="1.5" stroke-dasharray="6 5"/>
</g>
</svg>
