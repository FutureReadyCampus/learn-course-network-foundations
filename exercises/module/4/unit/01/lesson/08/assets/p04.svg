<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>도전 1-2 보고서에 채울 칸: 출력과 수, 가짜 주소의 문제, 키에 없는 정보</title>
<desc>(가)는 두 로그의 출력과 수, (나)는 ip 에 가짜 주소 0.0.0.0 을 넣을 때의 문제, (다)는 공통 이벤트 키에 없는 정보와 찾는 곳을 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">보고서 도전 1-2 칸 체크리스트</text>
<rect x="24" y="54" width="170" height="118" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="109" y="107.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(가)</text>
<text x="109" y="127.9" font-size="14" text-anchor="middle" fill="#666660">출력 · 수</text>
<rect x="210" y="69" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="62" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="82.1" font-size="14" text-anchor="start" fill="#292929">① 출력 전체 (코드 상자에 붙여 넣기)</text>
<rect x="210" y="105" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="98" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="118.1" font-size="14" text-anchor="start" fill="#292929">② 판정 서버 이벤트 수 · 성공 · 실패별 개수</text>
<rect x="210" y="141" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="134" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="154.1" font-size="14" text-anchor="start" fill="#292929">③ SaaS 이벤트 수 · 성공 · 실패별 개수</text>
<rect x="24" y="186" width="170" height="82" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="109" y="211.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(나)</text>
<text x="109" y="231.8" font-size="14" text-anchor="middle" fill="#666660">가짜 주소 0.0.0.0</text>
<text x="109" y="252.1" font-size="14" text-anchor="middle" fill="#292929">[핵심 질문]</text>
<rect x="210" y="201" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="194" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="214.1" font-size="14" text-anchor="start" fill="#292929">① 가짜 주소를 넣으면 생기는 문제</text>
<rect x="210" y="237" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="230" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="250.1" font-size="14" text-anchor="start" fill="#292929">② 그 이유</text>
<rect x="24" y="282" width="170" height="82" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="109" y="307.1" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(다)</text>
<text x="109" y="327.8" font-size="14" text-anchor="middle" fill="#666660">키에 없는 정보</text>
<text x="109" y="348.1" font-size="14" text-anchor="middle" fill="#292929">[핵심 질문]</text>
<rect x="210" y="297" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="290" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="310.1" font-size="14" text-anchor="start" fill="#292929">① 공통 이벤트 키에 들어가지 않은 정보</text>
<rect x="210" y="333" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<rect x="240" y="326" width="456" height="32" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="346.1" font-size="14" text-anchor="start" fill="#292929">② 그 정보를 나중에 찾을 수 있는 곳</text>
</g>
</svg>
