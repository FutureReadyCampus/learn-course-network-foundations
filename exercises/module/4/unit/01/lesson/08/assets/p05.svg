<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>도전 1-1 (선택) 보고서에 채울 칸: (가) 출력 · 분류별 수, (나) 놓친 예, (다) SIEM 방식</title>
<desc>도전 1-1 보고서의 세 질문과 쓸 내용입니다. 도전은 선택이라 한 경우에만 채웁니다. (나)와 (다)는 핵심 질문이고, (다)는 시작하기 레슨의 SIEM(심) 방식 여섯 가지 표를 보고 답합니다.</desc>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">도전 1-1 (선택) · 채울 칸</text>
<rect x="24" y="50" width="82" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="65" y="91.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="118" y="50" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="80.8" font-size="15" fill="#292929" font-weight="700">출력 전체 · 분류별 요청 수</text>
<text x="132" y="101.8" font-size="15" fill="#666660">쓸 내용: 출력 · 분류별 수 · 같은 주소에서 반복된 의심 요청</text>
<rect x="24" y="134" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65" y="165.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="65" y="186.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="134" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="164.8" font-size="15" fill="#292929" font-weight="700">상태 코드 · 경로만 보는 규칙이 놓친 예 두 가지</text>
<text x="132" y="185.8" font-size="15" fill="#666660">쓸 내용: 놓친 예 두 가지 · 각각 왜 놓쳤는지</text>
<rect x="24" y="218" width="82" height="92" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65" y="259.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="65" y="280.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="218" width="578" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="248.8" font-size="15" fill="#292929" font-weight="700">보안 담당 1명 · 클라우드 위주 회사의 SIEM(심) 방식</text>
<text x="132" y="269.8" font-size="15" fill="#666660">표: 시작하기 레슨 「SIEM(심)을 쓰는 방식 여섯 가지」</text>
<text x="132" y="290.8" font-size="15" fill="#666660">쓸 내용: 고른 방식과 이유 · 고르지 않은 방식 하나</text>
</g>
</svg>
