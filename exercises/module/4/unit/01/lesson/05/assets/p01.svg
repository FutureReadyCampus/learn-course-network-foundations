<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>문제 해결 과정을 하나의 사례로 기록한다</title>
<desc>고민한 사례의 증상, 근거, 선택과 확인 결과를 기록한다.</desc>
<defs><marker id="a-m4u01l05-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l05-p01-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">블로그에 남길 문제 해결 과정</text>
<rect x="24" y="48" width="672" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="64" width="20" height="20" rx="4" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/><polyline points="44,74 49,79 56,69" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="74" y="80" font-size="15" fill="#292929">실제로 고민했던 사례 하나 고르기</text>
<rect x="24" y="112" width="672" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="128" width="20" height="20" rx="4" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/><polyline points="44,138 49,143 56,133" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="74" y="144" font-size="15" fill="#292929">그때 본 로그와 결과를 짧게 적기</text>
<rect x="24" y="176" width="672" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="192" width="20" height="20" rx="4" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/><polyline points="44,202 49,207 56,197" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="74" y="208" font-size="15" fill="#292929">서로 다른 해석이나 방법을 비교하기</text>
<rect x="24" y="240" width="672" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="256" width="20" height="20" rx="4" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/><polyline points="44,266 49,271 56,261" fill="none" stroke="#1f7a4a" stroke-width="2.5"/>
<text x="74" y="272" font-size="15" fill="#292929">어떤 방법을 선택했고 왜 선택했는지 설명하기</text>
<rect x="24" y="304" width="672" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<rect x="40" y="320" width="20" height="20" rx="4" fill="#ffffff" stroke="#e0442e" stroke-width="2"/><polyline points="44,330 49,335 56,325" fill="none" stroke="#e0442e" stroke-width="2.5"/>
<text x="74" y="336" font-size="15" fill="#292929">다시 확인한 결과와 남은 질문 쓰기</text>
</g>
</svg>
