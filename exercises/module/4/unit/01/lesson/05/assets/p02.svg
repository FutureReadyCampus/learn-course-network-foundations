<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>로그에서 관찰한 근거를 고른다</title>
<desc>읽기 실패 줄을 비교하고 한 번의 오류와 반복된 요청을 구분한다.</desc>
<defs><marker id="a-m4u01l05-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l05-p02-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">출력에서 근거 고르기</text>
<rect x="24" y="50" width="82" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="65.0" y="93.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="118" y="50" width="578" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="82.8" font-size="15" fill="#292929" font-weight="700">읽기 성공과 실패가 몇 줄이었는지 확인</text>
<text x="132" y="103.8" font-size="15" fill="#666660">실패한 줄의 모양을 근거로 남기기</text>
<rect x="24" y="142" width="82" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65.0" y="175.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="65.0" y="196.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="142" width="578" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="174.8" font-size="15" fill="#292929" font-weight="700">로그 한 줄로 알 수 있는 것 · 알 수 없는 것</text>
<text x="132" y="195.8" font-size="15" fill="#666660">샘플에서 관찰한 사실과 해석을 구분하기</text>
<rect x="24" y="234" width="82" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65.0" y="267.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="65.0" y="288.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="234" width="578" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="266.8" font-size="15" fill="#292929" font-weight="700">한 번의 404 와 연달아 난 404 는 같은 일인가</text>
<text x="132" y="287.8" font-size="15" fill="#666660">주소와 시각을 같이 보고 반복이었는지 확인</text>
</g>
</svg>
