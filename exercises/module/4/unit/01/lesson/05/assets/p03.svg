<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>판정 서버와 SaaS 로그는 어려운 곳이 달라 고치는 방법도 다르다</title>
<desc>판정 서버 로그는 시각이 T 로 나뉘고 초가 없으며 접속 주소가 없습니다. SaaS 로그는 시각은 이미 공통 모양이지만 사용자가 메일 주소입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">로그마다 어려운 곳이 다르다</text>
<rect x="24" y="56" width="672" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="80.3" font-size="15" text-anchor="middle" fill="#292929">실습 1-2 의 웹 서버 방법을 나머지 두 종류에 적용합니다</text>
<rect x="24" y="112" width="324" height="36" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="186" y="134.6" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">판정 서버 로그</text>
<rect x="24" y="160" width="150" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="99" y="194.1" font-size="14" text-anchor="middle" fill="#292929">시각에 T, 초가 없음</text>
<line x1="176" y1="190" x2="192" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="196" y="160" width="152" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="272" y="194.1" font-size="14" text-anchor="middle" fill="#292929">초는 :00 으로</text>
<rect x="24" y="236" width="150" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="99" y="270.1" font-size="14" text-anchor="middle" fill="#292929">접속 주소가 없음</text>
<line x1="176" y1="266" x2="192" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="196" y="236" width="152" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="272" y="270.1" font-size="14" text-anchor="middle" fill="#292929">ip 는 None</text>
<rect x="372" y="112" width="324" height="36" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="534" y="134.6" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">SaaS 로그</text>
<rect x="372" y="160" width="150" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447" y="194.1" font-size="14" text-anchor="middle" fill="#292929">시각은 공통 모양</text>
<line x1="524" y1="190" x2="540" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="544" y="160" width="152" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="620" y="194.1" font-size="14" text-anchor="middle" fill="#292929">시각은 그대로</text>
<rect x="372" y="236" width="150" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="447" y="270.1" font-size="14" text-anchor="middle" fill="#292929">사용자가 메일 주소</text>
<line x1="524" y1="266" x2="540" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="544" y="236" width="152" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="620" y="270.1" font-size="14" text-anchor="middle" fill="#292929">@ 앞 이름만 꺼냄</text>
</g>
</svg>
