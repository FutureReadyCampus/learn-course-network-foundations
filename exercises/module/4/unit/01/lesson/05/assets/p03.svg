<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>선택과 확인 결과를 근거와 함께 글에 담는다</title>
<desc>판단에 쓴 요청과 비교한 방식, 공개 전 확인할 것을 보여 준다.</desc>
<defs><marker id="a-m4u01l05-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l05-p03-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">블로그 글에 담을 판단 근거</text>
<rect x="24" y="50" width="82" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="65.0" y="91.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="118" y="50" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="80.8" font-size="15" fill="#292929" font-weight="700">판단할 때 본 요청과 출력</text>
<text x="132" y="101.8" font-size="15" fill="#666660">정상, 오류, 의심 가운데 글에 필요한 결과만 남기기</text>
<rect x="24" y="134" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65.0" y="165.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="65.0" y="186.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="134" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="164.8" font-size="15" fill="#292929" font-weight="700">상태 코드 · 경로만 보는 규칙이 놓친 예 두 가지</text>
<text x="132" y="185.8" font-size="15" fill="#666660">분류 규칙이 놓친 이유와 확인 방법을 적기</text>
<rect x="24" y="218" width="82" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="65.0" y="249.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="65.0" y="270.2" font-size="14" fill="#b32a17" text-anchor="middle">핵심</text>
<rect x="118" y="218" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="248.8" font-size="15" fill="#292929" font-weight="700">보안 담당 1명 · 클라우드 위주 회사의 SIEM(심) 방식</text>
<text x="132" y="269.8" font-size="15" fill="#666660">선택한 방식과 다른 선택지를 비교하기</text>
<rect x="24" y="302" width="82" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="65.0" y="343.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마무리</text>
<rect x="118" y="302" width="578" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="132" y="332.8" font-size="15" fill="#292929" font-weight="700">공개 전에 글과 실습 코드 확인</text>
<text x="132" y="353.8" font-size="15" fill="#666660">연락처, 비밀번호나 API 키는 포함하지 않기</text>
</g>
</svg>
