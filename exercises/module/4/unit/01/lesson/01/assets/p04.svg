<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>network-study-notes 안에 anomaly_detection 폴더를 만들고 샘플 로그 파일을 만든다</title>
<desc>왼쪽은 폴더 배치입니다. Module 3 의 access_control 옆에 Module 4 의 anomaly_detection 을 만들고, 그 안에 access_sample.log 를 New File 로 만들어 붙여 넣습니다. 오른쪽은 순서이며 마지막에 줄 수가 30 인지 확인합니다.</desc>
<defs><marker id="a-m4u01l01-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">폴더 배치</text>
<text x="390" y="34" font-size="19" fill="#292929" font-weight="700">순서</text>
<rect x="24" y="56" width="300" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="82.2" font-size="15" fill="#292929" text-anchor="middle">network-study-notes/</text>
<line x1="44" y1="98" x2="44" y2="188" stroke="#dededb" stroke-width="2"/>
<line x1="44" y1="134" x2="64" y2="134" stroke="#dededb" stroke-width="2"/>
<rect x="64" y="114" width="260" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="80" y="139.2" font-size="15" fill="#292929">access_control/</text>
<text x="310" y="139.2" font-size="14" fill="#666660" text-anchor="end">Module 3</text>
<line x1="44" y1="188" x2="64" y2="188" stroke="#dededb" stroke-width="2"/>
<rect x="64" y="168" width="260" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="80" y="193.2" font-size="15" fill="#292929" font-weight="700">anomaly_detection/</text>
<text x="310" y="193.2" font-size="14" fill="#2558a8" text-anchor="end">Module 4</text>
<line x1="84" y1="208" x2="84" y2="296" stroke="#dededb" stroke-width="2"/>
<rect x="104" y="224" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="249.2" font-size="15" fill="#292929" text-anchor="middle">access_sample.log (30줄)</text>
<line x1="84" y1="244" x2="104" y2="244" stroke="#dededb" stroke-width="2"/>
<rect x="104" y="276" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="301.2" font-size="15" fill="#292929" text-anchor="middle">블로그 초안</text>
<line x1="84" y1="296" x2="104" y2="296" stroke="#dededb" stroke-width="2"/>
<rect x="390" y="56" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="88.2" font-size="15" fill="#292929">1  mkdir -p anomaly_detection</text>
<line x1="543" y1="110" x2="543" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p04)"/>
<rect x="390" y="138" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="170.2" font-size="15" fill="#292929">2  cd anomaly_detection</text>
<line x1="543" y1="192" x2="543" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p04)"/>
<rect x="390" y="220" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="252.2" font-size="15" fill="#292929">3  pwd → …/anomaly_detection</text>
<line x1="543" y1="274" x2="543" y2="300" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p04)"/>
<rect x="390" y="302" width="306" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="404" y="334.2" font-size="15" fill="#292929">4  New File 로 만들고 30줄 확인</text>
<text x="24" y="352" font-size="15" fill="#666660">처음 위치가 access_control 안이면 cd .. 먼저</text>
<text x="390" y="388" font-size="15" fill="#666660">마지막 줄 - 도 일부러 넣은 깨진 줄입니다</text>
</g>
</svg>
