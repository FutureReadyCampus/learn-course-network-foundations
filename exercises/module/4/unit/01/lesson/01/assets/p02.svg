<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>network-study-notes 안에 anomaly_detection 폴더와 샘플 로그를 만든다</title>
<desc>anomaly_detection 폴더에 access_sample.log를 붙여 넣고 줄 수가 30인지 확인한다.</desc>
<defs><marker id="a-m4u01l01-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l01-p02-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">폴더 배치</text>
<text x="390" y="34" font-size="19" fill="#292929" font-weight="700">순서</text>
<rect x="24" y="56" width="300" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="174.0" y="82.2" font-size="15" fill="#292929" text-anchor="middle">network-study-notes/</text>
<line x1="44" y1="98" x2="44" y2="141" stroke="#dededb" stroke-width="2"/>
<line x1="44" y1="140" x2="64" y2="140" stroke="#dededb" stroke-width="2"/>
<rect x="64" y="120" width="260" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="194.0" y="146.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">anomaly_detection/</text>
<rect x="104" y="184" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214.0" y="209.2" font-size="15" fill="#292929" text-anchor="middle">access_sample.log (30줄)</text>
<line x1="84" y1="204" x2="104" y2="204" stroke="#dededb" stroke-width="2"/>
<rect x="104" y="236" width="220" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214.0" y="261.2" font-size="15" fill="#292929" text-anchor="middle">실습 코드도 이 폴더에 저장합니다</text>
<line x1="84" y1="256" x2="104" y2="256" stroke="#dededb" stroke-width="2"/>
<line x1="84" y1="162" x2="84" y2="256" stroke="#dededb" stroke-width="2"/>
<rect x="390" y="56" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="88.2" font-size="15" fill="#292929">1  mkdir anomaly_detection</text>
<line x1="543" y1="110" x2="543" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p02)"/>
<rect x="390" y="138" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="170.2" font-size="15" fill="#292929">2  cd anomaly_detection</text>
<line x1="543" y1="192" x2="543" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p02)"/>
<rect x="390" y="220" width="306" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="404" y="252.2" font-size="15" fill="#292929">3  pwd → …/anomaly_detection</text>
<line x1="543" y1="274" x2="543" y2="300" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p02)"/>
<rect x="390" y="302" width="306" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
