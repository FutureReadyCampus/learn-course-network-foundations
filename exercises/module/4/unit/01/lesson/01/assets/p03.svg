<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>오류가 나면 증상을 보고 위치 · 이름 · 들여쓰기를 확인한 뒤 고친다</title>
<desc>세 줄의 증상 · 확인 · 고치기 순서입니다. 파일을 못 찾으면 pwd 와 ls 를, IndentationError · NameError 면 직접 쓴 줄을 봅니다. 그래도 안 되면 AI 에게 묻고 정답을 본 뒤 실습 기록에 막힌 곳을 씁니다.</desc>
