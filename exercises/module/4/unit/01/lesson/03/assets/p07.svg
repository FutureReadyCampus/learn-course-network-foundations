<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>마무리는 한 일 · 파일 확인, git status, 보고서 마무리 (가), add · commit · push 순서다</title>
<desc>오늘 한 일과 파일을 확인한 뒤 security-agent-toolkit 에서 git status 를 봅니다. .env · .venv 가 보이면 멈추고 .gitignore 에 적으며, access_control/ 파일이 보이면 함께 올립니다. 보고서 마무리 (가)를 채우고 add · commit · push 로 올리면 다음은 Unit 2 입니다.</desc>
<defs><marker id="a-m4u01l03-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="32" font-size="19" fill="#292929" font-weight="700">이번 Unit 마무리 (15분)</text>
<rect x="24" y="50" width="208" height="112" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128" y="80" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">1 한 일 확인</text>
<text x="128" y="106" font-size="15" fill="#292929" text-anchor="middle">실습 1-1 · 1-2 끝</text>
<text x="128" y="128" font-size="15" fill="#666660" text-anchor="middle">보고서 답: 빈칸 없음</text>
<line x1="232" y1="106" x2="252" y2="106" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p07)"/>
<rect x="256" y="50" width="208" height="112" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="80" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">2 파일 확인</text>
<text x="360" y="106" font-size="15" fill="#292929" text-anchor="middle">anomaly_detection 에서</text>
<text x="360" y="128" font-size="15" fill="#666660" text-anchor="middle">pwd · ls</text>
<line x1="464" y1="106" x2="484" y2="106" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p07)"/>
<rect x="488" y="50" width="208" height="112" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="592" y="78" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">3 cd .. · git status</text>
<text x="592" y="104" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">.env · .venv 보이면 멈춤</text>
<text x="592" y="126" font-size="15" fill="#292929" text-anchor="middle">access_control/ 도</text>
<text x="592" y="147" font-size="15" fill="#292929" text-anchor="middle">보이면 함께 올림</text>
<path d="M592 162 V182 H128 V198" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p07)"/>
<rect x="24" y="200" width="208" height="112" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="128" y="230" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">4 보고서 마무리 (가)</text>
<text x="128" y="256" font-size="15" fill="#292929" text-anchor="middle">git status 에서 본 것</text>
<text x="128" y="278" font-size="15" fill="#666660" text-anchor="middle">올리기 전에 채움</text>
<line x1="232" y1="256" x2="252" y2="256" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p07)"/>
<rect x="256" y="200" width="208" height="112" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="230" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">5 올리기</text>
<text x="360" y="256" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<text x="360" y="278" font-size="15" fill="#292929" text-anchor="middle">git commit · git push</text>
<line x1="464" y1="256" x2="484" y2="256" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p07)"/>
<rect x="488" y="200" width="208" height="112" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="592" y="230" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다음 Unit 2</text>
<text x="592" y="256" font-size="15" fill="#292929" text-anchor="middle">판다스로 세고</text>
<text x="592" y="278" font-size="15" fill="#292929" text-anchor="middle">기준 정하기</text>
<text x="24" y="342" font-size="15" fill="#666660">.env 가 보이면 .gitignore 맨 아래에 .env 한 줄을 적고 git status 를 다시 칩니다.</text>
<text x="24" y="366" font-size="15" fill="#666660">응용을 했다면 응용 파일까지 만든 뒤 git status 부터 push 까지 한 번 더 합니다.</text>
</g>
</svg>
