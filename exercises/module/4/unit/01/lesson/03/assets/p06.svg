<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>실습 1-2 정리: 시각 세 줄 변환과 상태 코드 판정</title>
<desc>시각은 strptime, replace, strftime 세 줄로 공통 모양이 됩니다. 상태 코드는 400 이상이면 실패, 아니면 성공입니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 1-2 정리</text>
<rect x="24" y="58" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="87.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">문자열 → 시각 값</text>
<line x1="216" y1="83" x2="236" y2="83" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="240" y="58" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="87.1" font-size="14" text-anchor="start" fill="#292929">datetime.strptime(time_text, NGINX_TIME_FORMAT)</text>
<rect x="24" y="122" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="151.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">시간대 떼기</text>
<line x1="216" y1="147" x2="236" y2="147" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="240" y="122" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="151.1" font-size="14" text-anchor="start" fill="#292929">parsed.replace(tzinfo=None)</text>
<rect x="24" y="186" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="215.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">공통 모양 문자열로</text>
<line x1="216" y1="211" x2="236" y2="211" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="240" y="186" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="215.1" font-size="14" text-anchor="start" fill="#292929">local_time.strftime(COMMON_TIME_FORMAT)</text>
<rect x="24" y="250" width="190" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="119" y="279.4" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">상태 코드 → 결과</text>
<line x1="216" y1="275" x2="236" y2="275" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="240" y="250" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="279.1" font-size="14" text-anchor="start" fill="#292929">status &gt;= 400 → "실패", 아니면 "성공"</text>
</g>
</svg>
