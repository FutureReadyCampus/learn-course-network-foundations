<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>normalize_web 이 한 줄을 이벤트로 바꾸고 직접 쓰는 두 함수가 시각과 결과를 바꾼다</title>
<desc>미리 채운 normalize_web 이 로그 한 줄을 조각으로 나눈 뒤, 직접 쓰는 convert_time(1~3번)과 convert_result(4~6번)를 불러 공통 이벤트를 만듭니다. exercise1-2_run.py 가 세 단계로 출력합니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 1-2: normalize_web.py 안의 흐름</text>
<rect x="24" y="60" width="180" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="114" y="89.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">로그 한 줄</text>
<text x="114" y="109.9" font-size="14" text-anchor="middle" fill="#292929">access_sample.log</text>
<line x1="206" y1="95" x2="236" y2="95" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="240" y="60" width="230" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="355" y="89.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">normalize_web</text>
<text x="355" y="109.9" font-size="14" text-anchor="middle" fill="#666660">미리 채움 · 조각 꺼내기</text>
<line x1="310" y1="132" x2="200" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="400" y1="132" x2="510" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="24" y="164" width="330" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="189" y="196.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">convert_time (1 ~ 3번 직접)</text>
<text x="189" y="216.8" font-size="14" text-anchor="middle" fill="#292929">strptime → replace</text>
<text x="189" y="237.1" font-size="14" text-anchor="middle" fill="#292929">→ strftime</text>
<rect x="372" y="164" width="324" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="534" y="196.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">convert_result (4 ~ 6번 직접)</text>
<text x="534" y="216.8" font-size="14" text-anchor="middle" fill="#292929">status &gt;= 400 → "실패"</text>
<text x="534" y="237.1" font-size="14" text-anchor="middle" fill="#292929">그 밖에는 → "성공"</text>
<line x1="190" y1="262" x2="300" y2="290" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="534" y1="262" x2="420" y2="290" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="200" y="294" width="320" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="318.4" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">공통 이벤트 (키 7개)</text>
<line x1="360" y1="336" x2="360" y2="352" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="24" y="356" width="672" height="38" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="379.1" font-size="14" text-anchor="middle" fill="#292929">exercise1-2_run.py → 단계 1 수 · 첫 이벤트 / 단계 2 첫 실패 / 단계 3 성공 · 실패 수</text>
</g>
</svg>
