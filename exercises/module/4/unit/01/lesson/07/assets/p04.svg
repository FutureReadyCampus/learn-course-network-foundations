<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>응용 1-1 정답: 28개 중 정상 15 · 오류 5 · 의심 8, 규칙이 놓친 예와 자주 틀리는 곳</title>
<desc>막대는 요청 28개의 분류 결과입니다. 가운데는 규칙이 놓친 두 예이고, 아래는 확인 순서를 바꾸거나 int 를 빠뜨렸을 때 나오는 결과입니다.</desc>
<defs><marker id="a-m4u01l04-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l04-p03-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">응용 1-1 정답: 요청 28개</text>
<rect x="24" y="46" width="360" height="50" rx="0" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="204.0" y="76.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">정상 15</text>
<rect x="384" y="46" width="120" height="50" rx="0" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="444.0" y="76.2" font-size="15" fill="#9a6200" text-anchor="middle" font-weight="700">오류 5</text>
<rect x="504" y="46" width="192" height="50" rx="0" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="600.0" y="76.2" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">의심 8</text>
<text x="24" y="136" font-size="17" fill="#292929" font-weight="700">(나) 규칙이 놓친 예</text>
<rect x="24" y="150" width="324" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="186.0" y="184.2" font-size="15" fill="#292929" text-anchor="middle">401 다섯 번 뒤 POST /login 302</text>
<text x="186.0" y="205.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">→ 「정상」으로 분류</text>
<text x="186.0" y="226.2" font-size="15" fill="#292929" text-anchor="middle">연속 실패 뒤 성공일 수 있음</text>
<rect x="372" y="150" width="324" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="534.0" y="184.2" font-size="15" fill="#292929" text-anchor="middle">/.env · /wp-login.php ·</text>
<text x="534.0" y="205.2" font-size="15" fill="#9a6200" text-anchor="middle" font-weight="700">/phpmyadmin 404 → 「오류」</text>
<text x="534.0" y="226.2" font-size="15" fill="#292929" text-anchor="middle">같은 주소의 반복 탐색</text>
<text x="24" y="290" font-size="17" fill="#292929" font-weight="700">자주 틀리는 곳</text>
<rect x="24" y="304" width="324" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="186.0" y="343.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">is_error 를 먼저 확인</text>
<text x="186.0" y="364.8" font-size="15" fill="#9a6200" text-anchor="middle">→ 정상 15 · 오류 13 · 의심 0</text>
<rect x="372" y="304" width="324" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="534.0" y="343.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">int(…) 를 빠뜨림</text>
<text x="534.0" y="364.8" font-size="15" fill="#b32a17" text-anchor="middle">→ TypeError ('&gt;=' 비교)</text>
</g>
</svg>
