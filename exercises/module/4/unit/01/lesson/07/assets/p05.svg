<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>응용 1-2 정답: 판정 서버 15개와 SaaS 14개의 결과와 KeyError 가 나는 실수</title>
<desc>판정 서버 이벤트는 15개(성공 6, 실패 9), SaaS 이벤트는 14개(성공 13, 실패 1)입니다. ALLOWED_MAP 대신 RESULT_MAP 을 쓰면 KeyError: True, account_parts[1]을 쓰면 a-corp.example 이 나옵니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 1-2 정답</text>
<rect x="24" y="56" width="330" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="189" y="87.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">판정 서버 이벤트 15개</text>
<text x="189" y="109.1" font-size="15" text-anchor="middle" fill="#292929">성공 6 · 실패 9</text>
<text x="189" y="129.8" font-size="14" text-anchor="middle" fill="#666660">ALLOWED_MAP[allowed]</text>
<rect x="366" y="56" width="330" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="531" y="87.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SaaS 이벤트 14개</text>
<text x="531" y="109.1" font-size="15" text-anchor="middle" fill="#292929">성공 13 · 실패 1</text>
<text x="531" y="129.8" font-size="14" text-anchor="middle" fill="#666660">RESULT_MAP[outcome]</text>
<rect x="24" y="168" width="672" height="62" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="193.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">메일 주소에서 이름</text>
<text x="360" y="213.9" font-size="14" text-anchor="middle" fill="#292929">row["account"].split("@") → account_parts[0] → "seoyeon"</text>
<text x="24" y="262" font-size="16" text-anchor="start" fill="#292929" font-weight="700">자주 틀리는 곳</text>
<rect x="24" y="274" width="330" height="112" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="189" y="314.1" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">RESULT_MAP[allowed]</text>
<text x="189" y="334.8" font-size="14" text-anchor="middle" fill="#292929">→ KeyError: True</text>
<text x="189" y="355.1" font-size="14" text-anchor="middle" fill="#666660">두 딕셔너리는 키가 다름</text>
<rect x="366" y="274" width="330" height="112" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="531" y="314.1" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">account_parts[1]</text>
<text x="531" y="334.8" font-size="14" text-anchor="middle" fill="#292929">→ "a-corp.example"</text>
<text x="531" y="355.1" font-size="14" text-anchor="middle" fill="#666660">@ 앞이 이름입니다</text>
</g>
</svg>
