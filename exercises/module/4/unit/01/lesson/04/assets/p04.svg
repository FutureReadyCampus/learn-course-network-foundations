<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답 마무리: 위치와 git status 를 확인한 뒤 add · commit · push 한다</title>
<desc>윗줄은 cd .. · pwd · git status 로 위치와 올릴 파일을 확인하는 순서입니다. .env 나 .venv 가 없으면 아랫줄의 git add . · git commit · git push 를 칩니다.</desc>
<defs><marker id="a-m4u01l04-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l04-p04-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">정답 마무리</text>
<rect x="24" y="50" width="150" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="83.2" font-size="15" fill="#292929" text-anchor="middle">cd ..</text>
<line x1="174" y1="78" x2="194" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<rect x="198" y="50" width="150" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="273.0" y="83.2" font-size="15" fill="#292929" text-anchor="middle">pwd</text>
<line x1="348" y1="78" x2="368" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<rect x="372" y="50" width="150" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447.0" y="83.2" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<line x1="522" y1="78" x2="542" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<rect x="546" y="50" width="150" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="621.0" y="72.8" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">.env · .venv</text>
<text x="621.0" y="93.8" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">없음?</text>
<path d="M621,106 L621,136 L124,136 L124,166" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<text x="640" y="128" font-size="14" fill="#666660">없다</text>
<rect x="24" y="168" width="200" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="124.0" y="201.2" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<line x1="224" y1="196" x2="256" y2="196" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<rect x="260" y="168" width="200" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="201.2" font-size="15" fill="#292929" text-anchor="middle">git commit -m "…"</text>
<line x1="460" y1="196" x2="492" y2="196" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p04)"/>
<rect x="496" y="168" width="200" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596.0" y="201.2" font-size="15" fill="#292929" text-anchor="middle">git push</text>
<text x="24" y="268" font-size="15" fill="#b32a17">보이면: .gitignore 에 한 줄 적고 git status 를 다시 칩니다.</text>
</g>
</svg>
