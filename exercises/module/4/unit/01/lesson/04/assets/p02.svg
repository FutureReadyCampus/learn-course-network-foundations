<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>규칙으로 요청을 의심 · 오류 · 정상 세 갈래로 가른다</title>
<desc>상태 코드가 401 · 403 이거나 경로에 /admin 이 있으면 의심, 그 밖에 400 이상이면 오류, 나머지는 정상입니다. 이렇게 단순한 규칙은 놓치는 것도 많습니다.</desc>
<defs><marker id="a-m4u01l03-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l03-p02-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">가르는 기준 = 규칙(rule, 룰)</text>
<rect x="24" y="60" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="94.2" font-size="15" fill="#292929">상태 코드 401 · 403, 또는 경로에 /admin</text>
<line x1="464" y1="89" x2="514" y2="89" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p02)"/>
<rect x="520" y="60" width="176" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="608.0" y="94.2" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">의심</text>
<rect x="24" y="136" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="170.2" font-size="15" fill="#292929">그 밖에 상태 코드가 400 이상</text>
<line x1="464" y1="165" x2="514" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p02)"/>
<rect x="520" y="136" width="176" height="58" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="608.0" y="170.2" font-size="15" fill="#9a6200" text-anchor="middle" font-weight="700">오류</text>
<rect x="24" y="212" width="440" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="246.2" font-size="15" fill="#292929">나머지</text>
<line x1="464" y1="241" x2="514" y2="241" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p02)"/>
<rect x="520" y="212" width="176" height="58" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="608.0" y="246.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">정상</text>
<text x="24" y="312" font-size="15" fill="#666660">단순한 규칙은 놓치는 것도 많습니다. 무엇을 놓치는지 샘플 로그로 확인합니다.</text>
</g>
</svg>
