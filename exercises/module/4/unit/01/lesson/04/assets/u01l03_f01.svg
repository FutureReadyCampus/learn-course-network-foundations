<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>요청 한 개를 의심부터 확인하고, 아니면 오류, 둘 다 아니면 정상으로 나눈다</title>
<desc>읽은 요청 한 개를 먼저 is_suspicious 로 상태가 401·403 이거나 경로가 /admin 인지 묻고, 그렇다면 "의심"입니다. 아니면 is_error 로 400 이상인지 묻고, 그렇다면 "오류", 아니면 "정상"입니다.</desc>
<defs><marker id="a-f01-m4u01l03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#292929" text-anchor="middle">
<g fill="none" stroke="#666660" stroke-width="1.5">
<path d="M280 64V96" marker-end="url(#a-f01-m4u01l03)"/>
<path d="M280 150V196" marker-end="url(#a-f01-m4u01l03)"/>
<path d="M280 250V296" marker-end="url(#a-f01-m4u01l03)"/>
<path d="M480 125H556" marker-end="url(#a-f01-m4u01l03)"/>
<path d="M480 225H556" marker-end="url(#a-f01-m4u01l03)"/>
</g>
<rect x="80" y="20" width="400" height="44" rx="8" fill="#f1f1ef" stroke="#dededb"/>
<text x="280" y="47">읽은 요청 한 개 (주소 · 방법 · 경로 · 상태)</text>
<rect x="80" y="100" width="400" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200"/>
<text x="280" y="130"><tspan font-weight="700">is_suspicious</tspan>: 401 · 403 이거나 /admin 인가?</text>
<rect x="80" y="200" width="400" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200"/>
<text x="280" y="230"><tspan font-weight="700">is_error</tspan>: 400 이상인가?</text>
<g font-size="14" fill="#666660"><text x="518" y="116">그렇다</text><text x="518" y="216">그렇다</text>
<text x="292" y="178" text-anchor="start">아니다</text><text x="292" y="278" text-anchor="start">아니다</text></g>
<rect x="560" y="103" width="120" height="44" rx="22" fill="#f8e8e3" stroke="#e0442e"/><text x="620" y="130" font-weight="700">"의심"</text>
<rect x="560" y="203" width="120" height="44" rx="22" fill="#fbf0dc" stroke="#9a6200"/><text x="620" y="230" font-weight="700">"오류"</text>
<rect x="220" y="300" width="120" height="44" rx="22" fill="#e4f3ea" stroke="#1f7a4a"/><text x="280" y="327" font-weight="700">"정상"</text>
</g>
</svg>
