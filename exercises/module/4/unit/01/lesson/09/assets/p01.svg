<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>20분을 고르기 5분, 쓰기 10분, 점검·올리기 5분으로 나누고 글감 하나를 골라 세 문장 글을 쓴다</title>
<desc>글쓰기 20분의 시간 배분 막대입니다. 쓰기 10분에는 post-short 글 틀로 세 문장을 씁니다. 아래에는 실습 1-1 · 1-2 글감 네 가지와, 응용 1-1 ~ 1-3을 했을 때 고를 수 있는 선택 글감 세 가지가 있습니다.</desc>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="18" font-weight="700" fill="#292929">Unit 1 글쓰기 20분 · 세 문장 글</text>
<rect x="24" y="52" width="168" height="56" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="108.0" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">고르기</text>
<text x="108.0" y="98" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<rect x="192" y="52" width="336" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="360.0" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">쓰기</text>
<text x="360.0" y="98" font-size="14" fill="#292929" text-anchor="middle">10분 · post-short 로 세 문장</text>
<rect x="528" y="52" width="168" height="56" rx="6" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="612.0" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">점검 · 올리기</text>
<text x="612.0" y="98" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<text x="24" y="146" font-size="16" font-weight="700" fill="#292929">글감 하나 고르기 (실습 1-1 · 1-2)</text>
<rect x="24" y="160" width="159" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="38" y="186" font-size="15" font-weight="700" fill="#b32a17">1. 한 줄로 알기</text>
<text x="38" y="210" font-size="14" fill="#292929">알 수 있는 것과</text>
<text x="38" y="230" font-size="14" fill="#292929">알 수 없는 것</text>
<text x="38" y="252" font-size="14" fill="#666660">실습 1-1</text>
<rect x="195" y="160" width="159" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="209" y="186" font-size="15" font-weight="700" fill="#b32a17">2. 404 두 경우</text>
<text x="209" y="210" font-size="14" fill="#292929">404 한 번과</text>
<text x="209" y="230" font-size="14" fill="#292929">연달아 난 404</text>
<text x="209" y="252" font-size="14" fill="#666660">실습 1-1</text>
<rect x="366" y="160" width="159" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="380" y="186" font-size="15" font-weight="700" fill="#b32a17">3. 시각 정렬</text>
<text x="380" y="210" font-size="14" fill="#292929">12월과 11월 중</text>
<text x="380" y="230" font-size="14" fill="#292929">무엇이 앞에 올까</text>
<text x="380" y="252" font-size="14" fill="#666660">실습 1-2</text>
<rect x="537" y="160" width="159" height="104" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="551" y="186" font-size="15" font-weight="700" fill="#b32a17">4. raw</text>
<text x="551" y="210" font-size="14" fill="#292929">원래 로그 줄을</text>
<text x="551" y="230" font-size="14" fill="#292929">남겨 둔 이유</text>
<text x="551" y="252" font-size="14" fill="#666660">실습 1-2</text>
<rect x="24" y="282" width="672" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-dasharray="6 4"/>
<text x="40" y="307" font-size="15" font-weight="700" fill="#9a6200">선택 글감 · 응용을 했다면</text>
<text x="40" y="331" font-size="14" fill="#292929">규칙이 놓친 요청 · None 대신 0.0.0.0 이면 · 세 로그를 합친 뒤 gaeun 의 순서</text>
<text x="24" y="378" font-size="15" fill="#666660">세 문장이면 충분합니다. 긴 글(post-practice)은 응용입니다. 보고서 답에서 고르면 쉽습니다.</text>
</g>
</svg>
