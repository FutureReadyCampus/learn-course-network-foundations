<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>막히면 고른 글감에 맞는 로그 줄이나 출력을 붙이고 그 뜻을 쓴다</title>
<desc>글감 1은 203.0.113.50 의 401 줄을, 글감 2는 404 한 줄과 198.51.100.90 의 세 줄을, 글감 3은 비교 코드의 True · False 출력을, 글감 4는 실패 이벤트의 result 와 raw 를 붙입니다. 막힌 이야기는 post-stuck.md 에 쓰고, AI 도우미 프롬프트는 Module 3 Unit 1 시작하기 레슨에 있습니다.</desc>
<defs><marker id="a-m4u01l09-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="30" font-size="16" font-weight="700" fill="#292929">고른 글감</text>
<text x="250" y="30" font-size="16" font-weight="700" fill="#292929">글에 붙일 것</text>
<rect x="30" y="44" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="67" font-size="15" font-weight="700" fill="#292929">1. 한 줄로 알기</text>
<text x="44" y="89" font-size="14" fill="#292929">실습 1-1</text>
<line x1="214" y1="72" x2="244" y2="72" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l09-p03)"/>
<rect x="250" y="44" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="67" font-size="14" fill="#292929">203.0.113.50 의 POST /login 401 줄 하나</text>
<text x="264" y="89" font-size="14" fill="#292929">+ 알 수 있는 것 · 알 수 없는 것 두 줄 목록</text>
<rect x="30" y="108" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="131" font-size="15" font-weight="700" fill="#292929">2. 404 두 경우</text>
<text x="44" y="153" font-size="14" fill="#292929">실습 1-1</text>
<line x1="214" y1="136" x2="244" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l09-p03)"/>
<rect x="250" y="108" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="131" font-size="14" fill="#292929">198.51.100.21 의 GET /board/99 한 줄</text>
<text x="264" y="153" font-size="14" fill="#292929">+ 198.51.100.90 세 줄 · 1초 간격 · curl</text>
<rect x="30" y="172" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="195" font-size="15" font-weight="700" fill="#292929">3. 시각 정렬</text>
<text x="44" y="217" font-size="14" fill="#292929">실습 1-2 정답</text>
<line x1="214" y1="200" x2="244" y2="200" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l09-p03)"/>
<rect x="250" y="172" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="195" font-size="14" fill="#292929">비교 코드 여섯 줄의 True · False 출력</text>
<text x="264" y="217" font-size="14" fill="#292929">+ 문자열은 앞 글자부터 비교된다는 한 문장</text>
<rect x="30" y="236" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="259" font-size="15" font-weight="700" fill="#292929">4. raw</text>
<text x="44" y="281" font-size="14" fill="#292929">실습 1-2 단계 2</text>
<line x1="214" y1="264" x2="244" y2="264" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l09-p03)"/>
<rect x="250" y="236" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="259" font-size="14" fill="#292929">실패 이벤트: 'result': '실패' 와 raw 의 401</text>
<text x="264" y="281" font-size="14" fill="#292929">401 이 500 이어도 result 는 같았을 것</text>
<rect x="30" y="304" width="660" height="40" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="44" y="329" font-size="15" fill="#292929">막힌 이야기: post-stuck.md 「증상」에 오류를 그대로 (예: IndentationError)</text>
<rect x="30" y="356" width="400" height="56" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="44" y="380" font-size="14" fill="#292929">그래도 막히면 AI 도우미 프롬프트 세 가지</text>
<text x="44" y="402" font-size="14" fill="#666660">Module 3 Unit 1 시작하기 「쓰기 질문과 AI 도우미」</text>
<rect x="446" y="356" width="244" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="460" y="380" font-size="14" font-weight="700" fill="#b32a17">붙여 넣기 전에</text>
<text x="460" y="402" font-size="14" fill="#292929">비밀키 · 토큰 · 개인정보 빼기</text>
</g>
</svg>
