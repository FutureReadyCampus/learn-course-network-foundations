<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>anomaly_detection 폴더에 Unit 6 파일이 있고 세 import가 오류 없이 되는지 확인한다</title><desc>security-agent-toolkit 안의 anomaly_detection 폴더로 들어가 pwd와 ls로 위치와 Unit 6 파일을 확인합니다. 새 파일은 New File 로 만들어 페이지의 내용을 붙여 넣는 방법을 익히고, python -c로 Unit 6 함수 세 묶음을 불러 봅니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">폴더 열고 Unit 6 파일 확인하기</text><rect x="20" y="52" width="340" height="330" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="36" y="80" font-size="16" text-anchor="start" fill="#292929" font-weight="700">security-agent-toolkit/</text><text x="52" y="110" font-size="16" text-anchor="start" fill="#292929" font-weight="700">anomaly_detection/</text><text x="72" y="142" font-size="15" text-anchor="start" fill="#292929">normalized_events.json</text><text x="72" y="174" font-size="15" text-anchor="start" fill="#292929">rbac.py · config/</text><text x="72" y="206" font-size="15" text-anchor="start" fill="#292929">access_detection.py</text><text x="72" y="238" font-size="15" text-anchor="start" fill="#292929">saas_detection.py</text><text x="72" y="270" font-size="15" text-anchor="start" fill="#292929">malicious_detection.py</text><text x="72" y="302" font-size="15" text-anchor="start" fill="#9a6200" font-weight="700">correlation.py (실습 7-1에서)</text><text x="72" y="334" font-size="15" text-anchor="start" fill="#9a6200" font-weight="700">report_u7.md (보고서 쓰기에서)</text><text x="36" y="370" font-size="14" text-anchor="start" fill="#666660">주황색 파일은 뒤 레슨에서 복사해 만든다</text><rect x="390" y="52" width="310" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="545" y="82.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">① 위치 확인</text><text x="545" y="103.2" font-size="15" text-anchor="middle" fill="#666660">cd anomaly_detection</text><text x="545" y="124.2" font-size="15" text-anchor="middle" fill="#666660">pwd · ls</text><rect x="390" y="166" width="310" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="545" y="196.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">② 새 파일 만드는 법</text><text x="545" y="217.2" font-size="15" text-anchor="middle" fill="#666660">New File · 이름 그대로 입력</text><text x="545" y="238.2" font-size="15" text-anchor="middle" fill="#666660">복사해 붙여 넣고 저장</text><rect x="390" y="280" width="310" height="102" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="545" y="316.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ python -c "from … import …"</text><text x="545" y="335.9" font-size="14" text-anchor="middle" fill="#666660">access · saas · malicious</text><text x="545" y="355.5" font-size="14" text-anchor="middle" fill="#666660">세 줄 모두 오류 없음</text><line x1="545" y1="146" x2="545" y2="162" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="545" y1="260" x2="545" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/></svg>
