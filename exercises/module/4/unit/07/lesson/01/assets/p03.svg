<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>오류가 나면 위치와 파일 이름을 먼저 보고, 메시지에 맞게 고친다</title><desc>먼저 pwd와 ls로 위치와 파일 이름을 확인합니다. pandas가 없다고 나오면 가상환경을 활성화하고, Unit 6 파일을 못 찾으면 표의 방법으로 파일을 만들며, 그래도 막히면 AI에게 묻거나 정답을 봅니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text><rect x="20" y="50" width="680" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360" y="78.2" font-size="15" text-anchor="middle" fill="#292929">먼저: pwd 가 anomaly_detection 으로 끝나나 · ls 의 파일 이름이 같은가</text><rect x="20" y="116" width="220" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="130" y="146.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">No module named 'pandas'</text><rect x="262" y="116" width="200" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362" y="146.9" font-size="14" text-anchor="middle" fill="#292929">가상환경이 꺼진 터미널</text><rect x="484" y="116" width="216" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592" y="146.9" font-size="14" text-anchor="middle" fill="#292929">활성화 후 pip install pandas</text><line x1="242" y1="142" x2="258" y2="142" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><line x1="464" y1="142" x2="480" y2="142" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="182" width="220" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="130" y="212.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">ImportError · No module…</text><rect x="262" y="182" width="200" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362" y="212.9" font-size="14" text-anchor="middle" fill="#292929">Unit 6 파일 없음 · 이름 다름</text><rect x="484" y="182" width="216" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592" y="212.9" font-size="14" text-anchor="middle" fill="#292929">부록 완성본으로 만들기</text><line x1="242" y1="208" x2="258" y2="208" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><line x1="464" y1="208" x2="480" y2="208" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="248" width="220" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="130" y="278.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">그 밖의 오류</text><rect x="262" y="248" width="200" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="362" y="278.9" font-size="14" text-anchor="middle" fill="#292929">오류 전체 + 친 명령</text><rect x="484" y="248" width="216" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="592" y="278.9" font-size="14" text-anchor="middle" fill="#292929">AI 에게 묻기 · 정답 보기</text><line x1="242" y1="274" x2="258" y2="274" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><line x1="464" y1="274" x2="480" y2="274" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><text x="20" y="340" font-size="15" text-anchor="start" fill="#666660">실행은 VS Code 의 ▶ 단추가 아니라 터미널에서 한다</text></svg>
