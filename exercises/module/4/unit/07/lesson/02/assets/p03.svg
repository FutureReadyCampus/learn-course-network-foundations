<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>map으로 IP를 사용자로 바꾸고 concat으로 잇고 sort_values로 사용자·시각 순 정렬한다</title><desc>1.1의 판다스 문법 세 가지를 나란히 보여 줍니다. map은 딕셔너리에 없는 IP를 NaN으로 만들고, concat은 표를 위아래로 이어 붙이며, sort_values는 user 순 다음 time 순으로 정렬합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">1.1 사용자 채우고 · 표 잇고 · 정렬하기</text><rect x="20" y="52" width="216" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="128" y="81.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">열.map(딕셔너리)</text><rect x="20" y="112" width="216" height="234" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="128" y="181.8" font-size="15" text-anchor="middle" fill="#292929">203.0.113.80</text><text x="128" y="202.8" font-size="15" text-anchor="middle" fill="#292929">→ seoyeon</text><text x="128" y="223.8" font-size="15" text-anchor="middle" fill="#292929">198.51.100.77</text><text x="128" y="244.8" font-size="15" text-anchor="middle" fill="#292929">→ gaeun</text><text x="128" y="265.8" font-size="15" text-anchor="middle" fill="#292929">192.0.2.15</text><text x="128" y="286.8" font-size="15" text-anchor="middle" fill="#292929">→ NaN (제외)</text><rect x="252" y="52" width="216" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360" y="81.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">pd.concat([표1, 표2])</text><rect x="252" y="112" width="216" height="234" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="360" y="181.8" font-size="15" text-anchor="middle" fill="#292929">판정 서버 표 2행</text><text x="360" y="202.8" font-size="15" text-anchor="middle" fill="#292929">+</text><text x="360" y="223.8" font-size="15" text-anchor="middle" fill="#292929">SaaS 표 1행</text><text x="360" y="244.8" font-size="15" text-anchor="middle" fill="#292929">=</text><text x="360" y="265.8" font-size="15" text-anchor="middle" fill="#292929">3행 표 하나</text><text x="360" y="286.8" font-size="15" text-anchor="middle" fill="#292929">(번호 0 이 두 번)</text><rect x="484" y="52" width="216" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="592" y="81.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">sort_values([열1, 열2])</text><rect x="484" y="112" width="216" height="234" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="592" y="181.8" font-size="15" text-anchor="middle" fill="#292929">gaeun 10:05</text><text x="592" y="202.8" font-size="15" text-anchor="middle" fill="#292929">gaeun 10:14</text><text x="592" y="223.8" font-size="15" text-anchor="middle" fill="#292929">seoyeon 09:05</text><text x="592" y="244.8" font-size="15" text-anchor="middle" fill="#292929">seoyeon 17:38</text><text x="592" y="265.8" font-size="15" text-anchor="middle" fill="#292929">user 순 먼저,</text><text x="592" y="286.8" font-size="15" text-anchor="middle" fill="#292929">같으면 time 순</text><text x="20" y="380" font-size="15" text-anchor="start" fill="#666660">딕셔너리에 IP 가 없으면 사용자를 알 수 없어 이번 연결에서 제외한다</text></svg>
