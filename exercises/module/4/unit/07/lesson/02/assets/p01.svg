<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>따로 나온 세 탐지 결과를 같은 사용자의 짧은 시간 안 사건으로 연결한다</title><desc>서버·SaaS·웹 탐지 결과에 같은 사용자가 나오면 하나의 사건일 수 있습니다. 웹 로그에는 IP만 있어 SaaS 로그인에서 사용자를 찾고, 짧은 시간 안에 모인 것만 연결합니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">목표: 결과 목록 세 개 → 한 사용자의 사건</text><rect x="20" y="56" width="200" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="120" y="87.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">서버 결과 · user</text><line x1="222" y1="82" x2="286" y2="110" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="122" width="200" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="120" y="153.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SaaS 결과 · user</text><line x1="222" y1="148" x2="286" y2="138" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="188" width="200" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="120" y="219.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 결과 · IP 만</text><line x1="222" y1="214" x2="286" y2="166" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="290" y="82" width="190" height="112" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="385" y="132.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">같은 사용자?</text><text x="385" y="153.8" font-size="15" text-anchor="middle" fill="#292929">짧은 시간 안?</text><line x1="482" y1="138" x2="516" y2="138" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="520" y="82" width="180" height="112" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="610" y="132.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">하나의 사건</text><text x="610" y="153.8" font-size="15" text-anchor="middle" fill="#292929">으로 연결</text><rect x="20" y="262" width="680" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360" y="295.2" font-size="15" text-anchor="middle" fill="#292929">웹 IP → SaaS 성공 로그인에서 사용자 찾기 · 아침과 저녁처럼 먼 기록은 잇지 않기</text></svg>
