<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>웹 실패 13건을 IP별로 보면 스캐너 경로를 요청한 IP는 198.51.100.90 하나다</title><desc>IP 다섯 개의 실패한 요청을 SCANNER_PATTERN과 비교한 표입니다. 셋 중 하나가 들어 있으면 str.contains가 True를 주고, 198.51.100.90만 스캔으로 남습니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">IP별 실패 요청과 str.contains 결과</text><rect x="20" y="50" width="680" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="77.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SCANNER_PATTERN = "/.env|/wp-login|/phpmyadmin"   ( | 는 「또는」 )</text><text x="30" y="122" font-size="15" text-anchor="start" fill="#666660" font-weight="700">IP</text><text x="180" y="122" font-size="15" text-anchor="start" fill="#666660" font-weight="700">실패한 요청</text><text x="690" y="122" font-size="15" text-anchor="end" fill="#666660" font-weight="700">결과</text><rect x="20" y="134" width="680" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="30" y="160" font-size="15" text-anchor="start" fill="#292929" font-weight="700">198.51.100.21</text><text x="180" y="160" font-size="15" text-anchor="start" fill="#292929">GET /board/99</text><text x="690" y="160" font-size="15" text-anchor="end" fill="#292929">False · 제외</text><rect x="20" y="184" width="680" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="30" y="210" font-size="15" text-anchor="start" fill="#292929" font-weight="700">198.51.100.34</text><text x="180" y="210" font-size="15" text-anchor="start" fill="#292929">GET /report</text><text x="690" y="210" font-size="15" text-anchor="end" fill="#292929">False · 제외</text><rect x="20" y="234" width="680" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="30" y="260" font-size="15" text-anchor="start" fill="#292929" font-weight="700">198.51.100.77</text><text x="180" y="260" font-size="15" text-anchor="start" fill="#292929">GET /admin</text><text x="690" y="260" font-size="15" text-anchor="end" fill="#292929">False · 제외</text><rect x="20" y="284" width="680" height="42" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="30" y="310" font-size="15" text-anchor="start" fill="#292929" font-weight="700">198.51.100.90</text><text x="180" y="310" font-size="15" text-anchor="start" fill="#292929">/.env · /wp-login.php · /phpmyadmin</text><text x="690" y="310" font-size="15" text-anchor="end" fill="#292929" font-weight="700">True · 스캔</text><rect x="20" y="334" width="680" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="30" y="360" font-size="15" text-anchor="start" fill="#292929" font-weight="700">203.0.113.50</text><text x="180" y="360" font-size="15" text-anchor="start" fill="#292929">POST /login 5번 · /admin · /admin/users</text><text x="690" y="360" font-size="15" text-anchor="end" fill="#292929">False · 제외</text><text x="20" y="406" font-size="15" text-anchor="start" fill="#666660">203.0.113.50 은 실패 7번이지만 스캐너 경로가 없어 로그인 실패 규칙에서 따로 본다</text></svg>
