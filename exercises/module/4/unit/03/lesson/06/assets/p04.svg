<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>malicious_detection.py의 두 함수로 스캔 IP와 이유를 만들고 단계 1~4를 출력한다</title><desc>이벤트 파일을 읽어 웹 실패만 고른 뒤 find_scan_ips(1~4번)와 explain_scan(5·6번)을 거칩니다. apply3-3_run.py는 단계 1~4를 출력하고 advanced_detection.py는 이번 Unit 의 탐지 3개를 한 번에 돌립니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 3-3: 입력 → 직접 쓰는 두 함수 → 출력</text><rect x="20" y="56" width="155" height="84" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="97.5" y="93.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">normalized</text><text x="97.5" y="112.7" font-size="14" text-anchor="middle" fill="#292929">_events.json</text><rect x="195" y="56" width="155" height="84" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="272.5" y="93.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">load_events</text><text x="272.5" y="112.7" font-size="14" text-anchor="middle" fill="#292929">pick_web_failures</text><line x1="178" y1="98" x2="191" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="370" y="56" width="155" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="447.5" y="93.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">find_scan_ips</text><text x="447.5" y="112.7" font-size="14" text-anchor="middle" fill="#292929">직접 쓰기 1~4번</text><line x1="353" y1="98" x2="366" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="545" y="56" width="155" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="622.5" y="93.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">explain_scan</text><text x="622.5" y="112.7" font-size="14" text-anchor="middle" fill="#292929">직접 쓰기 5·6번</text><line x1="528" y1="98" x2="541" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><rect x="20" y="176" width="330" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="32" y="214.2" font-size="15" text-anchor="start" fill="#292929" font-weight="700">apply3-3_run.py 출력</text><text x="32" y="235.2" font-size="15" text-anchor="start" fill="#666660">단계 1: 웹 실패 수</text><text x="32" y="256.2" font-size="15" text-anchor="start" fill="#666660">단계 2: 스캐너 경로 IP와 횟수</text><text x="32" y="277.2" font-size="15" text-anchor="start" fill="#666660">단계 3: 스캔으로 본 IP와 이유</text><text x="32" y="298.2" font-size="15" text-anchor="start" fill="#666660">단계 4: 제외한 IP</text><rect x="370" y="176" width="330" height="150" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="382" y="214.2" font-size="15" text-anchor="start" fill="#292929" font-weight="700">advanced_detection.py</text><text x="382" y="235.2" font-size="15" text-anchor="start" fill="#666660">실습 3-2 · 응용 3-2 · 3-3 함수를</text><text x="382" y="256.2" font-size="15" text-anchor="start" fill="#666660">모두 불러 한 번에 실행</text><text x="382" y="277.2" font-size="15" text-anchor="start" fill="#666660">출력 3줄</text><text x="382" y="298.2" font-size="15" text-anchor="start" fill="#666660">(판정 서버 · SaaS · 웹 서버)</text><line x1="360" y1="142" x2="185" y2="172" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="360" y1="142" x2="535" y2="172" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><text x="20" y="360" font-size="15" text-anchor="start" fill="#666660">실행 전 확인: pwd 결과가 anomaly_detection 으로 끝나는지</text></svg>
