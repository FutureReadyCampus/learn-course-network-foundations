<text x="125" y="177.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">traffic_detection.py</text>
<text x="125" y="196.7" font-size="14" fill="#292929" text-anchor="middle">급증한 분</text>
<rect x="255" y="60" width="210" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="87.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">make_login_alerts</text>
<text x="360" y="106.7" font-size="14" fill="#292929" text-anchor="middle">단계 1: 1건</text>
<rect x="255" y="150" width="210" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="177.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">make_traffic_alerts</text>
<text x="360" y="196.7" font-size="14" fill="#292929" text-anchor="middle">str(minute) · 단계 2: 1건</text>
<line x1="220" y1="92" x2="253" y2="92" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="220" y1="182" x2="253" y2="182" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="500" y="100" width="190" height="74" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="595" y="132.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">리스트 이어 붙이기</text>
<text x="595" y="151.7" font-size="14" fill="#292929" text-anchor="middle">login + traffic</text>
<line x1="465" y1="92" x2="498" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="465" y1="182" x2="498" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="500" y="240" width="190" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="595" y="267.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">save_alerts</text>
<text x="595" y="286.7" font-size="14" fill="#292929" text-anchor="middle">json.dump</text>
<line x1="595" y1="174" x2="595" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="255" y="240" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="267.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">alerts.json</text>
<text x="360" y="286.7" font-size="14" fill="#292929" text-anchor="middle">단계 3: 2건 저장</text>
<line x1="500" y1="272" x2="467" y2="272" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
