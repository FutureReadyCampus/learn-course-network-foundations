<rect x="30" y="280" width="320" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="190" y="319.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림 있음 ≠ 공격 확정</text>
<text x="190" y="340.2" font-size="15" fill="#292929" text-anchor="middle">먼저 살펴볼 곳일 뿐</text>
<text x="190" y="361.2" font-size="15" fill="#292929" text-anchor="middle">status 는 모두 「확인 필요」</text>
<rect x="370" y="280" width="320" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="530" y="319.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림 없음 ≠ 안전</text>
<text x="530" y="340.2" font-size="15" fill="#292929" text-anchor="middle">규칙에 해당하지 않았다는</text>
<text x="530" y="361.2" font-size="15" fill="#292929" text-anchor="middle">뜻일 뿐</text>
