<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>알림 한 건은 키 다섯 개의 딕셔너리이고 알림 있음과 없음 모두 판단에 주의한다</title>
<desc>알림 한 건은 type, target, count, note, status 키를 가진 딕셔너리다. 처리 상태는 확인 필요에서 조사 중, 조사 완료로 바뀐다. 알림이 있어도 공격 확정이 아니고, 알림이 없어도 안전하다는 뜻이 아니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">알림 한 건 = 키 다섯 개짜리 딕셔너리</text>
