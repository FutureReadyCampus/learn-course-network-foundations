<text x="630" y="99.9" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">확인 필요</text>
<rect x="575" y="139" width="110" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="630" y="163.9" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">조사 중</text>
<line x1="630" y1="115" x2="630" y2="137" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
