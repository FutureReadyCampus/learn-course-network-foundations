<text x="230" y="139.9" font-size="14" fill="#292929" text-anchor="middle">203.0.113.50</text>
<rect x="330" y="118" width="220" height="34" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="440" y="139.9" font-size="14" fill="#292929" text-anchor="middle">2026-11-02 09:12:00</text>
