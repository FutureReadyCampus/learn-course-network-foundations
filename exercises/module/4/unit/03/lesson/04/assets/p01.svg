<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>형식이 다른 로그인 실패 결과와 트래픽 급증 결과를 alerts.json 한 파일로 모은다</title>
<desc>로그인 실패 결과(203.0.113.50 이 5번)와 트래픽 급증 결과(09:12 에 9개)는 모양이 다르다. alerts.py 가 두 결과를 같은 모양의 알림으로 바꿔 alerts.json 에 모은다. 처리 상태는 모두 확인 필요다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰 · 형식이 다른 두 결과를 한 파일로</text>
<rect x="30" y="65" width="230" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="145" y="99.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">로그인 실패 결과</text>
<text x="145" y="120.8" font-size="15" fill="#292929" text-anchor="middle">203.0.113.50 · 5번</text>
<rect x="30" y="185" width="230" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="145" y="219.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">트래픽 급증 결과</text>
<text x="145" y="240.8" font-size="15" fill="#292929" text-anchor="middle">09:12 · 요청 9개</text>
<rect x="300" y="115" width="150" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="149.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">alerts.py</text>
<text x="375" y="170.2" font-size="15" fill="#292929" text-anchor="middle">같은 모양으로</text>
<text x="375" y="191.2" font-size="15" fill="#292929" text-anchor="middle">바꾸기</text>
<rect x="490" y="70" width="200" height="190" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590" y="128.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">alerts.json</text>
<text x="590" y="149.2" font-size="15" fill="#292929" text-anchor="middle">알림 2건</text>
<text x="590" y="170.2" font-size="15" fill="#292929" text-anchor="middle">종류 · 대상</text>
<text x="590" y="191.2" font-size="15" fill="#292929" text-anchor="middle">횟수 · 메모</text>
<text x="590" y="212.2" font-size="15" fill="#292929" text-anchor="middle">상태: 확인 필요</text>
<line x1="260" y1="105" x2="298" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="260" y1="225" x2="298" y2="185" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="450" y1="165" x2="488" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="30" y="305" font-size="15" fill="#666660">공격으로 확정된 것이 아니므로 처리 상태는 모두 「확인 필요」입니다.</text>
</g>
</svg>
