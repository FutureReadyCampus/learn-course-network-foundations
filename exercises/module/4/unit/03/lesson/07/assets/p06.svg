<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>도전 3-3 정답: 웹 실패 13개 중 198.51.100.90만 스캐너 경로를 3번 요청했다</title><desc>웹 실패 13개에서 스캐너 경로를 요청한 IP는 198.51.100.90 하나이고 이유는 스캐너 경로를 3번 요청입니다. 나머지 IP 4개는 스캐너 경로가 없어 제외됩니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">도전 3-3 정답: 13개 → 스캔 IP 1개 · 제외 4개</text><rect x="20" y="100" width="150" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="95" y="139.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 실패</text><text x="95" y="160.8" font-size="15" text-anchor="middle" fill="#292929">13개</text><rect x="220" y="54" width="480" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="460" y="86.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">스캔: 198.51.100.90</text><text x="460" y="107.8" font-size="15" text-anchor="middle" fill="#666660">{'reason': '스캐너 경로를 3번 요청'}</text><rect x="220" y="150" width="480" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="460" y="182.8" font-size="15" text-anchor="middle" fill="#292929">제외: 203.0.113.50 · 198.51.100.21</text><text x="460" y="203.8" font-size="15" text-anchor="middle" fill="#292929">198.51.100.34 · 198.51.100.77</text><line x1="172" y1="135" x2="216" y2="92" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><line x1="172" y1="155" x2="216" y2="188" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/><text x="20" y="266" font-size="16" text-anchor="start" fill="#292929" font-weight="700">자주 틀리는 곳</text><text x="20" y="296" font-size="15" text-anchor="start" fill="#292929">.str 을 빼고 actions.contains(…) → AttributeError</text><text x="20" y="326" font-size="15" text-anchor="start" fill="#292929">web_failures["ip"] 로 세면 → 모든 IP 가 스캔, 203.0.113.50 이 7번</text><text x="20" y="360" font-size="15" text-anchor="start" fill="#666660">한계: /backup.zip 처럼 목록에 없는 경로는 놓친다</text></svg>
