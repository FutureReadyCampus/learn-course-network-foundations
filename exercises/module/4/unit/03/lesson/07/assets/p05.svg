<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>응용 3-2 정답: 세 규칙에 해당한 사용자는 jiwoo와 seoyeon이다</title><desc>업무 시간 밖 로그인은 jiwoo, 평소와 다른 IP는 jiwoo와 seoyeon, 대량 다운로드는 seoyeon입니다. jiwoo의 02:14 로그인은 실패라서 도용을 확정할 수 없습니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 3-2 정답: 규칙별로 해당한 사용자</text><rect x="20" y="56" width="260" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="150" y="86.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">업무 시간 밖 로그인</text><rect x="320" y="56" width="380" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="510" y="86.2" font-size="15" text-anchor="middle" fill="#292929">jiwoo (02:14 · 실패)</text><line x1="282" y1="81" x2="316" y2="81" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="120" width="260" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="150" y="150.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">평소와 다른 IP</text><rect x="320" y="120" width="380" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="510" y="150.2" font-size="15" text-anchor="middle" fill="#292929">jiwoo · seoyeon</text><line x1="282" y1="145" x2="316" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="184" width="260" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="150" y="214.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">파일 5번 이상 내려받음</text><rect x="320" y="184" width="380" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="510" y="214.2" font-size="15" text-anchor="middle" fill="#292929">seoyeon</text><line x1="282" y1="209" x2="316" y2="209" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/><rect x="20" y="254" width="680" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360" y="284.2" font-size="15" text-anchor="middle" fill="#292929">jiwoo: 도용 확정 불가 — 다른 IP 시도는 실패, 16:02 평소 IP로 성공</text><text x="20" y="336" font-size="15" text-anchor="start" fill="#292929">자주 틀리는 곳: not is_business_hour → ValueError, 열에는 ~ 를 쓴다</text><text x="20" y="364" font-size="15" text-anchor="start" fill="#292929">ip == usual_ip 로 쓰면 → 단계 2에 junho 가 두 번 나온다</text></svg>
