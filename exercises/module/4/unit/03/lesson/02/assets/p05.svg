<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img">
<title>실습 3-1 정리: 초를 버려 분으로, 웹만, 급증 기준, 기준 이상인 분</title>
<desc>times.dt.floor("min") 으로 minute 열을 만들고, source 가 web 인 행만 고릅니다. 급증 기준은 평균 2.0 × 3 = 6.0이고, is_spike 로 기준 이상인 분만 spike_minutes 에 남깁니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 3-1 정리</text>
<rect x="20" y="60" width="150" height="160" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="95.0" y="116" font-size="14" text-anchor="middle" fill="#292929"><tspan x="95.0" dy="0" font-weight="700">초를 버려 분으로</tspan><tspan x="95.0" dy="19">times.dt</tspan><tspan x="95.0" dy="19">.floor("min")</tspan><tspan x="95.0" dy="19">→ minute 열</tspan></text>
<rect x="196" y="60" width="150" height="160" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="271.0" y="126" font-size="14" text-anchor="middle" fill="#292929"><tspan x="271.0" dy="0" font-weight="700">웹 서버만</tspan><tspan x="271.0" dy="19">source == "web"</tspan><tspan x="271.0" dy="19">→ web_events</tspan></text>
<rect x="372" y="60" width="150" height="160" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="447.0" y="116" font-size="14" text-anchor="middle" fill="#292929"><tspan x="447.0" dy="0" font-weight="700">급증 기준</tspan><tspan x="447.0" dy="19">average</tspan><tspan x="447.0" dy="19">* multiple</tspan><tspan x="447.0" dy="19">2.0 × 3 = 6.0</tspan></text>
<rect x="548" y="60" width="150" height="160" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="623.0" y="126" font-size="14" text-anchor="middle" fill="#292929"><tspan x="623.0" dy="0" font-weight="700">기준 이상인 분</tspan><tspan x="623.0" dy="19">is_spike</tspan><tspan x="623.0" dy="19">→ spike_minutes</tspan></text>
<polyline points="173,140.0 192,140.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<polyline points="349,140.0 368,140.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<polyline points="525,140.0 544,140.0" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="20" y="262" font-size="14" text-anchor="start" fill="#666660">분마다 세는 groupby("minute").size() 줄은 미리 채움</text>
<text x="20" y="288" font-size="14" text-anchor="start" fill="#666660">실습 2-3의 pick_alert_ips 와 같은 모양으로 기준 이상만 남긴다</text>
</g>
</svg>
