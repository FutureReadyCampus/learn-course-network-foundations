<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img">
<title>실습 3-2 보고서는 출력, dami 와 gaeun 의 판정, seoyeon 이 빠진 이유, 마무리를 채운다</title>
<desc>실습 3-2 보고서의 칸이다. (가)는 출력과 서버 실패 수, 먼저 확인할 이벤트 수, 1순위 사용자를 쓴다. (나)와 (다)는 핵심 질문이고, 마무리 (가)는 git status 에서 .env 나 .venv 를 봤는지 쓴다.</desc>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 3-2 보고서 · 채울 칸</text>
<rect x="30" y="52" width="90" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="135" y="52" width="555" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="77.1" font-size="14" fill="#292929">① 출력 전체 ② 서버 실패 수</text>
<text x="147" y="96.7" font-size="14" fill="#292929">③ 먼저 확인할 이벤트 수 ④ 1순위 사용자</text>
<rect x="30" y="124" width="90" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="75" y="159.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나) 핵심</text>
<rect x="135" y="124" width="555" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="149.1" font-size="14" fill="#292929">① dami 의 판정 이유와 1순위인 까닭</text>
<text x="147" y="168.7" font-size="14" fill="#292929">② gaeun: 공격이라고 확정할 수 있는지와 먼저 확인할 것</text>
<rect x="30" y="196" width="90" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="75" y="231.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다) 핵심</text>
<rect x="135" y="196" width="555" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="221.1" font-size="14" fill="#292929">① seoyeon 의 2건이 빠진 이유 (실패 3번 이상 규칙)</text>
<text x="147" y="240.7" font-size="14" fill="#292929">② 이 규칙이 놓칠 수 있는 경우 한 가지</text>
<rect x="30" y="268" width="90" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="303.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마무리</text>
<rect x="135" y="268" width="555" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="293.1" font-size="14" fill="#292929">(가) git status 에서 .env · .venv 가 보였는지</text>
<text x="147" y="312.7" font-size="14" fill="#292929">보였다면 한 조치</text>
</g>
</svg>
