<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>실습 3-1 보고서는 출력, 09:12 의 요청, 09:20 의 요청을 세 칸에 채운다</title>
<desc>실습 3-1 보고서의 칸 세 개다. (가)는 출력 전체와 급증 기준, 급증한 분을 쓴다. (나)와 (다)는 핵심 질문으로 09:12 와 09:20 의 웹 요청을 살펴본다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 3-1 보고서 · 채울 칸</text>
<rect x="30" y="52" width="90" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75" y="90.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="135" y="52" width="555" height="66" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="80.1" font-size="14" fill="#292929">① 출력 전체 (코드 상자)</text>
<text x="147" y="99.7" font-size="14" fill="#292929">② 급증 기준 ③ 급증한 분과 요청 수</text>
<rect x="30" y="130" width="90" height="66" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="75" y="168.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나) 핵심</text>
<rect x="135" y="130" width="555" height="66" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="158.1" font-size="14" fill="#292929">09:12 web 줄: ① IP 주소 ② 행동별 횟수</text>
<text x="147" y="177.7" font-size="14" fill="#292929">③ 공격이라고 확정할 수 있는지와 이유</text>
<rect x="30" y="208" width="90" height="66" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="75" y="246.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다) 핵심</text>
<rect x="135" y="208" width="555" height="66" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="147" y="236.1" font-size="14" fill="#292929">09:20 의 3개: ① 급증 기준과 비교 ② IP · 행동 · 결과</text>
<text x="147" y="255.7" font-size="14" fill="#292929">③ 요청 수만 보는 규칙이 놓치는 이유</text>
</g>
</svg>
