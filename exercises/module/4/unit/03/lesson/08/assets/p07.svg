<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>응용 3-3 보고서에 채울 (가)~(다) 칸 체크리스트</title><desc>응용 3-3 보고서의 세 질문에 무엇을 쓰는지 정리했습니다. (가)는 스캔 IP와 이유, (나)와 (다)는 제외된 IP와 규칙의 한계를 묻습니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">보고서 · 응용 3-3에 채울 칸</text><rect x="20" y="52" width="120" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="80" y="103.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(가)</text><rect x="160" y="52" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="172" y="92.8" font-size="15" text-anchor="start" fill="#292929">□ 출력 전체(코드 상자)</text><text x="172" y="113.8" font-size="15" text-anchor="start" fill="#292929">□ 스캔으로 본 IP  □ 이유</text><rect x="20" y="158" width="120" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="80" y="209.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(나) 핵심</text><rect x="160" y="158" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="172" y="198.8" font-size="15" text-anchor="start" fill="#292929">□ 203.0.113.50 이 제외된 이유</text><text x="172" y="219.8" font-size="15" text-anchor="start" fill="#292929">□ 제외하지 않을 때 담당자에게 생기는 일</text><rect x="20" y="264" width="120" height="92" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="80" y="315.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">(다) 핵심</text><rect x="160" y="264" width="540" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="172" y="304.8" font-size="15" text-anchor="start" fill="#292929">□ GET /board/99 실패 1건이 제외되는 과정</text><text x="172" y="325.8" font-size="15" text-anchor="start" fill="#292929">□ 목록에 없는 경로(/backup.zip)는 못 찾는 점</text></svg>
