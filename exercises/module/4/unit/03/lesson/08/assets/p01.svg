<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>보고서는 질문마다 쓸 내용을 보고 답 뒤에 근거와 함께 쓴다</title>
<desc>보고서를 쓰는 다섯 가지 방법을 체크리스트로 보인다. 쓸 내용을 보고 답 뒤에 쓰고, 출력은 코드 상자에 붙인다. 왜를 묻는 질문은 근거를 쓰고, 모르면 모름과 막힌 곳을 쓴다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">보고서 쓰는 법 · 다섯 가지</text>
<rect x="30" y="55" width="660" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="46" y="65" width="22" height="22" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84" y="81" font-size="15" fill="#292929">문제를 풀 때마다 그 문제 제목 아래 질문에 답한다</text>
<rect x="30" y="107" width="660" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="46" y="117" width="22" height="22" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84" y="133" font-size="15" fill="#292929">「쓸 내용:」을 보고 「답:」 뒤에 쓴다</text>
<rect x="30" y="159" width="660" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="46" y="169" width="22" height="22" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84" y="185" font-size="15" fill="#292929">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙인다</text>
<rect x="30" y="211" width="660" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="46" y="221" width="22" height="22" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84" y="237" font-size="15" fill="#292929">「왜」는 내 화면의 값이나 배운 내용을 근거로 쓴다</text>
<rect x="30" y="263" width="660" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="46" y="273" width="22" height="22" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84" y="289" font-size="15" fill="#292929">모르면 「모름 — 막힌 곳: …」이라고 쓴다</text>
</g>
</svg>
