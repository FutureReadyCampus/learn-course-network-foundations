<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>요청 급증과 누락 글을 올리고 전체 글 목록에서 열기</title>
<desc>_posts 폴더에 글을 만들고 제목과 날짜를 적습니다. 요청 급증과 누락에서 확인한 내용을 저장해 올린 뒤, 전체 글 목록에서 제목을 눌러 본문을 확인합니다.</desc>
<defs><marker id="a-p02-u3w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="32" font-size="16" font-weight="700" fill="#292929">1. 글 틀 고르기</text>
<rect x="30" y="46" width="190" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="70" font-size="14" font-weight="700" fill="#292929">post-short</text>
<text x="44" y="91" font-size="14" fill="#292929">기본 · 세 문장 글</text>
<rect x="30" y="112" width="190" height="56" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="44" y="136" font-size="14" font-weight="700" fill="#292929">근거 넣기</text>
<text x="44" y="157" font-size="14" fill="#292929">코드나 확인한 출력</text>
<rect x="30" y="178" width="190" height="56" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="44" y="202" font-size="14" font-weight="700" fill="#292929">post-stuck</text>
<text x="44" y="223" font-size="14" fill="#292929">막혔던 일 남기기</text>
<line x1="226" y1="140" x2="262" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p02-u3w)"/>
<text x="268" y="32" font-size="16" font-weight="700" fill="#292929">2. 새 글 파일 (VS Code)</text>
<rect x="268" y="46" width="220" height="188" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="282" y="70" font-size="14" fill="#666660">_posts/</text>
<text x="282" y="91" font-size="14" fill="#292929">2026-11-20-detect-</text>
<text x="282" y="111" font-size="14" fill="#292929">minute-request-spikes.md</text>
<rect x="282" y="126" width="192" height="94" rx="4" fill="#ffffff" stroke="#dededb"/>
<text x="294" y="148" font-size="14" fill="#666660">---</text>
<text x="294" y="168" font-size="14" font-weight="700" fill="#e0442e">title: 내 글 제목</text>
<text x="294" y="188" font-size="14" font-weight="700" fill="#e0442e">date: 2026-11-20</text>
<text x="294" y="208" font-size="14" fill="#666660">---</text>
<line x1="494" y1="140" x2="530" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p02-u3w)"/>
<text x="536" y="32" font-size="16" font-weight="700" fill="#292929">3. 1~2분 뒤 첫 화면</text>
<rect x="536" y="46" width="160" height="188" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="550" y="80" font-size="14" fill="#2f6fd0">전체 글</text>
<text x="550" y="115" font-size="14" fill="#2f6fd0">요청 급증과 누락</text>
<text x="550" y="180" font-size="14" fill="#2f6fd0">제목을 눌러 본문 확인</text>
<text x="30" y="282" font-size="16" font-weight="700" fill="#292929">글에서 실제 코드로 링크</text>
<rect x="30" y="296" width="300" height="72" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="44" y="322" font-size="14" fill="#292929">anomaly_detection/traffic_detection.py</text>
<text x="44" y="348" font-size="14" fill="#292929">anomaly_detection/access_detection.py</text>
<line x1="336" y1="332" x2="372" y2="332" stroke="#666660" stroke-width="2" marker-end="url(#a-p02-u3w)"/>
<rect x="378" y="296" width="318" height="72" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="392" y="322" font-size="14" fill="#292929">설명한 코드와 실행 근거를 붙이고</text>
<text x="392" y="348" font-size="14" fill="#292929">코드 링크는 relative_url 로 적기</text>
</g>
</svg>
