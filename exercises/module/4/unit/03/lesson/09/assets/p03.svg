<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>막히면 고른 글감에 맞는 출력 한두 줄을 붙이고 그 뜻을 쓴다</title>
<desc>글감 1은 09:12 급증 줄과 그 분의 이벤트를, 글감 2는 09:20 줄과 기준 6.0 을, 글감 3은 1순위 줄과 3순위 줄을, 글감 4는 seoyeon 의 정산 조회 한 건을 붙입니다. 붙인 줄 아래에 무엇을 보았는지 한 문장으로 쓰고, AI 도우미 프롬프트는 Module 3 Unit 1 시작하기 레슨에 있습니다.</desc>
<defs><marker id="a-p03-u3w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="30" font-size="16" font-weight="700" fill="#292929">고른 글감</text>
<text x="250" y="30" font-size="16" font-weight="700" fill="#292929">글에 붙일 것</text>
<rect x="30" y="44" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="66" font-size="15" font-weight="700" fill="#292929">1. 09:12 급증</text>
<text x="44" y="88" font-size="14" fill="#292929">실습 3-1 단계 4</text>
<line x1="214" y1="72" x2="244" y2="72" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u3w)"/>
<rect x="250" y="44" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="66" font-size="14" fill="#292929">2026-11-02 09:12:00    9</text>
<text x="264" y="88" font-size="14" fill="#292929">+ 09:12 의 POST /login 실패 · GET /admin 줄</text>
<rect x="30" y="112" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="134" font-size="15" font-weight="700" fill="#292929">2. 놓친 09:20</text>
<text x="44" y="156" font-size="14" fill="#292929">실습 3-1 단계 2 · 3</text>
<line x1="214" y1="140" x2="244" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u3w)"/>
<rect x="250" y="112" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="134" font-size="14" fill="#292929">2026-11-02 09:20:00    3  과 기준 6.0</text>
<text x="264" y="156" font-size="14" fill="#292929">+ /.env · /wp-login.php · /phpmyadmin</text>
<rect x="30" y="180" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="202" font-size="15" font-weight="700" fill="#292929">3. 거절 이유</text>
<text x="44" y="224" font-size="14" fill="#292929">실습 3-2 단계 3</text>
<line x1="214" y1="208" x2="244" y2="208" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u3w)"/>
<rect x="250" y="180" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="202" font-size="14" fill="#292929">1 퇴사한 계정 dami … 줄 하나</text>
<text x="264" y="224" font-size="14" fill="#292929">+ 3 규칙은 허용인데 서버가 거절 gaeun … 줄 하나</text>
<rect x="30" y="248" width="180" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="44" y="270" font-size="15" font-weight="700" fill="#292929">4. 3번 이상 규칙</text>
<text x="44" y="292" font-size="14" fill="#292929">seoyeon 11:40</text>
<line x1="214" y1="276" x2="244" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p03-u3w)"/>
<rect x="250" y="248" width="440" height="56" rx="6" fill="#f1f1ef" stroke="#dededb"/>
<text x="264" y="270" font-size="14" fill="#292929">SETTLE:QUERY 는 「권한 없음」인데 한 번뿐</text>
<text x="264" y="292" font-size="14" fill="#292929">+ 횟수 말고 함께 볼 것</text>
<rect x="30" y="318" width="660" height="44" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="44" y="346" font-size="15" fill="#292929">붙인 줄 아래에 「이 줄에서 무엇을 보았는지」 한 문장 쓰기</text>
<rect x="30" y="374" width="400" height="56" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="44" y="398" font-size="14" fill="#292929">그래도 막히면 AI 도우미 프롬프트 세 가지</text>
<text x="44" y="420" font-size="14" fill="#666660">Module 3 Unit 1 「쓰기 질문과 AI 도우미」</text>
<rect x="446" y="374" width="244" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="460" y="398" font-size="14" font-weight="700" fill="#e0442e">붙여 넣기 전에</text>
<text x="460" y="420" font-size="14" fill="#292929">비밀키 · 개인정보 빼기</text>
</g>
</svg>
