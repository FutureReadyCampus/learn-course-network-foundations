<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>20분을 고르기 5분, 쓰기 10분, 점검·올리기 5분으로 나누고 글감 하나를 고른다</title>
<desc>글쓰기 20분의 시간 배분 막대입니다. 기본은 post-short 글 틀로 쓰는 세 문장 글입니다. 아래에는 실습 3-1 · 3-2 글감 네 가지와, 응용 3-1 ~ 3-3을 했을 때 고를 수 있는 선택 글감이 있습니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="40" y="34" font-size="18" font-weight="700" fill="#292929">Unit 3 글쓰기 20분 · 세 문장 글</text>
<rect x="40" y="52" width="160" height="56" rx="6" fill="#e6eefb" stroke="#2f6fd0"/>
<text x="120" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">고르기</text>
<text x="120" y="98" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<rect x="200" y="52" width="320" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e"/>
<text x="360" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">쓰기</text>
<text x="360" y="98" font-size="14" fill="#292929" text-anchor="middle">10분 · post-short 로 세 문장 쓰기</text>
<rect x="520" y="52" width="160" height="56" rx="6" fill="#e4f3ea" stroke="#1f7a4a"/>
<text x="600" y="77" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">점검 · 올리기</text>
<text x="600" y="98" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<text x="40" y="144" font-size="16" font-weight="700" fill="#292929">글감 하나 고르기 (실습 3-1 · 3-2)</text>
<rect x="40" y="158" width="310" height="76" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="56" y="184" font-size="15" font-weight="700" fill="#e0442e">1. 09:12 급증</text>
<text x="56" y="208" font-size="14" fill="#292929">공격이라고 확정할 수 있을까</text>
<text x="56" y="226" font-size="14" fill="#666660">실습 3-1 · traffic_detection.py</text>
<rect x="370" y="158" width="310" height="76" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="386" y="184" font-size="15" font-weight="700" fill="#e0442e">2. 놓친 09:20</text>
<text x="386" y="208" font-size="14" fill="#292929">3개는 왜 기준 6.0 에 못 미쳤나</text>
<text x="386" y="226" font-size="14" fill="#666660">실습 3-1 · 수만 보는 규칙</text>
<rect x="40" y="246" width="310" height="76" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="56" y="272" font-size="15" font-weight="700" fill="#e0442e">3. 거절 이유</text>
<text x="56" y="296" font-size="14" fill="#292929">퇴사한 계정 dami · 허용인데 gaeun</text>
<text x="56" y="314" font-size="14" fill="#666660">실습 3-2 · access_detection.py</text>
<rect x="370" y="246" width="310" height="76" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="386" y="272" font-size="15" font-weight="700" fill="#e0442e">4. 3번 이상 규칙</text>
<text x="386" y="296" font-size="14" fill="#292929">놓치는 경우와 보완 방법</text>
<text x="386" y="314" font-size="14" fill="#666660">실습 3-2 · REPEAT_LIMIT</text>
<rect x="40" y="340" width="640" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-dasharray="6 4"/>
<text x="56" y="365" font-size="15" font-weight="700" fill="#9a6200">선택 글감 · 응용 3-1 ~ 3-3을 했다면</text>
<text x="56" y="389" font-size="14" fill="#292929">두 알림을 한 사건으로 볼까 · 평소 IP 없는 사용자 빼기 · 경로 목록의 한계</text>
<text x="40" y="430" font-size="15" fill="#666660">세 문장만 써도, 막힌 이야기를 써도 한 편의 글입니다.</text>
</g>
</svg>
