<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>오류가 나면 증상을 보고 원인을 확인한 뒤 고친다</title>
<desc>pandas 가 없다고 나오면 가상환경을 켜고 설치한다. config 파일이나 rbac 를 못 찾으면 ls 로 위치를 본다. 실행은 VS Code 의 실행 단추가 아니라 터미널에서 한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">오류가 나면 · 증상 → 확인 → 고치기</text>
<text x="125" y="66" font-size="15" fill="#666660" text-anchor="middle" font-weight="700">증상</text>
<text x="360" y="66" font-size="15" fill="#666660" text-anchor="middle" font-weight="700">확인</text>
<text x="595" y="66" font-size="15" fill="#666660" text-anchor="middle" font-weight="700">고치기</text>
<rect x="30" y="80" width="190" height="75" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125" y="112.6" font-size="14" fill="#292929" text-anchor="middle">No module named</text>
<text x="125" y="132.2" font-size="14" fill="#292929" text-anchor="middle">'pandas'</text>
<rect x="265" y="80" width="190" height="75" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="112.6" font-size="14" fill="#292929" text-anchor="middle">가상환경이 꺼진</text>
<text x="360" y="132.2" font-size="14" fill="#292929" text-anchor="middle">터미널인가?</text>
<rect x="500" y="80" width="190" height="75" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="112.6" font-size="14" fill="#292929" text-anchor="middle">가상환경 활성화 후</text>
<text x="595" y="132.2" font-size="14" fill="#292929" text-anchor="middle">pip install pandas</text>
<line x1="220" y1="117" x2="263" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="455" y1="117" x2="498" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="30" y="175" width="190" height="75" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125" y="207.6" font-size="14" fill="#292929" text-anchor="middle">FileNotFoundError</text>
<text x="125" y="227.2" font-size="14" fill="#292929" text-anchor="middle">No module 'rbac'</text>
<rect x="265" y="175" width="190" height="75" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="207.6" font-size="14" fill="#292929" text-anchor="middle">config 안 JSON 두 개 ·</text>
<text x="360" y="227.2" font-size="14" fill="#292929" text-anchor="middle">rbac.py 위치</text>
<rect x="500" y="175" width="190" height="75" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="207.6" font-size="14" fill="#292929" text-anchor="middle">ls 로 보고</text>
<text x="595" y="227.2" font-size="14" fill="#292929" text-anchor="middle">제자리로 옮기기</text>
<line x1="220" y1="212" x2="263" y2="212" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="455" y1="212" x2="498" y2="212" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="30" y="270" width="190" height="75" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125" y="312.4" font-size="14" fill="#292929" text-anchor="middle">▶ 단추로 실행함</text>
<rect x="265" y="270" width="190" height="75" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="302.6" font-size="14" fill="#292929" text-anchor="middle">파일을 지금 위치</text>
<text x="360" y="322.2" font-size="14" fill="#292929" text-anchor="middle">기준으로 찾음</text>
<rect x="500" y="270" width="190" height="75" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="302.6" font-size="14" fill="#292929" text-anchor="middle">터미널에서</text>
<text x="595" y="322.2" font-size="14" fill="#292929" text-anchor="middle">pwd 확인 후 실행</text>
<line x1="220" y1="307" x2="263" y2="307" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="455" y1="307" x2="498" y2="307" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
</g>
</svg>
