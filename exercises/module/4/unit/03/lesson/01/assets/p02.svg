<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Unit 2 와 Module 3 Unit 1 의 파일을 anomaly_detection 폴더에서 불러 쓴다</title>
<desc>normalized_events.json 과 login_detection.py 는 Unit 2 에서 만들었다. rbac.py 와 config 의 JSON 두 개는 Module 3 Unit 1 실습 1-1, 1-2 에서 만들었고 access_control 폴더에 있으므로, 다음 페이지에서 anomaly_detection 폴더에 새로 만든다.</desc>
<defs><marker id="a-p02-u3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="32" font-size="19" font-weight="700" fill="#292929">이전 파일은 어디서 오나</text>
<rect x="30" y="52" width="300" height="122" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="46" y="78" font-size="15" font-weight="700" fill="#292929">Unit 2 · anomaly_detection/</text>
<text x="46" y="106" font-size="15" fill="#292929">normalized_events.json</text>
<text x="46" y="130" font-size="15" fill="#292929">login_detection.py</text>
<text x="46" y="154" font-size="14" fill="#666660">실습 2-3 · 응용 3-1 에서만 씀</text>
<rect x="30" y="192" width="300" height="122" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="46" y="218" font-size="15" font-weight="700" fill="#292929">Module 3 Unit 1 · access_control/</text>
<text x="46" y="246" font-size="15" fill="#292929">rbac.py (실습 1-2)</text>
<text x="46" y="270" font-size="15" fill="#292929">config/users.json · roles.json</text>
<text x="46" y="294" font-size="14" fill="#666660">(실습 1-1) 다른 폴더에 있음</text>
<line x1="336" y1="113" x2="404" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p02-u3s)"/>
<line x1="336" y1="253" x2="404" y2="206" stroke="#666660" stroke-width="2" marker-end="url(#a-p02-u3s)"/>
<rect x="410" y="112" width="280" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="426" y="140" font-size="15" font-weight="700" fill="#292929">오늘 작업 폴더</text>
<text x="426" y="166" font-size="15" fill="#292929">anomaly_detection/</text>
<text x="426" y="198" font-size="14" fill="#292929">이벤트 · rbac.py · config 는</text>
<text x="426" y="220" font-size="14" fill="#292929">다음 페이지 완성본으로</text>
<text x="426" y="242" font-size="14" fill="#292929">이 폴더에 새로 만든다</text>
<rect x="30" y="330" width="660" height="38" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="355" font-size="15" fill="#292929" text-anchor="middle">cd anomaly_detection → pwd → 판다스 버전 → ls</text>
</g>
