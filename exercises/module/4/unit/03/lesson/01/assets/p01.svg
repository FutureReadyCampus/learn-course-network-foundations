<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>Unit 3 오늘의 계획: 핵심 실습 3-1 요청 급증, 3-2 반복 거절, 응용 세 개는 여유가 되면</title>
<desc>약 2시간 40분은 시작 15분, 핵심 실습 약 110분, 글쓰기 20분(한 편의 글), 마무리 15분이다. 실습 3-1 은 traffic_detection.py 로 요청이 급증한 분을, 실습 3-2 는 access_detection.py 로 반복 거절을 이유별 순서로 찾는다. 응용 3-1 ~ 3-3 은 여유가 되면 한다.</desc>
<defs><marker id="a-p01-u3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="32" font-size="19" font-weight="700" fill="#292929">Unit 3 오늘의 계획 · 약 2시간 40분</text>
<rect x="30" y="50" width="120" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="73" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">시작하기</text>
<text x="90" y="93" font-size="14" fill="#666660" text-anchor="middle">15분</text>
<rect x="164" y="50" width="250" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="289" y="73" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">핵심 실습 3-1 · 3-2</text>
<text x="289" y="93" font-size="14" fill="#666660" text-anchor="middle">약 110분</text>
<rect x="428" y="50" width="130" height="54" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="493" y="73" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">글쓰기</text>
<text x="493" y="93" font-size="14" fill="#666660" text-anchor="middle">20분 · 한 편의</text>
<rect x="572" y="50" width="118" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="631" y="73" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">마무리</text>
<text x="631" y="93" font-size="14" fill="#666660" text-anchor="middle">15분 · 깃허브</text>
<rect x="30" y="128" width="320" height="130" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="46" y="154" font-size="16" font-weight="700" fill="#2f6fd0">실습 3-1 · 요청 급증</text>
<text x="46" y="180" font-size="15" fill="#292929">traffic_detection.py</text>
<text x="46" y="204" font-size="15" fill="#292929">분마다 세어 평균 × 3 이상인 분</text>
<text x="46" y="236" font-size="15" font-weight="700" fill="#292929">→ 09:12 에 요청 9개</text>
<rect x="370" y="128" width="320" height="130" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="386" y="154" font-size="16" font-weight="700" fill="#2f6fd0">실습 3-2 · 반복 거절</text>
<text x="386" y="180" font-size="15" fill="#292929">access_detection.py + rbac.py</text>
<text x="386" y="204" font-size="15" fill="#292929">3번 이상 거절 → 이유로 순서</text>
<text x="386" y="236" font-size="15" font-weight="700" fill="#292929">→ 퇴사한 계정 dami 가 1순위</text>
<rect x="30" y="278" width="660" height="70" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="304" font-size="15" font-weight="700" fill="#9a6200">응용 3-1 ~ 3-3 · 여유가 되면 해 보세요</text>
<text x="46" y="330" font-size="15" fill="#292929">3-1 알림을 한 파일로 · 3-2 SaaS 이상 사용 · 3-3 경로 스캔 IP</text>
<text x="30" y="376" font-size="14" fill="#666660">다음 Unit 은 access_detection.py 를 여러 번 불러 쓴다</text>
</g>
</svg>
