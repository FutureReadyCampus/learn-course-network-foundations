<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>anomaly_detection 폴더에 파일 다섯 개를 만들고 57, 8, 퇴사한 계정이 나오는지 본다</title>
<desc>anomaly_detection 폴더에 normalized_events.json, baseline_traffic.csv, rbac.py 를 두고, config 폴더에 users.json 과 roles.json 을 둔다. 확인 명령 세 줄의 결과는 57, 8, (False, '퇴사한 계정') 이다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="30" y="32" font-size="19" font-weight="700" fill="#292929">오늘 쓸 파일 · 다섯 개</text>
<rect x="30" y="50" width="240" height="34" rx="6" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="44" y="73" font-size="15" font-weight="700" fill="#292929">anomaly_detection/</text>
<path d="M50 84 V 232" stroke="#666660" stroke-width="1.5" fill="none"/>
<path d="M50 112 H 70 M50 152 H 70 M50 192 H 70 M50 232 H 70" stroke="#666660" stroke-width="1.5" fill="none"/>
<rect x="70" y="96" width="250" height="32" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="82" y="117" font-size="15" fill="#292929">normalized_events.json</text>
<rect x="70" y="136" width="250" height="32" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="82" y="157" font-size="15" fill="#292929">baseline_traffic.csv</text>
<rect x="70" y="176" width="250" height="32" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="82" y="197" font-size="15" fill="#292929">rbac.py</text>
<rect x="70" y="216" width="250" height="32" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="82" y="237" font-size="15" font-weight="700" fill="#292929">config/   (mkdir config)</text>
<path d="M90 248 V 324 M90 284 H 110 M90 324 H 110" stroke="#666660" stroke-width="1.5" fill="none"/>
<rect x="110" y="268" width="210" height="32" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="122" y="289" font-size="15" fill="#292929">users.json</text>
<rect x="110" y="308" width="210" height="32" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="122" y="329" font-size="15" fill="#292929">roles.json</text>
<text x="336" y="117" font-size="14" fill="#666660">모든 실습 · 덮어씀</text>
<text x="336" y="157" font-size="14" fill="#666660">실습 3-1</text>
<text x="336" y="197" font-size="14" fill="#666660">실습 3-2</text>
<rect x="470" y="96" width="220" height="172" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="580" y="124" font-size="15" font-weight="700" fill="#292929" text-anchor="middle">확인 명령 결과</text>
<text x="580" y="158" font-size="15" fill="#292929" text-anchor="middle">57</text>
<text x="580" y="186" font-size="15" fill="#292929" text-anchor="middle">8</text>
<text x="580" y="214" font-size="15" fill="#292929" text-anchor="middle">(False, '퇴사한 계정')</text>
<text x="580" y="246" font-size="14" fill="#666660" text-anchor="middle">이벤트 · 줄 수 · 판정</text>
<rect x="470" y="284" width="220" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="580" y="308" font-size="14" fill="#292929" text-anchor="middle">다르면 파일 내용과</text>
<text x="580" y="328" font-size="14" fill="#292929" text-anchor="middle">위치(config 안)를 확인</text>
</g>
</svg>
