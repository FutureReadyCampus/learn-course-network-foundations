<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 결과 기록을 쓰는 법 다섯 가지</title>
<desc>문제마다 그 제목 아래 질문에 답하고, 쓸 내용을 보고 답: 뒤에 씁니다. 출력은 코드 상자에 붙이고, 왜는 근거까지 쓰고, 못 찾으면 모름 — 막힌 곳을 적습니다.</desc>
<defs><marker id="a-0305-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 결과 기록을 쓰는 법</text>
<rect x="24" y="60" width="672" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="75.0" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a"/>
<path d="M42,84.0 L46.0,88.0 L52,79.0" fill="none" stroke="#1f7a4a" stroke-width="2.2"/>
<text x="68" y="89.25" font-size="15" fill="#292929" text-anchor="start">문제를 풀 때마다 그 문제 제목 아래 질문에 답합니다</text>
<rect x="24" y="120" width="672" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="135.0" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a"/>
<path d="M42,144.0 L46.0,148.0 L52,139.0" fill="none" stroke="#1f7a4a" stroke-width="2.2"/>
<text x="68" y="149.25" font-size="15" fill="#292929" text-anchor="start">「쓸 내용:」을 보고 그대로 「답:」 뒤에 씁니다</text>
<rect x="24" y="180" width="672" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="195.0" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a"/>
<path d="M42,204.0 L46.0,208.0 L52,199.0" fill="none" stroke="#1f7a4a" stroke-width="2.2"/>
<text x="68" y="209.25" font-size="15" fill="#292929" text-anchor="start">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙여 넣습니다</text>
<rect x="24" y="240" width="672" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="255.0" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a"/>
<path d="M42,264.0 L46.0,268.0 L52,259.0" fill="none" stroke="#1f7a4a" stroke-width="2.2"/>
<text x="68" y="269.25" font-size="15" fill="#292929" text-anchor="start">「왜」는 내 화면의 값이나 배운 내용을 근거로 씁니다</text>
<rect x="24" y="300" width="672" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="315.0" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a"/>
<path d="M42,324.0 L46.0,328.0 L52,319.0" fill="none" stroke="#1f7a4a" stroke-width="2.2"/>
<text x="68" y="329.25" font-size="15" fill="#292929" text-anchor="start">못 찾으면 「모름 — 막힌 곳: …」 이라고 씁니다</text>
</svg>
