<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>판정 서버 거절 9건에서 반복 거절을 고르고 거절 이유로 순서를 정한다</title>
<desc>판정 서버 로그에는 실패라고만 적혀 있다. 같은 사람이 3번 이상 거절당한 기록을 고르고, check_permission 으로 거절 이유를 붙여 퇴사한 계정부터 순서를 정한다. 공격이라고 단정하지는 않는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰 · 반복 거절과 거절 이유</text>
<rect x="30" y="80" width="154" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="107" y="125.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">거절 9건</text>
<text x="107" y="144.7" font-size="14" fill="#292929" text-anchor="middle">결과는 실패뿐</text>
<rect x="202" y="80" width="154" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="279" y="125.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">같은 사람</text>
<text x="279" y="144.7" font-size="14" fill="#292929" text-anchor="middle">3번 이상</text>
<line x1="185" y1="130" x2="200" y2="130" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="374" y="80" width="154" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="451" y="125.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">check_permission</text>
<text x="451" y="144.7" font-size="14" fill="#292929" text-anchor="middle">으로 이유 붙이기</text>
<line x1="357" y1="130" x2="372" y2="130" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="546" y="80" width="154" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="623" y="125.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">이유별 순서</text>
<text x="623" y="144.7" font-size="14" fill="#292929" text-anchor="middle">퇴사자 먼저</text>
<line x1="529" y1="130" x2="544" y2="130" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="30" y="220" width="660" height="54" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="252.2" font-size="15" fill="#292929" text-anchor="middle">거절이 전부 문제는 아니므로 공격이라고 단정하지 않습니다</text>
</g>
</svg>
