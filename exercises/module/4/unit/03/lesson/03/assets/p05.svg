<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>실습 3-2 정리: index 로 이름 꺼내기, isin, check_permission, PRIORITY.get</title>
<desc>실습 3-2 에서 쓴 코드 네 가지를 하려는 일과 짝지었다. 반복된 사용자 이름은 index 로 꺼내고 isin 으로 행을 고른다. check_permission 으로 이유를 받고 PRIORITY.get 으로 순서를 꺼낸다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 3-2 정리</text>
<rect x="30" y="55" width="180" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="87.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">센 결과의 이름</text>
<rect x="225" y="55" width="465" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="237" y="86.9" font-size="14" fill="#292929">repeated_names = repeated_users.index</text>
<rect x="30" y="121" width="180" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="153.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">리스트 안에 있는지</text>
<rect x="225" y="121" width="465" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="237" y="152.9" font-size="14" fill="#292929">is_repeated_user = users.isin(repeated_names)</text>
<rect x="30" y="187" width="180" height="54" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="120" y="219.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">Module 3 규칙 판정</text>
<rect x="225" y="187" width="465" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="237" y="209.1" font-size="14" fill="#292929">is_allowed, reason = check_permission(</text>
<text x="237" y="228.7" font-size="14" fill="#292929">    user, resource, permission_action)</text>
<rect x="30" y="253" width="180" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="120" y="285.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">순서</text>
<rect x="225" y="253" width="465" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="237" y="284.9" font-size="14" fill="#292929">priority = PRIORITY.get(reason, 4)</text>
</g>
</svg>
