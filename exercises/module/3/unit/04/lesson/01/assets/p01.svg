<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Unit 4은 회수 대상 8건을 계획, 승인, 실행 순서로 회수합니다</title>
<desc>도전 4-1은 회수 계획, 실습 4-1는 승인 상태, 실습 4-2은 실행과 이력입니다. 회수는 파일이 아니라 메모리 안의 USERS · ROLES · EXCEPTIONS 를 바꾸고, 파일로 남기는 것은 회수 이력뿐입니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">Unit 4 — 회수 대상 8건을 계획 → 승인 → 실행으로</text>
<rect x="20" y="70" width="130" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="85" y="99.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 대상</text>
