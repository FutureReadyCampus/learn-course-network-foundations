<text x="265" y="99.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">도전 4-1</text>
<text x="265" y="120.2" font-size="15" fill="#292929" text-anchor="middle">회수 계획</text>
<text x="265" y="141.2" font-size="15" fill="#292929" text-anchor="middle">아직 안 지움</text>
<path d="M340 115 L376 115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="380" y="70" width="150" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="455" y="99.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 4-1</text>
<text x="455" y="120.2" font-size="15" fill="#292929" text-anchor="middle">승인 상태</text>
<text x="455" y="141.2" font-size="15" fill="#292929" text-anchor="middle">민감한 권한</text>
<path d="M530 115 L566 115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="570" y="70" width="130" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="635" y="109.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 4-2</text>
<text x="635" y="130.8" font-size="15" fill="#292929" text-anchor="middle">실행 · 이력</text>
<rect x="20" y="200" width="420" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="239.2" font-size="15" fill="#292929" text-anchor="start">바꾸는 것: 메모리 안의 데이터</text>
