<text x="132.0" y="144.2" font-size="15" fill="#292929" text-anchor="middle">exception_policy.py</text>
<text x="132.0" y="166.2" font-size="15" fill="#292929" text-anchor="middle">config_loader.py</text>
<text x="132.0" y="188.2" font-size="15" fill="#292929" text-anchor="middle">config/ 안의 users.json</text>
<text x="132.0" y="210.2" font-size="15" fill="#292929" text-anchor="middle">roles.json · exceptions.json</text>
<rect x="254" y="50" width="216" height="200" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="362.0" y="100.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">Unit 3 · 있으면 씀</text>
<text x="362.0" y="122.2" font-size="14" fill="#666660" text-anchor="middle">review_list.py</text>
<text x="362.0" y="144.2" font-size="14" fill="#666660" text-anchor="middle">review_unused.py</text>
<text x="362.0" y="166.2" font-size="14" fill="#666660" text-anchor="middle">review_rules.py</text>
<text x="362.0" y="188.2" font-size="14" fill="#666660" text-anchor="middle">overprivilege.py</text>
<text x="362.0" y="210.2" font-size="14" fill="#666660" text-anchor="middle">report_exclude.py</text>
<rect x="480" y="50" width="220" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="590.0" y="79.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">확인 결과</text>
<text x="590.0" y="101.2" font-size="14" fill="#666660" text-anchor="middle">Unit 3 파일 정상</text>
<text x="590.0" y="123.2" font-size="14" fill="#666660" text-anchor="middle">14 7 3</text>
<rect x="480" y="160" width="106" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
