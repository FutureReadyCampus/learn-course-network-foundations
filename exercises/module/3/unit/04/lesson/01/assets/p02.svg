<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Unit 1 파일은 꼭 있어야 하고, Unit 3 파일 확인 결과로 revoke_input.py 코드를 고릅니다</title>
<desc>왼쪽은 반드시 있어야 할 Unit 1 파일, 가운데는 있으면 쓰는 Unit 3 파일입니다. Unit 3 확인 결과가 14 7 3 이면 Unit 3 파일이 있을 때 코드를, 아니면 없을 때 코드를 제공 파일 레슨에서 붙여 넣습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">access_control 폴더에서 이전 파일 확인</text>
