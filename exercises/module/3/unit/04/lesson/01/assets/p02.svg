<text x="533.0" y="232.2" font-size="15" fill="#292929" text-anchor="middle">코드</text>
<rect x="594" y="160" width="106" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="647.0" y="188.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">아니오</text>
