<rect x="480" y="158" width="220" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="590.0" y="185.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">사용자 이름</text>
<text x="590.0" y="207.2" font-size="14" fill="#666660" text-anchor="middle">역할의 권한 수</text>
<rect x="20" y="236" width="210" height="66" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
