<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>받은 방식에 따라 예외 삭제, 역할 해제, 역할에서 권한 빼기 중 하나로 계획합니다</title>
<desc>예외로 받은 권한은 예외 삭제(5건), 퇴사자가 역할로 받은 권한은 역할 해제(2건), 재직자가 역할로 받은 권한은 역할에서 권한 빼기(1건)입니다. 계획마다 method, target, impact 키가 더해집니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">plan_revocation — 회수 대상마다 방법 정하기</text>
<text x="20" y="66" font-size="15" fill="#666660" font-weight="700">받은 방식</text>
<text x="250" y="66" font-size="15" fill="#666660" font-weight="700">회수 방법 (method)</text>
<text x="480" y="66" font-size="15" fill="#666660" font-weight="700">target · impact</text>
<rect x="20" y="80" width="210" height="66" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="125.0" y="107.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외로 받음</text>
<text x="125.0" y="129.2" font-size="14" fill="#666660" text-anchor="middle">source 가 「예외 N번」</text>
<polyline points="232,113 248,113" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="250" y="80" width="210" height="66" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="355.0" y="107.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외 삭제</text>
<text x="355.0" y="129.2" font-size="15" fill="#292929" text-anchor="middle">오늘 5건</text>
<polyline points="462,113 478,113" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="480" y="80" width="220" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
