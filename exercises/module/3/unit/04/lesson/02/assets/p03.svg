<text x="125.0" y="185.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">역할로 받음 · 퇴사자</text>
<text x="125.0" y="207.2" font-size="14" fill="#666660" text-anchor="middle">employed 가 False</text>
<polyline points="232,191 248,191" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
