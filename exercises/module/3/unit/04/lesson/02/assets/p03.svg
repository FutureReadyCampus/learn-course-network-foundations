<text x="590.0" y="285.2" font-size="14" fill="#666660" text-anchor="middle">역할의 사용자 수</text>
<text x="20" y="330" font-size="15" fill="#292929">계획 한 건 = 회수 대상 + method · target · impact (아무것도 지우지 않음)</text>
