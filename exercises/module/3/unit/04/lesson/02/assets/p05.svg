<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>실습 4-1 정리: 결정 키, 승인 필요 판단, 승인 상태 세 갈래의 코드 조각</title>
<desc>위는 plan_key 와 needs_approval 에서 쓰는 줄입니다. 아래는 mark_approvals 안에서 승인 불필요, 승인됨, 승인 대기를 정하는 세 갈래입니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 4-1 정리 — 코드 조각 지도</text>
<rect x="20" y="60" width="330" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="99.8" font-size="15" fill="#292929" text-anchor="start" font-weight="700">결정을 찾는 키 (plan_key)</text>
<text x="32" y="120.8" font-size="15" fill="#292929" text-anchor="start">return f"{user}:{permission}"</text>
<rect x="370" y="60" width="330" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="382" y="89.2" font-size="15" fill="#292929" text-anchor="start" font-weight="700">승인이 필요한지 (needs_approval)</text>
<text x="382" y="110.2" font-size="15" fill="#292929" text-anchor="start">plan["impact"] &gt;= 2</text>
<text x="382" y="131.2" font-size="15" fill="#292929" text-anchor="start">is_sensitive or is_big_impact</text>
<text x="20" y="180" font-size="15" fill="#666660" text-anchor="start">mark_approvals 안의 세 갈래</text>
<rect x="20" y="192" width="213" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="126.5" y="241.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">if not needs:</text>
<text x="126.5" y="262.8" font-size="15" fill="#292929" text-anchor="middle">승인 불필요</text>
<rect x="253" y="192" width="213" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="359.5" y="231.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">elif decision</text>
<text x="359.5" y="252.2" font-size="15" fill="#292929" text-anchor="middle">== "승인":</text>
<text x="359.5" y="273.2" font-size="15" fill="#292929" text-anchor="middle">승인됨</text>
<rect x="487" y="192" width="213" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="593.5" y="241.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">else:</text>
<text x="593.5" y="262.8" font-size="15" fill="#292929" text-anchor="middle">승인 대기</text>
</g>
</svg>
