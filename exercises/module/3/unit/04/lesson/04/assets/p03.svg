<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>grant_request 는 승인 여부와 check_permission 판정을 보고 권한 없음일 때만 예외를 만든다</title>
<desc>status 가 approved 가 아니면 승인되지 않음으로 끝납니다. check_permission 판정이 허용이거나 사람 쪽 문제면 부여하지 않고, 권한 없음일 때만 예외를 추가하고 granted 로 바꿉니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">부여할지 판단하는 순서</text>
<rect x="40" y="48" width="330" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="205" y="72.6" font-size="15" fill="#292929" text-anchor="middle">grant_request(request)</text>
<line x1="205" y1="88" x2="205" y2="108" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<rect x="40" y="110" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="205" y="138.6" font-size="15" fill="#292929" text-anchor="middle">status 가 "approved" 인가?</text>
<line x1="370" y1="134" x2="458" y2="134" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="414" y="127" font-size="14" fill="#666660" text-anchor="middle">아님</text>
<rect x="460" y="110" width="240" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580" y="128.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">False</text>
<text x="580" y="148.4" font-size="15" fill="#292929" text-anchor="middle">"승인되지 않음"</text>
<line x1="205" y1="158" x2="205" y2="188" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="216" y="180" font-size="14" fill="#666660" text-anchor="start">맞음</text>
<rect x="40" y="190" width="330" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="205" y="216.1" font-size="15" fill="#292929" text-anchor="middle">check_permission 으로</text>
<text x="205" y="237.1" font-size="15" fill="#292929" text-anchor="middle">요청자를 지금 정책으로 판정</text>
<line x1="370" y1="206" x2="458" y2="196" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="414" y="192" font-size="14" fill="#666660" text-anchor="middle">허용</text>
<rect x="460" y="172" width="240" height="46" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580" y="189.7" font-size="14" fill="#292929" text-anchor="middle">부여하지 않음(허용)</text>
<text x="580" y="208.7" font-size="14" fill="#292929" text-anchor="middle">이미 가진 권한</text>
<line x1="370" y1="240" x2="458" y2="252" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="414" y="238" font-size="14" fill="#666660" text-anchor="middle">그 밖</text>
<rect x="460" y="226" width="240" height="66" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580" y="244.2" font-size="14" fill="#292929" text-anchor="middle">부여하지 않음(이유)</text>
<text x="580" y="263.2" font-size="14" fill="#292929" text-anchor="middle">퇴사한 계정 · 등록되지 않은</text>
<text x="580" y="282.2" font-size="14" fill="#292929" text-anchor="middle">사용자 · 역할이 없음</text>
<line x1="205" y1="254" x2="205" y2="298" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="216" y="282" font-size="14" fill="#666660" text-anchor="start">권한 없음</text>
<rect x="40" y="300" width="330" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="205" y="327.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외 한 건을 EXCEPTIONS 에 추가</text>
<line x1="205" y1="346" x2="205" y2="366" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<rect x="40" y="368" width="330" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="205" y="392.1" font-size="15" fill="#292929" text-anchor="middle">exception_id 를 적고 "granted" 로</text>
<text x="205" y="413.1" font-size="15" fill="#292929" text-anchor="middle">→ (True, "부여")</text>
</svg>
