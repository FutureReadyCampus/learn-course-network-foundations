<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>세 회수 방법이 실제로 고치는 데이터와, 여섯 키로 된 이력 한 건의 모양</title>
<desc>예외 삭제는 EXCEPTIONS 에서, 역할 해제는 users 의 role 을, 역할에서 권한 빼기는 roles 의 권한 리스트를 고칩니다. 이력 한 건은 time, user, permission, method, approval, result 여섯 키입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">3.1 실행 방법과 이력 한 건의 모양</text>
<rect x="20" y="60" width="180" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="110" y="94.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외 삭제</text>
<path d="M200 89 L226 89" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="230" y="60" width="470" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="242" y="94.2" font-size="15" fill="#292929" text-anchor="start">EXCEPTIONS 에서 번호가 target 인 예외 한 건을 지움</text>
<rect x="20" y="132" width="180" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="110" y="166.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">역할 해제</text>
<path d="M200 161 L226 161" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="230" y="132" width="470" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="242" y="166.2" font-size="15" fill="#292929" text-anchor="start">users[target]["role"] 을 "" (빈 문자열)로</text>
<rect x="20" y="204" width="180" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="110" y="238.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">역할에서 권한 빼기</text>
<path d="M200 233 L226 233" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="230" y="204" width="470" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="242" y="238.2" font-size="15" fill="#292929" text-anchor="start">roles[target] 권한 리스트에서 그 권한을 지움</text>
<text x="20" y="300" font-size="16" fill="#292929" text-anchor="start" font-weight="700">이력 한 건의 여섯 키</text>
<rect x="20" y="314" width="105" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="72.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">time</text>
<rect x="135" y="314" width="105" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="187.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">user</text>
<rect x="250" y="314" width="105" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="302.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">permission</text>
<rect x="365" y="314" width="105" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="417.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">method</text>
<rect x="480" y="314" width="105" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="532.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">approval</text>
<rect x="595" y="314" width="105" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="647.5" y="342.2" font-size="15" fill="#292929" text-anchor="middle">result</text>
<text x="20" y="388" font-size="14" fill="#666660" text-anchor="start">result 는 「실행」 또는 「대기」(승인 대기라 실행하지 않음)</text>
</g>
</svg>
