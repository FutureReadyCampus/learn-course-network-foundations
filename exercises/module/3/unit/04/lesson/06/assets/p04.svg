<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>도전 4-2는 파일 세 개를 만들고 conditional.py 의 세 함수에 2~4줄씩 쓴다</title>
<desc>conditions.json 과 challenge4-2_run.py 는 그대로 붙여 넣는다. conditional.py 에서는 is_work_time(1~3번), is_allowed_network(4·5번), evaluate_conditional(6~9번)을 쓰고, 실행하면 판정 여덟 줄과 조건 세 줄이 나온다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 4-2 · 만들 파일과 직접 쓰는 곳</text>
<rect x="20" y="52" width="220" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="78.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">config/conditions.json</text>
<text x="130" y="101.7" font-size="15" fill="#292929" text-anchor="middle">그대로 붙여 넣기</text>
<rect x="20" y="130" width="220" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130" y="172.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">conditional.py</text>
<text x="130" y="195.9" font-size="15" fill="#292929" text-anchor="middle">직접 쓰는 곳 세 군데</text>
<text x="130" y="217.7" font-size="15" fill="#292929" text-anchor="middle">load_rules 와 마지막</text>
<text x="130" y="239.4" font-size="15" fill="#292929" text-anchor="middle">return 은 미리 채움</text>
<rect x="20" y="284" width="220" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="310.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">challenge4-2_run.py</text>
<text x="130" y="333.7" font-size="15" fill="#292929" text-anchor="middle">그대로 붙여 넣기</text>
<rect x="280" y="52" width="420" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="78.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">is_work_time · 1 ~ 3번</text>
<text x="490" y="101.7" font-size="15" fill="#292929" text-anchor="middle">return start &lt;= hour &lt; end</text>
<polyline points="241,200 279,84" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="280" y="128" width="420" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="154.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">is_allowed_network · 4 · 5번</text>
<text x="490" y="177.7" font-size="15" fill="#292929" text-anchor="middle">return network in allowed_networks</text>
<polyline points="241,200 279,160" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="280" y="204" width="420" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="230.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">evaluate_conditional · 6 ~ 9번</text>
<text x="490" y="253.7" font-size="15" fill="#292929" text-anchor="middle">if not … : return False, 이유</text>
<polyline points="241,200 279,236" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="241,316 279,316" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="280" y="284" width="420" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="490" y="310.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">python challenge4-2_run.py</text>
<text x="490" y="333.7" font-size="15" fill="#292929" text-anchor="middle">단계 1: 판정 8줄 · 단계 2: 조건 3줄</text>
<text x="20" y="384" font-size="15" fill="#666660">채우기 전에 실행하면 IndentationError: expected an indented block</text>
