<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>조건 파일의 세 권한은 시간대와 접속 위치가 정해져 있고 끝 시각은 포함하지 않는다</title>
<desc>SALES:CHANGE 와 ACCOUNT:CHANGE 는 9시부터 18시 전까지, SETTLE:QUERY 는 8시부터 20시 전까지 허용한다. 판정은 기본 판정, 업무 시간, 접속 위치 순서로 하고 어긋나는 곳에서 바로 거부한다.</desc>
