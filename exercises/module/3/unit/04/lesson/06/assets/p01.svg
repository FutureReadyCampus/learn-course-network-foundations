<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>보고서는 문제마다 쓸 내용을 보고 답: 뒤에 쓰고, 왜 질문은 근거까지 쓴다</title>
<desc>보고서를 쓸 때 지킬 다섯 가지를 체크리스트로 정리했습니다. 출력과 코드는 빈 코드 상자에, 핵심 질문을 못 풀면 모름과 막힌 곳을 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">보고서 쓰는 방법</text>
<rect x="24" y="48" width="676" height="266" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="48" y="79" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="92" font-size="15" fill="#292929" text-anchor="start">문제를 풀 때마다 그 문제 제목 아래 질문에 답합니다</text>
<rect x="48" y="127" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="140" font-size="15" fill="#292929" text-anchor="start">질문마다 "쓸 내용:" 을 보고 "답:" 뒤에 씁니다</text>
<rect x="48" y="175" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="188" font-size="15" fill="#292929" text-anchor="start">출력 · 코드는 "답:" 아래 빈 코드 상자에 붙여 넣습니다</text>
<rect x="48" y="223" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="236" font-size="15" fill="#292929" text-anchor="start">「왜」는 내 화면에서 본 값이나 배운 내용을 근거로 이유까지 씁니다</text>
<rect x="48" y="271" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="284" font-size="15" fill="#292929" text-anchor="start">[핵심 질문] 을 못 풀었으면 「모름 — 막힌 곳: …」 이라고 씁니다</text>
</svg>
