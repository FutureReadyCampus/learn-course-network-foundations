<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>요청과 조건 파일을 evaluate_conditional 로 판정해 허용 또는 거부와 이유를 낸다</title>
<desc>요청에는 사용자, 권한, 접속 위치, 시각이 들어 있다. evaluate_conditional 은 기본 판정 뒤에 conditions.json 의 업무 시간과 접속 위치 조건을 확인해 허용 또는 거부와 그 이유를 돌려준다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">응용 4-2에서 만드는 것: 조건기반 판정</text>
<rect x="20" y="60" width="190" height="130" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="97.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">요청</text>
<text x="115" y="121" font-size="15" fill="#292929" text-anchor="middle">사용자 · 자원 · 행위</text>
<text x="115" y="142.7" font-size="15" fill="#292929" text-anchor="middle">접속 위치 network</text>
<text x="115" y="164.4" font-size="15" fill="#292929" text-anchor="middle">시각 now</text>
<rect x="20" y="200" width="190" height="96" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="115" y="231.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">조건 파일</text>
<text x="115" y="254.8" font-size="15" fill="#292929" text-anchor="middle">config/</text>
<text x="115" y="276.6" font-size="15" fill="#292929" text-anchor="middle">conditions.json</text>
<rect x="260" y="100" width="220" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="370" y="148.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">conditional.py</text>
<text x="370" y="171.8" font-size="15" fill="#292929" text-anchor="middle">evaluate_conditional</text>
<text x="370" y="193.6" font-size="15" fill="#292929" text-anchor="middle">기본 판정 → 조건 확인</text>
<polyline points="211,125 259,150" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="211,246 259,196" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="530" y="64" width="170" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="98.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">허용(역할 권한)</text>
<text x="615" y="121.7" font-size="15" fill="#292929" text-anchor="middle">조건에 맞음</text>
<rect x="530" y="168" width="170" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="615" y="190.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">거부(이유)</text>
<text x="615" y="213.9" font-size="15" fill="#292929" text-anchor="middle">업무 시간 밖</text>
<text x="615" y="235.7" font-size="15" fill="#292929" text-anchor="middle">허용되지 않은</text>
<text x="615" y="257.4" font-size="15" fill="#292929" text-anchor="middle">접속 위치</text>
<polyline points="481,150 529,104" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="481,180 529,210" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="20" y="322" font-size="15" fill="#666660">실행 파일 apply4-2_run.py: 단계 1 요청 8건 판정 · 단계 2 조건 파일의 조건 출력</text>
</g>
