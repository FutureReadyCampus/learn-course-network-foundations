<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 4-1: sensitive.json, revoke_approve.py, 실행 파일을 만들어 승인 상태를 출력합니다</title>
<desc>config/sensitive.json 에는 쓰기 권한 세 개를 적습니다. revoke_approve.py 의 빈칸 두 곳(needs_approval 의 리턴 한 줄, mark_approvals 의 결정 꺼내기 한 줄)을 채우고 실행하면 승인 상태와 상태별 건수가 나옵니다. JSON 이 깨지면 승인이 필요한 계획이 2건으로 줄어듭니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 4-1 — 파일 세 개와 직접 쓰는 빈칸 두 곳</text>
<rect x="20" y="60" width="290" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="165" y="84.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">config/sensitive.json</text>
<text x="165" y="105.2" font-size="15" fill="#292929" text-anchor="middle">SALES:CHANGE · ACCOUNT:CHANGE</text>
<text x="165" y="126.2" font-size="15" fill="#292929" text-anchor="middle">SETTLE:CHANGE</text>
<path d="M165 140 L165 158" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="160" width="290" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="165" y="194.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">revoke_approve.py</text>
<text x="165" y="215.2" font-size="15" fill="#292929" text-anchor="middle">① needs_approval 의 return</text>
<text x="165" y="236.2" font-size="15" fill="#292929" text-anchor="middle">② mark_approvals 의 decision</text>
<path d="M165 260 L165 278" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="280" width="290" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="165" y="309.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">exercise4-1_run.py</text>
<text x="165" y="330.8" font-size="15" fill="#292929" text-anchor="middle">그대로 붙여 넣기</text>
<rect x="340" y="60" width="360" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="520" y="95.1" font-size="14" fill="#292929" text-anchor="middle">먼저 내용 확인</text>
<text x="520" y="114.7" font-size="14" fill="#292929" text-anchor="middle">python -m json.tool config/sensitive.json</text>
<rect x="340" y="155" width="360" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="520" y="184.8" font-size="15" fill="#292929" text-anchor="middle">파일이 깨지면 승인이 필요한 계획이</text>
<text x="520" y="205.8" font-size="15" fill="#292929" text-anchor="middle">3건 → 2건으로 줄어듦</text>
<line x1="310" y1="315" x2="325" y2="315" stroke="#666660" stroke-width="1.5"/>
<line x1="325" y1="269" x2="325" y2="326" stroke="#666660" stroke-width="1.5"/>
<path d="M325 269 L338 269" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<path d="M325 326 L338 326" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="340" y="245" width="360" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="520" y="274.2" font-size="15" fill="#292929" text-anchor="middle">단계 1 · 계획 8줄의 승인 상태</text>
<rect x="340" y="302" width="360" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="520" y="331.2" font-size="15" fill="#292929" text-anchor="middle">단계 2 · 승인 상태별 건수</text>
</g>
</svg>
