<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>승인이 필요 없으면 승인 불필요, 결정이 「승인」이면 승인됨, 없으면 승인 대기</title>
<desc>needs_approval 로 승인이 필요한지 먼저 봅니다. 필요하면 decisions.get(key) 로 「사용자:권한」 키의 결정(없으면 None)을 꺼내 승인됨이나 승인 대기를 적습니다. 이번 데이터에서 승인이 필요한 계획은 3건입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">2.1 승인 상태 정하기 — mark_approvals 의 갈림길</text>
<rect x="20" y="60" width="300" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="170" y="86.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">needs_approval?  ①</text>
<text x="170" y="107.8" font-size="15" fill="#292929" text-anchor="middle">민감한 권한 또는 영향 2건 이상</text>
<path d="M320 92 L398 92" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="330" y="84" font-size="14" fill="#666660" text-anchor="start">아니다</text>
<rect x="400" y="62" width="300" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="550" y="97.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">승인 불필요</text>
<path d="M170 124 L170 168" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="180" y="151" font-size="14" fill="#666660" text-anchor="start">그렇다</text>
<rect x="20" y="170" width="300" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="170" y="196.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">decision 이 「승인」?</text>
<text x="170" y="217.8" font-size="15" fill="#292929" text-anchor="middle">decision = decisions.get(key)  ②</text>
<path d="M320 202 L398 202" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="328" y="194" font-size="14" fill="#666660" text-anchor="start">그렇다</text>
<rect x="400" y="172" width="300" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="550" y="207.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">승인됨</text>
<path d="M170 234 L170 300 L398 300" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="180" y="268" font-size="14" fill="#666660" text-anchor="start">아니다 · 결정 없음</text>
<rect x="400" y="270" width="300" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="550" y="305.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">승인 대기</text>
<rect x="20" y="350" width="680" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="381.2" font-size="15" fill="#292929" text-anchor="middle">승인이 필요한 계획 3건: junho SALES:CHANGE(예외 2번) · dami 역할 해제 2건</text>
</g>
</svg>
