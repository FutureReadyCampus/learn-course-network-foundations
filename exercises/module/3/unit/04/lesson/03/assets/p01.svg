<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 4-2는 검토 중인 요청서를 승인·반려하고, 본인 요청과 두 번째 처리는 막는다</title>
<desc>검토 중(reviewing)인 요청서 네 장이 approve_request 와 reject_request 를 거칩니다. 처리되면 상태가 바뀌고 approver 가 적히며, 본인 요청이나 이미 처리된 요청서는 (False, 이유)로 막힙니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 4-2에서 만드는 것: 승인 · 반려 함수</text>
<rect x="30" y="70" width="190" height="160" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125" y="123.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">입력</text>
<text x="125" y="144.1" font-size="15" fill="#292929" text-anchor="middle">요청서 네 장</text>
<text x="125" y="165.1" font-size="15" fill="#292929" text-anchor="middle">status:</text>
<text x="125" y="186.1" font-size="15" fill="#292929" text-anchor="middle">"reviewing"</text>
<line x1="220" y1="150" x2="258" y2="150" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="260" y="70" width="210" height="160" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="365" y="123.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">프로그램</text>
<text x="365" y="144.1" font-size="15" fill="#292929" text-anchor="middle">req_review.py</text>
<text x="365" y="165.1" font-size="15" fill="#292929" text-anchor="middle">approve_request</text>
<text x="365" y="186.1" font-size="15" fill="#292929" text-anchor="middle">reject_request</text>
<line x1="470" y1="120" x2="488" y2="112" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<line x1="470" y1="180" x2="488" y2="192" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="490" y="62" width="210" height="84" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="87.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">처리됨</text>
<text x="595" y="108.6" font-size="15" fill="#292929" text-anchor="middle">approved · rejected</text>
<text x="595" y="129.6" font-size="15" fill="#292929" text-anchor="middle">approver 를 적음</text>
<rect x="490" y="154" width="210" height="84" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="595" y="179.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">막힘 (False, 이유)</text>
<text x="595" y="200.6" font-size="15" fill="#292929" text-anchor="middle">본인 요청</text>
<text x="595" y="221.6" font-size="15" fill="#292929" text-anchor="middle">이미 처리된 요청서</text>
<rect x="30" y="258" width="670" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="284.6" font-size="15" fill="#292929" text-anchor="middle">끝나면 보고서 실습 4-2 (가) · (나) · (다) 답을 씁니다</text>
</svg>
