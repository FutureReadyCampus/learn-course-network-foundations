<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img">
<title>실습 4-1 보고서에는 승인 상태별 건수와 민감한 권한에 승인을 받는 이유를 쓴다</title>
<desc>실습 4-1 보고서의 (가) (나) (다) 세 칸에 채울 내용을 체크리스트로 보여 준다. 승인 불필요, 승인됨, 승인 대기 건수와 junho 의 승인 대기 계획을 다룬다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 4-1 보고서 · 채울 칸</text>
<rect x="20" y="50" width="96" height="106" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="68" y="109" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="126" y="50" width="574" height="106" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="74" font-size="15" fill="#292929" font-weight="700">실행한 출력</text>
<rect x="142" y="85" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="97" font-size="15" fill="#292929">출력 전체(코드 상자에 붙여 넣기)</text>
<rect x="142" y="109" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="121" font-size="15" fill="#292929">승인 불필요 · 승인됨 · 승인 대기 건수</text>
<rect x="142" y="133" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="145" font-size="15" fill="#292929">승인 대기인 계획</text>
<rect x="20" y="166" width="96" height="82" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="68" y="204" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="68" y="225" font-size="14" fill="#e0442e" text-anchor="middle" font-weight="700">핵심 질문</text>
<rect x="126" y="166" width="574" height="82" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="190" font-size="15" fill="#292929" font-weight="700">권한을 없애는 일에도 승인을 받는 경우</text>
<rect x="142" y="201" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="213" font-size="15" fill="#292929">쓰기 같은 민감한 권한에 승인을 받는 이유</text>
<rect x="142" y="225" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="237" font-size="15" fill="#292929">조회 같은 일반 권한 한 건은 바로 회수해도 되는 이유</text>
<rect x="20" y="258" width="96" height="82" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="68" y="296" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="68" y="317" font-size="14" fill="#e0442e" text-anchor="middle" font-weight="700">핵심 질문</text>
<rect x="126" y="258" width="574" height="82" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="282" font-size="15" fill="#292929" font-weight="700">junho 의 SALES:CHANGE(예외 2번) · 승인 대기</text>
<rect x="142" y="293" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="305" font-size="15" fill="#292929">실습 4-2에서 이 계획이 처리되는 모습</text>
<rect x="142" y="317" width="13" height="13" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="164" y="329" font-size="15" fill="#292929">승인이 오래 안 날 때 생기는 문제</text>
