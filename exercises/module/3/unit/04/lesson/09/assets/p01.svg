<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>보고서는 질문의 「쓸 내용」을 보고 「답:」 뒤에 근거와 함께 쓴다</title>
<desc>문제를 풀 때마다 그 문제 제목 아래 질문에 답한다. 출력은 빈 코드 상자에, 설명은 답: 뒤에 쓴다. 왜를 묻는 질문은 내 화면의 값을 근거로 이유까지 쓰고, 모르면 「모름 — 막힌 곳: …」이라고 쓴다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 쓰는 순서</text>
<rect x="20" y="56" width="152" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="96" y="89.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 문제 풀기</text>
<text x="96" y="112.8" font-size="15" fill="#292929" text-anchor="middle">문제를 하나</text>
<text x="96" y="134.6" font-size="15" fill="#292929" text-anchor="middle">끝낼 때마다</text>
<polyline points="173,106 195,106" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="196" y="56" width="152" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="272" y="89.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 쓸 내용 읽기</text>
<text x="272" y="112.8" font-size="15" fill="#292929" text-anchor="middle">질문 아래</text>
<text x="272" y="134.6" font-size="15" fill="#292929" text-anchor="middle">「쓸 내용:」 확인</text>
<polyline points="349,106 371,106" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="372" y="56" width="152" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="448" y="89.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ 답: 뒤에 쓰기</text>
<text x="448" y="112.8" font-size="15" fill="#292929" text-anchor="middle">출력은 아래</text>
<text x="448" y="134.6" font-size="15" fill="#292929" text-anchor="middle">빈 코드 상자에</text>
<polyline points="525,106 547,106" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="548" y="56" width="152" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="624" y="89.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">④ 이유까지</text>
<text x="624" y="112.8" font-size="15" fill="#292929" text-anchor="middle">내 화면의 값을</text>
<text x="624" y="134.6" font-size="15" fill="#292929" text-anchor="middle">근거로 쓴다</text>
<text x="20" y="196" font-size="16" fill="#292929" font-weight="700">보고서 칸의 모양</text>
<rect x="20" y="210" width="420" height="150" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="238" font-size="15" fill="#292929">- (나) [핵심 질문] 질문 …</text>
<text x="56" y="264" font-size="15" fill="#666660">- 쓸 내용: ① … ② …</text>
<text x="56" y="290" font-size="15" fill="#292929">- 답: 여기에 씁니다</text>
<rect x="56" y="304" width="360" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="72" y="330" font-size="15" fill="#666660">출력이나 코드는 이 상자에 붙여 넣기</text>
<rect x="460" y="210" width="240" height="150" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580" y="246.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">답을 못 찾으면</text>
<text x="580" y="270.1" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
<text x="580" y="291.8" font-size="15" fill="#292929" text-anchor="middle">이라고 씁니다</text>
<text x="580" y="313.6" font-size="15" fill="#292929" text-anchor="middle">[핵심 질문]이 아니어도</text>
<text x="580" y="335.3" font-size="15" fill="#292929" text-anchor="middle">같은 말을 씁니다</text>
</g>
</svg>
