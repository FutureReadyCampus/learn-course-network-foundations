<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>현황 14건에서 후보 10건을 찾고 회수 제외 2건을 빼서 회수 대상 8건이 남았습니다</title>
<desc>Unit 3 점검은 현황 14건에서 규칙과 90일 미사용으로 후보 10건을 찾았습니다. 회수 제외 리스트 3건 중 dami 는 퇴사한 계정이라 빼지 않아 실제 제외는 2건이고, 남은 8건이 load_to_revoke 의 결과입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">회수 대상 8건이 나오기까지</text>
<rect x="20" y="56" width="150" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95.0" y="90.1" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">현황</text>
<text x="95.0" y="113.1" font-size="15" fill="#666660" text-anchor="middle">14건</text>
<polyline points="172,96 192,96" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="194" y="56" width="160" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="274.0" y="90.1" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">후보</text>
<text x="274.0" y="113.1" font-size="16" fill="#292929" text-anchor="middle">10건</text>
<polyline points="356,96 376,96" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="378" y="56" width="150" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="453.0" y="90.1" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">회수 제외</text>
<text x="453.0" y="113.1" font-size="16" fill="#292929" text-anchor="middle">2건 뺌</text>
<polyline points="530,96 550,96" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="552" y="56" width="148" height="80" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="626.0" y="90.1" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">회수 대상</text>
<text x="626.0" y="113.1" font-size="16" fill="#292929" text-anchor="middle">8건</text>
<text x="194" y="162" font-size="14" fill="#666660">규칙(퇴사 · 만료)과</text>
<text x="194" y="184" font-size="14" fill="#666660">90일 미사용으로 찾음</text>
<text x="552" y="162" font-size="14" fill="#666660">load_to_revoke 결과</text>
<rect x="20" y="210" width="680" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="243.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 제외 리스트는 3건이지만 실제 제외는 2건</text>
<text x="360.0" y="265.2" font-size="14" fill="#666660" text-anchor="middle">gaeun 의 ACCOUNT:CHANGE · seoyeon 의 SALES:CHANGE 는 뺌</text>
<text x="360.0" y="287.2" font-size="14" fill="#666660" text-anchor="middle">dami 는 퇴사한 계정이라 리스트에 있어도 빼지 않음</text>
</g>
</svg>
