<text x="130" y="260.8" font-size="15" fill="#292929" text-anchor="middle">create_request</text>
<rect x="260" y="188" width="200" height="92" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="208.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">req_review.py</text>
<text x="360" y="228.4" font-size="15" fill="#292929" text-anchor="middle">실습 4-2</text>
<text x="360" y="248.4" font-size="15" fill="#292929" text-anchor="middle">approve_request</text>
