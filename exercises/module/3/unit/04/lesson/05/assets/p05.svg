<text x="430" y="136" font-size="14" fill="#666660" text-anchor="middle">check_permission</text>
<line x1="640" y1="120" x2="640" y2="186" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<text x="630" y="160" font-size="14" fill="#666660" text-anchor="end">EXCEPTIONS</text>
<rect x="30" y="188" width="200" height="92" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
