<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>앞 실습 파일 완성본 세 개는 Unit 1의 rbac.py 와 Unit 2의 exception_policy.py 를 불러 쓴다</title>
<desc>앞 실습 파일을 못 만들었을 때 req_create.py, req_review.py, req_grant.py 완성본을 그대로 만들어 씁니다. req_create.py 는 USERS 를, req_grant.py 는 check_permission 과 EXCEPTIONS 를 불러옵니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">앞 실습 파일 완성본이 불러 쓰는 것</text>
