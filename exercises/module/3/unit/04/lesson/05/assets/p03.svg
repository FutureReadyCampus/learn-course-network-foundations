<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>권한을 받은 방식에 따라 회수 방법과 영향받는 사람이 달라 계획이 먼저 필요합니다</title>
<desc>예외로 받은 권한은 그 예외 한 건만 지우면 됩니다. 역할로 받은 권한은 역할 해제나 역할에서 권한 빼기가 필요하고, 역할에서 빼면 그 역할의 모든 사용자가 권한을 잃습니다. 그래서 지우기 전에 회수 계획을 만듭니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">왜 회수 계획이 필요한가 — 받은 방식마다 영향이 다르다</text>
<rect x="20" y="60" width="320" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="180" y="90.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외로 받은 권한</text>
<path d="M180 110 L180 133" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="135" width="320" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180" y="159.8" font-size="15" fill="#292929" text-anchor="middle">그 예외 한 건만 지움</text>
<text x="180" y="180.8" font-size="15" fill="#292929" text-anchor="middle">그 사람의 권한만 사라짐</text>
<rect x="380" y="60" width="320" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="90.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">역할로 받은 권한</text>
<path d="M540 110 L540 133" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="380" y="135" width="320" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="159.8" font-size="15" fill="#292929" text-anchor="middle">역할 해제 또는</text>
<text x="540" y="180.8" font-size="15" fill="#292929" text-anchor="middle">역할에서 권한 빼기</text>
<path d="M540 195 L540 218" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="380" y="220" width="320" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="540" y="244.8" font-size="15" fill="#292929" text-anchor="middle">역할에서 빼면 그 역할의</text>
<text x="540" y="265.8" font-size="15" fill="#292929" text-anchor="middle">모든 사용자가 잃음</text>
<rect x="20" y="300" width="680" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="327.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">그래서 지우기 전에 회수 계획(dry-run)부터 만듭니다</text>
</g>
</svg>
