<polyline points="540,89 560,89" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="562" y="54" width="138" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
