<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>마무리 정리: 올릴 파일 확인, 올리기, 올린 뒤 확인의 세 단계</title>
<desc>git status 로 올릴 파일을 확인하고 .env 나 .venv 가 보이면 멈춘다. git add, git commit, git push 로 올리고 브라우저에서 파일이 모두 있는지 확인한다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">마무리 정리</text>
<rect x="20" y="60" width="210" height="150" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="125" y="118.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="125" y="141.8" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<text x="125" y="163.6" font-size="15" fill="#292929" text-anchor="middle">.env · .venv 보이면 멈춤</text>
<polyline points="231,135 254,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="255" y="60" width="210" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="107.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올리기</text>
<text x="360" y="130.9" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<text x="360" y="152.7" font-size="15" fill="#292929" text-anchor="middle">git commit -m &quot;…&quot;</text>
<text x="360" y="174.4" font-size="15" fill="#292929" text-anchor="middle">git push</text>
<polyline points="466,135 489,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="490" y="60" width="210" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="118.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올린 뒤</text>
<text x="595" y="141.8" font-size="15" fill="#292929" text-anchor="middle">브라우저에서</text>
<text x="595" y="163.6" font-size="15" fill="#292929" text-anchor="middle">파일이 모두 있는지</text>
<text x="20" y="256" font-size="15" fill="#666660">서버 코드와 server_log.jsonl 이 함께 올라가야 Unit 5이 같은 로그에서 시작합니다.</text>
</g>
</svg>
