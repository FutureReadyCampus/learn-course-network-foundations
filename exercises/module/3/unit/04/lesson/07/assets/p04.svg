<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>check 함수는 값이 빠지면 400, 아니면 판정해 로그를 남기고 200 또는 403 으로 답한다</title>
<desc>check 는 주소에서 값 다섯 개를 꺼내고 parse_time 으로 시각을 바꾼다. None 이 있으면 400 으로 답하고, 없으면 evaluate_conditional 로 판정한 뒤 write_log 로 한 줄 덧붙이고 허용이면 200, 거부면 403 으로 답한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">응용 4-3 · check 함수의 흐름</text>
<rect x="20" y="52" width="330" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="78.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">값 다섯 개 꺼내기 (미리 채움)</text>
<text x="185" y="101.7" font-size="15" fill="#292929" text-anchor="middle">request.args.get(&quot;user&quot;) …</text>
<polyline points="185,117 185,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="136" width="330" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="162.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">시각 바꾸기 · parse_time (1 · 2번)</text>
<text x="185" y="185.7" font-size="15" fill="#292929" text-anchor="middle">모양이 틀리면 None</text>
<polyline points="185,201 185,219" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="220" width="330" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="252.2" font-size="15" fill="#292929" text-anchor="middle">None 이 하나라도 있나?</text>
<polyline points="351,247 419,247" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="385" y="238" font-size="14" fill="#666660" text-anchor="middle">있다</text>
<rect x="420" y="220" width="280" height="54" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="560" y="252.2" font-size="15" fill="#292929" text-anchor="middle">400 입력이 잘못됨 · 로그 없음</text>
<polyline points="185,275 185,293" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="294" width="330" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="326.2" font-size="15" fill="#292929" text-anchor="middle">판정 · evaluate_conditional (4번)</text>
<polyline points="185,349 185,367" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="368" width="330" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="395.2" font-size="15" fill="#292929" text-anchor="middle">write_log · mode = &quot;a&quot; (3번)</text>
<polyline points="351,390 419,340" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="351,390 419,390" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="420" y="314" width="280" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="560" y="343.2" font-size="15" fill="#292929" text-anchor="middle">allowed 참 → 200 (5 · 6번)</text>
<rect x="420" y="368" width="280" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="560" y="395.2" font-size="15" fill="#292929" text-anchor="middle">거짓 → 403 (7번)</text>
</g>
</svg>
