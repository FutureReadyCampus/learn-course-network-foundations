<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>도전 4-3 정답: 200이 3건, 403이 5건, 400이 1건이고 로그는 8줄이다</title>
<desc>요청 9건 중 1·4·5번은 200, 2·3·6·7·8번은 403, network 를 빠뜨린 9번은 400 이다. 400 요청은 로그에 남지 않아 판정까지 간 응답 8건과 로그 8줄이 같다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 4-3 정답 · 응답과 로그 대조</text>
<rect x="20" y="56" width="160" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="105.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">요청 9건</text>
<text x="100" y="128.7" font-size="15" fill="#292929" text-anchor="middle">send_checks.py</text>
<rect x="240" y="52" width="230" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="355" y="72.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">200 · 3건</text>
<text x="355" y="95.7" font-size="15" fill="#292929" text-anchor="middle">1 · 4 · 5번 허용</text>
<polyline points="181,111 239,78" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="240" y="114" width="230" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="355" y="134.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">403 · 5건</text>
<text x="355" y="157.7" font-size="15" fill="#292929" text-anchor="middle">2 · 3 · 6 · 7 · 8번 거부</text>
<polyline points="181,111 239,140" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="240" y="176" width="230" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="355" y="196.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">400 · 1건</text>
<text x="355" y="219.7" font-size="15" fill="#292929" text-anchor="middle">9번 network 빠짐</text>
<polyline points="181,111 239,202" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="471,78 529,120" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="471,140 529,140" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="530" y="90" width="170" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="615" y="129.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">server_log</text>
<text x="615" y="152.7" font-size="15" fill="#292929" text-anchor="middle">8줄</text>
<text x="615" y="204" font-size="14" fill="#666660" text-anchor="middle">400 은 로그 없음</text>
<rect x="20" y="236" width="680" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="268.2" font-size="15" fill="#292929" text-anchor="middle">단계 3: 판정까지 간 응답 8 건 / 로그에 남은 줄 8 줄</text>
<text x="20" y="326" font-size="15" fill="#666660">자주 틀리는 곳: 거부를 403 대신 200 으로 답하면 화면은 같아 보여도</text>
<text x="20" y="350" font-size="15" fill="#666660">상태 코드만 보는 프로그램은 거부를 허용으로 오해합니다.</text>
</g>
</svg>
