<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>실습 4-2 정답: 실행 7건, 대기 1건이고 판정이 바뀐 것은 junho SALES:QUERY 1건</title>
<desc>승인 대기인 junho 의 예외 2번만 실행하지 않습니다. 실행한 7건 중 6건은 회수 전에도 이미 거부라 판정이 그대로입니다. 이력 8건을 저장하고 다시 읽으며, 승인 대기 검사를 빼면 실행 8건이 됩니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
