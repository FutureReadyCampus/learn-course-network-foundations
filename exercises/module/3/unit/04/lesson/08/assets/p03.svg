<text x="595" y="85.8" font-size="15" fill="#292929" text-anchor="middle">junho SALES:QUERY</text>
<rect x="490" y="110" width="210" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="595" y="134.8" font-size="15" fill="#292929" text-anchor="middle">그대로 6건</text>
<text x="595" y="155.8" font-size="15" fill="#292929" text-anchor="middle">회수 전에도 이미 거부</text>
