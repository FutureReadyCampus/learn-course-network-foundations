<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>check_permission 과 find_exception 을 합쳐 evaluate_access 하나로 판정하는 실습 1-3</title><desc>실습 1-2 의 역할 판정과 제공 파일의 예외 판정을 policy.py 의 evaluate_access 가 불러 씁니다. 요청 하나를 넣으면 허용 여부와 이유가 한 번에 나옵니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">실습 1-3 · 최종 판정 함수</text><rect x="15" y="65" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="125" y="99.75" font-weight="700">check_permission</tspan><tspan x="125" dy="21">실습 1-2 · 역할 판정</tspan></text><rect x="15" y="185" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="125" y="219.75" font-weight="700">find_exception</tspan><tspan x="125" dy="21">제공 파일 · 예외 판정</tspan></text><line x1="239" y1="105" x2="286" y2="150" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><line x1="239" y1="225" x2="286" y2="185" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="290" y="105" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="395" y="140.5" font-weight="700">policy.py</tspan><tspan x="395" dy="19.6">evaluate_access</tspan><tspan x="395" dy="19.6">사용자 · 자원 · 행위</tspan><tspan x="395" dy="19.6">· 지금 시각</tspan></text><line x1="504" y1="165" x2="541" y2="165" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="545" y="115" width="160" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="625" y="159.75" font-weight="700">결과 하나</tspan><tspan x="625" dy="21">(허용 여부, 이유)</tspan></text><text x="360" y="305" font-size="15" text-anchor="middle" fill="#666660">오늘 요청 아홉 건을 판정 · 퇴사자는 예외가 남아 있어도 거부</text></g></svg>
