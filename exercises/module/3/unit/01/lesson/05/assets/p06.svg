<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img"><title>policy.py 를 쓰고 exercise1-3_run.py 로 요청 아홉 건을 판정해 보고서에 적는 흐름</title><desc>evaluate_access 본문을 직접 쓴 뒤 exercise1-3_run.py 를 실행하면 아홉 건의 결과, 만료 뒤 시도, 방식별·예외별 건수가 나옵니다. 채우기 전에 실행하면 퇴사자 dami 가 예외 3번으로 허용됩니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">실습 1-3 · 최종 판정 함수와 아홉 건 읽기</text><rect x="15" y="55" width="210" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="120" y="100.3" font-weight="700">1. policy.py</tspan><tspan x="120" dy="19.6">evaluate_access</tspan><tspan x="120" dy="19.6">3번 두 줄 직접 씀</tspan></text><line x1="228" y1="115" x2="252" y2="115" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="255" y="55" width="210" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="100.3" font-weight="700">2. 실행</tspan><tspan x="360" dy="19.6">exercise1-3_run.py</tspan><tspan x="360" dy="19.6">TODAY_LOG 9건</tspan></text><line x1="468" y1="115" x2="492" y2="115" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="495" y="55" width="210" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="600" y="90.5" font-weight="700">3. 출력 읽기</tspan><tspan x="600" dy="19.6">아홉 건의 결과</tspan><tspan x="600" dy="19.6">[만료 뒤 시도] 줄</tspan><tspan x="600" dy="19.6">방식별 · 예외별 건수</tspan></text><text x="15" y="212" font-size="15" text-anchor="start" fill="#666660" font-weight="700">보고서</text><rect x="15" y="225" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="125" y="250.3" font-weight="700">(가)</tspan><tspan x="125" dy="19.6">출력 전체 · 만료 뒤 시도</tspan><tspan x="125" dy="19.6">· 예외 1번 쓰인 횟수</tspan></text><rect x="250" y="225" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="250.3" font-weight="700">(나)</tspan><tspan x="360" dy="19.6">3번 주석이 없다면</tspan><tspan x="360" dy="19.6">dami 는 어떻게 되나</tspan></text><rect x="485" y="225" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="595" y="250.3" font-weight="700">(다)</tspan><tspan x="595" dy="19.6">파일 흐름을 글자로 그리고</tspan><tspan x="595" dy="19.6">깨진 설정이 멈추는 곳</tspan></text><text x="360" y="345" font-size="15" text-anchor="middle" fill="#666660">채우기 전에 실행하면 dami 가 True 예외 3번 (퇴사자가 열림)</text></g></svg>
