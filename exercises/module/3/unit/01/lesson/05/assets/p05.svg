<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>정답 마무리는 위치 확인, git status, add, commit, push 순서이고 .env 가 없어야 한다</title>
<desc>cd .. 와 pwd 로 security-agent-toolkit 위치를 확인하고 git status 로 올릴 파일을 본다. 그다음 add, commit, push 를 하며, 보고서 (가)의 한 예는 줄 1개에 .env 와 .venv 는 없음이다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 마무리: 확인하고 올리기</text>
<rect x="20" y="56" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="86.2" font-size="15" fill="#292929" text-anchor="middle">cd ..</text>
<polyline points="221,81 259,81" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="260" y="56" width="200" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="86.2" font-size="15" fill="#292929" text-anchor="middle">pwd</text>
<polyline points="461,81 499,81" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="500" y="56" width="200" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600" y="86.2" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<rect x="20" y="146" width="200" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="120" y="176.2" font-size="15" fill="#292929" text-anchor="middle">git push</text>
<rect x="260" y="146" width="200" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="176.2" font-size="15" fill="#292929" text-anchor="middle">git commit -m "…"</text>
<rect x="500" y="146" width="200" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="600" y="176.2" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<polyline points="600,107 600,145" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="499,171 461,171" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="259,171 221,171" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="230" width="680" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="260.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(가) 한 예: 줄 1개 (access_control/) · .env · .venv 없음</text>
<text x="360" y="282.2" font-size="15" fill="#292929" text-anchor="middle">줄 수와 이름은 학생마다 다를 수 있다</text>
</g>
</svg>
