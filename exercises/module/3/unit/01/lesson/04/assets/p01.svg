<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 1-3 전에 예외 판정 준비 세 개를 복사해 두면 policy.py 가 예외 판정까지 이어서 실행된다</title>
<desc>exercise1-3_run.py 는 policy.py 를 부르고, policy.py 는 실습 1-2의 rbac.py 와 예외 판정 준비 exception_policy.py 를 부릅니다. exception_policy.py 는 예외 판정 준비 config/exceptions.json 을 읽고, config_loader.py 는 다음 Unit부터 씁니다.</desc>
