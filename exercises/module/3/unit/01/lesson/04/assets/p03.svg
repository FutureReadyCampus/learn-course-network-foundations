<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>find_exception 은 사람과 권한이 같고 지금이 만료 시각보다 앞인 예외만 유효하다고 본다</title>
<desc>예외를 하나씩 꺼내 사람과 권한이 같은지 보고, 같으면 만료 시각을 시각으로 바꿔 지금과 비교합니다. 만료 전이면 (True, 번호)를 바로 리턴하고, 다르거나 만료면 다음 예외로 가며, 끝까지 못 찾으면 (False, None)을 리턴합니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">exception_policy.py · find_exception(user, permission, now)</text>
<rect x="24" y="56" width="250" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="149" y="87" font-size="15" text-anchor="middle">예외를 하나씩 꺼낸다</text>
<polyline points="149,107 149,131" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="132" width="250" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="149" y="158" font-size="15" text-anchor="middle">사람과 권한이</text>
<text x="149" y="180" font-size="15" text-anchor="middle">둘 다 같은가?</text>
<polyline points="149,193 149,217" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="160" y="210" font-size="14" fill="#666660">같다</text>
<rect x="24" y="218" width="250" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="149" y="244" font-size="15" text-anchor="middle">now &lt; expires ?</text>
<text x="149" y="266" font-size="14" text-anchor="middle" fill="#666660">만료 정각에는 이미 거부</text>
<polyline points="149,279 149,303" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="160" y="296" font-size="14" fill="#666660">앞이다</text>
<rect x="24" y="304" width="250" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="149" y="330" font-size="15" text-anchor="middle" font-weight="700">(True, 예외 번호)</text>
<text x="149" y="352" font-size="14" text-anchor="middle">바로 리턴</text>
<polyline points="275,162 340,162" fill="none" stroke="#666660" stroke-width="1.8"/>
<polyline points="275,248 340,248 340,81 276,81" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="352" y="150" font-size="14" fill="#666660">다르거나 만료면</text>
<text x="352" y="170" font-size="14" fill="#666660">다음 예외로</text>
<rect x="434" y="304" width="262" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="565" y="330" font-size="15" text-anchor="middle" font-weight="700">(False, None)</text>
<text x="565" y="352" font-size="14" text-anchor="middle">모든 예외를 봐도 못 찾으면</text>
<rect x="476" y="96" width="220" height="132" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="490" y="122" font-size="14" font-weight="700">예 · 지금 14:00</text>
<text x="490" y="146" font-size="14">seoyeon SETTLE:QUERY</text>
<text x="490" y="166" font-size="14">→ (True, 1)</text>
<text x="490" y="192" font-size="14">gaeun SETTLE:QUERY</text>
<text x="490" y="212" font-size="14">→ (False, None)</text>
</g>
</svg>
