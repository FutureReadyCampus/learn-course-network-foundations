<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>Unit 1 를 마치며 access_control 폴더의 새 파일과 보고서 칸을 확인하는 목록</title><desc>access_control 에 오늘 만든 파이썬 파일 여섯 개와 config/exceptions.json 이 있어야 하고, users.json 과 roles.json 은 Unit 1 그대로입니다. 보고서의 빈 답을 확인하고, 깃허브 올리기는 Unit 1 의 도전 1-5 에서 합니다.</desc><defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">Unit 1 마무리 · 파일과 보고서 칸 확인</text><rect x="15" y="52" width="370" height="330" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="35" y="85" font-size="15" text-anchor="start" fill="#292929" font-weight="700">access_control/</text><rect x="55" y="97" width="114.9" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="116" font-size="15" text-anchor="start" fill="#292929">role_admin.py</text><rect x="55" y="128" width="162.3" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="147" font-size="15" text-anchor="start" fill="#292929">exception_policy.py</text><rect x="55" y="159" width="81.3" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="178" font-size="15" text-anchor="start" fill="#292929">policy.py</text><rect x="55" y="190" width="156.6" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="209" font-size="15" text-anchor="start" fill="#292929">challenge1-2_run.py</text><rect x="55" y="221" width="156.6" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="240" font-size="15" text-anchor="start" fill="#292929">challenge1-3_run.py</text><rect x="55" y="252" width="156.6" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="61" y="271" font-size="15" text-anchor="start" fill="#292929">exercise1-3_run.py</text><text x="61" y="302" font-size="15" text-anchor="start" fill="#292929" font-weight="700">config/</text><rect x="81" y="314" width="136.5" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="87" y="333" font-size="15" text-anchor="start" fill="#292929">exceptions.json</text><text x="87" y="364" font-size="14" text-anchor="start" fill="#666660">users.json · roles.json (Unit 1 그대로)</text><rect x="410" y="65" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="440" y="80" font-size="15" text-anchor="start" fill="#292929">ls · ls config 로 파일 확인</text><rect x="410" y="105" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="440" y="120" font-size="15" text-anchor="start" fill="#292929">보고서 도전 1-2 · 2-2 · 2-3 칸</text><rect x="410" y="145" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="440" y="160" font-size="15" text-anchor="start" fill="#292929">「답:」 뒤가 빈 질문이 없다</text><rect x="405" y="210" width="300" height="172" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="555" y="261.7" font-weight="700">다음 Unit 1</tspan><tspan x="555" dy="19.6">설정 파일이 없거나 깨져도</tspan><tspan x="555" dy="19.6">안전하게 거부하기</tspan><tspan x="555" dy="19.6">테스트 네 가지로 검증</tspan><tspan x="555" dy="19.6">git 올리기는 도전 1-5 마지막</tspan></text></g></svg>
