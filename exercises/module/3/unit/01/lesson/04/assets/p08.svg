<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>마무리 15분은 오늘 한 일 확인, 파일 확인, git status 확인, add·commit·push 순서로 한다</title>
<desc>핵심 실습 세 개를 끝낸 뒤 보고서 칸과 파일을 확인하고, git status 에서 .env 나 .venv 가 보이면 멈춥니다. 문제가 없으면 add, commit, push 로 올리고 브라우저에서 확인합니다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">이번 Unit 마무리 · 15분</text>
<rect x="24" y="54" width="156" height="118" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="102" y="84" font-size="16" text-anchor="middle" font-weight="700">1. 한 일 확인</text>
<text x="102" y="110" font-size="14" text-anchor="middle">실습 1-1 ~ 1-3</text>
<text x="102" y="132" font-size="14" text-anchor="middle">보고서 빈칸</text>
<text x="102" y="154" font-size="14" text-anchor="middle">없는지</text>
<polyline points="181,113 195,113" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="196" y="54" width="156" height="118" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="84" font-size="16" text-anchor="middle" font-weight="700">2. 파일 확인</text>
<text x="274" y="110" font-size="14" text-anchor="middle">ls · ls config</text>
<text x="274" y="132" font-size="14" text-anchor="middle">policy.py 와</text>
<text x="274" y="154" font-size="14" text-anchor="middle">exceptions.json</text>
<polyline points="353,113 367,113" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="368" y="54" width="156" height="118" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="446" y="84" font-size="16" text-anchor="middle" font-weight="700">3. git status</text>
<text x="446" y="110" font-size="14" text-anchor="middle">.env · .venv 가</text>
<text x="446" y="132" font-size="14" text-anchor="middle">보이면 멈추고</text>
<text x="446" y="154" font-size="14" text-anchor="middle">.gitignore 에 적기</text>
<polyline points="525,113 539,113" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p08)"/>
<rect x="540" y="54" width="156" height="118" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="618" y="84" font-size="16" text-anchor="middle" font-weight="700">4. 올리기</text>
<text x="618" y="110" font-size="14" text-anchor="middle">git add .</text>
<text x="618" y="132" font-size="14" text-anchor="middle">git commit -m</text>
<text x="618" y="154" font-size="14" text-anchor="middle">git push</text>
<text x="24" y="214" font-size="17" font-weight="700">오늘 만든 파일이 이어지는 곳</text>
<rect x="24" y="230" width="672" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="258" font-size="15">users.json · roles.json · rbac.py → Module 3 끝까지 그대로 씀</text>
<rect x="24" y="284" width="672" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="312" font-size="15">policy.py 의 evaluate_access → Unit 2 권한 주기에서 판정 비교</text>
<rect x="24" y="338" width="672" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="366" font-size="15">config_loader.py 의 load_json → Unit 2부터 설정 파일 읽기</text>
</g>
</svg>
