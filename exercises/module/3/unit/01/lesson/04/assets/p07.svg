<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>실습 1-3 에서 쓴 코드와 말을 여섯 줄로 정리한 표</title><desc>역할 판정을 먼저 하고, 권한 없음이 아닌 이유면 바로 거부합니다. 그다음 find_exception 으로 예외를 찾고, 이유를 남기며, 방식별 건수와 만료 뒤 시도를 셉니다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">실습 1-3 정리</text><rect x="15" y="52" width="690" height="40" rx="2" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="76.9" font-weight="700">하려는 일</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="76.9" font-weight="700">코드 · 말</tspan></text><rect x="15" y="92" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="116.9">역할 판정 먼저</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="116.9">is_allowed, reason = check_permission(…)</tspan></text><rect x="15" y="132" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="156.9">사람이 막히면</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="156.9">if reason != &quot;권한 없음&quot;: return False, reason</tspan></text><rect x="15" y="172" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="196.9">예외 찾기</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="196.9">find_exception(user, f&quot;{resource}:{action}&quot;, now)</tspan></text><rect x="15" y="212" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="236.9">이유 남기기</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="236.9">&quot;역할 권한&quot; · f&quot;예외 {found_exception_id}번&quot; · 거부 이유</tspan></text><rect x="15" y="252" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="276.9">방식별로 세기</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="276.9">역할 권한 → 역할로 · 그 밖의 허용 → 예외로 · 거부</tspan></text><rect x="15" y="292" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="316.9">만료 뒤 시도</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="215" y="316.9">권한 없음 + 같은 사람 · 같은 권한의 예외가 리스트에 있음</tspan></text></g></svg>
