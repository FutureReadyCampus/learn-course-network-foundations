<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 415" role="img"><title>본보기로 도전 1-2 의 파일들이 어떤 함수를 호출하고 어떤 설정 파일을 읽는지 그린 흐름도</title><desc>challenge1-2_run.py 는 rbac.py 의 check_permission 과 role_admin.py 의 assign_role, revoke_access 를 호출합니다. rbac.py 는 불러올 때 users.json 과 roles.json 을 읽고, role_admin.py 는 rbac.py 의 ROLES 를 가져옵니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">3.3 본보기 · 도전 1-2 파일 사이의 흐름</text><rect x="230" y="46" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="73.25" font-weight="700">challenge1-2_run.py</tspan></text><line x1="360" y1="90" x2="360" y2="112" stroke="#666660" stroke-width="1.6"/><line x1="170" y1="112" x2="550" y2="112" stroke="#666660" stroke-width="1.6"/><line x1="170" y1="112" x2="170" y2="166" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><line x1="550" y1="112" x2="550" y2="166" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><text x="180" y="142" font-size="14" text-anchor="start" fill="#292929">1. check_permission()</text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="560" y="127.1">2. assign_role() ·</tspan><tspan x="560" dy="19.6">revoke_access()</tspan></text><rect x="40" y="170" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="170" y="197.25" font-weight="700">rbac.py</tspan></text><rect x="420" y="170" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="550" y="197.25" font-weight="700">role_admin.py</tspan></text><line x1="170" y1="216" x2="170" y2="266" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><text x="180" y="246" font-size="14" text-anchor="start" fill="#666660">읽음 (불러올 때 한 번)</text><line x1="550" y1="216" x2="550" y2="266" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><text x="560" y="246" font-size="14" text-anchor="start" fill="#666660">가져옴</text><rect x="40" y="270" width="260" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="170" y="296.1">config/users.json</tspan><tspan x="170" dy="19.6">config/roles.json</tspan></text><rect x="420" y="270" width="260" height="62" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="550" y="305.9">rbac.py 의 ROLES</tspan></text><text x="360" y="368" font-size="14" text-anchor="middle" fill="#666660">상자 = 파일 · 화살표 옆 = 호출하는 함수 · 읽음 = 설정 파일</text><text x="360" y="395" font-size="15" text-anchor="middle" fill="#292929">설정 파일이 깨지면 그 파일을 불러오는 화살표에서 멈춥니다</text></g></svg>
