<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>예외는 사람·권한이 같고 지금이 만료 전일 때만 유효합니다</title>
<desc>도전 1-3 정답의 find_exception 흐름과 단계 2 회수 리스트입니다. 2번과 5번은 만료되어, 3번은 퇴사자라서 회수합니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">도전 1-3 정답 · 지금 유효한 예외 찾기</text>
<rect x="24" y="56" width="310" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="179" y="85" font-size="14" text-anchor="middle">for exception in EXCEPTIONS</text>
<rect x="24" y="128" width="310" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="179" y="157.4" font-size="15" text-anchor="middle">user · permission 이 같은가?</text>
<rect x="24" y="200" width="310" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="179" y="229.4" font-size="15" text-anchor="middle">now &lt; expires ? (만료 전)</text>
<rect x="24" y="272" width="310" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="179" y="301.4" font-size="15" text-anchor="middle">return True, 예외 번호</text>
<rect x="24" y="336" width="310" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="179" y="365" font-size="14" text-anchor="middle">끝까지 없으면 return False, None</text>
<path d="M179,104 L179,126" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<path d="M179,176 L179,198" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="188" y="192" font-size="14" fill="#666660">예</text>
<path d="M179,248 L179,270" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="188" y="264" font-size="14" fill="#666660">예</text>
<text x="370" y="74" font-size="16" font-weight="700">단계 2 · 회수 리스트</text>
<rect x="370" y="90" width="326" height="42" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="384" y="116.4" font-size="15">1 seoyeon · 유지</text>
<rect x="370" y="140" width="326" height="42" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="384" y="166.4" font-size="15">2 junho · 회수 (만료됨)</text>
<rect x="370" y="190" width="326" height="42" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="384" y="216.4" font-size="15">3 dami · 회수 (퇴사자)</text>
<rect x="370" y="240" width="326" height="42" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="384" y="266.4" font-size="15">4 batch-night · 유지</text>
<rect x="370" y="290" width="326" height="42" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="384" y="316.4" font-size="15">5 gaeun · 회수 (만료됨)</text>
<text x="370" y="368" font-size="14" fill="#666660">3번은 유효해도 퇴사자라서 바로 회수</text>
</g>
</svg>
