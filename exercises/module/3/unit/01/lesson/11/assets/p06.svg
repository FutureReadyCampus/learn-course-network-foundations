<path d="M273,292 L273,326" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<text x="282" y="314" font-size="14" fill="#666660">아니오</text>
<text x="372" y="170" font-size="14" fill="#666660">hana: 'salse' 는 ROLES 에 없어 거부</text>
<text x="372" y="192" font-size="14" fill="#666660">→ 사용자 항목도 만들지 않음</text>
<text x="372" y="338" font-size="14" fill="#666660">seoyeon: sales → finance 로 바꿈</text>
<text x="372" y="360" font-size="14" fill="#666660">→ SALES CHANGE 거부, SETTLE QUERY 허용</text>
<text x="24" y="404" font-size="15">역할을 하나 더 붙이지 않고 새 역할로 바꿔서 이전 권한이 남지 않게 합니다</text>
</g>
</svg>
