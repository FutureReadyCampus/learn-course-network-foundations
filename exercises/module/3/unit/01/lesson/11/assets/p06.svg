<path d="M273,124 L273,158" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<text x="282" y="146" font-size="14" fill="#666660">아니오</text>
<rect x="24" y="228" width="150" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="99" y="254.9" font-size="16" text-anchor="middle" font-weight="700">revoke_access</text>
<text x="99" y="275.9" font-size="15" text-anchor="middle">(name)</text>
<rect x="198" y="228" width="150" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="273" y="254.9" font-size="15" text-anchor="middle">name 이</text>
<text x="273" y="275.9" font-size="15" text-anchor="middle">users 에 있나?</text>
<rect x="372" y="228" width="150" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447" y="254.9" font-size="15" text-anchor="middle">employed</text>
<text x="447" y="275.9" font-size="15" text-anchor="middle">= False</text>
<rect x="546" y="228" width="150" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="621" y="265.4" font-size="15" text-anchor="middle">(True, '회수')</text>
<rect x="188" y="328" width="172" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
