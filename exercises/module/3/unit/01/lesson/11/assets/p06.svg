<text x="273" y="107.9" font-size="15" text-anchor="middle">ROLES 에 있나?</text>
<rect x="372" y="60" width="150" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447" y="86.9" font-size="15" text-anchor="middle">users[name] =</text>
<text x="447" y="107.9" font-size="15" text-anchor="middle">새 역할 · 재직</text>
<rect x="546" y="60" width="150" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="621" y="97.4" font-size="15" text-anchor="middle">(True, '부여')</text>
<rect x="188" y="160" width="172" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="274" y="189" font-size="14" text-anchor="middle">(False, '없는 역할')</text>
<path d="M174,92 L196,92" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<path d="M348,92 L370,92" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
