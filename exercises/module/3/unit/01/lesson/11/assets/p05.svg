<rect x="380" y="336" width="18" height="18" rx="3" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="406" y="351" font-size="14" fill="#292929">줄일 것 (한 예) · 재무 일에 근거 없음</text>
<rect x="380" y="366" width="18" height="18" rx="3" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="406" y="381" font-size="14" fill="#292929">남길 것 (한 예) · 계정 관리자가 맡은 일</text>
<rect x="380" y="396" width="18" height="18" rx="3" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="406" y="411" font-size="14" fill="#292929">auditor · 사용자가 없어 빼고 고름</text>
