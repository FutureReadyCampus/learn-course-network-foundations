<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>도전 1-3 보고서에 채울 칸: 출력, 만료 없는 예외, batch-night 연장 판단</title>
<desc>도전 1-3 보고서의 (가)~(다) 질문마다 써야 할 내용을 체크리스트로 보여 줍니다. 출력은 단계 1 여섯 줄과 단계 2 다섯 줄입니다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">도전 1-3 보고서 · 채울 칸</text>
<rect x="24" y="52" width="672" height="94" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="74" font-size="16" font-weight="700">(가) 출력과 회수할 예외</text>
<rect x="44" y="86" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="98" font-size="15">단계 1 출력 여섯 줄 · 단계 2 출력 다섯 줄</text>
<rect x="44" y="112" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="124" font-size="15">회수할 예외의 번호</text>
<rect x="24" y="158" width="672" height="94" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="40" y="180" font-size="16" font-weight="700">(나) [핵심 질문] 만료 시각이 비어도 접수된다면</text>
<rect x="44" y="192" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="204" font-size="15">쌓이는 일과 1년 뒤 감사 지적</text>
<rect x="44" y="218" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="230" font-size="15">만료를 반드시 적게 하는 규칙</text>
<rect x="24" y="264" width="672" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="40" y="286" font-size="16" font-weight="700">(다) [핵심 질문] batch-night 예외 4번 연장 요청</text>
<rect x="44" y="298" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="310" font-size="15">연장 전에 확인할 것</text>
<rect x="44" y="324" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="336" font-size="15">연장 조건, 또는 거절하고 낼 대안</text>
<rect x="44" y="350" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="362" font-size="15">그렇게 판단한 이유</text>
</g>
</svg>
