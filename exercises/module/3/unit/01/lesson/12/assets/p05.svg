<text x="68" y="124" font-size="15">[만료 뒤 시도] 세 건의 사용자와 끝난 예외 번호</text>
<rect x="44" y="138" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="150" font-size="15">예외 1번이 쓰인 횟수</text>
<rect x="24" y="184" width="672" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="40" y="206" font-size="16" font-weight="700">(나) [응용] 3번 주석이 없다면 dami 는?</text>
<rect x="44" y="218" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
