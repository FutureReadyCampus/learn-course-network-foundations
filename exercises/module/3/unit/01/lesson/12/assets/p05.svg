<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img">
<title>실습 1-3 보고서와 마무리에 채울 칸: 출력, 3번 주석이 없을 때, 파일 흐름 그림, git status</title>
<desc>실습 1-3 보고서의 (가)~(다) 질문마다 써야 할 내용을 체크리스트로 보여 줍니다. 응용 (다)는 exercise1-3_run.py 에서 출발하는 글자 그림이고, 마지막 마무리 (가)는 올리기 전 git status 확인입니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">실습 1-3 보고서와 마무리 · 채울 칸</text>
<rect x="24" y="52" width="672" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="74" font-size="16" font-weight="700">(가) [핵심 질문] 출력과 만료 뒤 시도</text>
<rect x="44" y="86" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
