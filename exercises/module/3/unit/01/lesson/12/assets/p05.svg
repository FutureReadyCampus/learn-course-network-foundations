<rect x="44" y="244" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="256" font-size="15">3.1 그림의 어느 단계를 거치는지</text>
<rect x="44" y="270" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
<text x="68" y="282" font-size="15">이어질 수 있는 사고</text>
<rect x="24" y="316" width="672" height="94" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="40" y="338" font-size="16" font-weight="700">(다) [응용] 파일 흐름 그림</text>
<rect x="44" y="350" width="14" height="14" rx="2" fill="#ffffff" stroke="#666660" stroke-width="1.4"/>
