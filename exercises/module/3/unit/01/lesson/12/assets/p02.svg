<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>질문을 읽고 쓸 내용대로 답을 쓰며, 글쓰기 40분은 핵심 질문 답, 글 한 편, 도전 질문 순서로 쓴다</title>
<desc>위쪽은 질문 하나를 채우는 순서(질문 읽기, 쓸 내용 확인, 답: 뒤에 근거와 함께 쓰기)입니다. 아래쪽은 글쓰기 40분에 하는 일 세 가지이고, 도전 질문은 선택입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">질문 하나를 채우는 순서</text>
<rect x="24" y="52" width="200" height="74" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="124" y="82" font-size="16" text-anchor="middle" font-weight="700">질문 읽기</text>
<text x="124" y="106" font-size="14" text-anchor="middle" fill="#666660">[핵심 질문] 먼저</text>
<polyline points="225,89 251,89" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="252" y="52" width="200" height="74" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="352" y="82" font-size="16" text-anchor="middle" font-weight="700">쓸 내용 확인</text>
<text x="352" y="106" font-size="14" text-anchor="middle" fill="#666660">무엇을 쓰면 되는지</text>
<polyline points="453,89 479,89" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="480" y="52" width="216" height="74" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="588" y="82" font-size="16" text-anchor="middle" font-weight="700">답: 뒤에 쓰기</text>
<text x="588" y="106" font-size="14" text-anchor="middle">본 값과 이유까지</text>
<text x="24" y="170" font-size="19" font-weight="700">글쓰기 40분</text>
<rect x="24" y="188" width="212" height="112" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="130" y="220" font-size="16" text-anchor="middle" font-weight="700">1. 핵심 질문 답</text>
<text x="130" y="246" font-size="14" text-anchor="middle">실습 1-1 ~ 1-3의</text>
<text x="130" y="268" font-size="14" text-anchor="middle">답을 내 말로 다듬기</text>
<polyline points="237,244 253,244" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="254" y="188" width="212" height="112" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="220" font-size="16" text-anchor="middle" font-weight="700">2. 글 한 편</text>
<text x="360" y="246" font-size="14" text-anchor="middle">오래 고민한 질문 하나로</text>
<text x="360" y="268" font-size="14" text-anchor="middle">내 기록 남기기</text>
<polyline points="467,244 483,244" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="484" y="188" width="212" height="112" rx="8" fill="#ffffff" stroke="#666660" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590" y="220" font-size="16" text-anchor="middle" font-weight="700">3. 도전 질문</text>
<text x="590" y="246" font-size="14" text-anchor="middle">선택 · 도전을</text>
<text x="590" y="268" font-size="14" text-anchor="middle">한 경우에만</text>
<text x="24" y="336" font-size="15" fill="#666660">답을 못 찾았으면 「모름 — 막힌 곳: …」 으로 적습니다</text>
</g>
</svg>
