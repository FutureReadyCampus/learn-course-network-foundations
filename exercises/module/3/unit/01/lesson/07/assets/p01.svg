<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>인사팀 통보 세 건을 role_admin.py 의 두 함수로 처리하고 전후 판정을 비교하는 실습</title><desc>입력은 minsu 입사, seoyeon 이동, junho 퇴사 통보입니다. role_admin.py 의 assign_role 과 revoke_access 로 처리하고, 같은 요청을 인사 변경 전후에 판정해 보고서 (가)~(다)에 적습니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">도전 1-2 · 역할 부여 · 회수 함수</text><rect x="15" y="70" width="220" height="200" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="125" y="145.5" font-weight="700">인사팀 통보</tspan><tspan x="125" dy="19.6">① minsu 입사 · 영업</tspan><tspan x="125" dy="19.6">② seoyeon 영업 → 재무</tspan><tspan x="125" dy="19.6">③ junho 퇴사</tspan></text><line x1="240" y1="170" x2="262" y2="170" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="268" y="70" width="210" height="200" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="373" y="143.75" font-weight="700">role_admin.py</tspan><tspan x="373" dy="21">assign_role</tspan><tspan x="373" dy="21">revoke_access</tspan><tspan x="373" dy="21">없는 역할은 거부</tspan></text><line x1="483" y1="170" x2="505" y2="170" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="511" y="70" width="194" height="200" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="608" y="145.5" font-weight="700">결과</tspan><tspan x="608" dy="19.6">인사 변경 전 · 후</tspan><tspan x="608" dy="19.6">같은 요청 판정 비교</tspan><tspan x="608" dy="19.6">보고서 (가)~(다)</tspan></text><text x="360" y="302" font-size="14" text-anchor="middle" fill="#666660">입력 → 내가 쓰는 함수 → 읽고 적을 것</text></g></svg>
