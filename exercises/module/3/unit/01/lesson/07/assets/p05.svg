<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>apply1-2_run.py 가 전 판정, 통보 처리, 후 판정을 차례로 출력하고 질문을 살펴보는 흐름</title><desc>실행 파일은 인사 변경 전 요청 4건을 판정하고, 통보와 시험 처리 6줄을 출력한 뒤, 같은 4건을 다시 판정합니다. 학생은 role_admin.py 의 두 함수 본문만 직접 씁니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">응용 1-2 · 인사 변경 처리와 전후 판정 비교</text><rect x="15" y="58" width="150" height="125" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="90" y="105.8" font-weight="700">인사 변경 전</tspan><tspan x="90" dy="19.6">요청 4건 판정</tspan><tspan x="90" dy="19.6">check_permission</tspan></text><line x1="168" y1="120.5" x2="192" y2="120.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><rect x="195" y="58" width="150" height="125" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="270" y="105.8" font-weight="700">통보 처리 6줄</tspan><tspan x="270" dy="19.6">입사 · 이동 · 퇴사</tspan><tspan x="270" dy="19.6">오타 salse · ghost</tspan></text><line x1="348" y1="120.5" x2="372" y2="120.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><rect x="375" y="58" width="150" height="125" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="450" y="105.8" font-weight="700">인사 변경 후</tspan><tspan x="450" dy="19.6">같은 4건을</tspan><tspan x="450" dy="19.6">다시 판정</tspan></text><line x1="528" y1="120.5" x2="552" y2="120.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><rect x="555" y="58" width="150" height="125" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="630" y="96" font-weight="700">생각해 보기</tspan><tspan x="630" dy="19.6">(가) 출력 · hana</tspan><tspan x="630" dy="19.6">(나) seoyeon</tspan><tspan x="630" dy="19.6">(다) junho</tspan></text><rect x="15" y="210" width="335" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="182.5" y="240.1" font-weight="700">role_admin.py — 직접 씀</tspan><tspan x="182.5" dy="19.6">assign_role · revoke_access 본문</tspan></text><rect x="370" y="210" width="335" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="537.5" y="240.1" font-weight="700">apply1-2_run.py — 붙여 넣음</tspan><tspan x="537.5" dy="19.6">CHECKS 4건 · run_checks</tspan></text><text x="360" y="318" font-size="15" text-anchor="middle" fill="#666660">실행: python apply1-2_run.py</text></g></svg>
