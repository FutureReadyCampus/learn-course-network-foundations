<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img">
<title>실습 1-1은 요청 판정, users.json, roles.json, 약점 따지기 순서로 한다</title>
<desc>요청 여섯 건을 매트릭스로 판정한 뒤 users.json 여섯 명과 roles.json 세 역할을 직접 쓰고 json.tool 로 확인한다. 판정 뒤에 생각해 보기 (가), 약점 따지기 뒤에 (다)를 쓰고, 필요 이상 ○ 찾기와 (나)는 응용이다.</desc>
<defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 1-1 순서와 생각해 보기 답</text>
<rect x="20" y="56" width="160" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="100" y="93.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 판정</text>
<text x="100" y="115.2" font-size="15" fill="#292929" text-anchor="middle">요청 여섯 건을</text>
<text x="100" y="137.2" font-size="15" fill="#292929" text-anchor="middle">매트릭스로</text>
<text x="100" y="159.2" font-size="15" fill="#292929" text-anchor="middle">○ 찾기는 응용</text>
<polyline points="100,187 100,213" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="20" y="214" width="160" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="100" y="240.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">생각해 보기</text>
<text x="100" y="259.9" font-size="14" fill="#292929" text-anchor="middle">(가) · 응용 (나)</text>
<polyline points="181,121 192,121" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="193" y="56" width="160" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="273" y="93.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② users.json</text>
<text x="273" y="115.2" font-size="15" fill="#292929" text-anchor="middle">인사팀 리스트</text>
<text x="273" y="137.2" font-size="15" fill="#292929" text-anchor="middle">여섯 명을</text>
<text x="273" y="159.2" font-size="15" fill="#292929" text-anchor="middle">직접 쓰기</text>
<polyline points="273,187 273,213" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="193" y="214" width="160" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="273" y="240.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">json.tool 확인</text>
<text x="273" y="259.9" font-size="14" fill="#292929" text-anchor="middle">6명 출력</text>
<polyline points="354,121 365,121" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="366" y="56" width="160" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="446" y="93.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ roles.json</text>
<text x="446" y="115.2" font-size="15" fill="#292929" text-anchor="middle">finance · batch</text>
<text x="446" y="137.2" font-size="15" fill="#292929" text-anchor="middle">auditor 세 역할</text>
<text x="446" y="159.2" font-size="15" fill="#292929" text-anchor="middle">직접 추가</text>
<polyline points="446,187 446,213" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="366" y="214" width="160" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="446" y="240.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">json.tool 확인</text>
<text x="446" y="259.9" font-size="14" fill="#292929" text-anchor="middle">역할 5개 출력</text>
<polyline points="527,121 538,121" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="539" y="56" width="160" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="619" y="93.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">④ 약점 따지기</text>
<text x="619" y="115.2" font-size="15" fill="#292929" text-anchor="middle">퇴사 반영 늦음</text>
<text x="619" y="137.2" font-size="15" fill="#292929" text-anchor="middle">더 필요한 칸</text>
<text x="619" y="159.2" font-size="15" fill="#292929" text-anchor="middle">역할 없는 사용자</text>
<polyline points="619,187 619,213" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="539" y="214" width="160" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="619" y="240.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">질문 (다)</text>
<text x="619" y="259.9" font-size="14" fill="#292929" text-anchor="middle">tester 판정</text>
<rect x="20" y="298" width="680" height="94" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="328.6" font-size="16" fill="#292929" font-weight="700">users.json 한 줄 = 사람 한 명</text>
<text x="32" y="350.2" font-size="15" fill="#292929">"dami": {"role": "sales", "employed": false},</text>
<text x="32" y="372.2" font-size="15" fill="#292929">퇴사면 false · 재직 중(batch-night 포함)이면 true</text>
</g>
</svg>
