<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img"><title>예외 파일 작성부터 실행 결과를 보고서에 적기까지 응용 1-3 의 순서</title><desc>예외 파일에 다섯 건을 쓰고 json.tool 로 검사한 뒤 find_exception 본문을 씁니다. apply1-3_run.py 를 실행하면 단계 1 판정 6줄과 단계 2 점검 5줄이 나오고, 이를 보고서에 적습니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">응용 1-3 · 유효한 예외 찾기와 회수 대상 읽기</text><rect x="15" y="55" width="150" height="105" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="90" y="92.8" font-weight="700">1. 예외 파일</tspan><tspan x="90" dy="19.6">1~3번 붙여 넣기</tspan><tspan x="90" dy="19.6">4 · 5번 직접 씀</tspan></text><line x1="168" y1="107.5" x2="192" y2="107.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="195" y="55" width="150" height="105" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="270" y="92.8" font-weight="700">2. JSON 검사</tspan><tspan x="270" dy="19.6">python -m</tspan><tspan x="270" dy="19.6">json.tool</tspan></text><line x1="348" y1="107.5" x2="372" y2="107.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="375" y="55" width="150" height="105" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="450" y="92.8" font-weight="700">3. 함수 쓰기</tspan><tspan x="450" dy="19.6">find_exception</tspan><tspan x="450" dy="19.6">본문</tspan></text><line x1="528" y1="107.5" x2="552" y2="107.5" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="555" y="55" width="150" height="105" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="630" y="92.8" font-weight="700">4. 실행</tspan><tspan x="630" dy="19.6">apply1-3</tspan><tspan x="630" dy="19.6">_run.py</tspan></text><text x="15" y="198" font-size="15" text-anchor="start" fill="#666660" font-weight="700">실행 결과</text><rect x="15" y="210" width="210" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="120" y="240.3" font-weight="700">단계 1: 판정 6줄</tspan><tspan x="120" dy="19.6">(True, 번호) 또는</tspan><tspan x="120" dy="19.6">(False, None)</tspan></text><rect x="245" y="210" width="210" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="350" y="250.1" font-weight="700">단계 2: 점검 5줄</tspan><tspan x="350" dy="19.6">[회수] 또는 [유지]</tspan></text><line x1="460" y1="255" x2="488" y2="255" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="495" y="210" width="210" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="600" y="240.3" font-weight="700">보고서 (가)~(다)</tspan><tspan x="600" dy="19.6">회수할 예외 번호</tspan><tspan x="600" dy="19.6">만료 규칙 · 연장 판단</tspan></text><text x="360" y="340" font-size="14" text-anchor="middle" fill="#666660">세 건만 넣으면 batch-night · gaeun 은 (False, None) — 다섯 건을 모두 쓴 뒤 읽습니다</text></g></svg>
