<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>도전 1-3 에서 쓴 코드와 말을 네 칸으로 정리한 요점 지도</title><desc>예외 한 건은 사용자, 권한, 만료 시각, 이유로 적습니다. strptime 으로 시각을 만들고 now &lt; expires 일 때만 유효하며, 만료됨과 퇴사자는 회수합니다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">도전 1-3 정리</text><rect x="15" y="55" width="335" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="182.5" y="110.1" font-weight="700">예외 한 건</tspan><tspan x="182.5" dy="19.6">사용자 · 권한 · 만료 시각 · 이유</tspan></text><rect x="370" y="55" width="335" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="537.5" y="100.3" font-weight="700">문자열을 시각으로</tspan><tspan x="537.5" dy="19.6">datetime.strptime(문자열,</tspan><tspan x="537.5" dy="19.6">&quot;%Y-%m-%d %H:%M&quot;)</tspan></text><rect x="15" y="190" width="335" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="182.5" y="235.3" font-weight="700">아직 유효한가</tspan><tspan x="182.5" dy="19.6">now &lt; expires</tspan><tspan x="182.5" dy="19.6">만료 시각 정각에는 이미 거부</tspan></text><rect x="370" y="190" width="335" height="120" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="537.5" y="235.3" font-weight="700">회수 리스트</tspan><tspan x="537.5" dy="19.6">만료됨 · 퇴사자 → [회수]</tspan><tspan x="537.5" dy="19.6">나머지 → [유지]</tspan></text></g></svg>
