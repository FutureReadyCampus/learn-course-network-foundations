<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 355" role="img"><title>역할에 권한을 더하는 것과 만료 시각이 있는 예외를 주는 것의 비교</title><desc>역할에 권한을 추가하면 그 역할의 모든 사람이 함께 늘어납니다. 예외는 한 사람에게만 기간을 정해 주고, 만료 시각이 지나면 코드가 거부합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">왜 예외에 만료 시각이 필요한가</text><rect x="15" y="55" width="330" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="180" y="94.25" font-weight="700">역할에 권한을 추가하면</tspan><tspan x="180" dy="21">그 역할의 모든 사람 권한이</tspan><tspan x="180" dy="21">함께 늘어남</tspan></text><rect x="375" y="55" width="330" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="540" y="94.25" font-weight="700">예외로 주면</tspan><tspan x="540" dy="21">그 사람에게만</tspan><tspan x="540" dy="21">기간을 정해 허용</tspan></text><line x1="60" y1="250" x2="430" y2="250" stroke="#1f7a4a" stroke-width="8"/><line x1="430" y1="250" x2="660" y2="250" stroke="#e0442e" stroke-width="8"/><line x1="430" y1="225" x2="430" y2="275" stroke="#292929" stroke-width="2"/><text x="245" y="232" font-size="15" text-anchor="middle" fill="#292929">허용 (만료 시각 전)</text><text x="545" y="232" font-size="15" text-anchor="middle" fill="#292929">거부 (코드가 막음)</text><text x="430" y="298" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">만료 시각</text><text x="360" y="335" font-size="15" text-anchor="middle" fill="#666660">회수는 잊기 쉬우니 만료 시각을 함께 적고, 지나면 코드가 거부합니다</text></g></svg>
