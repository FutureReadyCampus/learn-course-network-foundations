<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>오늘 예외 파일에 들어갈 예외 다섯 건과 직접 쓸 4번, 5번</title><desc>예외 1~3번은 붙여 넣고 4번 batch-night, 5번 gaeun 은 표를 보고 직접 씁니다. 지금 시각이 만료 시각보다 앞일 때만 유효하고, 정각에는 이미 거부합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">2.1 예외 권한과 만료 — 예외 다섯 건</text><rect x="15" y="55" width="690" height="40" rx="2" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="80.25" font-weight="700">번호</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="80.25" font-weight="700">사용자</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="80.25" font-weight="700">권한</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="80.25" font-weight="700">만료 시각</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="80.25" font-weight="700">쓰는 법</tspan></text><rect x="15" y="95" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="120.25">1</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="120.25">seoyeon</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="120.25">SETTLE:QUERY</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="120.25">2026-10-22 18:00</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="120.25">붙여 넣기</tspan></text><rect x="15" y="135" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="160.25">2</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="160.25">junho</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="160.25">SALES:CHANGE</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="160.25">2026-10-20 18:00</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="160.25">붙여 넣기</tspan></text><rect x="15" y="175" width="690" height="40" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="200.25">3</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="200.25">dami</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="200.25">SALES:QUERY</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="200.25">2026-10-31 18:00</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="200.25">붙여 넣기</tspan></text><rect x="15" y="215" width="690" height="40" rx="2" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="240.25">4</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="240.25">batch-night</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="240.25">SALES:QUERY</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="240.25">2026-10-23 09:00</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="240.25">직접 씀</tspan></text><rect x="15" y="255" width="690" height="40" rx="2" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="280.25">5</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="95" y="280.25">gaeun</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="280.25">SETTLE:QUERY</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="415" y="280.25">2026-10-22 12:00</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="605" y="280.25">직접 씀</tspan></text><text x="360" y="330" font-size="15" text-anchor="middle" fill="#666660">유효: 지금 시각 &lt; 만료 시각 (만료 시각 정각에는 이미 거부)</text><text x="360" y="304" font-size="14" text-anchor="middle" fill="#666660">batch-night 는 프로그램이 쓰는 서비스 계정</text></g></svg>
