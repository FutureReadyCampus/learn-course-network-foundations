<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>세 경로로 일부러 고장을 만들어 경고와 빈 설정이 나오는지 시험합니다</title>
<desc>정상 파일, 없는 경로, 마지막 쉼표가 남은 깨진 파일을 load_json 으로 읽어 결과를 비교합니다. 기본값은 원래 자료와 같은 모양이어서 사용자 파일은 {}, 예외 파일은 [] 입니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">1.2 고장을 일부러 만들어 시험하기</text>
<rect x="24" y="52" width="250" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="149" y="75.4" font-size="16" text-anchor="middle" font-weight="700">경로</text>
<rect x="280" y="52" width="190" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="75.4" font-size="16" text-anchor="middle" font-weight="700">상태</text>
<rect x="476" y="52" width="220" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="586" y="75.4" font-size="16" text-anchor="middle" font-weight="700">기대하는 일</text>
<rect x="24" y="94" width="250" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149" y="129.4" font-size="15" text-anchor="middle">config/users.json</text>
<rect x="280" y="94" width="190" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="129.4" font-size="15" text-anchor="middle">정상 파일</text>
<rect x="476" y="94" width="220" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="586" y="118.9" font-size="15" text-anchor="middle">사용자 6명을 읽고</text>
<text x="586" y="139.9" font-size="15" text-anchor="middle">판정을 계속</text>
<rect x="24" y="160" width="250" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149" y="195.4" font-size="15" text-anchor="middle">config/users_typo.json</text>
<rect x="280" y="160" width="190" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="184.9" font-size="15" text-anchor="middle">없는 경로</text>
<text x="375" y="205.9" font-size="15" text-anchor="middle">FileNotFoundError</text>
<rect x="476" y="160" width="220" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="586" y="184.9" font-size="15" text-anchor="middle">경고 + 빈 설정</text>
<text x="586" y="205.9" font-size="15" text-anchor="middle">(0명) → 모두 거부</text>
<rect x="24" y="226" width="250" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149" y="261.4" font-size="15" text-anchor="middle">config/users_broken.json</text>
<rect x="280" y="226" width="190" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="375" y="250.9" font-size="15" text-anchor="middle">마지막 쉼표</text>
<text x="375" y="271.9" font-size="15" text-anchor="middle">JSONDecodeError</text>
<rect x="476" y="226" width="220" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="586" y="250.9" font-size="15" text-anchor="middle">경고 + 빈 설정</text>
<text x="586" y="271.9" font-size="15" text-anchor="middle">(0명) → 모두 거부</text>
<text x="24" y="314" font-size="16" font-weight="700">기본값은 원래 자료와 같은 모양</text>
<rect x="24" y="328" width="320" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="184" y="355.4" font-size="15" text-anchor="middle">사용자 파일 (딕셔너리) → {}</text>
<rect x="376" y="328" width="320" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="536" y="355.4" font-size="15" text-anchor="middle">예외 파일 (리스트) → []</text>
</g>
</svg>
