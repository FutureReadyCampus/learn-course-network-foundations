<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>설정 파일이 고장 나도 프로그램은 멈추지 않고 모든 요청을 거부하게 합니다</title>
<desc>지금은 쉼표 하나만 틀려도 판정 프로그램이 멈추고, 현장에서 판정을 끄고 모두 허용할 위험이 있습니다. 응용 1-4에서는 load_json 이 경고를 내고 빈 설정을 리턴해 모두 거부되게 합니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">응용 1-4 목표 · 고장 나도 멈추지 않고 거부</text>
<text x="24" y="66" font-size="16" font-weight="700">지금</text>
<text x="24" y="196" font-size="16" font-weight="700">바라는 것</text>
<rect x="24" y="80" width="200" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="124" y="112.9" font-size="15" text-anchor="middle">설정 파일에서</text>
<text x="124" y="133.9" font-size="15" text-anchor="middle">쉼표 하나 빠뜨림</text>
<rect x="260" y="80" width="200" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="112.9" font-size="15" text-anchor="middle">판정 프로그램이</text>
<text x="360" y="133.9" font-size="15" text-anchor="middle">오류로 멈춤</text>
<path d="M224,118 L258,118" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="496" y="80" width="200" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="596" y="112.9" font-size="15" text-anchor="middle">판정을 끄고</text>
<text x="596" y="133.9" font-size="15" text-anchor="middle">모두 허용 (걱정)</text>
<path d="M460,118 L494,118" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="24" y="210" width="200" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="124" y="253.4" font-size="15" text-anchor="middle">설정 파일 고장</text>
<rect x="260" y="210" width="200" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="242.9" font-size="15" text-anchor="middle">load_json 이</text>
<text x="360" y="263.9" font-size="15" text-anchor="middle">경고를 출력</text>
<path d="M224,248 L258,248" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="496" y="210" width="200" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596" y="242.9" font-size="15" text-anchor="middle">빈 설정 {}</text>
<text x="596" y="263.9" font-size="15" text-anchor="middle">→ 모든 요청 거부</text>
<path d="M460,248 L494,248" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<text x="24" y="318" font-size="15" fill="#666660">만드는 것: config_loader.py 의 load_json (판정 프로그램 연결은 오늘 안 함)</text>
<text x="24" y="342" font-size="15" fill="#666660">끝나면 쓰는 것: 질문 생각하기</text>
</g>
</svg>
