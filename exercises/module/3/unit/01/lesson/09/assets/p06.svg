<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>도전 1-4 정리: try except 로 멈추지 않고, 실패하면 빈 설정으로 모두 거부</title>
<desc>load_json 을 가운데 두고 도전 1-4에서 쓴 말을 모았습니다. try·except, 두 오류 이름, 빈 설정으로 모두 거부, 일부러 만든 고장 시험입니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">도전 1-4 정리</text>
<rect x="250" y="150" width="220" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="185.4" font-size="16" text-anchor="middle" font-weight="700">load_json(path, default)</text>
<rect x="24" y="56" width="220" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="88.9" font-size="16" text-anchor="middle" font-weight="700">오류가 나도 멈추지 않기</text>
<text x="134" y="109.9" font-size="15" text-anchor="middle">try: … except 오류이름:</text>
<rect x="476" y="56" width="220" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="586" y="88.9" font-size="16" text-anchor="middle" font-weight="700">파일이 없을 때</text>
<text x="586" y="109.9" font-size="15" text-anchor="middle">FileNotFoundError</text>
<rect x="24" y="208" width="220" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="240.9" font-size="16" text-anchor="middle" font-weight="700">JSON 이 깨졌을 때</text>
<text x="134" y="261.9" font-size="15" text-anchor="middle">json.JSONDecodeError</text>
<rect x="476" y="208" width="220" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="586" y="240.9" font-size="16" text-anchor="middle" font-weight="700">실패하면 모두 막기</text>
<text x="586" y="261.9" font-size="15" text-anchor="middle">빈 설정 {} → 모두 거부</text>
<line x1="244" y1="94" x2="250" y2="160" stroke="#dededb" stroke-width="1.5"/>
<line x1="476" y1="94" x2="470" y2="160" stroke="#dededb" stroke-width="1.5"/>
<line x1="244" y1="246" x2="250" y2="200" stroke="#dededb" stroke-width="1.5"/>
<line x1="476" y1="246" x2="470" y2="200" stroke="#dededb" stroke-width="1.5"/>
<rect x="170" y="300" width="380" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="326.9" font-size="16" text-anchor="middle" font-weight="700">고장을 미리 시험</text>
<text x="360" y="347.9" font-size="15" text-anchor="middle">없는 경로 · 깨진 파일 → 경고와 0명</text>
<line x1="360" y1="210" x2="360" y2="300" stroke="#dededb" stroke-width="1.5"/>
</g>
</svg>
