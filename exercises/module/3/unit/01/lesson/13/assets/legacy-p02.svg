<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>역할별 권한 판정 글을 올리고 전체 글 목록에서 열기</title>
<desc>_posts 폴더에 글을 만들고 제목과 날짜를 적습니다. 역할별 권한 판정에서 확인한 내용을 저장해 올린 뒤, 전체 글 목록에서 제목을 눌러 본문을 확인합니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">첫 화면에서 내 글을 열기까지</text>
<rect x="24" y="52" width="300" height="140" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="80" font-size="16" font-weight="700">새 글 파일</text>
<text x="40" y="106" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">_posts/2026-11-20-</text>
<text x="40" y="126" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">m3-u1-role-permission.md</text>
<rect x="40" y="140" width="268" height="40" rx="6" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.2"/>
<text x="56" y="166" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace">title: 내 글 제목</text>
<text x="186" y="166" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace">date: 2026-11-20</text>
<polyline points="325,122 355,122" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="356" y="86" width="136" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="424" y="116" font-size="15" text-anchor="middle" font-weight="700">git push</text>
<text x="424" y="140" font-size="14" text-anchor="middle">1~2분 기다리기</text>
<polyline points="493,122 523,122" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="524" y="52" width="172" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="610" y="80" font-size="14" fill="#2f6fd0" text-anchor="middle">전체 글</text>
<text x="610" y="118" font-size="14" fill="#2f6fd0" text-anchor="middle">역할별 권한 판정</text>
<text x="610" y="160" font-size="14" fill="#2f6fd0" text-anchor="middle">제목을 눌러 본문 확인</text>
<rect x="24" y="222" width="300" height="134" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="40" y="250" font-size="16" font-weight="700">코드는 복사하지 않고 경로만</text>
<text x="40" y="276" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">access_control/policy.py</text>
<text x="40" y="298" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">access_control/rbac.py</text>
<text x="40" y="330" font-size="14">글에 「전체 코드: 경로」 한 줄</text>
<rect x="356" y="222" width="340" height="134" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="372" y="250" font-size="16" font-weight="700">글 틀 고르기</text>
<text x="372" y="278" font-size="14">기본 · 세 문장 글 → post-short</text>
<text x="372" y="304" font-size="14">응용 · 긴 글 → post-practice</text>
<text x="372" y="330" font-size="14">막혀서 못 끝냈다 → post-stuck</text>
</g>
</svg>
