<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>올리기 전에 비밀키, 연락처, 실제 이름, 화면 캡처 네 가지를 확인한다</title>
<desc>공개 전에 한 줄씩 확인할 네 가지 체크리스트입니다. 하나라도 걸리면 지우고 다시 Commit 합니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">올리기 전 네 가지 확인</text>
<rect x="24" y="52" width="672" height="44" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="64" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="80" font-size="15">.env 내용 · API 키 · 토큰이 없다</text>
<rect x="24" y="106" width="672" height="44" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="118" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="134" font-size="15">개인 이메일 · 전화번호가 없다</text>
<rect x="24" y="160" width="672" height="44" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="172" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="188" font-size="15">실습 속 가상 이름(seoyeon · dami) 말고 실제 다른 사람 이름이 없다</text>
<rect x="24" y="214" width="672" height="44" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<rect x="40" y="226" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="74" y="242" font-size="15">화면 캡처에 내 컴퓨터 사용자 이름 · 다른 창이 보이지 않는다</text>
<text x="24" y="296" font-size="15" fill="#e0442e" font-weight="700">하나라도 걸리면 지우고 다시 Commit changes</text>
</g>
</svg>
