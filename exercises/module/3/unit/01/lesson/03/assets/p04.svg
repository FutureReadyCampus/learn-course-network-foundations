<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>rbac.py 의 두 곳을 채우면 아홉 건 중 거부가 3건에서 5건으로 바뀐다</title>
<desc>check_permission 의 [1]~[3] 검사와 permission 만드는 줄은 미리 있고, [4] 권한 검사의 if 줄과 return 줄 두 곳을 채운다. 채우기 전에는 minsu, dami, tester 만 거부되어 seoyeon 의 정산 조회가 허용되고, 채운 뒤에는 다섯 건이 서로 다른 이유로 거부된다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 1-2 · 두 곳을 채우고 전후 비교</text>
<rect x="20" y="52" width="350" height="288" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="34" y="78" font-size="16" fill="#292929" font-weight="700">rbac.py · check_permission</text>
<rect x="32" y="92" width="326" height="28" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="110.9" font-size="14" fill="#292929">[1] user not in USERS (미리 씀)</text>
<rect x="32" y="126" width="326" height="28" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="144.9" font-size="14" fill="#292929">[2] 퇴사면 거부 (미리 씀)</text>
<rect x="32" y="160" width="326" height="28" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="178.9" font-size="14" fill="#292929">[3] 역할 없으면 거부 (미리 씀)</text>
<rect x="32" y="194" width="326" height="28" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="212.9" font-size="14" fill="#292929">[4] permission 만들기 (미리 씀)</text>
<rect x="32" y="228" width="326" height="28" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="44" y="246.9" font-size="14" fill="#292929">① if permission not in ROLES[role]:</text>
<rect x="32" y="262" width="326" height="28" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="44" y="280.9" font-size="14" fill="#292929">② return False, &quot;권한 없음&quot;</text>
<rect x="32" y="296" width="326" height="28" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="44" y="314.9" font-size="14" fill="#292929">return True, "허용"</text>
<rect x="410" y="52" width="290" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="555" y="78.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">exercise1-2_run.py</text>
<text x="555" y="100.2" font-size="15" fill="#292929" text-anchor="middle">요청 아홉 건 판정</text>
<polyline points="371,84 409,84" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="410" y="150" width="290" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="555" y="179.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">채우기 전</text>
<text x="555" y="201.2" font-size="15" fill="#292929" text-anchor="middle">허용 6 · 거부 3 (seoyeon 정산 허용)</text>
<rect x="410" y="270" width="290" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="555" y="299.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">채운 뒤</text>
<text x="555" y="321.2" font-size="15" fill="#292929" text-anchor="middle">허용 4 · 거부 5 (이유 네 가지)</text>
<polyline points="555,117 555,149" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="555,221 555,269" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="565" y="250" font-size="14" fill="#666660">두 곳 채움</text>
<text x="20" y="372" font-size="15" fill="#292929">들여쓰기: ① if 줄은 4칸, ② return 줄은 8칸</text>
<text x="20" y="400" font-size="15" fill="#666660">실행은 터미널에서 (…/access_control 위치에서)</text>
</g>
</svg>
