<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>test_policy.py 는 4개 모두 통과, test_policy_extra.py 는 6번 실패를 읽고 판단합니다</title>
<desc>두 테스트 파일의 실행 흐름입니다. test_policy.py 는 2~4번을 직접 써서 「테스트 4개 모두 통과」를 확인하고, test_policy_extra.py 는 5 통과 뒤 6번에서 멈춥니다. 코드는 고치지 않고 어느 쪽이 다른지만 판단합니다.</desc>
