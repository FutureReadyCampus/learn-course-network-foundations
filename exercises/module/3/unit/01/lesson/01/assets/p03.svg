<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>프로젝트 폴더 안에 Module 3 작업 폴더 access_control 과 설정 폴더 config 를 만든다</title>
<desc>network-study-notes 폴더 아래에 Module 3의 작업 폴더 access_control 과 그 안의 설정 폴더 config 를 만든다. 터미널에서 mkdir -p 로 만들고 cd 로 들어간 뒤 pwd 로 위치를 확인한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 3 작업 폴더 배치</text>
<rect x="20" y="56" width="250" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145" y="81" font-size="15" fill="#292929" text-anchor="middle">network-study-notes/</text>
<rect x="60" y="116" width="210" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="165" y="141" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">access_control/</text>
<rect x="100" y="176" width="170" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="201" font-size="15" fill="#292929" text-anchor="middle">config/</text>
<g stroke="#666660" stroke-width="1.5">
<line x1="38" y1="96" x2="38" y2="136"/><line x1="38" y1="136" x2="60" y2="136"/>
<line x1="78" y1="156" x2="78" y2="196"/><line x1="78" y1="196" x2="100" y2="196"/>
</g>
<text x="288" y="141" font-size="14" fill="#666660">← Module 3의 작업 폴더</text>
<text x="288" y="201" font-size="14" fill="#666660">← 설정 파일을 둘 폴더</text>
<text x="20" y="250" font-size="14" fill="#666660">파일은 실습에서 필요할 때 하나씩 만듭니다.</text>
<rect x="440" y="56" width="260" height="128" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="570" y="90" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 폴더 만들기</text>
<text x="570" y="114" font-size="15" fill="#292929" text-anchor="middle">mkdir -p</text>
<text x="570" y="136" font-size="15" fill="#292929" text-anchor="middle">access_control/config</text>
<text x="570" y="158" font-size="15" fill="#292929" text-anchor="middle">cd access_control</text>
<rect x="440" y="200" width="260" height="86" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="570" y="228" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 위치 확인</text>
<text x="570" y="250" font-size="15" fill="#292929" text-anchor="middle">pwd</text>
<text x="570" y="272" font-size="15" fill="#292929" text-anchor="middle">…/access_control 로 끝남</text>
</g>
</svg>
