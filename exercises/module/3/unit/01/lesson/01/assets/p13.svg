<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>깃허브에 빈 저장소를 만들고, 내 폴더를 깃 저장소로 만들어 이은 뒤 처음 한 번 올립니다</title>
<desc>위쪽은 깃허브의 빈 저장소 network-study-notes(비공개)이고, 아래쪽은 내 컴퓨터의 network-study-notes 폴더입니다. 폴더에서 git init, git remote add origin, git add, git commit, git push -u origin main 을 차례로 치면 폴더 내용이 깃허브 저장소로 올라갑니다. 한 번 이어 두면 이후에는 git push 만 칩니다.</desc>
<defs>
<marker id="a-p13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker>
</defs>
<text x="20" y="30" font-size="19" font-weight="700" fill="#292929">처음 한 번만: 폴더와 깃허브를 잇기</text>
<g font-size="15" fill="#292929">
<rect x="20" y="50" width="680" height="84" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="36" y="78" font-size="16" font-weight="700">① 깃허브 (인터넷)</text>
<text x="36" y="104">New repository › 이름 network-study-notes · Private · README 체크 안 함</text>
<text x="36" y="124" font-size="14" fill="#666660">만든 뒤 보이는 주소를 복사해 둡니다</text>
<rect x="20" y="170" width="680" height="214" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="36" y="198" font-size="16" font-weight="700">② 내 컴퓨터의 network-study-notes 폴더 (터미널)</text>
<rect x="36" y="212" width="320" height="32" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="48" y="234" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">git init</text>
<rect x="36" y="250" width="320" height="32" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="48" y="272" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">git remote add origin 주소</text>
<rect x="36" y="288" width="320" height="32" rx="6" fill="#ffffff" stroke="#dededb"/>
<text x="48" y="310" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">git add .  /  git commit -m "…"</text>
<rect x="36" y="326" width="320" height="32" rx="6" fill="#fbf0dc" stroke="#9a6200"/>
<text x="48" y="348" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">git push -u origin main</text>
<text x="380" y="234">폴더가 깃 저장소가 됩니다</text>
<text x="380" y="272">깃허브 저장소를 origin 이라 부릅니다</text>
<text x="380" y="310">파일을 담고 기록으로 저장</text>
<text x="380" y="348" font-weight="700">깃허브로 올림 (처음 한 번)</text>
<text x="36" y="376" font-size="14" fill="#666660">.gitignore 에 .env · .venv/ · __pycache__/ 를 적어 두면 올라가지 않습니다. 이후에는 git push 만 칩니다.</text>
</g>
<line x1="360" y1="166" x2="360" y2="138" stroke="#666660" stroke-width="2" marker-end="url(#a-p13)"/>
<text x="372" y="158" font-size="14" fill="#292929">push 로 올라감</text>
</svg>
