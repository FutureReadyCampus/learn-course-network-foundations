<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>저장소 하나를 만들어 내려받는 것부터 공개 전 점검까지 5단계를 거치면 내 포트폴리오 주소가 생깁니다</title>
<desc>1 저장소 network-study-notes 하나를 만들고 내려받기(clone), 2 필수 파일을 VS Code 에서 붙여 넣고 올리기(push), 3 이름·주소 바꾸고 Pages 켜기, 4 글 틀로 글 쓰기, 5 공개 전 점검을 차례로 하면 https://&lt;내 아이디&gt;.github.io/&lt;저장소 이름&gt;/ 주소가 생깁니다. 같은 저장소 안에서 코드는 access_control/ 같은 실습 폴더, 글은 _posts/, 이미지는 assets/images/ 에 놓습니다.</desc>
<defs>
<marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker>
</defs>
<text x="20" y="30" font-size="19" font-weight="700" fill="#292929">내 기록을 포트폴리오로 남기는 5단계</text>

<g font-size="15" fill="#292929">
<rect x="10" y="52" width="126" height="120" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="24" y="80" font-size="16" font-weight="700">1</text>
<text x="24" y="106">저장소</text>
<text x="24" y="128">만들고 clone</text>
<text x="24" y="152" font-size="14" fill="#666660">하나만 · Public</text>

<rect x="154" y="52" width="126" height="120" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="168" y="80" font-size="16" font-weight="700">2</text>
<text x="168" y="106">필수 파일</text>
<text x="168" y="128">붙여 넣기</text>
<text x="168" y="152" font-size="14" fill="#666660">5개 · push</text>

<rect x="298" y="52" width="126" height="120" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="312" y="80" font-size="16" font-weight="700">3</text>
<text x="312" y="106">이름·주소</text>
<text x="312" y="128">바꾸고</text>
<text x="312" y="152">Pages 켜기</text>

<rect x="442" y="52" width="126" height="120" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="80" font-size="16" font-weight="700">4</text>
<text x="456" y="106">글 틀로</text>
<text x="456" y="128">글 쓰기</text>
<text x="456" y="152" font-size="14" fill="#666660">짧은 글도 OK</text>

<rect x="586" y="52" width="126" height="120" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600" y="80" font-size="16" font-weight="700">5</text>
<text x="600" y="106">공개 전</text>
<text x="600" y="128">점검</text>
<text x="600" y="152" font-size="14" fill="#666660">비밀 값 확인</text>

<rect x="10" y="212" width="400" height="84" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="26" y="244" font-size="16" font-weight="700">결과: 내 포트폴리오 주소</text>
<text x="26" y="272">https://&lt;내 아이디&gt;.github.io/&lt;저장소 이름&gt;/</text>
<text x="26" y="330" font-size="14" fill="#666660">링크 하나로 코드와 생각을 함께 보여 줄 수 있습니다.</text>

<rect x="432" y="212" width="280" height="140" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="448" y="240" font-size="16" font-weight="700">한 저장소 안 어디에 놓나</text>
<text x="448" y="272" font-weight="700">access_control/</text><text x="590" y="272">실습 코드</text>
<text x="448" y="302" font-weight="700">_posts/</text><text x="590" y="302">글</text>
<text x="448" y="332" font-weight="700">assets/images/</text><text x="590" y="332">이미지</text>
</g>

<g stroke="#666660" stroke-width="2" fill="none" marker-end="url(#a-p04)">
<path d="M137 112H152"/>
<path d="M281 112H296"/>
<path d="M425 112H440"/>
<path d="M569 112H584"/>
<path d="M649 174V192H210V208"/>
</g>
</svg>
