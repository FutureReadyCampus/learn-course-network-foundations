<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>파일을 올리면 GitHub Pages가 Jekyll로 사이트를 만들어 내 주소가 바뀝니다</title>
<desc>위는 흐름입니다. 글(.md)과 설정 파일을 올리고(push), GitHub Pages가 Jekyll로 사이트를 다시 만들고(빌드, 1~2분), 내 주소가 새 모습으로 바뀝니다. 아래는 폴더와 파일의 뜻입니다. access_control/ 같은 실습 폴더의 코드는 파일 그대로 사이트에 함께 올라가고, 밑줄(_)로 시작하는 폴더는 사이트에 그대로 나오지 않습니다.</desc>
<defs>
<marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker>
</defs>
<text x="20" y="30" font-size="19" font-weight="700" fill="#292929">올리면 Jekyll이 사이트를 만들어 줍니다</text>
<g font-size="15" fill="#292929">
<rect x="20" y="50" width="200" height="104" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="36" y="78" font-size="16" font-weight="700">① 올리기 (push)</text>
<text x="36" y="104">글(.md)과</text>
<text x="36" y="126">설정 파일을 올림</text>
<rect x="260" y="50" width="200" height="104" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="276" y="78" font-size="16" font-weight="700">② 빌드 (Jekyll)</text>
<text x="276" y="104">GitHub Pages가</text>
<text x="276" y="126">사이트를 만듦</text>
<text x="276" y="146" font-size="14" fill="#666660">1~2분 걸림</text>
<rect x="500" y="50" width="200" height="104" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="516" y="78" font-size="16" font-weight="700">③ 내 주소</text>
<text x="516" y="104">새 모습으로</text>
<text x="516" y="126">바뀜</text>
</g>
<g stroke="#666660" stroke-width="2" marker-end="url(#a-p05)">
<line x1="224" y1="102" x2="254" y2="102"/>
<line x1="464" y1="102" x2="494" y2="102"/>
</g>
<text x="20" y="186" font-size="17" font-weight="700" fill="#292929">폴더와 파일의 뜻</text>
<g font-size="15" fill="#292929">
<rect x="20" y="198" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="34" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">_config.yml</text>
<text x="34" y="243">설정 (사이트 이름, 주소)</text>
<rect x="370" y="198" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="384" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">_posts/</text>
<text x="384" y="243">글 (파일 이름은 날짜-제목.md)</text>
<rect x="20" y="264" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="34" y="286" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">index.md · about.md</text>
<text x="34" y="309">첫 화면, 소개 같은 한 장 페이지</text>
<rect x="370" y="264" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="384" y="286" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">assets/</text>
<text x="384" y="309">글에 넣는 이미지</text>
<rect x="20" y="330" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb"/>
<text x="34" y="352" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">access_control/ 등</text>
<text x="34" y="375">실습 코드 (파일 그대로 올라감)</text>
<rect x="370" y="330" width="330" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="384" y="352" font-weight="700"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">_</tspan>로 시작하는 폴더</text>
<text x="384" y="375">사이트에 그대로 나오지 않음</text>
</g>
</svg>
