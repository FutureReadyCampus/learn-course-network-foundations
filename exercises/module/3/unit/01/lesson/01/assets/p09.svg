<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>첫 화면이 이렇게 보이면 성공이고, 막히면 Actions 탭에서 오류 줄을 읽습니다</title>
<desc>첫 화면에서 내가 쓴 소개를 읽고 소개 페이지를 엽니다. 주소가 열리지 않으면 Actions에서 최근 빌드 결과를 확인합니다.</desc>
<defs>
<marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker>
</defs>
<text x="20" y="30" font-size="19" font-weight="700" fill="#292929">첫 화면 확인과 막힐 때 볼 곳</text>
<g font-size="15" fill="#292929">
<rect x="20" y="50" width="400" height="344" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<path d="M20 90H420" stroke="#dededb"/>
<text x="36" y="76" font-size="16" font-weight="700">사이트 이름</text>
<text x="324" y="76">소개</text>
<text x="372" y="76">홈</text>
<text x="36" y="132" font-size="18" font-weight="700">홈</text>
<text x="36" y="174">네트워크 보안을 공부하는 민지입니다.</text>
<text x="36" y="204">권한을 확인하며 알게 된 점을</text>
<text x="36" y="230">이곳에 기록하려고 합니다.</text>
<rect x="440" y="50" width="260" height="190" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="456" y="76" font-size="16" font-weight="700">이렇게 보이면 성공</text>
<text x="456" y="104">① Settings → Pages에</text>
<text x="476" y="124">Your site is live at</text>
<text x="456" y="154">② 주소를 열면</text>
<text x="476" y="174">왼쪽 같은 화면</text>
<text x="456" y="204">③ 위쪽 소개를 누르면</text>
<text x="476" y="224">about.md 내용</text>
<rect x="440" y="256" width="260" height="138" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="456" y="282" font-size="16" font-weight="700">막힐 때</text>
<text x="456" y="308">Actions 탭</text>
<text x="476" y="332">가장 위 실행</text>
<text x="476" y="356">빨간 ✗이면 눌러서</text>
<text x="476" y="378">오류 줄 읽기</text>
</g>
<g stroke="#666660" stroke-width="1.5" marker-end="url(#a-p08)">
<line x1="462" y1="314" x2="470" y2="326"/>
<line x1="462" y1="338" x2="470" y2="350"/>
</g>
</svg>
