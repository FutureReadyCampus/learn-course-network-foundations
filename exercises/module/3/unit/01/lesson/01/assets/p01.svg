<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" role="img">
<title>Module 3은 권한을 정하고, 주고, 점검하고, 거두고, 보고하는 다섯 단계이고 Unit 1은 첫 단계인 권한 정하기의 시작이다</title>
<desc>Module 3 접근통제 자동화는 권한 정하기, 권한 주기, 권한 점검, 권한 거두기, 결과 보고 다섯 단계로 이어진다. Unit 1은 첫 단계인 권한 정하기에서 실습 1-1부터 1-3까지를 한다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 3 접근통제 자동화 · 다섯 단계</text>
<rect x="20" y="56" width="124" height="104" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="82" y="82" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 권한 정하기</text>
<text x="82" y="102" font-size="14" fill="#666660" text-anchor="middle">Unit 1 ~ 3</text>
<text x="82" y="127" font-size="14" fill="#292929" text-anchor="middle">누가 무엇을 해도</text>
<text x="82" y="146" font-size="14" fill="#292929" text-anchor="middle">되는지 표로 정함</text>
<polyline points="145,108 157,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="158" y="56" width="124" height="104" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="220" y="82" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 권한 주기</text>
<text x="220" y="102" font-size="14" fill="#666660" text-anchor="middle">Unit 2 ~ 5</text>
<text x="220" y="127" font-size="14" fill="#292929" text-anchor="middle">요청서 → 승인</text>
<text x="220" y="146" font-size="14" fill="#292929" text-anchor="middle">→ 권한 부여</text>
<polyline points="283,108 295,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="296" y="56" width="124" height="104" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="358" y="82" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ 권한 점검</text>
<text x="358" y="102" font-size="14" fill="#666660" text-anchor="middle">Unit 3 ~ 7</text>
<text x="358" y="127" font-size="14" fill="#292929" text-anchor="middle">안 쓰는 권한 ·</text>
<text x="358" y="146" font-size="14" fill="#292929" text-anchor="middle">넘치는 권한 찾기</text>
<polyline points="421,108 433,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="434" y="56" width="124" height="104" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="496" y="82" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">④ 권한 거두기</text>
<text x="496" y="102" font-size="14" fill="#666660" text-anchor="middle">Unit 4 ~ 9</text>
<text x="496" y="127" font-size="14" fill="#292929" text-anchor="middle">필요 없는 권한을</text>
<text x="496" y="146" font-size="14" fill="#292929" text-anchor="middle">승인받아 회수</text>
<polyline points="559,108 571,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="572" y="56" width="124" height="104" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="634" y="82" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">⑤ 결과 보고</text>
<text x="634" y="102" font-size="14" fill="#666660" text-anchor="middle">Unit 5</text>
<text x="634" y="127" font-size="14" fill="#292929" text-anchor="middle">점검 결과를</text>
<text x="634" y="146" font-size="14" fill="#292929" text-anchor="middle">주간 보고서로</text>
<text x="20" y="188" font-size="15" fill="#666660">Unit 1 은 ① 권한 정하기의 시작 · 회사는 A사</text>
<text x="20" y="224" font-size="16" fill="#292929" font-weight="700">Unit 1 에서 하는 실습</text>
<rect x="20" y="240" width="213" height="104" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="126.5" y="275.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 1-1</text>
<text x="126.5" y="297.2" font-size="15" fill="#292929" text-anchor="middle">사용자 · 역할 파일</text>
<text x="126.5" y="319.2" font-size="15" fill="#292929" text-anchor="middle">직접 쓰기</text>
<polyline points="234,292 252,292" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="253" y="240" width="213" height="104" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="359.5" y="275.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 1-2</text>
<text x="359.5" y="297.2" font-size="15" fill="#292929" text-anchor="middle">권한 판정 함수</text>
<text x="359.5" y="319.2" font-size="15" fill="#292929" text-anchor="middle">코드 다섯 곳</text>
<polyline points="467,292 485,292" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="486" y="240" width="213" height="104" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="592.5" y="275.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">도전 1-1</text>
<text x="592.5" y="297.2" font-size="15" fill="#292929" text-anchor="middle">접속 기록 재판정</text>
<text x="592.5" y="319.2" font-size="15" fill="#292929" text-anchor="middle">미사용 권한 찾기</text>
</g>
</svg>
