<rect x="20" y="374" width="680" height="34" rx="6" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="360" y="396" font-size="15" fill="#292929" text-anchor="middle">응용 1-1 ~ 1-5는 여유가 되면 · 핵심 실습과 글쓰기를 마친 뒤</text>
