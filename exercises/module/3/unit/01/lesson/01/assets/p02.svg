<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>access_control 폴더 안에 config 폴더를 만들고 파일은 New File 로 만든다</title>
<desc>security-agent-toolkit 아래에 Module 3 작업 폴더 access_control 과 설정 폴더 config 를 만든다. users.json 과 roles.json 은 실습 1-1에서 만든다. 파일은 폴더를 오른쪽 클릭해 New File 로 이름을 적고, 페이지의 코드 상자에서 복사해 붙여 넣는다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 3 작업 폴더 배치</text>
<rect x="20" y="52" width="250" height="34" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145" y="74.2" font-size="15" fill="#292929" text-anchor="middle">security-agent-toolkit/</text>
<rect x="60" y="96" width="180" height="34" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="150" y="118.2" font-size="15" fill="#292929" text-anchor="middle">network_zt/</text>
<rect x="60" y="140" width="180" height="34" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="150" y="162.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">access_control/</text>
<rect x="100" y="184" width="170" height="34" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="206.2" font-size="15" fill="#292929" text-anchor="middle">config/</text>
<rect x="140" y="228" width="140" height="34" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="210" y="250.2" font-size="15" fill="#292929" text-anchor="middle">users.json</text>
<rect x="140" y="272" width="140" height="34" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="210" y="294.2" font-size="15" fill="#292929" text-anchor="middle">roles.json</text>
<line x1="38" y1="86" x2="38" y2="113" stroke="#666660" stroke-width="1.5"/>
<line x1="38" y1="113" x2="60" y2="113" stroke="#666660" stroke-width="1.5"/>
<line x1="38" y1="86" x2="38" y2="157" stroke="#666660" stroke-width="1.5"/>
<line x1="38" y1="157" x2="60" y2="157" stroke="#666660" stroke-width="1.5"/>
<line x1="78" y1="174" x2="78" y2="201" stroke="#666660" stroke-width="1.5"/>
<line x1="78" y1="201" x2="100" y2="201" stroke="#666660" stroke-width="1.5"/>
<line x1="118" y1="218" x2="118" y2="245" stroke="#666660" stroke-width="1.5"/>
<line x1="118" y1="245" x2="140" y2="245" stroke="#666660" stroke-width="1.5"/>
<line x1="118" y1="218" x2="118" y2="289" stroke="#666660" stroke-width="1.5"/>
<line x1="118" y1="289" x2="140" y2="289" stroke="#666660" stroke-width="1.5"/>
<text x="292" y="280" font-size="14" fill="#666660">← 실습 1-1에서 만듦</text>
<rect x="440" y="52" width="260" height="128" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="570" y="88.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 폴더 만들기</text>
<text x="570" y="110.2" font-size="15" fill="#292929" text-anchor="middle">mkdir -p</text>
<text x="570" y="132.2" font-size="15" fill="#292929" text-anchor="middle">access_control/config</text>
<text x="570" y="154.2" font-size="15" fill="#292929" text-anchor="middle">cd access_control</text>
<rect x="440" y="196" width="260" height="86" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="570" y="222.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 위치 확인</text>
<text x="570" y="244.2" font-size="15" fill="#292929" text-anchor="middle">pwd</text>
<text x="570" y="266.2" font-size="15" fill="#292929" text-anchor="middle">…/access_control 로 끝남</text>
<rect x="440" y="298" width="260" height="104" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="570" y="333.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ 파일 만드는 법</text>
<text x="570" y="355.2" font-size="14" fill="#292929" text-anchor="middle">폴더 오른쪽 클릭 › New File</text>
<text x="570" y="377.2" font-size="14" fill="#292929" text-anchor="middle">이름 적고 복사해 붙여 넣기</text>
<polyline points="439,350 310,350 310,300 284,300" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
</g>
</svg>
