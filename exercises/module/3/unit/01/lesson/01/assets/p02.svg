<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>RBAC는 사람을 역할에, 역할을 권한에 잇고, 인증과 인가는 서로 다른 확인이다</title>
<desc>seoyeon 같은 사람은 sales 역할에 이어지고, sales 역할은 매출 조회와 매출 수정 권한을 가진다. 사람이 30명이어도 역할이 5개면 표 5줄만 관리한다. 인증은 이 사람이 누구인지(로그인), 인가는 그 사람이 이 일을 해도 되는지(로그인 뒤 막히는 것)를 확인한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="20" y="30" font-size="19" font-weight="700">접근통제 용어 지도</text>
<text x="20" y="56" font-size="15" fill="#666660">접근통제: 누가 어떤 자원에 무엇을 해도 되는지 정하고, 그 밖의 일은 막기</text>
<text x="20" y="84" font-size="15" font-weight="700">RBAC: 사람 → 역할 → 권한</text>
<rect x="20" y="98" width="180" height="104" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="124" font-size="15" text-anchor="middle" fill="#666660">사람(사용자)</text>
<rect x="45" y="140" width="130" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="165" font-size="16" text-anchor="middle" font-weight="700">seoyeon</text>
<rect x="270" y="98" width="180" height="104" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="124" font-size="15" text-anchor="middle" fill="#666660">역할 (권한 묶음)</text>
<rect x="295" y="140" width="130" height="40" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="165" font-size="16" text-anchor="middle" font-weight="700">sales</text>
<rect x="520" y="98" width="180" height="104" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="124" font-size="15" text-anchor="middle" fill="#666660">권한 (할 일 하나)</text>
<rect x="545" y="134" width="130" height="28" rx="6" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="153" font-size="15" text-anchor="middle">매출 조회</text>
<rect x="545" y="166" width="130" height="28" rx="6" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="185" font-size="15" text-anchor="middle">매출 수정</text>
<g stroke="#666660" stroke-width="2" marker-end="url(#a-p02)">
<line x1="176" y1="160" x2="292" y2="160"/>
<line x1="426" y1="160" x2="542" y2="160"/>
</g>
<rect x="20" y="216" width="680" height="40" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="241" font-size="15" text-anchor="middle">사람이 30명이어도 역할이 5개면 표 5줄만 관리하면 됩니다</text>
<text x="20" y="290" font-size="15" font-weight="700">인증과 인가는 다른 확인</text>
<rect x="20" y="304" width="300" height="100" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="40" y="334" font-size="16" font-weight="700">인증</text>
<text x="40" y="360" font-size="15">이 사람이 누구인가</text>
<text x="40" y="386" font-size="15" fill="#666660">예: 로그인</text>
<rect x="400" y="304" width="300" height="100" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="420" y="334" font-size="16" font-weight="700">인가</text>
<text x="420" y="360" font-size="15">그 사람이 이 일을 해도 되는가</text>
<text x="420" y="386" font-size="15" fill="#666660">예: 로그인한 뒤 막히는 것</text>
<line x1="324" y1="354" x2="396" y2="354" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
</g>
</svg>
