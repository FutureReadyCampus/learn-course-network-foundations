<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>응용 2-1 정리: 승인된 것만, 정책 판정, 부여 조건, 예외 추가, exception_id, granted</title>
<desc>응용 2-1에서 쓴 코드를 하려는 일별로 정리했습니다. 승인된 요청서를 check_permission 으로 판정해 권한 없음일 때만 예외를 추가하고, 예외 번호를 적은 뒤 granted 로 바꿉니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">응용 2-1 정리</text>
<rect x="30" y="58" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="85.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">승인된 것만 부여</text>
<line x1="200" y1="81" x2="228" y2="81" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="58" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="85.6" font-size="15" fill="#292929" text-anchor="start">status != "approved" → False, "승인되지 않음"</text>
<rect x="30" y="114" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="141.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">정책으로 한 번 더</text>
<line x1="200" y1="137" x2="228" y2="137" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="114" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="141.6" font-size="15" fill="#292929" text-anchor="start">check_permission(user, resource, action)</text>
<rect x="30" y="170" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="197.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">부여하지 않는 경우</text>
<line x1="200" y1="193" x2="228" y2="193" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="170" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="197.6" font-size="15" fill="#292929" text-anchor="start">is_allowed or judge_reason != "권한 없음"</text>
<rect x="30" y="226" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="253.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">예외 권한 부여</text>
<line x1="200" y1="249" x2="228" y2="249" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="226" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="253.6" font-size="15" fill="#292929" text-anchor="start">len(EXCEPTIONS) + 1 → EXCEPTIONS.append(exception)</text>
<rect x="30" y="282" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="309.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">어느 예외인지 적기</text>
<line x1="200" y1="305" x2="228" y2="305" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="282" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="309.6" font-size="15" fill="#292929" text-anchor="start">request["exception_id"] = exception["id"]</text>
<rect x="30" y="338" width="170" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="365.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">부여 끝 표시</text>
<line x1="200" y1="361" x2="228" y2="361" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="230" y="338" width="470" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="244" y="365.6" font-size="15" fill="#292929" text-anchor="start">request["status"] = "granted"</text>
</svg>
