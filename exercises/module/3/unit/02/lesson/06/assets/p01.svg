<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>도전 2-1은 승인된 요청서를 정책으로 다시 확인하고 통과한 것만 예외 권한을 준다</title>
<desc>승인된 요청서가 req_grant.py 의 grant_request 를 거칩니다. check_permission 으로 다시 확인해 통과하면 EXCEPTIONS 에 예외를 추가하고 granted 로 바꾸며, 아니면 부여하지 않습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">도전 2-1에서 만드는 것: 예외 권한 부여 함수</text>
<rect x="30" y="70" width="190" height="160" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125" y="123.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">입력</text>
<text x="125" y="144.1" font-size="15" fill="#292929" text-anchor="middle">승인된 요청서</text>
<text x="125" y="165.1" font-size="15" fill="#292929" text-anchor="middle">status:</text>
<text x="125" y="186.1" font-size="15" fill="#292929" text-anchor="middle">"approved"</text>
<line x1="220" y1="150" x2="258" y2="150" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="260" y="70" width="210" height="160" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="365" y="112.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">프로그램</text>
<text x="365" y="133.6" font-size="15" fill="#292929" text-anchor="middle">req_grant.py</text>
<text x="365" y="154.6" font-size="15" fill="#292929" text-anchor="middle">grant_request</text>
<text x="365" y="175.6" font-size="15" fill="#292929" text-anchor="middle">check_permission</text>
<text x="365" y="196.6" font-size="15" fill="#292929" text-anchor="middle">으로 한 번 더 확인</text>
<line x1="470" y1="120" x2="488" y2="112" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<line x1="470" y1="180" x2="488" y2="192" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/>
<rect x="490" y="62" width="210" height="84" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="87.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">부여</text>
<text x="595" y="108.6" font-size="15" fill="#292929" text-anchor="middle">EXCEPTIONS 에 예외 추가</text>
<text x="595" y="129.6" font-size="15" fill="#292929" text-anchor="middle">status: "granted"</text>
<rect x="490" y="154" width="210" height="84" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="595" y="190.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">부여하지 않음</text>
<text x="595" y="211.1" font-size="15" fill="#292929" text-anchor="middle">(False, 이유)</text>
<rect x="30" y="258" width="670" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="284.6" font-size="15" fill="#292929" text-anchor="middle">부여 전 · 후를 evaluate_access 로 비교하고 보고서 (가) · (나) · (다) 답을 씁니다</text>
</svg>
