<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>응용 2-1은 요청서 네 장을 부여 전 판정, 부여 시도, 부여 후 판정의 세 단계로 실행한다</title>
<desc>1 · 3 · 4번은 승인, 2번은 반려된 요청서 네 장으로 시작합니다. 단계 1과 단계 3은 evaluate_access 판정, 단계 2는 grant_request 부여 시도이며, 단계 1과 단계 3을 비교하면 달라진 줄이 하나 있습니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">응용 2-1 · 세 단계 실행 흐름</text>
<rect x="24" y="60" width="236" height="210" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="111.6" font-size="15" fill="#292929" text-anchor="start" font-weight="700">요청서 네 장</text>
<text x="38" y="141.6" font-size="15" fill="#292929" text-anchor="start">1 seoyeon · approved</text>
<text x="38" y="171.6" font-size="15" fill="#292929" text-anchor="start">2 gaeun · rejected</text>
<text x="38" y="201.6" font-size="15" fill="#292929" text-anchor="start">3 dami · approved</text>
<text x="38" y="231.6" font-size="15" fill="#292929" text-anchor="start">4 junho · approved</text>
<line x1="260" y1="165" x2="298" y2="165" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<rect x="300" y="56" width="240" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="420" y="85.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 1: 판정 (부여 전)</text>
<text x="420" y="106.1" font-size="15" fill="#292929" text-anchor="middle">evaluate_access · 네 줄</text>
<line x1="420" y1="126" x2="420" y2="140" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<rect x="300" y="142" width="240" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="420" y="165.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 2: 부여</text>
<text x="420" y="186.6" font-size="15" fill="#292929" text-anchor="middle">grant_request · 네 줄</text>
<text x="420" y="207.6" font-size="15" fill="#292929" text-anchor="middle">+ 부여된 예외 번호 한 줄</text>
<line x1="420" y1="222" x2="420" y2="236" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<rect x="300" y="238" width="240" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="420" y="267.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 3: 점검 (부여 후)</text>
<text x="420" y="288.1" font-size="15" fill="#292929" text-anchor="middle">evaluate_access · 네 줄</text>
<line x1="540" y1="91" x2="578" y2="140" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<line x1="540" y1="273" x2="578" y2="224" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/>
<rect x="580" y="132" width="120" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="640" y="155.1" font-size="15" fill="#292929" text-anchor="middle">단계 1 과</text>
<text x="640" y="176.1" font-size="15" fill="#292929" text-anchor="middle">단계 3 비교</text>
<text x="640" y="197.1" font-size="15" fill="#292929" text-anchor="middle">달라진 줄</text>
<text x="640" y="218.1" font-size="15" fill="#292929" text-anchor="middle">하나</text>
<rect x="24" y="324" width="676" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="362" y="348.6" font-size="15" fill="#292929" text-anchor="middle">질문 네 건의 결과 · (나) dami · (다) 만료 뒤</text>
</svg>
