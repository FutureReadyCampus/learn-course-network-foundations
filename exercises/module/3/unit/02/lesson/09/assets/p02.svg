<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-1 정답: 요청 일곱 건 중 네 건은 접수되고 세 건은 각기 다른 if 조건에 걸린다</title>
<desc>앞의 네 건은 요청 번호 1~4로 접수됩니다. hana 는 user not in USERS, seoyeon 의 ACCOUNT:QUERY 는 reason == "", gaeun 의 ACCOUNT:QUERY 는 until &lt;= received_at 에 걸립니다.</desc>
