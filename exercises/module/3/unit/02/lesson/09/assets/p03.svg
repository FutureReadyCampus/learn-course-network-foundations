<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-2 정답: 본인 승인과 두 번째 처리 두 건이 막히고, 나머지 네 건은 처리된다</title>
<desc>본인 승인은 본인 요청은 처리할 수 없음, 다시 처리한 1번과 2번은 검토 중이 아님으로 막힙니다. 단계 2에서 1 · 3 · 4번은 approved, 2번은 rejected 이고 처리한 사람은 모두 security_manager 입니다.</desc>
