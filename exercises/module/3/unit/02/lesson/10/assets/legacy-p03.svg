<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-1 보고서 칸: (가) 출력과 걸린 if 조건, (나)[응용] 희망 만료 시각을 믿어도 되는가</title>
<desc>실습 2-1 보고서에서 채울 칸입니다. 핵심 질문 (가)는 출력 전체와 접수되지 않은 세 건의 if 조건, 응용 (나)는 until 을 그대로 믿어도 되는지와 승인 전 확인할 것 두 가지 이상입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 2-1 · 권한 요청서 만들기 · 채울 칸</text>
<rect x="30" y="56" width="670" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="46" y="82" font-size="16" fill="#292929" text-anchor="start" font-weight="700">(가) [핵심 질문] 출력 전체와 접수되지 않은 세 건</text>
<rect x="60" y="97" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="86" y="110" font-size="15" fill="#292929" text-anchor="start">① 출력 전체 (코드 상자에 붙여 넣기)</text>
<rect x="60" y="125" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="86" y="138" font-size="15" fill="#292929" text-anchor="start">② 세 건 각각이 걸린 if 조건</text>
<rect x="30" y="168" width="670" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="46" y="194" font-size="16" fill="#292929" text-anchor="start" font-weight="700">(나) [응용] 요청자가 적은 until 을 믿어도 될까</text>
<rect x="60" y="209" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="86" y="222" font-size="15" fill="#292929" text-anchor="start">① 그대로 믿어도 되는지</text>
<rect x="60" y="237" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="86" y="250" font-size="15" fill="#292929" text-anchor="start">② 승인 전에 확인할 것 두 가지 이상</text>
</svg>
