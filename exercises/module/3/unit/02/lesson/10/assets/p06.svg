<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img">
<title>도전 2-2 보고서 칸: (가) 초과 요청과 지난 시간, (나) 조치와 기준, (다) 상태 확인</title>
<desc>도전 2-2 (가)에는 출력 전체와 4시간을 초과한 요청 번호, 지난 시간을 씁니다. (나)는 기한을 넘긴 요청에 할 조치와 에스컬레이션 기준, (다)는 상태를 보지 않을 때 생기는 문제입니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">도전 2-2 · 처리 기한 초과 요청 찾기 · 채울 칸</text>
<rect x="20" y="52" width="110" height="74" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="75" y="93" font-size="15" fill="#292929" text-anchor="middle">(가)</text>
<rect x="140" y="52" width="560" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="83" font-size="15" fill="#292929" text-anchor="start">① 출력 전체 (코드 상자에)  ② 4시간을 초과한 요청 번호</text>
<text x="152" y="104" font-size="15" fill="#292929" text-anchor="start">③ 그 요청들이 접수된 뒤 지난 시간</text>
<rect x="20" y="142" width="110" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="183" font-size="15" fill="#292929" text-anchor="middle">(나)</text>
<rect x="140" y="142" width="560" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="173" font-size="15" fill="#292929" text-anchor="start">[핵심 질문] ① 누구에게 어떤 조치를 할지</text>
<text x="152" y="194" font-size="15" fill="#292929" text-anchor="start">② 알림만 보낼지 윗사람에게 넘길지 나누는 기준</text>
<rect x="20" y="232" width="110" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="273" font-size="15" fill="#292929" text-anchor="middle">(다)</text>
<rect x="140" y="232" width="560" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="152" y="263" font-size="15" fill="#292929" text-anchor="start">[핵심 질문] 상태를 보지 않고 접수 시각만 보면</text>
<text x="152" y="284" font-size="15" fill="#292929" text-anchor="start">① 리스트에 생기는 문제  ② 받은 사람이 곤란한 점</text>
<text x="20" y="336" font-size="15" fill="#666660" text-anchor="start">도전 2-2를 했다면 아래 「내 기록 남기기」 글감도 고를 수 있습니다</text>
</g>
</svg>
