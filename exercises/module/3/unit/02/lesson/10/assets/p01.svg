<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>보고서 파일은 틀을 복사해 만들고, 핵심 실습 칸은 모두, 도전 칸은 한 것만 채운다</title>
<desc>access_control 폴더에 report_u2.md 를 새로 만들고 틀을 붙여 넣어 저장합니다. 실습 2-1 · 2-2 · 마무리 칸은 모두 채우고, 도전 2-1 ~ 2-3 칸은 내가 한 도전만 채웁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">보고서 파일 report_u2.md 만들기</text>
<rect x="20" y="52" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="82" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">1 · New File</text>
<text x="120" y="106" font-size="14" fill="#666660" text-anchor="middle">access_control 안</text>
<polyline points="220,87 256,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="260" y="52" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="82" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">2 · 틀 복사</text>
<text x="360" y="106" font-size="14" fill="#666660" text-anchor="middle">붙여 넣고 이름 바꾸기</text>
<polyline points="460,87 496,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="500" y="52" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="600" y="82" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">3 · 저장</text>
<text x="600" y="106" font-size="14" fill="#666660" text-anchor="middle">Ctrl + S (맥북 Cmd + S)</text>
<rect x="20" y="146" width="330" height="190" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="185" y="174" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">핵심 실습 · 모두 채움</text>
<rect x="50" y="192" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="215" font-size="15" fill="#292929" text-anchor="middle">## 실습 2-1</text>
<rect x="50" y="238" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="261" font-size="15" fill="#292929" text-anchor="middle">## 실습 2-2</text>
<rect x="50" y="284" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="307" font-size="15" fill="#292929" text-anchor="middle">## 마무리</text>
<rect x="370" y="146" width="330" height="190" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="174" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">도전 · 한 것만 채움 (선택)</text>
<rect x="400" y="192" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="215" font-size="15" fill="#292929" text-anchor="middle">## 도전 2-1</text>
<rect x="400" y="238" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="261" font-size="15" fill="#292929" text-anchor="middle">## 도전 2-2</text>
<rect x="400" y="284" width="270" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="307" font-size="15" fill="#292929" text-anchor="middle">## 도전 2-3</text>
<text x="360" y="366" font-size="15" fill="#666660" text-anchor="middle">질문 글은 다음 페이지들에 있고, 파일에는 번호와 답: 칸만 있습니다</text>
</g>
</svg>
