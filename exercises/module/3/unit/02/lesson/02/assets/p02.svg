<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img">
<title>오늘 코드가 불러 쓰는 Unit 1 파일 여섯 종류를 확인하고, 없으면 나온 곳에서 다시 만든다</title>
<desc>users.json · roles.json, rbac.py, exceptions.json, exception_policy.py, config_loader.py, policy.py 가 access_control 에 있어야 합니다. 터미널 한 줄로 확인해 이전 파일 정상 5 와 퇴사한 계정이 나오면 됩니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
