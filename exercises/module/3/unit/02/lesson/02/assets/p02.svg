<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>access_control 폴더 안의 Unit 1 파일과 Unit 2 에서 새로 만드는 파일 배치</title><desc>security-agent-toolkit/access_control 안에 rbac.py, exercise1-2_run.py, config 의 users.json 과 roles.json 이 있어야 합니다. Unit 2 파일은 New File 로 만들어 코드 상자 내용을 복사해 붙여 넣고, 보고서 report_u2.md 는 「보고서 쓰기」 레슨에서 만듭니다. Unit 1 파일은 고치지 않습니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">access_control 폴더 열고 파일 준비하기</text><rect x="15" y="55" width="385" height="310" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="35" y="90" font-size="15" text-anchor="start" fill="#292929" font-weight="700">security-agent-toolkit/</text><text x="61" y="122" font-size="15" text-anchor="start" fill="#292929" font-weight="700">access_control/</text><text x="87" y="154" font-size="15" text-anchor="start" fill="#292929">rbac.py</text><text x="87" y="186" font-size="15" text-anchor="start" fill="#292929">exercise1-2_run.py</text><text x="87" y="218" font-size="15" text-anchor="start" fill="#292929" font-weight="700">config/</text><text x="113" y="250" font-size="15" text-anchor="start" fill="#292929">users.json · roles.json</text><rect x="81" y="263" width="230" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="87" y="282" font-size="15" text-anchor="start" fill="#292929">실습 파일: 복사해 붙여 넣기</text><rect x="81" y="295" width="230" height="27" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="87" y="314" font-size="15" text-anchor="start" fill="#292929">report_u2.md (보고서 쓰기)</text><text x="35" y="352" font-size="14" text-anchor="start" fill="#666660">초록 칸 = Unit 2 에서 New File 로 만드는 파일</text><rect x="420" y="55" width="285" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="562.5" y="80.3" font-weight="700">위치 확인</tspan><tspan x="562.5" dy="19.6">pwd → …/access_control</tspan><tspan x="562.5" dy="19.6">ls · ls config</tspan></text><rect x="420" y="150" width="285" height="95" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="562.5" y="182.8" font-weight="700">없거나 정상이 아니면</tspan><tspan x="562.5" dy="19.6">Unit 1 코드 상자로 rbac.py 와</tspan><tspan x="562.5" dy="19.6">config 두 파일을 다시 만듭니다</tspan></text><rect x="420" y="260" width="285" height="85" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="562.5" y="287.8" font-weight="700">고치지 않는 파일</tspan><tspan x="562.5" dy="19.6">rbac.py · users.json · roles.json</tspan><tspan x="562.5" dy="19.6">오늘 바뀌는 설정은 새 파일에</tspan></text></g></svg>
