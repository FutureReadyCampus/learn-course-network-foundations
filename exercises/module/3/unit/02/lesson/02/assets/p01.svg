<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>Unit 1 의 판정 함수를 실습 2-1, 2-2, 2-3 세 상황으로 넓히는 Unit 2 지도</title><desc>Unit 1 에서 만든 사용자-역할-권한 표와 check_permission 을 바탕으로 세 실습을 합니다. 깃허브에 올리는 일은 Unit 3 의 실습 3-2 마지막에 한 번에 합니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">Unit 2 · Unit 1 의 판정을 세 상황으로 넓힙니다</text><rect x="15" y="125" width="170" height="130" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="100" y="163.75" font-weight="700">Unit 1</tspan><tspan x="100" dy="21">사용자 → 역할</tspan><tspan x="100" dy="21">→ 권한 표</tspan><tspan x="100" dy="21">check_permission</tspan></text><rect x="235" y="60" width="290" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="380" y="84.25" font-weight="700">실습 2-1</tspan><tspan x="380" dy="21">입사 · 이동 · 퇴사에 맞춰</tspan><tspan x="380" dy="21">역할 부여 · 접근 회수</tspan></text><line x1="188" y1="190" x2="231" y2="100" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><line x1="528" y1="100" x2="571" y2="190" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="235" y="155" width="290" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="380" y="179.25" font-weight="700">실습 2-2</tspan><tspan x="380" dy="21">정해진 시각까지만 허용하는</tspan><tspan x="380" dy="21">예외 권한 · 남은 예외 찾기</tspan></text><line x1="188" y1="190" x2="231" y2="195" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><line x1="528" y1="195" x2="571" y2="190" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="235" y="250" width="290" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="380" y="274.25" font-weight="700">실습 2-3</tspan><tspan x="380" dy="21">역할 + 예외 권한을 합쳐</tspan><tspan x="380" dy="21">최종 판정 policy.py</tspan></text><line x1="188" y1="190" x2="231" y2="290" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><line x1="528" y1="290" x2="571" y2="190" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="575" y="125" width="130" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="640" y="163.75" font-weight="700">Unit 3</tspan><tspan x="640" dy="21">실습 3-2</tspan><tspan x="640" dy="21">마지막에</tspan><tspan x="640" dy="21">깃허브에 올림</tspan></text></g></svg>
