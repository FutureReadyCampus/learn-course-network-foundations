<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img"><title>확인 파일 하나를 만들어 push 하고 깃허브에서 내 아이디로 올라갔는지 보는 순서</title><desc>VS Code 에서 New File 로 docs/2026-10-23_seat.md 를 만들고 git add, commit, push 를 차례로 합니다. git status 에 .env 가 보이면 멈추고, push 때 로그인 창이 뜨면 내 계정으로 Authorize 합니다.</desc><defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">7장 · 내 계정으로 올라가는지 확인합니다</text><rect x="30" y="55" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="220" y="80.25">New File: docs/2026-10-23_seat.md</tspan></text><line x1="220" y1="97" x2="220" y2="111" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/><rect x="30" y="113" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="220" y="138.25">git status · git add .</tspan></text><line x1="220" y1="155" x2="220" y2="169" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/><rect x="30" y="171" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="220" y="196.25">git commit -m &quot;Check new seat setup&quot;</tspan></text><line x1="220" y1="213" x2="220" y2="227" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/><rect x="30" y="229" width="380" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="220" y="254.25">git push</tspan></text><line x1="220" y1="271" x2="220" y2="285" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p08)"/><rect x="30" y="287" width="380" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="220" y="312.25">깃허브: 커밋 옆 이름이 내 아이디</tspan></text><line x1="410" y1="133" x2="440" y2="133" stroke="#666660" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="440" y="109" width="265" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="572.5" y="128.1">.env 가 보이면 멈추고</tspan><tspan x="572.5" dy="19.6">.gitignore 에 .env 확인</tspan></text><line x1="410" y1="249" x2="440" y2="249" stroke="#666660" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="440" y="225" width="265" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="572.5" y="244.1">로그인 창이 뜨면 브라우저에서</tspan><tspan x="572.5" dy="19.6">내 계정으로 Authorize</tspan></text></g></svg>
