<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img"><title>VS Code 에서 Git Bash 터미널을 열고 바탕화면으로 가는 네 단계</title><desc>Terminal 메뉴로 새 터미널을 열고 bash 인지 확인합니다. cd ~/Desktop 으로 이동한 뒤 pwd 결과가 Desktop 으로 끝나면 됩니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">1장 · 터미널을 엽니다</text><rect x="15" y="70" width="150" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="90" y="114.25" font-weight="700">1. 터미널 열기</tspan><tspan x="90" dy="21">Terminal ›</tspan><tspan x="90" dy="21">New Terminal</tspan></text><line x1="168" y1="130" x2="192" y2="130" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/><rect x="195" y="70" width="150" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="270" y="114.25" font-weight="700">2. 셸 확인</tspan><tspan x="270" dy="21">bash 인지 보기</tspan><tspan x="270" dy="21">아니면 Git Bash</tspan></text><line x1="348" y1="130" x2="372" y2="130" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/><rect x="375" y="70" width="150" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="450" y="114.25" font-weight="700">3. 바탕화면으로</tspan><tspan x="450" dy="21">cd ~/Desktop</tspan><tspan x="450" dy="21">pwd</tspan></text><line x1="528" y1="130" x2="552" y2="130" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/><rect x="555" y="70" width="150" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="630" y="114.25" font-weight="700">4. 확인</tspan><tspan x="630" dy="21">…/Desktop 으로</tspan><tspan x="630" dy="21">끝나면 됩니다</tspan></text><text x="360" y="232" font-size="15" text-anchor="middle" fill="#666660">[VS Code] 에서 1번, [터미널] 에서 2~3번을 합니다</text></g></svg>
