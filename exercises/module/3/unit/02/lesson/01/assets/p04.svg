<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>앞 사람 로그인과 git 이름을 지우고 내 것으로 바꾸는 전후 비교</title><desc>자격 증명 관리자의 git:https://github.com 항목을 제거하면 다음 push 때 내 계정으로 로그인합니다. git config --global 로 이름과 이메일을 내 것으로 적습니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">3장 · 앞 사람 연결을 끊고 내 것으로 바꿉니다</text><text x="255" y="64" font-size="15" text-anchor="middle" fill="#666660">지금 (앞 사람 것)</text><text x="577" y="64" font-size="15" text-anchor="middle" fill="#666660">바꾼 뒤 (내 것)</text><rect x="15" y="80" width="110" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="70" y="135.25" font-weight="700">로그인</tspan></text><rect x="140" y="80" width="230" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="255" y="115.3">자격 증명 관리자</tspan><tspan x="255" dy="19.6">git:https://github.com</tspan><tspan x="255" dy="19.6">(앞 사람 아이디)</tspan></text><line x1="375" y1="130" x2="443" y2="130" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="450" y="80" width="255" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="577.5" y="115.3" font-weight="700">제거 → 예</tspan><tspan x="577.5" dy="19.6">다음 push 때</tspan><tspan x="577.5" dy="19.6">내 계정으로 로그인</tspan></text><rect x="15" y="200" width="110" height="100" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="70" y="255.25" font-weight="700">git 이름</tspan></text><rect x="140" y="200" width="230" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="255" y="245.1">user.name = 앞 사람</tspan><tspan x="255" dy="19.6">user.email = 앞 사람</tspan></text><line x1="375" y1="250" x2="443" y2="250" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="450" y="200" width="255" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="577.5" y="235.3" font-weight="700">git config --global</tspan><tspan x="577.5" dy="19.6">user.name &quot;내 이름&quot;</tspan><tspan x="577.5" dy="19.6">user.email &quot;가입한 이메일&quot;</tspan></text></g></svg>
