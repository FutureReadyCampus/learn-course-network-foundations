<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>앞 사람 흔적이 남은 PC를 내 폴더와 내 계정으로 바꾸는 과제의 전과 후</title><desc>왼쪽은 지금 PC에 남아 있을 수 있는 앞 사람의 폴더, 로그인, git 이름, 도커 컨테이너입니다. 오른쪽은 과제를 마친 뒤 모습으로, 앞 사람 폴더는 _old 로 남고 내 폴더와 내 계정으로 올라갑니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">준비 · 새 자리에서 내 깃허브 연결하기</text><rect x="15" y="60" width="310" height="230" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="170" y="138.25" font-weight="700">지금 이 PC</tspan><tspan x="170" dy="21">앞 사람 폴더</tspan><tspan x="170" dy="21">앞 사람 깃허브 로그인</tspan><tspan x="170" dy="21">앞 사람 git 이름 · 이메일</tspan><tspan x="170" dy="21">앞 사람 도커 컨테이너</tspan></text><line x1="332" y1="175" x2="388" y2="175" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><text x="360" y="160" font-size="14" text-anchor="middle" fill="#666660">정리</text><rect x="395" y="60" width="310" height="230" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="550" y="127.75" font-weight="700">끝나면</tspan><tspan x="550" dy="21">security-agent-toolkit_old (앞 사람)</tspan><tspan x="550" dy="21">security-agent-toolkit (내 것)</tspan><tspan x="550" dy="21">push = 내 이름 · 내 계정</tspan><tspan x="550" dy="21">깃허브에 확인 파일이 보임</tspan><tspan x="550" dy="21">컨테이너 없음 · 포트 비어 있음</tspan></text></g></svg>
