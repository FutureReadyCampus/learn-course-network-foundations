<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>새 자리 준비를 마쳤는지 확인하는 여섯 항목 체크리스트</title><desc>폴더 두 개, git 이름, 저장소 주소, 마지막 커밋, 깃허브에 올라간 확인 파일, 비어 있는 도커 컨테이너 목록을 차례로 확인합니다.</desc><defs><marker id="a-p11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">다 했으면 확인</text><rect x="40" y="65" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="80" font-size="15" text-anchor="start" fill="#292929">바탕화면에 network-study-notes_old 와 network-study-notes 이 따로 있다</text><rect x="40" y="105" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="120" font-size="15" text-anchor="start" fill="#292929">git config --global user.name 이 내 이름이다</text><rect x="40" y="145" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="160" font-size="15" text-anchor="start" fill="#292929">git remote -v 주소에 내 아이디가 있다</text><rect x="40" y="185" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="200" font-size="15" text-anchor="start" fill="#292929">git log --oneline -3 맨 위가 Unit 1 마무리 커밋이다</text><rect x="40" y="225" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="240" font-size="15" text-anchor="start" fill="#292929">깃허브에 docs/2026-10-23_seat.md 가 내 아이디로 올라가 있다</text><rect x="40" y="265" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/><text x="70" y="280" font-size="15" text-anchor="start" fill="#292929">docker ps -a 에 제목 줄만 나온다 (Docker Desktop 이 없으면 건너뜀)</text><text x="360" y="310" font-size="14" text-anchor="middle" fill="#666660">앞 사람 폴더가 없었으면 내 폴더만 있으면 됩니다</text></g></svg>
