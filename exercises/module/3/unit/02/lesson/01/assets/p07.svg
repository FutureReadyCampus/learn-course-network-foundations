<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img"><title>받은 폴더가 Unit 1 마무리에서 올린 내 저장소인지 세 명령으로 확인하는 표</title><desc>git remote -v 주소에 내 아이디가 있고, git log --oneline -3 맨 위가 Unit 1 마무리 커밋이며, ls 에 access_control 폴더가 보이면 됩니다. 깃허브 폴더 리스트와 VS Code 목록도 같아야 합니다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">6장 · 받은 폴더가 내 것인지 확인합니다</text><text x="360" y="62" font-size="15" text-anchor="middle" fill="#666660">먼저 pwd 가 …/network-study-notes 인지 봅니다</text><rect x="15" y="80" width="690" height="42" rx="2" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="106.25" font-weight="700">명령</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="106.25" font-weight="700">이렇게 나오면 됩니다</tspan></text><rect x="15" y="122" width="690" height="42" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="148.25">git remote -v</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="148.25">github.com/ 뒤가 내 아이디</tspan></text><rect x="15" y="164" width="690" height="42" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="190.25">git log --oneline -3</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="190.25">맨 위 줄이 Add access control unit 1 …</tspan></text><rect x="15" y="206" width="690" height="42" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="start" fill="#292929"><tspan x="25" y="232.25">ls</tspan></text><text font-size="15" text-anchor="start" fill="#292929"><tspan x="245" y="232.25">access_control 폴더가 보임</tspan></text><text x="360" y="270" font-size="15" text-anchor="middle" fill="#666660">브라우저의 깃허브 폴더 리스트와 VS Code 왼쪽 목록이 같은지도 봅니다</text></g></svg>
