<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img"><title>막혔을 때 화면에 나온 메시지와 뜻, 할 일을 짝지은 표</title><desc>clone 때 폴더가 이미 있으면 4장, mv 가 막히면 폴더를 닫고, push 가 앞 사람 아이디로 거부되면 3장 1번을 합니다. 커밋 이름이 앞 사람이면 3장 2번, Unit 1 마무리 커밋이 없으면 6장 주소를 확인합니다.</desc><defs><marker id="a-p10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">막히면 · 화면에 나온 것 → 뜻 → 할 일</text><rect x="15" y="55" width="690" height="50" rx="2" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="84.9" font-weight="700">화면에 나온 것</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="84.9" font-weight="700">뜻</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="84.9" font-weight="700">할 일</tspan></text><rect x="15" y="105" width="690" height="50" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="125.1">destination path …</tspan><tspan x="25" dy="19.6">already exists</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="134.9">같은 이름 폴더가 있음</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="134.9">4장: _old 로 이름 바꾸기</tspan></text><rect x="15" y="155" width="690" height="50" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="175.1">mv 뒤 Permission denied</tspan><tspan x="25" dy="19.6">또는 resource busy</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="184.9">폴더가 어딘가 열려 있음</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="184.9">Close Folder 후 다시 mv</tspan></text><rect x="15" y="205" width="690" height="50" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="234.9">push: denied to 앞사람아이디</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="234.9">앞 사람 로그인이 남음</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="234.9">3장 1번 → 다시 git push</tspan></text><rect x="15" y="255" width="690" height="50" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="284.9">커밋 옆 이름이 앞 사람</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="284.9">git 이름 · 이메일이 앞 사람</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="284.9">3장 2번 → 다음 커밋부터</tspan></text><rect x="15" y="305" width="690" height="50" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="start" fill="#292929"><tspan x="25" y="325.1">git log 맨 위에</tspan><tspan x="25" dy="19.6">Unit 1 마무리 커밋 없음</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="275" y="334.9">push 안 됐거나 다른 저장소</tspan></text><text font-size="14" text-anchor="start" fill="#292929"><tspan x="485" y="334.9">6장 git remote -v 확인</tspan></text></g></svg>
