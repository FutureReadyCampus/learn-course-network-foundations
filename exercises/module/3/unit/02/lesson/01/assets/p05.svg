<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img"><title>앞 사람 폴더를 지우지 않고 이름 끝에 _old 를 붙이는 mv 명령</title><desc>문서 폴더의 앞 사람 security-agent-toolkit 을 mv 로 security-agent-toolkit_old 로 바꿉니다. 그 전에 VS Code 에서 File › Close Folder 로 폴더를 닫습니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">4장 · 앞 사람 폴더 이름 끝에 _old 를 붙입니다</text><rect x="30" y="60" width="270" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="165" y="99.25" font-weight="700">문서(Documents)</tspan><tspan x="165" dy="21">security-agent-toolkit</tspan><tspan x="165" dy="21">(앞 사람 폴더)</tspan></text><line x1="306" y1="115" x2="414" y2="115" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p05)"/><text x="360" y="103" font-size="15" text-anchor="middle" fill="#666660" font-weight="700">mv</text><rect x="420" y="60" width="270" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="555" y="99.25" font-weight="700">문서(Documents)</tspan><tspan x="555" dy="21">security-agent-toolkit_old</tspan><tspan x="555" dy="21">(지우지 않고 이름만 바꿈)</tspan></text><text x="360" y="205" font-size="15" text-anchor="middle" fill="#292929">mv security-agent-toolkit security-agent-toolkit_old</text><rect x="30" y="228" width="660" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="254.1">먼저 VS Code 에서 File › Close Folder (열려 있으면 이름이 안 바뀔 수 있음)</tspan><tspan x="360" dy="19.6">2장 1번에서 폴더가 없었으면 이 장은 건너뜁니다</tspan></text></g></svg>
