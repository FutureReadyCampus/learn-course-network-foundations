<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>깃허브의 내 저장소 주소를 복사해 git clone 으로 바탕화면에 받는 순서</title><desc>브라우저에서 내 저장소의 HTTPS 주소를 복사하고 git clone 으로 받은 뒤 VS Code 에서 _old 가 없는 폴더를 엽니다. 저장소 이름이 다르면 주소 뒤에 network-study-notes 을 붙여 받고, 처음 받을 때는 pull 이 아니라 clone 을 씁니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">5장 · 내 폴더를 깃허브에서 받습니다</text><rect x="15" y="55" width="150" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="90" y="89.25" font-weight="700">1. 브라우저</tspan><tspan x="90" dy="21">내 계정으로</tspan><tspan x="90" dy="21">내 저장소 열기</tspan></text><line x1="168" y1="105" x2="192" y2="105" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="195" y="55" width="150" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="270" y="89.25" font-weight="700">2. 주소 복사</tspan><tspan x="270" dy="21">Code › HTTPS</tspan><tspan x="270" dy="21">› 복사</tspan></text><line x1="348" y1="105" x2="372" y2="105" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="375" y="55" width="150" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="450" y="99.75" font-weight="700">3. 받기</tspan><tspan x="450" dy="21">git clone 주소</tspan></text><line x1="528" y1="105" x2="552" y2="105" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/><rect x="555" y="55" width="150" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="630" y="89.25" font-weight="700">4. VS Code</tspan><tspan x="630" dy="21">Open Folder</tspan><tspan x="630" dy="21">_old 없는 것</tspan></text><rect x="15" y="180" width="690" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="210.3" font-weight="700">저장소 이름이 다르면 (예: my-toolkit)</tspan><tspan x="360" dy="19.6">git clone https://github.com/내아이디/my-toolkit.git network-study-notes</tspan><tspan x="360" dy="19.6">→ 내 PC 폴더 이름이 network-study-notes 이 됩니다</tspan></text><rect x="15" y="290" width="335" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="182.5" y="319.75" font-weight="700">git clone — 이번에 씀</tspan><tspan x="182.5" dy="21">처음 받을 때 · 폴더째 받음</tspan></text><rect x="370" y="290" width="335" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="537.5" y="319.75" font-weight="700">git pull</tspan><tspan x="537.5" dy="21">이미 받은 폴더를 최신으로</tspan></text></g></svg>
