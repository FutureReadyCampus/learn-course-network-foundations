<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-1 정리: 요청서 딕셔너리, 다음 번호, 접수 거절 조건, reviewing, append</title>
<desc>실습 2-1에서 쓴 코드를 하려는 일별로 정리했습니다. 요청서는 키 아홉 개 딕셔너리이고, 번호는 len(REQUESTS) + 1, 접수한 요청은 reviewing 상태로 REQUESTS 에 추가합니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 2-1 정리</text>
<rect x="30" y="58" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="85.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">요청서 한 장</text>
<line x1="230" y1="81" x2="258" y2="81" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="260" y="58" width="440" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="85.6" font-size="15" fill="#292929" text-anchor="start">딕셔너리 · 키 아홉 개 (id · user · … · status)</text>
<rect x="30" y="114" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="141.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">다음 요청 번호</text>
<line x1="230" y1="137" x2="258" y2="137" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="260" y="114" width="440" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="141.6" font-size="15" fill="#292929" text-anchor="start">len(REQUESTS) + 1</text>
<rect x="30" y="170" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="197.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">접수 못 하는 요청</text>
<line x1="230" y1="193" x2="258" y2="193" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="260" y="170" width="440" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="197.6" font-size="15" fill="#292929" text-anchor="start">사용자 파일에 없음 · 이유 "" · until &lt;= received_at</text>
<rect x="30" y="226" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="253.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">접수한 요청의 상태</text>
<line x1="230" y1="249" x2="258" y2="249" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="260" y="226" width="440" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="253.6" font-size="15" fill="#292929" text-anchor="start">"reviewing"</text>
<rect x="30" y="282" width="200" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="309.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">리스트에 추가하기</text>
<line x1="230" y1="305" x2="258" y2="305" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="260" y="282" width="440" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="274" y="309.6" font-size="15" fill="#292929" text-anchor="start">REQUESTS.append(request)</text>
</svg>
