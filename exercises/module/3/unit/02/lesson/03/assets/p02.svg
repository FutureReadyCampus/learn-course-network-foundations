<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>사용자 파일을 손으로 고칠 때와 함수로 처리할 때의 차이</title><desc>손으로 고치면 salse 같은 역할 이름 오타나 퇴사 처리 누락이 생길 수 있습니다. 함수로 처리하면 검사가 늘 같은 순서로 들어가고, 입사·이동·퇴사는 계정 관리의 기본 흐름입니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">왜 입사 · 이동 · 퇴사를 함수로 처리하는가</text><rect x="15" y="55" width="330" height="150" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="180" y="103.75" font-weight="700">손으로 users.json 고치기</tspan><tspan x="180" dy="21">역할 이름 오타: salse</tspan><tspan x="180" dy="21">퇴사 처리를 빠뜨림</tspan><tspan x="180" dy="21">→ 퇴사자 계정이 쓸 수 있게 남음</tspan></text><rect x="375" y="55" width="330" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="540" y="103.75" font-weight="700">함수로 처리하기</tspan><tspan x="540" dy="21">검사가 늘 같은 순서로</tspan><tspan x="540" dy="21">없는 역할 이름은 거부</tspan><tspan x="540" dy="21">퇴사 = employed 를 false 로</tspan></text><text x="360" y="240" font-size="15" text-anchor="middle" fill="#666660" font-weight="700">계정 관리의 기본 흐름</text><rect x="60" y="258" width="173.333" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="146.667" y="293.25">입사 · joiner</tspan></text><line x1="236.333" y1="288" x2="270.333" y2="288" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/><rect x="273.333" y="258" width="173.333" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="293.25">이동 · mover</tspan></text><line x1="449.667" y1="288" x2="483.667" y2="288" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/><rect x="486.667" y="258" width="173.333" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="573.333" y="293.25">퇴사 · leaver</tspan></text></g></svg>
