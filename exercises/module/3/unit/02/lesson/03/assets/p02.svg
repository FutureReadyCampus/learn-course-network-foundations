<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>말로 받은 요청은 기록이 없고, 요청서로 받으면 접수에서 거른 뒤 승인·부여로 이어진다</title>
<desc>왼쪽은 메신저나 말로 받은 요청의 문제, 오른쪽은 요청서로 받을 때의 장점입니다. 아래는 이번 Unit 의 흐름으로, 실습 2-1 접수, 실습 2-2 승인 · 반려, 권한 부여 준비 req_grant.py 의 예외 부여를 거쳐 evaluate_access 가 허용으로 판정합니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">왜 요청을 요청서로 받는가</text>
<rect x="30" y="56" width="300" height="140" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="180" y="99.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">메신저 · 말로 받으면</text>
<text x="180" y="120.1" font-size="15" fill="#292929" text-anchor="middle">기록이 남지 않음</text>
<text x="180" y="141.1" font-size="15" fill="#292929" text-anchor="middle">승인 기준이 사람마다 다름</text>
<text x="180" y="162.1" font-size="15" fill="#292929" text-anchor="middle">받아 놓고 회수를 잊음</text>
<line x1="330" y1="126" x2="388" y2="126" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="390" y="56" width="310" height="140" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="545" y="99.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">요청서로 받으면</text>
<text x="545" y="120.1" font-size="15" fill="#292929" text-anchor="middle">정해진 모양의 기록</text>
<text x="545" y="141.1" font-size="15" fill="#292929" text-anchor="middle">빠진 정보가 있는 요청은</text>
<text x="545" y="162.1" font-size="15" fill="#292929" text-anchor="middle">접수 단계에서 걸러 냄</text>
<text x="30" y="232" font-size="16" fill="#292929" text-anchor="start" font-weight="700">이번 Unit 의 흐름</text>
<rect x="30" y="250" width="150" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="105" y="282.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 2-1</text>
<text x="105" y="303.1" font-size="15" fill="#292929" text-anchor="middle">요청서 접수</text>
<line x1="180" y1="288" x2="198" y2="288" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="200" y="250" width="150" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="275" y="282.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 2-2</text>
<text x="275" y="303.1" font-size="15" fill="#292929" text-anchor="middle">승인 · 반려</text>
<line x1="350" y1="288" x2="368" y2="288" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="370" y="250" width="150" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="445" y="271.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">req_grant.py</text>
<text x="445" y="292.6" font-size="15" fill="#292929" text-anchor="middle">정책 확인 후</text>
<text x="445" y="313.6" font-size="15" fill="#292929" text-anchor="middle">예외 권한 부여</text>
<line x1="520" y1="288" x2="538" y2="288" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p02)"/>
<rect x="540" y="250" width="150" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="615" y="271.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">policy.py</text>
<text x="615" y="292.6" font-size="15" fill="#292929" text-anchor="middle">evaluate_access</text>
<text x="615" y="313.6" font-size="15" fill="#292929" text-anchor="middle">허용으로 판정</text>
</svg>
