<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img"><title>요청서는 reviewing 에서 승인되면 approved, 반려되면 rejected, 정책 확인을 통과하면 granted 가 됩니다</title><desc>실습 2-1 의 create_request 로 요청서를 접수하면 status 가 reviewing(검토 중)이 됩니다. 실습 2-2 에서 반려되면 rejected(반려됨), 승인되면 approved(승인됨)가 되고, 응용 2-1 의 grant_request 에서 정책 확인을 통과하면 granted(부여됨)가 됩니다.</desc><defs><marker id="a-f01-0402" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="28" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">요청서 한 장의 상태 변화</text><rect x="40" y="46" width="340" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="210.0" y="71.1" font-weight="700">요청서 접수 (create_request)</tspan><tspan x="210.0" y="91.4">실습 2-1</tspan></text><path d="M210,106 V142" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0402)"/><rect x="40" y="146" width="340" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="210.0" y="176.2" font-weight="700">status: reviewing (검토 중)</tspan></text><path d="M380,171 H466" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0402)"/><text x="400" y="163" font-size="14" text-anchor="start" fill="#292929">반려</text><rect x="470" y="141" width="230" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="585.0" y="166.5" font-weight="700">status: rejected (반려됨)</tspan><tspan x="585.0" y="185.4">실습 2-2</tspan></text><path d="M210,196 V246" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0402)"/><text x="220" y="226" font-size="14" text-anchor="start" fill="#292929">승인</text><rect x="40" y="250" width="340" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="210.0" y="275.1" font-weight="700">status: approved (승인됨)</tspan><tspan x="210.0" y="295.4">실습 2-2</tspan></text><path d="M210,310 V356" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0402)"/><text x="220" y="338" font-size="14" text-anchor="start" fill="#292929">정책 확인을 통과하면</text><rect x="40" y="360" width="340" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="210.0" y="385.1" font-weight="700">status: granted (부여됨)</tspan><tspan x="210.0" y="405.4">req_grant.py · grant_request</tspan></text></g></svg>
