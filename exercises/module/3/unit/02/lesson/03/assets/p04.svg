<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>함수 안의 user_dict 와 바깥의 users 가 같은 딕셔너리 하나임을 보여 주는 그림</title><desc>retire(users) 를 부르면 함수 안의 user_dict 는 바깥 users 와 같은 딕셔너리를 가리킵니다. 그래서 함수 안에서 employed 를 False 로 바꾸면 print(users) 에도 바뀐 값이 나옵니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">1.2 함수가 딕셔너리를 바꾸는 방식</text><rect x="30" y="65" width="190" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="125" y="89.75" font-weight="700">users</tspan><tspan x="125" dy="21">함수 밖 이름</tspan></text><rect x="30" y="160" width="190" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="125" y="184.75" font-weight="700">user_dict</tspan><tspan x="125" dy="21">함수 안 이름</tspan></text><line x1="224" y1="95" x2="316" y2="125" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><line x1="224" y1="190" x2="316" y2="160" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="320" y="80" width="385" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="512.5" y="124.25" font-weight="700">같은 딕셔너리 하나</tspan><tspan x="512.5" dy="21">&quot;junho&quot;: {&quot;role&quot;: &quot;finance&quot;, …}</tspan><tspan x="512.5" dy="21">employed: True → False</tspan></text><line x1="512" y1="204" x2="512" y2="238" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="270" y="242" width="435" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="487.5" y="267.1" font-weight="700">print(users)</tspan><tspan x="487.5" dy="19.6">{'junho': {'role': 'finance', 'employed': False}}</tspan></text><rect x="30" y="242" width="220" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="140" y="267.1">retire(users)</tspan><tspan x="140" dy="19.6">함수에 넘긴다</tspan></text><text x="360" y="328" font-size="15" text-anchor="middle" fill="#666660">함수 안에서 바꾼 값이 함수 밖에도 남습니다</text></g></svg>
