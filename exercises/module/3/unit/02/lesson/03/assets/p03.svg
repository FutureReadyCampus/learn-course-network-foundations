<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>요청서는 키 아홉 개 딕셔너리이고, status 는 reviewing 에서 approved·rejected·granted 로 간다</title>
<desc>왼쪽은 seoyeon 의 요청서 한 장을 키와 값으로 보여 줍니다. 오른쪽은 status 값이 실습 2-1 의 reviewing 에서 실습 2-2 의 approved 또는 rejected, 도전 2-1 의 granted 로 바뀌는 순서입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">요청서 한 장과 상태(status)</text>
<rect x="24" y="52" width="340" height="310" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="87.2" font-size="15" fill="#292929" text-anchor="start" font-weight="700">요청서 (딕셔너리)</text>
<text x="38" y="115.2" font-size="15" fill="#292929" text-anchor="start">id: 1</text>
<text x="38" y="143.2" font-size="15" fill="#292929" text-anchor="start">user: "seoyeon"</text>
<text x="38" y="171.2" font-size="15" fill="#292929" text-anchor="start">resource: "SETTLE"</text>
<text x="38" y="199.2" font-size="15" fill="#292929" text-anchor="start">action: "QUERY"</text>
<text x="38" y="227.2" font-size="15" fill="#292929" text-anchor="start">permission: "SETTLE:QUERY"</text>
<text x="38" y="255.2" font-size="15" fill="#292929" text-anchor="start">until: "2026-10-27 18:00"</text>
<text x="38" y="283.2" font-size="15" fill="#292929" text-anchor="start">reason: "정산 대조 지원"</text>
<text x="38" y="311.2" font-size="15" fill="#292929" text-anchor="start">requested_at: "2026-10-23 08:30"</text>
<text x="38" y="339.2" font-size="15" fill="#292929" text-anchor="start">status: "reviewing"</text>
<rect x="450" y="58" width="200" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="550" y="80.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">reviewing</text>
<text x="550" y="101.1" font-size="15" fill="#292929" text-anchor="middle">검토 중 (실습 2-1)</text>
<line x1="510" y1="114" x2="460" y2="168" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="468" y="140" font-size="14" fill="#666660" text-anchor="end">승인</text>
<line x1="590" y1="114" x2="640" y2="168" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="632" y="140" font-size="14" fill="#666660" text-anchor="start">반려</text>
<rect x="384" y="170" width="150" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="459" y="192.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">approved</text>
<text x="459" y="213.1" font-size="15" fill="#292929" text-anchor="middle">승인됨 (실습 2-2)</text>
<rect x="550" y="170" width="150" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="625" y="192.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">rejected</text>
<text x="625" y="213.1" font-size="15" fill="#292929" text-anchor="middle">반려됨 (실습 2-2)</text>
<line x1="459" y1="226" x2="459" y2="290" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/>
<text x="470" y="262" font-size="14" fill="#666660" text-anchor="start">정책 확인을 통과하면</text>
<rect x="384" y="292" width="150" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="459" y="314.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">granted</text>
<text x="459" y="335.1" font-size="15" fill="#292929" text-anchor="middle">부여됨 (부여 단계)</text>
</svg>
