<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" role="img"><title>evaluate_access 가 역할 판정 다음 예외 판정을 하는 순서도</title><desc>check_permission 이 허용하면 역할 권한으로 허용하고, 권한 없음이 아닌 이유로 거부하면 그 이유로 거부합니다. 권한 없음일 때만 find_exception 으로 유효한 예외를 찾아 있으면 허용, 없으면 거부합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">3.1 판정 순서</text><rect x="170" y="48" width="380" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="74.9">evaluate_access(사용자, 자원, 행위, 지금 시각)</tspan></text><line x1="360" y1="94" x2="360" y2="121" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><rect x="200" y="125" width="320" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="155.25" font-weight="700">[역할 판정] check_permission</tspan></text><line x1="523" y1="150" x2="571" y2="150" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><text x="547" y="140" font-size="14" text-anchor="middle" fill="#666660">허용</text><rect x="575" y="125" width="130" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="640" y="154.9">허용: 역할 권한</tspan></text><line x1="197" y1="150" x2="149" y2="150" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><text x="173" y="140" font-size="14" text-anchor="middle" fill="#666660">거부</text><rect x="15" y="115" width="130" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="80" y="145.3">거부: 이유 그대로</tspan><tspan x="80" dy="19.6">없는 사용자 ·</tspan><tspan x="80" dy="19.6">퇴사 · 역할 없음</tspan></text><line x1="360" y1="177" x2="360" y2="241" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><text x="372" y="214" font-size="14" text-anchor="start" fill="#666660">거부(권한 없음)일 때만</text><rect x="200" y="245" width="320" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="275.25" font-weight="700">[예외 판정] find_exception</tspan></text><line x1="523" y1="270" x2="571" y2="270" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><text x="547" y="260" font-size="14" text-anchor="middle" fill="#666660">있음</text><rect x="575" y="245" width="130" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="640" y="274.9">허용: 예외 N번</tspan></text><line x1="360" y1="297" x2="360" y2="336" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p03)"/><text x="372" y="322" font-size="14" text-anchor="start" fill="#666660">없음</text><rect x="255" y="340" width="210" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="367.25">거부: 권한 없음</tspan></text><text x="360" y="418" font-size="15" text-anchor="middle" fill="#666660">사람 자체가 거부 대상이면 예외 검사까지 가지 않습니다</text></g></svg>
