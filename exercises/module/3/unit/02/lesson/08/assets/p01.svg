<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>도전 2-3: 요청서 리스트를 requests.json 에 저장하고 상태별 건수를 센다</title>
<desc>요청서 리스트 REQUESTS 가 두 함수로 들어갑니다. save_requests 는 requests.json 파일에 쓰고 저장한 건수를 돌려주고, count_by_status 는 상태별 건수 딕셔너리를 돌려줍니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">도전 2-3 · 무엇을 만드나</text>
<rect x="20" y="110" width="170" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="105" y="144.628" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">입력</text>
<text x="105" y="166.02" font-size="15" fill="#292929" text-anchor="middle">REQUESTS</text>
<text x="105" y="186.012" font-size="14" fill="#666660" text-anchor="middle">요청서 여섯 건</text>
<rect x="250" y="64" width="200" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="350" y="94.428" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">save_requests</text>
<text x="350" y="115.82" font-size="15" fill="#292929" text-anchor="middle">파일에 저장</text>
<rect x="250" y="184" width="200" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="350" y="214.428" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">count_by_status</text>
<text x="350" y="235.82" font-size="15" fill="#292929" text-anchor="middle">상태별로 세기</text>
<rect x="500" y="64" width="200" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="94.428" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">requests.json</text>
<text x="600" y="115.82" font-size="15" fill="#292929" text-anchor="middle">+ 저장한 건수 리턴</text>
<rect x="500" y="184" width="200" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="214.428" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">{상태: 건수}</text>
<text x="600" y="235.82" font-size="15" fill="#292929" text-anchor="middle">딕셔너리 리턴</text>
<polyline points="190,140 246,100" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="190,180 246,220" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,100 496,100" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,220 496,220" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="20" y="296" font-size="15" fill="#666660">끝나면: 보고서 (가)~(다) → 도전 파일도 깃허브에 올리기</text>
</g>
</svg>
