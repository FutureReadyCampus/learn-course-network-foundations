<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img">
<title>응용 파일도 핵심 실습 마무리와 같은 순서로 깃허브에 올린다</title>
<desc>security-agent-toolkit 폴더로 옮겨 git status 로 올릴 파일을 먼저 봅니다. .env 나 .venv 가 보이면 멈추고 .gitignore 에 적습니다. 내가 한 응용의 보고서 칸을 채운 뒤 add, commit, push 하고 브라우저에서 응용 파일을 확인합니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">응용 파일도 깃허브에 올리기</text>
<rect x="20" y="52" width="380" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="210" y="75.128" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">1 · cd .. → pwd</text>
<text x="210" y="95.512" font-size="14" fill="#666660" text-anchor="middle">…/security-agent-toolkit 인지</text>
<rect x="20" y="126" width="380" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="210" y="148.428" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">2 · git status</text>
<text x="210" y="169.82" font-size="15" fill="#292929" text-anchor="middle">.env · .venv 가 보이나?</text>
<polyline points="210,108 210,123" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="20" y="200" width="380" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="210" y="232.928" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">3 · 보고서 응용 칸 채우기</text>
<polyline points="210,182 210,197" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="20" y="274" width="380" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="210" y="306.928" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">4 · git add . → commit → push</text>
<polyline points="210,256 210,271" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="20" y="348" width="380" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="210" y="371.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">5 · 브라우저에서 확인</text>
<text x="210" y="391.512" font-size="14" fill="#666660" text-anchor="middle">응용 파일이 보이나</text>
<polyline points="210,330 210,345" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="450" y="112" width="250" height="88" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="575" y="139.928" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">보이면 멈춤</text>
<text x="575" y="161.32" font-size="15" fill="#292929" text-anchor="middle">.gitignore 맨 아래에 적고</text>
<text x="575" y="182.32" font-size="15" fill="#292929" text-anchor="middle">git status 다시</text>
<polyline points="400,154 446,154" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<text x="423" y="146" font-size="14" fill="#666660" text-anchor="middle">예</text>
<text x="220" y="195" font-size="14" fill="#666660">아니오</text>
<rect x="450" y="274" width="250" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="575" y="303.428" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">push 가 rejected 면</text>
<text x="575" y="324.82" font-size="15" fill="#292929" text-anchor="middle">git pull 뒤 다시 push</text>
<polyline points="400,302 450,309" fill="none" stroke="#666660" stroke-width="1.5" stroke-dasharray="5 4"/>
</g>
</svg>
