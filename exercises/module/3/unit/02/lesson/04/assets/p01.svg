<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>예외 파일과 find_exception 함수로 판정과 회수 점검을 하는 실습 2-2</title><desc>입력은 예외 다섯 건이 든 config/exceptions.json 이고, exception_policy.py 의 find_exception 이 지금 유효한 예외가 있는지 판정합니다. exercise2-2_run.py 는 단계 1 판정과 단계 2 회수 점검을 출력합니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">실습 2-2 · 예외 파일과 유효 판정 함수</text><rect x="15" y="65" width="225" height="190" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="127.5" y="135.5" font-weight="700">config/exceptions.json</tspan><tspan x="127.5" dy="19.6">예외 5건</tspan><tspan x="127.5" dy="19.6">1~3번 붙여 넣기</tspan><tspan x="127.5" dy="19.6">4 · 5번 직접 씀</tspan></text><line x1="245" y1="160" x2="263" y2="160" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="268" y="65" width="210" height="190" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="373" y="135.5" font-weight="700">exception_policy.py</tspan><tspan x="373" dy="19.6">find_exception</tspan><tspan x="373" dy="19.6">지금 유효한</tspan><tspan x="373" dy="19.6">예외가 있나</tspan></text><line x1="483" y1="160" x2="501" y2="160" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p01)"/><rect x="506" y="65" width="199" height="190" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="605.5" y="145.3" font-weight="700">exercise2-2_run.py</tspan><tspan x="605.5" dy="19.6">단계 1: 판정 6건</tspan><tspan x="605.5" dy="19.6">단계 2: 회수할 예외</tspan></text><text x="360" y="292" font-size="15" text-anchor="middle" fill="#666660">역할은 그대로 두고, 그 사람에게만 만료 시각까지만 허용</text></g></svg>
