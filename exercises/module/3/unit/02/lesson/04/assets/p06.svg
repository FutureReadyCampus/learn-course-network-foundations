<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 2-2 정리: 검토 중만 처리, 본인 요청 막기, 상태 바꾸기, approver 남기기, .get</title>
<desc>실습 2-2에서 쓴 코드를 하려는 일별로 정리했습니다. 상태가 reviewing 인지, 요청자와 처리자가 다른지 먼저 확인한 뒤 상태와 approver 를 바꿉니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="700">실습 2-2 정리</text>
<rect x="30" y="58" width="210" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135" y="85.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">검토 중일 때만 처리</text>
<line x1="240" y1="81" x2="268" y2="81" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="270" y="58" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="85.6" font-size="15" fill="#292929" text-anchor="start">status != "reviewing" → False, "검토 중이 아님"</text>
<rect x="30" y="114" width="210" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135" y="141.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">본인 요청 막기</text>
<line x1="240" y1="137" x2="268" y2="137" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="270" y="114" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="141.6" font-size="15" fill="#292929" text-anchor="start">user == approver → False, "본인 요청은 처리할 수 없음"</text>
<rect x="30" y="170" width="210" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135" y="197.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">상태 바꾸기</text>
<line x1="240" y1="193" x2="268" y2="193" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="270" y="170" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="197.6" font-size="15" fill="#292929" text-anchor="start">request["status"] = "approved" (또는 "rejected")</text>
<rect x="30" y="226" width="210" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135" y="253.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">처리한 사람 남기기</text>
<line x1="240" y1="249" x2="268" y2="249" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="270" y="226" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="253.6" font-size="15" fill="#292929" text-anchor="start">request["approver"] = approver</text>
<rect x="30" y="282" width="210" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135" y="309.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">없을 수 있는 키 꺼내기</text>
<line x1="240" y1="305" x2="268" y2="305" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p06)"/>
<rect x="270" y="282" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="284" y="309.6" font-size="15" fill="#292929" text-anchor="start">request.get("approver")</text>
</svg>
