<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img"><title>문자열을 strptime 으로 시각으로 바꾼 뒤 비교해야 하는 이유</title><desc>&quot;2026-10-22 14:00&quot; 같은 문자열을 형식 &quot;%Y-%m-%d %H:%M&quot; 으로 datetime 시각으로 바꾼 뒤 now &lt; expires 로 비교합니다. 문자열 그대로 비교하면 9:00 이 18:00 보다 크다고 나와 틀릴 수 있습니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"><text x="360" y="32" font-size="18" text-anchor="middle" fill="#292929" font-weight="700">2.2 문자열을 시각으로 바꿔 비교하기</text><rect x="15" y="52" width="210" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="120" y="91.75" font-weight="700">문자열</tspan><tspan x="120" dy="21">&quot;2026-10-22 14:00&quot;</tspan></text><line x1="228" y1="97" x2="252" y2="97" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="255" y="52" width="210" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="360" y="91.75" font-weight="700">datetime.strptime</tspan><tspan x="360" dy="21">&quot;%Y-%m-%d %H:%M&quot;</tspan></text><line x1="468" y1="97" x2="492" y2="97" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="495" y="52" width="210" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text font-size="15" text-anchor="middle" fill="#292929"><tspan x="600" y="91.75" font-weight="700">시각끼리 비교</tspan><tspan x="600" dy="21">now &lt; expires → True</tspan></text><rect x="15" y="162" width="162" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="96" y="192.9">%Y 네 자리 연도</tspan></text><line x1="180" y1="188" x2="188" y2="188" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="191" y="162" width="162" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="272" y="192.9">%m 두 자리 월</tspan></text><line x1="356" y1="188" x2="364" y2="188" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="367" y="162" width="162" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="448" y="192.9">%d 두 자리 일</tspan></text><line x1="532" y1="188" x2="540" y2="188" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/><rect x="543" y="162" width="162" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="624" y="192.9">%H:%M 시:분</tspan></text><rect x="15" y="238" width="690" height="92" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text font-size="14" text-anchor="middle" fill="#292929"><tspan x="360" y="269.3" font-weight="700">문자열 그대로 비교하면 틀릴 수 있음</tspan><tspan x="360" dy="19.6">&quot;2026-10-22 9:00&quot; 이 &quot;2026-10-22 18:00&quot; 보다 크다고 나옵니다</tspan><tspan x="360" dy="19.6">앞에서부터 한 글자씩 보기 때문 · 시각은 시각으로 바꾼 뒤 비교</tspan></text></g></svg>
