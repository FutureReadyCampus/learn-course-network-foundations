<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>40분을 고르기 5분, 쓰기 25분, 점검 · 올리기 10분으로 나누고 Unit 2 글감 하나를 고른다</title>
<desc>위 막대는 40분 글쓰기 시간을 길이에 맞게 나눈 것입니다. 아래에는 실습 2-1 · 2-2에서 나온 핵심 글감 세 개와, 응용 2-2를 했을 때 고를 수 있는 선택 글감 두 개가 있습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">Unit 2 오늘의 글 쓰기 · 40분</text>
<rect x="20" y="48" width="85" height="56" rx="6" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="62" y="72" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">고르기</text>
<text x="62" y="92" font-size="14" fill="#292929" text-anchor="middle">5분</text>
<rect x="105" y="48" width="425" height="56" rx="6" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="317" y="72" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">쓰기 25분</text>
<text x="317" y="93" font-size="14" fill="#666660" text-anchor="middle">글 틀을 복사해 빈칸 채우기</text>
<rect x="530" y="48" width="170" height="56" rx="6" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="615" y="72" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">점검 · 올리기</text>
<text x="615" y="92" font-size="14" fill="#292929" text-anchor="middle">10분</text>
<path d="M62 106 L62 132" stroke="#666660" stroke-width="1.5" fill="none" marker-end="url(#a-p01)"/>
<text x="20" y="160" font-size="16" fill="#292929" font-weight="700">핵심 글감 (하나 고르기)</text>
<rect x="20" y="174" width="216" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="198" font-size="14" fill="#2f6fd0" font-weight="700">1 · 실습 2-1</text>
<text x="32" y="222" font-size="15" fill="#292929">요청자가 적은 until,</text>
<text x="32" y="244" font-size="15" fill="#292929">그대로 믿어도 될까?</text>
<rect x="252" y="174" width="216" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="264" y="198" font-size="14" fill="#2f6fd0" font-weight="700">2 · 실습 2-2</text>
<text x="264" y="222" font-size="15" fill="#292929">이미 승인한 요청서를</text>
<text x="264" y="244" font-size="15" fill="#292929">다시 승인 못 하게 한 이유</text>
<rect x="484" y="174" width="216" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="496" y="198" font-size="14" fill="#2f6fd0" font-weight="700">3 · 실습 2-2</text>
<text x="496" y="222" font-size="15" fill="#292929">본인 처리만 막으면 될까?</text>
<text x="496" y="244" font-size="15" fill="#292929">친구의 대신 승인은?</text>
<text x="20" y="300" font-size="16" fill="#9a6200" font-weight="700">응용 2-2를 했다면 (선택)</text>
<rect x="20" y="314" width="332" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="340" font-size="15" fill="#292929">기한을 넘긴 요청: 알림만 보낼까,</text>
<text x="32" y="362" font-size="15" fill="#292929">윗사람에게 넘길까? 나눈 기준</text>
<rect x="368" y="314" width="332" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380" y="340" font-size="15" fill="#292929">reviewing 을 안 보고 접수 시각만</text>
<text x="380" y="362" font-size="15" fill="#292929">보면 리스트에 생기는 문제</text>
</g>
</svg>
