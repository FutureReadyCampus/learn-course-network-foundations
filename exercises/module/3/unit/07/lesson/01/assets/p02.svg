<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>access_control 폴더에서 Unit 6 파일을 확인하고 Unit 7 파일은 New File 로 만든다</title><desc>pwd 결과가 security-agent-toolkit/access_control 로 끝나는지 본다. python -c 확인 줄이 「Unit 6 파일 정상 14 7」을 출력하면 준비가 끝났고, 아니면 완성본 코드 상자로 파일을 만든다. 보고서 report_u7.md 는 「보고서 쓰기」 레슨에서 복사해 만든다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">폴더 열고 Unit 6 파일 확인하기</text>
<rect x="20" y="56" width="330" height="280" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="84" font-size="15" fill="#666660">…/security-agent-toolkit/</text>
<text x="52" y="110" font-size="16" fill="#292929" font-weight="700">access_control/</text>
<text x="70" y="142" font-size="15" fill="#292929">review_list.py</text>
<text x="70" y="172" font-size="15" fill="#292929">review_rules.py</text>
<text x="70" y="202" font-size="15" fill="#292929">review_unused.py</text>
<text x="70" y="232" font-size="15" fill="#292929">config/access_log.json</text>
<text x="70" y="262" font-size="15" fill="#292929">report_u7.md (보고서 쓰기에서)</text>
<text x="52" y="312" font-size="14" fill="#666660">Unit 1~3: rbac.py 등도 있어야 함</text>
<rect x="380" y="56" width="320" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="76.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1. pwd</text>
<text x="540" y="97.75" font-size="14" fill="#666660" text-anchor="middle">access_control 로 끝나는가</text>
<rect x="380" y="120" width="320" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="140.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2. ls · ls config</text>
<text x="540" y="161.75" font-size="14" fill="#666660" text-anchor="middle">Unit 6 파일이 보이는가</text>
<rect x="380" y="184" width="320" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="540" y="204.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3. python -c "…" 확인 줄</text>
<text x="540" y="225.75" font-size="14" fill="#666660" text-anchor="middle">Unit 6 파일 정상 14 7</text>
<rect x="380" y="256" width="320" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="540" y="280.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">아니면</text>
<text x="540" y="301.25" font-size="14" fill="#666660" text-anchor="middle">Unit 6 「앞 실습 파일 완성본」</text>
<text x="540" y="322.25" font-size="14" fill="#666660" text-anchor="middle">Unit 1~3 은 그 레슨의 코드 상자</text>
<text x="540" y="250" font-size="14" fill="#666660" text-anchor="middle">현황 14건 · 사용 이력 7건</text>
</g>
