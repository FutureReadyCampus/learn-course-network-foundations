<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>Unit 6의 두 점검 결과를 리포트로 합치고, 회수 대상과 회수 제외로 나눈다</title><desc>Unit 6에서 규칙과 사용 이력으로 찾은 결과를 실습 7-1에서 과다권한 리포트 한 장으로 합친다. 실습 7-2에서 회수 제외 리스트로 후보를 나누고, 실제 회수는 Unit 8에서 한다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">Unit 7에서 할 일</text>
<rect x="20" y="64" width="170" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="105" y="93.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">규칙으로 찾은 것</text>
<text x="105" y="114.75" font-size="14" fill="#666660" text-anchor="middle">퇴사 · 만료</text>
<rect x="20" y="154" width="170" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="105" y="183.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">사용 이력으로</text>
<text x="105" y="204.75" font-size="14" fill="#666660" text-anchor="middle">90일 넘게 안 씀</text>
<text x="105" y="252" font-size="15" fill="#666660" text-anchor="middle">Unit 6 결과</text>
<rect x="240" y="104" width="180" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="330" y="128.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 7-1</text>
<text x="330" y="149.25" font-size="15" fill="#292929" text-anchor="middle">과다권한 리포트</text>
<text x="330" y="170.25" font-size="14" fill="#666660" text-anchor="middle">후보마다 이유 리스트</text>
<line x1="194" y1="99" x2="236" y2="130" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="194" y1="189" x2="236" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="470" y="64" width="170" height="54" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="555" y="96.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 대상</text>
<rect x="470" y="170" width="170" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="555" y="202.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 제외</text>
<line x1="424" y1="130" x2="466" y2="96" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="424" y1="158" x2="466" y2="192" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="555" y="148" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 7-2</text>
<rect x="240" y="268" width="400" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="440" y="298.25" font-size="15" fill="#292929" text-anchor="middle">이번 Unit은 찾기와 기록까지 · 회수는 Unit 8</text>
</g>
</svg>
