<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>보고서는 질문마다 쓸 내용을 보고 답: 뒤에 적고, 출력은 코드 상자에 붙입니다</title>
<desc>질문, 쓸 내용, 답 칸의 순서로 채웁니다. 「왜」를 묻는 질문은 화면에서 본 값을 근거로 이유까지 씁니다. 답을 못 찾으면 「모름 — 막힌 곳: …」이라고 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">보고서 쓰는 방법 — 질문 하나를 채우는 순서</text>
<rect x="20" y="60" width="330" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="93.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">질문 (가) · (나) · (다)</text>
<path d="M185 116 L185 133" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="135" width="330" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="168.2" font-size="15" fill="#292929" text-anchor="middle">쓸 내용: 무엇을 쓸지 안내</text>
<path d="M185 191 L185 208" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="210" width="330" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="185" y="243.2" font-size="15" fill="#292929" text-anchor="middle">답: 뒤에 씁니다</text>
<path d="M185 266 L185 283" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="285" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="185" y="318.2" font-size="15" fill="#292929" text-anchor="middle">출력은 빈 코드 상자에 붙여 넣기</text>
<rect x="390" y="60" width="310" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="545" y="94.8" font-size="15" fill="#292929" text-anchor="middle">[핵심 질문] 표시</text>
<text x="545" y="115.8" font-size="15" fill="#292929" text-anchor="middle">꼭 알아야 할 질문</text>
<rect x="390" y="160" width="310" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="545" y="194.8" font-size="15" fill="#292929" text-anchor="middle">「왜」를 묻는 질문</text>
<text x="545" y="215.8" font-size="15" fill="#292929" text-anchor="middle">본 값을 근거로 이유까지</text>
<rect x="390" y="260" width="310" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="545" y="294.8" font-size="15" fill="#292929" text-anchor="middle">답을 못 찾으면</text>
<text x="545" y="315.8" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
</g>
</svg>
