<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 9-2 정리: 주소에서 값 꺼내기, 상태 코드로 답하기, 덧붙여 로그 남기기</title>
<desc>check 는 request.args.get 으로 값을 꺼내고 None in (…) 으로 빠진 값을 찾는다. 답은 딕셔너리와 상태 코드를 함께 리턴하고, 로그는 &quot;a&quot; 모드로 덧붙인다. 서버는 python access_server.py 로 켜고 Ctrl + C 로 끈다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 9-2 정리 · 코드 지도</text>
<rect x="20" y="52" width="240" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="81" font-size="15" fill="#292929" font-weight="700">주소에서 값 꺼내기</text>
<rect x="270" y="52" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="81" font-size="15" fill="#292929">user = request.args.get(&quot;user&quot;)</text>
<rect x="20" y="108" width="240" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="137" font-size="15" fill="#292929" font-weight="700">값이 빠졌는지</text>
<rect x="270" y="108" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="137" font-size="15" fill="#292929">if None in (user, …, now):</text>
<rect x="20" y="164" width="240" height="46" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="193" font-size="15" fill="#292929" font-weight="700">시각 문자열 바꾸기</text>
<rect x="270" y="164" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="193" font-size="15" fill="#292929">try: return datetime.strptime(…)</text>
<rect x="20" y="220" width="240" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="32" y="249" font-size="15" fill="#292929" font-weight="700">상태 코드와 함께 답하기</text>
<rect x="270" y="220" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="249" font-size="15" fill="#292929">return {&quot;allowed&quot;: True, …}, 200</text>
<rect x="20" y="276" width="240" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="32" y="305" font-size="15" fill="#292929" font-weight="700">로그 여는 모드</text>
<rect x="270" y="276" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="305" font-size="15" fill="#292929">mode = &quot;a&quot; (덧붙이기)</text>
<rect x="20" y="332" width="240" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="361" font-size="15" fill="#292929" font-weight="700">켜기 · 끄기 · 요청</text>
<rect x="270" y="332" width="430" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="282" y="361" font-size="15" fill="#292929">python access_server.py · Ctrl + C</text>
<text x="20" y="390" font-size="15" fill="#666660">요청은 다른 터미널에서 python send_checks.py</text>
</g>
</svg>
