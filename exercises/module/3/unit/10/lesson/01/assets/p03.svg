<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>오류가 나면 먼저 위치와 파일 이름을 보고, 오류 이름에 따라 고친다</title>
<desc>pwd 와 ls 로 위치와 파일 이름을 먼저 확인한다. ModuleNotFoundError 와 FileNotFoundError 는 위치나 이름, JSONDecodeError 는 쉼표나 괄호, IndentationError 와 NameError 는 들여쓰기나 빠진 줄 문제다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<rect x="20" y="50" width="680" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="80.2" font-size="15" fill="#292929" text-anchor="middle">먼저 pwd 가 access_control 로 끝나는지, ls 로 파일 이름이 문서와 같은지 봅니다</text>
<text x="110" y="132" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">증상</text>
<text x="360" y="132" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">원인</text>
<text x="600" y="132" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">고치기</text>
<rect x="20" y="146" width="180" height="62" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="110" y="171.4" font-size="15" fill="#292929" text-anchor="middle">ModuleNotFoundError</text>
<text x="110" y="193.1" font-size="15" fill="#292929" text-anchor="middle">FileNotFoundError</text>
<rect x="240" y="146" width="240" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="171.4" font-size="15" fill="#292929" text-anchor="middle">위치나 파일 이름이</text>
<text x="360" y="193.1" font-size="15" fill="#292929" text-anchor="middle">틀림</text>
<rect x="520" y="146" width="180" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="182.2" font-size="15" fill="#292929" text-anchor="middle">pwd · ls 로 다시 확인</text>
<polyline points="201,177 239,177" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="481,177 519,177" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="220" width="180" height="62" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="110" y="256.2" font-size="15" fill="#292929" text-anchor="middle">JSONDecodeError</text>
<rect x="240" y="220" width="240" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="245.4" font-size="15" fill="#292929" text-anchor="middle">붙여 넣다가</text>
<text x="360" y="267.1" font-size="15" fill="#292929" text-anchor="middle">쉼표나 괄호가 빠짐</text>
<rect x="520" y="220" width="180" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="245.4" font-size="15" fill="#292929" text-anchor="middle">python -m json.tool</text>
<text x="610" y="267.1" font-size="15" fill="#292929" text-anchor="middle">파일이름</text>
<polyline points="201,251 239,251" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="481,251 519,251" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="294" width="180" height="62" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="110" y="319.4" font-size="15" fill="#292929" text-anchor="middle">IndentationError</text>
<text x="110" y="341.1" font-size="15" fill="#292929" text-anchor="middle">NameError</text>
<rect x="240" y="294" width="240" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="319.4" font-size="15" fill="#292929" text-anchor="middle">들여쓰기가 틀렸거나</text>
<text x="360" y="341.1" font-size="15" fill="#292929" text-anchor="middle">빠뜨린 줄이 있음</text>
<rect x="520" y="294" width="180" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="330.2" font-size="15" fill="#292929" text-anchor="middle">직접 쓴 줄을 다시 봄</text>
<polyline points="201,325 239,325" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="481,325 519,325" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="20" y="372" font-size="15" fill="#666660">AI 에게 물을 때는 명령 한 줄과 오류 전체를 붙이고, .env 내용 · API 키는 지웁니다.</text>
</g>
</svg>
