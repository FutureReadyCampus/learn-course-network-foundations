<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>데이터 파일 세 개를 만들고 json.tool 과 줄 수 40으로 확인한다</title>
<desc>config 폴더에 week_state.json 과 alert.json 을, access_control 바로 아래에 week_log.jsonl 을 만든다. json.tool 이 내용을 다시 출력하고 로그 줄 수가 40이면 정상이다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 Unit에서 만드는 데이터 파일 세 개</text>
<rect x="20" y="52" width="330" height="330" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="80" font-size="16" fill="#292929" font-weight="700">access_control/</text>
<text x="56" y="112" font-size="15" fill="#292929" font-weight="700">config/</text>
<text x="76" y="140" font-size="15" fill="#2f6fd0">week_state.json</text>
<text x="96" y="164" font-size="14" fill="#666660">사용자 6명 · 예외 4개</text>
<text x="76" y="194" font-size="15" fill="#2f6fd0">alert.json</text>
<text x="96" y="218" font-size="14" fill="#666660">경고 기준</text>
<text x="56" y="252" font-size="15" fill="#2f6fd0">week_log.jsonl</text>
<text x="76" y="276" font-size="14" fill="#666660">일주일 치 샘플 로그 40줄</text>
<text x="56" y="310" font-size="15" fill="#292929">report_u10.md (보고서 쓰기에서)</text>
<text x="36" y="362" font-size="14" fill="#666660">config 폴더가 없으면 mkdir config</text>
<rect x="380" y="52" width="320" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540" y="83.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">week_state.json · alert.json</text>
<text x="540" y="106.8" font-size="15" fill="#292929" text-anchor="middle">python -m json.tool 파일</text>
<text x="540" y="128.6" font-size="15" fill="#292929" text-anchor="middle">→ 내용이 다시 나오면 정상</text>
<rect x="380" y="164" width="320" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540" y="195.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">week_log.jsonl</text>
<text x="540" y="218.8" font-size="15" fill="#292929" text-anchor="middle">줄 수를 세는 python -c …</text>
<text x="540" y="240.6" font-size="15" fill="#292929" text-anchor="middle">→ 40 이 나오면 정상</text>
<rect x="380" y="276" width="320" height="106" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="301.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">alert.json 의 경고 기준</text>
<text x="540" y="324.9" font-size="15" fill="#292929" text-anchor="middle">거부율 0.3(30%) 이상 → 경고</text>
<text x="540" y="346.7" font-size="15" fill="#292929" text-anchor="middle">한 명이 4번 이상 거부</text>
<text x="540" y="368.4" font-size="15" fill="#292929" text-anchor="middle">→ 눈여겨봄</text>
</g>
</svg>
