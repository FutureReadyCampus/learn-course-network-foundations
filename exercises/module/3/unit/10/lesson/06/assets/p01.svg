<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>보고서는 문제마다 쓸 내용을 보고 답: 뒤에 쓰고, 모르면 막힌 곳을 적는다</title>
<desc>문제를 풀 때마다 그 문제 제목 아래 질문에 답한다. 쓸 내용을 보고 답: 뒤에 쓰고, 출력과 코드는 빈 코드 상자에 붙여 넣는다. 왜를 묻는 질문은 근거까지 쓰고, 답을 못 찾으면 모름과 막힌 곳을 적는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 쓰는 방법 · 확인할 다섯 가지</text>
<rect x="20" y="66" width="680" height="270" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="34" y="86" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="64" y="101" font-size="15" fill="#292929">문제를 풀 때마다 그 문제 제목 아래 질문에 답합니다</text>
<rect x="34" y="136" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="64" y="151" font-size="15" fill="#292929">「쓸 내용:」을 보고 그대로 「답:」 뒤에 씁니다</text>
<rect x="34" y="186" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="64" y="201" font-size="15" fill="#292929">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙여 넣습니다</text>
<rect x="34" y="236" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="64" y="251" font-size="15" fill="#292929">「왜」는 내 화면의 값이나 배운 내용을 근거로 이유까지</text>
<rect x="34" y="286" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="64" y="301" font-size="15" fill="#292929">못 찾으면 「모름 — 막힌 곳: …」 · [핵심 질문]은 꼭</text>
</g>
</svg>
