<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>실습 5-1 보고서: 출력과 통과·실패, 통과의 뜻, 점검 코드가 알려 주는 것</title>
<desc>(가)에는 출력 전체와 통과·실패한 점검, 걸린 이름이나 번호를 쓴다. (나)는 만료 예외 점검의 통과를 문제 없음으로 읽으면 안 되는 이유와 함께 읽을 점검이다. (다)는 junho 결과에서 코드가 알려 주는 것과 못 하는 것, 담당자가 확인할 것이다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-1 · 보고서에 채울 것</text>
<rect x="20" y="66" width="110" height="78" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75" y="100.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<text x="75" y="121.6" font-size="14" fill="#292929" text-anchor="middle">질문</text>
<rect x="140" y="66" width="560" height="78" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="156" y="98" font-size="15" fill="#292929">출력 전체(코드 상자) · 통과한 점검과 실패한 점검</text>
<text x="156" y="124" font-size="15" fill="#292929">실패한 점검의 사용자 이름이나 예외 번호</text>
<rect x="20" y="154" width="110" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="188.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(나)</text>
<text x="75" y="209.6" font-size="14" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="140" y="154" width="560" height="78" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="156" y="186" font-size="15" fill="#292929">「통과」만 믿으면 안 되는 이유 (예외 3번 · dami)</text>
<text x="156" y="212" font-size="15" fill="#292929">함께 읽어야 하는 다른 점검과 그 이유</text>
<rect x="20" y="242" width="110" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75" y="276.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(다)</text>
<text x="75" y="297.6" font-size="14" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="140" y="242" width="560" height="78" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="156" y="274" font-size="15" fill="#292929">junho: 코드가 알려 주는 것과 못 하는 것</text>
<text x="156" y="300" font-size="15" fill="#292929">담당자가 확인할 것 · 바로 회수하면 안 되는 이유</text>
</g>
</svg>
