<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>실습 5-2 보고서: 상황 3~8 중 2개를 네 칸으로 쓰고 질문 (가)에 답한다</title>
<desc>상황 1·2는 본보기로 적혀 있다. 상황 3~8 중 2개의 원인, 고칠 파일, 어떻게 고치나요, 고친 뒤 확인을 채운다. 질문 (가) 데이터와 규칙 구분은 핵심 질문이고, (나) 헷갈린 로직과 (다) LLM·알림 연결은 응용이다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-2 · 보고서에 채울 것</text>
<rect x="20" y="66" width="78" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
