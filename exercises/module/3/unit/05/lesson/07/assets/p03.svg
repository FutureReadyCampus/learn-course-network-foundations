<text x="575" y="101.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">상황 7</text>
<rect x="622" y="66" width="78" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="661" y="101.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">상황 8</text>
<text x="20" y="154" font-size="15" fill="#292929" font-weight="700">상황 1 · 2 는 본보기 · 상황 3 ~ 8 중 2개 채우기</text>
<rect x="20" y="168" width="680" height="104" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
