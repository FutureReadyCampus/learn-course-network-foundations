<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>도전 5-1 정답: 요청 40건 중 거부 16건, 거부율 40%로 기준 30% 이상이라 경고</title>
<desc>허용 24건, 거부 16건으로 거부율은 40%이고 경고 기준 30% 이상이라 경고다. 거부 사유는 허용되지 않은 접속 위치 5, 업무 시간 밖 4, 퇴사한 계정 4, 역할이 없음 3이다. 4번 이상 거부된 dami 와 gaeun 은 사유가 달라 조치도 다르다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 5-1 정답 · 집계와 경고</text>
<rect x="20" y="66" width="680" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="96.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">허용 24 · 거부 16 · 거부율 40%  &gt;=  기준 30%  →  경고</text>
<text x="20" y="146" font-size="15" fill="#292929" font-weight="700">거부 사유별 (16건)</text>
<text x="200" y="181" font-size="14" fill="#292929" text-anchor="end">허용되지 않은 접속 위치</text>
<rect x="212" y="164" width="200" height="26" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1"/>
<text x="420" y="183" font-size="15" fill="#292929" font-weight="700">5</text>
<text x="200" y="219" font-size="14" fill="#292929" text-anchor="end">업무 시간 밖</text>
<rect x="212" y="202" width="160" height="26" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1"/>
<text x="380" y="221" font-size="15" fill="#292929" font-weight="700">4</text>
<text x="200" y="257" font-size="14" fill="#292929" text-anchor="end">퇴사한 계정</text>
<rect x="212" y="240" width="160" height="26" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1"/>
<text x="380" y="259" font-size="15" fill="#292929" font-weight="700">4</text>
<text x="200" y="295" font-size="14" fill="#292929" text-anchor="end">역할이 없음</text>
<rect x="212" y="278" width="120" height="26" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1"/>
<text x="340" y="297" font-size="15" fill="#292929" font-weight="700">3</text>
<text x="450" y="146" font-size="15" fill="#292929" font-weight="700">거부 4번 이상 사용자</text>
<rect x="450" y="160" width="250" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="575" y="190.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">dami · 퇴사한 계정 4번</text>
<text x="575" y="211.6" font-size="14" fill="#292929" text-anchor="middle">계정 정리 · 누가 시도했는지 조사</text>
<rect x="450" y="240" width="250" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="575" y="270.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">gaeun · 접속 위치 · 시간</text>
<text x="575" y="291.6" font-size="14" fill="#292929" text-anchor="middle">재택 · 외근 확인 · 규칙 검토</text>
<rect x="20" y="330" width="680" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="363.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">(다) 로그가 빈 주의 거부율 0% 는 안전하다는 뜻이 아님</text>
<text x="360" y="384.6" font-size="14" fill="#292929" text-anchor="middle">전체 요청 0건인지 함께 보고, 서버와 로그 수집부터 확인</text>
</g>
</svg>
