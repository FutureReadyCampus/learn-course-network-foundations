<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" role="img">
<title>run_checklist 는 점검 세 가지를 차례로 호출해 문제 리스트로 통과와 실패를 가린다</title>
<desc>load_state 가 config/week_state.json 을 읽으면 run_checklist 가 check_employed, check_expired, check_dept 를 차례로 호출합니다. 점검마다 이름과 문제 리스트를 묶고, 리스트가 비었으면 통과, 하나라도 있으면 실패입니다.</desc>
<defs><marker id="a-f01-1002" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<rect x="40" y="16" width="640" height="40" rx="22" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="41.0" font-size="15" fill="#292929" text-anchor="middle">load_state 가 config/week_state.json 을 읽는다</text>
<path d="M360 56 L360 80" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="40" y="80" width="640" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="105.0" font-size="15" fill="#292929" text-anchor="middle">run_checklist 가 점검 세 가지를 차례로 호출한다</text>
<path d="M60 150 L90 150" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="90" y="132" width="330" height="36" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="255.0" y="155.0" font-size="15" fill="#292929" text-anchor="middle">1. check_employed(users)</text>
<path d="M420 150 L450 150" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="450" y="132" width="260" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="580.0" y="155.0" font-size="15" fill="#292929" text-anchor="middle">퇴사한 사용자 이름 리스트</text>
<path d="M60 196 L90 196" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="90" y="178" width="330" height="36" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="255.0" y="201.0" font-size="15" fill="#292929" text-anchor="middle">2. check_expired(exceptions, now)</text>
<path d="M420 196 L450 196" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="450" y="178" width="260" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="580.0" y="201.0" font-size="15" fill="#292929" text-anchor="middle">만료된 예외 번호 리스트</text>
<path d="M60 242 L90 242" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="90" y="224" width="330" height="36" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="255.0" y="247.0" font-size="15" fill="#292929" text-anchor="middle">3. check_dept(users, role_dept)</text>
<path d="M420 242 L450 242" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="450" y="224" width="260" height="36" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="580.0" y="247.0" font-size="15" fill="#292929" text-anchor="middle">부서가 다른 사용자 이름 리스트</text>
<path d="M60 120 L60 292" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="40" y="292" width="640" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="317.0" font-size="15" fill="#292929" text-anchor="middle">점검마다 {"name": 점검 이름, "problems": 리스트} 로 묶는다</text>
<path d="M360 332 L360 356" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-1002)"/>
<rect x="40" y="356" width="640" height="40" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="381.0" font-size="15" fill="#292929" text-anchor="middle">리스트가 비었으면 통과, 하나라도 있으면 실패</text>
</g>
</svg>
