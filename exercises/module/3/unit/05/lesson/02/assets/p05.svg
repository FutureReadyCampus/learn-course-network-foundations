<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>실습 5-1 은 세 함수에 한 줄씩 빈칸 세 곳을 채우고 실행해 단계 1·2 출력을 읽는다</title>
<desc>exercise5-1_run.py 가 load_state 와 run_checklist 를 부르고, run_checklist 가 세 점검 함수를 부른다. 직접 쓰는 곳은 check_employed 의 빈칸 ①(if not 조건), check_expired 의 빈칸 ②(&lt;= 조건), check_dept 의 빈칸 ③(role_dept 에서 부서 꺼내기)이다. 채우기 전에 실행하면 ② 자리가 비어 IndentationError: unexpected indent 가 난다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-1 · 직접 쓰는 세 군데와 실행 흐름</text>
