<line x1="187" y1="110" x2="211" y2="110" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="347" y1="110" x2="371" y2="110" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<line x1="517" y1="110" x2="541" y2="110" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="20" y="200" width="210" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125" y="239.7" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">check_employed</text>
