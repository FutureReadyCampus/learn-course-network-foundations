<text x="280" y="126.6" font-size="14" fill="#292929" text-anchor="middle">미리 채움</text>
<rect x="375" y="70" width="140" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="445" y="105.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">run_checklist</text>
<text x="445" y="126.6" font-size="14" fill="#292929" text-anchor="middle">미리 채움</text>
