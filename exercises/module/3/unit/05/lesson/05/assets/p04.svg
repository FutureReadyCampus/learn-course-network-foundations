<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>응용 5-1은 골격으로 바꿔 쓰고, 집계 실행, 보고서 다시 실행, grep 확인 순서로 한다</title>
<desc>log_summary.py 의 내용을 골격으로 바꿔 다섯 함수를 쓰고 apply5-1_run.py 로 집계 출력을 봅니다. 그다음 제공 파일 weekly_run.py 를 다시 실행해 보고서가 같은지 보고, grep 으로 gaeun 과 dami 의 요청을 찾아 보고서 (가)~(다)를 씁니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">응용 5-1 · 순서</text>
<rect x="24" y="54" width="672" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="44" y="78" font-size="15" font-weight="700">1. log_summary.py 를 골격으로 바꾸기</text>
<text x="44" y="99" font-size="14">제공 파일 내용을 모두 지우고 붙여 넣은 뒤, 직접 쓰는 곳 1 ~ 11번을 씁니다</text>
<rect x="24" y="124" width="672" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="148" font-size="15" font-weight="700">2. python apply5-1_run.py</text>
<text x="44" y="169" font-size="14">단계 1 집계 · 단계 2 거부 사유별 · 단계 3 경고 기준</text>
<rect x="24" y="194" width="672" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="44" y="218" font-size="15" font-weight="700">3. python weekly_run.py 다시 실행</text>
<text x="44" y="239" font-size="14">제공 파일 레슨의 실행 결과와 보고서가 같은지 봅니다</text>
<rect x="24" y="264" width="672" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="288" font-size="15" font-weight="700">4. grep gaeun · grep dami</text>
<text x="44" y="309" font-size="14">보고서 4절에 나온 두 사람의 요청을 로그에서 찾아 비교합니다</text>
<rect x="24" y="334" width="672" height="36" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="357" font-size="14" text-anchor="middle">report_u5.md 의 응용 5-1 (가) · (나) · (다)를 채웁니다</text>
</g>
</svg>
