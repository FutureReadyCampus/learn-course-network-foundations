<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>로그는 세고, 거부율을 구하고, 경고 기준과 비교해야 의미가 생긴다</title>
<desc>서버 로그는 한 줄씩 쌓이기만 한다. 허용과 거부를 세고, 거부 수를 전체 수로 나눈 거부율을 alert.json 의 경고 기준과 비교한다. 기준 이상이면 경고인데, 경고는 공격 확정이 아니라 먼저 살펴볼 곳이라는 뜻이다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">로그를 읽는 순서 · 세기 → 비율 → 기준과 비교</text>
<rect x="20" y="70" width="150" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="109" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">로그</text>
<text x="95" y="131.1" font-size="15" fill="#292929" text-anchor="middle">한 줄씩 쌓임</text>
<text x="95" y="152.9" font-size="15" fill="#292929" text-anchor="middle">그대로는 안 읽힘</text>
<rect x="196" y="70" width="150" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="271" y="109" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">세기(집계)</text>
<text x="271" y="131.1" font-size="15" fill="#292929" text-anchor="middle">허용 몇 번</text>
<text x="271" y="152.9" font-size="15" fill="#292929" text-anchor="middle">거부 몇 번</text>
<rect x="372" y="70" width="150" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="447" y="109" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">거부율</text>
<text x="447" y="131.1" font-size="15" fill="#292929" text-anchor="middle">거부 수 ÷</text>
<text x="447" y="152.9" font-size="15" fill="#292929" text-anchor="middle">전체 수</text>
<rect x="548" y="70" width="150" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="623" y="110.5" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">기준과 비교</text>
<text x="623" y="131.5" font-size="14" fill="#292929" text-anchor="middle">config/</text>
<text x="623" y="151.8" font-size="14" fill="#292929" text-anchor="middle">alert.json</text>
<line x1="172" y1="125" x2="194" y2="125" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="348" y1="125" x2="370" y2="125" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="524" y1="125" x2="546" y2="125" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="372" y="220" width="150" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="447" y="244.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">기준 미만</text>
<text x="447" y="267" font-size="15" fill="#292929" text-anchor="middle">경고 없음</text>
<rect x="548" y="220" width="152" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="624" y="244.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">기준 이상</text>
<text x="624" y="267" font-size="15" fill="#292929" text-anchor="middle">경고</text>
<line x1="600" y1="182" x2="450" y2="216" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="623" y1="182" x2="623" y2="216" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="20" y="220" width="330" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="254" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">경고는 먼저 살펴볼 곳</text>
<text x="185" y="276.1" font-size="15" fill="#292929" text-anchor="middle">공격이 있었다는 뜻이 아님</text>
<text x="185" y="297.9" font-size="15" fill="#292929" text-anchor="middle">사람이 경고부터 확인</text>
</g>
</svg>
