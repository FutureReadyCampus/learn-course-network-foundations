<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 5-2에서 상황 두 개를 골라 원인과 확인 방법을 정리한다</title>
<desc>상황 1·2 본보기를 읽고 두 상황을 골라 원인, 확인할 파일, 조치, 확인 방법을 정리한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-2 · 증상에서 확인 방법까지</text>
<rect x="20" y="70" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="99.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">상황 1 · 2</text>
<text x="120" y="122" font-size="15" fill="#292929" text-anchor="middle">본보기 먼저 읽기</text>
<rect x="20" y="170" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="199.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">상황 3 ~ 8</text>
<text x="120" y="222" font-size="15" fill="#292929" text-anchor="middle">두 개 이상 고르기</text>
<line x1="120" y1="142" x2="120" y2="166" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="222" y1="205" x2="256" y2="205" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="260" y="70" width="440" height="220" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="280" y="98" font-size="16" fill="#292929" font-weight="700">상황마다 네 칸</text>
<rect x="280" y="116" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="308" y="131" font-size="15" fill="#292929">원인: 사람의 일 · 데이터 · 규칙 중 고르기</text>
<rect x="280" y="158" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="308" y="173" font-size="15" fill="#292929">고칠 파일: 어느 파일을 여는지</text>
<rect x="280" y="200" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="308" y="215" font-size="15" fill="#292929">어떻게: 새로 넣기 · 값 바꾸기 · 지우기</text>
<rect x="280" y="242" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.8"/>
<text x="308" y="257" font-size="15" fill="#292929">고친 뒤 확인: 무엇을 다시 보는지</text>
<rect x="20" y="310" width="680" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="36" y="338" font-size="15" fill="#292929">데이터를 고치는 경우와 규칙을 바꾸는 경우를 비교합니다.</text>
<text x="36" y="364" font-size="15" fill="#292929">실제로 고민한 한 사례를 블로그 기록으로 이어갑니다.</text>
</g>
</svg>
