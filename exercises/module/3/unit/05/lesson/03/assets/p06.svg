<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>Unit 5 에서 한 실습 세 개와, 이어지는 Module 4 이상탐지</title>
<desc>실습 5-1은 세 점검으로 통과와 실패를 가렸고, 도전 5-1는 로그를 집계해 주간 보고서를 만들었고, 실습 5-2은 상황 8개를 정리했다. 로그를 읽고, 세고, 기준과 비교하는 방식이 Module 4 이상탐지의 바탕이 된다.</desc>
