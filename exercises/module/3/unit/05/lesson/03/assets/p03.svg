<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>weekly_report.py 는 점검 결과와 로그 집계를 네 절의 보고서로 합쳐 파일로 저장한다</title>
<desc>build_report 는 점검 결과, 요청 리스트, 경고 기준, 날짜를 받아 요청 현황, 거부 사유, 점검 결과, 조치가 필요한 것의 네 절을 만듭니다. save_report 는 그 문자열을 날짜가 들어간 .md 파일에 "w" 로 새로 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">weekly_report.py · 네 절의 보고서</text>
<rect x="24" y="56" width="190" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="81" font-size="14" text-anchor="middle">점검 결과 results</text>
<rect x="24" y="106" width="190" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="119" y="131" font-size="14" text-anchor="middle">요청 리스트 entries</text>
<rect x="24" y="156" width="190" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="119" y="181" font-size="14" text-anchor="middle">경고 기준 alert</text>
<rect x="24" y="206" width="190" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="119" y="231" font-size="14" text-anchor="middle">날짜 today</text>
<polyline points="216,151 256,151" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="260" y="56" width="436" height="190" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="280" y="84" font-size="16" font-weight="700">build_report → 보고서 문자열</text>
<text x="280" y="114" font-size="15">1. 요청 현황 · 전체 · 허용 · 거부 · 거부율</text>
<text x="280" y="142" font-size="15">2. 거부 사유 · 사유별 횟수</text>
<text x="280" y="170" font-size="15">3. 점검 결과 · 통과 또는 실패와 대상</text>
<text x="280" y="198" font-size="15">4. 조치가 필요한 것 · 거부가 많은 사용자</text>
<text x="280" y="230" font-size="14" fill="#666660">경고: rate &gt;= limit (소수끼리 비교)</text>
<polyline points="478,248 478,276" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="260" y="278" width="436" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="478" y="302" font-size="15" text-anchor="middle" font-weight="700">save_report · "w" 로 새로 쓰기</text>
<text x="478" y="323" font-size="14" text-anchor="middle">access_control_weekly_report_{today}.md</text>
<text x="24" y="292" font-size="14" fill="#666660">줄은 lines.append(…)</text>
<text x="24" y="314" font-size="14" fill="#666660">로 모으고</text>
<text x="24" y="336" font-size="14" fill="#666660">"\n".join(lines) 로 합침</text>
<text x="24" y="366" font-size="14" fill="#666660">로그처럼 덧붙이는 파일은 "a", 매주 새로 만드는 보고서는 "w" 입니다</text>
</g>
</svg>
