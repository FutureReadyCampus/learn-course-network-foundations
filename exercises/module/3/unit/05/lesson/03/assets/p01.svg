<text x="588" y="181" font-size="14" text-anchor="middle">build_report · save_report</text>
<polyline points="132,191 132,219" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="360,191 360,219" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="588,191 588,219" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="220" width="216" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
