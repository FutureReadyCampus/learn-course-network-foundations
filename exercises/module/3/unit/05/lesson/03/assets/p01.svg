<text x="132" y="181" font-size="14" text-anchor="middle" fill="#666660">run_checklist</text>
<rect x="252" y="136" width="216" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
