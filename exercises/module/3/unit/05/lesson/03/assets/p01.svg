<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 5-1을 마친 뒤 제공 파일 세 개를 만들어 주간 보고서를 만들고 실습 5-2로 간다</title>
<desc>weekly_run.py 는 실습 5-1의 checklist.py 와 제공 파일 log_summary.py, weekly_report.py 를 부르고, 시작하기에서 만든 데이터 파일 세 개를 읽어 주간 보고서 파일을 만듭니다. 응용 5-1을 하면 log_summary.py 를 골격으로 바꿔 직접 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
