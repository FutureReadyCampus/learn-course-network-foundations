<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>실습 5-2 은 Module 3 상황 8개를 네 칸으로 정리해 총정리를 쓴다</title>
<desc>Module 3에서 만든 파일과 함수를 상황별로 되짚는다. 상황마다 원인, 고칠 파일, 고치는 방법, 고친 뒤 확인을 내 말로 쓰고, 이 글이 보고서 실습 5-2 칸의 Module 3 총정리가 된다. 새로 배우는 것과 실행할 코드는 없다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 5-2 · Module 3 상황 되짚기</text>
<rect x="20" y="70" width="200" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="114" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">Module 3</text>
<text x="120" y="136.1" font-size="15" fill="#292929" text-anchor="middle">상황 8개</text>
<text x="120" y="157.9" font-size="15" fill="#292929" text-anchor="middle">만든 파일 · 함수</text>
<rect x="260" y="70" width="200" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="114" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">상황마다 네 칸</text>
<text x="360" y="136.1" font-size="15" fill="#292929" text-anchor="middle">원인 · 고칠 파일</text>
<text x="360" y="157.9" font-size="15" fill="#292929" text-anchor="middle">방법 · 확인</text>
<rect x="500" y="70" width="200" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="124.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">보고서 실습 5-2</text>
<text x="600" y="147" font-size="15" fill="#292929" text-anchor="middle">Module 3 총정리</text>
<line x1="222" y1="130" x2="256" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="462" y1="130" x2="496" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="220" width="680" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="249.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">새로 배우는 것은 없습니다</text>
<text x="360" y="272" font-size="15" fill="#292929" text-anchor="middle">코드를 실행하지 않고, 읽고 내 말로 씁니다</text>
</g>
</svg>
