<text x="24" y="300" font-size="15">순서: 실습 5-1 → 제공 파일 세 개 → python weekly_run.py → 실습 5-2</text>
<rect x="24" y="318" width="672" height="44" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
