<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Unit 5 마무리: 한 일과 파일을 확인하고 Module 4 이상탐지로 넘어간다</title>
<desc>실습 5-1의 점검, 제공 파일로 만든 주간 보고서, 실습 5-2의 총정리를 확인하고 access_control 폴더의 파일을 봅니다. 깃허브 올리기는 Module 4 첫 Unit에서 함께 하고, 다음은 로그를 읽고 세고 기준과 비교하는 Module 4 이상탐지입니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
