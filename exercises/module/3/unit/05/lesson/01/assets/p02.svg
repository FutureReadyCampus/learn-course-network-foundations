<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 211" role="img">
<title>핵심 실습에는 config/week_state.json을 준비한다</title>
<desc>access_control 아래 config 폴더에 week_state.json을 만들고 json.tool로 읽히는지 확인한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">핵심 실습의 점검 데이터</text>
<rect x="20" y="52" width="330" height="138" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="80" font-size="16" fill="#292929" font-weight="700">access_control/</text>
<text x="56" y="112" font-size="15" fill="#292929" font-weight="700">config/</text>
<text x="76" y="140" font-size="15" fill="#2f6fd0">week_state.json</text>
<text x="96" y="164" font-size="14" fill="#666660">사용자 6명 · 예외 4개</text>
<rect x="380" y="52" width="320" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540" y="83.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">week_state.json</text>
<text x="540" y="106.8" font-size="15" fill="#292929" text-anchor="middle">python -m json.tool config/week_state.json</text>
<text x="540" y="128.6" font-size="15" fill="#292929" text-anchor="middle">→ 내용이 다시 나오면 정상</text>
</g>
</svg>
