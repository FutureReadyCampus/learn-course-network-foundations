<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>report_u5.md 를 틀에서 복사해 만들고, 꼭 채울 다섯 칸을 채운 뒤 응용 칸은 한 것만 채운다</title>
<desc>access_control 폴더에 report_u5.md 를 새로 만들고 틀을 붙여 넣습니다. 꼭 채울 칸은 실습 5-1 (가) · (나), 실습 5-2 상황 3~8 중 2개와 질문 (가)로 다섯 칸입니다. 실습 응용 질문과 응용 5-1 칸은 한 것만 채웁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">보고서 파일 만들기 · report_u5.md</text>
<rect x="24" y="56" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="124" y="80" font-size="15" text-anchor="middle">1. New File</text>
<text x="124" y="101" font-size="14" text-anchor="middle" fill="#666660">access_control 안</text>
<polyline points="226,84 256,84" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="260" y="56" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="80" font-size="15" text-anchor="middle">2. 틀 복사 · 붙여 넣기</text>
<text x="360" y="101" font-size="14" text-anchor="middle" fill="#666660">이름 바꾸고 저장</text>
<polyline points="462,84 492,84" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="496" y="56" width="200" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="596" y="80" font-size="15" text-anchor="middle">3. 실습마다 채우기</text>
<text x="596" y="101" font-size="14" text-anchor="middle" fill="#666660">같은 번호 답: 뒤에</text>
<rect x="24" y="136" width="420" height="200" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="44" y="166" font-size="16" font-weight="700">핵심 · 꼭 채울 다섯 칸</text>
<text x="44" y="198" font-size="15">## 실습 5-1 · (가) (나)</text>
<text x="44" y="230" font-size="15">## 실습 5-2</text>
<text x="64" y="256" font-size="14">### 상황 3 ~ 8 중 2개</text>
<text x="64" y="280" font-size="14">상황 1 · 2는 본보기라 칸이 없음</text>
<text x="64" y="304" font-size="14">### 질문 · (가)</text>
<rect x="476" y="136" width="220" height="200" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="586" y="166" font-size="16" text-anchor="middle" font-weight="700">응용 · 여유가 되면</text>
<text x="586" y="198" font-size="15" text-anchor="middle">## 실습 응용 질문</text>
<text x="586" y="222" font-size="14" text-anchor="middle">5-1 (다) · 5-2 (나) (다)</text>
<text x="586" y="250" font-size="15" text-anchor="middle">## 응용 5-1</text>
<text x="586" y="286" font-size="14" text-anchor="middle" fill="#666660">내가 한 것만</text>
<text x="586" y="308" font-size="14" text-anchor="middle" fill="#666660">채웁니다</text>
</g>
</svg>
