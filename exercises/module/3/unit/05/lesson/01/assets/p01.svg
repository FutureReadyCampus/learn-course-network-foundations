<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>Unit 5는 실습 5-1, 제공 파일로 만든 주간 보고서, 실습 5-2 순서로 하고 응용 5-1은 선택이다</title>
<desc>오늘 3시간은 시작 15분, 실습 약 110분, 글쓰기 40분, 마무리 15분입니다. 실습 시간에는 점검 체크리스트(실습 5-1)를 쓰고, 제공 파일로 주간 보고서를 만든 뒤, Module 3 총정리(실습 5-2)를 합니다. 응용 5-1은 시간이 남을 때 하는 선택입니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
