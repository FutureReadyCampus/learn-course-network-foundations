<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>M3 Unit 5는 점검, 로그 집계, 주간 보고서, Module 3 총정리로 이어진다</title>
<desc>실습 5-1은 퇴사자, 만료된 예외, 부서와 역할 세 가지를 점검 체크리스트로 본다. 응용 5-1은 요청 로그를 집계해 경고 기준과 비교하고 10-1 결과와 합쳐 주간 보고서를 만든다. 실습 5-2은 상황 8개로 Module 3을 총정리한다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">M3 Unit 5에서 할 일: 점검, 집계, 총정리</text>
<rect x="20" y="56" width="210" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125" y="92.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 5-1</text>
<text x="125" y="116.1" font-size="15" fill="#292929" text-anchor="middle">점검 체크리스트</text>
<text x="125" y="137.8" font-size="15" fill="#292929" text-anchor="middle">퇴사자</text>
<text x="125" y="159.6" font-size="15" fill="#292929" text-anchor="middle">만료된 예외</text>
<text x="125" y="181.3" font-size="15" fill="#292929" text-anchor="middle">부서와 역할</text>
<rect x="255" y="56" width="210" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="92.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">응용 5-1</text>
<text x="360" y="116.1" font-size="15" fill="#292929" text-anchor="middle">요청 로그 집계</text>
<text x="360" y="137.8" font-size="15" fill="#292929" text-anchor="middle">허용 · 거부 건수</text>
<text x="360" y="159.6" font-size="15" fill="#292929" text-anchor="middle">거부율 · 거부 사유</text>
<text x="360" y="181.3" font-size="15" fill="#292929" text-anchor="middle">경고 기준과 비교</text>
<rect x="490" y="56" width="210" height="150" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="595" y="92.9" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 5-2</text>
<text x="595" y="116.1" font-size="15" fill="#292929" text-anchor="middle">Module 3 총정리</text>
<text x="595" y="137.8" font-size="15" fill="#292929" text-anchor="middle">상황 8개마다</text>
<text x="595" y="159.6" font-size="15" fill="#292929" text-anchor="middle">원인과 고치는 방법</text>
<text x="595" y="181.3" font-size="15" fill="#292929" text-anchor="middle">내 말로 정리</text>
<polyline points="231,131 254,131" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="466,131 489,131" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="125,207 125,250 255,250" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="360,207 360,229" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="256" y="230" width="210" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="361" y="260.6" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">주간 보고서 파일</text>
<text x="20" y="318" font-size="15" fill="#666660">M3 Unit 4까지 만든 파일은 불러오지 않습니다. 데이터 세 개를 붙여 넣고 시작합니다.</text>
<text x="20" y="346" font-size="15" fill="#666660">깃허브에 올리는 일은 Module 4 Unit 1 실습 1-2 마지막에 합니다.</text>
</g>
