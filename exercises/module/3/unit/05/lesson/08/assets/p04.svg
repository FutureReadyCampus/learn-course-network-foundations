<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>올리기 전 비밀키, 개인정보, 실제 이름, module: 3 · unit: 5 머리말을 확인한다</title>
<desc>글은 공개되어 누구나 볼 수 있으므로 Commit changes 전에 네 가지를 확인합니다. 비밀키 · 토큰 · 비밀번호가 없는지, 이메일 · 전화번호가 없는지, 실습 데이터 이름 말고 실제 사람 이름이 없는지, 머리말이 module: 3, unit: 5 인지 봅니다.</desc>
<defs><marker id="a-u5w-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
