<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>40분을 고르기 5분, 쓰기 25분, 점검·올리기 10분으로 나누고 글감 하나를 고른다</title>
<desc>글쓰기 40분은 고르기 5분, 쓰기 25분, 점검과 올리기 10분입니다. 글감은 실습 5-1 · 5-2의 핵심 글감 세 개, 도전 5-1을 했을 때의 글감 두 개, Module 3 다섯 Unit을 돌아보는 글 중에서 하나를 고릅니다. 세 문장이나 막힌 이야기도 좋은 글입니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="32" font-size="19" font-weight="700">글쓰기 40분 · 오늘의 글감 하나 고르기</text>
<rect x="24" y="50" width="84" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="66" y="71" font-size="14" text-anchor="middle" font-weight="700">고르기</text>
<text x="66" y="90" font-size="14" text-anchor="middle">5분</text>
<rect x="112" y="50" width="416" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="320" y="81" font-size="16" text-anchor="middle" font-weight="700">쓰기 25분 · 글 틀의 빈칸 채우기</text>
<rect x="532" y="50" width="164" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="614" y="81" font-size="15" text-anchor="middle" font-weight="700">점검 · 올리기 10분</text>
<rect x="24" y="124" width="300" height="172" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="40" y="152" font-size="16" font-weight="700" fill="#2f6fd0">핵심 실습 글감 (5-1 · 5-2)</text>
<text x="40" y="190" font-size="15">1  「통과」를 다시 읽기</text>
<text x="40" y="226" font-size="15">2  점검이 알려 주는 것 · 못 하는 것</text>
<text x="40" y="262" font-size="15">3  데이터 고침과 규칙 고침 비교</text>
<rect x="340" y="124" width="170" height="172" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="356" y="152" font-size="16" font-weight="700">도전 글감</text>
<text x="356" y="172" font-size="14" fill="#666660">도전 5-1을 했다면</text>
<text x="356" y="210" font-size="15">1  dami 와 gaeun</text>
<text x="356" y="246" font-size="15">2  거부율 0% 읽기</text>
<rect x="526" y="124" width="170" height="172" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="542" y="152" font-size="16" font-weight="700">Module 3 돌아보기</text>
<text x="542" y="172" font-size="14" fill="#666660">선택 · 마지막 Unit</text>
<rect x="542" y="192" width="24" height="28" rx="4" fill="#f1f1ef" stroke="#dededb"/>
<text x="554" y="211" font-size="14" text-anchor="middle">1</text>
<rect x="572" y="192" width="24" height="28" rx="4" fill="#f1f1ef" stroke="#dededb"/>
<text x="584" y="211" font-size="14" text-anchor="middle">2</text>
<rect x="602" y="192" width="24" height="28" rx="4" fill="#f1f1ef" stroke="#dededb"/>
<text x="614" y="211" font-size="14" text-anchor="middle">3</text>
<rect x="632" y="192" width="24" height="28" rx="4" fill="#f1f1ef" stroke="#dededb"/>
<text x="644" y="211" font-size="14" text-anchor="middle">4</text>
<rect x="662" y="192" width="24" height="28" rx="4" fill="#f1f1ef" stroke="#dededb"/>
<text x="674" y="211" font-size="14" text-anchor="middle">5</text>
<text x="542" y="250" font-size="14">가장 오래 고민한</text>
<text x="542" y="270" font-size="14">Unit 하나</text>
<rect x="24" y="316" width="672" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="344" font-size="15" text-anchor="middle">세 문장만 써도 됩니다 · 끝까지 풀지 못한 이야기도 좋은 글입니다</text>
</g>
</svg>
