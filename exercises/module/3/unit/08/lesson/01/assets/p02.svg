<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>access_control 폴더에 Unit 1~3, 6, 7 파일이 있고 확인 결과가 14 7 3 이어야 합니다</title>
<desc>Unit 8 코드가 불러 쓰는 앞 Unit 파일의 배치입니다. 확인 명령의 마지막 줄은 「이전 파일 정상 14 7 3」입니다. Unit 6 · 7 파일이 없으면 revoke_input.py 의 「없을 때용」 코드를 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">access_control 폴더 — Unit 8 전에 있어야 할 파일</text>
<rect x="20" y="50" width="440" height="352" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="76" font-size="16" fill="#292929" text-anchor="start" font-weight="700">access_control/</text>
<rect x="36" y="92" width="408" height="68" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="48" y="120.8" font-size="15" fill="#292929" text-anchor="start">Unit 1 ~ 3: rbac.py · policy.py</text>
<text x="48" y="141.8" font-size="15" fill="#292929" text-anchor="start">exception_policy.py · config_loader.py</text>
<rect x="36" y="172" width="408" height="68" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="48" y="200.8" font-size="15" fill="#292929" text-anchor="start">Unit 6: review_list.py · review_rules.py</text>
<text x="48" y="221.8" font-size="15" fill="#292929" text-anchor="start">review_unused.py · config/access_log.json</text>
<rect x="36" y="252" width="408" height="68" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="48" y="280.8" font-size="15" fill="#292929" text-anchor="start">Unit 7: overprivilege.py · report_exclude.py</text>
<text x="48" y="301.8" font-size="15" fill="#292929" text-anchor="start">config/exclude_list.json</text>
<rect x="36" y="332" width="408" height="54" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="48" y="364.2" font-size="15" fill="#292929" text-anchor="start">report_u8.md 는 「보고서 쓰기」에서 만듦</text>
<rect x="490" y="60" width="210" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="595" y="89.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">확인 명령 결과</text>
<text x="595" y="110.2" font-size="15" fill="#292929" text-anchor="middle">이전 파일 정상</text>
<text x="595" y="131.2" font-size="15" fill="#292929" text-anchor="middle">14 7 3</text>
<rect x="490" y="170" width="210" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="595" y="202.2" font-size="15" fill="#292929" text-anchor="middle">14 = 현황</text>
<text x="595" y="223.2" font-size="15" fill="#292929" text-anchor="middle">7 = 사용 이력</text>
<text x="595" y="244.2" font-size="15" fill="#292929" text-anchor="middle">3 = 회수 제외</text>
<rect x="490" y="290" width="210" height="112" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="595" y="330.2" font-size="15" fill="#292929" text-anchor="middle">Unit 6 · 7 파일이 없으면</text>
<text x="595" y="351.2" font-size="15" fill="#292929" text-anchor="middle">revoke_input.py 에</text>
<text x="595" y="372.2" font-size="15" fill="#292929" text-anchor="middle">「없을 때용」 코드</text>
</g>
</svg>
