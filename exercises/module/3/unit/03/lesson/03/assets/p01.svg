<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>실습 3-2 전에 만드는 파일 네 개: 하나는 실습 3-2, 셋은 Unit 4 가 쓴다</title>
<desc>access_control 폴더에 review_rules.py, overprivilege.py, report_exclude.py, config/exclude_list.json 을 만듭니다. 실습 3-2 는 review_rules.py 의 find_stale 을 쓰고, 나머지 세 파일은 Unit 4 가 씁니다. 응용 3-1 ~ 3-3 을 하면 이 파일들을 골격으로 바꿔 직접 써 봅니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">실습 3-2 전에 만드는 파일 네 개</text>
<rect x="20" y="50" width="400" height="256" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="76" font-size="15" fill="#666660" font-weight="700">access_control 폴더</text>
<rect x="36" y="90" width="368" height="44" rx="6" fill="#ffffff" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="50" y="117" font-size="15" fill="#292929" font-weight="700">review_rules.py</text>
<text x="390" y="117" font-size="14" fill="#1f7a4a" text-anchor="end">find_stale</text>
<rect x="36" y="142" width="368" height="44" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="50" y="169" font-size="15" fill="#292929" font-weight="700">overprivilege.py</text>
<text x="390" y="169" font-size="14" fill="#666660" text-anchor="end">generate_report</text>
<rect x="36" y="194" width="368" height="44" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="50" y="221" font-size="15" fill="#292929" font-weight="700">report_exclude.py</text>
<text x="390" y="221" font-size="14" fill="#666660" text-anchor="end">split_by_exclude</text>
<rect x="36" y="246" width="368" height="44" rx="6" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="50" y="273" font-size="15" fill="#292929" font-weight="700">config/exclude_list.json</text>
<text x="390" y="273" font-size="14" fill="#666660" text-anchor="end">제외 리스트</text>
<rect x="480" y="90" width="220" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590" y="117" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">실습 3-2 에서 씀</text>
<rect x="480" y="142" width="220" height="148" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="590" y="208" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">Unit 4 가 씀</text>
<text x="590" y="232" font-size="14" fill="#292929" text-anchor="middle">오늘은 만들어만 둔다</text>
<polyline points="404,112 476,112" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="404,164 476,164" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="404,216 476,216" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="404,268 476,268" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="326" width="680" height="48" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="360" y="355" font-size="15" fill="#292929" text-anchor="middle">응용 3-1 ~ 3-3(여유가 되면)을 하면 이 파일들을 빈칸 골격으로 바꿔 직접 써 본다</text>
</g>
</svg>
