<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img">
<title>find_unused 는 권한마다 사용 이력과 지난 일 수를 보고 오래 안 쓴 권한을 모은다</title>
<desc>현황의 권한을 한 건씩 꺼내 「사용자:권한」 문자열로 마지막 사용 시각 used_text 를 찾습니다. used_text 가 None 이거나 지난 일 수가 limit_days 보다 크면 복사본을 unused 에 추가하고, 아니면 그대로 둡니다. 모든 권한을 꺼낸 뒤 unused 를 리턴합니다.</desc>
<defs><marker id="a-f01-0604" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#292929">
<rect x="56" y="14" width="420" height="48" rx="4" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="266.0" y="34" text-anchor="middle" font-weight="700">find_unused(access_list, last_used_map,</text>
<text x="266.0" y="52" text-anchor="middle">now, limit_days)</text>
<rect x="56" y="84" width="420" height="48" rx="4" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="266.0" y="104" text-anchor="middle">unused = []</text>
<text x="266.0" y="122" text-anchor="middle">오래 안 쓴 권한을 담을 리스트</text>
<polyline points="266.0,62 266.0,83" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<rect x="56" y="154" width="420" height="48" rx="4" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="266.0" y="174" text-anchor="middle">현황의 권한을 한 건씩 꺼내 「사용자:권한」 문자열로</text>
<text x="266.0" y="192" text-anchor="middle">마지막 사용 시각(used_text)을 찾는다</text>
<polyline points="266.0,132 266.0,153" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<rect x="56" y="224" width="420" height="48" rx="14" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="266.0" y="244" text-anchor="middle">used_text 가 None 인가?</text>
<text x="266.0" y="262" text-anchor="middle">(사용 이력 없음)</text>
<polyline points="266.0,202 266.0,223" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<rect x="56" y="294" width="420" height="48" rx="14" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="266.0" y="314" text-anchor="middle">마지막 사용 이후 지난 일 수가</text>
<text x="266.0" y="332" text-anchor="middle">limit_days 보다 큰가?</text>
<polyline points="266.0,272 266.0,293" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="256.0" y="288.0" text-anchor="end" fill="#666660">아니다</text>
<rect x="56" y="364" width="420" height="30" rx="4" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
<text x="266.0" y="384" text-anchor="middle">최근에 쓴 것이므로 그대로 둔다</text>
<polyline points="266.0,342 266.0,363" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="256.0" y="358.0" text-anchor="end" fill="#666660">아니다</text>
<rect x="56" y="442" width="420" height="30" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="266.0" y="462" text-anchor="middle">unused 를 리턴한다</text>
<polyline points="266.0,394 266.0,441" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="276.0" y="433" text-anchor="start" fill="#666660">모든 권한을 꺼낸 뒤</text>
<rect x="520" y="215.0" width="170" height="66" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605.0" y="235.0" text-anchor="middle">마지막 사용 시각이</text>
<text x="605.0" y="253.0" text-anchor="middle">None 인 복사본을</text>
<text x="605.0" y="271.0" text-anchor="middle">unused 에 추가한다</text>
<polyline points="476,248.0 519,248.0" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="498.0" y="241.0" text-anchor="middle" fill="#666660">그렇다</text>
<polyline points="690,248.0 706,248.0 706,409 269.0,409" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<rect x="520" y="285.0" width="170" height="66" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605.0" y="305.0" text-anchor="middle">마지막 사용 시각을</text>
<text x="605.0" y="323.0" text-anchor="middle">적은 복사본을 unused</text>
<text x="605.0" y="341.0" text-anchor="middle">에 추가한다</text>
<polyline points="476,318.0 519,318.0" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="498.0" y="311.0" text-anchor="middle" fill="#666660">그렇다</text>
<polyline points="690,318.0 706,318.0 706,409 269.0,409" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<polyline points="266.0,409 30,409 30,178.0 55,178.0" fill="none" stroke="#666660" stroke-width="1.5" marker-end="url(#a-f01-0604)"/>
<text x="22" y="293.5" text-anchor="middle" fill="#666660" transform="rotate(-90 22 293.5)">다음 권한으로</text>
<circle cx="266.0" cy="409" r="3" fill="#666660"/>
</g></svg>
