<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>회수 제외 리스트 세 건을 적고 json.tool 로 JSON 규칙에 맞는지 확인한다</title>
<desc>config/exclude_list.json 에는 gaeun ACCOUNT:CHANGE, seoyeon SALES:CHANGE, dami SALES:QUERY 세 건이 이유와 함께 한 줄에 한 건씩 들어갑니다. 저장한 뒤 python -m json.tool 로 검사해 세 건이 다시 정리되어 나오면 됩니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">config/exclude_list.json · 회수 제외 리스트</text>
<text x="20" y="56" font-size="14" fill="#666660">access_control/config 폴더 안 · 한 줄이 한 건</text>
<rect x="20" y="70" width="680" height="40" rx="0" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="96" font-size="15" fill="#292929" font-weight="700">user</text>
<text x="176" y="96" font-size="15" fill="#292929" font-weight="700">permission</text>
<text x="376" y="96" font-size="15" fill="#292929" font-weight="700">reason (줄임)</text>
<rect x="20" y="110" width="680" height="44" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="137" font-size="15" fill="#292929">gaeun</text>
<text x="176" y="137" font-size="15" fill="#2f6fd0">ACCOUNT:CHANGE</text>
<text x="376" y="137" font-size="15" fill="#292929">계정 사고가 났을 때만 쓰는 권한</text>
<rect x="20" y="154" width="680" height="44" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="181" font-size="15" fill="#292929">seoyeon</text>
<text x="176" y="181" font-size="15" fill="#2f6fd0">SALES:CHANGE</text>
<text x="376" y="181" font-size="15" fill="#292929">6월 말 · 12월 말 결산 때만 쓴다</text>
<rect x="20" y="198" width="680" height="44" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="225" font-size="15" fill="#292929">dami</text>
<text x="176" y="225" font-size="15" fill="#2f6fd0">SALES:QUERY</text>
<text x="376" y="225" font-size="15" fill="#292929">넘겨받을 사람이 정해질 때까지</text>
<line x1="160" y1="70" x2="160" y2="242" stroke="#dededb" stroke-width="1.5"/>
<line x1="360" y1="70" x2="360" y2="242" stroke="#dededb" stroke-width="1.5"/>
<text x="20" y="282" font-size="16" fill="#292929" font-weight="700">저장한 뒤 터미널에서 확인</text>
<rect x="20" y="296" width="420" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="329" font-size="14" fill="#292929">python -m json.tool config/exclude_list.json</text>
<polyline points="440,324 476,324" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="480" y="296" width="220" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590" y="320" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">세 건이 다시</text>
<text x="590" y="341" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">정리되어 나오면 OK</text>
<text x="20" y="380" font-size="14" fill="#666660">그다음 ls 와 ls config 로 파일 네 개를 보고 실습 3-2 로 간다</text>
</g>
</svg>
