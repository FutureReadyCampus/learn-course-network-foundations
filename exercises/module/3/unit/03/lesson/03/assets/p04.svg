<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>실패 메시지에서 줄 번호와 설명을 읽고, 코드와 기대 중 무엇이 다른지 판단합니다</title>
<desc>Traceback 의 세 줄이 각각 무엇을 알려 주는지 보여 줍니다. 실패하면 어느 규칙이 깨졌는지 보고, 코드가 틀렸는지 제안이 정책과 다른지 판단하며, 바로 코드를 고치지 않습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif" fill="#292929">
<text x="24" y="34" font-size="19" font-weight="700">2.2 실패 메시지 읽기와 판단 순서</text>
<rect x="24" y="52" width="420" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="78" font-size="14">File …/test_policy_extra.py, line 19</text>
<path d="M446,73 L470,73" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="478" y="78" font-size="15">몇 번째 줄에서 멈췄나</text>
<rect x="24" y="102" width="420" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="128" font-size="14">assert is_allowed == True, "6. …"</text>
<path d="M446,123 L470,123" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="478" y="128" font-size="15">어느 assert 인가</text>
<rect x="24" y="152" width="420" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="178" font-size="14">AssertionError: 6. 만료 정각에도 …</text>
<path d="M446,173 L470,173" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="478" y="178" font-size="15">assert 에 적은 설명</text>
<text x="24" y="226" font-size="16" font-weight="700">실패하면 이 순서로 생각합니다</text>
<rect x="24" y="244" width="200" height="108" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="124" y="292.9" font-size="15" text-anchor="middle">1. 어느 규칙이</text>
<text x="124" y="313.9" font-size="15" text-anchor="middle">깨졌나 확인</text>
<rect x="260" y="244" width="200" height="108" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="282.4" font-size="15" text-anchor="middle">2. 코드가 틀렸나,</text>
<text x="360" y="303.4" font-size="15" text-anchor="middle">제안이 정책과</text>
<text x="360" y="324.4" font-size="15" text-anchor="middle">다른가 판단</text>
<path d="M224,298 L258,298" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<rect x="496" y="244" width="200" height="108" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596" y="271.9" font-size="15" text-anchor="middle">3. 바로 고치지 않음</text>
<text x="596" y="292.9" font-size="15" text-anchor="middle">정책이 바뀌면</text>
<text x="596" y="313.9" font-size="15" text-anchor="middle">코드 · 테스트 · 설명</text>
<text x="596" y="334.9" font-size="15" text-anchor="middle">함께 고침</text>
<path d="M460,298 L494,298" fill="none" stroke="#666660" stroke-width="1.6" marker-end="url(#a-p04)"/>
<text x="24" y="384" font-size="15" fill="#666660">5번 제안: 퇴사자는 예외가 있어도 거부</text>
<text x="24" y="408" font-size="15" fill="#666660">6번 제안: 만료 시각 18:00 정각에도 허용</text>
</g>
</svg>
