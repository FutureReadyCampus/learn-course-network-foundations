<text x="300" y="138" font-size="15" fill="#292929">module: 3</text>
<text x="300" y="158" font-size="15" fill="#e0442e" font-weight="700">unit: 3</text>
<text x="490" y="138" font-size="14" fill="#666660">날짜는 오늘 날짜,</text>
<text x="490" y="158" font-size="14" fill="#666660">sample: true 는 빼기</text>
<rect x="270" y="192" width="430" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
