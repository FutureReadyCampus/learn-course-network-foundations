<rect x="20" y="124" width="200" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="34" y="149" font-size="15" fill="#292929" font-weight="700">post-short.md</text>
<text x="34" y="171" font-size="14" fill="#666660">5분밖에 없다</text>
<rect x="20" y="196" width="200" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="34" y="221" font-size="15" fill="#292929" font-weight="700">post-stuck.md</text>
<text x="34" y="243" font-size="14" fill="#666660">오류가 안 풀렸다</text>
<line x1="226" y1="154" x2="262" y2="154" stroke="#666660" stroke-width="1.5" marker-end="url(#a-p02-u3w)"/>
