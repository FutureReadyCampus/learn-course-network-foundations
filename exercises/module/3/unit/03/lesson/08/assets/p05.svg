<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>응용 3-2 정답: 규칙 7건과 안 쓴 8건을 합치고 겹친 5건을 빼 후보 10건</title>
<desc>현황 14건을 규칙 점검과 90일 미사용 점검으로 나눈 결과를 권한 한 건씩 합칩니다. 7 + 8 − 5 = 10건이 후보이고 나머지 4건은 후보가 아닙니다. if len(reasons) &gt; 0: 검사를 빼면 14건이 모두 후보가 됩니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">응용 3-2 정답 — 두 점검 결과를 합쳐 후보 10건</text>
<rect x="20" y="60" width="150" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="94.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">현황</text>
<text x="95" y="115.8" font-size="15" fill="#292929" text-anchor="middle">14건</text>
<path d="M170 92 L218 78" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<path d="M170 110 L218 144" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="220" y="52" width="200" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="320" y="83.2" font-size="15" fill="#292929" text-anchor="middle">규칙에 걸림 7건</text>
<rect x="220" y="118" width="200" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="320" y="149.2" font-size="15" fill="#292929" text-anchor="middle">90일 넘게 안 씀 8건</text>
<path d="M420 78 L468 95" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<path d="M420 144 L468 125" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="470" y="60" width="230" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="585" y="94.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">후보 10건</text>
<text x="585" y="115.2" font-size="15" fill="#292929" text-anchor="middle">7 + 8 − 5 = 10</text>
<text x="585" y="136.2" font-size="15" fill="#292929" text-anchor="middle">(두 점검에 모두 걸림 5건)</text>
<path d="M95 140 L95 210 L468 210" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="470" y="180" width="230" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="585" y="204.8" font-size="15" fill="#292929" text-anchor="middle">후보 아님 4건</text>
<text x="585" y="225.8" font-size="15" fill="#292929" text-anchor="middle">이유가 하나도 없음</text>
<rect x="20" y="260" width="330" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="294.8" font-size="15" fill="#292929" text-anchor="middle">후보 한 건 = 권한 + reasons</text>
<text x="185" y="315.8" font-size="15" fill="#292929" text-anchor="middle">reasons = [이유1, 이유2]</text>
<rect x="370" y="260" width="330" height="80" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="535" y="294.8" font-size="15" fill="#292929" text-anchor="middle">if len(reasons) &gt; 0: 를 빼면</text>
<text x="535" y="315.8" font-size="15" fill="#292929" text-anchor="middle">후보가 14건으로 늘어납니다</text>
</g>
</svg>
