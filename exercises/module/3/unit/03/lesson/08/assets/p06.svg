<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>도전 3-3 정답: 후보 10건이 회수 제외 2건과 회수 대상 8건으로 나뉩니다</title>
<desc>can_exclude 는 제외 리스트에 있고 퇴사한 계정이 아닌 후보만 회수 제외로 보냅니다. dami 의 SALES:QUERY 는 리스트에 있어도 퇴사한 계정이라 회수 대상에 남습니다. and not is_resigned 를 빼면 6건과 4건으로 바뀝니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">도전 3-3 정답 — 후보를 회수 대상과 회수 제외로</text>
<rect x="20" y="70" width="140" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="99.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">후보</text>
<text x="90" y="120.8" font-size="15" fill="#292929" text-anchor="middle">10건</text>
<path d="M160 105 L196 105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="200" y="56" width="250" height="98" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="325" y="89.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">can_exclude</text>
<text x="325" y="110.2" font-size="15" fill="#292929" text-anchor="middle">제외 리스트에 있고</text>
<text x="325" y="131.2" font-size="15" fill="#292929" text-anchor="middle">퇴사한 계정이 아닌가?</text>
<path d="M450 95 L488 95" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="460" y="86" font-size="14" fill="#666660" text-anchor="start">예</text>
<rect x="490" y="50" width="210" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595" y="84.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 제외 2건</text>
<text x="595" y="105.2" font-size="15" fill="#292929" text-anchor="middle">seoyeon SALES:CHANGE</text>
<text x="595" y="126.2" font-size="15" fill="#292929" text-anchor="middle">gaeun ACCOUNT:CHANGE</text>
<path d="M325 154 L325 225 L488 225" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="335" y="196" font-size="14" fill="#666660" text-anchor="start">아니오</text>
<rect x="490" y="190" width="210" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="595" y="219.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">회수 대상 8건</text>
<text x="595" y="240.8" font-size="15" fill="#292929" text-anchor="middle">dami 2건 포함</text>
<rect x="20" y="180" width="280" height="86" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="160" y="207.2" font-size="15" fill="#292929" text-anchor="middle">dami SALES:QUERY</text>
<text x="160" y="228.2" font-size="15" fill="#292929" text-anchor="middle">제외 리스트에 있어도</text>
<text x="160" y="249.2" font-size="15" fill="#292929" text-anchor="middle">퇴사한 계정이라 회수 대상</text>
<rect x="20" y="290" width="680" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="321.2" font-size="15" fill="#292929" text-anchor="middle">and not is_resigned 를 빼면 회수 대상 6건 · 회수 제외 4건이 됩니다</text>
</g>
</svg>
