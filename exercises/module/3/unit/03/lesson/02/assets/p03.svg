<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>회수는 아무도 확인하지 않아 과다권한이 남으므로 접근 점검으로 가려낸다</title>
<desc>권한은 부여할 때 절차를 거치지만 회수할 때는 확인하지 않는 일이 많아 퇴사·이동 뒤에도 남습니다. 필요보다 많은 권한이 과다권한이고, 접근 점검으로 정기적으로 가려냅니다. 도전 3-1는 사실로, 실습 3-2은 규칙 밖의 권한을 찾습니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">왜 접근 점검이 필요한가</text>
<rect x="20" y="50" width="320" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="180" y="80.62" font-size="15" fill="#292929" text-anchor="middle">부여할 때: 절차를 거친다</text>
<rect x="380" y="50" width="320" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="540" y="80.62" font-size="15" fill="#292929" text-anchor="middle">회수할 때: 아무도 확인하지 않는다</text>
<rect x="20" y="130" width="680" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="156.428" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">퇴사 · 부서 이동 · 프로젝트 종료 뒤에도 권한이 남는다</text>
<text x="360" y="177.82" font-size="15" fill="#292929" text-anchor="middle">= 과다권한 · 계정이 탈취되면 그만큼 피해가 커진다</text>
<rect x="20" y="222" width="680" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="250.928" font-size="16" fill="#2f6fd0" text-anchor="middle" font-weight="700">접근 점검 (access review) · 부여된 권한을 정기적으로 살펴 가려낸다</text>
<rect x="20" y="298" width="320" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180" y="324.428" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">도전 3-1</text>
<text x="180" y="345.82" font-size="15" fill="#292929" text-anchor="middle">파일에 적힌 사실로 (퇴사 · 만료)</text>
<rect x="380" y="298" width="320" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="324.428" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 3-2</text>
<text x="540" y="345.82" font-size="15" fill="#292929" text-anchor="middle">규칙으로 못 거르는 권한</text>
<polyline points="540,102 540,127" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="180,102 180,127" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="360,194 360,219" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="180,270 180,295" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="540,270 540,295" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
</g>
</svg>
