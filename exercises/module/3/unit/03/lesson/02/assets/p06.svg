<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>실습 3-1 정리: 딕셔너리 한 건, items 로 꺼내기, 리스트 잇기, expires 추가</title>
<desc>현황의 한 건은 user, permission, source, employed 키를 가진 딕셔너리입니다. USERS.items() 로 사용자와 정보를 같이 꺼내 역할 권한 리스트를 잇고, 예외 권한에는 expires 키를 더합니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">실습 3-1 정리</text>
<rect x="20" y="52" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128" y="77.528" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">한 건 = 딕셔너리</text>
<text x="128" y="97.912" font-size="14" fill="#292929" text-anchor="middle">user · permission ·</text>
<text x="128" y="117.512" font-size="14" fill="#292929" text-anchor="middle">source · employed</text>
<text x="128" y="137.112" font-size="14" fill="#666660" text-anchor="middle">예외는 expires 도</text>
<rect x="252" y="52" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="87.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">사용자와 정보 함께</text>
<text x="360" y="107.712" font-size="14" fill="#292929" text-anchor="middle">for user, info in</text>
<text x="360" y="127.312" font-size="14" fill="#292929" text-anchor="middle">USERS.items():</text>
<rect x="484" y="52" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="592" y="87.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">역할로 받은 권한</text>
<text x="592" y="107.712" font-size="14" fill="#292929" text-anchor="middle">role_entries(…)</text>
<text x="592" y="127.312" font-size="14" fill="#666660" text-anchor="middle">미리 채워 둠</text>
<rect x="20" y="168" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128" y="203.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">리스트 이어 붙이기</text>
<text x="128" y="223.712" font-size="14" fill="#292929" text-anchor="middle">access_list =</text>
<text x="128" y="243.312" font-size="14" fill="#292929" text-anchor="middle">access_list + role_list</text>
<rect x="252" y="168" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="213.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">예외 받은 사용자 정보</text>
<text x="360" y="233.512" font-size="14" fill="#292929" text-anchor="middle">user_info = USERS[user]</text>
<rect x="484" y="168" width="216" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="592" y="203.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">예외에만 붙는 키</text>
<text x="592" y="223.712" font-size="14" fill="#292929" text-anchor="middle">entry["expires"] =</text>
<text x="592" y="243.312" font-size="14" fill="#292929" text-anchor="middle">exception["expires"]</text>
</g>
</svg>
