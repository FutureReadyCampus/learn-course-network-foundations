<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 574" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>build_access_list 는 역할로 받은 권한과 예외로 받은 권한을 한 리스트로 모은다</title>
<desc>빈 access_list 를 만들고, 사용자를 한 명씩 꺼내 role_entries 로 얻은 역할 권한을 이어 붙입니다. 사용자를 모두 본 뒤에는 예외를 하나씩 꺼내 source 「예외 N번」과 만료 시각 expires 를 적은 권한 한 건씩을 추가합니다. 예외까지 모두 본 뒤 access_list 를 리턴합니다.</desc>
<defs><marker id="a-f01-0602" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<text x="24" y="30" font-size="18" fill="#292929" font-weight="700">build_access_list 가 현황 리스트를 만드는 순서</text>
<rect x="100" y="50" width="520" height="37" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="73" font-size="14" fill="#292929" text-anchor="middle">build_access_list()</text>
<line x1="360" y1="87" x2="360" y2="111" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<rect x="100" y="113" width="520" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="136" font-size="14" fill="#292929" text-anchor="middle">access_list = []</text>
<text x="360" y="155" font-size="14" fill="#292929" text-anchor="middle">(현황을 담을 빈 리스트)</text>
<line x1="360" y1="169" x2="360" y2="193" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<rect x="100" y="195" width="520" height="37" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="218" font-size="14" fill="#292929" text-anchor="middle">사용자를 한 명씩 꺼낸다 (user, info)</text>
<line x1="360" y1="232" x2="360" y2="256" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<rect x="100" y="258" width="520" height="75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="281" font-size="14" fill="#292929" text-anchor="middle">role_entries(user, info) 로 그 사용자가</text>
<text x="360" y="300" font-size="14" fill="#292929" text-anchor="middle">역할로 받은 권한 리스트를 얻어</text>
<text x="360" y="319" font-size="14" fill="#292929" text-anchor="middle">access_list 뒤에 이어 붙인다 (미리 채운 함수)</text>
<line x1="360" y1="333" x2="360" y2="357" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<text x="370" y="351" font-size="14" fill="#666660">사용자를 모두 꺼낸 뒤</text>
<rect x="100" y="359" width="520" height="37" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="382" font-size="14" fill="#292929" text-anchor="middle">예외를 하나씩 꺼낸다</text>
<line x1="360" y1="396" x2="360" y2="420" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<rect x="100" y="422" width="520" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="445" font-size="14" fill="#292929" text-anchor="middle">권한 한 건을 만들어 access_list 에 추가한다</text>
<text x="360" y="464" font-size="14" fill="#292929" text-anchor="middle">(source: 「예외 N번」, 만료 시각 expires 도 적는다)</text>
<line x1="360" y1="478" x2="360" y2="502" stroke="#666660" stroke-width="1.6" marker-end="url(#a-f01-0602)"/>
<text x="370" y="496" font-size="14" fill="#666660">예외를 모두 꺼낸 뒤</text>
<rect x="100" y="504" width="520" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="527" font-size="14" fill="#292929" text-anchor="middle">access_list 를 리턴한다</text>
<text x="360" y="546" font-size="14" fill="#292929" text-anchor="middle">(역할로 받은 권한 + 예외로 받은 권한)</text>
</svg>
