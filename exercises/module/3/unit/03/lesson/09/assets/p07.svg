<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>도전 3-3 보고서: 회수 대상·제외 건수, 다미의 SALES:QUERY, 기간 없는 제외 리스트를 채운다</title><desc>보고서 도전 3-3 칸에서 채울 항목이다. (가)는 출력 전체와 회수 대상·회수 제외 건수, 제외된 후보와 이유다. 핵심 질문 (나)는 다미의 SALES:QUERY 를 제외하지 않게 만든 이유와 위험, (다)는 기간 키가 없는 제외 리스트의 문제와 확인하는 사람이다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">도전 3-3 · 회수 제외 권한 가려내기</text>
<rect x="590" y="12" width="110" height="28" rx="14" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="645" y="31" font-size="14" fill="#9a6200" text-anchor="middle" font-weight="700">도전(선택)</text>
<rect x="20" y="52" width="680" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="75" font-size="15" fill="#292929" font-weight="700">(가) 출력 전체와 회수 대상 · 회수 제외</text>
<rect x="40" y="98" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="113" font-size="15" fill="#292929">① 출력 전체(코드 상자에 붙여 넣기)</text>
<rect x="40" y="128" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="143" font-size="15" fill="#292929">② 회수 대상과 회수 제외 건수</text>
<rect x="40" y="158" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="173" font-size="15" fill="#292929">③ 회수 제외된 후보와 제외한 이유</text>
<rect x="20" y="194" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="217" font-size="15" fill="#292929" font-weight="700">(나) [핵심 질문] 다미의 SALES:QUERY 가 회수 대상으로 남은 까닭</text>
<rect x="40" y="240" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="255" font-size="15" fill="#292929">① 제외하지 않게 만든 이유</text>
<rect x="40" y="270" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="285" font-size="15" fill="#292929">② 제외했다면 생길 수 있는 위험</text>
<rect x="20" y="306" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="329" font-size="15" fill="#292929" font-weight="700">(다) [핵심 질문] 기간 키가 없는 제외 리스트</text>
<rect x="40" y="352" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="367" font-size="15" fill="#292929">① 아무도 다시 확인하지 않으면 생기는 문제</text>
<rect x="40" y="382" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="397" font-size="15" fill="#292929">② 추가할 때 확인하는 사람과 그 이유</text>
</g>
</svg>
