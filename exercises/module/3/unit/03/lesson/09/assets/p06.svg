<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>도전 3-2 보고서: 출력과 후보 건수, 이유가 둘인 후보, 후보만 담는 방식을 채운다</title><desc>보고서 도전 3-2 칸에서 채울 항목이다. (가)는 출력 전체와 후보 건수, 이유가 둘인 후보 건수, 후보가 아닌 권한이다. 핵심 질문 (나)는 이유가 둘인 후보와 reasons 리스트의 장점, (다)는 후보만 담는 방식과 모두 담는 방식의 비교다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">도전 3-2 · 점검 결과 한 장 리포트로 합치기</text>
<rect x="590" y="12" width="110" height="28" rx="14" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="645" y="31" font-size="14" fill="#9a6200" text-anchor="middle" font-weight="700">도전(선택)</text>
<rect x="20" y="52" width="680" height="36" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="75" font-size="15" fill="#292929" font-weight="700">(가) 출력 전체와 후보 건수</text>
<rect x="40" y="98" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="113" font-size="15" fill="#292929">① 출력 전체(코드 상자에 붙여 넣기)</text>
<rect x="40" y="128" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="143" font-size="15" fill="#292929">② 후보 건수   ③ 이유가 둘인 후보 건수</text>
<rect x="40" y="158" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="173" font-size="15" fill="#292929">④ 후보가 아닌 권한</text>
<rect x="20" y="194" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="217" font-size="15" fill="#292929" font-weight="700">(나) [핵심 질문] 이유가 둘인 후보</text>
<rect x="40" y="240" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="255" font-size="15" fill="#292929">① 고른 후보와 두 이유</text>
<rect x="40" y="270" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="285" font-size="15" fill="#292929">② 처리 순서를 정하는 데 주는 도움</text>
<rect x="40" y="300" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="315" font-size="15" fill="#292929">③ 이유를 리스트(reasons)로 담는 장점</text>
<rect x="20" y="336" width="680" height="36" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="32" y="359" font-size="15" fill="#292929" font-weight="700">(다) [핵심 질문] 후보만 담기와 모두 담기</text>
<rect x="40" y="382" width="18" height="18" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="70" y="397" font-size="15" fill="#292929">① 담당자에게 어느 쪽이 나은지   ② 그 이유</text>
</g>
</svg>
