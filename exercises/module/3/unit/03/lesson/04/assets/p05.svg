<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>실습 3-2 정리: 키 만들기, 시각 찾기, None 확인, 기준 비교, 후보 추가 순서</title><desc>find_unused 본문은 키 문자열을 만들고 get 으로 마지막 사용 시각을 찾는다. None 이면 후보, 아니면 days_since 가 기준을 넘을 때 후보로 만들어 unused 에 추가한다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 3-2 정리</text>
<rect x="20" y="52" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="78.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1. 키 문자열</text>
<rect x="230" y="52" width="470" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="465" y="78.25" font-size="15" fill="#292929" text-anchor="middle">key = f"{user}:{permission}"</text>
<rect x="20" y="104" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="130.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2. 마지막 사용 시각</text>
<rect x="230" y="104" width="470" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="465" y="130.25" font-size="15" fill="#292929" text-anchor="middle">used_text = last_used_map.get(key)</text>
<rect x="20" y="156" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="182.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3. 이력이 없는지</text>
<rect x="230" y="156" width="470" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="465" y="182.25" font-size="15" fill="#292929" text-anchor="middle">if used_text is None:</text>
<rect x="20" y="208" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="234.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4. 기준을 넘었는지</text>
<rect x="230" y="208" width="470" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="465" y="234.25" font-size="15" fill="#292929" text-anchor="middle">elif days_since(used_text, now) &gt; limit_days:</text>
<rect x="20" y="260" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="286.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">5. 후보 만들기</text>
<rect x="230" y="260" width="470" height="42" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="465" y="286.25" font-size="15" fill="#292929" text-anchor="middle">unused_entry = make_unused(entry, used_text)</text>
<rect x="20" y="312" width="190" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="338.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">6. 후보에 추가</text>
<rect x="230" y="312" width="470" height="42" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="465" y="338.25" font-size="15" fill="#292929" text-anchor="middle">unused.append(unused_entry)</text>
</g>
</svg>
