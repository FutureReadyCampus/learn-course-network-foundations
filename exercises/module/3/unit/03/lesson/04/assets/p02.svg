<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>규칙에 안 걸려도 오래 안 쓴 권한은 과다권한 후보이고, 이번에는 찾기만 한다</title><desc>퇴사·만료 규칙으로 걸러도 일이 끝나 안 쓰는 권한이 남는다. 마지막으로 쓴 시각을 보면 이런 권한을 찾을 수 있고, 이번 실습은 찾기까지만 하며 회수는 Unit 4에서 한다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">왜 안 쓰는 권한을 찾아야 하는가</text>
<rect x="20" y="80" width="200" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="113.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1. 규칙을 통과한 권한</text>
<text x="120" y="134.75" font-size="14" fill="#666660" text-anchor="middle">퇴사 · 만료에 안 걸림</text>
<text x="120" y="155.75" font-size="14" fill="#666660" text-anchor="middle">일이 끝나 안 쓰는</text>
<text x="120" y="176.75" font-size="14" fill="#666660" text-anchor="middle">권한이 남아 있다</text>
<line x1="224" y1="140.0" x2="254" y2="140.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="260" y="80" width="200" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="360" y="113.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2. 마지막으로 쓴 시각</text>
<text x="360" y="134.75" font-size="14" fill="#666660" text-anchor="middle">권한은 있는데</text>
<text x="360" y="155.75" font-size="14" fill="#666660" text-anchor="middle">오래 쓴 이력이 없으면</text>
<text x="360" y="176.75" font-size="14" fill="#666660" text-anchor="middle">과다권한 후보</text>
<line x1="464" y1="140.0" x2="494" y2="140.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="500" y="80" width="200" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="600" y="124.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3. 찾기만 한다</text>
<text x="600" y="145.25" font-size="14" fill="#666660" text-anchor="middle">후보 목록까지만</text>
<text x="600" y="166.25" font-size="14" fill="#666660" text-anchor="middle">회수는 Unit 4</text>
<rect x="110" y="226" width="500" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="360" y="256.25" font-size="15" fill="#292929" text-anchor="middle">계정을 빼앗기면 쓰지 않는 권한도 공격자가 쓸 수 있다</text>
</g>
</svg>
