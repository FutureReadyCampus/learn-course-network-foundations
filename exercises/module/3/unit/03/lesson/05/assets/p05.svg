<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>도전 3-1 정리: get 으로 꺼내고, 퇴사·만료 규칙을 거쳐, 복사본에 이유를 적는다</title>
<desc>없을 수도 있는 expires 는 entry.get 으로 꺼냅니다. employed 가 False 면 퇴사한 계정, 아니고 expires 가 있으며 지금과 같거나 지났으면 만료된 예외입니다. 걸린 권한은 복사해 reason 을 적습니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">도전 3-1 정리</text>
<rect x="20" y="52" width="320" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180" y="97.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">① 없을 수도 있는 키</text>
<text x="180" y="117.512" font-size="14" fill="#292929" text-anchor="middle">expires = entry.get("expires")</text>
<rect x="380" y="52" width="320" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="87.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">② 퇴사 규칙</text>
<text x="540" y="107.712" font-size="14" fill="#292929" text-anchor="middle">if not entry["employed"]:</text>
<text x="540" y="127.312" font-size="14" fill="#292929" text-anchor="middle">reason = "퇴사한 계정"</text>
<rect x="20" y="172" width="320" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180" y="207.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">③ 예외 만료 규칙</text>
<text x="180" y="227.712" font-size="14" fill="#292929" text-anchor="middle">elif expires is not None:</text>
<text x="180" y="247.312" font-size="14" fill="#292929" text-anchor="middle">expires_at &lt;= now</text>
<rect x="380" y="172" width="320" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="207.328" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">④ 걸린 권한에 이유</text>
<text x="540" y="227.712" font-size="14" fill="#292929" text-anchor="middle">stale_entry = entry.copy()</text>
<text x="540" y="247.312" font-size="14" fill="#292929" text-anchor="middle">stale_entry["reason"] = reason</text>
<polyline points="340,102 376,102" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="340,222 376,222" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="540,152 540,162 180,162 180,169" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
</g>
</svg>
