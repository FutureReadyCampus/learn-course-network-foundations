<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>따로 나온 두 리스트를 맞춰 보는 대신 후보 한 건에 이유를 모아 한 장으로 본다</title><desc>전에는 규칙 결과와 미사용 결과에서 같은 권한을 담당자가 직접 맞춰 봐야 했다. 합치면 후보 한 건에 이유가 모이고, 리포트는 전체 현황에 두 점검을 따로 돌린 결과다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">왜 점검 결과를 한 장으로 합치는가</text>
<text x="180" y="70" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">전: 두 리스트</text>
<text x="540" y="70" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">후: 리포트 한 장</text>
<rect x="20" y="86" width="150" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="120.9" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">규칙 결과</text>
<text x="95" y="140.9" font-size="14" fill="#292929" text-anchor="middle">junho</text>
<text x="95" y="160.9" font-size="14" fill="#292929" text-anchor="middle">SALES:CHANGE</text>
<text x="95" y="180.9" font-size="14" fill="#666660" text-anchor="middle">만료된 예외</text>
<rect x="190" y="86" width="150" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="265" y="120.9" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">미사용 결과</text>
<text x="265" y="140.9" font-size="14" fill="#292929" text-anchor="middle">junho</text>
<text x="265" y="160.9" font-size="14" fill="#292929" text-anchor="middle">SALES:CHANGE</text>
<text x="265" y="180.9" font-size="14" fill="#666660" text-anchor="middle">90일 넘게 안 씀</text>
<text x="180" y="230" font-size="14" fill="#666660" text-anchor="middle">같은 권한인지 사람이 맞춰 봐야 한다</text>
<line x1="346" y1="146" x2="374" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="86" width="320" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="392" y="120.9" font-size="14" fill="#292929" font-weight="700">후보 한 건: junho SALES:CHANGE</text>
<text x="392" y="140.9" font-size="14" fill="#292929">reasons = [</text>
<text x="392" y="160.9" font-size="14" fill="#292929">  "만료된 예외",</text>
<text x="392" y="180.9" font-size="14" fill="#292929">  "90일 넘게 안 씀(이력 없음 포함)" ]</text>
<text x="540" y="230" font-size="14" fill="#666660" text-anchor="middle">이유가 권한 한 건에 모인다</text>
<rect x="20" y="258" width="680" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="2"/>
<text x="360" y="290.75" font-size="15" fill="#292929" text-anchor="middle">이번에는 전체 현황에 두 점검을 따로 돌린다</text>
<text x="360" y="311.75" font-size="14" fill="#666660" text-anchor="middle">그래서 한 권한이 두 이유에 모두 걸릴 수 있고, 안 쓴 권한도 실습 3-2보다 많다</text>
</g>
</svg>
