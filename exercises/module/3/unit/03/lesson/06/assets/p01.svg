<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"><title>규칙 결과와 미사용 결과를 권한마다 이유를 모은 리포트 한 장으로 합친다</title><desc>규칙에 걸린 권한 리스트와 90일 넘게 안 쓴 권한 리스트가 따로 나온다. generate_report 가 두 결과를 합쳐, 후보 권한마다 걸린 이유를 모은 리포트 딕셔너리 하나를 만든다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">응용 3-2 · 무엇을 만드는가</text>
<rect x="20" y="66" width="190" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="95.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">stale</text>
<text x="115" y="116.75" font-size="14" fill="#666660" text-anchor="middle">규칙에 걸린 권한</text>
<rect x="20" y="160" width="190" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="189.75" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">unused</text>
<text x="115" y="210.75" font-size="14" fill="#666660" text-anchor="middle">90일 넘게 안 쓴 권한</text>
<rect x="260" y="104" width="180" height="88" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="2"/>
<text x="350" y="132.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">generate_report</text>
<text x="350" y="153.25" font-size="14" fill="#666660" text-anchor="middle">권한마다</text>
<text x="350" y="174.25" font-size="14" fill="#666660" text-anchor="middle">이유를 모은다</text>
<line x1="214" y1="101" x2="256" y2="132" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="214" y1="195" x2="256" y2="164" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="490" y="70" width="210" height="160" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="2"/>
<text x="595" y="113.25" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">리포트 한 장</text>
<text x="595" y="134.25" font-size="14" fill="#666660" text-anchor="middle">= 딕셔너리 하나</text>
<text x="595" y="155.25" font-size="15" fill="#292929" text-anchor="middle">generated_at</text>
<text x="595" y="176.25" font-size="15" fill="#292929" text-anchor="middle">total · finding_count</text>
<text x="595" y="197.25" font-size="15" fill="#292929" text-anchor="middle">findings + reasons</text>
<line x1="444" y1="148" x2="486" y2="148" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="20" y="284" font-size="15" fill="#666660">같은 권한이 두 리스트에 모두 있으면 후보 한 건에 이유 두 개가 붙는다</text>
</g>
</svg>
