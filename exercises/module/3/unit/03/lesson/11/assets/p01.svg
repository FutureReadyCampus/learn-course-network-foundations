<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>마무리 순서: 확인, ls, cd .., git status, 보고서 마무리, add·commit·push, 브라우저 확인</title><desc>오늘 한 일과 파일을 확인하고 cd .. 로 network-study-notes 폴더로 옮겨 git status 를 본다. 보고서 마무리 (가)를 채운 뒤 git add, commit, push 로 올리고 브라우저에서 확인한다. git status 에 .env 나 .venv 가 보이면 멈추고 .gitignore 에 그 이름을 적는다(__pycache__/ 는 보통 이미 적혀 있다).</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">이번 Unit 마무리 · 깃허브에 올리기</text>
<rect x="20" y="52" width="150" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="81" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">① 오늘 한 일</text>
<text x="95" y="104" font-size="14" fill="#666660" text-anchor="middle">체크리스트 확인</text>
<rect x="196" y="52" width="150" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="271" y="81" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">② 파일 확인</text>
<text x="271" y="104" font-size="14" fill="#666660" text-anchor="middle">ls · ls config</text>
<rect x="372" y="52" width="150" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="447" y="81" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">③ 위로 옮기기</text>
<text x="447" y="104" font-size="14" fill="#292929" text-anchor="middle">cd .. · pwd</text>
<rect x="548" y="52" width="152" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="624" y="81" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">④ git status</text>
<text x="624" y="104" font-size="14" fill="#292929" text-anchor="middle">바뀐 파일 보기</text>
<rect x="548" y="160" width="152" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="624" y="189" font-size="15" fill="#9a6200" text-anchor="middle" font-weight="700">⑤ 보고서</text>
<text x="624" y="212" font-size="14" fill="#292929" text-anchor="middle">마무리 (가) 채우기</text>
<rect x="372" y="160" width="150" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="447" y="189" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">⑥ 올리기</text>
<text x="447" y="212" font-size="14" fill="#292929" text-anchor="middle">add · commit · push</text>
<rect x="196" y="160" width="150" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="271" y="189" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">⑦ 브라우저</text>
<text x="271" y="212" font-size="14" fill="#292929" text-anchor="middle">파일이 다 있나</text>
<polyline points="170,87 192,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<polyline points="346,87 368,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<polyline points="522,87 544,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<polyline points="624,122 624,156" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<polyline points="548,195 526,195" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<polyline points="372,195 350,195" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="20" y="262" width="680" height="78" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="2"/>
<text x="40" y="290" font-size="15" fill="#292929" font-weight="700">④ 에서 빨간 목록에 .env · .venv 가 보이면 올리지 않고 멈춘다</text>
<text x="40" y="318" font-size="15" fill="#292929">.gitignore 맨 아래에 보인 이름을 한 줄씩 적고 저장 · git status 다시</text>
</g>
</svg>
