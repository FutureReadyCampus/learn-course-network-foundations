<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>access_control 폴더에 Unit 1~3 파일과 config 세 파일이 있는지 확인한다</title>
<desc>access_control 폴더에 rbac.py, exception_policy.py, config_loader.py, policy.py 와 config 폴더의 users.json, roles.json, exceptions.json 이 있어야 합니다. 확인 명령 마지막 줄이 이전 파일 정상 6 5 5 이면 됩니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" font-weight="700">터미널에서 확인할 폴더 모양</text>
<text x="30" y="72" font-size="16" fill="#292929" font-weight="700">access_control/</text>
<polyline points="44,76 44,99 62,99" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="104" font-size="15" fill="#292929">rbac.py</text>
<text x="250" y="104" font-size="14" fill="#666660">Unit 1</text>
<polyline points="44,99 44,131 62,131" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="136" font-size="15" fill="#292929">exception_policy.py</text>
<text x="250" y="136" font-size="14" fill="#666660">Unit 1</text>
<polyline points="44,131 44,163 62,163" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="168" font-size="15" fill="#292929">config_loader.py</text>
<text x="250" y="168" font-size="14" fill="#666660">Unit 1</text>
<polyline points="44,163 44,195 62,195" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="200" font-size="15" fill="#292929">policy.py</text>
<polyline points="44,195 44,227 62,227" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="232" font-size="15" fill="#292929" font-weight="700">config/</text>
<polyline points="84,238 84,259 102,259" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="110" y="264" font-size="15" fill="#292929">users.json</text>
<polyline points="84,259 84,291 102,291" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="110" y="296" font-size="15" fill="#292929">roles.json</text>
<polyline points="84,291 84,323 102,323" fill="none" stroke="#666660" stroke-width="1.5"/>
<text x="110" y="328" font-size="15" fill="#292929">exceptions.json</text>
<rect x="380" y="52" width="320" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="82.128" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">pwd 결과의 끝</text>
<text x="540" y="102.512" font-size="14" fill="#292929" text-anchor="middle">…/access_control</text>
<rect x="380" y="142" width="320" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="175.328" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">확인 명령의 마지막 줄</text>
<text x="540" y="195.712" font-size="14" fill="#292929" text-anchor="middle">이전 파일 정상 6 5 5</text>
<text x="540" y="215.312" font-size="14" fill="#666660" text-anchor="middle">사용자 6 · 역할 5 · 예외 5</text>
<rect x="380" y="258" width="320" height="84" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="283.928" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">다르면</text>
<text x="540" y="305.32" font-size="15" fill="#292929" text-anchor="middle">Unit 1~3 코드 상자로</text>
<text x="540" y="326.32" font-size="15" fill="#292929" text-anchor="middle">access_control 에 다시 만들기</text>
</g>
