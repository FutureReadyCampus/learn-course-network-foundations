<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>알림 처리 다섯 단계와, 한 알림의 오류를 그 알림에 가두는 오류 격리</title><desc>알림은 플레이북 찾기, 조치 요청, 승인 게이트, 조치 실행, 티켓 순서로 처리됩니다. run_all 은 try / except Exception as error 로 오류 난 알림만 실패로 기록하고 다음 알림으로 넘어갑니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">알림 처리 순서와 오류 격리</text>
<text x="20" y="62" font-size="16" fill="#292929" font-weight="700">알림 한 건의 처리 순서</text>
<rect x="20" y="75" width="330" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="34" y="105" font-size="15" fill="#292929" font-weight="700">1. 플레이북 찾기</text>
<text x="336" y="105" font-size="14" fill="#666660" text-anchor="end">match_playbooks</text>
<line x1="185" y1="125" x2="185" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="137" width="330" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="34" y="167" font-size="15" fill="#292929" font-weight="700">2. 조치 요청</text>
<text x="336" y="167" font-size="14" fill="#666660" text-anchor="end">make_request</text>
<line x1="185" y1="187" x2="185" y2="197" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="199" width="330" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="34" y="229" font-size="15" fill="#292929" font-weight="700">3. 승인 게이트</text>
<text x="336" y="229" font-size="14" fill="#666660" text-anchor="end">decide_gate</text>
<line x1="185" y1="249" x2="185" y2="259" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="261" width="330" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="34" y="291" font-size="15" fill="#292929" font-weight="700">4. 조치 실행</text>
<text x="336" y="291" font-size="14" fill="#666660" text-anchor="end">execute_action</text>
<line x1="185" y1="311" x2="185" y2="321" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="323" width="330" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="34" y="353" font-size="15" fill="#292929" font-weight="700">5. 티켓</text>
<text x="336" y="353" font-size="14" fill="#666660" text-anchor="end">open_ticket</text>
<text x="20" y="400" font-size="15" fill="#666660">자동으로 정해진 조치만 실행합니다.</text>
<text x="380" y="62" font-size="16" fill="#292929" font-weight="700">6. 오류 격리 (run_all)</text>
<rect x="380" y="75" width="320" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="394" y="105" font-size="15" fill="#292929" font-weight="700">INC-401</text>
<text x="686" y="105" font-size="15" fill="#292929" text-anchor="end">처리</text>
<line x1="540" y1="125" x2="540" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="137" width="320" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="394" y="167" font-size="15" fill="#292929" font-weight="700">INC-402</text>
<text x="686" y="167" font-size="15" fill="#292929" text-anchor="end">오류 → 실패 기록</text>
<line x1="540" y1="187" x2="540" y2="197" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="199" width="320" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="394" y="229" font-size="15" fill="#292929" font-weight="700">INC-403</text>
<text x="686" y="229" font-size="15" fill="#292929" text-anchor="end">계속 처리</text>
<line x1="540" y1="249" x2="540" y2="259" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="261" width="320" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="394" y="291" font-size="15" fill="#292929" font-weight="700">INC-408 까지</text>
<text x="686" y="291" font-size="15" fill="#292929" text-anchor="end">계속 처리</text>
<rect x="380" y="330" width="320" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="540.0" y="353" font-size="14" fill="#292929" text-anchor="middle">except Exception as error:</text>
<text x="540.0" y="373" font-size="15" fill="#292929" text-anchor="middle">어떤 오류든 받고</text>
<text x="540.0" y="395" font-size="15" fill="#292929" text-anchor="middle">오류 이름을 기록</text>
</g></svg>
