<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>오류가 나면: 오류 이름을 보고 확인할 곳과 고칠 방법을 찾는다</title><desc>No module named 은 파일이 폴더에 없는 것, FileNotFoundError 는 적힌 경로에 파일이 없는 것, JSONDecodeError 는 쉼표나 괄호 문제입니다. 그래도 막히면 AI 에게 묻고, 정답을 보고, 모름 — 막힌 곳을 씁니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">오류가 나면</text>
<text x="20" y="62" font-size="15" fill="#666660" font-weight="700">증상</text>
<text x="270" y="62" font-size="15" fill="#666660" font-weight="700">확인</text>
<text x="490" y="62" font-size="15" fill="#666660" font-weight="700">고치기</text>
<rect x="20" y="75" width="220" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="106" font-size="15" fill="#292929" text-anchor="middle">No module named</text>
<line x1="242" y1="101" x2="266" y2="101" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="270" y="75" width="190" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365.0" y="106" font-size="15" fill="#292929" text-anchor="middle">그 파일이 폴더에 없음</text>
<line x1="462" y1="101" x2="486" y2="101" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="490" y="75" width="210" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="106" font-size="15" fill="#292929" text-anchor="middle">코드 상자로 만들기</text>
<rect x="20" y="141" width="220" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="172" font-size="15" fill="#292929" text-anchor="middle">FileNotFoundError</text>
<line x1="242" y1="167" x2="266" y2="167" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="270" y="141" width="190" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365.0" y="172" font-size="15" fill="#292929" text-anchor="middle">ls · ls config</text>
<line x1="462" y1="167" x2="486" y2="167" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="490" y="141" width="210" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="172" font-size="15" fill="#292929" text-anchor="middle">코드 상자로 만들기</text>
<rect x="20" y="207" width="220" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="238" font-size="15" fill="#292929" text-anchor="middle">JSONDecodeError</text>
<line x1="242" y1="233" x2="266" y2="233" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="270" y="207" width="190" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365.0" y="238" font-size="15" fill="#292929" text-anchor="middle">line 숫자 근처</text>
<line x1="462" y1="233" x2="486" y2="233" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="490" y="207" width="210" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="238" font-size="15" fill="#292929" text-anchor="middle">지우고 다시 붙여 넣기</text>
<text x="20" y="300" font-size="16" fill="#292929" font-weight="700">그래도 막히면</text>
<rect x="20" y="314" width="214" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="127.0" y="344" font-size="15" fill="#292929" text-anchor="middle">AI 에게 묻기</text>
