<rect x="253" y="314" width="214" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="344" font-size="15" fill="#292929" text-anchor="middle">정답 보기</text>
<line x1="469" y1="339" x2="484" y2="339" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="486" y="314" width="214" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="593.0" y="344" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
<text x="20" y="400" font-size="15" fill="#666660">pwd 가 soar_response 로 끝나는지 먼저 봅니다. 실행은 터미널에서.</text>
</g></svg>
