<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img">
<title>보고서 쓰는 법 여섯 가지 체크리스트</title>
<desc>문제마다 질문에 답하고, 쓸 내용을 보고 답 뒤에 쓰며, 출력은 코드 상자에 붙여 넣습니다. 왜를 묻는 질문은 내 값을 근거로 쓰고, 모르면 「모름 — 막힌 곳: …」이라고 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p01r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p01g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">보고서 쓰는 법</tspan></text>
<rect x="20" y="52" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="67" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="82" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">문제를 풀 때마다 그 문제 제목 아래 질문에 답한다</tspan></text>
<rect x="20" y="110" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="125" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="140" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">「쓸 내용:」을 보고 그대로 「답:」 뒤에 쓴다</tspan></text>
<rect x="20" y="168" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="183" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="198" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙여 넣는다</tspan></text>
<rect x="20" y="226" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="241" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="256" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">「왜」는 내 화면의 값이나 배운 내용을 근거로 이유까지</tspan></text>
<rect x="20" y="284" width="680" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<rect x="36" y="299" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="314" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">[핵심 질문] = 이 실습에서 꼭 알아야 할 질문</tspan></text>
<rect x="20" y="342" width="680" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="36" y="357" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="70" y="372" font-size="15" text-anchor="start" fill="#292929"><tspan x="70">답을 못 찾으면 「모름 — 막힌 곳: …」이라고 쓴다</tspan></text>
</g>
</svg>
