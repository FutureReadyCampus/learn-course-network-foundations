<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>공개 전 점검: 비밀키 · 개인정보 · 실명 · 머리말 네 가지를 본다</title><desc>git push 로 올리기 전에 글과 soar_response 파일에 비밀키나 .env 내용이 없는지, 개인정보와 실제 이름이 없는지, 머리말이 module 5, unit 5 이고 sample: true 가 없는지 봅니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">공개 전 점검 → 모두 없으면 git push</text><rect x="20" y="56" width="680" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="34" y="86.2" font-size="15" text-anchor="start" fill="#292929">□  비밀키 · 토큰 · .env 내용이 없다</text><rect x="20" y="118" width="680" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="34" y="148.2" font-size="15" text-anchor="start" fill="#292929">□  이메일 · 전화번호 같은 개인정보가 없다</text><rect x="20" y="180" width="680" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="34" y="210.2" font-size="15" text-anchor="start" fill="#292929">□  실제 사람의 이름(실명)이 없다</text><rect x="20" y="242" width="680" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="34" y="272.2" font-size="15" text-anchor="start" fill="#292929">□  머리말 module: 5 · unit: 5 · sample: true 없음</text></svg>
