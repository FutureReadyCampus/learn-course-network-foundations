<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>정책 위반 점검 글을 올리고 전체 글 목록에서 열기</title><desc>_posts 폴더에 글을 만들고 제목과 날짜를 적습니다. 정책 위반 점검에서 확인한 내용을 저장해 올린 뒤, 전체 글 목록에서 제목을 눌러 본문을 확인합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">글 틀로 쓰고 올리기</text><rect x="20" y="60" width="214" height="96" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="127.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">① 글 틀 고르기</text><text x="127.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">short(기본) · stuck · practice</text><line x1="236" y1="108" x2="249" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="253" y="60" width="214" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">② _posts 새 파일</text><text x="360.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">2026-11-20-m5-u5-…md</text><line x1="469" y1="108" x2="482" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="486" y="60" width="214" height="96" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="593.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ 머리말</text><text x="593.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">제목과 작성일</text><rect x="20" y="190" width="214" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="127.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">④ 코드 위치 적기</text><text x="127.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">soar_response/soar_engine.py</text><line x1="236" y1="238" x2="249" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="253" y="190" width="214" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">⑤ 점검 뒤 git push</text><text x="360.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">add · commit · push</text><line x1="469" y1="238" x2="482" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="486" y="190" width="214" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="593.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">⑥ 첫 화면 확인</text><text x="593.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">전체 글에서 제목 열기</text><line x1="587" y1="158" x2="140" y2="186" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><text x="20" y="322" font-size="15" text-anchor="start" fill="#666660">보이지 않으면 시작하기의 「첫 화면 확인하고 막힐 때」를 본다 · 긴 글(practice)은 응용</text></svg>
