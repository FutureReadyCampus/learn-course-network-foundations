<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>글 틀을 고르고 VS Code 에서 _posts 에 module 5 · unit 5 머리말로 글을 만든다</title><desc>기본 글 틀은 post-short(세 문장)이고 긴 글 post-practice 는 응용입니다. 글 틀을 고른 뒤 _posts 폴더에 날짜와 영문 제목으로 파일을 만들고, 머리말을 module 5, unit 5 로 고칩니다. 코드는 옮기지 않고 soar_response 폴더의 위치만 글에 적습니다. 공개 전 점검 뒤 git push 로 올리고 첫 화면의 Module 5 · 5번 칸을 확인합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">글 틀로 쓰고 올리기</text><rect x="20" y="60" width="214" height="96" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="127.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">① 글 틀 고르기</text><text x="127.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">short(기본) · stuck · practice</text><line x1="236" y1="108" x2="249" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="253" y="60" width="214" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">② _posts 새 파일</text><text x="360.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">2026-11-20-m5-u5-…md</text><line x1="469" y1="108" x2="482" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="486" y="60" width="214" height="96" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="593.0" y="103.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">③ 머리말</text><text x="593.0" y="122.7" font-size="14" text-anchor="middle" fill="#666660">module: 5 · unit: 5</text><rect x="20" y="190" width="214" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="127.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">④ 코드 위치 적기</text><text x="127.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">soar_response/soar_engine.py</text><line x1="236" y1="238" x2="249" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="253" y="190" width="214" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">⑤ 점검 뒤 git push</text><text x="360.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">add · commit · push</text><line x1="469" y1="238" x2="482" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="486" y="190" width="214" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="593.0" y="233.1" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">⑥ 첫 화면 확인</text><text x="593.0" y="252.7" font-size="14" text-anchor="middle" fill="#666660">Module 5 · 5번 칸</text><line x1="587" y1="158" x2="140" y2="186" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><text x="20" y="322" font-size="15" text-anchor="start" fill="#666660">보이지 않으면 시작하기의 「첫 화면 확인하고 막힐 때」를 본다 · 긴 글(practice)은 응용</text></svg>
