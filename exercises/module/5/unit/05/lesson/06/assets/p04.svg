<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>도전 5-1 정답: 탐지 결과를 모양 점검으로 걸러 엔진에 넣고 운영 요약을 만든다</title>
<desc>Module 4 탐지 결과 5건을 find_schema_problem 으로 점검해 알림 5건(거절 0건)으로 바꿉니다. 시험 기록 hana 는 필수 키 없음: grade, minsu 는 알 수 없는 등급: critical 로 거절됩니다. run_all 과 summarize 를 거치면 자동 실행 2건 · 조치 없음 3건 · 실패 0건, 티켓 5건이 나옵니다.</desc>
