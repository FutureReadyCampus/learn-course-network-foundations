<text x="185.0" y="319.8" font-size="15" fill="#292929" text-anchor="middle">회고 문서</text>
<text x="185.0" y="340.8" font-size="15" fill="#292929" text-anchor="middle">unit10_final_retrospective.md</text>
<rect x="370" y="290" width="330" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535.0" y="319.8" font-size="15" fill="#292929" text-anchor="middle">깃허브에 올리기</text>
