<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>엔진 로그 세 개를 점검 네 가지로 살펴 PASS·FAIL 표와 회고 문서를 만든다</title>
<desc>입력은 엔진 로그 세 개(engine_log.json 8건, risk_engine_log.json 5건, gate_off_log.json 5건)입니다. policy_check.py 가 로그마다 점검 네 가지를 실행해 점검 12개의 PASS·FAIL 표를 만들고, FAIL 2개는 모두 gate_off_log.json 에서 나옵니다. 끝나면 회고 문서를 쓰고 깃허브에 올립니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="bold">실습 5-2 목표: 로그로 정책이 지켜졌는지 확인하기</text>
<text x="20" y="62" font-size="15" fill="#666660" text-anchor="start">입력 (엔진 로그 3개)</text>
<rect x="20" y="74" width="230" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="96.8" font-size="15" fill="#292929" text-anchor="middle">engine_log.json</text>
<text x="135.0" y="117.8" font-size="15" fill="#292929" text-anchor="middle">실습 5-1 · 8건</text>
<rect x="20" y="140" width="230" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="162.8" font-size="15" fill="#292929" text-anchor="middle">risk_engine_log.json</text>
<text x="135.0" y="183.8" font-size="15" fill="#292929" text-anchor="middle">도전 5-1 · 5건</text>
<rect x="20" y="206" width="230" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="135.0" y="228.8" font-size="15" fill="#292929" text-anchor="middle">gate_off_log.json</text>
<text x="135.0" y="249.8" font-size="15" fill="#292929" text-anchor="middle">게이트 끔 · 5건</text>
<text x="275" y="62" font-size="15" fill="#666660" text-anchor="start">프로그램</text>
<rect x="275" y="74" width="190" height="188" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="287" y="131.4" font-size="16" fill="#292929" text-anchor="start" font-weight="bold">policy_check.py</text>
<text x="287" y="152.9" font-size="15" fill="#292929" text-anchor="start">① 게이트 우회 실행</text>
<text x="287" y="173.9" font-size="15" fill="#292929" text-anchor="start">② 허용 목록 IP 차단</text>
<text x="287" y="194.9" font-size="15" fill="#292929" text-anchor="start">③ VIP 계정 잠금</text>
<text x="287" y="215.9" font-size="15" fill="#292929" text-anchor="start">④ 티켓 없는 조치</text>
<line x1="252" y1="102" x2="272" y2="102" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="252" y1="168" x2="272" y2="168" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="252" y1="234" x2="272" y2="234" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="467" y1="168" x2="505" y2="168" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="510" y="62" font-size="15" fill="#666660" text-anchor="start">출력</text>
<rect x="510" y="74" width="190" height="188" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605.0" y="131.4" font-size="16" fill="#292929" text-anchor="middle" font-weight="bold">PASS · FAIL 표</text>
<text x="605.0" y="152.9" font-size="15" fill="#292929" text-anchor="middle">로그마다 4줄 × 3</text>
<text x="605.0" y="173.9" font-size="15" fill="#292929" text-anchor="middle">= 점검 12개</text>
<text x="605.0" y="194.9" font-size="15" fill="#292929" text-anchor="middle">FAIL 2개</text>
<text x="605.0" y="215.9" font-size="15" fill="#292929" text-anchor="middle">(모두 gate_off_log)</text>
