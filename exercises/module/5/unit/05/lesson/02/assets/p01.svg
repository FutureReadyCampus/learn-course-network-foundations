<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>알림 8건을 통합 엔진으로 처리해 결과 다섯 가지와 티켓 7장을 남긴다</title><desc>engine_alerts.json 의 알림 8건이 soar_engine.py 에서 플레이북 찾기, 승인 게이트, 조치 실행, 티켓 순서로 처리됩니다. 결과는 자동 실행 2, 승인 대기 2, 차단 금지 1, 조치 없음 2, 실패 1이고 티켓은 7장입니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 5-1 · 무엇을 만드나</text>
<rect x="20" y="60" width="170" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="105.0" y="93" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">입력</text>
<text x="105.0" y="116" font-size="15" fill="#292929" text-anchor="middle">engine_alerts</text>
<text x="105.0" y="138" font-size="15" fill="#292929" text-anchor="middle">.json</text>
<text x="105.0" y="159" font-size="15" fill="#292929" text-anchor="middle">알림 8건</text>
<rect x="230" y="60" width="220" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="340.0" y="93" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">통합 엔진</text>
<text x="340.0" y="116" font-size="15" fill="#292929" text-anchor="middle">플레이북 → 승인 게이트</text>
<text x="340.0" y="138" font-size="15" fill="#292929" text-anchor="middle">→ 조치 실행 → 티켓</text>
<text x="340.0" y="160" font-size="14" fill="#666660" text-anchor="middle">soar_engine.py</text>
<line x1="192" y1="120" x2="226" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="500" y="50" width="200" height="26" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="512" y="69" font-size="15" fill="#292929">자동 실행</text>
<text x="688" y="69" font-size="15" fill="#292929" text-anchor="end" font-weight="700">2건</text>
<rect x="500" y="80" width="200" height="26" rx="4" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="512" y="99" font-size="15" fill="#292929">승인 대기</text>
<text x="688" y="99" font-size="15" fill="#292929" text-anchor="end" font-weight="700">2건</text>
<rect x="500" y="110" width="200" height="26" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="512" y="129" font-size="15" fill="#292929">차단 금지</text>
<text x="688" y="129" font-size="15" fill="#292929" text-anchor="end" font-weight="700">1건</text>
<rect x="500" y="140" width="200" height="26" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="512" y="159" font-size="15" fill="#292929">조치 없음</text>
<text x="688" y="159" font-size="15" fill="#292929" text-anchor="end" font-weight="700">2건</text>
<rect x="500" y="170" width="200" height="26" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="512" y="189" font-size="15" fill="#292929">실패</text>
<text x="688" y="189" font-size="15" fill="#292929" text-anchor="end" font-weight="700">1건</text>
<line x1="452" y1="120" x2="496" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="500" y="210" width="200" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="232" font-size="15" fill="#292929" text-anchor="middle">engine_tickets.json</text>
<text x="600.0" y="254" font-size="15" fill="#292929" text-anchor="middle">티켓 7장</text>
<rect x="20" y="300" width="680" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="332" font-size="15" fill="#292929" text-anchor="middle">INC-402 는 grade 키가 없어 오류 → 그 알림만 「실패」로 기록</text>
<text x="360.0" y="354" font-size="15" fill="#292929" text-anchor="middle">나머지 알림은 계속 처리 (실패한 알림은 티켓 없음)</text>
</g></svg>
