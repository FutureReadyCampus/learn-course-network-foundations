<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>실습 5-1 정리: 엔진의 핵심 코드 여섯 줄</title><desc>승인 게이트에 묻기, 자동일 때만 실행(① 직접 씀), 게이트를 거칠 조치만, 알림 한 건 처리, 어떤 오류든 받기(② 직접 씀), 처리 결과별로 세기의 코드 조각입니다. 왼쪽은 하려는 일, 오른쪽은 코드입니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 5-1 정리 (파란 상자 = 직접 쓴 줄)</text>
<rect x="20" y="50" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="79" font-size="15" fill="#292929" text-anchor="middle">승인 게이트에 묻기</text>
<line x1="272" y1="74" x2="296" y2="74" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="50" width="400" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="312" y="79" font-size="14" fill="#292929">decision, reasons = decide_gate(...)</text>
<rect x="20" y="110" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="139" font-size="15" fill="#292929" text-anchor="middle">① 자동일 때만 실행</text>
<line x1="272" y1="134" x2="296" y2="134" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="110" width="400" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="312" y="139" font-size="14" fill="#292929">if decision == &quot;자동&quot;:</text>
<rect x="20" y="170" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="199" font-size="15" fill="#292929" text-anchor="middle">게이트를 거칠 조치만</text>
<line x1="272" y1="194" x2="296" y2="194" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="170" width="400" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="312" y="199" font-size="14" fill="#292929">if action in CONTAINMENT_ACTIONS:</text>
<rect x="20" y="230" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="259" font-size="15" fill="#292929" text-anchor="middle">알림 한 건 처리</text>
<line x1="272" y1="254" x2="296" y2="254" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="230" width="400" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="312" y="259" font-size="14" fill="#292929">result = run_soar_pipeline(alert, context)</text>
<rect x="20" y="290" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="319" font-size="15" fill="#292929" text-anchor="middle">② 어떤 오류든 받기</text>
<line x1="272" y1="314" x2="296" y2="314" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="290" width="400" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="312" y="319" font-size="14" fill="#292929">except Exception as error:</text>
<rect x="20" y="350" width="250" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="145.0" y="379" font-size="15" fill="#292929" text-anchor="middle">처리 결과별로 세기</text>
<line x1="272" y1="374" x2="296" y2="374" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="300" y="350" width="400" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="312" y="379" font-size="14" fill="#292929">counts[outcome] = counts[outcome] + 1</text>
</g></svg>
