<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>실습 5-1 함수 호출 흐름: run_all → 파이프라인 → 게이트 → 조치</title><desc>run_all 이 알림마다 run_soar_pipeline 을 부르고 오류는 실패로 기록합니다. 파이프라인은 게이트를 거칠 조치만 run_step 으로 보내고, run_step 은 make_request 와 decide_gate 를 거쳐 자동이면 execute_action 을 실행합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
