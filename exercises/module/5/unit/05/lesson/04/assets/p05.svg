<desc>unit10_final_retrospective.md 는 1절 Unit 1 ~ 5 파일과 엔진에서 하는 일, 2절 운영하면 깨질 곳 2가지, 3절 캡스톤 주제와 설정 파일로 이루어집니다. 칸마다 한두 문장으로 사실만 적고, 왜 그렇게 했는지는 오늘의 글 쓰기 레슨에서 질문 하나로 풉니다.</desc>
