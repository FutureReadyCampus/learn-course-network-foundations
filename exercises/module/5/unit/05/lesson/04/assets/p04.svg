<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 5-2 정리: 직접 쓰는 두 줄과 미리 채운 점검 코드</title>
<desc>① 은 저장된 요청으로 decide_gate 를 다시 불러 두 결과를 받고, ② 는 다시 구한 결정이 자동이 아닌데 실행했는지 묻는 if 한 줄입니다. 나머지 허용 목록 · 티켓 · PASS 판정 · 파일 저장 코드는 미리 채워 두었습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="bold">실습 5-2 정리: 직접 쓰는 줄(①②)과 미리 채운 줄</text>
<rect x="20" y="50" width="80" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="60.0" y="81.2" font-size="15" fill="#292929" text-anchor="middle">①</text>
<rect x="108" y="50" width="184" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="80.9" font-size="14" fill="#292929" text-anchor="start">결정 다시 구하기</text>
<line x1="294" y1="76" x2="306" y2="76" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="308" y="50" width="392" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="80.9" font-size="14" fill="#292929" text-anchor="start">new_decision, new_reasons = decide_gate(…)</text>
<rect x="20" y="114" width="80" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="60.0" y="145.2" font-size="15" fill="#292929" text-anchor="middle">②</text>
<rect x="108" y="114" width="184" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="144.9" font-size="14" fill="#292929" text-anchor="start">자동 아닌데 실행했으면</text>
<line x1="294" y1="140" x2="306" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="308" y="114" width="392" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="144.9" font-size="14" fill="#292929" text-anchor="start">if new_decision != "자동" and step["executed"]:</text>
<rect x="20" y="178" width="80" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="60.0" y="209.2" font-size="15" fill="#292929" text-anchor="middle">미리 채움</text>
<rect x="108" y="178" width="184" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="208.9" font-size="14" fill="#292929" text-anchor="start">허용 목록 IP 차단</text>
<line x1="294" y1="204" x2="306" y2="204" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="308" y="178" width="392" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="208.9" font-size="14" fill="#292929" text-anchor="start">if step["target"] in allowlist_ips and …</text>
<rect x="20" y="242" width="80" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="60.0" y="273.2" font-size="15" fill="#292929" text-anchor="middle">미리 채움</text>
<rect x="108" y="242" width="184" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="272.9" font-size="14" fill="#292929" text-anchor="start">위반이 없으면 PASS</text>
<line x1="294" y1="268" x2="306" y2="268" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="308" y="242" width="392" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="272.9" font-size="14" fill="#292929" text-anchor="start">if violations == []:</text>
<rect x="20" y="306" width="80" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="60.0" y="337.2" font-size="15" fill="#292929" text-anchor="middle">미리 채움</text>
<rect x="108" y="306" width="184" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="336.9" font-size="14" fill="#292929" text-anchor="start">리스트를 파일에 저장</text>
<line x1="294" y1="332" x2="306" y2="332" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="308" y="306" width="392" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="336.9" font-size="14" fill="#292929" text-anchor="start">save_json(rows, CHECK_PATH)</text>
</g>
</svg>
