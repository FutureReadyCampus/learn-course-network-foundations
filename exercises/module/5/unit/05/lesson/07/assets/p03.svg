<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 5-1 보고서: 핵심 (가) 출력 · (나) INC-402 실패 이유, 응용 (다) INC-404와 INC-406 비교</title>
<desc>핵심 질문은 (가) · (나)이고 (다)는 응용입니다. (가)에는 출력 전체와 처리 결과별 알림 수, 승인 대기인 알림 번호를 씁니다. (나)는 INC-402 오류 문장과 except 줄로 나머지가 처리된 이유를, (다)는 INC-404 와 INC-406 의 결정 이유 차이와 게이트가 execute_action 보다 먼저인 이유를 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="bold">실습 5-1 보고서: 채울 칸</text>
<rect x="20" y="54" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="88.8" font-size="15" fill="#292929" text-anchor="middle">(가)</text>
<text x="70.0" y="109.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="128" y="54" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="88.8" font-size="15" fill="#292929" text-anchor="start">출력 전체(코드 상자) · 처리 결과별 알림 수</text>
<text x="140" y="109.8" font-size="15" fill="#292929" text-anchor="start">승인 대기인 알림 번호</text>
<rect x="20" y="146" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="180.8" font-size="15" fill="#292929" text-anchor="middle">(나)</text>
<text x="70.0" y="201.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="128" y="146" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="180.8" font-size="15" fill="#292929" text-anchor="start">INC-402 오류 문장 · except 줄로 계속된 이유</text>
<text x="140" y="201.8" font-size="15" fill="#292929" text-anchor="start">try / except 가 없을 때 이후 알림에 생기는 일</text>
<rect x="20" y="238" width="100" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="70.0" y="272.8" font-size="15" fill="#292929" text-anchor="middle">(다)</text>
<text x="70.0" y="293.8" font-size="15" fill="#292929" text-anchor="middle">응용</text>
<rect x="128" y="238" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="272.8" font-size="15" fill="#292929" text-anchor="start">INC-404(차단 금지) · INC-406(승인 대기) 결정 이유</text>
<text x="140" y="293.8" font-size="15" fill="#292929" text-anchor="start">승인 게이트가 execute_action 보다 먼저인 이유</text>
</g>
</svg>
