<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>soar_response 폴더에 이전 파일을 확인하고 engine_alerts.json 을 만든다</title><desc>network-study-notes 안의 soar_response 폴더에서 ls 와 ls config 로 이전 파일을 확인하고, 앞 Unit 파일을 한 번에 불러 봅니다. 플레이북 등록 값을 점검한 뒤 New File 로 알림 8건이 든 engine_alerts.json 을 만들고 개수가 8인지 확인합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
