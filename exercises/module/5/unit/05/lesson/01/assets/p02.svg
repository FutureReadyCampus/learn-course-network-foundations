<text x="32" y="75" font-size="15" fill="#292929" font-weight="700">network-study-notes/</text>
<rect x="50" y="100" width="370" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="62" y="125" font-size="15" fill="#292929" font-weight="700">soar_response/</text>
