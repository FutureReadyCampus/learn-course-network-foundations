<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 3-1 보고서에서 채울 칸: (가) 출력 (나) junho 가 안 풀린 이유 (다) 되돌리기 불가</title>
<desc>(가)에는 출력 전체와 단계 5 의 잠긴 계정, 차단한 IP 를 적는다. (나)에는 junho 기록의 before 와 after, 해제되지 않은 이유, 5·6번이 없을 때를 적고, (다)에는 되돌리기 불가 줄이 나온 이유와 모두 원래대로라고 보고할 때의 문제를 적는다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="18" fill="#292929" font-weight="700">실습 3-1 · 채울 칸</text>
<rect x="20" y="50" width="220" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130" y="77.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(가)</text>
<rect x="20" y="104" width="220" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="159.44" font-size="14" fill="#292929">① 출력 전체 (코드 상자)</text>
<text x="32" y="179.04" font-size="14" fill="#292929">② 단계 5 의 잠긴 계정</text>
<text x="32" y="198.64" font-size="14" fill="#292929">③ 단계 5 의 차단한 IP</text>
<rect x="250" y="50" width="220" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="77.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나) 핵심</text>
<rect x="250" y="104" width="220" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="262" y="159.44" font-size="14" fill="#292929">① junho 의 before · after</text>
<text x="262" y="179.04" font-size="14" fill="#292929">② 해제되지 않은 이유</text>
<text x="262" y="198.64" font-size="14" fill="#292929">③ 5 · 6번이 없을 때</text>
<rect x="480" y="50" width="220" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="590" y="77.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다) 핵심</text>
<rect x="480" y="104" width="220" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="492" y="159.44" font-size="14" fill="#292929">① 되돌리기 불가 줄의 이유</text>
<text x="492" y="179.04" font-size="14" fill="#292929">② 「모두 원래대로」 보고의</text>
<text x="492" y="198.64" font-size="14" fill="#292929">문제</text>
<rect x="20" y="270" width="680" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="304.9" font-size="15" fill="#292929" text-anchor="middle">근거는 내 출력의 값으로 — 예: 실습 2-2 기록의 before · after</text>
<text x="360" y="325.9" font-size="15" fill="#666660" text-anchor="middle">못 찾으면 「모름 — 막힌 곳: …」</text>
</svg>
