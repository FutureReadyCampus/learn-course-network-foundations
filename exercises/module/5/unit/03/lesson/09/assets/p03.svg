<text x="557" y="203.44" font-size="14" fill="#292929">한 조치</text>
<rect x="20" y="270" width="680" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="309.9" font-size="15" fill="#292929" text-anchor="middle">마무리 (가)는 git add 전에 채운다</text>
<text x="360" y="330.9" font-size="15" fill="#666660" text-anchor="middle">Unit 2 · 5 의 빈 칸은 「모름 — 막힌 곳: …」 으로 적고 올린다</text>
