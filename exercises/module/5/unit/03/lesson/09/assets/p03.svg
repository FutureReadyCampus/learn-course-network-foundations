<rect x="370" y="104" width="165" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="382" y="154.44" font-size="14" fill="#292929">① INC-008 · 009</text>
<text x="382" y="174.04" font-size="14" fill="#292929">② INC-003 · 010</text>
<text x="382" y="193.64" font-size="14" fill="#292929">③ 자동 처리 영향</text>
<rect x="545" y="50" width="155" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="622.5" y="77.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마무리 (가)</text>
<rect x="545" y="104" width="155" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="557" y="144.64" font-size="14" fill="#292929">① .env · .venv</text>
