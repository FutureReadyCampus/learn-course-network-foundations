<rect x="195" y="50" width="165" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="277.5" y="77.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나) 핵심</text>
<rect x="195" y="104" width="165" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="207" y="154.44" font-size="14" fill="#292929">① INC-005 조치 실패</text>
<text x="207" y="174.04" font-size="14" fill="#292929">이유 (단계 2)</text>
<text x="207" y="193.64" font-size="14" fill="#292929">② 6번이 없을 때</text>
<rect x="370" y="50" width="165" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
