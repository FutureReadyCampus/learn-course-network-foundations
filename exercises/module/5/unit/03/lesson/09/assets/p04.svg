<text x="377.0" y="184.2" font-size="14" fill="#292929">등급과 만든 시각</text>
<text x="377.0" y="203.8" font-size="14" fill="#292929">으로 기한 계산</text>
<text x="377.0" y="223.4" font-size="14" fill="#292929">② 같은 기한의</text>
<text x="377.0" y="243.0" font-size="14" fill="#292929">문제</text>
<rect x="537.5" y="50" width="162.5" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
