<text x="32.0" y="233.2" font-size="14" fill="#292929">이른 티켓</text>
<rect x="192.5" y="50" width="162.5" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="273.75" y="77.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(나) 핵심</text>
<rect x="192.5" y="104" width="162.5" height="170" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
