<text x="204.5" y="223.4" font-size="14" fill="#292929">아닌 이유</text>
<text x="204.5" y="243.0" font-size="14" fill="#292929">③ 없을 때 놓칠 일</text>
<rect x="365.0" y="50" width="162.5" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="446.25" y="77.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">(다) 핵심</text>
<rect x="365.0" y="104" width="162.5" height="170" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="377.0" y="145.0" font-size="14" fill="#292929">① TCK-1 15분 ·</text>
