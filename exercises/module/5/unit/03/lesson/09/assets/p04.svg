<rect x="20" y="296" width="680" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="322.8" font-size="15" fill="#292929" text-anchor="middle">근거는 내 출력의 값으로 — done 문장 · 등급 · 만든 시각</text>
<text x="360.0" y="343.8" font-size="15" fill="#666660" text-anchor="middle">마무리 (가)는 git status 와 「제공 파일」 확인 결과로 채운다</text>
</svg>
