<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 3-2 보고서와 마무리에서 채울 칸: 출력, INC-207, 응답 기한, .env · .venv</title>
<desc>(가)에는 출력 전체, 직접 확인이 필요한 티켓 번호, 기한이 가장 이른 티켓을 적는다. (나)는 INC-207 의 done 문장과 next_step 이 「조치됨」용이 아닌 이유, (다)는 TCK-1 15분과 TCK-2 243분 계산과 같은 기한의 문제를 적는다. 마무리 (가)에는 .env · .venv 와 제공 파일 정상 7 을 적는다.</desc>
<text x="20" y="32.0" font-size="18" fill="#292929" font-weight="700">실습 3-2 · 마무리 · 채울 칸</text>
