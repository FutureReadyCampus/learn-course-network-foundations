<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>send_ticket_notice 는 보낼지 정하고 수신자를 골라 최대 3번 보낸다</title>
<desc>ticket_notice.py 는 notifier.py 의 notify 를 불러 쓴다. send_ticket_notice 는 should_send(처음이거나 30분이 지났는지)로 보낼지 정하고, pick_recipients 로 등급별 수신자를 고른 뒤 send_with_retry 로 최대 3번 보낸다. 결과는 「전송」 · 「건너뜀」 · 「실패」 중 하나다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="220" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130.0" y="50.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">notifier.py · notify</text>
<rect x="480" y="20" width="220" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="590.0" y="50.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">ticket_notice.py</text>
<line x1="476" y1="45" x2="244" y2="45" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="360" y="37.0" font-size="14" fill="#666660" text-anchor="middle">import</text>
<text x="20" y="108.0" font-size="17" fill="#292929" font-weight="700">send_ticket_notice</text>
<rect x="20" y="125" width="200" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="154.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">should_send</text>
<text x="120.0" y="175.8" font-size="15" fill="#666660" text-anchor="middle">처음 또는 30분 지남</text>
<rect x="260" y="125" width="200" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="154.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">pick_recipients</text>
<text x="360.0" y="175.8" font-size="15" fill="#666660" text-anchor="middle">등급별 수신자</text>
<rect x="500" y="125" width="200" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="600.0" y="154.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">send_with_retry</text>
<text x="600.0" y="175.8" font-size="15" fill="#666660" text-anchor="middle">최대 3번</text>
<line x1="220" y1="160" x2="256" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="460" y1="160" x2="496" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="120" y1="195" x2="120" y2="251" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="130" y="228.0" font-size="14" fill="#666660">아니면</text>
<rect x="20" y="255" width="200" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="285.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「건너뜀」</text>
<line x1="560" y1="195" x2="520" y2="251" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="640" y1="195" x2="640" y2="251" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="500" y="228.0" font-size="14" fill="#666660" text-anchor="end">성공</text>
<text x="650" y="228.0" font-size="14" fill="#666660">모두 실패</text>
<rect x="440" y="255" width="120" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="500.0" y="285.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「전송」</text>
<rect x="580" y="255" width="120" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="640.0" y="285.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「실패」</text>
