<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>handle_alert 가 합칠 티켓을 찾아 병합하거나 새 티켓을 만들고, 상태는 허용된 이동만</title>
<desc>handle_alert 는 find_open_ticket 으로 같은 대상, 같은 규칙, 해결 아님, 60분 이내인 티켓을 찾는다. 있으면 merge_alert 로 병합하고 없으면 make_ticket 으로 새 티켓을 만든다. change_ticket_status 는 열림 → 확인 중 → 해결, 열림 → 해결 이동만 허용한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="400" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="220.0" y="45.2" font-size="15" fill="#292929" text-anchor="middle">알림 한 건  →  handle_alert</text>
<line x1="220" y1="60" x2="220" y2="76" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="80" width="400" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="36" y="106.0" font-size="15" fill="#292929" font-weight="700">find_open_ticket · 네 조건</text>
<text x="36" y="134.0" font-size="15" fill="#292929">① 같은 대상 (entity)</text>
<text x="36" y="156.0" font-size="15" fill="#292929">② 같은 규칙 (rule)</text>
<text x="36" y="178.0" font-size="15" fill="#292929">③ 해결되지 않은 티켓</text>
<text x="36" y="200.0" font-size="15" fill="#292929">④ updated_at 뒤 60분 이내</text>
<line x1="120" y1="220" x2="115" y2="256" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="320" y1="220" x2="325" y2="256" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="260" width="190" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="115.0" y="289.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">있으면</text>
<text x="115.0" y="310.2" font-size="14" fill="#292929" text-anchor="middle">merge_alert</text>
<text x="115.0" y="331.2" font-size="15" fill="#292929" text-anchor="middle">→ 「병합」</text>
<rect x="230" y="260" width="190" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="325.0" y="289.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">없으면</text>
<text x="325.0" y="310.2" font-size="14" fill="#292929" text-anchor="middle">make_ticket</text>
<text x="325.0" y="331.2" font-size="15" fill="#292929" text-anchor="middle">→ 「새 티켓」</text>
<text x="460" y="40.0" font-size="17" fill="#292929" font-weight="700">change_ticket_status</text>
<rect x="470" y="70" width="140" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540.0" y="97.2" font-size="15" fill="#292929" text-anchor="middle">열림</text>
<rect x="470" y="170" width="140" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540.0" y="197.2" font-size="15" fill="#292929" text-anchor="middle">확인 중</text>
<rect x="470" y="270" width="140" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540.0" y="297.2" font-size="15" fill="#292929" text-anchor="middle">해결</text>
<line x1="540" y1="114" x2="540" y2="166" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="540" y1="214" x2="540" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<path d="M612 92 C690 92 690 292 616 292" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="460" y="345.0" font-size="14" fill="#666660">허용된 이동일 때만 바꾸고</text>
<text x="460" y="366.0" font-size="14" fill="#666660">바꾼 사람 · 시각을 comments 에</text>
</svg>
