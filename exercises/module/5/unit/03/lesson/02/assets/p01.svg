<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>자동 대응이 한 조치 중 자동이 바꾼 것만 되돌리고 세션 종료는 따로 표시한다</title>
<desc>왼쪽은 Unit 2 자동 대응이 세 인시던트에 한 조치이고, 오른쪽은 되돌린 뒤의 모습이다. dami 계정과 IP 차단은 풀리고, 원래 잠겨 있던 junho 는 그대로이며, 세션 종료는 되돌릴 수 없음으로 표시된다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="150" y="30" font-size="18" fill="#292929" text-anchor="middle" font-weight="700">자동 대응이 한 조치</text>
<text x="540" y="30" font-size="18" fill="#292929" text-anchor="middle" font-weight="700">되돌린 뒤</text>
<rect x="20" y="52" width="260" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="150" y="84.9" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">INC-001 · dami</text>
<text x="150" y="105.9" font-size="15" fill="#292929" text-anchor="middle">계정 잠금 + 세션 종료</text>
<line x1="288" y1="90" x2="372" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="380" y="52" width="320" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="84.9" font-size="15" fill="#292929" text-anchor="middle">dami 계정 해제</text>
<text x="540" y="105.9" font-size="15" fill="#292929" text-anchor="middle">세션 종료는 되돌릴 수 없음 표시</text>
<rect x="20" y="148" width="260" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="150" y="180.9" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">INC-006 · junho</text>
<text x="150" y="201.9" font-size="15" fill="#292929" text-anchor="middle">원래 잠김 · 세션만 종료</text>
<line x1="288" y1="186" x2="372" y2="186" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="380" y="148" width="320" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="180.9" font-size="15" fill="#292929" text-anchor="middle">junho 는 잠긴 채 그대로</text>
<text x="540" y="201.9" font-size="15" fill="#292929" text-anchor="middle">세션 종료는 되돌릴 수 없음 표시</text>
<rect x="20" y="244" width="260" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="150" y="276.9" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">INC-005 · 198.51.100.90</text>
<text x="150" y="297.9" font-size="15" fill="#292929" text-anchor="middle">IP 차단</text>
<line x1="288" y1="282" x2="372" y2="282" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="380" y="244" width="320" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="287.4" font-size="15" fill="#292929" text-anchor="middle">IP 차단 해제</text>
<text x="360" y="346" font-size="15" fill="#666660" text-anchor="middle">세 건 모두 오탐으로 확인됨 — 사람이 추측으로 풀지 않고 조치 기록을 보고 푼다</text>
</svg>
