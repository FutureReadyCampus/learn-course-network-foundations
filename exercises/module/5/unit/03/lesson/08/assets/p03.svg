<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 3-2 정답: 기한은 알림 시각 + 등급별 기한, 확인 실패 건은 직접 확인</title>
<desc>INC-201 은 high 라서 0 + 15 = 15분이 기한인 TCK-1 이 된다. INC-207 의 done 문장에 확인 실패가 있어 has_failed_action 이 True 를 리턴하고 TCK-7 이 직접 확인 대상이 된다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">실습 3-2 정답 · 두 가지 흐름</text>
<rect x="20" y="60" width="190" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="115.0" y="99.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">INC-201</text>
<text x="115.0" y="120.8" font-size="15" fill="#292929" text-anchor="middle">high · 0분에 옴</text>
<rect x="250" y="60" width="220" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="99.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">make_ticket</text>
<text x="360.0" y="120.8" font-size="15" fill="#292929" text-anchor="middle">sla_due = 0 + 15</text>
<rect x="510" y="60" width="190" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605.0" y="99.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">TCK-1</text>
<text x="605.0" y="120.8" font-size="15" fill="#292929" text-anchor="middle">기한 15분</text>
<rect x="20" y="180" width="190" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="115.0" y="219.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">INC-207 done</text>
<text x="115.0" y="240.8" font-size="15" fill="#292929" text-anchor="middle">…(확인 실패)</text>
<rect x="250" y="180" width="220" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="219.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">has_failed_action</text>
<text x="360.0" y="240.8" font-size="15" fill="#292929" text-anchor="middle">True 리턴</text>
<rect x="510" y="180" width="190" height="90" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="605.0" y="219.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">TCK-7</text>
<text x="605.0" y="240.8" font-size="15" fill="#292929" text-anchor="middle">직접 확인 대상</text>
<line x1="212" y1="105" x2="248" y2="105" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="472" y1="105" x2="508" y2="105" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="212" y1="225" x2="248" y2="225" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="472" y1="225" x2="508" y2="225" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="300" width="680" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="327.8" font-size="15" fill="#292929" text-anchor="middle">결과: 티켓 11장 · 직접 확인 1건(TCK-7)</text>
<text x="360.0" y="348.8" font-size="15" fill="#292929" text-anchor="middle">가장 이른 기한 TCK-1 (15분) · TCK-2 는 3 + 240 = 243분</text>
</svg>
