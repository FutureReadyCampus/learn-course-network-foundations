<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img">
<title>알림 한 건이 맥락 붙이기와 경로 정하기를 거쳐 조치로 갈라지는 흐름</title>
<desc>알림에 맥락을 붙이고 경로를 정하면 오탐 종료, 승인 필요(VIP), 기본 세 경로로 나뉩니다. 기본 경로는 탐지된 규칙에 따라 퇴사한 계정은 계정 잠금 후 세션 종료, 경로 스캔은 허용 목록 IP면 차단하지 않고 여러 계정이 함께 쓰는 IP면 승인 대기, 아니면 IP 차단을 하며, 그 밖의 규칙은 자동 조치하지 않습니다.</desc>
<defs><marker id="a-f01-m5u05l03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
