<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>도전 3-1 정리: 번호마다 쓰는 코드 모양</title>
<desc>1~3번은 규칙을 하나씩 보며 조치 표에 있으면 조치 이름을 리턴하고, 4·5번은 승인 대기와 빈 리스트를 함께 리턴한다. 6~8번은 기록을 판별하고 세며, 9번은 리턴된 두 값을 한 번에 받는다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="30" font-size="18" fill="#292929" font-weight="700">도전 3-1 정리 · 번호별 코드</text>
<rect x="20" y="48" width="680" height="36" fill="#f1f1ef" stroke="#dededb" stroke-width="1"/>
<text x="30" y="71.04" font-size="14" fill="#292929" font-weight="700">번호</text>
<text x="140" y="71.04" font-size="14" fill="#292929" font-weight="700">하는 일</text>
<text x="350" y="71.04" font-size="14" fill="#292929" font-weight="700">코드 모양</text>
<rect x="20" y="84" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="107.04" font-size="14" fill="#292929">1 · 2 · 3</text>
<text x="140" y="107.04" font-size="14" fill="#292929">규칙을 보고 조치 고르기</text>
<text x="350" y="107.04" font-size="14" fill="#292929">for rule in incident["reasons"]:</text>
<rect x="20" y="120" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="350" y="143.04" font-size="14" fill="#292929">if rule in CONTAINMENT_BY_RULE:</text>
<rect x="20" y="156" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="179.04" font-size="14" fill="#292929">4 · 5</text>
<text x="140" y="179.04" font-size="14" fill="#292929">값 두 개 함께 리턴</text>
<text x="350" y="179.04" font-size="14" fill="#292929">return "승인 대기", []</text>
<rect x="20" y="192" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="215.04" font-size="14" fill="#292929">6</text>
<text x="140" y="215.04" font-size="14" fill="#292929">안에 있는지 리턴</text>
<text x="350" y="215.04" font-size="14" fill="#292929">return "확인 실패" in record["after"]</text>
<rect x="20" y="228" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="251.04" font-size="14" fill="#292929">7</text>
<text x="140" y="251.04" font-size="14" fill="#292929">같은지 리턴</text>
<text x="350" y="251.04" font-size="14" fill="#292929">return record["before"] == record["after"]</text>
<rect x="20" y="264" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="287.04" font-size="14" fill="#292929">8</text>
<text x="140" y="287.04" font-size="14" fill="#292929">1 늘려 다시 저장</text>
<text x="350" y="287.04" font-size="14" fill="#292929">counts[kind] = counts[kind] + 1</text>
<rect x="20" y="300" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="323.04" font-size="14" fill="#292929">9</text>
<text x="140" y="323.04" font-size="14" fill="#292929">두 값을 한 번에 받기</text>
<text x="350" y="323.04" font-size="14" fill="#292929">status, records = handle_incident(…)</text>
<line x1="130" y1="48" x2="130" y2="336" stroke="#dededb" stroke-width="1"/>
<line x1="340" y1="48" x2="340" y2="336" stroke="#dededb" stroke-width="1"/>
</svg>
