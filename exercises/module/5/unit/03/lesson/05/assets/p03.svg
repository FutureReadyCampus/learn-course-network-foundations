<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>응용 3-1 세 파일이 알림을 처리해 기록을 모으고 종류별로 세는 흐름</title>
<desc>apply3-1_run.py 가 알림마다 handle_incident 를 불러 처리 결과와 조치 기록 두 값을 받는다(9번). drill.py 는 규칙에 맞는 조치를 고르고(1~3번) VIP 를 승인 대기로 둔다(4·5번). shift_report.py 는 기록을 확인 실패, 변경 없음, 변경됨 순서로 나눠 센다(6~8번).</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="680" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="50.4" font-size="15" fill="#292929" text-anchor="middle">apply3-1_run.py · 9번  status, records = handle_incident(…)</text>
<rect x="20" y="100" width="330" height="30" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="120.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">drill.py</text>
<rect x="20" y="138" width="330" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="162.9" font-size="15" fill="#292929" text-anchor="middle">choose_containment  1~3번</text>
<text x="185" y="183.9" font-size="15" fill="#666660" text-anchor="middle">규칙 → 조치 이름 (없으면 「없음」)</text>
<rect x="20" y="206" width="330" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="230.9" font-size="15" fill="#292929" text-anchor="middle">handle_incident  4 · 5번</text>
<text x="185" y="251.9" font-size="15" fill="#666660" text-anchor="middle">승인 필요이면 "승인 대기", []</text>
<rect x="370" y="100" width="330" height="30" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="535" y="120.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">shift_report.py</text>
<rect x="370" y="138" width="330" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="162.9" font-size="15" fill="#292929" text-anchor="middle">is_failure 6번 · is_unchanged 7번</text>
<text x="535" y="183.9" font-size="15" fill="#666660" text-anchor="middle">「확인 실패」 in after · before == after</text>
<rect x="370" y="206" width="330" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="535" y="230.9" font-size="15" fill="#292929" text-anchor="middle">summarize  8번</text>
<text x="535" y="251.9" font-size="15" fill="#666660" text-anchor="middle">counts[kind] 를 1 늘린다</text>
<line x1="185" y1="74" x2="185" y2="96" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="354" y1="236" x2="366" y2="236" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="20" y="300" font-size="16" fill="#292929" font-weight="700">classify_record 가 기록 한 건을 나누는 순서 (미리 채움)</text>
<rect x="20" y="316" width="200" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="120" y="343.4" font-size="15" fill="#292929" text-anchor="middle">확인 실패인가?</text>
<line x1="224" y1="338" x2="254" y2="338" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="258" y="316" width="200" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="358" y="343.4" font-size="15" fill="#292929" text-anchor="middle">전후가 같은가?</text>
<line x1="462" y1="338" x2="492" y2="338" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="496" y="316" width="204" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="598" y="343.4" font-size="15" fill="#292929" text-anchor="middle">그 밖 → 변경됨</text>
<text x="120" y="384" font-size="15" fill="#666660" text-anchor="middle">예 → 확인 실패</text>
<text x="358" y="384" font-size="15" fill="#666660" text-anchor="middle">예 → 변경 없음</text>
<text x="360" y="410" font-size="15" fill="#666660" text-anchor="middle">실행하면 단계 1 처리 결과 · 단계 2 조치 기록 · 단계 3 요약 · 단계 4 확인할 건</text>
</svg>
