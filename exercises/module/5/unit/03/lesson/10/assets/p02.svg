<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>롤백과 티켓 글의 파일과 머리말 준비하기</title>
<desc>_posts 폴더에 새 파일을 만들고 머리말에 제목과 작성일을 적습니다. 롤백과 티켓에 쓴 코드를 확인할 수 있도록 실행 결과와 해당 파일에 이르는 링크를 글에 넣습니다.</desc>
