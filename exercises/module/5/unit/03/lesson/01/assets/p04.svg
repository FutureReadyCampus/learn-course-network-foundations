<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>soar_response 폴더에 알림 11건 파일과 config 규칙 파일(키 6개)을 만든다</title>
<desc>soar_response 폴더에 alerts_thu.json(알림 11건)을, config 폴더에 escalation_rules.json(키 6개)을 만든다. 규칙 파일의 키는 sla_minutes, recipients, merge_window_minutes, send_gap_minutes, alert_url, escalation_steps 이다. 확인 명령이 11 6 을 출력하면 된다.</desc>
