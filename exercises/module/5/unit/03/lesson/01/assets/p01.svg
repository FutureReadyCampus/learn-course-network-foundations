<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오늘의 계획 약 2시간 40분과 핵심 실습 3-1 · 3-2, 여유가 되면 하는 응용 3-1 ~ 3-3</title>
<desc>오늘은 시작 15분, 핵심 실습 약 100분, 마무리 25분, 글쓰기 20분으로 나눈다. 핵심 실습 시간에는 실습 3-1(rollback.py 의 빈칸 두 곳, 자동이 바꾼 것만 되돌리기)과 실습 3-2(ticketing.py 의 빈칸 두 곳, 티켓과 응답 기한)를 한다. 응용 3-1 ~ 3-3은 시간이 남을 때 여유가 되면 한다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="32.0" font-size="18" fill="#292929" font-weight="700">오늘의 계획 · 약 2시간 40분</text>
<rect x="20" y="50" width="125" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="82.5" y="74.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">시작</text>
<text x="82.5" y="95.8" font-size="15" fill="#292929" text-anchor="middle">15분</text>
<rect x="155" y="50" width="255" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="282.5" y="74.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">핵심 실습</text>
<text x="282.5" y="95.8" font-size="15" fill="#292929" text-anchor="middle">약 100분</text>
<rect x="420" y="50" width="160" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="500.0" y="74.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">마무리</text>
<text x="500.0" y="95.8" font-size="15" fill="#292929" text-anchor="middle">25분</text>
<rect x="590" y="50" width="110" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="645.0" y="74.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">글쓰기</text>
<text x="645.0" y="95.8" font-size="15" fill="#292929" text-anchor="middle">20분</text>
<line x1="282" y1="110" x2="190" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="282" y1="110" x2="530" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="140" width="335" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="187.5" y="172.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 3-1</text>
<text x="187.5" y="193.2" font-size="15" fill="#292929" text-anchor="middle">rollback.py · 빈칸 두 곳</text>
<text x="187.5" y="214.2" font-size="15" fill="#666660" text-anchor="middle">자동이 바꾼 것만 되돌리기</text>
<rect x="365" y="140" width="335" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="532.5" y="172.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실습 3-2</text>
<text x="532.5" y="193.2" font-size="15" fill="#292929" text-anchor="middle">ticketing.py · 빈칸 두 곳</text>
<text x="532.5" y="214.2" font-size="15" fill="#666660" text-anchor="middle">티켓과 응답 기한(SLA)</text>
<rect x="20" y="262" width="680" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="292.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">응용 3-1 ~ 3-3 · 여유가 되면</text>
<text x="360.0" y="313.8" font-size="15" fill="#666660" text-anchor="middle">핵심 실습 두 개와 글쓰기를 마치고 시간이 남을 때</text>
</svg>
