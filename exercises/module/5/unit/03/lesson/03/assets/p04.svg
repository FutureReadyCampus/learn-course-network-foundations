<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 3-2 정리: 직접 쓰는 곳 ① · ② 와 미리 채운 줄의 코드 모양</title>
<desc>직접 쓰는 곳은 ① 등급의 응답 기한 읽기와 ② 수신 시각에 더해 응답 기한 시각 저장 두 줄이다. 제목 이어 붙이기, 기본값을 주며 읽기, 확인 실패 찾기, 티켓을 저장하고 모으고 세는 줄은 미리 채워 두었다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="30" font-size="18" fill="#292929" font-weight="700">실습 3-2 정리 · 직접 쓰는 곳과 미리 채운 줄</text>
<rect x="20" y="48" width="680" height="36" fill="#f1f1ef" stroke="#dededb" stroke-width="1"/>
<text x="30" y="71.04" font-size="14" fill="#292929" font-weight="700">빈칸</text>
<text x="120" y="71.04" font-size="14" fill="#292929" font-weight="700">하는 일</text>
<text x="320" y="71.04" font-size="14" fill="#292929" font-weight="700">코드 모양</text>
<rect x="20" y="84" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="107.04" font-size="14" fill="#292929">미리 채움</text>
<text x="120" y="107.04" font-size="14" fill="#292929">문자열 이어 붙이기</text>
<text x="320" y="107.04" font-size="14" fill="#292929">return "[" + grade + "] " + entity + …</text>
<rect x="20" y="120" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="143.04" font-size="14" fill="#292929">미리 채움</text>
<text x="120" y="143.04" font-size="14" fill="#292929">키가 없으면 기본값</text>
<text x="320" y="143.04" font-size="14" fill="#292929">return next_steps.get(status, DEFAULT_…)</text>
<rect x="20" y="156" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="179.04" font-size="14" fill="#292929">미리 채움</text>
<text x="120" y="179.04" font-size="14" fill="#292929">문자열 안에 있으면</text>
<text x="320" y="179.04" font-size="14" fill="#292929">if "확인 실패" in text:  return True</text>
<rect x="20" y="192" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="215.04" font-size="14" fill="#292929">① 직접</text>
<text x="120" y="215.04" font-size="14" fill="#292929">등급의 기한 읽기</text>
<text x="320" y="215.04" font-size="14" fill="#292929">sla_minutes = sla_table[alert["grade"]]</text>
<rect x="20" y="228" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="251.04" font-size="14" fill="#292929">② 직접</text>
<text x="120" y="251.04" font-size="14" fill="#292929">더해서 저장</text>
<text x="320" y="251.04" font-size="14" fill="#292929">sla_due = alert["minute"] + sla_minutes</text>
<rect x="20" y="264" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="287.04" font-size="14" fill="#292929">미리 채움</text>
<text x="120" y="287.04" font-size="14" fill="#292929">만들고 모으기</text>
<text x="320" y="287.04" font-size="14" fill="#292929">ticket = make_ticket(…) · tickets.append(ticket)</text>
<rect x="20" y="300" width="680" height="36" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="323.04" font-size="14" fill="#292929">미리 채움</text>
<text x="120" y="323.04" font-size="14" fill="#292929">1 늘리기</text>
<text x="320" y="323.04" font-size="14" fill="#292929">manual_count = manual_count + 1</text>
<line x1="110" y1="48" x2="110" y2="336" stroke="#dededb" stroke-width="1"/>
<line x1="310" y1="48" x2="310" y2="336" stroke="#dededb" stroke-width="1"/>
</svg>
