<text x="581.5" y="175.24" font-size="14" fill="#292929" text-anchor="middle">sla  ① · ② 직접 씀</text>
<text x="581.5" y="194.84" font-size="14" fill="#666660" text-anchor="middle">minute + sla_minutes</text>
<rect x="20" y="90" width="160" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="100" y="130.44" font-size="14" fill="#292929" text-anchor="middle">참이면</text>
<text x="100" y="150.04" font-size="14" fill="#292929" text-anchor="middle">next_step 을</text>
<text x="100" y="169.64" font-size="14" fill="#292929" text-anchor="middle">MANUAL_STEP 으로</text>
