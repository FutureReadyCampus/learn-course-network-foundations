<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 3-2: 알림 한 건이 make_ticket 을 거쳐 티켓이 되고 리스트에 모이는 흐름</title>
<desc>make_ticket 은 make_title 로 제목을, find_next_step 으로 후속 조치를 만들고, has_failed_action 이 참이면 직접 확인 문장으로 바꾼다. 직접 쓰는 곳은 응답 기한 시각을 계산하는 ① · ② 두 줄이고 나머지는 미리 채워 두었다. 실행 파일은 티켓을 저장하고 모으고 직접 확인 수를 센다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="160" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="40.24" font-size="14" fill="#292929" text-anchor="middle">알림 한 건</text>
<text x="100" y="59.84" font-size="14" fill="#292929" text-anchor="middle">alerts_thu.json</text>
