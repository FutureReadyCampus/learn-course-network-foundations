<line x1="460" y1="214" x2="460" y2="240" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="218" y="244" width="482" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="459" y="274.04" font-size="14" fill="#292929" text-anchor="middle">티켓 · TCK-번호 · 상태 「열림」 · sla_due · needs_manual</text>
<text x="20" y="236" font-size="16" fill="#292929" font-weight="700">exercise3-2_run.py</text>
