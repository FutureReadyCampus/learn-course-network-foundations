<rect x="218" y="80" width="237" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="336.5" y="105.24" font-size="14" fill="#292929" text-anchor="middle">make_title</text>
<text x="336.5" y="124.84" font-size="14" fill="#666660" text-anchor="middle">"[" + grade + "] " + …</text>
<rect x="463" y="80" width="237" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="581.5" y="105.24" font-size="14" fill="#292929" text-anchor="middle">find_next_step</text>
<text x="581.5" y="124.84" font-size="14" fill="#666660" text-anchor="middle">.get(status, 기본 문장)</text>
<rect x="218" y="150" width="237" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="336.5" y="175.24" font-size="14" fill="#292929" text-anchor="middle">has_failed_action</text>
<text x="336.5" y="194.84" font-size="14" fill="#666660" text-anchor="middle">「확인 실패」 있으면 True</text>
