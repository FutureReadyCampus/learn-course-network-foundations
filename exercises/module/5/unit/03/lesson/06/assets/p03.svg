<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>응용 3-2: handle_alert 가 합칠 티켓을 찾아 새 티켓을 만들거나 병합하는 흐름</title>
<desc>알림이 오면 find_open_ticket(1~3번)이 합칠 티켓을 찾고 7번에서 existing 에 저장한다. 8번에서 None 이면 새 티켓을 만들고, 아니면 9번에서 merge_alert(4~6번)로 count, incidents, updated_at 을 갱신한다. 단계 3 에서는 TCK-1 상태를 바꿔 본다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="140" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="50.4" font-size="15" fill="#292929" text-anchor="middle">알림 한 건</text>
<line x1="164" y1="45" x2="194" y2="45" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="198" y="20" width="300" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="348" y="40.24" font-size="14" fill="#292929" text-anchor="middle">find_open_ticket  1~3번</text>
<text x="348" y="59.84" font-size="14" fill="#292929" text-anchor="middle">7번 · existing 에 저장</text>
<line x1="502" y1="45" x2="532" y2="45" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="536" y="20" width="164" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="618" y="50.04" font-size="14" fill="#292929" text-anchor="middle">8번 · is None?</text>
<path d="M618 70 L618 96 L190 96 L190 110" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="618" y1="96" x2="618" y2="110" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="200" y="90" font-size="14" fill="#666660">예</text>
<text x="628" y="90" font-size="14" fill="#666660">아니오</text>
<rect x="20" y="114" width="340" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="190" y="144.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">새 티켓 (미리 채움)</text>
<text x="190" y="164.04" font-size="14" fill="#292929" text-anchor="middle">make_ticket → tickets.append</text>
<text x="190" y="183.64" font-size="14" fill="#292929" text-anchor="middle">→ 「새 티켓」</text>
<rect x="380" y="114" width="320" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="144.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">9번 · merge_alert  4~6번</text>
<text x="540" y="164.04" font-size="14" fill="#292929" text-anchor="middle">count + 1 · incidents.append</text>
<text x="540" y="183.64" font-size="14" fill="#292929" text-anchor="middle">updated_at = minute → 「병합」</text>
<text x="20" y="244" font-size="16" fill="#292929" font-weight="700">단계 3 · TCK-1 상태 바꾸기 (change_ticket_status, 미리 채움)</text>
<rect x="20" y="260" width="220" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="130" y="290.24" font-size="14" fill="#292929" text-anchor="middle">50분 · kim.sec</text>
<text x="130" y="309.84" font-size="14" fill="#292929" text-anchor="middle">열림 → 확인 중</text>
<line x1="242" y1="295" x2="248" y2="295" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="250" y="260" width="220" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="290.24" font-size="14" fill="#292929" text-anchor="middle">65분 · kim.sec</text>
<text x="360" y="309.84" font-size="14" fill="#292929" text-anchor="middle">확인 중 → 해결</text>
<line x1="472" y1="295" x2="478" y2="295" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="480" y="260" width="220" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="590" y="290.24" font-size="14" fill="#292929" text-anchor="middle">70분 · lee.soc</text>
<text x="590" y="309.84" font-size="14" fill="#292929" text-anchor="middle">해결 → 열림 · 거절됨</text>
<text x="20" y="372" font-size="14" fill="#666660">댓글 기록 2줄: kim.sec · 50분 · 열림 → 확인 중 / kim.sec · 65분 · 확인 중 → 해결</text>
</svg>
