<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>대응은 탐지·분류·조치·보고 네 단계이고 Module 5 전체가 이 흐름을 따른다</title>
<desc>네 단계 상자 아래에 이 Module에서 각 단계를 어디서 다루는지 적었다. 맨 아래는 Splunk SOAR, Cortex XSOAR, Microsoft Sentinel 모두 알림이 오면 실행되는 대응 절차를 플레이북이라 부른다는 점이다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">대응 흐름 네 단계</text>
<rect x="20.0" y="52" width="147.5" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="85.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="93.75" dy="0.0" font-weight="700">탐지</tspan></text>
<rect x="197.5" y="52" width="147.5" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="85.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="271.25" dy="0.0" font-weight="700">분류</tspan></text>
<line x1="170.5" y1="80.0" x2="193.5" y2="80.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="375.0" y="52" width="147.5" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="85.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="448.75" dy="0.0" font-weight="700">조치</tspan></text>
<line x1="348.0" y1="80.0" x2="371.0" y2="80.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="552.5" y="52" width="147.5" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="85.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="626.25" dy="0.0" font-weight="700">보고</tspan></text>
<line x1="525.5" y1="80.0" x2="548.5" y2="80.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20.0" y="122" width="147.5" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="165.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="93.75" dy="0.0">Module 4 점수 파일</tspan><tspan x="93.75" dy="19.6">(오늘의 입력)</tspan></text>
<rect x="197.5" y="122" width="147.5" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="165.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="271.25" dy="0.0">오늘 실습 1-2</tspan><tspan x="271.25" dy="19.6">분류됨 상태</tspan></text>
<rect x="375.0" y="122" width="147.5" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="155.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="448.75" dy="0.0">오늘은 연습용</tspan><tspan x="448.75" dy="19.6">시스템에서</tspan><tspan x="448.75" dy="19.6">실제는 Unit 2 ~ 5</tspan></text>
<rect x="552.5" y="122" width="147.5" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="155.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="626.25" dy="0.0">오늘 감사 기록</tspan><tspan x="626.25" dy="19.6">Unit 3 ~ 8 에서</tspan><tspan x="626.25" dy="19.6">티켓 · 알림 · 리포트</tspan></text>
<text x="20" y="256" font-size="16" fill="#292929" font-weight="700">현장의 SOAR 제품에도 플레이북이 있다</text>
<rect x="20.0" y="270" width="210.7" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="300.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="125.35" dy="0.0">Splunk SOAR</tspan></text>
<rect x="254.7" y="270" width="210.7" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="300.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.04999999999995" dy="0.0">Cortex XSOAR</tspan></text>
<rect x="489.3" y="270" width="210.7" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="300.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="594.65" dy="0.0">Microsoft Sentinel</tspan></text>
<rect x="20" y="334" width="680" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="364.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">세 제품 모두 「알림이 오면 실행되는 대응 절차」를 플레이북이라 부른다</tspan></text>
</svg>
