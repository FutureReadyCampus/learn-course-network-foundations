<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>도전 1-2 의 여섯 가지 할 일을 각각 한 줄 코드와 짝지은 요점 지도</title>
<desc>왼쪽은 하려는 일, 오른쪽은 그 일을 하는 코드다. 이미 잠긴 계정과 잠금 한도를 and · len · &gt;= 로 확인하고, startswith 로 건너뛴 기록을 고른다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">도전 1-2 정리: 하려는 일과 코드</text>
<rect x="20" y="56" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="80.35" font-size="15" fill="#292929" text-anchor="middle">두 조건 모두 참이면</text>
<polyline points="188,76 214,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="56" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="80.06" font-size="14" fill="#292929" text-anchor="middle">if action == "계정 잠금" and entity in state["locked_users"]:</text>
<rect x="20" y="106" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="130.35" font-size="15" fill="#292929" text-anchor="middle">리스트의 개수</text>
<polyline points="188,126 214,126" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="106" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="130.06" font-size="14" fill="#292929" text-anchor="middle">len(state["locked_users"])</text>
<rect x="20" y="156" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="180.35" font-size="15" fill="#292929" text-anchor="middle">이상이면</text>
<polyline points="188,176 214,176" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="156" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="180.06" font-size="14" fill="#292929" text-anchor="middle">&gt;=</text>
<rect x="20" y="206" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="230.35" font-size="15" fill="#292929" text-anchor="middle">같지 않으면</text>
<polyline points="188,226 214,226" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="206" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="230.06" font-size="14" fill="#292929" text-anchor="middle">if skip_reason != "":</text>
<rect x="20" y="256" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="280.35" font-size="15" fill="#292929" text-anchor="middle">함수 결과를 리턴</text>
<polyline points="188,276 214,276" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="256" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="280.06" font-size="14" fill="#292929" text-anchor="middle">return run_action(action, incident, state)</text>
<rect x="20" y="306" width="166" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="103" y="330.35" font-size="15" fill="#292929" text-anchor="middle">어떤 말로 시작하면</text>
<polyline points="188,326 214,326" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="218" y="306" width="482" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="459" y="330.06" font-size="14" fill="#292929" text-anchor="middle">if result_text.startswith("건너뜀"):</text>
</g>
</svg>
