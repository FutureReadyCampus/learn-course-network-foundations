<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>올리기 전에 비밀 값, 연락처, 실제 이름과 IP, 캡처 속 개인 정보를 한 줄씩 확인한다</title>
<desc>공개 전 점검 체크리스트 네 칸이다. .env 와 API 키와 토큰, 개인 이메일과 전화번호, 실습 속 가상 이름과 연습용 IP 가 아닌 실제 이름과 IP, 화면 캡처 속 사용자 이름을 확인한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">공개 전 점검</text>
<rect x="20" y="56" width="330" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="100.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="185.0" dy="0" font-weight="700">1. 비밀 값</tspan><tspan x="185.0" dy="21.0">.env 내용 · API 키 · 토큰이 없다</tspan></text>
<rect x="370" y="56" width="330" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="100.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="535.0" dy="0" font-weight="700">2. 연락처</tspan><tspan x="535.0" dy="21.0">개인 이메일 · 전화번호가 없다</tspan></text>
<rect x="20" y="176" width="330" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="220.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="185.0" dy="0" font-weight="700">3. 이름과 IP</tspan><tspan x="185.0" dy="21.0">dami · 198.51.100.90 같은 연습용만</tspan></text>
<rect x="370" y="176" width="330" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="220.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="535.0" dy="0" font-weight="700">4. 화면 캡처</tspan><tspan x="535.0" dy="21.0">내 사용자 이름 · 다른 창이 안 보인다</tspan></text>
<text x="20" y="320" font-size="14" fill="#666660" text-anchor="start">이미 올린 키가 있으면 지우기 전에 그 서비스에서 키부터 폐기한다</text>
</svg>
