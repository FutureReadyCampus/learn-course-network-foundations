<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>글감에 맞는 출력과 근거 코드에서 직접 확인한 것을 쓴다</title>
<desc>막힐 때 힌트를 글감별로 나눈 표다. 글감 1 은 확인 명령 출력, 글감 2 는 승인 조건과 INC-002 승인 대기 출력, 글감 3 은 if entity in users_info 와 INC-005 출력 줄을 붙인다. 감사 기록은 한두 줄만 붙인다.</desc>
