<text y="146.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="440.0" dy="0">approval != &quot;자동&quot; 조건과 INC-002 승인 대기 확인</tspan></text>
<rect x="20" y="178" width="150" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
