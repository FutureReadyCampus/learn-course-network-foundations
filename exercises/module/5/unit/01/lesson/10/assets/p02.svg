<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>플레이북 실행 글을 올리고 전체 글 목록에서 열기</title>
<desc>_posts 폴더에 글을 만들고 제목과 날짜를 적습니다. 플레이북 실행에서 확인한 내용을 저장해 올린 뒤, 전체 글 목록에서 제목을 눌러 본문을 확인합니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">글 틀로 쓰고 올리기</text>
<rect x="20" y="54" width="460" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="78.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0" font-weight="700">1. _posts › New File (VS Code)</tspan><tspan x="250.0" dy="21.0">_posts/YYYY-MM-DD-playbook-approval.md</tspan></text>
<line x1="250" y1="114" x2="250" y2="124" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="126" width="460" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="150.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0" font-weight="700">2. 글 틀 붙여 넣기 · 머리말 고치기</tspan><tspan x="250.0" dy="21.0">제목과 작성일 · date 는 파일 날짜</tspan></text>
<line x1="250" y1="186" x2="250" y2="196" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="198" width="460" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="222.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0" font-weight="700">3. 문제·판단·결과 적기</tspan><tspan x="250.0" dy="21.0">올리기는 공개 전 점검 뒤</tspan></text>
<line x1="250" y1="258" x2="250" y2="268" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="270" width="460" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="294.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0" font-weight="700">4. 근거 링크 붙이기</tspan><tspan x="250.0" dy="21.0">soar_response/playbook_runner.py</tspan></text>
<rect x="500" y="54" width="200" height="132" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="93.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="600.0" dy="0" font-weight="700">글 틀 고르기</tspan><tspan x="600.0" dy="21.0">post-short (기본)</tspan><tspan x="600.0" dy="21.0">post-stuck (막힘)</tspan><tspan x="600.0" dy="21.0">post-practice (응용)</tspan></text>
<rect x="500" y="198" width="200" height="132" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="237.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="600.0" dy="0" font-weight="700">올린 뒤 확인</tspan><tspan x="600.0" dy="21.0">전체 글에서 찾기</tspan><tspan x="600.0" dy="21.0">제목을 눌러</tspan><tspan x="600.0" dy="21.0">본문을 확인</tspan></text>
<text x="20" y="360" font-size="14" fill="#666660" text-anchor="start">포트폴리오 준비와 글 틀 내용: Module 3 Unit 1 시작하기의 4쪽 · 10쪽</text>
</svg>
