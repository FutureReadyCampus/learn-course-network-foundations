<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Unit 1 파일을 확인하고 데이터 파일 세 개를 만들어 6 4 1이 나오는지 본다</title>
<desc>soar_response 폴더 배치도다. Unit 1에서 만든 파일 네 개를 확인하고 users_info.json, source_ips.json, trusted_ips.json을 새로 만든다. 확인 명령은 6 4 1을 출력하고, 플레이북 등록 값도 점검한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">soar_response 폴더: Unit 1 파일 + 새 데이터 파일</text>
<rect x="20" y="52" width="320" height="196" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="113.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="180.0" dy="0.0" font-weight="700">Unit 1 에서 만든 파일 (확인)</tspan><tspan x="180.0" dy="21.0">config/</tspan><tspan x="180.0" dy="21.0">incident.py</tspan><tspan x="180.0" dy="21.0">incident_samples.json</tspan><tspan x="180.0" dy="21.0">playbook_runner.py</tspan></text>
<rect x="380" y="52" width="320" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="77.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0.0" font-weight="700">users_info.json · 6명</tspan><tspan x="540.0" dy="19.6">재직(employed) · VIP(vip)</tspan></text>
<rect x="380" y="120" width="320" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="145.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0.0" font-weight="700">source_ips.json · 4명</tspan><tspan x="540.0" dy="19.6">사용자별 접속 IP</tspan></text>
<rect x="380" y="188" width="320" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="213.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0.0" font-weight="700">trusted_ips.json · 1개</tspan><tspan x="540.0" dy="19.6">신뢰 IP 203.0.113.80</tspan></text>
<rect x="20" y="266" width="680" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="296.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">확인 1: 세 파일의 개수 → 6 4 1 이 나오면 성공</tspan></text>
<text x="20" y="346" font-size="15" fill="#292929" font-weight="700">확인 2: 플레이북 등록 값이 아래와 같아야 한다</text>
<rect x="20.0" y="358" width="216.0" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="386.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="128.0" dy="0.0">PB-001 · high · 자동</tspan></text>
<rect x="252.0" y="358" width="216.0" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="386.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">PB-002 · mid · 승인 필요</tspan></text>
<rect x="484.0" y="358" width="216.0" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="386.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="592.0" dy="0.0">PB-003 · low · 승인 필요</tspan></text>
</svg>
