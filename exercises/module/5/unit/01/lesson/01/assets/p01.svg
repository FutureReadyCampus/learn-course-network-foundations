<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Module 4 점수를 받아 Module 5 다섯 Unit 으로 대응을 자동화하고, 오늘은 Unit 1 을 한다</title>
<desc>왼쪽은 Module 4 의 점수와 등급이 Module 5 의 다섯 Unit 으로 이어지는 지도이고 Unit 1 이 강조되어 있다. 오른쪽은 오늘의 계획 3시간과 핵심 실습 세 개, 선택인 응용 두 개다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 5 자동 대응 지도와 오늘의 계획</text>
<rect x="20" y="52" width="420" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="77.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Module 4 · 대상별 점수와 등급 (알림 5건)</tspan></text>
<line x1="230" y1="92" x2="230" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="110" width="420" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="131.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Unit 1 플레이북으로 알림 처리하기</tspan><tspan x="230.0" dy="19.6">플레이북 · 실행기 · 맥락 보강</tspan></text>
<rect x="20" y="170" width="420" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="191.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Unit 2 계정 잠그고 세션 끊기</tspan><tspan x="230.0" dy="19.6">실행한 뒤 다시 확인하고 기록</tspan></text>
<rect x="20" y="230" width="420" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="251.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Unit 3 되돌리고 티켓 남기기</tspan><tspan x="230.0" dy="19.6">오탐 조치 되돌리기 · 응답 기한</tspan></text>
<rect x="20" y="290" width="420" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="311.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Unit 4 승인 게이트와 오탐 되돌리기</tspan><tspan x="230.0" dy="19.6">위험 점수로 자동 · 승인 나누기</tspan></text>
<rect x="20" y="350" width="420" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="371.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="700">Unit 5 통합 엔진과 최종 회고</tspan><tspan x="230.0" dy="19.6">엔진 하나로 잇고 정책 점검</tspan></text>
<rect x="460" y="52" width="240" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="90.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="580.0" dy="0" font-weight="700">오늘의 계획 (3시간)</tspan><tspan x="580.0" dy="21.0">시작하기 15분</tspan><tspan x="580.0" dy="21.0">실습 약 110분</tspan><tspan x="580.0" dy="21.0">글쓰기 40분</tspan><tspan x="580.0" dy="21.0">마무리 15분</tspan></text>
<rect x="460" y="214" width="240" height="104" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="239.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="580.0" dy="0" font-weight="700">핵심 실습 (모두)</tspan><tspan x="580.0" dy="21.0">1-1 플레이북 쓰기</tspan><tspan x="580.0" dy="21.0">1-2 알림 5건 일괄 처리</tspan><tspan x="580.0" dy="21.0">1-3 맥락 보강</tspan></text>
<rect x="460" y="330" width="240" height="82" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="356.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="580.0" dy="0" font-weight="700">응용 1-1 · 1-2</tspan><tspan x="580.0" dy="19.6">선택: 시간이 남을 때</tspan><tspan x="580.0" dy="19.6">완성본은 「제공 파일」</tspan></text>
</svg>
