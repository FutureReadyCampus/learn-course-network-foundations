<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>soar_response 폴더에 config 폴더와 데이터 파일 다섯 개를 만들고 5 6 4 1 을 확인한다</title>
<desc>network-study-notes 아래 soar_response 폴더와 config 폴더를 만든다. 데이터 파일 다섯 개는 지금 붙여 넣어 만들고, 플레이북 등록 파일은 실습 1-1에서 만든다. 확인 명령은 5 6 4 1 을 출력해야 한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">soar_response 폴더에 지금 만들 파일</text>
<rect x="20" y="52" width="300" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="77.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="170.0" dy="0" font-weight="700">network-study-notes/</tspan></text>
<rect x="50" y="104" width="270" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="129.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="185.0" dy="0" font-weight="700">soar_response/ (새로 만듦)</tspan></text>
<path d="M34,92 V124 H50" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="156" width="320" height="38" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="179.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">config/playbook_registry.json · 실습 1-1</tspan></text>
<path d="M70,144 V175 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="200" width="320" height="38" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="223.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">incident_samples.json · 알림 5건</tspan></text>
<path d="M70,144 V219 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="244" width="320" height="38" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="267.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">system_state.json · 빈 상태</tspan></text>
<path d="M70,144 V263 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="288" width="320" height="38" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="311.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">users_info.json · 재직 · VIP</tspan></text>
<path d="M70,144 V307 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="332" width="320" height="38" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="355.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">source_ips.json · 접속 IP</tspan></text>
<path d="M70,144 V351 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="90" y="376" width="320" height="38" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="399.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="250.0" dy="0">trusted_ips.json · 신뢰 IP</tspan></text>
<path d="M70,144 V395 H90" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="440" y="104" width="260" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="142.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="570.0" dy="0" font-weight="700">확인 명령</tspan><tspan x="570.0" dy="21.0">네 파일의 건수를 출력</tspan><tspan x="570.0" dy="21.0">알림 · 계정 · IP · 신뢰 IP</tspan><tspan x="570.0" dy="21.0">→ 5 6 4 1 이면 성공</tspan><tspan x="570.0" dy="21.0">soar_response 폴더에서 친다</tspan></text>
<rect x="440" y="270" width="260" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="294.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="570.0" dy="0" font-weight="700">파일 만드는 법</tspan><tspan x="570.0" dy="21.0">New File · 이름 그대로</tspan><tspan x="570.0" dy="21.0">복사 버튼으로 붙여 넣기</tspan></text>
</svg>
