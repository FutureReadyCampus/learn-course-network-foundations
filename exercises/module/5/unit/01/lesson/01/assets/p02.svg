<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Module 4 점수 기록 5건에 번호와 상태를 붙이면 오늘의 알림 파일이 된다</title>
<desc>Module 4 Unit 4 실습 4-1 이 저장한 unit05_risk_scores.json 의 기록 한 건(대상, 점수, 등급, 이유)에 id 와 status 를 붙이면 incident_samples.json 의 인시던트 한 건이 된다. Module 4 파일이 없어도 코드 상자로 만든다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 4 결과에서 오늘의 알림으로</text>
<rect x="20" y="52" width="290" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="76.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="165.0" dy="0" font-weight="700">Module 4 Unit 4 · 실습 4-1</tspan><tspan x="165.0" dy="21.0">unit05_risk_scores.json</tspan></text>
<rect x="20" y="124" width="290" height="150" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="162.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="165.0" dy="0" font-weight="700">기록 한 건 (dami)</tspan><tspan x="165.0" dy="21.0">entity: dami</tspan><tspan x="165.0" dy="21.0">score: 60</tspan><tspan x="165.0" dy="21.0">grade: high</tspan><tspan x="165.0" dy="21.0">reasons: [퇴사한 계정]</tspan></text>
<line x1="312" y1="199" x2="404" y2="199" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="358" y="186" font-size="14" fill="#666660" text-anchor="middle" font-weight="700">+ id · status</text>
<rect x="410" y="52" width="290" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="76.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="555.0" dy="0" font-weight="700">Module 5 Unit 1</tspan><tspan x="555.0" dy="21.0">incident_samples.json</tspan></text>
<rect x="410" y="124" width="290" height="150" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="162.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="555.0" dy="0" font-weight="700">인시던트 한 건</tspan><tspan x="555.0" dy="21.0">id: INC-001</tspan><tspan x="555.0" dy="21.0">entity · score · grade</tspan><tspan x="555.0" dy="21.0">reasons 는 그대로</tspan><tspan x="555.0" dy="21.0">status: 탐지됨</tspan></text>
<rect x="20" y="292" width="680" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="321.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0" font-weight="700">Module 4 파일이 없어도 됩니다</tspan><tspan x="360.0" dy="21.0">다음 페이지의 코드 상자를 붙여 넣어 incident_samples.json 을 만든다</tspan></text>
</svg>
