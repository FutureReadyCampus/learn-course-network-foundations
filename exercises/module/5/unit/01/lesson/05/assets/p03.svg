<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>세 데이터 파일과 알림 5건을 보강하고 단계 1~3에서 알림별 맥락과 VIP 알림 수를 출력한다</title>
<desc>입력, 프로그램, 출력 흐름도다. 알림 5건과 계정 정보, 접속 IP, 신뢰 IP 파일을 enrichment.py와 exercise1-3_run.py가 처리해 단계 1 개수, 단계 2 알림별 정보, 단계 3 VIP 계정 알림 수를 출력한다.</desc>
