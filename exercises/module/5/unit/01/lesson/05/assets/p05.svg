<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오늘 한 일과 파일을 확인하고, git status 로 살핀 뒤 보고서를 채우고 깃허브에 올린다</title>
<desc>마무리 순서도다. 오늘 한 일 다섯 가지 확인, soar_response 폴더의 파일 확인, security-agent-toolkit 으로 옮겨 git status 확인, 보고서 마무리 칸 채우기, git add · commit · push, 브라우저에서 확인 순서다. .env 가 보이면 멈춘다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 Unit 마무리 · 깃허브에 올리기</text>
<rect x="20" y="56" width="320" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="85.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="180.0" dy="0" font-weight="700">1. 오늘 한 일 확인</tspan><tspan x="180.0" dy="21.0">실습 1-1 · 1-2 · 1-3 · 제공 파일</tspan></text>
<rect x="380" y="56" width="320" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="85.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0" font-weight="700">2. 파일 확인</tspan><tspan x="540.0" dy="21.0">ls · ls config (soar_response)</tspan></text>
<rect x="20" y="166" width="320" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="195.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="180.0" dy="0" font-weight="700">3. cd .. → git status</tspan><tspan x="180.0" dy="21.0">.env · .venv 가 보이면 멈춤</tspan></text>
<rect x="380" y="166" width="320" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="195.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0" font-weight="700">4. 보고서 마무리 (가)</tspan><tspan x="540.0" dy="21.0">올리기 전에 채운다</tspan></text>
<rect x="20" y="276" width="320" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="305.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="180.0" dy="0" font-weight="700">5. git add · commit · push</tspan><tspan x="180.0" dy="21.0">거절되면 git pull --no-rebase</tspan></text>
<rect x="380" y="276" width="320" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="305.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0" font-weight="700">6. 브라우저에서 확인</tspan><tspan x="540.0" dy="21.0">soar_response 폴더와 파일</tspan></text>
<line x1="340" y1="91" x2="378" y2="91" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<path d="M540,126 V146 H180 V150" fill="none" stroke="#666660" stroke-width="2"/>
<line x1="180" y1="150" x2="180" y2="164" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="340" y1="201" x2="378" y2="201" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<path d="M540,236 V256 H180 V260" fill="none" stroke="#666660" stroke-width="2"/>
<line x1="180" y1="260" x2="180" y2="274" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="340" y1="311" x2="378" y2="311" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="20" y="388" font-size="14" fill="#666660" text-anchor="start">응용을 했다면 응용 파일까지 만든 뒤 3 ~ 5 를 한 번 더 한다</text>
</svg>
