<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>run_playbook은 승인이 자동이 아니면 기록 후 멈추고, 자동이면 실행 후 조치됨으로 옮긴다</title>
<desc>위 줄은 오늘 쓰는 파일 네 개다. 아래 순서도는 run_playbook이 인시던트 한 건을 처리하는 순서로, 직접 쓰는 ① · ② 의 위치와 미리 채운 곳을 함께 적었다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
