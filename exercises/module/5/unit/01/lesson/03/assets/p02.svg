<line x1="182.5" y1="79.0" x2="189.5" y2="79.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="367.0" y="48" width="159.5" height="62" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="74.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="446.75" dy="0.0" font-weight="700">incident.py</tspan><tspan x="446.75" dy="19.6">완성본 함수</tspan></text>
<line x1="356.0" y1="79.0" x2="363.0" y2="79.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="540.5" y="48" width="159.5" height="62" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="74.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="620.25" dy="0.0" font-weight="700">action_log.json</tspan><tspan x="620.25" dy="19.6">감사 기록</tspan></text>
<line x1="529.5" y1="79.0" x2="536.5" y2="79.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="200" y="132" width="320" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
