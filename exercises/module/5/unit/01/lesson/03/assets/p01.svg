<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>알림 5건을 한 번에 처리하되 승인이 필요한 건은 멈추고 모두 기록한다</title>
<desc>알림 5건이 한 번의 실행에 들어가 승인 값에 따라 둘로 나뉜다. 자동이면 실행하고, 승인이 필요하면 멈춘다. 두 경우 모두 한 일과 하지 않은 일이 기록에 남는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰: 알림 5건 한 번에 처리</text>
<rect x="20" y="120" width="150" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="149.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="95.0" dy="0.0" font-weight="700">알림 5건</tspan><tspan x="95.0" dy="21.0">INC-001 ~</tspan><tspan x="95.0" dy="21.0">INC-005</tspan></text>
<line x1="172" y1="165" x2="206" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="210" y="120" width="150" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="149.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="285.0" dy="0.0" font-weight="700">한 번 실행</tspan><tspan x="285.0" dy="21.0">플레이북</tspan><tspan x="285.0" dy="21.0">실행기</tspan></text>
<polyline points="362,150 390,150 390,92 412,92" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="362,180 390,180 390,238 412,238" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="416" y="56" width="284" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="86.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="558.0" dy="0.0" font-weight="700">승인이 「자동」</tspan><tspan x="558.0" dy="21.0">→ 액션 실행</tspan></text>
<rect x="416" y="202" width="284" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="232.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="558.0" dy="0.0" font-weight="700">허락이 필요 (예: IP 차단)</tspan><tspan x="558.0" dy="21.0">→ 실행하지 않고 멈춤</tspan></text>
<rect x="20" y="296" width="680" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="322.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0" font-weight="700">한 일과 하지 않은 일을 모두 기록</tspan><tspan x="360.0" dy="21.0">→ 「누가 무엇을 언제 했는지」 물으면 답할 수 있다</tspan></text>
</svg>
