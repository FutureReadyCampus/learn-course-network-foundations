<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 1-3 앞에서 routing.py 와 safe_runner.py 완성본을 복사해 만들고 ok 를 확인한다</title>
<desc>실습 1-2 의 incident.py 를 불러 쓰는 제공 파일 두 개를 soar_response 폴더에 붙여 넣는다. import 확인 명령이 ok 를 출력하면 된다. 두 파일은 도전 1-1 · 1-2 와 다음 Unit 의 도전에서 쓴다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">제공 파일 두 개: 복사해 만들고 확인하기</text>
<rect x="20" y="140" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="169.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="120.0" dy="0" font-weight="700">incident.py</tspan><tspan x="120.0" dy="21.0">실습 1-2에서 만듦</tspan></text>
<rect x="270" y="60" width="220" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="89.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="380.0" dy="0" font-weight="700">routing.py</tspan><tspan x="380.0" dy="21.0">경로 정하기</tspan></text>
<rect x="270" y="220" width="220" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="249.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="380.0" dy="0" font-weight="700">safe_runner.py</tspan><tspan x="380.0" dy="21.0">안전한 실행기</tspan></text>
<line x1="220" y1="165" x2="268" y2="105" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="220" y1="185" x2="268" y2="245" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="120" y="234" font-size="14" fill="#666660" text-anchor="middle">두 파일 모두 import</text>
<rect x="530" y="60" width="170" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="90.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="615.0" dy="0" font-weight="700">도전 1-1</tspan><tspan x="615.0" dy="19.6">Unit 2 · 3 도전</tspan></text>
<rect x="530" y="220" width="170" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="250.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="615.0" dy="0" font-weight="700">도전 1-2</tspan><tspan x="615.0" dy="19.6">Unit 2 도전 2-2</tspan></text>
<line x1="490" y1="95" x2="528" y2="95" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="490" y1="255" x2="528" y2="255" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="310" width="680" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="341.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0">확인: python -c &quot;import routing, safe_runner; print(&#x27;ok&#x27;)&quot;  →  ok</tspan></text>
</svg>
