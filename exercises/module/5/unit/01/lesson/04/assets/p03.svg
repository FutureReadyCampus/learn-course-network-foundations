<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>safe_runner 는 끝난 알림, 승인 필요, 이미 잠긴 계정, 잠금 한도 3개를 차례로 점검한다</title>
<desc>run_playbook_safe 는 이미 끝난 알림이면 이미 처리됨, 승인이 자동이 아니면 승인 대기를 리턴한다. 액션마다 find_skip_reason 이 이미 잠긴 계정과 잠금 한도 3개를 점검하고, 이유가 없을 때만 run_action 으로 실행한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">safe_runner.py 의 점검 순서</text>
<rect x="20" y="56" width="430" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="86.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="235.0" dy="0">① 이미 끝난 알림인가? (조치됨 · 보고됨 · 종료)</tspan></text>
<line x1="450" y1="81" x2="488" y2="81" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="469" y="72" font-size="14" fill="#1f7a4a" text-anchor="middle" font-weight="700">예</text>
<rect x="490" y="56" width="210" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="86.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0" font-weight="700">이미 처리됨</tspan></text>
<line x1="235" y1="106" x2="235" y2="118" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="120" width="430" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="150.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="235.0" dy="0">② 승인이 「자동」이 아닌가?</tspan></text>
<line x1="450" y1="145" x2="488" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="469" y="136" font-size="14" fill="#1f7a4a" text-anchor="middle" font-weight="700">예</text>
<rect x="490" y="120" width="210" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="150.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0" font-weight="700">승인 대기</tspan></text>
<line x1="235" y1="170" x2="235" y2="182" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="184" width="430" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="214.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="235.0" dy="0">③ 계정 잠금인데 이미 잠긴 계정인가?</tspan></text>
<line x1="450" y1="209" x2="488" y2="209" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="469" y="200" font-size="14" fill="#1f7a4a" text-anchor="middle" font-weight="700">예</text>
<rect x="490" y="184" width="210" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="214.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0" font-weight="700">건너뜀</tspan></text>
<line x1="235" y1="234" x2="235" y2="246" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="248" width="430" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="278.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="235.0" dy="0">④ 잠근 계정이 3개 이상인가?</tspan></text>
<line x1="450" y1="273" x2="488" y2="273" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="469" y="264" font-size="14" fill="#1f7a4a" text-anchor="middle" font-weight="700">예</text>
<rect x="490" y="248" width="210" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="278.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0" font-weight="700">건너뜀 (담당자 확인)</tspan></text>
<line x1="235" y1="306" x2="235" y2="324" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="326" width="430" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="356.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="235.0" dy="0" font-weight="700">모두 아니면 run_action 으로 실행</tspan></text>
<text x="470" y="356" font-size="14" fill="#666660" text-anchor="start">①② 는 알림 한 건, ③④ 는 액션 하나</text>
</svg>
