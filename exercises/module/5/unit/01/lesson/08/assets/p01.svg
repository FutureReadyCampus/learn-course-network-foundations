<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>설명하는 답은 한 예이고 핵심이 같으면 맞다</title>
<desc>내 답과 정답 예를 비교하는 판단 그림이다. 핵심이 같으면 맞고, 다르면 해당 실습을 다시 읽고 고친다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답을 보는 방법</text>
<rect x="20" y="90" width="150" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="135.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="95.0" dy="0.0" font-weight="700">내 답</tspan></text>
<rect x="20" y="190" width="150" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="225.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="95.0" dy="0.0" font-weight="700">정답 (한 예)</tspan></text>
<line x1="172" y1="130" x2="226" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="172" y1="220" x2="226" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polygon points="330,110 430,170 330,230 230,170" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="330" y="166" font-size="15" fill="#292929" text-anchor="middle">핵심이</text>
<text x="330" y="186" font-size="15" fill="#292929" text-anchor="middle">같은가?</text>
<polyline points="430,170 460,170 460,110 486,110" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<polyline points="430,170 460,170 460,230 486,230" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="490" y="80" width="210" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="115.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0.0" font-weight="700">예 → 맞음</tspan></text>
<rect x="490" y="200" width="210" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="224.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="595.0" dy="0.0" font-weight="700">아니요 → 실습을</tspan><tspan x="595.0" dy="21.0">다시 읽고 고치기</tspan></text>
</svg>
