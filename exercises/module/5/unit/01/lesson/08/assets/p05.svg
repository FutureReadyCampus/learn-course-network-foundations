<text x="360" y="348.91" font-size="14" fill="#292929" text-anchor="middle">INC-002 reasons: 평소와 다른 IP · 대량 다운로드 → IP 와 무관한 규칙이 있어 기본</text>
<text x="360" y="369.21" font-size="14" fill="#292929" text-anchor="middle">INC-004 reasons: 업무 시간 밖 로그인 · 평소와 다른 IP → 모두 IP 관련이라 오탐 종료</text>
