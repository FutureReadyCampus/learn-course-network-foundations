<text x="570" y="106.225" font-size="15" fill="#292929" text-anchor="middle">INC-001 · 002 · 005</text>
<rect x="440" y="142" width="260" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
