<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 1-1 보고서는 PB-003·확인 출력, 고친 곳 수, 승인 값 이유 칸을 채우고, 승인 값 이유는 응용이다</title>
<desc>실습 1-1 보고서에서 채울 칸 체크리스트다. (가) PB-003의 액션과 승인, 확인 출력, (나) 고친 곳 개수와 100건일 때의 문제, 응용 (다) 승인 값과 IP가 대상이라는 근거, 잘못 차단했을 때의 영향이다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 1-1 보고서에서 채울 칸</text>
<rect x="20" y="52" width="680" height="82" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="77.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0" font-weight="700">(가) [핵심 질문]</tspan><tspan x="360.0" dy="21.0">① PB-003 의 액션  ② PB-003 의 승인</tspan><tspan x="360.0" dy="21.0">③ 5번 확인 명령의 출력 (코드 상자)</tspan></text>
<rect x="20" y="146" width="680" height="82" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="171.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0" font-weight="700">(나) [핵심 질문]</tspan><tspan x="360.0" dy="21.0">① system_state.json 을 직접 고친 곳의 개수</tspan><tspan x="360.0" dy="21.0">② 알림이 100건일 때 생길 문제</tspan></text>
<rect x="20" y="240" width="680" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="274.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0" font-weight="700">(다) [응용]</tspan><tspan x="360.0" dy="21.0">① 승인 값  ② 대상이 사용자 계정이 아니라 IP 라는 점을</tspan><tspan x="360.0" dy="21.0">근거로 한 이유  ③ 잘못 차단했을 때의 영향</tspan></text>
</svg>
