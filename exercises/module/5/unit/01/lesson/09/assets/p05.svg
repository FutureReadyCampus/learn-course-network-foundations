<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 1-3 보고서는 출력과 번호, INC-005 초기값 원인, reasons 비교, 마무리 칸을 채운다</title>
<desc>실습 1-3 과 마무리 보고서에서 채울 칸 체크리스트다. (가) 출력 전체와 퇴사 · VIP 알림 번호와 VIP 수, (나) INC-005 맥락이 초기값인 원인과 재직으로 판정될 때의 문제, (다) INC-002 와 INC-004 의 reasons 비교, 마무리 (가) .env · .venv 확인이다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 1-3 · 마무리 보고서에서 채울 칸</text>
<rect x="20" y="52" width="680" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="74.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0" font-weight="700">(가)</tspan><tspan x="360.0" dy="21.0">① 출력 전체 (코드 상자)  ② 「퇴사」 알림 번호</tspan><tspan x="360.0" dy="21.0">③ VIP 「예」 알림 번호  ④ VIP 계정 알림 수</tspan></text>
<rect x="20" y="140" width="680" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="162.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0" font-weight="700">(나) [핵심 질문]</tspan><tspan x="360.0" dy="21.0">① INC-005 맥락이 초기값인 원인 (어느 if 인지)</tspan><tspan x="360.0" dy="21.0">② 확인 안 된 대상이 「재직」이면 생기는 문제</tspan></text>
<rect x="20" y="228" width="680" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="250.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0" font-weight="700">(다) [핵심 질문]</tspan><tspan x="360.0" dy="21.0">① INC-002 와 INC-004 의 reasons</tspan><tspan x="360.0" dy="21.0">② 같은 신뢰 IP 라고 같게 처리해도 되는지와 이유</tspan></text>
<rect x="20" y="316" width="680" height="62" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="341.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0" font-weight="700">마무리 (가)</tspan><tspan x="360.0" dy="21.0">① .env · .venv 가 보였는지  ② 보였다면 한 조치</tspan></text>
</svg>
