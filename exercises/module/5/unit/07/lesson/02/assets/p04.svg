<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 7-1 에서 직접 쓰는 코드를 함수별로 묶은 요점 지도</title>
<desc>왼쪽은 함수 이름, 오른쪽은 그 함수에서 직접 쓰는 줄이다. 빼서 리턴, 같지 않으면, 이상인지 리턴, 단계 번호 저장, 함수 결과가 참이면, 결과 저장, 1 늘리기를 모았다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">실습 7-1 정리 · 함수별로 쓰는 줄</text>
