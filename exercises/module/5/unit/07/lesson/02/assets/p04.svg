<text x="264" y="89.9" font-size="14" fill="#292929">return now - ticket["sla_due"]</text>
<line x1="232" y1="85.0" x2="248" y2="85.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="122" width="210" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125.0" y="163.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">needs_escalation</text>
<rect x="250" y="122" width="450" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="264" y="153.1" font-size="14" fill="#292929">if ticket["status"] != "열림":</text>
<text x="264" y="172.7" font-size="14" fill="#292929">return overdue_minutes(ticket, now) &gt;= 0</text>
<line x1="232" y1="158.0" x2="248" y2="158.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="206" width="210" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125.0" y="247.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">pick_level</text>
<rect x="250" y="206" width="450" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="264" y="237.1" font-size="14" fill="#292929">if overdue &gt;= step["overdue_minutes"]:</text>
<text x="264" y="256.7" font-size="14" fill="#292929">level = index + 1</text>
<line x1="232" y1="242.0" x2="248" y2="242.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="290" width="210" height="94" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125.0" y="342.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">exercise7-1_run.py</text>
<rect x="250" y="290" width="450" height="94" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="264" y="322.3" font-size="14" fill="#292929">if needs_escalation(ticket, now):</text>
<text x="264" y="341.9" font-size="14" fill="#292929">result = escalate_ticket(ticket, now, rules)</text>
<text x="264" y="361.5" font-size="14" fill="#292929">escalated_count = escalated_count + 1</text>
<line x1="232" y1="337.0" x2="248" y2="337.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
