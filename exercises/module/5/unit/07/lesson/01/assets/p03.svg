<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오류가 나면 증상을 보고 위치, 파일, 알림 서버를 확인해 고친다</title>
<desc>세 가지 증상마다 확인할 것과 고치는 방법을 나란히 놓았다. 위치가 다르면 cd soar_response, 모듈이 없으면 complete_files.md 에서 복사, ConnectionError 면 알림 서버를 다시 켠다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">오류가 나면 · 증상 → 확인 → 고치기</text>
<text x="125" y="68" font-size="15" font-weight="bold" fill="#666660" text-anchor="middle">증상</text>
<text x="360" y="68" font-size="15" font-weight="bold" fill="#666660" text-anchor="middle">확인</text>
<text x="595" y="68" font-size="15" font-weight="bold" fill="#666660" text-anchor="middle">고치기</text>
<rect x="20" y="82" width="210" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125.0" y="122.2" font-size="15" fill="#292929" text-anchor="middle">pwd 가 다르다</text>
<rect x="255" y="82" width="210" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="111.8" font-size="15" fill="#292929" text-anchor="middle">soar_response 로</text>
<text x="360.0" y="132.8" font-size="15" fill="#292929" text-anchor="middle">끝나나?</text>
<rect x="490" y="82" width="210" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="122.2" font-size="15" fill="#292929" text-anchor="middle">cd soar_response</text>
<line x1="232" y1="117" x2="253" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="467" y1="117" x2="488" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="168" width="210" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125.0" y="208.2" font-size="15" fill="#292929" text-anchor="middle">ModuleNotFoundError</text>
<rect x="255" y="168" width="210" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="198.1" font-size="14" fill="#292929" text-anchor="middle">Unit 6 파일 ·</text>
<text x="360.0" y="217.7" font-size="14" fill="#292929" text-anchor="middle">incident.py · notifier.py</text>
<rect x="490" y="168" width="210" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="197.8" font-size="15" fill="#292929" text-anchor="middle">complete_files.md</text>
<text x="595.0" y="218.8" font-size="15" fill="#292929" text-anchor="middle">에서 복사</text>
<line x1="232" y1="203" x2="253" y2="203" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="467" y1="203" x2="488" y2="203" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="254" width="210" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="125.0" y="283.8" font-size="15" fill="#292929" text-anchor="middle">[알림 실패]</text>
<text x="125.0" y="304.8" font-size="15" fill="#292929" text-anchor="middle">ConnectionError</text>
<rect x="255" y="254" width="210" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="283.8" font-size="15" fill="#292929" text-anchor="middle">알림 서버가</text>
<text x="360.0" y="304.8" font-size="15" fill="#292929" text-anchor="middle">켜져 있나?</text>
<rect x="490" y="254" width="210" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="283.8" font-size="15" fill="#292929" text-anchor="middle">python alert_server.py</text>
<text x="595.0" y="304.8" font-size="15" fill="#292929" text-anchor="middle">다시 실행</text>
<line x1="232" y1="289" x2="253" y2="289" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="467" y1="289" x2="488" y2="289" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
</svg>
