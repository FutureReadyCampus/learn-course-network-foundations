<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img">
<title>실습 2-1 실습 결과 기록에서 출력 붙여 넣기와 핵심 질문 두 개를 채운다</title>
<desc>(가) 출력 전체와 퇴사 · VIP 알림 번호, VIP 알림 수를 적는다. (나) INC-005 가 초기값으로 남은 원인, (다) INC-002 와 INC-004 의 reasons 비교는 핵심 질문이다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 결과 기록 · 실습 2-1 에서 채울 칸</text>
<rect x="20" y="52" width="72" height="94" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="56" y="103.64" font-size="16" fill="#292929" text-anchor="middle">(가)</text>
<rect x="102" y="52" width="598" height="94" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="114" y="81.6" font-size="15" fill="#292929">① 출력 전체 (코드 상자)</text>
<text x="114" y="103.35" font-size="15" fill="#292929">② 재직 「퇴사」 알림 번호 ③ VIP 「예」 알림 번호</text>
<text x="114" y="125.1" font-size="15" fill="#292929">④ 단계 3 의 VIP 계정 알림 수</text>
<rect x="20" y="158" width="72" height="94" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="56" y="209.64" font-size="16" fill="#292929" text-anchor="middle">(나)</text>
<rect x="102" y="158" width="598" height="94" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="114" y="187.6" font-size="15" fill="#292929">[핵심 질문] INC-005 의 맥락이 초기값으로 남은 원인</text>
<text x="114" y="209.35" font-size="15" fill="#292929">(lookup_account · lookup_source_ip 의 if 조건)</text>
<text x="114" y="231.1" font-size="15" fill="#292929">확인되지 않은 대상이 「재직」이면 생기는 문제</text>
<rect x="20" y="264" width="72" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="56" y="304.64" font-size="16" fill="#292929" text-anchor="middle">(다)</text>
<rect x="102" y="264" width="598" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="114" y="293.475" font-size="15" fill="#292929">[핵심 질문] INC-002 · INC-004 의 reasons 비교</text>
<text x="114" y="315.225" font-size="15" fill="#292929">같은 신뢰 IP 라는 근거만으로 같게 처리해도 되는지</text>
</g>
</svg>
