<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>알림은 맥락 붙이기와 경로 정하기를 거쳐 세 처리 중 하나로 가고, 실패는 목록에 모인다</title>
<desc>하루 흐름에서 알림은 맥락과 경로를 정한 뒤 오탐 종료, 승인 대기, 재시도하며 실행 중 하나로 처리된다. 끝내 실패한 기록은 collect_failures 로 모아 단계 6 에 담당자 확인 목록으로 출력한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">응용 2-2: 하루 흐름으로 알림을 처리하고 실패 목록을 만든다</text>
<rect x="20" y="56" width="150" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="79.91" font-size="14" fill="#292929" text-anchor="middle">① 맥락 붙이기</text>
<text x="95" y="100.21" font-size="14" fill="#292929" text-anchor="middle">(실습 1-3)</text>
<rect x="200" y="56" width="150" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="275" y="79.91" font-size="14" fill="#292929" text-anchor="middle">② 경로 정하기</text>
<text x="275" y="100.21" font-size="14" fill="#292929" text-anchor="middle">(응용 1-1)</text>
<polyline points="172,86 198,86" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="400" y="50" width="300" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="550" y="77.35" font-size="15" fill="#292929" text-anchor="middle">오탐 종료</text>
<rect x="400" y="104" width="300" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="550" y="131.35" font-size="15" fill="#292929" text-anchor="middle">승인 대기로 멈추기 (응용 2-1)</text>
<rect x="400" y="158" width="300" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="550" y="186.91" font-size="14" fill="#292929" text-anchor="middle">재시도하며 실행</text>
<text x="550" y="207.21" font-size="14" fill="#292929" text-anchor="middle">run_playbook_with_retry (4·5번)</text>
<polyline points="352,86 375,86 375,73 398,73" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="375,86 375,127 398,127" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="375,127 375,193 398,193" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="20" y="150" font-size="14" fill="#666660">③ 경로에 따라 셋 중 하나</text>
<rect x="20" y="170" width="330" height="58" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="192.91" font-size="14" fill="#292929" text-anchor="middle">retry_runner.py: run_with_retry (1~3번)</text>
<text x="185" y="213.21" font-size="14" fill="#292929" text-anchor="middle">연결 오류면 최대 3번 다시 시도</text>
<polyline points="352,199 398,199" fill="none" stroke="#666660" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-p03)"/>
<rect x="400" y="262" width="300" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="550" y="287.91" font-size="14" fill="#292929" text-anchor="middle">failure_report.py</text>
<text x="550" y="308.21" font-size="14" fill="#292929" text-anchor="middle">collect_failures (6·7번)</text>
<polyline points="550,230 550,260" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="400" y="346" width="300" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="550" y="369.91" font-size="14" fill="#292929" text-anchor="middle">단계 6: 담당자 확인이 필요한 건</text>
<text x="550" y="390.21" font-size="14" fill="#292929" text-anchor="middle">(8·9번으로 출력)</text>
<polyline points="550,328 550,344" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="262" width="330" height="144" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="287.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실행하면 나오는 단계</text>
<text x="185" y="309.06" font-size="14" fill="#292929" text-anchor="middle">단계 1: 일시 장애 (2번 실패 뒤 복구)</text>
<text x="185" y="329.36" font-size="14" fill="#292929" text-anchor="middle">단계 2: 서비스 중단 (계속 실패)</text>
<text x="185" y="349.66" font-size="14" fill="#292929" text-anchor="middle">단계 3: 하루 흐름</text>
<text x="185" y="369.96" font-size="14" fill="#292929" text-anchor="middle">단계 4: 담당자 결정 처리</text>
<text x="185" y="390.26" font-size="14" fill="#292929" text-anchor="middle">단계 5: 연습용 시스템 상태</text>
</g>
</svg>
