<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>보고서는 질문마다 쓸 내용을 보고 답을 쓰고, 왜는 근거까지 적는다</title>
<desc>다섯 단계 체크리스트다. 문제마다 그 제목 아래 질문에 답하고, 출력은 코드 상자에 붙여 넣고, 이유는 내 출력 값을 근거로 쓴다. 모르면 모름과 막힌 곳을 적는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 작성 방법</text>
<rect x="20" y="56" width="50" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="45" y="86.22" font-size="18" fill="#292929" text-anchor="middle">1</text>
<rect x="84" y="56" width="616" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96" y="85.35" font-size="15" fill="#292929">문제를 풀 때마다 그 문제 제목 아래 질문에 답한다</text>
<rect x="20" y="118" width="50" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="45" y="148.22" font-size="18" fill="#292929" text-anchor="middle">2</text>
<rect x="84" y="118" width="616" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96" y="147.35" font-size="15" fill="#292929">「쓸 내용:」 을 보고 「답:」 뒤에 쓴다</text>
<rect x="20" y="180" width="50" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="45" y="210.22" font-size="18" fill="#292929" text-anchor="middle">3</text>
<rect x="84" y="180" width="616" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96" y="209.35" font-size="15" fill="#292929">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙여 넣는다</text>
<rect x="20" y="242" width="50" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="45" y="272.22" font-size="18" fill="#292929" text-anchor="middle">4</text>
<rect x="84" y="242" width="616" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96" y="271.35" font-size="15" fill="#292929">「왜」 는 내 화면의 값이나 배운 내용을 근거로 이유까지 쓴다</text>
<rect x="20" y="304" width="50" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="45" y="334.22" font-size="18" fill="#292929" text-anchor="middle">5</text>
<rect x="84" y="304" width="616" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="96" y="333.35" font-size="15" fill="#292929">못 찾으면 「모름 — 막힌 곳: …」 이라고 쓴다</text>
</g>
</svg>
