<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>연결 오류는 최대 3번 다시 시도하고, 끝내 실패하면 기록해 담당자 확인 목록에 올린다</title>
<desc>왼쪽은 오류가 나면 멈추고 기록도 없던 지금, 오른쪽은 바뀐 뒤다. 순간 오류는 자동 재시도로 해결되고, 계속되는 장애만 실패로 기록되어 담당자에게 넘어간다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰: 티켓 서비스 장애를 자동으로 다시 시도한다</text>
<text x="180" y="62" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">지금</text>
<text x="540" y="62" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">바뀐 뒤</text>
<rect x="20" y="76" width="320" height="104" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="180" y="110.6" font-size="15" fill="#292929" text-anchor="middle">티켓 서비스가 3분 동안 응답 없음</text>
<text x="180" y="132.35" font-size="15" fill="#292929" text-anchor="middle">오류가 나면 그 건의 처리가 멈춤</text>
<text x="180" y="154.1" font-size="15" fill="#292929" text-anchor="middle">실패 기록도 남지 않음</text>
<rect x="380" y="76" width="320" height="104" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="110.6" font-size="15" fill="#292929" text-anchor="middle">잠깐의 오류는</text>
<text x="540" y="132.35" font-size="15" fill="#292929" text-anchor="middle">최대 3번까지 자동으로 다시 시도</text>
<text x="540" y="154.1" font-size="15" fill="#292929" text-anchor="middle">순간 오류는 사람 없이 해결</text>
<rect x="20" y="196" width="320" height="104" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="180" y="230.6" font-size="15" fill="#292929" text-anchor="middle">티켓이 없다는 사실을</text>
<text x="180" y="252.35" font-size="15" fill="#292929" text-anchor="middle">다음 날 아침 담당자가</text>
<text x="180" y="274.1" font-size="15" fill="#292929" text-anchor="middle">직접 찾기 전까지 아무도 모름</text>
<rect x="380" y="196" width="320" height="104" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="540" y="230.6" font-size="15" fill="#292929" text-anchor="middle">그래도 안 되면 「실패」 로 기록해</text>
<text x="540" y="252.35" font-size="15" fill="#292929" text-anchor="middle">담당자 확인 목록에 올림</text>
<text x="540" y="274.1" font-size="15" fill="#292929" text-anchor="middle">오늘 샘플: INC-001 티켓 생성</text>
<polyline points="342,128 378,128" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="342,248 378,248" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="20" y="326" font-size="14" fill="#666660">오늘 수업은 기다림 없이 3번 시도하고, 실제 제품은 시도 사이에 잠시 기다립니다.</text>
</g>
</svg>
