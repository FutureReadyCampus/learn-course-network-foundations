<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>알림은 맥락 붙이기와 경로 정하기를 거쳐 세 가지 처리 중 하나로 갑니다</title>
<desc>run_day_flow 는 알림마다 맥락을 붙이고 경로를 정합니다. 경로가 오탐 종료이면 닫고, 승인이 필요하면 승인 대기로 멈추고, 자동이면 재시도하며 실행합니다. 끝내 실패한 액션은 담당자 확인 목록에 모입니다.</desc>
<defs><marker id="a-f01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">하루 흐름: 알림 한 건이 지나가는 길 (run_day_flow)</text>
<rect x="24" y="58" width="180" height="70" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="114.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="114.0" dy="0" font-weight="700">알림 5건</tspan><tspan x="114.0" dy="21">하나씩 꺼냄</tspan></text>
<rect x="240" y="58" width="200" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="340.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="340.0" dy="0" font-weight="700">① 맥락 붙이기</tspan><tspan x="340.0" dy="21">enrich_incident</tspan></text>
<rect x="476" y="58" width="220" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="586.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="586.0" dy="0" font-weight="700">② 경로 정하기</tspan><tspan x="586.0" dy="21">decide_route</tspan></text>
<line x1="204" y1="93" x2="238" y2="93" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
<line x1="440" y1="93" x2="474" y2="93" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
<rect x="24" y="192" width="216" height="90" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="132.0" y="221.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="132.0" dy="0" font-weight="700">오탐 종료</tspan><tspan x="132.0" dy="21">경로가 오탐 종료</tspan><tspan x="132.0" dy="21">→ 상태: 종료</tspan></text>
<rect x="252" y="192" width="216" height="90" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="221.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">승인 대기</tspan><tspan x="360.0" dy="21">승인 필요 경로이거나</tspan><tspan x="360.0" dy="21">플레이북이 자동이 아님</tspan></text>
<rect x="480" y="192" width="216" height="90" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="588.0" y="221.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="588.0" dy="0" font-weight="700">재시도하며 실행</tspan><tspan x="588.0" dy="21">기본 경로 · 자동</tspan><tspan x="588.0" dy="21">최대 3번 다시 시도</tspan></text>
<line x1="530" y1="128" x2="134" y2="190" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
<line x1="570" y1="128" x2="360" y2="190" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
<line x1="610" y1="128" x2="588" y2="190" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
<rect x="24" y="316" width="672" height="60" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="340.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">실패는 숨기지 않는다</tspan><tspan x="360.0" dy="21">끝내 실패한 액션은 단계 6 의 담당자 확인 목록에 모입니다</tspan></text>
<line x1="588" y1="282" x2="588" y2="314" stroke="#666660" stroke-width="1.8" marker-end="url(#a-f01)"/>
</g>
</svg>
