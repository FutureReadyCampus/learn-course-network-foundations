<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>시계가 만료 시각 120분에 닿으면 expire_blocks 가 차단을 자동으로 풉니다</title>
<desc>0분에 198.51.100.90 을 차단하고 block_expiry 에 120을 적습니다. 시계를 120분으로 옮기면 end_time &lt;= clock 이 참이 되어 차단이 풀리고 기록이 남습니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 2-3: 차단부터 자동 해제까지</text>
<line x1="60" y1="160" x2="660" y2="160" stroke="#dededb" stroke-width="4"/>
<line x1="60" y1="160" x2="600" y2="160" stroke="#e0442e" stroke-width="4"/>
<circle cx="60" cy="160" r="7" fill="#ffffff" stroke="#292929" stroke-width="2"/>
<text x="60" y="190" font-size="15" text-anchor="middle" fill="#666660">0분</text>
<circle cx="330" cy="160" r="7" fill="#ffffff" stroke="#292929" stroke-width="2"/>
<text x="330" y="190" font-size="15" text-anchor="middle" fill="#666660">60분</text>
<circle cx="600" cy="160" r="7" fill="#ffffff" stroke="#292929" stroke-width="2"/>
<text x="600" y="190" font-size="15" text-anchor="middle" fill="#666660">120분</text>
<text x="330" y="146" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">198.51.100.90 차단 중</text>
<rect x="24" y="60" width="220" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="134.0" y="86.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="134.0" dy="0" font-weight="700">block_ip (3 · 4번)</tspan><tspan x="134.0" dy="21.0">block_expiry = 120</tspan></text>
<rect x="456" y="60" width="240" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="576.0" y="86.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="576.0" dy="0" font-weight="700">expire_blocks (5 · 6번)</tspan><tspan x="576.0" dy="21.0">120 &lt;= 120 → 해제</tspan></text>
<rect x="24" y="222" width="210" height="96" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="129.0" y="254.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="129.0" dy="0" font-weight="700">7번 refusal</tspan><tspan x="129.0" dy="21.0">막을 이유를 구함</tspan><tspan x="129.0" dy="21.0">(check_ip_policy)</tspan></text>
<rect x="255" y="222" width="210" height="96" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="265.1" font-size="14" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">8번 if refusal == ""</tspan><tspan x="360.0" dy="19.6">막을 이유가 없으면</tspan></text>
<rect x="486" y="222" width="210" height="96" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="591.0" y="254.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="591.0" dy="0" font-weight="700">9번 record =</tspan><tspan x="591.0" dy="21.0">block_ip(...)</tspan><tspan x="591.0" dy="21.0">차단하고 기록</tspan></text>
<line x1="234" y1="270" x2="253" y2="270" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="465" y1="270" x2="484" y2="270" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="24" y="346" font-size="15" text-anchor="start" fill="#666660">apply2-3_run.py 의 7 ~ 9번이 요청마다 이 순서로 실행됩니다.</text>
