<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>파일 이름이 다르거나 incident 모듈이 없으면 위치를 보고 Unit 1 코드 상자로 만든다</title>
<desc>증상, 확인, 고치기 표다. 파일을 못 찾으면 pwd와 ls로 위치와 이름을 보고, ModuleNotFoundError incident는 Unit 1 실습 1-2 레슨의 incident.py 코드 상자로 만든다. 그래도 막히면 AI, 정답, 모름 순서다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<text x="130" y="64" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">증상</text>
<text x="360" y="64" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">확인</text>
<text x="590" y="64" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">고치기</text>
<rect x="20" y="80" width="220" height="74" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="121.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="130.0" dy="0.0" font-weight="700">파일을 못 찾음</tspan></text>
<rect x="250" y="80" width="220" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="112.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">pwd 가 soar_response 로</tspan><tspan x="360.0" dy="19.6">끝나는지 · ls 로 이름 확인</tspan></text>
<rect x="480" y="80" width="220" height="74" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="112.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="590.0" dy="0.0">맞는 폴더에서</tspan><tspan x="590.0" dy="19.6">다시 실행</tspan></text>
<line x1="241" y1="117" x2="248" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="471" y1="117" x2="478" y2="117" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="166" width="220" height="74" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="198.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="130.0" dy="0.0" font-weight="700">ModuleNotFoundError</tspan><tspan x="130.0" dy="19.6">'incident'</tspan></text>
<rect x="250" y="166" width="220" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="198.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">incident.py 가</tspan><tspan x="360.0" dy="19.6">이 폴더에 없음</tspan></text>
<rect x="480" y="166" width="220" height="74" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="198.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="590.0" dy="0.0">Unit 1 실습 1-2 의</tspan><tspan x="590.0" dy="19.6">코드 상자로 만들기</tspan></text>
<line x1="241" y1="203" x2="248" y2="203" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="471" y1="203" x2="478" y2="203" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="252" width="220" height="74" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="293.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="130.0" dy="0.0" font-weight="700">그래도 막히면</tspan></text>
<rect x="250" y="252" width="220" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="284.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">오류 전체와 친 명령을</tspan><tspan x="360.0" dy="19.6">AI 에게 묻기 (.env · 키 지움)</tspan></text>
<rect x="480" y="252" width="220" height="74" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="284.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="590.0" dy="0.0">정답과 해설 보기</tspan><tspan x="590.0" dy="19.6">실습 결과 기록에 「모름 — 막힌 곳」</tspan></text>
<line x1="241" y1="289" x2="248" y2="289" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="471" y1="289" x2="478" y2="289" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="338" width="680" height="34" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="360.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">실행은 VS Code 의 ▶ 단추가 아니라 터미널에서 한다</tspan></text>
</svg>
