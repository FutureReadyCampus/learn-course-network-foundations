<rect x="260" y="150" width="200" height="84" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="176.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">제공 파일 세 개</tspan><tspan x="360.0" dy="21">ip_actions · audit</tspan><tspan x="360.0" dy="21">approvals (복사)</tspan></text>
