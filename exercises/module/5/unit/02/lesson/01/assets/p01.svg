<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img">
<title>오늘은 실습 2-1, 제공 파일, 실습 2-2 순서로 하고 상태 파일은 Unit 3 이 읽습니다</title>
<desc>하루 약 2시간 40분은 시작 15분, 핵심 실습 110분, 글쓰기 20분, 마무리 15분입니다. 실습은 실습 2-1, 제공 파일 세 개, 실습 2-2 순서이고, 실습 2-2 가 저장한 상태 파일을 Unit 3 실습 3-1 이 읽습니다. 응용은 여유가 되면 합니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
