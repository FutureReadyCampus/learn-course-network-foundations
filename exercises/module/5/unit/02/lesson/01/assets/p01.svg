<rect x="366" y="56" width="159" height="64" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="445.5" y="82.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="445.5" dy="0" font-weight="700">글쓰기 20분</tspan><tspan x="445.5" dy="21">세 문장 글</tspan></text>
<rect x="537" y="56" width="159" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
