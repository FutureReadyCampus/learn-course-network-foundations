<line x1="464" y1="298" x2="494" y2="298" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="24" y="358" font-size="15" text-anchor="start" fill="#666660">응용 2-1 ~ 2-3 은 여유가 되면 해 보세요. 하지 않아도 Unit 3 을 따라갈 수 있습니다.</text>
