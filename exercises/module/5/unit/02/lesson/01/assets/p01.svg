<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Unit 2는 판단한 조치를 실행하고 사후 검증하고 감사 기록으로 남깁니다</title>
<desc>Unit 2까지 만든 판단 단계 다음에 실행, 사후 검증, 감사 기록, 롤백이 이어집니다. 실습 2-1은 계정 잠금, 도전 2-3는 IP 차단, 실습 2-2은 세션 종료를 다룹니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">Unit 2 목표: 봉쇄 조치를 끝까지 마무리하기</text>
<rect x="24" y="70" width="120" height="70" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="84.0" y="99.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="84.0" dy="0" font-weight="700">판단</tspan><tspan x="84.0" dy="21.0">Unit 2까지</tspan></text>
<rect x="184" y="70" width="116" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="242.0" y="99.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="242.0" dy="0" font-weight="700">실행</tspan><tspan x="242.0" dy="21.0">조치하기</tspan></text>
<line x1="158" y1="105" x2="182" y2="105" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="314" y="70" width="116" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="99.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0" font-weight="700">사후 검증</tspan><tspan x="372.0" dy="21.0">상태 재확인</tspan></text>
<line x1="288" y1="105" x2="312" y2="105" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="444" y="70" width="116" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="502.0" y="99.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="502.0" dy="0" font-weight="700">감사 기록</tspan><tspan x="502.0" dy="21.0">전 · 후 상태</tspan></text>
<line x1="418" y1="105" x2="442" y2="105" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="574" y="70" width="116" height="70" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="632.0" y="99.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="632.0" dy="0" font-weight="700">롤백</tspan><tspan x="632.0" dy="21.0">되돌리기 가능</tspan></text>
<line x1="548" y1="105" x2="572" y2="105" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="180" width="216" height="110" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="132.0" y="219.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="132.0" dy="0" font-weight="700">실습 2-1</tspan><tspan x="132.0" dy="21.0">계정 잠금 + 사후 검증</tspan><tspan x="132.0" dy="21.0">account_actions.py</tspan></text>
<rect x="252" y="180" width="216" height="110" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="219.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">도전 2-3</tspan><tspan x="360.0" dy="21.0">허용 · 공유 IP 제외, TTL</tspan><tspan x="360.0" dy="21.0">ip_actions.py</tspan></text>
<rect x="480" y="180" width="216" height="110" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="588.0" y="219.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="588.0" dy="0" font-weight="700">실습 2-2</tspan><tspan x="588.0" dy="21.0">잠금 뒤 세션 종료</tspan><tspan x="588.0" dy="21.0">containment.py</tspan></text>
<text x="24" y="330" font-size="15" text-anchor="start" fill="#666660">새 문법은 실습 2-1의 리스트.remove() 하나입니다.</text>
</g>
</svg>
