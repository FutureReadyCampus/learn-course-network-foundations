<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img">
<title>ip_actions.py 는 허용 목록과 공유 IP 를 먼저 거르고, 차단에는 끝나는 시각을 둡니다</title>
<desc>허용 목록에 있거나 쓰는 계정이 2개 이상인 IP 는 차단하지 않습니다. 나머지는 block_ip 로 차단하고 끝나는 시각을 clock + ttl 로 적으며, expire_blocks 가 끝나는 시각이 지난 차단을 풉니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">ip_actions.py: 막을 이유부터 보고, 차단에는 끝나는 시각</text>
<rect x="24" y="58" width="260" height="58" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="154.0" y="81.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="154.0" dy="0" font-weight="700">허용 목록에 있나?</tspan><tspan x="154.0" dy="21">config/allowlist_ips.json</tspan></text>
<rect x="420" y="58" width="276" height="58" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="558.0" y="81.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="558.0" dy="0" font-weight="700">차단하지 않음</tspan><tspan x="558.0" dy="21">허용 목록 IP 라서 차단하지 않음</tspan></text>
<line x1="284" y1="87" x2="418" y2="87" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="350" y="80" font-size="14" text-anchor="middle" fill="#666660">예</text>
<rect x="24" y="140" width="260" height="58" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="154.0" y="163.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="154.0" dy="0" font-weight="700">공유 IP 인가?</tspan><tspan x="154.0" dy="21">쓰는 계정이 2개 이상</tspan></text>
<rect x="420" y="140" width="276" height="58" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="558.0" y="163.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="558.0" dy="0" font-weight="700">차단하지 않음</tspan><tspan x="558.0" dy="21">담당자 승인 필요</tspan></text>
<line x1="284" y1="169" x2="418" y2="169" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="350" y="162" font-size="14" text-anchor="middle" fill="#666660">예</text>
<line x1="154" y1="116" x2="154" y2="138" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="196" y="132" font-size="14" text-anchor="middle" fill="#666660">아니오</text>
<rect x="24" y="222" width="260" height="58" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="154.0" y="245.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="154.0" dy="0" font-weight="700">block_ip</tspan><tspan x="154.0" dy="21">끝나는 시각 = clock + ttl</tspan></text>
<rect x="420" y="222" width="276" height="58" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="558.0" y="245.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="558.0" dy="0" font-weight="700">198.51.100.90 차단</tspan><tspan x="558.0" dy="21">0 + 120 = 120분에 끝남</tspan></text>
<line x1="154" y1="198" x2="154" y2="220" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="196" y="214" font-size="14" text-anchor="middle" fill="#666660">아니오</text>
<line x1="284" y1="251" x2="418" y2="251" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="24" y="304" width="260" height="58" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="154.0" y="327.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="154.0" dy="0" font-weight="700">expire_blocks</tspan><tspan x="154.0" dy="21">끝나는 시각 &lt;= clock 이면</tspan></text>
<rect x="420" y="304" width="276" height="58" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="558.0" y="327.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="558.0" dy="0" font-weight="700">unblock_ip</tspan><tspan x="558.0" dy="21">차단을 풀고 해제 기록</tspan></text>
<line x1="154" y1="280" x2="154" y2="302" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="284" y1="333" x2="418" y2="333" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
</g>
</svg>
