<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img">
<title>approvals.py 는 권한을 먼저 확인하고, 승인이면 실행하고 거절이면 종료합니다</title>
<desc>담당자 결정이 오면 apply_decision 이 approver 가 APPROVERS 에 있는지 먼저 봅니다. 없으면 권한 없음 기록만 남기고, 있으면 승인은 실행 뒤 조치됨, 거절은 종료와 거절 사유 기록으로 처리합니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">approvals.py: 권한부터 확인하고 결정을 적용한다</text>
<rect x="24" y="96" width="190" height="68" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="119.0" y="124.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="119.0" dy="0" font-weight="700">대기 건 + 결정</tspan><tspan x="119.0" dy="21">item · decision</tspan></text>
<rect x="250" y="96" width="220" height="68" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="124.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">권한 확인</tspan><tspan x="360.0" dy="21">approver in APPROVERS ?</tspan></text>
<rect x="496" y="96" width="200" height="68" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="596.0" y="124.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="596.0" dy="0" font-weight="700">권한 없음</tspan><tspan x="596.0" dy="21">기록만 · 상태 그대로</tspan></text>
<line x1="214" y1="130" x2="248" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="470" y1="130" x2="494" y2="130" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="482" y="90" font-size="14" text-anchor="middle" fill="#666660">아니오</text>
<rect x="250" y="232" width="220" height="68" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="260.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">결정 확인</tspan><tspan x="360.0" dy="21">result == &quot;승인&quot; ?</tspan></text>
<line x1="360" y1="164" x2="360" y2="230" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="376" y="202" font-size="14" text-anchor="middle" fill="#666660">예</text>
<rect x="496" y="196" width="200" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596.0" y="222.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="596.0" dy="0" font-weight="700">실행 완료</tspan><tspan x="596.0" dy="21">액션 실행 → 조치됨</tspan></text>
<rect x="496" y="284" width="200" height="64" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="596.0" y="310.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="596.0" dy="0" font-weight="700">거절 처리</tspan><tspan x="596.0" dy="21">종료 + 거절 사유 기록</tspan></text>
<line x1="470" y1="252" x2="494" y2="232" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="478" y="214" font-size="14" text-anchor="middle" fill="#666660">예</text>
<line x1="470" y1="284" x2="494" y2="310" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="470" y="318" font-size="14" text-anchor="middle" fill="#666660">아니오</text>
<text x="24" y="382" font-size="15" text-anchor="start" fill="#666660">hold_for_approval 은 승인이 필요한 알림을 분류됨으로 멈추고 승인 대기 기록을 남깁니다.</text>
</g>
</svg>
