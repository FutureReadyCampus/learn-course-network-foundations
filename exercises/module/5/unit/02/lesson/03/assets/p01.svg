<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>계정을 잠가도 열린 세션은 남으므로, 세션 종료와 빈틈 점검을 더합니다</title>
<desc>dami 를 잠갔지만 이미 열린 세션 S-101 과 S-102 로 요청이 계속 들어옵니다. 잠금 뒤 세션을 종료하고, 잠겼는데 세션이 남은 계정을 점검합니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 2-2 목표: 잠금만으로는 부족하다</text>
<rect x="24" y="70" width="320" height="150" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="184.0" y="118.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="184.0" dy="0" font-weight="700">지금: 잠금만</tspan><tspan x="184.0" dy="21.0">dami 잠김 (새 로그인 막힘)</tspan><tspan x="184.0" dy="21.0">세션 S-101 · S-102 열림</tspan><tspan x="184.0" dy="21.0">→ 서버 요청이 계속 들어옴</tspan></text>
<rect x="376" y="70" width="320" height="150" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="536.0" y="118.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="536.0" dy="0" font-weight="700">바꾼 뒤: 잠금 + 세션 종료</tspan><tspan x="536.0" dy="21.0">dami 잠김</tspan><tspan x="536.0" dy="21.0">세션 2개 → 0개</tspan><tspan x="536.0" dy="21.0">→ 더는 접속할 수 없음</tspan></text>
<line x1="344" y1="145" x2="374" y2="145" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="248" width="672" height="64" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="274.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">빈틈 점검 (find_open_sessions)</tspan><tspan x="360.0" dy="21.0">잠겼는데 세션이 남은 계정을 찾는다 → 오늘은 junho (S-501)</tspan></text>
</g>
</svg>
