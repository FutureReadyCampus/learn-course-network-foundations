<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img">
<title>제공 파일 세 개는 실습 2-1 뒤, 실습 2-2 앞에 복사해 만듭니다</title>
<desc>실습 2-1 의 containment_store.py 를 만든 뒤 제공 파일 ip_actions.py, audit.py, approvals.py 를 복사해 만들고 확인 명령으로 정상인지 봅니다. 도전 2-3 과 Unit 3 실습 3-1, 도전 2-1 과 2-2 가 이 파일을 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">제공 파일: 실습 2-1 뒤, 실습 2-2 앞에 만든다</text>
<rect x="24" y="58" width="200" height="70" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="124.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="124.0" dy="0" font-weight="700">실습 2-1</tspan><tspan x="124.0" dy="21">containment_store.py</tspan></text>
<rect x="252" y="58" width="216" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">제공 파일 세 개</tspan><tspan x="360.0" dy="21">복사해 붙여 넣기</tspan></text>
<rect x="496" y="58" width="200" height="70" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="596.0" y="87.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="596.0" dy="0" font-weight="700">실습 2-2</tspan><tspan x="596.0" dy="21">그다음 실습</tspan></text>
<line x1="224" y1="93" x2="250" y2="93" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="468" y1="93" x2="494" y2="93" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="162" width="208" height="84" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128.0" y="188.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="128.0" dy="0" font-weight="700">ip_actions.py</tspan><tspan x="128.0" dy="21">IP 차단 · 자동 해제</tspan><tspan x="128.0" dy="21">도전 2-3 · Unit 3 이 씀</tspan></text>
<rect x="256" y="162" width="208" height="84" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="188.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">audit.py</tspan><tspan x="360.0" dy="21">감사 기록 한 건</tspan><tspan x="360.0" dy="21">approvals · flow 가 씀</tspan></text>
<rect x="488" y="162" width="208" height="84" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="592.0" y="188.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="592.0" dy="0" font-weight="700">approvals.py</tspan><tspan x="592.0" dy="21">승인 · 거절 적용</tspan><tspan x="592.0" dy="21">도전 2-2 가 씀</tspan></text>
<line x1="300" y1="128" x2="140" y2="160" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="360" y1="128" x2="360" y2="160" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="420" y1="128" x2="580" y2="160" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="276" width="672" height="56" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="298.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">확인 명령 결과</tspan><tspan x="360.0" dy="21">제공 파일 정상 허용 목록 IP 라서 차단하지 않음 False</tspan></text>
<text x="24" y="358" font-size="15" text-anchor="start" fill="#666660">도전 2-1 · 2-3 을 하면 이 파일을 빈칸이 있는 골격으로 바꿔 직접 써 봅니다.</text>
