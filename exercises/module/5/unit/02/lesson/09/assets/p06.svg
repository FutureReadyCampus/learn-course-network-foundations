<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img">
<title>도전 2-2 보고서: 재시도 결과의 차이, INC-001 의 일부 실패, 실패 목록</title>
<desc>도전 2-2 보고서에 채울 칸입니다. (가)는 출력과 일부 실패, 승인 대기, 오탐 종료 번호, (나)는 fail_plan 값에 따른 결과 차이와 최대 횟수, (다)는 INC-001 의 상태와 단계 6, 두 번 잠기지 않는 이유를 씁니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">도전 2-2 보고서에 채울 칸 (선택)</text>
<rect x="24" y="56" width="130" height="82" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="89.0" y="102.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="89.0" dy="0" font-weight="700">(가)</tspan></text>
<rect x="166" y="56" width="530" height="82" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180.0" y="91.8" font-size="15" text-anchor="start" fill="#292929"><tspan x="180.0" dy="0">① 출력 전체 (코드 상자에 붙여 넣기)</tspan><tspan x="180.0" dy="21">② 일부 실패 · ③ 승인 대기 · ④ 오탐 종료 번호</tspan></text>
<rect x="24" y="150" width="130" height="82" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="89.0" y="185.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="89.0" dy="0" font-weight="700">(나)</tspan><tspan x="89.0" dy="21">핵심 질문</tspan></text>
<rect x="166" y="150" width="530" height="82" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180.0" y="185.8" font-size="15" text-anchor="start" fill="#292929"><tspan x="180.0" dy="0">① 단계 1 과 2 의 fail_plan 값   ② 결과가 달라진 이유</tspan><tspan x="180.0" dy="21">③ 최대 시도 횟수가 없을 때의 문제</tspan></text>
<rect x="24" y="244" width="130" height="82" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="89.0" y="279.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="89.0" dy="0" font-weight="700">(다)</tspan><tspan x="89.0" dy="21">핵심 질문</tspan></text>
<rect x="166" y="244" width="530" height="82" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="180.0" y="269.2" font-size="15" text-anchor="start" fill="#292929"><tspan x="180.0" dy="0">① INC-001 이 조치됨 이 아닌 이유</tspan><tspan x="180.0" dy="21">② 단계 6 이 담당자에게 알려 주는 것</tspan><tspan x="180.0" dy="21">③ 다시 실행해도 dami 가 두 번 잠기지 않는 이유</tspan></text>
