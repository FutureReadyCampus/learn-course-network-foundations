<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img">
<title>report_u2.md 를 만들고 틀을 붙여 넣은 뒤 핵심 칸은 모두, 도전 칸은 한 것만 채웁니다</title>
<desc>soar_response 폴더에 report_u2.md 를 만들고 틀을 복사해 붙여 넣은 뒤 이름을 바꿔 저장합니다. 실습 2-1, 실습 2-2, 마무리는 모두 채우고 도전 2-1 ~ 2-3 은 한 것만 채웁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">보고서 파일 만들기: report_u2.md</text>
<rect x="24" y="58" width="208" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="128.0" y="84.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="128.0" dy="0" font-weight="700">New File</tspan><tspan x="128.0" dy="21">report_u2.md</tspan></text>
<rect x="256" y="58" width="208" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="84.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">틀 복사</tspan><tspan x="360.0" dy="21">복사 버튼</tspan></text>
<rect x="488" y="58" width="208" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="592.0" y="84.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="592.0" dy="0" font-weight="700">이름 바꾸기</tspan><tspan x="592.0" dy="21">저장</tspan></text>
<line x1="232" y1="90" x2="254" y2="90" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="464" y1="90" x2="486" y2="90" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="24" y="152" width="324" height="110" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="186.0" y="180.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="186.0" dy="0" font-weight="700">핵심 실습 (모두 채움)</tspan><tspan x="186.0" dy="21">## 실습 2-1</tspan><tspan x="186.0" dy="21">## 실습 2-2</tspan><tspan x="186.0" dy="21">## 마무리</tspan></text>
<rect x="372" y="152" width="324" height="110" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="534.0" y="191.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="534.0" dy="0" font-weight="700">도전 (선택)</tspan><tspan x="534.0" dy="21">## 도전 2-1 · 2-2 · 2-3</tspan><tspan x="534.0" dy="21">내가 한 도전만 채움</tspan></text>
<text x="24" y="300" font-size="15" text-anchor="start" fill="#666660">실습 하나를 마칠 때마다 이 레슨의 질문을 읽고 같은 번호의 답: 뒤에 씁니다.</text>
