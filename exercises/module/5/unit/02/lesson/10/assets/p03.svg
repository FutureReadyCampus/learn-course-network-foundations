<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img">
<title>글이 막히면 글감마다 출력 두세 줄과 코드 한두 줄을 붙이고 거기서 시작합니다</title>
<desc>글감 1 은 check_policy 의 두 줄과 INC-003 줄, 글감 2 는 junho 점검 결과와 dami 의 두 줄, 글감 3 은 세 조치를 비교하는 작은 표에서 시작합니다. 막힌 이야기는 확인 실패 줄과 의심한 곳을 적습니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">막힐 때 힌트: 글감마다 먼저 붙일 것</text>
<rect x="24" y="56" width="160" height="54" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="104.0" y="88.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="104.0" dy="0" font-weight="700">글감 1 (VIP)</tspan></text>
<rect x="196" y="56" width="500" height="54" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="88.2" font-size="15" text-anchor="start" fill="#292929"><tspan x="210.0" dy="0">check_policy 의 if 두 줄 + 단계 2 의 INC-003 줄</tspan></text>
<rect x="24" y="122" width="160" height="54" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="104.0" y="154.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="104.0" dy="0" font-weight="700">글감 2 (세션)</tspan></text>
<rect x="196" y="122" width="500" height="54" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="154.2" font-size="15" text-anchor="start" fill="#292929"><tspan x="210.0" dy="0">단계 1 의 [&#x27;junho&#x27;] + dami 의 잠금 · 세션 두 줄</tspan></text>
<rect x="24" y="188" width="160" height="54" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="104.0" y="220.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="104.0" dy="0" font-weight="700">글감 3 (피해)</tspan></text>
<rect x="196" y="188" width="500" height="54" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="220.2" font-size="15" text-anchor="start" fill="#292929"><tspan x="210.0" dy="0">세 조치 × 「누가 못 쓰나 · 되돌릴 수 있나」 표</tspan></text>
<rect x="24" y="254" width="160" height="54" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="104.0" y="286.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="104.0" dy="0" font-weight="700">막힌 이야기</tspan></text>
<rect x="196" y="254" width="500" height="54" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="286.2" font-size="15" text-anchor="start" fill="#292929"><tspan x="210.0" dy="0">확인 실패 줄 + 의심한 ② · ③</tspan></text>
<text x="24" y="342" font-size="15" text-anchor="start" fill="#666660">출력은 두세 줄만 붙이고, 그 줄에서 본 것을 한 문장으로 씁니다.</text>
</g>
</svg>
