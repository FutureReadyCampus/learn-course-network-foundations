<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img">
<title>계정 잠금 판단 글의 파일과 머리말 준비하기</title>
<desc>_posts 폴더에 새 파일을 만들고 머리말에 제목과 작성일을 적습니다. 계정 잠금 판단에 쓴 코드를 확인할 수 있도록 실행 결과와 해당 파일에 이르는 링크를 글에 넣습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">계정 잠금 기록을 글로 쓰기</text>
<rect x="24" y="58" width="162" height="90" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="105.0" y="87.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="105.0" dy="0" font-weight="700">글 틀 고르기</tspan><tspan x="105.0" dy="21">post-short</tspan><tspan x="105.0" dy="21">post-stuck</tspan></text>
<rect x="194" y="58" width="162" height="90" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="275.0" y="87.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="275.0" dy="0" font-weight="700">새 글 파일</tspan><tspan x="275.0" dy="21">_posts › New File</tspan><tspan x="275.0" dy="21">날짜-영문제목.md</tspan></text>
<rect x="364" y="58" width="162" height="90" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="445.0" y="87.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="445.0" dy="0" font-weight="700">머리말 고치기</tspan><tspan x="445.0" dy="21">title: 내 글 제목</tspan><tspan x="445.0" dy="21">date: 작성일</tspan></text>
<rect x="534" y="58" width="162" height="90" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="615.0" y="87.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="615.0" dy="0" font-weight="700">근거 링크 붙이기</tspan><tspan x="615.0" dy="21">soar_response/</tspan><tspan x="615.0" dy="21">containment.py</tspan></text>
<line x1="186" y1="103" x2="192" y2="103" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="356" y1="103" x2="362" y2="103" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="526" y1="103" x2="532" y2="103" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="24" y="178" width="672" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="204.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">확인</tspan><tspan x="360.0" dy="21">VS Code 의 _posts 에 새 파일이 있고 제목과 작성일 확인</tspan></text>
<rect x="24" y="268" width="672" height="72" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="288.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">파일 이름 예</tspan><tspan x="360.0" dy="21">_posts/YYYY-MM-DD-verify-open-sessions.md</tspan><tspan x="360.0" dy="21">근거 코드: soar_response/containment.py</tspan></text>
</g>
</svg>
