<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>응용 2-1: 권한을 먼저 확인하고, 승인이면 실행하고 거절이면 종료합니다</title>
<desc>apply_decision 은 먼저 is_authorized 로 승인 권한을 확인합니다. 권한이 없으면 INC-005처럼 분류됨에 남고, 승인이면 실행 완료, 거절이면 종료가 됩니다. 세 경우 모두 감사 기록에 남습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">응용 2-1 정답: 담당자 결정이 처리되는 순서</text>
<rect x="24" y="70" width="150" height="64" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="96.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="99.0" dy="0" font-weight="700">담당자 결정</tspan><tspan x="99.0" dy="21.0">decisions</tspan></text>
<rect x="214" y="70" width="210" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="319.0" y="96.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="319.0" dy="0" font-weight="700">is_authorized</tspan><tspan x="319.0" dy="21.0">(approver)?</tspan></text>
<line x1="174" y1="102" x2="212" y2="102" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<rect x="474" y="70" width="222" height="64" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="585.0" y="96.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="585.0" dy="0" font-weight="700">권한 없음 (분류됨)</tspan><tspan x="585.0" dy="21.0">INC-005 · intern01</tspan></text>
<line x1="424" y1="102" x2="472" y2="102" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="428" y="94" font-size="14" text-anchor="start" fill="#666660">아니오</text>
<rect x="214" y="174" width="210" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="319.0" y="200.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="319.0" dy="0" font-weight="700">decision["result"]</tspan><tspan x="319.0" dy="21.0">== "승인" ?</tspan></text>
<line x1="319" y1="134" x2="319" y2="172" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="326" y="160" font-size="14" text-anchor="start" fill="#666660">예</text>
<rect x="474" y="174" width="222" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="585.0" y="200.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="585.0" dy="0" font-weight="700">실행 완료 (조치됨)</tspan><tspan x="585.0" dy="21.0">INC-002 · 티켓 1건</tspan></text>
<line x1="424" y1="206" x2="472" y2="206" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="440" y="198" font-size="14" text-anchor="start" fill="#666660">예</text>
<rect x="214" y="278" width="210" height="64" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="319.0" y="304.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="319.0" dy="0" font-weight="700">거절 처리 (종료)</tspan><tspan x="319.0" dy="21.0">INC-003 · VIP 확인</tspan></text>
<line x1="319" y1="238" x2="319" y2="276" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="326" y="264" font-size="14" text-anchor="start" fill="#666660">아니오</text>
<rect x="474" y="278" width="222" height="100" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="585.0" y="312.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="585.0" dy="0" font-weight="700">audit.py 감사 기록</tspan><tspan x="585.0" dy="21.0">승인·거절·권한 없음을</tspan><tspan x="585.0" dy="21.0">같은 기록에 남김</tspan></text>
<line x1="585" y1="238" x2="585" y2="276" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<line x1="424" y1="310" x2="472" y2="310" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="24" y="372" font-size="15" text-anchor="start" fill="#666660">권한 확인이 없으면 권한 없는 사람의 승인으로 IP 가 차단됩니다.</text>
</g>
</svg>
