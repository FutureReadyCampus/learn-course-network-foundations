<rect x="154" y="296" width="290" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="166" y="318.2" font-size="15" fill="#292929">조치 전 상태</text>
<rect x="444" y="296" width="252" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="456" y="318.2" font-size="15" fill="#292929">"잠기지 않음"</text>
<rect x="24" y="330" width="130" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="352.2" font-size="15" fill="#292929">after</text>
<rect x="154" y="330" width="290" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="166" y="352.2" font-size="15" fill="#292929">사후 검증으로 확인한 상태</text>
<rect x="444" y="330" width="252" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="456" y="352.2" font-size="15" fill="#292929">"잠김"</text>
<rect x="24" y="364" width="130" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="386.2" font-size="15" fill="#292929">reason</text>
<rect x="154" y="364" width="290" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="166" y="386.2" font-size="15" fill="#292929">조치 사유</text>
<rect x="444" y="364" width="252" height="34" fill="#ffffff" stroke="#dededb"/>
<text x="456" y="386.2" font-size="15" fill="#292929">"퇴사한 계정의 서버 요청"</text>
