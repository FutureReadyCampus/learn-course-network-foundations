<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>실습 2-1에서 쓴 코드: 딕셔너리 만들기, append, in 확인, remove</title>
<desc>실습 2-1의 빈칸에 쓴 코드 모양을 하려는 일과 짝지어 정리한 표입니다. 딕셔너리 저장, 리스트에 추가와 제거, 리스트 안에 있는지 확인, 함수 결과 저장이 있습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 2-1 정리: 하려는 일과 코드</text>
<rect x="24" y="60" width="250" height="40" fill="#f1f1ef" stroke="#dededb"/>
<text x="36" y="85.2" font-size="15" fill="#292929" font-weight="700">하려는 일</text>
<rect x="274" y="60" width="422" height="40" fill="#f1f1ef" stroke="#dededb"/>
<text x="286" y="85.2" font-size="15" fill="#292929" font-weight="700">코드</text>
<rect x="24" y="100" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="125.2" font-size="15" fill="#292929">딕셔너리를 만들어 저장</text>
<rect x="274" y="100" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="125.2" font-size="15" fill="#292929">record = {"action": action, ...}</text>
<rect x="24" y="140" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="165.2" font-size="15" fill="#292929">리스트에 추가</text>
<rect x="274" y="140" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="165.2" font-size="15" fill="#292929">log.append(record)</text>
<rect x="24" y="180" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="205.2" font-size="15" fill="#292929">리스트 안에 있으면</text>
<rect x="274" y="180" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="205.2" font-size="15" fill="#292929">if user in vip_accounts:</text>
<rect x="24" y="220" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="245.2" font-size="15" fill="#292929">있는지 확인한 결과 리턴</text>
<rect x="274" y="220" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="245.2" font-size="15" fill="#292929">return user in state["locked_users"]</text>
<rect x="24" y="260" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="285.2" font-size="15" fill="#292929">리스트에서 제거</text>
<rect x="274" y="260" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="285.2" font-size="15" fill="#292929">state["locked_users"].remove(user)</text>
<rect x="24" y="300" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="325.2" font-size="15" fill="#292929">함수 결과를 저장</text>
<rect x="274" y="300" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="325.2" font-size="15" fill="#292929">record = lock_account(user, state, ...)</text>
</g>
</svg>
