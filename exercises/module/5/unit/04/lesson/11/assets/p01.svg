<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>report_u4.md 를 만들고 틀을 붙여 넣는 순서와 틀의 두 부분</title>
<desc>왼쪽은 soar_response 에서 New File 로 report_u4.md 를 만들고 틀을 붙여 넣은 뒤 이름을 바꿔 저장하는 순서입니다. 오른쪽은 틀의 구조로, 실습 4-1 · 4-2 · 마무리의 (가) 세 칸은 꼭 채우고, 실습 응용 질문과 응용 4-1~4-5 는 한 것만 채웁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">보고서 파일 만들기</tspan></text>
<rect x="20" y="56" width="270" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="155.0" y="85.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="155.0" font-weight="bold">1. [VS Code] New File</tspan><tspan x="155.0" dy="21">report_u4.md</tspan></text>
<rect x="20" y="152" width="270" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="155.0" y="181.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="155.0" font-weight="bold">2. 틀의 복사 버튼</tspan><tspan x="155.0" dy="21">붙여 넣기</tspan></text>
<line x1="155" y1="128" x2="155" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="248" width="270" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="155.0" y="277.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="155.0" font-weight="bold">3. (이름) 을 내 이름으로</tspan><tspan x="155.0" dy="21">Ctrl + S 로 저장</tspan></text>
<line x1="155" y1="224" x2="155" y2="246" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="20" y="360" font-size="14" text-anchor="start" fill="#666660"><tspan x="20">이미 있으면 새로 만들지 않고</tspan><tspan x="20" dy="20">그 파일을 엽니다.</tspan></text>
<rect x="320" y="52" width="380" height="334" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="336" y="78" font-size="15" text-anchor="start" fill="#292929"><tspan x="336" font-weight="bold"># Unit 4 보고서 (이름)</tspan></text>
<rect x="336" y="92" width="348" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="350" y="116" font-size="15" text-anchor="start" fill="#292929"><tspan x="350" font-weight="bold">핵심 · 세 칸 꼭 채움</tspan><tspan x="350" dy="24">## 실습 4-1</tspan><tspan x="350" dy="24">## 실습 4-2</tspan><tspan x="350" dy="24">## 마무리</tspan></text>
<text x="670" y="140" font-size="14" text-anchor="end" fill="#666660"><tspan x="670">(가) 답: + 출력 상자</tspan><tspan x="670" dy="24">(가) 답: + 출력 상자</tspan><tspan x="670" dy="24">(가) 답:</tspan></text>
<text x="350" y="228" font-size="14" text-anchor="start" fill="#666660"><tspan x="350">(나) · (다)는 아래 응용 칸에</tspan></text>
<rect x="336" y="256" width="348" height="114" rx="8" fill="#ffffff" stroke="#9a6200" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="350" y="282" font-size="15" text-anchor="start" fill="#292929"><tspan x="350" font-weight="bold">응용(여유가 되면) · 한 것만 채움</tspan><tspan x="350" dy="26">## 실습 응용 질문 · ## 응용 4-1 ~ 4-5</tspan><tspan x="350" dy="26">하지 않은 칸은 비워 둠</tspan></text>
</g>
</svg>
