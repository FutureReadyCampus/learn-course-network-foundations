<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img">
<title>도전 4-2 보고서 체크리스트: (가) (나) (다) 에 쓸 내용</title>
<desc>report_u4.md 의 ## 도전 4-2 아래 칸마다 쓸 내용입니다. (가)는 출력 전체를 코드 상자에 붙이고, 빨간 테두리의 [핵심 질문]은 내 출력 값을 근거로 이유까지 씁니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">도전 4-2 · 보고서에 채울 칸</tspan></text>
<text x="700" y="32" font-size="14" text-anchor="end" fill="#666660"><tspan x="700">도전(선택)</tspan></text>
<text x="20" y="58" font-size="15" text-anchor="start" fill="#666660"><tspan x="20">근무 3시간 시뮬레이션과 대응 지표</tspan></text>
<rect x="20" y="76" width="680" height="86" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="34" y="110.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="124.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(가)</tspan></text>
<text x="150" y="101" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 출력 전체 → 코드 상자</tspan><tspan x="150" dy="22">② 평균 확인 시간(MTTA) ③ 평균 해결 시간(MTTR)</tspan><tspan x="150" dy="22">④ 응답 기한을 넘긴 티켓 수</tspan></text>
<rect x="20" y="172" width="680" height="86" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<rect x="34" y="206.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="211.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(나)</tspan></text>
<rect x="60" y="221.0" width="76" height="22" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1"/>
<text x="98" y="237.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">핵심 질문</tspan></text>
<text x="150" y="197" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 확인한 티켓 5장의 확인 시간 계산</tspan><tspan x="150" dy="22">② 평균</tspan><tspan x="150" dy="22">③ 확인하지 않은 티켓(TCK-2 · TCK-5)을 뺀 이유</tspan></text>
<rect x="20" y="268" width="680" height="64" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<rect x="34" y="291.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
