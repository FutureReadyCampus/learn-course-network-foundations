<rect x="60" y="306.0" width="76" height="22" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1"/>
<text x="98" y="322.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">핵심 질문</tspan></text>
<text x="150" y="293" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 기한을 넘긴 티켓과 sla_due · 확인한 시각</tspan><tspan x="150" dy="22">② 단계 1 의 70분 · 80분 · 110분 줄과의 관계</tspan></text>
