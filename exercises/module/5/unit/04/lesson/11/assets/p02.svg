<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img">
<title>실습 4-1 보고서 체크리스트: (가) (나) (다) 에 쓸 내용</title>
<desc>report_u4.md 의 ## 실습 4-1 아래 칸마다 쓸 내용입니다. 빨간 테두리의 (가)가 꼭 채울 [핵심 질문]이고 출력 전체를 코드 상자에 붙입니다. (나) · (다)는 [응용]이라 여유가 되면 실습 응용 질문 칸에 씁니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">실습 4-1 · 보고서에 채울 칸</tspan></text>
<text x="20" y="58" font-size="15" text-anchor="start" fill="#666660"><tspan x="20">위험 점수로 조치 요청 8건 분류하기</tspan></text>
<rect x="20" y="76" width="680" height="86" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<rect x="34" y="110.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="115.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(가)</tspan></text>
<rect x="60" y="125" width="76" height="22" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1"/>
<text x="98" y="141" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">핵심 질문</tspan></text>
<text x="150" y="101" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 출력 전체 → 코드 상자</tspan><tspan x="150" dy="22">② 결정별 요청 수</tspan><tspan x="150" dy="22">③ 승인 필요인 요청 번호</tspan></text>
<rect x="20" y="172" width="680" height="86" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="34" y="206.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="211.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(나)</tspan></text>
<rect x="60" y="221.0" width="76" height="22" rx="4" fill="#f0f0ee" stroke="#666660" stroke-width="1"/>
<text x="98" y="237.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">응용</tspan></text>
<text x="150" y="197" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① REQ-1 · REQ-6 의 이유와 합계 점수</tspan><tspan x="150" dy="22">② 결정이 달라진 이유</tspan><tspan x="150" dy="22">③ 대상 수(영향 범위)를 점수에 반영하는 이유</tspan></text>
<rect x="20" y="268" width="680" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="34" y="291.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="296.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(다)</tspan></text>
<rect x="60" y="306.0" width="76" height="22" rx="4" fill="#f0f0ee" stroke="#666660" stroke-width="1"/>
<text x="98" y="322.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">응용</tspan></text>
<text x="150" y="293" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 허용 목록을 점수보다 먼저 보는 이유 (REQ-3)</tspan><tspan x="150" dy="22">② 기준을 설정 파일로 분리할 때 좋은 점</tspan></text>
</g>
</svg>
