<text x="150" y="226" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">② 영향 확인에서 빠진 이유</tspan></text>
<rect x="124" y="240" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="254" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">③ 1번 if 가 없을 때의 규칙 조정 제안</tspan></text>
