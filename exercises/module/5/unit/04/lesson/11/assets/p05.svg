<text x="150" y="293" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① TCK-3 · TCK-6 의 응답 기한과 넘긴 시간</tspan><tspan x="150" dy="22">② 단계가 달라진 이유</tspan><tspan x="150" dy="22">③ TCK-2 가 에스컬레이션되지 않은 이유</tspan></text>
