<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>도전 4-2 보고서 칸: 출력과 지표, MTTA 직접 계산, 위반 티켓, 깃허브 점검</title>
<desc>도전 4-2 보고서의 (가) (나) (다)와 마무리 (가)를 체크리스트로 보여 준다. (나)와 (다)는 핵심 질문이라 호박색으로 표시했다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">도전 4-2 · 마무리 보고서 · 채울 칸</text>
<rect x="20" y="60" width="100" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70.0" y="103.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(가)</text>
<rect x="130" y="60" width="570" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="92.8" font-size="15" font-weight="bold" fill="#292929">출력 전체를 코드 상자에 붙여 넣기</text>
<text x="144" y="113.8" font-size="15" fill="#292929">쓸 내용: ① 출력 전체 ② MTTA ③ MTTR ④ 기한 넘긴 티켓 수</text>
<rect x="20" y="146" width="100" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="178.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(나)</text>
<text x="70.0" y="199.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="146" width="570" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="178.8" font-size="15" font-weight="bold" fill="#292929">확인 시간 5장으로 MTTA 직접 계산</text>
<text x="144" y="199.8" font-size="15" fill="#292929">쓸 내용: ① 5장의 확인 시간 ② 평균 ③ 미확인을 뺀 이유</text>
<rect x="20" y="232" width="100" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="264.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(다)</text>
<text x="70.0" y="285.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="232" width="570" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="264.8" font-size="15" font-weight="bold" fill="#292929">기한을 위반한 티켓 2장</text>
<text x="144" y="285.8" font-size="15" fill="#292929">쓸 내용: ① sla_due · 확인 시각 ② 70 · 80 · 110분 줄</text>
<rect x="20" y="318" width="100" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70.0" y="361.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">마무리</text>
<rect x="130" y="318" width="570" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="350.8" font-size="15" font-weight="bold" fill="#292929">git status 에 .env · .venv 가 보였나</text>
<text x="144" y="371.8" font-size="15" fill="#292929">쓸 내용: ① 보였는지 ② 보였다면 한 조치</text>
</svg>
