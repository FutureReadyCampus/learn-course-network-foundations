<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>도전 4-4 보고서 체크리스트: (가) (나) (다) 에 쓸 내용</title>
<desc>report_u4.md 의 ## 도전 4-4 아래 칸마다 쓸 내용입니다. (가)는 출력 전체를 코드 상자에 붙이고, 빨간 테두리의 [핵심 질문]은 내 출력 값을 근거로 이유까지 씁니다.</desc>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">도전 4-4 · 보고서에 채울 칸</tspan></text>
<text x="700" y="32" font-size="14" text-anchor="end" fill="#666660"><tspan x="700">도전(선택)</tspan></text>
<text x="20" y="58" font-size="15" text-anchor="start" fill="#666660"><tspan x="20">자동 조치 리스크 평가 문서 쓰기</tspan></text>
<rect x="20" y="76" width="680" height="86" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="34" y="110.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="124.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(가)</tspan></text>
<text x="150" y="101" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 출력 전체 → 코드 상자</tspan><tspan x="150" dy="22">② 등급이 높음인 조치</tspan><tspan x="150" dy="22">③ 바로 보완할 조치 2개</tspan></text>
<rect x="20" y="172" width="680" height="86" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<rect x="34" y="206.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="211.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(나)</tspan></text>
<rect x="60" y="221.0" width="76" height="22" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1"/>
<text x="98" y="237.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">핵심 질문</tspan></text>
<text x="150" y="197" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 세 조치의 controls</tspan><tspan x="150" dy="22">② 세션 종료만 통제 갭이 있는 이유</tspan><tspan x="150" dy="22">③ 승인 게이트가 특히 필요한 이유(Unit 3 되돌리기)</tspan></text>
<rect x="20" y="268" width="680" height="86" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<rect x="34" y="302.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="64" y="307.0" font-size="16" text-anchor="start" fill="#292929"><tspan x="64" font-weight="bold">(다)</tspan></text>
<rect x="60" y="317.0" width="76" height="22" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1"/>
<text x="98" y="333.0" font-size="14" text-anchor="middle" fill="#292929"><tspan x="98">핵심 질문</tspan></text>
<text x="150" y="293" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 담당자 알림의 점수 계산</tspan><tspan x="150" dy="22">② 보통인 이유</tspan><tspan x="150" dy="22">③ 감사 기록이 없을 때 확인할 수 없는 것</tspan></text>
</g>
</svg>
