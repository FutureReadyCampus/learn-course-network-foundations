<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>오류 메시지로 빠진 파일 찾고 고치기</title>
<desc>먼저 pwd 와 ls 로 위치와 파일 이름을 확인합니다. No module named 뒤의 이름으로 Unit 1 · 2 · 3 중 어느 파일이 없는지 알고, 앞 페이지의 코드 상자로 만듭니다. 그래도 막히면 AI, 정답 레슨, 보고서 순서로 갑니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">오류가 나면: 증상 → 확인 → 고치기</tspan></text>
<rect x="20" y="52" width="680" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="79.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0">먼저 확인: pwd 가 soar_response 로 끝나는가 · ls 의 파일 이름이 문서와 같은가</tspan></text>
<text x="20" y="124" font-size="15" text-anchor="start" fill="#666660"><tspan x="20" font-weight="bold">증상</tspan></text>
<text x="290" y="124" font-size="15" text-anchor="start" fill="#666660"><tspan x="290" font-weight="bold">뜻</tspan></text>
<text x="500" y="124" font-size="15" text-anchor="start" fill="#666660"><tspan x="500" font-weight="bold">고치기</tspan></text>
<rect x="20" y="136" width="246" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="143.0" y="162.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="143.0">No module named 'incident'</tspan></text>
<line x1="268" y1="158" x2="286" y2="158" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="290" y="136" width="186" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="383.0" y="163.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="383.0">Unit 1 파일이 없음</tspan></text>
<line x1="478" y1="158" x2="496" y2="158" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="192" width="246" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="143.0" y="218.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="143.0">No module named 'ip_actions'</tspan></text>
<line x1="268" y1="214" x2="286" y2="214" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="290" y="192" width="186" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="383.0" y="219.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="383.0">Unit 2 파일이 없음</tspan></text>
<line x1="478" y1="214" x2="496" y2="214" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="20" y="248" width="246" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="143.0" y="274.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="143.0">No module named 'rollback'</tspan></text>
<line x1="268" y1="270" x2="286" y2="270" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="290" y="248" width="186" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="383.0" y="275.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="383.0">Unit 3 파일이 없음</tspan></text>
<line x1="478" y1="270" x2="496" y2="270" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="500" y="136" width="200" height="156" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="187.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="600.0">「이전 파일이</tspan><tspan x="600.0" dy="21">없을 때」의</tspan><tspan x="600.0" dy="21">코드 상자로</tspan><tspan x="600.0" dy="21">그 파일 만들기</tspan></text>
<rect x="20" y="326" width="216" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128.0" y="353.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="128.0">AI 에게 오류 전체 묻기</tspan></text>
<rect x="252" y="326" width="216" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="353.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0">정답 레슨 보기</tspan></text>
<line x1="238" y1="348" x2="250" y2="348" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="484" y="326" width="216" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="592.0" y="353.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="592.0">「모름 — 막힌 곳: …」</tspan></text>
<line x1="470" y1="348" x2="482" y2="348" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<text x="20" y="314" font-size="14" text-anchor="start" fill="#666660"><tspan x="20">그래도 막히면 (.env · API 키는 지우고)</tspan></text>
</g>
</svg>
