<rect x="550" y="244" width="150" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="625.0" y="273.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="625.0" font-weight="bold">No module</tspan><tspan x="625.0" dy="21">named '…'</tspan></text>
<line x1="625" y1="316" x2="625" y2="338" stroke="#e0442e" stroke-width="2" marker-end="url(#a-p02red)"/>
<rect x="470" y="340" width="230" height="42" rx="8" fill="#ffffff" stroke="#e0442e" stroke-width="1.5"/>
<text x="585.0" y="365.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="585.0">다음 페이지로 그 파일만 만들기</tspan></text>
