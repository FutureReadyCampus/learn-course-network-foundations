<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>soar_response 폴더의 이전 파일 여섯 개를 import 로 확인하기</title>
<desc>왼쪽은 Unit 1 · 2 · 3 에서 만든 여섯 파일과 그 파일을 쓰는 실습입니다. 오른쪽은 폴더로 이동해 ls 로 보고, python -c 로 여섯 파일을 불러와 이전 파일 정상이 나오는지 확인하는 순서입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p02red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">폴더 열고 이전 파일 확인하기</tspan></text>
<rect x="20" y="52" width="330" height="330" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="80" font-size="16" text-anchor="start" fill="#292929"><tspan x="36" font-weight="bold">soar_response/</tspan></text>
<rect x="36" y="96" width="298" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="50" y="118" font-size="15" text-anchor="start" fill="#292929"><tspan x="50" font-weight="bold">Unit 1 · 모든 실습</tspan><tspan x="50" dy="22">incident.py</tspan></text>
<rect x="36" y="160" width="298" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="50" y="182" font-size="15" text-anchor="start" fill="#292929"><tspan x="50" font-weight="bold">Unit 2 · 실습 4-2</tspan><tspan x="50" dy="22">containment_store.py</tspan><tspan x="50" dy="22">account_actions.py</tspan><tspan x="50" dy="22">ip_actions.py</tspan></text>
<rect x="36" y="268" width="298" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="50" y="290" font-size="15" text-anchor="start" fill="#292929"><tspan x="50" font-weight="bold">Unit 3 · 실습 4-2</tspan><tspan x="50" dy="22">undo_actions.py</tspan><tspan x="50" dy="22">rollback.py</tspan></text>
<text x="36" y="366" font-size="14" text-anchor="start" fill="#666660"><tspan x="36">실습 4-1 은 incident.py 만 있으면 됩니다</tspan></text>
<rect x="380" y="52" width="320" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540.0" y="81.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="540.0" font-weight="bold">1. [터미널] 폴더로 이동</tspan><tspan x="540.0" dy="21">pwd · cd soar_response · ls</tspan></text>
<line x1="540" y1="124" x2="540" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="148" width="320" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540.0" y="177.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="540.0" font-weight="bold">2. 여섯 파일 불러오기</tspan><tspan x="540.0" dy="21">python -c "import incident, …"</tspan></text>
<line x1="540" y1="220" x2="540" y2="242" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="244" width="150" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
