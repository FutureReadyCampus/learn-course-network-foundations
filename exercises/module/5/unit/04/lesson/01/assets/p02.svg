<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>soar_response 폴더에 둘 파일과 세 가지 확인</title>
<desc>왼쪽은 soar_response 폴더에 있어야 할 이전 파일과 오늘 New File 로 만들어 붙여 넣는 데이터 파일 두 개, 「보고서 쓰기」에서 만드는 report_u4.md 입니다. 오른쪽은 ls, 판다스 불러오기, JSON 개수 확인 세 단계와 기대 출력입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p02r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p02g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p02b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">폴더 열고 파일 준비하기</tspan></text>
<rect x="20" y="52" width="340" height="330" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="40" y="130.8" font-size="15" text-anchor="start" fill="#292929"><tspan x="40" font-weight="bold">soar_response/</tspan><tspan x="40" dy="26.2">incident.py  (Unit 1)</tspan><tspan x="40" dy="26.2">rollback.py  (Unit 3)</tspan><tspan x="40" dy="26.2">undo_actions.py 외 3개 (Unit 2 · 5)</tspan><tspan x="40" dy="26.2">unit10_tickets.json  티켓 7장</tspan><tspan x="40" dy="26.2">unit10_actions.json  조치 기록 10건</tspan><tspan x="40" dy="26.2">report_u4.md  「보고서 쓰기」에서</tspan><tspan x="40" dy="24.5" font-size="14" fill="#666660">시각 값 -1 = 아직 확인 · 해결 안 함</tspan></text>
<rect x="390" y="52" width="310" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="545.0" y="92.3" font-size="15" text-anchor="middle" fill="#292929"><tspan x="545.0" font-weight="bold">1. ls 로 파일 확인</tspan><tspan x="545.0" dy="21.0">incident.py · rollback.py 보이면 OK</tspan></text>
<line x1="545" y1="146" x2="545" y2="168" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="390" y="170" width="310" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="545.0" y="210.3" font-size="15" text-anchor="middle" fill="#292929"><tspan x="545.0" font-weight="bold">2. 판다스 불러오기</tspan><tspan x="545.0" dy="21.0">→ 판다스 불러오기 성공</tspan></text>
<line x1="545" y1="264" x2="545" y2="286" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="390" y="288" width="310" height="92" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="545.0" y="328.3" font-size="15" text-anchor="middle" fill="#292929"><tspan x="545.0" font-weight="bold">3. 두 JSON 개수 확인</tspan><tspan x="545.0" dy="21.0">→ 7 10</tspan></text>
</g>
</svg>
