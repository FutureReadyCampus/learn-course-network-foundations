<text x="290" y="58" font-size="15" fill="#666660" font-weight="700">등급</text>
<text x="370" y="58" font-size="15" fill="#666660" font-weight="700">빠진 통제</text>
<rect x="20" y="68" width="520" height="30" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
