<text x="360.0" y="379" font-size="15" fill="#292929" text-anchor="middle">필수 통제가 모두 빠짐</text>
<text x="360.0" y="401" font-size="15" fill="#292929" text-anchor="middle">보완 4개</text>
<rect x="480" y="324" width="220" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="590.0" y="368" font-size="15" fill="#292929" text-anchor="middle">ascending=False 빠짐</text>
<text x="590.0" y="390" font-size="15" fill="#292929" text-anchor="middle">점수가 작은 것부터</text>
