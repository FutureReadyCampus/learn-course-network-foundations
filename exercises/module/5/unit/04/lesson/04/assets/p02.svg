<title>escalation.py: 기한을 넘긴 열림 티켓을 넘긴 시간에 맞는 단계로 올리기</title>
<desc>열림 상태이고 응답 기한(SLA)이 지난 티켓만 올립니다. 넘긴 시간이 0분 이상이면 1단계 team.lead, 30분 이상이면 2단계 soc.head 이고, 같은 단계는 한 번만 올립니다. 알림은 Unit 3 의 send_with_retry 로 보냅니다.</desc>
