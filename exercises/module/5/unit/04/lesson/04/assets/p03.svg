<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>report.py: 티켓 표를 집계하고 조치 기록과 대조해 리포트 줄 만들기</title>
<desc>티켓 리스트를 make_ticket_table 로 판다스 표로 바꾸고, 규칙별 개수 · 등급별 평균 확인 시간 · 늦은 티켓을 셉니다. find_missing_incidents 로 조치 기록과 대조한 뒤 make_report_lines 가 리포트 줄 리스트를 만듭니다. 파일 쓰기는 응용 4-3 실행 파일이 합니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
