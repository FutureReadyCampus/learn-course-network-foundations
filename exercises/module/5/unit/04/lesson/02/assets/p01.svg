<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img">
<title>조치 요청 8건을 위험 점수로 자동 · 승인 필요 · 차단 금지로 나눈다</title>
<desc>조치 요청 8건이 approval_gate.py를 지나 자동 3건, 승인 필요 3건, 차단 금지 2건으로 나뉩니다. 점수와 기준은 설정 파일 config/approval_policy.json에서 읽습니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p01r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p01g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">실습 4-1: 조치 요청 8건을 세 갈래로</tspan></text>
<rect x="20" y="140" width="170" height="86" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="105.0" y="178.0" font-size="15" text-anchor="middle" fill="#292929"><tspan x="105.0" font-weight="bold">조치 요청 8건</tspan><tspan x="105.0" dy="19.6" font-size="14">gate_requests.json</tspan></text>
<rect x="240" y="54" width="230" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="355.0" y="79.7" font-size="15" text-anchor="middle" fill="#292929"><tspan x="355.0" font-size="14">config/</tspan><tspan x="355.0" dy="19.6" font-size="14">approval_policy.json</tspan></text>
<rect x="240" y="144" width="230" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="355.0" y="178.3" font-size="15" text-anchor="middle" fill="#292929"><tspan x="355.0" font-weight="bold">approval_gate.py</tspan><tspan x="355.0" dy="21.0">위험 점수 합산</tspan></text>
<line x1="355" y1="118" x2="355" y2="142" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="192" y1="183" x2="238" y2="183" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="520" y="84" width="180" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610.0" y="116.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="610.0" font-weight="bold">자동 3건</tspan></text>
<line x1="472" y1="184" x2="518" y2="112" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="520" y="154" width="180" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="610.0" y="186.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="610.0" font-weight="bold">승인 필요 3건</tspan></text>
<line x1="472" y1="184" x2="518" y2="182" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="520" y="224" width="180" height="56" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="610.0" y="256.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="610.0" font-weight="bold">차단 금지 2건</tspan></text>
<line x1="472" y1="184" x2="518" y2="252" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="360" y="312" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360">허용 목록 대상은 점수와 상관없이 차단 금지</tspan></text>
<text x="360" y="338" font-size="15" text-anchor="middle" fill="#666660"><tspan x="360">승인 기준은 코드가 아니라 설정 파일에 따로 둔다</tspan></text>
</g>
</svg>
