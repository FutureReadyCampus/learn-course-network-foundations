<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>막힐 때: 고른 글감마다 붙일 출력 줄과 이어 쓸 문장</title>
<desc>글감 1은 REQ-1 과 REQ-6 줄을 나란히, 글감 2는 decide_gate 첫 두 줄과 approval_score, 글감 3은 [INC-301] 다섯 줄을 붙입니다. 출력은 두세 줄만 붙이고 한 문장을 덧붙이며, 막힌 이야기는 post-stuck.md 의 증상에 출력을 붙입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">막힐 때 힌트: 무엇을 붙이고 무엇을 쓸까</tspan></text>
<text x="20" y="62" font-size="15" text-anchor="start" fill="#666660"><tspan x="20" font-weight="bold">붙일 것</tspan></text>
<text x="400" y="62" font-size="15" text-anchor="start" fill="#666660"><tspan x="400" font-weight="bold">이어서 쓸 것</tspan></text>
<rect x="20" y="74" width="350" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="95.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">글감 1 · REQ-1 합계 2점</tspan><tspan x="32" dy="20">REQ-6 대상 6개 +2, 합계 4점</tspan></text>
<line x1="372" y1="101" x2="396" y2="101" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="400" y="74" width="300" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="412" y="95.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="412">차이는 대상 6개 +2 하나</tspan><tspan x="412" dy="20">6개가 잘못 잠기면 누가 곤란한가</tspan></text>
<rect x="20" y="138" width="350" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="159.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">글감 2 · decide_gate 첫 두 줄</tspan><tspan x="32" dy="20">"approval_score": 3</tspan></text>
<line x1="372" y1="165" x2="396" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="400" y="138" width="300" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="412" y="159.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="412">REQ-3 이 점수로만 정해졌다면</tspan><tspan x="412" dy="20">4로 바꾸면 REQ-5(3점)는?</tspan></text>
<rect x="20" y="202" width="350" height="54" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="233.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">글감 3 · [INC-301] 다섯 줄</tspan></text>
<line x1="372" y1="229" x2="396" y2="229" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="400" y="202" width="300" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="412" y="223.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="412">줄마다 「이 줄이 없으면</tspan><tspan x="412" dy="20">무엇을 모르게 되는가」</tspan></text>
<rect x="20" y="266" width="350" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="287.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">출력 붙이기 · 두세 줄만</tspan><tspan x="32" dy="20">코드 상자로</tspan></text>
<line x1="372" y1="293" x2="396" y2="293" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="400" y="266" width="300" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="412" y="287.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="412">그 아래 「이 줄에서</tspan><tspan x="412" dy="20">무엇을 보았는지」 한 문장</tspan></text>
<rect x="20" y="330" width="350" height="54" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="351.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">막힌 이야기 · post-stuck.md</tspan><tspan x="32" dy="20">「증상」에 출력 그대로</tspan></text>
<line x1="372" y1="357" x2="396" y2="357" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="400" y="330" width="300" height="54" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="412" y="351.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="412">의심한 줄과</tspan><tspan x="412" dy="20">어떻게 찾았는지</tspan></text>
</g>
</svg>
