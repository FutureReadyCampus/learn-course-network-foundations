<rect x="20" y="376" width="680" height="38" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="399.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="360.0">VS Code 의 _posts 에 새 파일 · 머리말의 제목과 작성일 → 올리기는 공개 전 점검 뒤</tspan></text>
