<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>오탐 조치 복구 글의 파일과 머리말 준비하기</title>
<desc>_posts 폴더에 새 파일을 만들고 머리말에 제목과 작성일을 적습니다. 오탐 조치 복구에 쓴 코드를 확인할 수 있도록 실행 결과와 해당 파일에 이르는 링크를 글에 넣습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">글 틀로 쓰고 올리기 (VS Code)</tspan></text>
<text x="20" y="66" font-size="15" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">1. 글 틀 고르기</tspan></text>
