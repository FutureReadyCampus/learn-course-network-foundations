<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>글 틀을 골라 _posts 에 글을 만들고 code 폴더에 코드를 올리기</title>
<desc>기본은 세 문장 글 post-short.md, 막혔으면 post-stuck.md, 응용으로 긴 글을 쓰면 post-practice.md 를 고르고, _posts 폴더에 날짜-영문제목.md 파일을 만들어 머리말을 module: 5, unit: 4 로 고칩니다. 코드는 code 폴더에 올리고, 첫 화면 나의 진행에서 Module 5 의 4번 칸이 채워졌는지 확인합니다.</desc>
