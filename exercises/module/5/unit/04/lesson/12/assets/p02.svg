<text x="565.0" y="101.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="565.0" font-weight="bold">_posts › New File</tspan><tspan x="565.0" dy="20">날짜-영문제목.md</tspan></text>
<line x1="565" y1="136" x2="565" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
