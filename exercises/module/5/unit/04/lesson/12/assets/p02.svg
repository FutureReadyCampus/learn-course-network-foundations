<text x="20" y="266" font-size="15" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">3. 근거 링크 붙이기</tspan></text>
<rect x="20" y="280" width="384" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="212.0" y="304.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="212.0">soar_response/approval_gate.py</tspan><tspan x="212.0" dy="20">soar_response/false_positive.py</tspan></text>
