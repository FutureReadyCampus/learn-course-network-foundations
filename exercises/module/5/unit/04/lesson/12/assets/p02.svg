<text x="324.0" y="105.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="324.0">post-short.md</tspan></text>
<rect x="20" y="132" width="200" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="157.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="120.0">막혀서 끝내지 못했다</tspan></text>
<line x1="222" y1="153" x2="240" y2="153" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="244" y="132" width="160" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="324.0" y="157.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="324.0">post-stuck.md</tspan></text>
<rect x="20" y="184" width="200" height="42" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="209.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="120.0">응용: 긴 글을 쓴다</tspan></text>
<line x1="222" y1="205" x2="240" y2="205" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="244" y="184" width="160" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="324.0" y="209.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="324.0">post-practice.md</tspan></text>
<text x="430" y="66" font-size="15" text-anchor="start" fill="#292929"><tspan x="430" font-weight="bold">2. 새 글 파일 (_posts)</tspan></text>
