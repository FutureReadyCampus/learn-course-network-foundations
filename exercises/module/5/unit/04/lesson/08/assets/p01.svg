<text x="120.0" y="108" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">입력</text>
<text x="120.0" y="131" font-size="15" fill="#292929" text-anchor="middle">자동 조치 6가지</text>
<text x="120.0" y="153" font-size="15" fill="#292929" text-anchor="middle">영향도 · 발생 가능성</text>
<text x="120.0" y="174" font-size="15" fill="#292929" text-anchor="middle">지금 있는 통제</text>
<text x="120" y="232" font-size="14" fill="#666660" text-anchor="middle">automation_risks.json</text>
<rect x="260" y="60" width="200" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="108" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">프로그램</text>
<text x="360.0" y="131" font-size="15" fill="#292929" text-anchor="middle">① 위험 점수 산출</text>
<text x="360.0" y="153" font-size="15" fill="#292929" text-anchor="middle">② 등급 분류</text>
<text x="360.0" y="174" font-size="15" fill="#292929" text-anchor="middle">③ 통제 갭 찾기</text>
<text x="360" y="232" font-size="14" fill="#666660" text-anchor="middle">risk_assessment.py</text>
<rect x="500" y="60" width="200" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="108" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">출력</text>
<text x="600.0" y="131" font-size="15" fill="#292929" text-anchor="middle">리스크 평가 문서</text>
<text x="600.0" y="153" font-size="15" fill="#292929" text-anchor="middle">16줄</text>
<text x="600.0" y="174" font-size="15" fill="#292929" text-anchor="middle">바로 보완할 조치 2개</text>
<text x="600" y="232" font-size="14" fill="#666660" text-anchor="middle">risk_assessment.md</text>
<line x1="222" y1="135" x2="256" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="462" y1="135" x2="496" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
