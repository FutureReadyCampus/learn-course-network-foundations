<rect x="274" y="140" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="165.2" font-size="15" fill="#292929">ip_users.get(ip, [])</text>
<rect x="24" y="180" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="205.2" font-size="15" fill="#292929">리스트의 개수</text>
<rect x="274" y="180" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="205.2" font-size="15" fill="#292929">len(ip_users.get(ip, []))</text>
<rect x="24" y="220" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="245.2" font-size="15" fill="#292929">딕셔너리에 값 저장</text>
<rect x="274" y="220" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="245.2" font-size="15" fill="#292929">state["block_expiry"][ip] = clock + ttl</text>
<rect x="24" y="260" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="285.2" font-size="15" fill="#292929">이하이면</text>
<rect x="274" y="260" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="285.2" font-size="15" fill="#292929">if end_time &lt;= state["clock"]:</text>
<rect x="24" y="300" width="250" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="36" y="325.2" font-size="15" fill="#292929">빈 문자열과 같으면</text>
<rect x="274" y="300" width="422" height="40" fill="#ffffff" stroke="#dededb"/>
<text x="286" y="325.2" font-size="15" fill="#292929">if refusal == "":</text>
</g>
