<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img">
<title>실습 4-2에서 쓴 비교 · 두 조건 · 리턴 문법 여섯 가지</title>
<desc>두 값이 다르면, 리스트에 추가, 두 조건을 함께, 같으면, 문자열을 이어 붙여 리턴, 함수 결과 저장을 코드와 짝지었습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p04r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p04g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p04b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">실습 4-2 정리: 하려는 일 → 코드</tspan></text>
<rect x="20" y="52" width="335" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="93.3" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">두 값이 다르면</tspan><tspan x="32" dy="18.9" font-size="14">if record["before"] != record["after"]:</tspan></text>
<rect x="365" y="52" width="335" height="92" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="377" y="93.3" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">리스트에 추가</tspan><tspan x="377" dy="18.9" font-size="14">changes.append(record)</tspan></text>
<rect x="20" y="156" width="335" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="187.9" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">두 조건을 함께 (and)</tspan><tspan x="32" dy="18.9" font-size="14">if record["action"] == "계정 잠금"</tspan><tspan x="32" dy="18.9" font-size="14">and target in state["locked_users"]:</tspan></text>
<rect x="365" y="156" width="335" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="377" y="197.4" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">같으면</tspan><tspan x="377" dy="18.9" font-size="14">if record["action"] == "IP 차단":</tspan></text>
<rect x="20" y="260" width="335" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="291.9" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">문자열을 이어 붙여 리턴</tspan><tspan x="32" dy="18.9" font-size="14">return "허용 목록에 추가 검토: "</tspan><tspan x="32" dy="18.9" font-size="14">+ record["target"]</tspan></text>
<rect x="365" y="260" width="335" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="377" y="301.4" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">함수 결과를 변수에 저장</tspan><tspan x="377" dy="18.9" font-size="14">undo_records = rollback_incident(...)</tspan></text>
</g>
</svg>
