<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>도전 4-1: 20·60·110분에 점검해 열림 상태로 기한을 넘긴 티켓만 4번 올린다</title>
<desc>20분 점검에서 TCK-1 이 5분 넘겨 team.lead 에게 올라가고, 25분에 확인 중이 된다. 60분에는 올릴 티켓이 없고, 110분에 TCK-3 과 TCK-4 는 soc.head, TCK-6 은 team.lead 에게 올라가 모두 4번이다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">도전 4-1 · 점검 시각마다 일어나는 일</text>
<rect x="20" y="60" width="155" height="170" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="97.5" y="118.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">20분 점검</text>
<text x="97.5" y="139.8" font-size="15" fill="#292929" text-anchor="middle">TCK-1</text>
<text x="97.5" y="160.8" font-size="15" fill="#292929" text-anchor="middle">5분 넘김</text>
<text x="97.5" y="181.8" font-size="15" fill="#292929" text-anchor="middle">→ team.lead</text>
<rect x="195" y="60" width="155" height="170" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="272.5" y="118.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">25분</text>
<text x="272.5" y="139.8" font-size="15" fill="#292929" text-anchor="middle">TCK-1</text>
<text x="272.5" y="160.8" font-size="15" fill="#292929" text-anchor="middle">→ 확인 중</text>
<text x="272.5" y="181.8" font-size="15" fill="#292929" text-anchor="middle">(kim.sec)</text>
<rect x="370" y="60" width="155" height="170" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="447.5" y="118.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">60분 점검</text>
<text x="447.5" y="139.8" font-size="15" fill="#292929" text-anchor="middle">TCK-1 은</text>
<text x="447.5" y="160.8" font-size="15" fill="#292929" text-anchor="middle">확인 중이라</text>
<text x="447.5" y="181.8" font-size="15" fill="#292929" text-anchor="middle">통보 없음</text>
<rect x="545" y="60" width="155" height="170" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="622.5" y="108.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">110분 점검</text>
<text x="622.5" y="129.2" font-size="15" fill="#292929" text-anchor="middle">TCK-3 · TCK-4</text>
<text x="622.5" y="150.2" font-size="15" fill="#292929" text-anchor="middle">→ soc.head</text>
<text x="622.5" y="171.2" font-size="15" fill="#292929" text-anchor="middle">TCK-6</text>
<text x="622.5" y="192.2" font-size="15" fill="#292929" text-anchor="middle">→ team.lead</text>
<line x1="177" y1="145" x2="193" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="352" y1="145" x2="368" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="527" y1="145" x2="543" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="258" width="680" height="60" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="282.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">올린 횟수 합계 4번</text>
<text x="360.0" y="303.8" font-size="15" fill="#292929" text-anchor="middle">같은 단계는 한 번만 올린다 · 확인 중인 티켓은 뺀다</text>
</svg>
