<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>도전 4-1 · 4-2 준비: Unit 3 파일, 티켓 파일, 설치, 알림 서버</title>
<desc>왼쪽은 soar_response 에 있어야 할 Unit 3 파일과 티켓 7장이 든 tickets_unit09.json 입니다. 오른쪽은 flask · requests 설치, 도전 준비 정상 7 확인, 새 터미널에서 alert_server.py 를 켜는 순서입니다. 서버 터미널은 도전을 마칠 때까지 켜 둡니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929"><tspan x="20" font-weight="bold">필요한 파일 준비하기</tspan></text>
<rect x="20" y="52" width="320" height="354" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="34" y="78" font-size="15" text-anchor="start" fill="#292929"><tspan x="34" font-weight="bold">1. Unit 3 파일 (soar_response)</tspan></text>
