<rect x="32" y="204" width="296" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="223.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="44" font-weight="bold">실습 3-2</tspan><tspan x="44" dy="20">ticketing.py</tspan></text>
<rect x="32" y="262" width="296" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="44" y="281.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="44" font-weight="bold">「제공 파일」 레슨</tspan><tspan x="44" dy="20">ticket_merge.py · ticket_notice.py</tspan></text>
<rect x="32" y="322" width="296" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="44" y="343.9" font-size="14" text-anchor="start" fill="#292929"><tspan x="44" font-weight="bold">2. tickets_unit09.json</tspan><tspan x="44" dy="20">티켓 7장 · 모두 열림</tspan><tspan x="44" dy="20">escalation_level 0</tspan></text>
<rect x="366" y="52" width="334" height="64" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="533.0" y="78.9" font-size="14" text-anchor="middle" fill="#292929"><tspan x="533.0" font-weight="bold">1. 설치</tspan><tspan x="533.0" dy="20">pip install flask requests</tspan></text>
<rect x="366" y="136" width="334" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
