<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>escalate 흐름: 열림이고 기한 지났으면 단계를 골라 더 높을 때만 올린다</title>
<desc>점검 시각마다 티켓을 needs_escalation 으로 거른다. 통과하면 pick_level 로 단계를 고르고, 이미 올린 단계보다 높을 때만 send_with_retry 로 상급자에게 알린다. 결과는 그대로, 올림, 실패 가운데 하나다.</desc>
