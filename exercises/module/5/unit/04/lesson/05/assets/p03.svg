<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>에스컬레이션 규칙: 기한이 지난 열림 티켓을 넘긴 시간 0분은 1단계, 30분은 2단계로</title>
<desc>위에는 발동 시점, 대상 티켓, 통보 대상 세 요소를 놓았다. 아래 막대는 넘긴 시간에 따른 단계로, 0분 이상 30분 미만은 team.lead, 30분 이상은 soc.head 이고 예시 티켓 네 장의 위치를 표시했다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">에스컬레이션 규칙의 세 요소</text>
<rect x="20" y="52" width="213" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="126.5" y="91.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">발동 시점</text>
<text x="126.5" y="112.2" font-size="15" fill="#292929" text-anchor="middle">지금 시각이</text>
<text x="126.5" y="133.2" font-size="15" fill="#292929" text-anchor="middle">sla_due 를 지남</text>
<rect x="253" y="52" width="213" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="359.5" y="91.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">대상 티켓</text>
<text x="359.5" y="112.2" font-size="15" fill="#292929" text-anchor="middle">상태가 열림인 것만</text>
<text x="359.5" y="133.2" font-size="15" fill="#292929" text-anchor="middle">확인 중 · 해결 제외</text>
<rect x="486" y="52" width="214" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="593.0" y="91.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">통보 대상</text>
<text x="593.0" y="112.2" font-size="15" fill="#292929" text-anchor="middle">escalation_steps</text>
<text x="593.0" y="133.2" font-size="15" fill="#292929" text-anchor="middle">넘긴 시간으로 단계</text>
<text x="40" y="206" font-size="14" fill="#666660">넘긴 시간(분)</text>
<text x="200" y="206" font-size="14" fill="#666660" text-anchor="middle">0분</text>
<text x="440" y="206" font-size="14" fill="#666660" text-anchor="middle">30분</text>
<rect x="40" y="214" width="160" height="42" rx="0" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="240.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">기한 전</text>
<rect x="200" y="214" width="240" height="42" rx="0" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="320.0" y="240.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">1단계 · team.lead</text>
<rect x="440" y="214" width="260" height="42" rx="0" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="570.0" y="240.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">2단계 · soc.head</text>
<line x1="240" y1="256" x2="240" y2="274" stroke="#666660" stroke-width="1.5"/>
<text x="240" y="290" font-size="14" fill="#292929" text-anchor="middle">TCK-1 5분</text>
<line x1="320" y1="256" x2="320" y2="306" stroke="#666660" stroke-width="1.5"/>
<text x="320" y="322" font-size="14" fill="#292929" text-anchor="middle">TCK-6 15분</text>
<line x1="504" y1="256" x2="504" y2="274" stroke="#666660" stroke-width="1.5"/>
<text x="504" y="290" font-size="14" fill="#292929" text-anchor="middle">TCK-4 38분</text>
<line x1="536" y1="256" x2="536" y2="306" stroke="#666660" stroke-width="1.5"/>
<text x="536" y="322" font-size="14" fill="#292929" text-anchor="middle">TCK-3 42분</text>
</svg>
