<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>응용 4-5 함수 흐름: 세 점검 함수 → mark → 점검 목록 저장</title><desc>check_report, check_gate, check_recovery 가 각각 문제 리스트를 돌려주고 mark 가 통과 또는 확인 필요를 정합니다. apply4-5_run.py 는 기준마다 한 줄씩 출력하고 unit09_checklist.md 를 저장합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
