<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오류가 나면: 증상별로 무엇을 확인하고 어떻게 고치는지</title>
<desc>No module named incident 는 incident.py 가 없다는 뜻이고, notifier 는 복사를 하지 않았다는 뜻이다. requests 나 flask 가 없으면 pip install 로 설치한다. 그 밖에는 pwd 와 ls 를 확인하고, AI 에게 물을 때는 .env 와 API 키를 지운다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="18" fill="#292929" font-weight="700">오류가 나면</text>
<rect x="20" y="48" width="680" height="46" fill="#f1f1ef" stroke="#dededb" stroke-width="1"/>
<text x="30" y="76.04" font-size="14" fill="#292929" font-weight="700">증상</text>
<text x="280" y="76.04" font-size="14" fill="#292929" font-weight="700">뜻</text>
<text x="480" y="76.04" font-size="14" fill="#292929" font-weight="700">고치기</text>
<rect x="20" y="94" width="680" height="46" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="122.04" font-size="14" fill="#292929">No module named 'incident'</text>
<text x="280" y="122.04" font-size="14" fill="#292929">incident.py 없음</text>
<text x="480" y="122.04" font-size="14" fill="#292929">코드 상자로 만든다</text>
<rect x="20" y="140" width="680" height="46" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="168.04" font-size="14" fill="#292929">No module named 'notifier'</text>
<text x="280" y="168.04" font-size="14" fill="#292929">5번 복사를 안 함</text>
<text x="480" y="168.04" font-size="14" fill="#292929">cp 또는 코드 상자</text>
<rect x="20" y="186" width="680" height="46" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="214.04" font-size="14" fill="#292929">… 'requests' · 'flask'</text>
<text x="280" y="214.04" font-size="14" fill="#292929">도구가 설치 안 됨</text>
<text x="480" y="214.04" font-size="14" fill="#292929">pip install 이름</text>
<rect x="20" y="232" width="680" height="46" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="260.04" font-size="14" fill="#292929">그 밖의 오류</text>
<text x="280" y="260.04" font-size="14" fill="#292929">위치 · 이름 확인</text>
<text x="480" y="260.04" font-size="14" fill="#292929">pwd · ls 로 확인</text>
<line x1="270" y1="48" x2="270" y2="278" stroke="#dededb" stroke-width="1"/>
<line x1="470" y1="48" x2="470" y2="278" stroke="#dededb" stroke-width="1"/>
<rect x="20" y="300" width="680" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="329.9" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">AI 에게 물을 때는 오류 전체와 명령을 붙이되</text>
<text x="360" y="350.9" font-size="15" fill="#292929" text-anchor="middle">.env 와 API 키는 지운다</text>
</svg>
