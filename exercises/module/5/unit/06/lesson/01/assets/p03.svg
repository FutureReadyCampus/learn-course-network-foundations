<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>이전 파일이 없을 때 만드는 세 파일과 알림이 서버로 가는 길</title>
<desc>이미 있는 파일은 건너뛰고, 없는 파일만 New File 로 만들고 이름을 적은 뒤 코드 상자를 복사해 붙여 넣는다. incident.py 는 JSON 읽기·쓰기, notifier.py 의 notify 는 메시지를 POST 로 보내고, alert_server.py 는 5001 번 포트의 /alert 로 받아 터미널에 보여 준다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="680" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="47.4" font-size="15" fill="#292929" text-anchor="middle">이미 있는 파일은 건너뛴다 · 없는 파일만 New File 로 만들고 붙여 넣는다</text>
<rect x="20" y="90" width="200" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="129.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">incident.py</text>
<text x="120" y="150.4" font-size="15" fill="#292929" text-anchor="middle">load_json</text>
<text x="120" y="171.4" font-size="15" fill="#292929" text-anchor="middle">save_json</text>
<rect x="260" y="90" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="130.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">notifier.py</text>
<text x="360" y="150.04" font-size="14" fill="#292929" text-anchor="middle">notify(message, url)</text>
<text x="360" y="169.64" font-size="14" fill="#292929" text-anchor="middle">실패면 False</text>
<rect x="500" y="90" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="600" y="129.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">alert_server.py</text>
<text x="600" y="150.4" font-size="15" fill="#292929" text-anchor="middle">Flask · /alert</text>
<text x="600" y="171.4" font-size="15" fill="#292929" text-anchor="middle">port 5001</text>
<line x1="464" y1="145" x2="496" y2="145" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="480" y="132" font-size="14" fill="#666660" text-anchor="middle">POST</text>
<rect x="500" y="230" width="200" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="600" y="255.24" font-size="14" fill="#292929" text-anchor="middle">[알림 받음] 메시지</text>
<text x="600" y="274.84" font-size="14" fill="#292929" text-anchor="middle">터미널에 출력</text>
<line x1="600" y1="204" x2="600" y2="226" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="20" y="230" width="200" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120" y="255.24" font-size="14" fill="#292929" text-anchor="middle">JSON 파일 읽기 · 쓰기</text>
<text x="120" y="274.84" font-size="14" fill="#292929" text-anchor="middle">(알림 · 규칙 파일)</text>
<line x1="120" y1="204" x2="120" y2="226" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="360" y="340" font-size="15" fill="#666660" text-anchor="middle">실습 6-3 과 Unit 7 의 실습 7-1 에서 알림을 받는 쪽이 alert_server.py 다</text>
</svg>
