<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Unit 6 은 티켓 생성, 병합, 알림 전파로 이어지고 Unit 7 에스컬레이션으로 간다</title>
<desc>Unit 6 에서 만든 세 실습이 차례로 이어진다. 실습 6-1 티켓 생성과 응답 기한, 실습 6-2 병합과 상태 전이, 실습 6-3 알림 전파와 재시도 다음에 Unit 7 에스컬레이션과 근무 시뮬레이션이 온다.</desc>
