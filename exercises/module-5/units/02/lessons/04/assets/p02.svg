<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>끝난 알림, 이미 잠긴 계정, 잠금 한도 3개를 차례로 점검한 뒤에만 실행한다</title>
<desc>알림 상태가 이미 끝난 상태이면 건너뛰고, 계정 잠금이면 이미 잠긴 계정인지와 잠근 수가 3 이상인지 확인한다. 세 점검을 모두 통과해야 run_action 으로 실행한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">안전장치: 액션을 실행하기 전에 한 번 더 점검한다</text>
<rect x="20" y="60" width="150" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="95" y="94.35" font-size="15" fill="#292929" text-anchor="middle">알림 한 건</text>
<rect x="200" y="55" width="280" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="340" y="83.475" font-size="15" fill="#292929" text-anchor="middle">상태가 DONE_STATUSES</text>
<text x="340" y="105.225" font-size="15" fill="#292929" text-anchor="middle">(조치됨 · 보고됨 · 종료) 인가?</text>
<rect x="520" y="60" width="180" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="610" y="83.475" font-size="15" fill="#292929" text-anchor="middle">이미 처리됨</text>
<text x="610" y="105.225" font-size="15" fill="#292929" text-anchor="middle">(미리 채움)</text>
<rect x="200" y="160" width="280" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="340" y="188.475" font-size="15" fill="#292929" text-anchor="middle">계정 잠금이고 이미</text>
<text x="340" y="210.225" font-size="15" fill="#292929" text-anchor="middle">locked_users 에 있나? (1·2번)</text>
<rect x="520" y="165" width="180" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="610" y="188.475" font-size="15" fill="#292929" text-anchor="middle">건너뜀:</text>
<text x="610" y="210.225" font-size="15" fill="#292929" text-anchor="middle">이미 잠겨 있음</text>
<rect x="200" y="265" width="280" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="340" y="293.475" font-size="15" fill="#292929" text-anchor="middle">계정 잠금이고 잠근 수가</text>
<text x="340" y="315.225" font-size="15" fill="#292929" text-anchor="middle">MAX_LOCKS_PER_RUN 3 이상?</text>
<rect x="520" y="262" width="180" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="610" y="282.6" font-size="15" fill="#292929" text-anchor="middle">건너뜀: 한도 넘음</text>
<text x="610" y="304.35" font-size="15" fill="#292929" text-anchor="middle">(담당자 확인 필요)</text>
<text x="610" y="326.1" font-size="15" fill="#292929" text-anchor="middle">(3·4번)</text>
<rect x="200" y="355" width="280" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="340" y="379.35" font-size="15" fill="#292929" text-anchor="middle">run_action 으로 실행 (7번)</text>
<polyline points="172,90 208,90" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<polyline points="482,90 518,90" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="500" y="81" font-size="14" fill="#666660" text-anchor="middle">예</text>
<polyline points="482,195 518,195" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="500" y="186" font-size="14" fill="#666660" text-anchor="middle">예</text>
<polyline points="482,300 518,300" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="500" y="291" font-size="14" fill="#666660" text-anchor="middle">예</text>
<polyline points="340,127 340,158" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<polyline points="340,232 340,263" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<polyline points="340,337 340,353" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p02)"/>
<text x="30" y="160" font-size="15" fill="#1f7a4a" font-weight="700">중복 실행 방지</text>
<text x="30" y="182" font-size="14" fill="#666660">(멱등성)</text>
<text x="30" y="290" font-size="15" fill="#1f7a4a" font-weight="700">영향 범위 제한</text>
<text x="30" y="312" font-size="14" fill="#666660">(blast radius)</text>
<text x="358" y="147" font-size="14" fill="#666660">아니오</text>
</g>
</svg>
