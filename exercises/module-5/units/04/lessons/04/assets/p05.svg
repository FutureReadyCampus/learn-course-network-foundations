<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>Unit 4에서 잠금, IP 차단, 세션 종료를 만들었고 Unit 5에서 되돌리기와 일괄 처리를 합니다</title>
<desc>Unit 4의 세 실습이 달성한 기준을 정리합니다. Unit 5에서는 기록을 근거로 롤백하고, 알림 8건을 일괄 처리한 뒤 근무 보고로 요약합니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">Unit 4 마무리와 다음 Unit</text>
<rect x="24" y="66" width="216" height="96" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="132.0" y="98.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="132.0" dy="0" font-weight="700">실습 4-1</tspan><tspan x="132.0" dy="21.0">잠금 + 사후 검증</tspan><tspan x="132.0" dy="21.0">전 · 후 감사 기록</tspan></text>
<rect x="252" y="66" width="216" height="96" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="98.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">실습 4-2</tspan><tspan x="360.0" dy="21.0">허용 · 공유 IP 판별</tspan><tspan x="360.0" dy="21.0">유효 기간 뒤 해제</tspan></text>
<rect x="480" y="66" width="216" height="96" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="588.0" y="98.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="588.0" dy="0" font-weight="700">실습 4-3</tspan><tspan x="588.0" dy="21.0">잠금 뒤 세션 종료</tspan><tspan x="588.0" dy="21.0">빈틈 재점검</tspan></text>
<line x1="360" y1="162" x2="360" y2="196" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="24" y="198" width="672" height="40" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="223.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">Unit 5</tspan></text>
<rect x="24" y="250" width="216" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="132.0" y="279.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="132.0" dy="0" font-weight="700">① 롤백</tspan><tspan x="132.0" dy="21.0">기록만 근거로 되돌림</tspan></text>
<rect x="252" y="250" width="216" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="279.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="360.0" dy="0" font-weight="700">② 일괄 처리</tspan><tspan x="360.0" dy="21.0">알림 8건 한 번에</tspan></text>
<rect x="480" y="250" width="216" height="70" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="588.0" y="279.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="588.0" dy="0" font-weight="700">③ 근무 보고</tspan><tspan x="588.0" dy="21.0">처리 결과 요약</tspan></text>
</g>
</svg>
