<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 4-1 정답: 요청 3건과 해제 1건이 기록되고 잠긴 계정은 junho 만 남습니다</title>
<desc>dami 는 잠긴 뒤 오탐으로 해제되고, gaeun 은 VIP 라 변경 없음, junho 는 잠김에서 잠김입니다. 단계 4 의 잠긴 계정은 junho 하나, 조치 기록은 4건입니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-1 정답: before → after 기록</text>
<rect x="24" y="62" width="250" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149.0" y="90.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="149.0" dy="0">단계 2 · INC-001 dami</tspan></text>
<rect x="290" y="62" width="406" height="46" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="493.0" y="90.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="493.0" dy="0">잠기지 않음 → 잠김</tspan></text>
<rect x="24" y="118" width="250" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149.0" y="146.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="149.0" dy="0">단계 2 · INC-003 gaeun</tspan></text>
<rect x="290" y="118" width="406" height="46" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="493.0" y="146.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="493.0" dy="0">변경 없음 → 변경 없음 (VIP)</tspan></text>
<rect x="24" y="174" width="250" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149.0" y="202.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="149.0" dy="0">단계 2 · INC-006 junho</tspan></text>
<rect x="290" y="174" width="406" height="46" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="493.0" y="202.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="493.0" dy="0">잠김 → 잠김 (이미 잠겨 있음)</tspan></text>
<rect x="24" y="230" width="250" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="149.0" y="258.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="149.0" dy="0">단계 3 · INC-001 dami</tspan></text>
<rect x="290" y="230" width="406" height="46" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="493.0" y="258.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="493.0" dy="0">잠김 → 잠기지 않음 (오탐 해제)</tspan></text>
<rect x="24" y="290" width="324" height="64" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="186.0" y="316.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="186.0" dy="0" font-weight="700">단계 4 결과</tspan><tspan x="186.0" dy="21.0">잠긴 계정 ['junho'] · 기록 4 건</tspan></text>
<rect x="372" y="290" width="324" height="64" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="534.0" y="316.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="534.0" dy="0" font-weight="700">before 가 있으면</tspan><tspan x="534.0" dy="21.0">롤백 때 junho 를 뺄 수 있음</tspan></text>
</g>
</svg>
