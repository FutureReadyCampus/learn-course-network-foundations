<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>마무리: git status 로 .env 와 .venv 가 안 보이는지 확인하고 깃허브에 올립니다</title>
<desc>git status 에서 .env 와 .venv 가 보이지 않아야 합니다. __pycache__ 가 보이면 .gitignore 에 한 줄을 더하고 다시 확인합니다. 깃허브 soar_response 폴더에 오늘 만든 .py 파일이 보이면 됩니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답 마무리: 올리기 전 확인</text>
<rect x="24" y="80" width="150" height="70" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="109.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="99.0" dy="0" font-weight="700">git status</tspan><tspan x="99.0" dy="21.0">실행</tspan></text>
<rect x="214" y="70" width="230" height="90" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="329.0" y="99.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="329.0" dy="0" font-weight="700">.env · .venv</tspan><tspan x="329.0" dy="21.0">보이지 않음</tspan><tspan x="329.0" dy="21.0">(올리면 안 되는 파일)</tspan></text>
<line x1="174" y1="115" x2="212" y2="115" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="214" y="186" width="230" height="90" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="329.0" y="215.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="329.0" dy="0" font-weight="700">__pycache__ 가 보임</tspan><tspan x="329.0" dy="21.0">.gitignore 맨 아래에</tspan><tspan x="329.0" dy="21.0">__pycache__/ 추가</tspan></text>
<polyline points="99,150 99,231 212,231" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="490" y="120" width="206" height="100" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="593.0" y="154.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="593.0" dy="0" font-weight="700">깃허브</tspan><tspan x="593.0" dy="21.0">soar_response 에</tspan><tspan x="593.0" dy="21.0">.py 파일이 보이면 끝</tspan></text>
<line x1="444" y1="115" x2="488" y2="150" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<line x1="444" y1="231" x2="488" y2="196" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="452" y="236" font-size="14" text-anchor="start" fill="#666660">다시 확인</text>
</g>
</svg>
