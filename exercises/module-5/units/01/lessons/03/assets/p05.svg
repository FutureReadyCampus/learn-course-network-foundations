<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>위치 확인 후 git status로 비밀 파일을 걸러 내고 add·commit·push로 올린다</title>
<desc>깃허브에 올리는 순서도다. soar_response에서 파일을 확인하고 cd ..로 옮긴 뒤 git status에서 .env나 .venv가 보이면 .gitignore를 고친다. 보고서를 채운 뒤 add, commit, push 하고 브라우저에서 확인한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">마무리: 깃허브에 올리는 순서</text>
<rect x="20.0" y="52" width="150.5" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="74.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="95.25" dy="0.0" font-weight="700">0. 확인</tspan><tspan x="95.25" dy="19.6">pwd · ls</tspan><tspan x="95.25" dy="19.6">(soar_response)</tspan></text>
<rect x="196.5" y="52" width="150.5" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="74.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="271.75" dy="0.0" font-weight="700">1. cd ..</tspan><tspan x="271.75" dy="19.6">security-agent-</tspan><tspan x="271.75" dy="19.6">toolkit 으로</tspan></text>
<line x1="173.5" y1="89.0" x2="192.5" y2="89.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="373.0" y="52" width="150.5" height="74" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="84.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="448.25" dy="0.0" font-weight="700">2. git status</tspan><tspan x="448.25" dy="19.6">올라갈 파일 보기</tspan></text>
<line x1="350.0" y1="89.0" x2="369.0" y2="89.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="549.5" y="52" width="150.5" height="74" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="74.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="624.75" dy="0.0" font-weight="700">3. 보고서</tspan><tspan x="624.75" dy="19.6">마무리 (가)</tspan><tspan x="624.75" dy="19.6">채우기</tspan></text>
<line x1="526.5" y1="89.0" x2="545.5" y2="89.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="295" y="160" width="290" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="183.3" font-size="14" fill="#292929" text-anchor="middle"><tspan x="440.0" dy="0.0">.env · .venv 가 보이면 멈춤</tspan><tspan x="440.0" dy="19.6">.gitignore 맨 아래에 .env · .venv/</tspan><tspan x="440.0" dy="19.6">(__pycache__/ 도 같은 방법)</tspan></text>
<line x1="448.25" y1="128" x2="448.25" y2="156" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20.0" y="268" width="150.5" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="302.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="95.25" dy="0.0" font-weight="700">git add .</tspan></text>
<rect x="196.5" y="268" width="150.5" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="302.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="271.75" dy="0.0" font-weight="700">git commit -m "…"</tspan></text>
<line x1="173.5" y1="298.0" x2="192.5" y2="298.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="373.0" y="268" width="150.5" height="60" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="302.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="448.25" dy="0.0" font-weight="700">git push</tspan></text>
<line x1="350.0" y1="298.0" x2="369.0" y2="298.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="549.5" y="268" width="150.5" height="60" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="302.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="624.75" dy="0.0" font-weight="700">브라우저 확인</tspan></text>
<line x1="526.5" y1="298.0" x2="545.5" y2="298.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<polyline points="624.75,128 624.75,250 95.25,250 95.25,264" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="348" width="680" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="371.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">push 가 rejected 이면 → git pull --no-rebase 후 git push 다시</tspan><tspan x="360.0" dy="19.6">편집기 화면이 뜨면 Esc → :wq → Enter</tspan></text>
</svg>
