<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>정답 코드는 한 예이고, 주석이 말한 일을 하면 핵심이 같아 맞다</title>
<desc>내가 쓴 코드를 정답과 글자 그대로 비교하지 않는다. 번호 주석이 시킨 일을 하는지 보고, 핵심이 같으면 맞다. 줄 수가 달라도 괜찮다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">정답 보는 법</text>
<rect x="20" y="80" width="200" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120.0" y="119.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">내가 쓴 코드</text>
<text x="120.0" y="140.8" font-size="15" fill="#292929" text-anchor="middle">번호 주석 아래 줄</text>
<rect x="260" y="80" width="200" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="109.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">비교하기</text>
<text x="360.0" y="130.2" font-size="15" fill="#292929" text-anchor="middle">주석이 말한 일을</text>
<text x="360.0" y="151.2" font-size="15" fill="#292929" text-anchor="middle">하고 있나?</text>
<rect x="500" y="80" width="200" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="119.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">맞다</text>
<text x="600.0" y="140.8" font-size="15" fill="#292929" text-anchor="middle">핵심이 같으면 정답</text>
<line x1="222" y1="125" x2="258" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="462" y1="125" x2="498" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="470" y="116" font-size="14" fill="#666660">예</text>
<rect x="20" y="200" width="680" height="64" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="226.8" font-size="15" fill="#292929" text-anchor="middle">정답 코드는 한 예다</text>
<text x="360.0" y="247.8" font-size="15" fill="#292929" text-anchor="middle">줄 수가 달라도 주석이 말한 일을 하면 맞다</text>
</svg>
