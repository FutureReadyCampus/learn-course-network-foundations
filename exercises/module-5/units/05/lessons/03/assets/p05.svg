<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오늘 만든 파일을 깃허브에 올리는 순서: 위치 확인부터 브라우저 확인까지</title>
<desc>soar_response 에서 파일을 확인하고 cd .. 로 security-agent-toolkit 으로 옮긴다. git status 로 .env 나 .venv 가 없는지 본 뒤 보고서를 채우고 git add, commit, push 로 올린다. push 가 거절되면 git pull --no-rebase 후 다시 push 한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="49.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">0</text>
<rect x="76" y="20" width="250" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="201" y="49.4" font-size="15" fill="#292929" text-anchor="middle">pwd · ls</text>
<text x="342" y="50" font-size="15" fill="#292929">soar_response 에서 파일 확인</text>
<line x1="42" y1="70" x2="42" y2="84" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="86" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="115.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1</text>
<rect x="76" y="86" width="250" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="201" y="115.4" font-size="15" fill="#292929" text-anchor="middle">cd ..</text>
<text x="342" y="116" font-size="15" fill="#292929">security-agent-toolkit 으로 이동</text>
<line x1="42" y1="136" x2="42" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="152" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="181.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2</text>
<rect x="76" y="152" width="250" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="201" y="181.4" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<text x="342" y="182" font-size="15" fill="#292929">.env · .venv 가 보이면 .gitignore 에 적기</text>
<line x1="42" y1="202" x2="42" y2="216" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="218" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="247.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3</text>
<rect x="76" y="218" width="250" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="201" y="247.4" font-size="15" fill="#292929" text-anchor="middle">보고서</text>
<text x="342" y="248" font-size="15" fill="#292929">올리기 전에 빈칸 채우기</text>
<line x1="42" y1="268" x2="42" y2="282" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="284" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="313.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4</text>
<rect x="76" y="284" width="250" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="201" y="313.4" font-size="15" fill="#292929" text-anchor="middle">git add . → commit → push</text>
<text x="342" y="314" font-size="15" fill="#292929">세 명령을 하나씩</text>
<line x1="42" y1="334" x2="42" y2="348" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="350" width="44" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="42" y="379.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">5</text>
<rect x="76" y="350" width="250" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="201" y="379.4" font-size="15" fill="#292929" text-anchor="middle">브라우저</text>
<text x="342" y="380" font-size="15" fill="#292929">깃허브 soar_response 폴더 확인</text>
<rect x="490" y="278" width="210" height="60" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="595" y="303.24" font-size="14" fill="#292929" text-anchor="middle">push 가 rejected 이면</text>
<text x="595" y="322.84" font-size="14" fill="#292929" text-anchor="middle">pull --no-rebase → push</text>
</svg>
