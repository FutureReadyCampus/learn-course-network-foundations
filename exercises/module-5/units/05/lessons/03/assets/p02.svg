<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>알림 한 건은 맥락 붙이기, 경로 정하기, 규칙별 조치를 거쳐 기록된다</title>
<desc>알림은 Unit 2의 맥락 붙이기와 경로 정하기를 거쳐 오탐 종료, 승인 필요, 기본 중 하나가 된다. 기본 경로만 규칙에 연결된 조치를 하고, 근무 보고는 기록을 변경됨, 변경 없음, 확인 실패로 센다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="140" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="47.4" font-size="15" fill="#292929" text-anchor="middle">알림</text>
<line x1="164" y1="42" x2="190" y2="42" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="194" y="20" width="240" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="314" y="47.4" font-size="15" fill="#292929" text-anchor="middle">맥락 붙이기 (실습 2-1)</text>
<line x1="438" y1="42" x2="464" y2="42" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="468" y="20" width="232" height="44" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="584" y="47.4" font-size="15" fill="#292929" text-anchor="middle">경로 정하기 (실습 2-2)</text>
<path d="M584 64 L584 84 L110 84 L110 100" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="350" y1="84" x2="350" y2="100" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="584" y1="84" x2="584" y2="100" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="104" width="180" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="126.9" font-size="15" fill="#292929" text-anchor="middle">오탐 종료</text>
<text x="110" y="147.9" font-size="15" fill="#666660" text-anchor="middle">조치하지 않는다</text>
<rect x="240" y="104" width="220" height="56" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="350" y="126.9" font-size="15" fill="#292929" text-anchor="middle">승인 필요 (VIP)</text>
<text x="350" y="147.9" font-size="15" fill="#666660" text-anchor="middle">승인 대기로 둔다</text>
<rect x="500" y="104" width="200" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="600" y="126.9" font-size="15" fill="#292929" text-anchor="middle">기본</text>
<text x="600" y="147.9" font-size="15" fill="#666660" text-anchor="middle">규칙에 연결된 조치</text>
<path d="M600 160 L600 180 L110 180 L110 194" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="360" y1="180" x2="360" y2="194" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<line x1="600" y1="180" x2="600" y2="194" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="20" y="198" width="180" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="221.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">퇴사한 계정</text>
<text x="110" y="241.04" font-size="14" fill="#292929" text-anchor="middle">계정 잠금 →</text>
<text x="110" y="260.64" font-size="14" fill="#292929" text-anchor="middle">세션 종료</text>
<rect x="220" y="198" width="280" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="221.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">경로 스캔</text>
<text x="360" y="241.04" font-size="14" fill="#292929" text-anchor="middle">허용 목록 IP → 차단 안 함</text>
<text x="360" y="260.64" font-size="14" fill="#292929" text-anchor="middle">함께 쓰는 IP → 승인 대기 · 그 밖 → 차단</text>
<rect x="520" y="198" width="180" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="610" y="231.24" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">그 밖의 규칙</text>
<text x="610" y="250.84" font-size="14" fill="#292929" text-anchor="middle">자동 조치 안 함</text>
<text x="20" y="310" font-size="16" fill="#292929" font-weight="700">근무 보고 · 조치 기록을 세 종류로 센다</text>
<rect x="20" y="324" width="220" height="96" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="130" y="357.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">변경됨</text>
<text x="130" y="377.04" font-size="14" fill="#292929" text-anchor="middle">전후가 다르고</text>
<text x="130" y="396.64" font-size="14" fill="#292929" text-anchor="middle">확인 실패가 아님</text>
<rect x="250" y="324" width="220" height="96" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="357.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">변경 없음</text>
<text x="360" y="377.04" font-size="14" fill="#292929" text-anchor="middle">전후가 같음</text>
<text x="360" y="396.64" font-size="14" fill="#292929" text-anchor="middle">보류 이유 확인</text>
<rect x="480" y="324" width="220" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="590" y="357.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">확인 실패</text>
<text x="590" y="377.04" font-size="14" fill="#292929" text-anchor="middle">after 에 「확인 실패」</text>
<text x="590" y="396.64" font-size="14" fill="#292929" text-anchor="middle">반드시 사람이 확인</text>
</svg>
