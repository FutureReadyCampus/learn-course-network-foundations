<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 5-1 정답: 인시던트 세 건의 기록을 거꾸로 읽어 되돌린 결과</title>
<desc>INC-001 은 세션 종료가 되돌리기 불가로 표시되고 계정은 해제된다. INC-006 의 junho 는 잠김에서 잠김이라 해제하지 않는다. INC-005 의 IP 는 해제되어, 단계 5 에서 잠긴 계정은 junho, 차단한 IP 는 없다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="680" height="40" fill="#f1f1ef" stroke="#dededb" stroke-width="1"/>
<text x="30" y="45.04" font-size="14" fill="#292929" font-weight="700">단계</text>
<text x="160" y="45.04" font-size="14" fill="#292929" font-weight="700">기록 (나중 것부터)</text>
<text x="450" y="45.04" font-size="14" fill="#292929" font-weight="700">결과</text>
<rect x="20" y="60" width="680" height="40" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="85.04" font-size="14" fill="#292929">단계 2 · INC-001</text>
<text x="160" y="85.04" font-size="14" fill="#292929">세션 종료 · 세션 2개 → 0개</text>
<text x="450" y="85.04" font-size="14" fill="#292929">되돌리기 불가</text>
<rect x="20" y="100" width="680" height="40" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="160" y="125.04" font-size="14" fill="#292929">계정 잠금 · 잠기지 않음 → 잠김</text>
<text x="450" y="125.04" font-size="14" fill="#292929">계정 해제</text>
<rect x="20" y="140" width="680" height="40" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="165.04" font-size="14" fill="#292929">단계 3 · INC-006</text>
<text x="160" y="165.04" font-size="14" fill="#292929">세션 종료 · 세션 1개 → 0개</text>
<text x="450" y="165.04" font-size="14" fill="#292929">되돌리기 불가</text>
<rect x="20" y="180" width="680" height="40" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="160" y="205.04" font-size="14" fill="#292929">계정 잠금 · 잠김 → 잠김</text>
<text x="450" y="205.04" font-size="14" fill="#292929">건너뜀 (전후가 같음)</text>
<rect x="20" y="220" width="680" height="40" fill="#ffffff" stroke="#dededb" stroke-width="1"/>
<text x="30" y="245.04" font-size="14" fill="#292929">단계 4 · INC-005</text>
<text x="160" y="245.04" font-size="14" fill="#292929">IP 차단 · 차단되지 않음 → 차단됨</text>
<text x="450" y="245.04" font-size="14" fill="#292929">IP 해제</text>
<line x1="150" y1="20" x2="150" y2="260" stroke="#dededb" stroke-width="1"/>
<line x1="440" y1="20" x2="440" y2="260" stroke="#dededb" stroke-width="1"/>
<rect x="20" y="280" width="330" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="185" y="319.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 1 · 되돌리기 전</text>
<text x="185" y="340.4" font-size="15" fill="#292929" text-anchor="middle">잠긴 계정 ['junho', 'dami']</text>
<text x="185" y="361.4" font-size="15" fill="#292929" text-anchor="middle">차단한 IP ['198.51.100.90']</text>
<line x1="356" y1="335" x2="384" y2="335" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="390" y="280" width="310" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="545" y="319.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 5 · 되돌린 뒤</text>
<text x="545" y="340.4" font-size="15" fill="#292929" text-anchor="middle">잠긴 계정 ['junho']</text>
<text x="545" y="361.4" font-size="15" fill="#292929" text-anchor="middle">차단한 IP []</text>
</svg>
