<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><title>정답은 한 예: 내 출력과 비교해 핵심이 같으면 맞다</title><desc>정답마다 터미널 입력, 채운 코드, 결과, 왜, 자주 틀리는 곳, 관제에서는 순서로 나옵니다. 내 코드의 줄 수가 달라도 주석이 말한 일을 하고 출력의 핵심이 같으면 맞습니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">정답을 보는 방법</text>
<rect x="20" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75.0" y="88" font-size="14" fill="#292929" text-anchor="middle">터미널 입력</text>
<rect x="134" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="189.0" y="88" font-size="14" fill="#292929" text-anchor="middle">채운 코드</text>
<rect x="248" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="303.0" y="88" font-size="14" fill="#292929" text-anchor="middle">결과</text>
<rect x="362" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="417.0" y="88" font-size="14" fill="#292929" text-anchor="middle">왜</text>
<rect x="476" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="531.0" y="88" font-size="14" fill="#292929" text-anchor="middle">자주 틀리는 곳</text>
<rect x="590" y="55" width="110" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="645.0" y="88" font-size="14" fill="#292929" text-anchor="middle">관제에서는</text>
<rect x="20" y="150" width="200" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120.0" y="184" font-size="15" fill="#292929" text-anchor="middle">내 코드 실행</text>
<text x="120.0" y="206" font-size="15" fill="#292929" text-anchor="middle">내 출력</text>
<rect x="260" y="150" width="200" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="184" font-size="15" fill="#292929" text-anchor="middle">정답의 결과</text>
<text x="360.0" y="206" font-size="15" fill="#292929" text-anchor="middle">출력과 비교</text>
<rect x="500" y="150" width="200" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="184" font-size="15" fill="#292929" text-anchor="middle">핵심이 같으면</text>
<text x="600.0" y="206" font-size="15" fill="#292929" text-anchor="middle">맞습니다</text>
<line x1="222" y1="190" x2="256" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="462" y1="190" x2="496" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="20" y="260" width="680" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="293" font-size="15" fill="#292929" text-anchor="middle">줄 수가 달라도 주석이 말한 일을 하면 맞습니다.</text>
</g></svg>
