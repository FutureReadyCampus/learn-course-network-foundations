<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Module 4는 탐지하고 Module 5는 분류·승인·조치·보고를 자동화한다</title>
<desc>로그가 Module 4를 거쳐 알림과 점수가 되고, Module 5를 거쳐 시스템 상태 변화와 감사 기록이 된다. 아래에는 두 Module이 틀렸을 때의 문제와 dami 사례를 비교했다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Module 4와 Module 5는 무엇이 다른가</text>
<rect x="20.0" y="52" width="146.7" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="97.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="93.35" dy="0.0" font-weight="700">로그</tspan></text>
<rect x="286.7" y="52" width="146.7" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="97.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.04999999999995" dy="0.0" font-weight="700">알림 · 점수 · 등급</tspan></text>
<line x1="169.7" y1="92.0" x2="282.7" y2="92.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="553.3" y="52" width="146.7" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="86.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="626.65" dy="0.0" font-weight="700">상태 변화</tspan><tspan x="626.65" dy="21.0">+ 감사 기록</tspan></text>
<line x1="436.3" y1="92.0" x2="549.3" y2="92.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="226" y="80" font-size="15" fill="#666660" text-anchor="middle" font-weight="700">Module 4</text>
<text x="226" y="116" font-size="14" fill="#666660" text-anchor="middle">탐지 · 점수</text>
<text x="493" y="80" font-size="15" fill="#666660" text-anchor="middle" font-weight="700">Module 5</text>
<text x="493" y="114" font-size="14" fill="#666660" text-anchor="middle">분류 · 승인 ·</text>
<text x="493" y="132" font-size="14" fill="#666660" text-anchor="middle">조치 · 보고</text>
<text x="20" y="168" font-size="16" fill="#292929" font-weight="700">틀렸을 때</text>
<rect x="20" y="180" width="330" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="214.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="185.0" dy="0.0">Module 4: 오탐은 분석 시간 낭비,</tspan><tspan x="185.0" dy="21.0">미탐은 위협을 놓침</tspan></text>
<rect x="370" y="180" width="330" height="80" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="214.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="535.0" dy="0.0">Module 5: 조치 오류는 정상</tspan><tspan x="535.0" dy="21.0">계정 · IP 를 막아 서비스 중단</tspan></text>
<text x="20" y="292" font-size="16" fill="#292929" font-weight="700">dami 로 보면</text>
<rect x="20" y="304" width="330" height="76" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="336.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="185.0" dy="0.0">퇴사한 계정 규칙</tspan><tspan x="185.0" dy="21.0">→ 60점 · high 알림</tspan></text>
<line x1="352" y1="342" x2="368" y2="342" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="370" y="304" width="330" height="76" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="336.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="535.0" dy="0.0">PB-001: 계정 잠금 + 티켓 생성</tspan><tspan x="535.0" dy="21.0">→ 감사 기록 두 줄</tspan></text>
</svg>
