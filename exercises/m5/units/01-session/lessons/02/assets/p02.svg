<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>알림이 오면 할 일과 순서, 허락 여부를 적은 문서가 플레이북이다</title>
<desc>알림이 들어오면 무엇을 어떤 순서로 하고 어떤 일에 사람의 허락이 필요한지 묻는다. 그 답을 적은 문서가 플레이북이고, SOAR는 그 절차대로 실행한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">대응 절차를 미리 정해 두는 이유</text>
<rect x="20.0" y="60" width="149.0" height="150" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="119.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="94.5" dy="0.0" font-weight="700">알림 도착</tspan><tspan x="94.5" dy="21.0">「이 대상이</tspan><tspan x="94.5" dy="21.0">위험해 보인다」</tspan></text>
<rect x="197.0" y="60" width="149.0" height="150" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="98.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="271.5" dy="0.0" font-weight="700">오늘의 질문</tspan><tspan x="271.5" dy="21.0">무엇을</tspan><tspan x="271.5" dy="21.0">어떤 순서로?</tspan><tspan x="271.5" dy="21.0">어떤 일에</tspan><tspan x="271.5" dy="21.0">허락이 필요?</tspan></text>
<line x1="172.0" y1="135.0" x2="193.0" y2="135.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="374.0" y="60" width="149.0" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="119.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="448.5" dy="0.0" font-weight="700">플레이북</tspan><tspan x="448.5" dy="21.0">그 답을 적어 둔</tspan><tspan x="448.5" dy="21.0">대응 절차서</tspan></text>
<line x1="349.0" y1="135.0" x2="370.0" y2="135.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="551.0" y="60" width="149.0" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="108.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="625.5" dy="0.0" font-weight="700">SOAR</tspan><tspan x="625.5" dy="21.0">정해 둔 절차대로</tspan><tspan x="625.5" dy="21.0">도구를 이어</tspan><tspan x="625.5" dy="21.0">자동 실행</tspan></text>
<line x1="526.0" y1="135.0" x2="547.0" y2="135.0" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="360" y="252" font-size="16" fill="#292929" text-anchor="middle">SOAR 는 알림이 난 뒤에 사람이 하던 일을 맡는다</text>
</svg>
