<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>사람마다 다르던 알림 처리를 플레이북 문서로 먼저 정해 달라는 의뢰</title>
<desc>왼쪽은 지금 상황으로, 팀장이 알림을 하나씩 열어 처리해 사람마다 순서가 다르고 티켓을 빠뜨린다. 오른쪽은 부탁받은 일로, 알림 종류별 플레이북을 쓰고 두 건을 직접 처리해 고친 곳 수와 멈춰야 한 알림을 알린다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">이번 의뢰: 대응 절차서 요청</text>
<rect x="20" y="56" width="320" height="200" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text y="108.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="180.0" dy="0.0" font-weight="700">지금</tspan><tspan x="180.0" dy="21.0">알림을 하나씩 열어</tspan><tspan x="180.0" dy="21.0">계정 잠금 · 티켓 생성</tspan><tspan x="180.0" dy="21.0">사람마다 순서가 다름</tspan><tspan x="180.0" dy="21.0">어떤 날은 티켓을</tspan><tspan x="180.0" dy="21.0">만들지 않고 넘어감</tspan></text>
<line x1="346" y1="156" x2="374" y2="156" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="380" y="56" width="320" height="200" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="108.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="540.0" dy="0.0" font-weight="700">부탁받은 일</tspan><tspan x="540.0" dy="21.0">알림 종류마다</tspan><tspan x="540.0" dy="21.0">대응 절차를 문서로 정하기</tspan><tspan x="540.0" dy="21.0">알림 두 건을 직접 처리</tspan><tspan x="540.0" dy="21.0">→ 고친 곳 수 ·</tspan><tspan x="540.0" dy="21.0">멈춰야 한 알림 알리기</tspan></text>
<rect x="20" y="276" width="680" height="60" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="300.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">같은 알림도 사람마다 다르게 처리하면 결과가 달라진다</tspan><tspan x="360.0" dy="21.0">절차를 먼저 정해야 프로그램이 대신 실행할 수 있다</tspan></text>
</svg>
