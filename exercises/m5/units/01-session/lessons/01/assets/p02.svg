<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>security-agent-toolkit 안에 soar_response 폴더와 파일 두 개를 만든다</title>
<desc>폴더 배치도다. security-agent-toolkit 아래 soar_response 폴더를 만들고 그 안에 config 폴더, incident_samples.json, system_state.json, 안내 파일과 보고서를 둔다. 확인 명령은 5를 출력해야 한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">폴더와 파일 배치</text>
<rect x="20" y="52" width="300" height="44" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="79.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="700">security-agent-toolkit/</tspan></text>
<rect x="60" y="112" width="260" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="137.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="190.0" dy="0.0">anomaly_detection/ (기존)</tspan></text>
<rect x="60" y="166" width="260" height="44" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="193.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="190.0" dy="0.0" font-weight="700">soar_response/ (새로 만듦)</tspan></text>
<path d="M40,96 V132 H60 M40,132 V188 H60" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="110" y="226" width="320" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="245.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="270.0" dy="0.0" font-weight="700">config/</tspan><tspan x="270.0" dy="19.6">JSON 설정 파일만 둔다</tspan></text>
<path d="M84,210 V250 H110" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="110" y="280" width="320" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="299.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="270.0" dy="0.0" font-weight="700">incident_samples.json</tspan><tspan x="270.0" dy="19.6">처리할 알림 5건</tspan></text>
<path d="M84,210 V304 H110" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="110" y="334" width="320" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="353.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="270.0" dy="0.0" font-weight="700">system_state.json</tspan><tspan x="270.0" dy="19.6">네 키 모두 빈 리스트</tspan></text>
<path d="M84,210 V358 H110" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="110" y="388" width="320" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="407.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="270.0" dy="0.0" font-weight="700">안내 파일 · 보고서</tspan><tspan x="270.0" dy="19.6">보고서 제목에 내 이름</tspan></text>
<path d="M84,210 V412 H110" fill="none" stroke="#666660" stroke-width="2"/>
<rect x="470" y="52" width="230" height="150" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="90.2" font-size="15" fill="#292929" text-anchor="middle"><tspan x="585.0" dy="0.0" font-weight="700">system_state.json</tspan><tspan x="585.0" dy="21.0">locked_users: []</tspan><tspan x="585.0" dy="21.0">blocked_ips: []</tspan><tspan x="585.0" dy="21.0">tickets: []</tspan><tspan x="585.0" dy="21.0">notifications: []</tspan></text>
<rect x="470" y="226" width="230" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="259.8" font-size="15" fill="#292929" text-anchor="middle"><tspan x="585.0" dy="0.0" font-weight="700">확인 명령</tspan><tspan x="585.0" dy="21.0">json.load 로 읽은</tspan><tspan x="585.0" dy="21.0">알림 개수를 출력</tspan><tspan x="585.0" dy="21.0">→ 5 가 나오면 성공</tspan></text>
<text x="470" y="376" font-size="15" fill="#666660">맥북은 python3</text>
</svg>
