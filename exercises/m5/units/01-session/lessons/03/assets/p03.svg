<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>알림 5건과 플레이북 등록 파일을 읽어 실행기가 처리하고 6단계 출력과 두 파일을 남긴다</title>
<desc>입력, 프로그램, 출력 흐름도다. 인시던트 파일과 플레이북 등록 파일을 exercise1-2_run.py가 읽어 process_incidents와 run_playbook으로 처리하고, 단계 1~6 출력과 system_state.json, action_log.json을 남긴다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 1-2: 실행기로 알림 5건 처리하기</text>
<text x="110" y="70" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">입력</text>
<text x="360" y="70" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">프로그램</text>
<text x="600" y="70" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">출력</text>
<rect x="20" y="84" width="180" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="114.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="110.0" dy="0.0">incident_samples</tspan><tspan x="110.0" dy="19.6">.json · 알림 5건</tspan></text>
<rect x="20" y="170" width="180" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="200.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="110.0" dy="0.0">playbook_registry</tspan><tspan x="110.0" dy="19.6">.json · PB-001~003</tspan></text>
<line x1="202" y1="119" x2="246" y2="160" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="202" y1="205" x2="246" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="250" y="84" width="220" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="114.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">exercise1-2_run.py</tspan></text>
<line x1="360" y1="138" x2="360" y2="152" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="250" y="156" width="220" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text y="186.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">process_incidents</tspan></text>
<line x1="360" y1="210" x2="360" y2="224" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="250" y="228" width="220" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text y="258.9" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">run_playbook (직접 씀)</tspan></text>
<line x1="472" y1="182" x2="506" y2="182" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="510" y="84" width="190" height="118" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text y="108.7" font-size="14" fill="#292929" text-anchor="middle"><tspan x="605.0" dy="0.0">단계 1 불러온 수</tspan><tspan x="605.0" dy="19.6">단계 2 · 4 실행 전후</tspan><tspan x="605.0" dy="19.6">단계 3 건별 결과</tspan><tspan x="605.0" dy="19.6">단계 5 승인 대기</tspan><tspan x="605.0" dy="19.6">단계 6 감사 기록</tspan></text>
<rect x="510" y="214" width="190" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text y="242.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="605.0" dy="0.0">system_state.json</tspan><tspan x="605.0" dy="19.6">action_log.json</tspan></text>
<rect x="20" y="304" width="680" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text y="337.1" font-size="14" fill="#292929" text-anchor="middle"><tspan x="360.0" dy="0.0">승인 대기 수와 기록 수는 실습 1-1에서 정한 PB-003 의 승인 값에 따라 달라진다</tspan><tspan x="360.0" dy="19.6">채우기 전에 실행하면 IndentationError (for 안쪽 4 · 5번이 비어 있음)</tspan></text>
</svg>
