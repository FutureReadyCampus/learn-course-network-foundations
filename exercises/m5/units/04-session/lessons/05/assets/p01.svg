<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답은 한 예이며, 주석이 말한 일을 하면 줄 수가 달라도 맞습니다</title>
<desc>내 코드와 정답 코드를 비교할 때 줄 수나 모양이 아니라 주석이 말한 일을 하는지를 봅니다. 핵심이 같으면 맞은 것입니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답을 보는 기준</text>
<text x="24" y="58" font-size="15" text-anchor="start" fill="#666660">정답은 한 예입니다. 핵심이 같으면 맞습니다.</text>
<rect x="40" y="100" width="180" height="64" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="130.0" y="126.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="130.0" dy="0" font-weight="700">내 코드</tspan><tspan x="130.0" dy="21.0">(내가 쓴 줄)</tspan></text>
<rect x="40" y="190" width="180" height="64" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130.0" y="216.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="130.0" dy="0" font-weight="700">정답 코드</tspan><tspan x="130.0" dy="21.0">(한 예)</tspan></text>
<rect x="280" y="130" width="190" height="90" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="375.0" y="169.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="375.0" dy="0" font-weight="700">주석이 말한 일을</tspan><tspan x="375.0" dy="21.0">하고 있는가?</tspan></text>
<line x1="220" y1="132" x2="278" y2="160" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<line x1="220" y1="222" x2="278" y2="192" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="530" y="92" width="160" height="70" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610.0" y="121.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="610.0" dy="0" font-weight="700">맞음</tspan><tspan x="610.0" dy="21.0">줄 수가 달라도 됨</tspan></text>
<rect x="530" y="190" width="160" height="70" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="610.0" y="219.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="610.0" dy="0" font-weight="700">다시 보기</tspan><tspan x="610.0" dy="21.0">자주 틀리는 곳 확인</tspan></text>
<line x1="470" y1="160" x2="528" y2="128" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="488" y="132" font-size="14" text-anchor="start" fill="#666660">예</text>
<line x1="470" y1="190" x2="528" y2="224" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="470" y="228" font-size="14" text-anchor="start" fill="#666660">아니오</text>
</g>
</svg>
