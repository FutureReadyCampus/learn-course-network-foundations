<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 4-3 정답: junho 의 빈틈을 찾고, 잠금 뒤 세션을 끊어 빈틈이 사라집니다</title>
<desc>단계 1 에서 이미 잠겼지만 세션이 열린 junho 를 찾습니다. 단계 2 에서 dami 를 잠그고 세션 2개를, junho 의 세션 1개를 끊습니다. 단계 3 의 빈틈은 없고 잠긴 계정은 junho 와 dami, 기록은 5건입니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 4-3 정답: 점검 → 조치 → 재점검</text>
<rect x="24" y="62" width="200" height="64" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="124.0" y="88.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="124.0" dy="0" font-weight="700">단계 1 점검</tspan><tspan x="124.0" dy="21.0">['junho']</tspan></text>
<line x1="224" y1="94" x2="258" y2="94" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="260" y="62" width="436" height="64" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="478.0" y="88.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="478.0" dy="0" font-weight="700">단계 2 · 잠금 → 세션 종료</tspan><tspan x="478.0" dy="21.0">아래 다섯 줄이 기록됨</tspan></text>
<rect x="24" y="140" width="150" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="168.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="99.0" dy="0">dami</tspan></text>
<rect x="190" y="140" width="506" height="46" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="443.0" y="168.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="443.0" dy="0">잠기지 않음 → 잠김 · 세션 2개 → 0개</tspan></text>
<rect x="24" y="196" width="150" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="224.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="99.0" dy="0">gaeun</tspan></text>
<rect x="190" y="196" width="506" height="46" rx="10" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="443.0" y="224.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="443.0" dy="0">변경 없음 (VIP) · 세션 종료 안 함</tspan></text>
<rect x="24" y="252" width="150" height="46" rx="10" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="280.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="99.0" dy="0">junho</tspan></text>
<rect x="190" y="252" width="506" height="46" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="443.0" y="280.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="443.0" dy="0">잠김 → 잠김 · 세션 1개 → 0개</tspan></text>
<rect x="24" y="318" width="324" height="66" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="186.0" y="345.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="186.0" dy="0" font-weight="700">단계 3 재점검</tspan><tspan x="186.0" dy="21.0">빈틈이 남은 계정: []</tspan></text>
<rect x="372" y="318" width="324" height="66" rx="10" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="534.0" y="345.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="534.0" dy="0" font-weight="700">단계 4 결과</tspan><tspan x="534.0" dy="21.0">['junho', 'dami'] · 기록 5 건</tspan></text>
</g>
</svg>
