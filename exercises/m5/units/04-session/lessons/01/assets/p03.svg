<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img">
<title>오류가 나면 폴더 위치, incident.py 유무를 확인하고 오류 전체를 묻습니다</title>
<desc>폴더 위치가 틀리면 pwd 와 ls 로 확인합니다. ModuleNotFoundError 는 incident.py 가 없다는 뜻이므로 complete_files.md 에서 복사합니다. 그래도 막히면 오류 전체를 AI 에게 묻습니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<rect x="24" y="60" width="214" height="76" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="92.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">파일을 못 찾음</tspan><tspan x="131.0" dy="21.0">이름이 다름</tspan></text>
<rect x="272" y="60" width="200" height="76" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="92.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">pwd 가 soar_response</tspan><tspan x="372.0" dy="21.0">로 끝나는지, ls 확인</tspan></text>
<rect x="506" y="60" width="190" height="76" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="92.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">cd soar_response</tspan><tspan x="601.0" dy="21.0">파일 이름을 문서대로</tspan></text>
<line x1="238" y1="98.0" x2="270" y2="98.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="98.0" x2="504" y2="98.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="152" width="214" height="76" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="184.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">ModuleNotFoundError</tspan><tspan x="131.0" dy="21.0">'incident'</tspan></text>
<rect x="272" y="152" width="200" height="76" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="184.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">incident.py 가</tspan><tspan x="372.0" dy="21.0">이 폴더에 있는지</tspan></text>
<rect x="506" y="152" width="190" height="76" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="184.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">complete_files.md</tspan><tspan x="601.0" dy="21.0">1절에서 복사</tspan></text>
<line x1="238" y1="190.0" x2="270" y2="190.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="190.0" x2="504" y2="190.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="244" width="214" height="76" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="287.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">그 밖의 오류</tspan></text>
<rect x="272" y="244" width="200" height="76" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="276.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">친 명령 + 오류 전체</tspan><tspan x="372.0" dy="21.0">(.env·API 키 지움)</tspan></text>
<rect x="506" y="244" width="190" height="76" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="276.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">AI 에게 묻기 → 정답</tspan><tspan x="601.0" dy="21.0">→ 「모름 — 막힌 곳」</tspan></text>
<line x1="238" y1="282.0" x2="270" y2="282.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="282.0" x2="504" y2="282.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
</g>
</svg>
