<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>「조치 완료」 한 줄 대신 네 가지를 적은 티켓을 만들고 확인 실패는 따로 표시한다</title>
<desc>지금은 조치 뒤에 조치 완료 한 줄만 남는다. 실습 6-1 뒤에는 알림마다 제목, 조치 내역, 후속 조치, 응답 기한을 적은 티켓이 생기고, 사후 검증에 실패한 INC-207 은 직접 확인 대상으로 표시된다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="130" y="30" font-size="18" fill="#292929" text-anchor="middle" font-weight="700">지금</text>
<text x="470" y="30" font-size="18" fill="#292929" text-anchor="middle" font-weight="700">실습 6-1 뒤</text>
<rect x="20" y="50" width="220" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="84.9" font-size="15" fill="#292929" text-anchor="middle">기록 한 줄</text>
<text x="130" y="105.9" font-size="15" fill="#292929" text-anchor="middle">「조치 완료」</text>
<rect x="20" y="150" width="220" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130" y="185.44" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">INC-207</text>
<text x="130" y="205.04" font-size="14" fill="#292929" text-anchor="middle">실제로는 차단 안 됨</text>
<text x="130" y="224.64" font-size="14" fill="#292929" text-anchor="middle">정상 조치와 구별 안 됨</text>
<line x1="246" y1="150" x2="284" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="290" y="50" width="410" height="200" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="302" y="113.4" font-size="15" fill="#292929" font-weight="700">티켓 · INC-201 (high)</text>
<text x="302" y="134.4" font-size="15" fill="#292929">제목 [high] dami — 퇴사한 계정</text>
<text x="302" y="155.4" font-size="15" fill="#292929">조치 내역 계정 잠금 · 세션 종료</text>
<text x="302" y="176.4" font-size="15" fill="#292929">후속 조치 조치 결과 확인</text>
<text x="302" y="197.4" font-size="15" fill="#292929">응답 기한 0 + 15 = 15분</text>
<rect x="290" y="270" width="410" height="60" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="495" y="305.4" font-size="15" fill="#292929" text-anchor="middle">INC-207 → 「직접 확인」 대상으로 따로 표시</text>
<text x="20" y="300" font-size="15" fill="#666660">알림 11건 · 근무 3시간</text>
</svg>
