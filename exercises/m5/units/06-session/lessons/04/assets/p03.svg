<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>send_ticket_notice 는 간격을 보고 건너뛰거나, 수신자를 골라 최대 3번 보낸다</title>
<desc>알림 한 건마다 should_send 로 보낼 때인지 판단한다. 아니면 건너뜀, 맞으면 pick_recipients 로 수신자를 고르고 send_with_retry 로 최대 3번 보낸다. 성공하면 전송, 모두 실패하면 실패를 리턴한다.</desc>
