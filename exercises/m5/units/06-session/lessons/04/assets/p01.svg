<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 6-3: 알림 11건을 등급별 수신자에게 보내 전송 9건, 건너뜀 2건이 된다</title>
<desc>알림 11건이 ticket_notice.py 를 거쳐 담당자에게 전파된다. 수신자 고르기, 30분 간격 확인, 최대 3번 재시도를 거쳐 전송 9건과 건너뜀 2건이 나오고, 3번 모두 실패하면 실패로 표시한다.</desc>
