<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실습 7-1 보고서 칸: 출력과 올린 횟수, TCK-1 을 다시 안 올린 이유, 단계 차이</title>
<desc>실습 7-1 보고서의 (가) (나) (다) 세 칸과 각 칸에 쓸 내용을 체크리스트로 보여 준다. (나)와 (다)는 핵심 질문이라 호박색으로 표시했다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">실습 7-1 보고서 · 채울 칸</text>
<rect x="20" y="60" width="100" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70.0" y="110.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(가)</text>
<rect x="130" y="60" width="570" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="99.8" font-size="15" font-weight="bold" fill="#292929">출력 전체를 코드 상자에 붙여 넣기</text>
<text x="144" y="120.8" font-size="15" fill="#292929">쓸 내용: ① 출력 전체 ② [알림 받음] 줄 수 ③ 단계 3 올린 횟수</text>
<rect x="20" y="165" width="100" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="204.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(나)</text>
<text x="70.0" y="225.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="165" width="570" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="204.8" font-size="15" font-weight="bold" fill="#292929">TCK-1 이 60분에 올라가지 않은 이유</text>
<text x="144" y="225.8" font-size="15" fill="#292929">쓸 내용: ① 20 · 25 · 60분 결과 ② 조건 ③ 조건이 없을 때</text>
<rect x="20" y="270" width="100" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="309.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">(다)</text>
<text x="70.0" y="330.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="130" y="270" width="570" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="144" y="309.8" font-size="15" font-weight="bold" fill="#292929">TCK-3 은 2단계, TCK-6 은 1단계</text>
<text x="144" y="330.8" font-size="15" fill="#292929">쓸 내용: ① 기한과 넘긴 시간 ② 단계 차이 ③ TCK-2 이유</text>
</svg>
