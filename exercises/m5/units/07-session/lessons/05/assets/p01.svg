<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>보고서는 질문마다 쓸 내용을 보고 답: 뒤에 근거와 함께 쓴다</title>
<desc>보고서를 쓸 때 지킬 다섯 가지를 체크리스트로 보여 준다. 출력은 코드 상자에 붙여 넣고, 왜를 묻는 질문은 내 화면의 값을 근거로 쓰며, 모르면 막힌 곳을 적는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">보고서 쓰는 법 · 체크리스트</text>
<rect x="20" y="56" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="70.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/>
<path d="M42,79.0 l4,5 l7,-9" fill="none" stroke="#1f7a4a" stroke-width="2"/>
<text x="72" y="84.0" font-size="15" fill="#292929">문제를 풀 때마다 그 문제 제목 아래 질문에 답한다</text>
<rect x="20" y="114" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="128.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/>
<path d="M42,137.0 l4,5 l7,-9" fill="none" stroke="#1f7a4a" stroke-width="2"/>
<text x="72" y="142.0" font-size="15" fill="#292929">「쓸 내용:」 을 보고 「답:」 뒤에 쓴다</text>
<rect x="20" y="172" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="186.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/>
<path d="M42,195.0 l4,5 l7,-9" fill="none" stroke="#1f7a4a" stroke-width="2"/>
<text x="72" y="200.0" font-size="15" fill="#292929">출력 · 코드는 「답:」 아래 빈 코드 상자에 붙여 넣는다</text>
<rect x="20" y="230" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="244.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/>
<path d="M42,253.0 l4,5 l7,-9" fill="none" stroke="#1f7a4a" stroke-width="2"/>
<text x="72" y="258.0" font-size="15" fill="#292929">「왜」는 내 화면의 값이나 배운 내용을 근거로 이유까지 쓴다</text>
<rect x="20" y="288" width="680" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="38" y="302.0" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f7a4a" stroke-width="2"/>
<path d="M42,311.0 l4,5 l7,-9" fill="none" stroke="#1f7a4a" stroke-width="2"/>
<text x="72" y="316.0" font-size="15" fill="#292929">답을 못 찾으면 「모름 — 막힌 곳: …」 이라고 쓴다</text>
</svg>
