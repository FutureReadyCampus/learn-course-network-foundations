<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Unit 7 은 Unit 6 티켓 위에 에스컬레이션과 근무 지표를 만든다</title>
<desc>Unit 6 에서 만든 티켓, 병합, 통지를 바탕으로 실습 7-1 에서는 기한 지난 열림 티켓을 상급자에게 올리고, 실습 7-2 에서는 평균 확인 시간, 평균 해결 시간, 기한 위반 수를 구해 인계 목록을 만든 뒤 깃허브에 올린다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
