<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>마무리 정리: 올릴 파일 확인, 올리기, 올린 뒤 브라우저로 확인</title>
<desc>git status 로 올릴 파일을 보고 .env 나 .venv 가 보이면 멈춘다. git add, commit, push 로 올린 뒤 브라우저에서 soar_response 폴더와 파일이 있는지 확인한다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">마무리 정리</text>
<rect x="20" y="70" width="200" height="130" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="120.0" y="119.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">올릴 파일 확인</text>
<text x="120.0" y="140.2" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<text x="120.0" y="161.2" font-size="15" fill="#292929" text-anchor="middle">.env · .venv 면 멈춤</text>
<rect x="260" y="70" width="200" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="119.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">올리기</text>
<text x="360.0" y="140.2" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<text x="360.0" y="161.2" font-size="15" fill="#292929" text-anchor="middle">commit → push</text>
<rect x="500" y="70" width="200" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="119.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">올린 뒤</text>
<text x="600.0" y="140.2" font-size="15" fill="#292929" text-anchor="middle">브라우저에서</text>
<text x="600.0" y="161.2" font-size="15" fill="#292929" text-anchor="middle">soar_response 확인</text>
<line x1="222" y1="135" x2="258" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<line x1="462" y1="135" x2="498" y2="135" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<text x="360" y="240" font-size="15" fill="#666660" text-anchor="middle">.env 는 API 키가 들어 있어 공개되면 안 된다</text>
</svg>
