<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>깃허브에 올리는 순서: 위치 확인, git status 로 .env 점검, 보고서, add·commit·push</title>
<desc>위치를 확인하고 security-agent-toolkit 으로 올라가 git status 를 본다. .env 나 .venv 가 보이면 .gitignore 에 적고 다시 본다. 보고서를 먼저 쓴 뒤 add, commit, push 하고 브라우저에서 확인한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">마무리 · 깃허브에 올리는 순서</text>
<rect x="20" y="56" width="210" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125.0" y="82.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">0. pwd · ls</text>
<text x="125.0" y="103.8" font-size="15" fill="#292929" text-anchor="middle">soar_response 확인</text>
<rect x="255" y="56" width="210" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="83.1" font-size="14" font-weight="bold" fill="#292929" text-anchor="middle">1. cd ..</text>
<text x="360.0" y="102.7" font-size="14" fill="#292929" text-anchor="middle">security-agent-toolkit</text>
<rect x="490" y="56" width="210" height="64" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="595.0" y="82.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">2. git status</text>
<text x="595.0" y="103.8" font-size="15" fill="#292929" text-anchor="middle">올릴 파일 보기</text>
<line x1="232" y1="88" x2="253" y2="88" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="467" y1="88" x2="488" y2="88" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="490" y="156" width="210" height="64" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="595.0" y="182.8" font-size="15" fill="#292929" text-anchor="middle">.env · .venv 가</text>
<text x="595.0" y="203.8" font-size="15" fill="#292929" text-anchor="middle">보이나?</text>
<rect x="255" y="156" width="210" height="64" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="182.8" font-size="15" fill="#292929" text-anchor="middle">.gitignore 에 적고</text>
<text x="360.0" y="203.8" font-size="15" fill="#292929" text-anchor="middle">git status 다시</text>
<line x1="595" y1="122" x2="595" y2="154" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="488" y1="188" x2="467" y2="188" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="470" y="178" font-size="14" fill="#666660">예</text>
<rect x="490" y="256" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="282.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">3. 보고서</text>
<text x="595.0" y="303.8" font-size="15" fill="#292929" text-anchor="middle">마무리 (가) 쓰기</text>
<rect x="255" y="256" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360.0" y="282.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">4. git add .</text>
<text x="360.0" y="303.8" font-size="15" fill="#292929" text-anchor="middle">commit → push</text>
<rect x="20" y="256" width="210" height="64" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="125.0" y="282.8" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">5. 브라우저</text>
<text x="125.0" y="303.8" font-size="15" fill="#292929" text-anchor="middle">soar_response 확인</text>
<line x1="595" y1="222" x2="595" y2="254" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="603" y="244" font-size="14" fill="#666660">아니오</text>
<line x1="488" y1="288" x2="467" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="253" y1="288" x2="232" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="346" width="680" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="377.2" font-size="15" fill="#292929" text-anchor="middle">push 가 rejected 면 git pull --no-rebase 뒤 git push 다시</text>
</svg>
