<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>Unit 7 마무리: 에스컬레이션, 근무 지표, 깃허브 반영과 평가 기준 확인 위치</title>
<desc>위에는 이번 Unit 의 실습 7-1, 실습 7-2, 마무리가 이룬 것을 차례로 놓았다. 아래에는 강의계획서 평가 기준 세 가지와 확인할 곳을 짝지었다.</desc>
<defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="20" y="34" font-size="19" font-weight="bold" fill="#292929">이번 Unit 마무리</text>
<rect x="20" y="56" width="210" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="125.0" y="90.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">실습 7-1</text>
<text x="125.0" y="111.2" font-size="15" fill="#292929" text-anchor="middle">기한 넘긴 열림 티켓</text>
<text x="125.0" y="132.2" font-size="15" fill="#292929" text-anchor="middle">단계별로 올림</text>
<rect x="255" y="56" width="210" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="90.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">실습 7-2</text>
<text x="360.0" y="111.2" font-size="15" fill="#292929" text-anchor="middle">근무 3시간</text>
<text x="360.0" y="132.2" font-size="15" fill="#292929" text-anchor="middle">MTTA · MTTR · 위반 수</text>
<rect x="490" y="56" width="210" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="90.2" font-size="15" font-weight="bold" fill="#292929" text-anchor="middle">마무리</text>
<text x="595.0" y="111.2" font-size="15" fill="#292929" text-anchor="middle">파일과 보고서를</text>
<text x="595.0" y="132.2" font-size="15" fill="#292929" text-anchor="middle">깃허브에 반영</text>
<line x1="232" y1="106" x2="253" y2="106" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<line x1="467" y1="106" x2="488" y2="106" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/>
<text x="20" y="196" font-size="15" font-weight="bold" fill="#292929">강의계획서 평가 기준 · 확인할 곳</text>
<rect x="20" y="212" width="210" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="125.0" y="251.2" font-size="15" fill="#292929" text-anchor="middle">플레이북 · 조치 내역</text>
<text x="125.0" y="272.2" font-size="15" fill="#292929" text-anchor="middle">자동 반영</text>
<text x="125.0" y="293.2" font-size="15" fill="#292929" text-anchor="middle">→ 실습 6-1 단계 3</text>
<rect x="255" y="212" width="210" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="251.2" font-size="15" fill="#292929" text-anchor="middle">기한 기준 단계별 통보</text>
<text x="360.0" y="272.2" font-size="15" fill="#292929" text-anchor="middle">→ 실습 7-1 단계 2 · 3</text>
<text x="360.0" y="293.2" font-size="15" fill="#292929" text-anchor="middle">→ 7-2 70 · 80 · 110분</text>
<rect x="490" y="212" width="210" height="110" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="595.0" y="251.2" font-size="15" fill="#292929" text-anchor="middle">알림 함수 재사용</text>
<text x="595.0" y="272.2" font-size="15" fill="#292929" text-anchor="middle">→ notify</text>
<text x="595.0" y="293.2" font-size="15" fill="#292929" text-anchor="middle">→ [알림 받음] 줄</text>
