<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 10-2 보고서: 출력 전체, 조치 없음 세 알림의 이유, minsu 거절 이유를 채운다</title>
<desc>(가)에는 출력 전체와 단계 5 처리 결과별 알림 수, 실제로 실행한 조치 두 개를 씁니다. (나)는 seoyeon · gaeun · jiwoo 의 플레이북 번호로 조치가 없는 이유와 티켓의 역할을, (다)는 minsu 의 critical 등급을 거절하는 이유와 실습 10-1 INC-402 와의 연결을 씁니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="30" font-size="19" fill="#292929" text-anchor="start" font-weight="bold">실습 10-2 보고서: 채울 칸</text>
<rect x="20" y="54" width="100" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70.0" y="99.2" font-size="15" fill="#292929" text-anchor="middle">(가)</text>
<rect x="128" y="54" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="88.8" font-size="15" fill="#292929" text-anchor="start">출력 전체(코드 상자) · 단계 5 처리 결과별 알림 수</text>
<text x="140" y="109.8" font-size="15" fill="#292929" text-anchor="start">실제로 실행한 조치 두 개</text>
<rect x="20" y="146" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="180.8" font-size="15" fill="#292929" text-anchor="middle">(나)</text>
<text x="70.0" y="201.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="128" y="146" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="180.8" font-size="15" fill="#292929" text-anchor="start">seoyeon · gaeun · jiwoo 의 단계 4 플레이북 번호</text>
<text x="140" y="201.8" font-size="15" fill="#292929" text-anchor="start">조치가 없는 이유 · 티켓이 없을 때 생기는 일</text>
<rect x="20" y="238" width="100" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="272.8" font-size="15" fill="#292929" text-anchor="middle">(다)</text>
<text x="70.0" y="293.8" font-size="15" fill="#292929" text-anchor="middle">핵심 질문</text>
<rect x="128" y="238" width="572" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="140" y="272.8" font-size="15" fill="#292929" text-anchor="start">minsu 기록의 등급 critical · 엔진 앞에서 거절하는 이유</text>
<text x="140" y="293.8" font-size="15" fill="#292929" text-anchor="start">거절 없이 넣을 때의 오류 (실습 10-1 INC-402 와 연결)</text>
</g>
</svg>
