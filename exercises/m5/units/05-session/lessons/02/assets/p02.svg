<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>조치 기록 한 건을 되돌릴지 정하는 순서: 같음 → 확인 실패 → 조치 종류</title>
<desc>기록은 나중에 한 조치부터 거꾸로 읽는다. before 와 after 가 같거나 after 에 확인 실패가 있으면 되돌리지 않고, 계정 잠금과 IP 차단은 해제로 되돌리며, 세션 종료는 되돌리기 불가로 따로 기록한다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<rect x="20" y="20" width="680" height="50" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="50.4" font-size="15" fill="#292929" text-anchor="middle">조치 기록 한 건 (나중에 한 조치부터 거꾸로 읽는다 · reversed)</text>
<line x1="200" y1="70" x2="200" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="40" y="100" width="320" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="200" y="133.4" font-size="15" fill="#292929" text-anchor="middle">before 와 after 가 같은가?</text>
<line x1="368" y1="128" x2="432" y2="128" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="400" y="120" font-size="15" fill="#666660" text-anchor="middle">예</text>
<rect x="440" y="100" width="260" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="133.4" font-size="15" fill="#292929" text-anchor="middle">되돌리지 않음 · 원래 그랬다</text>
<text x="214" y="180" font-size="15" fill="#666660">아니오</text>
<line x1="200" y1="160" x2="200" y2="188" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="40" y="190" width="320" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="200" y="223.4" font-size="15" fill="#292929" text-anchor="middle">after 에 「확인 실패」가 있는가?</text>
<line x1="368" y1="218" x2="432" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="400" y="210" font-size="15" fill="#666660" text-anchor="middle">예</text>
<rect x="440" y="190" width="260" height="56" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="570" y="223.4" font-size="15" fill="#292929" text-anchor="middle">되돌리지 않음 · 바뀐 적이 없다</text>
<text x="214" y="270" font-size="15" fill="#666660">아니오</text>
<line x1="200" y1="250" x2="200" y2="278" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="40" y="280" width="320" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="200" y="313.4" font-size="15" fill="#292929" text-anchor="middle">계정 잠금 · IP 차단인가?</text>
<line x1="368" y1="308" x2="432" y2="308" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="400" y="300" font-size="15" fill="#666660" text-anchor="middle">예</text>
<rect x="440" y="280" width="260" height="56" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="570" y="302.9" font-size="15" fill="#292929" text-anchor="middle">해제로 되돌린다</text>
<text x="570" y="323.9" font-size="15" fill="#292929" text-anchor="middle">계정 해제 · IP 해제</text>
<line x1="200" y1="338" x2="200" y2="366" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="214" y="356" font-size="15" fill="#666660">아니오 (세션 종료)</text>
<rect x="40" y="368" width="660" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="370" y="395.4" font-size="15" fill="#292929" text-anchor="middle">「되돌리기 불가」로 기록 — 사용자가 다시 로그인해야 함</text>
</svg>
