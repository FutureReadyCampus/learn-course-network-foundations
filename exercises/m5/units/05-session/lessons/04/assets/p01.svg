<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>정답 보는 법: 핵심이 같으면 맞고, 줄 수가 달라도 주석이 말한 일을 하면 맞다</title>
<desc>내 답을 정답 예와 비교할 때는 글자가 같은지가 아니라 핵심이 같은지 본다. 코드는 줄 수가 달라도 주석이 말한 일을 하면 맞다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666660"/></marker></defs>
<text x="20" y="32" font-size="18" fill="#292929" font-weight="700">정답 보는 법</text>
<rect x="20" y="60" width="180" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="110" y="94.9" font-size="15" fill="#292929" text-anchor="middle">내 답</text>
<text x="110" y="115.9" font-size="15" fill="#666660" text-anchor="middle">설명 · 코드</text>
<line x1="206" y1="100" x2="244" y2="100" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="250" y="50" width="220" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="84.4" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">핵심이 같은가?</text>
<text x="360" y="105.4" font-size="15" fill="#292929" text-anchor="middle">코드: 주석이 말한</text>
<text x="360" y="126.4" font-size="15" fill="#292929" text-anchor="middle">일을 하는가?</text>
<line x1="476" y1="100" x2="514" y2="100" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="520" y="60" width="180" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="610" y="94.9" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">맞음</text>
<text x="610" y="115.9" font-size="15" fill="#292929" text-anchor="middle">줄 수가 달라도 된다</text>
<rect x="20" y="190" width="680" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="230.4" font-size="15" fill="#292929" text-anchor="middle">설명하는 답은 한 예다 — 같은 핵심을 내 화면의 값으로 적었으면 된다</text>
</svg>
