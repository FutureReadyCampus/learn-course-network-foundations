<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img">
<title>오류가 나면 폴더 위치, 앞 파일과 데이터 파일 유무를 확인하고 복사합니다</title>
<desc>pwd 와 ls 로 폴더와 파일 이름을 확인합니다. ModuleNotFoundError 는 앞 Unit 의 파이썬 파일이, FileNotFoundError 는 데이터 파일이 없다는 뜻이므로 complete_files.md 에서 복사합니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<rect x="24" y="60" width="214" height="68" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="88.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">파일을 못 찾음</tspan><tspan x="131.0" dy="21.0">이름이 다름</tspan></text>
<rect x="272" y="60" width="200" height="68" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="88.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">pwd 가 soar_response</tspan><tspan x="372.0" dy="21.0">로 끝나는지, ls 확인</tspan></text>
<rect x="506" y="60" width="190" height="68" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="88.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">cd soar_response</tspan><tspan x="601.0" dy="21.0">파일 이름을 문서대로</tspan></text>
<line x1="238" y1="94.0" x2="270" y2="94.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="94.0" x2="504" y2="94.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="144" width="214" height="68" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="183.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">ModuleNotFoundError</tspan></text>
<rect x="272" y="144" width="200" height="68" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="172.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">앞 Unit 의 .py 파일이</tspan><tspan x="372.0" dy="21.0">이 폴더에 있는지</tspan></text>
<rect x="506" y="144" width="190" height="68" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="172.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">complete_files.md</tspan><tspan x="601.0" dy="21.0">에서 복사</tspan></text>
<line x1="238" y1="178.0" x2="270" y2="178.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="178.0" x2="504" y2="178.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="228" width="214" height="68" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="267.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">FileNotFoundError</tspan></text>
<rect x="272" y="228" width="200" height="68" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="256.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">데이터 파일이 있는지</tspan><tspan x="372.0" dy="21.0">(config 폴더 등)</tspan></text>
<rect x="506" y="228" width="190" height="68" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="256.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">complete_files.md</tspan><tspan x="601.0" dy="21.0">4절에서 복사</tspan></text>
<line x1="238" y1="262.0" x2="270" y2="262.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="262.0" x2="504" y2="262.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="24" y="312" width="214" height="68" rx="10" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="131.0" y="351.2" font-size="15" text-anchor="middle" fill="#292929"><tspan x="131.0" dy="0" font-weight="700">그 밖의 오류</tspan></text>
<rect x="272" y="312" width="200" height="68" rx="10" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="372.0" y="340.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="372.0" dy="0">친 명령 + 오류 전체</tspan><tspan x="372.0" dy="21.0">(.env·API 키 지움)</tspan></text>
<rect x="506" y="312" width="190" height="68" rx="10" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="601.0" y="340.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="601.0" dy="0">AI 에게 묻기 → 정답</tspan><tspan x="601.0" dy="21.0">→ 「모름 — 막힌 곳」</tspan></text>
<line x1="238" y1="346.0" x2="270" y2="346.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<line x1="472" y1="346.0" x2="504" y2="346.0" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
</g>
</svg>
