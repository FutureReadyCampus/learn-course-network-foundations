<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 8-1에서 쓴 판다스 문법과 리스트 문법 여덟 가지</title>
<desc>두 열 빼기, value_counts, 조건으로 행 남기기, 그룹별 평균, 두 열 비교 필터링, not in, append, 함수 결과 저장을 하려는 일과 코드로 짝지었습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p04r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p04g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p04b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">실습 8-1 정리: 하려는 일 → 코드</tspan></text>
<rect x="20" y="52" width="335" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="83.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">두 열을 빼서 새 열 만들기</tspan><tspan x="32" dy="19.6" font-size="14">acked_at - created_at → ack_minutes</tspan></text>
<rect x="365" y="52" width="335" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="377" y="83.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">값마다 개수 세기</tspan><tspan x="377" dy="19.6" font-size="14">table["rule"].value_counts()</tspan></text>
<rect x="20" y="136" width="335" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="167.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">조건으로 행 필터링하기</tspan><tspan x="32" dy="19.6" font-size="14">table[table["acked_at"] &gt;= 0]</tspan></text>
<rect x="365" y="136" width="335" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="377" y="167.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">그룹마다 평균</tspan><tspan x="377" dy="19.6" font-size="14">groups["ack_minutes"].mean()</tspan></text>
<rect x="20" y="220" width="335" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="32" y="251.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">다른 열과 비교해 필터링</tspan><tspan x="32" dy="19.6" font-size="14">table[table["acked_at"] &gt; table["sla_due"]]</tspan></text>
<rect x="365" y="220" width="335" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="377" y="251.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">리스트에 없으면</tspan><tspan x="377" dy="19.6" font-size="14">if action["incident"] not in covered:</tspan></text>
<rect x="20" y="304" width="335" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="32" y="335.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="32" font-weight="bold">리스트에 추가</tspan><tspan x="32" dy="19.6" font-size="14">missing.append(action)</tspan></text>
<rect x="365" y="304" width="335" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="377" y="335.0" font-size="15" text-anchor="start" fill="#292929"><tspan x="377" font-weight="bold">함수 결과를 변수에 저장</tspan><tspan x="377" dy="19.6" font-size="14">table = make_ticket_table(tickets)</tspan></text>
</g>
</svg>
