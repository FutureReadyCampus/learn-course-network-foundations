<desc>INC-301은 jiwoo의 세션 종료와 계정 잠금이 바뀌었고, 세션은 되돌리기 불가로 남은 채 25분 만에 복구됩니다. INC-202는 IP 차단을 풀고 5분 만에 복구되며 허용 목록 추가 검토를 제안합니다.</desc>
