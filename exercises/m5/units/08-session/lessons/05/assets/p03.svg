<text x="356" y="352" font-size="14" text-anchor="middle" fill="#292929"><tspan x="356">REQ-4</tspan></text>
<text x="356" y="374" font-size="14" text-anchor="middle" fill="#666660"><tspan x="356">자동</tspan></text>
<rect x="410" y="180" width="44" height="150" fill="#9a6200"/>
<text x="432" y="172" font-size="14" text-anchor="middle" fill="#292929" font-weight="bold"><tspan x="432">3점</tspan></text>
<text x="432" y="352" font-size="14" text-anchor="middle" fill="#292929"><tspan x="432">REQ-5</tspan></text>
<text x="432" y="374" font-size="14" text-anchor="middle" fill="#666660"><tspan x="432">승인 필요</tspan></text>
<rect x="486" y="130" width="44" height="200" fill="#9a6200"/>
<text x="508" y="122" font-size="14" text-anchor="middle" fill="#292929" font-weight="bold"><tspan x="508">4점</tspan></text>
<text x="508" y="352" font-size="14" text-anchor="middle" fill="#292929"><tspan x="508">REQ-6</tspan></text>
<text x="508" y="374" font-size="14" text-anchor="middle" fill="#666660"><tspan x="508">승인 필요</tspan></text>
