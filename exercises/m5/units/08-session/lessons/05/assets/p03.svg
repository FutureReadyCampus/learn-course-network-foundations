<text x="264" y="63" font-size="14" text-anchor="start" fill="#292929"><tspan x="264">승인 필요 3건</tspan></text>
<rect x="420" y="50" width="16" height="16" rx="3" fill="#e0442e"/>
<text x="444" y="63" font-size="14" text-anchor="start" fill="#292929"><tspan x="444">차단 금지 2건 (허용 목록)</tspan></text>
<line x1="90" y1="330" x2="700" y2="330" stroke="#666660" stroke-width="1.5"/>
<text x="80" y="335" font-size="14" text-anchor="end" fill="#666660"><tspan x="80">0점</tspan></text>
