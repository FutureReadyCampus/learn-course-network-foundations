<rect x="634" y="286" width="52" height="44" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="660" y="304" font-size="14" text-anchor="middle" fill="#292929"><tspan x="660">허용</tspan></text>
<text x="660" y="322" font-size="14" text-anchor="middle" fill="#292929"><tspan x="660">목록</tspan></text>
<text x="660" y="352" font-size="14" text-anchor="middle" fill="#292929"><tspan x="660">REQ-8</tspan></text>
<text x="660" y="374" font-size="14" text-anchor="middle" fill="#666660"><tspan x="660">차단 금지</tspan></text>
<line x1="90" y1="180" x2="700" y2="180" stroke="#e0442e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="250" y="172" font-size="14" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="250">기준 3점 이상</tspan></text>
