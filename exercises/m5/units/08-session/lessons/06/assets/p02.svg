<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>보고서 실습 8-1: (가) 출력 · (나) low가 없는 이유 · (다) INC-212</title>
<desc>(가)에는 출력 전체, 가장 많은 규칙 두 개, 리포트 줄 수를 씁니다. (나)와 (다)는 핵심 질문으로 acked_at 값과 covered 리스트를 근거로 이유를 씁니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker><marker id="a-p02r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0442e"/></marker><marker id="a-p02g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a4a"/></marker><marker id="a-p02b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="bold"><tspan x="20">보고서 · 실습 8-1 에 채울 칸</tspan></text>
<rect x="20" y="52" width="680" height="102" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="32" y="64" width="76" height="78" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="70.0" y="107.8" font-size="15" text-anchor="middle" fill="#292929"><tspan x="70.0" font-weight="bold">(가)</tspan></text>
<rect x="124" y="70" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="84" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① 출력 전체 (코드 상자에 붙여 넣기)</tspan></text>
<rect x="124" y="98" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="112" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">② 티켓이 가장 많은 규칙 두 개</tspan></text>
<rect x="124" y="126" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="140" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">③ 리포트 파일의 줄 수</tspan></text>
<rect x="20" y="166" width="680" height="102" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="32" y="178" width="76" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="212.0" font-size="15" text-anchor="middle" fill="#292929"><tspan x="70.0" font-weight="bold">(나)</tspan><tspan x="70.0" dy="19.6" font-size="14">핵심 질문</tspan></text>
<rect x="124" y="184" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="198" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① TCK-2 · TCK-5 의 acked_at</tspan></text>
<rect x="124" y="212" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="226" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">② 단계 3 에 low 가 없는 이유</tspan></text>
<rect x="124" y="240" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="254" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">③ 필터링하지 않을 때 low 의 평균 확인 시간(MTTA)</tspan></text>
<rect x="20" y="280" width="680" height="102" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<rect x="32" y="292" width="76" height="78" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="70.0" y="326.0" font-size="15" text-anchor="middle" fill="#292929"><tspan x="70.0" font-weight="bold">(다)</tspan><tspan x="70.0" dy="19.6" font-size="14">핵심 질문</tspan></text>
<rect x="124" y="298" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="312" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">① covered 에 든 인시던트 번호</tspan></text>
<rect x="124" y="326" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="340" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">② INC-212 가 나온 이유</tspan></text>
<rect x="124" y="354" width="16" height="16" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="150" y="368" font-size="15" text-anchor="start" fill="#292929"><tspan x="150">③ 이 절이 없을 때 추적 누락되는 사건</tspan></text>
</g>
</svg>
