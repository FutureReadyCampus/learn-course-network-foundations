<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>영향도 × 발생 가능성으로 점수를 내고 등급마다 필수 통제를 정한다</title><desc>영향도와 발생 가능성은 각각 1~3이고, 둘을 곱한 위험 점수는 1~9입니다. 점수 6 이상은 높음, 3 이상 6 미만은 보통, 3 미만은 낮음이며 등급마다 반드시 있어야 하는 통제가 다릅니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">위험 점수와 필수 통제</text>
<rect x="20" y="50" width="180" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="110.0" y="79" font-size="15" fill="#292929" text-anchor="middle">영향도</text>
<text x="110.0" y="101" font-size="15" fill="#292929" text-anchor="middle">1 ~ 3</text>
<text x="225" y="92" font-size="22" fill="#292929" text-anchor="middle" font-weight="700">×</text>
<rect x="250" y="50" width="180" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="340.0" y="79" font-size="15" fill="#292929" text-anchor="middle">발생 가능성</text>
<text x="340.0" y="101" font-size="15" fill="#292929" text-anchor="middle">1 ~ 3</text>
<text x="455" y="92" font-size="22" fill="#292929" text-anchor="middle" font-weight="700">=</text>
<rect x="480" y="50" width="220" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="590.0" y="79" font-size="15" fill="#292929" text-anchor="middle">위험 점수 1 ~ 9</text>
<text x="590.0" y="101" font-size="15" fill="#292929" text-anchor="middle">예: 계정 잠금 3 × 2 = 6</text>
<text x="20" y="160" font-size="15" fill="#666660" font-weight="700">등급</text>
<text x="150" y="160" font-size="15" fill="#666660" font-weight="700">점수</text>
<text x="330" y="160" font-size="15" fill="#666660" font-weight="700">반드시 있어야 하는 통제</text>
<rect x="20" y="172" width="110" height="46" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="75.0" y="200" font-size="15" fill="#292929" text-anchor="middle">높음</text>
<rect x="140" y="172" width="170" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="225.0" y="200" font-size="15" fill="#292929" text-anchor="middle">6 이상</text>
<rect x="320" y="172" width="380" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="510.0" y="200" font-size="15" fill="#292929" text-anchor="middle">승인 게이트 · 감사 기록</text>
<rect x="20" y="228" width="110" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="75.0" y="256" font-size="15" fill="#292929" text-anchor="middle">보통</text>
<rect x="140" y="228" width="170" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="225.0" y="256" font-size="15" fill="#292929" text-anchor="middle">3 이상 6 미만</text>
<rect x="320" y="228" width="380" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="510.0" y="256" font-size="15" fill="#292929" text-anchor="middle">감사 기록</text>
<rect x="20" y="284" width="110" height="46" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75.0" y="312" font-size="15" fill="#292929" text-anchor="middle">낮음</text>
<rect x="140" y="284" width="170" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="225.0" y="312" font-size="15" fill="#292929" text-anchor="middle">3 미만</text>
<rect x="320" y="284" width="380" height="46" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="510.0" y="312" font-size="15" fill="#292929" text-anchor="middle">따로 정하지 않는다</text>
<text x="20" y="368" font-size="15" fill="#666660">예방 통제(승인 게이트) · 교정 통제(되돌리기) · 탐지 통제(감사 기록)</text>
<text x="20" y="390" font-size="15" fill="#292929">세션 종료는 되돌릴 수 없어서 예방 통제가 더 중요합니다.</text>
</g></svg>
