<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>실습 9-1 함수 흐름: 점수 표 → 평가 → 출력과 문서 저장</title><desc>make_risk_table 이 점수 열을 더하고, assess_risks 가 점수가 큰 순으로 정렬하며 risk_level 과 find_missing_controls 로 등급과 빠진 통제를 붙입니다. exercise9-1_run.py 는 결과를 출력하고 risk_assessment.md 를 저장합니다.</desc><defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
