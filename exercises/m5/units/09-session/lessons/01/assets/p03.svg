<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img">
<title>Unit 9 오류가 나면: 없는 파일 이름을 보고 어디서 가져올지 고른다</title>
<desc>No module named 뒤의 이름이 Unit 8 파일이면 complete_files.md에서, Unit 5 파일이면 이전 파일 코드 상자에서 만듭니다. pandas가 없으면 가상환경에서 pip install pandas를 입력합니다.</desc>
