<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"><title>보고서 쓰는 법: 쓸 내용을 보고 답 칸을 채운다</title><desc>문제를 풀 때마다 그 제목 아래 질문에 답합니다. 질문마다 쓸 내용을 보고 답: 뒤에 쓰고, 출력은 코드 상자에 붙여 넣습니다. 왜를 묻는 질문은 화면의 값을 근거로 쓰고, 모르면 모름 — 막힌 곳을 씁니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">보고서 쓰는 법</text>
<rect x="20" y="60" width="155" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="97.5" y="89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">1</text>
<text x="97.5" y="113" font-size="15" fill="#292929" text-anchor="middle">문제를 푼다</text>
<line x1="177" y1="95" x2="193" y2="95" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="195" y="60" width="155" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="272.5" y="89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">2</text>
<text x="272.5" y="113" font-size="15" fill="#292929" text-anchor="middle">쓸 내용: 확인</text>
<line x1="352" y1="95" x2="368" y2="95" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="370" y="60" width="155" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="447.5" y="89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">3</text>
<text x="447.5" y="113" font-size="15" fill="#292929" text-anchor="middle">답: 뒤에 쓰기</text>
<line x1="527" y1="95" x2="543" y2="95" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="545" y="60" width="155" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="622.5" y="89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">4</text>
<text x="622.5" y="113" font-size="15" fill="#292929" text-anchor="middle">출력은 코드 상자</text>
<rect x="20" y="170" width="330" height="160" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185.0" y="212" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">「왜」 질문</text>
<text x="185.0" y="235" font-size="15" fill="#292929" text-anchor="middle">한 단어로 끝내지 않기</text>
<text x="185.0" y="257" font-size="15" fill="#292929" text-anchor="middle">내 화면에서 본 값이나</text>
<text x="185.0" y="278" font-size="15" fill="#292929" text-anchor="middle">배운 내용을 근거로</text>
<text x="185.0" y="300" font-size="15" fill="#292929" text-anchor="middle">이유까지 씁니다</text>
<rect x="370" y="170" width="330" height="160" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="535.0" y="223" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">[핵심 질문]</text>
<text x="535.0" y="246" font-size="15" fill="#292929" text-anchor="middle">꼭 알아야 할 질문</text>
<text x="535.0" y="268" font-size="15" fill="#292929" text-anchor="middle">답을 못 찾았으면</text>
<text x="535.0" y="289" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
</g></svg>
