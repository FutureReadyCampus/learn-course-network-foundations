<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>오늘 만든 파일을 확인하고 git add · commit · push 로 깃허브에 올린다</title><desc>soar_response 에서 파일을 확인하고 security-agent-toolkit 으로 올라가 git status 로 .env 가 섞이지 않았는지 봅니다. 보고서를 채운 뒤 add, commit, push 순서로 올리고 브라우저에서 확인합니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="28" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">마무리 · 깃허브에 올리는 순서</text>
<rect x="20" y="50" width="155" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="97.5" y="84" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">0. pwd · ls</text>
<text x="97.5" y="106" font-size="15" fill="#292929" text-anchor="middle">파일 확인</text>
<line x1="177" y1="90" x2="193" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="195" y="50" width="155" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="272.5" y="84" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1. cd ..</text>
<text x="272.5" y="106" font-size="15" fill="#292929" text-anchor="middle">위 폴더로</text>
<line x1="352" y1="90" x2="368" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="370" y="50" width="155" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="447.5" y="84" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">2. git status</text>
<text x="447.5" y="106" font-size="15" fill="#292929" text-anchor="middle">.env 확인</text>
<line x1="527" y1="90" x2="543" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="545" y="50" width="155" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="622.5" y="84" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3. 보고서</text>
<text x="622.5" y="106" font-size="15" fill="#292929" text-anchor="middle">(가) 채우기</text>
<rect x="20" y="175" width="155" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="97.5" y="209" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4. git add .</text>
<text x="97.5" y="231" font-size="15" fill="#292929" text-anchor="middle">목록에 추가</text>
<line x1="177" y1="215" x2="193" y2="215" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="195" y="175" width="155" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="272.5" y="209" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4. git commit</text>
<text x="272.5" y="231" font-size="15" fill="#292929" text-anchor="middle">기록 저장</text>
<line x1="352" y1="215" x2="368" y2="215" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="370" y="175" width="155" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="447.5" y="209" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">4. git push</text>
<text x="447.5" y="231" font-size="15" fill="#292929" text-anchor="middle">깃허브로</text>
<line x1="527" y1="215" x2="543" y2="215" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="545" y="175" width="155" height="80" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="622.5" y="209" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">5. 브라우저</text>
<text x="622.5" y="231" font-size="15" fill="#292929" text-anchor="middle">파일 보이는지</text>
<line x1="622" y1="132" x2="97" y2="171" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="20" y="290" width="330" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="185.0" y="318" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">2번에서 멈출 때</text>
<text x="185.0" y="341" font-size="15" fill="#292929" text-anchor="middle">.env · .venv 가 보이면</text>
<text x="185.0" y="363" font-size="15" fill="#292929" text-anchor="middle">.gitignore 맨 아래에 적고</text>
<text x="185.0" y="384" font-size="15" fill="#292929" text-anchor="middle">git status 다시</text>
<rect x="370" y="290" width="330" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535.0" y="328" font-size="16" fill="#9a6200" text-anchor="middle" font-weight="700">push 가 rejected 이면</text>
<text x="535.0" y="352" font-size="15" fill="#292929" text-anchor="middle">git pull --no-rebase</text>
<text x="535.0" y="373" font-size="15" fill="#292929" text-anchor="middle">그다음 git push 다시</text>
</g></svg>
