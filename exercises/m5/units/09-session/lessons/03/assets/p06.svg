<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>마무리 정리: 확인하고, 올리고, 브라우저에서 확인한다</title><desc>git status 로 올릴 파일을 확인하고 .env 나 .venv 가 보이면 멈춥니다. git add, commit, push 로 올린 뒤 브라우저에서 soar_response 폴더와 파일을 확인합니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="30" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">마무리 정리</text>
<rect x="20" y="60" width="200" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="99" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="120.0" y="122" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<text x="120.0" y="144" font-size="14" fill="#292929" text-anchor="middle">.env · .venv 가</text>
<text x="120.0" y="164" font-size="14" fill="#292929" text-anchor="middle">보이면 멈춤</text>
<rect x="260" y="60" width="200" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="98" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올리기</text>
<text x="360.0" y="121" font-size="15" fill="#292929" text-anchor="middle">git add .</text>
<text x="360.0" y="143" font-size="15" fill="#292929" text-anchor="middle">git commit -m</text>
<text x="360.0" y="164" font-size="15" fill="#292929" text-anchor="middle">git push</text>
<rect x="500" y="60" width="200" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="98" font-size="16" fill="#1f7a4a" text-anchor="middle" font-weight="700">브라우저</text>
<text x="600.0" y="121" font-size="15" fill="#292929" text-anchor="middle">soar_response</text>
<text x="600.0" y="143" font-size="15" fill="#292929" text-anchor="middle">폴더와 파일</text>
<text x="600.0" y="164" font-size="15" fill="#292929" text-anchor="middle">있는지 보기</text>
<line x1="222" y1="125" x2="256" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<line x1="462" y1="125" x2="496" y2="125" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<text x="360" y="240" font-size="15" fill="#666660" text-anchor="middle">__pycache__ 폴더는 깃허브에 없어도 됩니다.</text>
</g></svg>
