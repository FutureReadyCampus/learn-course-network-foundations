<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>실습 9-2 정리: 직접 쓴 코드 일곱 가지</title><desc>없으면, 두 결과 받기, 다르면, 거짓이면, 리스트에 없으면, 문자열 이어 추가, 함수 결과 저장의 코드 조각을 모았습니다. 왼쪽은 하려는 일, 오른쪽은 코드입니다.</desc><defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="360" y="28" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">실습 9-2 정리</text>
<rect x="20" y="45" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="71" font-size="15" fill="#292929" text-anchor="middle">문자열 안에 없으면</text>
<line x1="252" y1="66" x2="276" y2="66" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="45" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="71" font-size="14" fill="#292929">if number not in report_text:</text>
<rect x="20" y="98" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="124" font-size="15" fill="#292929" text-anchor="middle">두 결과를 함께 받기</text>
<line x1="252" y1="119" x2="276" y2="119" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="98" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="124" font-size="14" fill="#292929">decision, reasons = decide_gate(...)</text>
<rect x="20" y="151" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="177" font-size="15" fill="#292929" text-anchor="middle">다르면</text>
<line x1="252" y1="172" x2="276" y2="172" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="151" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="177" font-size="14" fill="#292929">if decision != case[&quot;expected&quot;]:</text>
<rect x="20" y="204" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="230" font-size="15" fill="#292929" text-anchor="middle">거짓이면</text>
<line x1="252" y1="225" x2="276" y2="225" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="204" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="230" font-size="14" fill="#292929">if not result[&quot;in_time&quot;]:</text>
<rect x="20" y="257" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="283" font-size="15" fill="#292929" text-anchor="middle">리스트 안에 없으면</text>
<line x1="252" y1="278" x2="276" y2="278" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="257" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="283" font-size="14" fill="#292929">if user not in state[&quot;locked_users&quot;]:</text>
<rect x="20" y="310" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="336" font-size="15" fill="#292929" text-anchor="middle">문자열을 이어 붙여 추가</text>
<line x1="252" y1="331" x2="276" y2="331" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="310" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="336" font-size="14" fill="#292929">problems.append(user + &quot; 잠금이 풀림&quot;)</text>
<rect x="20" y="363" width="230" height="42" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="135.0" y="389" font-size="15" fill="#292929" text-anchor="middle">함수 결과를 변수에 저장</text>
<line x1="252" y1="384" x2="276" y2="384" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="280" y="363" width="420" height="42" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="292" y="389" font-size="14" fill="#292929">report_problems = check_report(...)</text>
</g></svg>
