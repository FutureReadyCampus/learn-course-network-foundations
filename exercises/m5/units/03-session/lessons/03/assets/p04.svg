<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>실습 3-2 의 할 일을 각각 한 줄 코드와 짝지은 요점 지도</title>
<desc>왼쪽은 하려는 일, 오른쪽은 그 일을 하는 코드다. 재시도 함수의 결과와 오류 문장을 저장하고, startswith 로 실패 기록을 골라 목록에 추가한다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 3-2 정리: 하려는 일과 코드</text>
<rect x="20" y="56" width="160" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="80.35" font-size="15" fill="#292929" text-anchor="middle">함수 결과 담기</text>
<polyline points="182,76 208,76" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="212" y="56" width="488" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="80.06" font-size="14" fill="#292929" text-anchor="middle">result = flaky_run_action(action, incident, state, fail_plan)</text>
<rect x="20" y="106" width="160" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="130.35" font-size="15" fill="#292929" text-anchor="middle">숫자를 글자로 잇기</text>
<polyline points="182,126 208,126" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="212" y="106" width="488" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="130.06" font-size="14" fill="#292929" text-anchor="middle">result + " (시도 " + str(attempt) + "회)"</text>
<rect x="20" y="156" width="160" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="180.35" font-size="15" fill="#292929" text-anchor="middle">오류 내용을 저장</text>
<polyline points="182,176 208,176" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="212" y="156" width="488" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="180.06" font-size="14" fill="#292929" text-anchor="middle">last_error = str(error)</text>
<rect x="20" y="206" width="160" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="230.35" font-size="15" fill="#292929" text-anchor="middle">어떤 말로 시작하면</text>
<polyline points="182,226 208,226" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="212" y="206" width="488" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="230.06" font-size="14" fill="#292929" text-anchor="middle">if result.startswith("실패"):</text>
<rect x="20" y="256" width="160" height="40" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="280.35" font-size="15" fill="#292929" text-anchor="middle">리스트에 추가</text>
<polyline points="182,276 208,276" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="212" y="256" width="488" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="456" y="280.06" font-size="14" fill="#292929" text-anchor="middle">failures.append(entry)</text>
</g>
</svg>
