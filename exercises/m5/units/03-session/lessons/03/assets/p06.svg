<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>git status 로 확인하고 add, commit, push 로 올린 뒤 브라우저에서 확인한다</title>
<desc>세 단계 요점이다. git status 에서 .env 나 .venv 가 보이면 멈추고, add · commit · push 로 올린 뒤 깃허브의 soar_response 폴더에 파일이 있는지 확인한다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">마무리 정리: 올리기 전 · 올리기 · 올린 뒤</text>
<rect x="20" y="60" width="208" height="150" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="124" y="119.34" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="124" y="140.51" font-size="14" fill="#292929" text-anchor="middle">git status</text>
<text x="124" y="160.81" font-size="14" fill="#292929" text-anchor="middle">.env · .venv 가 보이면 멈춤</text>
<polyline points="230,135 254,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="256" y="60" width="208" height="150" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="109.19" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올리기</text>
<text x="360" y="130.36" font-size="14" fill="#292929" text-anchor="middle">git add .</text>
<text x="360" y="150.66" font-size="14" fill="#292929" text-anchor="middle">→ git commit -m "…"</text>
<text x="360" y="170.96" font-size="14" fill="#292929" text-anchor="middle">→ git push</text>
<polyline points="466,135 490,135" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p06)"/>
<rect x="492" y="60" width="208" height="150" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596" y="109.19" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">올린 뒤</text>
<text x="596" y="130.36" font-size="14" fill="#292929" text-anchor="middle">브라우저에서</text>
<text x="596" y="150.66" font-size="14" fill="#292929" text-anchor="middle">soar_response 폴더와</text>
<text x="596" y="170.96" font-size="14" fill="#292929" text-anchor="middle">파일 확인</text>
<text x="20" y="250" font-size="14" fill="#666660">.env 를 올리면 API 키가 인터넷에 공개됩니다.</text>
</g>
</svg>
