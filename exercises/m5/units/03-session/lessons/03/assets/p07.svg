<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>실습 3-1, 3-2, 깃허브 올리기를 마치고 Unit 4 에서 잠금 · 차단을 실제로 하고 되돌린다</title>
<desc>오늘은 담당자 결정 적용, 재시도와 하루 흐름, 깃허브 올리기를 했다. Unit 4 는 잠금과 차단을 실행 · 확인 · 되돌리기까지 만들고, Unit 5 는 맥락 붙이기와 경로 정하기를 다시 쓴다.</desc>
<defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Unit 3 마무리: 오늘 한 일과 다음 Unit</text>
<rect x="20" y="56" width="208" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="124" y="93.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 3-1</text>
<text x="124" y="116.075" font-size="15" fill="#292929" text-anchor="middle">담당자 결정 적용</text>
<text x="124" y="137.825" font-size="15" fill="#292929" text-anchor="middle">권한 없는 승인은 막음</text>
<polyline points="230,111 254,111" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="256" y="56" width="208" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="93.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 3-2</text>
<text x="360" y="116.075" font-size="15" fill="#292929" text-anchor="middle">연결 오류는 최대 3번</text>
<text x="360" y="137.825" font-size="15" fill="#292929" text-anchor="middle">하루 흐름을 한 번에</text>
<polyline points="466,111 490,111" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<rect x="492" y="56" width="208" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="596" y="93.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">마무리</text>
<text x="596" y="116.075" font-size="15" fill="#292929" text-anchor="middle">파일과 보고서를</text>
<text x="596" y="137.825" font-size="15" fill="#292929" text-anchor="middle">깃허브에 올림</text>
<rect x="20" y="206" width="330" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185" y="238.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">Unit 4</text>
<text x="185" y="261.075" font-size="15" fill="#292929" text-anchor="middle">계정 잠금 · IP 차단을</text>
<text x="185" y="282.825" font-size="15" fill="#292929" text-anchor="middle">실제로 하고, 확인하고, 되돌리기</text>
<rect x="370" y="206" width="330" height="100" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="535" y="238.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">Unit 5</text>
<text x="535" y="261.075" font-size="15" fill="#292929" text-anchor="middle">오늘 만든 맥락 붙이기와</text>
<text x="535" y="282.825" font-size="15" fill="#292929" text-anchor="middle">경로 정하기를 다시 쓴다</text>
<polyline points="360,168 185,204" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
<polyline points="360,168 535,204" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p07)"/>
</g>
</svg>
