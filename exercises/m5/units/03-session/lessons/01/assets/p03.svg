<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>오류가 나면 위치와 파일 이름을 확인하고, 없는 파일은 complete_files.md 에서 복사한다</title>
<desc>세 가지 경우를 증상, 확인, 고치기 순서로 보인다. 위치와 파일 이름을 확인하고, ModuleNotFoundError 는 앞 파일을 복사하고, 그 밖의 오류는 키를 지우고 AI 에게 묻는다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<text x="120" y="62" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">증상</text>
<text x="365" y="62" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">확인</text>
<text x="605" y="62" font-size="16" fill="#666660" text-anchor="middle" font-weight="700">고치기</text>
<rect x="20" y="76" width="200" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="120" y="116.06" font-size="14" fill="#292929" text-anchor="middle">파일을 못 찾음</text>
<rect x="250" y="76" width="230" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="105.91" font-size="14" fill="#292929" text-anchor="middle">pwd 가 soar_response 로</text>
<text x="365" y="126.21" font-size="14" fill="#292929" text-anchor="middle">끝나는지 · ls 이름 확인</text>
<rect x="510" y="76" width="190" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605" y="105.91" font-size="14" fill="#292929" text-anchor="middle">폴더 이동</text>
<text x="605" y="126.21" font-size="14" fill="#292929" text-anchor="middle">파일 이름 맞추기</text>
<polyline points="222,112 248,112" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="482,112 508,112" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="164" width="200" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="120" y="204.06" font-size="14" fill="#292929" text-anchor="middle">ModuleNotFoundError</text>
<rect x="250" y="164" width="230" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="193.91" font-size="14" fill="#292929" text-anchor="middle">incident.py · enrichment.py</text>
<text x="365" y="214.21" font-size="14" fill="#292929" text-anchor="middle">같은 앞 파일이 있는지</text>
<rect x="510" y="164" width="190" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605" y="193.91" font-size="14" fill="#292929" text-anchor="middle">complete_files.md</text>
<text x="605" y="214.21" font-size="14" fill="#292929" text-anchor="middle">에서 복사</text>
<polyline points="222,200 248,200" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="482,200 508,200" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="252" width="200" height="72" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="120" y="292.06" font-size="14" fill="#292929" text-anchor="middle">그 밖의 오류</text>
<rect x="250" y="252" width="230" height="72" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="365" y="281.91" font-size="14" fill="#292929" text-anchor="middle">오류 전체와 친 명령</text>
<text x="365" y="302.21" font-size="14" fill="#292929" text-anchor="middle">(.env · API 키는 지움)</text>
<rect x="510" y="252" width="190" height="72" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="605" y="281.91" font-size="14" fill="#292929" text-anchor="middle">AI 에게 묻기</text>
<text x="605" y="302.21" font-size="14" fill="#292929" text-anchor="middle">정답 보기 · 「모름」</text>
<polyline points="222,288 248,288" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="482,288 508,288" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="20" y="346" font-size="14" fill="#666660">실행은 VS Code 의 ▶ 단추가 아니라 터미널에서 합니다.</text>
</g>
</svg>
