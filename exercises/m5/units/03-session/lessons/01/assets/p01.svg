<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>Unit 2 에서 멈춘 알림에 실습 3-1 은 승인을, 실습 3-2 는 재시도와 하루 흐름을 더한다</title>
<desc>Unit 2 의 세 파일로 VIP 알림과 승인이 필요한 알림이 멈춰 있다. 실습 3-1 은 담당자 결정을 권한 확인 뒤 적용하고, 실습 3-2 는 연결 오류를 재시도하고 전체를 하루 흐름으로 잇는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Unit 3 목표: 멈춘 알림에 결정을 적용하고 실패를 처리한다</text>
<rect x="20" y="56" width="680" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="87.91" font-size="14" fill="#292929" text-anchor="middle">enrichment.py (맥락) · routing.py (경로) · safe_runner.py (안전장치)</text>
<text x="360" y="108.21" font-size="14" fill="#292929" text-anchor="middle">→ VIP 알림은 「승인 필요」, 승인을 요구하는 플레이북은 「승인 대기」 로 멈춤</text>
<rect x="20" y="170" width="330" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="185" y="202.015" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 3-1</text>
<text x="185" y="224.2" font-size="15" fill="#292929" text-anchor="middle">담당자 결정(승인 · 거절) 적용</text>
<text x="185" y="245.95" font-size="15" fill="#292929" text-anchor="middle">권한 없는 사람의 승인은 막기</text>
<text x="185" y="267.7" font-size="15" fill="#292929" text-anchor="middle">모든 결정을 감사 기록에 남기기</text>
<rect x="370" y="170" width="330" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="535" y="202.015" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 3-2</text>
<text x="535" y="224.2" font-size="15" fill="#292929" text-anchor="middle">연결 오류면 다시 시도</text>
<text x="535" y="245.95" font-size="15" fill="#292929" text-anchor="middle">그래도 안 되면 확인 목록에 올리기</text>
<text x="535" y="267.7" font-size="15" fill="#292929" text-anchor="middle">Unit 2 부터 만든 것을 하루 흐름으로</text>
<polyline points="185,134 185,168" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="535,134 535,168" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="352,230 368,230" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="20" y="324" font-size="14" fill="#666660">새 문법은 실습 3-2 의 try / except 하나 · 깃허브 올리기는 실습 3-2 마지막에</text>
</g>
</svg>
