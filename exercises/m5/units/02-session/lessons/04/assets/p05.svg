<text x="120" y="120.075" font-size="15" fill="#292929" text-anchor="middle">알림 보강</text>
<text x="120" y="141.825" font-size="15" fill="#292929" text-anchor="middle">재직 · VIP · 접속 IP</text>
<rect x="260" y="60" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="87.015" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 2-2</text>
<text x="360" y="109.2" font-size="15" fill="#292929" text-anchor="middle">경로 분기</text>
<text x="360" y="130.95" font-size="15" fill="#292929" text-anchor="middle">승인 필요 · 오탐 종료</text>
<text x="360" y="152.7" font-size="15" fill="#292929" text-anchor="middle">· 기본</text>
<rect x="500" y="60" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="600" y="97.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">실습 2-3</text>
<text x="600" y="120.075" font-size="15" fill="#292929" text-anchor="middle">안전장치</text>
<text x="600" y="141.825" font-size="15" fill="#292929" text-anchor="middle">중복 방지 · 잠금 3개</text>
<polyline points="222,115 258,115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="462,115 498,115" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="140" y="220" width="260" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="270" y="247.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">Unit 3 · 승인 처리</text>
<text x="270" y="270.075" font-size="15" fill="#292929" text-anchor="middle">승인 필요 경로로 간 알림을</text>
<text x="270" y="291.825" font-size="15" fill="#292929" text-anchor="middle">승인하거나 거절</text>
<rect x="440" y="220" width="260" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="570" y="247.89" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">Unit 3 · 실패 처리</text>
<text x="570" y="270.075" font-size="15" fill="#292929" text-anchor="middle">실습 2-3 실행기에서</text>
<text x="570" y="291.825" font-size="15" fill="#292929" text-anchor="middle">액션이 실패했을 때</text>
