<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>보강, 경로 분기, 안전장치가 이어지고 Unit 3 에서 승인 처리와 실패 처리를 더한다</title>
<desc>실습 2-1 보강, 실습 2-2 경로 분기, 실습 2-3 안전장치가 차례로 이어진다. Unit 3 에서는 승인 필요 경로의 승인 처리와 실행기의 실패 처리를 더해 한 흐름으로 연결한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">Unit 2 마무리: 세 실습이 하나의 흐름으로 이어진다</text>
<rect x="20" y="60" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
