  title: 자동 대응(SOAR) ⑥ — 인시던트 티케팅(ticketing) · 알림 병합(중복 제거)과 티켓 상태 전이 · 담당자 알림 전파와 재시도(retry)
  path: exercises/m5/units/06-session/unit.md
- id: m5-u07
  title: '자동 대응(SOAR) ⑦ — 에스컬레이션(escalation) 구현: 응답 기한(SLA) 초과 티켓의 상급자 통보 · 근무 3시간 시뮬레이션과 운영 지표(평균 확인 시간 · 평균 해결 시간 · 응답 기한 위반 수) 산출'
  path: exercises/m5/units/07-session/unit.md
