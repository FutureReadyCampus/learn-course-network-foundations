  title: '자동 대응(SOAR, 쏘아: 정해 둔 절차대로 대응을 자동으로 실행하는 것) ③ — 담당자 승인 처리하기 · 외부 서비스가 실패하면 다시 시도하기 · 하루 흐름 한 번에 실행하기'
