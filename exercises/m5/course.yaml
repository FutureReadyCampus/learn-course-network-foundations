  title: '자동 대응(SOAR) ⑩ — 통합 엔진(orchestration engine) soar_engine.py: 승인 게이트를 거친 조치 실행과 오류 격리(failure isolation) · 4과목 탐지 결과의 종단간(end-to-end) 연결 · 정책 준수 점검과 최종 회고'
  path: exercises/m5/units/10-session/unit.md
