  path: exercises/m5/units/08-session/unit.md
- id: m5-u09
  title: '자동 대응(SOAR) ⑨ — 리스크 평가(risk assessment): 자동 조치별 위험 점수 산출 · 통제 갭 분석 · 평가 문서 작성, 시험 사례를 이용한 Day 4 평가 기준 자동 점검'
  path: exercises/m5/units/09-session/unit.md
