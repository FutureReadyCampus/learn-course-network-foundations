<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>실습 10-3 정리: 원인을 셋으로 나누고, 각 원인에 따라 고칠 곳이 정해진다</title>
<desc>상황이 생기면 확인, 원인, 고치기, 다시 확인 순서로 생각합니다. 데이터 문제는 로그와 알림 파일을, 규칙 문제는 기준 값 다섯 곳을, 운영 설정 문제는 compose.yaml 의 ports · volumes 를 고칩니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 10-3 정리</text>
<rect x="20" y="50" width="680" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="74.6" font-size="15" fill="#292929" text-anchor="middle">확인 → 원인 → 고치기(추가 · 수정 · 삭제) → 다시 확인</text>
<rect x="20" y="106" width="214" height="44" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="127" y="132.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">데이터 문제</text>
<rect x="20" y="158" width="214" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="127" y="197.9" font-size="14" fill="#292929" text-anchor="middle">로그 줄</text>
<text x="127" y="217.5" font-size="14" fill="#292929" text-anchor="middle">normalized_events.json</text>
<text x="127" y="237.1" font-size="14" fill="#292929" text-anchor="middle">review_alerts.json</text>
<text x="127" y="256.7" font-size="14" fill="#292929" text-anchor="middle">login_alerts.json</text>
<polyline points="127,150 127,155" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="253" y="106" width="214" height="44" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="132.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">규칙 문제</text>
<rect x="253" y="158" width="214" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="197.9" font-size="14" fill="#292929" text-anchor="middle">SUSPICIOUS_STATUS</text>
<text x="360" y="217.5" font-size="14" fill="#292929" text-anchor="middle">REPEAT_LIMIT</text>
<text x="360" y="237.1" font-size="14" fill="#292929" text-anchor="middle">WINDOW_MINUTES</text>
<text x="360" y="256.7" font-size="14" fill="#292929" text-anchor="middle">WEIGHTS · TRUSTED_IPS</text>
<polyline points="360,150 360,155" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="486" y="106" width="214" height="44" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="593" y="132.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">운영 설정 문제</text>
<rect x="486" y="158" width="214" height="130" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="593" y="217.5" font-size="14" fill="#292929" text-anchor="middle">compose.yaml 의</text>
<text x="593" y="237.1" font-size="14" fill="#292929" text-anchor="middle">ports · volumes</text>
<polyline points="593,150 593,155" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<text x="20" y="318" font-size="15" fill="#666660">틀린 알림: 오탐(문제가 아닌데 난 알림) · 미탐(진짜 문제인데 나지 않은 알림)</text>
</g>
</svg>
