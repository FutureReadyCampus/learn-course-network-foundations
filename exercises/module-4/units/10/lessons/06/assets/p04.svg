<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>보고서 실습 10-3: 상황 4개 이상에 다섯 칸, 질문 세 개, 마무리 (가)</title>
<desc>상황 1 · 2 · 3 · 4 · 7 · 8 중 4개 이상에 원인 · 고칠 파일 · 어떻게 고치나요 · 고친 뒤 확인 · 먼저 할 일을 씁니다. 상황 5 · 6 은 예시입니다. 그다음 질문 (가) · (나) · (다)와 마무리 (가)를 채웁니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 실습 10-3 · 채울 칸</text>
<rect x="20" y="50" width="330" height="356" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="36" y="78" font-size="16" fill="#292929" font-weight="700">상황 정리 (4개 이상)</text>
<text x="36" y="102" font-size="14" fill="#666660">1 · 2 · 3 · 4 · 7 · 8 중 고름</text>
<rect x="36" y="127" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="58" y="140" font-size="15" fill="#292929">원인</text>
<rect x="36" y="167" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="58" y="180" font-size="15" fill="#292929">고칠 파일</text>
<rect x="36" y="207" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="58" y="220" font-size="15" fill="#292929">어떻게 고치나요</text>
<rect x="36" y="247" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="58" y="260" font-size="15" fill="#292929">고친 뒤 확인</text>
<rect x="36" y="287" width="14" height="14" rx="2" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="58" y="300" font-size="15" fill="#292929">먼저 할 일 (선택)</text>
<rect x="36" y="346" width="298" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185" y="373.3" font-size="14" fill="#292929" text-anchor="middle">상황 5 · 6 은 예시로 이미 적힘</text>
<rect x="370" y="50" width="330" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="384" y="84.8" font-size="15" fill="#292929" font-weight="700">(가) 쓴 상황 번호</text>
<text x="384" y="104.8" font-size="14" fill="#292929">못 쓴 상황과 막힌 곳</text>
<rect x="370" y="141" width="330" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="384" y="175.8" font-size="15" fill="#292929" font-weight="700">(나) [핵심 질문] 셋으로 나누기</text>
<text x="384" y="195.8" font-size="14" fill="#292929">데이터 · 규칙 · 운영 설정 + 위험한 쪽</text>
<rect x="370" y="232" width="330" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="384" y="266.8" font-size="15" fill="#292929" font-weight="700">(다) [핵심 질문] 헷갈린 로직</text>
<text x="384" y="286.8" font-size="14" fill="#292929">어떻게 이해했는지</text>
