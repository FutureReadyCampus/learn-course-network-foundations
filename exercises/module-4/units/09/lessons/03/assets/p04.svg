<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>up -d 출력은 web1 Running, web2 Recreated, web3 Created 로 서버마다 다르다</title>
<desc>설정이 같은 web1 은 그대로 실행되고, 포트 줄이 바뀐 web2 는 새 설정으로 다시 만들어지고, 새로 추가한 web3 은 새로 만들어진다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">up -d 의 출력을 서버마다 읽기</text>
<text x="87" y="66" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">서버</text>
<text x="298" y="66" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">up -d 출력</text>
<text x="571" y="66" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">뜻</text>
<rect x="12" y="80" width="150" height="41.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="87" y="106.05" font-size="15" text-anchor="middle" fill="#292929">web1</text>
<rect x="188" y="80" width="220" height="41.75" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="298" y="106.05" font-size="15" text-anchor="middle" fill="#292929">Running</text>
<line x1="165" y1="100.875" x2="185" y2="100.875" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="434" y="80" width="274" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="571" y="106.05" font-size="15" text-anchor="middle" fill="#292929">설정이 같아서 그대로 둔다</text>
<line x1="411" y1="100.875" x2="431" y2="100.875" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="131.75" width="150" height="63.5" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="87" y="168.675" font-size="15" text-anchor="middle" fill="#292929">web2</text>
<rect x="188" y="131.75" width="220" height="63.5" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="298" y="168.675" font-size="15" text-anchor="middle" fill="#292929">Recreate → Recreated</text>
<line x1="165" y1="163.5" x2="185" y2="163.5" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="434" y="131.75" width="274" height="63.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="571" y="157.8" font-size="15" text-anchor="middle" fill="#292929">포트 줄이 바뀌어 새 설정으로 다시</text>
<text x="571" y="179.55" font-size="15" text-anchor="middle" fill="#292929">만든다</text>
<line x1="411" y1="163.5" x2="431" y2="163.5" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="205.25" width="150" height="41.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="87" y="231.3" font-size="15" text-anchor="middle" fill="#292929">web3</text>
<rect x="188" y="205.25" width="220" height="41.75" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="298" y="231.3" font-size="15" text-anchor="middle" fill="#292929">Created</text>
<line x1="165" y1="226.125" x2="185" y2="226.125" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="434" y="205.25" width="274" height="41.75" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="571" y="231.3" font-size="15" text-anchor="middle" fill="#292929">새로 추가해서 새로 만든다</text>
<line x1="411" y1="226.125" x2="431" y2="226.125" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="12" y="271" width="696" height="45.75" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="299.05" font-size="15" text-anchor="middle" fill="#292929">web1 은 설정이 바뀌지 않아 끊기지 않는다. 바뀐 서버만 다시 켜지는 것이 컴포즈를 쓰는 이유다.</text>
</g>
</svg>
