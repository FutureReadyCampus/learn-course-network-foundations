<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img">
<title>판다스 설치: 가상환경을 켜고 pip 로 설치한 뒤 버전 숫자로 확인한다</title>
<desc>선택 단계입니다. 터미널 맨 앞에 (.venv) 가 있는지 보고, 없으면 가상환경을 켭니다. python -m pip install pandas 로 설치하고, 버전 숫자가 나오면 성공입니다.</desc>
<defs><marker id="a-m4u01l03-p11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l03-p11-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">선택 · Unit 3 실습 3-1 준비</text>
<rect x="24" y="56" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="89.2" font-size="15" fill="#292929">1  터미널 열기 (anomaly_detection)</text>
<line x1="189.0" y1="112" x2="189.0" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="24" y="148" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="181.2" font-size="15" fill="#292929">2  (.venv) 표시 확인</text>
<line x1="189.0" y1="204" x2="189.0" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="24" y="240" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="273.2" font-size="15" fill="#292929">3  python -m pip install pandas</text>
<line x1="189.0" y1="296" x2="189.0" y2="330" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="24" y="332" width="330" height="56" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="365.2" font-size="15" fill="#292929">4  버전 출력으로 확인</text>
<rect x="390" y="128" width="306" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="543.0" y="154.2" font-size="15" fill="#292929" text-anchor="middle">표시가 없으면 cd .. 후</text>
<text x="543.0" y="175.2" font-size="15" fill="#292929" text-anchor="middle">source .venv/Scripts/activate</text>
<text x="543.0" y="196.2" font-size="15" fill="#666660" text-anchor="middle">(맥북은 Scripts → bin)</text>
<line x1="354" y1="176" x2="386" y2="170" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="390" y="224" width="306" height="62" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="543.0" y="249.8" font-size="15" fill="#292929" text-anchor="middle">Successfully installed …</text>
<text x="543.0" y="270.8" font-size="15" fill="#292929" text-anchor="middle">또는 Requirement already …</text>
<line x1="354" y1="268" x2="386" y2="258" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="390" y="300" width="306" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="543.0" y="329.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">2.3.3 처럼 점이 든 숫자 → 성공</text>
<line x1="354" y1="350" x2="386" y2="328" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p11)"/>
<rect x="390" y="358" width="306" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="543.0" y="387.2" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">ModuleNotFoundError → 2번부터</text>
<line x1="354" y1="372" x2="386" y2="382" stroke="#e0442e" stroke-width="2" marker-end="url(#a-m4u01l03-p11-r)"/>
</g>
</svg>
