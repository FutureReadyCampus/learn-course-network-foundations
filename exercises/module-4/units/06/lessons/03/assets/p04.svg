<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>실습 6-2 는 로그인 표와 SaaS 표에서 세 규칙을 각각 돌려 단계별로 출력한다</title>
<desc>pick_logins 가 고른 로그인 7건에 업무 시간 밖 규칙과 평소와 다른 IP 규칙을 적용하고, pick_saas 가 고른 SaaS 이벤트 14개에 대량 다운로드 규칙을 적용한다. 결과는 jiwoo 1건, jiwoo 와 seoyeon, seoyeon 이다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 6-2 · saas_detection.py 의 흐름</text>
<rect x="30" y="55" width="170" height="170" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="124.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">pick_logins</text>
