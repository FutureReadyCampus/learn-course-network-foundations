<rect x="240" y="150" width="230" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="355" y="185.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">find_new_ip_users</text>
<text x="355" y="204.7" font-size="14" fill="#292929" text-anchor="middle">is not None · !=  (3 ~ 5번)</text>
