<rect x="240" y="245" width="230" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="355" y="280.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">find_bulk_download_users</text>
<text x="355" y="299.7" font-size="14" fill="#292929" text-anchor="middle">미리 채움</text>
<rect x="505" y="245" width="185" height="80" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="597.5" y="280.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 3:</text>
<text x="597.5" y="299.7" font-size="14" fill="#292929" text-anchor="middle">['seoyeon']</text>
