<line x1="200" y1="285" x2="238" y2="285" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<text x="30" y="370" font-size="15" fill="#666660">직접 쓰는 곳 다섯 군데: 1 · 2번은 함수 안(공백 4개),</text>
<text x="30" y="396" font-size="15" fill="#666660">3 · 4번은 for 안(8개), 5번은 if 안(12개)</text>
</g>
