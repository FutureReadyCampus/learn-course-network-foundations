<text x="115" y="166.2" font-size="15" fill="#292929" text-anchor="middle">7건</text>
<rect x="30" y="245" width="170" height="80" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="115" y="280.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">pick_saas</text>
<text x="115" y="299.7" font-size="14" fill="#292929" text-anchor="middle">SaaS 이벤트 14개</text>
<rect x="240" y="55" width="230" height="80" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="355" y="90.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">find_off_hours_logins</text>
<text x="355" y="109.7" font-size="14" fill="#292929" text-anchor="middle">between → ~  (1 · 2번)</text>
<rect x="505" y="55" width="185" height="80" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="597.5" y="90.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">단계 1: 1건</text>
