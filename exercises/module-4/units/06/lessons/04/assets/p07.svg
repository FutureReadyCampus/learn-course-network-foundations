<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>Unit 6에서 세 로그를 따로 탐지했고 Unit 7에서 같은 사용자끼리 이어 본다</title><desc>실습 6-1은 판정 서버 거절, 6-2는 SaaS 이상 사용, 6-3은 웹 경로 스캔을 따로 찾았습니다. Unit 7에서는 이 결과를 같은 사용자 기준으로 잇고 위험 점수를 매깁니다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">이번 Unit 마무리: 따로 찾은 탐지 3개</text><rect x="20" y="56" width="400" height="66" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="220" y="83.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 6-1 · 판정 서버</text><text x="220" y="104.8" font-size="15" text-anchor="middle" fill="#666660">거절 9건 중 반복 7건 이유로 순서 정하기</text><line x1="422" y1="89" x2="486" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/><rect x="20" y="138" width="400" height="66" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="220" y="165.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 6-2 · SaaS</text><text x="220" y="186.8" font-size="15" text-anchor="middle" fill="#666660">업무 시간 밖 · 다른 IP · 대량 다운로드</text><line x1="422" y1="171" x2="486" y2="170" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/><rect x="20" y="220" width="400" height="66" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="220" y="247.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 6-3 · 웹 서버</text><text x="220" y="268.8" font-size="15" text-anchor="middle" fill="#666660">스캐너 경로 요청 IP 나머지 실패는 제외</text><line x1="422" y1="253" x2="486" y2="200" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/><rect x="490" y="110" width="210" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="595" y="143.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">Unit 7</text><text x="595" y="164.8" font-size="15" text-anchor="middle" fill="#666660">같은 사용자 기록</text><text x="595" y="185.8" font-size="15" text-anchor="middle" fill="#666660">이어 보기(상관분석)</text><text x="595" y="206.8" font-size="15" text-anchor="middle" fill="#666660">→ 위험 점수 · 등급</text></svg>
