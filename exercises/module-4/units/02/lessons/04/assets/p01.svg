<text x="346" y="169.8" font-size="14" text-anchor="middle" fill="#292929">합치기 · 정렬</text>
<text x="346" y="190.1" font-size="14" text-anchor="middle" fill="#292929">세기 · 저장</text>
<line x1="448" y1="165" x2="478" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
