<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>세 로그를 같은 사용자로 연결하고 점수를 더해 등급을 파일에 저장한다</title><desc>Unit 7은 두 실습으로 이루어집니다. 실습 7-1은 서버·SaaS·웹 로그를 사용자 기준으로 연결하고, 실습 7-2는 탐지된 규칙에 점수를 더해 high·mid·low와 이유를 unit05_risk_scores.json에 저장합니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">Unit 7 목표: 로그 연결 → 위험 점수</text><rect x="20" y="56" width="160" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="100" y="85.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">판정 서버 로그</text><line x1="182" y1="80" x2="216" y2="110" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="118" width="160" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="100" y="147.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SaaS 로그</text><line x1="182" y1="142" x2="216" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="180" width="160" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="100" y="209.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 서버 로그</text><line x1="182" y1="204" x2="216" y2="170" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="220" y="70" width="220" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="330" y="113.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 7-1 · 연결</text><text x="330" y="134.8" font-size="15" text-anchor="middle" fill="#666660">같은 사용자</text><text x="330" y="155.8" font-size="15" text-anchor="middle" fill="#666660">서로 다른 로그 2종류 이상</text><text x="330" y="176.8" font-size="15" text-anchor="middle" fill="#666660">60분 이내</text><rect x="476" y="70" width="224" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="588" y="113.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 7-2 · 점수</text><text x="588" y="134.8" font-size="15" text-anchor="middle" fill="#666660">규칙마다 점수 더하기</text><text x="588" y="155.8" font-size="15" text-anchor="middle" fill="#666660">high 60 이상</text><text x="588" y="176.8" font-size="15" text-anchor="middle" fill="#666660">mid 35 이상 · 나머지 low</text><line x1="442" y1="140" x2="472" y2="140" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="476" y="240" width="224" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="588" y="270.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">unit05_risk_scores.json</text><line x1="588" y1="212" x2="588" y2="236" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><text x="20" y="266" font-size="15" text-anchor="start" fill="#666660">샘플 이벤트 57개 (2026-11-02)</text><text x="20" y="292" font-size="15" text-anchor="start" fill="#666660">웹 서버 28 · 판정 서버 15 · SaaS 14</text><text x="20" y="338" font-size="15" text-anchor="start" fill="#666660">기준 값은 고정하고 바꿔 가며 비교하지 않는다 · 올리기는 실습 7-2 마지막</text></svg>
