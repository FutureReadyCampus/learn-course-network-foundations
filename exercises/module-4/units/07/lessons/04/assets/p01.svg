<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답 보는 법: 내 답과 정답 예시의 핵심이 같으면 맞습니다</title>
<desc>내가 쓴 답과 문서의 정답 예시를 나란히 놓고 핵심이 같은지 봅니다. 코드는 줄 수가 달라도 주석이 말한 일을 하면 맞고, 핵심이 다르면 그 부분을 다시 봅니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 보는 법</text>
<rect x="20" y="60" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">내가 쓴 답</text>
<text x="120.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">코드 · 보고서 답</text>
<rect x="20" y="170" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="210.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">정답 (한 예)</text>
<text x="120.0" y="231.6" font-size="15" fill="#292929" text-anchor="middle">이 문서의 코드 · 출력</text>
<rect x="270" y="105" width="180" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="144.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">핵심이 같은가?</text>
<text x="360.0" y="166.1" font-size="15" fill="#292929" text-anchor="middle">주석이 말한 일을</text>
<text x="360.0" y="187.1" font-size="15" fill="#292929" text-anchor="middle">하고 있는가?</text>
<polyline points="220,105 266,140" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="220,215 266,180" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="500" y="60" width="200" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">맞습니다</text>
<text x="600.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">줄 수가 달라도 됩니다</text>
<rect x="500" y="170" width="200" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600.0" y="210.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">다시 봅니다</text>
<text x="600.0" y="231.6" font-size="15" fill="#292929" text-anchor="middle">다른 곳을 찾아 고칩니다</text>
<polyline points="450,140 496,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,180 496,215" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="470" y="112" font-size="15" fill="#1f7a4a" text-anchor="middle">예</text>
<text x="470" y="226" font-size="15" fill="#9a6200" text-anchor="middle">아니오</text>
</g>
</svg>
