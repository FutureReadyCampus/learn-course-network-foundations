<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>실습 8-2 목표: 협력사 IP 의 'SaaS 평소와 다른 IP' 알림만 빼고 진짜 문제는 남깁니다</title>
<desc>오탐 A4 · A5 는 모두 협력사 사무실 IP 203.0.113.80 에서 왔습니다. tuning.py 가 이 IP 에서 온 IP 규칙 알림만 빼면 오탐이 줄고, 빼낸 알림 중 진짜 문제가 0개인지 확인합니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">목표: 믿는 IP 예외 규칙</text>
<rect x="20" y="62" width="200" height="110" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="101.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">알림 7개</text>
<text x="120.0" y="123.1" font-size="15" fill="#292929" text-anchor="middle">오탐 A4 · A5 가</text>
<text x="120.0" y="144.1" font-size="15" fill="#292929" text-anchor="middle">203.0.113.80 에서</text>
<rect x="260" y="62" width="200" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="101.8" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">tuning.py</text>
<text x="360.0" y="123.1" font-size="15" fill="#292929" text-anchor="middle">IP 규칙 + 믿는 IP</text>
<text x="360.0" y="144.1" font-size="15" fill="#292929" text-anchor="middle">인 알림만 빼기</text>
<rect x="500" y="62" width="200" height="50" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600.0" y="92.0" font-size="14" fill="#292929" text-anchor="middle">오탐 수가 줄었는가</text>
<rect x="500" y="122" width="200" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600.0" y="152.0" font-size="14" fill="#292929" text-anchor="middle">빠진 진짜 문제 0개?</text>
<polyline points="220,117 256,117" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="460,105 496,87" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="460,129 496,147" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="200" width="680" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="245.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">단, 진짜 문제까지 같이 지워지면 안 됩니다</text>
<text x="360.0" y="266.6" font-size="15" fill="#292929" text-anchor="middle">예외를 넓게 만들면 같은 IP 에서 온 진짜 문제 알림까지 사라질 수 있습니다</text>
</g>
</svg>
