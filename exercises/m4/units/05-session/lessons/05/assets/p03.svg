<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>실습 5-2 보고서는 출력과 alerts.json, 두 알림의 관계, 상태 변경, 올리기를 채운다</title>
<desc>실습 5-2 보고서의 칸이다. (가)는 출력과 alerts.json 내용, 건수를 붙인다. (나)와 (다)는 핵심 질문이고, 마무리 (가)는 git status 에서 .env 나 .venv 를 봤는지 쓴다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
