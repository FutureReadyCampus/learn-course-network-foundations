<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>실패 이벤트 23개를 사용자별·시간대별로 묶어 세고 CSV 로 저장하는 목표</title>
<desc>실패한 이벤트 23개를 events_time.py 가 묶고 셉니다. 결과는 사용자별 실패 횟수, 시간대별 실패 횟수, 그리고 엑셀로 열어 볼 failed_events.csv 입니다.</desc>
<defs><marker id="a-0303-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">목표: 실패를 묶어 세고 CSV 로 저장</text>
<rect x="24" y="112" width="190" height="110" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="119.0" y="161.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">실패한 이벤트</text>
<text x="119.0" y="182.8" font-size="15" fill="#666660" text-anchor="middle">23개</text>
<line x1="217" y1="167" x2="243" y2="167" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p01)"/>
<rect x="246" y="112" width="180" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="336.0" y="161.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">events_time.py</text>
<text x="336.0" y="182.8" font-size="15" fill="#666660" text-anchor="middle">묶기 · 세기 · 저장</text>
<rect x="460" y="72" width="236" height="58" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="578.0" y="95.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">사용자별 실패 횟수</text>
<text x="578.0" y="116.8" font-size="15" fill="#666660" text-anchor="middle">많은 순서대로</text>
<line x1="429" y1="167" x2="457" y2="101" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p01)"/>
<rect x="460" y="142" width="236" height="58" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="578.0" y="165.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">시간대별 실패 횟수</text>
<text x="578.0" y="186.8" font-size="15" fill="#666660" text-anchor="middle">몇 시에 몇 개</text>
<line x1="429" y1="167" x2="457" y2="171" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p01)"/>
<rect x="460" y="212" width="236" height="58" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="578.0" y="235.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">failed_events.csv</text>
<text x="578.0" y="256.8" font-size="15" fill="#666660" text-anchor="middle">엑셀로 근거 확인</text>
<line x1="429" y1="167" x2="457" y2="241" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p01)"/>
<text x="24" y="310" font-size="14" fill="#666660" text-anchor="start">합계만 보면 평범한 숫자 → 묶으면 한 사용자 · 한 시간대에 몰린 실패가 드러납니다</text>
</svg>
