<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>마무리 정리: git status 확인 → add·commit·push → 브라우저에서 확인</title>
<desc>git status 로 올릴 파일을 보고 .env 나 .venv 가 보이면 멈춥니다. git add, git commit, git push 로 올린 뒤 브라우저에서 anomaly_detection 폴더와 파일을 확인합니다.</desc>
<defs><marker id="a-0303-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">마무리 정리</text>
<rect x="24" y="70" width="204.0" height="116" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="126.0" y="112.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">git status</text>
<text x="126.0" y="133.2" font-size="15" fill="#666660" text-anchor="middle">올릴 파일 확인</text>
<text x="126.0" y="154.2" font-size="15" fill="#666660" text-anchor="middle">.env · .venv 면 멈춤</text>
<line x1="231.0" y1="128.0" x2="255.0" y2="128.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p08)"/>
<rect x="258.0" y="70" width="204.0" height="116" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="112.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">git add .</text>
<text x="360.0" y="133.2" font-size="15" fill="#666660" text-anchor="middle">git commit -m "…"</text>
<text x="360.0" y="154.2" font-size="15" fill="#666660" text-anchor="middle">git push</text>
<line x1="465.0" y1="128.0" x2="489.0" y2="128.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0303-p08)"/>
<rect x="492.0" y="70" width="204.0" height="116" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="594.0" y="112.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">브라우저</text>
<text x="594.0" y="133.2" font-size="15" fill="#666660" text-anchor="middle">anomaly_detection</text>
<text x="594.0" y="154.2" font-size="15" fill="#666660" text-anchor="middle">폴더 · 파일 확인</text>
<text x="24" y="236" font-size="14" fill="#666660" text-anchor="start">올리기 전에 보고서 칸을 먼저 채웁니다</text>
</svg>
