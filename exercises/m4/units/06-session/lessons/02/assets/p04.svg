<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 6-1 은 서버 실패 9개에서 7개를 골라 판정하고 이유별 순서로 출력한다</title>
<desc>load_events 로 읽고 pick_server_failures 가 실패 9개, pick_suspicious 가 7개를 고른다. judge_failure 가 행동을 나눠 check_permission 으로 판정하고 PRIORITY 로 순서를 꺼낸다. 단계 3 은 1순위 dami 4줄, 3순위 gaeun 3줄이다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 6-1 · access_detection.py 의 흐름</text>
<rect x="30" y="55" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="130" y="85.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">load_events</text>
<text x="130" y="104.7" font-size="14" fill="#292929" text-anchor="middle">이벤트 57개</text>
<rect x="260" y="55" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="85.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">pick_server_failures</text>
<text x="360" y="104.7" font-size="14" fill="#292929" text-anchor="middle">단계 1: 9개</text>
<rect x="490" y="55" width="200" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="590" y="85.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">pick_suspicious</text>
<text x="590" y="104.7" font-size="14" fill="#292929" text-anchor="middle">단계 2: 7개 (1 ~ 3번)</text>
<line x1="230" y1="90" x2="258" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="460" y1="90" x2="488" y2="90" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="150" y="165" width="540" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="420" y="195.3" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">judge_failure(user, action)  · 4 ~ 6번</text>
<text x="420" y="214.9" font-size="14" fill="#292929" text-anchor="middle">"SALES:QUERY" → SALES, QUERY → check_permission</text>
<text x="420" y="234.5" font-size="14" fill="#292929" text-anchor="middle">→ reason → PRIORITY.get(reason, 4)</text>
<line x1="590" y1="125" x2="590" y2="163" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="30" y="290" width="320" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="190" y="319.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">1 · 퇴사한 계정</text>
<text x="190" y="340.8" font-size="15" fill="#292929" text-anchor="middle">dami 4줄</text>
<rect x="370" y="290" width="320" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="530" y="319.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">3 · 규칙은 허용인데 서버가 거절</text>
<text x="530" y="340.8" font-size="15" fill="#292929" text-anchor="middle">gaeun 3줄</text>
<line x1="300" y1="255" x2="200" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<line x1="530" y1="255" x2="530" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<text x="30" y="388" font-size="15" fill="#666660">단계 3 은 7줄 · 우선순위 작은 것부터 출력</text>
</g>
</svg>
