<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>해킹 도구는 정해진 경로를 차례로 요청하고, 그중 하나라도 요청하면 스캔으로 본다</title><desc>해킹 도구가 자주 요청하는 세 경로와 각각의 뜻을 보여 줍니다. 실패한 요청 중에 이 경로가 하나라도 있으면 이번 규칙에서는 스캔으로 보지만 공격으로 확정하는 것은 아닙니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">해킹 도구가 차례로 요청하는 경로</text><rect x="20" y="60" width="160" height="210" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="100" y="128.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">해킹 도구</text><text x="100" y="149.2" font-size="15" text-anchor="middle" fill="#666660">접근할 수 있는</text><text x="100" y="170.2" font-size="15" text-anchor="middle" fill="#666660">곳을 찾으려고</text><text x="100" y="191.2" font-size="15" text-anchor="middle" fill="#666660">정해진 경로를</text><text x="100" y="212.2" font-size="15" text-anchor="middle" fill="#666660">차례로 요청</text><rect x="240" y="60" width="460" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="470" y="83.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">/.env</text><text x="470" y="104.8" font-size="15" text-anchor="middle" fill="#666660">비밀번호와 키가 든 설정 파일</text><line x1="182" y1="165" x2="236" y2="89" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="240" y="136" width="460" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="470" y="159.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">/wp-login.php</text><text x="470" y="180.8" font-size="15" text-anchor="middle" fill="#666660">워드프레스 로그인 화면</text><line x1="182" y1="165" x2="236" y2="165" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="240" y="212" width="460" height="58" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="470" y="235.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">/phpmyadmin</text><text x="470" y="256.8" font-size="15" text-anchor="middle" fill="#666660">데이터베이스 관리 화면</text><line x1="182" y1="165" x2="236" y2="241" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="20" y="290" width="680" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="360" y="321.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실패한 요청 중 이 경로가 하나라도 있으면 → 스캔으로 본다 (공격 확정은 아님)</text></svg>
