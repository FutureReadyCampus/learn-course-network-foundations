<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>실습 6-3 정리: 경로 확인, 행 고르기, IP별 개수, 이유 문장 연결의 네 줄</title><desc>실습 6-3에서 쓴 네 줄을 순서대로 이었습니다. str.contains로 True/False를 만들고, True인 행만 고른 뒤 value_counts로 세고, 문자열을 + 로 연결해 이유를 만듭니다.</desc><defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 6-3 정리: 네 줄의 흐름</text><rect x="20" y="52" width="170" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="105" y="82.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">1. 문자열이 들어 있는지</text><rect x="220" y="52" width="480" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="460" y="82.9" font-size="14" text-anchor="middle" fill="#292929">is_scanner = actions.str.contains(SCANNER_PATTERN)</text><line x1="192" y1="78" x2="216" y2="78" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="122" width="170" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="105" y="152.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">2. 조건에 맞는 행만</text><rect x="220" y="122" width="480" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="460" y="152.9" font-size="14" text-anchor="middle" fill="#292929">scanner_rows = web_failures[is_scanner]</text><line x1="192" y1="148" x2="216" y2="148" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="105" y1="105" x2="105" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="192" width="170" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="105" y="222.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">3. 이름별 개수</text><rect x="220" y="192" width="480" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="460" y="222.9" font-size="14" text-anchor="middle" fill="#292929">scan_counts = scanner_rows["ip"].value_counts()</text><line x1="192" y1="218" x2="216" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="105" y1="175" x2="105" y2="190" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><rect x="20" y="262" width="170" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="105" y="292.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">4. 문자열 연결</text><rect x="220" y="262" width="480" height="52" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="460" y="292.9" font-size="14" text-anchor="middle" fill="#292929">reason = "스캐너 경로를 " + str(request_count) + "번 요청"</text><line x1="192" y1="288" x2="216" y2="288" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/><line x1="105" y1="245" x2="105" y2="260" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/></svg>
