<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>웹 실패 기록 13건 중 스캐너 경로를 요청한 IP만 가려내는 의뢰</title><desc>웹 서버의 11/2 실패 기록 13건에는 사용자의 실수와 스캐너 경로 요청이 섞여 있습니다. 해킹 도구가 자주 요청하는 경로를 요청한 IP만 골라 스캔으로 봅니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">이번 의뢰: 실패 기록 13건을 두 갈래로 나누기</text><rect x="20" y="130" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="120" y="169.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 서버 실패 기록</text><text x="120" y="190.8" font-size="15" text-anchor="middle" fill="#292929">11/2 · 13건</text><rect x="300" y="62" width="400" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="500" y="94.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">잘못 입력한 경로 · 없는 게시글</text><text x="500" y="115.2" font-size="15" text-anchor="middle" fill="#666660">일반 사용자도 실패로 남는다</text><text x="500" y="136.2" font-size="15" text-anchor="middle" fill="#666660">→ 이번 규칙에서 제외</text><rect x="300" y="192" width="400" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="500" y="224.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">/.env · /phpmyadmin 같은 경로</text><text x="500" y="245.2" font-size="15" text-anchor="middle" fill="#666660">일반 사용자는 열 일이 없다</text><text x="500" y="266.2" font-size="15" text-anchor="middle" fill="#666660">→ 경로 스캔 IP로 가려낸다</text><line x1="222" y1="165" x2="296" y2="112" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><line x1="222" y1="185" x2="296" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><text x="20" y="322" font-size="15" text-anchor="start" fill="#666660">실패를 모두 알림으로 보내면 알림이 너무 많아져 진짜 경로 스캔을 놓칠 수 있다</text></svg>
