<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>정답은 한 예이므로 핵심이 같으면 맞고, 줄 수가 달라도 된다</title><desc>내 답을 정답 예시와 비교할 때 글자가 똑같은지가 아니라 핵심이 같은지를 봅니다. 코드는 줄 수가 달라도 주석이 말한 일을 하면 맞습니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답 보는 법</text><rect x="20" y="70" width="204" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="122" y="109.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">내 답</text><text x="122" y="130.8" font-size="15" text-anchor="middle" fill="#292929">설명 · 채운 코드</text><rect x="258" y="70" width="204" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="109.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">정답 예시와 비교</text><text x="360" y="130.8" font-size="15" text-anchor="middle" fill="#292929">핵심이 같은가?</text><line x1="227" y1="115" x2="254" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="496" y="70" width="204" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="598" y="109.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">맞음</text><text x="598" y="130.8" font-size="15" text-anchor="middle" fill="#292929">표현이 달라도 된다</text><line x1="465" y1="115" x2="492" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="196" width="680" height="72" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="360" y="226.8" font-size="15" text-anchor="middle" fill="#292929">코드: 줄 수가 달라도 주석이 말한 일을 하면 맞습니다</text><text x="360" y="247.8" font-size="15" text-anchor="middle" fill="#292929">출력: 숫자와 사용자 이름이 정답 출력과 같은지 봅니다</text></svg>
