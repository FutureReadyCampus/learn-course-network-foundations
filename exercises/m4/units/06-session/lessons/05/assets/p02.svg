<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>실습 6-1 정답: 서버 실패 9개 중 7개를 먼저 보고 dami가 1순위다</title><desc>판정 서버 실패 9개 중 3번 이상 반복된 사용자의 이벤트 7개를 고릅니다. 다시 판정하면 dami 4건은 퇴사한 계정(1순위), gaeun 3건은 규칙은 허용인데 서버가 거절(3순위)이고 seoyeon 2건은 기준에 못 미쳐 빠집니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 6-1 정답: 9개 → 7개 → 이유별 순서</text><rect x="20" y="60" width="150" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="95" y="99.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">서버 실패</text><text x="95" y="120.8" font-size="15" text-anchor="middle" fill="#292929">9개</text><rect x="210" y="60" width="150" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="285" y="99.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">반복된 사용자</text><text x="285" y="120.8" font-size="15" text-anchor="middle" fill="#292929">7개</text><line x1="172" y1="105" x2="206" y2="105" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="400" y="50" width="300" height="52" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="550" y="81.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">1순위 · dami 4건 · 퇴사한 계정</text><rect x="400" y="110" width="300" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="550" y="140.9" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">3순위 · gaeun 3건 · 허용인데 거절</text><line x1="362" y1="100" x2="396" y2="76" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><line x1="362" y1="110" x2="396" y2="136" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="20" y="180" width="340" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="190" y="209.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">seoyeon 2건은 제외</text><text x="190" y="230.8" font-size="15" text-anchor="middle" fill="#666660">반복 기준(3번)에 못 미침</text><rect x="400" y="180" width="300" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="550" y="209.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">gaeun: 공격 확정 불가</text><text x="550" y="230.8" font-size="15" text-anchor="middle" fill="#666660">서버가 거절한 이유부터 확인</text><text x="20" y="290" font-size="16" text-anchor="start" fill="#292929" font-weight="700">자주 틀리는 곳</text><text x="20" y="320" font-size="15" text-anchor="start" fill="#292929">.index 를 빼면 → 오류 없이 단계 2가 0개</text><text x="20" y="350" font-size="15" text-anchor="start" fill="#292929">.index() 처럼 괄호를 붙이면 → TypeError: 'Index' object is not callable</text></svg>
