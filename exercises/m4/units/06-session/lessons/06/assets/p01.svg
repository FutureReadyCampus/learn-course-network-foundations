<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>보고서는 문제마다 쓸 내용을 보고 답: 뒤에 근거와 함께 쓴다</title><desc>문제를 풀 때마다 그 제목 아래 질문에 답합니다. 출력은 코드 상자에 붙이고, 왜를 묻는 질문은 내 화면의 값으로 이유까지 쓰며, 모르면 모름 — 막힌 곳으로 적습니다.</desc><defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">보고서 쓰는 법</text><rect x="20" y="56" width="204" height="84" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="122" y="103.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">문제 하나 풀기</text><rect x="258" y="56" width="204" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="360" y="103.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">쓸 내용: 확인</text><line x1="227" y1="98" x2="254" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="496" y="56" width="204" height="84" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="598" y="103.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">답: 뒤에 쓰기</text><line x1="465" y1="98" x2="492" y2="98" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/><rect x="20" y="170" width="216" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="128" y="213.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">출력 · 코드</text><text x="128" y="234.8" font-size="15" text-anchor="middle" fill="#666660">답: 아래</text><text x="128" y="255.8" font-size="15" text-anchor="middle" fill="#666660">빈 코드 상자에</text><text x="128" y="276.8" font-size="15" text-anchor="middle" fill="#666660">붙여 넣기</text><rect x="252" y="170" width="216" height="140" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/><text x="360" y="213.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">「왜」 질문</text><text x="360" y="234.8" font-size="15" text-anchor="middle" fill="#666660">한 단어 말고</text><text x="360" y="255.8" font-size="15" text-anchor="middle" fill="#666660">내 화면의 값으로</text><text x="360" y="276.8" font-size="15" text-anchor="middle" fill="#666660">이유까지</text><rect x="484" y="170" width="216" height="140" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="592" y="213.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">[핵심 질문]</text><text x="592" y="234.8" font-size="15" text-anchor="middle" fill="#666660">꼭 답할 질문</text><text x="592" y="255.8" font-size="15" text-anchor="middle" fill="#666660">모르면</text><text x="592" y="276.8" font-size="15" text-anchor="middle" fill="#666660">모름 — 막힌 곳: …</text></svg>
