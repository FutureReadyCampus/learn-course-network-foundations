<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 6-2 정리: between 과 ~ 로 업무 시간 밖을, is not None 과 != 로 새 IP 를 찾는다</title>
<desc>업무 시간 밖 로그인은 hours 를 between 으로 업무 시간 안인지 구한 뒤 ~ 로 뒤집는다. 평소와 다른 IP 는 평소 기록이 있고 IP 가 다를 때만 사용자를 리스트에 추가한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="30" y="32" font-size="19" fill="#292929" font-weight="700">실습 6-2 정리</text>
<text x="30" y="66" font-size="16" fill="#292929" font-weight="700">업무 시간 밖 로그인</text>
<rect x="30" y="80" width="140" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="100" y="110.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">hours</text>
<text x="100" y="129.7" font-size="14" fill="#292929" text-anchor="middle">시 0 ~ 23</text>
<rect x="205" y="80" width="230" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="320" y="110.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">is_business_hour</text>
<text x="320" y="129.7" font-size="14" fill="#292929" text-anchor="middle">hours.between(8, 20)</text>
<rect x="470" y="80" width="220" height="70" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="580" y="110.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">is_off_hours</text>
<text x="580" y="129.7" font-size="14" fill="#292929" text-anchor="middle">~is_business_hour</text>
<line x1="170" y1="115" x2="203" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="435" y1="115" x2="468" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="30" y="196" font-size="16" fill="#292929" font-weight="700">평소와 다른 IP</text>
<rect x="30" y="210" width="190" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="125" y="240.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">has_usual_ip</text>
<text x="125" y="259.7" font-size="14" fill="#292929" text-anchor="middle">usual_ip is not None</text>
<rect x="245" y="210" width="175" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="332.5" y="240.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">is_new_ip</text>
<text x="332.5" y="259.7" font-size="14" fill="#292929" text-anchor="middle">ip != usual_ip</text>
<rect x="455" y="210" width="235" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="572.5" y="240.1" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">둘 다 True 이면</text>
<text x="572.5" y="259.7" font-size="14" fill="#292929" text-anchor="middle">new_ip_users.append(user)</text>
<line x1="220" y1="245" x2="243" y2="245" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<line x1="420" y1="245" x2="453" y2="245" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="30" y="320" font-size="14" fill="#666660">between 은 8 과 20 자체도 포함합니다 · None 은 어떤 IP 와도 달라서 먼저 뺍니다.</text>
</g>
</svg>
