<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>보고서 쓰는 법: 질문의 「쓸 내용」을 보고 「답:」 뒤에 쓰거나 코드 상자에 붙여 넣는다</title>
<desc>질문마다 쓸 내용이 적혀 있습니다. 출력이나 코드는 답: 아래 빈 코드 상자에 붙여 넣고 설명은 답: 뒤에 씁니다. 답을 못 찾으면 「모름 — 막힌 곳: …」 이라고 씁니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">보고서 쓰는 법</text>
<rect x="20" y="60" width="200" height="100" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="120" y="95" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">질문</text>
<text x="120" y="115" font-size="14" fill="#292929" text-anchor="middle">(가) · (나) · (다)</text>
<text x="120" y="134.6" font-size="14" fill="#666660" text-anchor="middle">[핵심 질문] 표시</text>
<rect x="250" y="60" width="200" height="100" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="350" y="95" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">쓸 내용</text>
<text x="350" y="115" font-size="14" fill="#292929" text-anchor="middle">① ② ③ 무엇을</text>
<text x="350" y="134.6" font-size="14" fill="#292929" text-anchor="middle">쓰는지 안내</text>
<rect x="480" y="60" width="220" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590" y="87.6" font-size="15" fill="#292929" text-anchor="middle">답: 뒤 → 설명</text>
<rect x="480" y="114" width="220" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590" y="141.3" font-size="14" fill="#292929" text-anchor="middle">코드 상자 → 출력 · 코드</text>
<polyline points="220,110 246,110" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,100 476,83" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,120 476,137" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="20" y="186" width="330" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="185" y="219.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">「왜」 질문</text>
<text x="185" y="240.1" font-size="15" fill="#292929" text-anchor="middle">한 단어로 끝내지 않기</text>
<text x="185" y="261.1" font-size="15" fill="#292929" text-anchor="middle">내 화면의 값이나</text>
<text x="185" y="282.1" font-size="15" fill="#292929" text-anchor="middle">배운 내용을 근거로</text>
<rect x="370" y="186" width="330" height="120" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="535" y="220.5" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">답을 못 찾으면</text>
<text x="535" y="241.5" font-size="15" fill="#292929" text-anchor="middle">「모름 — 막힌 곳: …」</text>
<text x="535" y="261.5" font-size="14" fill="#666660" text-anchor="middle">[핵심 질문]이 아니어도</text>
<text x="535" y="281.1" font-size="14" fill="#666660" text-anchor="middle">같은 말을 씀</text>
</g>
</svg>
