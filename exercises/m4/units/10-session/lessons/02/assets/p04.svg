<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>low 가 아닌 앞의 3명을 고르고, 지시문과 [사실] 한 줄을 합쳐 AI 에게 보낸다</title>
<desc>점수 순으로 저장된 기록 5건 가운데 low 가 아닌 대상을 앞에서부터 3명(dami · seoyeon · gaeun) 고릅니다. 규칙 이름은 RULE_MEANING 의 사실 문장으로 바꿔 "; ".join 으로 잇고, 지시문 뒤에 [사실] 한 줄로 붙입니다. 호출이 실패하면 FAIL_TEXT 를 씁니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">요약할 대상과 AI 에게 보내는 글</text>
<text x="30" y="70" font-size="15" fill="#666660">대상</text>
<text x="170" y="70" font-size="15" fill="#666660">점수</text>
<text x="220" y="70" font-size="15" fill="#666660">등급</text>
<rect x="20" y="80" width="320" height="38" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="30" y="105" font-size="15" fill="#292929">dami</text>
<text x="170" y="105" font-size="15" fill="#292929">60</text>
<text x="220" y="105" font-size="15" fill="#292929">high</text>
<text x="330" y="105" font-size="14" fill="#666660" text-anchor="end">고름</text>
<rect x="20" y="124" width="320" height="38" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="30" y="149" font-size="15" fill="#292929">seoyeon</text>
<text x="170" y="149" font-size="15" fill="#292929">45</text>
<text x="220" y="149" font-size="15" fill="#292929">mid</text>
<text x="330" y="149" font-size="14" fill="#666660" text-anchor="end">고름</text>
<rect x="20" y="168" width="320" height="38" rx="4" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="30" y="193" font-size="15" fill="#292929">gaeun</text>
<text x="170" y="193" font-size="15" fill="#292929">40</text>
<text x="220" y="193" font-size="15" fill="#292929">mid</text>
<text x="330" y="193" font-size="14" fill="#666660" text-anchor="end">고름</text>
<rect x="20" y="212" width="320" height="38" rx="4" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="30" y="237" font-size="15" fill="#292929">jiwoo</text>
<text x="170" y="237" font-size="15" fill="#292929">35</text>
<text x="220" y="237" font-size="15" fill="#292929">mid</text>
<text x="330" y="237" font-size="14" fill="#666660" text-anchor="end">3명 참</text>
<rect x="20" y="256" width="320" height="38" rx="4" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="30" y="281" font-size="15" fill="#292929">198.51.100.90</text>
<text x="170" y="281" font-size="15" fill="#292929">30</text>
<text x="220" y="281" font-size="15" fill="#292929">low</text>
<text x="330" y="281" font-size="14" fill="#666660" text-anchor="end">low 제외</text>
<text x="20" y="330" font-size="15" fill="#666660">점수 순으로 저장 → 앞에서부터 고름</text>
<rect x="380" y="60" width="320" height="84" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="540" y="85.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">지시문</text>
<text x="540" y="106.6" font-size="15" fill="#292929" text-anchor="middle">[사실]만 사용 · 지어내지 않기</text>
<text x="540" y="127.6" font-size="15" fill="#292929" text-anchor="middle">공격이라고 단정하지 않기</text>
<text x="540" y="166" font-size="19" fill="#292929" text-anchor="middle" font-weight="700">+</text>
<rect x="380" y="178" width="320" height="84" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540" y="203.6" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">[사실] 한 줄</text>
<text x="540" y="224.6" font-size="15" fill="#292929" text-anchor="middle">대상 / 등급 / 점수 /</text>
<text x="540" y="245.6" font-size="15" fill="#292929" text-anchor="middle">탐지된 내용</text>
<rect x="380" y="286" width="320" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="315.1" font-size="15" fill="#292929" text-anchor="middle">규칙 이름 → RULE_MEANING</text>
<text x="540" y="336.1" font-size="15" fill="#292929" text-anchor="middle">사실 문장들을 "; ".join(...)</text>
<polyline points="540,286 540,266" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="372" width="680" height="40" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360" y="396.6" font-size="15" fill="#292929" text-anchor="middle">call_llm 결과가 빈 문자열("")이면 FAIL_TEXT 로 채워 담당자가 직접 확인</text>
</g>
</svg>
