<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>analyze_events 는 리턴값을 차례로 전달하고, build_report 는 세어서 딕셔너리로 모은다</title>
<desc>analyze_events 의 1 ~ 4번은 events 로 chains 를, events 와 chains 로 findings 를, findings 로 totals 와 reasons 를 구합니다. build_report 의 5 ~ 7번은 source 열을 value_counts 로 세고 to_dict 로 바꿔 report 딕셔너리에 담습니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">pipeline.py · 직접 쓰는 곳 1 ~ 7</text>
<text x="20" y="62" font-size="16" fill="#292929" font-weight="700">analyze_events</text>
<rect x="20" y="74" width="110" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75" y="102.6" font-size="15" fill="#292929" text-anchor="middle">events</text>
