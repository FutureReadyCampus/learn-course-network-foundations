<polyline points="500,164 526,164" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="20" y="210" width="335" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="187.5" y="238.3" font-size="14" fill="#292929" text-anchor="middle">3. score_findings(findings) → totals</text>
<rect x="365" y="210" width="335" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="532.5" y="238.3" font-size="14" fill="#292929" text-anchor="middle">4. collect_reasons(findings) → reasons</text>
