<polyline points="532,258 532,270" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="120" y="274" width="480" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="298.6" font-size="15" fill="#666660" text-anchor="middle">make_records(totals, reasons) → records  (미리 채움)</text>
<text x="20" y="346" font-size="16" fill="#292929" font-weight="700">build_report</text>
