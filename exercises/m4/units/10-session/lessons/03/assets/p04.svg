<text x="330" y="102.6" font-size="15" fill="#292929" text-anchor="middle">1. find_chains_in_events(events)</text>
<rect x="530" y="74" width="170" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
