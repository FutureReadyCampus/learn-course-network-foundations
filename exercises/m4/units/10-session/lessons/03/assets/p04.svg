<polyline points="500,98 526,98" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="160" y="140" width="340" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="330" y="168.6" font-size="15" fill="#292929" text-anchor="middle">2. collect_findings(events, chains)</text>
<rect x="530" y="140" width="170" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="615" y="168.6" font-size="15" fill="#292929" text-anchor="middle">findings</text>
