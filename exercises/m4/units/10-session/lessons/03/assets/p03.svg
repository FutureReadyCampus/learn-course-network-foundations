<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img">
<title>pipeline.py 의 4단계: 이벤트 → 점수 기록 → AI 요약 → 보고서 파일</title>
<desc>단계 1 은 normalized_events.json 을 이벤트 표로 읽고, 단계 2 는 chains · findings · totals · reasons 를 거쳐 records 를 만들어 점수 파일에도 저장합니다. 단계 3 은 요약을, 단계 4 는 네 결과를 보고서 파일 하나로 저장합니다. Unit 4 · 5 알림과 Unit 8 평가는 넣지 않았습니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">단계 연결 흐름</text>
<rect x="20" y="50" width="160" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="100" y="80.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 1</text>
<text x="100" y="101.1" font-size="15" fill="#292929" text-anchor="middle">이벤트 읽기</text>
<rect x="200" y="50" width="500" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="90.6" font-size="15" fill="#292929">normalized_events.json → events (표)</text>
<polyline points="100,122 100,134" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="138" width="160" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="100" y="168.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 2</text>
<text x="100" y="189.1" font-size="15" fill="#292929" text-anchor="middle">연결 · 탐지 · 점수</text>
<rect x="200" y="138" width="500" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="158.3" font-size="15" fill="#292929">events → chains → findings</text>
<text x="214" y="179.3" font-size="15" fill="#292929">→ totals · reasons → records</text>
<text x="214" y="199.3" font-size="14" fill="#666660">(records 는 unit05_risk_scores.json 에도)</text>
<polyline points="100,210 100,222" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="226" width="160" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="100" y="256.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 3</text>
<text x="100" y="277.1" font-size="15" fill="#292929" text-anchor="middle">AI 요약</text>
<rect x="200" y="226" width="500" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="256.8" font-size="15" fill="#292929">records → summaries</text>
<text x="214" y="276.8" font-size="14" fill="#666660">(실패하면 대체 문장 FAIL_TEXT)</text>
<polyline points="100,298 100,310" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="314" width="160" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="100" y="344.1" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">단계 4</text>
<text x="100" y="365.1" font-size="15" fill="#292929" text-anchor="middle">보고서 저장</text>
<rect x="200" y="314" width="500" height="72" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="214" y="344.8" font-size="15" fill="#292929">events · findings · records · summaries</text>
<text x="214" y="364.8" font-size="14" fill="#292929">→ anomaly_detection_report_2026-11-02.json</text>
<rect x="20" y="404" width="680" height="32" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="424.3" font-size="14" fill="#292929" text-anchor="middle">넣지 않음: Unit 4 · 5 알림(alerts.json) · Unit 8 평가(review_alerts.json) — 모양이 다름</text>
</g>
</svg>
