<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<title>정답 확인 후 점검: git status 에서 __pycache__ 를 빼고 깃허브에서 파일을 확인</title>
<desc>git status 에 .env · .venv 는 보이지 않고 __pycache__ 가 보였다면 .gitignore 에 __pycache__/ 를 적고 다시 확인합니다. 깃허브 anomaly_detection 폴더에 event_summary.py · pipeline.py · 보고서 파일이 보이면 됩니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 확인 후 점검</text>
<rect x="20" y="60" width="200" height="120" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="120" y="105" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">git status</text>
<text x="120" y="125" font-size="14" fill="#292929" text-anchor="middle">.env · .venv 없음</text>
<text x="120" y="144.6" font-size="14" fill="#292929" text-anchor="middle">__pycache__ 보임</text>
<rect x="260" y="60" width="200" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="105" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">.gitignore</text>
<text x="360" y="125" font-size="14" fill="#292929" text-anchor="middle">맨 아래에</text>
<text x="360" y="144.6" font-size="14" fill="#292929" text-anchor="middle">__pycache__/ 한 줄</text>
<rect x="500" y="60" width="200" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="600" y="95.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">깃허브 확인</text>
<text x="600" y="115.2" font-size="14" fill="#292929" text-anchor="middle">event_summary.py</text>
<text x="600" y="134.8" font-size="14" fill="#292929" text-anchor="middle">pipeline.py</text>
<text x="600" y="154.4" font-size="14" fill="#292929" text-anchor="middle">보고서 .json</text>
<polyline points="220,120 256,120" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<polyline points="460,120 496,120" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<text x="20" y="222" font-size="15" fill="#666660">보고서 파일: anomaly_detection_report_2026-11-02.json</text>
</g>
</svg>
