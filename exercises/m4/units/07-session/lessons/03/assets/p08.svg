<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>Unit 7에서 로그를 연결하고 점수를 저장해 올렸고, Unit 8에서 오탐과 미탐을 센다</title><desc>실습 7-1은 세 로그를 사용자 기준으로 연결했고, 실습 7-2는 점수·등급·이유를 파일에 저장했으며, 마무리에서 깃허브에 올렸습니다. Unit 8에서는 탐지가 맞았는지 오탐과 미탐을 직접 셉니다.</desc><defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">이번 Unit 마무리</text><rect x="20" y="60" width="204" height="120" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="122" y="93.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 7-1</text><text x="122" y="114.8" font-size="15" text-anchor="middle" fill="#292929">세 로그를</text><text x="122" y="135.8" font-size="15" text-anchor="middle" fill="#292929">한 사용자 기준으로</text><text x="122" y="156.8" font-size="15" text-anchor="middle" fill="#292929">60분 안 사건 연결</text><rect x="258" y="60" width="204" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360" y="93.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">실습 7-2</text><text x="360" y="114.8" font-size="15" text-anchor="middle" fill="#292929">점수 · 등급 · 이유를</text><text x="360" y="135.8" font-size="15" text-anchor="middle" fill="#292929">unit05_risk</text><text x="360" y="156.8" font-size="15" text-anchor="middle" fill="#292929">_scores.json 에 저장</text><line x1="227" y1="120" x2="254" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/><rect x="496" y="60" width="204" height="120" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="598" y="93.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">마무리</text><text x="598" y="114.8" font-size="15" text-anchor="middle" fill="#292929">만든 파일과</text><text x="598" y="135.8" font-size="15" text-anchor="middle" fill="#292929">보고서를</text><text x="598" y="156.8" font-size="15" text-anchor="middle" fill="#292929">깃허브에 올림</text><line x1="465" y1="120" x2="492" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/><rect x="20" y="214" width="680" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="360" y="253.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">다음 · Unit 8: 탐지가 맞았는지 직접 세기</text><text x="360" y="274.8" font-size="15" text-anchor="middle" fill="#666660">오탐: 알림이 났는데 문제가 아니었던 것 · 미탐: 나야 하는데 안 난 것</text></svg>
