<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>git status로 비밀 파일이 없는지 본 뒤 add, commit, push로 올리고 브라우저로 확인한다</title><desc>anomaly_detection에서 파일을 확인하고 cd ..로 security-agent-toolkit에 갑니다. git status에 .env나 .venv가 보이면 .gitignore를 고치고, 보고서를 채운 뒤 add·commit·push 하며 거절되면 git pull 후 다시 push 합니다.</desc><defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">마무리: 깃허브에 올리기</text><rect x="20" y="50" width="400" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="220" y="80.9" font-size="14" text-anchor="middle" fill="#292929">0 · 1. ls 로 파일 확인 → cd .. → pwd</text><rect x="20" y="122" width="400" height="52" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="220" y="152.9" font-size="14" text-anchor="middle" fill="#292929">2. git status</text><line x1="220" y1="104" x2="220" y2="119" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="20" y="194" width="400" height="52" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="220" y="224.9" font-size="14" text-anchor="middle" fill="#292929">3. 보고서 마무리 (가) 채우기</text><line x1="220" y1="176" x2="220" y2="191" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="20" y="266" width="400" height="52" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="220" y="296.9" font-size="14" text-anchor="middle" fill="#292929">4. git add . → git commit -m "…" → git push</text><line x1="220" y1="248" x2="220" y2="263" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="20" y="338" width="400" height="52" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/><text x="220" y="368.9" font-size="14" text-anchor="middle" fill="#292929">5. 브라우저에서 anomaly_detection 폴더 확인</text><line x1="220" y1="320" x2="220" y2="335" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="460" y="104" width="240" height="96" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="580" y="137.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">.env · .venv 보이면</text><text x="580" y="156.9" font-size="14" text-anchor="middle" fill="#666660">.gitignore 에 한 줄</text><text x="580" y="176.5" font-size="14" text-anchor="middle" fill="#666660">적고 다시 status</text><line x1="422" y1="148" x2="456" y2="152" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><rect x="460" y="262" width="240" height="88" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="580" y="291.3" font-size="14" text-anchor="middle" fill="#292929" font-weight="700">push 가 rejected</text><text x="580" y="310.9" font-size="14" text-anchor="middle" fill="#666660">git pull 후</text><text x="580" y="330.5" font-size="14" text-anchor="middle" fill="#666660">다시 git push</text><line x1="422" y1="292" x2="456" y2="302" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/><text x="460" y="224" font-size="14" text-anchor="start" fill="#666660">__pycache__/ 도</text><text x="460" y="244" font-size="14" text-anchor="start" fill="#666660">.gitignore 에 적는다</text></svg>
