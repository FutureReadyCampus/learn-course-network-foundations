<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>마무리 정리: status로 확인하고 add·commit·push로 올린 뒤 브라우저로 확인</title><desc>깃허브에 올리는 세 단계입니다. git status에서 .env나 .venv가 보이면 멈추고, 올린 뒤에는 브라우저에서 anomaly_detection 폴더와 파일을 확인합니다.</desc><defs><marker id="a-p07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">마무리 정리: 올리기 세 단계</text><rect x="20" y="64" width="204" height="130" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="122" y="102.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">올릴 파일 확인</text><text x="122" y="123.8" font-size="15" text-anchor="middle" fill="#292929">git status</text><text x="122" y="144.8" font-size="15" text-anchor="middle" fill="#292929">.env · .venv</text><text x="122" y="165.8" font-size="15" text-anchor="middle" fill="#292929">보이면 멈춤</text><rect x="258" y="64" width="204" height="130" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360" y="102.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">올리기</text><text x="360" y="123.8" font-size="15" text-anchor="middle" fill="#292929">git add .</text><text x="360" y="144.8" font-size="15" text-anchor="middle" fill="#292929">git commit -m "…"</text><text x="360" y="165.8" font-size="15" text-anchor="middle" fill="#292929">git push</text><line x1="227" y1="129" x2="254" y2="129" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/><rect x="496" y="64" width="204" height="130" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="598" y="102.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">올린 뒤</text><text x="598" y="123.8" font-size="15" text-anchor="middle" fill="#292929">브라우저에서</text><text x="598" y="144.8" font-size="15" text-anchor="middle" fill="#292929">anomaly_detection</text><text x="598" y="165.8" font-size="15" text-anchor="middle" fill="#292929">폴더와 파일 확인</text><line x1="465" y1="129" x2="492" y2="129" stroke="#666660" stroke-width="2" marker-end="url(#a-p07)"/><text x="20" y="250" font-size="15" text-anchor="start" fill="#666660">__pycache__ 폴더는 깃허브에 없어도 된다</text></svg>
