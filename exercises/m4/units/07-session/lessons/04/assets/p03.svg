<line x1="397.5" y1="62" x2="397.5" y2="300" stroke="#666660" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="397.5" y="320" font-size="14" fill="#666660" text-anchor="middle">mid 기준 35</text>
<line x1="560.0" y1="62" x2="560.0" y2="300" stroke="#666660" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="560.0" y="320" font-size="14" fill="#666660" text-anchor="middle">high 기준 60</text>
<text x="20" y="354" font-size="15" fill="#292929">seoyeon 45 = 평소와 다른 IP 20 + 대량 다운로드 25 · 이유(reasons)도 함께 저장</text>
<text x="20" y="382" font-size="15" fill="#666660">make_grade 는 high 를 먼저, 그다음 mid 를 확인합니다. low 도 기록은 남깁니다.</text>
