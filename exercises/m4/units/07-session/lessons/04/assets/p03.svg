<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 7-2 정답: 규칙 점수를 더해 60 이상 high, 35 이상 mid, 그 아래 low</title>
<desc>score_findings 가 규칙마다 점수를 매겨 대상별로 더하고, make_grade 가 high 기준 60부터 차례로 확인합니다. dami 60점은 high, seoyeon 45 · gaeun 40 · jiwoo 35 는 mid, 198.51.100.90 은 30점으로 low 입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 7-2 정답</text>
<text x="700" y="32" font-size="15" fill="#666660" text-anchor="end">점수 → 등급</text>
<text x="158" y="92" font-size="15" fill="#292929" text-anchor="end">dami</text>
<rect x="170" y="74" width="390.0" height="28" rx="4" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
