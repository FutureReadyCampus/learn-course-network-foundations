<text x="158" y="138" font-size="15" fill="#292929" text-anchor="end">seoyeon</text>
<rect x="170" y="120" width="292.5" height="28" rx="4" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="472.5" y="140" font-size="15" fill="#292929">45점 · mid</text>
<text x="158" y="184" font-size="15" fill="#292929" text-anchor="end">gaeun</text>
<rect x="170" y="166" width="260.0" height="28" rx="4" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="440.0" y="186" font-size="15" fill="#292929">40점 · mid</text>
<text x="158" y="230" font-size="15" fill="#292929" text-anchor="end">jiwoo</text>
<rect x="170" y="212" width="227.5" height="28" rx="4" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="407.5" y="232" font-size="15" fill="#292929">35점 · mid</text>
<text x="158" y="276" font-size="15" fill="#292929" text-anchor="end">198.51.100.90</text>
<rect x="170" y="258" width="195.0" height="28" rx="4" fill="#f1f1ef" stroke="#666660" stroke-width="1.5"/>
