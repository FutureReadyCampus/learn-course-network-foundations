<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답 확인 후 점검: git status 확인과 깃허브 폴더 확인 두 가지</title>
<desc>git status 에 .env 와 .venv 가 보이지 않으면 됩니다. 보였다면 .gitignore 맨 아래에 한 줄을 적고 다시 git status 로 확인합니다. 깃허브의 anomaly_detection 폴더에 Unit 6과 Unit 7 파일이 보이면 끝입니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 확인 후 점검</text>
<rect x="20" y="60" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">git status</text>
<text x="120.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">실행</text>
<rect x="260" y="60" width="200" height="90" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.env · .venv</text>
<text x="360.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">보이는가?</text>
<rect x="500" y="60" width="200" height="90" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600.0" y="100.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">.gitignore 맨 아래</text>
<text x="600.0" y="121.6" font-size="15" fill="#292929" text-anchor="middle">한 줄 적고 저장</text>
<polyline points="220,105 256,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<polyline points="460,105 496,105" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="478" y="96" font-size="15" fill="#9a6200" text-anchor="middle">예</text>
<polyline points="600,150 600,186" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<rect x="500" y="190" width="200" height="90" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="600.0" y="230.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">git status 다시</text>
<text x="600.0" y="251.6" font-size="15" fill="#292929" text-anchor="middle">사라졌는지 확인</text>
<polyline points="360,150 360,206" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
<text x="372" y="180" font-size="15" fill="#1f7a4a">아니오</text>
<rect x="20" y="210" width="440" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="240.0" y="240.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">깃허브 anomaly_detection 폴더에</text>
<text x="240.0" y="261.6" font-size="15" fill="#292929" text-anchor="middle">Unit 6 · Unit 7 파일이 보이면 끝</text>
<polyline points="500,245 464,245" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p04)"/>
</g>
</svg>
