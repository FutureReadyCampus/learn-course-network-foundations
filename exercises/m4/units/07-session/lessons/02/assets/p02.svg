<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif"><title>IP로 사용자를 채우고 표를 합쳐 정렬한 뒤 두 조건을 모두 볼 때만 연결한다</title><desc>SaaS 성공 로그인으로 IP → 사용자 딕셔너리를 만들어 웹 로그에 사용자를 채웁니다. 세 로그를 사용자·시각 순으로 놓고, 서로 다른 로그 2종류 이상이면서 60분 이내일 때만 연결합니다.</desc><defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs><text x="20" y="32" font-size="19" text-anchor="start" fill="#292929" font-weight="700">왜 IP 로 사용자를 채워 연결하는가</text><rect x="20" y="56" width="204" height="104" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/><text x="122" y="92.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">① IP → 사용자</text><text x="122" y="113.2" font-size="15" text-anchor="middle" fill="#292929">SaaS 성공 로그인으로</text><text x="122" y="134.2" font-size="15" text-anchor="middle" fill="#292929">웹 IP 에 사용자 채움</text><rect x="258" y="56" width="204" height="104" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="360" y="92.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">② 한 표로 합치기</text><text x="360" y="113.2" font-size="15" text-anchor="middle" fill="#292929">사용자 순,</text><text x="360" y="134.2" font-size="15" text-anchor="middle" fill="#292929">같은 사용자는 시각 순</text><line x1="227" y1="108" x2="254" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="496" y="56" width="204" height="104" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/><text x="598" y="92.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">③ 두 조건 확인</text><text x="598" y="113.2" font-size="15" text-anchor="middle" fill="#292929">로그 2종류 이상</text><text x="598" y="134.2" font-size="15" text-anchor="middle" fill="#292929">그리고 60분 이내</text><line x1="465" y1="108" x2="492" y2="108" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/><rect x="20" y="200" width="330" height="100" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/><text x="185" y="244.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">둘 다 맞음</text><text x="185" y="265.8" font-size="15" text-anchor="middle" fill="#292929">→ 연결된 사건</text><rect x="370" y="200" width="330" height="100" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/><text x="535" y="244.8" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">하나만 맞음</text><text x="535" y="265.8" font-size="15" text-anchor="middle" fill="#292929">→ 연결하지 않음</text></svg>
