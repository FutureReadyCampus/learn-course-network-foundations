<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>DictReader 는 CSV 한 줄을 열 이름 딕셔너리로, 바꾸기 딕셔너리는 값을 바꾼다</title>
<desc>위쪽은 CSV 첫 줄의 열 이름과 둘째 줄의 값이 DictReader 로 딕셔너리 하나가 되는 모습입니다. 아래쪽은 RESULT_MAP 과 ALLOWED_MAP 이 원래 값을 성공, 실패로 바꾸고 없는 키는 KeyError 가 나는 모습입니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">CSV 를 딕셔너리로 읽기 · 딕셔너리로 값 바꾸기</text>
<rect x="24" y="56" width="300" height="92" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="86.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">CSV 두 줄</text>
<text x="174" y="106.8" font-size="14" text-anchor="middle" fill="#292929">열 이름: time,account,…</text>
<text x="174" y="127.1" font-size="14" text-anchor="middle" fill="#292929">값: 2026-11-02 02:14:08,…</text>
<line x1="326" y1="102" x2="362" y2="102" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<text x="344" y="92" font-size="14" text-anchor="middle" fill="#666660">DictReader</text>
<rect x="366" y="56" width="330" height="92" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="531" y="86.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">딕셔너리 한 행</text>
<text x="531" y="106.8" font-size="14" text-anchor="middle" fill="#292929">row["account"]</text>
<text x="531" y="127.1" font-size="14" text-anchor="middle" fill="#292929">→ "jiwoo@a-corp.example"</text>
<line x1="24" y1="170" x2="696" y2="170" stroke="#dededb" stroke-width="1.5"/>
<rect x="24" y="190" width="300" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="218.3" font-size="15" text-anchor="middle" fill="#292929">RESULT_MAP["failure"]</text>
<line x1="326" y1="214" x2="362" y2="214" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="366" y="190" width="160" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="446" y="218.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">"실패"</text>
<rect x="24" y="252" width="300" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="280.4" font-size="15" text-anchor="middle" fill="#292929">ALLOWED_MAP[True]</text>
<line x1="326" y1="276" x2="362" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="366" y="252" width="160" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="446" y="280.4" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">"성공"</text>
<rect x="24" y="314" width="300" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="174" y="342.4" font-size="15" text-anchor="middle" fill="#292929">RESULT_MAP["pending"]</text>
<line x1="326" y1="338" x2="362" y2="338" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<rect x="366" y="314" width="160" height="48" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="446" y="342.4" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">KeyError</text>
<rect x="540" y="314" width="156" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="618" y="342.1" font-size="14" text-anchor="middle" fill="#666660">예상 못 한 값</text>
</g>
</svg>
