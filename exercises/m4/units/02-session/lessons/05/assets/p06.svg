<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>Unit 1 완성본 log_parse.py 의 함수 흐름과 샘플 로그 30줄을 같은 폴더에 둔다</title>
<desc>parse_line 은 split_request 로 세 조각을 나누고 read_request, read_status, read_client 로 값을 꺼내 딕셔너리를 만듭니다. access_sample.log 30줄의 깨진 줄은 일부러 둔 것이니 지우지 않습니다.</desc>
<defs><marker id="a-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">앞 Unit 파일 완성본: anomaly_detection 바로 아래</text>
<rect x="24" y="56" width="672" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="80.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">log_parse.py 의 parse_line(line)</text>
<line x1="360" y1="98" x2="360" y2="114" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="220" y="118" width="280" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="137.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">split_request</text>
<text x="360" y="157.9" font-size="14" text-anchor="middle" fill="#666660">앞 · 요청 · 뒤 세 조각</text>
<line x1="360" y1="170" x2="128" y2="192" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="24" y="196" width="208" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="128" y="219.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">read_client</text>
<text x="128" y="239.9" font-size="14" text-anchor="middle" fill="#666660">앞 → ip</text>
<line x1="128" y1="256" x2="360" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<line x1="360" y1="170" x2="360" y2="192" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="256" y="196" width="208" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="219.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">read_request</text>
<text x="360" y="239.9" font-size="14" text-anchor="middle" fill="#666660">요청 → method · path</text>
<line x1="360" y1="256" x2="360" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<line x1="360" y1="170" x2="592" y2="192" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="488" y="196" width="208" height="58" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="592" y="219.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">read_status</text>
<text x="592" y="239.9" font-size="14" text-anchor="middle" fill="#666660">뒤 → status(정수)</text>
<line x1="592" y1="256" x2="360" y2="276" stroke="#666660" stroke-width="2" marker-end="url(#a-p06)"/>
<rect x="200" y="280" width="320" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="360" y="304.4" font-size="15" text-anchor="middle" fill="#292929">{ip, method, path, status}</text>
<rect x="24" y="338" width="672" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="365.1" font-size="14" text-anchor="middle" fill="#292929">access_sample.log 30줄: 끝이 잘린 줄 · 마지막 줄 - 는 지우지 않습니다</text>
</g>
</svg>
