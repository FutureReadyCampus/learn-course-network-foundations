<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>실습 2-3 정리: 이어 붙이기, 정렬, 소스별 세기, JSON 저장 코드</title>
<desc>세 리스트는 + 로 이어 붙이고 sort(key=get_time)로 정렬합니다. 소스별 개수는 get(source, 0) + 1 로 세고 json.dump 로 저장합니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">실습 2-3 정리</text>
<rect x="24" y="58" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="87.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">리스트 세 개를 하나로</text>
<line x1="216" y1="83" x2="236" y2="83" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="240" y="58" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="87.1" font-size="14" text-anchor="start" fill="#292929">events = web + server + saas</text>
<rect x="24" y="122" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="151.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">시간순 정렬</text>
<line x1="216" y1="147" x2="236" y2="147" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="240" y="122" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="151.1" font-size="14" text-anchor="start" fill="#292929">events.sort(key=get_time)  (리턴값 없음)</text>
<rect x="24" y="186" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="215.3" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">소스별 개수</text>
<line x1="216" y1="211" x2="236" y2="211" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="240" y="186" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="215.1" font-size="14" text-anchor="start" fill="#292929">counts[source] = counts.get(source, 0) + 1</text>
<rect x="24" y="250" width="190" height="50" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="119" y="279.4" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">JSON 파일로 저장</text>
<line x1="216" y1="275" x2="236" y2="275" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="240" y="250" width="456" height="50" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="252" y="279.1" font-size="14" text-anchor="start" fill="#292929">json.dump(events, f, ensure_ascii=False, indent=2)</text>
<text x="24" y="318" font-size="14" text-anchor="start" fill="#666660">counts 는 본문의 source_event_counts 를 줄여 쓴 이름입니다.</text>
</g>
</svg>
