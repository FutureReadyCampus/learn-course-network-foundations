<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>nginx 시각 문자열을 strptime, replace, strftime 으로 공통 모양 문자열로 바꾸는 단계</title>
<desc>문자열을 strptime 으로 시각 값으로 바꾸고, replace(tzinfo=None)로 시간대를 떼고, strftime 으로 공통 모양 문자열로 만듭니다. 오른쪽은 각 단계에서 쓰는 형식입니다.</desc>
<defs><marker id="a-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">시각 문자열 바꾸기: 세 단계</text>
<rect x="24" y="56" width="320" height="66" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="184" y="82.5" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">nginx 시각 문자열</text>
<text x="184" y="104.2" font-size="15" text-anchor="middle" fill="#292929">02/Nov/2026:09:12:03 +0900</text>
<line x1="184" y1="124" x2="184" y2="146" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="24" y="148" width="320" height="66" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="184" y="174.5" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">시각 값 (시간대 있음)</text>
<text x="184" y="196.2" font-size="15" text-anchor="middle" fill="#292929">2026-11-02 09:12:03+09:00</text>
<line x1="184" y1="216" x2="184" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="24" y="240" width="320" height="66" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="184" y="266.5" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">시각 값 (시간대 없음)</text>
<text x="184" y="288.2" font-size="15" text-anchor="middle" fill="#292929">2026-11-02 09:12:03</text>
<line x1="184" y1="308" x2="184" y2="330" stroke="#666660" stroke-width="2" marker-end="url(#a-p04)"/>
<rect x="24" y="332" width="320" height="66" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="184" y="358.5" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">공통 모양 문자열</text>
<text x="184" y="380.2" font-size="15" text-anchor="middle" fill="#292929">2026-11-02 09:12:03</text>
<rect x="372" y="104" width="324" height="62" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="534" y="129.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">.strptime(문자열, 형식)</text>
<text x="534" y="149.9" font-size="14" text-anchor="middle" fill="#666660">%d/%b/%Y:%H:%M:%S %z</text>
<rect x="372" y="196" width="324" height="62" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="534" y="221.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">.replace(tzinfo=None)</text>
<text x="534" y="241.9" font-size="14" text-anchor="middle" fill="#666660">+0900 정보를 지운다</text>
<rect x="372" y="288" width="324" height="62" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="534" y="313.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">.strftime(형식)</text>
<text x="534" y="333.9" font-size="14" text-anchor="middle" fill="#666660">%Y-%m-%d %H:%M:%S</text>
</g>
</svg>
