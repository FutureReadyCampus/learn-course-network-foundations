<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>모양이 다른 세 로그를 정규화해 같은 키로 맞춰야 SIEM 이 같은 기준을 쓴다</title>
<desc>웹 서버, 판정 서버, SaaS 로그는 시각과 결과를 서로 다르게 적습니다. 정규화로 같은 키와 같은 모양의 공통 이벤트로 맞추면 SIEM 이 한 기준으로 찾고 셀 수 있습니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">왜 로그 모양을 맞춰야 하는가</text>
<rect x="24" y="62" width="220" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="91.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">웹 서버</text>
<text x="134" y="111.9" font-size="14" text-anchor="middle" fill="#666660">02/Nov/2026:09:12:03</text>
<line x1="246" y1="97" x2="300" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="24" y="146" width="220" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="175.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">판정 서버</text>
<text x="134" y="195.9" font-size="14" text-anchor="middle" fill="#666660">2026-11-02T09:40</text>
<line x1="246" y1="181" x2="300" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="24" y="230" width="220" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="134" y="259.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SaaS</text>
<text x="134" y="279.9" font-size="14" text-anchor="middle" fill="#666660">2026-11-02 02:14:08</text>
<line x1="246" y1="265" x2="300" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="304" y="140" width="150" height="80" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="379" y="174.2" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">정규화</text>
<text x="379" y="194.9" font-size="14" text-anchor="middle" fill="#292929">같은 키 · 같은 모양</text>
<line x1="456" y1="180" x2="486" y2="180" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="490" y="62" width="206" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="593" y="101.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">공통 이벤트</text>
<text x="593" y="121.8" font-size="14" text-anchor="middle" fill="#292929">시각 · 결과가</text>
<text x="593" y="142.1" font-size="14" text-anchor="middle" fill="#292929">한 모양으로</text>
<rect x="490" y="190" width="206" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="593" y="229.0" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">SIEM(심)</text>
<text x="593" y="249.8" font-size="14" text-anchor="middle" fill="#292929">같은 기준으로</text>
<text x="593" y="270.1" font-size="14" text-anchor="middle" fill="#292929">찾기 · 세기</text>
<line x1="593" y1="174" x2="593" y2="186" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<text x="24" y="318" font-size="15" text-anchor="start" fill="#666660">모양이 다르면 같은 기준을 적용할 수 없습니다.</text>
</g>
</svg>
