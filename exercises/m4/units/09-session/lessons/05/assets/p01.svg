<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 329" role="img">
<title>보고서는 쓸 내용을 보고 답: 뒤에 적고, 모르면 막힌 곳을 적는다</title>
<desc>문제를 풀 때마다 질문의 쓸 내용을 읽고 답: 뒤에 적는 순서를 보여 준다. 아래에는 출력 붙여 넣기, 왜 질문, 핵심 질문을 못 풀었을 때 쓰는 규칙을 모았다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">보고서 쓰는 법</text>
<rect x="12" y="56" width="212" height="90.7" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="118" y="85.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">1. 문제 풀기</text>
<text x="118" y="107.25" font-size="15" text-anchor="middle" fill="#292929">그 문제 제목 아래 질문을</text>
<text x="118" y="129" font-size="15" text-anchor="middle" fill="#292929">연다</text>
<rect x="254" y="56" width="212" height="90.7" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="95.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">2. 쓸 내용: 읽기</text>
<text x="360" y="118.125" font-size="15" text-anchor="middle" fill="#292929">무엇을 쓸지 적혀 있다</text>
<line x1="227" y1="101.35" x2="251" y2="101.35" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="496" y="56" width="212" height="90.7" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="602" y="95.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">3. 답: 뒤에 쓰기</text>
<text x="602" y="118.125" font-size="15" text-anchor="middle" fill="#292929">쓸 내용 그대로 적는다</text>
<line x1="469" y1="101.35" x2="493" y2="101.35" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<text x="24" y="186.7" font-size="16" text-anchor="start" fill="#292929" font-weight="700">질문 모양에 따라 이렇게 씁니다</text>
<rect x="12" y="202.7" width="222.667" height="112.45" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="123.333" y="242.695" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">출력 · 코드</text>
<text x="123.333" y="264.825" font-size="15" text-anchor="middle" fill="#292929">답: 아래 빈 코드 상자에 붙여</text>
<text x="123.333" y="286.575" font-size="15" text-anchor="middle" fill="#292929">넣고, 설명은 답: 뒤에</text>
<rect x="248.667" y="202.7" width="222.667" height="112.45" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="231.82" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">「왜」 질문</text>
<text x="360" y="253.95" font-size="15" text-anchor="middle" fill="#292929">한 단어로 끝내지 않고 내</text>
<text x="360" y="275.7" font-size="15" text-anchor="middle" fill="#292929">화면의 값이나 배운 내용을</text>
<text x="360" y="297.45" font-size="15" text-anchor="middle" fill="#292929">근거로 이유까지</text>
<rect x="485.333" y="202.7" width="222.667" height="112.45" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="596.667" y="242.695" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">[핵심 질문]</text>
<text x="596.667" y="264.825" font-size="15" text-anchor="middle" fill="#292929">꼭 알아야 할 질문. 답을 못</text>
<text x="596.667" y="286.575" font-size="15" text-anchor="middle" fill="#292929">찾으면 「모름 — 막힌 곳: …」</text>
</g>
</svg>
