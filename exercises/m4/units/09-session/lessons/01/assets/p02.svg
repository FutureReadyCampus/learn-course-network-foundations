<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img">
<title>Docker Desktop을 켜고 anomaly_detection 에서 포트 세 개가 비었는지 본다</title>
<desc>왼쪽은 준비 순서이고 오른쪽은 이번 Unit의 파일이 놓일 폴더 배치다. 포트 8080, 8081, 8082를 다른 서버가 쓰고 있으면 docker stop 으로 끈다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">준비 순서와 폴더 배치</text>
<rect x="12" y="52" width="380" height="60.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="20" y="77.12" font-size="16" text-anchor="start" fill="#292929" font-weight="700">1. Docker Desktop 켜기</text>
<text x="20" y="99.25" font-size="15" text-anchor="start" fill="#292929">고래 아이콘이 멈추면 준비 끝</text>
<rect x="12" y="122.95" width="380" height="60.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="20" y="148.07" font-size="16" text-anchor="start" fill="#292929" font-weight="700">2. cd anomaly_detection → pwd</text>
<text x="20" y="170.2" font-size="15" text-anchor="start" fill="#292929">…/anomaly_detection 으로 끝나면 OK</text>
<line x1="202" y1="113.95" x2="202" y2="121.95" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="12" y="193.9" width="380" height="60.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="20" y="219.02" font-size="16" text-anchor="start" fill="#292929" font-weight="700">3. docker ps</text>
<text x="20" y="241.15" font-size="15" text-anchor="start" fill="#292929">CONTAINER ID 머리글 줄이 나오면 도커가 켜진 것</text>
<line x1="202" y1="184.9" x2="202" y2="192.9" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="12" y="264.85" width="380" height="60.95" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="20" y="289.97" font-size="16" text-anchor="start" fill="#292929" font-weight="700">4. 포트 8080 · 8081 · 8082 확인</text>
<text x="20" y="312.1" font-size="15" text-anchor="start" fill="#292929">줄이 나오면 내 서버인지 보고 docker stop 이름</text>
<line x1="202" y1="255.85" x2="202" y2="263.85" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="12" y="335.8" width="380" height="60.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="20" y="360.92" font-size="16" text-anchor="start" fill="#292929" font-weight="700">5. 받은 파일 두 개 옮기기</text>
<text x="20" y="383.05" font-size="15" text-anchor="start" fill="#292929">보고서 맨 위 이름을 내 이름으로</text>
<line x1="202" y1="326.8" x2="202" y2="334.8" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="416" y="52" width="292" height="344.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="432" y="84" font-size="15" text-anchor="start" fill="#292929" font-weight="700">security-agent-toolkit/</text>
<text x="452" y="127.536" font-size="15" text-anchor="start" fill="#292929" font-weight="700">anomaly_detection/</text>
<text x="472" y="171.071" font-size="15" text-anchor="start" fill="#292929">Unit 9 안내 파일</text>
<text x="692" y="171.071" font-size="14" text-anchor="end" fill="#666660">받은 파일</text>
<text x="472" y="214.607" font-size="15" text-anchor="start" fill="#292929">보고서 파일</text>
<text x="692" y="214.607" font-size="14" text-anchor="end" fill="#666660">받은 파일</text>
<text x="472" y="258.143" font-size="15" text-anchor="start" fill="#292929">compose.yaml</text>
<text x="692" y="258.143" font-size="14" text-anchor="end" fill="#666660">실습 9-1</text>
<text x="472" y="301.679" font-size="15" text-anchor="start" fill="#292929">compose.secure.yaml</text>
<text x="692" y="301.679" font-size="14" text-anchor="end" fill="#666660">실습 9-2</text>
<text x="472" y="345.214" font-size="15" text-anchor="start" fill="#292929">logs/web_404.log</text>
<text x="692" y="345.214" font-size="14" text-anchor="end" fill="#666660">실습 9-2</text>
</g>
</svg>
