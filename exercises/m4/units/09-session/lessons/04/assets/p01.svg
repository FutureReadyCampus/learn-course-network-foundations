<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<title>정답은 한 예이므로 내 답과 핵심이 같은지로 맞았는지 판단한다</title>
<desc>내 답을 정답 예와 비교해 핵심이 같으면 맞은 것이다. 문장이 달라도 괜찮고, 핵심이 다르면 그 문제의 결과와 왜를 다시 읽는다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">정답 보는 법</text>
<rect x="12" y="60" width="212" height="68.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="118" y="89.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">내 답</text>
<text x="118" y="111.25" font-size="15" text-anchor="middle" fill="#292929">보고서에 적은 답</text>
<rect x="254" y="60" width="212" height="68.95" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="89.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">정답 예와 비교</text>
<text x="360" y="111.25" font-size="15" text-anchor="middle" fill="#292929">아래 답은 한 예</text>
<line x1="227" y1="94.475" x2="251" y2="94.475" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="496" y="60" width="212" height="68.95" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="602" y="89.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">핵심이 같은가?</text>
<text x="602" y="111.25" font-size="15" text-anchor="middle" fill="#292929">문장은 달라도 된다</text>
<line x1="469" y1="94.475" x2="493" y2="94.475" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<line x1="602" y1="130.95" x2="602" y2="162.95" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="496" y="164.95" width="212" height="45.75" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="602" y="193" font-size="15" text-anchor="middle" fill="#292929">예 → 맞음</text>
<path d="M526 130.95 L526 146.95 L436 146.95 L436 162.95" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p01)"/>
<rect x="12" y="164.95" width="454" height="45.75" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="239" y="193" font-size="15" text-anchor="middle" fill="#292929">아니오 → 그 문제의 결과 · 왜 · 자주 틀리는 곳을 다시 읽는다</text>
</g>
</svg>
