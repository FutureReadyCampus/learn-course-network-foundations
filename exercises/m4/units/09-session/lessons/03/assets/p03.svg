<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 397" role="img">
<title>포트 줄 앞에 127.0.0.1: 을 붙이면 다른 PC 의 접속은 막히고 내 PC 만 들어온다</title>
<desc>"8080:80" 은 0.0.0.0:8080 으로 열려 같은 네트워크의 다른 PC 도 접속한다. "127.0.0.1:8081:80" 은 127.0.0.1:8081 로 열려 내 PC 에서만 접속한다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">포트 줄에 들어 있는 접속 범위</text>
<rect x="12" y="64" width="200" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="112" y="92.92" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">같은 네트워크의 다른</text>
<text x="112" y="116.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">PC</text>
<rect x="12" y="224" width="200" height="70" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="112" y="264.52" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">내 PC</text>
<rect x="440" y="64" width="268" height="70" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="574" y="93.645" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">"8080:80"</text>
<text x="574" y="115.775" font-size="15" text-anchor="middle" fill="#292929">0.0.0.0:8080 · 모두에게 열림</text>
<rect x="440" y="224" width="268" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="574" y="253.645" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">"127.0.0.1:8081:80"</text>
<text x="574" y="275.775" font-size="15" text-anchor="middle" fill="#292929">127.0.0.1:8081 · 내 PC 에서만</text>
<line x1="214" y1="92" x2="438" y2="92" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="214" y1="266" x2="438" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="214" y1="236" x2="438" y2="122" stroke="#666660" stroke-width="2" marker-end="url(#a-p03)"/>
<line x1="214" y1="122" x2="300" y2="157" stroke="#e0442e" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="302" y="140" width="62" height="32" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="333" y="161.175" font-size="15" text-anchor="middle" fill="#292929">막힘</text>
<rect x="12" y="316" width="696" height="67.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="344.05" font-size="15" text-anchor="middle" fill="#292929">관리 화면 · 데이터베이스처럼 밖에 열면 안 되는 서버는 포트 줄 앞에 127.0.0.1: 을 붙인다.</text>
<text x="360" y="365.8" font-size="15" text-anchor="middle" fill="#292929">docker compose ps 의 PORTS 에서 확인한다.</text>
</g>
</svg>
