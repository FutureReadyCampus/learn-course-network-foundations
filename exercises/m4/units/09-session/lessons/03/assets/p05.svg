<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img">
<title>volumes 로 web3 의 로그를 내 logs 폴더에 두고 grep 으로 404 줄을 세고 저장한다</title>
<desc>web3 안의 /var/log/nginx 를 내 ./logs 폴더에 연결하면 로그가 내 파일로 쌓인다. grep 으로 404 줄만 남기고, | wc -l 로 세거나 &gt; 로 파일에 저장한다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">로그를 내 폴더에 남기고 다루기</text>
<rect x="12" y="52" width="250" height="70" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="137" y="81.645" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">web3 서버 안</text>
<text x="137" y="103.775" font-size="15" text-anchor="middle" fill="#292929">/var/log/nginx</text>
<rect x="458" y="52" width="250" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="583" y="81.645" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">내 폴더</text>
<text x="583" y="103.775" font-size="15" text-anchor="middle" fill="#292929">./logs/access.log</text>
<line x1="264" y1="87" x2="456" y2="87" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<text x="360" y="78" font-size="15" text-anchor="middle" fill="#292929">volumes:</text>
<text x="360" y="112" font-size="14" text-anchor="middle" fill="#292929">- ./logs:/var/log/nginx</text>
<rect x="12" y="150" width="212" height="68.95" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="118" y="179.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">grep " 404 "</text>
<text x="118" y="201.25" font-size="15" text-anchor="middle" fill="#292929">404 가 든 줄만 남긴다</text>
<rect x="254" y="150" width="212" height="68.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="179.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">| wc -l</text>
<text x="360" y="201.25" font-size="15" text-anchor="middle" fill="#292929">넘겨받은 줄 수를 센다</text>
<line x1="227" y1="184.475" x2="251" y2="184.475" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="496" y="150" width="212" height="68.95" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="602" y="179.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">2</text>
<text x="602" y="201.25" font-size="15" text-anchor="middle" fill="#292929">404 요청이 두 줄</text>
<line x1="469" y1="184.475" x2="493" y2="184.475" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<path d="M583 124 L583 136 L128 136 L128 148" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p05)"/>
<rect x="12" y="232.95" width="696" height="45.75" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="261" font-size="15" text-anchor="middle" fill="#292929">grep " 404 " logs/access.log &gt; logs/web_404.log  →  화면 대신 파일에 저장</text>
<rect x="12" y="288.95" width="696" height="67.5" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="317" font-size="15" text-anchor="middle" fill="#292929">docker compose down 으로 서버를 지워도 logs 폴더의 파일은 남는다. 서버 안에만 있는 로그는</text>
<text x="360" y="338.75" font-size="15" text-anchor="middle" fill="#292929">함께 사라진다.</text>
</g>
</svg>
