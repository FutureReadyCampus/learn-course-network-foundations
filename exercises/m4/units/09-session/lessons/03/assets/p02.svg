<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img">
<title>서버가 늘면 서버마다 접속 범위를 정하고, 고친 파일은 바뀐 서버만 다시 켠다</title>
<desc>실습 9-1에서는 두 서버가 같은 방식으로 열려 있었다. 서버가 늘면 범위를 따로 정해야 하고, 컴포즈는 파일을 고친 뒤 같은 up -d 로 바뀐 서버만 다시 만든다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">왜 서버마다 접속 범위를 정하는가</text>
<rect x="12" y="56" width="156" height="112.45" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="90" y="85.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">실습 9-1</text>
<text x="90" y="107.25" font-size="15" text-anchor="middle" fill="#292929">두 서버 모두</text>
<text x="90" y="129" font-size="15" text-anchor="middle" fill="#292929">"8080:80" 같은</text>
<text x="90" y="150.75" font-size="15" text-anchor="middle" fill="#292929">방식으로 열림</text>
<rect x="192" y="56" width="156" height="112.45" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="270" y="95.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">서버가 늘면</text>
<text x="270" y="118.125" font-size="15" text-anchor="middle" fill="#292929">서버마다 열 범위를</text>
<text x="270" y="139.875" font-size="15" text-anchor="middle" fill="#292929">따로 정해야 한다</text>
<line x1="171" y1="112.225" x2="189" y2="112.225" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="372" y="56" width="156" height="112.45" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="450" y="95.995" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">파일을 고치고</text>
<text x="450" y="118.125" font-size="15" text-anchor="middle" fill="#292929">같은 docker</text>
<text x="450" y="139.875" font-size="15" text-anchor="middle" fill="#292929">compose up -d</text>
<line x1="351" y1="112.225" x2="369" y2="112.225" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="552" y="56" width="156" height="112.45" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="630" y="85.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">결과</text>
<text x="630" y="107.25" font-size="15" text-anchor="middle" fill="#292929">바뀐 서버만 다시</text>
<text x="630" y="129" font-size="15" text-anchor="middle" fill="#292929">만들고 나머지는</text>
<text x="630" y="150.75" font-size="15" text-anchor="middle" fill="#292929">그대로</text>
<line x1="531" y1="112.225" x2="549" y2="112.225" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="12" y="198.45" width="696" height="70.4" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360" y="227.57" font-size="16" text-anchor="middle" fill="#292929">이번 실습의 질문: 서버마다 접속 범위를 컴포즈 파일에 적고, 서버를 끊지 않고 바꿔 적용할</text>
<text x="360" y="250.77" font-size="16" text-anchor="middle" fill="#292929">수 있는가?</text>
</g>
</svg>
