<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 389" role="img">
<title>깃허브에 올리기 전 위치와 git status 를 확인하고 add, commit, push 한다</title>
<desc>anomaly_detection 에서 파일을 확인하고 한 단계 위로 옮긴 뒤 git status 로 .env 와 .venv 가 섞였는지 본다. 보고서 마무리 칸을 채우고 올린 뒤 브라우저에서 확인한다.</desc>
<defs><marker id="a-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="24" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">마무리 · 깃허브에 올리는 순서</text>
<rect x="12" y="52" width="212" height="134.2" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="118" y="81.12" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">0. 파일 확인</text>
<text x="118" y="103.25" font-size="15" text-anchor="middle" fill="#292929">pwd · ls 로</text>
<text x="118" y="125" font-size="15" text-anchor="middle" fill="#292929">compose.yaml ·</text>
<text x="118" y="146.75" font-size="15" text-anchor="middle" fill="#292929">compose.secure.yaml ·</text>
<text x="118" y="168.5" font-size="15" text-anchor="middle" fill="#292929">logs</text>
<rect x="254" y="52" width="212" height="134.2" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="102.87" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">1. 위로 이동</text>
<text x="360" y="125" font-size="15" text-anchor="middle" fill="#292929">cd .. → pwd 가</text>
<text x="360" y="146.75" font-size="15" text-anchor="middle" fill="#292929">security-agent-toolkit</text>
<line x1="227" y1="119.1" x2="251" y2="119.1" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/>
<rect x="496" y="52" width="212" height="134.2" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="602" y="102.87" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">2. git status</text>
<text x="602" y="125" font-size="15" text-anchor="middle" fill="#292929">.env · .venv 가 보이면</text>
<text x="602" y="146.75" font-size="15" text-anchor="middle" fill="#292929">.gitignore 에 적는다</text>
<line x1="469" y1="119.1" x2="493" y2="119.1" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/>
<rect x="12" y="220.2" width="212" height="90.7" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="118" y="249.32" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">3. 보고서</text>
<text x="118" y="271.45" font-size="15" text-anchor="middle" fill="#292929">마무리 (가)를 올리기 전에</text>
<text x="118" y="293.2" font-size="15" text-anchor="middle" fill="#292929">채운다</text>
<path d="M602 186.2 L602 203.2 L118 203.2 L118 218.2" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/>
<rect x="254" y="220.2" width="212" height="90.7" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360" y="249.32" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">4. 올리기</text>
<text x="360" y="271.45" font-size="15" text-anchor="middle" fill="#292929">git add . → git commit</text>
<text x="360" y="293.2" font-size="15" text-anchor="middle" fill="#292929">-m "…" → git push</text>
<line x1="227" y1="265.55" x2="251" y2="265.55" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/>
<rect x="496" y="220.2" width="212" height="90.7" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="602" y="249.32" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">5. 브라우저</text>
<text x="602" y="271.45" font-size="15" text-anchor="middle" fill="#292929">anomaly_detection 의</text>
<text x="602" y="293.2" font-size="15" text-anchor="middle" fill="#292929">파일이 깃허브에도 있나</text>
<line x1="469" y1="265.55" x2="493" y2="265.55" stroke="#666660" stroke-width="2" marker-end="url(#a-p08)"/>
<rect x="12" y="330" width="696" height="45.75" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="360" y="358.05" font-size="15" text-anchor="middle" fill="#292929">push 가 rejected 로 거절되면 git pull 로 받아 온 뒤 다시 git push</text>
</g>
</svg>
