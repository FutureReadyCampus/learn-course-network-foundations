<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>실습 8-1 정리: 뒤집기 ~ 로 오탐을, isin 과 ~ 로 미탐을 고르고 .sum() 으로 셉니다</title>
<desc>오탐은 real 열을 ~ 로 뒤집어 고른 뒤 rule 열을 value_counts 로 셉니다. 미탐은 진짜 알림의 problem 번호를 꺼내 isin 으로 비교하고 ~ 로 뒤집어 고릅니다. 진짜 알림 수는 is_real.sum() 입니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">실습 8-1 정리</text>
<text x="20" y="70" font-size="16" fill="#292929" font-weight="700">오탐</text>
<rect x="20" y="84" width="110" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="75.0" y="113.0" font-size="14" fill="#292929" text-anchor="middle">is_real</text>
<polyline points="130,108 146,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="150" y="84" width="120" height="48" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<text x="210.0" y="113.0" font-size="14" fill="#292929" text-anchor="middle">~is_real</text>
<polyline points="270,108 286,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="290" y="84" width="170" height="48" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<text x="375.0" y="113.0" font-size="14" fill="#292929" text-anchor="middle">alerts[is_false]</text>
<polyline points="460,108 476,108" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="480" y="84" width="220" height="48" rx="8" fill="#fbf0dc" stroke="#dededb" stroke-width="1.5"/>
<text x="590.0" y="113.0" font-size="14" fill="#292929" text-anchor="middle">["rule"].value_counts()</text>
<text x="20" y="170" font-size="16" fill="#292929" font-weight="700">미탐</text>
<rect x="20" y="184" width="130" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="85.0" y="213.0" font-size="14" fill="#292929" text-anchor="middle">caught_ids</text>
<polyline points="150,208 166,208" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="170" y="184" width="160" height="48" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="250.0" y="213.0" font-size="14" fill="#292929" text-anchor="middle">is_caught (isin)</text>
<polyline points="330,208 346,208" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="350" y="184" width="130" height="48" rx="8" fill="#f8e8e3" stroke="#dededb" stroke-width="1.5"/>
<text x="415.0" y="213.0" font-size="14" fill="#292929" text-anchor="middle">~is_caught</text>
<polyline points="480,208 496,208" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p05)"/>
<rect x="500" y="184" width="200" height="48" rx="8" fill="#f8e8e3" stroke="#dededb" stroke-width="1.5"/>
<text x="600.0" y="213.0" font-size="14" fill="#292929" text-anchor="middle">problems[is_missed]</text>
<text x="20" y="270" font-size="16" fill="#292929" font-weight="700">True 개수 세기</text>
<rect x="20" y="284" width="220" height="48" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130.0" y="313.0" font-size="14" fill="#292929" text-anchor="middle">is_real.sum()</text>
<text x="260" y="314" font-size="15" fill="#666660">True 는 1, False 는 0 으로 더합니다. 괄호까지 씁니다.</text>
</g>
</svg>
