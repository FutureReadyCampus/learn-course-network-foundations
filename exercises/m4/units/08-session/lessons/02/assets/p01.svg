<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>실습 8-1 목표: 알림 파일과 진짜 문제 파일로 오탐 수와 미탐 수를 셉니다</title>
<desc>review_alerts.json 의 알림 7개와 problems.json 의 진짜 문제 5개를 evaluation.py 에 넣습니다. 프로그램은 문제가 아닌데 난 알림(오탐)과 알림이 나지 않은 진짜 문제(미탐)의 개수를 알려 줍니다.</desc>
<defs><marker id="a-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">목표: 오탐과 미탐 개수</text>
<rect x="20" y="62" width="200" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="95.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">review_alerts.json</text>
<text x="120.0" y="116.6" font-size="15" fill="#292929" text-anchor="middle">알림 7개</text>
<rect x="20" y="158" width="200" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="120.0" y="191.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">problems.json</text>
<text x="120.0" y="212.6" font-size="15" fill="#292929" text-anchor="middle">진짜 문제 5개</text>
<rect x="270" y="100" width="180" height="96" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="143.3" font-size="16" fill="#292929" text-anchor="middle" font-weight="700">evaluation.py</text>
<text x="360.0" y="164.6" font-size="15" fill="#292929" text-anchor="middle">비교해서 세기</text>
<polyline points="220,100 266,130" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="220,196 266,166" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<rect x="500" y="62" width="200" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="600.0" y="95.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">오탐 몇 개?</text>
<text x="600.0" y="114.8" font-size="14" fill="#292929" text-anchor="middle">문제 아닌데 난 알림</text>
<rect x="500" y="158" width="200" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="600.0" y="191.2" font-size="14" fill="#292929" text-anchor="middle" font-weight="700">미탐 몇 개?</text>
<text x="600.0" y="210.8" font-size="14" fill="#292929" text-anchor="middle">알림 없던 진짜 문제</text>
<polyline points="450,130 496,100" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<polyline points="450,166 496,196" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p01)"/>
<text x="20" y="280" font-size="15" fill="#666660">숫자로 세어 봐야 어느 규칙을 고칠지 정할 수 있습니다.</text>
</g>
</svg>
