<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img">
<title>오류가 나면: 증상을 보고 확인할 곳과 고칠 방법을 고릅니다</title>
<desc>No module named pandas 는 가상환경이 활성화되지 않은 것이라 활성화 뒤 pandas 를 설치합니다. FileNotFoundError 나 ValueError 는 JSON 파일 위치와 쉼표 · 대괄호를 봅니다. 그래도 막히면 오류를 AI 에게 묻거나 정답을 봅니다.</desc>
<defs><marker id="a-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">오류가 나면</text>
<text x="700" y="32" font-size="15" fill="#666660" text-anchor="end">먼저 pwd · ls 확인</text>
<text x="20" y="70" font-size="15" fill="#666660" font-weight="700">증상</text>
<text x="270" y="70" font-size="15" fill="#666660" font-weight="700">확인</text>
<text x="490" y="70" font-size="15" fill="#666660" font-weight="700">고치기</text>
<rect x="20" y="84" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="116.9" font-size="15" fill="#292929" text-anchor="middle">No module named</text>
<text x="130.0" y="137.9" font-size="15" fill="#292929" text-anchor="middle">'pandas'</text>
<rect x="270" y="84" width="190" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="365.0" y="116.9" font-size="15" fill="#292929" text-anchor="middle">가상환경이</text>
<text x="365.0" y="137.9" font-size="15" fill="#292929" text-anchor="middle">활성화됐는가</text>
<rect x="490" y="84" width="210" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="116.9" font-size="15" fill="#292929" text-anchor="middle">activate 뒤</text>
<text x="595.0" y="137.9" font-size="15" fill="#292929" text-anchor="middle">pip install pandas</text>
<polyline points="240,122 266,122" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="460,122 486,122" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="172" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="204.9" font-size="15" fill="#292929" text-anchor="middle">FileNotFoundError</text>
<text x="130.0" y="225.9" font-size="15" fill="#292929" text-anchor="middle">ValueError</text>
<rect x="270" y="172" width="190" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="365.0" y="204.9" font-size="15" fill="#292929" text-anchor="middle">JSON 세 개가</text>
<text x="365.0" y="225.9" font-size="15" fill="#292929" text-anchor="middle">폴더 바로 아래인가</text>
<rect x="490" y="172" width="210" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="204.9" font-size="15" fill="#292929" text-anchor="middle">쉼표 · 대괄호</text>
<text x="595.0" y="225.9" font-size="15" fill="#292929" text-anchor="middle">빠진 곳 고치기</text>
<polyline points="240,210 266,210" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="460,210 486,210" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<rect x="20" y="260" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="130.0" y="303.4" font-size="15" fill="#292929" text-anchor="middle">그래도 안 풀림</text>
<rect x="270" y="260" width="190" height="76" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
<text x="365.0" y="292.9" font-size="15" fill="#292929" text-anchor="middle">오류 전체와</text>
<text x="365.0" y="313.9" font-size="15" fill="#292929" text-anchor="middle">친 명령</text>
<rect x="490" y="260" width="210" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="595.0" y="292.9" font-size="15" fill="#292929" text-anchor="middle">AI 에게 묻기</text>
<text x="595.0" y="313.9" font-size="15" fill="#292929" text-anchor="middle">정답 · 모름 적기</text>
<polyline points="240,298 266,298" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<polyline points="460,298 486,298" fill="none" stroke="#666660" stroke-width="1.8" marker-end="url(#a-p03)"/>
<text x="20" y="350" font-size="15" fill="#666660">AI 에게 물을 때 .env · API 키는 지웁니다. 실행은 터미널에서 합니다.</text>
</g>
</svg>
