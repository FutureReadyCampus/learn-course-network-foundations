<text x="336" y="294" font-size="15" fill="#666660">알림 1개 (A8 · 실습 8-3)</text>
<line x1="66" y1="338" x2="84" y2="338" stroke="#666660" stroke-width="1.5"/>
<rect x="84" y="318" width="236" height="40" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
