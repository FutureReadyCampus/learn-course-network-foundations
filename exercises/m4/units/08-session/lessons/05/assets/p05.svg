<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>정답 확인 후 점검: ls 로 파일을 보고 보고서에 빈 답이 없는지 봅니다</title>
<desc>ls 결과에 Unit 8의 파일들과 안내 · 보고서 두 파일이 모두 보이면 됩니다. 보고서에 빈 답: 이 없으면 끝이고, 못 적은 칸은 모름 — 막힌 곳을 적습니다.</desc>
<defs><marker id="a-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="32" font-size="19" fill="#292929" font-weight="700">정답 확인 후 점검</text>
<rect x="20" y="56" width="680" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<rect x="38" y="69" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="76" y="85" font-size="15" fill="#292929">ls 결과에 Unit 8 파일들이 모두 보인다</text>
<rect x="20" y="112" width="680" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<rect x="38" y="125" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="76" y="141" font-size="15" fill="#292929">안내 · 보고서 두 파일도 보인다</text>
<rect x="20" y="168" width="680" height="46" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<rect x="38" y="181" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="76" y="197" font-size="15" fill="#292929">보고서에 빈 답: 이 없다</text>
<rect x="20" y="224" width="680" height="46" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<rect x="38" y="237" width="20" height="20" rx="3" fill="#ffffff" stroke="#666660" stroke-width="1.5"/>
<text x="76" y="253" font-size="15" fill="#292929">못 적은 칸은 「모름 — 막힌 곳: …」</text>
</g>
</svg>
