<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>실습 8-2 정답: 규칙과 IP 를 함께 보면 오탐 4 → 2, 빠진 진짜 문제 0</title>
<desc>is_ip_rule &amp; is_trusted 로 빼면 A4 · A5 두 개만 빠지고, 오탐은 4개에서 2개로 줄며 빠진 진짜 문제는 0개입니다. is_trusted 만 쓰면 A3 · A4 · A5 · A6 네 개가 빠지고 진짜 문제 A6 까지 지워져 단계 4가 1로 나옵니다.</desc>
