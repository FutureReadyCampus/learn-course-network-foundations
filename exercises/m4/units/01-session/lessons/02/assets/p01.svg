<rect x="250" y="140" width="220" height="50" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="170.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">parse_line(line)</text>
<line x1="300" y1="190" x2="220" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p01)"/>
<line x1="420" y1="190" x2="568" y2="238" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p01)"/>
<text x="150" y="222" font-size="14" fill="#666660" text-anchor="middle">큰따옴표 2개 이상</text>
<text x="600" y="222" font-size="14" fill="#666660" text-anchor="middle">2개보다 적음</text>
<rect x="24" y="240" width="390" height="70" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
