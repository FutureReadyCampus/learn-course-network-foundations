<text x="568.0" y="269.8" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">깨진 줄 → None</text>
<text x="568.0" y="290.8" font-size="15" fill="#292929" text-anchor="middle">읽기 실패로 세기</text>
