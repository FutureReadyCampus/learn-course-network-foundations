<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>SIEM(심)을 쓰는 여섯 방식은 어디에 두는지와 누가 운영하는지로 나뉜다</title>
<desc>여섯 카드는 수업에서 나눈 방식입니다. 파란 카드는 우리 직원이 운영하고, 초록 카드는 외부 업체가 운영합니다. 카드마다 방식과 잘 맞는 곳을 적었습니다.</desc>
<defs><marker id="a-m4u01l02-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l02-p03-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">현업에서 SIEM(심)을 쓰는 방식 여섯 가지</text>
<rect x="24" y="50" width="330" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="189.0" y="75.2" font-size="15" fill="#292929" text-anchor="middle">어디에 두나: 회사 안 · 클라우드</text>
<rect x="366" y="50" width="330" height="40" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="531.0" y="75.2" font-size="15" fill="#292929" text-anchor="middle">누가 운영하나: 우리 · 외부 업체</text>
<rect x="24" y="106" width="212" height="118" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130.0" y="149.2" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">① 설치형</text>
<text x="130.0" y="170.2" font-size="15" fill="#292929" text-anchor="middle">회사 안 서버 · 직원 운영</text>
<text x="130.0" y="191.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 금융 · 공공</text>
<rect x="254" y="106" width="212" height="118" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="149.2" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">② 클라우드(SaaS)</text>
<text x="360.0" y="170.2" font-size="15" fill="#292929" text-anchor="middle">제품사 서비스를 구독</text>
<text x="360.0" y="191.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 빠른 도입</text>
<rect x="484" y="106" width="212" height="118" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="590.0" y="149.2" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">③ 하이브리드</text>
<text x="590.0" y="170.2" font-size="15" fill="#292929" text-anchor="middle">회사 안 + 클라우드</text>
<text x="590.0" y="191.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 둘 다 가진 곳</text>
<rect x="24" y="240" width="212" height="118" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="130.0" y="283.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">④ 관리형</text>
<text x="130.0" y="304.2" font-size="15" fill="#292929" text-anchor="middle">업체 플랫폼 · 업체 운영</text>
<text x="130.0" y="325.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 전담 인력 없음</text>
<rect x="254" y="240" width="212" height="118" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="360.0" y="283.2" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">⑤ 오픈소스 직접 구축</text>
<text x="360.0" y="304.2" font-size="15" fill="#292929" text-anchor="middle">Wazuh · ELK 직접 운영</text>
<text x="360.0" y="325.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 비용 절감</text>
<rect x="484" y="240" width="212" height="118" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590.0" y="283.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">⑥ 제품 + 외부 관제</text>
<text x="590.0" y="304.2" font-size="15" fill="#292929" text-anchor="middle">우리 제품 · 업체 운영</text>
<text x="590.0" y="325.2" font-size="15" fill="#666660" text-anchor="middle">맞는 곳: 운영 인력 부족</text>
<text x="24" y="396" font-size="15" fill="#666660">④ · ⑥ 의 외부 업체 = MSSP. 업계 공식 분류가 아니라 이해를 돕는 구분입니다.</text>
</g>
</svg>
