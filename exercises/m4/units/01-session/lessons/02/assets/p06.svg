<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img">
<title>로그에서 이벤트, 이벤트에서 알림으로 걸러질수록 사람이 볼 양이 줄어든다</title>
<desc>맨 위 로그가 가장 많고, 보안에서 의미 있는 이벤트는 그보다 적고, 사람이 봐야 할 알림은 더 적습니다. 알림은 먼저 살펴볼 곳이지 공격이 확정됐다는 뜻이 아닙니다.</desc>
<defs><marker id="a-m4u01l02-p06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l02-p06-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">로그 · 이벤트 · 알림</text>
<rect x="60" y="52" width="600" height="62" rx="8" fill="#f1f1ef" stroke="#dededb" stroke-width="1.5"/>
