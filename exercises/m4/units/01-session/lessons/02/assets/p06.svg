<text x="360.0" y="98.8" font-size="15" fill="#292929" text-anchor="middle">203.0.113.50 … "POST /login" 401</text>
<line x1="360" y1="114" x2="360" y2="134" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p06)"/>
<rect x="160" y="136" width="400" height="62" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="161.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">이벤트 · 보안에서 의미 있는 일</text>
<text x="360.0" y="182.8" font-size="15" fill="#292929" text-anchor="middle">같은 주소에서 로그인 실패 5번</text>
<line x1="360" y1="198" x2="360" y2="218" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p06)"/>
<rect x="240" y="220" width="240" height="62" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="360.0" y="245.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림 · 사람이 볼 것</text>
<text x="360.0" y="266.8" font-size="15" fill="#292929" text-anchor="middle">담당자에게 경고</text>
<text x="360" y="312" font-size="15" fill="#666660" text-anchor="middle">걸러질수록 사람이 볼 양이 줄어듭니다.</text>
<text x="360" y="338" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">알림 = 「먼저 살펴볼 곳」 · 공격이 확정됐다는 뜻이 아님</text>
