<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>Module 4 는 쌓인 로그에서 의심을 찾고, SIEM(심)은 수집부터 알림까지 한다</title>
<desc>위는 Module 3 접근통제와 Module 4 이상탐지의 차이입니다. 아래는 SIEM(심)의 네 단계인 수집 · 정규화 · 탐지 · 알림 · 조사와 각 단계를 다루는 Unit 입니다.</desc>
<defs><marker id="a-m4u01l02-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l02-p02-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">Module 3 과 Module 4</text>
<rect x="24" y="50" width="320" height="140" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="184.0" y="94.0" font-size="17" fill="#2558a8" text-anchor="middle" font-weight="700">Module 3 접근통제</text>
<text x="184.0" y="117.8" font-size="15" fill="#292929" text-anchor="middle">요청 1개를 들어오는 순간에</text>
<text x="184.0" y="138.8" font-size="15" fill="#292929" text-anchor="middle">허용 또는 거부</text>
<text x="184.0" y="159.8" font-size="15" fill="#292929" text-anchor="middle">「방금 5번 틀림」을 모름</text>
<rect x="376" y="50" width="320" height="140" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="536.0" y="94.0" font-size="17" fill="#9a6200" text-anchor="middle" font-weight="700">Module 4 이상탐지</text>
<text x="536.0" y="117.8" font-size="15" fill="#292929" text-anchor="middle">쌓인 로그 전체를 일이 난 뒤에</text>
<text x="536.0" y="138.8" font-size="15" fill="#292929" text-anchor="middle">의심되는 일을 찾아 알림</text>
<text x="536.0" y="159.8" font-size="15" fill="#292929" text-anchor="middle">「5번 틀린 뒤 성공」을 찾음</text>
<text x="24" y="232" font-size="17" fill="#292929" font-weight="700">SIEM(심)이 하는 네 단계</text>
<rect x="24" y="248" width="150" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="99.0" y="280.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">수집</text>
<text x="99.0" y="301.2" font-size="15" fill="#292929" text-anchor="middle">여러 곳의 로그를</text>
<text x="99.0" y="322.2" font-size="15" fill="#292929" text-anchor="middle">한곳에 모음</text>
<line x1="174" y1="296" x2="196" y2="296" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p02)"/>
<text x="99" y="368" font-size="15" fill="#666660" text-anchor="middle">Unit 1</text>
<rect x="198" y="248" width="150" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="273.0" y="280.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">정규화</text>
<text x="273.0" y="301.2" font-size="15" fill="#292929" text-anchor="middle">같은 키로</text>
<text x="273.0" y="322.2" font-size="15" fill="#292929" text-anchor="middle">모양을 맞춤</text>
<line x1="348" y1="296" x2="370" y2="296" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p02)"/>
<text x="273" y="368" font-size="15" fill="#666660" text-anchor="middle">Unit 2</text>
<rect x="372" y="248" width="150" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="447.0" y="280.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">탐지</text>
<text x="447.0" y="301.2" font-size="15" fill="#292929" text-anchor="middle">규칙으로</text>
<text x="447.0" y="322.2" font-size="15" fill="#292929" text-anchor="middle">의심을 찾음</text>
<line x1="522" y1="296" x2="544" y2="296" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l02-p02)"/>
<text x="447" y="368" font-size="15" fill="#666660" text-anchor="middle">Unit 4 ~ 7</text>
<rect x="546" y="248" width="150" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="621.0" y="280.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림 · 조사</text>
<text x="621.0" y="301.2" font-size="15" fill="#292929" text-anchor="middle">담당자에게</text>
<text x="621.0" y="322.2" font-size="15" fill="#292929" text-anchor="middle">알리고 보관</text>
<text x="621" y="368" font-size="15" fill="#666660" text-anchor="middle">Unit 8 · 10</text>
<text x="24" y="404" font-size="15" fill="#b32a17">SIEM(심)은 찾아서 알리는 도구입니다. 막는 일은 보통 방화벽이나 SOAR(쏘아).</text>
</g>
</svg>
