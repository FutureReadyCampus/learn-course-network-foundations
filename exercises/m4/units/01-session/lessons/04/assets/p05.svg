<text x="497.0" y="301.2" font-size="15" fill="#1f7a4a" text-anchor="middle" font-weight="700">{"ip", "method", "path", "status"}</text>
<text x="86" y="252" font-size="15" fill="#b32a17" text-anchor="middle">깨진 줄은 여기서 끝</text>
<text x="24" y="366" font-size="15" fill="#666660">앞 실습 파일이 없거나 잘 안 될 때 이 완성본으로 만듭니다.</text>
</g>
