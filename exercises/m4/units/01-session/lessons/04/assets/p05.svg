<text x="86.0" y="182.9" font-size="14" fill="#292929" text-anchor="middle">큰따옴표 2개</text>
<text x="86.0" y="202.5" font-size="14" fill="#292929" text-anchor="middle">미만이면 None</text>
<line x1="86" y1="94" x2="86" y2="126" stroke="#e0442e" stroke-width="2" marker-end="url(#a-m4u01l04-p05-r)"/>
<rect x="161" y="130" width="124" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="223.0" y="163.3" font-size="14" fill="#292929" text-anchor="middle">②</text>
<text x="223.0" y="182.9" font-size="14" fill="#292929" text-anchor="middle">split_request</text>
<text x="223.0" y="202.5" font-size="14" fill="#292929" text-anchor="middle">→ 세 조각</text>
<line x1="223" y1="94" x2="223" y2="126" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p05)"/>
<rect x="298" y="130" width="124" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="360.0" y="163.3" font-size="14" fill="#292929" text-anchor="middle">③</text>
<text x="360.0" y="182.9" font-size="14" fill="#292929" text-anchor="middle">read_request</text>
<text x="360.0" y="202.5" font-size="14" fill="#292929" text-anchor="middle">→ 방법 · 경로</text>
<line x1="360" y1="94" x2="360" y2="126" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p05)"/>
<line x1="360" y1="226" x2="360" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p05)"/>
<rect x="435" y="130" width="124" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="497.0" y="163.3" font-size="14" fill="#292929" text-anchor="middle">④</text>
<text x="497.0" y="182.9" font-size="14" fill="#292929" text-anchor="middle">read_status</text>
<text x="497.0" y="202.5" font-size="14" fill="#292929" text-anchor="middle">→ 정수 상태</text>
<line x1="497" y1="94" x2="497" y2="126" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p05)"/>
<line x1="497" y1="226" x2="497" y2="266" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l04-p05)"/>
<rect x="572" y="130" width="124" height="96" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="634.0" y="163.3" font-size="14" fill="#292929" text-anchor="middle">⑤</text>
<text x="634.0" y="182.9" font-size="14" fill="#292929" text-anchor="middle">read_client</text>
