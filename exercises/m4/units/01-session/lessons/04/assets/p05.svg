<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>log_parse.py 완성본: parse_line 이 검사 후 네 함수를 불러 딕셔너리를 만든다</title>
<desc>parse_line 은 먼저 큰따옴표가 두 개보다 적은 줄을 None 으로 돌려보냅니다. 그다음 split_request 로 세 조각을 내고 read_request · read_status · read_client 로 값을 꺼내 딕셔너리로 묶습니다.</desc>
<defs><marker id="a-m4u01l04-p05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l04-p05-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="30" font-size="19" fill="#292929" font-weight="700">log_parse.py 완성본의 구조</text>
<rect x="24" y="46" width="672" height="48" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="75.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">parse_line(line): 아래 순서로 처리</text>
