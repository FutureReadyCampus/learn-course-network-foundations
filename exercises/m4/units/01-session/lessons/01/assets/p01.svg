<text x="609.0" y="125.2" font-size="15" fill="#292929" text-anchor="middle">log_classify.py</text>
<text x="609.0" y="146.2" font-size="15" fill="#292929" text-anchor="middle">정상 · 오류 · 의심</text>
<text x="24" y="226" font-size="15" fill="#666660">쓰는 도구 (Module 3 과 같음)</text>
