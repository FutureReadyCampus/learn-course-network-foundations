<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>Unit 1은 샘플 로그를 실습 1-1에서 조각내고 실습 1-2에서 세 갈래로 가른다</title>
<desc>access_sample.log 30줄을 실습 1-1의 log_parse.py 가 조각으로 나누고, 실습 1-2의 log_classify.py 가 정상 · 오류 · 의심으로 가릅니다. 이번 Unit의 도구는 파이썬 · VS Code · 터미널 · git 입니다.</desc>
<defs><marker id="a-m4u01l01-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l01-p01-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
