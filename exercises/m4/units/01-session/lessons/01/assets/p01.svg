<text x="363.0" y="104.2" font-size="15" fill="#2558a8" text-anchor="middle" font-weight="700">실습 1-1</text>
<text x="363.0" y="125.2" font-size="15" fill="#292929" text-anchor="middle">log_parse.py</text>
<text x="363.0" y="146.2" font-size="15" fill="#292929" text-anchor="middle">한 줄을 조각으로</text>
<line x1="458" y1="120" x2="516" y2="120" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l01-p01)"/>
<rect x="522" y="60" width="174" height="120" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
