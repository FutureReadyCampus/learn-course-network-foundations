<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<title>마무리 정리: git status 로 확인하고 add · commit · push 한 뒤 브라우저로 본다</title>
<desc>세 단계입니다. git status 로 올릴 파일을 확인하고, add · commit · push 로 올리고, 브라우저에서 anomaly_detection 폴더와 파일을 확인합니다.</desc>
<defs><marker id="a-m4u01l03-p09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l03-p09-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">마무리 정리</text>
<rect x="24" y="70" width="212" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="130.0" y="109.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올릴 파일 확인</text>
<text x="130.0" y="130.8" font-size="15" fill="#292929" text-anchor="middle">git status</text>
<line x1="236" y1="115" x2="256" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p09)"/>
<rect x="260" y="70" width="212" height="90" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="366.0" y="109.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올리기</text>
<text x="366.0" y="130.8" font-size="15" fill="#292929" text-anchor="middle">add → commit → push</text>
<line x1="472" y1="115" x2="492" y2="115" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p09)"/>
<rect x="496" y="70" width="212" height="90" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="602.0" y="109.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">올린 뒤</text>
<text x="602.0" y="130.8" font-size="15" fill="#292929" text-anchor="middle">브라우저에서 확인</text>
<text x="130" y="196" font-size="15" fill="#b32a17" text-anchor="middle">.env · .venv 가 보이면 멈춤</text>
<text x="602" y="196" font-size="15" fill="#666660" text-anchor="middle">anomaly_detection 폴더</text>
</g>
</svg>
