<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img">
<title>깃허브에 올리기: 파일 확인 → git status 점검 → 보고서 → add · commit · push</title>
<desc>왼쪽은 올리는 순서입니다. git status 에서 .env 나 .venv 가 보이면 멈추고 .gitignore 에 적습니다. push 가 거절되면 git pull 뒤에 다시 push 합니다.</desc>
<defs><marker id="a-m4u01l03-p08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l03-p08-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<rect x="24" y="20" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="49.2" font-size="15" fill="#292929">0  pwd · ls 로 파일 확인</text>
<line x1="189.0" y1="68" x2="189.0" y2="84" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<rect x="24" y="86" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="115.2" font-size="15" fill="#292929">1  cd .. → security-agent-toolkit</text>
<line x1="189.0" y1="134" x2="189.0" y2="150" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<rect x="24" y="152" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="181.2" font-size="15" fill="#292929">2  git status</text>
<line x1="189.0" y1="200" x2="189.0" y2="216" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<rect x="24" y="218" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="247.2" font-size="15" fill="#292929">3  보고서 (가) 채우기</text>
<line x1="189.0" y1="266" x2="189.0" y2="282" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<rect x="24" y="284" width="330" height="48" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="38" y="313.2" font-size="15" fill="#292929">4  git add . → commit → push</text>
<line x1="189.0" y1="332" x2="189.0" y2="348" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<rect x="24" y="350" width="330" height="48" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="38" y="379.2" font-size="15" fill="#292929">5  브라우저에서 폴더 확인</text>
<rect x="400" y="124" width="296" height="74" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="548.0" y="155.8" font-size="15" fill="#b32a17" text-anchor="middle" font-weight="700">.env · .venv 가 보이면 멈춤</text>
<text x="548.0" y="176.8" font-size="15" fill="#292929" text-anchor="middle">.gitignore 에 한 줄 적기</text>
<line x1="354" y1="176" x2="396" y2="162" stroke="#e0442e" stroke-width="2" marker-end="url(#a-m4u01l03-p08-r)"/>
<rect x="400" y="262" width="296" height="70" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="548.0" y="291.8" font-size="15" fill="#9a6200" text-anchor="middle" font-weight="700">push 가 rejected 이면</text>
<text x="548.0" y="312.8" font-size="15" fill="#292929" text-anchor="middle">git pull 뒤 다시 push</text>
<line x1="354" y1="308" x2="396" y2="298" stroke="#666660" stroke-width="2" marker-end="url(#a-m4u01l03-p08)"/>
<text x="24" y="418" font-size="15" fill="#666660">pwd 결과가 anomaly_detection 으로 끝날 때 1번의 cd .. 를 칩니다.</text>
</g>
</svg>
