<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>SIEM(심) · XDR(엑스디알) · SOAR(쏘아)는 해결하려는 문제와 하는 일이 다르다</title>
<desc>세 카드에 각 도구가 해결하려는 문제와 하는 일을 적었습니다. 세 가지는 순서대로 거치는 단계가 아니며, Module 4 는 SIEM(심)을, Module 5 는 SOAR(쏘아)를 다룹니다.</desc>
<defs><marker id="a-m4u01l03-p04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker><marker id="a-m4u01l03-p04-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0442e"/></marker></defs>
<g font-family="Pretendard, &apos;Noto Sans KR&apos;, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<text x="24" y="34" font-size="19" fill="#292929" font-weight="700">이름이 비슷한 세 도구</text>
<rect x="24" y="52" width="212" height="226" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="130.0" y="109.1" font-size="18" fill="#2558a8" text-anchor="middle" font-weight="700">SIEM(심)</text>
<text x="130.0" y="134.3" font-size="14" fill="#666660" text-anchor="middle">문제</text>
<text x="130.0" y="153.9" font-size="15" fill="#292929" text-anchor="middle">로그가 흩어져</text>
<text x="130.0" y="174.9" font-size="15" fill="#292929" text-anchor="middle">조사하기 어렵다</text>
<text x="130.0" y="195.9" font-size="14" fill="#666660" text-anchor="middle">하는 일</text>
<text x="130.0" y="215.5" font-size="15" fill="#292929" text-anchor="middle">모으고 · 정리하고</text>
<text x="130.0" y="236.5" font-size="15" fill="#292929" text-anchor="middle">탐지해서 알림</text>
<rect x="260" y="52" width="212" height="226" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="366.0" y="109.1" font-size="18" fill="#9a6200" text-anchor="middle" font-weight="700">XDR(엑스디알)</text>
<text x="366.0" y="134.3" font-size="14" fill="#666660" text-anchor="middle">문제</text>
<text x="366.0" y="153.9" font-size="15" fill="#292929" text-anchor="middle">여러 영역의 탐지가</text>
<text x="366.0" y="174.9" font-size="15" fill="#292929" text-anchor="middle">따로 보인다</text>
<text x="366.0" y="195.9" font-size="14" fill="#666660" text-anchor="middle">하는 일</text>
<text x="366.0" y="215.5" font-size="15" fill="#292929" text-anchor="middle">메일 · PC · 서버 탐지를</text>
<text x="366.0" y="236.5" font-size="15" fill="#292929" text-anchor="middle">사건으로 연결 · 대응</text>
<rect x="496" y="52" width="212" height="226" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="602.0" y="109.1" font-size="18" fill="#1f7a4a" text-anchor="middle" font-weight="700">SOAR(쏘아)</text>
<text x="602.0" y="134.3" font-size="14" fill="#666660" text-anchor="middle">문제</text>
<text x="602.0" y="153.9" font-size="15" fill="#292929" text-anchor="middle">같은 대응 작업을</text>
<text x="602.0" y="174.9" font-size="15" fill="#292929" text-anchor="middle">반복한다</text>
<text x="602.0" y="195.9" font-size="14" fill="#666660" text-anchor="middle">하는 일</text>
<text x="602.0" y="215.5" font-size="15" fill="#292929" text-anchor="middle">등록 · 알림 · 승인 · 조치</text>
<text x="602.0" y="236.5" font-size="15" fill="#292929" text-anchor="middle">절차를 자동화</text>
<text x="24" y="318" font-size="15" fill="#b32a17" font-weight="700">세 가지는 반드시 순서대로 거치는 단계가 아닙니다.</text>
<text x="24" y="348" font-size="15" fill="#666660">Module 4: SIEM(심)의 수집 · 정규화 · 탐지 · 알림 · Module 5: SOAR(쏘아)</text>
</g>
</svg>
