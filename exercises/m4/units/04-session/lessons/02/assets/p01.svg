<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>지난 7일 하루 최다 로그인 실패 표로 평균·최댓값을 구해 알림 기준 하나 정하기</title>
<desc>팀장이 지난 7일 동안 하루에 로그인에 가장 많이 실패한 주소의 실패 횟수 표를 줍니다. 하루 평균과 최댓값을 구해 알림 기준 숫자 하나를 정합니다.</desc>
<defs><marker id="a-0402-p01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">이번 의뢰: 알림 기준 숫자 하나 정하기</text>
<rect x="24" y="74" width="200.0" height="110" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="124.0" y="113.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">지난 7일 표</text>
<text x="124.0" y="134.2" font-size="15" fill="#666660" text-anchor="middle">하루 최다</text>
<text x="124.0" y="155.2" font-size="15" fill="#666660" text-anchor="middle">로그인 실패 횟수</text>
<line x1="227.0" y1="129.0" x2="257.0" y2="129.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0402-p01)"/>
<rect x="260.0" y="74" width="200.0" height="110" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="360.0" y="113.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">계산</text>
<text x="360.0" y="134.2" font-size="15" fill="#666660" text-anchor="middle">하루 평균</text>
<text x="360.0" y="155.2" font-size="15" fill="#666660" text-anchor="middle">하루 최댓값</text>
<line x1="463.0" y1="129.0" x2="493.0" y2="129.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0402-p01)"/>
<rect x="496.0" y="74" width="200.0" height="110" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="596.0" y="123.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">알림 기준</text>
<text x="596.0" y="144.8" font-size="15" fill="#666660" text-anchor="middle">숫자 하나</text>
<text x="24" y="240" font-size="14" fill="#666660" text-anchor="start">평소를 먼저 알아야 기준 숫자에 근거가 생깁니다</text>
<text x="24" y="266" font-size="14" fill="#666660" text-anchor="start">담당자가 바뀌어도 같은 이유로 설명할 수 있습니다</text>
</svg>
