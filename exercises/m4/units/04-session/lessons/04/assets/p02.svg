<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">
<title>여러 유형이 동시에 들어오므로 유형 이름을 붙여 유형별로 세고 대응한다</title>
<desc>실습 4-2는 로그인 실패 하나만 찾았습니다. 실제 관제에서는 로그인 실패, 관리자 경로 접근, 요청 급증이 동시에 들어오므로 이벤트마다 유형 이름을 붙여 유형별로 셉니다.</desc>
<defs><marker id="a-p02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<g font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="34" font-size="19" text-anchor="start" fill="#292929" font-weight="700">왜 유형 이름을 붙이는가</text>
<rect x="20" y="56" width="300" height="250" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="170" y="88" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">실습 4-2</text>
<rect x="45" y="120" width="250" height="50" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="170.0" y="150" font-size="15" text-anchor="middle" fill="#292929"><tspan x="170.0" dy="0">로그인 실패 하나만 찾음</tspan></text>
<polyline points="324,181 376,181" fill="none" stroke="#666660" stroke-width="2" marker-end="url(#a-p02)"/>
<rect x="380" y="56" width="320" height="250" rx="8" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text x="540" y="88" font-size="16" text-anchor="middle" fill="#292929" font-weight="700">실제 관제: 여러 유형이 동시에</text>
<rect x="405" y="108" width="270" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540.0" y="133" font-size="15" text-anchor="middle" fill="#292929"><tspan x="540.0" dy="0">로그인 실패</tspan></text>
<rect x="405" y="160" width="270" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540.0" y="185" font-size="15" text-anchor="middle" fill="#292929"><tspan x="540.0" dy="0">관리자 경로 접근</tspan></text>
<rect x="405" y="212" width="270" height="40" rx="8" fill="#e6eefb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="540.0" y="237" font-size="15" text-anchor="middle" fill="#292929"><tspan x="540.0" dy="0">요청 급증</tspan></text>
<text x="540" y="288" font-size="15" text-anchor="middle" fill="#292929" font-weight="700">유형별로 세고, 유형별로 대응한다</text>
</g>
</svg>
