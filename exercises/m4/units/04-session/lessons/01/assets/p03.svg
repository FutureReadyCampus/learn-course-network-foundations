<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
<title>오류가 나면: 증상별로 확인할 것과 고치는 방법</title>
<desc>cd 가 안 되면 ls 로 폴더를 보고 없으면 mkdir 로 만듭니다. No module named pandas 는 가상환경을 활성화하고 설치합니다. FileNotFoundError 와 ValueError 는 위치와 파일 이름, 붙여 넣은 내용을 다시 봅니다.</desc>
<defs><marker id="a-0401-p03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666660"/></marker></defs>
<text x="24" y="32" font-size="19" fill="#292929" text-anchor="start" font-weight="700">오류가 나면: 증상 → 확인 → 고치기</text>
<text x="24" y="80" font-size="15" fill="#666660" text-anchor="start" font-weight="700">증상</text>
<text x="264" y="80" font-size="15" fill="#666660" text-anchor="start" font-weight="700">확인</text>
<text x="484" y="80" font-size="15" fill="#666660" text-anchor="start" font-weight="700">고치기</text>
<rect x="24" y="92" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="134.0" y="135.2" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">cd 가 안 됨</text>
<line x1="247" y1="130.0" x2="261" y2="130.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="264" y="92" width="200" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="364.0" y="124.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">ls 로</text>
<text x="364.0" y="145.8" font-size="15" fill="#666660" text-anchor="middle">폴더 이름 확인</text>
<line x1="467" y1="130.0" x2="481" y2="130.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="484" y="92" width="212" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590.0" y="124.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">mkdir 로 만들고</text>
<text x="590.0" y="145.8" font-size="15" fill="#666660" text-anchor="middle">cd 로 들어가기</text>
<rect x="24" y="186" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="134.0" y="218.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">No module named</text>
<text x="134.0" y="239.8" font-size="15" fill="#666660" text-anchor="middle">'pandas'</text>
<line x1="247" y1="224.0" x2="261" y2="224.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="264" y="186" width="200" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="364.0" y="218.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">가상환경이</text>
<text x="364.0" y="239.8" font-size="15" fill="#666660" text-anchor="middle">활성화됐는지</text>
<line x1="467" y1="224.0" x2="481" y2="224.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="484" y="186" width="212" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590.0" y="218.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">가상환경 활성화</text>
<text x="590.0" y="239.8" font-size="15" fill="#666660" text-anchor="middle">pip install pandas</text>
<rect x="24" y="280" width="220" height="76" rx="8" fill="#f8e8e3" stroke="#e0442e" stroke-width="1.5"/>
<text x="134.0" y="312.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">FileNotFoundError</text>
<text x="134.0" y="333.8" font-size="15" fill="#666660" text-anchor="middle">ValueError</text>
<line x1="247" y1="318.0" x2="261" y2="318.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="264" y="280" width="200" height="76" rx="8" fill="#fbf0dc" stroke="#9a6200" stroke-width="1.5"/>
<text x="364.0" y="312.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">pwd · ls 로</text>
<text x="364.0" y="333.8" font-size="15" fill="#666660" text-anchor="middle">위치 · 파일 이름</text>
<line x1="467" y1="318.0" x2="481" y2="318.0" stroke="#666660" stroke-width="2" marker-end="url(#a-0401-p03)"/>
<rect x="484" y="280" width="212" height="76" rx="8" fill="#e4f3ea" stroke="#1f7a4a" stroke-width="1.5"/>
<text x="590.0" y="312.8" font-size="15" fill="#292929" text-anchor="middle" font-weight="700">붙여 넣은 내용</text>
<text x="590.0" y="333.8" font-size="15" fill="#666660" text-anchor="middle">다시 확인</text>
<text x="24" y="388" font-size="14" fill="#666660" text-anchor="start">그래도 막히면: AI 에게 묻기(.env · API 키 지움) → 정답 → 「모름 — 막힌 곳: …」</text>
</svg>
