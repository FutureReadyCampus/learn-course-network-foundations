<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="learning-flow" viewBox="0 0 1120 340" role="group" aria-labelledby="lesson-20-basic-export-title lesson-20-basic-export-desc" lang="ko"><title id="lesson-20-basic-export-title">Host 자신을 가리키는 IP주소 · 학습 흐름</title><desc id="lesson-20-basic-export-desc">강의 설명을 읽는 순서. 각 상자를 선택하면 해당 개념의 정리문으로 이동합니다.</desc><defs><marker id="lesson-20-basic-export-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#7ee7c7" stroke-width="1.5"/></marker></defs><style>.learning-flow{background:#0f1115}.learning-flow text{font:500 20px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;fill:#e6e8ec}.learning-flow .flow-time{font-size:18px;fill:#9aa3b2}.learning-flow .flow-note{font-size:18px;fill:#9aa3b2}.learning-flow rect{fill:#171a21;stroke:#3d4b60;stroke-width:1.5}.learning-flow a:hover rect,.learning-flow a:focus rect{stroke:#7ee7c7;stroke-width:3}.learning-flow a:focus{outline:none}</style><g fill="none" stroke="#7ee7c7" stroke-width="2" marker-end="url(#lesson-20-basic-export-arrow)"><path d="M268 72.0 H292"/><path d="M546 72.0 H570"/><path d="M824 72.0 H848"/><path d="M977.0 128 V152.0 H143.0 V172"/><path d="M268 232.0 H292"/></g><a href="../lesson-20.html#concept-basic-20-01" target="_top" aria-label="자기 자신에게 접속하는 주소 설명으로 이동"><rect x="18" y="16" width="250" height="112" rx="10"/><text x="143.0" y="54" text-anchor="middle"><tspan x="143.0" dy="0">자기 자신에게</tspan><tspan x="143.0" dy="25">접속하는 주소</tspan></text><text class="flow-time" x="143.0" y="116" text-anchor="middle">01 · 0:01</text></a><a href="../lesson-20.html#concept-basic-20-02" target="_top" aria-label="통신의 주체는 프로세스 설명으로 이동"><rect x="296" y="16" width="250" height="112" rx="10"/><text x="421.0" y="54" text-anchor="middle"><tspan x="421.0" dy="0">통신의 주체는</tspan><tspan x="421.0" dy="25">프로세스</tspan></text><text class="flow-time" x="421.0" y="116" text-anchor="middle">02 · 1:26</text></a><a href="../lesson-20.html#concept-basic-20-03" target="_top" aria-label="한 컴퓨터 안의 두 프로세스 설명으로 이동"><rect x="574" y="16" width="250" height="112" rx="10"/><text x="699.0" y="54" text-anchor="middle"><tspan x="699.0" dy="0">한 컴퓨터 안의 두</tspan><tspan x="699.0" dy="25">프로세스</tspan></text><text class="flow-time" x="699.0" y="116" text-anchor="middle">03 · 2:27</text></a><a href="../lesson-20.html#concept-basic-20-04" target="_top" aria-label="127.0.0.1로 접속하기 설명으로 이동"><rect x="852" y="16" width="250" height="112" rx="10"/><text x="977.0" y="54" text-anchor="middle"><tspan x="977.0" dy="0">127.0.0.1로 접속하기</tspan></text><text class="flow-time" x="977.0" y="116" text-anchor="middle">04 · 3:52</text></a><a href="../lesson-20.html#concept-basic-20-05" target="_top" aria-label="루프백 통신이 지나가는 범위 설명으로 이동"><rect x="18" y="176" width="250" height="112" rx="10"/><text x="143.0" y="214" text-anchor="middle"><tspan x="143.0" dy="0">루프백 통신이</tspan><tspan x="143.0" dy="25">지나가는 범위</tspan></text><text class="flow-time" x="143.0" y="276" text-anchor="middle">05 · 4:22</text></a><a href="../lesson-20.html#concept-basic-20-06" target="_top" aria-label="루프백 주소의 활용 설명으로 이동"><rect x="296" y="176" width="250" height="112" rx="10"/><text x="421.0" y="214" text-anchor="middle"><tspan x="421.0" dy="0">루프백 주소의 활용</tspan></text><text class="flow-time" x="421.0" y="276" text-anchor="middle">06 · 4:54</text></a></svg>
