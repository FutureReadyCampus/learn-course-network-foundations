<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 (항상 보임: 정지 화면에서도 결론이 읽힘) -->
  <text x="480" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">DNS: 이름을 번호(IP 주소)로 바꿔 주는 주소록</text>

  <!-- 내 PC -->
  <rect x="40" y="110" width="240" height="190" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="52" y="122" width="216" height="166" rx="8" fill="#0f1115"/>
  <rect x="62" y="135" width="196" height="42" rx="21" fill="#e6e8ec"/>
  <text x="160" y="164" text-anchor="middle" font-size="24" font-weight="600" fill="#0f1115">www.naver.com</text>
  <text x="160" y="245" text-anchor="middle" font-size="26" fill="#9aa3b2">내 PC</text>
  <rect x="140" y="300" width="40" height="24" fill="#3d4b60"/>
  <rect x="100" y="324" width="120" height="12" rx="6" fill="#3d4b60"/>

  <!-- DNS 주소록 -->
  <rect x="640" y="100" width="280" height="230" rx="14" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
  <rect x="640" y="100" width="18" height="230" rx="6" fill="#6ea8fe"/>
  <text x="790" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#6ea8fe">DNS 주소록</text>
  <g opacity="0.35">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.5;0.54;0.94;0.98;1"/>
    <line x1="670" y1="162" x2="905" y2="162" stroke="#3d4b60" stroke-width="2"/>
    <text x="675" y="194" font-size="24" fill="#9aa3b2">www.example.com</text>
    <text x="900" y="226" text-anchor="end" font-size="24" fill="#9aa3b2">198.51.100.7</text>
    <line x1="670" y1="240" x2="905" y2="240" stroke="#3d4b60" stroke-width="2"/>
    <text x="675" y="274" font-size="24" fill="#e6e8ec">www.naver.com</text>
    <text x="900" y="306" text-anchor="end" font-size="24" font-weight="700" fill="#7ee7c7">203.0.113.10</text>
  </g>
  <!-- 해당 줄 강조 -->
  <rect x="664" y="246" width="246" height="72" rx="8" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.94;0.98;1"/>
  </rect>

  <!-- 웹 서버 -->
  <g opacity="0.3">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.74;0.78;0.94;0.98;1"/>
    <rect x="380" y="320" width="200" height="100" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <circle cx="560" cy="336" r="5" fill="#7ee7c7"/>
    <text x="480" y="360" text-anchor="middle" font-size="24" fill="#e6e8ec">웹 서버</text>
    <text x="480" y="400" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">203.0.113.10</text>
  </g>

  <!-- 접속 선 -->
  <path d="M160 338 V370 H372" fill="none" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-dasharray="260" stroke-dashoffset="260">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="260;260;0;0;260;260" keyTimes="0;0.75;0.8;0.94;0.98;1"/>
  </path>
  <polygon points="378,370 362,360 362,380" fill="#7ee7c7" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.94;0.98;1"/>
  </polygon>

  <!-- 이름 말풍선: PC -> DNS -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.46;0.5;1"/>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="0 0;0 0;140 0;140 0" keyTimes="0;0.23;0.4;1"/>
    <rect x="290" y="120" width="200" height="50" rx="25" fill="#171a21" stroke="#e6e8ec" stroke-width="2"/>
    <text x="390" y="153" text-anchor="middle" font-size="24" fill="#e6e8ec">www.naver.com</text>
  </g>

  <!-- 물음 -->
  <text x="460" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454" opacity="0">이 이름의 번호는?
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;0.4;1;0.4;1;0;0" keyTimes="0;0.3;0.33;0.37;0.41;0.44;0.47;0.51;1"/>
  </text>

  <!-- 번호 말풍선: DNS -> PC -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.94;0.98;1"/>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="140 0;140 0;0 0;0 0" keyTimes="0;0.6;0.74;1"/>
    <rect x="300" y="255" width="200" height="50" rx="25" fill="#7ee7c7"/>
    <text x="400" y="288" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">203.0.113.10</text>
  </g>

  <!-- 자막 바 -->
  <rect x="30" y="442" width="900" height="80" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="491">사람은 이름(www.naver.com)으로 기억해요
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.21;0.24;0.96;1"/>
    </text>
    <text x="480" y="491" opacity="0">PC가 DNS에게 이 이름의 번호를 물어봐요
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.48;0.51;1"/>
    </text>
    <text x="480" y="491" opacity="0">DNS가 주소록에서 번호(IP 주소)를 찾아 알려 줘요
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1"/>
    </text>
    <text x="480" y="491" opacity="0" fill="#7ee7c7" font-weight="700">이름 → 번호 → 접속: 컴퓨터는 번호로 찾아가요
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.74;0.77;0.94;0.97;1"/>
    </text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.51;0.52;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.52;0.75;0.76;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.76;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
