<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>

<!-- 제목(결론, 항상 보임) -->
<text x="480" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">선이 끊겨도 <tspan fill="#7ee7c7">연결 기록</tspan>은 남는다</text>
<text x="170" y="94" text-anchor="middle" font-size="24" fill="#9aa3b2">내 PC (10.0.0.2)</text>
<text x="790" y="94" text-anchor="middle" font-size="24" fill="#9aa3b2">서버 (10.0.0.5)</text>

<!-- 위층: 4층 TCP 연결 장부 -->
<rect x="20" y="106" width="920" height="150" rx="10" fill="#171a21"/>
<text x="480" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">4층 · TCP 연결 장부</text>
<rect x="50" y="150" width="240" height="88" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2">
  <animate attributeName="stroke-width" values="2;2;6;6;2;2" keyTimes="0;0.5;0.53;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
</rect>
<text x="170" y="184" text-anchor="middle" font-size="24" fill="#e6e8ec">상대 10.0.0.5</text>
<text x="170" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">ESTABLISHED</text>
<rect x="670" y="150" width="240" height="88" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2">
  <animate attributeName="stroke-width" values="2;2;6;6;2;2" keyTimes="0;0.5;0.53;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
</rect>
<text x="790" y="184" text-anchor="middle" font-size="24" fill="#e6e8ec">상대 10.0.0.2</text>
<text x="790" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">ESTABLISHED</text>
<text x="480" y="180" text-anchor="middle" font-size="24" fill="#7ee7c7">연결됨</text>
<line x1="296" y1="198" x2="664" y2="198" stroke="#7ee7c7" stroke-width="4" stroke-dasharray="14 10">
  <animate attributeName="stroke-dashoffset" values="0;-240" dur="12s" repeatCount="indefinite"/>
</line>
<text x="480" y="240" text-anchor="middle" font-size="24" fill="#7ee7c7" opacity="0">장부는 그대로!
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
</text>

<!-- 아래층: 1층 케이블 -->
<rect x="20" y="268" width="920" height="156" rx="10" fill="#171a21"/>
<text x="480" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">1층 · 케이블(선)
  <animate attributeName="fill" values="#ffb454;#ffb454;#7a8291;#7a8291;#ffb454;#ffb454" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
</text>
<!-- 케이블 두 토막: 가운데서 벌어졌다 다시 붙음 -->
<line x1="290" y1="356" x2="480" y2="356" stroke="#ffb454" stroke-width="8">
  <animate attributeName="stroke" values="#ffb454;#ffb454;#5a6170;#5a6170;#ffb454;#ffb454" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-16 0;-16 0;0 0;0 0" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
</line>
<line x1="480" y1="356" x2="670" y2="356" stroke="#ffb454" stroke-width="8">
  <animate attributeName="stroke" values="#ffb454;#ffb454;#5a6170;#5a6170;#ffb454;#ffb454" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;16 0;16 0;0 0;0 0" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
</line>

<rect x="50" y="318" width="240" height="76" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<text x="170" y="364" text-anchor="middle" font-size="24" fill="#e6e8ec">랜 포트</text>
<rect x="670" y="318" width="240" height="76" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<text x="790" y="364" text-anchor="middle" font-size="24" fill="#e6e8ec">랜 포트</text>

<!-- 패킷: 흐르다 멈추고, 다시 이어지면 흐름 -->
<rect x="300" y="346" width="20" height="20" rx="4" fill="#7ee7c7">
  <animate attributeName="x" values="300;430;430;640" keyTimes="0;0.25;0.86;1" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="fill" values="#7ee7c7;#7ee7c7;#9aa3b2;#9aa3b2;#7ee7c7;#7ee7c7" keyTimes="0;0.25;0.28;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.97;1" dur="12s" repeatCount="indefinite"/>
</rect>

<!-- 가위 -->
<g stroke="#ffb454" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
  <line x1="468" y1="322" x2="492" y2="366"/>
  <line x1="492" y1="322" x2="468" y2="366"/>
  <circle cx="464" cy="374" r="8"/>
  <circle cx="496" cy="374" r="8"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.32;0.36;1" dur="12s" repeatCount="indefinite"/>
</g>
<text x="480" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454" opacity="0">끊김
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.84;0.86;1" dur="12s" repeatCount="indefinite"/>
</text>

<!-- 자막 바 -->
<rect x="20" y="440" width="920" height="80" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" text-anchor="middle" fill="#e6e8ec">
  <text x="480" y="490">아래 1층은 케이블, 위 4층은 TCP 연결 장부
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.21;0.24;0.96;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="490" opacity="0">가위로 선을 자르면 1층 신호가 멈춥니다
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.48;0.51;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="490" opacity="0">그래도 4층 장부엔 <tspan fill="#7ee7c7">ESTABLISHED</tspan>가 남아요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.52;0.81;0.84;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="490" opacity="0" font-weight="700"><tspan fill="#ffb454">선은 1층</tspan>, <tspan fill="#7ee7c7">연결은 4층</tspan> — 서로 다른 층의 일
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.85;0.96;1" dur="12s" repeatCount="indefinite"/>
  </text>
</g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.24;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.24;0.5;0.51;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.83;0.84;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.84;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
