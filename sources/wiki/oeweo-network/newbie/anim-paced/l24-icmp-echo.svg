<rect x="52" y="112" width="206" height="38" rx="6" fill="#3d4b60"/>
<text x="155" y="140" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">Ping</text>
<rect x="135" y="280" width="40" height="22" fill="#3d4b60"/><rect x="95" y="300" width="120" height="10" rx="4" fill="#3d4b60"/>
<text x="155" y="345" font-size="24" fill="#9aa3b2" text-anchor="middle">내 PC</text>
<text x="155" y="192" font-size="24" fill="#9aa3b2" text-anchor="middle">시간 재는 중<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.76;0.95" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<text x="155" y="192" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">RTT<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.76;0.95" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
