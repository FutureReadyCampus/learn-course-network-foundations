<text x="155" y="250" font-size="36" font-weight="700" fill="#ffb454" text-anchor="middle" opacity="0">18 ms<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.62;0.69" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<text x="155" y="250" font-size="36" font-weight="700" fill="#ffb454" text-anchor="middle" opacity="0">21 ms<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.69;0.76" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
