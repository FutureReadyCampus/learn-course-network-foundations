<circle cx="880" cy="142" r="6" fill="#7ee7c7"/><circle cx="880" cy="200" r="6" fill="#7ee7c7"/><circle cx="880" cy="258" r="6" fill="#7ee7c7"/>
<text x="820" y="345" font-size="24" fill="#9aa3b2" text-anchor="middle">서버</text>
<line x1="285" y1="292" x2="705" y2="292" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 8"/>
<text x="495" y="330" font-size="24" fill="#9aa3b2" text-anchor="middle">약속(ICMP)대로 주고받기</text>
<g transform="translate(285,160)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;220,0;220,0;0,0;0,0" keyTimes="0;0.2;0.45;0.6;0.62;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.53;0.57;0.95;1" dur="12s" repeatCount="indefinite"/><rect x="0" y="-46" width="200" height="38" rx="19" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/><text x="100" y="-18" font-size="24" font-weight="700" fill="#6ea8fe" text-anchor="middle">Echo Request</text><rect x="0" y="0" width="200" height="104" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/><polyline points="2,3 100,44 198,3" fill="none" stroke="#6ea8fe" stroke-width="2"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.48;0.6;0.62;1" dur="12s" repeatCount="indefinite"/></polyline><g opacity="0.45"><animate attributeName="opacity" values="0.45;0.45;1;1;0.45;0.45" keyTimes="0;0.45;0.48;0.6;0.62;1" dur="12s" repeatCount="indefinite"/><rect x="11" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="31" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">A</text><rect x="57" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="77" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">B</text><rect x="103" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="123" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">C</text><rect x="149" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="169" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">D</text></g></g></g>
<g transform="translate(285,160)"><g opacity="0"><animateTransform attributeName="transform" type="translate" values="220,0;220,0;0,0;0,0" keyTimes="0;0.56;0.76;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.94;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="0" y="-46" width="200" height="38" rx="19" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="100" y="-18" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">Echo Reply</text><rect x="0" y="0" width="200" height="104" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><polyline points="2,3 100,44 198,3" fill="none" stroke="#7ee7c7" stroke-width="2"></polyline><g><rect x="11" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="31" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">A</text><rect x="57" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="77" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">B</text><rect x="103" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="123" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">C</text><rect x="149" y="54" width="40" height="40" rx="6" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/><text x="169" y="83" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">D</text></g></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.80;0.95;0.975;1" dur="12s" repeatCount="indefinite"/><rect x="30" y="366" width="280" height="50" rx="25" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="170" y="400" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">Ping = 프로그램</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.85;0.95;0.975;1" dur="12s" repeatCount="indefinite"/><rect x="340" y="366" width="280" height="50" rx="25" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="480" y="400" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">ICMP = 약속</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.87;0.90;0.95;0.975;1" dur="12s" repeatCount="indefinite"/><rect x="650" y="366" width="280" height="50" rx="25" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="790" y="400" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">RTT = 측정값</text></g>
<rect x="30" y="444" width="900" height="68" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="487" font-size="26" fill="#e6e8ec" font-weight="400" text-anchor="middle">Ping 프로그램이 A B C D를 담아 Echo Request를 보냅니다<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.24;0.975;1" dur="12s" repeatCount="indefinite"/></text>
<text x="480" y="487" font-size="26" fill="#e6e8ec" font-weight="400" text-anchor="middle" opacity="0">서버가 봉투를 열어 받은 A B C D를 확인합니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.5;0.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="480" y="487" font-size="26" fill="#e6e8ec" font-weight="400" text-anchor="middle" opacity="0">같은 A B C D를 Echo Reply에 담아 돌려보냅니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.76;0.775;1" dur="12s" repeatCount="indefinite"/></text>
<text x="480" y="487" font-size="26" fill="#7ee7c7" font-weight="700" text-anchor="middle" opacity="0">Ping은 프로그램, ICMP는 약속, RTT는 왕복 시간 값<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.775;0.79;0.95;0.975;1" dur="12s" repeatCount="indefinite"/></text>
</svg>