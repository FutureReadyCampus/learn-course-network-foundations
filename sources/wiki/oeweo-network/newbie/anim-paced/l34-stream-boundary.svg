<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
  <defs>
    <clipPath id="strip"><rect x="40" y="215" width="880" height="90" rx="10"/></clipPath>
  </defs>

  <!-- 제목 -->
  <text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">끊김 없는 두루마리, 약속으로 끊어 읽기</text>

  <!-- 0~2.5초: 봉투(IP 패킷) vs 두루마리(Stream) 대비 -->
  <g>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.23;0.26;0.96;1"/>
    <rect x="40" y="78" width="420" height="92" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="60" y="110" font-size="24" fill="#9aa3b2">IP 패킷 = 봉투</text>
    <rect x="60" y="124" width="110" height="32" rx="6" fill="none" stroke="#ffb454" stroke-width="3"/>
    <rect x="190" y="124" width="110" height="32" rx="6" fill="none" stroke="#ffb454" stroke-width="3"/>
    <rect x="320" y="124" width="110" height="32" rx="6" fill="none" stroke="#ffb454" stroke-width="3"/>
    <rect x="500" y="78" width="420" height="92" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="520" y="110" font-size="24" fill="#9aa3b2">TCP Stream = 두루마리</text>
    <rect x="520" y="124" width="380" height="32" rx="6" fill="none" stroke="#e6e8ec" stroke-width="3"/>
  </g>

  <!-- 2.5~5초: 어디서 끊지? -->
  <text x="480" y="140" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454" opacity="0">어디서 끊지?
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.48;0.51;1"/>
  </text>

  <!-- 5~8초: 약속 상자, 8~10초: HTTP 약속 라벨 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0.3;1;0.3;1;1;0;0" keyTimes="0;0.5;0.52;0.55;0.58;0.61;0.64;0.95;0.99;1"/>
    <rect x="250" y="82" width="460" height="80" rx="14" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="480" y="133" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">약속: <tspan fill="#ffb454">빈 줄</tspan> = 메시지 끝
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.77;0.79;0.99;1"/>
    </text>
    <text x="480" y="133" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7" opacity="0">HTTP 약속
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.77;0.79;0.99;1"/>
    </text>
  </g>
  <!-- HTTP 약속 괄호 -->
  <path d="M245 210 V192 H715 V210 M480 192 V162" fill="none" stroke="#7ee7c7" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.98;1"/>
  </path>

  <!-- 두루마리 띠 -->
  <rect x="40" y="215" width="880" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g clip-path="url(#strip)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="-440 0;0 0;0 0;-440 0" keyTimes="0;0.2;0.95;1"/>
      <!-- 메시지 1 -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="0 0;0 0;-15 0;-15 0;0 0" keyTimes="0;0.77;0.8;0.95;1"/>
        <rect x="60" y="227" width="400" height="66" rx="8" fill="#7ee7c7" fill-opacity="0" stroke="#7ee7c7" stroke-width="3" stroke-opacity="0">
          <animate attributeName="fill-opacity" dur="14s" repeatCount="indefinite" values="0;0;0.18;0.18;0" keyTimes="0;0.68;0.71;0.95;1"/>
          <animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.68;0.71;0.95;1"/>
        </rect>
        <text x="78" y="270" font-size="26" fill="#e6e8ec">GET /a  Host: a.com</text>
        <rect x="370" y="242" width="76" height="36" rx="6" fill="#ffb454"/>
        <text x="408" y="269" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">빈 줄</text>
      </g>
      <!-- 메시지 2 -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="0 0;0 0;15 0;15 0;0 0" keyTimes="0;0.77;0.8;0.95;1"/>
        <rect x="500" y="227" width="400" height="66" rx="8" fill="#6ea8fe" fill-opacity="0" stroke="#6ea8fe" stroke-width="3" stroke-opacity="0">
          <animate attributeName="fill-opacity" dur="14s" repeatCount="indefinite" values="0;0;0.18;0.18;0" keyTimes="0;0.68;0.71;0.95;1"/>
          <animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.68;0.71;0.95;1"/>
        </rect>
        <text x="518" y="270" font-size="26" fill="#e6e8ec">GET /b  Host: a.com</text>
        <rect x="810" y="242" width="76" height="36" rx="6" fill="#ffb454"/>
        <text x="848" y="269" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">빈 줄</text>
      </g>
      <!-- 뒤따라 오는 글자 -->
      <text x="958" y="270" font-size="26" fill="#9aa3b2">GET /c  Host: a.com</text>
    </g>
  </g>
  <!-- 빈 줄 깜빡임 강조 -->
  <rect x="364" y="236" width="88" height="48" rx="8" fill="none" stroke="#ffb454" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;1;0;0" keyTimes="0;0.5;0.53;0.56;0.59;0.62;1"/>
  </rect>

  <!-- 물음표 -->
  <g fill="#ffb454" font-size="32" font-weight="700" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.24;0.27;0.48;0.5;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="0 0;0 0;0 -6;0 0;0 -6;0 0;0 0" keyTimes="0;0.25;0.31;0.37;0.43;0.49;1"/>
    <text x="250" y="207">?</text>
    <text x="480" y="207">?</text>
    <text x="710" y="207">?</text>
  </g>

  <!-- 점선 -->
  <line x1="480" y1="200" x2="480" y2="320" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.78;0.8;1"/>
  </line>

  <!-- 가위 -->
  <g opacity="0" stroke="#e6e8ec" stroke-width="3" fill="none">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.7;0.72;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="480 190;480 190;480 320;480 320" keyTimes="0;0.6;0.7;1"/>
    <circle cx="-9" cy="-16" r="7"/>
    <circle cx="9" cy="-16" r="7"/>
    <line x1="-6" y1="-10" x2="7" y2="16"/>
    <line x1="6" y1="-10" x2="-7" y2="16"/>
  </g>

  <!-- 메시지 라벨 -->
  <g font-size="26" font-weight="700" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.69;0.72;0.95;0.98;1"/>
    <text x="245" y="350" fill="#7ee7c7">메시지 1</text>
    <text x="715" y="350" fill="#6ea8fe">메시지 2</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="430" width="880" height="72" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="475">TCP Stream은 글자가 끊김 없이 이어진 두루마리
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.23;0.25;0.97;1"/>
    </text>
    <text x="480" y="475" opacity="0">칸막이가 없어 어디까지가 한 메시지인지 몰라요
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1"/>
    </text>
    <text x="480" y="475" opacity="0">약속: <tspan fill="#ffb454">빈 줄</tspan>이 나오면 메시지 하나가 끝
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.76;0.78;1"/>
    </text>
    <text x="480" y="475" opacity="0" fill="#7ee7c7" font-weight="700">HTTP 같은 규칙이 메시지 경계를 정해 줘요
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.96;0.99;1"/>
    </text>
  </g>
</svg>
