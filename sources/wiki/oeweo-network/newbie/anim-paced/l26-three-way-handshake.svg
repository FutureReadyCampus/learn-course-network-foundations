<polygon points="300,290 314,282 314,298" fill="#9aa3b2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.5;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></polygon>
<text x="480" y="276" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle" opacity="0">SYN <tspan fill="#ffb454">4000</tspan> + ACK <tspan fill="#6ea8fe">1001</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
