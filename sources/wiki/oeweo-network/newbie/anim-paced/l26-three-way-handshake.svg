<text x="575" y="314" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">ACK <tspan fill="#6ea8fe">1001</tspan></text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.57;0.8;0.83;1" dur="16s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;190 0;190 0;0 0;0 0" keyTimes="0;0.6;0.8;0.83;0.84;1" dur="16s" repeatCount="indefinite"/>
<rect x="305" y="346" width="160" height="68" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<text x="385" y="374" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">ACK</text>
<text x="385" y="404" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">번호 <tspan fill="#ffb454">4001</tspan></text>
</g>
<rect x="40" y="436" width="880" height="76" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="484" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="1">① SYN: 클라이언트가 “내 시작 번호는 1000”을 보냅니다<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.225;0.255;0.97;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="484" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">② SYN+ACK: 서버가 “1000 받음(ACK 1001)”과 “내 번호 4000”을 함께<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.255;0.285;0.52;0.54;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="484" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">③ ACK 4001: 클라이언트가 “4000 잘 받았어요”라고 답합니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.535;0.565;0.83;0.85;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="484" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">세 번 오가면 양쪽이 서로의 시작 번호를 알고 확인했습니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.845;0.875;0.955;0.975;1" dur="16s" repeatCount="indefinite"/></text>
</svg>
