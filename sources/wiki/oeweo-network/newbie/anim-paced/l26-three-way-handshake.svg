<text x="480" y="186" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle" opacity="0">SYN <tspan fill="#6ea8fe">1000</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
<text x="650" y="232" font-size="24" font-weight="700" fill="#6ea8fe" text-anchor="end" opacity="0">✓ 1000 받음<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
