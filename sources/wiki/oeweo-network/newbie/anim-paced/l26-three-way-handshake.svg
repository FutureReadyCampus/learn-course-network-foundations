<text x="920" y="286" font-size="30" font-weight="700" fill="#ffb454" text-anchor="end" opacity="0">4000<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.27;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
