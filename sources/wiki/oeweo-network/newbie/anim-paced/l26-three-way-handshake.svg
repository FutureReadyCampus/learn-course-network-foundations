<line x1="300" y1="380" x2="656" y2="380" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="356 356" stroke-dashoffset="356"><animate attributeName="stroke-dashoffset" values="356;356;0;0;356;356" keyTimes="0;0.6;0.8;0.98;0.99;1" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.95;0.98;0.99;1" dur="16s" repeatCount="indefinite"/></line>
<polygon points="660,380 646,372 646,388" fill="#9aa3b2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.82;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></polygon>
<text x="480" y="366" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle" opacity="0">ACK <tspan fill="#ffb454">4001</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
<text x="650" y="412" font-size="24" font-weight="700" fill="#ffb454" text-anchor="end" opacity="0">✓ 확인 받음<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></text>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="16s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;190 0;190 0;0 0;0 0" keyTimes="0;0.04;0.2;0.23;0.24;1" dur="16s" repeatCount="indefinite"/>
<rect x="305" y="166" width="160" height="68" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<text x="385" y="194" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">SYN</text>
<text x="385" y="224" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">번호 <tspan fill="#6ea8fe">1000</tspan></text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.48;0.51;1" dur="16s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-190 0;-190 0;0 0;0 0" keyTimes="0;0.28;0.48;0.51;0.52;1" dur="16s" repeatCount="indefinite"/>
<rect x="495" y="256" width="160" height="68" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
