<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<defs><clipPath id="rowclip"><rect x="120" y="150" width="90" height="300"><animate attributeName="width" values="90;90;180;180;270;270;360;360;450;450;540;540;630;630;720;720;90;90" keyTimes="0;0.18;0.2;0.215;0.235;0.25;0.27;0.285;0.305;0.32;0.34;0.355;0.375;0.39;0.41;0.86;0.87;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="cntclip"><rect x="60" y="88" width="840" height="44"/></clipPath><pattern id="rows" width="280" height="7" patternUnits="userSpaceOnUse"><rect width="280" height="4" fill="#ffb454" opacity="0.75"/></pattern><clipPath id="stackclip"><rect x="560" y="100" width="280" height="260"><animate attributeName="y" values="360;360;100;100;360" keyTimes="0;0.65;0.75;0.95;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></rect></clipPath></defs>
<text x="480" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">전구 8개가 한 바이트</text>
<g><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.16;0.17;0.94;0.95;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.18;0.40;0.42;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.43;0.59;0.61;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.61;0.62;0.92;0.94;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text></g>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.63;0.95;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
<g clip-path="url(#cntclip)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-40;0,-80;0,-120;0,-160;0,-200;0,-240;0,-280;0,0;0,0" keyTimes="0;0.2;0.235;0.27;0.305;0.34;0.375;0.41;0.87;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
<text x="480" y="122" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 1개 → 켜짐·꺼짐 <tspan fill="#6ea8fe" font-weight="700">2</tspan>가지</text>
<text x="480" y="162" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 2개 → 2×2 = <tspan fill="#6ea8fe" font-weight="700">4</tspan>가지</text>
<text x="480" y="202" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 3개 → 2×2×2 = <tspan fill="#6ea8fe" font-weight="700">8</tspan>가지</text>
<text x="480" y="242" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 4개 → 2×2×2×2 = <tspan fill="#6ea8fe" font-weight="700">16</tspan>가지</text>
<text x="480" y="282" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 5개 → 2×2×2×2×2 = <tspan fill="#6ea8fe" font-weight="700">32</tspan>가지</text>
<text x="480" y="322" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 6개 → 2×2×2×2×2×2 = <tspan fill="#6ea8fe" font-weight="700">64</tspan>가지</text>
<text x="480" y="362" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 7개 → 2×2×2×2×2×2×2 = <tspan fill="#6ea8fe" font-weight="700">128</tspan>가지</text>
<text x="480" y="402" text-anchor="middle" font-size="30" fill="#9aa3b2">전구 8개 → 2×2×2×2×2×2×2×2 = <tspan fill="#6ea8fe" font-weight="700">256</tspan>가지</text>
</g></g>
<g><animateTransform attributeName="transform" type="translate" values="315,0;315,0;270,0;270,0;225,0;225,0;180,0;180,0;135,0;135,0;90,0;90,0;45,0;45,0;0,0;0,0;315,0;315,0" keyTimes="0;0.18;0.2;0.215;0.235;0.25;0.27;0.285;0.305;0.32;0.34;0.355;0.375;0.39;0.41;0.86;0.87;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
<g clip-path="url(#rowclip)"><circle cx="165" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="151" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="255" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="241" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="345" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="331" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="435" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="421" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="525" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="511" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="615" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="601" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="705" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="691" y="280" width="28" height="16" rx="3" fill="#3d4b60"/><circle cx="795" cy="250" r="30" fill="#171a21" stroke="#3d4b60" stroke-width="3"/><rect x="781" y="280" width="28" height="16" rx="3" fill="#3d4b60"/></g>
<g><circle cx="165" cy="250" r="41" fill="#ffb454" opacity="0.22"/><circle cx="165" cy="250" r="30" fill="#ffb454"/><animate attributeName="opacity" values="1;0;1;0;1;1" keyTimes="0;0.05;0.1;0.15;0.87;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></g>
<text x="165" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1<animate attributeName="opacity" values="1;0;1;0;1;1" keyTimes="0;0.05;0.1;0.15;0.87;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text>
<text x="165" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa3b2" opacity="0">0<animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0;0.05;0.1;0.15;0.18;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.21;0.86;0.87;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="110" y="368" width="110" height="40" rx="20" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/><text x="165" y="396" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">1비트</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.46;0.85;0.86;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
<circle cx="165" cy="250" r="41" fill="#ffb454" opacity="0.22"/><circle cx="165" cy="250" r="30" fill="#ffb454"/>
<text x="165" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text>
<text x="255" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa3b2">0</text>
<circle cx="345" cy="250" r="41" fill="#ffb454" opacity="0.22"/><circle cx="345" cy="250" r="30" fill="#ffb454"/>
<text x="345" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text>
<circle cx="435" cy="250" r="41" fill="#ffb454" opacity="0.22"/><circle cx="435" cy="250" r="30" fill="#ffb454"/>
<text x="435" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text>
<text x="525" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa3b2">0</text>
<text x="615" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa3b2">0</text>
<circle cx="705" cy="250" r="41" fill="#ffb454" opacity="0.22"/><circle cx="705" cy="250" r="30" fill="#ffb454"/>
<text x="705" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb454">1</text>
<text x="795" y="345" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa3b2">0</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.49;0.85;0.86;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="105" y="196" width="750" height="166" rx="16" fill="none" stroke="#7ee7c7" stroke-width="4"/></g>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.85;0.86;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><text x="480" y="412" text-anchor="middle" font-size="32" font-weight="700" fill="#7ee7c7">1바이트 = 8비트</text></g>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.65;0.95;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
<rect x="110" y="215" width="26" height="26" rx="4" fill="#ffb454" stroke="#3d4b60" stroke-width="2"/>
<rect x="140" y="215" width="26" height="26" rx="4" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="170" y="215" width="26" height="26" rx="4" fill="#ffb454" stroke="#3d4b60" stroke-width="2"/>
<rect x="200" y="215" width="26" height="26" rx="4" fill="#ffb454" stroke="#3d4b60" stroke-width="2"/>
<rect x="230" y="215" width="26" height="26" rx="4" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="260" y="215" width="26" height="26" rx="4" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="290" y="215" width="26" height="26" rx="4" fill="#ffb454" stroke="#3d4b60" stroke-width="2"/>
<rect x="320" y="215" width="26" height="26" rx="4" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="229" y="285" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">1바이트 (한 줄)</text>
<text x="460" y="215" text-anchor="middle" font-size="28" font-weight="700" fill="#6ea8fe">× 1,024줄</text><line x1="385" y1="235" x2="525" y2="235" stroke="#6ea8fe" stroke-width="4"/><path d="M525 225 L545 235 L525 245 Z" fill="#6ea8fe"/>
<rect x="560" y="100" width="280" height="260" rx="10" fill="#171a21"/>
<rect x="560" y="100" width="280" height="260" fill="url(#rows)" clip-path="url(#stackclip)"/>
<rect x="560" y="100" width="280" height="260" rx="10" fill="none" stroke="#7ee7c7" stroke-width="4"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="610" y="185" width="180" height="96" rx="12" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/><text x="700" y="236" text-anchor="middle" font-size="44" font-weight="800" fill="#7ee7c7">1KB</text><text x="700" y="268" text-anchor="middle" font-size="24" fill="#e6e8ec">1,024바이트</text></g>
<text x="300" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe" opacity="0">2×2×2×2×2×2×2×2×2×2 = 1,024<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.68;1" dur="16s" repeatCount="indefinite"/></text>
<text x="300" y="366" text-anchor="middle" font-size="24" fill="#e6e8ec" opacity="0">2를 10번 곱하면 1,000에 가장 가까워 → 킬로(K)<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.69;0.71;1" dur="16s" repeatCount="indefinite"/></text>
<text x="300" y="402" text-anchor="middle" font-size="24" fill="#9aa3b2" opacity="0">예: 영어 글자 1,024자 = 1,024바이트 = 1KB<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.73;0.75;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="444" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec" opacity="0">비트 8개 = 1바이트, 그 위 단위는 <tspan fill="#7ee7c7">1,024배</tspan>씩<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.77;0.79;1" dur="16s" repeatCount="indefinite"/></text>
</g>
<rect x="40" y="460" width="880" height="62" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="500" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="1">전구 하나가 켜지면 1, 꺼지면 0. 이것이 1비트입니다.<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.17;0.19;0.96;0.98;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">전구를 하나 더하면 켜짐·꺼짐 2가지가 곱해져 모양이 두 배.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.42;0.44;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">전구 8개 한 줄이 1바이트, 2를 8번 곱해 256가지입니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.61;0.63;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">바이트 한 줄을 1,024(2를 10번 곱한 수)개 모으면 1KB.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.65;0.94;0.96;1" calcMode="linear" dur="16s" repeatCount="indefinite"/></text>
</svg>