<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">DHCP: 빈 설정 칸을 서버가 채워 준다</text>

<!-- 왼쪽: 클라이언트 PC -->
<rect x="40" y="80" width="350" height="320" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="60" y="122" font-size="26" font-weight="700" fill="#e6e8ec">내 PC <tspan fill="#9aa3b2" font-size="24">(클라이언트)</tspan></text>
<g font-size="24">
  <text x="60" y="191" fill="#9aa3b2">IP</text>
  <text x="60" y="251" fill="#9aa3b2">마스크</text>
  <text x="60" y="311" fill="#9aa3b2">게이트웨이</text>
  <text x="60" y="371" fill="#9aa3b2">DNS</text>
  <rect x="190" y="160" width="185" height="46" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="190" y="220" width="185" height="46" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="190" y="280" width="185" height="46" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="190" y="340" width="185" height="46" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
</g>
<!-- 물음표 (채워지면 사라짐) -->
<g font-size="28" font-weight="700" fill="#ffb454" text-anchor="middle">
  <text x="282" y="193">?<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.82;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="253">?<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.825;0.845;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="313">?<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.85;0.87;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="373">?<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.875;0.895;0.95;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<!-- 채워지는 값 -->
<g font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">
  <text x="282" y="191" opacity="0">192.168.0.10<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.82;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="251" opacity="0">255.255.255.0<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.825;0.845;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="311" opacity="0">192.168.0.1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.87;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="282" y="371" opacity="0">8.8.8.8<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.875;0.895;0.95;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<!-- 체크 + 문구 -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.89;0.91;0.95;1" dur="12s" repeatCount="indefinite"/>
  <circle cx="68" cy="432" r="16" fill="#7ee7c7"/>
  <path d="M60 432 l6 6 l11 -12" fill="none" stroke="#0f1115" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="441" font-size="26" font-weight="700" fill="#7ee7c7">직접 입력한 것 없음</text>
</g>

<!-- 오른쪽: DHCP 서버와 설정 서랍 -->
<rect x="640" y="80" width="280" height="320" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="660" y="122" font-size="26" font-weight="700" fill="#e6e8ec">DHCP <tspan fill="#9aa3b2" font-size="24">서버</tspan></text>
<rect x="656" y="140" width="248" height="244" rx="10" fill="#0f1115" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="6 5"/>
<text x="780" y="172" text-anchor="middle" font-size="24" fill="#6ea8fe">설정 서랍</text>

<!-- 요청 말풍선: PC -> 서버 -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.195;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,0;175,0;175,0" keyTimes="0;0.22;0.45;1" dur="12s" repeatCount="indefinite"/>
  <rect x="300" y="88" width="150" height="48" rx="24" fill="#ffb454"/>
  <path d="M320 134 l-10 14 l22 -12 z" fill="#ffb454"/>
  <text x="375" y="121" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">설정 주세요</text>
</g>

<!-- 값 묶음 카드: 서랍 -> PC -->
<g>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.85;0.90;0.95;1" dur="12s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-262,0;-262,0;0,0;0,0" keyTimes="0;0.5;0.75;0.92;0.93;1" dur="12s" repeatCount="indefinite"/>
  <rect x="668" y="188" width="224" height="184" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
  <g font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">
    <text x="780" y="224">192.168.0.10</text>
    <text x="780" y="266">255.255.255.0</text>
    <text x="780" y="308">192.168.0.1</text>
    <text x="780" y="350">8.8.8.8</text>
  </g>
</g>

<!-- 자막 바 -->
<rect x="40" y="470" width="880" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="1.5"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
  <text x="480" y="507">PC는 IP·마스크·게이트웨이·DNS를 모릅니다<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.21;0.215;0.97;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="480" y="507" opacity="0">클라이언트(PC)가 서버에 설정을 달라고 합니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.215;0.22;0.51;0.515;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="480" y="507" opacity="0">DHCP 서버가 서랍 속 설정 값을 보내 줍니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.515;0.52;0.815;0.82;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="480" y="507" opacity="0" fill="#7ee7c7" font-weight="700">클라이언트와 서버가 짝을 이뤄 자동으로 채웁니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.825;0.95;0.97;1" dur="12s" repeatCount="indefinite"/></text>
</g>
</svg>
