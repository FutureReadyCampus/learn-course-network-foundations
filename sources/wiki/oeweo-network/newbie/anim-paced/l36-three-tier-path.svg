<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">주문 한 건이 지나가는 세 단</text>
<rect x="30" y="160" width="160" height="120" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="110.0" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">브라우저</text>
<rect x="65.0" y="228" width="90" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe"/>
<text x="110.0" y="255" text-anchor="middle" font-size="24" fill="#6ea8fe">손님</text>
<rect x="260" y="160" width="180" height="120" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="260" y="160" width="180" height="120" rx="14" fill="#7ee7c7" fill-opacity="0.14" stroke="#7ee7c7" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;0.3;0.3;1;0.3;0.3;0" keyTimes="0;0.26;0.27;0.33;0.69;0.70;0.76;0.95;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="350.0" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">웹 서버</text>
<rect x="305.0" y="228" width="90" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe"/>
<text x="350.0" y="255" text-anchor="middle" font-size="24" fill="#6ea8fe">홀</text>
<rect x="500" y="160" width="180" height="120" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="500" y="160" width="180" height="120" rx="14" fill="#7ee7c7" fill-opacity="0.14" stroke="#7ee7c7" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;0.3;0.3;1;1;0.3;0.3;0" keyTimes="0;0.34;0.35;0.41;0.57;0.58;0.62;0.68;0.95;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="590.0" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">WAS</text>
<rect x="545.0" y="228" width="90" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe"/>
<text x="590.0" y="255" text-anchor="middle" font-size="24" fill="#6ea8fe">주방</text>
<rect x="740" y="160" width="180" height="120" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="740" y="160" width="180" height="120" rx="14" fill="#7ee7c7" fill-opacity="0.14" stroke="#7ee7c7" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0.3;0.3;0" keyTimes="0;0.42;0.43;0.51;0.56;0.95;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="830.0" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">DB</text>
<rect x="785.0" y="228" width="90" height="36" rx="18" fill="#0f1115" stroke="#6ea8fe"/>
<text x="830.0" y="255" text-anchor="middle" font-size="24" fill="#6ea8fe">창고</text>
<line x1="110" y1="314" x2="820" y2="314" stroke="#7ee7c7" stroke-width="3" opacity="0.4"/><polygon points="836,314 818,305 818,323" fill="#7ee7c7" opacity="0.4"/>
<line x1="120" y1="364" x2="830" y2="364" stroke="#ffb454" stroke-width="3" opacity="0.4"/><polygon points="104,364 122,355 122,373" fill="#ffb454" opacity="0.4"/>
<g opacity="0"><rect x="242" y="142" width="456" height="156" rx="18" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 8"/><text x="470" y="126" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">2-tier로 볼 수도 있음</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.80;0.95;0.98;1" dur="16s" repeatCount="indefinite"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.45;0.49;1" dur="16s" repeatCount="indefinite"/><g transform="translate(110 314)"><animateTransform attributeName="transform" type="translate" values="110 314;110 314;350 314;350 314;590 314;590 314;830 314;830 314" keyTimes="0;0.2;0.27;0.29;0.35;0.37;0.43;1" dur="16s" repeatCount="indefinite"/><rect x="-44" y="-19" width="88" height="38" rx="8" fill="#7ee7c7"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">주문</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.58;0.6;1" dur="16s" repeatCount="indefinite"/><g transform="translate(830 364)"><animateTransform attributeName="transform" type="translate" values="830 364;830 364;590 364;590 364" keyTimes="0;0.5;0.58;1" dur="16s" repeatCount="indefinite"/><rect x="-44" y="-19" width="88" height="38" rx="8" fill="#6ea8fe"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">자료</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.61;0.95;0.98;1" dur="16s" repeatCount="indefinite"/><g transform="translate(590 364)"><animateTransform attributeName="transform" type="translate" values="590 364;590 364;350 364;350 364;110 364;110 364" keyTimes="0;0.6;0.69;0.71;0.8;1" dur="16s" repeatCount="indefinite"/><rect x="-44" y="-19" width="88" height="38" rx="8" fill="#ffb454"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">결과</text></g></g>
<rect x="40" y="430" width="880" height="80" rx="12" fill="#171a21" stroke="#3d4b60"/>
<text x="480" y="480" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="1">웹 서비스는 홀·주방·창고처럼 세 단으로 나뉩니다<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.16;0.18;0.97;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="480" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">주문은 웹 서버 → WAS → DB 순서로 들어갑니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.47;0.49;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="480" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">DB의 자료가 WAS에서 결과가 되어 되돌아옵니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.76;0.78;1" dur="16s" repeatCount="indefinite"/></text>
<text x="480" y="480" text-anchor="middle" font-size="26" fill="#7ee7c7" opacity="0">단을 나눠 두면 어디가 느린지 따로 볼 수 있습니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.80;0.95;0.97;1" dur="16s" repeatCount="indefinite"/></text>
</svg>