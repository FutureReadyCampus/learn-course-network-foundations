<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
  <defs>
    <clipPath id="typeClip">
      <rect x="56" y="228" width="0" height="44">
        <animate attributeName="width" values="0;0;215;215;0" keyTimes="0;0.02;0.18;0.95;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 제목 -->
  <text x="40" y="50" font-size="34" font-weight="700" fill="#e6e8ec">주소를 입력하면 일어나는 네 걸음</text>

  <!-- 네 걸음 칩 -->
  <g font-size="24" text-anchor="middle">
    <rect x="40" y="70" width="205" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <rect x="265" y="70" width="205" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <rect x="490" y="70" width="205" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <rect x="715" y="70" width="205" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="142" y="99" fill="#9aa3b2">① 이름 찾기</text>
    <text x="367" y="99" fill="#9aa3b2">② 연결</text>
    <text x="592" y="99" fill="#9aa3b2">③ 요청</text>
    <text x="817" y="99" fill="#9aa3b2">④ 응답</text>
    <g>
      <rect x="40" y="70" width="205" height="40" rx="20" fill="#7ee7c7" fill-opacity="0.15" stroke="#7ee7c7" stroke-width="3"/>
      <text x="142" y="99" fill="#7ee7c7" font-weight="700">① 이름 찾기</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.95;0.98;1" dur="16s" repeatCount="indefinite"/>
      <rect x="265" y="70" width="205" height="40" rx="20" fill="#7ee7c7" fill-opacity="0.15" stroke="#7ee7c7" stroke-width="3"/>
      <text x="367" y="99" fill="#7ee7c7" font-weight="700">② 연결</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.95;0.98;1" dur="16s" repeatCount="indefinite"/>
      <rect x="490" y="70" width="205" height="40" rx="20" fill="#7ee7c7" fill-opacity="0.15" stroke="#7ee7c7" stroke-width="3"/>
      <text x="592" y="99" fill="#7ee7c7" font-weight="700">③ 요청</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.70;0.95;0.98;1" dur="16s" repeatCount="indefinite"/>
      <rect x="715" y="70" width="205" height="40" rx="20" fill="#7ee7c7" fill-opacity="0.15" stroke="#7ee7c7" stroke-width="3"/>
      <text x="817" y="99" fill="#7ee7c7" font-weight="700">④ 응답</text>
    </g>
  </g>

  <!-- DNS 전화번호부 -->
  <rect x="400" y="124" width="260" height="58" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
  <rect x="416" y="136" width="28" height="34" rx="3" fill="#6ea8fe"/>
  <line x1="422" y1="136" x2="422" y2="170" stroke="#0f1115" stroke-width="2"/>
  <text x="456" y="162" font-size="24" fill="#e6e8ec">DNS 전화번호부</text>

  <!-- 브라우저 -->
  <rect x="30" y="215" width="390" height="230" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <rect x="45" y="228" width="360" height="44" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <text x="58" y="259" font-size="24" fill="#e6e8ec" clip-path="url(#typeClip)">www.example.com</text>

  <!-- 브라우저 화면: 빈 화면 -->
  <text x="225" y="372" font-size="24" fill="#9aa3b2" text-anchor="middle">브라우저 (빈 화면)
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.76;0.78;0.97;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <!-- 브라우저 화면: 그려진 문서 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.80;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
    <text x="55" y="318" font-size="26" font-weight="700" fill="#e6e8ec">Example Domain</text>
    <rect x="55" y="336" width="320" height="12" rx="6" fill="#3d4b60"/>
    <rect x="55" y="358" width="260" height="12" rx="6" fill="#3d4b60"/>
    <g>
      <animate attributeName="opacity" values="1;1;0.2;1;0.2;1;0.2;1;1" keyTimes="0;0.80;0.83;0.86;0.89;0.92;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="55" y="410" font-size="24" fill="#6ea8fe">다음 문서 링크 ▸</text>
      <line x1="55" y1="416" x2="230" y2="416" stroke="#6ea8fe" stroke-width="2"/>
    </g>
  </g>

  <!-- 서버 -->
  <rect x="680" y="215" width="250" height="230" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="805" y="256" font-size="28" font-weight="700" fill="#e6e8ec" text-anchor="middle">서버</text>
  <text x="805" y="290" font-size="24" fill="#9aa3b2" text-anchor="middle">192.0.2.10</text>
  <rect x="725" y="312" width="160" height="30" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="725" y="350" width="160" height="30" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="725" y="388" width="160" height="30" rx="5" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <circle cx="745" cy="327" r="5" fill="#7ee7c7"/>
  <circle cx="745" cy="365" r="5" fill="#7ee7c7"/>
  <circle cx="745" cy="403" r="5" fill="#7ee7c7"/>

  <!-- ② TCP 연결선 -->
  <line x1="422" y1="330" x2="422" y2="330" stroke="#7ee7c7" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="x2" values="422;422;678;678;422;422" keyTimes="0;0.40;0.48;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
  </line>
  <text x="550" y="314" font-size="24" fill="#7ee7c7" text-anchor="middle" font-weight="700" opacity="0">TCP 연결 ✓
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.49;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
  </text>

  <!-- ① 질문 말풍선 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="225 165;225 165;345 142;345 142" keyTimes="0;0.20;0.29;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.20;0.27;0.29;1" dur="16s" repeatCount="indefinite"/>
    <rect width="140" height="40" rx="20" fill="#ffb454"/>
    <text x="70" y="28" font-size="24" fill="#0f1115" text-anchor="middle" font-weight="700">IP 주소는?</text>
  </g>

  <!-- ① 답: 192.0.2.10 → 주소창 옆 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="466 186;466 186;272 232;272 232" keyTimes="0;0.30;0.37;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.30;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
    <rect width="128" height="36" rx="8" fill="#7ee7c7"/>
    <text x="64" y="27" font-size="24" fill="#0f1115" text-anchor="middle" font-weight="700">192.0.2.10</text>
  </g>

  <!-- ③ GET / 편지 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="428 344;428 344;562 344;562 344" keyTimes="0;0.59;0.66;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.59;0.66;0.68;1" dur="16s" repeatCount="indefinite"/>
    <rect width="112" height="42" rx="6" fill="#ffb454"/>
    <polyline points="0,0 56,20 112,0" fill="none" stroke="#0f1115" stroke-width="2" opacity="0.5"/>
    <text x="56" y="31" font-size="24" fill="#0f1115" text-anchor="middle" font-weight="700">GET /</text>
  </g>

  <!-- ④ HTML 문서 응답 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="572 394;572 394;428 394;428 394" keyTimes="0;0.69;0.76;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.76;0.78;1" dur="16s" repeatCount="indefinite"/>
    <path d="M0 0 H86 L104 14 V44 H0 Z" fill="#6ea8fe"/>
    <text x="50" y="32" font-size="24" fill="#0f1115" text-anchor="middle" font-weight="700">HTML</text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="462" width="960" height="78" fill="#171a21"/>
  <line x1="0" y1="462" x2="960" y2="462" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle">
    <text x="480" y="510" fill="#e6e8ec">① 이름 찾기: DNS에 물어 IP 주소를 알아낸다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.37;0.385;0.97;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#e6e8ec" opacity="0">② 연결: 그 주소의 서버와 TCP 선을 잇는다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.385;0.395;0.575;0.585;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#e6e8ec" opacity="0">③ 요청 'GET /'을 보내면 ④ HTML 문서가 응답으로 온다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.585;0.595;0.765;0.775;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#7ee7c7" font-weight="700" opacity="0">이름 찾기 → 연결 → 요청 → 응답, 그래서 문서가 도착한다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.775;0.785;0.95;0.97;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
