<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 핵심 문장 -->
  <text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">아래 층이 빠지면 위 층이 무너진다</text>
  <text x="480" y="92" text-anchor="middle" font-size="24" fill="#9aa3b2">위 층은 아래 층에 기대어 선다</text>

  <!-- 바닥 -->
  <line x1="260" y1="446" x2="600" y2="446" stroke="#3d4b60" stroke-width="4"/>

  <!-- 1층 -->
  <g opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.01;0.04;0.96;1" dur="12s" repeatCount="indefinite"/>
    <rect x="300" y="372" width="260" height="70" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="430" y="416" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">1층</text>
  </g>
  <!-- 2층 -->
  <g opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.06;0.09;0.96;1" dur="12s" repeatCount="indefinite"/>
    <rect x="300" y="294" width="260" height="70" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="430" y="338" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">2층</text>
  </g>
  <!-- 3층 빈 자리: 3층이 빠지면 점선 칸이 남는다 -->
  <rect x="300" y="216" width="260" height="70" rx="8" fill="none" stroke="#ffb454" stroke-width="3" stroke-dasharray="10 8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.80;0.83;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- 3층: 5.5초에 제자리에서 사라졌다가 8.3초에 돌아온다 -->
  <g opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1;0;0;1;1;0.3" keyTimes="0;0.11;0.14;0.55;0.58;0.80;0.84;0.96;1" dur="12s" repeatCount="indefinite"/>
    <rect x="300" y="216" width="260" height="70" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="430" y="260" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">3층</text>
  </g>
  <!-- 4층: 3층이 빠지면 기울며 내려앉고 흐려진다 -->
  <g opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.4;0.4;1;1;0.3" keyTimes="0;0.16;0.19;0.60;0.65;0.80;0.84;0.96;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,58;0,58;0,0;0,0" keyTimes="0;0.60;0.65;0.80;0.84;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 430 173;0 430 173;12 430 173;12 430 173;0 430 173;0 430 173" keyTimes="0;0.60;0.65;0.80;0.84;1" dur="12s" repeatCount="indefinite"/>
    <rect x="300" y="138" width="260" height="70" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3">
      <animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#ffb454;#ffb454;#6ea8fe;#6ea8fe" keyTimes="0;0.60;0.62;0.80;0.84;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="182" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">4층</text>
  </g>
  <!-- 무너짐 설명 (오른쪽) -->
  <g font-size="26" font-weight="700" fill="#ffb454" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.80;0.82;1" dur="12s" repeatCount="indefinite"/>
    <text x="635" y="260">← 3층이 빠짐</text>
    <text x="635" y="200" opacity="0">← 4층이 무너짐
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- '기댄다' 화살표 (위 → 아래) -->
  <g fill="none" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.50;0.53;1" dur="12s" repeatCount="indefinite"/>
      <line x1="600" y1="181" x2="600" y2="243" stroke-dasharray="62" stroke-dashoffset="62">
        <animate attributeName="stroke-dashoffset" values="62;62;0;0" keyTimes="0;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
      </line>
      <polygon points="590,236 610,236 600,252" fill="#7ee7c7" stroke="none" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.28;1" dur="12s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.31;0.50;0.53;1" dur="12s" repeatCount="indefinite"/>
      <line x1="600" y1="259" x2="600" y2="321" stroke-dasharray="62" stroke-dashoffset="62">
        <animate attributeName="stroke-dashoffset" values="62;62;0;0" keyTimes="0;0.30;0.36;1" dur="12s" repeatCount="indefinite"/>
      </line>
      <polygon points="590,314 610,314 600,330" fill="#7ee7c7" stroke="none" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.36;1" dur="12s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.39;0.50;0.53;1" dur="12s" repeatCount="indefinite"/>
      <line x1="600" y1="337" x2="600" y2="399" stroke-dasharray="62" stroke-dashoffset="62">
        <animate attributeName="stroke-dashoffset" values="62;62;0;0" keyTimes="0;0.38;0.44;1" dur="12s" repeatCount="indefinite"/>
      </line>
      <polygon points="590,392 610,392 600,408" fill="#7ee7c7" stroke="none" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.44;1" dur="12s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.50;0.53;1" dur="12s" repeatCount="indefinite"/>
    <text x="635" y="285" font-size="28" font-weight="700" fill="#7ee7c7">위 → 아래에 의존</text>
    <text x="635" y="322" font-size="24" fill="#9aa3b2">(아래에 기댄다)</text>
  </g>

  <!-- 마무리 문구 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.85;0.87;0.95;0.97;1" dur="12s" repeatCount="indefinite"/>
    <text x="780" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7">위는 아래에 기댄다</text>
    <text x="780" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">아래가 없으면</text>
    <text x="780" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">위는 못 선다</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="466" width="880" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="24" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="503" opacity="1">1층부터 4층까지 아래에서 위로 쌓아요
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.20;0.22;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0">위 층은 바로 아래 층에 기대요 (의존)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.24;0.50;0.52;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0" fill="#ffb454">3층을 빼면 기댈 곳이 없어 4층이 무너져요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.80;0.82;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0" fill="#7ee7c7" font-weight="700">위는 아래에 기대요. 아래가 없으면 위는 못 서요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.95;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.23;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.52;0.53;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.82;0.83;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.83;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
