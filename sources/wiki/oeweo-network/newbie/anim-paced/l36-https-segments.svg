<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">어디까지 잠겨서 가는가</text>
  <text x="480" y="90" text-anchor="middle" font-size="24" fill="#9aa3b2">HTTPS가 잠그는 건 장비까지 — 그 뒤는 평문일 수 있다</text>

  <!-- 브라우저 -->
  <rect x="30" y="120" width="200" height="160" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="130" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#6ea8fe">브라우저</text>
  <text x="130" y="204" text-anchor="middle" font-size="24" fill="#9aa3b2">비밀번호 입력</text>
  <rect x="60" y="222" width="140" height="36" rx="5" fill="#0f1115" stroke="#3d4b60"/>
  <text x="130" y="248" text-anchor="middle" font-size="24" fill="#e6e8ec">●●●●●●</text>

  <!-- SSL 장비 -->
  <rect x="380" y="120" width="200" height="160" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60;#3d4b60" keyTimes="0;0.47;0.49;0.56;0.58;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">SSL 장비</text>
  <text x="480" y="204" text-anchor="middle" font-size="24" fill="#9aa3b2">자물쇠를</text>
  <text x="480" y="238" text-anchor="middle" font-size="24" fill="#9aa3b2">여는 곳</text>

  <!-- WAS -->
  <rect x="730" y="120" width="200" height="160" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="830" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">WAS</text>
  <text x="830" y="204" text-anchor="middle" font-size="24" fill="#9aa3b2">처리 서버</text>

  <!-- 길: 두 구간 -->
  <line x1="130" y1="392" x2="480" y2="392" stroke="#3d4b60" stroke-width="10" stroke-linecap="round">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60" keyTimes="0;0.77;0.79;0.96;1" dur="14s" repeatCount="indefinite"/>
  </line>
  <line x1="480" y1="392" x2="830" y2="392" stroke="#3d4b60" stroke-width="10" stroke-linecap="round">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60" keyTimes="0;0.77;0.79;0.96;1" dur="14s" repeatCount="indefinite"/>
  </line>
  <g fill="#e6e8ec">
    <circle cx="130" cy="392" r="9"/><circle cx="480" cy="392" r="9"/><circle cx="830" cy="392" r="9"/>
  </g>
  <text x="305" y="436" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">첫 구간 HTTPS · 잠김
    <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.77;0.79;0.96;1" dur="14s" repeatCount="indefinite"/>
  </text>
  <text x="655" y="436" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">둘째 구간 HTTP · 평문
    <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2" keyTimes="0;0.77;0.79;0.96;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- ① 브라우저 위 평문 쪽지 -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="14s" repeatCount="indefinite"/>
    <rect x="50" y="316" width="160" height="48" rx="6" fill="#fff3df" stroke="#ffb454" stroke-width="3"/>
    <text x="130" y="349" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1115">pw1234</text>
  </g>

  <!-- ② 잠긴 봉투: 첫 구간 이동 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;350,0;350,0" keyTimes="0;0.25;0.47;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.51;0.54;1" dur="14s" repeatCount="indefinite"/>
    <rect x="50" y="316" width="160" height="48" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <rect x="64" y="336" width="20" height="16" rx="3" fill="#7ee7c7"/>
    <path d="M68 336 V330 A6 6 0 0 1 80 330 V336" fill="none" stroke="#7ee7c7" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-7;0,-7" keyTimes="0;0.48;0.5;1" dur="14s" repeatCount="indefinite"/>
    </path>
    <text x="146" y="349" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">x9#k2</text>
  </g>

  <!-- ③ 풀린 평문 쪽지: 둘째 구간 이동 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="350,0;350,0;700,0;700,0" keyTimes="0;0.55;0.75;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.54;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
    <rect x="50" y="316" width="160" height="48" rx="6" fill="#fff3df" stroke="#ffb454" stroke-width="3"/>
    <text x="130" y="349" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1115">pw1234</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="466" width="880" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="503">① 비밀번호 pw1234를 WAS까지 보냅니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.21;0.23;0.97;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0">② HTTPS 구간: 잠긴 봉투라 x9#k2로만 보입니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.49;0.51;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0">③ 장비가 풀면 HTTP 구간엔 pw1234가 그대로 흐릅니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.76;0.78;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0" fill="#7ee7c7" font-weight="700">잠긴 곳은 초록 구간뿐 — 구간을 구별하세요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
