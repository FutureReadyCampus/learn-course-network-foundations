<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 = 핵심 결론 (항상 보임) -->
  <text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">MAC 주소는 <tspan fill="#7ee7c7">NIC마다</tspan> 하나</text>

  <!-- 컴퓨터 한 대 -->
  <rect x="400" y="86" width="160" height="98" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="480" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">컴퓨터</text>
  <rect x="470" y="184" width="20" height="12" fill="#3d4b60"/>
  <rect x="445" y="196" width="70" height="8" rx="3" fill="#3d4b60"/>

  <!-- 컴퓨터에는 표찰이 없다 (5~8초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.54;0.77;0.79;1" values="0;0;1;1;0;0"/>
    <rect x="590" y="110" width="190" height="50" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="685" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">MAC 없음</text>
    <line x1="563" y1="135" x2="588" y2="135" stroke="#ffb454" stroke-width="3" stroke-dasharray="4 4"/>
  </g>

  <!-- NIC 1 (처음부터 있음) -->
  <g>
    <path d="M480,204 V222 H170 V240" fill="none" stroke="#6ea8fe" stroke-width="3"/>
    <rect x="70" y="240" width="200" height="50" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="170" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">NIC 1</text>
    <line x1="170" y1="290" x2="170" y2="306" stroke="#7ee7c7" stroke-width="2"/>
    <rect x="35" y="306" width="270" height="48" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2">
      <animate attributeName="stroke-width" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.54;0.77;0.79;1" values="2;2;5;5;2;2"/>
    </rect>
    <circle cx="52" cy="330" r="5" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
    <text x="180" y="339" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">88:36:6C:00:00:01</text>
  </g>

  <!-- NIC 2 (2~3초에 등장) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.22;0.26;0.95;0.98;1" values="0;0;1;1;0;0"/>
        <path d="M480,222 V240" fill="none" stroke="#6ea8fe" stroke-width="3"/>
    <g><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.22;0.27;1" values="0,24;0,24;0,0;0,0"/>
    <rect x="380" y="240" width="200" height="50" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="480" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">NIC 2</text>
    <line x1="480" y1="290" x2="480" y2="306" stroke="#7ee7c7" stroke-width="2"/>
    <rect x="345" y="306" width="270" height="48" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2">
      <animate attributeName="stroke-width" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.54;0.77;0.79;1" values="2;2;5;5;2;2"/>
    </rect>
    <circle cx="362" cy="330" r="5" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
    <text x="490" y="339" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">88:36:6C:00:00:02</text>
  </g>
  </g>

  <!-- NIC 3 (3.8~4.2초에 등장) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.38;0.42;0.95;0.98;1" values="0;0;1;1;0;0"/>
        <path d="M480,222 H790 V240" fill="none" stroke="#6ea8fe" stroke-width="3"/>
    <g><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.38;0.43;1" values="0,24;0,24;0,0;0,0"/>
    <rect x="690" y="240" width="200" height="50" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="790" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">NIC 3</text>
    <line x1="790" y1="290" x2="790" y2="306" stroke="#7ee7c7" stroke-width="2"/>
    <rect x="655" y="306" width="270" height="48" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2">
      <animate attributeName="stroke-width" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.54;0.77;0.79;1" values="2;2;5;5;2;2"/>
    </rect>
    <circle cx="672" cy="330" r="5" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
    <text x="800" y="339" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">88:36:6C:00:00:03</text>
  </g>
  </g>

  <!-- 개수 세기 (5~8초) -->
  <text x="480" y="410" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec" opacity="0">컴퓨터 1대 · <tspan fill="#6ea8fe">NIC 3개</tspan> · <tspan fill="#7ee7c7">MAC 3개</tspan>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.53;0.56;0.77;0.79;1" values="0;0;1;1;0;0"/>
  </text>

  <!-- 표찰 하나 확대: 여섯 칸 (8~10초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.78;0.80;0.95;0.98;1" values="0;0;1;1;0;0"/>
    <rect x="20" y="210" width="920" height="244" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <text x="480" y="262" text-anchor="middle" font-size="24" fill="#9aa3b2">NIC 1의 MAC 주소를 크게 보면</text>
    <g font-size="32" font-weight="700" text-anchor="middle">
      <rect x="145" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.800;0.810;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <rect x="259" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.815;0.825;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <rect x="373" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.830;0.840;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <rect x="487" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.845;0.855;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <rect x="601" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.860;0.870;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <rect x="715" y="280" width="100" height="70" rx="8" fill="#0f1115" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" dur="14s" repeatCount="indefinite" keyTimes="0;0.875;0.885;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></rect>
      <text x="195" y="326" fill="#3d4b60">88<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.800;0.810;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
      <text x="309" y="326" fill="#3d4b60">36<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.815;0.825;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
      <text x="423" y="326" fill="#3d4b60">6C<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.830;0.840;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
      <text x="537" y="326" fill="#3d4b60">00<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.845;0.855;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
      <text x="651" y="326" fill="#3d4b60">00<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.860;0.870;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
      <text x="765" y="326" fill="#3d4b60">01<animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.875;0.885;0.97;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/></text>
    </g>
    <g font-size="24" fill="#9aa3b2" text-anchor="middle">
      <text x="195" y="380">8비트</text><text x="309" y="380">8비트</text><text x="423" y="380">8비트</text>
      <text x="537" y="380">8비트</text><text x="651" y="380">8비트</text><text x="765" y="380">8비트</text>
    </g>
    <text x="480" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454" opacity="0">48비트 = 6바이트
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.885;0.905;1" values="0;0;1;1"/>
    </text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="466" width="960" height="74" fill="#171a21"/>
  <line x1="0" y1="466" x2="960" y2="466" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="512">컴퓨터에 NIC가 하나면 MAC 주소도 하나
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.23;0.25;0.97;1" values="1;1;0;0;1"/>
    </text>
    <text x="480" y="512" opacity="0">NIC를 더 달면 MAC 주소도 하나씩 늘어난다
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.50;0.52;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="512" opacity="0">번호표는 컴퓨터가 아니라 <tspan fill="#7ee7c7" font-weight="700">NIC</tspan>에 붙는다
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.53;0.77;0.79;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="512" opacity="0">MAC 주소 하나 = 16진수 두 자리 × 6칸 = 48비트
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.78;0.80;0.95;0.97;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
