<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="48" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">홉마다 줄어드는 TTL</text>
<text x="480" y="90" font-size="24" fill="#9aa3b2" text-anchor="middle">TTL = 패킷이 앞으로 건널 수 있는 <tspan fill="#7ee7c7" font-weight="700">남은 횟수</tspan></text>

<!-- wires -->
<g stroke="#3d4b60" stroke-width="4">
<line x1="150" y1="255" x2="235" y2="255"/>
<line x1="365" y1="255" x2="435" y2="255"/>
<line x1="565" y1="255" x2="635" y2="255"/>
<line x1="765" y1="255" x2="815" y2="255"/>
</g>

<!-- devices -->
<rect x="20" y="215" width="130" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="85" y="247" font-size="24" fill="#9aa3b2" text-anchor="middle">출발</text>
<text x="85" y="279" font-size="26" font-weight="700" fill="#e6e8ec" text-anchor="middle">PC</text>

<rect x="235" y="215" width="130" height="80" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3">
<animate attributeName="stroke" values="#3d4b60;#7ee7c7;#3d4b60;#ffb454;#3d4b60" keyTimes="0;0.28;0.34;0.62;0.7" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</rect>
<text x="300" y="247" font-size="24" fill="#9aa3b2" text-anchor="middle">라우터</text>
<text x="300" y="279" font-size="26" font-weight="700" fill="#e6e8ec" text-anchor="middle">R1</text>

<rect x="435" y="215" width="130" height="80" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3">
<animate attributeName="stroke" values="#3d4b60;#7ee7c7;#3d4b60" keyTimes="0;0.355;0.415" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</rect>
<text x="500" y="247" font-size="24" fill="#9aa3b2" text-anchor="middle">라우터</text>
<text x="500" y="279" font-size="26" font-weight="700" fill="#e6e8ec" text-anchor="middle">R2</text>

<rect x="635" y="215" width="130" height="80" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3">
<animate attributeName="stroke" values="#3d4b60;#7ee7c7;#3d4b60" keyTimes="0;0.43;0.49" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</rect>
<text x="700" y="247" font-size="24" fill="#9aa3b2" text-anchor="middle">라우터</text>
<text x="700" y="279" font-size="26" font-weight="700" fill="#e6e8ec" text-anchor="middle">R3</text>

<rect x="815" y="215" width="130" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="880" y="247" font-size="24" fill="#9aa3b2" text-anchor="middle">도착</text>
<text x="880" y="279" font-size="26" font-weight="700" fill="#e6e8ec" text-anchor="middle">서버</text>

<!-- hop labels: gray normally, orange "-1" while a packet crosses -->
<g font-size="24" text-anchor="middle">
<text x="300" y="328" fill="#9aa3b2">홉 1<animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.28;0.34;0.62;0.7" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="300" y="328" fill="#ffb454" font-weight="700" opacity="0">홉 1 · −1<animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.28;0.34;0.62;0.7" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="500" y="328" fill="#9aa3b2">홉 2<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.355;0.415" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="500" y="328" fill="#ffb454" font-weight="700" opacity="0">홉 2 · −1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.355;0.415" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="700" y="328" fill="#9aa3b2">홉 3<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.43;0.49" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="700" y="328" fill="#ffb454" font-weight="700" opacity="0">홉 3 · −1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.43;0.49" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
</g>

<!-- packet 1: TTL 128 -> 125, arrives -->
<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;795,0;795,0;0,0;0,0" keyTimes="0;0.2;0.5;0.965;0.97;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.94;0.96;0.97;1" dur="14s" repeatCount="indefinite"/>
<rect x="20" y="134" width="130" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<text x="32" y="169" font-size="24" fill="#9aa3b2">TTL</text>
<g font-size="28" font-weight="700" fill="#7ee7c7" text-anchor="end">
<text x="138" y="170">128<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.2825;0.97" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="138" y="170" opacity="0">127<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2825;0.3575" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="138" y="170" opacity="0">126<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3575;0.4325" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="138" y="170" opacity="0">125<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4325;0.97" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
</g>
</g>
<text x="945" y="365" font-size="26" font-weight="700" fill="#7ee7c7" text-anchor="end" opacity="0">TTL 125 도착<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.94;0.96;1" dur="14s" repeatCount="indefinite"/></text>

<!-- packet 2: TTL 1 -> 0 at R1, discarded -->
<g opacity="0">
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;215,0;215,0" keyTimes="0;0.53;0.62;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.64;0.71;1" dur="14s" repeatCount="indefinite"/>
<rect x="20" y="134" width="130" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3">
<animate attributeName="stroke" values="#7ee7c7;#ffb454" keyTimes="0;0.62" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</rect>
<text x="32" y="169" font-size="24" fill="#9aa3b2">TTL</text>
<text x="138" y="170" font-size="28" font-weight="700" fill="#7ee7c7" text-anchor="end">1<animate attributeName="opacity" values="1;0" keyTimes="0;0.62" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="138" y="170" font-size="28" font-weight="700" fill="#ffb454" text-anchor="end" opacity="0">0<animate attributeName="opacity" values="0;1" keyTimes="0;0.62" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
</g>
<!-- smoke -->
<g fill="#9aa3b2">
<circle cx="280" cy="160" r="10" opacity="0">
<animate attributeName="r" values="10;10;42;42" keyTimes="0;0.64;0.74;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.64;0.67;0.74;1" dur="14s" repeatCount="indefinite"/>
</circle>
<circle cx="320" cy="150" r="10" opacity="0">
<animate attributeName="r" values="10;10;36;36" keyTimes="0;0.65;0.75;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.65;0.68;0.75;1" dur="14s" repeatCount="indefinite"/>
</circle>
<circle cx="300" cy="135" r="8" opacity="0">
<animate attributeName="r" values="8;8;30;30" keyTimes="0;0.66;0.76;1" dur="14s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.66;0.69;0.76;1" dur="14s" repeatCount="indefinite"/>
</circle>
</g>
<!-- ghost of discarded packet -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.72;0.75;0.94;0.96;1" dur="14s" repeatCount="indefinite"/>
<rect x="235" y="134" width="130" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="7 6"/>
<text x="300" y="170" font-size="26" fill="#ffb454" text-anchor="middle">TTL 0</text>
</g>
<text x="300" y="365" font-size="26" font-weight="700" fill="#ffb454" text-anchor="middle" opacity="0">TTL 0 = 폐기<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.68;0.94;0.96;1" dur="14s" repeatCount="indefinite"/></text>

<!-- conclusion -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.94;0.96;1" dur="14s" repeatCount="indefinite"/>
<rect x="290" y="392" width="380" height="50" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
<text x="480" y="427" font-size="30" font-weight="700" fill="#7ee7c7" text-anchor="middle">홉 1번 = TTL 1 감소</text>
</g>

<!-- caption bar -->
<rect x="40" y="462" width="880" height="62" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="503">패킷에는 남은 횟수 ‘TTL 128’이 적혀 있어요<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.2;0.97;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="503" opacity="0">라우터를 하나 건널 때마다(홉) 1씩 줄어요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.48;0.5;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="503" opacity="0">TTL 1로 떠난 패킷은 R1에서 0이 되어 버려져요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="503" opacity="0">0이 되면 버려지니, 패킷이 영원히 떠돌지 않아요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.95;0.97;1" dur="14s" repeatCount="indefinite"/></text>
</g>
</svg>
