<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">루프백: <tspan fill="#7ee7c7">127.0.0.1</tspan> 패킷은 안에서 유턴</text>
<!-- 컴퓨터(건물) -->
<rect x="40" y="72" width="660" height="368" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="60" y="102" font-size="24" fill="#9aa3b2">내 컴퓨터 (한 건물)</text>
<rect x="90" y="112" width="200" height="70" rx="12" fill="#0f1115" stroke="#6ea8fe" stroke-width="3"/>
<text x="190" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">클라이언트</text>
<rect x="450" y="112" width="200" height="70" rx="12" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/>
<text x="550" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">서버</text>
<!-- 서버 도착 강조 -->
<rect x="444" y="106" width="212" height="82" rx="15" fill="#7ee7c7" fill-opacity="0.15" stroke="#7ee7c7" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.95;1" dur="10s" repeatCount="indefinite"/></rect>
<!-- NIC·케이블·바깥 (도착 후 흐려짐) -->
<g><animate attributeName="opacity" values="1;1;0.3;0.3;1" keyTimes="0;0.76;0.8;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="250" y="372" width="240" height="60" rx="10" fill="#0f1115" stroke="#ffb454" stroke-width="3"/>
<text x="370" y="411" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">NIC · 현관</text>
<line x1="490" y1="402" x2="780" y2="402" stroke="#9aa3b2" stroke-width="6"/>
<rect x="780" y="372" width="140" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="850" y="411" text-anchor="middle" font-size="24" fill="#9aa3b2">인터넷</text>
<text x="590" y="390" text-anchor="middle" font-size="24" fill="#9aa3b2">케이블</text>
</g>
<!-- 밖으로 나가지 않음 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.77;0.8;0.95;1" dur="10s" repeatCount="indefinite"/>
<path d="M724 386 L756 418 M756 386 L724 418" stroke="#ffb454" stroke-width="6" stroke-linecap="round"/>
<text x="830" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">밖으로 나가지 않음</text>
</g>
<!-- 유턴 길: 희미한 안내선 + 그려지는 궤적 -->
<path d="M190 230 L190 300 Q190 325 215 325 L525 325 Q550 325 550 300 L550 230" fill="none" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="8 8" opacity="0.3"/>
<path d="M190 230 L190 300 Q190 325 215 325 L525 325 Q550 325 550 300 L550 230" fill="none" stroke="#7ee7c7" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;87;79.6;20.9;13.5;0;0;100" keyTimes="0;0.24;0.46;0.5;0.64;0.68;0.76;0.95;1" dur="10s" repeatCount="indefinite"/></path>
<!-- 패킷 -->
<g transform="translate(190 230)" opacity="0">
<animateTransform attributeName="transform" type="translate" values="190 230;190 230;190 300;215 325;525 325;550 300;550 230;550 230" keyTimes="0;0.24;0.46;0.5;0.64;0.68;0.76;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.94;0.97;1" dur="10s" repeatCount="indefinite"/>
<rect x="-80" y="-23" width="160" height="46" rx="8" fill="#7ee7c7"/>
<text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">127.0.0.1</text>
</g>
<!-- 자막 바 -->
<rect x="40" y="456" width="880" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="497">컴퓨터 한 대 안에 클라이언트와 서버가 함께 있어요<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="497" opacity="0">클라이언트가 목적지 <tspan fill="#7ee7c7">127.0.0.1</tspan> 패킷을 내려보내요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.46;0.49;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="497" opacity="0"><tspan fill="#ffb454">NIC(현관)</tspan>에 닿기 전, 안에서 U턴해 서버로 가요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.5;0.74;0.77;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="497" opacity="0" font-weight="700"><tspan fill="#7ee7c7">127.0.0.1</tspan> 패킷은 컴퓨터 밖으로 나가지 않아요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.95;0.98;1" dur="10s" repeatCount="indefinite"/></text>
</g>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.23;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.48;0.49;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.76;0.77;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.77;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
</svg>
