<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 (항상 보임) -->
  <text x="480" y="54" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">16진수 숫자 줄은 헤더가 순서대로 놓인 것</text>

  <!-- 0~2초: 프레임 전체 이름표 -->
  <text x="480" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">▼ 이 숫자 줄 전체가 프레임 하나
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.22;0.96;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- 16진수 패널 (회색 바이트) -->
  <rect x="40" y="142" width="876" height="206" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g fill="#0f1115" stroke="#3d4b60" stroke-width="1.5">
    <rect x="64" y="156" width="48" height="46" rx="6"/><rect x="116" y="156" width="48" height="46" rx="6"/>
    <rect x="168" y="156" width="48" height="46" rx="6"/><rect x="220" y="156" width="48" height="46" rx="6"/>
    <rect x="272" y="156" width="48" height="46" rx="6"/><rect x="324" y="156" width="48" height="46" rx="6"/>
    <rect x="376" y="156" width="48" height="46" rx="6"/><rect x="428" y="156" width="48" height="46" rx="6"/>
    <rect x="480" y="156" width="48" height="46" rx="6"/><rect x="532" y="156" width="48" height="46" rx="6"/>
    <rect x="584" y="156" width="48" height="46" rx="6"/><rect x="636" y="156" width="48" height="46" rx="6"/>
    <rect x="688" y="156" width="48" height="46" rx="6"/><rect x="740" y="156" width="48" height="46" rx="6"/>
    <rect x="792" y="156" width="48" height="46" rx="6"/><rect x="844" y="156" width="48" height="46" rx="6"/>
    <rect x="64" y="288" width="48" height="46" rx="6"/><rect x="116" y="288" width="48" height="46" rx="6"/>
    <rect x="168" y="288" width="48" height="46" rx="6"/><rect x="220" y="288" width="48" height="46" rx="6"/>
    <rect x="272" y="288" width="48" height="46" rx="6"/><rect x="324" y="288" width="48" height="46" rx="6"/>
    <rect x="376" y="288" width="48" height="46" rx="6"/><rect x="428" y="288" width="48" height="46" rx="6"/>
    <rect x="480" y="288" width="48" height="46" rx="6"/><rect x="532" y="288" width="48" height="46" rx="6"/>
    <rect x="584" y="288" width="48" height="46" rx="6"/><rect x="636" y="288" width="48" height="46" rx="6"/>
    <rect x="688" y="288" width="48" height="46" rx="6"/><rect x="740" y="288" width="48" height="46" rx="6"/>
  </g>

  <!-- 2~5초: 색칠 + 이름표 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="62" y="154" width="312" height="50" rx="8" fill="#7ee7c7" fill-opacity="0.22" stroke="#7ee7c7" stroke-width="3"/>
    <text x="218" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">목적지 MAC</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.35;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="374" y="154" width="312" height="50" rx="8" fill="#ffb454" fill-opacity="0.22" stroke="#ffb454" stroke-width="3"/>
    <text x="530" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">출발지 MAC</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.44;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="686" y="154" width="104" height="50" rx="8" fill="#b98cff" fill-opacity="0.25" stroke="#b98cff" stroke-width="3"/>
    <text x="760" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#b98cff">Type 0800 = 뒤는 IP</text>
  </g>

  <!-- 5~6.5초: 화살표 → 45, 말풍선 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="790" y="154" width="52" height="50" rx="8" fill="none" stroke="#e6e8ec" stroke-width="3"/>
    <path d="M738 206 Q777 246 812 210" fill="none" stroke="#b98cff" stroke-width="3"/>
    <path d="M806 214 L816 204 L818 218 Z" fill="#b98cff"/>
    <rect x="636" y="236" width="248" height="44" rx="10" fill="#0f1115" stroke="#b98cff" stroke-width="2"/>
    <text x="760" y="266" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">Version 4 / IHL 5</text>
  </g>

  <!-- 6.5~8초: c0 a8 00 0a 파랑 + 192.168.0.10 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <rect x="582" y="286" width="208" height="50" rx="8" fill="#6ea8fe" fill-opacity="0.25" stroke="#6ea8fe" stroke-width="3"/>
    <text x="686" y="384" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">출발지 IP = 192.168.0.10</text>
  </g>

  <!-- 바이트 글자 -->
  <g font-family="Menlo,Consolas,monospace" font-size="24" fill="#c9ced6" text-anchor="middle">
    <text x="88" y="188">aa</text><text x="140" y="188">bb</text><text x="192" y="188">cc</text><text x="244" y="188">dd</text>
    <text x="296" y="188">ee</text><text x="348" y="188">ff</text><text x="400" y="188">11</text><text x="452" y="188">22</text>
    <text x="504" y="188">33</text><text x="556" y="188">44</text><text x="608" y="188">55</text><text x="660" y="188">66</text>
    <text x="712" y="188">08</text><text x="764" y="188">00</text><text x="816" y="188">45</text><text x="868" y="188">00</text>
    <text x="88" y="320">00</text><text x="140" y="320">3c</text><text x="192" y="320">1c</text><text x="244" y="320">46</text>
    <text x="296" y="320">40</text><text x="348" y="320">00</text><text x="400" y="320">40</text><text x="452" y="320">06</text>
    <text x="504" y="320">b1</text><text x="556" y="320">e6</text><text x="608" y="320">c0</text><text x="660" y="320">a8</text>
    <text x="712" y="320">00</text><text x="764" y="320">0a</text><text x="840" y="320" fill="#9aa3b2">…</text>
  </g>

  <!-- 8~10초: 와이어샤크 풀이 줄 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.79;0.95;0.99;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 30;0 30;0 0;0 0;0 30" keyTimes="0;0.74;0.79;0.95;1" dur="10s" repeatCount="indefinite"/>
    <rect x="40" y="398" width="876" height="50" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
    <rect x="52" y="406" width="160" height="34" rx="8" fill="#7ee7c7"/>
    <text x="132" y="431" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">와이어샤크</text>
    <text x="228" y="432" font-size="24" fill="#e6e8ec">Ethernet II › IPv4 (Version 4) › Src 192.168.0.10</text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="462" width="960" height="78" fill="#171a21"/>
  <line x1="0" y1="462" x2="960" y2="462" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" font-weight="700" text-anchor="middle">
    <text x="480" y="510" fill="#e6e8ec">패킷은 이런 16진수 숫자 줄이에요
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.23;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#e6e8ec" opacity="0">맨 앞부터 정해진 순서로 칸을 나눠 읽어요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.5;0.53;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#e6e8ec" opacity="0">Type 0800을 보고, 뒤를 IP 헤더로 읽어요
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.55;0.76;0.78;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="510" fill="#7ee7c7" opacity="0">사람이 직접 풀지 않아도 도구가 풀어 준다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
