<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
  <text x="480" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec"><tspan fill="#7ee7c7">ACK 3</tspan> = 1·2번 받았으니 3번 주세요</text>
  <!-- road -->
  <rect x="230" y="140" width="500" height="260" fill="#13161c"/>
  <line x1="230" y1="340" x2="730" y2="340" stroke="#3d4b60" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="480" y="128" text-anchor="middle" font-size="24" fill="#9aa3b2">데이터 상자 →</text>
  <text x="480" y="432" text-anchor="middle" font-size="24" fill="#9aa3b2">← 회신(ACK)</text>
  <!-- panels -->
  <rect x="40" y="90" width="190" height="310" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="135" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">보내는 쪽</text>
  <rect x="730" y="90" width="190" height="310" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="825" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">받는 쪽</text>
  <!-- receiver slots -->
  <rect x="785" y="150" width="80" height="50" rx="6" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="785" y="215" width="80" height="50" rx="6" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="785" y="280" width="80" height="50" rx="6" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="6 5">
    <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.48;0.5;0.95;0.97;1" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60;#3d4b60"/>
  </rect>
  <text x="825" y="315" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454" opacity="0.4">?<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.48;0.5;0.95;0.97;1" values="0.4;0.4;1;1;0.4;0.4"/></text>
  <text x="893" y="185" text-anchor="middle" font-size="28" font-weight="700" fill="#7ee7c7" opacity="0">✓<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.35;0.37;0.95;0.97;1" values="0;0;1;1;0;0"/></text>
  <text x="893" y="250" text-anchor="middle" font-size="28" font-weight="700" fill="#7ee7c7" opacity="0">✓<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.45;0.47;0.95;0.97;1" values="0;0;1;1;0;0"/></text>
  <!-- box 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.35;0.97;0.971;1" values="0 0;0 0;690 0;690 0;0 0;0 0"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.95;0.97;0.98;1" values="1;1;0;0;1"/>
    <rect x="95" y="150" width="80" height="50" rx="6" fill="#ffb454"/>
    <text x="135" y="184" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">1번</text>
  </g>
  <!-- box 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.12;0.45;0.97;0.971;1" values="0 0;0 0;690 0;690 0;0 0;0 0"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.95;0.97;0.98;1" values="1;1;0;0;1"/>
    <rect x="95" y="215" width="80" height="50" rx="6" fill="#ffb454"/>
    <text x="135" y="249" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">2번</text>
  </g>
  <!-- box 3 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.82;0.94;0.97;0.971;1" values="0 0;0 0;690 0;690 0;0 0;0 0"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.95;0.97;0.98;1" values="1;1;0;0;1"/>
    <rect x="95" y="280" width="80" height="50" rx="6" fill="#ffb454" stroke="#ffb454" stroke-width="4">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.77;0.79;0.95;0.97;1" values="#ffb454;#ffb454;#7ee7c7;#7ee7c7;#ffb454;#ffb454"/>
    </rect>
    <text x="135" y="314" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">3번</text>
  </g>
  <!-- ACK bubble -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.53;0.93;0.96;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.53;0.77;1" values="0 0;0 0;-690 0;-690 0"/>
    <rect x="757" y="345" width="136" height="46" rx="23" fill="#7ee7c7"/>
    <path d="M800,345 L812,333 L824,345 Z" fill="#7ee7c7"/>
    <text x="825" y="377" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1115">ACK 3</text>
  </g>
  <!-- caption bar -->
  <rect x="40" y="462" width="880" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec">보내는 쪽이 1번, 2번 상자를 보내요<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.97;1" values="1;1;0;0;1"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">받는 쪽 칸에 1번, 2번이 도착했어요<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.48;0.5;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">받는 쪽이 <tspan fill="#7ee7c7" font-weight="700">ACK 3</tspan> 회신을 돌려보내요<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.48;0.5;0.76;0.78;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">앞은 받았으니 <tspan fill="#ffb454" font-weight="700">3번 주세요</tspan> → 3번 출발<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.78;0.95;0.97;1" values="0;0;1;1;0;0"/></text>
</svg>
