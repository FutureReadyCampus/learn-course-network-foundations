<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="46" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">바깥부터 풀기 · 프레임에서 데이터까지</text>
<text x="480" y="88" font-size="24" fill="#9aa3b2" text-anchor="middle">받는 쪽은 <tspan fill="#7ee7c7" font-weight="700">가장 바깥 헤더부터</tspan> 한 겹씩 떼어 데이터에 닿는다</text>

<!-- layer gauge: L2 bottom, L4 top -->
<text x="75" y="136" font-size="24" fill="#9aa3b2" text-anchor="middle">계층</text>
<g font-size="24" font-weight="700" text-anchor="middle">
<rect x="30" y="150" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="150" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.58;0.62;0.8;0.83;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="75" y="179" fill="#9aa3b2">L4
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.58;0.62;0.8;0.83;0.95;1" dur="10s" repeatCount="indefinite"/>
</text>
<rect x="30" y="200" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="200" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.27;0.31;0.54;0.58;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="75" y="229" fill="#9aa3b2">L3
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.27;0.31;0.54;0.58;0.95;1" dur="10s" repeatCount="indefinite"/>
</text>
<rect x="30" y="250" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="250" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.06;0.1;0.27;0.31;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="75" y="279" fill="#9aa3b2">L2
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.06;0.1;0.27;0.31;0.95;1" dur="10s" repeatCount="indefinite"/>
</text>
</g>

<!-- name of the current outermost box -->
<g font-size="24" font-weight="700" text-anchor="middle">
<text x="440" y="126" fill="#e6e8ec">프레임 (가장 큰 상자)
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="499" y="126" fill="#e6e8ec" opacity="0">IP 패킷
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.3;0.5;0.53;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="589" y="126" fill="#e6e8ec" opacity="0">TCP 세그먼트
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.66;0.69;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="643" y="126" fill="#7ee7c7" opacity="0">데이터
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.75;0.8;0.83;1" dur="10s" repeatCount="indefinite"/>
</text>
</g>

<!-- server -->
<rect x="775" y="140" width="170" height="250" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="860" y="178" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="middle">서버</text>
<text x="860" y="214" font-size="24" fill="#6ea8fe" text-anchor="middle">203.0.113.5</text>
<rect x="783" y="191" width="154" height="32" rx="6" fill="none" stroke="#ffb454" stroke-width="3" opacity="0">
<animate attributeName="opacity" values="0;0;1;0.2;1;0.2;1;0;0" keyTimes="0;0.33;0.35;0.37;0.39;0.41;0.43;0.47;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="860" y="256" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">✓ 내 주소
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.95;1" dur="10s" repeatCount="indefinite"/>
</text>
<rect x="785" y="296" width="150" height="86" rx="10" fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6"/>

<!-- nested box (arrives from the left) -->
<g>
<animateTransform attributeName="transform" type="translate" values="-40 0;0 0;0 0;-40 0" keyTimes="0;0.08;0.95;1" dur="10s" repeatCount="indefinite"/>

<!-- outlines -->
<rect x="140" y="140" width="600" height="150" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3">
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.29;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="266" y="150" width="466" height="130" rx="10" fill="#141922" stroke="#6ea8fe" stroke-width="2">
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.56;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="454" y="160" width="270" height="110" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2">
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.66;0.72;0.95;1" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- frame header -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 162;0 162;0 0" keyTimes="0;0.22;0.29;0.95;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0.6;0.6;0.2;0.2;1" keyTimes="0;0.22;0.29;0.8;0.85;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="148" y="148" width="110" height="134" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="203" y="207" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">프레임</text>
<text x="203" y="239" font-size="24" fill="#e6e8ec" text-anchor="middle">헤더</text>
</g>

<!-- IP header -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 160;0 160;0 0" keyTimes="0;0.5;0.56;0.95;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0.6;0.6;0.2;0.2;1" keyTimes="0;0.5;0.56;0.8;0.85;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="274" y="158" width="172" height="114" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="360" y="188" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">IP 헤더</text>
<text x="360" y="220" font-size="24" fill="#9aa3b2" text-anchor="middle">받는 곳</text>
<text x="360" y="252" font-size="24" fill="#6ea8fe" text-anchor="middle">203.0.113.5</text>
<rect x="283" y="229" width="154" height="32" rx="6" fill="none" stroke="#ffb454" stroke-width="3" opacity="0">
<animate attributeName="opacity" values="0;0;1;0.2;1;0.2;1;0;0" keyTimes="0;0.33;0.35;0.37;0.39;0.41;0.43;0.47;1" dur="10s" repeatCount="indefinite"/>
</rect>
</g>

<!-- TCP header -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 150;0 150;0 0" keyTimes="0;0.66;0.72;0.95;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0.6;0.6;0.2;0.2;1" keyTimes="0;0.66;0.72;0.8;0.85;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="462" y="168" width="100" height="94" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="512" y="207" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">TCP</text>
<text x="512" y="239" font-size="24" fill="#e6e8ec" text-anchor="middle">헤더</text>
</g>

<!-- data -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;217 124;217 124;0 0" keyTimes="0;0.8;0.88;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="570" y="176" width="146" height="78" rx="10" fill="#14302a" stroke="#7ee7c7" stroke-width="3"/>
<text x="643" y="226" font-size="30" font-weight="700" fill="#7ee7c7" text-anchor="middle">안녕</text>
</g>
</g>

<!-- conclusion -->
<text x="440" y="226" font-size="34" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">바깥부터 한 겹씩 푼다
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.88;0.95;1" dur="10s" repeatCount="indefinite"/>
</text>

<!-- caption bar -->
<rect x="0" y="462" width="960" height="78" fill="#171a21"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="511">서버에 겹겹이 싼 프레임이 도착했어요
<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.21;0.23;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">L2가 프레임 헤더를 떼자, L3가 받는 곳을 확인해요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.5;0.52;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">IP 헤더, 이어서 TCP 헤더도 차례로 떼어요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="10s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">남은 '안녕'만 서버 안으로 들어가요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
</text>
</g>
</svg>
