<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#0f1115"/>
<defs>
<clipPath id="tubeClip"><rect x="150" y="190" width="0" height="60"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.33;1" values="0;0;200;200"/></rect></clipPath>
</defs>
<g font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">연결이 있는 TCP, 연결이 없는 UDP</text>

<!-- panels -->
<rect x="30" y="80" width="440" height="270" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="490" y="80" width="440" height="270" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="250" y="122" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7">TCP</text>
<text x="710" y="122" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">UDP</text>

<!-- computers -->
<g fill="#0f1115" stroke="#6ea8fe" stroke-width="3">
<rect x="60" y="190" width="90" height="60" rx="6"/><rect x="350" y="190" width="90" height="60" rx="6"/>
<rect x="520" y="190" width="90" height="60" rx="6"/><rect x="810" y="190" width="90" height="60" rx="6"/>
</g>
<g fill="#3d4b60">
<rect x="95" y="250" width="20" height="12"/><rect x="78" y="262" width="54" height="6" rx="3"/>
<rect x="385" y="250" width="20" height="12"/><rect x="368" y="262" width="54" height="6" rx="3"/>
<rect x="555" y="250" width="20" height="12"/><rect x="538" y="262" width="54" height="6" rx="3"/>
<rect x="845" y="250" width="20" height="12"/><rect x="828" y="262" width="54" height="6" rx="3"/>
</g>

<!-- TCP: dashed logical tube (not a wire) -->
<g clip-path="url(#tubeClip)" stroke="#7ee7c7" stroke-width="3" stroke-dasharray="10 8">
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.95;1" values="1;1;0"/>
<line x1="150" y1="200" x2="350" y2="200"/><line x1="150" y1="240" x2="350" y2="240"/>
</g>
<text x="250" y="186" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7" opacity="0">연결(약속)<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.3;0.95;1" values="0;0;1;1;0"/></text>

<!-- TCP: both sides remember -->
<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.33;0.38;0.95;1" values="0;0;1;1;0"/>
<rect x="50" y="140" width="110" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
<text x="105" y="166" text-anchor="middle" font-size="24" fill="#7ee7c7">기억 중</text>
<rect x="340" y="140" width="110" height="36" rx="18" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
<text x="395" y="166" text-anchor="middle" font-size="24" fill="#7ee7c7">기억 중</text>
</g>

<!-- TCP: box goes through tube -->
<g opacity="0">
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.63;0.65;1" values="0;0;1;1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.64;1" values="0 0;0 0;148 0;148 0"/>
<rect x="158" y="205" width="36" height="30" rx="3" fill="#ffb454"/>
<line x1="176" y1="205" x2="176" y2="235" stroke="#0f1115" stroke-width="3"/>
</g>
<!-- TCP: ack comes back -->
<g opacity="0">
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.65;0.67;0.95;1" values="0;0;1;1;0"/>
<animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.66;0.79;1" values="0 0;0 0;-88 0;-88 0"/>
<rect x="244" y="203" width="100" height="34" rx="17" fill="#7ee7c7"/>
<text x="294" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">받았음</text>
</g>

<!-- UDP: postcard flies one way, no tube -->
<g opacity="0">
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.68;0.71;1" values="0;0;1;1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.59;0.68;1" values="0 0;0 0;69 -40;138 0;138 0"/>
<rect x="618" y="205" width="46" height="30" rx="2" fill="#e6e8ec"/>
<rect x="650" y="209" width="10" height="10" fill="#6ea8fe"/>
<line x1="623" y1="222" x2="644" y2="222" stroke="#9aa3b2" stroke-width="2"/>
<line x1="623" y1="229" x2="644" y2="229" stroke="#9aa3b2" stroke-width="2"/>
</g>
<text x="710" y="312" text-anchor="middle" font-size="24" fill="#9aa3b2" opacity="0">돌아오는 신호 없음<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.71;0.75;0.95;1" values="0;0;1;1;0"/></text>

<!-- closing labels -->
<text x="250" y="402" text-anchor="middle" font-size="28" font-weight="700" fill="#7ee7c7" opacity="0">연결을 기억함<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;0.99;1" values="0;0;1;1;0;0"/></text>
<text x="710" y="402" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454" opacity="0">연결 없음<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;0.99;1" values="0;0;1;1;0;0"/></text>

<!-- subtitle bar -->
<rect x="0" y="462" width="960" height="78" fill="#171a21"/><line x1="0" y1="462" x2="960" y2="462" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="510" opacity="1">TCP 연결은 전선이 아니라 양쪽이 기억하는 약속입니다<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.19;0.21;0.95;0.98;1" values="1;1;0;0;1;1"/></text>
<text x="480" y="510" opacity="0">TCP는 먼저 연결을 맺고, 양쪽이 그 사실을 기억합니다<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.48;0.5;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="510" opacity="0">TCP는 '받았음'이 돌아오고, UDP는 보내면 끝입니다<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.49;0.51;0.75;0.77;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="510" opacity="0">TCP는 연결을 기억하고, UDP에는 연결이 없습니다<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.78;0.94;0.96;1" values="0;0;1;1;0;0"/></text>
</g>
</g>
</svg>
