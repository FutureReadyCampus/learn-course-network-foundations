<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">PC 3번에서 PC 5번까지</text>
<text x="480" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7" opacity="0.6">같은 스위치면 거기서 끝, 다르면 위로 올라갔다 내려와요
  <animate attributeName="opacity" values="0.6;0.6;1;1;0.6" keyTimes="0;0.8;0.82;0.96;1" dur="10s" repeatCount="indefinite"/>
</text>

<!-- cables -->
<g stroke="#3d4b60" stroke-width="4" fill="none">
  <line x1="480" y1="136" x2="250" y2="268"/>
  <line x1="480" y1="136" x2="710" y2="268"/>
  <line x1="250" y1="268" x2="160" y2="350"/>
  <line x1="250" y1="268" x2="250" y2="350"/>
  <line x1="250" y1="268" x2="340" y2="350"/>
  <line x1="710" y1="268" x2="660" y2="350"/>
  <line x1="710" y1="268" x2="760" y2="350"/>
</g>

<!-- request route highlight (yellow), response overlay (blue) -->
<path d="M340 350 L250 268 L480 136 L710 268 L760 350" fill="none" stroke="#ffb454" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
  <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.2;0.5;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0.3;0.3;0" keyTimes="0;0.8;0.84;0.95;1" dur="10s" repeatCount="indefinite"/>
</path>
<path d="M340 350 L250 268 L480 136 L710 268 L760 350" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="-1">
  <animate attributeName="stroke-dashoffset" values="-1;-1;0;0" keyTimes="0;0.5;0.8;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0.3;0.3;0" keyTimes="0;0.8;0.84;0.95;1" dur="10s" repeatCount="indefinite"/>
</path>

<!-- switches -->
<rect x="350" y="108" width="260" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">배포 스위치</text>
<rect x="140" y="240" width="220" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2">
  <animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.79;0.81;0.95;0.98;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="250" y="277" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">액세스 스위치 A</text>
<rect x="600" y="240" width="220" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="710" y="277" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">액세스 스위치 B</text>

<!-- PCs -->
<g font-size="24" font-weight="700" text-anchor="middle">
  <rect x="122" y="344" width="76" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="160" y="386" fill="#9aa3b2">PC 1</text>
  <rect x="212" y="344" width="76" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="250" y="386" fill="#9aa3b2">PC 2</text>
  <rect x="302" y="344" width="76" height="56" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
  <text x="340" y="386" fill="#e6e8ec">PC 3</text>
  <rect x="622" y="344" width="76" height="56" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="660" y="386" fill="#9aa3b2">PC 4</text>
  <rect x="722" y="344" width="76" height="56" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
  <text x="760" y="386" fill="#e6e8ec">PC 5</text>
</g>

<!-- moving dots: request, response, local -->
<circle r="11" fill="#ffb454" stroke="#0f1115" stroke-width="3" opacity="0">
  <animateTransform attributeName="transform" type="translate" values="340 350;340 350;250 268;480 136;710 268;760 350;760 350" keyTimes="0;0.2;0.252;0.354;0.456;0.5;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.5;0.51;1" dur="10s" repeatCount="indefinite"/>
</circle>
<circle r="11" fill="#6ea8fe" stroke="#0f1115" stroke-width="3" opacity="0">
  <animateTransform attributeName="transform" type="translate" values="760 350;760 350;710 268;480 136;250 268;340 350;340 350" keyTimes="0;0.5;0.544;0.646;0.748;0.8;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.8;0.81;1" dur="10s" repeatCount="indefinite"/>
</circle>
<circle r="9" fill="#7ee7c7" stroke="#0f1115" stroke-width="3" opacity="0">
  <animateTransform attributeName="transform" type="translate" values="160 350;160 350;250 268;250 350;250 268;160 350;160 350" keyTimes="0;0.8;0.843;0.875;0.907;0.95;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.95;0.96;1" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- caption bar -->
<rect x="40" y="432" width="880" height="84" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" text-anchor="middle" fill="#e6e8ec">
  <text x="480" y="483">PC 3번은 스위치 A에, PC 5번은 스위치 B에 꽂혀 있어요
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.21;0.97;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="483" opacity="0"><tspan fill="#ffb454" font-weight="700">요청</tspan>: PC 3 → 스위치 A → 배포 스위치 → 스위치 B → PC 5
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.49;0.51;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="483" opacity="0"><tspan fill="#6ea8fe" font-weight="700">응답</tspan>도 같은 길을 거꾸로 따라 PC 3번에 돌아와요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.79;0.81;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="483" opacity="0">PC 1 ↔ PC 2는 <tspan fill="#7ee7c7" font-weight="700">스위치 A 안에서</tspan> 바로 끝나요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
