<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 + 고정 결론 -->
  <text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">로그인 한 번이 지나는 길</text>
  <text x="480" y="90" text-anchor="middle" font-size="24" fill="#9aa3b2">웹 서버가 받고, WAS가 처리하고, DB가 자료를 대면 문서 완성</text>

  <!-- 길 -->
  <line x1="110" y1="378" x2="850" y2="378" stroke="#3d4b60" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 브라우저 -->
  <rect x="20" y="120" width="180" height="210" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="110" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">브라우저</text>
  <rect x="32" y="172" width="156" height="144" rx="6" fill="#0f1115" stroke="#3d4b60"/>
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.92;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
    <text x="110" y="214" text-anchor="middle" font-size="24" fill="#9aa3b2">아이디</text>
    <rect x="46" y="230" width="128" height="40" rx="5" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="110" y="259" text-anchor="middle" font-size="24" fill="#e6e8ec">tester</text>
  </g>
  <g opacity="0" font-size="26" font-weight="700" fill="#7ee7c7" text-anchor="middle">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.92;0.93;0.96;0.99;1" dur="10s" repeatCount="indefinite"/>
    <text x="110" y="232">tester님</text>
    <text x="110" y="272">안녕하세요</text>
  </g>

  <!-- 웹 서버 -->
  <rect x="230" y="120" width="170" height="210" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="315" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe">웹 서버</text>
  <text x="315" y="196" text-anchor="middle" font-size="24" fill="#9aa3b2">받아서 전달</text>
  <g fill="#0f1115" stroke="#3d4b60">
    <rect x="255" y="220" width="120" height="40" rx="5"/>
    <rect x="255" y="270" width="120" height="40" rx="5"/>
  </g>
  <circle cx="355" cy="240" r="6" fill="#7ee7c7"/>
  <circle cx="355" cy="290" r="6" fill="#7ee7c7"/>

  <!-- WAS -->
  <rect x="430" y="120" width="300" height="210" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3">
    <animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.38;0.4;0.8;0.82;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">WAS(처리 서버)</text>
  <text x="580" y="196" text-anchor="middle" font-size="24" fill="#9aa3b2">문서를 만든다</text>
  <rect x="450" y="225" width="260" height="80" rx="6" fill="#e6e8ec" stroke="#e6e8ec" stroke-width="3">
    <animate attributeName="stroke" values="#e6e8ec;#e6e8ec;#7ee7c7;#7ee7c7;#e6e8ec;#e6e8ec" keyTimes="0;0.66;0.7;0.95;0.98;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="460" y="248" width="70" height="34" rx="4" fill="#fff3df" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 4">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.64;0.68;0.97;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="530" y="274" text-anchor="end" font-size="24" font-weight="700" fill="#0b8f6a" opacity="0">tester
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.7;0.95;0.98;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="533" y="274" font-size="24" font-weight="700" fill="#0f1115">님 안녕하세요</text>

  <!-- DB -->
  <rect x="760" y="120" width="180" height="210" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="850" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">DB(서고)</text>
  <path d="M785 184 V306 A65 14 0 0 0 915 306 V184" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <ellipse cx="850" cy="184" rx="65" ry="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <rect x="795" y="208" width="110" height="36" rx="4" fill="#7ee7c7" opacity="0">
    <animate attributeName="opacity" values="0;0;0.35;0.35;0;0" keyTimes="0;0.47;0.49;0.6;0.62;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <g font-size="24" text-anchor="middle" fill="#9aa3b2">
    <text x="850" y="234" fill="#e6e8ec">tester</text>
    <text x="850" y="270">kim</text>
    <text x="850" y="304">lee</text>
  </g>

  <!-- ① 입력 편지 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;205,0;205,0;470,0;470,0;0,0" keyTimes="0;0.03;0.18;0.22;0.37;0.97;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.37;0.39;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="40" y="356" width="140" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="110" y="386" text-anchor="middle" font-size="24" fill="#e6e8ec">id=tester</text>
  </g>

  <!-- ② DB에 질문 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;245,0;245,0" keyTimes="0;0.4;0.47;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.47;0.49;1" dur="10s" repeatCount="indefinite"/>
    <rect x="510" y="356" width="180" height="44" rx="6" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="600" y="386" text-anchor="middle" font-size="24" fill="#ffb454">tester 있나요?</text>
  </g>

  <!-- ③ DB 답 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-270,0;-270,0" keyTimes="0;0.5;0.58;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.58;0.61;1" dur="10s" repeatCount="indefinite"/>
    <rect x="790" y="356" width="120" height="44" rx="6" fill="#7ee7c7"/>
    <text x="850" y="386" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">✓ 있음</text>
  </g>

  <!-- ④ 완성 문서 귀환 -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-265,0;-265,0;-470,0;-470,0" keyTimes="0;0.8;0.86;0.87;0.92;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.91;0.93;1" dur="10s" repeatCount="indefinite"/>
    <rect x="510" y="356" width="140" height="44" rx="6" fill="#7ee7c7"/>
    <text x="580" y="386" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">HTML 문서</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="466" width="880" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="503">① 입력 tester가 웹 서버를 거쳐 WAS로 갑니다
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.36;0.38;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0">② WAS가 DB에 묻습니다: tester 있나요? → 있음
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.4;0.56;0.58;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0">③ 빈칸 문서에 tester를 채워 HTML을 만듭니다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.76;0.78;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="503" opacity="0" fill="#7ee7c7" font-weight="700">요청에 맞게 만든 문서가 돌아와 화면이 바뀐다
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
