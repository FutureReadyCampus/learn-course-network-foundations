<text x="480" y="508" font-size="28" font-weight="700" fill="#e6e8ec" text-anchor="middle" opacity="1">Window = 받는 쪽 버퍼에 남은 빈자리 수<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.22;0.965;0.99;1" dur="14s" repeatCount="indefinite"/></text>
