<text x="480" y="508" font-size="28" font-weight="700" fill="#ffb454" text-anchor="middle" opacity="0">빈자리가 0이면 보내는 쪽은 멈추고 기다려요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.75;0.77;1" dur="14s" repeatCount="indefinite"/></text>
<text x="480" y="508" font-size="28" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">느리면 네트워크보다 받는 프로그램을 의심!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.945;0.965;1" dur="14s" repeatCount="indefinite"/></text>
