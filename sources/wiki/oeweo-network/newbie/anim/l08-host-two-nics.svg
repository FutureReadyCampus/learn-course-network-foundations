<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 -->
  <text x="480" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">호스트 하나, 인터페이스 둘</text>

  <!-- 단계 표시: 마지막에 점이 하나로 돌아가는 건 '처음부터 반복'임을 화면에서 알린다 -->
  <rect x="40" y="92" width="230" height="46" rx="23" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="24" font-weight="700" text-anchor="middle">
    <text x="155" y="123" fill="#9aa3b2">① USB 꽂기 전
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.49;0.51;0.98;1" values="1;1;0;0;1"/>
    </text>
    <text x="155" y="123" fill="#ffb454" opacity="0">② USB 꽂은 뒤
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.50;0.52;0.91;0.93;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="155" y="123" fill="#6ea8fe" opacity="0">↻ 처음부터 다시
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.92;0.93;0.98;0.99;1" values="0;0;1;1;0;0"/>
    </text>
  </g>

  <!-- 결론 문구 (8~9.5초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.77;0.80;0.93;0.96;1" values="0;0;1;1;0;0"/>
    <rect x="300" y="110" width="360" height="56" rx="28" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
    <text x="480" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7">점 2개 = 인터페이스 2개</text>
  </g>

  <!-- 무선 쪽: 액세스 포인트 + 물결 + 라벨 (2~5초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.20;0.24;0.93;0.98;1" values="0;0;1;1;0;0"/>
    <line x1="90" y1="255" x2="78" y2="225" stroke="#6ea8fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="255" x2="232" y2="225" stroke="#6ea8fe" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="255" width="190" height="50" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="155" y="289" text-anchor="middle" font-size="24" fill="#e6e8ec">액세스 포인트</text>
    <path d="M400,280 q-9.375,-16 -18.75,0 t-18.75,0 t-18.75,0 t-18.75,0 t-18.75,0 t-18.75,0 t-18.75,0 t-18.75,0" fill="none" stroke="#6ea8fe" stroke-width="4" stroke-linecap="round" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" keyTimes="0;0.22;0.38;1" values="260;260;0;0"/>
    </path>
    <text x="325" y="335" text-anchor="middle" font-size="26" font-weight="700" fill="#6ea8fe" opacity="0">무선 NIC
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.37;0.41;1" values="0;0;1;1"/>
    </text>
  </g>

  <!-- 유선 쪽: USB 막대 + 직선 + 다른 장치 + 라벨 (5~8초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.49;0.51;0.93;0.98;1" values="0;0;1;1;0;0"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.50;0.56;1" values="60,0;60,0;0,0;0,0"/>
      <rect x="530" y="266" width="90" height="28" rx="5" fill="#ffb454"/>
      <rect x="530" y="272" width="30" height="16" fill="#9aa3b2"/>
    </g>
    <line x1="620" y1="280" x2="740" y2="280" stroke="#ffb454" stroke-width="4" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" keyTimes="0;0.58;0.66;1" values="120;120;0;0"/>
    </line>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.62;0.66;1" values="0;0;1;1"/>
      <rect x="740" y="255" width="160" height="50" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
      <text x="820" y="289" text-anchor="middle" font-size="24" fill="#e6e8ec">다른 장치</text>
      <text x="680" y="335" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">유선 NIC</text>
    </g>
  </g>

  <!-- 호스트(노트북) 네모: USB 막대 안쪽을 가린다 -->
  <rect x="400" y="215" width="160" height="130" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="480" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">호스트</text>
  <text x="480" y="306" text-anchor="middle" font-size="24" fill="#9aa3b2">(노트북)</text>

  <!-- 점 1: 무선 인터페이스 -->
  <circle cx="400" cy="280" r="12" fill="none" stroke="#7ee7c7" stroke-width="3" opacity="0">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" keyTimes="0;0.02;0.09;0.10;0.17;0.795;0.80;0.87;0.88;0.95;1" values="12;12;30;12;30;12;12;30;12;30;12"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.02;0.09;0.10;0.17;0.795;0.80;0.87;0.88;0.95;1" values="0;0.9;0;0.9;0;0;0.9;0;0.9;0;0"/>
  </circle>
  <circle cx="400" cy="280" r="12" fill="#7ee7c7" stroke="#0f1115" stroke-width="3">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.80;0.835;0.87;0.905;0.94;1" values="1;1;0.25;1;0.25;1;1"/>
  </circle>

  <!-- 점 2: 유선(USB) 인터페이스 -->
  <circle cx="620" cy="280" r="12" fill="none" stroke="#7ee7c7" stroke-width="3" opacity="0">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" keyTimes="0;0.565;0.57;0.64;0.795;0.80;0.87;0.88;0.95;1" values="12;12;12;30;12;12;30;12;30;12"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.565;0.57;0.64;0.795;0.80;0.87;0.88;0.95;1" values="0;0;0.9;0;0;0.9;0;0.9;0;0"/>
  </circle>
  <circle cx="620" cy="280" r="0" fill="#7ee7c7" stroke="#0f1115" stroke-width="3">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" keyTimes="0;0.56;0.58;0.60;0.93;0.98;1" values="0;0;16;12;12;0;0"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.80;0.835;0.87;0.905;0.94;1" values="1;1;0.25;1;0.25;1;1"/>
  </circle>

  <!-- 점 개수 세기 -->
  <text x="480" y="392" text-anchor="middle" font-size="26" fill="#9aa3b2">인터페이스 <tspan fill="#7ee7c7" font-weight="700">1개</tspan>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.56;0.58;0.95;0.98;1" values="1;1;0;0;1;1"/>
  </text>
  <text x="480" y="392" text-anchor="middle" font-size="26" fill="#9aa3b2" opacity="0">인터페이스 <tspan fill="#7ee7c7" font-weight="700">2개</tspan>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.57;0.59;0.93;0.95;1" values="0;0;1;1;0;0"/>
  </text>

  <!-- 자막 바 -->
  <rect x="40" y="450" width="880" height="66" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="492">네모는 호스트(노트북), 진한 점은 인터페이스(NIC)예요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.23;0.26;0.98;1" values="1;1;0;0;1"/>
    </text>
    <text x="480" y="492" opacity="0">첫 번째 점: 무선 NIC로 액세스 포인트와 이어져요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.24;0.27;0.48;0.51;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="492" opacity="0">USB 유선 NIC를 꽂으면 두 번째 점이 생겨요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.49;0.52;0.75;0.78;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="492" opacity="0" fill="#7ee7c7" font-weight="700">호스트 한 대도 인터페이스를 여러 개 가질 수 있어요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.97;0.99;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
