<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 = 핵심 결론 (항상 보임) -->
  <text x="40" y="50" font-size="34" font-weight="700" fill="#e6e8ec">IP 주소는 <tspan fill="#7ee7c7">집</tspan>, 포트는 <tspan fill="#ffb454">집 안의 이름</tspan></text>

  <!-- 집(호스트): 지붕 + 주소 표찰 -->
  <polygon points="560,170 750,70 940,170" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-linejoin="round"/>
  <rect x="660" y="124" width="180" height="38" rx="6" fill="#0f1115" stroke="#7ee7c7" stroke-width="2">
    <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.29;0.33;0.37;0.41;0.45;1" values="2;2;6;2;6;2;5;2"/>
  </rect>
  <text x="750" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">203.0.113.20</text>

  <!-- 집 안: 방 세 개 (포트) -->
  <rect x="580" y="170" width="340" height="260" fill="#0f1115" stroke="#3d4b60" stroke-width="3"/>
  <g font-size="24" font-weight="700">
    <rect x="600" y="185" width="300" height="65" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="618" y="226" fill="#9aa3b2">22번 · SSH</text>
    <rect x="600" y="265" width="300" height="65" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.55;0.57;0.95;0.97;1" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60;#3d4b60"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" keyTimes="0;0.55;0.57;0.95;0.97;1" values="2;2;5;5;2;2"/>
    </rect>
    <text x="618" y="306" fill="#e6e8ec">80번 · 웹 서버</text>
    <rect x="600" y="345" width="300" height="65" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
    <text x="618" y="386" fill="#9aa3b2">443번 · HTTPS</text>
  </g>

  <!-- 집 정면: 5초에 열려 단면이 보임 -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.54;0.96;0.99;1" values="1;1;0;0;1;1"/>
    <rect x="580" y="170" width="340" height="260" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
    <rect x="610" y="205" width="80" height="70" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/>
    <rect x="810" y="205" width="80" height="70" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/>
    <rect x="715" y="320" width="70" height="110" rx="4" fill="#0f1115" stroke="#9aa3b2" stroke-width="2"/>
    <circle cx="772" cy="378" r="5" fill="#9aa3b2"/>
  </g>

  <!-- 송장의 80 → 80번 방 화살표 (5~8초) -->
  <g fill="none" stroke="#ffb454" stroke-width="4" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.55;0.56;0.79;0.81;1" values="0;0;1;1;0;0"/>
    <path d="M440,374 C520,374 520,297 588,297" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" keyTimes="0;0.56;0.64;1" values="200;200;0;0"/>
    </path>
    <polygon points="598,297 584,288 584,306" fill="#ffb454" stroke="none" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.63;0.64;1" values="0;0;1;1"/>
    </polygon>
  </g>

  <!-- 택배 상자 + 송장 -->
  <g transform="translate(40,200)">
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
      keyTimes="0;0.2;0.48;0.8;0.9;0.97;0.971;1" values="40,200;40,200;200,300;200,300;818,280;818,280;40,200;40,200"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.94;0.96;0.975;1" values="1;1;0;0;1"/>
    <g>
      <animateTransform attributeName="transform" type="scale" dur="10s" repeatCount="indefinite"
        keyTimes="0;0.8;0.9;0.97;0.971;1" values="1;1;0.28;0.28;1;1"/>
      <rect x="0" y="0" width="260" height="130" rx="8" fill="#171a21" stroke="#9aa3b2" stroke-width="3"/>
      <text x="130" y="31" text-anchor="middle" font-size="24" fill="#9aa3b2">송장</text>
      <rect x="10" y="44" width="240" height="60" rx="6" fill="#e6e8ec"/>
      <!-- IP 부분 깜빡임 (2~5초) -->
      <rect x="14" y="50" width="152" height="48" rx="5" fill="#7ee7c7" opacity="0">
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.29;0.33;0.37;0.41;0.45;0.5;1" values="0;0;1;0.2;1;0.2;1;0;0"/>
      </rect>
      <!-- 포트 부분 깜빡임 (5~8초) -->
      <rect x="184" y="50" width="44" height="48" rx="5" fill="#ffb454" opacity="0">
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.52;0.55;0.59;0.63;0.67;0.71;0.95;0.97;1" values="0;0;1;0.2;1;0.2;1;1;0;0"/>
      </rect>
      <text x="20" y="83" font-size="24" font-weight="700" fill="#0f1115">203.0.113.20</text>
      <text x="172" y="83" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">:</text>
      <text x="206" y="83" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">80</text>
    </g>
  </g>

  <!-- 결론 배너 (8~10초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.78;0.8;0.95;0.97;1" values="0;0;1;1;0;0"/>
    <rect x="30" y="90" width="520" height="80" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <text x="290" y="140" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec"><tspan fill="#7ee7c7">IP로 집 찾기</tspan> → <tspan fill="#ffb454">포트로 프로세스 찾기</tspan></text>
  </g>

  <!-- 자막 바 -->
  <rect x="20" y="466" width="920" height="58" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="504">택배 송장에 IP 주소와 포트 번호가 적혀 있어요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.22;0.24;0.97;0.99;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="480" y="504" opacity="0">IP 주소 203.0.113.20이 집(호스트)을 찾아요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.23;0.25;0.5;0.52;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="504" opacity="0">포트 번호 80이 집 안의 수신 프로세스를 골라요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.51;0.53;0.78;0.8;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="504" opacity="0">상자가 80번 방, 웹 서버에게 전달됐어요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.79;0.81;0.96;0.98;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
