<text x="480" y="510" font-size="26"  fill="#e6e8ec" text-anchor="middle" opacity="0">공장에서 NIC마다 서로 다른 번호를 새깁니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.48;0.5;1" dur="10s" repeatCount="indefinite" /></text>
<text x="480" y="510" font-size="26"  fill="#e6e8ec" text-anchor="middle" opacity="0">앞 세 덩어리는 만든 회사, 뒤 세 덩어리는 제품 번호.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.77;0.79;1" dur="10s" repeatCount="indefinite" /></text>
<text x="480" y="510" font-size="26"  fill="#e6e8ec" text-anchor="middle" opacity="0">MAC 주소는 컴퓨터가 아니라 NIC에 붙습니다.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="10s" repeatCount="indefinite" /></text>
