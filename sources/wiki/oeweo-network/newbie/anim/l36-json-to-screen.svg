<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 = 핵심 결론 (0초·10초 프레임에도 보임) -->
  <text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">서버는 <tspan fill="#ffb454">자료만</tspan> 보내고, 화면은 <tspan fill="#7ee7c7">기기가</tspan> 만든다</text>

  <!-- 서버 -->
  <rect x="40" y="80" width="170" height="110" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <rect x="58" y="96" width="134" height="16" rx="4" fill="#3d4b60"/>
  <rect x="58" y="120" width="134" height="16" rx="4" fill="#3d4b60"/>
  <circle cx="178" cy="104" r="4" fill="#7ee7c7"/>
  <circle cx="178" cy="128" r="4" fill="#7ee7c7"/>
  <text x="125" y="176" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">서버</text>

  <!-- 서버 → 기기 선 -->
  <g stroke="#6ea8fe" stroke-width="3" stroke-dasharray="8 7" fill="none" opacity="0.7">
    <line x1="210" y1="170" x2="355" y2="228"/>
    <line x1="210" y1="170" x2="560" y2="243"/>
    <line x1="210" y1="170" x2="820" y2="238"/>
  </g>

  <!-- JSON 꾸러미 (원본) -->
  <rect x="270" y="84" width="200" height="86" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
  <text x="286" y="118" font-size="24" fill="#e6e8ec">{ 이름: "사과",</text>
  <text x="286" y="154" font-size="24" fill="#e6e8ec">  가격: 1000 }</text>
  <text x="482" y="136" font-size="24" font-weight="700" fill="#ffb454">JSON</text>

  <!-- 휴대폰 -->
  <rect x="300" y="230" width="110" height="190" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="308" y="246" width="94" height="158" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2">
    <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.56;0.95;1" values="0;0;1;1;0"/>
    <rect x="312" y="262" width="86" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="355" y="291" text-anchor="middle" font-size="24" fill="#e6e8ec">사과</text>
    <rect x="312" y="312" width="86" height="42" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="355" y="341" text-anchor="middle" font-size="24" fill="#ffb454">1000원</text>
  </g>
  <text x="355" y="456" text-anchor="middle" font-size="24" fill="#9aa3b2">휴대폰</text>

  <!-- 태블릿 -->
  <rect x="450" y="245" width="220" height="170" rx="16" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="462" y="257" width="196" height="146" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2">
    <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.54;0.6;0.95;1" values="0;0;1;1;0"/>
    <rect x="468" y="300" width="90" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="513" y="339" text-anchor="middle" font-size="24" fill="#e6e8ec">사과</text>
    <rect x="562" y="300" width="90" height="60" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <text x="607" y="339" text-anchor="middle" font-size="24" fill="#ffb454">1000원</text>
  </g>
  <text x="560" y="456" text-anchor="middle" font-size="24" fill="#9aa3b2">태블릿</text>

  <!-- PC -->
  <rect x="700" y="238" width="240" height="144" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="710" y="248" width="220" height="124" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2">
    <animate attributeName="stroke" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60"/>
  </rect>
  <rect x="802" y="382" width="36" height="22" fill="#3d4b60"/>
  <rect x="772" y="404" width="96" height="8" rx="3" fill="#3d4b60"/>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.58;0.64;0.95;1" values="0;0;1;1;0"/>
    <rect x="720" y="262" width="200" height="88" fill="#171a21" stroke="#6ea8fe" stroke-width="2"/>
    <line x1="720" y1="303" x2="920" y2="303" stroke="#6ea8fe" stroke-width="2"/>
    <line x1="820" y1="262" x2="820" y2="350" stroke="#6ea8fe" stroke-width="2"/>
    <text x="770" y="291" text-anchor="middle" font-size="24" fill="#9aa3b2">이름</text>
    <text x="870" y="291" text-anchor="middle" font-size="24" fill="#9aa3b2">가격</text>
    <text x="770" y="336" text-anchor="middle" font-size="24" fill="#e6e8ec">사과</text>
    <text x="870" y="336" text-anchor="middle" font-size="24" fill="#ffb454">1000원</text>
  </g>
  <text x="820" y="456" text-anchor="middle" font-size="24" fill="#9aa3b2">PC</text>

  <!-- 복제된 꾸러미 3개: 2초에 나타나 세 기기로 동시에 날아감 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.23;0.46;0.5;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.21;0.46;1" values="370 127;370 127;355 290;355 290" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <rect x="-46" y="-22" width="92" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">JSON</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.23;0.46;0.5;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.21;0.46;1" values="370 127;370 127;560 320;560 320" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <rect x="-46" y="-22" width="92" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">JSON</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.23;0.46;0.5;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.21;0.46;1" values="370 127;370 127;820 306;820 306" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <rect x="-46" y="-22" width="92" height="44" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">JSON</text>
  </g>

  <!-- 8초: '자료만' / '화면은 여기서' -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.74;0.78;0.95;1" values="0;0;1;1;0"/>
    <rect x="490" y="156" width="104" height="38" rx="19" fill="#0f1115" stroke="#ffb454" stroke-width="2"/>
    <text x="542" y="183" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">자료만</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;1" values="0;0;1;1;0"/>
    <text x="150" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">화면은 여기서</text>
    <path d="M232 322 H284 M272 312 L286 322 L272 332" stroke="#7ee7c7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="472" width="960" height="68" fill="#171a21"/>
  <line x1="0" y1="472" x2="960" y2="472" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle">
    <text x="480" y="516" fill="#e6e8ec">서버가 상품 자료(JSON)를 하나 준비했어요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.23;0.97;1" values="1;1;0;0;1"/>
    </text>
    <text x="480" y="516" fill="#e6e8ec" opacity="0">똑같은 자료가 세 기기로 동시에 갑니다
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.23;0.26;0.47;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="516" fill="#e6e8ec" opacity="0">각 기기가 자기 화면 크기에 맞게 그려요
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.53;0.75;0.77;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="516" fill="#7ee7c7" font-weight="700" opacity="0">서버는 자료만, 화면은 받은 기기가 만든다
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.76;0.78;0.94;0.97;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
