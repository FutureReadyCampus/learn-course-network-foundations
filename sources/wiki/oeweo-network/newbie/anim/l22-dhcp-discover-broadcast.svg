<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">서버를 모를 때는 모두에게 외친다</text>

<!-- wires -->
<line x1="480" y1="158" x2="480" y2="215" stroke="#3d4b60" stroke-width="4"/>
<line x1="240" y1="245" x2="400" y2="245" stroke="#3d4b60" stroke-width="4"/>
<line x1="480" y1="271" x2="200" y2="340" stroke="#3d4b60" stroke-width="4"/>
<line x1="480" y1="271" x2="410" y2="340" stroke="#3d4b60" stroke-width="4"/>
<line x1="480" y1="271" x2="710" y2="340" stroke="#3d4b60" stroke-width="4"/>
<text x="466" y="196" text-anchor="end" font-size="24" fill="#9aa3b2">업링크</text>

<!-- router -->
<rect x="380" y="78" width="200" height="80" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="480" y="110" text-anchor="middle" font-size="24" font-weight="600" fill="#e6e8ec">공유기</text>
<text x="480" y="143" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.0.1</text>

<!-- switch -->
<rect x="400" y="215" width="160" height="56" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="3"><animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#7ee7c7;#7ee7c7;#6ea8fe;#6ea8fe" keyTimes="0;0.47;0.49;0.56;0.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="3;3;6;6;3;3" keyTimes="0;0.47;0.49;0.56;0.6;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="480" y="252" text-anchor="middle" font-size="24" font-weight="600" fill="#e6e8ec">스위치</text>
<text x="574" y="252" font-size="24" font-weight="700" fill="#7ee7c7" opacity="0">복사 ×4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.76;0.8;1" dur="10s" repeatCount="indefinite"/></text>

<!-- new PC -->
<rect x="40" y="200" width="200" height="90" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60" keyTimes="0;0.05;0.09;0.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#171a21;#171a21;#2a2418;#2a2418;#171a21" keyTimes="0;0.05;0.09;0.95;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="140" y="235" text-anchor="middle" font-size="24" font-weight="600" fill="#e6e8ec">새로 켠 PC</text>
<text x="140" y="273" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">서버 주소 ?</text>

<!-- PC 2 / PC 3 -->
<g><animate attributeName="opacity" values="1;1;0.4;0.4;1" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="120" y="340" width="160" height="84" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="200" y="372" text-anchor="middle" font-size="24" font-weight="600" fill="#e6e8ec">PC 2</text>
<text x="200" y="408" text-anchor="middle" font-size="24" fill="#9aa3b2" opacity="0">무반응<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></text>
<rect x="330" y="340" width="160" height="84" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="410" y="372" text-anchor="middle" font-size="24" font-weight="600" fill="#e6e8ec">PC 3</text>
<text x="410" y="408" text-anchor="middle" font-size="24" fill="#9aa3b2" opacity="0">무반응<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></text>
</g>

<!-- DHCP server -->
<rect x="600" y="340" width="220" height="84" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#171a21;#171a21;#173a33;#173a33;#171a21" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="3;3;6;6;3" keyTimes="0;0.79;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="710" y="391" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">DHCP 서버</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.95;1" dur="10s" repeatCount="indefinite"/>
<rect x="700" y="266" width="236" height="50" rx="12" fill="#173a33" stroke="#7ee7c7" stroke-width="3"/>
<path d="M760 316 L772 336 L784 316 Z" fill="#7ee7c7"/>
<text x="818" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">나 여기 있어요!</text>
</g>

<!-- Discover signal: PC -> switch -->
<g opacity="0"><animateTransform attributeName="transform" type="translate" values="300 245;300 245;370 245;370 245" keyTimes="0;0.2;0.47;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.47;0.5;1" dur="10s" repeatCount="indefinite"/>
<circle r="10" fill="#ffb454"/>
<circle r="12" fill="none" stroke="#ffb454" stroke-width="3"><animate attributeName="r" values="12;28;12;28;12;28;12;28" keyTimes="0;0.07;0.0701;0.14;0.1401;0.21;0.2101;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;0;1;0;1;0" keyTimes="0;0.07;0.0701;0.14;0.1401;0.21;0.2101;1" dur="10s" repeatCount="indefinite"/></circle>
<text y="-36" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">Discover</text>
</g>

<!-- copies from switch -->
<g opacity="0"><animateTransform attributeName="transform" type="translate" values="480 243;480 243;480 176;480 176" keyTimes="0;0.52;0.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.82;1" dur="10s" repeatCount="indefinite"/><circle r="10" fill="#ffb454"/><circle r="18" fill="none" stroke="#ffb454" stroke-width="3" opacity="0.6"/></g>
<g opacity="0"><animateTransform attributeName="transform" type="translate" values="480 271;480 271;222 328;222 328" keyTimes="0;0.52;0.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.82;1" dur="10s" repeatCount="indefinite"/><circle r="10" fill="#ffb454"/><circle r="18" fill="none" stroke="#ffb454" stroke-width="3" opacity="0.6"/></g>
<g opacity="0"><animateTransform attributeName="transform" type="translate" values="480 271;480 271;418 328;418 328" keyTimes="0;0.52;0.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.82;1" dur="10s" repeatCount="indefinite"/><circle r="10" fill="#ffb454"/><circle r="18" fill="none" stroke="#ffb454" stroke-width="3" opacity="0.6"/></g>
<g opacity="0"><animateTransform attributeName="transform" type="translate" values="480 271;480 271;690 328;690 328" keyTimes="0;0.52;0.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.82;1" dur="10s" repeatCount="indefinite"/><circle r="10" fill="#ffb454"/><circle r="18" fill="none" stroke="#ffb454" stroke-width="3" opacity="0.6"/></g>

<!-- caption bar -->
<rect x="20" y="456" width="920" height="70" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">PC를 켰지만 DHCP 서버의 주소를 모릅니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.07;0.19;0.22;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">그래서 Discover를 모두에게 외칩니다 (브로드캐스트)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.47;0.5;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">스위치가 같은 범위의 모든 선으로 복사해 퍼뜨립니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.52;0.76;0.79;1" dur="10s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7" opacity="1">주소를 몰라도 모두에게 외치면 DHCP 서버만 답합니다<animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.04;0.79;0.83;1" dur="10s" repeatCount="indefinite"/></text>
</svg>
