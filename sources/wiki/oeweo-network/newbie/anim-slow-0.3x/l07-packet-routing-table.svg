<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="46" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">라우터가 표를 보고 패킷의 길을 고른다</text>

<!-- 도로 -->
<rect x="0" y="290" width="380" height="40" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="440" y="290" width="360" height="40" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="440" y="290" width="360" height="40" fill="#ffb454" opacity="0">
<animate attributeName="opacity" values="0;0;0.35;0.35;0;0" keyTimes="0;0.53;0.58;0.93;0.96;1" dur="33.333s" repeatCount="indefinite"/></rect>
<path d="M432 336 L640 440" stroke="#3d4b60" stroke-width="44" stroke-linecap="round"/>
<path d="M432 336 L640 440" stroke="#171a21" stroke-width="40" stroke-linecap="round"/>
<line x1="10" y1="310" x2="370" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="14 12"/>
<line x1="470" y1="310" x2="790" y2="310" stroke="#3d4b60" stroke-width="3" stroke-dasharray="14 12"/>
<text x="500" y="447" font-size="24" fill="#9aa3b2" text-anchor="end">1번 출구</text>
<text x="700" y="388" font-size="24" font-weight="700" fill="#9aa3b2" text-anchor="middle">2번 출구
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2;#9aa3b2" keyTimes="0;0.53;0.56;0.93;0.96;1" dur="33.333s" repeatCount="indefinite"/></text>

<!-- 라우터(교차로) -->
<line x1="410" y1="228" x2="410" y2="258" stroke="#3d4b60" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="410" cy="310" r="50" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<text x="410" y="318" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">라우터</text>
<circle cx="840" cy="310" r="46" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<text x="840" y="318" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">라우터</text>

<!-- 라우팅 테이블 -->
<text x="232" y="160" font-size="24" fill="#9aa3b2" text-anchor="end">라우팅</text>
<text x="232" y="192" font-size="24" fill="#9aa3b2" text-anchor="end">테이블</text>
<rect x="250" y="76" width="320" height="150" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="270" y="106" font-size="24" fill="#9aa3b2">목적지 묶음</text>
<text x="480" y="106" font-size="24" fill="#9aa3b2">출구</text>
<line x1="258" y1="120" x2="562" y2="120" stroke="#3d4b60" stroke-width="2"/>
<rect x="258" y="126" width="304" height="44" rx="6" fill="none" stroke="#6ea8fe" stroke-width="3" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.38;0.40;1" dur="33.333s" repeatCount="indefinite"/></rect>
<rect x="258" y="176" width="304" height="44" rx="6" fill="#ffb454" fill-opacity="0.3" stroke="#ffb454" stroke-width="3" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.43;0.93;0.96;1" dur="33.333s" repeatCount="indefinite"/></rect>
<text x="270" y="157" font-size="24" fill="#e6e8ec">192.168.0.0</text>
<text x="480" y="157" font-size="24" fill="#e6e8ec">→ 1번</text>
<text x="270" y="207" font-size="24" fill="#e6e8ec">10.0.0.0</text>
<text x="480" y="207" font-size="24" fill="#e6e8ec">→ 2번</text>

<!-- 켜진 줄 → 2번 출구 화살표 -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.62;0.65;1" dur="33.333s" repeatCount="indefinite"/>
<path d="M572 198 C 660 198 700 230 700 272" fill="none" stroke="#ffb454" stroke-width="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
<animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.53;0.57;1" dur="33.333s" repeatCount="indefinite"/></path>
<polygon points="688,268 712,268 700,290" fill="#ffb454" opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.57;1" dur="33.333s" repeatCount="indefinite"/></polygon>
</g>

<!-- 다음 라우터의 작은 표 -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.88;0.93;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="740" y="136" width="200" height="86" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
<text x="840" y="168" font-size="24" fill="#e6e8ec" text-anchor="middle">다음 라우터의 표</text>
<rect x="756" y="182" width="168" height="12" rx="4" fill="#3d4b60"/>
<rect x="756" y="202" width="168" height="12" rx="4" fill="#3d4b60"/>
</g>

<!-- 패킷(자동차) -->
<g transform="translate(110,310)">
<animateTransform attributeName="transform" type="translate" values="110,310;290,310;290,310;550,310;740,310;740,310;110,310;110,310" keyTimes="0;0.2;0.56;0.6;0.85;0.95;0.955;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.93;0.95;0.96;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="-100" y="-72" width="200" height="38" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
<text x="0" y="-45" font-size="24" fill="#e6e8ec" text-anchor="middle">목적지 <tspan font-weight="700" fill="#7ee7c7">10.0.0.7</tspan></text>
<line x1="0" y1="-34" x2="0" y2="-22" stroke="#7ee7c7" stroke-width="2"/>
<rect x="-56" y="-22" width="112" height="40" rx="10" fill="#6ea8fe"/>
<text x="0" y="8" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">패킷</text>
<circle cx="-32" cy="20" r="8" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/>
<circle cx="32" cy="20" r="8" fill="#0f1115" stroke="#e6e8ec" stroke-width="2"/>
</g>

<!-- 표 위로 올라가는 주소 -->
<g transform="translate(290,256)" opacity="0">
<animateTransform attributeName="transform" type="translate" values="290,256;290,256;640,148;640,148;640,198;640,198" keyTimes="0;0.22;0.31;0.37;0.41;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.5;0.53;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="-60" y="-20" width="120" height="40" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
<text x="0" y="9" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">10.0.0.7</text>
</g>

<!-- 자막 바 -->
<rect x="40" y="472" width="880" height="54" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="508" font-size="26" font-weight="700" fill="#7ee7c7" text-anchor="middle">라우터는 목적지 주소를 표에서 찾아 길을 고른다
<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.21;0.23;0.96;0.98;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="508" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">10.0.0.7은 둘째 줄 10.0.0.0 묶음에 속한다
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.25;0.5;0.52;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="508" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">그 줄에 적힌 2번 출구로 패킷을 내보낸다
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.75;0.77;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="508" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">다음 라우터도 자기 표를 보고 다시 고른다
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.94;0.96;1" dur="33.333s" repeatCount="indefinite"/></text>
</svg>
