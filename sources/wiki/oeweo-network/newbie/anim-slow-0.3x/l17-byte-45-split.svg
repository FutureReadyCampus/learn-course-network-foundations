<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.79;0.8;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>
<text x="480" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">첫 바이트 45 쪼개 보기</text>

<!-- 1. 숫자 4 상자 -->
<g opacity="1">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.26;0.96;1" values="1;1;0;0;1"/>
  <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.26;0.95;1" values="0 0;0 0;-99 0;0 0;0 0"/>
  <rect x="385" y="70" width="90" height="110" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
  <text x="430" y="155" text-anchor="middle" font-size="90" font-weight="700" fill="#e6e8ec">4</text>
  <text x="430" y="218" text-anchor="middle" font-size="24" fill="#9aa3b2">앞 4비트</text>
</g>
<!-- 2. 숫자 5 상자 -->
<g opacity="1">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.26;0.96;1" values="1;1;0;0;1"/>
  <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.26;0.95;1" values="0 0;0 0;99 0;0 0;0 0"/>
  <rect x="485" y="70" width="90" height="110" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
  <text x="530" y="155" text-anchor="middle" font-size="90" font-weight="700" fill="#e6e8ec">5</text>
  <text x="530" y="218" text-anchor="middle" font-size="24" fill="#9aa3b2">뒤 4비트</text>
</g>

<!-- 3. 8칸 비트 -->
<g opacity="0" font-size="34" font-weight="700" text-anchor="middle">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.21;0.27;0.95;0.99;1" values="0;0;1;1;0;0"/>
  <g fill="#171a21" stroke="#3d4b60" stroke-width="2">
    <rect x="202" y="82" width="60" height="58" rx="6"/><rect x="268" y="82" width="60" height="58" rx="6"/>
    <rect x="334" y="82" width="60" height="58" rx="6"/><rect x="400" y="82" width="60" height="58" rx="6"/>
    <rect x="500" y="82" width="60" height="58" rx="6"/><rect x="566" y="82" width="60" height="58" rx="6"/>
    <rect x="632" y="82" width="60" height="58" rx="6"/><rect x="698" y="82" width="60" height="58" rx="6"/>
  </g>
  <text x="232" y="123" fill="#9aa3b2">0</text><text x="298" y="123" fill="#e6e8ec">1</text>
  <text x="364" y="123" fill="#9aa3b2">0</text><text x="430" y="123" fill="#9aa3b2">0</text>
  <text x="530" y="123" fill="#9aa3b2">0</text><text x="596" y="123" fill="#e6e8ec">1</text>
  <text x="662" y="123" fill="#9aa3b2">0</text><text x="728" y="123" fill="#e6e8ec">1</text>
</g>

<!-- 4. 색 입히기 + 필드 이름 -->
<g opacity="0">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.33;0.39;0.95;0.99;1" values="0;0;1;1;0;0"/>
  <rect x="196" y="76" width="270" height="70" rx="10" fill="#6ea8fe" fill-opacity="0.18" stroke="#6ea8fe" stroke-width="3"/>
  <rect x="494" y="76" width="270" height="70" rx="10" fill="#ffb454" fill-opacity="0.18" stroke="#ffb454" stroke-width="3"/>
  <text x="331" y="182" text-anchor="middle" font-size="28" font-weight="700" fill="#6ea8fe">Version = 4</text>
  <text x="629" y="182" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454">IHL = 5</text>
</g>

<!-- 5. 4바이트 줄 쌓기 (줄 단위로 드러남) -->
<clipPath id="stackClip">
  <rect x="440" y="198" width="520" height="0">
    <animate attributeName="height" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.535;0.57;0.605;0.64" values="0;36;72;108;144;184"/>
  </rect>
</clipPath>
<g opacity="0" clip-path="url(#stackClip)">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.49;0.5;0.95;0.99;1" values="0;0;1;1;0;0"/>
  <g fill="#171a21" stroke="#ffb454" stroke-width="2">
    <rect x="520" y="200" width="72" height="30" rx="4"/><rect x="592" y="200" width="72" height="30" rx="4"/><rect x="664" y="200" width="72" height="30" rx="4"/><rect x="736" y="200" width="72" height="30" rx="4"/>
    <rect x="520" y="236" width="72" height="30" rx="4"/><rect x="592" y="236" width="72" height="30" rx="4"/><rect x="664" y="236" width="72" height="30" rx="4"/><rect x="736" y="236" width="72" height="30" rx="4"/>
    <rect x="520" y="272" width="72" height="30" rx="4"/><rect x="592" y="272" width="72" height="30" rx="4"/><rect x="664" y="272" width="72" height="30" rx="4"/><rect x="736" y="272" width="72" height="30" rx="4"/>
    <rect x="520" y="308" width="72" height="30" rx="4"/><rect x="592" y="308" width="72" height="30" rx="4"/><rect x="664" y="308" width="72" height="30" rx="4"/><rect x="736" y="308" width="72" height="30" rx="4"/>
    <rect x="520" y="344" width="72" height="30" rx="4"/><rect x="592" y="344" width="72" height="30" rx="4"/><rect x="664" y="344" width="72" height="30" rx="4"/><rect x="736" y="344" width="72" height="30" rx="4"/>
  </g>
  <g font-size="24" font-weight="700" fill="#ffb454" text-anchor="end">
    <text x="508" y="224">1줄</text><text x="508" y="260">2줄</text><text x="508" y="296">3줄</text><text x="508" y="332">4줄</text><text x="508" y="368">5줄</text>
  </g>
  <text x="822" y="224" font-size="24" fill="#9aa3b2">4바이트</text>
</g>

<!-- 6. 계산식 -->
<g opacity="0" text-anchor="middle" font-weight="700">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.66;0.7;0.95;0.99;1" values="0;0;1;1;0;0"/>
  <text x="290" y="272" font-size="32" fill="#e6e8ec">5줄 × 4바이트</text>
  <text x="290" y="330" font-size="40" fill="#7ee7c7">= 20바이트</text>
</g>

<!-- 7. 반짝임 -->
<rect x="150" y="66" width="700" height="318" rx="16" fill="#7ee7c7" opacity="0">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.8;0.83;0.88;1" values="0;0;0.16;0;0"/>
</rect>

<!-- 8. 한 줄 요약 -->
<g opacity="0">
  <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.8;0.95;0.99;1" values="0;0;1;1;0;0"/>
  <rect x="230" y="394" width="500" height="52" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
  <text x="480" y="430" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7">45 = IPv4, 헤더 20바이트</text>
</g>

<!-- 자막 바 -->
<rect x="0" y="462" width="960" height="78" fill="#171a21"/>
<rect x="0" y="462" width="960" height="2" fill="#3d4b60"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
  <text x="480" y="510" opacity="1">헤더의 첫 바이트는 16진수 두 자리 '45'입니다
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.22;0.25;0.97;1" values="1;1;0;0;1"/></text>
  <text x="480" y="510" opacity="0">한 자리는 4칸: 4는 0100, 5는 0101
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.23;0.26;0.48;0.51;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="510" opacity="0">IHL 5는 '5줄'이라는 뜻, 한 줄은 4바이트
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.49;0.52;0.77;0.8;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="510" opacity="0">그래서 45는 IPv4, 헤더는 20바이트
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.78;0.81;0.95;0.98;1" values="0;0;1;1;0;0"/></text>
</g>
</svg>
