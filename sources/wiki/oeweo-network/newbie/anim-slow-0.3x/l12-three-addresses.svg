<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.21;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>

<!-- title = conclusion (always visible, flashes at 8~9s) -->
<text x="480" y="52" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">계층은 달라도 모두 ‘어디서 → 어디로’
<animate attributeName="fill" values="#e6e8ec;#e6e8ec;#7ee7c7;#e6e8ec;#7ee7c7;#e6e8ec" keyTimes="0;0.8;0.84;0.88;0.92;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- parcel box + invoice (= header) -->
<rect x="30" y="88" width="560" height="362" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<rect x="280" y="88" width="60" height="18" fill="#ffb454" opacity="0.5"/>
<rect x="48" y="108" width="524" height="326" rx="10" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<text x="66" y="145" font-size="24" fill="#9aa3b2">송장 = 헤더</text>
<text x="554" y="145" font-size="26" font-weight="700" fill="#ffb454" text-anchor="end">어디서? 어디로?
<animate attributeName="opacity" values="1;0.3;1;0.3;1;1" keyTimes="0;0.05;0.1;0.15;0.2;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<line x1="62" y1="160" x2="558" y2="160" stroke="#3d4b60" stroke-width="2"/>

<!-- L2 row -->
<g opacity="0.25">
<animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.2;0.24;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="62" y="170" width="496" height="58" rx="8" fill="#171a21" stroke="#7ee7c7" stroke-width="2">
<animate attributeName="fill" values="#171a21;#171a21;#24453d;#171a21;#24453d;#171a21;#171a21" keyTimes="0;0.8;0.84;0.88;0.92;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="72" y="180" width="60" height="38" rx="6" fill="#7ee7c7"/>
<text x="102" y="208" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">L2</text>
<text x="148" y="208" font-size="25" fill="#e6e8ec">MAC 출발 → MAC 도착</text>
</g>

<!-- L3 row -->
<g opacity="0.25">
<animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.3;0.34;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="62" y="240" width="496" height="58" rx="8" fill="#171a21" stroke="#6ea8fe" stroke-width="2">
<animate attributeName="fill" values="#171a21;#171a21;#22344f;#171a21;#22344f;#171a21;#171a21" keyTimes="0;0.8;0.84;0.88;0.92;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="72" y="250" width="60" height="38" rx="6" fill="#6ea8fe"/>
<text x="102" y="278" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">L3</text>
<text x="148" y="278" font-size="25" fill="#e6e8ec">192.168.0.10 → 대상 IP</text>
</g>

<!-- L4 row -->
<g opacity="0.25">
<animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.4;0.44;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="62" y="310" width="496" height="58" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="2">
<animate attributeName="fill" values="#171a21;#171a21;#4a3a22;#171a21;#4a3a22;#171a21;#171a21" keyTimes="0;0.8;0.84;0.88;0.92;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="72" y="320" width="60" height="38" rx="6" fill="#ffb454"/>
<text x="102" y="348" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">L4</text>
<text x="148" y="348" font-size="25" fill="#e6e8ec">포트 52000 → 포트 443</text>
</g>

<!-- port note (8~10s) -->
<text x="66" y="410" font-size="24" fill="#ffb454" opacity="0">※ 여기 ‘포트’는 케이블 구멍과는 다른 말
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.77;0.8;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- building + links (5~10s) -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="660" y="108" width="240" height="44" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="780" y="139" font-size="24" font-weight="700" fill="#6ea8fe" text-anchor="middle">건물 주소 101동</text>
<rect x="660" y="152" width="240" height="290" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<rect x="675" y="172" width="95" height="50" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<rect x="790" y="172" width="95" height="50" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<rect x="675" y="242" width="95" height="50" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<rect x="790" y="242" width="95" height="50" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<rect x="675" y="314" width="95" height="50" rx="4" fill="#3a2e1c" stroke="#ffb454" stroke-width="3"/>
<text x="722" y="348" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">443호</text>
<rect x="790" y="314" width="95" height="50" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<rect x="755" y="384" width="50" height="58" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<path d="M558 269 C610 269 615 130 660 130" fill="none" stroke="#6ea8fe" stroke-width="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
<animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.55;0.63;1" dur="33.333s" repeatCount="indefinite"/>
</path>
<path d="M558 339 L675 339" fill="none" stroke="#ffb454" stroke-width="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
<animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.65;0.72;1" dur="33.333s" repeatCount="indefinite"/>
</path>
</g>

<!-- caption bar -->
<rect x="30" y="466" width="900" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="505" opacity="1">택배 송장처럼, 헤더에는 ‘어디서? 어디로?’가 적혀요
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.2;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="505" opacity="0">계층마다 주소가 달라요: L2는 MAC, L3는 IP, L4는 포트
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.48;0.5;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="505" opacity="0">IP 주소는 건물 주소, 포트 번호는 그 건물 안의 호수
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.76;0.78;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="505" opacity="0">셋 다 출발지와 목적지를 알려 주는 주소입니다
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>
</svg>
