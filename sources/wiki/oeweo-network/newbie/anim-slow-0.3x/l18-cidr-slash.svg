<text x="480" y="491" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">그래서 한 줄로 /24 = 왼쪽 24비트가 네트워크 ID<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="491" font-size="26" fill="#e6e8ec" text-anchor="middle" opacity="0">/24는 255.255.255.0을 짧게 적은 같은 경계<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.81;0.96;0.98;1" dur="33.333s" repeatCount="indefinite"/></text>
</svg>
