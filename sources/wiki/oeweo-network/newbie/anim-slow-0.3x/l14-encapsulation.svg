<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="46" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">헤더가 차례로 감싸는 포장</text>
<text x="480" y="88" font-size="24" fill="#9aa3b2" text-anchor="middle">아래 층으로 내려갈수록 <tspan fill="#ffb454" font-weight="700">헤더가 하나씩 앞에</tspan> 붙는다</text>

<!-- layer gauge: L4 top, L2 bottom (going down) -->
<text x="75" y="136" font-size="24" fill="#9aa3b2" text-anchor="middle">계층</text>
<g font-size="24" font-weight="700" text-anchor="middle">
<rect x="30" y="150" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="150" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.2;0.23;0.35;0.38;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="75" y="179" fill="#9aa3b2">L4
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.2;0.23;0.35;0.38;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<rect x="30" y="200" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="200" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.35;0.38;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="75" y="229" fill="#9aa3b2">L3
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.35;0.38;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<rect x="30" y="250" width="90" height="40" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="30" y="250" width="90" height="40" rx="10" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0.25;0.25;0" keyTimes="0;0.5;0.53;0.8;0.83;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="75" y="279" fill="#9aa3b2">L2
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#0f1115;#0f1115;#7ee7c7;#7ee7c7;#9aa3b2" keyTimes="0;0.5;0.53;0.8;0.83;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>

<!-- send arrow from the program above -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 -14;0 0;0 0;0 -14" keyTimes="0;0.08;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.22;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<line x1="643" y1="108" x2="643" y2="156" stroke="#6ea8fe" stroke-width="4"/>
<path d="M631 152 L643 170 L655 152 Z" fill="#6ea8fe"/>
<text x="663" y="146" font-size="24" font-weight="700" fill="#6ea8fe">send</text>
</g>

<!-- network rail -->
<line x1="752" y1="215" x2="930" y2="215" stroke="#3d4b60" stroke-width="6" stroke-dasharray="14 8"/>
<path d="M928 203 L950 215 L928 227 Z" fill="#3d4b60"/>
<text x="850" y="330" font-size="24" fill="#9aa3b2" text-anchor="middle">→ 네트워크로</text>

<!-- the package (slides out along the rail at the end) -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;420 0;420 0;0 0" keyTimes="0;0.82;0.93;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.89;0.93;0.97;1" dur="33.333s" repeatCount="indefinite"/>

<!-- outlines -->
<rect x="140" y="140" width="600" height="150" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="4" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="274" y="150" width="458" height="130" rx="10" fill="#141922" stroke="#6ea8fe" stroke-width="2" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.45;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="454" y="160" width="270" height="110" rx="10" fill="#171a21" stroke="#6ea8fe" stroke-width="2" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
</rect>

<!-- Ethernet header -->
<g opacity="0">
<animateTransform attributeName="transform" type="translate" values="-70 0;-70 0;0 0;0 0;-70 0" keyTimes="0;0.5;0.56;0.93;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="148" y="148" width="118" height="134" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="207" y="207" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">Ethernet</text>
<text x="207" y="239" font-size="24" fill="#e6e8ec" text-anchor="middle">헤더</text>
</g>

<!-- IP header -->
<g opacity="0">
<animateTransform attributeName="transform" type="translate" values="-70 0;-70 0;0 0;0 0;-70 0" keyTimes="0;0.35;0.41;0.93;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.4;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="282" y="158" width="164" height="114" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="364" y="188" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">IP 헤더</text>
<text x="364" y="220" font-size="24" fill="#9aa3b2" text-anchor="middle">받는 곳</text>
<text x="364" y="252" font-size="24" fill="#6ea8fe" text-anchor="middle">203.0.113.5</text>
</g>

<!-- TCP header -->
<g opacity="0">
<animateTransform attributeName="transform" type="translate" values="-70 0;-70 0;0 0;0 0;-70 0" keyTimes="0;0.2;0.26;0.93;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.25;0.93;0.94;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="462" y="168" width="100" height="94" rx="8" fill="#2a2418" stroke="#ffb454" stroke-width="2"/>
<text x="512" y="207" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">TCP</text>
<text x="512" y="239" font-size="24" fill="#e6e8ec" text-anchor="middle">헤더</text>
</g>

<!-- data -->
<rect x="570" y="176" width="146" height="78" rx="10" fill="#14302a" stroke="#7ee7c7" stroke-width="3"/>
<text x="643" y="226" font-size="30" font-weight="700" fill="#7ee7c7" text-anchor="middle">안녕</text>
</g>

<!-- name of the current outermost shape -->
<g font-size="26" font-weight="700" text-anchor="middle">
<text x="643" y="330" fill="#7ee7c7">데이터
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.21;0.24;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="589" y="330" fill="#e6e8ec" opacity="0">TCP 세그먼트
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.3;0.41;0.43;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="503" y="330" fill="#e6e8ec" opacity="0">IP 패킷
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.45;0.56;0.58;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="440" y="330" fill="#7ee7c7" opacity="0">Ethernet 프레임
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.57;0.6;0.82;0.85;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>

<!-- conclusion -->
<text x="440" y="400" font-size="34" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">가장 바깥은 Ethernet 프레임
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.88;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- caption bar -->
<rect x="0" y="462" width="960" height="78" fill="#171a21"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="511">프로그램이 send로 데이터 '안녕'을 내려보내요
<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.19;0.21;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">TCP 헤더가 붙으면 세그먼트, IP 헤더까지 붙으면 패킷
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.49;0.51;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">Ethernet 헤더까지 붙어 전체가 프레임이 돼요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.8;0.82;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="511" opacity="0">겹겹이 싼 프레임 모양 그대로 선로로 나가요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>
</svg>
