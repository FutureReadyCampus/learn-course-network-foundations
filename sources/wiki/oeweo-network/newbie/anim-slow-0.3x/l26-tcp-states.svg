<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
  <text x="480" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">메시지가 오갈 때마다 <tspan fill="#7ee7c7">상태 이름표</tspan>가 바뀐다</text>

  <!-- panels -->
  <rect x="40" y="90" width="260" height="300" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="170" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">클라이언트</text>
  <rect x="660" y="90" width="260" height="300" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="790" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">서버</text>

  <!-- computers -->
  <rect x="125" y="145" width="90" height="62" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/>
  <rect x="155" y="207" width="30" height="14" fill="#9aa3b2"/>
  <rect x="140" y="221" width="60" height="6" rx="3" fill="#9aa3b2"/>
  <rect x="745" y="145" width="90" height="62" rx="6" fill="#0f1115" stroke="#9aa3b2" stroke-width="3"/>
  <rect x="775" y="207" width="30" height="14" fill="#9aa3b2"/>
  <rect x="760" y="221" width="60" height="6" rx="3" fill="#9aa3b2"/>

  <!-- ear (server listening) -->
  <g fill="none" stroke="#ffb454" stroke-width="4" stroke-linecap="round">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.36;0.38;0.97;1" values="1;0.25;1;0.25;1;0.25;1;1;0;0;1"/>
    <path d="M862,196 C862,206 874,206 874,196 C874,188 886,186 886,172 C886,158 874,152 866,152 C856,152 850,160 850,170"/>
    <path d="M860,172 C860,164 872,164 872,172"/>
    <path d="M730,160 Q720,176 730,192"/>
    <path d="M714,152 Q700,176 714,200"/>
  </g>

  <text x="170" y="270" text-anchor="middle" font-size="24" fill="#9aa3b2">상태 이름표</text>
  <text x="790" y="270" text-anchor="middle" font-size="24" fill="#9aa3b2">상태 이름표</text>

  <!-- client tag -->
  <rect x="55" y="290" width="230" height="56" rx="28" fill="#171a21" stroke="#3d4b60" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.18;0.68;0.97" values="#3d4b60;#6ea8fe;#7ee7c7;#3d4b60"/>
    <animate attributeName="stroke-dasharray" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.18;0.97" values="8 6;600 0;8 6"/>
    <animate attributeName="fill" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.68;0.97" values="#171a21;#7ee7c7;#171a21"/>
  </rect>
  <text x="170" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe" opacity="0">SYN_SENT<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.18;0.68" values="0;1;0"/></text>
  <text x="170" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115" opacity="0">ESTABLISHED<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.68;0.97" values="0;1;0"/></text>

  <!-- server tag -->
  <rect x="675" y="290" width="230" height="56" rx="28" fill="#171a21" stroke="#ffb454" stroke-width="3">
    <animate attributeName="stroke" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.38;0.86;0.97" values="#ffb454;#6ea8fe;#7ee7c7;#ffb454"/>
    <animate attributeName="fill" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.86;0.97" values="#171a21;#7ee7c7;#171a21"/>
  </rect>
  <text x="790" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">LISTEN<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.38;0.97" values="1;0;1"/></text>
  <text x="790" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe" opacity="0">SYN_RECEIVED<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.38;0.86" values="0;1;0"/></text>
  <text x="790" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115" opacity="0">ESTABLISHED<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.86;0.97" values="0;1;0"/></text>

  <!-- lanes -->
  <g stroke="#3d4b60" stroke-width="2" stroke-dasharray="10 8">
    <line x1="305" y1="165" x2="655" y2="165"/>
    <line x1="305" y1="220" x2="655" y2="220"/>
    <line x1="305" y1="275" x2="655" y2="275"/>
  </g>

  <!-- SYN -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.17;0.19;0.37;0.39;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.18;0.38;1" values="0 0;0 0;220 0;220 0"/>
    <rect x="305" y="145" width="130" height="40" rx="20" fill="#6ea8fe"/>
    <text x="370" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">SYN →</text>
  </g>
  <!-- SYN+ACK -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.47;0.49;0.67;0.69;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.48;0.68;1" values="0 0;0 0;-220 0;-220 0"/>
    <rect x="525" y="200" width="130" height="40" rx="20" fill="#6ea8fe"/>
    <text x="590" y="229" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">← SYN+ACK</text>
  </g>
  <!-- ACK -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.71;0.73;0.85;0.87;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.72;0.86;1" values="0 0;0 0;220 0;220 0"/>
    <rect x="305" y="255" width="130" height="40" rx="20" fill="#7ee7c7"/>
    <text x="370" y="284" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">ACK →</text>
  </g>

  <!-- 25ms gap -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.86;0.89;0.95;0.97;1" values="0;0;1;1;0;0"/>
    <line x1="300" y1="318" x2="660" y2="318" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="480" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">서버는 약 25ms 늦게 연결</text>
  </g>

  <!-- caption bar -->
  <rect x="40" y="462" width="880" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec">서버는 <tspan fill="#ffb454" font-weight="700">LISTEN</tspan>: 문 열고 손님을 기다려요<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.17;0.19;0.97;1" values="1;1;0;0;1"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">SYN을 보내면 <tspan fill="#6ea8fe" font-weight="700">SYN_SENT</tspan>, 받으면 <tspan fill="#6ea8fe" font-weight="700">SYN_RECEIVED</tspan><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.17;0.19;0.47;0.49;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">SYN+ACK를 받은 클라이언트가 먼저 <tspan fill="#7ee7c7" font-weight="700">ESTABLISHED</tspan><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.47;0.49;0.71;0.73;1" values="0;0;1;1;0;0"/></text>
  <text x="480" y="501" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">마지막 ACK가 닿아야 서버도 <tspan fill="#7ee7c7" font-weight="700">ESTABLISHED</tspan><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.71;0.73;0.95;0.97;1" values="0;0;1;1;0;0"/></text>
</svg>
