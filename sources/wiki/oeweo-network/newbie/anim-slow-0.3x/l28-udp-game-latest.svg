<text x="480" y="473" font-size="26" font-weight="400" fill="#e6e8ec" text-anchor="middle">서버가 캐릭터 위치 1, 2번을 화면으로 보냅니다<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.25;0.975;1"  dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="473" font-size="26" font-weight="400" fill="#e6e8ec" text-anchor="middle" opacity="0">두 줄 모두 3번이 길에서 사라졌습니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.50;1"  dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="473" font-size="26" font-weight="400" fill="#e6e8ec" text-anchor="middle" opacity="0">TCP는 3번을 기다리며 멈추고, UDP는 4·5번으로 넘어갑니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.77;0.79;1"  dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="473" font-size="26" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">실시간 게임은 최신이 우선이라 UDP를 씁니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.80;0.95;0.975;1"  dur="33.333s" repeatCount="indefinite"/></text>
