<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 5<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.13;0.14;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.14;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.68;0.69;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.84;0.85;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">5 / 5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.85;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>
<text x="480" y="54" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">아래 층이 흔들리면 위 층이 무너진다</text>

<!-- 땅 -->
<line x1="220" y1="422" x2="740" y2="422" stroke="#3d4b60" stroke-width="4"/>

<!-- 층 이름 -->
<text x="282" y="148" text-anchor="end" font-size="24" fill="#9aa3b2">3층</text>
<text x="282" y="268" text-anchor="end" font-size="24" fill="#9aa3b2">2층</text>
<text x="282" y="388" text-anchor="end" font-size="24" fill="#9aa3b2">1층</text>

<!-- 빈 자리(정지 화면에서도 읽히도록) -->
<g fill="none" stroke="#3d4b60" stroke-width="2" stroke-dasharray="8 6">
<rect x="300" y="100" width="360" height="80" rx="8"/>
<rect x="300" y="220" width="360" height="80" rx="8"/>
<rect x="300" y="340" width="360" height="80" rx="8"/>
</g>
<g font-size="28" text-anchor="middle" fill="#5c6677">
<text x="480" y="150">공통 언어</text>
<text x="480" y="270">말로 대화</text>
<text x="480" y="390">공기 중 2m 이내</text>
</g>

<!-- 1층 -->
<g opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.03;0.10;0.95;0.99;1" values="0;0;1;1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.03;0.10;0.99;1" values="0 30;0 30;0 0;0 0;0 30"/>
<rect x="300" y="340" width="360" height="80" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="300" y="340" width="360" height="80" rx="8" fill="#7ee7c7" fill-opacity="0.18" stroke="#7ee7c7" stroke-width="3" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.12;0.15;0.50;0.53;0.80;0.83;1" values="0;0;1;1;0;0;1;1"/>
</rect>
<rect x="300" y="340" width="360" height="80" rx="8" fill="#ffb454" fill-opacity="0.25" stroke="#ffb454" stroke-width="4" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.53;0.56;0.59;0.62;0.65;0.68;0.71;0.74;0.77;0.80;0.83;1" values="0;0;1;0.3;1;0.3;1;0.3;1;0.3;1;1;0;0"/>
</rect>
<text x="480" y="390" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">공기 중 2m 이내<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.52;0.80;0.82;1" values="1;1;0;0;1;1"/></text>
<text x="480" y="390" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb454" opacity="0">진공 (공기 없음)<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.51;0.53;0.79;0.81;1" values="0;0;1;1;0;0"/></text>
</g>

<!-- 2층 -->
<g opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.20;0.26;0.95;0.99;1" values="0;0;1;1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.20;0.26;0.99;1" values="0 -30;0 -30;0 0;0 0;0 -30"/>
<rect x="300" y="220" width="360" height="80" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="300" y="220" width="360" height="80" rx="8" fill="#7ee7c7" fill-opacity="0.18" stroke="#7ee7c7" stroke-width="3" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.26;0.29;0.58;0.61;0.84;0.87;1" values="0;0;1;1;0;0;1;1"/>
</rect>
<text x="480" y="270" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">말로 대화<animate attributeName="fill" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.58;0.61;0.84;0.87;1" values="#e6e8ec;#e6e8ec;#5c6677;#5c6677;#e6e8ec;#e6e8ec"/></text>
<g stroke="#ffb454" stroke-width="6" stroke-linecap="round" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.59;0.62;0.84;0.86;1" values="0;0;1;1;0;0"/>
<line x1="610" y1="244" x2="642" y2="276"/><line x1="642" y1="244" x2="610" y2="276"/>
</g>
</g>

<!-- 3층 -->
<g opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.34;0.40;0.95;0.99;1" values="0;0;1;1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.34;0.40;0.99;1" values="0 -30;0 -30;0 0;0 0;0 -30"/>
<rect x="300" y="100" width="360" height="80" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="300" y="100" width="360" height="80" rx="8" fill="#7ee7c7" fill-opacity="0.18" stroke="#7ee7c7" stroke-width="3" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.40;0.43;0.66;0.69;0.88;0.91;1" values="0;0;1;1;0;0;1;1"/>
</rect>
<text x="480" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">공통 언어<animate attributeName="fill" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.66;0.69;0.88;0.91;1" values="#e6e8ec;#e6e8ec;#5c6677;#5c6677;#e6e8ec;#e6e8ec"/></text>
<g stroke="#ffb454" stroke-width="6" stroke-linecap="round" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.67;0.70;0.88;0.90;1" values="0;0;1;1;0;0"/>
<line x1="610" y1="124" x2="642" y2="156"/><line x1="642" y1="124" x2="610" y2="156"/>
</g>
</g>

<!-- 전제 화살표 (위 → 아래) -->
<g fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3" font-size="24" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.27;0.31;0.95;0.99;1" values="0;0;1;1;0;0"/>
<line x1="470" y1="303" x2="470" y2="328"/><path d="M462 326 L478 326 L470 337 Z" stroke="none"/>
<text x="486" y="329" stroke="none">전제</text>
</g>
<g fill="#6ea8fe" stroke="#6ea8fe" stroke-width="3" font-size="24" opacity="0">
<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.41;0.45;0.95;0.99;1" values="0;0;1;1;0;0"/>
<line x1="470" y1="183" x2="470" y2="208"/><path d="M462 206 L478 206 L470 217 Z" stroke="none"/>
<text x="486" y="209" stroke="none">전제</text>
</g>

<!-- 자막 바 -->
<rect x="0" y="448" width="960" height="92" fill="#171a21"/>
<line x1="0" y1="448" x2="960" y2="448" stroke="#3d4b60" stroke-width="2"/>
<g font-size="28" text-anchor="middle" font-weight="600">
<text x="480" y="504" fill="#7ee7c7">아래가 위의 전제 — 아래가 무너지면 위도 못 쓴다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.09;0.12;0.83;0.86;1" values="1;1;0;0;1;1"/></text>
<text x="480" y="504" fill="#e6e8ec" opacity="0">조건을 아래에서부터 한 층씩 쌓는다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.12;0.15;0.46;0.49;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="504" fill="#ffb454" opacity="0">1층이 진공이 되면 소리가 전해지지 않는다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.49;0.52;0.64;0.67;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="504" fill="#e6e8ec" opacity="0">2층·3층은 멀쩡해도 함께 멈춘다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.67;0.70;0.80;0.83;1" values="0;0;1;1;0;0"/></text>
</g>
</svg>
