<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>

  <!-- 제목 = 결론 (정지 화면·마지막 프레임에서도 보임) -->
  <text x="480" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#e6e8ec">DNS: 안내를 따라 내려가 마지막에 IP를 얻는다</text>

  <!-- 계층 연결선 -->
  <g stroke="#3d4b60" stroke-width="3">
    <line x1="470" y1="134" x2="470" y2="154"/>
    <line x1="470" y1="206" x2="470" y2="226"/>
    <line x1="470" y1="278" x2="470" y2="316" stroke-dasharray="6 6"/>
    <line x1="610" y1="364" x2="680" y2="364"/>
  </g>

  <!-- 서버 층: Root / .com / naver.com -->
  <g opacity="0.35">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0.35;1;1;0.35" keyTimes="0;0.06;0.95;1"/>
    <rect x="330" y="82" width="280" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
    <text x="470" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">Root (루트)</text>
  </g>
  <g opacity="0.35">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35" keyTimes="0;0.06;0.12;0.95;1"/>
    <rect x="330" y="154" width="280" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
    <text x="470" y="189" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">.com 담당 서버</text>
  </g>
  <g opacity="0.35">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35" keyTimes="0;0.12;0.18;0.95;1"/>
    <rect x="330" y="226" width="280" height="52" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
    <text x="470" y="261" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">naver.com 담당 서버</text>
  </g>

  <!-- 캐시 DNS -->
  <rect x="330" y="316" width="280" height="96" rx="12" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
  <text x="470" y="347" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">캐시 DNS
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.77;0.78;0.95;1"/>
  </text>
  <text x="470" y="347" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7" opacity="0">캐시 DNS에 저장
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.77;0.78;0.95;1"/>
  </text>

  <!-- 내 PC -->
  <rect x="680" y="316" width="230" height="96" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="795" y="347" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">내 PC</text>

  <!-- 질문 (캐시 DNS에서 출발해 위에서 아래로 따라감) -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
      values="0 0;0 0;0 -250;0 -250;0 -178;0 -178;0 -106;0 -106;0 0;0 0"
      keyTimes="0;0.2;0.27;0.36;0.41;0.47;0.52;0.94;0.95;1"/>
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.68;0.72;0.95;1"/>
    <rect x="70" y="336" width="230" height="44" rx="22" fill="#e6e8ec"/>
    <text x="185" y="366" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">www.naver.com?</text>
    <path d="M306 348 L322 358 L306 368 Z" fill="#e6e8ec"/>
  </g>

  <!-- 쪽지 1: Root의 안내 (파랑) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.28;0.31;0.95;1"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" values="-24 0;-24 0;0 0;0 0" keyTimes="0;0.28;0.31;1"/>
    <path d="M630 86 H896 L910 100 V130 H630 Z" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="770" y="117" text-anchor="middle" font-size="24" font-weight="600" fill="#6ea8fe">.com 담당은 여기</text>
  </g>

  <!-- 쪽지 2: .com의 안내 (파랑) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.45;0.95;1"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" values="-24 0;-24 0;0 0;0 0" keyTimes="0;0.42;0.45;1"/>
    <path d="M630 158 H896 L910 172 V202 H630 Z" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
    <text x="770" y="189" text-anchor="middle" font-size="24" font-weight="600" fill="#6ea8fe">naver.com 담당은 여기</text>
  </g>

  <!-- 최종 답: IP (초록) → 캐시 DNS에 저장 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.95;0.99;1"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" values="0 0;0 0;-290 130;-290 130;0 0" keyTimes="0;0.72;0.78;0.99;1"/>
    <rect x="630" y="230" width="260" height="44" rx="8" fill="#7ee7c7"/>
    <text x="760" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">www = 203.0.113.10</text>
  </g>

  <!-- 캐시 DNS → PC로 전달 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.80;0.81;0.95;0.99;1"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" values="-300 0;-300 0;0 0;0 0;-300 0" keyTimes="0;0.81;0.87;0.99;1"/>
    <rect x="695" y="362" width="200" height="40" rx="8" fill="#7ee7c7"/>
    <text x="795" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1115">203.0.113.10</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="448" width="880" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" fill="#e6e8ec" text-anchor="middle">
    <text x="480" y="490">캐시 DNS가 www.naver.com의 IP를 찾아 나섭니다
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.23;0.95;1"/>
    </text>
    <text x="480" y="490" opacity="0">Root와 .com은 IP 대신 ‘다음 담당’ 쪽지를 줍니다
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.51;0.54;1"/>
    </text>
    <text x="480" y="490" opacity="0">naver.com 담당 서버가 최종 IP를 알려 줍니다
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.55;0.74;0.77;1"/>
    </text>
    <text x="480" y="490" opacity="0"><tspan fill="#6ea8fe">파란 쪽지 = 안내</tspan>,  <tspan fill="#7ee7c7">초록 = 최종 IP</tspan> → 캐시 저장 후 PC로
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.95;1"/>
    </text>
  </g>
</svg>
