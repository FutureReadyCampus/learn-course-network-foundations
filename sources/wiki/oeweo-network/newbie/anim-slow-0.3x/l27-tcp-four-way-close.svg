<rect x="24" y="452" width="912" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="493" font-size="24" fill="#e6e8ec" text-anchor="middle" opacity="1">끊을 때도 인사가 오간다: <tspan fill="#ffb454">FIN</tspan> = 끝낼게요, <tspan fill="#6ea8fe">ACK</tspan> = 알겠어요<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.000;0.200;0.215;0.960;0.980;1.000" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="493" font-size="24" fill="#e6e8ec" text-anchor="middle" opacity="0">클라이언트 FIN → 서버 ACK, 이것이 첫 번째 쌍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.200;0.215;0.500;0.515;1.000" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="493" font-size="24" fill="#e6e8ec" text-anchor="middle" opacity="0">서버도 FIN → 클라이언트 ACK, 두 번째 쌍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.500;0.515;0.770;0.785;1.000" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="493" font-size="24" fill="#e6e8ec" text-anchor="middle" opacity="0">두 쌍 = 네 번, 그 사이 양쪽 상태가 단계마다 바뀐다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.770;0.785;0.950;0.965;1.000" dur="33.333s" repeatCount="indefinite"/></text>
