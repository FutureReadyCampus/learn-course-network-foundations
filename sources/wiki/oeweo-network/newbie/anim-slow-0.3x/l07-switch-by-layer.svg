<text x="345" y="298" font-size="24" font-weight="700" fill="#9aa3b2">IP</text>
<text x="855" y="300" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec">203.0.113.5</text>
<g opacity="0"><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.325;0.355;0.475;0.495;0.775;0.81;0.95;0.99;1" values="0;0;1;1;0;0;0.6;0.6;0;0"/>
