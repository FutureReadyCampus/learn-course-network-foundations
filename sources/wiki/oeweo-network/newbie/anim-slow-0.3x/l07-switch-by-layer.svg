<path d="M300,361 L314,370 L300,379" fill="none" stroke="#7ee7c7" stroke-width="4"/>
<rect x="320" y="336" width="560" height="68" rx="8" fill="#7ee7c7" fill-opacity="0.16" stroke="#7ee7c7" stroke-width="4"/>
<text x="345" y="378" font-size="24" font-weight="700" fill="#7ee7c7">MAC</text>
<text x="855" y="380" text-anchor="end" font-size="28" font-weight="700" fill="#7ee7c7">00:1A:2B:3C:4D:5E</text>
</g>
<rect x="40" y="436" width="880" height="76" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="484" text-anchor="middle" font-size="27" font-weight="700" fill="#e6e8ec" opacity="1">패킷 하나에 주소·번호 칸이 네 개 겹쳐 있어요<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.18;0.2;0.98;1" values="1;1;0;0;1"/></text>
<text x="480" y="484" text-anchor="middle" font-size="27" font-weight="700" fill="#e6e8ec" opacity="0">L2는 MAC 칸, L3는 IP 칸을 보고 길을 골라요<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.18;0.2;0.475;0.495;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="484" text-anchor="middle" font-size="27" font-weight="700" fill="#e6e8ec" opacity="0">L4는 포트 칸, L7은 HTTP 칸까지 읽어요<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.475;0.495;0.775;0.795;1" values="0;0;1;1;0;0"/></text>
<text x="480" y="484" text-anchor="middle" font-size="27" font-weight="700" fill="#7ee7c7" opacity="0">어느 칸을 보느냐가 스위치의 이름<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.775;0.795;0.96;0.98;1" values="0;0;1;1;0;0"/></text>
</svg>
