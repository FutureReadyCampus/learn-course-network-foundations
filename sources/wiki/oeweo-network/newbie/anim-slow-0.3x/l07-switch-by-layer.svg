<text x="855" y="220" text-anchor="end" font-size="28" font-weight="700" fill="#7ee7c7">443</text>
</g>
<rect x="40" y="260" width="200" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="140" y="299" text-anchor="middle" font-size="26" font-weight="700" fill="#9aa3b2">L3 스위치</text>
