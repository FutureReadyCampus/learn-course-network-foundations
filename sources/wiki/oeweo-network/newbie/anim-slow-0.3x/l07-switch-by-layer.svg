<path d="M300,281 L314,290 L300,299" fill="none" stroke="#7ee7c7" stroke-width="4"/>
<rect x="320" y="256" width="560" height="68" rx="8" fill="#7ee7c7" fill-opacity="0.16" stroke="#7ee7c7" stroke-width="4"/>
<text x="345" y="298" font-size="24" font-weight="700" fill="#7ee7c7">IP</text>
<text x="855" y="300" text-anchor="end" font-size="28" font-weight="700" fill="#7ee7c7">203.0.113.5</text>
</g>
<rect x="40" y="340" width="200" height="60" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="140" y="379" text-anchor="middle" font-size="26" font-weight="700" fill="#9aa3b2">L2 스위치</text>
<rect x="320" y="336" width="560" height="68" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="345" y="378" font-size="24" font-weight="700" fill="#9aa3b2">MAC</text>
<text x="855" y="380" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec">00:1A:2B:3C:4D:5E</text>
<g opacity="0"><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.175;0.205;0.325;0.345;0.775;0.81;0.95;0.99;1" values="0;0;1;1;0;0;0.6;0.6;0;0"/>
