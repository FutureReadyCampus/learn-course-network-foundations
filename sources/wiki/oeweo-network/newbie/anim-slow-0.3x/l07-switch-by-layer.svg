<text x="855" y="220" text-anchor="end" font-size="28" font-weight="700" fill="#e6e8ec">443</text>
<g opacity="0"><animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.475;0.505;0.625;0.645;0.775;0.81;0.95;0.99;1" values="0;0;1;1;0;0;0.6;0.6;0;0"/>
