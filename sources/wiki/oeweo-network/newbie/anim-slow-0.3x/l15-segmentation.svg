<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>
<text x="480" y="50" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">긴 데이터를 MSS 조각으로 나누기</text>

<!-- socket -->
<text x="80" y="170" font-size="24" font-weight="700" fill="#9aa3b2" text-anchor="middle">소켓</text>
<rect x="40" y="180" width="80" height="110" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<rect x="104" y="196" width="16" height="78" rx="4" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
<text x="900" y="182" font-size="24" font-weight="700" fill="#e6e8ec" text-anchor="end">Stream 4,000,000바이트</text>

<!-- stream bar; later becomes the remaining 1,060-byte tail -->
<rect x="120" y="200" width="280" height="70" fill="#6ea8fe">
<animate attributeName="width" values="280;780;780;372;99;99;99;280" keyTimes="0;0.2;0.48;0.48;0.53;0.95;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="x" values="120;120;528;528;817;817;120;120" keyTimes="0;0.48;0.48;0.73;0.78;0.95;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="y" values="200;200;330;330;200;200" keyTimes="0;0.73;0.78;0.95;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="650" y="245" font-size="24" fill="#9aa3b2" opacity="0">… 2,740번째 조각까지 반복
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.71;0.73;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- pieces 1..3 -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.2;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;-1,130;-1,130;0,0" keyTimes="0;0.5;0.56;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="120" y="200" width="136" height="70" fill="#6ea8fe"/>
<text x="188" y="244" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle" opacity="0">1,460
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.27;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.2;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;75,130;75,130;0,0" keyTimes="0;0.57;0.63;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="256" y="200" width="136" height="70" fill="#6ea8fe"/>
<text x="324" y="244" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle" opacity="0">1,460
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.36;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.2;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;151,130;151,130;0,0" keyTimes="0;0.64;0.7;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="392" y="200" width="136" height="70" fill="#6ea8fe"/>
<text x="460" y="244" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle" opacity="0">1,460
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.45;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>

<!-- cut gaps -->
<g fill="#0f1115">
<rect x="254" y="200" width="4" height="70" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.48;0.48;1" dur="33.333s" repeatCount="indefinite"/></rect>
<rect x="390" y="200" width="4" height="70" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.34;0.57;0.57;1" dur="33.333s" repeatCount="indefinite"/></rect>
<rect x="526" y="200" width="4" height="70" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.43;0.64;0.64;1" dur="33.333s" repeatCount="indefinite"/></rect>
</g>

<!-- scissors marker -->
<g opacity="0" transform="translate(256,-60)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.46;0.49;1" dur="33.333s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="256,-60;256,-60;256,0;256,0;392,-60;392,0;392,0;528,-60;528,0;528,0;256,-60" keyTimes="0;0.2;0.25;0.29;0.31;0.34;0.38;0.4;0.43;0.5;1" dur="33.333s" repeatCount="indefinite"/>
<text x="0" y="132" font-size="24" font-weight="700" fill="#ffb454" text-anchor="middle">✂ MSS 1,460</text>
<path d="M-12 142 H12 L0 158 Z" fill="#ffb454"/>
<line x1="0" y1="160" x2="0" y2="282" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/>
</g>

<!-- headers + number tags -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="55" y="330" width="64" height="70" rx="6" fill="#ffb454"/>
<text x="87" y="358" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">TCP</text>
<text x="87" y="388" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">헤더</text>
<text x="155" y="434" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">1번</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.65;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="267" y="330" width="64" height="70" rx="6" fill="#ffb454"/>
<text x="299" y="358" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">TCP</text>
<text x="299" y="388" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">헤더</text>
<text x="367" y="434" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">2번</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.72;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="479" y="330" width="64" height="70" rx="6" fill="#ffb454"/>
<text x="511" y="358" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">TCP</text>
<text x="511" y="388" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">헤더</text>
<text x="579" y="434" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">3번</text>
<text x="716" y="374" font-size="34" font-weight="700" fill="#9aa3b2" text-anchor="middle">⋯</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="753" y="330" width="64" height="70" rx="6" fill="#ffb454"/>
<text x="785" y="358" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">TCP</text>
<text x="785" y="388" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">헤더</text>
<text x="866" y="374" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">1,060</text>
<text x="835" y="434" font-size="24" font-weight="700" fill="#7ee7c7" text-anchor="middle">2,740번</text>
</g>

<!-- conclusion -->
<text x="480" y="250" font-size="34" font-weight="700" fill="#7ee7c7" text-anchor="middle" opacity="0">Stream → Segment 여러 개
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.82;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- caption bar -->
<rect x="40" y="470" width="880" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="24" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="507">앱이 보낸 데이터는 끝없이 이어진 긴 줄(Stream)이에요
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.25;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" opacity="0">TCP가 MSS 1,460바이트마다 싹둑 잘라요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" opacity="0">조각마다 TCP 헤더와 번호를 붙이면 세그먼트예요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.77;0.79;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" opacity="0">남은 1,060바이트는 짧은 마지막 조각이 돼요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
</svg>
