<text x="480" y="510" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="1" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">RTT는 신호가 서버에 갔다가 돌아오는 시간입니다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0.0000;0.2100;0.2300;0.9600;1.0000" values="1;1;0;0;1"/></text>
<text x="480" y="510" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">세 사람이 동시에 서버로 신호를 보냅니다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0.0000;0.2200;0.2400;0.4400;0.4600;1.0000" values="0;0;1;1;0;0"/></text>
<text x="480" y="510" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">신호가 돌아오는 순간 시계가 멈춥니다<animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0.0000;0.4500;0.4700;0.7500;0.7700;1.0000" values="0;0;1;1;0;0"/></text>
