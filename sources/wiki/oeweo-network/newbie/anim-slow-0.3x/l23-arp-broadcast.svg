<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">모르면 모두에게 묻고, 주인만 대답한다</text>

<!-- 같은 선(구간) -->
<g stroke="#3d4b60" stroke-width="5" fill="none">
  <line x1="240" y1="230" x2="420" y2="230"/>
  <line x1="420" y1="130" x2="420" y2="330"/>
  <line x1="420" y1="130" x2="560" y2="130"/>
  <line x1="420" y1="230" x2="560" y2="230"/>
  <line x1="420" y1="330" x2="560" y2="330"/>
</g>

<!-- 물결 링 -->
<circle cx="140" cy="230" r="60" fill="none" stroke="#7ee7c7" stroke-width="4" opacity="0">
  <animate attributeName="r" values="60;60;200;200" keyTimes="0;0.2;0.45;1" dur="33.333s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.2;0.22;0.45;1" dur="33.333s" repeatCount="indefinite"/>
</circle>

<!-- PC -->
<rect x="40" y="190" width="200" height="80" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="140" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#e6e8ec">내 PC</text>
<text x="140" y="254" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.0.100</text>

<!-- 요청 말풍선 -->
<g>
  <animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.74;0.77;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  <rect x="20" y="88" width="380" height="58" rx="14" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
  <polygon points="118,144 150,144 132,186" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="140" width="28" height="6" fill="#171a21"/>
  <text x="210" y="126" text-anchor="middle" font-size="24" fill="#e6e8ec"><tspan fill="#7ee7c7" font-weight="700">ARP 요청:</tspan> 192.168.0.1 누구?</text>
</g>

<!-- 노트북 -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0 730 130;0 730 130;-4 730 130;4 730 130;-4 730 130;0 730 130;0 730 130" keyTimes="0;0.52;0.55;0.58;0.61;0.64;1" dur="33.333s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0.45;0.45;1" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  <rect x="560" y="92" width="340" height="76" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3">
    <animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#9aa3b2;#9aa3b2;#6ea8fe" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="123" font-size="26" font-weight="700" fill="#e6e8ec">노트북</text>
  <text x="580" y="155" font-size="24" fill="#9aa3b2">192.168.0.20</text>
  <text x="885" y="140" text-anchor="end" font-size="24" fill="#9aa3b2" opacity="0">✕ 아님
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
</g>

<!-- 프린터 -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0 730 230;0 730 230;4 730 230;-4 730 230;4 730 230;0 730 230;0 730 230" keyTimes="0;0.52;0.55;0.58;0.61;0.64;1" dur="33.333s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0.45;0.45;1" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  <rect x="560" y="192" width="340" height="76" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3">
    <animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#9aa3b2;#9aa3b2;#6ea8fe" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="223" font-size="26" font-weight="700" fill="#e6e8ec">프린터</text>
  <text x="580" y="255" font-size="24" fill="#9aa3b2">192.168.0.30</text>
  <text x="885" y="240" text-anchor="end" font-size="24" fill="#9aa3b2" opacity="0">✕ 아님
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
</g>

<!-- 게이트웨이 -->
<rect x="560" y="292" width="340" height="76" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3">
  <animate attributeName="stroke" values="#6ea8fe;#6ea8fe;#ffb454;#ffb454;#6ea8fe" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  <animate attributeName="fill" values="#171a21;#171a21;#3a2e18;#3a2e18;#171a21" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
  <animate attributeName="stroke-width" values="3;3;6;6;3" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="580" y="323" font-size="26" font-weight="700" fill="#e6e8ec">게이트웨이</text>
<text x="580" y="355" font-size="24" fill="#9aa3b2">192.168.0.1
  <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="885" y="340" text-anchor="end" font-size="24" font-weight="700" fill="#ffb454" opacity="0">★ 나예요!
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
</text>

<!-- 방송 점 3개: 같은 선을 따라 동시에 퍼짐 -->
<g fill="#7ee7c7">
  <circle r="11" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="245 230;245 230;420 230;420 130;552 130;552 130" keyTimes="0;0.2;0.3;0.4;0.48;1" dur="33.333s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.48;0.51;1" dur="33.333s" repeatCount="indefinite"/>
  </circle>
  <circle r="11" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="245 230;245 230;420 230;485 230;552 230;552 230" keyTimes="0;0.2;0.3;0.4;0.48;1" dur="33.333s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.48;0.51;1" dur="33.333s" repeatCount="indefinite"/>
  </circle>
  <circle r="11" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="245 230;245 230;420 230;420 330;552 330;552 330" keyTimes="0;0.2;0.3;0.4;0.48;1" dur="33.333s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.48;0.51;1" dur="33.333s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ARP 응답: 게이트웨이 → PC 한 줄 -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.77;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
  <path d="M556,352 H140 V284" fill="none" stroke="#ffb454" stroke-width="5" stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" values="500;500;0;0" keyTimes="0;0.76;0.8;1" dur="33.333s" repeatCount="indefinite"/>
  </path>
  <polygon points="140,272 128,290 152,290" fill="#ffb454" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.795;0.8;1" dur="33.333s" repeatCount="indefinite"/>
  </polygon>
  <rect x="160" y="366" width="400" height="76" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="2"/>
  <text x="178" y="396" font-size="24" fill="#e6e8ec"><tspan fill="#ffb454" font-weight="700">ARP 응답:</tspan> 내가 192.168.0.1</text>
  <text x="178" y="428" font-size="24" fill="#e6e8ec">MAC은 aa:bb:cc:dd:ee:ff</text>
</g>

<!-- 자막 바 -->
<rect x="40" y="458" width="880" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
  <text x="480" y="499">PC는 192.168.0.1의 MAC 주소를 몰라요
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.17;0.19;0.97;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="499" opacity="0">그래서 같은 선의 모두에게 한 번에 물어요(방송)
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.47;0.49;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="499" opacity="0">주소의 주인이 아닌 장치는 대답하지 않아요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.76;0.78;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="499" opacity="0" fill="#7ee7c7" font-weight="700">주인인 게이트웨이만 PC에게 대답해요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
