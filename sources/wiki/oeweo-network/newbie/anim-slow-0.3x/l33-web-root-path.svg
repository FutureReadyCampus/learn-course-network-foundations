<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.21;0.22;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.22;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.76;0.77;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.77;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>
<text x="480" y="52" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">주소의 / 는 서버가 열어 둔 로비</text>

<defs>
<clipPath id="typeClip">
<rect x="515" y="125" width="173" height="50">
<animate attributeName="width" values="173;173;360;360;173;173" keyTimes="0;0.2;0.48;0.74;0.77;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
</clipPath>
</defs>

<!-- LEFT: server folder tree -->
<rect x="30" y="80" width="430" height="360" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>

<!-- C:\ part (dims) -->
<g>
<animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.5;0.53;0.95;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="52" y="112" width="36" height="30" rx="4" fill="#3d4b60"/>
<line x1="58" y1="134" x2="82" y2="134" stroke="#9aa3b2" stroke-width="3"/>
<text x="98" y="137" font-size="26" font-weight="700" fill="#e6e8ec">C:\<tspan font-size="24" font-weight="400" fill="#9aa3b2"> 서버 디스크 전체</tspan></text>
<path d="M70,144 V192 H100" fill="none" stroke="#3d4b60" stroke-width="3"/>
</g>

<!-- tree connectors -->
<path d="M117,216 V375 H150 M117,261 H150 M168,276 V315 H200" fill="none" stroke="#3d4b60" stroke-width="3"/>

<!-- web root door -->
<rect x="94" y="162" width="46" height="60" rx="8" fill="#7ee7c7" opacity="0">
<animate attributeName="opacity" values="0;0;0.45;0.15;0.45;0.15;0;0" keyTimes="0;0.5;0.55;0.6;0.65;0.7;0.76;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<rect x="100" y="168" width="34" height="48" rx="4" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
<circle cx="126" cy="194" r="3" fill="#7ee7c7"/>
<text x="150" y="203" font-size="26" font-weight="700" fill="#7ee7c7">web</text>
<rect x="210" y="178" width="180" height="34" rx="17" fill="#0f1115" stroke="#7ee7c7" stroke-width="2"/>
<text x="300" y="203" font-size="24" fill="#7ee7c7" text-anchor="middle">웹 루트 = 로비</text>

<!-- data folder -->
<path d="M150,250 h12 l4,5 h20 v21 h-36 z" fill="#6ea8fe"/>
<text x="198" y="272" font-size="26" fill="#e6e8ec">data</text>
<!-- data/index.html -->
<rect x="200" y="300" width="24" height="30" rx="3" fill="#e6e8ec"/>
<text x="234" y="325" font-size="24" fill="#e6e8ec">index.html</text>
<!-- web/index.html (default) -->
<g>
<circle cx="162" cy="375" r="0" fill="#ffb454" opacity="0.4">
<animate attributeName="r" values="0;0;26;16;26;16;0;0" keyTimes="0;0.77;0.8;0.84;0.88;0.92;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</circle>
<rect x="150" y="360" width="24" height="30" rx="3" fill="#e6e8ec"/>
<text x="184" y="385" font-size="24" fill="#e6e8ec">index.html</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect x="318" y="361" width="128" height="34" rx="17" fill="#ffb454"/>
<text x="382" y="386" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">기본 문서</text>
</g>

<!-- RIGHT: browser -->
<rect x="490" y="90" width="440" height="160" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<circle cx="512" cy="108" r="5" fill="#3d4b60"/><circle cx="530" cy="108" r="5" fill="#3d4b60"/><circle cx="548" cy="108" r="5" fill="#3d4b60"/>
<rect x="505" y="125" width="410" height="50" rx="10" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/>
<g clip-path="url(#typeClip)">
<text x="520" y="159" font-size="24" fill="#e6e8ec" textLength="168" lengthAdjust="spacingAndGlyphs">www.test.co.kr</text>
<text x="690" y="159" font-size="24" fill="#e6e8ec" textLength="180" lengthAdjust="spacingAndGlyphs">/data/index.html<animate attributeName="fill" values="#e6e8ec;#e6e8ec;#7ee7c7;#7ee7c7;#e6e8ec;#e6e8ec" keyTimes="0;0.5;0.52;0.74;0.76;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>

<!-- path line: / -> web root door -> data -> index.html -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.74;0.76;1" dur="33.333s" repeatCount="indefinite"/>
<path d="M693,177 V226 H117 V261 H168 V315 H200" fill="none" stroke="#7ee7c7" stroke-width="5" stroke-linejoin="round" stroke-dasharray="800" stroke-dashoffset="800">
<animate attributeName="stroke-dashoffset" values="800;800;0;0;800" keyTimes="0;0.53;0.68;0.8;1" dur="33.333s" repeatCount="indefinite"/>
</path>
<text x="706" y="214" font-size="24" font-weight="700" fill="#7ee7c7">← / 는 웹 루트</text>
</g>

<!-- compare box -->
<rect x="490" y="268" width="440" height="172" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g>
<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.48;0.5;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
<text x="710" y="342" font-size="28" fill="#9aa3b2" text-anchor="middle">주소의 경로는</text>
<text x="710" y="384" font-size="28" fill="#e6e8ec" text-anchor="middle">어디서부터 시작할까?</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.74;0.76;1" dur="33.333s" repeatCount="indefinite"/>
<text x="512" y="303" font-size="24" fill="#9aa3b2">디스크 속 실제 위치</text>
<text x="512" y="340" font-size="26" fill="#e6e8ec"><tspan fill="#9aa3b2" text-decoration="line-through">C:\web</tspan><tspan fill="#7ee7c7">\data\index.html</tspan></text>
<text x="512" y="384" font-size="24" fill="#9aa3b2">주소에 적는 것</text>
<text x="512" y="421" font-size="26" font-weight="700" fill="#7ee7c7">/data/index.html</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<text x="512" y="303" font-size="24" fill="#9aa3b2">경로를 생략하면</text>
<text x="512" y="340" font-size="26" font-weight="700" fill="#e6e8ec">www.test.co.kr</text>
<text x="512" y="384" font-size="24" fill="#9aa3b2">서버가 정한 기본 문서</text>
<text x="512" y="421" font-size="26" font-weight="700" fill="#ffb454">→ web 안의 index.html</text>
</g>

<!-- caption bar -->
<rect x="0" y="460" width="960" height="80" fill="#171a21"/>
<line x1="0" y1="460" x2="960" y2="460" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="510">서버 디스크는 C:\ 부터, 그 안의 web이 웹 루트(로비)예요<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.21;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="510" opacity="0">주소창에 www.test.co.kr/data/index.html 을 적으면<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.48;0.5;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="510" opacity="0">주소의 / 는 C:\ 가 아니라 웹 루트에서 출발해요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.74;0.76;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="510" opacity="0" fill="#7ee7c7" font-weight="700">경로를 빼면 웹 루트의 기본 문서 index.html이 나와요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.78;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
</svg>
