<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.27;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.27;0.51;0.52;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.52;0.79;0.8;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.8;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>

  <!-- 제목 = 핵심 결론 (항상 보임) -->
  <text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">단편화: 나누고 <tspan fill="#7ee7c7">헤더를 새로 붙여</tspan> 두 패킷으로</text>

  <!-- 문: MTU 1,400 (고정) -->
  <text x="800" y="100" text-anchor="middle" font-size="26" font-weight="700" fill="#ffb454">MTU 1,400 <tspan font-weight="400" fill="#9aa3b2">이하만 통과</tspan></text>
  <rect x="770" y="116" width="30" height="94" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
  <rect x="770" y="310" width="30" height="110" rx="4" fill="#171a21" stroke="#ffb454" stroke-width="3"/>

  <!-- 원래 패킷 1,500 (0~3초) -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
      keyTimes="0;0.2;0.215;0.23;0.949;0.95;1" values="0,0;236,0;224,0;236,0;236,0;0,0;0,0"/>
    <g>
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.3;0.4;0.95;1" values="1;1;0;0;1"/>
      <text x="285" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">패킷 1,500</text>
      <rect x="40" y="220" width="110" height="80" rx="6" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
      <text x="95" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#6ea8fe">IP 헤더</text>
      <text x="95" y="284" text-anchor="middle" font-size="24" fill="#6ea8fe">20</text>
    </g>
    <g>
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.3;0.301;0.95;1" values="1;1;0;0;1"/>
      <rect x="150" y="220" width="380" height="80" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/>
      <text x="340" y="269" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">Payload 1,480</text>
    </g>
  </g>

  <!-- 부딪힘 표시 (2~4.8초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.45;0.48;1" values="0;0;1;1;0;0"/>
    <rect x="520" y="130" width="240" height="46" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="640" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">1,500 &gt; 1,400 막힘</text>
  </g>

  <!-- 쪼개기 표시 (2.8~5초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.28;0.31;0.48;0.51;1" values="0;0;1;1;0;0"/>
    <line x1="666" y1="206" x2="666" y2="322" stroke="#ffb454" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="610" y="330" width="112" height="44" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="666" y="361" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">쪼개기</text>
  </g>

  <!-- 조각 패킷 A -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
      keyTimes="0;0.8;0.95;1" values="0,0;0,0;480,0;480,0"/>
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.95;0.97;1" values="1;1;0;0"/>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.3;0.301;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
        keyTimes="0;0.36;0.46;1" values="0,0;0,0;-156,0;-156,0"/>
      <rect x="386" y="220" width="280" height="80" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/>
      <text x="526" y="269" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">A 1,376</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.5;0.58;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
        keyTimes="0;0.5;0.58;1" values="0,-50;0,-50;0,0;0,0"/>
      <rect x="120" y="220" width="110" height="80" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
      <text x="175" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">새 헤더</text>
      <text x="175" y="284" text-anchor="middle" font-size="24" fill="#7ee7c7">20</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.58;0.62;0.8;0.82;1" values="0;0;1;1;0;0"/>
      <rect x="120" y="112" width="260" height="84" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
      <text x="140" y="146" font-size="24" font-weight="700" fill="#ffb454">Flag: 뒤에 더 있음</text>
      <text x="140" y="180" font-size="24" fill="#e6e8ec">Offset: 0</text>
      <line x1="175" y1="196" x2="175" y2="218" stroke="#3d4b60" stroke-width="3"/>
    </g>
  </g>

  <!-- 조각 패킷 B -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
      keyTimes="0;0.8;0.95;1" values="0,0;0,0;480,0;480,0"/>
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.95;0.97;1" values="1;1;0;0"/>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.3;0.301;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
        keyTimes="0;0.36;0.46;1" values="0,0;0,0;-16,0;-16,0"/>
      <rect x="666" y="220" width="100" height="80" rx="6" fill="#171a21" stroke="#e6e8ec" stroke-width="3"/>
      <text x="716" y="269" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">B 104</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.52;0.6;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite"
        keyTimes="0;0.52;0.6;1" values="0,-50;0,-50;0,0;0,0"/>
      <rect x="540" y="220" width="110" height="80" rx="6" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
      <text x="595" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7">새 헤더</text>
      <text x="595" y="284" text-anchor="middle" font-size="24" fill="#7ee7c7">20</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.6;0.64;0.8;0.82;1" values="0;0;1;1;0;0"/>
      <rect x="530" y="112" width="226" height="84" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
      <text x="550" y="146" font-size="24" font-weight="700" fill="#7ee7c7">Flag: 마지막</text>
      <text x="550" y="180" font-size="24" fill="#e6e8ec">Offset: 172</text>
      <line x1="595" y1="196" x2="595" y2="218" stroke="#3d4b60" stroke-width="3"/>
    </g>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="448" width="880" height="66" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="490">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.23;0.26;0.97;1" values="1;1;0;0;1"/>
      1,500 패킷이 1,400까지만 지나는 문을 만났어요</text>
    <text x="480" y="490" opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.25;0.28;0.48;0.51;1" values="0;0;1;1;0;0"/>
      너무 커서 막혀요 → 내용물(Payload)을 A, B로 쪼개요</text>
    <text x="480" y="490" opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.5;0.53;0.76;0.79;1" values="0;0;1;1;0;0"/>
      조각마다 새 IP 헤더를 붙이고 Flag·Offset을 다르게 적어요</text>
    <text x="480" y="490" opacity="0" font-weight="700" fill="#7ee7c7">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.78;0.81;0.95;0.97;1" values="0;0;1;1;0;0"/>
      원래 한 패킷 → 지금은 두 패킷</text>
  </g>
</svg>
