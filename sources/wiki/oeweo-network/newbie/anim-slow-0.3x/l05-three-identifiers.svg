<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.21;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.5;0.51;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.76;0.77;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.77;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>

  <!-- 제목 -->
  <text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">세 식별자는 무엇을 가리킬까</text>

  <!-- 건물 = 호스트 (항상 보임: 0초 썸네일) -->
  <polygon points="50,182 280,128 510,182" fill="#171a21" stroke="#7ee7c7" stroke-width="3" stroke-linejoin="round"/>
  <text x="280" y="172" text-anchor="middle" font-size="28" font-weight="700" fill="#7ee7c7">호스트</text>
  <rect x="70" y="182" width="420" height="258" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <line x1="40" y1="440" x2="520" y2="440" stroke="#3d4b60" stroke-width="3"/>

  <!-- IP 간판: 지붕 위로 내려온다 (5~5.6초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.54;0.95;0.98;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.56;0.95;0.99;1" values="0,-60;0,-60;0,0;0,0;0,-60;0,-60"/>
    <line x1="230" y1="116" x2="230" y2="134" stroke="#7ee7c7" stroke-width="3"/>
    <line x1="330" y1="116" x2="330" y2="134" stroke="#7ee7c7" stroke-width="3"/>
    <rect x="170" y="74" width="220" height="44" rx="8" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/>
    <text x="280" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7">192.168.0.10</text>
  </g>

  <!-- 안쪽 방: 호수 = 포트 번호 (7.6초~) -->
  <rect x="120" y="196" width="130" height="90" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <rect x="310" y="196" width="130" height="90" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.80;0.95;0.98;1" values="0;0;1;1;0;0"/>
    <rect x="120" y="196" width="130" height="90" rx="6" fill="#ffb454" fill-opacity="0.15" stroke="#ffb454" stroke-width="3"/>
    <rect x="310" y="196" width="130" height="90" rx="6" fill="#ffb454" fill-opacity="0.15" stroke="#ffb454" stroke-width="3"/>
    <text x="185" y="236" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">80</text>
    <text x="185" y="272" text-anchor="middle" font-size="24" fill="#e6e8ec">웹</text>
    <text x="375" y="236" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">443</text>
    <text x="375" y="272" text-anchor="middle" font-size="24" fill="#e6e8ec">보안 웹</text>
  </g>

  <!-- 출입문 = NIC. 문간에 NIC 글자, 문짝이 열리면 드러난다 -->
  <g font-size="24" font-weight="700" text-anchor="middle" fill="#6ea8fe">
    <rect x="105" y="336" width="70" height="104" fill="#6ea8fe" fill-opacity="0.15" stroke="#6ea8fe" stroke-width="2"/>
    <rect x="245" y="336" width="70" height="104" fill="#6ea8fe" fill-opacity="0.15" stroke="#6ea8fe" stroke-width="2"/>
    <rect x="385" y="336" width="70" height="104" fill="#6ea8fe" fill-opacity="0.15" stroke="#6ea8fe" stroke-width="2"/>
    <text x="146" y="396">NIC</text>
    <text x="286" y="396">NIC</text>
    <text x="426" y="396">NIC</text>
  </g>
  <rect x="105" y="336" width="70" height="104" fill="#3d4b60" stroke="#9aa3b2" stroke-width="2">
    <animate attributeName="width" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.20;0.24;0.95;0.99;1" values="70;70;12;12;70;70"/>
  </rect>
  <rect x="245" y="336" width="70" height="104" fill="#3d4b60" stroke="#9aa3b2" stroke-width="2">
    <animate attributeName="width" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.28;0.32;0.95;0.99;1" values="70;70;12;12;70;70"/>
  </rect>
  <rect x="385" y="336" width="70" height="104" fill="#3d4b60" stroke="#9aa3b2" stroke-width="2">
    <animate attributeName="width" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.36;0.40;0.95;0.99;1" values="70;70;12;12;70;70"/>
  </rect>

  <!-- MAC 표찰: 문 위에 하나씩 -->
  <g font-size="24" font-weight="700" text-anchor="middle" fill="#0f1115">
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.21;0.24;0.95;0.98;1" values="0;0;1;1;0;0"/>
      <rect x="100" y="298" width="80" height="32" rx="6" fill="#6ea8fe"/><text x="140" y="322">MAC</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.29;0.32;0.95;0.98;1" values="0;0;1;1;0;0"/>
      <rect x="240" y="298" width="80" height="32" rx="6" fill="#6ea8fe"/><text x="280" y="322">MAC</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.37;0.40;0.95;0.98;1" values="0;0;1;1;0;0"/>
      <rect x="380" y="298" width="80" height="32" rx="6" fill="#6ea8fe"/><text x="420" y="322">MAC</text>
    </g>
  </g>

  <!-- 문 옆 케이블 구멍(= L2 '포트'): 8초 무렵 깜박 -->
  <g fill="#0f1115" stroke="#9aa3b2" stroke-width="3">
    <animate attributeName="stroke" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.80;0.84;0.88;0.92;0.96;1" values="#9aa3b2;#9aa3b2;#ffb454;#9aa3b2;#ffb454;#ffb454;#9aa3b2;#9aa3b2"/>
    <rect x="182" y="404" width="18" height="18" rx="3"/>
    <rect x="322" y="404" width="18" height="18" rx="3"/>
    <rect x="462" y="404" width="18" height="18" rx="3"/>
  </g>

  <!-- 오른쪽 정리판: 차례로 밝아진다 -->
  <rect x="540" y="128" width="380" height="312" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" font-weight="700">
    <g opacity="0.4">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.20;0.24;0.95;0.99;1" values="0.4;0.4;1;1;0.4;0.4"/>
      <text x="564" y="182" fill="#6ea8fe">MAC 주소 → NIC</text>
    </g>
    <g opacity="0.4">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.54;0.95;0.99;1" values="0.4;0.4;1;1;0.4;0.4"/>
      <text x="564" y="252" fill="#7ee7c7">IP 주소 → 호스트</text>
    </g>
    <g opacity="0.4">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.80;0.95;0.99;1" values="0.4;0.4;1;1;0.4;0.4"/>
      <text x="564" y="322" fill="#ffb454">포트 번호 → 서비스·프로세스</text>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.95;0.98;1" values="0;0;1;1;0;0"/>
    <rect x="556" y="356" width="348" height="64" rx="10" fill="#0f1115" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="730" y="397" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">같은 ‘포트’라는 말, 다른 대상</text>
  </g>

  <!-- 자막 바 -->
  <rect x="40" y="462" width="880" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
  <g font-size="26" text-anchor="middle" fill="#e6e8ec">
    <text x="480" y="503">큰 건물 하나 = 호스트 한 대
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.18;0.20;0.98;1" values="1;1;0;0;1"/>
    </text>
    <text x="480" y="503" opacity="0">출입문 하나 = NIC, 문마다 붙은 표찰 = MAC 주소
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.20;0.22;0.48;0.50;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="503" opacity="0">지붕 간판 = IP 주소, 건물(호스트) 전체를 가리킴
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.50;0.52;0.74;0.76;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="480" y="503" opacity="0" fill="#7ee7c7" font-weight="700">방 호수 = 포트 번호 · ‘포트’는 문맥으로 구별
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.76;0.78;0.96;0.98;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
