<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<defs>
  <g id="letter">
    <rect x="0" y="0" width="90" height="52" rx="4" fill="#e6e8ec"/>
    <path d="M0 4 L45 28 L90 4" fill="none" stroke="#9aa3b2" stroke-width="2"/>
    <text x="45" y="44" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">HTML</text>
  </g>
</defs>

<text x="480" y="52" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">세 겹의 웹: 문서 · 배달 규칙 · 길</text>

<!-- floors -->
<rect x="20" y="76" width="920" height="100" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="20" y="186" width="920" height="100" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<rect x="20" y="296" width="920" height="100" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<line x1="250" y1="392" x2="930" y2="392" stroke="#3d4b60" stroke-width="3"/>
<line x1="250" y1="392" x2="930" y2="392" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="18 14" opacity="0.6"/>

<!-- floor tags -->
<text x="40" y="118" font-size="26" font-weight="700" fill="#7ee7c7">HTML 문서</text>
<text x="40" y="154" font-size="24" fill="#9aa3b2">문서(내용)
  <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#7ee7c7;#7ee7c7;#9aa3b2;#9aa3b2" keyTimes="0;0.86;0.88;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="40" y="228" font-size="26" font-weight="700" fill="#ffb454">HTTP</text>
<text x="40" y="264" font-size="24" fill="#9aa3b2">배달 규칙
  <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2;#9aa3b2" keyTimes="0;0.86;0.88;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="40" y="338" font-size="26" font-weight="700" fill="#6ea8fe">인터넷(TCP/IP)</text>
<text x="40" y="374" font-size="24" fill="#9aa3b2">길(도로)
  <animate attributeName="fill" values="#9aa3b2;#9aa3b2;#6ea8fe;#6ea8fe;#9aa3b2;#9aa3b2" keyTimes="0;0.86;0.88;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>

<!-- server -->
<g>
  <rect x="250" y="86" width="80" height="54" rx="6" fill="#0f1115" stroke="#3d4b60" stroke-width="2"/>
  <line x1="260" y1="102" x2="320" y2="102" stroke="#9aa3b2" stroke-width="3"/>
  <line x1="260" y1="114" x2="320" y2="114" stroke="#9aa3b2" stroke-width="3"/>
  <circle cx="312" cy="128" r="4" fill="#7ee7c7"/>
  <text x="290" y="166" font-size="24" fill="#e6e8ec" text-anchor="middle">서버</text>
</g>

<!-- browser -->
<g>
  <rect x="700" y="82" width="230" height="90" rx="8" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/>
  <line x1="700" y1="112" x2="930" y2="112" stroke="#3d4b60" stroke-width="2"/>
  <circle cx="716" cy="97" r="5" fill="#ffb454"/>
  <circle cx="732" cy="97" r="5" fill="#7ee7c7"/>
  <text x="820" y="105" font-size="24" fill="#e6e8ec" text-anchor="middle">브라우저</text>
</g>

<!-- floor highlight (one object moving between floors) -->
<rect x="20" y="76" width="920" height="100" rx="10" fill="none" stroke="#7ee7c7" stroke-width="3">
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 0;0 110;0 110;0 220;0 220;0 0;0 0;0 110;0 110;0 220;0 220;0 0;0 0"
    keyTimes="0;0.05;0.07;0.12;0.14;0.19;0.21;0.28;0.30;0.49;0.51;0.79;0.81;1" dur="33.333s" repeatCount="indefinite"/>
</rect>

<!-- letter 1: created at server, drops into HTTP floor -->
<use href="#letter" x="352" y="98" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.36;0.4;1" dur="33.333s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 112;0 112" keyTimes="0;0.28;0.36;1" dur="33.333s" repeatCount="indefinite"/>
</use>

<!-- box + truck group -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 0;0 96;0 96;390 96;390 96;0 0"
    keyTimes="0;0.5;0.56;0.57;0.78;0.98;1" dur="33.333s" repeatCount="indefinite"/>
  <!-- truck parts appear only on the road -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.57;1" dur="33.333s" repeatCount="indefinite"/>
    <rect x="340" y="266" width="122" height="10" fill="#6ea8fe"/>
    <rect x="462" y="236" width="40" height="40" rx="6" fill="#6ea8fe"/>
    <rect x="472" y="244" width="22" height="14" rx="2" fill="#0f1115"/>
    <circle cx="368" cy="282" r="10" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/>
    <circle cx="482" cy="282" r="10" fill="#0f1115" stroke="#e6e8ec" stroke-width="3"/>
  </g>
  <rect x="350" y="210" width="100" height="56" rx="4" fill="#ffb454"/>
  <rect x="360" y="226" width="80" height="32" rx="4" fill="#e6e8ec"/>
  <text x="400" y="250" font-size="24" font-weight="700" fill="#0f1115" text-anchor="middle">HTTP</text>
  <rect x="346" y="204" width="108" height="12" rx="3" fill="#c98a3a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.82;1" dur="33.333s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- letter 2: taken out of the box, shown in browser -->
<use href="#letter" x="0" y="0" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.81;0.83;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="745 306;745 306;770 117;770 117" keyTimes="0;0.82;0.88;1" dur="33.333s" repeatCount="indefinite"/>
</use>

<!-- caption bar -->
<rect x="20" y="420" width="920" height="100" rx="14" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="28" fill="#e6e8ec" text-anchor="middle">
  <text x="480" y="480">웹은 세 층이 겹쳐서 움직여요
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="480" opacity="0">서버의 HTML 문서를 HTTP가 상자로 포장해요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.48;0.51;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="480" opacity="0">상자는 인터넷 길을 달려 브라우저로 가요
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.54;0.78;0.81;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="480" opacity="0" fill="#7ee7c7" font-weight="700">문서는 HTML, 배달은 HTTP, 길은 인터넷
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.81;0.84;0.96;0.98;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
</svg>
