<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 3<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.27;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.27;0.54;0.55;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 3<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.55;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>

  <!-- 제목 = 핵심 결론 (항상 보임) -->
  <text x="480" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">LED가 <tspan fill="#7ee7c7">켜지면 Link up</tspan>, <tspan fill="#ffb454">꺼지면 Link down</tspan></text>

  <!-- 스위치 -->
  <rect x="560" y="180" width="330" height="130" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <text x="770" y="256" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">스위치</text>
  <rect x="558" y="230" width="34" height="40" rx="3" fill="#0f1115" stroke="#6ea8fe" stroke-width="2"/>
  <text x="575" y="160" text-anchor="middle" font-size="24" fill="#9aa3b2">포트</text>
  <line x1="575" y1="168" x2="575" y2="222" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="640" y="298" text-anchor="middle" font-size="24" fill="#9aa3b2">LED</text>

  <!-- LED (2.5초 켜짐, 5.2초 꺼짐) -->
  <g>
    <circle cx="640" cy="250" r="26" fill="#7ee7c7" opacity="0">
      <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.25;0.26;0.52;0.53;1" values="0;0;0.3;0.3;0;0"/>
    </circle>
    <circle cx="640" cy="250" r="14" fill="#3d4b60" stroke="#9aa3b2" stroke-width="2">
      <animate attributeName="fill" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.25;0.26;0.52;0.53;1" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60"/>
    </circle>
  </g>

  <!-- 케이블 + 플러그 (꼬리는 PC 뒤에 숨음) -->
  <g transform="translate(-100,0)">
    <animateTransform attributeName="transform" type="translate" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.52;0.57;1" values="-100,0;-100,0;0,0;0,0;-100,0;-100,0"/>
    <line x1="250" y1="250" x2="542" y2="250" stroke="#6ea8fe" stroke-width="8" stroke-linecap="round"/>
    <rect x="530" y="234" width="30" height="32" rx="4" fill="#6ea8fe"/>
    <rect x="560" y="238" width="26" height="24" rx="2" fill="#e6e8ec"/>
  </g>

  <!-- PC (케이블 꼬리를 덮음) -->
  <rect x="70" y="150" width="200" height="140" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
  <rect x="88" y="168" width="164" height="104" rx="4" fill="#0f1115"/>
  <text x="170" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#e6e8ec">PC</text>
  <rect x="155" y="290" width="30" height="16" fill="#3d4b60"/>
  <rect x="120" y="306" width="100" height="10" rx="4" fill="#3d4b60"/>

  <!-- 상태 라벨: Link down (0~2.5초 깜빡임, 5.2초부터 다시) -->
  <g>
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.26;0.52;0.53;1" values="1;0.3;1;0.3;1;1;0;0;1;1"/>
    <rect x="625" y="328" width="200" height="52" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
    <text x="725" y="364" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb454">Link down</text>
  </g>
  <!-- 상태 라벨: Link up (2.5~5.2초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.25;0.26;0.52;0.53;1" values="0;0;1;1;0;0"/>
    <rect x="625" y="328" width="200" height="52" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="3"/>
    <text x="725" y="364" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee7c7">Link up</text>
  </g>

  <!-- 결론 문구 (8~9.6초) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.77;0.8;0.95;0.99;1" values="0;0;1;1;0;0"/>
    <rect x="150" y="398" width="660" height="54" rx="10" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
    <text x="480" y="434" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8ec">불이 <tspan fill="#7ee7c7">켜짐 = Link up</tspan>  /  <tspan fill="#ffb454">꺼짐 = Link down</tspan></text>
  </g>

  <!-- 자막 바 -->
  <rect x="0" y="470" width="960" height="70" fill="#171a21"/>
  <text x="480" y="514" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="1">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.22;0.25;0.97;1" values="1;1;0;0;1"/>
    케이블이 아직 포트에 안 꽂혀 있어요
  </text>
  <text x="480" y="514" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.25;0.28;0.5;0.53;1" values="0;0;1;1;0;0"/>
    꽂으면 녹색 불이 켜져요 → <tspan fill="#7ee7c7">Link up</tspan>
  </text>
  <text x="480" y="514" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">
    <animate attributeName="opacity" dur="33.333s" repeatCount="indefinite" keyTimes="0;0.53;0.56;0.94;0.97;1" values="0;0;1;1;0;0"/>
    빠지면 불이 꺼져요 → <tspan fill="#ffb454">Link down</tspan>
  </text>
</svg>
