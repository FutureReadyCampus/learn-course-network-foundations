<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<g aria-label="재생 단계"><rect x="40" y="28" width="88" height="40" rx="20" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="1">1 / 4<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.23;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">2 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.52;0.53;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">3 / 4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text><text x="84" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#e6e8ec" opacity="0">4 / 4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" calcMode="discrete" dur="33.333s" repeatCount="indefinite"/></text></g>
<text x="480" y="46" font-size="34" font-weight="700" fill="#e6e8ec" text-anchor="middle">IP 패킷을 프레임에 담기</text>
<text x="480" y="86" font-size="24" fill="#9aa3b2" text-anchor="middle">안쪽 <tspan fill="#7ee7c7" font-weight="700">IP는 끝까지</tspan>, 바깥 <tspan fill="#ffb454" font-weight="700">MAC은 이번 구간</tspan>의 다음 담당자만</text>

<!-- road: nodes and segments -->
<g font-size="24" text-anchor="middle">
<line x1="230" y1="403" x2="400" y2="403" stroke="#3d4b60" stroke-width="4">
<animate attributeName="stroke" values="#3d4b60;#3d4b60;#6ea8fe;#6ea8fe;#3d4b60;#3d4b60" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="33.333s" repeatCount="indefinite"/>
</line>
<line x1="560" y1="403" x2="690" y2="403" stroke="#3d4b60" stroke-width="4">
<animate attributeName="stroke" values="#3d4b60;#3d4b60;#ffb454;#ffb454;#3d4b60;#3d4b60" keyTimes="0;0.87;0.89;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</line>
<text x="315" y="391" fill="#9aa3b2">1구간
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#6ea8fe;#6ea8fe;#9aa3b2;#9aa3b2" keyTimes="0;0.5;0.52;0.78;0.8;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="625" y="391" fill="#9aa3b2">2구간
<animate attributeName="fill" values="#9aa3b2;#9aa3b2;#ffb454;#ffb454;#9aa3b2;#9aa3b2" keyTimes="0;0.87;0.89;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<rect x="110" y="375" width="120" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="170" y="412" fill="#e6e8ec" font-weight="700">PC</text>
<rect x="400" y="375" width="160" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="412" fill="#e6e8ec" font-weight="700">게이트웨이</text>
<rect x="690" y="375" width="220" height="56" rx="10" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="800" y="412" fill="#e6e8ec" font-weight="700">인터넷 <tspan fill="#7ee7c7">3.3.3.3</tspan></text>
</g>

<!-- frame 1: PC -> gateway -->
<g opacity="0" font-size="24">
<animateTransform attributeName="transform" type="translate" values="20 112;20 112;330 112;330 112;330 100;20 112" keyTimes="0;0.5;0.75;0.8;0.84;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.27;0.8;0.84;1" dur="33.333s" repeatCount="indefinite"/>
<rect width="300" height="230" rx="12" fill="#171a21" stroke="#6ea8fe" stroke-width="3"/>
<text x="16" y="32" fill="#6ea8fe" font-weight="700">프레임 (바깥 상자)</text>
<text x="16" y="64" fill="#e6e8ec" opacity="0">출발 MAC: PC
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.34;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="16" y="96" fill="#e6e8ec" opacity="0">도착 MAC: <tspan fill="#6ea8fe" font-weight="700">게이트웨이</tspan>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.42;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>

<!-- frame 2: gateway -> internet -->
<g opacity="0" font-size="24">
<animateTransform attributeName="transform" type="translate" values="330 112;330 112;620 112;620 112" keyTimes="0;0.87;0.94;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.87;0.94;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<rect width="300" height="230" rx="12" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
<text x="16" y="32" fill="#ffb454" font-weight="700">새 프레임 (2구간)</text>
<text x="16" y="64" fill="#e6e8ec">출발 MAC: 게이트웨이</text>
<text x="16" y="96" fill="#e6e8ec">도착 MAC: <tspan fill="#ffb454" font-weight="700">다음 라우터</tspan></text>
</g>

<!-- IP packet (inner box, never changes) -->
<g font-size="24">
<animateTransform attributeName="transform" type="translate" values="40 140;40 140;40 224;40 224;350 224;350 224;640 224;640 224;40 140;40 140" keyTimes="0;0.2;0.28;0.5;0.75;0.87;0.94;0.97;0.975;1" dur="33.333s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.95;0.97;0.98;1" dur="33.333s" repeatCount="indefinite"/>
<rect width="260" height="108" rx="10" fill="#0f1115" stroke="#7ee7c7" stroke-width="3"/>
<rect x="6" y="70" width="160" height="32" rx="6" fill="none" stroke="#7ee7c7" stroke-width="2" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</rect>
<text x="14" y="30" fill="#7ee7c7" font-weight="700">IP 패킷</text>
<text x="14" y="62" fill="#e6e8ec">출발 192.168.0.100</text>
<text x="14" y="94" fill="#e6e8ec">도착 <tspan fill="#7ee7c7" font-weight="700">3.3.3.3</tspan></text>
</g>

<!-- caption bar -->
<rect x="30" y="460" width="900" height="64" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" fill="#e6e8ec" text-anchor="middle">
<text x="480" y="501">안쪽 상자 IP 패킷엔 최종 목적지 <tspan fill="#7ee7c7" font-weight="700">3.3.3.3</tspan>을 적어요
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.21;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="501" opacity="0">바깥 프레임엔 이번에 건넬 곳, <tspan fill="#6ea8fe" font-weight="700">게이트웨이 MAC</tspan>을 적어요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.48;0.51;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="501" opacity="0">게이트웨이로 가는 동안 안쪽 <tspan fill="#7ee7c7" font-weight="700">3.3.3.3</tspan>은 그대로예요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.54;0.75;0.78;1" dur="33.333s" repeatCount="indefinite"/>
</text>
<text x="480" y="501" opacity="0" font-weight="700"><tspan fill="#7ee7c7">IP는 끝까지 그대로</tspan>, <tspan fill="#ffb454">바깥 MAC은 구간마다</tspan> 새로 적어요
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/>
</text>
</g>
</svg>
