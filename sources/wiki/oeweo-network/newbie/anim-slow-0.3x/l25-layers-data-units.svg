<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<text x="480" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">층을 지날 때마다 이름이 바뀌는 데이터</text>

<!-- layer lines -->
<g stroke="#3d4b60" stroke-width="2">
  <line x1="24" y1="170" x2="940" y2="170"/>
  <line x1="24" y1="260" x2="940" y2="260"/>
  <line x1="24" y1="350" x2="940" y2="350"/>
</g>

<!-- row labels -->
<g font-size="24">
  <g>
    <text x="24" y="132" font-weight="700" fill="#6ea8fe">보낼 데이터
      <animate attributeName="fill" values="#6ea8fe;#6ea8fe;#ffb454;#6ea8fe;#6ea8fe" keyTimes="0;0.90;0.92;0.94;1" dur="33.333s" repeatCount="indefinite"/></text>
  </g>
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.28;0.31;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <text x="24" y="200" font-weight="700" fill="#7ee7c7">L4 · 포트 번호
      <animate attributeName="fill" values="#7ee7c7;#7ee7c7;#ffb454;#7ee7c7;#7ee7c7" keyTimes="0;0.86;0.88;0.90;1" dur="33.333s" repeatCount="indefinite"/></text>
    <text x="24" y="232" fill="#e6e8ec">3000 → 80</text>
  </g>
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.54;0.57;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <text x="24" y="290" font-weight="700" fill="#ffb454">L3 · IP 주소
      <animate attributeName="fill" values="#ffb454;#ffb454;#7ee7c7;#ffb454;#ffb454" keyTimes="0;0.82;0.84;0.86;1" dur="33.333s" repeatCount="indefinite"/></text>
    <text x="24" y="322" fill="#e6e8ec">192.168.0.10 → 192.168.0.20</text>
  </g>
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.69;0.72;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <text x="24" y="380" font-weight="700" fill="#e6e8ec">L2 · MAC 주소
      <animate attributeName="fill" values="#e6e8ec;#e6e8ec;#ffb454;#e6e8ec;#e6e8ec" keyTimes="0;0.78;0.80;0.82;1" dur="33.333s" repeatCount="indefinite"/></text>
    <text x="24" y="412" fill="#9aa3b2">aa:aa → bb:bb</text>
  </g>
</g>

<!-- the moving parcel: blocks + name tag -->
<g font-size="24" font-weight="700" text-anchor="middle">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 92;0 92;0 182;0 182;0 272;0 272;0 0;0 0" keyTimes="0;0.2;0.28;0.5;0.55;0.64;0.70;0.95;0.99;1" dur="33.333s" repeatCount="indefinite"/>
  <!-- data -->
  <rect x="640" y="95" width="110" height="56" rx="8" fill="#1f2a3d" stroke="#6ea8fe" stroke-width="2"/>
  <text x="695" y="132" fill="#e6e8ec">데이터</text>
  <rect x="640" y="95" width="110" height="56" rx="8" fill="#ffb454" opacity="0">
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.90;0.92;0.94;1" dur="33.333s" repeatCount="indefinite"/></rect>
  <!-- port -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.31;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <rect x="546" y="95" width="90" height="56" rx="8" fill="#173a33" stroke="#7ee7c7" stroke-width="2"/>
    <text x="591" y="132" fill="#7ee7c7">포트</text>
    <rect x="546" y="95" width="90" height="56" rx="8" fill="#ffb454" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.86;0.88;0.90;1" dur="33.333s" repeatCount="indefinite"/></rect>
  </g>
  <!-- ip -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.58;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <rect x="452" y="95" width="90" height="56" rx="8" fill="#3a2f1a" stroke="#ffb454" stroke-width="2"/>
    <text x="497" y="132" fill="#ffb454">IP</text>
    <rect x="452" y="95" width="90" height="56" rx="8" fill="#7ee7c7" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.82;0.84;0.86;1" dur="33.333s" repeatCount="indefinite"/></rect>
  </g>
  <!-- mac -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69;0.73;0.95;0.98;1" dur="33.333s" repeatCount="indefinite"/>
    <rect x="358" y="95" width="90" height="56" rx="8" fill="#262b36" stroke="#e6e8ec" stroke-width="2"/>
    <text x="403" y="132" fill="#e6e8ec">MAC</text>
    <rect x="358" y="95" width="90" height="56" rx="8" fill="#ffb454" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.78;0.80;0.82;1" dur="33.333s" repeatCount="indefinite"/></rect>
  </g>
  <!-- name tag -->
  <path d="M770 123 L784 95 H930 V151 H784 Z" fill="#171a21" stroke="#7ee7c7" stroke-width="2"/>
  <text x="857" y="132" fill="#9aa3b2" opacity="1">데이터
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.30;0.32;0.97;0.99;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="857" y="132" fill="#7ee7c7" opacity="0">Segment
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.32;0.56;0.58;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="857" y="132" fill="#ffb454" opacity="0">Packet
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.71;0.73;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="857" y="132" fill="#e6e8ec" opacity="0">Frame
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.71;0.73;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>

<!-- caption bar -->
<rect x="20" y="452" width="920" height="74" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<g font-size="26" text-anchor="middle" fill="#e6e8ec">
  <text x="480" y="498" opacity="1">보낼 데이터가 아래 층(L4→L3→L2)으로 내려갑니다
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.97;0.99;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="498" opacity="0">L4에서 포트 번호로 감싸면 이름이 Segment
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.48;0.5;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="498" opacity="0">L3에서 IP로 감싸면 Packet, L2에서 MAC으로 감싸면 Frame
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.76;0.78;1" dur="33.333s" repeatCount="indefinite"/></text>
  <text x="480" y="498" opacity="0" fill="#7ee7c7" font-weight="700">같은 데이터라도 감싼 층에 따라 Segment·Packet·Frame
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.80;0.95;0.97;1" dur="33.333s" repeatCount="indefinite"/></text>
</g>
</svg>
