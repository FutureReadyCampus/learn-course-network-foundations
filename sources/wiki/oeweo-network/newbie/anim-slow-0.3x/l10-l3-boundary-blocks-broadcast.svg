<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif">
<rect width="960" height="540" fill="#0f1115"/>
<defs><clipPath id="lz"><rect x="30" y="70" width="392" height="370"/></clipPath></defs>
<text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">L3 경계는 방송이 넘어가지 못하게 막는다</text>

<!-- 두 구역 -->
<rect x="30" y="70" width="380" height="370" rx="14" fill="#171a21" fill-opacity="0.5" stroke="#7ee7c7" stroke-width="5"><animate attributeName="stroke" values="#7ee7c7;#3d4b60;#3d4b60;#7ee7c7;#7ee7c7" keyTimes="0;0.06;0.78;0.82;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="5;2;2;5;5" keyTimes="0;0.06;0.78;0.82;1" dur="33.333s" repeatCount="indefinite"/></rect>
<rect x="550" y="70" width="380" height="370" rx="14" fill="#171a21" fill-opacity="0.5" stroke="#6ea8fe" stroke-width="5"><animate attributeName="stroke" values="#6ea8fe;#3d4b60;#3d4b60;#6ea8fe;#6ea8fe" keyTimes="0;0.06;0.78;0.82;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="5;2;2;5;5" keyTimes="0;0.06;0.78;0.82;1" dur="33.333s" repeatCount="indefinite"/></rect>
<text x="50" y="106" font-size="24" font-weight="700" fill="#7ee7c7">192.168.1.x</text>
<text x="570" y="106" font-size="24" font-weight="700" fill="#6ea8fe">192.168.2.x</text>

<!-- 경계선 + 경계 장비 -->
<line x1="480" y1="70" x2="480" y2="440" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="422" y="222" width="116" height="92" rx="10" fill="#171a21" stroke="#ffb454" stroke-width="4"/>
<text x="480" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454">L3 경계</text>
<text x="480" y="294" text-anchor="middle" font-size="24" fill="#9aa3b2">라우터</text>

<!-- 방송 파동 (왼쪽 구역 안에서만 보임) -->
<g clip-path="url(#lz)" fill="none" stroke="#ffb454">
<circle cx="115" cy="268" r="0" stroke-width="6" opacity="0"><animate attributeName="r" values="0;0;310;310;0" keyTimes="0;0.2;0.5;0.96;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0.6;0;0" keyTimes="0;0.19;0.21;0.5;0.8;0.86;1" dur="33.333s" repeatCount="indefinite"/></circle>
<circle cx="115" cy="268" r="0" stroke-width="3" opacity="0"><animate attributeName="r" values="0;0;310;310;0" keyTimes="0;0.27;0.53;0.96;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.7;0.7;0.4;0;0" keyTimes="0;0.26;0.28;0.53;0.8;0.86;1" dur="33.333s" repeatCount="indefinite"/></circle>
</g>

<!-- PC (왼쪽) -->
<rect x="35" y="230" width="160" height="76" rx="8" fill="#171a21" stroke="#ffb454" stroke-width="3"/>
<text x="115" y="262" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 1</text>
<text x="115" y="292" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.1.1</text>
<rect x="230" y="132" width="160" height="76" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.4;0.42;0.94;0.98;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="fill" values="#171a21;#171a21;#173a33;#173a33;#171a21;#171a21" keyTimes="0;0.4;0.42;0.94;0.98;1" dur="33.333s" repeatCount="indefinite"/></rect>
<text x="310" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 2</text>
<text x="310" y="194" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.1.2</text>
<rect x="230" y="328" width="160" height="76" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"><animate attributeName="stroke" values="#3d4b60;#3d4b60;#7ee7c7;#7ee7c7;#3d4b60;#3d4b60" keyTimes="0;0.4;0.42;0.94;0.98;1" dur="33.333s" repeatCount="indefinite"/><animate attributeName="fill" values="#171a21;#171a21;#173a33;#173a33;#171a21;#171a21" keyTimes="0;0.4;0.42;0.94;0.98;1" dur="33.333s" repeatCount="indefinite"/></rect>
<text x="310" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 3</text>
<text x="310" y="390" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.1.3</text>
<text x="115" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#ffb454" opacity="0">방송!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.21;0.45;0.5;1" dur="33.333s" repeatCount="indefinite"/></text>

<!-- PC (오른쪽) -->
<rect x="570" y="132" width="160" height="76" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="650" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 4</text>
<text x="650" y="194" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.2.4</text>
<rect x="765" y="230" width="160" height="76" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="845" y="262" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 5</text>
<text x="845" y="292" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.2.5</text>
<rect x="570" y="328" width="160" height="76" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="3"/>
<text x="650" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#e6e8ec">PC 6</text>
<text x="650" y="390" text-anchor="middle" font-size="24" fill="#9aa3b2">192.168.2.6</text>
<line x1="650" y1="208" x2="650" y2="328" stroke="#3d4b60" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="650" cy="216" r="8" fill="#6ea8fe"><animate attributeName="cy" values="216;320;216" keyTimes="0;0.5;1" dur="33.333s" repeatCount="indefinite"/></circle>
<text x="845" y="206" text-anchor="middle" font-size="24" font-weight="700" fill="#7ee7c7" opacity="0">영향 없음<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.55;0.92;0.96;1" dur="33.333s" repeatCount="indefinite"/></text>

<!-- 막힘 X -->
<g opacity="0" stroke="#ffb454" stroke-width="7" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.93;0.97;1" dur="33.333s" repeatCount="indefinite"/>
<circle cx="398" cy="268" r="22" fill="#0f1115" stroke-width="3"/>
<line x1="388" y1="258" x2="408" y2="278"/><line x1="408" y1="258" x2="388" y2="278"/>
</g>

<!-- 자막 바 -->
<rect x="20" y="456" width="920" height="70" rx="12" fill="#171a21" stroke="#3d4b60" stroke-width="2"/>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">가운데 L3 경계가 네트워크를 두 구역으로 나눕니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.07;0.18;0.21;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">PC 1의 방송이 왼쪽 구역 PC들에게 퍼집니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.47;0.5;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="600" fill="#e6e8ec" opacity="0">방송은 경계에서 멈춰 오른쪽 통신은 그대로입니다<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.75;0.78;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="500" text-anchor="middle" font-size="26" font-weight="700" fill="#7ee7c7" opacity="1">방송은 구역 안에서만 퍼집니다<animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.04;0.78;0.81;1" dur="33.333s" repeatCount="indefinite"/></text>
</svg>
