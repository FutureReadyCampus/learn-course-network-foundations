<text x="480" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#e6e8ec">캡슐화: 내려갈 때마다 한 겹씩 감싼다</text>
<rect x="20" y="90" width="150" height="54" rx="8" fill="#171a21" stroke="#3d4b60" stroke-width="2"/><text x="95" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#9aa3b2">소켓</text>
