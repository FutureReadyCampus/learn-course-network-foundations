<text x="480" y="507" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="1">IPv4 주소는 켜짐·꺼짐 스위치 32개가 한 줄로 선 것<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.23;0.25;0.98;1;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">8개씩 끊으면 네 칸, 한 칸은 0부터 255까지<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.5;0.52;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">칸마다 숫자 하나씩 읽고, 사이에 점을 찍어요<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.8;0.82;1" dur="33.333s" repeatCount="indefinite"/></text>
<text x="480" y="507" text-anchor="middle" font-size="26" fill="#e6e8ec" opacity="0">결론: IPv4 = 0~255 숫자 네 개를 점으로 이은 것<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.98;1;1" dur="33.333s" repeatCount="indefinite"/></text>
