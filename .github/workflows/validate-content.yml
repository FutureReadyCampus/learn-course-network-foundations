name: Validate course content

on:
  pull_request:
    branches: [main, stage]
    paths:
      - 'course.yaml'
      - 'units/**'
      - 'sources/**'
      - 'scripts/build_course.py'
      - 'scripts/build_pages.py'
      - 'scripts/audit_svg_steps.py'
      - 'requirements.txt'
      - '.github/workflows/validate-content.yml'
  push:
    branches: [main]
    paths:
      - 'course.yaml'
      - 'units/**'
      - 'sources/**'
      - 'scripts/build_course.py'
      - 'scripts/build_pages.py'
      - 'scripts/audit_svg_steps.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install content build dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source structure, quiz placement, and referenced assets
        run: |
          python scripts/build_course.py --output "$RUNNER_TEMP/course.json" \
            --source-revision "$GITHUB_SHA" --source-label "pull request"
          python scripts/audit_svg_steps.py
      - name: Build static preview
        run: |
          python scripts/build_pages.py --output "$RUNNER_TEMP/network-reader" \
            --source-revision "$GITHUB_SHA" --source-label "pull request preview"
      - name: Summarize preview artifact
        run: |
          echo "Static reader built from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'The validated preview is attached as the network-reader-preview artifact.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: network-reader-preview
          path: ${{ runner.temp }}/network-reader/
          if-no-files-found: error
          retention-days: 7
      - name: Notify Learn after source main changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.LEARN_SYNC_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo 'LEARN_SYNC_DISPATCH_TOKEN is not configured; scheduled Learn sync remains available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/FutureReadyCampus/learn/dispatches \
            -d "{\"event_type\":\"network-content-main-updated\",\"client_payload\":{\"source_sha\":\"$GITHUB_SHA\"}}"
