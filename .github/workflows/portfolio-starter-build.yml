name: Portfolio starter builds on GitHub Pages

# Builds portfolio-starter/ with the same Jekyll setup GitHub Pages uses for "Deploy from a branch",
# so the files learners copy from the course keep working. Nothing is published.
on:
  pull_request:
    paths:
      - portfolio-starter/**
      - .github/workflows/portfolio-starter-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with the GitHub Pages Jekyll action
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./portfolio-starter
          destination: ./_site

      - name: Check the built site
        run: |
          set -e
          test -f _site/index.html
          grep -q "네트워크 실습 노트" _site/index.html
          test -f _site/about/index.html
          python3 - <<'PYTHON'
          from pathlib import Path
          page = Path("_site/index.html").read_text()
          assert "네트워크 보안을 공부하는 민지입니다" in page
          assert "<h2>대표 글</h2>" not in page and "<h2>전체 글</h2>" not in page
          assert not list(Path("_site").rglob("hello.html"))
          PYTHON
          # files meant to stay out of the site
          test ! -e _site/README.md
          test ! -e _site/check_publish.py
          test ! -e _site/_templates
          echo "starter site OK"

      - name: Add a legacy post and a featured post
        run: |
          set -e
          cp -R portfolio-starter test-site
          mkdir -p test-site/_posts
          printf -- '---\nlayout: post\ntitle: "Unit 3 test post"\ndate: 2026-01-02\nmodule: 4\nunit: 3\n---\n\nbody\n' > test-site/_posts/2026-01-02-unit3.md
          cat > test-site/_posts/2026-01-03-verified.md <<'POST'
          ---
          layout: post
          title: "권한 회수 확인"
          date: 2026-01-03
          featured: true
          summary: "회수 전후의 출력을 비교했다."
          ---
          [확인한 코드]({{ "/access_control/rbac.py" | relative_url }})
          POST
          # a module work folder sits in the same repo: its code is copied as-is
          mkdir -p test-site/access_control/config
          printf 'print("hi")\n' > test-site/access_control/rbac.py
          printf '{"a": 1}\n' > test-site/access_control/config/users.json
          printf -- '- 답: {%% raw %%} {{ x }}\n' > test-site/access_control/report_u1.md

      - name: Build the copy
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./test-site
          destination: ./_site_test

      - name: Check featured, all posts and project-relative evidence links
        run: |
          set -e
          python3 - <<'PYTHON'
          from pathlib import Path
          site = Path("_site_test")
          page = (site / "index.html").read_text()
          featured, all_posts = page.split("<h2>대표 글</h2>")[1].split("<h2>전체 글</h2>")
          new = "/network-study-notes/2026/01/03/verified.html"
          old = "/network-study-notes/2026/01/02/unit3.html"
          assert new in featured and old not in featured
          assert "회수 전후의 출력을 비교했다." in featured
          assert new in all_posts and old in all_posts
          assert (site / "2026/01/02/unit3.html").is_file()
          assert "/network-study-notes/access_control/rbac.py" in (site / "2026/01/03/verified.html").read_text()
          PYTHON
          test -f _site_test/access_control/rbac.py
          test -f _site_test/access_control/config/users.json
          # module-folder .md (reports) stay out of the site, so Liquid-like text in them cannot break the build
          test ! -e _site_test/access_control/report_u1.md
          test ! -e _site_test/access_control/report_u1.html
          echo "portfolio links OK"
