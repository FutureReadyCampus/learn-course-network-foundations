name: Publish stage reader

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-stage
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build static reader
        run: |
          python -m pip install -r requirements.txt
          python scripts/audit_svg_steps.py
          python scripts/build_pages.py \
            --baseurl "/learn-course-network-foundations" \
            --source-revision "$GITHUB_SHA" \
            --source-label "stage · $GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "Expected one Pages artifact, found $count" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
